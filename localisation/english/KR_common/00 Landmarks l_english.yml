l_english:
## Europe
 # Denmark
landmark_christiansborg_palace: "Палац Крістіансборґ"
 landmark_christiansborg_palace_plural: "$landmark_christiansborg_palace$"
 landmark_christiansborg_palace_desc: "§LПалац Крістіансборґ — це монументальний необароковий палац на острівці Слотсгольмен у самому серці Копенгагена. Відбудований після великої пожежі 1884 року й завершений лише нещодавно, палац нині слугує осідком данської держави: тут розміщуються Фолькетинг, Верховний суд та офіси прем'єр-міністра. Будучи давнім символом королівської влади й урядування в Данії, Крістіансборґ уособлює тяглість данської монархії та конституційних традицій.§!"

 # France
 landmark_arc_de_triomphe: "Тріумфальна арка"
 landmark_arc_de_triomphe_plural: "$landmark_arc_de_triomphe$"
 landmark_arc_de_triomphe_desc: "§LТріумфальна арка — це величний тріумфальний монумент, що височіє на західному кінці Єлисейських Полів у Парижі. Зведена за наказом Наполеона для вшанування перемог і воїнів Франції, вона є свідченням військової слави та самопожертви нації. Під її склепінням спочиває Могила невідомого солдата — урочисте нагадування про Велику війну та її незгладимий слід в історії Французької Республіки. Тріумфальна арка залишається могутнім символом французької єдності та національної гордості.§!"

 landmark_notre_dame: "Собор Паризької Богоматері"
 landmark_notre_dame_plural: "$landmark_notre_dame$"
 landmark_notre_dame_desc: "§LСобор Паризької Богоматері — готичний собор, що височіє на острові Сіте в історичному серці Парижа. Споруджуваний упродовж століть, він був свідком коронацій, революцій та духовного життя Франції. Відомий своїми високими вежами, велетенськими вікнами-розами й дзвінкими дзвонами, собор пройшов крізь буремні десятиліття як свідок віри та історії Франції.§!"

 # Germany
 landmark_brandenburg_gate: "Бранденбурзькі ворота"
 landmark_brandenburg_gate_plural: "$landmark_brandenburg_gate$"
 landmark_brandenburg_gate_desc: "§LБранденбурзькі ворота — велична неокласична пам'ятка в самому серці Берліна. Зведені наприкінці XVIII століття як символ миру, вони згодом стали головною емблемою прусської та німецької держави. За правління кайзера ворота споглядають паради, урочистості та суспільне життя в столиці сучасної Німеччини, втілюючи як імперські традиції, так і єдність німецької нації.§!"

 landmark_cologne_cathedral: "Кельнський собор"
 landmark_cologne_cathedral_plural: "$landmark_cologne_cathedral$"
 landmark_cologne_cathedral_desc: "§LКельнський собор — величний готичний шедевр, що височіє над прирейнським містом Кельн. Закладений у добу Середньовіччя й завершений у XIX столітті, він своїми двома шпилями та неосяжним простором інтер'єру відображає століття німецької майстерності та побожності. Давнє місце паломництва й національної гордості, собор слугує символом віри, наполегливості та незгасної культурної спадщини Німеччини.§!"

 # Italy
 landmark_leaning_tower_of_pisa: "Пізанська вежа"
 landmark_leaning_tower_of_pisa_plural: "$landmark_leaning_tower_of_pisa$"
 landmark_leaning_tower_of_pisa_desc: "§LПізанська вежа — своєрідна романська дзвіниця, що височіє над П'яцца-дей-Міраколі. Зведена в епоху Середньовіччя, вона через свій ненавмисний нахил стала однією з найупізнаваніших пам'яток Італії. Стоячи поруч із собором, для якого її й будували, вежа є свідченням італійської винахідливості, наполегливості та неперехідної спадщини історичних міст-держав півострова.§!"

 # Russia
 landmark_saint_basils_cathedral: "Храм Василія Блаженного"
 landmark_saint_basils_cathedral_plural: "$landmark_saint_basils_cathedral$"
 landmark_saint_basils_cathedral_desc: "§LХрам Василія Блаженного височіє на Красній площі в Москві, вирізняючись яскравими банями-цибулинами та візерунковою цегляною кладкою поруч із Кремлем. Зведений за наказом Івана IV на честь підкорення Казані, нині він височіє під пильним оком російської влади як реліквія царських часів, що продовжує свідчити життя містян. У його приділах і досі лунають відлуння століть богослужінь, роблячи цю будівлю свідченням російської історії та духовної традиції.§!"

 landmark_winter_palace: "Зимовий палац"
 landmark_winter_palace_plural: "$landmark_winter_palace$"
 landmark_winter_palace_desc: "§LЗимовий палац — величний рококовий палац, що до 1917 року слугував офіційною резиденцією дому Романових. У самому серці Петрограда палац став свідком багатьох ключових подій російських революцій. В одній його частині розміщено музей Ермітаж, тоді як решта є розлогим адміністративним комплексом. Зимовий палац залишається символом гордості для всієї Росії.§!"

 landmark_vozhd_liberator: "Вождь-визволитель"
 landmark_vozhd_liberator_plural: "$landmark_vozhd_liberator$"
 landmark_vozhd_liberator_desc: "§LМонумент «Вождь-визволитель» височіє на березі річки Харків і є 22-метровою бронзовою постаттю Бориса Савінкова на 29-метровому неокласичному постаменті. Вождь у довгому пальті суворо дивиться на захід, постаючи героїчною постаттю над рідним містом. Усередині постаменту палає вічний вогонь на честь невідомих солдатів, які віддали життя у Великій Вітчизняній війні.§!"

## Americas
 # United States
 landmark_white_house: "Білий дім"
 landmark_white_house_plural: "$landmark_white_house$"
 landmark_white_house_desc: "§LБілий дім — це неокласичний маєток у центрі Вашингтона, округ Колумбія, що слугує резиденцією та робочим місцем президента Сполучених Штатів. Зведений наприкінці XVIII століття, він став свідком становлення нації, політичних криз та правління багатьох президентів. Відомий своїми портиками, парадними залами та незмінним фасадом, Білий дім залишається головним осідком американської виконавчої влади й символом національної спадкоємності.§!"

 landmark_capitol: "Капітолій"
 landmark_capitol_plural: "$landmark_capitol$"
 landmark_capitol_desc: "§LКапітолій Сполучених Штатів велично височіє на Капітолійському пагорбі у Вашингтоні, округ Колумбія, слугуючи місцем засідань Конгресу країни. Закладений наприкінці XVIII століття й розширений у наступні епохи, він став ареною законодавчих дебатів та політичних зрушень. Його купол, сесійні зали та величні сходи роблять його осередком політичного життя й конституційного ладу Сполучених Штатів.§!"

 landmark_washington_monument: "Монумент Вашингтона"
 landmark_washington_monument_plural: "$landmark_washington_monument$"
 landmark_washington_monument_desc: "§LМонумент Вашингтона — це височезний обеліск на Національній алеї у Вашингтоні, округ Колумбія, споруджений на честь Джорджа Вашингтона, першого президента країни. Завершений у 1888 році після десятиліть вимушених перерв у будівництві, він споглядав зростання столиці та громадянське життя республіки. Його вражаюча висота та величний вигляд роблять обеліск вічним меморіалом американського лідерства та національної пам'яті.§!"

 landmark_pentagon: "Пентагон"
 landmark_pentagon_plural: "$landmark_pentagon$"
 landmark_pentagon_desc: "§LПентагон — це велетенська п'ятикутна штаб-квартира Військового міністерства США на околиці Вашингтона, округ Колумбія. Спроєктована для централізації військового управління та об'єднання оборонних операцій нації, споруда втілює сучасну інженерну думку й організаційну міць американських збройних сил. Вона слугує свідченням оборонної готовності країни та її національної рішучості.§!"

 landmark_empire_state_building: "Емпайр-Стейт-Білдінг"
 landmark_empire_state_building_plural: "$landmark_empire_state_building$"
 landmark_empire_state_building_desc: "§LЕмпайр-Стейт-Білдінг височіє над Мангеттеном як величний символ амбіцій Нью-Йорка. Завершений у 1931 році, він є найвищою рукотворною спорудою у світі. Його фасад у стилі ар-деко та шпиль нині визначають краєвид міста, постаючи монументом американської промисловості, підприємництва та стрімкого зростання сучасного мегаполіса.§!"

 landmark_boulder_dam: "Гребля Боулдер"
 landmark_boulder_dam_plural: "$landmark_boulder_dam$"
 landmark_boulder_dam_desc: "§LГребля Боулдер перекриває річку Колорадо на межі штатів Аризона та Невада, будучи колосальною бетонною спорудою, завершеною на початку 1930-х років. Зведена для стримування повеней, забезпечення зрошення та виробництва електроенергії, вона змінила прилеглий край. Її масштаби та інженерна досконалість перетворили навколишній регіон, продемонструвавши промисловий потенціал нації та її здатність приборкувати природне середовище.§!"

 landmark_golden_gate_bridge: "Міст «Золота Брама»"
 landmark_golden_gate_bridge_plural: "$landmark_golden_gate_bridge$"
 landmark_golden_gate_bridge_desc: "§LМіст «Золота Брама» пролягає над входом до затоки Сан-Франциско — сміливий висячий міст, що сполучає місто з округом Марін. Його пілони та вигнуті троси утворюють одну з найдовших і найдивовижніших переправ у світі. Міст є свідченням американської інженерної майстерності, амбіцій та досконалості сучасної інфраструктури.§!"

 landmark_hollywood_sign: "Знак Голлівудленду"
 landmark_hollywood_sign_plural: "$landmark_hollywood_sign$"
 landmark_hollywood_sign_desc: "§LЗнак Голлівудленду височіє на пагорбах над Лос-Анджелесом, а його великі білі літери рекламують житлову забудову та позначають новий район, що розвивається. Встановлений у 1923 році, він став помітною рисою міського краєвиду. Видимий звідусіль навколо, знак став тісно асоціюватися з кіноіндустрією та стрімким розростанням Лос-Анджелеса.§!"

 # Mexico
 landmark_chichen_itza: "Чичен-Іца"
 landmark_chichen_itza_plural: "$landmark_chichen_itza$"
 landmark_chichen_itza_desc: "§LЧичен-Іца височіє на півострові Юкатан як руїни величного міста мая; його піраміди, храми та майданчики для гри в м'яч відображають століття доколумбової цивілізації. Останніми роками американські археологи та науковці доклали значних зусиль для досліджень і збереження пам'ятки, привернувши до неї широку увагу. Ці руїни свідчать як про винахідливість цивілізації мая, так і про дедалі вагомішу роль Сполучених Штатів у вивченні та збереженні спадщини стародавньої Америки.§!"

 # Chile
 landmark_moai: "Моаї"
 landmark_moai_plural: "$landmark_moai$"
 landmark_moai_desc: "§LСтатуї моаї острова Пасхи височіють уздовж узбережжя та хребтів острова; їхні масивні кам'яні фігури були витесані народом рапануї багато століть тому. Перебуваючи під управлінням Чилі з кінця XIX століття, ці кам'яні велетні приваблюють як науковців, так і мандрівників. Вони залишаються мовчазними свідками винахідливості й культури корінних жителів острова, позначаючи цей віддалений куточок Тихого океану, здавна сформований людськими руками.§!"

 ## Asia
 # Burma
 landmark_shwedagon_pagoda: "Пагода Шведагон"
 landmark_shwedagon_pagoda_plural: "$landmark_shwedagon_pagoda$"
 landmark_shwedagon_pagoda_desc: "§LПагода Шведагон височіє на схилах пагорба Сінґуттара в Янгоні, Бірма, і є однією з найсвятіших буддійських святинь країни. Її золотий шпиль та старовинна архітектура відображають століття побожності та культурної спадщини. Пагода продовжує приваблювати паломників і відвідувачів з усієї Азії, символізуючи незмінне духовне значення буддійських традицій Бірми.§!"

 # Japan
 landmark_himeji_castle: "Замок Хімедзі"
 landmark_himeji_castle_plural: "$landmark_himeji_castle$"
 landmark_himeji_castle_desc: "§LЗамок Хімедзі височіє над містом Хімедзі та є однією з найкраще збережених феодальних твердинь Японії. Завершений на початку XVII століття, він вирізняється побіленими стінами, багатоярусними укріпленнями й високим донжоном, що є взірцем військової архітектури доби Токуґава. Переживши громадянські війни, реставрацію та модернізацію, замок і досі уособлює воїнські традиції та імперське минуле Японії.§!"

 landmark_okayama_castle: "Замок Окаяма"
 landmark_okayama_castle_plural: "$landmark_okayama_castle$"
 landmark_okayama_castle_desc: "§LЗамок Окаяма стоїть на березі річки Асахі; його темне облицювання та величний донжон вирізняють його з-поміж інших японських твердинь. Зведений наприкінці XVI століття, він слугував регіональним центром влади в періоди Сенґоку та раннього Токуґава. Сьогодні ця споруда нагадує про могутність місцевих уділів і спадщину стану самураїв.§!"

 # Siam
 landmark_wat_arun: "Ват Арун"
 landmark_wat_arun_plural: "$landmark_wat_arun$"
 landmark_wat_arun_desc: "§LВат Арун височіє на західному березі річки Чао-Прая в Бангкоку і є однією з найупізнаваніших релігійних святинь Сіаму. У центрі храмового комплексу здіймається величний пранг, у якому помітний сильний кхмерський вплив та давні буддійські традиції. Тісно пов'язаний із династією Чакрі та столицею, Ват Арун і досі уособлює міцний зв'язок між вірою, монархією та сіамською державою.§!"

 ## Middle East
 # Arabia
 landmark_kaaba: "Кааба"
 landmark_kaaba_plural: "$landmark_kaaba$"
 landmark_kaaba_desc: "§LУ центрі Заповідної мечеті в Мецці височіє Кааба — найсвятіше місце в ісламі. Її вкрита чорним покривалом споруда впродовж століть визначає напрямок мусульманської молитви та паломництва. Перебудована й підтримувана багатьма поколіннями, Кааба продовжує формувати духовне життя ісламського світу та утверджувати статус Мекки як священного міста.§!"

 # Egypt
 landmark_pyramids_of_giza: "Піраміди Гізи"
 landmark_pyramids_of_giza_plural: "$landmark_pyramids_of_giza$"
 landmark_pyramids_of_giza_desc: "§LНа пустельному плато на захід від Каїра над краєвидом височіють піраміди Гізи — монументальні гробниці стародавніх фараонів Єгипту. Зведені за часів Стародавнього царства, вони своїми грандіозними масштабами та винятковою точністю виконання свідчать про організованість і могутність ранньої єгипетської цивілізації. Будучи на тисячоліття старшими за сучасну державу, піраміди залишаються вічним пам'ятником людським амбіціям та винахідливості.§!"
