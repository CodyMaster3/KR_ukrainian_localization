### Section 1 - Starting Event Chain and determinants of ANQ, LEP and QIE paths ###
 league_collapse.1.t: "Сунь Чуаньфан зустрічається з губернаторами"
 league_collapse.1.d: "Сьогодні в Нанкіні зібралися найважливіші та найвпливовіші діячі Ліги з лав Кліки Південного Чжилі. Зізвана до Нанкіна великодушним Усміхненим Тигром, така зустріч є звичною справою в управлінні Лігою восьми провінцій. Збігаючись із промовою президента Цао Куня до китайського Нового року, Ліга не марнує час на подібні легковажні церемонії, властиві Пекіну. Збираючись у палаці маршала, Сунь Чуаньфан зазвичай проводить такі наради для обговорення загальної політики Ліги, розподілу завдань між губернаторами та зміцнення власного становища в регіонах.\n\nНа зустрічі був присутній губернатор Цзянсу Ці Сєюань — чи не найбільший союзник і водночас найголовніший суперник Суня в самій Лізі. Постійно опиняючись у центрі скандалів відтоді, як його повернули до лав Південного Чжилі, Ці є найпалкішим прихильником згубної політики концесій у цій неформальній раді. На протилежному боці спектра — як за столом переговорів, так і в політиці — перебуває губернатор Чень Тяоюань, який керує справами в провінції Аньхой. Хоч він і приєднався порівняно недавно, Чень позиціонує себе як запеклого противника концесій і відкрито протидіє Ці.\n\nЗвісно, були присутні й інші губернатори, зокрема жорстокий губернатор Фуцзяні Чжоу Їньжень, який рідко залишає свої посадові обов'язки з проведення операцій оточення проти міньганських повстанців. Так само прибули губернатор Цзянсі Ден Жучжо та всіма зневажений губернатор Чжецзяну Чень Ї. Зловісним знаком стало те, що продовжуючи бойкот Чжилі, губернатори Чень Цзюнмін, Лу Жунцін і Чжао Хенті не надіслали жодних представників і навіть не спромоглися відправити телеграму з поясненням своєї відсутності.\n\nХай там як, для Ліги це новий рік процвітання. Утім, губернатори Чень Ї, Ці Сєюань і Чень Тяоюань помітно нервували через присутність найближчих довірених осіб маршала Ліги — Се Хунсюня, Мен Чжаоюе та Лі Баочжана. Імовірно, ті намагалися винюхати зрадників серед губернаторів, адже через надмірну підозріливість Суня його найближче оточення складається з друзів, ворогів і ворогів, які вдають із себе друзів."
 league_collapse.1.a: "У лігві Тигра за спинами ховаються кинджали."

 league_collapse.2.t: "Чжеганська залізниця"
 league_collapse.2.d: "Сьогодні відбулося довгоочікуване відкриття Чжеганської залізниці — спільного проєкту маршала Ліги, губернаторів Чень Ї, Ден Жучжо та Наглядової ради Ост-Азійського генерального управління (AOG). Створена для прискорення індустріалізації та об'єднання розрізнених залізничних гілок у межах провінцій, Чжеганська лінія бере свій початок ще з ініціатив династії Цін. Спочатку споруджувана як залізниця Чжучжоу — Пінсян у 1899 році, вона будувалася шість років і була завершена в 1905 році.\n\nУ 1908 році Чжецзянська залізнична компанія розпочала вишукувальні роботи для прокладання лінії з Чжецзяну до Цзянсі, співпрацюючи з Цзянсійською залізничною компанією. Проте через буремні події Синьхайської революції проєкт було заморожено на невизначений термін. Лише в 1929 році під егідою маршала Ліги уряд провінції Чжецзян на чолі з Чень Ї вирішив залучити власні кошти для модернізації повіту Цзяншань, розташованого на кордоні Чжецзяну та Цзянсі. Завдяки цим зусиллям було збудовано невелику залізницю Ханцзян.\n\nОскільки лінія Ханцзян приносила колосальні прибутки уряду провінції Чжецзян, асамблея ухвалила рішення про необхідність продовження робіт із відновлення залізничного сполучення між Чжецзяном і Цзянсі. Будівництво, що розпочалося в 1932 році й завершилося роком пізніше, дозволило провінційному уряду модернізувати колії, відремонтувати 68 мостів і укріпити 16 із них, а також звести станцію та депо в Юйшані.\n\nЗрештою, реалізуючи спільне підприємство, губернатори Чень і Ден курували об'єднання низки другорядних гілок, що нарешті з'єднало Наньчан прямим сполученням із Шанхаєм. Хоча ціна була високою — понад 2000 робітників загинули під час будівництва, — готова Чжеганська залізниця стала помітним інструментом патріотичної пропаганди. Щедре фінансування з боку AOG у поєднанні з талантом китайських інженерів дозволило товариству «Цзінсін» проголосити проєкт грандіозним тріумфом.\n\nУтім, менш оптимістичні спостерігачі поспішили наголосити на тому, що AOG здобула доступ до багатих покладів корисних копалин, а також до цзіндечженьської порцеляни, яка високо цінується в Берліні. На щастя, попри побоювання, напад Ґоміньдану на церемонію відкриття так і не відбувся."
 league_collapse.2.a: "Залізниці несуть процвітання!"

 league_collapse.3.t: "Несподіване оголошення"
 league_collapse.3.d: "Вдихаючи свіже повітря Нанкіна, маршал Ліги мимоволі роздумував про те, яким могло б бути його життя, якби він не взявся за об'єднання Південного Чжилі. Можливо, став би генералом в армії У? Або взагалі буддійським ченцем? Такі дозвільні думки крутилися в його голові. Бути маршалом Ліги — нелегка справа, особливо коли вороги засіли у твоєму власному таборі. Розгорнувши газету, Усміхнений Тигр насупився: великими жирними літерами там було виведено: «ЗРАДНИК», а нижче красувався портрет самого маршала Ліги.\n\nНе встиг він оговтатися, як його спокій порушив такий собі Цянь Цзунцзе в супроводі солдатів. Як молодший офіцер його почту, Цянь відповідав за безпеку Чжецзянської залізниці та провінційну поліцію, тому його раптова поява в палаці маршала виглядала вкрай незвично. Перш ніж Сунь устиг щось запитати, Цянь поспішив доповісти:\n\n«Маршале Сунь, щиро перепрошую, я мчав сюди так швидко, як тільки міг. Я не міг ризикувати й передавати це телеграмою. Губернатор Ці, перевищивши свої повноваження, уклав угоду з AOG про публічний викуп та об'єднання низки східних залізниць на користь її дочірнього підприємства Schantung-Eisenbahn-Gesellschaft. Включно з новозбудованою Чжеганською лінією».\n\nМаршал спохмурнів іще більше й жестом наказав Цяню замовкнути, знову повернувшись до газети. У статті детально описувалася угода губернатора Ці, його відкрита підтримка цієї оборудки та люта відповідь з боку губернатора Чень Тяоюаня. Звинувативши Ці, а заразом і Суня, у зраді китайської нації, Чень очолив рух проти концесій. Підливши масла у вогонь, Ці фактично розбив сподівання тих, хто вірив, що нова залізниця стане кроком до рівноправного партнерства між німцями та китайцями.\n\nРоздаючи різкі накази, Тигр вийшов зі свого лігва. Наступними днями чимало посадовців у Лізі почали обривати контакти як із губернатором Ці, так і з губернатором Ченем. Водночас поліція реагувала на протести проти концесій помітно повільніше, ніж зазвичай. Безсумнівно, Ці та Чень пожнуть те, що посіяли. Маршал про це подбає."
 league_collapse.3.a: "Є річ, якої Тигр не потерпить: коли його називають зрадником."

 league_collapse.4.t: "Заворушення ширяться"
 league_collapse.4.d: "Цілком очікувано, що широко розрекламована передача Центральнокитайської залізниці під управління AOG і подальша інформаційна буря, роздмухана Чень Тяоюанем та рухом проти концесій, викликали хвилю загального обурення. Інтелектуали з Руху за автономію Чжецзяну, Федерації національного порятунку, Молодіжної партії Китаю та навіть Товариства прагнення таврували маршала Ліги та губернатора Ці як запроданців і безпринципних зрадників. Їхні красномовні заяви друкуються в місцевих газетах, підхоплюються провідними англо-американськими виданнями Шанхая та лунають зі шпальт періодики Китайської синдикалістської партії прямо в заводських цехах. Гірше того: правда, схоже, остаточно потонула в народній люті.\n\nОпинившись в одному ряду з мерзотником губернатором Ці, Сунь Чуаньфан зазнав осуду з боку Купецької асоціації Нижнього Янцзи та навіть стриманої критики від своїх друзів із товариства «Цзінсін». Чутки ширилися блискавично, переростаючи в нестримну хвилю гніву небачених масштабів. Зазвичай спритний і далекоглядний Усміхнений Тигр нарешті потрапив у пастку.\n\nМіські плітки тепер малюють картини масштабних змов, таємничих зникнень опозиціонерів та осідання мільйонів юанів у кишенях маршала Ліги. Громадськість відреагувала передбачуваною люттю, і протести вже перекинулися з Чжецзяну та Цзянсі на великі прибережні міста, включно з іноземними сеттльментами.\n\nУтім, у своїх покоях Сунь виглядає зламаною людиною. Невже після всього, що він зробив, це кінець його імперії? Не може бути, він сильніший за це. Чи не так? Зраджений не лише селянами, про яких піклувався як батько, а й інтелектуалами, яких щиро поважав. Звісно, він не сидітиме склавши руки! Усміхнений Тигр переживав і гірші часи, а його амбіції значно більші. Попри це, навіть найближчі соратники, як-от Се Хунсюнь та Лю Цзунцзі, бачать глибоку втому на обличчі легендарного маршала."
 league_collapse.4.a: "Невже вони не розуміють? Я теж люблю цю країну!"

 league_collapse.5.t: "Напади на іноземців"
 league_collapse.5.d: "Прокинувшись після неспокійного сну, маршал Ліги знову був змушений вислуховувати доповіді своєї вірної розвідки. На тлі стрімкого розвитку останніх подій перед ним постала значно тривожніша картина. Підійшовши до столу та переглядаючи стос телеграм у ранкових сутінках, він читав про жахливі події.\n\nУсе почалося з нападів на видатних німецьких громадян і підприємців, проте насильство швидко набуло хаотичного характеру: підбурювані так званими «патріотами», натовпи почали нападати на всіх іноземців поспіль у провінціях Фуцзянь, Цзянсі та Аньхой. Ба більше, жага розправи поширилася зі швидкістю лісової пожежі, охоплюючи гнівом цілі повіти.\n\nУ відповідь німецьке консульство в Нанкіні закликало підданих кайзера озброюватися, до аналогічних порад вдалися й інші європейські уряди. Після офіційних застережень для іноземців утриматися від несуттєвих поїздок стало зрозуміло: навіть ненависні союзники маршала Ліги починають відвертатися від нього.\n\nЗагальний вплив цих нападів на бізнес та інвестиції ще належить оцінити, але досвід підказує, що Шанхайська фондова біржа не залишиться осторонь. Його освічене правління опинилося в облозі зусібіч. Над Нанкіном згущаються хмари..."
 league_collapse.5.a: "Картковий будинок починає тріщати."

 league_collapse.6.t: "Бойкоти та Пекін"
 league_collapse.6.d: "Вічно ненадійний та опортуністичний губернатор Чень Тяоюань — чи не головний винуватець роздмухування народної люті — почав підбурювати інтелектуалів і селян до загального бойкоту всіх німецьких товарів. Ці заклики швидко поширилися на тлі наростаючих протестів у Східному Китаї, а агенти Ґоміньдану під орудою Дай Чуньфена, інтелектуали та націоналістичні ідеологи перетворили початковий задум Ченя на справжнє полум'я бунту.\n\nНайбільше занепокоєння викликають повідомлення про те, що деякі місцеві гарнізони в Аньхої, Чжецзяні та Цзянсу відступили, дозволяючи заворушенням розростатися, аби не отримати тавро «ханьцзянів» чи «зрадників нації». Водночас вірні губернатори Ден і Чжоу підтримали маршала Ліги в усіх державних справах, знаючи про його таємну огиду до концесій. Губернатори Лу Жунцін і Чень Цзюнмін зберігають мовчання, хоча Сунь достатньо добре знає їх, аби розуміти щонайменше мовчазну підтримку Ченя.\n\nГубернатор Чжао Хенті зі свого боку схвально висловився щодо бойкоту в провінційній асамблеї Хунані, проте водночас запевнив у своїй відданості нейтралітету провінції. Ситуацію ускладнює й те, що хаос у Лізі не залишився непоміченим Нефритовим маршалом та правителем Баодіна. Маршал Сунь отримав повідомлення про підготовку офіційного запиту від Північного Чжилі. До Пекіна доходять спотворені звіти, тож Нефритовий маршал вочевидь намагається витягнути зі свого протеже пряму відповідь.\n\nАби відвернути загрозу втручання з боку Пекіна, радники з Нанкінської комісії (Nanking-Kommission), а також Чжен Цзюньнянь і Се Хунсюнь порадили маршалу Ліги публічно й приватно заявити, що ситуація перебуває під повним контролем. Це залишить нас сам на сам із проблемою, але не дозволить губернатору Хубею Сяо чи губернатору Хенані Лі мобілізувати свої війська. Незвично мовчазний під час цих подій губернатор Чень Ї нарешті вийшов на зв'язок із Сунем, запропонувавши перекинути частини кількох своїх дивізій із Нанкіна та Чжецзяну до міст уздовж нижньої течії Янцзи, де вирують найбільші протести. Водночас провінційні гарнізони запросили дозвіл застосувати силу для придушення відкритої непокори."
 league_collapse.6.a: "Тигр знає, коли слід ударити молотом."
 league_collapse.6.b: "Але в мене є серце — карайте лише заколотників."

 league_collapse.7.t: "Підриви залізниць"
 league_collapse.7.d: "З територій провінцій Ліги надійшли нові тривожні звістки. Серія вибухів прогриміла на кількох станціях і залізничних гілках, які мали стати частиною Центральнокитайської залізниці; одна з бомб розірвала вагон на переповненій станції в Ханчжоу, унаслідок чого десятки людей загинули й дістали поранення. Ця новина шокувала державних службовців, чиновників і губернаторів, а загибель людей принесла горе в численні родини. З прагматичного погляду такі зухвалі диверсії повністю паралізували транспортне сполучення в багатьох районах, що завадило маршалу Суню швидко перекинути додаткові сили для придушення заворушень і покарання губернаторів Ченя та Ці.\n\nЗвинувачення в атаках лунають на адресу найрізноманітніших сил, а офіцери розвідки Суня не можуть розібратися в цьому хаосі. Місцеві бандити, які скористалися безладом для грабунку? Ґоміньдан, що готує ґрунт для масштабного повстання? Губернатор Ці чи Чень, які намагаються запобігти помсті з Нанкіна? Чи, можливо, японці, які прагнуть посіяти ще більше розбрату? Деякі схильні до теорій змов особи навіть припускають причетність німців, які нібито самі підривають власні об'єкти, аби створити привід для військової інтервенції."
 league_collapse.7.a: "Невинні знову гинуть..."

 league_collapse.8.t: "Звістки з півночі та півдня"
 league_collapse.8.d: "Здається, кожен новий день несе лихі новини: рік Щура вже перетворюється на неконтрольовану катастрофу. До палацу маршала надійшли тривожні звістки як із Сюйчжоу, так і з Цюаньчжоу. У Міньганській зоні повстання партизани Національно-революційної армії Ґоміньдану здійснили низку зухвалих рейдів, завдавши ударів у районі міст Юндін і Лун'янь. Губернатор Чжоу Їньжень здавна насилу утримував контроль над своєю гірською провінцією, де його реальна влада часто обмежувалася узбережжям та великими містами всередині країни.\n\nТепер, коли НРА діє дедалі рішучіше й нахабніше, залізний контроль Чжоу остаточно слабшає. Тим часом на північному кордоні Цзянсу губернатор Ці надіслав незвичні звіти про зростання активності сільських бандитів і захоплення ними сіл. Маршал Сунь далеко не дурень і чудово знає ці вигадки Ці про «бандитські клани», які насправді є його власними солдатами. Це давнє джерело конфліктів між губернатором і маршалом, і їхнє нове втручання цілком може лише підігрівати заворушення.\n\nПроявивши обачність, маршал Сунь розпорядився перекинути на північ низку дивізій, які підтримували лад у Цзянсі та Фуцзяні, розрахувавши сили та віддавши перевагу збереженню ціннішої провінції Цзянсу під залізною п'ятою. Утім, дехто в його найближчому оточенні припускає, що Усміхнений Тигр просто сильніше затягує зашморг на шиях губернаторів Ченя та Ці."
 league_collapse.8.a: "Цей виродок щось замишляє!"

 league_collapse.9.t: "Телеграма з Пекіна"
 league_collapse.9.d: "Попри наші відмовки та запевнення, невгамовний Нефритовий маршал і правитель Баодіна надіслали до Нанкіна низку наполегливих телеграм. Фактичні правителі країни після Третьої Чжилі-Фентянської війни — маршал У Пейфу та президент Цао Кунь — мають колосальний вплив навіть на маршала Ліги. Попри суперництво, гонку озброєнь між Усміхненим Тигром і Нефритовим маршалом та багатополярний світ Північного й Південного Чжилі, У Пейфу залишається наставником Суня, а це створює непорушний зв'язок. Так само оточення Суня остерігається військового таланту У, політичного хисту Цао та всієї потуги Північного Чжилі, здатної обрушитися на них.\n\nУ посланні міститься вимога надати детальний звіт про хаос, що охопив південно-східні території. Красномовна, непохитна й безапеляційна телеграма складена так, аби змусити маршала Ліги визнати слабкість, що дасть привід Центральній армії втрутитися та «відновити порядок». Неодноразові спроби Пекіна підпорядкувати та поширити свій вплив на південь після створення Ліги у 1928 році Сунь досі блискуче відбивав.\n\nЯк досвідчений державний діяч, Сунь має дати виважену, обережну відповідь, зважаючи на всі фактори: наставник і учень, Північ і Південь, стабільність власної держави на противагу стабільності всієї нації. Порадившись зі своїм харизматичним радником Вей Даофеном, маршал написав..."
 league_collapse.9.a: "«Усе під контролем»."

 league_collapse.10.t: "Інцидент у Вуху"
 league_collapse.10.d: "Місто Вуху, розташоване на околицях Нанкіна й формально підпорядковане губернатору Аньхою Чень Тяоюаню, стало особливо вибухонебезпечним осередком протестів і заворушень. Оскільки Нанкін перебуває під прямим контролем маршала Ліги, там зберігається відносний спокій, на відміну від бунтівних Сяменя чи Сюйчжоу. Через це більшість нанкінських опозиціонерів вирушили на протести до Вуху, аби діяти безпосередньо під носом у Суня, уникаючи водночас репресій у самій столиці.\n\nЗавдяки підтримці та потуранню губернатора Ченя вони діяли відносно безперешкодно, поступово штовхаючи місто в безодню анархії. На тлі такого розвалу влади трагедія була лише питанням часу. Учора вдень під час чергового мітингу — явища, що стало звичним для Ліги, — кількість учасників різко зросла. Підбурювані Китайською синдикалістською партією страйкарі з сусідніх німецьких фабрик приєдналися до натовпу, і ситуація швидко вийшла з-під контролю поліції.\n\nГарнізон, підсилений підрозділом вишколених німцями бійців із Нанкіна, спробував відновити порядок, але в метушні невідомі відкрили вогонь. Хоча винуватців не встановлено, подальший хаос виявився катастрофічним. За лічені хвилини поліція, гарнізон і підкріплення відкрили вогонь по натовпу, діставши удари у відповідь. Понад двісті людей уже підтверджено загиблими, учетверо більше поранено, а хвиля обурення миттєво сколихнула сусідні регіони.\n\nСитуацію ускладнює наявність у місті невеликого іноземного сеттльменту. Багато хто вже стверджує, що смертоносну зброю застосували виключно заради захисту іноземців, і до ранку звістки про бійню потраплять до міжнародних газет. Ба більше, губернатор Чень використав інцидент для офіційної вимоги повного виведення всіх військ Ліги восьми провінцій з Аньхою, готуючи ґрунт для відокремлення. Через це маршал Ліги та його оточення впевнені, що саме Чень Тяоюань стоїть за цією провокацією..."
 league_collapse.10.a: "Цей зрадник! Що він сподівається цим виграти?!"

 league_collapse.11.t: "Аньцін відмовляється від співпраці"
 league_collapse.11.d: "Розвиваючи наступ, губернатор Чень офіційно оголосив про відокремлення, навіть не чекаючи на відповідь маршала Ліги. Посилаючись на трагедію у Вуху, він висунув ультиматум із вимогою повного виведення всіх чужих формувань із території Аньхою та негайної видачі офіцерів, відповідальних за розстріл. З неприхованою зневагою Чень запевнив маршала Ліги, що його власні війська «наведуть лад і придушать безладдя», хоча він і пальцем для цього не поворухнув раніше.\n\nВідмовившись від будь-якої співпраці з владою Ліги, він також засудив будівництво Центральнокитайської залізниці, звинувативши її в «доведенні патріотичних громадян до відчаю». Будучи давньою скалкою в нашому оці, «Дурник» нарешті відкрив карти. Розпалюючи полум'я народного гніву проти Ліги та її маршала, Чень просто шукав формальний привід для виходу з-під влади Усміхненого Тигра.\n\nЗа звичайних обставин за таку зухвалість послідувала б негайна й жорстока кара. Проте зв'язки Ченя з противниками концесій та медійна кампанія, що виставила його національним героєм, змушують маршала Ліги діяти обережно. Рішучий удар зараз може остаточно розколоти крихку Лігу. Утім, Сунь не збирається миритися з цим і наказав своїм найвірнішим генералам — Се Хунсюню, Лю Цзунцзі, Мен Чжаоюе та Ма Юйженю — готувати війська до зіткнення з Аньхойською армією."
 league_collapse.11.a: "Його час прийде, але не так швидко."
 league_collapse.11.b: "Приєднатися до губернатора Ченя! (Грати за Аньцін)"

 league_collapse.12.t: "Таємні переговори з Шанґуань Юньсяном"
 league_collapse.12.d: "Зважаючи на віроломні дії Чень Тяоюаня та виступи противників концесій на заході, а також загрозу з боку Ґоміньдану на півдні, провінція Чжецзян, окрім свого багатства, набуває вирішального стратегічного значення для Ліги в майбутніх війнах. Розташована на південь від Цзянсу та з'єднуючи Цзянсі й Фуцзянь із Нанкіном, вона обов'язково має залишитися в орбіті Ліги.\n\nГубернатор Чжецзяну Чень Ї, який здавна тримався осторонь і зберігав особисту відданість лише Сунь Чуаньфану, але не Ці Сєюаню, виявився ненадійним союзником. Надходять численні повідомлення про його контакти з Чень Тяоюанем і навіть із японцями. Його можлива зрада стане катастрофою: вона ізолює губернаторів Дена й Чжоу, посилить Чень Тяоюаня і неодмінно призведе до переходу частини наших найкращих командирів на бік ворога.\n\nУтім, не всі підлеглі губернатора Ченя поділяють його позицію. Такий собі Шанґуань Юньсян — не прямий підлеглий, але впливовий діяч у Чжецзяні — дав зрозуміти, що відкритий до пропозицій. Вічно незадоволений і амбітний, він міг би спокуситися посадою губернатора від маршала Ліги Ці, хоча через свою жадібність може зажадати значно більшого, ніж ми здатні запропонувати. Звісно, завжди є вибір довіритися губернатору Ченю та чжецзянській кліці."
 league_collapse.12.a: "Запропонувати йому Чжецзян."
 league_collapse.12.b: "Запропонувати йому Чжецзян та Аньхой."
 league_collapse.12.c: "Чень Ї заслуговує на довіру."

 league_collapse.13.t: "Напруженість на Янцзи"
 league_collapse.13.d: "Вулиці Аньхою сповнені люті: «Правосуддя за Вуху! Геть іноземців!» Губернатор Чень Тяоюань очолив цей рух, і емісарів нанкінського уряду вже виганяють із провінції. Майже за одну ніч Чень перетворився на захисника народу, але тепер його сили опинилися в протистоянні по всій нижній течії Янцзи, і постає питання: що далі? Дехто закликає до повного повалення нанкінського режиму, проте прагматичніші голоси вказують на стратегічні можливості.\n\nЧень завжди славився вмінням іти на прорахований ризик, і цей момент — не виняток."
 league_collapse.13.a: "Хай живе губернатор!"

 league_collapse.14.t: "Звернення до У Пейфу?"
 league_collapse.14.d: "На тлі хаосу, що охопив Вісім провінцій, Чень чудово розуміє: невдовзі під загрозою опиниться і його власне становище. Аби уникнути краху або удару з боку ворогів, нам потрібні союзники. У Пейфу, Нефритовий маршал і справжній правитель цинського уряду, володіє найбільшою армією у Східному Китаї та може стати потужною опорою — подейкують, що він потай співчуває нашій боротьбі проти концесій. Просити про повну підтримку одразу було б необачно, тож для початку варто просто звернутися по фінансову допомогу для наших військ."
 league_collapse.14.a: "Надіслати телеграму."

 league_collapse.15.t: "Чень Тяоюань надсилає телеграму"
 league_collapse.15.d: "«Високоповажному президенту Цао Куню та імперському міністру У Пейфу.\n\nЯ, губернатор Чень Тяоюань, покірно прошу про виділення додаткового фінансування для моїх військ. Згідно з конституцією нашої великої нації, прямим обов'язком центрального уряду є надання коштів провінційним губернаторам для придушення заворушень. Оскільки становище маршала Ліги Сунь Чуаньфана в Нанкіні залишається невизначеним, я взяв на себе відповідальність за захист провінції Аньхой від бандитів та лівих агітаторів».\n\nЦя телеграма, надіслана Цао Куню та передана сьогодні вранці У Пейфу, здивувала обох своєю сміливістю: Чень апелює до Нефритового маршала та правителя Баодіна нормами конституції. Створивши видимість відновлення порядку у своїй провінції, Чень вочевидь робить ставку на підтримку Центрального уряду, аби вийти за межі Аньхою.\n\nПеред лідерами постає непростий вибір: за допомогою Ченя можна прибрати зайву фігуру з дошки, замінивши некеровану Лігу людиною, повністю залежною від їхньої допомоги. Проте союз із відвертим противником концесій загрожує погіршенням відносин із Німеччиною, які Цао ретельно вибудовував роками. Водночас підтримка антиконцесійного руху дозволить У та Цао спертися на народні маси, повторивши хвилю тріумфу 1922 року."
 league_collapse.15.a: "Надіслати кошти — це захистить наші інтереси."
 league_collapse.15.b: "Відмовити. Жодних грошей бунтівникам!"

 league_collapse.16.t: "У приймає наше прохання"
 league_collapse.16.d: "Маршал У Пейфу відповів на нашу телеграму, висловивши глибоке співчуття жителям Аньхою та захоплення їхньою відданістю справі Китаю. Утім, у цьому пишному листі маршал У так і не сказав прямо, чи надасть Пекін реальну допомогу Аньціну. Губернатор Чень опинився перед дилемою, маючи обмаль часу: чи варто продовжувати переговори з маршалом У, чи краще витратити ці лічені дні затишшя на пошук інших дипломатичних шляхів порятунку?"
 league_collapse.16.a: "Бачите? Що я казав!"
 league_collapse.16.b: "Марна справа. Він звичайнісінька німецька маріонетка."

 league_collapse.17.t: "Лист подяки від губернатора Ченя"
 league_collapse.17.d: "Написавши листа вишуканим каліграфічним почерком і найкращим чорнилом, губернатор Чень висловив щиру вдячність маршалу У Пейфу та президенту Цао, віддавши належне їхній відданості зміцненню китайської єдності. Запевнивши Пекін у своєму прагненні захищати суверенітет Китаю, він оголосив про кінець західного втручання в долині Янцзи, палко підтвердивши віру в об'єднання країни та вигнання іноземних імперіалістів.\n\nУ вузькому колі У та Цао стримано обмінялися відчуттям полегшення від стабілізації ситуації. Здобувши прихильність популярного губернатора в провінціях Ліги, уряд сподівається, що нова доба процвітання без імперіалістичного ярма вже не за горами."
 league_collapse.17.a: "А він уміє зачарувати, чи не так?"

 league_collapse.18.t: "Зрада «Дурника»"
 league_collapse.18.d: "Попри всі спроби Центрального уряду залучити та повернути губернатора Ченя до лав Чжилі — шляхом дипломатичних маневрів Цао, фінансової допомоги від банків Ван Кеміня та військової підтримки Нефритового маршала — схоже, губернатор Чень відкинув наші пропозиції до діалогу. Під час останніх контактів він ставав дедалі холоднішим і недосяжнішим.\n\nОдин із наших прикордонників виявив у прибулих біженців листівки сумнозвісного японського парамілітарного товариства «Чорний дракон». Тепер, на тлі мертвої мовчанки лідерів Аньціна, з'являються ще тривожніші свідчення: інші біженці помітили в Аньціні губернатора провінції Чжецзян Чень Ї, горезвісного своїми зв'язками з «Чорними драконами». Наша розвідка має серйозні підозри, що губернатор намагається зрадити не лише президента Цао, маршала У та Імператора, а й усю китайську націю, налагодивши зв'язки з японською агентурною мережею."
 league_collapse.18.a: "Кляті японці!"

 league_collapse.19.t: "У відхиляє прохання Чень Тяоюаня"
 league_collapse.19.d: "Черговий лист від маршала У свідчить про остаточний крах будь-яких точок дотику між ним та губернатором Ченем. Маршал У суворо картає Ченя за неймовірну авантюру, на яку той наражає жителів Аньхою, і застерігає: спроба задобрити Нанкін означатиме для нього вірну смерть. Цей поворот суттєво перекреслив наші намагання здобути підтримку в Пекіні, а часу залишається дедалі менше.\n\nУтім, друга можливість може відкритися завдяки неоднозначній постаті генерала Чень Ї, чиї ймовірні зв'язки з товариством «Чорний дракон» можуть допомогти нам отримати аудієнцію в японського посла в Тяньцзіні, а через нього — вийти на Фентянський уряд. [ANQ.GetLeader] цілком усвідомлює ризик, який зв'язок із Фентянем несе для руху проти концесій, проте через непохитну відмову У іншого вибору в нас майже немає."
 league_collapse.19.a: "Настав час відвідати Фентянь."

 league_collapse.20.t: "Чень Тяоюань звертається до Чень Ї"
 league_collapse.20.d: "Чень Ї, губернатор впливової провінції Чжецзян, яка все ще входить до складу Ліги, звернувся до Чень Тяоюаня для обговорення можливої співпраці. Переконуючи колегу, що справжнє майбутнє Китаю пов'язане з Фентянським урядом, а не з династією Цін, він обіцяє: якщо Чень Тяоюань присягне на вірність лідеру Фентяня Чжан Цзоліню, Чень Ї надасть повну підтримку в майбутній війні.\n\nОскільки становище Чень Ї в Чжецзяні забезпечує йому солідні кошти та сили для підкріплення цих обіцянок, а У Пейфу продовжує підтримувати Нанкін, схоже, у нас немає іншого вибору, окрім як ризикнути й сподіватися на краще."
 league_collapse.20.a: "Який у нас вибір?"

 league_collapse.21.t: "Аньцін просить нашої підтримки"
 league_collapse.21.d: "Чень Тяоюань, губернатор провінції Аньхой у складі Ліги восьми провінцій, звернувся по нашу допомогу в майбутній боротьбі проти Цін та Ліги. Хоча Чень непохитно виступає проти концесій і спирається на цей рух, він також усвідомлює всю безвихідь свого становища: або він тримається ідеалів і втрачає землю, армію та, найімовірніше, життя, або стукає у двері єдиного іншого національного уряду в Китаї, хоч би з якими іноземними державами той співпрацював. Підштовхуваний губернатором Чжецзяну Чень Ї вийти з нами на зв'язок, він, схоже, обрав другий шлях.\n\nЦе дає нам чудову нагоду здобути потенційно потужного союзника у Східному Китаї та вдарити по південному флангу цинського осередку влади, чим ми маємо скористатися сповна."
 league_collapse.21.a: "На дошці з'явилася нова фігура."

 league_collapse.22.t: "Ще одна пропозиція Ченю?"
 league_collapse.22.d: "Після нашої відмови надати допомогу губернатору Аньхою Чень Тяоюаню з Аньцінської кліки почали надходити тривожні звістки про те, що він вийшов на зв'язок із Чжан Цзолінем — лідером бунтівного фентянського уряду на Північному Сході. Ще більше непокоїть те, що посередником у перемовинах виступає японська сторона. Деякі радники У пропонують маршалу знову звернутися до Ченя з пропозицією прямої військової підтримки його повстання, аби не отримати японську маріонетку просто на нашому порозі.\n\nКрім загрози японської присутності за спиною Ченя, невтручання може спричинити й хвилю внутрішніх заворушень. Багато хто як в опозиційних партіях, так і в самій Кліці Чжилі прагне скористатися хаосом розпаду для посилення власного впливу, а в містах уже спалахнули невеликі протести на підтримку антиконцесійної позиції губернатора Ченя. Мовчання може призвести до ескалації цих виступів, що ще дужче розхитає наш і без того нестабільний режим."
 league_collapse.22.a: "Послухаймо, що він скаже."
 league_collapse.22.b: "Це надто ризиковано."

 league_collapse.23.t: "У Пейфу переглядає позицію"
 league_collapse.23.d: "Вочевидь дізнавшись про наші зв'язки з Шеньяном і Токіо, У Пейфу скасував початкову вимогу скласти зброю та підкоритися Нанкіну. Тепер він пропонує повну підтримку та хвалить [ANQ.GetLeader] за рішучі дії у важкий для Китаю час. На підтвердження своїх слів він також санкціонував відправлення до Аньціна золота та зброї з обіцянкою додаткових поставок, якщо ми приймемо його пропозицію та обірвемо всі контакти з Фентянським урядом і Токіо."
 league_collapse.23.a: "Хто гарантує, що він не зрадить нас удруге?"
 league_collapse.23.b: "Ми вдячні за його підтримку."

 league_collapse.24.t1: "Чень Тяоюань відхиляє нашу пропозицію"
 league_collapse.24.t2: "Чень Тяоюань переглядає свою позицію"
 league_collapse.24.d1: "Вочевидь обурений нашою попередньою відмовою, губернатор Аньціна відкинув висунуті вимоги та чітко дав зрозуміти, що інтереси його народу пов'язані з Фентянським урядом. На доказ своїх слів він також демонстративно відмовився від надісланого хабаря, який мав схилити його до покори, аби остаточно позбутися будь-яких зобов'язань перед Цін."
 league_collapse.24.d2: "Попри початковий намір кинути губернатора Ченя напризволяще, схоже, швидкий відступ Чжилі вберіг кліку від найгірших інтриг Фентяня в межах Ліги. Чи то під впливом палких слів У, спорядження та фінансів, чи через майже десятиліття попередньої співпраці й допомоги, губернатор Чень дав Нефритовому маршалу та правителю Баодіна зелене світло для продовження союзницьких відносин.\n\nОдразу після цього Чжан Чжитань повідомив Лоян, що дунбейських радників і японських офіцерів уже почали висилати з Аньхою або затримувати, підтверджуючи повернення Ченя до його справжніх покровителів."
 league_collapse.24.a: "Прикро."
 league_collapse.24.b: "Погляньмо, чим закінчиться ця авантюра."

 league_collapse.25.t: "Пропозиція від маршала Ці"
 league_collapse.25.d1: "Після відхилення телеграми губернатора Ченя амбітний та опортуністичний Ці Сєюань, схоже, дізнався про цю відмову. Фактично узурпувавши роль Сунь Чуаньфана в Лізі, Ці проголосив себе новим «маршалом Ліги восьми провінцій», хоча офіційно про смерть Суня громадськості ще не повідомляли.\n\nСклавши пишного листа до Цао та У, він напряму попросив про допомогу в придушенні того, що назвав «незначним заколотом у провінції Аньхой», попри те що наша розвідка та телеграма Ченя свідчать про протилежне. Він наполягає: оскільки ми є законною владою Центрального уряду, для нас «єдино правильно підтримати законного маршала Ліги».\n\nПихатий тон викликав у У та Цао підозри щодо прохання Ці, адже якийсь вискочень-мілітарист, що вже спричинив заколот у 1924 році, насмілюється висувати їм вимоги. Гірше того, Ці теоретично міг би легко розгромити Аньхой і повстання Ґоміньдану за однієї лише німецької підтримки. Проте Цао та його радники, серед яких Гао Лінвей, усе ж вважають, що сильна Ліга та міцні зв'язки з Німеччиною — це шлях до прогресу."
 league_collapse.25.d2: "Після схвалення телеграми губернатора Ченя амбітний та опортуністичний Ці Сєюань, схоже, не дізнався про цей союз. Фактично узурпувавши роль Сунь Чуаньфана в Лізі, Ці проголосив себе новим «маршалом Ліги восьми провінцій», хоча офіційно про смерть Суня громадськості ще не повідомляли.\n\nСклавши пишного листа до Цао та У, він напряму попросив про допомогу в придушенні того, що назвав «незначним заколотом у провінції Аньхой», попри те що наша розвідка та телеграма Ченя свідчать про протилежне. Він наполягає: оскільки ми є законною владою Центрального уряду, для нас «єдино правильно підтримати законного маршала Ліги».\n\nПихатий тон викликав у У та Цао підозри щодо прохання Ці, адже якийсь вискочень-мілітарист, що вже спричинив заколот у 1924 році, насмілюється висувати їм вимоги. Гірше того, Ці теоретично міг би легко розгромити Аньхой і повстання Ґоміньдану за однієї лише німецької підтримки. Проте Цао та його радники, серед яких Гао Лінвей, усе ж вважають, що сильна Ліга та міцні зв'язки з Німеччиною — це шлях до прогресу."
 league_collapse.25.a: "Вислухаймо його — це дасть нам певний важіль впливу."
 league_collapse.25.b: "Він упорається з цим сам."
 league_collapse.25.c: "Жереб уже кинуто."

 league_collapse.26.t: "У погоджується!"
 league_collapse.26.d: "Схоже, наше звернення до Центрального уряду увінчалося успіхом! Прийнявши наше, правду кажучи, скромне прохання про допомогу, У Пейфу та Цао Кунь непрямо визнали нашу владу над Нанкіном і рештою провінцій Ліги. Завдяки їхнім фінансам та зброї ми нарешті зможемо закріпити за собою ще більші території та знищити свавільних бандитів, які захопили Аньхой. Утім, це означає, що на папері ми мусимо схилитися перед їхньою егідою, хоча наше правління в провінціях Ліги тепер має законне підґрунтя."
 league_collapse.26.a: "Чудово!"

 league_collapse.27.t: "У відмовляє!"
 league_collapse.27.d: "Прокляття! Цей ласий до слави «Нефритовий маршал» та його підступний «Президент-хабарник» геть відкинули наше прохання про допомогу. Відмовившись підтримати нас у скрутний час, вони притисли нас спиною до стіни, тож ми знову змушені звернутися до німецьких благодійників. Відвернувшись від справжнього Південного Чжилі, Центральний уряд вочевидь націлився на встановлення більш «лояльної» собі влади на землях Ліги."
 league_collapse.27.a: "Дідько!"

### Section 2 - Black Monday Event Chain and Start of the League War ###
 #Black Monday 2.3.36 February 3rd 1936
 league_collapse.50.t: "Чорний понеділок докотився до Сходу"
 league_collapse.50.d: "Тісно вплетена у світову німецьку економічну систему з часів їхньої інтервенції 1927 року та подальших переговорів президента Цао Куня з німецькими емісарами, Ліга восьми провінцій вирішила дотримуватися курсу Центрального уряду щодо німецького питання. Патріот і противник концесій, маршал Ліги Сунь змирився з німецьким оплотом лише після 1928 року. На тлі наростання напруженості між Північним і Південним Чжилі Усміхнений Тигр досяг свого зеніту після створення Ліги восьми провінцій у 1928 році та її розширення на Ґуандун, Ґуансі й Хунань наступного року. Проігнорувавши директиви Пекіна про роззброєння, Сунь натомість збільшив чисельність своєї армії.\n\nЦе, звісно, поставило перед маршалом Ліги непросту дилему. Будучи категоричним противником надмірних податків на селянство, він опинився у глухому куті. Ці Сєюань і Лі Ліньсі, які щойно повернулися до Китаю, підказали маршалу Ліги єдиний надійний вихід із цієї скрути: укласти великі позики під заставу концесій німцям та Сеттльментам, отримавши необхідні кошти для створення армії, здатної змагатися з військом Нефритового маршала.\n\nПісля посилення тиску на соціалістичних повстанців і демократичних мислителів політичні маневри в Ґуандуні, Ґуансі та Хунані призвели до подальшого ослаблення Ліги. Так противник концесій Сунь опинився в обіймах німців — що викликало в нього глибоку особисту огиду.\n\nІ хоча все почалося на іншому кінці світу, наслідки Чорного понеділка вже прокотилися китайськими ринками. Шанхайська біржа стрімко обвалилася, закрившись на показниках, небачених із часів фінансової кризи 1925 року, а місцеві установи намагаються бодай якось зменшити збитки. На щастя, пересічний громадянин і нація загалом навряд чи відчують миттєвий удар. Проте AOG, яка й без того хитається під тягарем масштабного бойкоту, опинилася у скрутному фінансовому становищі.\n\nЇї представники вже повідомили, що можуть виявитися нездатними сплачувати звичну оренду за концесії в провінціях Ліги, а остаточний платіж за Чжеганську залізницю «відкладено на невизначений термін». Маршал, який і без того був у пригніченому стані, занурився в безодню мороку, адже без цих надходжень для виживання знадобляться масові скорочення бюджету. До того ж ширяться чутки, що губернатор Чень розпочав мобілізацію сил, спрямованих на Нанкін..."
 league_collapse.50.a: "«Що далі я йду, то глибше тону»."

 league_collapse.51.t: "Розбрат у лавах"
 league_collapse.51.d: "У цьому мороці лиха чутки розійшлися блискавично. Поки маршал Ліги не вживав прямих економічних заходів, аби не допустити повної зупинки підприємств консорціуму Цзяннань, новини про ймовірні «скорочення бюджету» та замороження виплат долетіли до кожного молодшого офіцера Ліги. Цілком передбачувано, їхня реакція виявилася, м'яко кажучи, вкрай негативною.\n\nДля одних це означає кінець марнотратного й розкішного життя, принаймні на деякий час, але для багатьох простих солдатів це межа між життям і голодною смертю. Також ширяться чутки — можливо, розпущені губернаторами Ці, Ченем і навіть Ґоміньданом, — що невиплата платні буде нерівномірною. Подейкують, ніби елітні війська прямого підпорядкування маршала Ліги під командуванням Лі Баочжана, Се Хунсюня, Ма Юйженя, Мен Чжаоюе та Лю Цзунцзі збережуть більшу частину або й усю платню. Так само ходять чутки, що підготовлені німцями дивізії Ці Сєюаня оминуть ці труднощі.\n\nНевдоволення офіцерів підігріває невелика, але гучна фракція офіцерів-націоналістів на чолі з молодою гвардією: Тан Еньбо, Ґо Чанєм, Лінь Веєм і Ґе Цзін'енем. Вони гуртуються й доводять, що Лізі взагалі не варто було ставати настільки залежною від німецьких «подачок», хоча цій риториці протистоять такі діячі, як губернатор Ці, а також Лі Женьтао та Сюй Пейґень. Потай маршал Ліги поділяє ці погляди, але на німців поставлено занадто багато, щоб спалювати мости просто зараз.\n\nГірше того, наші давні супротивники з Національно-революційної армії та «Ліги десяти» Ґоміньдану продовжують ховатися в тіні, поширюючи пропаганду й тавруючи «колаборацію з імперіалістами». Поки що це не вилилося у щось серйозне, але те, що колись було звичними заворушеннями, тепер загрожує підірвати самі основи Ліги."
 league_collapse.51.a: "«Усе навколо мене палає...»"

 league_collapse.52.t: "Жахливий злочин"
 league_collapse.52.d: "Молодість Сунь Чуаньфана була сповнена злиднів. Незабаром після його народження помер батько, а через знущання тітки Сунь разом із матір'ю та трьома сестрами втік до Цзінаня в пошуках бодай якогось щастя. Сунь із матір'ю опинилися під опікою Ван Інкая. Саме тоді Усміхнений Тигр уперше випустив пазурі, стрімко здійнявшись щаблями Баодінської військової академії. За роки служби Сунь зустрів і заприятелював із багатьма людьми найрізноманітніших поглядів — від Янь Сішаня до Ден Яньда.\n\nПопри прихильність багатьох, Усміхнений Тигр усе ж залишався хижаком. Ніхто не знав цього краще за підлеглого Чжан Цзунчана — Ши Цунбіня. Під час конфлікту з Фентянем у 1925 році підлеглий Суня Се Хунсюнь ущент розгромив війська Ши. Літній Ши віддав честь Сунь Чуаньфану, коли той прибув на зустріч. Попри це, Сунь наказав Лі Баочжану — «генералу-гільйотині» — негайно стратити Ши, аби запобігти помсті. Обезголовлений і покинутий гнити просто неба... Сунь давно забув про ту подію десятирічної давнини. Проте дехто пам'ятав.\n\nСпостерігаючи за військовими навчаннями біля свого палацу, маршал Ліги вдихав прохолодне нанкінське повітря. Воно бодай на мить тамувало біль і втому від останніх подій. Поринувши в роздуми та дивлячись у небо, Сунь мимоволі згадав те, що було для нього найдорожчим.\n\nКоли він служив у Ван Чжаньюаня, Сунь безтямно закохався в служницю дружини Вана — Хе Цзєсянь. Сунь беріг її глибоко в серці, і самою долею їм було суджено побратися вже за рік.\n\nАле доля мінлива. Ще служницею Цзєсянь захворіла на туберкульоз, і щасливе життя мадам Сунь обірвалося лише через рік після весілля. Назавжди відданий своєму єдиному коханню, Сунь власноруч поховав Хе і назавжди сховав у нагрудній кишені її улюблену білу хустинку — на знак того, що кохана дружина завжди поруч.\n\nПовернувшись до реальності лише на мить, він відчув, як тіло пронизав гострий біль. Крики, метушня. Обернувшись, він ледь розгледів служницю з пістолетом Люґера в руках. Охоронці кинулися скрутити й затримати жінку, але тіло Суня вже осідало додолу. Хустинка Хе Цзєсянь. Остання згадка про неї, її дивовижна чистота, її осяйна білизна... заплямована багряною кров'ю Тигра."
 league_collapse.52.a: "«Я йду до тебе, Цзєсянь»."

 league_collapse.53.t: "Телеграма з Нанкіна"
 league_collapse.53.d: "Посеред ночі секретар Бай Цзяньу та начальник штабу Чжан Ціхуан поспіхом прибули до будинку У Пейфу, збудивши Нефритового маршала від неспокійного сну. Підвівши У до столу, вони поклали перед ним екстрену телеграму — виключно для його очей. Запитавши, чи бачив повідомлення президент Цао, він дізнався, що Ван Юйцзя та Лю Менґен уже доповідають президентові про ситуацію. Пробігши очима таємну депешу із застиглим на обличчі шоком, він прочитав:\n\n«Сунь Чуаньфана поранено 8:55 КРАПКА\nНападника не встановлено КРАПКА\nУ комі КРАПКА\nШанси вижити мізерні КРАПКА\nЗаворушення повсюдні КРАПКА\nУтікають із золотом і документами КРАПКА»\n\nЗа дві години Лоян перетворився на вируючий вузол тривоги. Документи щодо сумнівних угод Суня з Пекіном спалюють у печах, поки представники фракцій Цзіньбао та Лоянського Чжилі сперечаються про зв'язки Усміхненого Тигра. У безпрецедентному рішенні Цао Кунь запросив кількох маньчжурських дворян, зокрема брата імператора Пуцзє, для складання спільної заяви у відповідь на замах — вочевидь прагнучи продемонструвати єдиний фронт у ці неспокійні часи.\n\nПопри все, Нефритовий маршал відчуває щирий жаль через долю, що спіткала Сунь Чуаньфана. Його протеже, його спадкоємець... невже все, що поєднувало їх в ідеології та спогадах, мало закінчитися такою ганьбою?"
 league_collapse.53.a: "«Прощавай, Суню...»"

 league_collapse.54.t: "Поширення непокори"
 league_collapse.54.d: "За відсутності маршала Ліги весь ранок надходять нескінченні телеграми, які під безперервне дзеленчання телефонів у палаці малюють картину стрімкого занепаду ситуації по всій Лізі. Через чутки про скорочення або невиплату платні солдати в Сюйчжоу, Наньчані, Цюаньчжоу та кількох інших містах або відмовляються виконувати накази, або відверто приєднуються до погромів і мародерства, тоді як поліція та гарнізони в Ханчжоу й Усі оголосили страйк.\n\nЗаворушення там та в інших місцях поступово виходять з-під будь-якого контролю, що посилюється недієздатністю Сунь Чуаньфана. Ба більше, губернатор Чень Ї знову припинив виходити на зв'язок із Нанкіном, а наша розвідка фіксує його дедалі частіші контакти з губернатором Чень Тяоюанем. Солдатів, що охороняли північні кордони Цзянсу, відкликали до Нанкіна, а губернатори Ден і Чжоу доповідають про перехід цілих підрозділів на бік Ґоміньдану.\n\nЩе більше непокоїть те, що телеграфні лінії на південь від Фуцзяні, схоже, перерізані, тож Ліга опинилася в повній невідомості щодо ситуації в Ґуанчжоу та Ґуансі, яка напевне погіршується. Губернатор Хунані Чжао неохоче висловив співчуття через трагедію із Сунь Чуаньфаном, але навідріз відмовився від будь-якої офіційної підтримки в цей важкий час. А що ж сам Нанкін? Він фактично охоплений полум'ям революції. Найближче оточення маршала Ліги гарячково намагається створити регентську раду, але в губернатора Ці можуть бути інші плани..."
 league_collapse.54.a: "Маршал Сунь має якнайшвидше прийти до тями..."

 league_collapse.55.t: "Імперський флот тікає на північ!"
 league_collapse.55.d: "Оскільки Шаньдун опинився під контролем ворожих сил, які сплюндрували порт Яньтай, а Ціндао та Вейхайвей перебувають під де-факто контролем німецької колоніальної адміністрації, на землях під прямим управлінням Центрального уряду немає жодного належного порту для базування Бейянського флоту. Через це після завершення Чжилі-Фентянських воєн флот перевели до Наньтуна, що формально входив до складу Ліги.\n\nКоли місто охопили бунти, заворушення та хаос, спричинені розпадом Ліги, міністр військово-морських сил адмірал Са Чженьбін отримав наказ вивести флот із міста та вирушити на північ, до невеликих портів поблизу Тяньцзіня. Утрата нанкінських доків залишила флот без домівки та суднобудівних потужностей, необхідних бодай для належного обслуговування кораблів.\n\nЗвертаючись до Нефритового маршала, Са Чженьбін і Ян Шучжуан наголосили, що адміралтейству вкрай потрібні порти Шаньдуна, Чжецзяну або Фуцзяні, якщо воно має захищати морські рубежі Китаю."
 league_collapse.55.a: "«Із цим доведеться зачекати, панове»."

 league_collapse.56.t: "Заворушення дісталися палацу маршала"
 league_collapse.56.d: "Поки підлеглі маршала Ліги марно намагаються вибудувати бодай якусь подобу авторитету, який мав Сунь Чуаньфан, численні місцеві та провінційні чиновники, благаючи Нанкін про вказівки, опинилися покинутими напризволяще. Поліція Нанкіна виявилася безсилою перед хвилею бунтів, що охопили столицю: радикально налаштовані офіцери переходять до губернатора Чень Тяоюаня або байдикують, а містяни приєднуються до погромів — грабують і палять будинки, крамниці, а тепер уже й урядові установи.\n\nПоспішне прибуття елітних, вишколених німцями підрозділів під командуванням губернатора Ці Сєюаня, який пильно стежив за подіями, схоже, врятувало палац маршала від розгрому революціонерами. Але гуркіт полум'я та шум розлюченого натовпу чутно навіть у покоях, де в глибокій комі лежить Сунь Чуаньфан. Його найближчі соратники, щодня навідуючи маршала, не стримують сліз, благаючи його непритомне тіло прокинутися й навести лад, як він робив завжди.\n\nТі ж, хто служив лише заради власної вигоди, уже кинулися навтьоки. Немов щури з тонучого корабля, нечисті на руку чиновники розбігаються провулками, набивши кишені сріблом, паперами та викривальними урядовими таємницями."
 league_collapse.56.a: "Що ж нам робити?"

 league_collapse.57.t: "Ілюзія гегемонії Цін розсипається"
 league_collapse.57.d1: "Ширма китайської єдності, що трималася майже десятиліття, почала розвалюватися.\n\nНаростаючі заворушення в Лізі восьми провінцій, економічний шок від Чорного понеділка, який передвіщає відхід Німеччини, та нездатність"
 league_collapse.57.d2: "$league_collapse.57.d1$ національного уряду рішуче відповісти на ці виклики чітко засвідчили одне: монополію Пекіна на владу зламано"
 league_collapse.57.d_qie: "$league_collapse.57.d1$ нашого уряду впоратися з кризою чітко засвідчили одне: нашу монополію на владу зламано. Тепер ми мусимо якось долати цей хаос."
 league_collapse.57.d_fng: "$league_collapse.57.d2$.\n\nТакої чудової нагоди для удару на південь іще не було, але чи готовий Північний Схід?"
 league_collapse.57.d_anq: "$league_collapse.57.d2$.\n\nМожливо, ми зможемо перетворити цей шанс, який почався з гри на суперечностях між Пекіном і Нанкіном, на щось значно більше. Настав час кинути жереб."
 league_collapse.57.d_shd: "$league_collapse.57.d2$.\n\nМожливо, ми зможемо врятувати китайський народ із нашої скромної провінції Шаньдун? Армії та ополчення на півдні, мабуть, утомилися від своїх навіжених проводирів, а простий люд благає нас про захист."
 league_collapse.57.d_szc: "$league_collapse.57.d2$.\n\nСтарий порядок, на якому тримався наш союз сичуанських мілітаристів, зруйновано, і майбутнє тепер справді непевне."
 league_collapse.57.d_sik: "$league_collapse.57.d2$.\n\nУтім, поки наша влада в безпеці, це не має особливого значення."
 league_collapse.57.d_tib: "$league_collapse.57.d2$.\n\nМайбутнє туманне, але час для пошуків нашого Далай-лами невблаганно наближається."
 league_collapse.57.d_mon: "$league_collapse.57.d2$.\n\nМожливо, настав час знову поглянути на так звану «Внутрішню Монголію», де багато монголів досі перебувають під гнітом ханьських панів."
 league_collapse.57.d_jap: "$league_collapse.57.d2$.\n\nСитуація на континенті рішуче змінилася на користь Імперії."
 league_collapse.57.d: "$league_collapse.57.d2$, і тепер майбутнє відкрите для кожного."
 league_collapse.57.a: "Добром це не скінчиться..."
 league_collapse.57.b: "Китай нарешті розколотий."
 league_collapse.57.c: "Кінець епохи."

 league_collapse.58.t: "Повстання у Фуцзяні!"
 league_collapse.58.d: "Давня перепона для стабільності Ліги — так зване «Міньганське повстання» — укотре продемонструвало вражаючу живучість. Виникнувши після відступу Тан Шенчжі під час Північного походу, коли його 8-ма армія об'єдналася із залишками 4-ї армії Національно-революційної армії, Міньганське повстання після невдалого Шанхайського повстання 1932 року перетворилося на фактичну владу в кількох районах.\n\nКоли знаменитий «Червоний Наполеон» Ден Яньда та мадам Сун Цінлін приєдналися до своїх соратників у Фуцзяні та Цзянсі, НРА довела, що є грізним ворогом, зірвавши наші операції оточення, розроблені німцями та втілені губернаторами Чжоу Їньженем і Ден Жучжо.\n\nДо палацу надходять повідомлення, що ті самі повстанці Ґоміньдану, які борються за ідеали шанованого доктора Сунь Ятсена, розпочали масове загальне повстання в провінції Фуцзянь. Спустившись із гір і вийшовши зі схованок, вони захопили низку сіл у глибині провінції. Міньганська повстанська зона завжди становила небезпеку, але була ізольованою та самотньою.\n\nПроте на тлі хаосу, що охопив Лігу, існує велика ймовірність, що вони прорвуться до узбережжя, відкривши шлях для допомоги від своїх союзників-синдикалістів та повернення Ван Чжаоміна з паризького вигнання. Наразі відомо, що губернатор Чжоу тримає кілька дивізій у Цюаньчжоу та навколо нього, але цього навряд чи вистачить, аби стримати революційну хвилю. Водночас лояльні до Ґоміньдану війська підняли повстання на кордоні з Шанхайським сеттльментом, загрожуючи самому серцю нашої влади. Хоча їх, імовірно, знищать сили губернатора Ці."
 league_collapse.58.a: "Синдикалістське поріддя!"
 league_collapse.58.b: "(Грати за Ґоміньдан)"

 league_collapse.59.t: "Губернатор Ці перебирає владу"
 league_collapse.59.d: "Усе ще позбавлена будь-якої легітимної центральної влади, Ліга поринула у смертельне піке розпаду своїх окремих частин. Залишені напризволяще без керівництва з Нанкіна, регіони охоплені бурями: надходять повідомлення про критичне становище у Фуцзяні та Цзянсі, нарощування військ в Аньхої, катастрофу в Шаньдуні та повсюдний хаос. Негласно перебравши на себе обов'язки маршала Ліги після того, як Сунь упав у кому, губернатор Цзянсу Ці щосили намагався зупинити цю кровотечу. Проте через брак формальних повноважень для командування іншими губернаторами його дії виявилися малоефективними.\n\nЗібравшись за зачиненими дверима у відносній безпеці маршальського палацу, губернатор Ці скликав воєначальників: Ма Юйженя, Се Хунсюня, Чжен Цзюньняня, Мен Чжаоюе, Ван Хаоцзі, Чжоу Фенці, Лі Баочжана та Лю Цзунцзі. Поруч із ними були інтелектуали та чиновники: Тан Ерхе, Лі Ліньсі, Дін Веньцзян, Вей Даофен, Ян Венькай і, звісно ж, права рука Ці — Тянь Веньбін. Зібравши всіх найважливіших і доступних діячів Ліги в тій самій залі, де нещодавно засідали губернатори, мало хто сумнівався в тому, що саме збирається запропонувати губернатор Ці.\n\nВисунувши присутнім офіційну петицію про проголошення себе виконувачем обов'язків маршала Ліги за відсутності офіційного спадкоємця, губернатор Цзянсу нарешті відкрив карти. У залі миттєво спалахнув хаос: генерали Се Хунсюнь, Лі Баочжан та Мен Чжаоюе відкрито звинуватили Ці в організації замаху на Суня. Ян Венькай додав, що нападниця мала при собі німецький пістолет. Поглянувши на Тяня, Ці кивнув своєму підлеглому, і той на мить вийшов із зали. Невдовзі він повернувся в супроводі китайських солдатів, озброєних та екіпірованих за німецьким зразком.\n\nВийшовши із засідання та оголосивши себе виконувачем обов'язків маршала Ліги, Ці Сєюань заявив про намір відновити порядок у розколотій Лізі. Його війська вже почали брати під контроль нанкінський арсенал, військовий штаб і головні магістралі, оголошуючи через гучномовці про його прихід до влади та зачищаючи вулиці шквальним гвинтівочним вогнем. Міста вздовж більшої частини Нижнього Янцзи вже висловили підтримку Ці, а губернатори Ден і Чжоу погодилися з новим станом речей. Утім, губернатор Чень Ї вагається з визнанням, тоді як Чень Цзюнмін, Лу Жунцін і Чжао Хенті навідріз відмовилися визнавати ці новини."
 league_collapse.59.a: "Фактично державний переворот?"

 league_collapse.60.t: "Нерішучість і бездіяльність"
 league_collapse.60.d: "Рішення Центрального уряду не підтримувати ані Лігу, ані повстання проти концесій у Війні за Лігу перетворило народні заворушення останніх тижнів на справжню анархію. Початкове мовчання маршала та президента породило перші міські протести, підігріті журналістами й інтелектуалами. Попри вимоги втрутитися на боці противників концесій, мовчанка уряду тривала. У результаті нечисленні зібрання переросли у велелюдні вуличні демонстрації — вир народного гніву, викликаний кровопролиттям на Янцзи.\n\nПісля кількаденних таємних нарад було вирішено, що реакція необхідна. Сидячи перед мікрофоном, коли сотні тисяч слухачів по всій країні припали до приймачів, президент Цао Кунь із неприхованою неохотою оголосив, що уряд не надасть підтримки ані Ці Сєюаню, ані Чень Тяоюаню через невдоволення діями обох діячів.\n\nОскільки протести переросли в полум'я відкритої непокори, Пекін та інші великі міста опинилися повністю паралізованими заворушеннями. Коли і німці, і власний народ налаштовані проти уряду, асамблею охопив розпач. Майже тотальний осуд уже призводив до нашого падіння раніше, і це цілком може повторитися. Хоча військову поліцію під командуванням Ван Юйцзя відправили наводити лад, подальше загострення ситуації — лише питання часу."
 league_collapse.60.a: "А ми ж гадали, що засвоїли урок..."

 league_collapse.61.t: "Момент істини"
 league_collapse.61.d: "Коли напруженість між губернатором Чень Тяоюанем і маршалом Ці Сєюанем сягнула апогею, постійні сутички переросли у відкриту битву вздовж Янцзи на околицях Нанкіна. Перший бій закінчився перемогою армії Ліги, після чого губернатор Чень розпочав повномасштабний наступ, узгоджений із повстаннями в Міньганській зоні та можливою інтервенцією з провінції Шаньдун.\n\nТепер, коли Війна за Лігу в повному розпалі, для Нефритового маршала та президента Цао настав час виконати зобов'язання перед маршалом Ліги Ці Сєюанем і підтримати відновлення порядку й влади в провінціях Ліги."
 league_collapse.61.a: "Ми виступаємо на відновлення порядку!"

 league_collapse.62.t: "Драма в асамблеї"
 league_collapse.62.d: "Приставши на пропозицію Цао Куня щодо втручання у Війну за Лігу на боці самої Ліги, багато хто в асамблеї та керівних колах Чжилі чудово розумів непопулярність такого кроку. Попри збурення широких верств населення інтелектуалами-антиконцесіонерами, непокору Чень Тяоюаня та антиімперіалістичні настрої, які вирували роками, було вирішено перечекати бурю заради збереження особливих відносин із Німеччиною.\n\nОтримавши невдячне завдання оголосити про інтервенцію в асамблеї, Цао неохоче зібрав засідання, аби офіційно затвердити допомогу Лізі. Стоячи поруч із міністрами Гао Лінвеєм та Ван Кемінем, Цао почав: «Мої дорогі й шановні друзі, я зібрав вас сьогодні тут, щоб повідомити вкрай важливі новини щодо рішення уряду стосовно заворушень на Півдні». Асамблея затамувала подих, і він продовжив: «Маршал У, його штаб та кабінет міністрів вирішили підтримати маршала Ліги Ці Сєюаня в його боротьбі проти бунтівної провінції Аньхой та її зрадливого губернатора Чень Тяоюаня. Наш обмежений контингент уже вирушає на південь, і ми очікуємо швидкої, рішучої та повної перем...».\n\nЦао замовк, коли депутати від Молодіжної партії Китаю підвелися й мовчки попрямували до виходу. Слідом за ними рушили члени Товариства реформ Китайської імперії, незалежні депутати й навіть окремі представники партії «Цзунше». Спохмурнівши, Цао окинув поглядом нечисленних членів Товариства гармонії та Ліги процвітання, що залишилися в залі. Приголомшений, він опустив папери."
 league_collapse.62.a: "Гнітючий тягар на його сумлінні."

 league_collapse.63.t: "Дари Ліги процвітання"
 league_collapse.63.d: "Виходячи із зали асамблеї з сумішшю люті та збентеження, президент роздратовано роздавав накази помічникам і міністру Гао, намагаючись знайти спосіб покарати бунтівних політиків. Проте на виході його одразу обступили репортери та члени Ліги процвітання.\n\nПоспішаючи привітати президента, вони піднесли різноманітні розкоші німецького економічного світу. Цао та його депутатам пропонували рейнські вина, кубинські сигари та інші заморські делікатеси. Проте, зустрівши лише холодні погляди та зневагу, мало хто оцінив цю «процвітаючу» щедрість.\n\nНа відміну від зазвичай похмурих маньчжурських дворян, німецькі чиновники та представники клептократії Південного Чжилі щиро вітали президента, хизуючись найновішим берлінським вбранням і осипаючи депутатів Товариства гармонії ще дорожчими дарунками. Ван Ченбінь та військові з фракції Цао поспішили відвести президента геть, рятуючи його від незручного становища."
 league_collapse.63.a: "Зневага від нації, зневага від народу."

 league_collapse.64.t: "Момент істини"
 league_collapse.64.d: "Коли напруженість між губернатором Чень Тяоюанем і маршалом Ці Сєюанем сягнула апогею, постійні сутички переросли у відкриту битву вздовж Янцзи на околицях Нанкіна. Перший бій закінчився перемогою армії Ліги, після чого губернатор Чень розпочав повномасштабний наступ, узгоджений із повстаннями в Міньганській зоні та можливою інтервенцією з провінції Шаньдун.\n\nТепер, коли Війна за Лігу в повному розпалі, для Нефритового маршала та президента Цао настав час виконати зобов'язання перед губернатором Чень Тяоюанем і розпочати обмежену інтервенцію на підтримку руху проти концесій."
 league_collapse.64.a: "Наші війська вирушають на південь захищати Китай!"

 league_collapse.65.t: "Народна підтримка президента та маршала"
 league_collapse.65.d: "Після рішення президента Цао та маршала У виступити проти Ліги восьми провінцій, сам Цао вирішив публічно виступити з промовою щодо позиції та намірів уряду. Хоча сам Цао мав певні сумніви щодо остаточного спалення мостів із Німеччиною, він непохитно виконує свій президентський обов'язок.\n\nПід час звернення з балкона Забороненого міста до натовпу внизу поруч із Цао стояли Імператор, його брат Пуцзє та сам У Пейфу. На відміну від багатьох інших виступів на цьому місці, цю промову транслювали по радіо — уперше в історії Китаю.\n\nЗі сталевою рішучістю президент Цао закликав громадян Китаю до єдності: «Ціле століття приниження ми страждали й мучилися під іноземним гнітом! Надто довго ми були покірними слугами забаганок британців, японців, французів та німців! Але годі! Сьогодні ми відкрито кидаємо виклик, скидаючи кайдани імперіалістів і роблячи перший крок до справжньої незалежності! Ми більше не будемо в залізних пазурах кайзера! Ми більше не терпітимемо зневаги, і китайці більше ніколи не будуть людьми другого сорту у власному домі! Оголошую раз і назавжди: Китай знову вільний!»\n\nПід гучні оплески, радісні вигуки та звуки сурм уривки промови з портретами Цао та У з'явилися в газетах, листівках і журналах по всій країні. Так само інтелектуальні товариства та клуби висловили підтримку нашому режиму."
 league_collapse.65.a: "Вільний Китай, вільний від імперіалізму!"

 league_collapse.66.t: "Пекінська комісія залишає Пекін!"
 league_collapse.66.d: "Одразу після запальної промови президента Цао над вулицями біля німецького посольства та офісів Пекінської комісії (Peking-Kommission) здійнялися стовпи диму. Біля воріт зібрався величезний натовп, який скандував гасла проти концесій і спалював німецький одяг, меблі та навіть поспіхом зроблене опудало кайзера.\n\nКоли військова поліція прибула, аби не допустити дипломатичного скандалу, німецькі чиновники з Пекінської комісії через своїх представників у Лізі процвітання оголосили асамблеї про негайне згортання роботи Комісії та припинення більшості програм підтримки уряду.\n\nХоча це завдало відчутного удару по відносинах із Німеччиною та викликало тривогу в президента Цао й міністра Гао Лінвея, ще сильніше постраждала Ліга процвітання в асамблеї. Утративши головного покровителя та джерело фінансування, значна частина її депутатів перейшла до Кліки політичної науки, що призвело до посилення позицій незалежних лібералів із середнього класу."
 league_collapse.66.a: "Невелика ціна за порятунок нації."

 league_collapse.67.t: "[QIE.GetNameDefCap] обіцяє підтримку"
 league_collapse.67.d: "Ліга ослабла: згарища вказують на місця, де німецькі багатії бенкетували з нанкінськими чиновниками, чиї армії тепер дезорганізовані та гризуться між собою. Наші війська мають не лише мужність і відданість для досягнення мети, а й підтримку самого великого У Пейфу, а з ним — і Імперської армії. Усі фігури розставлено: настав час покласти край існуванню Ліги. Немов фенікс із попелу, Чень спостерігатиме за відродженням Китаю!"
 league_collapse.67.a: "Мобілізувати війська!"

 league_collapse.68.t: "Зустріч із Фентянем"
 league_collapse.68.d: "Діючи через закулісні зв'язки та мережу товариства «Чорний дракон», [ANQ.GetLeader] зумів налагодити контакт із [FNG.GetNameDef]. Хоча вплив японців на уряд Фентяня перетворює на фарс антиконцесійні обіцянки Ченя, він чудово розуміє безвихідь свого становища: вимога визнати Фентянь єдиним законним урядом Китаю є цілком прийнятною ціною за життєво необхідну допомогу.\n\nТепер, коли перша партія золота та стрілецької зброї прибула до Аньціна, підтвердивши серйозність намірів Фентяня, а нанкінські сили готуються до вторгнення, час для зволікань вичерпано. Ми вдаримо першими й завдамо нищівного удару, аби німецькі прихвосні на узбережжі більше ніколи не гнобили Китай!"
 league_collapse.68.a: "Оголосити війну Лізі!"

 league_collapse.69.t: "Чень підтримує Фентянь"
 league_collapse.69.d: "Розпад Ліги восьми провінцій Сунь Чуаньфана спричинив масштабний хаос у Китаї, і коли регіон стрімко поринув у вир повномасштабної війни, [ANQ.GetLeader], очільник [ANQ.GetNameDef], був змушений шукати допомоги за межами Пекіна. Його рішення визнати Фентянь законним урядом Китаю завдає відчутного удару по німцях та їхніх маріонетках із Цін. Уклавши союз із [FNG.GetLeader], [ANQ.GetLeader] став нашим союзником, хоча його позиція проти концесій створює перешкоди для співпраці та ставить під сумнів його користь для японських інтересів. Утім, негласна підтримка Ченя послабить наших ворогів і зміцнить союзників — а це цілком виправдана мета."
 league_collapse.69.a: "Ми спостерігатимемо за цим із зацікавленням."

### Section 3 - League War Defections AND beginnings and secessions of HNN and GXC ###

 #league_collapse.100 is a hidden event

 league_collapse.101.t_1: "Губернатор Чень зберігає вірність!"
 league_collapse.101.t_2: "Губернатора Ченя повалено!"
 league_collapse.101.d_1: "Схоже, наші маневри в Чжецзяні принесли бажаний результат! Губернатор Чень Ї, який хоч і тримався відчужено, проте залишався надійним діячем, запевнив маршала Ліги Ці у своїй непохитній підтримці Ліги восьми провінцій. Чи то розчарувавшись у бунтівних витівках Чень Тяоюаня, чи цінуючи стабільність у провінції, яку може гарантувати лише усталений політичний лад, Чень Ї та його чжецзянська кліка знову мобілізували свої частини на захист Ліги.\n\nБа більше, командувач Шанґуань Юньсян, дислокований у Чжецзяні, відгукнувся на заклик Чень Ї й зосередив війська на підступах до Цзіньхуа. Його підрозділи мають намір рушити на захід, аби захопити столицю провінції Аньхой і вкотре відновити порядок у Лізі. Утім, нам варто бути пильними: вступ Чжецзяну у війну робить провінцію вразливою для можливого наступу сил Ґоміньдану або Аньхойської армії."
 league_collapse.101.d_2: "Схоже, наші маневри в Чжецзяні увінчалися успіхом! Генерал Шанґуань Юньсян, який хоч і тримався відчужено, проте виявився надійним діячем, запевнив маршала Ліги Ці у своїй непохитній відданості Лізі восьми провінцій. Чи то з огляду на бунтівні дії Чень Тяоюаня, прагнення зберегти регіональну стабільність через усталений порядок, чи просто піддавшись на наші щедрі обіцянки, Шанґуань та його підлеглі мобілізували війська й повалили губернатора Чень Ї.\n\nІз захопленням столиці провінції Ліга офіційно встановила повний контроль над Чжецзяном. Завдяки закріпленню його сил довкола Ханчжоу вдалося зберегти надійний південний коридор до Фуцзяні та Цзянсі, тож губернатори Ден і Чжоу тепер можуть зітхнути з полегшенням.\n\nПроте нам не слід втрачати пильності: вступ Чжецзяну у війну на тлі перегрупування чжецзянської кліки робить провінцію відкритою для наступу армій Ґоміньдану, Чжецзяну або Аньхою."
 league_collapse.101.a: "Блискуча робота!"

 league_collapse.102.t_1: "Шанґуань піднімає повстання в Чжецзяні"
 league_collapse.102.t_2: "Чень Ї піднімає повстання в Чжецзяні"
 league_collapse.102.d_1: "Шанґуань Юньсян, один із найздібніших генералів Сунь Чуаньфана, у цей критичний момент перейшов на бік Аньцінської кліки. Його сили згрупувалися довкола Цзіньхуа й готуються рушити на північ, аби здобути столицю провінції — Ханчжоу — та вибити звідти частини [LEP.GetLeader]. Шанґуань здавна обурювався керівництвом Чень Ї, і в разі нашої перемоги він із високою ймовірністю вимагатиме посаду губернатора Чжецзяну замість свого колишнього командира."
 league_collapse.102.d_2: "Як і було обіцяно, губернатор провінції Чжецзян Чень Ї повстав і приєднався до наших сил! За його підтримки ми встановили контроль над Ханчжоу, що дає нам вихід до порту для отримання вантажів із Фентяня та таємних японських поставок. Утім, коридор Аньцін — Ханчжоу ще далекий від безпеки, залишаючись легкою здобиччю для переважаючих сил [LEP.GetLeader]."
 league_collapse.102.a: "Наш союзник стає в стрій."

 #Shangguan Yunxiang joins Anqing:
 league_collapse.103.t_1: "Генерал Шанґуань піднімає повстання в Чжецзяні!"
 #Chen Yi joins Anqing:
 league_collapse.103.t_2: "Губернатор Чень Ї піднімає повстання в Чжецзяні!"
 league_collapse.103.d_1: "Будучи відстороненим, майже ізоляціоністським губернатором у складі Ліги, Чень Ї твердою рукою правив однією з найбагатших і найприбутковіших провінцій країни. Проте до самої Ліги він ніколи не мав щирої прихильності, а його вірність трималася виключно на особистій дружбі з Сунь Чуаньфаном. Зберігаючи тривожний нейтралітет останніми місяцями, він нарешті розкрив карти.\n\nНаголошуючи на необхідності захисту порядку та стабільності не лише в Чжецзяні, а й у всіх інших провінціях, губернатор Чень разом із виконувачем обов'язків маршала Ліги рішуче засудив підступне захоплення влади Чень Тяоюанем, звинувативши того в роздмухуванні пожежі, яка привела зазвичай пильного Сунь Чуаньфана до фатальної слабкості.\n\nЦя новина спричинила значне обурення в провінції, де губернатор ніколи не користувався особливою любов'ю підлеглих. Попри це, за ним стоїть когорта найздібніших і найталановитіших офіцерів Ліги, що стане вагомою підтримкою для виконувача обов'язків маршала. Проте генерал Шанґуань Юньсян, заявивши про свавілля з боку начальства, підняв гарнізон Ханчжоу та підпорядковані частини на підтримку Чень Тяоюаня і пішов проти губернатора Чень Ї.\n\nПоки Чень зміцнює центр міста та очікує на підкріплення, стає очевидно, що саме давні й безсоромні амбіції Шанґуаня підштовхнули його до зради. Стрімке поширення непокори викликає дедалі більшу тривогу."
 league_collapse.103.d_2: "Будучи відстороненим, майже ізоляціоністським губернатором у складі Ліги, Чень Ї твердою рукою керував однією з найбагатших і найприбутковіших провінцій країни. Проте Лізі він ніколи щиро не симпатизував, тримаючись лише завдяки особистій дружбі з Сунь Чуаньфаном. Зберігаючи непевний нейтралітет останніми місяцями, він нарешті зробив свій вибір.\n\nВикористовуючи зв'язки та спираючись на прихильність до руху проти концесій, губернатор Чень Ї приєднався до Чень Тяоюаня в його засудженні як виконувача обов'язків маршала Ліги, так і загального становища в ній. Зібравши сили в Чжецзяні, Чень звинуватив маршала Ліги Ці в організації невдалого замаху на Сунь Чуаньфана.\n\nОголосивши про офіційне відокремлення від Ліги восьми провінцій, Чень Ї об'єднав війська з губернатором Ченем і розпочав відкриті бойові дії проти Ліги. Чень — здібний воєначальник, оточений видатними мислителями й стратегами Ліги. Хоч рядові бійці не плекають до нього великої любові, його офіцери мають авторитет, а перехід Чжецзяну на бік Аньхою повністю відрізав Нанкін від провінцій Цзянсі та Фуцзянь.\n\nГенерал Шанґуань Юньсян, який уже веде активні дії в регіоні, зі свого боку запевнив маршала Ліги Ці в абсолютній вірності та готовності розбити губернаторів-зрадників. Знаючи його непомірні апетити, можна не сумніватися: за свої старання Шанґуань розраховує отримати значно більше, ніж просто медаль."
 league_collapse.103.a: "Кляті чжецзянці!"

 league_collapse.104.t: "«Дурник» оголошує війну"
 league_collapse.104.d: "Прихід губернатора Ці на посаду виконувача обов'язків маршала Ліги більшість зустріла вкрай вороже. Пекін, намагаючись упоратися з власними негараздами, утримується від коментарів, тоді як влада в провінціях коливається від невизнання повноважень Ці до прямого звинувачення його в зраді та узурпації. Деякі періодичні видання вже проводять паралелі між його приходом до влади в Лізі та раптовим призначенням наступником губернатора Лі Чуня у 1920-х роках після загадкового «самогубства» останнього.\n\nУтім, Ці не гаяв часу й одразу взявся брязкати зброєю, вимагаючи покори від усіх губернаторів, які досі не склали йому присяги. Погрожуючи швидкою розправою кожному, кого вважає зрадником, він марно вимагав визнання від Хунані, Ґуандуну та Ґуансі. Ба більше, він прямо погрожував Чень Ї вторгненням заради забезпечення лояльності Чжецзяну. Проте найжорсткіші вимоги були висунуті непокірному губернатору Чень Тяоюаню.\n\nВідколи Чень неофіційно відокремився та мілітаризував кордон із Лігою, мало хто розумів його справжні наміри. Чи вичікував він слушної нагоди для удару по Нанкіну, чи лише захищав власні володіння від хвилі хаосу? Проте коли маршал Ліги Ці зажадав від Ченя повної покори, той відповів власним ударом.\n\nЗвернувшись до інших губернаторів і Центрального уряду по допомогу, Чень Тяоюань оголосив самопроголошення маршала Ці «абсолютно нелегітимним фарсом», звинувативши того в завчасному плануванні замаху на Суня та подальшому захопленні влади. Ця позиція, яку поділяють багато колишніх керівників і нових підлеглих Ці, виявилася вельми переконливою: низка молодих офіцерів уже почала переходити до лав бунтівників. Одночасно підрозділи Аньхойської армії перетнули кордони Цзянсі та Цзянсу, маючи намір підпорядкувати Нанкін своїй владі."
 league_collapse.104.a: "Нестерпне свинство!"

 league_collapse.105.t: "Лянґуан виходить зі складу Ліги!"
 league_collapse.105.d: "Зберігаючи зловісне мовчання під час останніх подій, регіон Лянґуан уже давно стояв осторонь усієї системи Ліги. Свого часу Південне та Північне Чжилі постійно сперечалися за призначення власних ставлеників у Ґуансі та Ґуандуні. Коли Стару кліку Ґуансі під проводом старіючого Лу Жунціна Пекін визнав із великим небажанням, боротьба за посаду губернатора Ґуандуну тривала без правил аж до повернення Чень Цзюнміна. Після відступу військ Ліги з провінцій Лянґуану внаслідок Шанхайського повстання 1932 року вона більше ніколи не мала реального впливу на Ґуандун чи Ґуансі, окрім формальної лояльності.\n\nСьогодні ввечері мовчанку Півдня було офіційно розірвано: у спільній заяві губернатор Чень Цзюнмін та генерал Лу Юйґуан (від імені свого літнього батька) оголосили про офіційний вихід зі складу Ліги восьми провінцій, причому рішення набуває чинності негайно. Губернатор і генерал засудили «зневагу Ліги до прав і потреб народу» та піддали гострій критиці виконувача обов'язків маршала, утримавшись, утім, від прямого оголошення війни.\n\nОскільки губернатор Чень Тяоюань та його Аньхойська армія вже ведуть відкриті бойові дії проти Ліги, такий розвиток подій став катастрофічним і за інших обставин вимагав би рішучої відповіді. Проте зараз руки у виконувача обов'язків маршала Ліги Ці вочевидь зв'язані."
 league_collapse.105.a: "Незабаром ми загасимо їхнє полум'я."

 league_collapse.106.t: "Хунань виходить зі складу Ліги!"
 league_collapse.106.d: "Будучи найбільш автономною провінцією Ліги, Хунань пильно вичікувала з самого початку цього року. Відновлений на посаді зусиллями У Пейфу губернатор Чжао Хенті приєднався до Ліги виключно заради матеріальної підтримки для наведення ладу в рідному краї. Провінція помітно дистанціювалася ще у 1932 році після тривожних подій, коли частини генерала Є Кайсіня підійшли до кордону Цзянсі, аби не пустити соціалістів до Хунані. Завдяки втручанню Нефритового маршала Хунань виборола достатню автономію, що дозволило тримати наші війська поза її межами, і відтоді наш контроль лише слабшав.\n\nПроте після відокремлення Лянґуану губернатор Чжао вирішив, що настав час діяти. Будучи переконаним демократом, він подав до провінційної асамблеї законопроєкт про офіційний вихід із Ліги. Особисто захищаючи документ, Чжао виступив із промовою про те, що Хунань більше не може терпіти корупцію Ліги, яка виявилася нездатною гарантувати бодай якусь стабільність, і що без негайного розриву полум'я війни поглине всю провінцію.\n\nЦі слова справили сильне враження на асамблею: абсолютна більшість депутатів проголосувала за вихід, після чого губернатор Чжао офіційно оголосив усі домовленості Хунані з маршалом Ліги недійсними. Хоча нам і хотілося б покарати Хунань за таку непокору, армія Ченя просто на нашому порозі змушує нас терпіти це свавілля місцевого губернатора — принаймні зараз."
 league_collapse.106.a: "Нехай тішаться автономією, поки мають таку змогу."

### Section 4 - Flavour Events About the Collapse ###

 league_collapse_flavour.1.t: "Продаж Чжеганської залізниці"
 league_collapse_flavour.1.d: "Протягом останніх кількох тижнів спостерігалося неабияке економічне пожвавлення в Лізі восьми провінцій — південному об'єднанні провінцій під проводом нашого номінального підлеглого Сунь Чуаньфана. Ліга, яка ще дужче за нас залежить від німецької фінансової підтримки, щойно завершила будівництво стратегічної залізниці — Чжеганської лінії. Хоча кошти надали німці, будували її переважно китайські робітники, що вселило в багатьох надію на більш рівноправні відносини між німцями та китайцями в Лізі, принаймні в економічній сфері.\n\nКілька днів тому AOG несподівано публічно оголосила про намір викупити та об'єднати низку східних залізниць на користь своєї дочірньої компанії Schantung-Eisenbahn-Gesellschaft — включно з новозбудованою Чжеганською магістраллю.\n\nЦей крок обурив місцевих китайських жителів Ліги, які бачили в Чжеганській лінії фундамент для майбутнього рівноправного партнерства між європейцями та азійцями. Спалахнули масові протести, підігріті чутками про шахрайство та розкрадання коштів поплічниками Суня."
 league_collapse_flavour.1.a: "Ми маємо пильно стежити за цим."

 league_collapse_flavour.2.t: "Масові напади на іноземців"
 league_collapse_flavour.2.d: "Унаслідок заворушень довкола Чжеганської залізниці низка німецьких інвесторів і підприємців зазнала жорстоких нападів з боку розлючених антиіноземних натовпів. Ситуацію погіршив масовий бойкот німецьких товарів на Півдні, а сьогодні вранці до Пекіна надійшли звістки про підриви залізничних станцій у Ханчжоу та інших містах Центральнокитайської залізниці. Рух транспорту в багатьох регіонах Ліги паралізовано, і партизани Ґоміньдану в Міньґані скористалися цією нагодою для здійснення зухвалих нападів на ізольовані гарнізони Ліги.\n\nНімецький посол у Пекіні зажадав покарання винних, і хоча Ліга має широку автономію, формально вона все ще перебуває під нашою егідою. Ван Ченбінь та інші високопосадовці Чжилі вже давно наполягали на посиленні контролю над Лігою і тепер закликають У скористатися кризою, аби розширити вплив на південь. У, який давно шукав привід приборкати Суня, наразі складає текст телеграми, де вимагає звіту та пропонує нашу допомогу в разі потреби. Звісно ж, мовчазною умовою прийняття допомоги є поступка контролем над справами Ліги."
 league_collapse_flavour.2.a: "Погляньмо, що відповість Сунь..."

 league_collapse_flavour.3.t: "Інцидент у Вуху"
 league_collapse_flavour.3.d: "Сьогодні вранці до Лояна та Пекіна надійшли тривожні звістки. Хоча повідомлення дещо суперечливі, схоже, що в місті Вуху сталася різанина мирних протестувальників силами Ліги та німецькими військами. Одні стверджують, що німці просто розстріляли мітингарів, інші — що група радикалів із Ґоміньдану першою атакувала німецькі частини та бійців Ліги. Хай там як, місто поринуло в анархію, а хвиля протестів прокотилася всією Лігою.\n\nЗа іронією долі, одночасно з цими новинами надійшов звіт від Сунь Чуаньфана, у якому той запевняє, що «повністю контролює ситуацію». Окремі генерали Чжилі, як-от Цай Ченсюнь, наполягають на негайному масштабному втручанні на півдні, якщо становище погіршиться, проте У поки що утримується від чіткої позиції, остерігаючись реакції Чжан Цзоліня.\n\nСитуацію ускладнює й те, що Бай Цзяньу попередив Нефритового маршала: Товариство реформ Китайської імперії якимось чином дізналося про події — імовірно, через зв'язки з прогресистами в посольському кварталі. Схоже, вони планують виступити сьогодні на засіданні асамблеї з нищівною промовою, критикуючи бездіяльність Чжилі. Депутати Товариства гармонії Цао Куня разом із президентом поспіхом готують відповідь, але нас вочевидь заскочили зненацька."
 league_collapse_flavour.3.a: "«Під контролем», як же..."

 league_collapse_flavour.4.t: "Аньхой виходить з-під контролю"
 league_collapse_flavour.4.d: "Провінція Аньхой, яка довгий час потерпала під тягарем автократичного правління Сунь Чуаньфана, цього тижня фактично проголосила незалежність від Ліги. У масовій листівці губернатор Чень Тяоюань заявив, що інцидент у Вуху «доводить нездатність Суня впоратися з кризою та фактично звільняє його від будь-яких повноважень щодо Аньхою».\n\nСяо Яонань, Ван Ченбінь та Лі Цзічень — губернатори Хубею, Чжилі та Хенані — в односторонньому порядку розпочали мобілізацію військ проти ймовірних «набігів Ґоміньдану». Втім, Чжан Ціхуан попередив У, що їхня справжня мета — не допустити поширення хаосу на Центральні рівнини, що може призвести до ескалації з Ченем, Сунем чи навіть [SHD.GetLeader]. Прагнучи унеможливити вторгнення та спалах нищівної війни на зразок тієї, що передувала Другій Чжилі-Фентянській війні, У оголосив сьогодні вранці «стан національної готовності» для всього штабу Бейянської армії, закликавши готуватися до «будь-яких збройних зіткнень», і перевів гарнізони на кордонах із Шеньсі та Фентянем у режим підвищеної боєготовності. Розгублені частини Чжилі здебільшого підкорилися наказу У, тож передчасний наступ на південь вдалося зупинити в зародку."
 league_collapse_flavour.4.a: "Сподіваймося, це втримає їх від необачних кроків"

 league_collapse_flavour.5.t: "Біженці рятуються від хаосу в Лізі"
 league_collapse_flavour.5.d: "У зв'язку з масовими заворушеннями в Лізі восьми провінцій губернатор Хенані Лі Цзічень і губернатор Хубею Сяо Яонань надіслали телеграми президенту Цао та маршалу У. Вони повідомили про наплив біженців до їхніх провінцій і звернулися з проханням про урядову допомогу. Хоча спершу це був лише струмок, за останні кілька днів потік колосально зріс: цілі родини тікають від жорстокого виру насильства та бандитизму.\n\nУ наступних телеграмах губернатори доповіли кабінету міністрів, що після реєстрації та опитування біженців з'ясувалося: влада в провінціях Ліги розвалилася куди сильніше, ніж вважалося раніше. Ба більше, вони запросили в Пекіна додаткове продовольство та припаси для розміщення втікачів. З огляду на бюрократичну неефективність, слабкість провінційної влади та брак коштів, будь-яка допомога від уряду вимагатиме колосальних витрат, навіть якщо це гуманний крок."
 league_collapse_flavour.5.a: "Жахливі новини. Відправте припаси."
 league_collapse_flavour.5.b: "З важким серцем ми мусимо відмовити."

 league_collapse_flavour.6.t: "Кривава бійня на Янцзи!"
 league_collapse_flavour.6.d: "Попри всі зусилля, потік біженців до південних провінцій виявився непосильним тягарем. Губернатори надіслали численні телеграми кабінету міністрів і президенту з проханням допомогти їхнім перевантаженим адміністраціям. Після оголошення воєнного стану в Хубеї губернатор Сяо Яонань наказав своїм військам перекрити всі мости й дороги з колишніх територій Ліги, заборонивши в'їзд усім біженцям. Величезний натовп виснажених, знедолених і розлючених людей зібрався біля мосту через річку Янцзи на околицях Уханя.\n\nВимагаючи пропустити їх до провінції, люди спочатку влаштували мирний протест із закликами до адекватних дій влади. Утім, ситуація швидко переросла в повномасштабний бунт: біженці почали чинити опір солдатам Сяо та закидати прикордонників камінням. Зрештою група чоловіків, які якимось чином розжилися викраденою зброєю — імовірно, через недбалість вартових, — відкрила вогонь по прикордонниках. Ті відповіли спершу попереджувальними пострілами, а згодом почали стріляти на ураження. Ті, хто не брав участі в сутичці, кинулися тікати, топчучи інших біженців і кидаючи рідних помирати на мосту. Подібні трагічні події повторюються вздовж усього нашого кордону з Лігою, Сичуанню та Шаньдуном: натовпи втікачів від громадянської війни та страждань потрапляють у нове кровопролиття."
 league_collapse_flavour.6.a: "Яка трагедія! Яке жахіття!"

 league_collapse_flavour.7.t: "Південні губернатори обривають зв'язок"
 league_collapse_flavour.7.d: "На тлі щоденної ескалації насильства в межах Ліги губернатори Юньнані та Ґуандуну, [YUN.GetLeader] та [GXC.GetLeader], майже припинили відповідати на офіційні запити уряду про стан справ у їхніх регіонах. Вони здавна зневажали наш уряд, виступаючи проти дій дрібних мілітаристів, які перебирають міру у владі, та корумпованих чиновників, нездатних тверезо оцінити стан речей — ба більше, не так давно губернатор [YUN.GetLeader] навіть вів війну в союзі з Фентянем. Хоча такий крок і не став несподіванкою в цих обставинах, він є останнім цвяхом у труну їхніх офіційних взаємин із нашим урядом.\n\nБагато хто у вузькому колі Чжилі побоюється, що це віщує повний крах нашого впливу, і новини з провінції Шаньсі лише підтверджують ці страхи. Зрадник Фен Юйсян, який колись сам був ключовою постаттю Кліки Чжилі, був вибитий із Пекіна у 1926 році. Опинившись у вигнанні в Шеньсі після того, як північно-західні губернатори Ма схаменулися, він на початку тижня публічно засудив дії нашого уряду в подіях, які за кордоном уже охрестили «Інцидентом на Янцзи» — маючи на увазі недавні події між провінціями Хубей, Хенань і нашими де-факто землями в Шаньдуні та Шеньсі.\n\nОголосивши наш уряд абсолютно недієздатним і «позбавленим права правити Китаєм», його номінальний союзник у Тайюані — наш відсторонений губернатор Янь Сішань — назвав це насильство варварством, проте утримався від персонального засудження кабінету міністрів, У чи Цао, вочевидь намагаючись зберегти нейтралітет. Хай там як, стає зрозуміло: державний порядок, здобутий такою важкою ціною, стрімко руйнується."
 league_collapse_flavour.7.a: "Величезне полум'я люті пожирає нас."

 #league_collapse_flavour.8 uses loc from league_collapse.57

 league_collapse_flavour.9.t: "Згасання Усміхненого Тигра"
 league_collapse_flavour.9.d: "Тіні вже давно нависли над покоями маршала Ліги. Безпорадно лежав Сунь Чуаньфан — колись третя за впливом людина у всій країні, зведений тепер до стану тягаря. Принаймні так вважали його вороги. Для інших — для тисяч його друзів — це був час глибокого смутку, нескінченного горя та пам'яті. До нього приходили найближчі соратники, друзі та, звісно ж, власні діти. Обливаючись сльозами, вони могли лише сподіватися на одужання Суня, поки німецькі лікарі цілодобово боролися за життя Тигра, сподіваючись, що він знову покаже свої пазурі.\n\nСеред ночі в Нанкіні, під відлуння перестрілок, вибухів і криків, у кімнаті маршала Ліги Суня сиділа лише одна постать. Граючись запальничкою серед напівтемряви кімнати, виконувач обов'язків маршала Ліги Ці Сєюань мовчки спостерігав за тілом Сунь Чуаньфана, що перебувало в комі. Звісно, німецькі лікарі підкорялися його наказам. Саме він підтримував у Суні слабкий проблиск життя. І він міг так само легко загасити його, як і полум'я своєї запальнички.\n\nКлацаючи запальничкою, запалюючи її і знову закриваючи... Ці повторював цей рух годинами. Різні думки роїлися в голові генерала. Сунь і Ці справді були бойовими побратимами. Обидва походили з Південного Чжилі, обидва воювали на південному сході впродовж десятиліття. Проте Ці так і не пробачив Суню бездіяльності у 1925 році. Коли Ці найбільше потребував підтримки як губернатор Чжецзяну, він відчайдушно благав про допомогу в Суня, тодішнього губернатора Фуцзяні. Разом вони могли б зупинити навалу Лу Юнсяна та Чжан Цзунчана. Проте Сунь замість негайного контрудару витратив цілий рік на нарощування сил.\n\nТака зрада надто дорого коштувала Ці! Намагаючись повернутися до влади, він був змушений «з вдячністю» прийняти милість Суня після створення Ліги. Завдяки хитрощам Ці виконував для Суня всю брудну роботу, і ось де вони опинилися тепер: безпорадний Сунь і всемогутній Ці. Хто міг би зупинити його? Хто завадить обірвати це життя?\n\nНаступного ранку посипалися термінові зведення: Сунь Чуаньфан зрештою помер від ран посеред ночі. У газетах з'явилися некрологи вельми суперечливого змісту: вони віддавали належне його «щирості» й патріотизму, але водночас засуджували його жорстокість. Офіційний похорон відбудеться після відновлення порядку в Лізі. І хоча новина про смерть Суня зайняла перші шпальти ранкових випусків, вона губилася серед повідомлень про пересування військ, розстріли студентів і повний крах його імперії."
 league_collapse_flavour.9.a: "«У тисячу разів краще загинути від рук співвітчизників, ніж жити зрадником»."

### Section 5 - League War Events ###
 league_war.1.t: "Наші люди дезертирують!"
 league_war.1.desc: "День у день наш бойовий дух згасає. У нас немає перемог, немає слави, і ми потрапили у смертельне піке, з якого можемо вже не вибратися. Найближчі довірені особи [THIS.GetLeader] благали його рятуватися втечею, але поки він відмовляється і чіпляється за віру в перемогу, наші солдати вже почали розбігатися..."
 league_war.1.a: "Нам просто треба більше часу!"

 # league_war.2 (hidden event)

 league_war.3.t.good: "Вмотивовані бійці"
 league_war.3.t.bad: "Зростання дезертирства"
 league_war.3.desc.good: "Часто кажуть, що коли боєць вірить у близьку перемогу, він б'ється завзятіше та краще. Хай там як, нещодавні успіхи на полі бою чудово підняли моральний дух, що позитивно вплинуло на хід війни."
 league_war.3.desc.bad: "Низка помилок, невдач і банального безталання призвела до того, що наші сили не змогли виконати поставлені завдання. Ми не досягаємо відчутних успіхів, і в міру затягування війни дедалі більше людей сумніваються в нашій справі, залишаючи армію, аби повернутися додому або стати розбійниками."
 league_war.3.a: "Чудова робота..."
 league_war.3.b: "Жахливо..."

 league_war.4.t.good: "Захоплено ворожий склад"
 league_war.4.t.bad: "Втрата спорядження"
 league_war.4.desc.good: "Завдяки нещодавнім перемогам на фронті наші бійці захопили склад постачання, вщент наповнений ворожою зброєю! Хоча відступаючі сили намагалися нічого нам не залишати, швидкість нашого наступу заскочила їх зненацька."
 league_war.4.desc.bad: "Через низку поразок на полі бою моральний дух упав до нового мінімуму. Під час відступу перед наступаючим ворогом загін солдатів, відправлений перевезти припаси ближче до столиці, натомість дезертирував і забрав усе із собою. Це свідчить як про повний крах дисципліни, так і про серйозний удар по нашій логістиці."
 league_war.4.a.good: "Чудово!"
 league_war.4.b.bad: "Усі вони звичайнісінькі шахраї"

 league_war.5.t.good: "Хвала на адресу [THIS.GetLeader]"
 league_war.5.t.bad: "Критика [THIS.GetLeader]"
 league_war.5.desc.good: "Нещодавні успіхи у війні суттєво зміцнили позиції [THIS.GetLeader]. Члени уряду, які раніше критикували його правління, почали замовкати, тоді як голоси підтримки зазвучали гучніше. Якщо ця тенденція збережеться, війну вдасться швидко завершити."
 league_war.5.desc.bad: "Нещодавні невдачі на фронті спричинили хвилю гострої критики на адресу керівництва [THIS.GetLeader]. Голоси опонентів лунають дедалі гучніше, ширяться чутки про змови з метою його усунення, а обіцяні перемоги здаються дедалі примарнішими. Якщо так триватиме й далі, [THIS.GetNameDef] може розпастися через внутрішні чвари задовго до того, як ворожа армія візьме [THIS.Capital.GetCapitalVictoryPointName]."
 league_war.5.a: "Так і має бути"
 league_war.5.b: "Вони можуть нарешті замовкнути?"

 league_war.6.t: "Перебіжчики з Аньціна"
 league_war.6.desc: "Схоже, після краху Аньцінської кліки низка мілітаристів, генералів і дрібних деспотів, заплямованих зв'язками Чень Тяоюаня з японцями, вирішили зробити ставку на [SHD.GetLeader], аби не зазнати репресій від Ґоміньдану. Їхній досвід неодмінно стане нам у пригоді."
 league_war.6.a: "Ласкаво просимо!"

 league_war.10.t: "Аньцін перемагає!"
 league_war.10.d: "Президенту Цао та маршалу У надійшла чудова телеграма! Оскільки гармати в Нанкіні майже стихли, схоже, що губернатор — а нині новопризначений маршал Ліги — Чень Тяоюань успішно повалив корумпований клептократичний уряд Ці Сєюаня. Німецькі інвестори, підприємці та демагоги Південного Чжилі або втекли до Сеттльментів і Німецької Східної Азії, або пристосувалися до лояльніших режимів.\n\nЗавдяки закріпленню контролю над землями на периферії провінції Аньхой наша підтримка у війні виявилася вирішальною для швидкої перемоги Ченя над Лігою. Хоча заворушення та бої все ще тривають в інших частинах колишніх володінь Ліги, Центральний уряд здобув собі надійного союзника в Китаї, міцно інтегрованого в нашу сферу впливу."
 league_war.10.a: "Чудова робота, Чене!"

 league_war.11.t: "Нанкін перемагає!"
 league_war.11.d: "Президенту Цао та маршалу У надійшла чудова телеграма! Оскільки канонада в Нанкіні переважно стихла, схоже, що маршал Ліги Ці Сєюань успішно повалив нестабільний, нелегітимний та хаотичний режим Чень Тяоюаня. Затяті противники концесій, радикали та інтелектуали з уряду Ченя розбіглися по сусідніх провінціях або навіть переметнулися до Ґоміньдану.\n\nЗавдяки закріпленню контролю над територіями довкола провінції Нанкін наша допомога у війні зіграла ключову роль у швидкій перемозі Ці над бунтівними вискочнями. Хоча заворушення та бої все ще тривають в інших регіонах колишньої Ліги, Центральний уряд здобув собі надійного, хоч і ідеологічно зіпсованого, союзника в Китаї, міцно залученого до нашої сфери впливу."
 league_war.11.a: "Маршал Ліги гарантує стабільність!"

 league_war.12.t: "Нанкін розгромлено!"
 league_war.12.d: "Поставивши на кін фінанси уряду, національний авторитет і легітимність заради збереження стабільної та надійної влади в межах Ліги, ми, схоже, втратили все марно. Попри колосальну підтримку Ці як з боку наших колишніх німецьких союзників, так і з наших власних ресурсів, він зумів занапастити всю справу.\n\nКоли розкрилися закулісні махінації його приходу до влади, стало зрозуміло, що саме амбіції згубили Ці. Бажаючи прибрати всю Лігу до своїх рук, він ненароком прирік на загибель не лише себе, а й своїх людей. Поки його клептократи тікають до Ліги або через наш кордон, сам маршал Ліги, за повідомленнями, зник, поспіхом вивізши зі столиці стільки багатств, скільки спромоглися забрати він і його почет.\n\nБез маршала Ці для прикриття нашого флангу та відродження Південного Чжилі Нанкін і провінції Ліги опинилися під владою підступних і ворожих режимів, які плекають плани щодо захоплення Пекіна."
 league_war.12.a: "Ти був шахраєм, але ти був нашим бісовим шахраєм!"

 league_war.13.t: "Аньцін розгромлено!"
 league_war.13.d: "Попри непохитну боротьбу проти концесій, попри патріотизм і звитягу, шляхетні сили губернатора Чень Тяоюаня були вщент розгромлені та вибиті з рідної провінції. Після фактичного знищення провінційного уряду ходять чутки, що генерал-«Дурник» загинув у бою або ж зник у нетрях міського кримінального підпілля чи втік до будь-якого режиму, здатного його прихистити.\n\nЩо ж до його офіцерів та інтелектуалів, які стояли за ним, вони розділили схожу долю, рятуючись утечею до Хунані та інших регіонів. Хоч би як склалася їхня доля, для нашого уряду це чорний, катастрофічний день, адже на перемогу руху проти концесій розраховували багато наших провідних військових, політиків і мислителів.\n\nБез Ченя ми опинилися перед загрозою переходу найбагатших і найрозвиненіших провінцій Китаю до рук потенційно ворожих режимів, що створює критичну небезпеку безпосередньо біля наших кордонів."
 league_war.13.a: "Ти був хороброю людиною, Чене, але тебе здолали амбіції."

 league_war.14.t: "Губернатора Ченя розгромлено!"
 league_war.14.d: "Сьогодні знаменний день! Губернатор Чень Тяоюань, повністю виправдовуючи своє прізвисько «Дурник», нарешті зазнав краху! Його Аньхойська армія виявилася безсилою перед натиском найкращих сил Ліги; війська розсипалися та розбіглися по провінціях у пошуках будь-якої служби. Самого губернатора-зрадника, на жаль, знайти не вдалося: він утік з провінції Аньхой, щойно наблизилися бійці Ліги.\n\nХай там як, головного винуватця всього цього лиха — того, хто підлив масла у вогонь і напевне спричинив загибель великого Сунь Чуаньфана, — викинуто на смітник історії. А за ним неодмінно підуть і противники концесій. Утім, зараз ми маємо дивитися вперед, адже маршал Ліги Ці Сєюань має безліч амбітних планів."
 league_war.14.a: "Справді виявився дурником."

