 africa_events.2.t:0 "[FROM.GetNameDefCap] просить по допомогу"
 africa_events.2.d:0 "Держава [FROM.GetNameDef] звернулася до нас із приводу потенційного партнерства. Колоніальне правління Німеччини залишило їх непідготовленими до незалежності і вони прагнуть придбати необхідний капітал, щоб налагодити свою економіку."
 africa_events.2.a:0 "Ми надішлемо те, що вони просять."
 africa_events.2.b:0 "Вони самі по собі."

 africa_events.3.t:0 "[FROM.GetNameDefCap] погоджується допомогти"
