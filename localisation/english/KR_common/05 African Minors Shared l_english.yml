 AFR_economy_BEL:0 "Економічна допомога"
 AFR_economy_BEL_desc:0 "Завдяки впровадженню іноземних товарів та послуг з держави [BEL.GetNameDef], ми зможемо розвивати нашу економіку набагато швидше."
