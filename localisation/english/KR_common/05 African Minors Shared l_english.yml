 AFR_investment_BEL:0 "[BEL.GetAdjective]е диво"
 AFR_investment_BEL_desc:0 "Незалежно від намірів наших благодійників, які допомагають нашому розвитку, ніхто не може стверджувати, що їхня допомога дозволила державі [ROOT.GetNameDef] процвітати. Ми знаходимося на шляху до економічного дива."
 AFR_investment_BRA:0 "[BRA.GetAdjective]е диво"
 AFR_investment_BRA_desc:0 "Незалежно від намірів наших благодійників, які допомагають нашому розвитку, ніхто не може стверджувати, що їхня допомога дозволила державі [ROOT.GetNameDef] процвітати. Ми знаходимося на шляху до економічного дива."
