 annexation_67: "Доля регіону [67.GetName]"
 annexation_67_desc: "Регіон [67.GetName] був взятий під наш контроль, оскільки наші війська окупували цей регіон. Тепер ми маємо вирішити, що з ним робити."

 annexation_52: "Доля Південної Німеччини"
 annexation_52_desc: "Уся Південна Німеччина опинилася під нашим контролем. Наразі наші збройні сили стикаються з певною протидією з боку місцевого населення. Ми можемо залишити це на розсуд місцевих органів влади в регіоні, щоб вони могли подбати про будь-яких дисидентів."
 annexation_events.1013.a: "Звільнити Південнонімецьку державу."

 annexation_10: "Доля Польщі"
 annexation_10_desc: "Польща знову опинилася на межі зникнення з карти Європи. Колись могутній гравець європейської геополітики, Річ Посполита була розділена між трьома сусідами внаслідок трьох поділів Польщі наприкінці XVIII століття, і лише перемога Німеччини над Росією в Першій світовій війні відновила її, хоча й у вигляді блідої тіні колишньої величі. Після капітуляції варшавської влади перед військами ([ROOT.GetAdjective]) ми контролюємо більшу частину країни, тож її доля тепер у наших руках. Чи варто нам дарувати Польщі свободу, принаймні в межах обмеженого королівства минулого століття? Звісно, зробивши цей крок, нам ніщо не завадить нав'язати уряд, який відстоюватиме наші інтереси, або дозволити цьому дружньому уряду втілити панславістські мрії про Велику Польщу. З іншого боку, якщо того вимагатимуть наші інтереси, ми можемо наслідувати приклад багатьох держав до нас і назавжди спустити польський біло-червоний стяг."
 annexation_events.1014.a: "Звільнити Республіку Польща."
 annexation_events.1014.b: "Відновити монархію Гогенцоллернів."
 annexation_events.1014.c: "Встановити монархію Габсбургів."
 annexation_events.1014.d: "Встановити німецьке військове правління."

