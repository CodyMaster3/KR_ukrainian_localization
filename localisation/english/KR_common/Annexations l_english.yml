 annexation_445: "Доля Кветти"
 annexation_445_desc: "Кветта була взята під наш контроль, оскільки наші війська окупували цей регіон. Тепер ми маємо вирішити, що з нею робити."
 annexation_events.3050.a: "[peshawar.GetGrantTerritoryEventOption]"

 annexation_442: "Доля Пешавару"
 annexation_442_desc: "Пешавар перейшов під наш контроль, оскільки наші війська окупували регіон. Тепер ми повинні вирішити, що з ним робити."

 annexation_443: "Доля Сінду"
 annexation_443_desc: "Сінд був взятий під наш контроль, оскільки наші війська окупували цей регіон. Тепер ми маємо вирішити, що з ним робити."
 annexation_events.3051.a: "[gujarat.GetGrantTerritoryEventOption]"
 annexation_events.3051.b: "[rajputana.GetGrantTerritoryEventOption]"

 annexation_323: "Доля Непалу"
 annexation_323_desc: "Після успішної кампанії в Гімалаях, ми маємо створити нову місцеву адміністрацію для відновлення миру в Катманду. Що ж нам робити?"
 annexation_events.3052.a: "Звільнити Непал."
 annexation_events.3052.b: "Відновити династію Шах."
 annexation_events.3052.c: "Передати владу династії Рана."
 annexation_events.3052.d: "[oudh.GetGrantTerritoryEventOption]"

 annexation_324: "Доля Бутану"
 annexation_324_desc: "Після нашої успішної кампанії в Гімалаях перед нами стоїть завдання створити нову місцеву адміністративну владу, щоб відновити мир, однак є кілька варіантів для нашого вибору..."
 annexation_events.3053.a: "Створити маріонетковий Бутан."

 annexation_288: "Доля Бірми"
 annexation_288_desc: "Наші війська марширують Рангуном, а бірманське керівництво перебуває або у вигнанні, або у в'язниці. Що нам робити з цими землями?"
 annexation_events.3054.a: "Звільнити Республіку Бірма."
 annexation_events.3054.b: "Відновити династію Конбаун."

 annexation_701: "Доля Качину"
 annexation_701_desc: "Сільський Качинський район зараз перебуває під нашим контролем. Що робити з цією дикою землею?"
 annexation_events.3055.a: "Звільнити Качин."

 annexation_72: "Доля Шанських пагорбів"
 annexation_72_desc: "Шанські пагорби вже давно стали скалкою у тих, хто прагнув їх контролювати. В той час, як наші армії проходять через їхні міста та селища, стає ясно, що райони Шан, нарешті, були повністю підкорені. Що слід робити з цими новопридбаними землями?"
 annexation_events.3056.a: "Звільнити державу Шан."
 annexation_events.3056.b: "[shan.GetGrantTerritoryEventOption]"
 annexation_events.3056.c: "Розділити його між [burma.GetNonIdeologyNameDef] та [siam.GetNonIdeologyNameDef]."

 annexation_422: "Доля Цейлону"
 annexation_422_desc: "Нам вдалося вирвати з рук Німецької Імперії острів Цейлон. Але що ж нам тепер робити з цією чортовою скелею?"
 annexation_events.3057.a: "Звільнити Цейлон."

 annexation_285: "[annexation_australia_title]"
 annexation_285_desc: "[annexation_australia_description]"

 annexation_australia_australasia: "Доля Австралазії"
 annexation_australia_australia: "Доля Австралії"
 annexation_australia_entente_desc: "Уряд Австралазії зазнав поразки і зараз перебуває під нашим контролем. Перед нами постає питання: чи відновити його незалежність під контролем лояльної Австралазійської Гвардії - незважаючи на їх екстремістські нахили, чи нам слід знову прийняти надзвичайні протоколи і встановити пряме управління через нашого генерал-губернатора."
 annexation_australia_australasia_desc: "Після важкого походу ізольованими островами Австралазійської Конфедерації, наші армії нарешті дісталися Канберри. Після капітуляції Австралазії, ми повинні вирішити, що робити з цими землями."
 annexation_australia_australia_desc: "Після важкого походу ізольованими островами Австралії, наші армії нарешті дісталися Канберри. Після капітуляції Австралії, ми повинні вирішити, що робити з цими землями."
 annexation_events.3058.a: "Звільнити [annexation_australia_release_option]."
 annexation_events.3058.b: "Звільнити Австралію та Нову Зеландію."
 annexation_events.3058.c: "Звільнити Австралазію і дати їм владу над їхньою зоною Тихого океану."
 annexation_events.3058.d: "Гвардія здатна відновити порядок!"
 annexation_events.3058.e: "Генерал-губернатор буде правити від нашого імені!"

 annexation_284: "Доля Нової Зеландії"
