#Event for Chinese tag to notify return of concessions from Japan
 annexation_events.300.t: "Японія повертає концесії у Китаї"
 annexation_events.300.d: "За підсумками мирних переговорів, які пройшли після нашої перемоги над японцями, вони погодилися повернути усі китайські концесії, що захопили раніше. Тож ми повернули те, що належало нам по праву. Ще одна перемога для Китаю та ще одна ганебна поразка для його ворогів. Вік Принижень ще на крок ближче до завершення."
 annexation_events.300.a: "Впливу Японії у Китаї підійшов кінець."

