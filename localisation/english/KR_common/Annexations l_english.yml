 annexation_events.201.t: "Кому запропонувати Італію?"
 annexation_events.201.desc: "Хоча ми й здобули перемогу над північноіталійським соціалістичним режимом, усім у місті [ROOT.Capital.GetName] зрозуміло, що ми не маємо ані зацікавленості, ані змоги й надалі утримувати окуповані нашою країною італійські землі. Цілком очевидно, що ми мусимо повернути ці території одній з існуючих італійських держав. Немає жодних гарантій, що ті, кому ми їх передамо, колись зможуть віддячити послугою за послугу, проте уряд, обраний нами для передачі влади, отримає колосальну легітимність на блюдечку й згодом зможе швидко об'єднати всю Італію. Тому діяч [ROOT.GetLeader] має діяти обачно та ухвалити остаточне рішення, усвідомлюючи можливі наслідки кроку, який легко знецінити як мирний процес, значно менш важливий за війну, що до нього призвела."
