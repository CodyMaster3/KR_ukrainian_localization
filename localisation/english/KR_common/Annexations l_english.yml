 annexation_events.1091.f: "[italy_campania.GetGrantTerritoryEventOption]"
 annexation_events.1091.g: "[italy_sardinia.GetGrantTerritoryEventOption]"

 annexation_1003: "Доля Валле д'Аоста"
 annexation_1003_desc: "Оскільки регіон Валле д'Аоста знаходиться під нашим контролем, ми маємо вирішити, що з ним робити."

 annexation_158: "Доля П'ємонту"
 annexation_158_desc: "Наші армії взяли під свій контроль П'ємонт, а місцеві жителі прагнуть до самоврядування. Ми маємо вирішити, що робити з регіоном."
 annexation_events.1094.a: "Звільнити Сардинію-П'ємонт."
 annexation_events.1094.b: "[sardinia.GetGrantTerritoryEventOption]"
 annexation_events.1094.c: "Запропонувати його [sardinia.GetNonIdeologyNameDef] в обмін на альянс."

 annexation_159: "Доля Ломбардії"
 annexation_159_desc: "Наші армії взяли під свій контроль Ломбардію, а місцеві жителі прагнуть до самоврядування. Ми маємо вирішити, що робити з регіоном."
 annexation_events.1095.a: "Відновити монархію Вісконті."
 annexation_events.1095.b: "Звільнити Ломбардську республіку."
 annexation_events.1095.c: "Надати її нашому [VNC.GetAdjective] союзнику."

 annexation_160: "Доля Венеції"
 annexation_160_desc: "Наші армії взяли під свій контроль Венецію, а місцеві жителі прагнуть до самоврядування. Ми маємо вирішити, що робити з регіоном."
 annexation_events.1096.a: "Звільнити Венеційську республіку."

 annexation_1004: "Доля Емілії"
 annexation_1004_desc: "Наші армії взяли під свій контроль Емілію, а місцеві жителі прагнуть до самоврядування. Ми маємо вирішити, що робити з регіоном."
 annexation_events.1097.a: "Звільнити Еміліанську республіку"
 annexation_events.1097.b: "Відновити Герцогство Модена"
 annexation_events.1097.c: "Відновити Герцогство Парма"

 annexation_162: "Доля Тоскани"
 annexation_162_desc: "Наші армії взяли під свій контроль Тоскану, а місцеві жителі прагнуть до самоврядування. Ми маємо вирішити, що робити з регіоном."
 annexation_events.1098.a: "Звільнити лояльне Велике Герцогство Тоскана."
 annexation_events.1098.b: "Звільнити лояльну Республіку Тоскана."

 annexation_161: "Доля Центральної Італії"
 annexation_161_desc: "Наші армії взяли під свій контроль Центральну Італію, частина якої колись перебувала під контролем Папи. Місцеві жителі прагнуть до самоврядування. Ми маємо вирішити, що робити з регіоном."
 annexation_events.1099.a: "Віддайте її нашим друзям [PAP.GetNameDef]."
 annexation_events.1099.b: "[PAP.GetGrantTerritoryEventOption]"

 annexation_2: "Доля Риму"
 annexation_2_desc: "У зв'язку з тим, що наші війська контролювали вічне місто та прилеглі до нього території, було порушено питання про управління цим районом. Хоча створення італійського уряду могло б надати нам голос на півострові, відновлення Папської області вимагає Святий Престол і вище духовенство."
 annexation_events.1100.a: "Відновити Папську область."

 annexation_117: "Доля Південної Італії"
 annexation_117_desc: "Наші армії взяли під свій контроль Південну Італію, а місцеві жителі прагнуть самоврядування. Ми маємо вирішити, що робити з регіоном."
 annexation_events.1101.a: "Відновити королівство Обох Сицилій."

 annexation_114: "Доля Сардинії"
 annexation_114_desc: "Острів, укріплений королем у вигнанні, виявився твердим горішком, але тепер він у наших руках. Що нам робити із територією?"
 annexation_events.1102.a: "Звільнити Сардинію."

 annexation_116: "Доля Мальти"
 annexation_116_desc: "Мальта була взята під наш контроль, а наші війська окупували острів. Тепер ми маємо вирішити, що з ним робити."
 annexation_events.1103.a: "Звільнити Мальту."

 annexation_741: "Доля регіону [741.GetName]"
 annexation_741_desc: "Бельгійський прикордонний регіон Верв'є тепер під нашим контролем, і ми повинні вирішити, що з ним робити."

 annexation_924: "Доля регіону [924.GetName]"
 annexation_924_desc: "Регіон [924.GetName], який раніше належав австрійській короні, є домом для поляків, чехів та німців. Тепер ми маємо вирішити, що з цим робити."
 annexation_events.1105.a: "[moravia.GetGrantTerritoryEventOption]"

 annexation_71: "Доля Дунайської рівнини"
 annexation_71_desc: "Дунайська рівнина, що раніше входила до складу Угорського королівства, є домом для словаків, німців та угорців. Тепер ми маємо вирішити, що з цим робити."

 annexation_94: "Доля регіону [94.GetName]"
 annexation_94_desc: "Регіон [94.GetName] тепер під нашим контролем. Ми маємо вирішити, що з ним робити."

 annexation_241: "Доля регіону [241.GetName]"
 annexation_241_desc: "Регіон [241.GetName] тепер під нашим контролем. Ми маємо вирішити, що з ним робити."
 annexation_events.1108.a: "[krichev.GetGrantTerritoryEventOption]"
 annexation_events.1108.b: "[mozyr.GetGrantTerritoryEventOption]"
 annexation_events.1108.c: "[chernihiv.GetGrantTerritoryEventOption]"
 annexation_events.1108.d: "[starodub.GetGrantTerritoryEventOption]"

 annexation_683: "Доля регіону [683.GetName]"
 annexation_683_desc: "Ми взяли під контроль колишні австрійські території Гориція та Градиска. Ми маємо вирішити, що з ними робити."

 annexation_103: "Доля регіону [103.GetName]"
 annexation_103_desc: "Ми взяли під контроль колишнє австрійське портове місто [103.GetName]. Ми маємо вирішити, що з ним робити."

 annexation_1090: "Доля регіону [1090.GetName]"
 annexation_1090_desc: "Місто [1090.GetName], раніше входило до складу Королівства Угорщини, є домом для словаків, німців та угорців. Тепер ми маємо вирішити, що з цим робити."
 annexation_events.1111.a: "[danubian_plain.GetGrantTerritoryEventOption]"

 annexation_817: "Доля регіону [817.GetName]"
 annexation_817_desc: "Регіон [817.GetName] тепер перебуває під нашим контролем. Колись перебуваючи під владою Арагонської корони, цей регіон офіційно увійшов до складу Іспанії у 1516 році після об'єднання корон Арагону та Кастилії. Проте за Піренейським мирним договором 1659 року, який завершив Франко-іспанську війну, його було передано Французькій короні, і відтоді він перебував під суверенітетом Франції.\n\nУ межах цього регіону здавна проживає значна частина каталономовного населення. Починаючи з XVIII століття, каталонці та їхня мова зазнавали значних утисків, хоча окремі націоналістичні голоси й закликали до представництва каталонців у регіоні. Це залишає нам кілька варіантів того, як учинити з цією спірною територією."
 annexation_events.1112.a: "[languedoc.GetGrantTerritoryEventOption]"
 annexation_events.1112.b: "[catalonia.GetGrantTerritoryEventOption]"

 annexation_1088: "Доля регіону [1088.GetName]"
 annexation_1088_desc: "Регіон [1088.GetName] тепер знаходиться під нашим контролем. Ми маємо вирішити, що з ним робити."
