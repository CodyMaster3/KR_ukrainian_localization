 annexation_779: "Доля регіону [779.GetName]"
 annexation_779_desc: "Регіон [779.GetName], батьківщина баскської громади, перейшов під наш контроль. Повністю включені до складу Франції щонайменше з XV століття, баски користувалися значною автономією, допоки наприкінці XVIII століття Французька революція її не скасувала. Відтоді визнання прав басків у цьому регіоні було обмеженим, особливо з огляду на те, що вони становлять там меншість. Тим часом в іспанській Країні Басків виникли націоналістичні рухи, які сподіваються зробити цей регіон частиною незалежної Басконії. Це дає нам чимало варіантів того, як підійти до цього питання."
