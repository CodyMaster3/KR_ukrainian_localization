 annexation_1111: "Доля регіону the [1111.GetName]"
 annexation_1111_desc: "[1111.GetName] раніше перебувала під управлінням Цінського Китаю до інциденту П'янма/Хпімау в 1910-х роках, коли місцеві лідери Тусі перейшли на бік Великої Британії і відтоді стали частиною Бірми. Тепер, коли ця територія опинилася під нашим контролем. Тепер ми повинні вирішити, що з нею робити."

 annexation_1042: "Доля регіону [1042.GetName]"
 annexation_1042_desc: "Управління регіоном [1042.GetName] було предметом суперечок між Росією, Китаєм та Афганістаном ще з 1864 року після підписання нерівноправного Тарбагатайського (Таченського) протоколу про розмежування. Визначаючи кордон між Росією та Китаєм аж до гір Паміру та меж Коканда, він не окреслював межі Бадахшану; ситуація ще більше заплуталася після підписання іншого нерівноправного договору — російсько-китайського Петербурзького (Ілійського) договору, який передбачав, що кордон між державами «має визначатися відповідно до вже існуючих кордонів двох країн».\n\nБа більше, у 1884 році демаркація кордону та черговий нерівноправний договір — Кашгарський протокол — просто додали спірну територію до кордону. Російська імперія ввела війська в регіон у 1891 році, а в 1892 році увійшла на китайську територію. У 1895 році Росія та Британія поділили Памір між собою, попри дипломатичні протести династії Цін.\n\nКрім того, існують претензії Афганістану, який історично контролював цей регіон упродовж століть. Після завоювання Росією Туркестану кордон між Росією та Афганістаном залишався нечітким. Створивши у 1884 році Афганську розмежувальну комісію, Британія та Росія сподівалися владнати це питання, але перш ніж комісія змогла дійти згоди, Росія розпочала вторгнення, аби просунути кордон якомога далі на південь, що призвело до бою на Кушці (Пендженського інциденту); відтоді й аж до міжвоєнного періоду ця територія залишалася осередком постійної напруженості. З огляду на претензії кількох сторін, тепер саме нам належить визначити її майбутнє."

 annexation_555: "Доля регіону [FROM.FROM.GetName]"
 annexation_555_desc: "Регіон [FROM.FROM.GetName] перейшов під наш контроль, коли наші війська зайняли цю територію. Тепер ми маємо вирішити, як із ним учинити."

 annexation_583: "Доля Сірого Клину"
 annexation_583_desc: "«Сірий Клин» між Сибіром і Казахстаном перейшов під наш контроль, коли наші війська зайняли цей регіон. Тепер ми маємо вирішити, як із ним учинити."

 annexation_1034: "Доля Малабарського узбережжя"
 annexation_1034_desc: "Малабарське узбережжя перейшло під наш контроль, коли наші війська зайняли цей регіон. Тепер ми маємо вирішити, як із ним учинити."

### Middle East Events ###

 annexation_554: "Доля Леванту"
 annexation_554_desc: "Ми завоювали багаті землі Леванту, включаючи велике та стародавнє місто Дамаск. Що нам робити із цими старими османськими провінціями?"
 annexation_events.4000.a: "Звільнити Сирію."

 annexation_553: "Доля Лівану"
 annexation_553_desc: "Місто Бейрут був взятий під наш контроль, оскільки наші війська окупували цей регіон. Тепер ми маємо вирішити, що з ним робити."
 annexation_events.4001.a: "Звільнити Ліван."

 annexation_49: "Доля Анатолії"
 annexation_49_desc: "Ми знищили останні залишки турецької держави і нарешті поклали «хвору людину Європи» в могилу. Наші війська вже зайняли Анкару, але ми не можемо продовжувати окупацію. Необхідно вирішити долю турецького народу."
 annexation_events.4002.a: "Створити Республіку Туреччина."
 annexation_events.4002.b: "Відновити Османську Імперію."

 annexation_340: "Доля Егейського узбережжя"
 annexation_340_desc: "Егейське узбережжя було взяте під наш контроль, оскільки наші війська окупували цей регіон. Тепер ми маємо вирішити, що з ним робити."
 annexation_events.4003.a: "Розділити її між [turkey.GetNameDef] та [greece.GetNameDef]."

 annexation_446: "Доля Єгипту"
 annexation_446_desc: "Долина Нілу була взята під наш контроль, оскільки наші війська окупували цей регіон. Тепер ми маємо вирішити, що з нею робити."
 annexation_events.4004.a: "Звільнити Республіку Єгипет."
 annexation_events.4004.b: "Звільнити Султанат Єгипет."

 annexation_753: "Доля Суецького каналу"
 annexation_753_desc: "Найважливіший пункт Суец – ворота до Індійського океану – тепер перебуває під нашим контролем. Ми маємо вирішити, що з ними робити."
 annexation_events.4005.a: "Створити міжнародну зону навколо каналу."

 annexation_453: "Доля Синаю"
 annexation_453_desc: "Синайський півострів, що має як стратегічне, так і релігійне значення, під нашим контролем. Що ж нам слід робити із цими землями?"

 annexation_451: "[annexation_libya_title]"
 annexation_451_desc: "[annexation_libya_description]"
 annexation_libya_libya: "Доля Лівії"
 annexation_libya_libya_desc: "Хоча лівійці й чинили гідний опір, ми розпочали повномасштабний наступ і змусили їх капітулювати. Триполі тепер у наших руках, але як нам учинити зі старими османськими землями Киренаїки, Триполітанії та Феццану?"
 annexation_libya_cyrenaica: "Доля Кіренаїки"
 annexation_libya_cyrenaica_desc: "Регіон Кіренаїки зараз знаходиться під нашим контролем. Ми маємо вирішити, що з ними робити."
 annexation_events.4007.a: "Звільнити Кіренаїку!"
 annexation_events.4007.b: "Звільнити єдину Лівію!"
 annexation_events.4007.c: "Звільнити Кіренаїку та Триполітанію!"

 annexation_448: "Доля Триполітанії"
 annexation_448_desc: "Регіон Триполітанії зараз перебуває під нашим контролем. Ми маємо вирішити, що з ними робити."
 annexation_events.4008.a: "Звільнити Триполітанію."

 annexation_231: "Доля Грузії"
 annexation_231_desc: "Наші збройні сили розтрощили грузинський режим і щойно пройшли тріумфальним маршем вулицями Тбілісі. Залишається лише вирішити статус грузинської землі."
 annexation_events.4009.a: "Створити об'єднане Закавказзя."
 annexation_events.4009.b: "Відновити Королівство Грузія!"
 annexation_events.4009.c: "Відновити Республіку Грузія!"

 annexation_229: "Доля Азербайджану"
 annexation_229_desc: "Після важких боїв у горах Кавказу нам все ж таки вдалося примусити до капітуляції азербайджанську армію і встановити повний контроль над їхньою територією. Тут і там періодично виникають спалахи невдоволення новою адміністрацією. Що нам робити з нашими новозавойованими землями?"
 annexation_events.4010.a: "Звільнити Азербайджан!"

 annexation_998: "Доля Карабаху"
 annexation_998_desc: "Карабахське нагір'я опинилося під нашим контролем, оскільки наші війська окупували цей регіон. Тепер ми маємо вирішити, що з ним робити."

 annexation_230: "Доля Вірменії"
 annexation_230_desc: "Після важких боїв у горах Кавказу нам все ж таки вдалося примусити до капітуляції вірменську армію і встановити повний контроль над їхньою територією. Тут і там періодично виникають спалахи невдоволення новою адміністрацією. Що нам робити з нашими новозавойованими землями?"
 annexation_events.4012.a: "Звільнити Вірменію!"

 annexation_1000: "Доля регіону [1000.GetName]"
 annexation_1000_desc: "Крихітний регіон [1000.GetName] був взятий під наш контроль, оскільки наші війська окупували цей регіон. Тепер ми маємо вирішити, що з ним робити."

 annexation_1001: "Доля регіону [1001.GetName]"
 annexation_1001_desc: "Крихітний регіон [1001.GetName] був взятий під наш контроль, оскільки наші війська окупували цей регіон. Тепер ми маємо вирішити, що з ним робити."

 annexation_292: "Доля Аравії"
 annexation_292_desc: "Після важких боїв нам вдалося провести повномасштабний наступ та встановити контроль над усім Аравійським півостровом!"
 annexation_events.4016.a: "Звільнити Аравію."
 annexation_events.4016.b: "[arabia_rashidi.GetGrantTerritoryEventOption]"
 annexation_events.4016.c: "[arabia_saudi.GetGrantTerritoryEventOption]"

 annexation_658: "Доля Договірного Оману"
 annexation_658_desc: "Прибережні арабські емірати, відомі під загальною назвою Договірний Оман, зараз знаходяться під нашим контролем, і ми маємо вирішити, що робити з цією землею."
 annexation_events.4017.a: "Звільнити Договірний Оман."

 annexation_679: "Доля Хіджазу"
 annexation_679_desc: "Хіджаз, батьківщина Ісламу, під нашим контролем. Що нам робити із цими землями?"
 annexation_events.4018.a: "Звільнити Хіджаз."

 annexation_291: "Доля Іраку"
 annexation_291_desc: "Ми завоювали родючі землі Іраку, включаючи місто Багдад. Що нам робити зі старими землями османів?"
 annexation_events.4019.a: "Звільнити землі Месопотамії."

 annexation_350: "Доля Курдистану"
 annexation_350_desc: "Наші армії взяли під свій контроль північну частину Леванту, а місцеве курдське населення вимагає самоврядування. Ми маємо вирішити, що робити з регіоном."
 annexation_events.4020.a: "Звільнити Курдистан."
 annexation_events.4020.b: "Розділити його між [persia.GetNonIdeologyNameDef] та [turkey.GetNonIdeologyNameDef]."
 annexation_events.4020.c: "Розділити його між [iraq.GetNonIdeologyNameDef] та [turkey.GetNonIdeologyNameDef]."
 annexation_events.4020.d: "Розділити його між [iraq.GetNonIdeologyNameDef] та [persia.GetNonIdeologyNameDef]."
 annexation_events.4020.e: "Розділити його між [persia.GetNonIdeologyNameDef], [iraq.GetNonIdeologyNameDef] та [turkey.GetNonIdeologyNameDef]."
 annexation_events.4020.f: "Розділити його з [persia.GetNonIdeologyNameDef]."

 annexation_266: "Доля Ірану"
 annexation_266_desc: "Після важких боїв нам вдалося провести повномасштабний наступ та встановити контроль над усім Іраном. [266.GetName] тепер у наших руках!"
 annexation_events.4021.a: "Звільнити Перську республіку."
 annexation_events.4021.b: "Відновити Каджарську монархію."

 annexation_294: "Доля Маскату"
 annexation_294_desc: "Після важких боїв нам вдалося провести повномасштабний наступ та встановити контроль над усім Оманом. Маскат тепер у наших руках, як і доля емірату."
 annexation_events.4022.a: "Звільнити Маскат!"

 annexation_293: "Доля Ємену"
 annexation_293_desc: "Після важких боїв нам вдалося провести повномасштабний наступ та встановити контроль над усім Єменом. Сана тепер у наших руках!"
 annexation_events.4023.a: "Звільнити Ємен!"

 annexation_982: "Доля Асіру"
 annexation_982_desc: "Район Асіру тепер під нашим контролем. Ми маємо вирішити, що з ними робити."

 annexation_585: "Доля Батумі"
 annexation_585_desc: "Портове місто Батумі тепер під нашим контролем. Ми маємо вирішити, що з ними робити."

 annexation_812: "Доля Басри"
 annexation_812_desc: "Південні болота Іраку з центром у місті Басра тепер перебувають під нашим контролем. Ми маємо вирішити, що з ними робити."

 annexation_413: "Доля Хузестану"
 annexation_413_desc: "Підкоривши багату нафтою область [413.GetName]. Ми маємо вирішити, що з нею робити."

 annexation_1080: "Доля Абхазії"
 annexation_1080_desc: "Підкоривши гірський регіон [1080.GetName], нам потрібно вирішити його подальшу долю."

 annexation_981: "Доля Наджрану"
 annexation_981_desc: "Регіон Наджран тепер під нашим контролем, і ми повинні вирішити, що з ним робити."

 annexation_656: "Доля Хаси"
 annexation_656_desc: "Регіон Хаса тепер під нашим контролем, і ми повинні вирішити, що з ним робити."

 annexation_907: "Доля Бахрейну"
 annexation_907_desc: "Острів Бахрейн тепер під нашим контролем, і ми повинні вирішити, що з ним робити."
 annexation_events.4031.a: "[hasa.GetGrantTerritoryEventOption]"
 annexation_events.4031.b: "[qatar.GetGrantTerritoryEventOption]"

 annexation_347: "Доля Хасабу"
 annexation_347_desc: "Стратегічний порт Хасаб тепер під нашим контролем, і ми повинні вирішити, що з ним робити."
 annexation_events.4032.a: "[abu_dhabi.GetGrantTerritoryEventOption]"

 annexation_1024: "Доля Дофару"
 annexation_1024_desc: "Спірна прикордонна територія навколо Дофара тепер під нашим контролем, і ми повинні вирішити, що з нею робити."
 annexation_events.4033.a: "[hadhramaut.GetGrantTerritoryEventOption]"

 annexation_344: "Доля Адани"
 annexation_344_desc: "Спірна прикордонна територія навколо Адани тепер під нашим контролем, і ми повинні вирішити, що з нею робити."
 annexation_events.4034.a: "[sivas.GetGrantTerritoryEventOption]"
 annexation_events.4034.b: "[latakia.GetGrantTerritoryEventOption]"

 annexation_418: "Доля регіону [418.GetName]"
 annexation_418_desc: "Прикордонні землі [418.GetName] перейшли під наш контроль, оскільки наші війська окупували регіон. Тепер ми повинні вирішити, що з ними робити."
 annexation_events.4035.a: "[khorasan.GetGrantTerritoryEventOption]"
 annexation_events.4035.b: "[karakum.GetGrantTerritoryEventOption]"

### Africa Events ###

 annexation_539: "Доля Габону"
 annexation_539_desc: "Тепер ми контролюємо колишню німецьку колонію Габон і разом з нею нам підчиняються тисячі африканців. Можливо, ми повинні створити для них державу на цих землях? Однак ми й самі можемо успішно керувати ними."
 annexation_events.5000.a: "Сформувати державу Габон."

 annexation_927: "Доля Камеруну"
 annexation_927_desc: "З нашою недавньою анексією колонії Камеруну адміністрація на цих землях розпалася, і ця територія потребує нової міцнішої адміністрації. Питання лише в тому, чи повинні ці землі перебувати під нашим прямим контролем, чи достатньо створити маріонеткову державу?"
 annexation_events.5001.a: "Сформувати державу Камерун."

 annexation_660: "Доля Убанги-Шарі"
 annexation_660_desc: "Після нашої успішної перемоги над ворогом, нам вдалося взяти під контроль території Убанги-Шарі. Тим не менш, ця окупація з'їдає багато сил і грошей, і багато офіційних осіб у нашій країні пропонують дати автономію цим землям. Який ваш вердикт?"
 annexation_events.5002.a: "Сформувати державу Убанги-Шарі."

 annexation_295: "Доля Конго"
 annexation_295_desc: "Наша анексія колишньої німецької колонії Конго залишає перед нами вибір: чи продовжувати її окупацію, чи залишити певну автономію Конго?"
 annexation_events.5003.a: "Сформувати державу Конго."

 annexation_813: "Доля Замбезії"
 annexation_813_desc: "Тепер, коли ми контролюємо колишні території німецької колонії в Замбезії, нам потрібно вирішити долю Замбезії. Ми можемо з неї зробити окрему колонію чи ми можемо об'єднати її з Ньясалендом. То що ми робитимемо з нею?"
 annexation_events.5004.a: "Створити державу Замбезія."

 annexation_540: "Доля Анголи"
 annexation_540_desc: "Після приєднання Анголи, колишньої колонії Португалії, нам доведеться розібратися з мешканцями цієї колонії. Зрозуміло, що нам легше дати їм незалежність, ніж керувати ними на пряму."
 annexation_events.5005.a: "Створити державу Ангола!"

 annexation_973: "Доля Нігерії"
 annexation_973_desc: "Величезна і багата колонія Нігерія тепер знаходиться під нашим контролем, і нам потрібно вирішити її долю. Чи має вона бути залежною від нас?"
 annexation_events.5006.a: "Створити державу Нігерія."

 annexation_876: "Доля Дагомеї"
 annexation_876_desc: "Територію королівства Дагомея, колишню німецьку колонію, було захоплено нашими наступаючими силами, але цю територію важко контролювати, чи варто нам намагатися керувати нею як однією з наших колоній чи треба створити маріонетковий уряд?"
 annexation_events.5007.a: "Створити державу Дагомея."

 annexation_877: "Доля Того"
 annexation_877_desc: "Тепер ми контролюємо колишню німецьку колонію Того. Мільйони африканців, які її населяють, бажають сформувати власний уряд. Чи варто нам дати їм таку можливість?"
 annexation_events.5008.a: "Створити державу Того."

 annexation_274: "Доля Гани"
 annexation_274_desc: "Наразі регіон Гани знаходиться під нашим контролем. Чи маємо ми продовжувати окупацію чи ми маємо сформувати новий уряд на цій землі?"
 annexation_events.5009.a: "Створити державу Гана."

 annexation_807: "Доля Кот-д’Івуару"
 annexation_807_desc: "Кот-д'Івуар тепер під нашим контролем. Однак його жителі вимагають, щоб компетентна адміністрація подбала про податки та військову службу. Можливо, створення лояльного нам уряду на цій землі краще рішення проблеми ніж наш прямий контроль?"
 annexation_events.5010.a: "Створити державу Кот-д’Івуар."

 annexation_298: "Доля Ліберії"
 annexation_298_desc: "Держава Ліберія, заснована американською компанією, яка хотіла перевезти всіх американських чорношкірих назад до Африки, завжди була своєрідною державою. Під контролем американців упродовж багатьох років країна втратила свою міць. Ліберійська ідентичність сильна і спроба анексувати їх може виявитися неефективною, чиновники в нашій країні закликають до створення лояльної адміністрації."
 annexation_events.5011.a: "Звільнити Ліберію."

 annexation_700: "Доля Сьєрра-Леоне"
 annexation_700_desc: "Колишня британська колонія Сьєрра-Леоне знаходиться під нашим контролем. Незважаючи на всі зусилля, наша адміністрація не справляється з керуванням цими землями, тому надійшли пропозиція щодо створення маріонеткового уряду на цих землях."
 annexation_events.5012.a: "Створити державу Сьєрра-Леоне."

 annexation_806: "Доля Гвінеї"
 annexation_806_desc: "Колишня французька колонія Гвінея знаходиться під нашим контролем. Через деякий час постало питання про створення лояльної держави на цих землях. Яким буде наше рішення?"
 annexation_events.5013.a: "Створити державу Гвінея."

 annexation_272: "Доля Сенегалу"
 annexation_272_desc: "Порт Дакар, колись найважливіший порт Французької Західної Африки, упав під нашими безперервними штурмами, а разом із ним упала й уся колонія Сенегал, включно з 4 французькими комунами. Проте зі зміною влади виникли й нові проблеми, оскільки досвідчені французькі адміністратори покинули територію, залишивши нам організаційний вакуум. Чи варто нам створити тут лояльного сателіта, аби полегшити наше становище?"
 annexation_events.5015.a: "Створити державу Сенегамбія."

 annexation_557: "Доля Мавританії"
 annexation_557_desc: "Пустельний регіон Мавританії знаходиться під нашим контролем. Колишня французька колонія потребує створення сильної адміністрації, щоб ці землі не потонули в анархії. Чи маємо ми розглянути питання про створення мавританського маріонеткового уряду?"
 annexation_events.5016.a: "Створити державу Мавританія."

 annexation_556: "Доля Малі"
 annexation_556_desc: "Долина річки Нігер, колись відома як Французький Судан або Малі, тепер перебуває під нашим прямим контролем. Утім, цій колонії потрібна ефективніша адміністрація, яку нам буде важко забезпечити. Тим не менш, місцеве населення та залишки французької адміністрації можуть певною мірою управляти нею замість нас. Чи варто дозволити їм утворити лояльну маріонеткову державу?"
 annexation_events.5017.a: "Створити державу Малі."

 annexation_808: "Доля Верхньої Вольти"
 annexation_808_desc: "Давня земля моссі навколо області Вольта перейшла під наш контроль і тепер є частиною нашої країни. Місцеві просять нас дати їм шанс створити свою власну державу. Чи повинні ми дозволити їм організувати власну державу?"
 annexation_events.5018.a: "Створити державу Верхня Вольта."

 annexation_809: "Доля Нігеру"
 annexation_809_desc: "Наші звитяжні армії щойно анексували колишню французьку колонію Нігер, яка тепер потребує належного уряду. Чи варто нам встановити там власну адміністрацію, чи краще дозволити їм сформувати місцевий уряд?"
 annexation_events.5019.a: "Створити державу Нігер."

 annexation_515: "Доля Чаду"
 annexation_515_desc: "Нарешті, Чад під нашим контролем. Проте постало питання про створення держави на цій землі. Можливо, нам слід дати місцевим жителям можливість створити власну державу, яка буде лояльною нам?"
 annexation_events.5020.a: "Створити державу Чад."

 annexation_461: "Доля Марокко"
 annexation_461_desc: "Ми звільнили Марокко від німців, але наші сили зараз мають труднощі з окупацією гірських і напівзасушливих районів країни. Хоча міські центри знаходяться під нашим контролем, можливо, було б розумно передати подальший контроль місцевим жителям."
 annexation_events.5021.a: "Звільнити марокканську республіку."
 annexation_events.5021.b: "Відновити монарха з династії Алауїтів."

 annexation_699: "Доля Ріо-де-Оро"
 annexation_699_desc: "Пустельний район Ріо-де-Оро зараз знаходиться під нашим контролем. Ми маємо вирішити, що з ним робити."

 annexation_459: "Доля Алжиру"
 annexation_459_desc: "Ми нарешті звільнили Алжир від французьких тиранів. Чи маємо ми дати Алжиру свободу?"
 annexation_events.5024.a: "Звільнити Алжир."

 annexation_458: "Доля Тунісу"
 annexation_458_desc: "Після важких боїв нам вдалося провести повномасштабний наступ та встановити контроль над усім Тунісом. Бей та кілька націоналістів вимагають самоврядування. Як альтернативу ми могли б продовжити окупацію Тунісу. Що нам робити?"
 annexation_events.5025.a: "Звільнити Туніс."

 annexation_271: "Доля Ефіопії"
 annexation_271_desc: "Після нашої успішної кампанії в Ефіопії, ми тепер маємо створити нову місцеву адміністрацію для відновлення миру, однак є кілька інших варіантів."
 annexation_events.5026.a: "Звільнити Ефіопію."

 annexation_550: "Доля Еритреї"
 annexation_550_desc: "Після нашої успішної кампанії в Еритреї зараз перед нами постає завдання створити нову місцеву адміністрацію з метою відновлення миру, однак є кілька інших варіантів."
 annexation_events.5027.a: "Звільнити Еритрею."

 annexation_268: "Доля регіону [268.GetName]"
 annexation_268_desc: "Ми контролюємо регіон [268.GetName] на який претендує одна з наших маріонеток. Можливо, краще віддати його їм?"

 annexation_559: "Доля Сомалі"
 annexation_559_desc: "Тепер ми контролюємо колишні території Сомалі, і на цих територіях буде важко підтримувати окупацію, можливо, ми повинні зробити Сомалі лояльною незалежною державою?"
 annexation_events.5029.a: "Звільнити Сомалі."

 annexation_547: "Доля Кенії"
 annexation_547_desc: "Степи Кенії тепер під нашим контролем. Що нам робити з ними? Безпосередній контроль чи звільнемо їх?"
 annexation_events.5030.a: "Створити державу Кенія."

 annexation_548: "Доля Уганди"
 annexation_548_desc: "Наразі ми займаємо території колишньої німецької колонії – Уганди. Нам потрібно вирішити проблему створення влади на цій землі. Чи має місцевий уряд складатися з місцевих жителів, чи ми самі повинні керувати цією землею?"
 annexation_events.5031.a: "Створити державу Уганда."

 annexation_965: "Доля Східної Африки"
 annexation_965_desc: "Зараз ми займаємо центр колишньої німецької колонії – Міттельафрики. Тепер нам треба вирішити долю цих земель. Ми можемо створити лояльну державу, очолювану місцевими лідерами або нам варто створити колоніальний уряд?"
 annexation_events.5032.a: "Створити Велику Східну Африку."
 annexation_events.5032.b: "Відновити Східну Африку у її колишньому вигляді."

 annexation_869: "Доля Руанди"
 annexation_869_desc: "Після звільнення Руанди від німецької тиранії, у нас постало питання про долю цієї країни. Чи маємо ми керувати цією країною чи це повинні робити місцеві жителі?"
 annexation_events.5033.a: "Створити державу Руанда."

 annexation_870: "Доля Бурунді"
 annexation_870_desc: "Ми приєднали Бурунді, частину колишньої німецької колонії Східної Африки. Ми маємо вирішити долю цієї землі. Може нам слід створити маріонетковий уряд на цих землях?"
 annexation_events.5034.a: "Створити державу Бурунді."

 annexation_544: "Доля Мозамбіку"
 annexation_544_desc: "Після приєднання Мозамбіку, колишньої колонії Португалії, нам доведеться розібратися з мешканцями цієї колонії. Зрозуміло, що нам легше дати їм незалежність, ніж керувати ними на пряму."
 annexation_events.5035.a: "Створити державу Мозамбік."

 annexation_871: "Доля Ньясаленду"
 annexation_871_desc: "Після початку окупації Ньясаленду, нам надійшли пропозиції щодо створення лояльної держави, очолювану місцевими лідерами, замість створення на цих територіях колонії. Як ви вважаєте, що нам потрібно зробити Ньясаленд?"
 annexation_events.5036.a: "Створити державу Ньясаленд."
 annexation_events.5036.b: "Віддати її державі [955.owner.GetNameDef]."

 annexation_543: "Доля Мадагаскару"
 annexation_543_desc: "Величезний острів зараз перебуває під нашим контролем. Можливо, нам слід утворити на Мадагаскарі протекторат, чи нам слід повністю приєднати його до нашої країни?"
 annexation_events.5037.a: "Створити державу Мадагаскар."
 annexation_events.5037.b: "Відновити монархію Меріни."

 annexation_681: "Доля Південної Африки"
 annexation_681_desc: "Зрештою Південна Африка капітулювала перед нашими славетними арміями, які нині крокують Капською землею. Після початку нашої військової окупації й тепер, коли війна закінчилася, пролунали голоси про необхідність створення маріонеткової південноафриканської держави для утримання регіону під контролем. Проте під час цих обговорень постало ще одне питання: якщо ми й створимо цю маріонеткову державу, чи повинна вона зберегти протекторат Бечуаналенд та зневірену провінцію Південна Родезія, які вона контролювала понад десятиліття, чи нам слід обмежити їхню зону впливу лише корінними землями країни? Вибір за вами."
 annexation_events.5038.a: "Звільнити Південну Африку."

 annexation_541: "Доля Намібії"
 annexation_541_desc: "Ми анексували колишню німецьку колонію – Міттельафрику. Проте постало питання про те, що нам робити із землями цієї колишньої колонії. Ми можемо створити на цих землях свою колонію. Також ми можемо продовжити окупацію цих земель. То яке наше рішення?"
 annexation_events.5039.a: "Створити державу Намібія!"

 annexation_542: "Доля Ботсвани"
 annexation_542_desc: "Протекторат Ботсвана, що перейшов від британського до південноафриканського керівництва, зазнав багатьох змін і тепер цілком готовий до незалежності. Чи варто нам створити ботсванського сателіта?"
 annexation_events.5040.a: "Створити державу Ботсвана."

 annexation_545: "Доля Зімбабве"
 annexation_545_desc: "Протекторат Зімбабве пережив багато битв за незалежність. Однак усі вони провалилися. Можливо, щоб уникнути кровопролиття, нам варто дати їм незалежність?"
 annexation_events.5041.a: "Створити державу Зімбабве."

 annexation_551: "Доля Судану"
 annexation_551_desc: "Судан опинився під нашим контролем. Ми маємо вирішити його подальшу долю."
 annexation_events.5042.a: "Звільнити Судан."
 annexation_events.5042.b: "Віддайте Нубію державі [egypt.GetNameDef] та звільніть решту Судану."

 annexation_906: "Доля Огадену"
 annexation_906_desc: "Спірні прикордонні території між Ефіопією та Сомалі були взяті під наш контроль, оскільки наші війська окупували регіон. Тепер ми повинні вирішити, що з ними робити."

 annexation_892: "Доля Джубаленду"
 annexation_892_desc: "Спірні прикордонні території між Кенією і Сомалі були взяті під наш контроль після того, як наші війська окупували регіон. Тепер ми повинні вирішити, що з ними робити."

 annexation_296: "Доля Португальської Гвінеї"
 annexation_296_desc: "Тепер, коли ми окупували колишню португальську колонію Гвінею, надійшла пропозиція створити маріонетковий уряд, керований частково місцевими жителями. Якщо ми погодимося на цей крок, було б розумно перенести резиденцію уряду з Болами — колоніального пережитку, важкодоступного й віддаленого від материка — до Бісау, чиє більш центральне розташування створить надійнішу основу для майбутньої держави."
 annexation_events.5045.a: "Сформувати державу Гвінея-Бісау"

 annexation_297: "Доля Екваторіальної Гвінеї"
 annexation_297_desc: "У зв'язку з нашою новою окупацією колишньої іспанської колонії Екваторіальної Гвінеї постало питання про створення маріонеткового уряду, частково керованого місцевими жителями, замість нової колонії, чи варто нам йти далі з цією ідеєю?"
 annexation_events.5046.a: "Сформувати державу Екваторіальна Гвінея."

 annexation_290: "Доля Рифу"
 annexation_290_desc: "Прибережна смуга Марокко, відома як Риф, тепер під нашим контролем, і ми повинні вирішити, що з нею робити."

 annexation_968: "Доля Іфні"
 annexation_968_desc: "Невелике портове місто Іфні тепер під нашим контролем, і ми повинні вирішити, що з ним робити."

 annexation_834: "Доля Гамбії"
 annexation_834_desc: "Прибережний регіон Гамбії тепер під нашим контролем, ми повинні вирішити, що з ним робити."

 annexation_950: "Доля Лоренсу-Маркіш"
 annexation_950_desc: "Південна половина Мозамбіку тепер під нашим контролем, і ми повинні вирішити, що з нею робити."

 annexation_928: "Доля Центрального Конго"
 annexation_928_desc: "Західна частина басейну річки Конго, яка спочатку була французькою колонією, тепер знаходиться під нашим контролем, і ми повинні вирішити, що з нею робити."
 annexation_events.5051.a: "[leopoldville.GetGrantTerritoryEventOption]"

