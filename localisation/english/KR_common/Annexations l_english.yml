 annexation_1074: "Доля регіону [1074.GetName]"
 annexation_1074_desc: "Невеликий регіон [1074.GetName] був взятий під наш контроль, оскільки наші війська окупували цей регіон. Тепер ми маємо вирішити, що з ним робити."

 annexation_300: "Доля Уругваю"
 annexation_300_desc: "Після успіху військової кампанії в Уругваї ми маємо вирішити, кому відійдуть ці землі."
 annexation_events.2044.a: "Звільнити лояльний Уругвай!"

 annexation_278: "Доля Аргентини"
 annexation_278_desc: "Після завоювання Аргентини ми маємо організувати компетентні адміністрації, щоб тримати територію під контролем. Тепер нам потрібно буде ухвалити рішення про долю регіону."
 annexation_events.2045.a: "Звільнити Аргентину повністю."
 annexation_events.2045.b: "Звільнити Аргентину та Патагонію."
 annexation_events.2045.c: "[patagonia.GetGrantTerritoryEventOption]"

 annexation_279: "Доля Чилі"
 annexation_279_desc: "Після довгої кампанії в ворожих чилійських Андах, нам нарешті вдалося зруйнувати чилійську оборону. Сантьяго тепер у наших руках! Тепер ми маємо ухвалити рішення про майбутнє Чилі."
 annexation_events.2046.a: "Звільнити лояльний Чилі!"

 annexation_506: "Доля регіону [506.GetName]"
 annexation_506_desc: "Регіон [506.GetName] перейшов під наш контроль, оскільки наші війська окупували цей регіон. Тепер ми повинні вирішити, що з ним робити."

 annexation_1078: "Доля Ессекібо"
 annexation_1078_desc: "Спірний регіон Ессекібо був взятий під наш контроль, оскільки наші війська окупували цей регіон. Тепер ми маємо вирішити, що з ним робити."

 annexation_854: "Доля регіону [854.GetName]"
 annexation_854_desc: "Спірний регіон [854.GetName] був взятий під наш контроль, оскільки наші війська окупували цей регіон. Тепер ми маємо вирішити, що з ним робити."

 annexation_694: "Доля французьких Карибів"
 annexation_694_desc: "Французькі острови Карибського басейну перейшли під наш контроль, оскільки наші війська окупували регіон. Тепер ми повинні вирішити, що з цим робити."
 annexation_events.2050.a: "Звільнити Союз Антильських островів і Гаяну."

 annexation_1077: "Доля регіону [1077.GetName]"
 annexation_1077_desc: "Острів [1077.GetName] перейшов під наш контроль, оскільки наші війська окупували регіон. Тепер ми повинні вирішити, що з ним робити."

 annexation_310: "Доля Східної Гаяни"
 annexation_310_desc: "Колишня французька колонія Східна Гаяна перейшла під наш контроль після того, як наші війська окупували регіон. Тепер ми повинні вирішити, що з нею робити."
 annexation_events.2052.a: "Звільнити Союз Антильських островів і Гаяну."

 annexation_311: "Доля регіону [311.GetName]"
 annexation_311_desc: "Колишня британська колонія [311.GetName] перейшла під наш контроль, оскільки наші війська окупували регіон. Тепер ми повинні вирішити, що з нею робити."

 annexation_474: "Доля Юкатану"
 annexation_474_desc: "Півострів Юкатан перейшов під наш контроль, оскільки наші війська окупували цей регіон. Тепер ми повинні вирішити, що з ним робити."
 annexation_events.2054.a: "Звільнити Юкатан."

 annexation_685: "Доля Панамського каналу"
 annexation_685_desc: "Вирішальна переправа через Панамський канал тепер під нашим контролем. Ми повинні вирішити, що з ним робити."

 annexation_1028: "Доля Вогняної Землі"
 annexation_1028_desc: "Віддалений острів Вогняна Земля тепер під нашим контролем. Ми повинні вирішити, що з ним робити."
 annexation_events.2056.a: "[magallanes.GetGrantTerritoryEventOption]"

 annexation_falklands: "Доля регіону [FROM.FROM.GetName]"
 annexation_falklands_desc: "Віддалений [FROM.FROM.GetName], про який сперечалися Аргентина та Британія, тепер під нашим контролем. Ми повинні вирішити, що з ним робити."
