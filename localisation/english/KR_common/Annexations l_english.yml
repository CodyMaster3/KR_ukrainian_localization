### Europe Events ###

 #annexation_germany_desc: "For the last fifty years, the German Empire has stood united in the centre of Europe. From the once-Polish lands of Prussia to the Francophone Catholic west, from Lower Saxony in the north to Bavaria in the south, the conservative Kaiserreich created one nation where before there had been many. However, with our victory, we have a chance to radically restructure the German state structure. Our total conquest has shattered the spirit of German civil resistance, and we essentially have unlimited license to choose whichever government, or governments, serve our interests in Central Europe."

 annexation_28: "Доля Ельзас-Лотарингії"
 annexation_28_desc: "З моменту капітуляції наших останніх супротивників у Європі наша військова адміністрація керувала територіями Ельзасу та Лотарингії, за які тривалий час сперечалися Німеччина та Франція, за законами воєнного стану. Проте разом із настанням миру приходять і сподівання на зміни: посланців зі Страсбурга, часто у супроводі пихатих французьких послів, дедалі частіше помічають у владних коридорах у місті [ROOT.Capital.GetName]. Вони сподіваються натиснути на виснажених бюрократів, аби повернути цю здебільшого німецькомовну територію Франції, доки ніхто в нашій адміністрації не встиг сісти й досконало розглянути це питання. Чи варто нам задовольнити їхні прохання? Чи Ельзас раз і назавжди належить Німеччині? Або ж дати ельзасцям відчути кілька років окупації ([ROOT.GetAdjective]), перш ніж належно розглянути це питання, коли світова ситуація якнайкраще цьому сприятиме?"
 annexation_events.1001.a: "[german_palatinate.GetGrantTerritoryEventOption]"
 annexation_events.1001.b: "[german_baden.GetGrantTerritoryEventOption]"

 annexation_8: "Доля Люксембургу"
 annexation_8_desc: "Протягом століть Люксембурзьке питання турбувало великі держави. Після Світової війни та двадцяти п'яти років німецького правління мало хто з люксембуржців плекає надії на незалежність, а в епоху синдикалізму, безпосередньої авіаційної підтримки та криптографічного дешифрування будь-яка згадка Салічної правди викликає радше здивування, аніж презирство. Велике Герцогство Люксембург не повернеться на карту Європи. Проте немає й потреби повертати його Німеччині. Трохи більше ніж століття тому Люксембург без жодних нарікань входив спершу до складу Франції, а згодом — Бельгії, і якщо це рішення відповідатиме інтересам нашої зовнішньої політики, навряд чи Люксембург створить проблеми й цього разу."

 annexation_781: "Доля Рейнланду"
 annexation_781_desc: "Битке серце німецької промисловості, підґрунтя прусського домінування в Німеччині та жорстока арена Другої світової війни — Рейнланд у певному сенсі є місцем, найбільш відповідальним за жахи двадцятого століття. Відтак деякі радники в нашому уряді рекомендували відокремити Рейнланд від Німеччини та навіть накласти величезні репарації, аби позбавити регіон сили. З іншого боку, коли війна щойно закінчилася, малоймовірно, що Німеччина знову зможе загрожувати нам найближчим часом, і вона була б значно дієздатнішим союзником та економічним партнером разом із ливарнями Руру, ніж без них. Що б ми не вирішили, було б розумно зробити це якнайшвидше, адже що довше ми окупуємо Рейнланд, то більше наших ресурсів він поглинатиме, а не вироблятиме."
 annexation_events.1003.a: "Звільнити Рейнську державу."
 annexation_events.1003.b: "Звільнити Рейнську державу та впровадити суворі репарації."
