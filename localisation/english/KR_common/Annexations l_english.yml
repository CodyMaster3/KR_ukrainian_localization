 annexation_336: "Доля Сінгапуру"
 annexation_336_desc: "Величне місто Сінгапур, колишній торговельний центр Британії та адміністративна столиця східних територій Німеччини, перейшло під контроль наших військ. Хоча до британського правління воно було малозаселене корінними малайцями, невдовзі місто стрімко розрослося, і нині більшість його населення становлять нащадки китайських іммігрантів. Його вигідне розташування в Сінгапурській протоці принесло йому прізвисько «Гібралтар Сходу», і цю цінність необхідно враховувати під час визначення майбутнього цієї острівної держави."

