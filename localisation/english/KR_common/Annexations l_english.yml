 annexation_59: "Доля Північної Німеччини"
 annexation_59_desc: "Перш ніж запанувати над Європою, пруссаки підкорили Німеччину, а перш ніж підкорити Німеччину, вони почали з Північнонімецького союзу. Тепер [Root.GetNameDef] відібрала навіть Північну Німеччину, і саме [Root.GetNameDef] має вирішити подальшу долю нижньосаксонських земель. Ми могли б створити маріонеткову державу зі столицею в Гамбурзі чи Брауншвейзі, уперше за багато століть змістивши центр німецького політичного життя на захід. Як альтернативу, ми могли б надати перевагу одній з інших союзних німецьких держав, можливо, зміцнивши її легітимність та сили для майбутнього самостійного возз'єднання Німеччини. Чи можемо ми дозволити собі ризикнути? Або ж заради безпеки Європи наші солдати мусять окупувати Північну Німеччину в найближчому майбутньому?"
 annexation_events.1004.a: "Звільнити північнонімецьку державу."

 annexation_782: "Доля регіону [782.GetName]"
 annexation_782_desc: "Однією з перших жертв прусського імперіалізму стала данськомовна провінція [782.GetName]. Саме після Другої Шлезвізької війни у 1860-х роках Пруссія змогла встановити панування над Німеччиною внаслідок війни, що розпочалася навколо її плацдарму в цьому регіоні. Хоча за минуле століття Данія та Німеччина були союзниками, для місцевого населення факт правління іноземців залишався болючою темою. Проте іноді дипломатична та військова необхідність переважають над тонкощами мовної історії, і немає сумніву, що ця територія була б у більшій безпеці в руках німецького союзника, ніж данського ворога. Наш військовий командувач у цьому регіоні поки що вміло стримує заворушення, але чи не варто ухвалити рішення щодо майбутнього провінції [782.GetName] і позбавити його зайвого клопоту?"

 annexation_64: "Доля Пруссії"
 annexation_64_desc: "Бранденбург був центром тяжіння Пруссії, а отже, і створеної Пруссією Німецької імперії. Десятиліттями Берлін вирував життям — здебільшого політиками та дипломатами великих держав, але станом на [GetYear] рік — гавкотом наказів і вигуками солдатів, а тепер — вимушеною тишею під час воєнного стану ([Root.GetAdjective]). Із крахом колишньої Німецької держави майже неминуче настає початок нової.\n\nНімецька держава зі столицею в Берліні була б потужним претендентом на майбутнє возз'єднання Німеччини, тому деякі члени нашого уряду запропонували передати Бранденбург і Берлін німецькому карликовому державному утворенню із західного міста, аби Пруссія більше ніколи не повстала знову. Інші ж наголошують на потребі мати сильного прусського союзника для протидії нашим ворогам на їхніх кордонах і стверджують, що за нашої військової переваги над Європою Пруссія навіть подумати не посміє про новий виклик нам. Безумовно, пруссаки цілком здатні оцінити іронію хорошої, тривалої «тимчасової» військової окупації."
 annexation_events.1006.a: "Звільнити Прусську державу."
 annexation_events.1006.c: "[north_germany.GetGrantTerritoryEventOption]"

