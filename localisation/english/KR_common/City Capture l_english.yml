l_english:

### City Capture Events ###

 city_capture.251.t: "Падіння Лондона"
 city_capture.251.d.generic: "Повідомлення з Лондона підтверджують, що столиця [FROM.FROM.GetNameDef] була захоплена наступаючими [FROM.GetAdjective] військами після тривалих і запеклих боїв уздовж річки Темзи. [FROM.FROM.GetAdjective] сили чинили запеклий опір, сподіваючись затримати [FROM.GetAdjective] війська якомога довше, але зрештою були відкинуті.\n\nУперше з 1216 року Лондон упав під натиском іноземного загарбника. В місті панує важка атмосфера, уночі все ще лунають поодинокі постріли, поки [FROM.FROM.GetAdjective] сили відступають, залишаючи протестувальників сам на сам у вуличних сутичках із [FROM.GetAdjective] військовою поліцією."
 city_capture.251.d.entente: "Повідомлення з Лондона підтверджують, що столиця синдикалістського Союзу Британії була захоплена наступаючими канадськими солдатами після запеклих боїв уздовж річки Темзи. Британські сили чинили запеклий опір, сподіваючись затримати роялістів якомога довше, але зрештою були відкинуті.\n\nКоли пил осідає, стає зрозуміло: Лондон знову опинився в руках уряду, який залишив його в 1925 році. Атмосфера в місті залишається гнітючою, уночі все ще лунають спалахи стрілянини, поки синдикалістська армія відступає, залишаючи лише протестувальників битися проти канадських військ."
 city_capture.251.d.ireland: "За приголомшливим перебігом подій, повідомлення з Лондона підтверджують, що місто було захоплене наступаючими [FROM.GetAdjective] військами після лютих боїв уздовж річки Темзи. Лише кілька десятиліть тому саме [FROM.FROM.GetAdjective] сили захоплювали [FROM.GetAdjective] міста в розпал Війни за незалежність, але тепер шальки терезів рішуче схилилися в інший бік: над Лондоном майорить [FROM.GetAdjective] прапор.\n\nХоча [FROM.GetAdjective] солдати загалом зберігають дисципліну, попри внутрішні заклики до помсти Британії, атмосфера в місті залишається важкою. На вулицях усе ще спалахують перестрілки, поки [FROM.FROM.GetAdjective] війська відступають, залишаючи протестувальників битися на вулицях проти [FROM.GetAdjective] військової поліції."
 city_capture.251.a: "Це лише тимчасова невдача!"
 city_capture.251.b: "Це початок кінця."
 city_capture.251.c: "З переходом Лондона до [FROM.GetAdjective] рук\nпоразка [FROM.FROM.GetAdjective] неминуча."
 city_capture.251.e: "Схоже, король повернувся."
 city_capture.251.f: "Гордо й високо над містом Лондоном вони вивісили прапор війни."

 city_capture.252.t: "Падіння Парижа"
 city_capture.252.d.germany: "Повідомлення з Парижа підтверджують, що [FROM.FROM.GetAdjective] столиця була захоплена наступаючими німецькими військами після запеклих боїв на її широких авеню та берегах Сени. [FROM.FROM.GetAdjective] сили чинили запеклий опір, сподіваючись затримати німців якомога довше, але зрештою були відкинуті.\n\nПоки приголомшені парижани спостерігали за тим, що відбувається, німецька армія знову пройшла тим самим маршрутом, що й під час Світової війни: Єлисейськими полями в напрямку Ейфелевої вежі. Ця урочиста хода посеред глупої ночі зрештою переросла у жорстокі міські бої з [FROM.FROM.GetAdjective] підпіллям, коли [GER.GetAdjective] танки легко трощили кволі барикади на широких паризьких проспектах."
 city_capture.252.d.other: "Повідомлення з Парижа підтверджують, що [FROM.FROM.GetAdjective] столиця була захоплена наступаючими [FROM.GetAdjective] військами після запеклих боїв на її широких авеню та берегах Сени. [FROM.FROM.GetAdjective] сили чинили запеклий опір, сподіваючись затримати [FROM.GetAdjective] війська якомога довше, але зрештою були відкинуті.\n\nПоки приголомшені парижани спостерігали за тим, що відбувається, [FROM.GetAdjective] армія урочисто пройшла Єлисейськими полями в напрямку Ейфелевої вежі. Утім, ця святкова хода зрештою переросла у жорстокі міські сутички з [FROM.FROM.GetAdjective] підпіллям посеред глупої ночі, а [FROM.GetAdjective] сили без зусиль розбивали кволі барикади на широких паризьких проспектах."
 city_capture.252.a.germany: "Німці не переможуть! Франція не може впасти знову!"
 city_capture.252.a: "Ні! Ми не можемо дозволити Парижу впасти ще раз!"
 city_capture.252.b: "Наша перемога над [FROM.FROM.GetNameDef] тепер фактично гарантована."
 city_capture.252.c.germany: "Цього разу фінал мусив бути гірким."
 city_capture.252.c: "Схоже, падіння [FROM.FROM.GetNameDef] тепер практично неминуче."

 city_capture.253.t: "Падіння Берліна"
 city_capture.253.d.france: "Повідомлення з Берліна підтверджують, що [FROM.FROM.GetAdjective] столиця була захоплена наступаючими військами комунарів після тривалих і безжальних боїв у найбільшому місті Райхспакту. [FROM.FROM.GetAdjective] сили чинили запеклий опір, сподіваючись затримати комунарів якомога довше, але зрештою були відкинуті.\n\nНа очах приголомшених берлінців армія комунарів пройшла парадом крізь центральну арку Бранденбурзьких воріт — право, яке раніше належало виключно кайзеру та його родині, — після чого організований хор виконав «Інтернаціонал», поки славетний монумент на очах усього світу завішували стягами Комуни. Наступними днями війська комунарів затримували [FROM.FROM.GetAdjective] солдатів і високопосадовців, вивозячи їх фургонами військової поліції."
 city_capture.253.d.lkmt: "Повідомлення з Берліна підтверджують, що [FROM.FROM.GetAdjective] столиця була захоплена наступаючими дивізіями Національно-революційної армії після тривалих і безжальних боїв у столиці Райхспакту. [FROM.FROM.GetAdjective] сили чинили запеклий опір, сподіваючись затримати війська НРА якомога довше, але зрештою були відкинуті.\n\nНа очах приголомшених берлінців прапор Білого Сонця, Синього Неба та Цілком Червоної Землі замайорів над сильно пошкодженим Райхстагом — іронічна доля для Німецької імперії, адже не так давно німецька інтервенція мало не знищила Ґоміньдан. Схоже, Ґоміньдан повернув сповна приниження поразки."
 city_capture.253.d.other: "Повідомлення з Берліна підтверджують, що [FROM.FROM.GetAdjective] місто було захоплене наступаючими [FROM.GetAdjective] військами після тривалих і безжальних боїв у найбільшому місті Райхспакту. [FROM.FROM.GetAdjective] сили чинили запеклий опір, сподіваючись затримати [FROM.GetAdjective] сили якомога довше, але зрештою були відкинуті.\n\nПоки приголомшені берлінці спостерігали за тим, що відбувається, [FROM.GetAdjective] армія пройшла парадом біля Бранденбурзьких воріт, після чого вислухала промову [FROM.GetLeader] перед знаменитим монументом. Утім, найбільше увагу світу привернула світлина, зроблена одним із бійців: [FROM.GetAdjective] солдат гордо тримає [FROM.GetAdjective] прапор на даху сильно понівеченого Райхстагу."
 city_capture.253.a.france: "[FROM.FROM.GetNameDefCap] не може закінчитися ось так. Відкиньте комунарів назад!"
 city_capture.253.a.lkmt: "Як таке можливо? Цього не може бути!"
 city_capture.253.a: "Цього не може бути! Як міг упасти Берлін?!"
 city_capture.253.b.france: "Верден, Шмен-де-Дам, Сомма. За всіх них помстилися."
 city_capture.253.b.lkmt: "За Північний похід помстилися."
 city_capture.253.b: "Тепер для [FROM.FROM.GetNameDef] усе майже скінчено."
 city_capture.253.c: "Справді велична перемога для [FROM.GetNameDef]."

 city_capture.254.t: "Падіння Мадрида"
 city_capture.254.d.carlist: "Повідомлення з Мадрида підтверджують, що [FROM.FROM.GetAdjective] місто було захоплене наступаючими [FROM.GetAdjective] військами після тривалих і безжальних боїв на пагорбах та у старому місті. [FROM.FROM.GetAdjective] сили чинили запеклий опір, сподіваючись затримати [FROM.GetAdjective] сили якомога довше, але зрештою були відкинуті.\n\nОфіційні джерела вказують, що попри масове мародерство, пам'ятки та визначні будівлі зовсім не постраждали. Очікується, що з падінням столиці [FROM.FROM.GetNameDef] незабаром капітулює, попри заклики [FROM.FROM.GetAdjective] генералів до нещадного опору."
 city_capture.254.d.other: "Повідомлення з Мадрида підтверджують, що [FROM.FROM.GetAdjective] місто було захоплене наступаючими [FROM.GetAdjective] військами після тривалих і безжальних боїв на пагорбах та у старому місті. [FROM.FROM.GetAdjective] сили чинили запеклий опір, сподіваючись затримати [FROM.GetAdjective] сили якомога довше, але зрештою були відкинуті.\n\nОфіційні звіти свідчать, що Королівський палац у Мадриді був дощенту розграбований [FROM.GetAdjective] солдатами та згорів уночі, а ворота Алькала були заміновані та знищені разом із багатьма іншими менш відомими королівськими монументами. Очікується, що з падінням столиці [FROM.FROM.GetNameDef] незабаром капітулює, попри заклики [FROM.FROM.GetAdjective] генералів до нещадного опору."
 city_capture.254.a: "Без Мадрида ми приречені."
 city_capture.254.b: "Мадрид нарешті наш!"
 city_capture.254.c: "Ось так падає серце [FROM.FROM.GetNameDef]."

 city_capture.255.t: "Падіння Барселони"
 city_capture.255.d: "Повідомлення з Барселони підтверджують, що [FROM.FROM.GetAdjective] місто було захоплене наступаючими [FROM.GetAdjective] військами після запеклих сутичок уздовж гірського хребта Серра-де-Кольсерола. [FROM.FROM.GetAdjective] сили чинили стійкий опір, сподіваючись затримати [FROM.GetAdjective] війська якомога довше, але зрештою були відкинуті.\n\nНадходили повідомлення про тривалі міські бої в Готичному кварталі Барселони та поодинокі сутички вздовж Барселонської рив'єри. Ця сама рив'єра стала місцем величного параду [FROM.GetAdjective] військ, які крокували сонячними пляжами — наочний знак того, що [FROM.GetNameDef] встановила контроль над каталонським містом."
 city_capture.255.a: "Це кепсько..."
 city_capture.255.b: "Барселона нарешті наша!"
 city_capture.255.c: "Ось так падає серце старої Каталонії."

 city_capture.256.t: "Падіння Бургоса"
 city_capture.256.d.SPA: "Повідомлення з Бургоса підтверджують, що тимчасова карлістська столиця була захоплена наступаючими іспанськими військами після сутичок у передмістях. Карлістські сили чинили запеклий опір, намагаючись затримати іспанські частини якомога довше, але зрештою були відкинуті.\n\nКастильці, які тікають на північ до узбережжя Країни Басків, зі сльозами розповідають про спустошення та пожежі на рідній землі, охопленій братовбивчою війною, та про звірства іспанських солдатів щодо власного народу. Ходять чутки, що карлістське ополчення таємно вивезло короля Хав'єра разом із потоком біженців, але місце його перебування невідоме. Багато хто сподівається, що Карлістська Іспанія продовжить боротьбу на важкодоступному плоскогір'ї Месета, аби захистити свої інші оплоти."
 city_capture.256.d.SWF: "Повідомлення з Бургоса підтверджують, що тимчасова карлістська столиця була захоплена наступаючими анархо-іспанськими військами після сутичок на горбистій місцевості. Карлістські сили чинили запеклий опір, намагаючись затримати ворога, але зрештою були відкинуті.\n\nКастильці, які тікають на північ до узбережжя Країни Басків, зі сльозами розповідають про спустошення та згарища на рідній землі, а також про звірства солдатів CNT-FAI щодо власного народу. Подейкують, що короля Хав'єра разом із біженцями вивело карлістське ополчення, проте його напрямок залишається невідомим. Чимало людей сподіваються, що Карлістська Іспанія продовжить опір на центральному плато, захищаючи рідні домівки від синдикалістської навали."
 city_capture.256.a: "Ми не здамося! За Хав'єра!"
 city_capture.256.b: "Нищівний удар по загарбницьких мріях карлістів."
 city_capture.256.c: "Чи можуть карлісти сподіватися на відновлення після такого?"

 city_capture.257.t: "Падіння Гібралтару"
 city_capture.257.d: "Повідомлення з Гібралтару підтверджують, що фортеця була захоплена [FROM.GetAdjective] військами після стрімкої висадки десанту та сутичок на узбережжі, які швидко змістилися до самої Гібралтарської скелі. [FROM.FROM.GetAdjective] сили чинили запеклий опір, намагаючись затримати [FROM.GetAdjective] загарбників якомога довше, але зрештою були розбиті.\n\nХоча захоплення самого Гібралтару відбулося швидко, бої в тунелях усередині Скелі тривали до пізнього вечора, поки оточений і зневірений [FROM.FROM.GetAdjective] гарнізон не оголосив про офіційну капітуляцію."
 city_capture.257.a: "Тепер вони контролюють вихід до Середземного моря..."
 city_capture.257.b: "Брама до Середземномор'я наша!"
 city_capture.257.c: "Могутня Гібралтарська скеля впала?"

 city_capture.258.t: "Падіння Лісабона"
 city_capture.258.d: "Повідомлення з Лісабона підтверджують, що [FROM.FROM.GetAdjective] місто було захоплене наступаючими [FROM.GetAdjective] військами після боїв у районі Серра-де-Монсанто та стрімкого прориву до гирла річки Тежу. [FROM.FROM.GetAdjective] сили чинили впертий опір, сподіваючись затримати [FROM.GetAdjective] війська якомога довше, але зрештою зазнали поразки.\n\nБоротьба за Лісабон ускладнювалася тим, що [FROM.FROM.GetAdjective] оборонці навмисно підірвали міські мости, змусивши нападників форсувати широку річку для повного взяття міста. На площі Праса-ду-Комерсіу відбулася церемонія, де [FROM.GetAdjective] сили закликали до капітуляції всіх залишкових [FROM.FROM.GetAdjective] солдатів, що сховалися на пагорбах."
 city_capture.258.a: "Ми битимемося до останнього!"
 city_capture.258.b: "Нарешті Лісабон під нашим контролем."
 city_capture.258.c: "Зрозуміло..."

 city_capture.259.t: "Падіння Чикаго"
 city_capture.259.d.apg: "Ополчення мінутменів уже тривалий час пробивалося до тимчасової столиці [FROM.FROM.GetNameDef] — Чикаго. Нині надходять повідомлення про неминуче захоплення міста наступаючими юніоністськими частинами. Місцеперебування [FROM.FROM.GetLeader] наразі невідоме, проте вважається, що [FROM.FROM.GetLeader.GetSheHe] разом із підрозділами ополчення втік з міста.\n\nПовідомляють про масові розправи: мінутмени зганяють полонених ополченців та активістів WCA на розстріли, а хмарочосними кварталами міста неконтрольовано поширюються численні пожежі. Чи це кінець соціалістичного експерименту в Америці?"
 city_capture.259.d.usa: "Федеральні сили вже тривалий час наступали на тимчасову столицю [FROM.FROM.GetNameDef] — Чикаго. Нині надходять повідомлення про неминуче захоплення міста наступаючими частинами. Місцеперебування [FROM.FROM.GetLeader] наразі невідоме, проте вважається, що [FROM.FROM.GetLeader.GetSheHe] разом із підрозділами ополчення втік з міста.\n\nЗа наявними даними, військова поліція розпочала масові арешти ймовірних агітаторів і провідних діячів синдикалістів, тоді як кварталами висоток вирують масштабні пожежі. Чи це кінець соціалістичного експерименту в Америці?"
 city_capture.259.d.other: "[FROM.GetAdjective] сили вже тривалий час просувалися до тимчасової столиці [FROM.FROM.GetNameDef] — Чикаго. Зараз надходять повідомлення про взяття міста наступаючими військами. Місцеперебування [FROM.FROM.GetLeader] наразі невідоме, проте вважається, що [FROM.FROM.GetLeader.GetSheHe] разом із підрозділами ополчення втік з міста.\n\nЗгідно зі звітами, військова поліція розпочала облави та затримання потенційних агітаторів і провідних лідерів синдикалістів, тоді як у висотних кварталах міста вирують численні пожежі, поки [FROM.GetAdjective] війська намагаються встановити лад."
 city_capture.259.a: "Боротьба ще не закінчена!"
 city_capture.259.b: "Оплот синдикалістів упав!"
 city_capture.259.c: "Можливо, війна скоро скінчиться?"

 city_capture.260.t: "Падіння Батон-Ружа"
 city_capture.260.d.wca: "Соціалістичні загони вже певний час наступали на місто Батон-Руж. Нині надходять повідомлення про неминуче взяття міста наступаючими ополченцями. Місцеперебування [FROM.FROM.GetLeader] наразі невідоме, проте вважається, що [FROM.FROM.GetLeader.GetSheHe] терміново евакуювався у сільську місцевість.\n\nТривожні звістки повідомляють, що представників Союзу та мінутменів лінчують розлючені натовпи на вулицях, а саме місто дощенту розграбоване й охоплене вогнем у центральних районах. Чи це кінець реакційного повстання в Америці?"
 city_capture.260.d.usa: "Федеральні сили вже тривалий час просувалися до Батон-Ружа. Нині надходять дані про неминуче взяття міста наступаючими американськими частинами. Місцеперебування [FROM.FROM.GetLeader] наразі невідоме, проте вважається, що [FROM.FROM.GetLeader.GetSheHe] терміново евакуювався у сільську місцевість.\n\nЗгідно зі звітами, військова поліція розпочала масові затримання представників Союзу та мінутменів, а містом безконтрольно ширяться пожежі, поки Федеральна армія зосереджена на відновленні порядку. Чи це кінець реакційного повстання в Америці?"
 city_capture.260.d.other: "[FROM.GetAdjective] сили вже певний час наступали на місто Батон-Руж. Нині надходять повідомлення про неминуче взяття міста наступаючими частинами. Місцеперебування [FROM.FROM.GetLeader] наразі невідоме, проте вважається, що [FROM.FROM.GetLeader.GetSheHe] терміново евакуювався у сільську місцевість.\n\nЗа повідомленнями, військова поліція розпочала масові арешти мінутменів і впливових лідерів Союзу, а кварталами хмарочосів неконтрольовано ширяться пожежі, поки [FROM.GetAdjective] війська намагаються навести лад."
 city_capture.260.a: "Боротьба ще не закінчена!"
 city_capture.260.b: "Оплот Союзу впав!"
 city_capture.260.c: "Можливо, війна скоро скінчиться?"

 city_capture.261.t: "Падіння Денвера"
 city_capture.261.d.wca: "Соціалістичні загони вели поодинокі сутички з федеральним урядом на Великих рівнинах. Сьогодні їхні зусилля увінчалися успіхом: після широкомасштабного наступу через долину річки Саут-Платт вони нарешті увійшли в Денвер — столицю Колорадо та головний федеральний оплот на Великих рівнинах.\n\nПадіння «Міста-королеви рівнин» здається важким ударом по майбутньому Сполучених Штатів, і в міру того як бої в долині Саут-Платт вщухають, чимало експертів сходяться на думці, що капітуляція федерального уряду перед Робітничим конгресом тепер майже неминуча."
 city_capture.261.d.acc: "[FROM.GetAdjective] призовники вели тривалі й важкі бої з федеральним урядом у Скелястих горах. Сьогодні їхні зусилля завершилися тріумфом: після масштабного штурму через річку Саут-Платт вони нарешті увійшли до міста Денвер — столиці Колорадо та головного федерального оплоту на Великих рівнинах.\n\nПадіння «Міста-королеви рівнин» стало суттєвим ударом по майбутньому Сполучених Штатів, і коли сутички в долині Саут-Платт затихають, багато експертів визнають, що федеральний уряд тепер майже напевно піде на поступки [FROM.GetNameDef]."
 city_capture.261.d.apg: "Ополчення мінутменів вело поодинокі сутички з федеральним урядом на просторах Великих рівнин. Сьогодні їхні зусилля завершилися взяттям міста після масштабного штурму долини Саут-Платт: бійці нарешті увійшли до Денвера — столиці Колорадо та головного оплоту федералів на Великих рівнинах.\n\nПадіння «Міста-королеви рівнин» виглядає колосальним ударом по майбутньому США, і в міру згасання боїв у долині Саут-Платт більшість аналітиків схиляється до думки, що капітуляція федерального уряду перед мінутменами тепер практично неминуча."
 city_capture.261.d.other: "[FROM.GetAdjective] сили вже певний час наступали через Великі рівнини. Сьогодні їхні зусилля завершилися успіхом: після масштабного штурму долини Саут-Платт вони увійшли до Денвера — столиці Колорадо та головного оплоту федералів, що залишався в регіоні.\n\nПадіння «Міста-королеви рівнин» здається серйозним переломом для майбутнього Сполучених Штатів, і коли бої в долині Саут-Платт стихають, стає цілком очевидно, що [FROM.GetNameDef] здобуває вирішальну перевагу."
 city_capture.261.a: "Боротьба ще не закінчена!"
 city_capture.261.b: "Федеральний оплот упав!"
 city_capture.261.c: "США більше не витримають, чи не так?"

 city_capture.262.t: "Падіння Сакраменто"
 city_capture.262.d: "[FROM.GetAdjective] війська вели тривалі й важкі бої з каліфорнійськими новобранцями у Скелястих горах. Сьогодні їхні зусилля завершилися успіхом: після широкомасштабного наступу через Амерікан-Рівер вони нарешті увійшли до Сакраменто — столиці штату Каліфорнія та резиденції Капітолія штату.\n\nХоч місто й не має вирішального стратегічного значення, ця подія закріплює [FROM.GetAdjective] контроль над Скелястими горами. Тепер, коли вся Центральна долина відкрита для [FROM.GetAdjective] солдатів, більшість експертів сходиться на думці, що [FROM.FROM.GetNameDef] варто піти на мирні переговори з [FROM.GetNameDef]."
 city_capture.262.a: "Боротьба ще не закінчена!"
 city_capture.262.b: "Каліфорнійський оплот упав!"
 city_capture.262.c: "Чи закінчиться коли-небудь ця громадянська війна?"

 city_capture.263.t: "Падіння Вашингтона"
 city_capture.263.d.wca: "Соціалістичні ополченці наблизилися до символічної столиці Сполучених Штатів — Вашингтона, округ Колумбія, — і захопили її. Вони штурмували будівлю Капітолія, натрапивши на запеклий опір, але зрештою прорвали оборону, і тепер над Капітолієм США майорить прапор [FROM.GetNameDef].\n\nХодять чутки, що соціалістичні ополченці зганяють усіх знайдених у місті політичних представників, аби «влаштувати їм суд», хоча непідтверджені джерела стверджують, що більшість провідних урядовців було евакуйовано під час битви, і наразі їхнє місцеперебування невідоме."
 city_capture.263.d.apg: "Ополчення мінутменів наблизилося до символічної столиці Сполучених Штатів — Вашингтона, округ Колумбія, — і захопило її. Вони штурмували будівлю Капітолія, натрапивши на запеклий опір, але зрештою прорвали оборону, і тепер над Капітолієм США майорить прапор [FROM.GetNameDef].\n\nХодять чутки, що мінутмени зганяють усіх знайдених у місті політичних представників, аби «перевірити їхню лояльність», хоча непідтверджені джерела стверджують, що більшість провідних урядовців було евакуйовано під час битви, і наразі їхнє місцеперебування невідоме."
 city_capture.263.d.acc_nee: "[FROM.GetAdjective] призовники наблизилися до символічної столиці Сполучених Штатів — Вашингтона, округ Колумбія, — і захопили її. Вони штурмували будівлю Капітолія, натрапивши на запеклий опір, але зрештою прорвали оборону, і тепер над Капітолієм США майорить прапор [FROM.GetNameDef].\n\nПодальші події розгорталися відносно спокійно: [FROM.GetAdjective] представники зустрілися з генералом, який керував наступом, хоча непідтверджені джерела стверджують, що важливі діячі федерального уряду були евакуйовані під час битви, і наразі їхнє місцеперебування невідоме."
 city_capture.263.d.can: "[FROM.GetAdjective] армія наблизилася до символічної столиці Сполучених Штатів — Вашингтона, округ Колумбія, — і захопила її. Вони штурмували будівлю Капітолія, натрапивши на запеклий опір, але зрештою прорвали оборону, і тепер над Капітолієм США майорить прапор [FROM.GetNameDef].\n\nНа відміну від 1812 року, масових підпалів не відбулося, проте окремих [FROM.FROM.GetAdjective] урядовців було заарештовано [FROM.GetAdjective] кінною поліцією через те, що [FROM.GetAdjective] уряд назвав «запобіжними заходами». Непідтверджені джерела заявляють, що важливі діячі федерального уряду були евакуйовані під час битви, і їхнє поточне місцеперебування невідоме."
 city_capture.263.d.feds: "[FROM.GetAdjective] армія наблизилася до символічної столиці Сполучених Штатів — Вашингтона, округ Колумбія, — і захопила її. Вони штурмували будівлю Капітолія, натрапивши на запеклий опір, але зрештою прорвали оборону, і тепер над Капітолієм США знову майорить прапор [FROM.GetNameDef].\n\nХодять чутки, що федералістські ополченці зганяють усіх знайдених у місті політичних представників, аби «влаштувати їм суд», хоча непідтверджені джерела заявляють, що більшість важливих державних діячів було евакуйовано під час битви, і їхнє поточне місцеперебування невідоме."
 city_capture.263.d.other: "[FROM.GetAdjective] армія наблизилася до символічної столиці Сполучених Штатів — Вашингтона, округ Колумбія, — і захопила її. Вони штурмували будівлю Капітолія, натрапивши на запеклий опір, але зрештою прорвали оборону, і тепер над Капітолієм США майорить прапор [FROM.GetNameDef].\n\nЦе призвело до жорстких репресій проти місцевих урядовців: повідомляють про масові арешти та навіть поширюються чутки про розстріли без суду в самому Капітолії, хоча непідтверджені джерела стверджують, що найважливіші посадовці федерального уряду були евакуйовані під час битви, і наразі їхнє місцеперебування невідоме."

