 city_capture.264.t: "Падіння Сінгапуру"
 city_capture.264.d.japan: "Сінгапур, «Східний Гібралтар», був захоплений силами Імперської армії Японії, попри репутацію неприступної фортеці, яку йому приписували колишні британські володарі та нові німецькі господарі.\n\nЯпонська військова адміністрація Сінгапуру обрала своєю штаб-квартирою будівлю Фуллертона, а саме місто перейменували на Сьонанто, що приблизно перекладається як «Острів Півдня, здобутий в епоху Сьова». На вулицях з'явилися масові патрулі кемпейтай, покликані чітко дати зрозуміти: японці тут назавжди."
 city_capture.264.d.siam: "Сінгапур, «Східний Гібралтар», був захоплений [SIA.GetAdjective] військами [SIA.GetSIAprefixEN], попри репутацію неприступної фортеці, яку йому приписували колишні британські володарі та нові німецькі господарі.\n\n[SIA.GetAdjective] військова адміністрація Сінгапуру обрала своєю штаб-квартирою готель «Раффлз», а місто було перейменовано на Сінханакхон, що приблизно перекладається як «Місто лева». Відтепер Малаккська протока майже повністю опинилася під [SIA.GetAdjective] контролем."
 city_capture.264.d.other: "Сінгапур, «Східний Гібралтар», був захоплений [FROM.GetAdjective] силами, попри репутацію неприступної фортеці, яку йому приписували колишні британські володарі та нові німецькі господарі.\n\n[FROM.GetAdjective] військова адміністрація Сінгапуру обрала своєю штаб-квартирою будівлю Фуллертона. Військова поліція масово патрулює вулиці, чітко даючи зрозуміти: [FROM.GetAdjective] сили прийшли сюди всерйоз і надовго."
 city_capture.264.a.japan: "За Імператора!"
 city_capture.264.a.siam: "Сінханакхон і прилеглі території є невіддільною частиною Сіаму!"
 city_capture.264.a.other: "Місто лева тепер у наших руках!"
 city_capture.264.b.germany: "Вони пошкодують про цю дрібну колоніальну крадіжку, щойно прибуде Кайзерліхмаріне!"
 city_capture.264.b.other: "Сінгапур упав? Як це можливо?!"
 city_capture.264.c: "Сінгапур є законною британською колонією. Будемо пильно стежити за розвитком подій."
 city_capture.264.d: "[FROM.GetNameDef] завдає нищівного удару по німецькому пануванню в Ост-Індії."

 city_capture.265.t: "Падіння Нью-Йорка"
 city_capture.265.d.wca: "[FROM.GetAdjective] ополченці вели поодинокі перестрілки з Червоною гвардією вниз за течією річки Гудзон. Сьогодні вранці укріплення на пагорбах — як природні, так і зведені людиною — були вибиті з рук соціалістів. Невдовзі після цього острів Мангеттен був змушений капітулювати, аби уникнути колосальних людських жертв міських боїв. Оборонці наказали залишкам Червоної гвардії вивезти золото з будівлі Федерального резервного банку в безпечне місце, покинувши численних фінансових працівників, ув'язнених на острові Велфер.\n\nУвесь Нью-Йорк тепер перебуває під контролем [FROM.GetNameDef], і наразі розгортається масштабна рятувальна операція, щоб оцінити повний обсяг збитків, завданих місту наступом."
 city_capture.265.d.other: "[FROM.GetAdjective] сили вже певний час наступали вниз за течією річки Гудзон. Сьогодні їхні зусилля завершилися успіхом: вони нарешті увійшли до Нью-Йорка, успішно оточивши оборонців, які ще трималися. На превеликий розпач завойовників, будівля Федерального резервного банку була дощенту очищена від золота, яке встигли вивезти до конспіративних схованок. Політичні в'язні залишилися замкненими у своїх камерах на острові Велфер.\n\nПадіння Нью-Йорка завдає важкого удару по позиціях [FROM.FROM.GetAdjective] сил, адже один із найвеличніших символів американського престижу впав під натиском сили. Коли бої в гавані Нью-Йорка стихають, стає практично зрозуміло, що [FROM.GetNameDef] здобуває перевагу в битві за Нову Англію."
 city_capture.265.a: "Нью-Йорк наш!"
 city_capture.265.b: "Леді Свобода знову сяє!"
 city_capture.265.c: "Це удар по Революції!"
 city_capture.265.d: "Нью-Йорк не повинен залишатися в руках ворога!"
 city_capture.265.e: "Соціалісти втратили важливий символ."
 city_capture.265.f: "І переможцям дістається Статуя Свободи."

 city_capture.266.t: "Падіння Гонконгу"
 city_capture.266.d.asia: "Війська [FROM.GetNameDef] захопили колишню британську коронну колонію Гонконг після прориву Лінії п'яниць та висадки на самому острові Гонконг. Становище оборонців швидко стало безнадійним, і губернатор особисто капітулював у готелі «The Peninsula Hong Kong», де [FROM.GetAdjective] війська облаштували свій штаб.\n\nПісля короткої церемонії було призначено нового [FROM.GetAdjective] губернатора, який проголосив перед усім світом народження «Нового Гонконгу», «вільного від західного колоніалізму»."
 city_capture.266.d.legat: "Війська [FROM.GetNameDef] захопили колишню британську коронну колонію Гонконг після прориву Лінії п'яниць та висадки безпосередньо на острові Гонконг. Становище захисників невдовзі стало катастрофічним, і губернатор особисто здався в готелі «The Peninsula Hong Kong», де розмістився [FROM.GetAdjective] штаб.\n\nПісля короткої церемонії на посаду заступив новий [FROM.GetAdjective] губернатор, оголосивши світові про відновлення «Старого Гонконгу» та повернення західного контролю над містом."
 city_capture.266.d.other: "Війська [FROM.GetNameDef] захопили колишню британську коронну колонію Гонконг після прориву Лінії п'яниць та висадки на острові Гонконг. Становище оборонців невдовзі стало безнадійним, і губернатор особисто здався в готелі «The Peninsula Hong Kong», де розмістився [FROM.GetAdjective] штаб.\n\nВідтепер «Перлина Сходу» остаточно закріпилася під [FROM.GetAdjective] контролем."
 city_capture.266.a: "Падіння Гонконгу — це серйозний удар по [FROM.FROM.GetNameDef]."
 city_capture.266.b.asia: "Новий Гонконг процвітатиме, вільний від західного імперіалізму!"
 city_capture.266.b.legat: "Гонконг знову під нашим контролем."
 city_capture.266.b.other: "Перлину Сходу захищено."
 city_capture.266.c: "[FROM.FROM.GetNameDefCap] не потерпить цієї агресії."
 city_capture.266.e: "Ще один удар по колишній британській колонії — сподіваймося, це не стане закономірністю."

 city_capture.267.t: "Падіння Маніли"
 city_capture.267.d: "Маніла, столиця Філіппін, упала під натиском [FROM.GetAdjective] сил після відступу філіппінських оборонців та їхніх союзників. Вхід до стратегічно важливої Манільської затоки ще деякий час залишався ареною протистояння через значну концентрацію філіппінської берегової артилерії на острові Коррехідор, проте гармати зрештою замовкли після скоординованої [FROM.GetAdjective] атаки.\n\nТепер, коли Маніла під [FROM.GetAdjective] контролем, очікується, що решта Філіппін незабаром розділить її долю. Це дошкульна поразка для військ альянсу [FROM.FROM.GetFactionName] в Азії та на Тихому океані."
 city_capture.267.a: "Падіння Маніли закріплює контроль [FROM.GetNameDef] над Ост-Індією."
 city_capture.267.b.japan: "Ми завдали чергового удару по західному імперіалізму!"
 city_capture.267.b.china: "Традиційний порядок в Азії буде відновлено."
 city_capture.267.b.other: "Незабаром усі Філіппіни опиняться під нашим контролем."
 city_capture.267.c: "Відступайте в джунглі, ми не дамо Філіппінам упасти!"

 city_capture.268.t: "Падіння Гайдарабада"
 city_capture.268.d: "Офіційно підтверджено, що місто Гайдарабад у Південній Індії, одне з найбагатших князівств, упало під натиском наступаючих [FROM.GetAdjective] сил. Після запеклих боїв, які спустошили більшу частину сусіднього військового містечка Секундерабад, над містом знову запанувала тиша: гуркіт пострілів і канонада артилерії стихли разом із безладним відступом останніх [FROM.FROM.GetAdjective] захисників після того, як нізам оголосив відкрите місто заради порятунку історичних пам'яток і культурних центрів.\n\nНадходять повідомлення, що [FROM.GetAdjective] солдати патрулюють вулиці для підтримання порядку на тлі спалаху міжконфесійного насильства між місцевими мусульманами та індуїстами в місті, адже статус-кво, що стримував ворожнечу, було зруйновано."
 city_capture.268.a: "На цьому все не закінчується."
 city_capture.268.b: "Місто перлів тепер у наших руках!"
 city_capture.268.c: "Місто перлів упало."

 city_capture.269.t: "Падіння Лахора"
 city_capture.269.d: "Одна з головних архітектурних перлин моголів та останній британський осередок влади на Індостанському субконтиненті — місто Лахор — упало під нищівним натиском [FROM.GetAdjective] військової машини, попри відчайдушні спроби [FROM.FROM.GetNameDef] стримати цю навалу.\n\nНа світанку над брамою Аламгірі замайорів [FROM.GetAdjective] прапор, що змусило здатися останніх виснажених тривалою облогою [FROM.FROM.GetAdjective] захисників у фортеці.\n\n«Місто садів» укотре перейшло до рук нового господаря."
 city_capture.269.a: "Визволення вже близько, наше підкріплення прибуло!"
 city_capture.269.b: "Сад моголів наш!"
 city_capture.269.c: "Ось так падає останній уламок Британського Раджу."

 city_capture.270.t: "Падіння Бангкока"
 city_capture.270.d.can: "Сьогодні вранці переможні [FROM.GetAdjective] солдати пройшли вулицями Бангкока після запеклих денних боїв. Більшість будівель уздовж вулиці Ратчадамнен зруйновано артилерійським вогнем, а над руїнами колишньої тронної зали Ананта-Самаком, яку [FROM.FROM.GetAdjective] уряд використовував як парламент, піднято «Юніон Джек».\n\n[FROM.FROM.GetAdjective] уряд зібрався для обговорення вимог [FROM.GetAdjective] сторони; багато членів руху «Сері Тай» уже обіймають узгоджені посади в тимчасовому уряді, оскільки більшість міністрів старого кабінету вважаються загиблими. За межами міста бої все ще тривають, хоча невідомо, як довго вони триватимуть."
 city_capture.270.d.jap: "У міру того як бої в Бангкоку стихають, прапори Хіномару вже майорять над кожною будівлею міста, перейменованого на Банкоку, а [FROM.GetAdjective] посадовці створили нову перехідну адміністрацію для управління завойованими землями.\n\nНезгодних уже схопили й вивезли посеред ночі, а підрозділи [FROM.FROM.GetAdjective] армії, які капітулювали, рушили колонами до нових таборів, збудованих для них у сільській місцевості. Кільком місцевим [FROM.FROM.GetAdjective] керманичам запропонували здійснити сеппуку, щоб спокутувати невдачу й запобігти гуртуванню руху опору довкола них. У Великому палаці Бангкока вже розпочали реставрацію, щоб перетворити його на одну з нових сезонних резиденцій Імператора, хоча в провінціях бої все ще тривають."
 city_capture.270.d.gea: "Сьогодні вранці переможні німецькі солдати пройшли вулицями Бангкока після запеклих денних боїв. Більшість споруд уздовж вулиці Ратчадамнен було зруйновано вогнем корабельної артилерії Німецької Східної Азії, яка стояла на рейді навпроти Великого палацу, а над тронною залою Ананта-Самаком, де засідав [FROM.FROM.GetAdjective] парламент, піднято прапор Райхскріґсфлаґе.\n\nХодять чутки, що багатьох пронімецьких діячів у сіамському уряді бачили поруч із адміралом [FROM.GetLeader], де вони обговорювали свої післявоєнні посади в межах нового німецького порядку, поки залишки [FROM.FROM.GetAdjective] військ відступають у сільську місцевість."
 city_capture.270.d.inc: "Сьогодні вранці переможні індокитайські бійці пройшли вулицями Бангкока після запеклих денних боїв. Більшість споруд уздовж вулиці Ратчадамнен зазнала руйнувань від артилерійських обстрілів, а над тронною залою Ананта-Самаком, яку [FROM.FROM.GetAdjective] уряд використовував як парламент, тепер піднято прапор «червоний стяг із золотою зіркою».\n\nЗавдяки перемозі над однією з найбільших загроз для новоствореної нації майбутнє [INC.GetNameDef] нарешті захищено. Тепер, коли з останніми осередками [FROM.FROM.GetAdjective] оборони в місті покінчено, схоже, що опір у навколишніх містах незабаром також згасне."
 city_capture.270.d.bur: "Сьогодні вранці переможні бірманські солдати пройшли вулицями Бангкока після запеклих тривалих боїв. Як колись Аюттхаю, Бангкок легко підкорила нестримна бірманська військова машина. Великий палац був зрівняний із землею на знак могутності завойовників, через що низку [FROM.FROM.GetAdjective] національних реліквій, імовірно, втрачено назавжди.\n\nВеликі колони біженців прямують до провінцій, тоді як більшість [FROM.FROM.GetAdjective] бійців продовжує битися до останнього в кількох уцілілих осередках у місті. Завдяки цій перемозі ім'я [FROM.GetLeader] назавжди закарбувалося в літописах поруч із Баїннауном та Алаунпаєю."
 city_capture.270.d.other: "Сьогодні вранці переможні [FROM.GetAdjective] солдати пройшли вулицями Бангкока після запеклих тривалих боїв. Більшість споруд уздовж вулиці Ратчадамнен було пошкоджено артилерійським вогнем, а над тронною залою Ананта-Самаком, яку [FROM.FROM.GetAdjective] уряд використовував для засідань парламенту, піднято [FROM.GetAdjective] прапор.\n\n[FROM.FROM.GetAdjective] уряд погодився на зустріч для обговорення вимог [FROM.GetAdjective] сторони. Тепер, коли останні рубежі [FROM.FROM.GetAdjective] оборони в місті ліквідовано, подальший опір у навколишніх регіонах, вочевидь, скоро припиниться."
 city_capture.270.a: "Ми битимемося до останнього!"
 city_capture.270.b: "Нарешті Бангкок наш!"
 city_capture.270.c: "Зрозуміло..."

 city_capture.271.t: "Падіння Москви"
 city_capture.271.d: "Коли Москву востаннє захоплювала іноземна держава, масштабна пожежа знищила більшу частину міста. Сьогодні все інакше: [FROM.GetAdjective] сили прорвали лінії облоги на кількох ділянках і зійшлися біля Кремля. [FROM.FROM.GetAdjective] снайпери продовжують вести вогонь із багатоповерхівок, але основна оборона впала, і залишки військ відступають крізь передмістя в навколишні ліси.\n\nКрасна площа, яка довгий час була осередком міського життя [FROM.FROM.GetAdjective], перетворена на імпровізований табір для військовополонених, а з вікон Кремля вилітали палаючі уламки — безсумнівно, остання спроба не дати [FROM.FROM.GetAdjective] секретним документам потрапити до [FROM.GetAdjective] рук. Це чорний день для [FROM.FROM.GetNameDef]."
 city_capture.271.a: "Ми битимемося до самого кінця."
 city_capture.271.b: "Серце [FROM.FROM.GetNameDef] тепер наше!"
 city_capture.271.c: "Становище [FROM.FROM.GetNameDef] видається справді катастрофічним."

 city_capture.272.t: "Падіння Петрограда"
 city_capture.272.d: "Величне [FROM.FROM.GetAdjective] місто, збудоване Петром Першим, сьогодні було захоплене. [FROM.FROM.GetAdjective] оборонці спершу стримували [FROM.GetAdjective] армію вздовж річки Неви, проте кілька днів тому ці позиції впали. Тепер невпинний гарматний вогонь на Василівському острові поклав край мукам останніх захисників. Деякі військові тактики кажуть, що за належної оборони місто могло триматися роками, але [FROM.GetAdjective] натиск виявився стрімкішим.\n\nСолдати [FROM.GetAdjective] армії використовують Палацову площу як плацдарм для просування рештою міста, а між людьми ширяться чутки про [FROM.GetAdjective] бійців, які оглядають Артилерійський музей, упевнені, що вони залишать власний слід в історії [FROM.FROM.GetNameDef]."
 city_capture.272.a: "Жахливо!"
 city_capture.272.b: "Удар по бойовому духу [FROM.FROM.GetAdjective] буде нищівним."
 city_capture.272.c: "Славетна перлина півночі пала."

 city_capture.273.t: "Падіння Києва"
 city_capture.273.d: "Сьогодні надійшли лихі вісті для [FROM.FROM.GetNameDef]: [FROM.GetAdjective] армія щойно завершила штурм стародавньої столиці. Хоча перші повідомлення свідчили, що [FROM.FROM.GetAdjective] захисники зможуть утримати мости в затяжній облозі, перекрити численні шляхи через річку виявилося не під силу. Тепер, коли [FROM.GetAdjective] війська стоять по обидва боки річки, а розрізнені загони оборонців складають зброю на островах, Київ упав під натиском загарбників.\n\nОскільки цей квітучий центр опинився в [FROM.GetAdjective] руках, уся решта [FROM.FROM.GetAdjective] земель опинилася під загрозою. Хоч [FROM.GetNameDef] і обіцяє поважати 700 років історії, накопичених після того, як монголи зруйнували місто у 1240 році, пам'ять киян довга. Чужоземні навали ніколи не несли їм добра, і вони побоюються найгіршого."
 city_capture.273.a: "На цьому все не закінчується."
 city_capture.273.b: "Нарешті Київ наш!"
 city_capture.273.c: "Становище [FROM.FROM.GetAdjective] видається вкрай важким."

 city_capture.274.t: "Падіння Ріо-де-Жанейро"
 city_capture.274.d: "Битва за Ріо-де-Жанейро, схоже, завершилася після кількаденного запеклого штурму [FROM.GetAdjective] сил. Попри зручне для оборони розташування міста, [FROM.FROM.GetAdjective] гарнізон не зміг запобігти захопленню палацу Катете та більшої частини самого міста [FROM.GetAdjective] військами. На пагорбах ще тривають окремі перестрілки, проте більшість [FROM.FROM.GetAdjective] сил уже вибито.\n\nЗначна частина Ріо постраждала від бойових дій: [FROM.GetAdjective] снаряди знищили купол церкви Канделарія, а тунель Реал-Грандеза був підірваний зневіреними [FROM.FROM.GetAdjective] солдатами, аби зупинити наступ ворога. Оскільки [FROM.GetAdjective] війська контролюють більшу частину міста, стає зрозуміло, що [FROM.GetNameDef] зробила вирішальний крок у своїй війні проти [FROM.FROM.GetNameDef]."
 city_capture.274.a: "Ні! Як таке можливо?!"
 city_capture.274.b: "Наші командувачі чудово впоралися."
 city_capture.274.c: "Становище [FROM.FROM.GetAdjective] видається важким."
 city_capture.274.par: "Помста неминуча! Вперед!"

 city_capture.275.t: "Падіння Гавани"
 city_capture.275.d: "[FROM.FROM.GetAdjective] солдати та ополченці були витіснені з Гавани в сільську місцевість або до старих іспанських міських фортів, де після багатогодинного нещадного бомбардування вони зрештою капітулювали перед [FROM.GetAdjective] силами. З підняттям [FROM.GetAdjective] прапора над замком Ель-Морро, що часто зображувався на листівках, загарбники закріпили за собою контроль над входом до Гаванської гавані.\n\n[FROM.FROM.GetAdjective] сили, хоч і поступалися ворогу кількістю та оснащенням, зуміли нав'язати запеклий бій, квартал за кварталом стримуючи натиск військ [FROM.GetNameDef] так довго, як тільки могли. Зрештою їхній мужній опір був зламаний, і тепер Гавана опинилася в руках чужоземної держави."
 city_capture.275.a: "Скажіть людям, щоб вони продовжували боротися за свою свободу..."
 city_capture.275.b: "Схоже, американці знову повторюють історію."
 city_capture.275.c: "Їхній опір ніколи б не привів до перемоги."
 city_capture.275.e: "Схоже, Куба обрала хибний бік..."
 city_capture.275.f: "Острів незабаром стане нашим."

 city_capture.276.t: "Падіння Рима"
 city_capture.276.d: "Сьогодні генерал, який командує [FROM.GetAdjective] військами, прийняв капітуляцію Вічного міста. Кілька днів поспіль [FROM.GetAdjective] солдати пробивалися крізь передмістя, і хоча окремі заболочені ділянки все ще перебували під [FROM.FROM.GetAdjective] контролем, головна магістраль через центр Рима та місто Ватикан була повністю заблокована. [FROM.FROM.GetAdjective] солдати розсіюються по передгір'ях довкола стародавньої столиці Римської імперії.\n\n[FROM.GetNameDefCap] завбачливо оголосила, що спеціальна військова поліція вже розгорнута в місті для запобігання розграбуванню собору Святого Петра та Пантеону, а також ведуться переговори з Папою щодо того, яку автономію Ватикан збереже під [FROM.GetAdjective] окупацією."
 city_capture.276.a: "Рим утрачено!"
 city_capture.276.b: "Нарешті Рим наш!"
 city_capture.276.c: "Як тепер [FROM.FROM.GetNameDef] оговтається від цього?"

 city_capture.277.t: "Падіння Відня"
 city_capture.277.d: "Габсбурзька столиця втрачена. Кілька днів тому [FROM.GetAdjective] армія притисла залишки [FROM.FROM.GetAdjective] військ до берегів Дунаю, а в місті ширяться чутки, що [FROM.FROM.GetAdjective] монарша родина втекла, поки була змога. Тепер місто повністю контролює [FROM.GetNameDef], а його численні митці й музиканти живуть у тривозі перед тим, що станеться з цим культурним оплотом Європи.\n\n[FROM.GetNameDefCap] планує влаштувати грандіозний військовий парад уздовж Рінгштрасе на честь цього визначного тріумфу, а [FROM.GetAdjective] генерал, призначений керувати окупаційною адміністрацією, має виступити з балкона Нового Бурґа, аби спробувати заспокоїти населення, виснажене тижнями боїв."
 city_capture.277.a: "Відень упав? Як таке можливо?!"
 city_capture.277.b: "Нарешті Відень наш!"
 city_capture.277.c: "Схоже, [FROM.FROM.GetNameDefCap] спіткало гірке падіння..."

 city_capture.278.t: "Падіння Пекіна"
 city_capture.278.d: "Після кількох днів запеклих боїв у передмістях столиці [FROM.GetAdjective] війська нарешті піднялися на мури Зовнішнього міста, розсіявши захисників і зробивши подальшу оборону столиці практично неможливою. Оскільки залізничні колії до міста й з нього були перерізані, решта [FROM.FROM.GetAdjective] частин швидко розтанула, коли дезертири розчинилися серед міського населення.\n\nПоки [FROM.GetAdjective] прапори майорять над брамою Тяньаньмень, полум'я на брамі Чжен'янмень здіймає в небо високі стовпи густого чорного диму, сумний символізм якого зрозумілий кожному серед виснаженого війною населення. Китаю залишається лише сподіватися, що нові окупанти — одні з багатьох від початку століття — нарешті відновлять хоч якусь подобу миру й порядку."
 city_capture.278.a: "Пекін упав? Як таке можливо?!"
 city_capture.278.b: "Заборонене місто наше!"
 city_capture.278.c: "У Пекіна було багато окупантів, це лише черговий із них."
 city_capture.278.d.japan: "У межах блискавичного наступу японські сили вчора вранці зім'яли зовнішню оборону Пекіна, а сьогодні прорвали його мури. Оскільки залізничне сполучення з містом було повністю відрізане, залишки [FROM.FROM.GetAdjective] військ швидко розтанули, коли солдати розбіглися серед містян.\n\nПоки стяг Вранішнього Сонця майорить над брамою Тяньаньмень, пожежа на брамі Чжен'янмень викидає в небо стовпи чорного диму, сумний символізм якого зрозумілий усім. Утративши стародавню столицю, нація затамувала подих. Тепер це лише питання часу, коли японці прокотяться північною рівниною, наче нищівна буря, а звідти — і всім Китаєм."
 city_capture.278.a.japan: "За захисників Пекіна помстяться!"
 city_capture.278.b.japan: "Ще один крок до розгрому західного імперіалізму!"
 city_capture.278.c.japan: "Схоже, становище [FROM.FROM.GetAdjective] стало справді відчайдушним."
 city_capture.278.d.fng: "Після кількох днів запеклих боїв у передмістях столиці [FROM.GetAdjective] війська нарешті піднялися на мури Зовнішнього міста, розсіявши захисників і зробивши оборону столиці неможливою. Прибуття Чжан Цзоліня до воріт Забороненого міста відбулося без зайвого пафосу та пишноти, проте його тріумф затьмарює одна протверезлива думка: він бере Пекін уже не вперше. Попри всі докладені зусилля, попереду ще довгий шлях.\n\nПоки П'ятибарвний прапор розвівається над брамою Тяньаньмень, а місто оповите димом, Чжан уже розпочав підготовку до «Конференції з національного возз'єднання». Чи зуміє він згуртувати розколоту націю та досягти успіху там, де інші зазнали невдачі?"
 city_capture.278.a.fng: "Свого часу ми повернемо Пекін!"
 city_capture.278.b.fng: "Ми не втратимо Пекін удруге."
 city_capture.278.c.fng: "Невже Китай можна об'єднати лише мечем?"
 city_capture.278.d.lep: "Після кількох днів запеклих боїв у передмістях столиці [FROM.GetAdjective] війська нарешті подолали мури Зовнішнього міста, розсіявши захисників і зробивши подальшу оборону безнадійною. Прибуття Ці Сєюаня до воріт Забороненого міста знаменує черговий крок у його стрімкому злеті від провінційного мілітариста до однієї з найвпливовіших постатей Китаю. Це також ознака можливого зсуву балансу сил: південь уперше утвердив своє панування над північчю з часів розквіту династії Мін.\n\nХоч би де Ці вирішив розмістити свій новий уряд, німці неодмінно спостерігатимуть за ним із батогом і пряником у руках."
 city_capture.278.a.lep: "Швидшим за злет Ці буде лише його падіння!"
 city_capture.278.b.lep: "Одного дня вони не наважаться навіть нарікати."
 city_capture.278.c.lep: "Правитиме не Ці, а [GER.GetLeader]."

 city_capture.279.t: "Падіння Шанхая"
 city_capture.279.d.interchina: "У межах безперервного конфлікту, що стрясає Китай протягом останніх десятиліть, місто Шанхай укотре змінило господаря. Завойоване раніше арміями [FROM.FROM.GetLeader] та кероване [FROM.FROM.GetNameDef], місто сподівалося, що кривава бійня залишилася позаду. На жаль, війна знову поглинула місто, коли [FROM.GetAdjective] війська пішли на штурм, зламали опір місцевих оборонців і підняли свій стяг над набережною Вайтань.\n\n[FROM.GetAdjective] солдати вже взялися до грабунку територій за межами старого Міжнародного сеттльменту, тоді як більшість іноземців поки що залишаються неушкодженими, хоча й з острахом чекають своєї черги."
 city_capture.279.d.china: "Минуло понад сімдесят років відтоді, як китайці могли стояти на набережній Вайтань і по-справжньому називати її своєю, але завдяки зусиллям [FROM.GetAdjective] військ новий прапор гордо майорить над будівлею Митниці. Попри міжнародний захисний статус міста, перемога далася відносно легко, оскільки поліція Шанхая та невеликий гарнізон не могли чинити відчутного опору регулярній армії. Більшість містян майже не протидіяли, а їхня відмова від співпраці з колишньою владою лише послабила й без того кволу оборону.\n\nМайбутнє цього міжнародного міста наразі непевне, адже його процвітання завжди трималося на торгівлі та іноземних інвестиціях. Панує невизначеність, і доля іноземних мешканців також під питанням."
 city_capture.279.d.other: "Попри формальний міжнародний захист міста, [FROM.GetAdjective] війська сьогодні захопили Шанхай, швидко зім'явши сили місцевої поліції та гарнізону й піднявши свої знамена над набережною Вайтань. Ще кілька років тому подібний крок майже напевно викликав би міжнародне обурення, проте війни на інших фронтах позбавили великі держави можливості надати реальний захист Міжнародному мандату.\n\n[FROM.GetAdjective] солдати вже розпочали розграбування районів за межами старого Міжнародного сеттльменту, тоді як більшість іноземців наразі не чіпають, хоч вони й не позбавлені тривоги."
 city_capture.279.a: "Ми повернемо місто, чого б це не коштувало."
 city_capture.279.b: "Нарешті Шанхай наш!"
 city_capture.279.c: "Чи закінчиться коли-небудь хаос у Китаї?"

 city_capture.280.t: "Падіння Варшави"
 city_capture.280.d: "Колись, у добу Відродження, її називали «Парижем Сходу», проте в новітній історії Варшава переживає нелегкі часи. Після Світової війни залишалася надія на відродження, та, на жаль, доля виявилася невблаганною: [FROM.FROM.GetAdjective] армія була розгромлена, намагаючись утримати місто по обидва береги Вісли від наступаючих [FROM.GetAdjective] сил.\n\nЯк гірке нагадування про минуле, Королівський замок у Варшаві, за заявами [FROM.GetNameDef], знову був розграбований [FROM.FROM.GetAdjective] солдатами перед утечею з міста. [FROM.FROM.GetNameDefCap] палко заперечує це, стверджуючи, що палац сплюндрували саме [FROM.GetAdjective] війська після важких боїв. Хай там як, із падінням столиці майбутнє [FROM.FROM.GetNameDef] опинилося під смертельною загрозою."
 city_capture.280.a: "Тільки не Варшава!"
 city_capture.280.b: "Нарешті Варшава наша!"
 city_capture.280.c: "Зрозуміло..."

 city_capture.281.t: "Падіння Сіднея"
 city_capture.281.d.siam: "Продовжуючи свої завоювання на півдні, [FROM.GetNameDef] захопила Сідней в Австралазії. Місцеві оборонці були змушені відступити через міст Гарбор-Брідж на нові позиції на Пагорбі Обсерваторії, але спроби підірвати міст були зірвані наступаючими [FROM.GetAdjective] силами.\n\n[FROM.GetAdjective] військовий прапор тепер майорить над ратушею Сіднея, де розмістилася нова військова адміністрація міста, а військова поліція «Сарават Тахарн» пильно стежить за порядком на вулицях."
 city_capture.281.d.other: "Коли передгір'я Блакитних гір було втрачено під натиском [FROM.GetAdjective] загарбницької армії, падіння міста стало лише питанням часу. Шляхом контрольованих боїв [FROM.FROM.GetAdjective] сили повільно відходили і вчора дісталися доків, проте після захоплення мосту Гарбор-Брідж (який захисники не наважилися підірвати через його важливість для містян) їхній командувач пішов на переговори про припинення вогню.\n\nСідней, що виник як поселення для звільнених британських каторжників, зазнає гіркої іронії, адже саме місто тепер перетворилося на тюрму. Ба більше, військові експерти пророкують, що це може стати початком кінця [FROM.FROM.GetNameDef], оскільки втрата такого життєво важливого центру — це нищівний удар."
 city_capture.281.a: "Ми незабаром повернемося до Сіднея."
 city_capture.281.b: "Нарешті Сідней наш!"
 city_capture.281.c: "Становище [FROM.FROM.GetAdjective] вкрай важке."

 city_capture.282.t: "Падіння Мехіко"
 city_capture.282.d: "Мехіко, найдавніша столиця Північної Америки та п'яте місто за кількістю населення, сьогодні впало під натиском загарбницьких [FROM.GetAdjective] сил, які оточили місто, прорвалися до чаші озера із заходу, перерізали головні транспортні артерії в низинах і змусили [FROM.FROM.GetAdjective] оборонців відступити у східні передгір'я. Станом на сьогодні генерала, який керує [FROM.GetAdjective] окупаційними військами, бачили біля Національного палацу, де він вів переговори з губернатором щодо припинення вогню.\n\nШиряться чутки, що [FROM.GetAdjective] солдати розгулюють стародавніми руїнами ацтеків, збираючи собі «безкоштовні» сувеніри, і схоже, що тим, хто пережив іспанське панування, тепер доведеться вчитися жити під ярмом [FROM.GetAdjective] влади."
 city_capture.282.a: "На цьому все не закінчується."
 city_capture.282.b: "Серце Мексики наше!"
 city_capture.282.c: "Зрозуміло..."

 city_capture.283.t: "Падіння Алжира"
 city_capture.283.d: "Звістки зі стародавнього міста Алжир — столиці французького уряду у вигнанні з 1920 року — повідомляють про його падіння під натиском [FROM.GetAdjective] військ. Повільно, але впевнено просуваючись величними колоніальними авеню поблизу узбережжя, сили [FROM.GetNameDef] натрапили на значно запекліший опір, коли відійшли від затоки до густонаселених районів на алжирських висотах.\n\nЗапеклі сутички точилися між [FROM.GetAdjective] та [FROM.FROM.GetAdjective] солдатами, особливо в європейському кварталі Баб-ель-Уед та біля відомої базиліки Нотр-Дам-д'Афрік, але на світанку більша частина міста вже впала, а останні осередки опору добивали в Касбі. Сонце, що зійшло над затокою, осяяло місто вже під владою нового господаря."
 city_capture.283.a.commune: "Ми не можемо дозволити комунарам знищити останній оплот Справжньої Франції!"
 city_capture.283.a: "Чи це кінець нашої мрії про повернення батьківщини?"
 city_capture.283.a.returned: "Наш новий дім зазнав наруги."
 city_capture.283.b: "Алжирський режим більше ніколи не завдасть нам клопоту."
 city_capture.283.c.commune: "Схоже, комунари довели свою революцію до кінця."
 city_capture.283.c: "[FROM.FROM.GetNameDefCap] доживає останні дні."

 city_capture.284.t: "Падіння Детройта"
 city_capture.284.d.wca: "[FROM.GetAdjective] сили вчора ввечері пішли в наступ, щоб захопити центр Детройта, форсувавши річку в районі Джефферсонського коридору попри шалений опір Червоної гвардії. До настання ночі солдати [FROM.GetNameDef] уже вели переговори про капітуляцію бійців, які засіли в Норт-Енді. Іст-Енд здався, а прихильників соціалістів помітили під час відступу через Вест-Сайд. Соціалістичні ополченці залишили по собі руїни Фішер-білдінґа, Дірборна та величних творінь Альберта Кана.\n\nДля спостерігачів очевидно, що Детройт тепер є територією [FROM.GetNameDef], але перед цим Червона гвардія встигла знищити меморіальну будівлю Едсела Форда та залишила на віадуку масивне панно на честь своєї справи, підписане скандальним художником Дієго Ріверою."
 city_capture.284.d.other: "[FROM.GetAdjective] сили здійснили зухвалий ривок через Вест-Сайд Детройта, заскочивши ворога зненацька. Сьогодні їхні зусилля увінчалися успіхом, коли оборонці Детройта відступили до Мідтауна. Для багатьох нападників події в Дірборні лише додали запалу прорватися до річки Детройт і закріпити контроль над містом.\n\nПадіння Детройта широко святкують у [FROM.GetNameDef], яка тепер здобула як стратегічний, так і символічний флагман важкої промисловості Америки."
 city_capture.284.a: "Шлях до Мічигану тепер навстіж відкритий."
 city_capture.284.b: "Ми мусимо швидко повернути Детройт!"
 city_capture.284.c: "Безсумнівний удар по соціалістах."
 city_capture.284.d: "Чи скінчиться коли-небудь ця війна?"

 city_capture.285.t: "Падіння Бостона"
 city_capture.285.d.nee: "Мешканці Бостона разом із Національною гвардією Нової Англії справили сильне враження на [FROM.GetAdjective] сили. Війська вторгнення з боями увійшли до Третього тунелю, оточуючи Бостон через річку Чарльз. Національна гвардія Нової Англії була змушена евакуюватися через Кембридж, повністю втративши район Ямайка-Плейн.\n\nІсторичне й символічне значення цієї перемоги не залишилося непоміченим у [FROM.GetNameDef], де вже взялися використовувати вцілілі міські символи американської незалежності, як-от Стару північну церкву, що нині губиться серед оточуючих її барикад."
 city_capture.285.d.other: "Точкового застосування сили виявилося достатньо, аби [FROM.GetAdjective] війська вибили оборонців із Внутрішнього поясу Бостона. Після запеклих боїв у порту захисники міста зазнали принизливої поразки та були змушені відступити через річку Чарльз у напрямку Еверетта. І солдати, і цивільні перебувають у повному замішанні.\n\nОпитування [FROM.GetAdjective] бійців на місці свідчать, що хоч перемога над ворогами з [FROM.FROM.GetNameDef] і далася в жорстокій битві, війська вторгнення все ж прагнуть зберегти історичні пам'ятки Бостона."
 city_capture.285.a: "З Бостоном у наших руках Нова Англія в безпеці."
 city_capture.285.b: "Свободу не загасити!"
 city_capture.285.c: "Американські Афіни впали..."

 city_capture.286.t: "Падіння Токіо"
 city_capture.286.d.other: "Сьогодні вся Японія здригнулася до самих основ, коли [FROM.GetAdjective] війська після запеклих боїв нарешті здобули столицю. Попри сподівання [FROM.GetAdjective] командування, Імператорський палац, вочевидь, встигли успішно евакуювати, тому місцеперебування Імператора та уряду залишається невідомим.\n\nОскільки японська столиця вперше в історії опинилася в чужоземних руках, настрій серед [FROM.FROM.GetAdjective] сил можна охарактеризувати лише як похмурий. Японська громадськість довго вірила, що міць армії та острівне положення роблять вторгнення неможливим. Поява [FROM.GetAdjective] солдатів розвіяла цей міф, і, схоже, [FROM.FROM.GetAdjective] гегемонія у Східній Азії зруйнована назавжди."
 city_capture.286.d.lkmt: "Сьогодні, після виснажливого й жорстокого вторгнення на Японські острови, Національно-революційна армія китайського Ґоміньдану офіційно оголосила про повну капітуляцію всіх японських сил у Токіо. Попри сподівання Військової ради, Імператорський палац вдалося вчасно евакуювати, а місцеперебування імператора залишається невідомим.\n\nОскільки японська столиця вперше в історії опинилася в руках чужинців, настрій серед [FROM.FROM.GetAdjective] сил можна назвати хіба що безпросвітним. Для багатьох у Китаї ця перемога знаменує остаточний кінець Століття приниження завдяки упокоренню імперіалістичного сусіда й суперника. Уперше за десятиліття Китай знову утверджується як найвеличніша держава Азії..."
 city_capture.286.a: "Велична перемога!"
 city_capture.286.a.lkmt: "Століття приниження стерто з пам'яті."
 city_capture.286.b: "Ми не повинні втрачати надію."
 city_capture.286.c: "Перлина всієї Азії впала."

 city_capture.287.t: "Падіння Шеньяна"
 city_capture.287.d.chi: "У результаті рішучого наступу [FROM.GetAdjective] солдати сьогодні зламали опір [FROM.FROM.GetAdjective] захисників і захопили найважливіше місто Маньчжурії. [FROM.GetAdjective] війська швидко оточили обнесене мурами Старе місто й зажадали капітуляції [FROM.FROM.GetLeader], а коли той не з'явився, пішли на штурм, зруйнувавши значну частину старого маньчжурського палацу. Самого [FROM.FROM.GetLeader] так і не знайшли.\n\nПісля втрати міста ширяться чутки, що підлеглі [FROM.FROM.GetLeader] починають сумніватися в його здатності захистити Маньчжурію, не кажучи вже про об'єднання всього Китаю. Сам [FROM.FROM.GetLeader], схоже, усвідомлює всю серйозність становища: місто необхідно відбити якнайшвидше."
 city_capture.287.d.other: "Попри відчайдушні зусилля [FROM.FROM.GetAdjective] захисників Шеньяна, місто сьогодні впало після кількох днів запеклих вуличних сутичок. Найгарячіші бої точилися на залізничній станції Хуанґутунь та довкола неї, яка стала мішенню кількох послідовних [FROM.GetAdjective] атак. [FROM.FROM.GetAdjective] сили зрештою вибили з позицій, проте вони встигли розібрати колії, зробивши станцію тимчасово непридатною для використання.\n\nХай там як, взяття міста стало великою перемогою в кампанії [FROM.GetAdjective] із підкорення Китаю. Шлях до Пекіна та Північнокитайської рівнини відкритий, і численні мілітаристи по всій країні мають усвідомити, чим це їм загрожує."
 city_capture.287.a: "[FROM.FROM.GetNameDefCap] скоро впаде!"
 city_capture.287.b: "Ми скоро повернемо його!"
 city_capture.287.c: "Чи отримає Маньчжурія нового господаря?"

 city_capture.288.t: "Падіння Владивостока"
 city_capture.288.d: "Владивосток, так звані «Ворота на Схід», упав. Тихоокеанське портове місто, база Російського тихоокеанського флоту та наріжний камінь давніх амбіцій Росії на Далекому Сході, які поступово згасали, сьогодні захопили [FROM.GetAdjective] сили. Вони подолали потужні міські укріплення — найбільші в Росії — і взяли під контроль життєво важливу гавань. Завдяки своєму розташуванню місто довгий час було ареною протистоянь: воно мало вирішальне значення під час російсько-японської війни та перебувало під владою отаманів у роки Громадянської війни в Росії.\n\nСьогодні влада над містом знову змінилася, а разом із нею — і доля Далекого Сходу."
 city_capture.288.a: "Ура!"
 city_capture.288.b: "Наша доля незабаром зміниться на краще."
 city_capture.288.c: "[FROM.FROM.GetNameDefCap] фактично втратила Тихоокеанську Росію."

 city_capture.289.t: "Падіння Дубліна"
 city_capture.289.d: "Сьогодні численні повідомлення з Ірландії підтверджують, що місто Дублін було захоплене [FROM.GetAdjective] військами. Коли ворожі сили просувалися до центру, підрозділи [FROM.FROM.GetAdjective] армії марно намагалися утримати ключові будівлі. Кульмінацією став їхній останній бій на О'Коннелл-стріт під час оборони Головного поштамту, поки захисників не змели безперервні атаки [FROM.GetAdjective] солдатів.\n\nХоча значній частині [FROM.FROM.GetAdjective] цивільного та військового керівництва вдалося евакуюватися в сільську місцевість із обіцянкою продовжувати боротьбу проти [FROM.GetNameDef], їхній справі завдано нищівного удару."
 city_capture.289.a: "Невільна Ірландія ніколи не знатиме спокою!"
 city_capture.289.b: "Зі взяттям [FROM.FROM.GetAdjective] столиці решта острова вже в наших руках."
 city_capture.289.c: "Становище [FROM.FROM.GetAdjective] видається безнадійним."

 city_capture.290.t: "Падіння Батавії"
 city_capture.290.d.dei: "Сьогодні було оголошено про падіння Батавії — центру [FROM.FROM.GetNameDefCap]. Місто перебувало під владою нідерландців із 1619 року, перетворившись на перлину Нідерландської імперії в цьому регіоні. У зверненні з палацу на Кенінгсплейн [FROM.GetAdjective] генерал, який очолює окупаційну адміністрацію, спробував заспокоїти місцеве населення, пообіцявши, що їм нічого не загрожує.\n\nІз падінням Батавії здатність [FROM.FROM.GetNameDef] утримувати контроль над Явою та іншими островами зазнала важкого удару, можливо, непоправного. Лише час покаже, чи зможуть колоніальні сили зібратися й відновити контроль."
 city_capture.290.d.ins: "[FROM.GetAdjective] військові зведення сьогодні підтвердили, що Батавія, столиця [FROM.FROM.GetNameDefCap], пала після штурму міста. Ставши колись осередком нідерландського панування в Ост-Індії, згодом місто перетворилося на столицю нової [FROM.FROM.GetAdjective] держави.\n\nПопри [FROM.GetAdjective] відозву із закликом до співпраці з окупантами, місцеве населення прагне довести новій окупаційній владі, що воно не віддасть щойно здобуту незалежність без бою. Утім, для решти [FROM.FROM.GetNameDefCap] падіння Батавії є не лише стратегічною катастрофою, а й нищівним ударом по національній гордості. Поки евакуйований [FROM.FROM.GetAdjective] уряд намагається реорганізуватися, залишається невідомим, чи вдасться йому вибити нового завойовника зі своїх островів."
 city_capture.290.d.other: "Сьогодні було оголошено, що Батавія, найбільше місто на Яві та ключовий центр регіону, пала під натиском [FROM.GetAdjective] сил. [FROM.GetAdjective] прапор тепер майорить над колишнім палацом генерал-губернатора, поки війська займають гавань та інші важливі міські об'єкти.\n\nПадіння Батавії знаменує різку зміну балансу сил в Ост-Індії та забезпечує [FROM.GetAdjective] армії міцну базу для встановлення контролю над багатими островами архіпелагу. На тлі такої поразки залишається незрозумілим, чи зуміють [FROM.FROM.GetAdjective] сили стабілізувати ситуацію та повернути втрачені позиції."
 city_capture.290.a: "Ми битимемося далі."
 city_capture.290.b: "Важко здобутий трофей."
 city_capture.290.c: "В Ост-Індії буде новий господар."

 city_capture.291.t: "Падіння Бухареста"
 city_capture.291.d: "Минуло два десятиліття відтоді, як Бухарест був окупований під час Світової війни, і ось він знову опинився у ворожих руках. Попри запеклий опір [FROM.FROM.GetAdjective] армії, [FROM.GetAdjective] війська прорвали оборону. Старі форти навколо міста відновили для захисту столиці, але це не допомогло. Вірменський і Єврейський квартали, а також район Уранус ще чинять опір — останньому допомагає розташування на Митрополичому та Арсенальному пагорбах. Проте із захопленням головних артерій — Каля Вікторієй, бульвару королеви Єлизавети та вулиці Шербан-Воде — їхнє падіння є практично неминучим.\nМістяни зі страхом очікують наслідків окупації, адже попередня ще свіжа в пам'яті, незважаючи на спроби [FROM.GetAdjective] влади розвіяти побоювання. Хоча [FROM.FROM.GetLeader] пообіцяв боротися далі, майбутнє [FROM.FROM.GetNameDef] залишається непевним."
 city_capture.291.a: "Ми ще повернемося!"
 city_capture.291.b: "Нарешті Бухарест наш!"
 city_capture.291.c: "Важкий удар по [FROM.FROM.GetAdjective] амбіціях."

 city_capture.292.t: "Падіння Константинополя"
 city_capture.292.d.orthodox: "Сьогодні завершилося взяття Константинополя [FROM.GetAdjective] військами, коли останні [FROM.FROM.GetAdjective] частини були відкинуті за береги Босфору. Захоплення міста відбулося відносно швидко і, порівняно з минулими розграбуваннями Константинополя, без зайвої жорстокості. Проте багатьом історичним пам'яткам було завдано шкоди, зокрема Блакитній мечеті, яку зрівняли з землею [FROM.GetAdjective] солдати під час ліквідації останнього осередку опору в упалому місті.\n\nУряд [FROM.GetNameDef] оголосив взяття міста офіційним відвоюванням давньої римської столиці для християнського світу, а посланець від [FROM.GetLeader] вирушив туди, аби перетворити мечеть Ая-Софія на православну базиліку."
 city_capture.292.d.other: "Сьогодні завершилося взяття Константинополя [FROM.GetAdjective] військами, коли останні [FROM.FROM.GetAdjective] частини були відкинуті за береги Босфору. Захоплення міста відбулося відносно швидко і, порівняно з минулими розграбуваннями Константинополя, доволі помірковано. Проте багатьом історичним пам'яткам було завдано шкоди, зокрема палацу Долмабахче, який серйозно постраждав під час останнього бою [FROM.FROM.GetAdjective] солдатів.\n\n[FROM.GetAdjective] підрозділи тепер патрулюють вулиці стародавнього міста, а уряд [FROM.GetNameDef] заявив про намір керувати ним якомога м'якше."
 city_capture.292.a: "Ми втратили протоки, принаймні зараз."
 city_capture.292.b: "Місто Костянтина наше!"
 city_capture.292.c: "Царгород наш!"
 city_capture.292.e: "Константинополь повернуто Греції!"
 city_capture.292.f: "Турків нарешті вигнано\nз Європи."
 city_capture.292.g: "Босфор має нового господаря."

 city_capture.293.t: "Падіння Сеути"
 city_capture.293.d: "Повідомлення із Сеути підтверджують, що старий укріплений іспанський півострів був захоплений [FROM.GetAdjective] військами. Після швидкої висадки та сутичок уздовж узбережжя нападники зрештою зламали останній рубіж оборони на крайній точці мису Монте-Ачо. [FROM.FROM.GetAdjective] сили чинили запеклий опір, сподіваючись затримати [FROM.GetAdjective] загарбників якомога довше, але зрештою були відкинуті.\n\nБитва за Сеуту виявилася кривавою бійнею з боями за кожен будинок у вузьких межах головних вулиць міста, які майже не давали захисту від артилерійської та корабельної підтримки оточуючих сил."
 city_capture.293.a: "Один зі Стовпів Геркулеса впав..."
 city_capture.293.b: "Тепер ми контролюємо вхід до Середземного моря!"
 city_capture.293.c: "Один за одним Стовпи Геркулеса падають."

 city_capture.294.t: "Падіння Амстердама"
 city_capture.294.d.other: "Як «Північну Венецію», Амстердам довгий час шанували за його прекрасні канали та порт; хоч «золота доба» міських фінансів і торгівлі давно минула, місто залишається вічним європейським скарбом процвітання та мистецтв. На жаль, нині Амстердам став полем бою, звідки в усіх напрямках тікають біженці. Повідомляють, що після запеклих сутичок [FROM.FROM.GetAdjective] захисники оголосили Амстердам відкритим містом у результаті успішної операції [FROM.GetAdjective] сил.\n\nБої в місті стихають, а [FROM.GetAdjective] війська вже крокують площею Мунтплейн — майбутнє жителів Амстердама видається похмурим."
 city_capture.294.d.holex: "Нідерландські сили у вигнанні досягли того, що сторонні спостерігачі вважали нездійсненною мрією. З вигнання в Нідерландській Ост-Індії уряд у вигнанні з тріумфом повернувся до Амстердама. Після запеклої битви, що перетворила значну частину міста на руїни, триколірний нідерландський прапор знову гордо майорить над Королівським палацом, сповіщаючи про повернення королеви.\n\nПоки війська починають відновлювати порядок на вулицях, потрібен час для заліковування ран Амстердама. Нідерландський народ пережив революцію та громадянську війну, і знадобляться роки, щоб сліди конфлікту остаточно зникли."
 city_capture.294.a: "Темні часи для нідерландського народу..."
 city_capture.294.b.other: "Північна Венеція наша!"
 city_capture.294.c.other: "Із падінням Амстердама крах Нідерландів неминучий..."
 city_capture.294.b.holex: "Як приємно повернутися додому."
 city_capture.294.c.holex: "Нідерландці зробили неможливе!"

 city_capture.295.t: "Падіння Мюнхена"
 city_capture.295.d: "Розташоване на берегах річки Ізар на північ від Баварських Альп, місто Мюнхен є осередком баварської адміністрації та визначним центром мистецтв, наук, архітектури й культури. За правління принца-регента Луїтпольда місто пережило справжній розквіт художнього та культурного життя.\nУтім, під час останнього конфлікту воно опинилося в облозі, і після виснажливої битви [FROM.FROM.GetAdjective] сили залишили Мюнхен. Значна частина міста лежить у руїнах: площа Марієнплац перетворена на згарище, а бані Фрауенкірхе серйозно пошкоджені внаслідок масованих бомбардувань. Останні осередки [FROM.FROM.GetAdjective] опору в центрі міста біля Нової ратуші зрештою капітулювали перед переможною [FROM.GetAdjective] армією. З падінням Мюнхена крах південної Німеччини видається справою найближчого часу."
 city_capture.295.d.france: "Після напруженої кампанії французькі війська форсували річку Ізар і увійшли до Мюнхена. Під час подальшої битви значна частина міста була зруйнована: площа Марієнплац перетворилася на руїни, а куполи Фрауенкірхе зазнали важких пошкоджень через інтенсивні бомбардування. Німецький опір був запеклим і переріс у вуличні бої за кожен дім, але до настання темряви триколірний стяг Комуни вже гордо майорів над вежею брами Тальбрук.\n\nЗакріпившись у Мюнхені, Комуна Франції готова захопити решту Південної Німеччини. Спостерігачі вважають, що падіння Німецької імперії очікується вже впродовж найближчих тижнів."
 city_capture.295.a: "Падіння Мюнхена означає, що Південна Німеччина наша!"
 city_capture.295.b: "Із втратою Мюнхена Південну Німеччину втрачено."
 city_capture.295.c: "Так падає серце Баварії..."
 city_capture.295.a.france: "Славетна перемога Комуни! Ми помстимося за наших братів, уперед!"
 city_capture.295.b.france: "Становище катастрофічне. Фатерлянд перед лицем найбільшої небезпеки."
 city_capture.295.c.france: "Із падінням Мюнхена Комуна здається нестримною."

 city_capture.296.t: "Падіння Делі"
 city_capture.296.d: "Одне з найдавніших міст світу, стародавнє Делі багато разів завойовували, грабували та відбудовували заново. Найдавніші архітектурні пам'ятки датуються 300 роком до нашої ери, що свідчить про глибоку історію та незламність міста.\n\nОднак тепер Делі впало під натиском ворожих військ, і його стародавні будівлі знову опинилися під загрозою знищення. Уперше з часів кривавої облоги 1857 року Делі зазнало штурму: [FROM.FROM.GetAdjective] захисники не витримали потужного наступу [FROM.GetAdjective] сил. Повідомлення свідчать, що [FROM.GetAdjective] армія почала зганяти [FROM.FROM.GetAdjective] полонених і тих, хто вижив, до Пурана-Кіла — стародавньої фортеці, яку перетворили на табір для інтернованих."
 city_capture.296.a: "Невдача... але ми не здамося!"
 city_capture.296.b: "Серце Північної Індії наше!"
 city_capture.296.c: "У Делі знову новий господар..."

 city_capture.297.t: "Падіння Риги"
 city_capture.297.d: "Рига, «перлина Балтики», сьогодні пала під натиском [FROM.GetAdjective] сил. Цей бурхливий торговельний вузол відіграє роль важливого економічного та фінансового центру Балтійського моря. Хоча [FROM.GetAdjective] армія пообіцяла підтримувати мирний окупаційний режим, містом вирують пожежі, а біженці намагаються врятуватися морем. Деякі будівлі, як-от Будинок Чорноголових, лежать у руїнах після нищівних бомбардувань [FROM.GetAdjective] авіації.\n\nПритиснуті до моря, [FROM.FROM.GetAdjective] оборонці не мали іншого вибору, окрім як оголосити про беззастережну капітуляцію перед переможною [FROM.GetAdjective] армією, щоб запобігти подальшому руйнуванню міста."
 city_capture.297.a: "Наше становище вкрай важке. Забезпечте, щоб порт залишався відкритим для евакуації!"
 city_capture.297.b: "Нарешті перлина Балтики наша!"
 city_capture.297.c: "Для Риги настали темні часи."

 city_capture.298.t: "Падіння Каїра"
 city_capture.298.d: "Каїр, «місто тисячі мінаретів», є одним із найдавніших міст світу, яке слугує культурним та інтелектуальним осередком арабського світу. Місто бачило незліченну кількість завойовників як у давні, так і в новітні часи. І знову, подібно до вічних пісків, що його оточують, це величне місто опинилося під владою нового окупанта. Після успішної кампанії [FROM.GetAdjective] армії залишки [FROM.FROM.GetAdjective] оборонців спробували дати останній бій у Каїрській цитаделі.\n\nПісля тривалого опору останні [FROM.FROM.GetAdjective] сили в місті оголосили про беззастережну капітуляцію. Попри грандіозну перемогу, [FROM.GetAdjective] армія пообіцяла жорстко припиняти будь-яке мародерство, аби зберегти це історичне місто."
 city_capture.298.a: "Каїр, місто фараонів, наш!"
 city_capture.298.b: "Ми зазнали важкої поразки. Ми ще повернемося!"
 city_capture.298.c: "Стародавнє місто серед пісків знову служитиме новому господарю."
 city_capture.298.d.ottoman: "Каїр, «місто тисячі мінаретів», є одним із найдавніших міст світу, що слугує інтелектуальним і культурним центром арабського світу. Це також серце єгипетської нації — однієї з кількох арабських держав, які оголосили війну Османській імперії.\n\nОднак після успішної османської кампанії єгипетські сили в місті беззастережно капітулювали, хоча окремі загони чинили відчайдушний опір у Каїрській цитаделі. Попри перемогу, османська армія пообіцяла жителям Каїра, що окупація буде мирною, а історичні пам'ятки стародавнього міста не постраждають."
 city_capture.298.a.ottoman: "Так званий «Каїрський пакт» тепер розпадеться. Славетна перемога Османської держави!"
 city_capture.298.b.ottoman: "Із падінням Каїра турки вдерлися вглиб Єгипту. Вони більше ніколи не пануватимуть тут — ми мусимо піти в контрнаступ!"
 city_capture.298.c.ottoman: "Із падінням Каїра майбутнє Каїрського пакту видається примарним."

 city_capture.299.t: "Падіння Кейптауна"
 city_capture.299.d: "Кейптаун — одне з найбільших міст Південної Африки, розташоване на Західному Кейпі, яке здавна приваблювало своєю дивовижною природою та відігравало важливу роль в економіці регіону. За довгі роки відтоді, як перші мореплавці прибули до мису Доброї Надії, Кейптаун давно переріс статус далекого форпосту. Проте колись квітуче та найбільше місто Південної Африки зазнало гіркого удару долі, коли [FROM.GetAdjective] сили нещодавно захопили його в ході успішного наступу.\nЗневірені [FROM.FROM.GetAdjective] оборонці намагалися тримати оборону біля замку Доброї Надії, проте вже до настання темряви стало ясно, що битву програно. Хоча порт Кейптауна постраждав під час боїв, він, безсумнівно, забезпечить стратегічні потреби [FROM.GetAdjective] армії, яка розпочинає окупацію міста."
 city_capture.299.a: "Ми програли битву, але війна ще не втрачена!"
 city_capture.299.b: "Головний порт Кейптауна наш!"
 city_capture.299.c: "«Місто-мати» окуповане."

 city_capture.300.t: "Падіння Буенос-Айреса"
 city_capture.300.d: "Буенос-Айрес, який називають «Парижем Південної Америки», є головним осередком для європейських іммігрантів, а також регіональною столицею мистецтв і фінансів. Головні авеню міста були зведені нещодавно — разом із найвищими хмарочосами Південної Америки та першим на континенті метрополітеном.\n\nПроте рішучий наступ [FROM.GetAdjective] армії призвів до повномасштабної битви на міських вулицях. Запеклі сутички точилися на Авеніда де Майо та Авеніда 9 де Хуліо, де [FROM.FROM.GetAdjective] захисники чинили відчайдушний опір у головних будівлях міста. Бій переріс у криваві сутички за кожен будинок, але зрештою [FROM.FROM.GetAdjective] оборонці почали виходити зі схованок і складати зброю. Це справді велика перемога для [FROM.GetAdjective] нації."
 city_capture.300.a: "Величне місто Південної Америки наше!"
 city_capture.300.b: "Утративши Буенос-Айрес, ми мусимо подвоїти наші зусилля."
 city_capture.300.c: "Королева Ла-Плати пала!"
 city_capture.300.d.patagonia: "Патагонські революціонери здобули сьогодні визначну перемогу: прапор патагонського руху гордо майорить над Каса-Росада. Битва за Буенос-Айрес була кривавою та швидко переросла у вуличні бої вздовж головних магістралей — Авеніда де Майо та Авеніда 9 де Хуліо. Проте до настання ночі стало зрозуміло, що патагонські революціонери взяли гору, а столиця аргентинського режиму пала.\nНа світлинах закарбувався знаменний момент: радісні революціонери пройшли парадом головною вулицею міста на танках і вантажівках колишнього аргентинського режиму. Утім, хоч патагонський уряд і запевнив світ у максимально мирному характері революції, уже ширяться чутки про священиків та колишніх «ворогів держави», яких під дулами гвинтівок ведуть на допити."
 city_capture.300.a.patagonia: "Viva la Revolución! Товариші, вперед на визволення решти Аргентини!"
 city_capture.300.b.patagonia: "Негайно в контрнаступ! Аргентина не дістанеться безбожним революціонерам!"
 city_capture.300.c.patagonia: "Соціалістична революція прийшла до Аргентини."

 city_capture.301.t: "Падіння Сантьяго"
 city_capture.301.d: "Одне з найбільших і найдавніших міст Південної Америки, Сантьяго затишно розташоване в центрі Сантьягської улоговини в оточенні Андських гір. Гори Чилі та розташування на вузькому західному узбережжі Південної Америки створювали для Сантьяго відчуття безпеки. Проте географічна перевага не допомогла: [FROM.GetAdjective] солдати успішно увійшли до міста після запеклого бою з [FROM.FROM.GetAdjective] захисниками. Під час сутичок стрілянина гриміла вздовж знаменитого проспекту Аламеда.\n[FROM.GetAdjective] бійці зуміли прорвати [FROM.FROM.GetAdjective] барикади й укріплення на вулиці Пасео Аумада. Дезорганізовані та знекровлені, [FROM.FROM.GetAdjective] сили не мали іншого вибору, окрім як оголосити про беззастережну капітуляцію."
 city_capture.301.a: "Місто Святого Якова наше!"
 city_capture.301.b: "Ми ніколи не здамося! Контратакуємо, щойно будемо готові!"
 city_capture.301.c: "Місто острівних пагорбів упало..."
 city_capture.301.d.argentina: "Після тривалої й виснажливої кампанії по всьому пасму Анд аргентинський прапор гордо замайорів над палацом Ла-Монеда. Вуличні бої на знаменитому проспекті Аламеда та вулиці Пасео Аумада були запеклими, чилійські сили чинили шалений опір. Проте аргентинці зуміли ліквідувати осередки оборони в місті, а ті захисники, які вижили, поспішили здатися переможній аргентинській армії.\nІз втратою Сантьяго Аргентина, схоже, здобуває вирішальну перевагу в південноамериканському конфлікті. Бойовий дух чилійців підірвано, а спостерігачі зазначають, що зростання невдоволення через невдачі у війні проти Аргентини — лише питання часу."
 city_capture.301.a.argentina: "Славетна перемога! Незабаром Південна Америка буде очищена від соціалістичної загрози."
 city_capture.301.b.argentina: "Ми не поступимося реакціонерам! Перегрупуймося, товариші, ми ще повернемося!"
 city_capture.301.c.argentina: "Відчутний удар по чилійських амбіціях."

 city_capture.302.t: "Падіння Мінська"
 city_capture.302.d: "Післявоєнне відродження Мінська принесло бурхливий розвиток вищої освіти, лікарень і кінотеатрів, перетворивши місто на центр білоруської мови та культури. Проте історія повторюється, і Мінськ знову опинився на лінії фронту — тільки цього разу його окупували [FROM.GetAdjective] сили.\n\nЗначна частина міста зазнала руйнувань від нищівних бомбардувань та артилерійських обстрілів; повідомляють про численні колони біженців, які рятуються від хаосу. Попри запеклий опір, [FROM.FROM.GetAdjective] оборонці зрештою беззастережно капітулювали перед переможною [FROM.GetAdjective] армією, і лише час покаже, наскільки важкою буде відбудова Мінська."
 city_capture.302.a: "Величне місто Білорусі наше!"
 city_capture.302.b: "Ми ніколи не здамося!"
 city_capture.302.c: "Чорний день для білоруського народу..."
 city_capture.302.d.russia: "До Першої світової війни Мінськ був частиною Росії. Після потужного наступу російської армії історія, схоже, повторилася. Російські війська завдавали ударів по місту з повітря та землі, а білоруський опір слабшав під нищівним натиском російської військової машини.\n\nПісля виснажливої й жорстокої битви, яка перетворила більшу частину міста на руїни, уцілілі оборонці здалися переможним російським військам. Заводи, музеї та тисячі цивільних поспіхом вирушили на захід, рятуючись від загарбників. Ця поразка завдає важкого удару по білоруській незалежності, проте лише час покаже, чи буде російська окупація тимчасовою, чи залишиться назавжди."
 city_capture.302.a.russia: "Це лише початок. Незабаром ми повернемо всі наші землі!"
 city_capture.302.b.russia: "Ми ніколи не віддамо нашу незалежність! Боріться далі!"
 city_capture.302.c.russia: "Нищівний удар по майбутньому Білорусі: російський ведмідь іде вперед..."

 city_capture.303.t: "Падіння Вільнюса"
 city_capture.303.d: "Вільнюс, відомий насамперед своїм Старим містом — одним із найбільших збережених середньовічних центрів у Північній Європі, — є місцем, де поруч гармонійно співіснують визначні архітектурні стилі: готика, ренесанс, класицизм і бароко.\nПроте для містян настали темні часи, коли Вільнюс охопила битва. [FROM.GetAdjective] війська намагалися оточити місто, тоді як захисники пішли на відчайдушний прорив, сподіваючись вирватися з облоги. Почалися жорстокі бої за кожну вулицю, поки [FROM.GetAdjective] частини намагалися зламати оборону. Після виснажливої битви, коли значна частина міста перетворилася на руїни та згарища, [FROM.FROM.GetAdjective] оборонці склали зброю. Чи зуміє цей колишній європейський культурний центр відновити свою довоєнну велич — покаже час."
 city_capture.303.a: "Ми битимемося до останнього!"
 city_capture.303.b: "«Північний Єрусалим» наш!"
 city_capture.303.c: "Величне литовське місто впало?"

 city_capture.304.t: "Падіння Нанкіна"
 city_capture.304.d: "Після кількаденного нищівного артилерійського обстрілу з вершини Цзицзіньшань — «Пурпурової гори» — та безперервних штурмів міських мурів Нанкін упав надвечір. Оборонці біля воріт Чжунхуа та Гуанхуа билися до останнього, їхні тіла вкрили стародавні міські мури, поки решта бійців вела ар'єргардні бої у звивистих міських провулках.\n\nБез надії на підкріплення та після невдалих спроб [FROM.FROM.GetAdjective] частин за межами міста відбити батареї на Цзицзіньшані, нечисленні вцілілі загони всередині опинилися перед загрозою повного знищення. Втрата давньої південної столиці стане важким ударом по військових зусиллях [FROM.FROM.GetAdjective], хоча [FROM.FROM.GetLeader] уже заявив про непохитну віру в остаточну перемогу."
 city_capture.304.a: "«Південна столиця» наша!"
 city_capture.304.b: "Краще смерть, ніж капітуляція! Ми ще повернемося!"
 city_capture.304.c: "Величне місто Нанкін упало."
 city_capture.304.d.japan: "Після кількаденного нищівного обстрілу з вершини Цзицзіньшань — «Пурпурової гори» — та запеклих штурмів мурів Нанкін упав надвечір. Захисники на укріпленнях билися до останнього, проте решта армії здригнулася невдовзі після того, як японські війська підняли прапор Вранішнього Сонця над брамою Чжунхуа, що призвело до безладного відступу, під час якого звивисті вулиці вкрилися покинутою амуніцією та зброєю.\n\nХоча японці оголосили, що окупація Нанкіна буде мирною, вулиці всіяні загиблими й пораненими, а серед неконтрольованих пожеж лунають поодинокі постріли. Світанок неодмінно принесе похмуру нову реальність для давньої південної столиці та її вцілілих мешканців."
 city_capture.304.a.japan: "Банзай! Славетна перемога Імператора!"
 city_capture.304.b.japan: "Ми ніколи не здамося японським собакам!"
 city_capture.304.c.japan: "Хай Господь змилується над народом Нанкіна..."

 city_capture.305.t: "Падіння Уханя"
 city_capture.305.d: "Після запеклого бою агломерація трьох міст Уханя сьогодні вранці пала під натиском сил [FROM.GetName]. Захисники сподівалися повторити успішну оборону Учана У Пейфу в 1926 році та нав'язати затяжну облогу, проте рішучий штурм і відсутність підтримки з річки остаточно перекреслили ці надії.\n\nКоли [FROM.GetAdjective] прапор замайорів над губернаторською резиденцією та пагорбом Лоцзя, [FROM.GetName] завдала потужного удару по [FROM.FROM.GetNameDef], захопивши один із найважливіших логістичних вузлів Китаю та один із його найпотужніших арсеналів. Чи вважатимуть колись день [?global.date.GetDateStringNoHourLong] поворотним моментом, чи лише черговою битвою — він іще довго непокоїтиме думки [FROM.FROM.GetAdjective] лідерів."
 city_capture.305.a: "Ухань, місто річок, наш!"
 city_capture.305.b: "Краще смерть, ніж капітуляція! Ми ще повернемося!"
 city_capture.305.c: "Важка поразка для [FROM.FROM.GetAdjective]"
 city_capture.305.d.japan: "Після запеклого бою агломерація трьох міст Уханя сьогодні вранці пала під натиском японських сил. Оборонці сподівалися повторити успішну оборону Учана У Пейфу в 1926 році та затягнути облогу, проте японський контроль над річкою та перевага у вогневій міці зробили ці спроби марними. Коли Хіномару піднявся над губернаторською резиденцією та пагорбом Лоцзя, Японія завдала нищівного удару по [FROM.FROM.GetNameDef], захопивши ключовий логістичний вузол і один із найпродуктивніших арсеналів Китаю. Оскільки шлях углиб країни тепер відкритий, це навряд чи стане останньою здобиччю."
 city_capture.305.a.japan: "Незабаром ми здобудемо повну перемогу над китайцями!"
 city_capture.305.b.japan: "Ми ніколи не здамося японським собакам!"
 city_capture.305.c.japan: "Японський наступ углиб Китаю триває..."

 city_capture.306.t: "Падіння Гуанчжоу"
 city_capture.306.d: "Після запеклих боїв за кожен будинок сили [FROM.GetName] сьогодні на світанку захопили Гуанчжоу. Відоме на міжнародній арені як Кантон, це портове місто є найбільшим промисловим і торговельним центром Південного Китаю за межами Гонконгу, і його втрата стане важким ударом по військових зусиллях [FROM.FROM.GetNameDef]. Хоча доки та вузькі провулки вже перебувають під контролем, ширяться чутки про формування загонів опору на горі Байюнь на півночі, звідки вони можуть спробувати відбити місто.\n\nПівденний Китай і Ґуандун зокрема відомі своєю непокорою зовнішньому контролю — чи то з боку Пекіна, чи будь-кого іншого. Утримати місто може виявитися значно важче, ніж розраховував [FROM.GetLeader]."
 city_capture.306.a: "Порт Кантон узято!"
 city_capture.306.b: "Поразка, після якої ми обов'язково повернемося!"
 city_capture.306.c: "Велика втрата для [FROM.FROM.GetName]"
 city_capture.306.d.japan: "Після канонади, яку було чутно аж у Гонконгу за вісімдесят миль, Гуанчжоу сьогодні вранці впав під натиском сил [new_controlled.GetName]. Місто не бачило такої облоги з часів німецької відповіді на ноту Северна в жовтні 1926 року, але, на відміну від Кайзерліхмаріне, нові загарбники мають намір залишитися надовго. У канцелярії провінційного губернатора вже створено військовий штаб, а поруч, на пагорбі Юесю, облаштовують табір.\n\nУтім, ширяться чутки про формування сил опору в горах Байюнь на півночі, звідки вони можуть спробувати відбити місто. Південний Китай і Ґуандун зокрема славляться своєю ворожістю до чужоземного панування. Утримати регіон може виявитися значно важче, ніж очікувала Японія."
 city_capture.306.a.japan: "Із захопленням Гуанчжоу Південний Китай наш!"
 city_capture.306.b.japan: "Ми ніколи не здамося японським собакам!"
 city_capture.306.c.japan: "Японці тепер контролюють Перлинну річку..."

 city_capture.307.t: "Падіння Чунціна"
 city_capture.307.d: "Як найдальший судноплавний пункт на величній річці Янцзи, вулиці Чунціна колись були переповнені біженцями: багатими й бідними, які рятувалися від нестримного наступу японців. Це було кілька днів тому. Коли завила міська сирена, а гуркіт артилерії сповістив про останній бій захисників на східному березі річки, місто знову спорожніло. Тиснява забрала майже стільки ж життів, скільки й самі загарбники.\n\nТепер на вулицях панує тиша, розірвана лише димом, уламками та тілами загиблих. Із падінням Чунціна перед Японією майже не залишилося перешкод для повного підкорення південно-західного Китаю."
 city_capture.307.a: "Ще одна славетна перемога!"
 city_capture.307.b: "Важка втрата, але ми відновимо сили!"
 city_capture.307.c: "Вирішальний крок Японії на шляху до здійснення своїх амбіцій."

 city_capture.308.t: "Падіння Куньміна"
 city_capture.308.d: "Уперше з моменту придушення повстання Трьох удільних князів у 1681 році місто Куньмін упало під натиском загарбників з-поза меж провінції Юньнань. Утративши аеродром Уцзяба на південному сході, сили [FROM.FROM.GetNameDef] поступово відступали вздовж озера Дяньчі, доки остаточно не зламалися після штурму стародавніх міських мурів.\n\nПоки війська [FROM.GetNameDef] крокують під знаменитими арками Цзіньма-Біцзі, їхні командувачі можуть бути задоволені: вони взяли під контроль не лише потужний Куньмінський арсенал, а й кінцеву станцію прибуткової залізниці Куньмін — Хайфон."
 city_capture.308.a: "Цією перемогою ми закріпили наш контроль\nнад західним Китаєм."
 city_capture.308.b: "Ми дамо останній бій\nу горах попереду!"
 city_capture.308.c: "Гори Юньнані мають нового господаря..."
 city_capture.308.d.japan: "Уперше з часу поразки Трьох удільних князів у 1681 році місто Куньмін упало перед іноземним загарбником. Утративши аеродром Уцзяба на південному сході, сили [FROM.FROM.GetNameDef] поступово відступали вздовж озера Дяньчі, доки остаточно не розсіялися, коли мури міста було прорвано.\n\nПоки японські солдати крокують під знаменитими арками Цзіньма-Біцзі, їхні офіцери святкують успіх: під їхнім контролем опинився не лише продуктивний Куньмінський арсенал, а й стратегічна залізниця Куньмін — Хайфон. Китаю завдано чергового потужного удару. Тепер, коли Японія просунулася так далеко вглиб країни, скільки ще таких ударів зможе витримати нація?"
 city_capture.308.a.japan: "Китайцям не втекти від нашого наступу!"
 city_capture.308.b.japan: "У гори! Ми ніколи їм не здамося, ніколи!"
 city_capture.308.c.japan: "Підкорення Китаю незабаром може стати реальністю..."

 city_capture.309.t: "Чжана вибито з Цзінаня!"
 city_capture.309.d_Zongchang: "З 1925 року місто Цзінань стало відображенням свого правителя: корумпованим, розпусним, сповненим пороку й злочинів. При своєму «дворі» Чжан Цзунчан протегував усім — від художників і письменників до гульвіс і повій, водночас страчуючи кожного, хто насмілювався перечити йому, і розколюючи голови, немов стиглі кавуни. Цьому свавіллю настав край, коли сьогодні вранці оборона Цзінаня впала.\n\nПовідомляють, що крізь гуркіт бою було чутно розлючений рик самого Чжана, який намагався врятувати свої незліченні багатства. Нині його ніде немає: гарем покинутий, а величний маєток охоплений полум'ям. Дехто каже, що Чжан іще повернеться — переможцем або в труні, що вже траплялося раніше: колись після поразки він урочисто в'їхав до Цзінаня, сидячи в домовині з великою сигарою в зубах."
 city_capture.309.d_Tianran: "Високо на горі Тайшань Чжан Тяньжань удавано відійшов від земних справ, проте насправді його вплив сягав далеко за межі Шаньдуна. Завдяки секті Ігуаньдао його очі й вуха були всюди — нерідко разом із вістрям ножа.\n\nУтім, нині його послідовники відступають, і навіть гору Тайшань було втрачено під час рішучого наступу сил [FROM.GetName]. Храм Блакитного світанку, Храм Нефритового імператора та численні інші святині опинилися в руках солдатів, які без поваги топчуть священні місця, скидають статуї, розкидають дари й пахощі та грабують усе довкола. Тайшань може оговтуватися від цього десятиліттями, проте доля самого Чжана залишається невідомою. Ця поразка неодмінно розлютить його адептів, а в нього самого завжди є запасний план."
 city_capture.309.a: "Скатертиною дорога!"
 city_capture.309.b: "Це всього лише тактичний відступ!"
 city_capture.309.c: "Кінець найницішого мілітариста Китаю?"
 city_capture.309.e: "Передчасний кінець дивної віри."

 city_capture.310.t: "Падіння Александрії"
 city_capture.310.d: "Заснована легендарним полководцем Александром, Александрія прославилася такими дивами, як Александрійська бібліотека та Некрополь.\n\nПроте історія повторюється: стародавнє місто знову підкорене іноземною силою. Після масованого бомбардування [FROM.FROM.GetAdjective] сили були змушені відступити до фортеці Кайтбей. Оточені зусібіч і позбавлені інших шляхів для відступу, крім моря, [FROM.FROM.GetAdjective] оборонці трималися з останніх сил. Проте через вичерпання припасів і занепад бойового духу вони були змушені беззастережно капітулювати перед переможною [FROM.GetAdjective] армією. Попри значний тріумф, [FROM.GetAdjective] війська пообіцяли не завдавати шкоди історичним будівлям міста."
 city_capture.310.a: "Завдяки цій перемозі місто Александра наше!"
 city_capture.310.b: "Важка поразка! Ми цього не потерпимо!"
 city_capture.310.c: "Місто Александра підкорено вкотре..."
 city_capture.310.d.ottomans: "Александрія є предметом культурної гордості та значення для єгипетської нації. Будучи місцем великих стародавніх чудес, як-от Александрійська бібліотека, це місто залишається важливим осередком життя, культури та промисловості Єгипту.\nОднак османи досягли значних успіхів у війні проти Єгипту та його арабських союзників: сьогодні вранці османські війська захопили місто та порт. Єгипетський флот устиг відплисти до прибуття османських сил, але захисники не змогли стримати ворога. Оточені зусібіч і придушені міццю османської армії, єгиптяни відступили — відтепер османи знову контролюють стародавнє місто. Попри визначну перемогу, османи зобов'язалися зберегти історичні пам'ятки міста неушкодженими."
 city_capture.310.a.ottomans: "Цією перемогою ми відкриваємо шлях углиб Єгипту!"
 city_capture.310.b.ottomans: "Ми ніколи не скоримося туркам! Ми повернемося!"
 city_capture.310.c.ottomans: "Османи завдали болючого удару по Каїрському пакту."

 city_capture.311.t: "Падіння міста [217.Controller.GetVictoryPointName_3529]"
 city_capture.311.d: "Місто [217.Controller.GetVictoryPointName_3529] завдяки своєму розташуванню століттями було важливим транспортним і торговельним вузлом. Попри стрімке зростання населення, злиденні умови життя перетворили його на осередок революційного руху. Під час Громадянської війни в Росії місто стало місцем вирішальної битви та облоги, і нині історія повторилася: воно знову перетворилося на поле бою.\n\nЗначна частина міста лежить у руїнах після запеклих вуличних боїв та повітряних бомбардувань, які знищили міські квартали. Попри фанатичний опір [FROM.FROM.GetAdjective] сил, [FROM.GetAdjective] армія сьогодні оголосила про повний перехід міста під свій контроль."
 city_capture.311.a: "Ні кроку назад! Ми ще повернемося!"
 city_capture.311.b: "Славетна перемога, незабаром російський ведмідь\nвпаде."
 city_capture.311.c: "Росія дедалі дужче хитається під тягарем війни."

 city_capture.312.t: "Падіння міста [653.Controller.GetVictoryPointName_1821]"
 city_capture.312.d: "Розташоване на східних схилах російського Уралу та розділене річкою Ісеть, місто [653.Controller.GetVictoryPointName_1821] відоме як великий центр, що сполучає східну та західну частини Росії. Саме тут утримували під вартою колишню російську імператорську родину перед її стратою.\n\nУтім, для міста знову настали важкі часи: [FROM.FROM.GetAdjective] частини залишили його під натиском наступаючих [FROM.GetAdjective] армій. Військові зусилля [FROM.FROM.GetAdjective] зазнали нищівної поразки через утрату цього ключового залізничного вузла між Європою та Азією разом із цінними ресурсами Уралу."
 city_capture.312.a: "Кінець для матінки-Росії вже близько."
 city_capture.312.b: "Цією перемогою завдано нищівного удару по військових зусиллях Росії."
 city_capture.312.c: "Схоже, кінець для росіян уже близько."

