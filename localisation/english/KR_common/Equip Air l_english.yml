### JAP - Japan ###
###

 JAP_CAS_equipment_1: "Kawasaki Ki-32"
 JAP_CAS_equipment_1_short: "Ki-32"
 JAP_CAS_equipment_1_desc: "Ki-32 став успішною відповіддю компанії Kawasaki на конкурс Імперської армії Японії щодо створення літака повністю вітчизняної розробки та виробництва. За своїми можливостями літак можна порівняти з німецьким Hs 123: вони мають схожу швидкість, робочу висоту польоту та корисне навантаження."
 JAP_cv_CAS_equipment_1: "Aichi D1A2"
 JAP_cv_CAS_equipment_1_short: "D1A2"
 JAP_cv_CAS_equipment_1_desc: "D1A — останній японський літак, спроєктований іноземною компанією, оскільки Aichi звернулася до Hansa-Brandenburg по допомогу в розробці. Доопрацювання D1A привело до появи модифікації D1A2 з покращеною аеродинамікою та потужнішим двигуном. Повільне впровадження його наступника, Aichi D3A, призвело до того, що він прослужив аж до кінця 1930-х років, коли вже суттєво застарів."
 JAP_CAS_equipment_2: "Mitsubishi Ki-51"
 JAP_CAS_equipment_2_short: "Ki-51"
 JAP_CAS_equipment_2_desc: "Наступник Ki-32, літак Ki-51 отримав потужніший двигун, але зберіг майже той самий планер і незнімне шасі. Попри застарілі риси, його головною перевагою була здатність злітати з ґрунтових аеродромів Тайваню, Кореї та Китаю, де більшість інших машин були безпорадними, ставши основним штурмовиком Японії."
 JAP_cv_CAS_equipment_2: "Aichi D3A"
 JAP_cv_CAS_equipment_2_short: "D3A"
 JAP_cv_CAS_equipment_2_desc: "Через численні проблеми з першим прототипом Aichi D3A прийняли на озброєння лише наприкінці 1939 року. Доопрацьована машина виявилася кращою за Nakajima D3N1, хоча певна курсова нестабільність зберігалася аж до 1940 року. Після усунення цього недоліку D3A виявився надзвичайно маневреним порівняно з іншими машинами цього класу, особливо з літаками Імперської армії."
 JAP_CAS_equipment_3: "Manshū Ki-98"
 JAP_CAS_equipment_3_short: "Ki-98"
 JAP_CAS_equipment_3_desc: "Нестандартний Ki-98 використовує штовхальний гвинт і 2000-сильний двигун Mitsubishi, розвиваючи максимальну швидкість до 730 км/год. Спочатку спроєктований як висотний перехоплювач, завдяки чутливій системі керування він також підійшов для штурмових ударів, а 37-мм носова гармата виявилася більш ніж придатною для ураження броньованих цілей у Китаї та Південній Азії."
 JAP_cv_CAS_equipment_3: "Yokosuka D4Y Suisei"
 JAP_cv_CAS_equipment_3_short: "D4Y Suisei"
 JAP_cv_CAS_equipment_3_desc: "Розробка нового палубного пікіруючого бомбардувальника розпочалася у 1940 році, однак брак інженерних кадрів істотно затримав появу D4Y Suisei. Ранні прототипи використовували ліцензійний німецький рядний двигун сумнівного походження, тоді як пізніші повернулися до радіальних моторів. Тонкий і добре обтічний фюзеляж дозволяв розвивати велику швидкість як у горизонтальному польоті, так і в пікіруванні. Разом із відмінною маневреністю це давало «Суйсею» перевагу над сучасниками, поступаючись їм лише в масі корисного навантаження."

 JAP_fighter_equipment_0: "Nakajima Type 91"
 JAP_fighter_equipment_0_short: "Type 91"
 JAP_fighter_equipment_0_desc: "Спроєктований у 1935 році Type 91 спершу страждав від «дитячих хвороб» — поганої курсової стійкості та невдалого центру ваги. Через це прийняття на озброєння затягнулося до кінця 1935 року, а масове виробництво розпочалося лише в 1936 році. Попри початкові проблеми, Type 91 виявився надійним та шанованим винищувачем."
 JAP_cv_fighter_equipment_0: "Nakajima A4N"
 JAP_cv_fighter_equipment_0_short: "A4N"
 JAP_cv_fighter_equipment_0_desc: "A4N отримав 730-сильний двигун і суцільнометалеву конструкцію, ставши адаптацією армійського винищувача Type 91 зі зворотним переходом до схеми біплана. Командування та пілоти надавали перевагу звичнішим біпланам навіть ціною льотних характеристик — особливо на тлі прототипу палубного винищувача 7-shi від Mitsubishi, який розбився на випробуваннях."
 JAP_fighter_equipment_1: "Nakajima Ki-27"
 JAP_fighter_equipment_1_short: "Ki-27"
 JAP_fighter_equipment_1_desc: "Щойно Type 91 надійшов у війська, Імперська армія Японії вже шукала заміну у вигляді моноплана, але зі збереженням озброєння з двох легких кулеметів. Ki-27 міг закладати такі ж круті віражі, як і його попередник Type 91 завдяки низькому питомому навантаженню на крило, будучи при цьому помітно швидшим."
 JAP_cv_fighter_equipment_1: "Mitsubishi A5M"
 JAP_cv_fighter_equipment_1_short: "A5M"
 JAP_cv_fighter_equipment_1_desc: "Після невдалого прототипу за конкурсом 7-shi компанія Mitsubishi вдосконалила проєкт і створила A5M. Новий літак отримав тонке еліптичне крило типу «зворотне чайчине крило» та фіксоване шасі, ставши одним із перших монопланів палубного базування."
 JAP_fighter_equipment_2: "Nakajima Ki-43 Hayabusa"
 JAP_fighter_equipment_2_short: "Ki-43 Hayabusa"
 JAP_fighter_equipment_2_desc: "Збудований у 1939 році Ki-43 спершу розчарував пілотів, однак послідовна серія доробок суттєво покращила його характеристики. Завдяки високій скоропідйомності та маневреності він став найпопулярнішим сухопутним винищувачем Імперської армії. Утім, навіть модернізації не вирішили проблему слабкої вогневої міці «Хаябуси», оскільки озброєння обмежувалося двома кулеметами гвинтівкового калібру."
 JAP_cv_fighter_equipment_2: "Mitsubishi A6M Rei-sen"
 JAP_cv_fighter_equipment_2_short: "A6M Rei-sen"
 JAP_cv_fighter_equipment_2_desc: "Щойно революційний Mitsubishi A5M почав надходити у війська, флот узявся шукати наступника, висунувши жорсткі вимоги до високих характеристик і потужного озброєння. Компанія Nakajima вийшла з конкурсу після ознайомлення з вимогами, тоді як Mitsubishi довела справу до кінця. A6M перевершив A5M у всьому, крім маневреності на низьких швидкостях, вразивши морських пілотів своїми визначними якостями."
 JAP_fighter_equipment_3: "Nakajima Ki-84 Hayate"
 JAP_fighter_equipment_3_short: "Ki-84 Hayate"
 JAP_fighter_equipment_3_desc: "Попри похвалу на адресу Ki-43 Hayabusa, льотчики скаржилися на слабку живучість, низьку швидкість і посереднє озброєння. Ki-84 розроблявся для виправлення цих недоліків і блискуче впорався зі своїм завданням. Маючи на озброєнні до чотирьох 20-мм гармат, він по праву вважається одним із найкращих винищувачів своєї епохи."
 JAP_cv_fighter_equipment_3: "Mitsubishi A7M Reppū"
 JAP_cv_fighter_equipment_3_short: "A7M Reppū"
 JAP_cv_fighter_equipment_3_desc: "Амбітні адмірали Імперського флоту оголосили конкурс на літак, який перевершить A6M Rei-sen, невдовзі після появи останнього. Відповіддю Mitsubishi став Reppū, який отримав більший розмах крила, потужніший двигун і значно важче озброєння порівняно з A6M."
 #Nakajima Kikka:
 JAP_jet_fighter_equipment_1: "Nakajima J9N Unryū"
 JAP_jet_fighter_equipment_1_short: "J9N Unryū"
 JAP_jet_fighter_equipment_1_desc: "Коли німецький перебіжчик передав японській розвідці фотографії та ескізні креслення Bf 262, авіація флоту виявила величезний інтерес. Отримавши копії матеріалів, компанія Nakajima вирішила побудувати власний літак. У співпраці з Ishikawajima було створено турбореактивний двигун Ne-20, а сам літак отримав звичніше компонування порівняно з Bf 262 — пряме крило та більш обтічний фюзеляж. Отриманий J9N Unryū зовні нагадував німецький прототип, але був цілком самостійною розробкою."
 JAP_jet_fighter_equipment_2: "Kyūshū J7W Shinden-Kai"
 JAP_small_plane_airframe_5: "Kyūshū J7W Shinden-Kai"
 JAP_jet_fighter_equipment_2_short: "J7W Shinden-Kai"
 JAP_small_plane_airframe_5_short: "J7W Shinden-Kai"
 JAP_jet_fighter_equipment_2_desc: "J7W Shinden проєктувався під зіркоподібний двигун, але можливість встановлення турбореактивного мотора, як-от Ishikawajima Ne-20, також бралася до уваги. Коли реактивні двигуни довели свою ефективність на J9N Unryū, концепт втілили в життя: J7W1 отримав покращені двигуни Nakajima Ne-230 та посилене озброєння у вигляді додаткової пари 30-мм гармат."

 JAP_nav_bomber_equipment_1: "Mitsubishi G3M1"
 JAP_nav_bomber_equipment_1_short: "G3M1"
 JAP_nav_bomber_equipment_1_desc: "Після того як Mitsubishi домовилася з адміралом Ямамото Ісороку про підтримку проєкту G3M через його невдалий перший політ, на світ з'явився G3M1. Планер доопрацювали, дозволивши йому нести торпеди на додачу до стандартного бомбового навантаження. Після внесених змін швидкість і дальність польоту G3M1 не мали рівних серед літаків інших великих держав."
 JAP_cv_nav_bomber_equipment_1: "Nakajima B5N"
 JAP_cv_nav_bomber_equipment_1_short: "B5N"
 JAP_cv_nav_bomber_equipment_1_desc: "B5N — перший палубний торпедоносець-моноплан Імперського флоту, який виявився значно швидшим за інші літаки на службі, але водночас дуже вразливим до ворожого вогню. Він мав слабке оборонне озброєння лише з одного кулемета у хвості, проте вантажопідйомність і швидкість літака залишалися на рівні найкращих світових зразків."
 JAP_nav_bomber_equipment_2: "Mitsubishi G4M"
 JAP_nav_bomber_equipment_2_short: "G4M"
 JAP_nav_bomber_equipment_2_desc: "Будучи подальшим розвитком G3M із вимогами ще більшої дальності та швидкості, G4M став гідним наступником. Він міг нести важче навантаження, ніж G3M, а також розвивати вищу швидкість і підніматися на більшу висоту."
 JAP_cv_nav_bomber_equipment_2: "Nakajima B6N Tenzan"
 JAP_cv_nav_bomber_equipment_2_short: "B6N Tenzan"
 JAP_cv_nav_bomber_equipment_2_desc: "Конструкція B6N базувалася на попереднику B5N, отримавши збільшену швидкість і вантажопідйомність без суттєвої зміни планера. Двигун замінили на агрегат від Mitsubishi, що додало швидкості, але ніяк не покращило слабке захисне озброєння та високу вразливість до ворожого вогню."
 JAP_nav_bomber_equipment_3: "Yokosuka P1Y Ginga"
 JAP_nav_bomber_equipment_3_short: "P1Y Ginga"
 JAP_nav_bomber_equipment_3_desc: "Технічне завдання 15-shi вимагало бомбардувальник, здатний супроводжувати винищувачі A6M Rei-sen зі збереженням озброєння попереднього G4M. P1Y Ginga отримав винятково обтічний фюзеляж, досягнувши на випробуваннях швидкості, порівнянної з одномісними винищувачами. Літак використовувався переважно як морський бомбардувальник берегового базування, а деякі його модифікації служили нічними винищувачами та перехоплювачами."
 JAP_cv_nav_bomber_equipment_3: "Aichi B7A Ryūsei"
 JAP_cv_nav_bomber_equipment_3_short: "B7A Ryūsei"
 JAP_cv_nav_bomber_equipment_3_desc: "B7A Ryūsei створювався для використання на авіаносцях нового покоління. Характерне крило типу «зворотне чайчине крило» дозволило нести навантаження рівня B6N Tenzan на значно вищій швидкості та з чудовою керованістю. Він також порушив японську традицію відсутності курсового наступального озброєння на ударних машинах завдяки встановленню двох 20-мм гармат у корені крила."

 JAP_heavy_fighter_equipment_1: "Kawasaki Ki-38"
 JAP_heavy_fighter_equipment_1_short: "Ki-38"
 JAP_heavy_fighter_equipment_1_desc: "Ki-38 був ініціативною розробкою компанії Kawasaki у відповідь на появу європейських двомоторних важких винищувачів на зразок Bf 110. Після огляду дерев'яного макета армія замовила партію дослідних зразків для випробувань. Польоти показали сильний брак потужності, що частково виправили встановленням двигунів Nakajima Ha-25. Літак використовувався як патрульна машина далекого радіуса дії в південно-східній частині Тихого океану."
 JAP_heavy_fighter_equipment_2: "Kawasaki Ki-45 Toryū"
 JAP_heavy_fighter_equipment_2_short: "Ki-45 Toryū"
 JAP_heavy_fighter_equipment_2_desc: "Для покращення характеристик Ki-38 планувалася низка доробок. Проте після усвідомлення, що силової установки буде замало для поважчалої конструкції, план повністю переглянули. Нова машина зазнала настільки глибоких змін, що фактично стала іншим літаком і отримала новий індекс."
 JAP_heavy_fighter_equipment_3: "Kawasaki Ki-102"
 JAP_heavy_fighter_equipment_3_short: "Ki-102"
 JAP_heavy_fighter_equipment_3_desc: "Попри зовнішню схожість із Ki-45 Toryū, Ki-102 був значно смертоноснішим за попередника. 37-мм гармата Ho-204, а згодом і 57-мм Ho-401 у носовій частині робили його грізним перехоплювачем, де навіть одна коротка черга могла відірвати крило найміцнішому бомбардувальнику."

 JAP_tac_bomber_equipment_0: "Mitsubishi Ki-2"
 JAP_tac_bomber_equipment_0_short: "Ki-2"
 JAP_tac_bomber_equipment_0_desc: "Ki-2 є японською адаптацією шведського бомбардувальника, який спочатку створювався на базі німецького поштового літака Junkers. Літак добре проявив себе в ролі розвідника та легкого бомбардувальника. Будучи застарілим уже на момент надходження у війська, він використовувався як навчальний літак аж до кінця 1930-х років."
 JAP_tac_bomber_equipment_1: "Mitsubishi G3M"
 JAP_tac_bomber_equipment_1_short: "G3M"
 JAP_tac_bomber_equipment_1_desc: "G3M планувався як швидкісний висотний багатоцільовий бомбардувальник для Імперського флоту. Однак слабкий двигун Hiro Type 91 не дозволяв розвинути розрахункову крейсерську швидкість, не кажучи вже про висоту польоту. Mitsubishi продовжила вдосконалювати літак, але підтримка з боку флоту згасла після невдалого першого польоту. Лише втручання адмірала Ямамото Ісороку дозволило машині потрапити у війська та довести свою спроможність."
 JAP_tac_bomber_equipment_2: "Kawasaki Ki-48 Sōkei"
 JAP_tac_bomber_equipment_2_short: "Ki-48 Sōkei"
 JAP_tac_bomber_equipment_2_desc: "Досвід розробки Ki-38 та Ki-45 став у пригоді під час створення Ki-48. Літак виявився легшим за споріднені винищувачі, мав мінімум технічних проблем і достатнє бомбове навантаження. Пілоти пікірувальників відзначали його відмінну керованість і здатність ефективно атакувати з пікірування."
 JAP_tac_bomber_equipment_3: "Mitsubishi Ki-67 Hiryū"
 JAP_tac_bomber_equipment_3_short: "Ki-67 Hiryū"
 JAP_tac_bomber_equipment_3_desc: "Амбітні вимоги до наступника Ki-48 Sōkei передбачали потужне захисне озброєння проти перехоплювачів, високу швидкість, здатність до пікірування та виняткову бойову живучість. Ki-67 отримав суттєво вищий рівень захисту проти інших японських літаків завдяки протектованим паливним бакам і численним бронеплитам екіпажу."
 JAP_jet_tac_bomber_equipment_1: "Yokosuka R2Y2 Keiun-Kai"
 JAP_jet_tac_bomber_equipment_1_short: "R2Y2 Keiun-Kai"
 JAP_jet_tac_bomber_equipment_1_desc: "Невтішні розрахункові дані щодо R1Y спонукали флот замовити новий проєкт — R2Y зі спареним двигуном Aichi Ha-70. Подальші дослідження привели до встановлення двох турбореактивних двигунів Mitsubishi Ne-330 та додаткових вузлів підвіски на перероблених крилах. Нові пілони перетворили Keiun на високоефективний швидкісний тактичний бомбардувальник."
 JAP_jet_tac_bomber_equipment_2: "Nakajima Ki-190 Ryūjin"
 JAP_jet_tac_bomber_equipment_2_short: "Ki-190 Ryūjin"
 JAP_jet_tac_bomber_equipment_2_desc: "Модернізуючи Ki-67 Hiryū, армія вирішила підвищити його швидкість встановленням пари турбореактивних двигунів Mitsubishi Ne-330. Попри початкові технічні негаразди, Ki-190 Ryūjin на випробуваннях упевнено подолав позначку в 900 км/год і був швидко прийнятий армією. Він зберіг більшість переваг Ki-67 Hiryū, отримавши величезну перевагу у швидкості завдяки реактивній тязі."

 JAP_strat_bomber_equipment_0: "Mitsubishi Ki-20"
 JAP_strat_bomber_equipment_0_short: "Ki-20"
 JAP_strat_bomber_equipment_1: "Mitsubishi Ki-21"
 JAP_strat_bomber_equipment_1_short: "Ki-21"
 JAP_strat_bomber_equipment_1_desc: "За підсумками випробувань і суперництва з проєктом Nakajima Ki-19 кращим було визнано Ki-21 завдяки вищій швидкості. Проте виробництво розгорталося повільно, і літак масово надійшов на службу лише в 1939 році, коли вже встиг помітно застаріти."
 JAP_strat_bomber_equipment_2: "Nakajima Ki-49 Donryū"
 JAP_strat_bomber_equipment_2_short: "Ki-49 Donryū"
 JAP_strat_bomber_equipment_2_desc: "Створений на заміну Ki-21, Donryū мав надзвичайно потужне за японськими мірками озброєння — пів дюжини легких кулеметів і хвостову гармату, перевершуючи бомбардувальники інших країн за швидкістю та радіусом дії."
 JAP_strat_bomber_equipment_3: "Nakajima G8N Renzan"
 JAP_strat_bomber_equipment_3_short: "G8N Renzan"
 JAP_strat_bomber_equipment_3_desc: "Попри невдалі перші випробування та знищення третього прототипу через пожежу, G8N Renzan став одним із найулюбленіших бомбардувальників. Оснащений передовими турбокомпресорами від Hitachi, «Рендзан» міг підніматися на висоту, недосяжну для більшості японських машин, зберігаючи дальність і швидкість на рівні винищувачів супроводу."
 JAP_jet_strat_bomber_equipment_1: "Nakajima G12N Shōri"
 JAP_jet_strat_bomber_equipment_1_short: "G12N Shōri"
 JAP_jet_strat_bomber_equipment_1_desc: "Зважаючи на успіхи реактивної програми, флот зажадав перевести проблемний проєкт G10N Fugaku на двигуни Nakajima Ne-230. Це вимагало кардинальної перебудови планера, в результаті чого літак перестав бути схожим на «Фугаку» і фактично став новим проєктом, отримавши нове позначення та ім'я Shōri."

 JAP_large_plane_maritime_patrol_plane_airframe_4_short: "K-200"

 JAP_scout_plane_equipment_1: "Mitsubishi Ki-46"
 JAP_scout_plane_equipment_1_short: "Ki-46"
 JAP_scout_plane_equipment_1_desc: "Швидкий та легко озброєний літак перевершував за швидкістю винищувачі того часу, а пізніше отримав ще потужніший двигун. Лише ближче до кінця 1939 року з'явилися перші серійні винищувачі, здатні наздогнати Ki-46."
 JAP_scout_plane_equipment_2: "Nakajima J1N1-C"
 JAP_scout_plane_equipment_2_short: "J1N1-C"
 JAP_scout_plane_equipment_2_desc: "Спочатку задуманий як дальній ескортний винищувач, J1N1 Gekkō був перепрофільований на розвідника після того, як більшість заводів відмовилися створювати новий літак через завантаженість іншими завданнями. Nakajima запропонувала полегшити J1N1, прибравши більшу частину курсового озброєння, що відчутно підвищило швидкість польоту."

 JAP_transport_plane_equipment_1: "Nakajima Ki-34"
 JAP_transport_plane_equipment_1_short: "Ki-34"

 JAP_rocket_suicide_equipment_1: "Yokosuka MXY7 Ohka"
 JAP_rocket_suicide_equipment_1_short: "Ohka"
 JAP_rocket_suicide_equipment_1_desc: "Yokosuka MXY-7 Ohka — спеціалізований ракетний літак-снаряд, керований пілотом-смертником, призначений для ураження ворожих кораблів у разі вкрай несприятливого перебігу війни."
 JAP_rocket_interceptor_equipment_1: "Mitsubishi J8M Shūsui"
 JAP_rocket_interceptor_equipment_1_short: "J8M Shūsui"
 JAP_rocket_interceptor_equipment_1_desc: "Після значних зусиль японській розвідці вдалося отримати креслення німецького ракетного перехоплювача. Ознайомившись із документацією, флот доручив Mitsubishi відтворити літак: так з'явився J8M Shūsui, характеристики якого відповідали закордонним аналогам."
 JAP_rocket_interceptor_equipment_2: "Mitsubishi Ki-202 Shūsui-Kai"
 JAP_rocket_interceptor_equipment_2_short: "Ki-202 Shūsui-Kai"
 JAP_rocket_interceptor_equipment_2_desc: "У типовій манері суперництва між армією та флотом сторони не дійшли згоди щодо конструкції літака: моряки пропонували зняти одну гармату заради паливних баків, а армійці наполягали на розширенні крила. У результаті армія розпочала власну розробку на базі флотського J8M, створивши літак зі збільшеним крилом — Ki-202 Shūsui-Kai."
 JAP_rocket_interceptor_equipment_3: "Mizuno Ki-156 Shinryū"
 JAP_rocket_interceptor_equipment_3_short: "ki-156 Shinryū"
 JAP_rocket_interceptor_equipment_3_desc: "Загроза ударів надвисотних стратегічних бомбардувальників по Японських островах змусила верховне командування доручити авіатехнічному арсеналу флоту в Йокосуці розробку висотного перехоплювача. Вимоги переглянули на користь ракетного двигуна Mitsubishi Toko-Ro.2 від J8M Shūsui та здатності апарата летіти в режимі планера. Це привело до створення Ki-156 Shinryū, у розробці й випуску якого брала участь компанія Mizuno — виробник спортінвентарю, що мав досвід виготовлення планерів."

