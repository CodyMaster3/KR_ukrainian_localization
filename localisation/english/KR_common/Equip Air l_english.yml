### BEL - Flanders-Wallonia ###
###

 BEL_CAS_equipment_1: "Sabca-Caproni 47"
 BEL_CAS_equipment_1_short: "S.47"
 BEL_CAS_equipment_1_desc: "У 1940 році цей штурмовик потерпав від недостатньої швидкості, що робило його легкою мішенню, та слабкого корисного навантаження — це унеможливлювало знищення мостів через канал Альберта бідолашними пілотами, призначеними на ці самогубні місії останнього шансу."
 BEL_CAS_equipment_2: "Renard 37 B 14N"
 BEL_CAS_equipment_2_short: "R-37 B"
 BEL_CAS_equipment_2_desc: "Renard 37 B — біпланна модифікація R37 для штурмових ударів. Оскільки було побудовано лише прототип варіанта винищувача, цей літак залишився лише на папері й ніколи не вироблявся."
 BEL_cv_CAS_equipment_2: "Renard 37 B Aéronaval"
 BEL_cv_CAS_equipment_2_short: "R-37 B AN"

 BEL_fighter_equipment_0: "Fairey Fox"
 BEL_fighter_equipment_0_short: "Fox"
 BEL_fighter_equipment_1: "Fairey Fantôme"
 BEL_fighter_equipment_1_short: "Fantôme"
 BEL_fighter_equipment_2: "Renard 38"
 BEL_fighter_equipment_2_short: "R-38"
 BEL_fighter_equipment_2_desc: "Доопрацьована версія прототипу R-36, катастрофа якого призвела до анулювання контракту з бельгійською армією."
 BEL_cv_fighter_equipment_2: "Renard 38 Aéronaval"
 BEL_cv_fighter_equipment_2_short: "R-38 AN"

 BEL_nav_bomber_equipment_1: "Flugzeugbau Friedrichshafen Ff 195"
 BEL_nav_bomber_equipment_1_short: "Ff 195"
 BEL_nav_bomber_equipment_2: "Renard 37 Défense Côtière"
 BEL_nav_bomber_equipment_2_short: "R-37 DC"
 BEL_cv_nav_bomber_equipment_2: "Renard 37 Aéronaval"
 BEL_cv_nav_bomber_equipment_2_short: "R-37 DC AN"
 BEL_nav_bomber_equipment_2_desc: "Перша модифікація прототипу R36 — літак Renard 37 — існував лише на папері. Проте серед креслень був присутній варіант «défense côтиère» (берегова оборона)."
 BEL_nav_bomber_equipment_3: "Hansa-Brandenburg Hb 115"
 BEL_nav_bomber_equipment_3_short: "Hb 115"

 BEL_heavy_fighter_equipment_1: "Bayerische Flugzeugwerke Bf 110"
 BEL_heavy_fighter_equipment_1_short: "Bf 110"
 BEL_heavy_fighter_equipment_2: "Caproni Ca.331"
 BEL_heavy_fighter_equipment_2_short: "Ca.331"
 BEL_heavy_fighter_equipment_3: "Renard 42"
 BEL_heavy_fighter_equipment_3_short: "R-42"
 BEL_heavy_fighter_equipment_3_desc: "R-42 — спарений дальній варіант винищувача на базі R-36 та його наступників (R-38, R-40); ідея, яка пізніше була втілена в американському F-82 Twin Mustang. Через війну проєкт так і залишився лише в ескізах."

 BEL_tac_bomber_equipment_0: "LACAB GR.8"
 BEL_tac_bomber_equipment_0_short: "GR.8"
 BEL_tac_bomber_equipment_0_desc: "GR.8 на прізвисько «Doryphore» (тобто «Колорадський жук» через його вкрай посередні льотні якості) створювався як багатоцільовий літак для ВПС Бельгії. Покликаний бути водночас бомбардувальником, розвідником і важким винищувачем, він дослівно виконував безглузді вимоги бельгійської армії... і в результаті виявився однаково поганим у кожній із цих ролей."
 BEL_tac_bomber_equipment_1: "SABCA S.45"
 BEL_tac_bomber_equipment_1_short: "SABCA S.45"
 BEL_tac_bomber_equipment_1_desc: "SABCA S.45 — це ліцензійна копія Caproni Ca.135, створена з метою розширити виробництво літаків понад обмежені можливості самої Італії. Маючи такий досвід у бомбардувальній авіації, бельгійці могли б легко налагодити випуск більшої кількості цих машин для власних потреб, але так цього й не зробили."
 BEL_tac_bomber_equipment_2: "Renard R.35B"
 BEL_tac_bomber_equipment_2_short: "R.35B"

 BEL_strat_bomber_equipment_1: "Dornier Do 19"
 BEL_strat_bomber_equipment_1_short: "Do 19"
 BEL_strat_bomber_equipment_2: "Hansa-Brandenburg Hb 177"
 BEL_strat_bomber_equipment_2_short: "Hb 177"

 BEL_scout_plane_equipment_1: "Renard R.32"
 BEL_scout_plane_equipment_1_short: "R.32"
 BEL_scout_plane_equipment_2: "Caproni Ca.311"
 BEL_scout_plane_equipment_2_short: "Ca.311"

