 SIA_fighter_equipment_0_desc: "«Прачадіпок», також відомий як винищувач Type 5, був одномісним винищувачем і другим літаком власної сіамської розробки. У 1929 році підполковник Луанг Нераміт Байчайонта спроєктував цей літак, названий «Прачадіпок» на честь Його Величності короля Прачадіпока (Рами VII). Це був другий літак, спроєктований і збудований у Сіамі, та перший сіамський винищувач власної розробки, нині відомий як винищувач Type 5."
