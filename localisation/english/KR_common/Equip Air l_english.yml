 BUL_jet_fighter_equipment_1_short: "DAR 14"

 BUL_nav_bomber_equipment_1: "Flugzeugbau Friedrichshafen Ff 195"
 BUL_nav_bomber_equipment_1_short: "Ff 195"
 BUL_nav_bomber_equipment_2: "KB-11 «Фазан»"
 BUL_nav_bomber_equipment_2_short: "KB-11"
 BUL_nav_bomber_equipment_2_desc: "Спочатку призначений для ведення розвідки та легких штурмових ударів, KB-11 був перепрофільований на морський патрульний літак."

 BUL_heavy_fighter_equipment_1: "Bayerische Flugzeugwerke Bf 110"
 BUL_heavy_fighter_equipment_1_short: "Bf 110"
 BUL_heavy_fighter_equipment_2: "Junkers Ju 88"
 BUL_heavy_fighter_equipment_2_short: "Ju 88"
 BUL_heavy_fighter_equipment_3: "Hansa-Brandenburg Hb 219"
 BUL_heavy_fighter_equipment_3_short: "Hb 219"

 BUL_tac_bomber_equipment_0: "Junkers Ju 86"
 BUL_tac_bomber_equipment_0_short: "Ju 86"
 BUL_tac_bomber_equipment_1: "Архангельський Ар-2"
 BUL_tac_bomber_equipment_1_short: "Ар-2"
 BUL_tac_bomber_equipment_1_desc: "Будучи невдоволеною австрійськими та німецькими проєктами бомбардувальників через їхню високу ціну, Болгарія звернула погляд далі. Для закриття потреби в середніх бомбардувальниках було узгоджено ліцензійне виробництво Ар-2 конструкції Архангельського за ліцензією Російської Республіки."
 BUL_tac_bomber_equipment_2: "Єрмолаєв Єр-2"
 BUL_tac_bomber_equipment_2_short: "Єр-2"
 BUL_tac_bomber_equipment_3: "Туполєв Ту-10"
 BUL_tac_bomber_equipment_3_short: "Ту-10"

 BUL_strat_bomber_equipment_1: "Avia-Dornier Do.19"
 BUL_strat_bomber_equipment_1_short: "Do.19"
 BUL_strat_bomber_equipment_1_desc: "Не маючи власних проєктів стратегічних бомбардувальників, Avia придбала низку чотиримоторних бомбардувальників Dornier, аби продемонструвати їхній потенціал військово-повітряним силам. Пізніше ліцензію на цей проєкт було передано Болгарії."
 BUL_strat_bomber_equipment_2: "Bloch MB.165"
 BUL_strat_bomber_equipment_2_short: "MB.165"
 BUL_strat_bomber_equipment_2_desc: "Будучи невдоволеною австрійськими та німецькими проєктами бомбардувальників через їхню високу ціну, Болгарія звернула погляд далі. Для закриття потреби у важких бомбардувальниках вона домовилася про виробництво Bloch MB.165 за французькою ліцензією."
 BUL_strat_bomber_equipment_3: "Bloch MB.175"
 BUL_strat_bomber_equipment_3_short: "MB.175"

 BUL_scout_plane_equipment_1: "KB-5 «Чучуліга» III"
 BUL_scout_plane_equipment_1_short: "KB-5"
 BUL_scout_plane_equipment_2: "KB-6 «Папагал»"
 BUL_scout_plane_equipment_2_short: "KB-6"
 BUL_scout_plane_equipment_2_desc: "Щоб задовольнити вимоги болгарських ВПС щодо нового літака дальньої розвідки із закритою кабіною, болгарська філія компанії Caproni внесла кілька важливих змін у свій успішний літак 309 «Ghibli», розроблений кількома роками раніше."

