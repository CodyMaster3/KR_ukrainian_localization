### AUS - Austria ###
###

 AUS_CAS_equipment_1: "Aero Vodochody A.101"
 AUS_CAS_equipment_1_short: "A.101"
 AUS_CAS_equipment_1_desc: "Не маючи сучасних штурмовиків, Дуалістична монархія спробувала переобладнати наявні моделі під цю роль. A.101 став результатом кількох спроб модернізувати біплан A.230 для виконання таких завдань. Суттєво більший і краще озброєний за своїх попередників, A.101 здатний як штурмувати наземні цілі, так і здійснювати бомбометання нарівні з будь-якими своїми сучасниками."
 AUS_CAS_equipment_2: "Weiss Manfréd WM.231"
 AUS_CAS_equipment_2_short: "WM.231"
 AUS_CAS_equipment_2_desc: "Компанія Weiss Manfréd представила винищувач WM.23 для конкуренції з проєктом Avia. Хоча кулемети Гебауера з моторним приводом, встановлені в капоті, справили враження на комітет, натомість було обрано B.135. У відповідь Weiss Manfréd дещо переробила конструкцію і повторно подала її вже як пікіруючий бомбардувальник, покликаний доповнити застарілий парк біпланів A.101."
 AUS_CAS_equipment_3: "Weiss Manfréd WM.44"
 AUS_CAS_equipment_3_short: "WM.44"
 AUS_CAS_equipment_3_desc: "Спроєктований Ласло Варгою, він був фактично зменшеною двомісною версією серії важких винищувачів і швидкісних бомбардувальників WM.31. Як і його попередник, літак виготовлявся з дерева та металу для покращення льотних характеристик. Він виявився цілком придатним, хоч і легкоброньованим, для завдань безпосередньої авіаційної підтримки."

 AUS_fighter_equipment_0: "Phönix D.V"
 AUS_fighter_equipment_0_short: "D.V"
 AUS_fighter_equipment_0_desc: "Із завершенням Світової війни запланована компанією Phönix модернізація свого відомого біплана D.III з очікуваним позначенням «D.IV» так і не відбулася. Проте в 1931 році компанія відродила назву D.IV, представивши абсолютно новий біплан із передовими на той час характеристиками. Модернізований варіант літака з позначенням D.V був прийнятий на озброєння Дуалістичною монархією в 1933 році."
 AUS_fighter_equipment_1: "Avia B.534"
 AUS_fighter_equipment_1_short: "B.534"
 AUS_fighter_equipment_1_desc: "У 1932 році відомий богемський інженер Франтішек Новотний розпочав співпрацю з компанією Avia над новим суцільнометалевим біпланом. Ці зусилля увінчалися створенням B-34, який майже був прийнятий на озброєння Дуалістичною монархією замість Phönix. Не втрачаючи надії, Новотний переробив B-34, встановивши новий двигун і шасі, а також повністю закриту кабіну. На відміну від попередника, цю модель, B-534, Дуалістична монархія все ж прийняла на озброєння."
 AUS_fighter_equipment_2: "Avia B.135"
 AUS_fighter_equipment_2_short: "B.135"
 AUS_fighter_equipment_2_desc: "Після успіху біплана B-534 компанія Avia незабаром розпочала роботу над надсучасним монопланом, яким зрештою став B-135. Він використовував 860-сильний двигун Austro-Daimler V12D і був оснащений 20-мм автоматичною гарматою в носовій частині та двома синхронізованими 8-мм кулеметами в капоті, що забезпечувало йому чудову маневреність і високу точність вогню."
 AUS_fighter_equipment_3: "Avia-Ikarus B.224"
 AUS_fighter_equipment_3_short: "B.224"
 AUS_fighter_equipment_3_desc: "Фактично остання еволюція конструкції Новотного, створена за участі Кости Сивчева та іллірійської компанії Ikarus. Двигун B.224 було замінено на чудовий 1000-сильний Austro-Daimler V12E, а кулемети — на два 12,7-мм великокаліберні кулемети Гебауера з моторним приводом, що збільшило швидкість і вогневу міць літака порівняно з попередником. Примітними рисами є новий краплеподібний ліхтар кабіни та витончений фюзеляж."
 AUS_jet_fighter_equipment_1: "Avia Bf.262"
 AUS_jet_fighter_equipment_1_short: "Bf.262"
 AUS_jet_fighter_equipment_1_desc: "Відстаючи у розробці реактивних винищувачів, Avia придбала ліцензію на виробництво Bf 262 для Авіаційного корпусу (Fliegerkorps), замінивши у своїй дещо зміненій конструкції німецькі 30-мм гармати на гармати калібру 20 мм місцевого виробництва."
 AUS_jet_fighter_equipment_2: "Letov L.52"
 AUS_small_plane_airframe_5: "Letov L.52"
 AUS_jet_fighter_equipment_2_short: "L.52"
 AUS_small_plane_airframe_5_short: "L.52"
 AUS_jet_fighter_equipment_2_desc: "Коли Austro-Daimler розробила двигун U2 «Uzelac», Letov створила ультрасучасний реактивний винищувач, який став першим власним реактивним літаком Монархії, прийнятим на озброєння."

 AUS_nav_bomber_equipment_1: "Letov Š.328.v"
 AUS_nav_bomber_equipment_1_short: "Š.328.v"
 AUS_nav_bomber_equipment_1_desc: "Š.328.v був поплавковим гідролітаком — модифікацією серії Š.28. Він озброювався двома курсовими 8-мм кулеметами та ще двома на турелі в задній частині, а корисне навантаження становило близько 500 кг."
 AUS_nav_bomber_equipment_2: "Lohner-Fokker T.VIII W/C"
 AUS_nav_bomber_equipment_2_short: "T.VIII W/C"
 AUS_nav_bomber_equipment_2_desc: "Компанія Lohner, яка раніше під час війни виготовляла гідролітаки та літаючі човни для Імператорсько-королівського морського авіаційного корпусу (k.u.k. Seefliegerkorps), придбала права на виробництво Fokker T.VIII для Австро-Угорського флоту."
 AUS_nav_bomber_equipment_3: "Weiss Manfréd WM.442"
 AUS_nav_bomber_equipment_3_short: "WM.442"
 AUS_nav_bomber_equipment_3_desc: "WM.442 — це поплавковий варіант WM.44, створений для Морського авіаційного корпусу (Seefliegerkorps) і призначений для протикорабельних операцій в Адріатичному та Середземному морях."

 AUS_heavy_fighter_equipment_1: "Praga E.51"
 AUS_heavy_fighter_equipment_1_short: "E.51"
 AUS_heavy_fighter_equipment_1_desc: "Спочатку розроблений як розвідувальний літак, E.51 невдовзі був визнаний цілком придатним для швидкої адаптації під важкий винищувач для протидії стратегічним бомбардувальникам."
 AUS_heavy_fighter_equipment_2: "Weiss Manfréd WM.31"
 AUS_heavy_fighter_equipment_2_short: "WM.31"
 AUS_heavy_fighter_equipment_2_desc: "Угорський авіаконструктор Ласло Варга спроєктував цей тримісний винищувач під експериментальні газотурбінні двигуни. Проте через технічні труднощі з двигунами їх замінили на два Austro-Daimler V12D. Примітно, що WM.31 мав змішану конструкцію."
 AUS_heavy_fighter_equipment_3: "Weiss Manfréd WM.50"
 AUS_heavy_fighter_equipment_3_short: "WM.50"
 AUS_heavy_fighter_equipment_3_desc: "WM.50 вирізнявся досить передовою для свого часу конструкцією: дводвигунний літак Ласло Варги з двобалковою схемою та конфігурацією «тягни-штовхай» був покликаний суттєво покращити характеристики двомоторних винищувачів для боротьби з високогірними бомбардувальниками."

 AUS_tac_bomber_equipment_0: "Avia F.39"
 AUS_tac_bomber_equipment_0_short: "F.39"
 AUS_tac_bomber_equipment_0_desc: "Спочатку розроблений компанією Fokker як транспортний літак F.IX, цей борт швидко привернув увагу компанії Avia своїм військовим потенціалом. Отримавши ліцензію на виробництво, Avia переробила F.IX на бомбардувальник F.39. Дуалістична монархія, відчуваючи нестачу бомбардувальників, прийняла F.39 як тимчасове рішення, поки розроблялися нові моделі."
 AUS_tac_bomber_equipment_1: "Letov Š-50"
 AUS_tac_bomber_equipment_1_short: "Š-50"
 AUS_tac_bomber_equipment_1_desc: "Прагнучи задовольнити запит Авіаційного корпусу на багатоцільовий дводвигунний літак з екіпажем із трьох осіб, Letov представила Š-50. Однак проєкт не викликав зацікавлення і так і не пішов у серію; натомість зрештою було обрано розробку компанії Aero."
 AUS_tac_bomber_equipment_2: "Aero Vodochody A.300"
 AUS_tac_bomber_equipment_2_short: "A.300"
 AUS_tac_bomber_equipment_2_desc: "Цей бомбардувальник конструкції Антоніна Гусніка на момент надходження на озброєння був одним із найшвидших літаків у строю, поступаючись лише щойно прийнятому винищувачу B.135. Швидкий та з хорошим корисним навантаженням, він зарекомендував себе як універсальний бомбардувальник і розвідник."
 AUS_tac_bomber_equipment_3: "Weiss Manfréd WM.311"
 AUS_tac_bomber_equipment_3_short: "WM.311"
 AUS_tac_bomber_equipment_3_desc: "WM.31 швидко адаптували під роль швидкісного тактичного бомбардувальника, послабивши наступальне озброєння та збільшивши корисне бомбове навантаження."
 AUS_jet_tac_bomber_equipment_1: "Letov L.11"
 AUS_jet_tac_bomber_equipment_1_short: "L.11"
 AUS_jet_tac_bomber_equipment_1_desc: "Створений на основі проєкту реактивного винищувача від Bayerische Flugzeugwerke, L.11 був перероблений на швидкісний легкий багатоцільовий реактивний бомбардувальник, покликаний замінити застарілий парк поршневих тактичних бомбардувальників Монархії."
 AUS_jet_tac_bomber_equipment_2: "Aero L.44"
 AUS_jet_tac_bomber_equipment_2_short: "L.44"
 AUS_jet_tac_bomber_equipment_2_desc: "Зі зростанням надійності реактивних двигунів та загостренням конкуренції компанія Aero взялася за розробку швидкісного бомбардувальника нового покоління, підсумком чого став проєкт L.44."

 AUS_strat_bomber_equipment_1: "Avia-Dornier Do.19"
 AUS_strat_bomber_equipment_1_short: "Do.19"
 AUS_strat_bomber_equipment_1_desc: "Не маючи власних розробок стратегічних бомбардувальників, Avia закупила партію чотиримоторних бомбардувальників Dornier, аби продемонструвати їхній потенціал військово-повітряним силам."
 AUS_strat_bomber_equipment_2: "Avia-Junkers Ju.290"
 AUS_strat_bomber_equipment_2_short: "Ju.290"
 AUS_strat_bomber_equipment_2_desc: "Avia придбала низку Ju.290 для поповнення невеликого наявного парку Do.19."
 AUS_strat_bomber_equipment_3: "Weiss Manfréd WM.65"
 AUS_strat_bomber_equipment_3_short: "WM.65"
 AUS_strat_bomber_equipment_3_desc: "Проєкт чотиримоторного бомбардувальника Ласло Варги став першим важким бомбардувальником власного виробництва в Імперії."
 AUS_jet_strat_bomber_equipment_1: "Aero-Flugzeugbau Friedrichshafen FF.16"
 AUS_jet_strat_bomber_equipment_1_short: "FF.16"
 AUS_jet_strat_bomber_equipment_1_desc: "Німецький Flugzeugbau Friedrichshafen FF.16 був прийнятий як австрійський дальній бомбардувальник із локалізацією виробництва на заводах Aero Vodochody."

