### SCA - Scandinavia ###
###

 SCA_fighter_equipment_0: "Svenska Aero J 6 Jaktfalken"
 SCA_fighter_equipment_0_short: "J 6 Jaktfalken"
 SCA_fighter_equipment_0_desc: "Старий винищувач-біплан міжвоєнного періоду, збудований спочатку компанією Svenska Aero у 20-х роках, а згодом — AB Svenska Järnvägsverkstädernas Aeroplanavdelning, що використовувався по всій Скандинавії. Попри ефективність у патрульних і розвідувальних місіях, його час у наших ВПС уже минув, і він більше не відповідає вимогам сучасної повітряної війни."
 SCA_fighter_equipment_1: "Seversky EP-106 J 9"
 SCA_fighter_equipment_1_short: "J 9"
 SCA_fighter_equipment_1_desc: "Винищувач американського виробництва від компанії Seversky. Військова авіація США віддала перевагу його конкуренту — P-36 від Curtiss, проте ця машина надійна та ідеально відповідає нашим потребам для виконання завдань у небі Скандинавії. Після переговорів Seversky продала нам креслення та права на виробництво, що дозволило налагодити його випуск."
 SCA_fighter_equipment_2: "FFVS J 22"
 SCA_fighter_equipment_2_short: "J 22"
 SCA_fighter_equipment_2_desc: "J 22, розроблений Управлінням королівської авіації в Стокгольмі (FFVS), є нашим першим монопланом власної розробки. Високо оцінений пілотами за відмінну керованість, він також простий в обслуговуванні. Цей літак дозволить ефективно захистити Скандинавію від будь-яких загроз."
 SCA_fighter_equipment_3: "FFVS J 27"
 SCA_fighter_equipment_3_short: "J 27"
 SCA_fighter_equipment_3_desc: "Повітряна війна зазнала значних змін під час Другої світової війни: через запеклі бої над Балтикою безліч іноземних літаків не змогли повернутися на бази або розбилися на нашому узбережжі. Після захоплення (чи вилучення уламків найбільш невдалих екземплярів) наші технічні підрозділи ретельно вивчили ці новітні машини. Оскільки J 21 не відповідав вимогам до ефективного винищувача, ці дослідження привели до появи J 27 — сучасного літака, натхненного німецькими та американськими напрацюваннями, а найбільше — британським Supermarine «Spitfire». Потужний двигун, висока маневреність, співвісні гвинти протилежного обертання та грізне озброєння... наш «Північний супер-спітфайр» стане кошмаром для будь-якої країни, яка наважиться на нас напасти!"
 SCA_jet_fighter_equipment_1: "Kjeller-SAAB J 21R"
 SCA_jet_fighter_equipment_1_short: "J 21R"
 SCA_jet_fighter_equipment_1_desc: "Після років досліджень і розробок ми нарешті створили реактивний винищувач. Поршневий J 21 справді не показав себе видатним винищувачем, але став надійною та міцною платформою. Отримавши реактивний двигун і 20-мм гармати, J 21R здатен повноцінно захищати наше небо від повітряних загроз прийдешніх років. Час гвинтів минув — настав час реактивної авіації."
 SCA_jet_fighter_equipment_2: "Kjeller-SAAB 29 Tunnan"
 SCA_small_plane_airframe_5: "Kjeller-SAAB 29 Tunnan"
 SCA_jet_fighter_equipment_2_short: "Kjeller-SAAB 29"
 SCA_small_plane_airframe_5_short: "Kjeller-SAAB 29"
 SCA_jet_fighter_equipment_2_desc: "Після успіху J 21R настав час збудувати новий реактивний винищувач із власним планером, а не перероблений зі старої машини. J 29 став вершиною нашої авіапромисловості: він оснащений передовим радаром, збільшеними паливними баками, ракетами класу «повітря — повітря» та розвиває високу швидкість. Якщо ми продовжуватимемо будувати такі машини, як «Туннан», майбутнє скандинавського неба буде в безпеці."

 SCA_cv_fighter_equipment_0: "Svenska Aero J 6HS Jaktfalken"
 SCA_cv_fighter_equipment_0_short: "J 6HS Jaktfalken"
 SCA_cv_fighter_equipment_1: "Seversky EP-106 J 9HS"
 SCA_cv_fighter_equipment_1_short: "J 9HS"
 SCA_cv_fighter_equipment_2: "FFVS J 22HS"
 SCA_cv_fighter_equipment_2_short: "J 22HS"
 SCA_cv_fighter_equipment_3: "Kjeller-SAAB J 25HS"
 SCA_cv_fighter_equipment_3_short: "J 25HS"
 SCA_cv_fighter_equipment_3_desc: "Дослідний планер. Попри чудові результати J 25HS на випробуваннях, було виготовлено лише кілька екземплярів до того, як йому на зміну прийшов FFVS J 27."

 SCA_CAS_equipment_1: "SAI KZ IIA"
 SCA_CAS_equipment_1_short: "KZ IIA"
 SCA_CAS_equipment_1_desc: "Уже за кілька місяців після свого заснування компанія SAI (Skandinavisk Aero Industri), створена двома технічно обізнаними авіаентузіастами, випустила два різні спортивні літаки. Їхня друга модель привернула увагу данських військових, які зрештою уклали контракт на виробництво штурмової модифікації цього літака."
 SCA_CAS_equipment_2: "SAAB B 17"
 SCA_CAS_equipment_2_short: "B 17"
 SCA_CAS_equipment_2_desc: "Вивчивши новітні штурмові літаки провідних європейських держав, ми успішно створили власну машину, здатну ефективно підтримувати сухопутні війська з повітря. Розроблений фірмою SAAB літак B 17 має високу тягооснащеність, несе солідний бомбовий запас і здатен виконувати бомбометання з пікірування. Його модульне шасі також дозволяє встановлювати лижі або поплавки."
 SCA_CAS_equipment_3: "Kjeller-SAAB A 21"
 SCA_CAS_equipment_3_short: "A 21"
 SCA_CAS_equipment_3_desc: "Saab A 21 спочатку створювався як винищувач під назвою J 21, однак для цієї ролі його льотні характеристики виявилися недостатніми. Попри це, конструкторське бюро Saab зрозуміло, що його планер стане чудовою платформою для штурмовика. Унікальна схема зі штовхальним гвинтом, потужний двигун і багатий вибір озброєння зробили його грізним літаком безпосередньої підтримки."

 SCA_cv_CAS_equipment_1: "SAI KZ IIA-HS"
 SCA_cv_CAS_equipment_1_short: "KZ IIA-HS"
 SCA_cv_CAS_equipment_2: "SAAB B 17HS"
 SCA_cv_CAS_equipment_2_short: "B 17HS"
 SCA_cv_CAS_equipment_3: "Kjeller-SAAB A 21HS"
 SCA_cv_CAS_equipment_3_short: "A 21HS"

 SCA_nav_bomber_equipment_1: "Hansa-Brandenburg S 12"
 SCA_nav_bomber_equipment_1_short: "S 12"
 SCA_nav_bomber_equipment_2: "SAAB T 17S"
 SCA_nav_bomber_equipment_2_short: "T 17S"
 SCA_nav_bomber_equipment_2_desc: "Морська модифікація літака B 17 розробки Saab. Модульне шасі повністю замінили на поплавки, а хвостову частину вдосконалили для кращої керованості на воді. Це ідеальна машина для морського патрулювання чи ударів по кораблях, яку також можна використовувати як розвідувальний гідролітак для нашого флоту."
 SCA_nav_bomber_equipment_3: "Kjeller-SAAB T 18"
 SCA_nav_bomber_equipment_3_short: "T 18"

 SCA_cv_nav_bomber_equipment_1: "Svenska Aero T/J 6HS Jaktfalken"
 SCA_cv_nav_bomber_equipment_1_short: "T/J 6HS Jaktfalken"
 SCA_cv_nav_bomber_equipment_1_desc: "Старий планер біплана переробили під несення авіаційних торпед — скоріше для перевірки концепції для майбутніх розробок, ніж для масової серії, адже низька швидкість робить його легкою мішенню в реальному бою. Цей проєкт заклав основу для подальшого розвитку шведських морських торпедоносців."
 SCA_cv_nav_bomber_equipment_2: "FFVS T 22HS"
 SCA_cv_nav_bomber_equipment_2_short: "T 22HS"
 SCA_cv_nav_bomber_equipment_2_desc: "Модифікація винищувача J 22HS, адаптована для застосування авіаційних торпед. Завдяки простоті в обслуговуванні літак ідеально підходить для корабельного базування як перша лінія оборони в разі виявлення ворожого флоту."
 SCA_cv_nav_bomber_equipment_3: "Kjeller-SAAB SB 21HS"
 SCA_cv_nav_bomber_equipment_3_short: "SB 21HS"
 SCA_cv_nav_bomber_equipment_3_desc: "Цей поршневий літак став першим і останнім, створеним спеціально як торпедоносець, оскільки невдовзі скандинавські виробники повністю перейшли на виробництво реактивних машин."

 SCA_heavy_fighter_equipment_1: "SAAB J 19"
 SCA_heavy_fighter_equipment_1_short: "J 19"
 SCA_heavy_fighter_equipment_1_desc: "Наші винищувачі J 6 та J 9 мають суттєві обмеження щодо дальності польоту. У разі війни вони не зможуть супроводжувати наші бомбардувальники або перехоплювати ворожі літаки на далеких відстанях і великих висотах. Ми були змушені розробити новий літак, яким став J 19. Оснащений додатковими паливними баками та 20-мм гарматами, він здатен дістати ворога навіть на значному віддаленні."
 SCA_heavy_fighter_equipment_2: "SAAB J 23"
 SCA_heavy_fighter_equipment_2_short: "J 23"
 SCA_heavy_fighter_equipment_2_desc: "Після успіху J 19 постала потреба покращити його конструкцію та характеристики. J 23, натхненний розробками сусідніх держав, підвищує боєздатність наших ВПС. Радара літак іще не має, проте відпала потреба в підвісних баках. Це надійне рішення для захисту нашого нейтралітету та контролю повітряного простору над Балтійським морем."
 SCA_heavy_fighter_equipment_3: "SAAB J 24"
 SCA_heavy_fighter_equipment_3_short: "J 24"
 SCA_heavy_fighter_equipment_3_desc: "Важчий, більший і міцніший Saab J 24 — перехоплювач останнього покоління. Два потужні двигуни, важке озброєння, герметична кабіна, сучасний радар і місткі баки дозволяють йому виконувати перехоплення навіть у найсуворіших погодних умовах, хай де ховатиметься ворог. Це найкращий літак такого типу, який ми коли-небудь будували."

