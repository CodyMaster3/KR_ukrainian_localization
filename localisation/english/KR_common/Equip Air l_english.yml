 SUR_fighter_equipment_0: "Fokker D.XVII"
 SUR_fighter_equipment_0_short: "D.XVII"
 SUR_fighter_equipment_1: "Fokker D.XXI"
 SUR_fighter_equipment_1_short: "D.XXI"
 SUR_fighter_equipment_1_desc: "Fokker D.XXI був одномісним винищувачем-монопланом із низьким розташуванням крила. Він був спроєктований у 1935 році компанією Fokker відповідно до вимог Військової авіації Королівської нідерландської ост-індської армії.\nОсновне озброєння складалося з двох пар 7,92-мм кулеметів M36 FN-Browning: двох у крилах і ще однієї пари в носовій частині фюзеляжу, що вимагало стрільби крізь площину обертання пропелера. Фюзеляжні кулемети мали боєкомплект по 500 набоїв кожний, тоді як крильові — по 300 набоїв."
 SUR_fighter_equipment_2: "Koolhoven F.K.58"
 SUR_fighter_equipment_2_short: "F.K. 58"
 SUR_fighter_equipment_2_desc: "Koolhoven F.K.58 був одномоторним винищувачем-перехоплювачем, спроєктованим і виготовленим компанією N.V. Koolhoven.\nЙого озброєння складалося з 4 кулеметів калібру 7,5 мм. Літак мав шасі, що прибиралося, й оснащувався потужнішим 1080-сильним двигуном, який дозволяв розвивати швидкість до 505 км/год за практичної дальності польоту в 750 км."
 SUR_fighter_equipment_3: "De Schelde S.21"
 SUR_fighter_equipment_3_short: "S.21"
 SUR_fighter_equipment_3_desc: "De Schelde S.21 був одномісним одномоторним монопланом зі штовхальним гвинтом, спроєктованим компанією Koninklijke de Schelde N.V.\nS.21 мав суцільнометалеву конструкцію, крило типу «зворотне чайчине крило» та хвостове оперення на двох балках. У компактній гондолі фюзеляжу розміщувалися пілот, двигун та озброєння літака.\nОзброєння складалося з однієї 23-мм гармати Madsen на рухомій установці в носовій частині та чотирьох 7,9-мм кулеметів FN-Browning з боків гондоли."
