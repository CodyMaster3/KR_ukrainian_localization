 SIA_tac_bomber_equipment_0_desc: "«Боріпатра» (також пишеться як «Боріпхат» і «Парібатра»), або бомбардувальник Type 2, був двомісним легким бомбардувальником 1920-х років, спроєктованим і побудованим авіаційними майстернями Королівських сіамських ВПС. Невелика кількість машин була виготовлена для сіамської авіації, ставши першим літаком власної сіамської розробки."
