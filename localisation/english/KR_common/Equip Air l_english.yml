 RUS_iw_small_airframe: "Планер біплана"
 RUS_iw_small_airframe_desc: "Біплани вважаються стійкими та маневреними літаками з обмеженою швидкістю. З-поміж різноманітних військових біпланів, випущених у Росії, І-15 є найуспішнішим і легендарним. І-15 та його модифікації вирізняються швидкістю, стійкістю та розроблені для взаємодії як ведений літак із досконалішим І-16. Хоча більшість біпланів у 1936 році вже починають застарівати на тлі стрімких авіаційних інновацій, вони все ще утворюють надійний кістяк Російського повітряного флоту."
 RUS_basic_small_airframe: "Планер моноплана"
 RUS_basic_small_airframe_desc: "Моноплани, яких вважали майбутнім авіабудування, революціонізували стандарти швидкості. Серед перших повноцінних монопланів найвизначнішою моделлю є І-16, що швидко став легендарним серед пілотів завдяки своїй ризикованій, але винятковій маневреності: аси володіли І-16 як найсмертоноснішою зброєю, проте для ненавченого льотчика єдина помилка могла перетворити літак на літаючу труну.\n\nПоки Повітряний флот зосереджує зусилля на винищувачах, на вимогу армії розробляються перші повноцінні бомбардувальники безпосередньої підтримки військ — багатоцільовий ББ став першим експериментом російських ВПС зі створення літака, здатного показати себе в усіх ролях: винищувача, бомбардувальника та розвідника."
 RUS_improved_small_airframe: "Швидкісний планер"
 RUS_improved_small_airframe_desc: "З наближенням війни військово-повітряні сили запустили програму розробки швидкісної авіації. Ця програма закріпила підприємства «Скорость», «Сокол» та «Дукс» як головних виробників винищувачів, кожне з яких мало власний підхід: «Скорость» намагається поєднати цивільну якість із військовими стандартами, «Дукс» проєктує літаки з упором на швидкість і важке озброєння, а «Сокол» робить ставку на масове виробництво.\n\nВодночас армія зосередила свої вимоги на броньованій штурмовій авіації, завдяки чому на світ з'явилися легендарні броньовані штурмовики БШ-2 та БШ-6."
 RUS_advanced_small_airframe: "Суцільнометалевий планер"
 RUS_advanced_small_airframe_desc: "Спираючись на фронтовий досвід боротьби проти ворожих літаків різних типів, російські авіаконструктори з фірм «Скорость» та «Сікорський» зосередили зусилля на стандартизації, оптимізації та усуненні недоліків наявних машин, відмовившись від неперевірених нових схем. Дерев'яні літаки відійшли в минуле, а кожен елемент і маса конструкції ретельно випробовувалися та полегшувалися. Кожен із нових літаків мав стати не просто покращеною версією попередника, а фактично цілком новою машиною, доведеною до досконалості майже в усіх аспектах."
 RUS_modern_small_airframe: "«Реактивний винищувач»"
 RUS_modern_small_airframe_desc: "Першопрохідцем у створенні перших російських реактивних літаків стало підприємство «Скорость», яке зуміло випередити «Сокол» завдяки вдалій переробці винищувача І-30 на реактивну тягу. Хоча і «Сокол», і «Скорость» є основними постачальниками реактивної авіації для Російського повітряного флоту, літаки фірми «Скорость» вирізняються вищою надійністю через помірніші темпи розробки та запозичення ідей інших компаній, тоді як «Сокол» частіше дивує несподіваними проривами завдяки своїм революційним проєктам."

 RUS_iw_medium_airframe: "Багатоцільовий планер"
 RUS_medium_plane_airframe_0_desc: "Російський розвідник Р-6 розробки ЦАГІ початку 1930-х років є розвідувальним літаком із функціями винищувача, який завдяки бомбовому навантаженню в 500 кг може слугувати легким бомбардувальником. Концептуально це «літаючий крейсер» — крилатий еквівалент багатоцільового бойового корабля: великий, неповороткий і без чіткої спеціалізації. Із надходженням у серію більш спеціалізованих літаків універсальні розвідники почали переводити на транспортну службу."
 RUS_basic_medium_airframe: "Спеціалізований середній бомбардувальник"
 RUS_medium_plane_airframe_1_desc: "Зі стрімким розвитком авіаційних технологій потреба у спеціалізованих машинах стала очевидною. У 1934 році Російський повітряний флот замовив розробку двох профільних бомбардувальників: СБ — бойовий літак розробки ЦАГІ ближнього радіуса дії, та далекобійний бомбардувальник ДБ-3 від «Осоавіа». Саме вони забезпечують основу ударної авіаційної підтримки Росії. Роль середніх бомбардувальників невпинно зростає — особливо для Росії з її колосальними операційними просторами."
 RUS_improved_medium_airframe: "Розробка СТО"
 RUS_medium_plane_airframe_2_desc: "Спеціальний технічний відділ (СТО) був тимчасово сформований військовим командуванням для створення ідеального літака фронтової підтримки. Підсумком цієї програми став багатоцільовий планер «100» розробки КБ «Гамаюн», відгалуженнями якого стали фронтовий бомбардувальник ФБ-2 та важкий винищувач ТІС-3. Усі проєкти СТО отримали високу оцінку військового керівництва та пілотів, тоді як паралельно розвивалися нові спеціалізовані моделі: ДБ-3Ф від «Осоавіа» та СБ-2 від ЦАГІ."
 RUS_advanced_medium_airframe: "Важкий тактичний бомбардувальник"
 RUS_medium_plane_airframe_3_desc: "У ході війни середні бомбардувальники ставали дедалі руйнівнішими, нерідко несучи як ракетне, так і бомбове озброєння, що конкурувало з навантаженням ранніх стратегічних машин. Проте бойовий досвід показав слабкі місця попередніх проєктів: серія ДБ незручна в експлуатації, ПБ потребують більшого навантаження та покращеного захисту, ФБ вимагають потужніших двигунів, а ТІС страждають від численних недоліків. Усі ці машини мають значний потенціал за умови ретельного доопрацювання."
 RUS_modern_medium_airframe: "«Реактивний бомбардувальник»"
 RUS_medium_plane_airframe_4_desc: "Російські «реактивні бомбардувальники» — це арена безкінечного суперництва між КБ «Гамаюн» та ЦАГІ. Спочатку поступившись проєкту РФБ-2 від КБ «Гамаюн», ЦАГІ змогло повернути лідерство в розробці тактичних бомбардувальників завдяки своєму РФБ-4. Обидва розробники мають свої переваги та недоліки, продовжуючи дореактивні традиції: ЦАГІ розвиває наступників лінійки ФБ, тоді як «Гамаюн» дотримується концепції серії ДБ."

 RUS_iw_large_airframe: "«Літаючий крейсер»"
 RUS_large_plane_airframe_0_desc: "На початку 1930-х років панувало справжнє захоплення велетенськими «літаючими крейсерами», вінцем яких став 8-моторний бомбардувальник ТК із корисним навантаженням 12 000 кг (26 500 фунтів), збудований за особистої підтримки Савінкова у 1935 році. Утім, наймасовішим літаком цього типу в російській армії залишається бомбардувальник ТБ-3 — основа російської стратегічної авіації. Хоча на 1936 рік ці машини вже застаріли й загалом були доволі посередніми, вони стали першими масовими важкими бомбардувальниками Росії."
 RUS_basic_large_airframe: "Далекобійний планер"
 RUS_large_plane_airframe_1_desc: "Розвиток далекобійної бомбардувальної авіації привів до появи бомбардувальника ТБ-7, який прийшов на зміну застарілим «літаючим крейсерам». Це перший по-справжньому сучасний стратегічний бомбардувальник на службі Росії, що володіє значним корисним навантаженням і великим радіусом дії."
 RUS_improved_large_airframe: "Покращена серія ТБ"
 RUS_large_plane_airframe_2_desc: "Оскільки стратегічні бомбардувальники складні у виробництві, самого лише великого бомбового навантаження замало. Вони мають бути належним чином озброєні для відбиття атак значно дешевших винищувачів. З цією метою була розроблена серія ТБ-8, покликана виправити головні проблеми попередника ТБ-7. Літак отримав перероблену носову та хвостову частини разом із сучасними двигунами. Будучи менш досконалим стратегічним бомбардувальником, ніж запропонований Сікорським ДВБ, він значно простіший у виробництві, завдяки чому отримав схвалення військового командування."
 RUS_advanced_large_airframe: "Серія ДВБ"
 RUS_advanced_large_airframe_desc: "Пізній етап війни засвідчив, що звичайні важкі бомбардувальники не справляються зі своїм головним завданням — знищенням промислових об'єктів ворога — через обмежену дальність польоту та вразливість перед ППО. Результатом цього висновку стала серія ДВБ: тут відмовилися від спроб точкового ураження виключно «військових цілей». Ці літаки створювалися як висотні дальні бомбардувальники, невелика група яких здатна стерти з лиця землі ціле місто за один наліт."
 RUS_modern_large_airframe: "Серія РТБ"
 RUS_large_plane_airframe_4_desc: "ЦАГІ стало єдиним російським розробником, що спеціалізується на стратегічних бомбардувальниках, особливо після переходу Сікорського до розробки гелікоптерів. Серія РТБ від ЦАГІ — це тридвигунні машини з чудовими льотними даними та солідним корисним навантаженням для операцій у масштабах усього континенту, хоча їм бракує дальності для ефективних міжконтинентальних бомбардувань. Попри це, льотні характеристики серії РТБ є неперевершеними у своєму класі, а планер має значний потенціал для подальшої модернізації."

