 NFA_CAS_equipment_1: "ANF Les Mureaux 117 Renseignement, Bombardement, 2-place"
 NFA_CAS_equipment_1_short: "ANF 117 RB.2"
 NFA_CAS_equipment_1_desc: "Спроєктований Андре Брюне в межах лінійки ANF Les Mureaux 110, літак ANF 117 RB.2 є модифікацією ANF 115. Як маневрену машину сімейство ANF 110 французька армія прийняла на озброєння в 1932 році як літак-розвідник (ANF 113 R.2) і надалі постійно модернізувала. ANF 117 — це неозброєний одномоторний суцільнометалевий моноплан із фіксованим шасі, посиленим крилом із розчалками та дерев'яним гвинтом. На версії RB.2 встановлено вузли підвіски для бомб вагою до 400 кг, які можна використовувати для підтримки сухопутних військ."
 NFA_cv_CAS_equipment_1: "ANF Les Mureaux 117 Armée, Mer, Bombardement, 2-place"
 NFA_cv_CAS_equipment_1_short: "ANF 117 AMB.2"
 NFA_cv_CAS_equipment_1_desc: "Спроєктований Андре Брюне в межах лінійки ANF Les Mureaux 110, літак ANF 117 AMB.2 є палубною модифікацією ANF 115. Як маневрену машину сімейство ANF 110 французька армія прийняла на озброєння в 1932 році як літак-розвідник (ANF 113 R.2) і надалі постійно модернізувала. ANF 117 — це неозброєний одномоторний суцільнометалевий моноплан із фіксованим шасі, посиленим крилом із розчалками та дерев'яним гвинтом. На версії AMRB.2 встановлено вузли підвіски для бомб вагою до 400 кг, які можна використовувати для підтримки сухопутних військ."
 NFA_CAS_equipment_2: "Roussel R.30 Chasse, Armée, Protection, 1-place"
 NFA_CAS_equipment_2_short: "R.30 CAP.1"
 NFA_CAS_equipment_2_desc: "Спроєктований Жаком Русселем, R.30 — це дуже легкий і швидкий літак на основі концепції MB.150, проте зі зменшеними габаритами планера та встановленням менш потужного й легшого двигуна. Конфігурація CAP.1, яка є основним варіантом французьких збройних сил, озброєна двома 20-мм гарматами, несе 250 кг бомб і перевершує за швидкістю аналоги комунарів."
 NFA_cv_CAS_equipment_2: "Roussel R.30 Armée, Mer, Chasse, Protection, 1-place"
 NFA_cv_CAS_equipment_2_short: "R.30 AMCP.1"
 NFA_cv_CAS_equipment_2_desc: "Спроєктований Жаком Русселем, R.30 — це дуже легкий і швидкий літак на основі концепції MB.150, проте зі зменшеними габаритами планера та встановленням менш потужного й легшого двигуна. Конфігурація AMCP.1, яка є основним палубним варіантом французьких збройних сил, озброєна двома 20-мм гарматами, несе 250 кг бомб і перевершує за швидкістю аналоги комунарів."
 NFA_CAS_equipment_3: "Bloch MB.174 Armée, Bombardement, 3-place"
 NFA_CAS_equipment_3_short: "MB.174 AB.3"
 NFA_CAS_equipment_3_desc: "У 1936 році французький уряд сформулював вимоги до дво- або тримісного багатоцільового літака, здатного виконувати функції штурмовика чи розвідника. Компанія Bloch запропонувала MB.170 — дводвигунний вільнонесучий низькоплан. Варіант MB.174 є модифікацією MB.170 з новим двигуном, після випробувань якої французьке командування попросило переробити MB.174 на штурмовик. Версія AB.2 озброєна двома 7,5-мм гарматами та здатна нести 400 кг бомб."
 NFA_cv_CAS_equipment_3: "Bloch MB.174 Armée, Mer, Bombardement, 3-place"
 NFA_cv_CAS_equipment_3_short: "MB.174 AMB.3"
 NFA_cv_CAS_equipment_3_desc: "У 1936 році французький уряд сформулював вимоги до дво- або тримісного багатоцільового літака, здатного виконувати функції штурмовика чи розвідника. Компанія Bloch запропонувала MB.170 — дводвигунний вільнонесучий низькоплан. Варіант MB.174 є модифікацією MB.170 з новим двигуном, після випробувань якої французьке командування попросило переробити MB.174 на штурмовик. Палубна версія AMB.3 озброєна двома 7,5-мм гарматами та здатна нести 400 кг бомб."

 NFA_fighter_equipment_0: "Dewoitine D.510 Combat, 1-place"
 NFA_fighter_equipment_0_short: "D.510 C.1"
 NFA_fighter_equipment_0_desc: "Проєкт винищувача D.50bis з'явився в 1931 році на вимогу французької армії. Конструктор Еміль Девуатін, прагнучи досягти високої швидкості польоту, відійшов від традиційної схеми біплана на користь моноплана з доволі тонким низькорозташованим крилом. Прийнятий на озброєння в 1933 році літак D.500 через два роки модернізували, встановивши новий двигун і трилопатевий гвинт; він надійшов у війська під позначенням D.510, ставши першим французьким літаком, що подолав бар'єр у 400 км/год."
 NFA_cv_fighter_equipment_0: "Dewoitine D.510 Armée, Mer, Combat, 1-place"
 NFA_cv_fighter_equipment_0_short: "D.510 AMC.1"
 NFA_cv_fighter_equipment_0_desc: "Проєкт винищувача D.50bis з'явився в 1931 році на вимогу французької армії. Конструктор Еміль Девуатін, прагнучи досягти високої швидкості польоту, відійшов від традиційної схеми біплана на користь моноплана з доволі тонким низькорозташованим крилом. Прийнятий на озброєння в 1933 році літак D.500 через два роки модернізували, встановивши новий двигун і трилопатевий гвинт; він надійшов у війська під позначенням D.510, ставши першим французьким літаком, що подолав бар'єр у 400 км/год."
 NFA_fighter_equipment_1: "Bloch MB.150 Chasse, 1-place"
 NFA_fighter_equipment_1_short: "MB.150 C.1"
 NFA_fighter_equipment_1_desc: "MB.150 — це одномісний суцільнометалевий винищувач-низькоплан із шасі, що прибирається, та повністю закритою кабіною. Початково він створювався за вимогами французького військового конкурсу 1934 року на новий винищувач. Попри посередні характеристики, завдяки низці сприятливих обставин на початку 1937 року саме MB.150 став базовою моделлю для назрілого переозброєння винищувальних ескадрилей."
 NFA_cv_fighter_equipment_1: "Bloch MB.150 Armée, Mer, Chasse, 1-place"
 NFA_cv_fighter_equipment_1_short: "MB.150 AMC.1"
 NFA_cv_fighter_equipment_1_desc: "MB.150 — це одномісний суцільнометалевий винищувач-низькоплан із шасі, що прибирається, та повністю закритою кабіною. Початково він створювався за вимогами французького військового конкурсу 1934 року на новий винищувач. Попри посередні характеристики, завдяки низці сприятливих обставин на початку 1937 року саме MB.150 став базовою моделлю для назрілого переозброєння винищувальних ескадрилей."
 NFA_fighter_equipment_2: "Dewoitine D.520 Chasse, Bombardement 1-place"
 NFA_fighter_equipment_2_short: "D.520 CB.1"
 NFA_fighter_equipment_2_desc: "D.520 розроблявся у відповідь на вимоги французьких військових 1937 року щодо створення швидкого сучасного винищувача з високою скоропідйомністю та озброєнням, побудованим довкола 20-мм гармати. Представлений у 1938 році проєкт схвалили негайно, проте військові висунули вимогу збільшити швидкість до 505 км/год. Довівши на випробуваннях 1939 року свою перевагу у швидкості над модифікованим MB.150, D.520 вважається найсучаснішим винищувачем Франції."
 NFA_cv_fighter_equipment_2: "Dewoitine D.520 Armée, Mer, Chasse, 1-place"
 NFA_cv_fighter_equipment_2_short: "D.520 AMC.1"
 NFA_cv_fighter_equipment_2_desc: "D.520 розроблявся у відповідь на вимоги французьких військових 1937 року щодо створення швидкого сучасного винищувача з високою скоропідйомністю та озброєнням, побудованим довкола 20-мм гармати. Представлений у 1938 році проєкт схвалили негайно, проте військові висунули вимогу збільшити швидкість до 505 км/год. Довівши на випробуваннях 1939 року свою перевагу у швидкості над модифікованим MB.150, D.520 вважається найсучаснішим винищувачем Франції."
 NFA_fighter_equipment_3: "Arsenal VG-60 Chasse, Bombardement 1-place"
 NFA_fighter_equipment_3_short: "VG.60 CB.1"
 NFA_fighter_equipment_3_desc: "Проєктування літака з позначенням VG-30 розпочалося наприкінці 1937 року за власною ініціативою розробників, без жодного урядового замовлення. Названий на честь інженера Мішеля Вернісса (V) і конструктора Жана Готьє (G), VG-30 кілька разів змінював компоновку, доки не перетворився на VG-60 з новим двигуном на 1000 к. с. VG-60 — це цільнодерев'яний моноплан-низькоплан класичної схеми з напівмонококовою конструкцією з фанери по стрингерах; його прийняли на озброєння наприкінці 1942 року."
 NFA_cv_fighter_equipment_3: "Arsenal-Delanne AD.15 Armée, Mer, Chasse, 2-place"
 NFA_cv_fighter_equipment_3_short: "AD.15 AMC.2"
 NFA_cv_fighter_equipment_3_desc: "Arsenal-Delanne 15 AMC.2 — це двомісний винищувач-біплан із тандемним розташуванням крил, спроєктований Морісом Деланном і збудований заводом Arsenal de l'Aéronautique на замовлення ВМС Франції. Пілот і стрілець розміщуються тандемом під спільним ліхтарем у хвостовій частині фюзеляжу, що забезпечує стрільцю широкий сектор обстрілу для його двох 7,5-мм кулеметів."
 #Br.1002 Taon:
 NFA_jet_fighter_equipment_1: "Arsenal-Delanne AD.1002 Chasse, Bombardement 1-place"
 NFA_jet_fighter_equipment_1_short: "AD.1002 CB.1"
 NFA_jet_fighter_equipment_1_desc: "У 1944 році уряд запропонував французьким авіабудівникам представити проєкти літаків для розвитку програми «Легкий ударний винищувач». AD.1002 був розроблений Морісом Деланном та інженерами Arsenal de l'Aéronautique відповідно до вимог французьких військових: це невеликий ракетоносний середньоплан зі стрілоподібним крилом і триопорним шасі, що прибирається. Прийнятий на озброєння в 1945 році після перших випробувань, AD.1002 є першим серійним реактивним винищувачем Франції."
 #Sud-Ouest SO.6025 Espadon:
 NFA_jet_fighter_equipment_2: "Dewoitine D.6025 Combat, 1-place"
 NFA_small_plane_airframe_5: "Dewoitine D.6025 Combat, 1-place"
 NFA_jet_fighter_equipment_2_short: "D.6025 C.1"
 NFA_small_plane_airframe_5_short: "D.6025 C.1"
 NFA_jet_fighter_equipment_2_desc: "D.6025 — одномісний вільнонесучий винищувач-перехоплювач за схемою середньоплана з двигуном тягою 5000 фунтів. Озброєний шістьма 20-мм або чотирма 30-мм гарматами, D.6025 є третім представником лінійки D.6020, модифікованим встановленням рідинного ракетного двигуна під фюзеляжем. Прийнятий на озброєння в 1949 році, D.6025 покликаний замінити AD.1002 на посаді основного винищувача Франції."

 NFA_nav_bomber_equipment_1: "Latécoère Late 290 Torpille, Renseignement, 3-place"
 NFA_nav_bomber_equipment_1_short: "Late 290 TR.3"
 NFA_nav_bomber_equipment_1_desc: "Спроєктований компанією Latécoère у відповідь на запит щодо подібного літака, Late 290 базується на вдалому поштовому літаку Laté 283. Це класичний підкісний високоплан, який несе одну торпеду на зовнішній підвісці під фюзеляжем. Late 290 надійшов на службу в 1934 році та за компоновкою подібний до своїх цивільних попередників."
 NFA_cv_nav_bomber_equipment_1: "Latécoère Late 29.0 Armée, Mer, Torpille, 3-place"
 NFA_cv_nav_bomber_equipment_1_short: "Late 290 AMT.3"
 NFA_cv_nav_bomber_equipment_1_desc: "Спроєктований компанією Latécoère у відповідь на запит щодо подібного літака, Late 290 базується на вдалому поштовому літаку Laté 283. Це класичний підкісний високоплан, який несе одну торпеду на зовнішній підвісці під фюзеляжем. Late 290 надійшов на службу в 1934 році та за компоновкою подібний до своїх цивільних попередників."
 NFA_nav_bomber_equipment_2: "Latécoère Late 298 Torpille, Renseignement, 3-place"
 NFA_nav_bomber_equipment_2_short: "Late 298 TR.3"
 NFA_nav_bomber_equipment_2_desc: "Розроблений у 1936 році Late 298 покликаний замінити малоуспішний Late 290 у ролі основного поплавкового торпедоносця, а також має версію для використання на авіаносцях відповідно до військових специфікацій. Будучи вільнонесучим середньопланом з автоматичним гвинтом Ratier з електричним регулюванням кроку, Late 298 може нести одну торпеду вагою 670 кг або 500 кг бомб і озброєний двома кулеметами."
 NFA_cv_nav_bomber_equipment_2: "Latécoère Late 298 Armée, Mer, Torpille, 3-place"
 NFA_cv_nav_bomber_equipment_2_short: "Late 298 AMT.3"
 NFA_cv_nav_bomber_equipment_2_desc: "Розроблений у 1936 році Late 298 покликаний замінити малоуспішний Late 290 у ролі основного поплавкового торпедоносця, а також має версію для використання на авіаносцях відповідно до військових специфікацій. Будучи вільнонесучим середньопланом з автоматичним гвинтом Ratier з електричним регулюванням кроку, Late 298 може нести одну торпеду вагою 670 кг або 500 кг бомб і озброєний двома кулеметами."
 NFA_nav_bomber_equipment_3: "Dewoitine HD.780 Torpille, Observation, 1-place"
 NFA_nav_bomber_equipment_3_short: "HD.780 TO.1"
 NFA_nav_bomber_equipment_3_desc: "Наприкінці літа 1941 року французьке командування оприлюднило технічне завдання на швидкісний поплавковий літак, під вимоги якого розробили Dewoitine HD.780 та його палубну версію HD.790. Конструктори Dewoitine взяли за основу майже незмінений фюзеляж від D.520, за винятком переробленого крила."
 NFA_cv_nav_bomber_equipment_3: "Dewoitine HD.790 Armée, Mer, Torpille, 1-place"
 NFA_cv_nav_bomber_equipment_3_short: "HD.790 AMT.1"
 NFA_cv_nav_bomber_equipment_3_desc: "Наприкінці літа 1941 року французьке командування оприлюднило технічне завдання на швидкісний поплавковий літак, під вимоги якого розробили Dewoitine HD.780 та його палубну версію HD.790. Конструктори Dewoitine взяли за основу майже незмінений фюзеляж від D.520, за винятком переробленого крила."

 NFA_heavy_fighter_equipment_1: "Bloch MB.130 Bombardement, Combat, Renseignement, 3-place"
 NFA_heavy_fighter_equipment_1_short: "MB.130 BCR.3"
 NFA_heavy_fighter_equipment_1_desc: "MB.130 — це суцільнометалевий дводвигунний моноплан-низькоплан із шасі, що прибирається, озброєний трьома турельними кулеметами. Створений у відповідь на вимоги 1936 року до тактичного бомбардувальника, MB.130 може виконувати ролі бомбардувальника, розвідника або дальнього ескортного літака, проте французькі військові здебільшого застосовують його як винищувач далекого супроводу через нестачу машин такого класу."
 NFA_heavy_fighter_equipment_2: "Bloch MB.170 Armée, Bombardement, Renseignement, 3-place"
 NFA_heavy_fighter_equipment_2_short: "MB.170 ABR.3"
 NFA_heavy_fighter_equipment_2_desc: "У 1938 році французький уряд сформулював вимоги до дво- або тримісного багатоцільового літака для штурмових чи розвідувальних завдань. Компанія Bloch запропонувала MB.170 — дводвигунний вільнонесучий низькоплан, який визнали вельми перспективним. Після перших випробувань підфюзеляжний блістер демонтували, а проєкт зазнав значних змін, перетворившись на важкий винищувач із паралельною розробкою інших модифікацій."
 #Hell know what it is, maybe Potez 63.11 modified :
 NFA_heavy_fighter_equipment_3: "Bloch MB.260 Bombardement, Combat, Renseignement, 3-place"
 NFA_heavy_fighter_equipment_3_short: "MB.260 BCR.3"
 NFA_heavy_fighter_equipment_3_desc: "MB.260, створений на основі захоплених комунарських креслень, вважається надійним дальнім винищувачем нового покоління. Розроблений компанією Société des Avions Marcel Bloch, MB.260 озброєний трьома 7,5-мм гарматами та здатний нести до 400 кг бомб, що робить його чудовим багатоцільовим винищувачем."

 NFA_tac_bomber_equipment_0: "Amiot 143 Bombardement, Combat, Renseignement, 5-place"
 NFA_tac_bomber_equipment_0_short: "Amiot 143 BCR.5"
 NFA_tac_bomber_equipment_0_desc: "У 1929 році французький уряд видав технічне завдання на чотиримісний багатоцільовий бойовий літак, що поєднував би функції легкого бомбардувальника, розвідника та дальнього винищувача супроводу; у відповідь компанія Amiot запропонувала проєкт Amiot 140. Це суцільнометалевий вільнонесучий високоплан із гофрованою обшивкою крила та фіксованим шасі з хвостовим колесом. Прийнятий на озброєння в 1934 році модернізований Amiot 143 фактично перекваліфікували на нічний бомбардувальник, але через зміни в останню мить його затвердили за класифікацією BCR."
 NFA_tac_bomber_equipment_1: "Bloch MB.210 Bombardement, Combat, Nuit, 5-place"
 NFA_tac_bomber_equipment_1_short: "MB.210 BCN.5"
 NFA_tac_bomber_equipment_1_desc: "Bloch MB.210 є розвитком моделі MB.200, спроєктованої на вимогу 1934 року щодо нового денного/нічного бомбардувальника. MB.210 — дводвигунний моноплан-низькоплан із фіксованим шасі. Хоча машина зарекомендувала себе як надзвичайно міцна й надійна, практично без серйозних дефектів, багато хто зазначає недостатню тягооснащеність і застарілість двигунів за сучасними мірками."
 #Modified MB.220:
 NFA_tac_bomber_equipment_2: "Bloch MB.230 Bombardement, Combat, 4-place"
 NFA_tac_bomber_equipment_2_short: "MB.230 BC.4"
 NFA_tac_bomber_equipment_2_desc: "Тактичний бомбардувальник MB.230 створений на базі планера транспортного літака Bloch MB.220. Увесь пасажирський і вантажний відсік перероблено під бомбовий відсік для розміщення та скидання вибухового навантаження. Це робить MB.230 ефективним тактичним бомбардувальником, здатним завдавати ударів як по наземних, так і по морських цілях."
 NFA_tac_bomber_equipment_3: "Amiot 354 Renseignement, Bombardement, 4-place"
 NFA_tac_bomber_equipment_3_short: "Amiot 354 RB.4"
 NFA_tac_bomber_equipment_3_desc: "Серія Amiot 350 виникла в межах тих самих вимог 1936 року як конкурент MB.130. Створений на основі поштового літака Amiot 341, Amiot 350 спершу визнали невідповідним вимогам військових, але розробку продовжили завдяки високому потенціалу машини. Запущена в серійне виробництво в 1943 році модель 354 є швидкісним вільнонесучим дводвигунним монопланом."
 #SNCASE S.E.5000 Baroudeur :
 NFA_jet_tac_bomber_equipment_1: "Bloch MB.XIII Bombardement, Combat, 1-place"
 NFA_jet_tac_bomber_equipment_1_short: "MB.XIII BC.1"
 NFA_jet_tac_bomber_equipment_1_desc: "MB.X — одномісний легкий літак, розроблений компанією Société des Avions Marcel Bloch за програмою «Легкий ударний винищувач». Програвши конкурс проєкту AD.1002, MB.X отримав дозвіл на подальший розвиток як бомбардувальник і після глибокої модернізації пішов у серію під назвою MB.XIII."
 #SNCASO S.O. 4050 Vautour II :
 NFA_jet_tac_bomber_equipment_2: "Dewoitine D.4050 Bombardement, Combat, 2-place"
 NFA_jet_tac_bomber_equipment_2_short: "D.4050 BC.2"
 NFA_jet_tac_bomber_equipment_2_desc: "D.4050 — середній реактивний бойовий літак, призначений для виконання функцій бомбардувальника та штурмовика. Спроєктований через скромні можливості MB.XIII, D.4050 має кілька варіантів від винищувача до бомбардувальника, причому останній є основним типом D.4050 у ВПС Франції."

 NFA_strat_bomber_equipment_1: "Bernard 82 Bombardement, 3-place"
 NFA_strat_bomber_equipment_1_short: "Bernard 82 B.3"
 NFA_strat_bomber_equipment_1_desc: "Bernard 82 розроблено на базі літака дальньої авіації Bernard 80 GR (Grand Raid), створеного для встановлення рекордів дальності польоту. Суцільнометалевий Bernard 82 — це тримісний дальній бомбардувальник з однією оборонною туреллю під 7,7-мм кулемет і бомбовим навантаженням до 1000 кг. Розроблений у 1934 році, літак продемонстрував чудову дальність за низької швидкості, що змусило використовувати MB.130 як винищувачі ескорту для Bernard 82."
 #Modified MB.162:
 NFA_strat_bomber_equipment_2: "Bloch MB.165 Bombardement, 5-place"
 NFA_strat_bomber_equipment_2_short: "MB.165 B.5"
 NFA_strat_bomber_equipment_2_desc: "Bloch MB.165 — чотиримоторний дальній бомбардувальник, створений у 1940 році компанією Société des Avions Marcel Bloch на базі швидкісного цивільного транспортника MB.160. Початковий варіант MB.162 французькі військові визнали недостатньо швидким порівняно з машинами комунарів, що привело до розробки фінальної версії — MB.165. Літак здатний нести 3600 кг бомб, озброєний двома 7,5-мм кулеметами самооборони та зберігає високу швидкість навіть за повного завантаження."
 NFA_strat_bomber_equipment_3: "Bloch MB.175 Bombardement, 3-place"
 NFA_strat_bomber_equipment_3_short: "MB.175 B.3"
 NFA_strat_bomber_equipment_3_desc: "Відмінні льотні дані, видатну маневреність, керованість і міцність планера продемонструвала інженерна група Bloch ще на самому початку льотних випробувань під час створення спеціалізованої бомбардувальної версії Bloch MB.174-01. MB.175 отримав перероблений бомбовий відсік, розрахований на бомби масою 100–200 кг кожна за загального навантаження 800 кг. Попри меншу місткість, ніж у попередника, MB.175 має кращі показники в інших аспектах, зокрема у швидкості та спритності."
 #étendard II:
 NFA_jet_strat_bomber_equipment_1: "Bloch MB.XXII Bombardement, Combat, 1-place"
 NFA_jet_strat_bomber_equipment_1_short: "MB.XXII BC.1"
 NFA_jet_strat_bomber_equipment_1_desc: "MB.XXII спочатку створювався як багатоцільовий винищувач-бомбардувальник за програмою «Легкий ударний винищувач», але був відхилений через низькі якості винищувача. Перероблена на дальній бомбардувальник за запитом французьких військових друга модель була представлена в 1949 році та надійшла у війська в 1950-му. MB.XXII, озброєний двома 30-мм гарматами та здатний нести 1500 кг бомб, має дальність польоту 1600 км."

 NFA_scout_plane_equipment_1: "Bloch MB.131 Renseignement, Bombardement, 4-place"
 NFA_scout_plane_equipment_1_short: "MB.131 RB.4"
 NFA_scout_plane_equipment_1_desc: "Bloch MB.131 — моноплан розвідник-бомбардувальник, розроблений у 1936 році на базі MB.130 для уряду Франції. Базовий MB.130 мав досить посередні характеристики, тому його модифікували, покращивши внутрішній бомбовий відсік та оновивши обладнання. Прийнятий на озброєння під назвою MB.131, літак використовується переважно для розвідки."
 NFA_scout_plane_equipment_2: "Dewoitine D.720 Armée, Renseignement, 3-place"
 NFA_scout_plane_equipment_2_short: "D.720 AR.3"
 NFA_scout_plane_equipment_2_desc: "У 1938 році французькі військові видали специфікацію на тримісний розвідувальний літак взаємодії з армією. Представлений наприкінці 1939 року D.720 побудований переважно з дерева з тканинною та фанерною обшивкою; фюзеляж прямокутного перерізу вміщує екіпаж у двох засклених кабінах із місцем спостерігача в носовій частині з великою площею скління. Оборонне озброєння складається з 4 кулеметів, а літак підходить як для розвідувальних місій, так і для підготовки нових пілотів."

 NFA_transport_plane_equipment_1: "Bloch MB.220 Troupes, Transport, 2-place"
 NFA_transport_plane_equipment_1_short: "MB.220 TT"
 NFA_transport_plane_equipment_1_desc: "Bloch MB.220 — суцільнометалевий дводвигунний пасажирський транспортний літак, розроблений для цивільного використання. Схвалений французькими військовими, MB.220 незабаром став основним транспортним літаком армії Франції та базою для бомбардувальників Bloch MB.230."

