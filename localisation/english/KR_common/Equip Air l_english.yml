### GER - German Empire ###
###

 GER_CAS_equipment_0: "Henschel Erdkampfflugzeug 123"
 GER_CAS_equipment_0_short: "Hs 123"
 GER_small_plane_cas_airframe_0_short: "$GER_CAS_equipment_0_short$"
 GER_CAS_equipment_0_desc: "Один із перших проєктів Henschel Flugzeugwerke, Hs 123, зарекомендував себе як грізний штурмовик безпосередньої підтримки. Швидко здобувши перемогу над Fieseler у конкурсі проєктів, Hs 123 був прийнятий на озброєння військово-повітряних сил завдяки суцільнометалевій конструкції та видатній маневреності. Оснащений двигуном BMW 132Dc, він здатен розвивати високу швидкість і здійснювати пікірування під майже прямовисним кутом. На полігонах він показав себе надзвичайно надійним і простим у ремонті."
 GER_cv_CAS_equipment_0: "Henschel Träger-Sturzkampfbomber 123"
 GER_cv_CAS_equipment_0_short: "Hs 123 T"
 GER_cv_small_plane_cas_airframe_0_short: "$GER_cv_CAS_equipment_0_short$"
 GER_cv_CAS_equipment_0_desc: "Головним чином через невеликий розмах крил і простоту в обслуговуванні Імператорський флот також відмовився від Fi 98 і натомість замовив Hs 123. Завдяки використанню обома видами збройних сил запасні частини діставати легше й дешевше, що зробило Hs 123 T, частина з яких озброєна торпедами, вельми популярним серед Адміралтейства."
 GER_CAS_equipment_1: "Junkers 87"
 GER_CAS_equipment_1_short: "Ju 87"
 GER_cv_CAS_equipment_1: "Junkers 87C"
 GER_cv_CAS_equipment_1_short: "Ju 87C"
 GER_cv_CAS_equipment_1_desc: "Ju 87C — палубний варіант культового пікіруючого бомбардувальника Ju 87 Stuka, створений спеціально для операцій на морі. Оснащений посиленим шасі, гальмівним гаком і складаними крилами для ангарного зберігання, він зберіг точність і грізні можливості бомбометання з пікірування своїх сухопутних аналогів. Літак швидко здобув славу завдяки нанесенню високоточних ударів по ворожих кораблях і берегових об'єктах, ставши наріжним каменем ударних сил Імператорського флоту."
 GER_CAS_equipment_2: "Henschel Erdkampfflugzeug 129"
 GER_CAS_equipment_2_short: "Hs 129"
 GER_CAS_equipment_2_desc: "Усвідомивши потребу замінити застарілу біпланну схему Hs 123, Верховне командування армії замовило новий проєкт штурмового літака. Створений для порушення логістики та знищення техніки супротивника, літак потребував товстої броні для здійснення лобових атак на бриючому польоті. Хоча спочатку Henschel використовувала малопотужний двигун Argus, згодом його замінили на потужніший від BMW, що зрештою дозволило запустити літак у серійне виробництво. Через великокаліберну гармату у військах його часто називають «консервним ножем» (Büchsenöffner)."
 GER_cv_CAS_equipment_2: "Junkers Ju 187 C"
 GER_cv_CAS_equipment_2_short: "Ju 187 C"
 GER_cv_CAS_equipment_2_desc: "Побачивши успіхи Hs 129, Адміралтейство розробило нову модифікацію сухопутного Ju 87. Новий проєкт, попри орієнтацію на штурмові завдання, добре показав себе під час виконання торпедних атак, а товста броня зробила літаки надзвичайно стійкими до зенітного вогню та повітряних боїв."
 GER_CAS_equipment_3: "Dornier Jagdbomber 355"
 GER_CAS_equipment_3_short: "Do 355"
 GER_CAS_equipment_3_desc: "Бачачи потребу в заміні старих літаків Henschel, Верховне командування видало замовлення на створення нових штурмовиків. Фірма Dornier, відома своїми неординарними конструкціями, переконала військове міністерство нестандартною, але надзвичайно аеродинамічною компоновкою. На відміну від інших літаків, Do 355 оснащений одним тягнучим гвинтом спереду та одним штовхальним ззаду, а двигун розміщено за кабіною пілота, що забезпечує кращі льотні характеристики та вищу швидкість крену, ніж в інших машин."
 GER_cv_CAS_equipment_3: "Blohm & Voss BV 155 T"
 GER_cv_CAS_equipment_3_short: "BV 155 T/U-3"
 GER_cv_CAS_equipment_3_desc: "Звернувши увагу на чудову маневреність та потужне озброєння, які пропонує BV 155, Імператорський флот вирішив зняти з озброєння старі палубні моделі та вкласти кошти в розробку й будівництво нового палубного легкого бомбардувальника."
 GER_small_plane_cas_airframe_4_short: "Hb 132"
 GER_cv_small_plane_cas_airframe_4_short: "Hb 132 T"
 GER_small_plane_cas_airframe_5_short: "Bf 1101/99"

 #Arado 68:
 GER_fighter_equipment_0: "Flugzeugbau Friedrichshafen Jagdflugzeug 68"
 GER_fighter_equipment_0_short: "Ff 68"
 GER_fighter_equipment_0_desc: "Спроєктований на заміну Ff 65, винищувач Ff 68 із самого початку виправдав найоптимістичніші сподівання щодо керованості та маневреності. Перемога в навчальному бою над головним конкурентом Hb 51 остаточно затвердила Ff 68 як новий німецький винищувач. Хоча нині ці літаки здебільшого застаріли (попри заперечення з боку компанії Flugzeugbau Friedrichshafen), вони все ще використовуються німецькими військовими як нічні винищувачі."
 GER_cv_fighter_equipment_0: "Flugzeugbau Friedrichshafen Träger-Jagdflugzeug 68"
 GER_cv_fighter_equipment_0_short: "Ff 68 T"
 GER_cv_fighter_equipment_0_desc: "Популярний біплан Ff 68 було обрано для служби на авіаносцях Імператорського флоту (Кайзерліхмаріне). Знадобилося лише незначне доопрацювання для пристосування його до служби на авіаносцях, і, подібно до сухопутних аналогів, він заслужив високу похвалу палубних екіпажів за слухняність у керуванні."
 GER_fighter_equipment_1: "Bayerische Flugzeugwerke Jagdflugzeug 109"
 GER_fighter_equipment_1_short: "Bf 109"
 GER_fighter_equipment_1_desc: "Компанія Bayerische Flugzeugwerke відповіла на конкурс винищувачів сучасним проєктом моноплана Bf 109. Попри загальноприйняту в німецьких військових колах думку, що винищувач неодмінно має бути біпланом, літак Bf 109 з двигуном DB 600 був прийнятий на озброєння завдяки потужнішому озброєнню та значно вищій максимальній швидкості порівняно з іншими проєктами, не кажучи вже про здатність виходити зі штопора майже в будь-який момент."
 GER_cv_fighter_equipment_1: "Bayerische Flugzeugwerke Träger-Jagdflugzeug 109"
 GER_cv_fighter_equipment_1_short: "Bf 109 T"
 GER_cv_fighter_equipment_1_desc: "Завдяки значному прогресу в розумінні аеродинаміки та характеристик двигунів Імператорський флот оголосив конкурс на новий палубний літак. Цілком очікувано було обрано Bf 109, який раніше здобув контракт від сухопутних військ. Для забезпечення експлуатації на авіаносцях було внесено низку змін: подовжено крила та кермові поверхні, встановлено гальмівні гаки, вузли кріплення до катапульти та складані закінцівки крил."
 GER_fighter_equipment_2: "Focke-Wulf Jagdflugzeug 190"
 GER_fighter_equipment_2_short: "Fw 190"
 GER_fighter_equipment_2_desc: "Труднощі з виробництвом достатньої кількості рядних двигунів Daimler-Benz та успішне використання іншими країнами радіальних двигунів у винищувальних конструкціях зробили перспективу створення машини із зіркоподібним двигуном вельми багатообіцяючою. Спроєктований з особистої ініціативи головного інженера Focke-Wulf Курта Вальдемара Танка, Fw 190 вирізняється живучістю конструкції, легкістю в керуванні, широким застосуванням модульного складання та простотою в обслуговуванні. Перевершуючи все ще непоганий Bf 109, але маючи «дитячі хвороби» двигуна та викликаючи певні застереження пілотів щодо озброєння, новий винищувач був прийнятий на озброєння після перших випробувань."
 GER_cv_fighter_equipment_2: "Focke-Wulf Träger-Jagdflugzeug 190"
 GER_cv_fighter_equipment_2_short: "Fw 190 T"
 GER_cv_fighter_equipment_2_desc: "Через обмеження планера Bf 109, як-от слабку та проблемну стійку шасі, виникла потреба в новій платформі, а труднощі з розробкою проєкту Bf 155 унеможливили створення спеціалізованого палубного винищувача з нуля. Було обрано конверсію новітнього винищувача Focke-Wulf Fw 190. Модифікації включали встановлення гальмівних гаків та вузлів кріплення катапульти — за аналогією з Bf 109 T."
 #Ta 152:
 GER_fighter_equipment_3: "Focke-Wulf Jagdflugzeug 152"
 GER_fighter_equipment_3_short: "Fw 152"
 GER_fighter_equipment_3_desc: "До початку 1944 року стало зрозуміло, що потенціал розвитку Fw 190 із двигуном BMW 801 вичерпано. Це стало ще очевиднішим із появою нових ворожих винищувачів. Розробка Fw 152 — глибокої модернізації Fw 190 — розпочалася ще в 1942 році; літак отримав збільшені паливні баки, вищу швидкість і значно потужніше озброєння порівняно з Fw 190. Видатні льотні характеристики та подальша любов з боку пілотів зробили його гордістю німецьких військово-повітряних сил."
 GER_cv_fighter_equipment_3: "Blohm & Voss BV 155 T"
 GER_cv_fighter_equipment_3_short: "BV 155 T"
 GER_jet_fighter_equipment_1: "Bayerische Flugzeugwerke Jagdflugzeug 262"
 GER_jet_fighter_equipment_1_short: "Bf 262"
 GER_jet_fighter_equipment_1_desc: "Спроєктований і створений для заміни застарілих гвинтових машин, Bf 262 стає новим улюбленцем нашої авіації. Будучи одним із перших у світі літаків такого типу, він оснащений двома турбореактивними двигунами, завдяки яким може розвивати значно більшу швидкість, ніж звичайні літаки. Верховне авіаційне командування покладає на проєкт великі надії, розраховуючи з часом повністю модернізувати весь повітряний флот."
 GER_cv_small_plane_airframe_4_short: "Bf 262 T"
 #Me.1101:
 GER_jet_fighter_equipment_2: "Bayerische Flugzeugwerke Jagdflugzeug 1101"
 GER_jet_fighter_equipment_2_short: "Bf 1101"
 GER_small_plane_airframe_5_short: "$GER_jet_fighter_equipment_2_short$"
 GER_jet_fighter_equipment_2_desc: "Прямий наступник Bf 262, літак Bf 1101 має V-подібний корпус і стрілоподібне крило. Це одномісна машина з двома турбореактивними двигунами Heinkel HeS 011, що роблять її швидшою за Bf 262 і забезпечують плавнішу роботу дроселя, суттєво знижуючи ризик зриву компресора, який був справжнім лихом попередника."

 GER_small_plane_naval_bomber_airframe_0_short: "Do 22"
 GER_nav_bomber_equipment_1: "Fieseler See-Mehrzweckflugzeug 167"
 GER_nav_bomber_equipment_1_short: "Fi 167"
 GER_nav_bomber_equipment_1_desc: "Розроблений і побудований переважно для використання на авіаносцях, Fi 167 також був прийнятий на озброєння морської авіації (Зеєфлігер) Імператорського флоту. Попри архаїчний вигляд, біплан має чудову маневреність завдяки двигуну Benz & Cie. Із максимальною швидкістю 325 км/год він утворює швидке та ударне ядро берегових авіагруп."
 GER_cv_nav_bomber_equipment_1: "Junkers 87D-4"
 GER_cv_nav_bomber_equipment_1_short: "Ju 87D-4"
 GER_cv_nav_bomber_equipment_1_desc: "Ju 87D-4 — палубна модифікація «Штуки», пристосована для торпедних атак на ворожі кораблі. Оснащений палубним шасі та переробленим бомбовим тримачем для торпед, він поєднує смертоносну точність із надійною службою на морі. Його характерне виття досі вселяє жах у серця моряків супротивника під час смертоносного пікірування."
 #Fokker T.VIII:
 GER_nav_bomber_equipment_2: "Fokker Wasserflugzeug 80"
 GER_nav_bomber_equipment_2_short: "Fk 80"
 GER_nav_bomber_equipment_2_desc: "Після того, як Ентоні Фоккер перевів більшу частину своєї фірми до Нідерландів, Імператорській армії довелося шукати політично надійніші підприємства. Ситуація змінилася в часи канцлерства фон Тірпіца, коли Fokker знову відкрила завод у Німеччині та взяла участь у конкурсах проєктів, здобувши перемогу з T.VIII. Цей літак, який у німецькій авіації отримав назву Fokker 80, оснащений двигуном BMW 132 K і може нести бомби або торпеди вагою до 750 кілограмів, що робить його грізною машиною морської авіації."
 #Fokker T.VIII:
 GER_cv_nav_bomber_equipment_2: "Focke-Wulf Träger-Jagdflugzeug 190 T/U2"
 GER_cv_nav_bomber_equipment_2_short: "Fw 190 T/U2"
 GER_cv_nav_bomber_equipment_2_desc: "Модифікований Focke-Wulf 190 T із можливістю нести важкі бомби або торпеди."
 #P194:
 GER_nav_bomber_equipment_3: "Blohm & Voss See-Mehrzweckflugzeug 194"
 GER_nav_bomber_equipment_3_short: "Ha 194"
 GER_nav_bomber_equipment_3_desc: "Духовний наступник Ha 141, літак Ha 194 зберіг незвичну асиметричну компоновку з кабіною на правому борті. Хоча деякі авіаційні командири ставляться до машини критично, вона довела свою високу маневреність і здатність долати величезні відстані без проміжних посадок."
 #P194:
 GER_cv_nav_bomber_equipment_3: "Blohm & Voss BV 155 T/U-4"
 GER_cv_nav_bomber_equipment_3_short: "BV 155 T/U-4"
 GER_cv_nav_bomber_equipment_3_desc: "Попри порівняно великий розмах крил, Ha 194 також був прийнятий Імператорським флотом як палубний літак — головним чином завдяки великому радіусу дії та короткому розбігу/пробігу під час зльоту й посадки."
 GER_small_plane_naval_bomber_airframe_4_short: "Ho 229"
 GER_cv_small_plane_naval_bomber_airframe_4_short: "Ho 229 T"
 GER_small_plane_naval_bomber_airframe_5_short: "Bf 1101/92"

 GER_medium_plane_fighter_airframe_0_short: "Do 23"
 GER_heavy_fighter_equipment_1: "Bayerische Flugzeugwerke Zerstörer 110"
 GER_heavy_fighter_equipment_1_short: "Bf 110"
 GER_heavy_fighter_equipment_1_desc: "Створений як важкий винищувач із більшим радіусом дії, ніж у Bf 109, цей літак виграв конкурс, проведений Авіаційною службою, перемігши за проєктом Bayerische Flugzeugwerke. Окрім переваги в дальності польоту, Bf 110 вирізнявся надзвичайно потужним озброєнням — трьома 20-мм гарматами в носовій частині. Хоча він і менш маневрений, машина виявилася винятковою та особливо придатною для використання в наших колоніальних володіннях."
 GER_heavy_fighter_equipment_2: "Junkers Zerstörer 88"
 GER_heavy_fighter_equipment_2_short: "Ju 88"
 GER_heavy_fighter_equipment_2_desc: "Спочатку задуманий як швидкісний бомбардувальник, Ju 88 може виконувати найрізноманітніші завдання, зокрема завдання із завоювання панування в повітрі та перехоплення. Обраний на заміну Bf 110, він є маневренішим і здатний прикривати значно більшу повітряну зону, ніж його попередник."
 GER_heavy_fighter_equipment_3: "Hansa-Brandenburg Zerstörer 219"
 GER_heavy_fighter_equipment_3_short: "Hb 219"
 GER_heavy_fighter_equipment_3_desc: "Розвиваючи сильні сторони Ju 88, конструктори Hansa-Brandenburg створили Hb 219. Завдяки видатній курсовій стійкості та високій маневреності літак здатний ефективніше перехоплювати й знищувати ворожу авіацію. Новіший двигун та покращена аеродинаміка забезпечують вищу швидкість і більший радіус дії. Новостворений камуфляж допомагає краще маскувати літак, ускладнюючи його виявлення ворожими винищувачами."
 GER_medium_plane_fighter_airframe_4_short: "Ff 234B"

 GER_tac_bomber_equipment_0: "Junkers Mittlerer Bomber 86"
 GER_tac_bomber_equipment_0_short: "Ju 86"
 GER_tac_bomber_equipment_0_desc: "Замовлений як бомбардувальник і пасажирський літак, Ju 86 мав витіснити з Авіаційної служби всі літаки епохи Тірпіца. Завдяки міцній суцільнометалевій конструкції та шасі, що прибирається, він вирізняється чудовою керованістю і користується популярністю серед пілотів. Літак широко використовується іншими військово-повітряними силами світу завдяки винятковій стабільності в повітрі та помірній витраті пального."
 #Heinkel He 111:
 GER_tac_bomber_equipment_1: "Hansa-Brandenburg Mittlerer Bomber 111"
 GER_tac_bomber_equipment_1_short: "Hb 111"
 GER_tac_bomber_equipment_1_desc: "У відповідь на зростаючий попит Верховного командування на бомбардувальники компанія Hansa-Brandenburg представила Hb 111 для підтримки Ju 86. Оснащений двигуном Benz & Cie, він значно швидший і, подібно до попередника, широко експортується та використовується багатьма ВПС світу."
 GER_tac_bomber_equipment_2: "Dornier Bomber 217"
 GER_tac_bomber_equipment_2_short: "Do 217"
 GER_tac_bomber_equipment_2_desc: "Аби замінити застарілі Ju 86 та Hb 111, Верховне командування замовило виробництво нового покоління бомбардувальників. Спроєктований спочатку як морський бомбардувальник, Do 217 був перероблений на важкий бомбардувальник. Будучи краще озброєним за попередника та маючи здатність завдавати ударів із пікірування, проєкт компанії Dornier здобув контракт без жодної конкуренції."
 GER_tac_bomber_equipment_3: "Junkers Bomber 188"
 GER_tac_bomber_equipment_3_short: "Ju 188"
 GER_tac_bomber_equipment_3_desc: "Ju 188 створювався як високопродуктивний бомбардувальник із підвищеними характеристиками та більшим корисним навантаженням на зміну застарілому Ju 88. Хоча Верховне командування скептично поставилося до цієї моделі, льотчики-випробувачі високо оцінили компоновку кабіни. Літак оснащений двома двигунами BMW і трилопатевими гвинтами, що значно покращує паливну ефективність і дальність польоту."
 GER_jet_tac_bomber_equipment_1: "Flugzeugbau Friedrichshafen Strahlgetriebener Bomber 234"
 GER_jet_tac_bomber_equipment_1_short: "Ff 234"
 GER_jet_tac_bomber_equipment_1_desc: "Поява реактивних двигунів справила колосальний вплив на розвиток винищувальної та бомбардувальної авіації. Будучи одним із перших бойових реактивних бомбардувальників у світі, Ff 234 вирізняється величезною перевагою у швидкості. Швидший за звичайні гвинтові винищувачі, він здатен відриватися від застарілих літаків ворога, що робить успішний відхід без прикриття значно ймовірнішим. Попри довгий розбіг при зльоті, літак має високу маневреність, тому пілоти надають йому перевагу над гвинтовими бомбардувальниками."
 GER_jet_tac_bomber_equipment_2: "Hansa-Brandenburg Strahlgetriebener Bomber 343"
 GER_jet_tac_bomber_equipment_2_short: "Hb 343"
 GER_jet_tac_bomber_equipment_2_desc: "Хоча Ff 234 і став проривом у своїй галузі, він усе ж мав певні недоліки, зокрема труднощі під час посадки та прицільного бомбометання. Проте обидва ці аспекти були вдосконалені в новому поколінні машини, представленому моделлю Hb 343, що дало змогу створити ще швидший, далекобійніший і надійніший реактивний бомбардувальник."

 GER_large_plane_airframe_0_short: "Do P"
 GER_strat_bomber_equipment_1: "Dornier Schwerer Bomber 19"
 GER_strat_bomber_equipment_1_short: "Do 19"
 GER_strat_bomber_equipment_1_desc: "Перед Авіаційною службою постало завдання приділити більше уваги розвитку стратегічного бомбардувального напряму. Це призвело до конкурсу, в якому перемогу здобув Do 19. Цей важкий бомбардувальник мав посередні льотні дані та замалий бомбовий відсік, зрештою ставши лише тимчасовим рішенням перед випуском майбутнього Hb 177."
 GER_strat_bomber_equipment_2: "Hansa-Brandenburg Schwerer Bomber 177"
 GER_strat_bomber_equipment_2_short: "Hb 177"
 GER_strat_bomber_equipment_2_desc: "Спроєктований і побудований на заміну застарілому Do 19, Hb 177 вирізняється значно кращими льотними характеристиками й озброєнням, а також містким відсіком, здатним умістити майже вдвічі більше бомб. Його суцільнометалева конструкція виявилася міцнішою та зручнішою в керуванні, хоча великі габарити машини під час випробувань усе ж спричиняли проблеми з маневреністю."
 GER_strat_bomber_equipment_3: "Hansa-Brandenburg Langstreckenbomber 277"
 GER_strat_bomber_equipment_3_short: "Hb 277"
 GER_strat_bomber_equipment_3_desc: "Будучи прямим наступником Hb 177, цей літак зазнав небагатьох змін. Фюзеляж залишився незмінним, а найголовніші нововведення торкнулися розміру крил і силової установки. Замість часто проблемних двигунів Benz & Cie на Hb 277 встановили двигуни BMW, що підвищило надійність та покращило льотні характеристики літака. Збільшений розмах крил також дозволив машині діставати значно віддаленіших цілей."
 GER_jet_strat_bomber_equipment_1: "Flugzeugbau Friedrichshafen Strahlgetriebener Bomber 555"
 GER_jet_strat_bomber_equipment_1_short: "Ff 555"
 GER_jet_strat_bomber_equipment_1_desc: "Спроєктований за наказом Верховного командування, Ff 555 є реактивним бомбардувальником схеми «літаюче крило» дальнього радіуса дії, призначеним для завдання бомбових ударів у таких віддалених регіонах, як східне узбережжя Північної Америки чи райони Азії на схід від Уралу. Його спеціальну V-подібну форму було обрано для забезпечення кращої аеродинаміки та досягнення вищих швидкостей."

 GER_large_plane_maritime_patrol_plane_airframe_0_short: "Do 18"
 GER_large_plane_maritime_patrol_plane_airframe_1_short: "Do 24"
 GER_large_plane_maritime_patrol_plane_airframe_2_short: "BV 222"
 GER_large_plane_maritime_patrol_plane_airframe_3_short: "BV 238"
 GER_large_plane_maritime_patrol_plane_airframe_4_short: "BV 555"

 GER_rocket_interceptor_equipment_1: "Bayerische Flugzeugwerke Objektschutzjäger 163"
 GER_rocket_interceptor_equipment_1_short: "Bf 163"
 GER_rocket_interceptor_equipment_1_desc: "Розроблений як оборонний літак для захисту повітряного простору від ворожої авіації, Bf 163 є справді унікальною машиною. Оснащений рідинним ракетним двигуном, літак має стрімко набирати велику висоту, атакувати групи ворожих бомбардувальників і після цього повертатися на аеродром у режимі планерування. Хоча Верховне командування дуже скептично ставиться до проєкту та його ризикованої тактики, дехто вважає його протиповітряною обороною майбутнього."
 GER_rocket_interceptor_equipment_2: "Bayerische Flugzeugwerke Objektschutzjäger 263"
 GER_rocket_interceptor_equipment_2_short: "Bf 263"
 GER_rocket_interceptor_equipment_2_desc: "Після виявлення недоліків у Bf 163 Верховне командування дозволило створення нової моделі ракетного перехоплювача. Bf 263 виготовлений із міцніших матеріалів, оснащений герметичною кабіною та простішим і значно ефективнішим двигуном, що дозволило вдвічі збільшити бойову висоту польоту й суттєво підвищити шанси пілота на виживання."
 #Ba 349:
 GER_rocket_interceptor_equipment_3: "Fieseler Objektschutzjäger 349"
 GER_rocket_interceptor_equipment_3_short: "Fi 349"
 GER_rocket_interceptor_equipment_3_desc: "Спроєктований як наступник Bf 163 та Bf 263, Fi 349 мав на меті усунути низку недоліків інших перехоплювачів. Літак потребує лише одного пілота з базовими навичками прицілювання та стрільби, оскільки наведення здійснюється автопілотом. Крім того, після атаки льотчику не потрібно повертатися на злітно-посадкову смугу — він просто катапультується і спускається на парашуті. Ця революційна схема дозволяє підняти літак у повітря будь-якій людині з мінімальною підготовкою за першої ж потреби."

 GER_medium_plane_scout_plane_airframe_0_short: "Do 16"
 GER_scout_plane_equipment_1: "Henschel Nahaufklärer 126"
 GER_scout_plane_equipment_1_short: "Hs 126"
 GER_scout_plane_equipment_1_desc: "На замовлення німецької авіації фірма Henschel розробила Hs 126 як літак-розвідник ближньої дії за схемою високоплана. Він отримав високі оцінки від пілотів і командування за здатність до короткого зльоту та впевнений політ на низьких швидкостях, що вважається вирішальним фактором для спостереження та збору розвідданих."
 GER_scout_plane_equipment_2: "Focke-Wulf Aufklärer 189"
 GER_scout_plane_equipment_2_short: "Fw 189"
 GER_scout_plane_equipment_2_desc: "Вигравши конкурс проєктів у Ff 198 та Ha 141, компанія Focke-Wulf отримала контракт на заміну застарілого Hs 126. Дводвигунний тримісний тактичний розвідник двобалкової схеми виконує завдання здебільшого на коротких дистанціях. Пілоти особливо відзначають його чудову маневреність під час повітряного бою."
 GER_medium_plane_scout_plane_airframe_3_short: "Fw 191"
 GER_medium_plane_scout_plane_airframe_4_short: "Ff 234C"

 GER_transport_plane_equipment_1: "Junkers Transportflugzeug W 34"
 GER_transport_plane_equipment_1_short: "Ju W 34"
 GER_transport_plane_equipment_1_desc: "Junkers W 34 служить у військово-повітряних силах (Luftstreitkräfte) легким транспортним та багатоцільовим літаком, здатним надійно перевозити особовий склад, припаси або обладнання зв'язку на помірні відстані. Міцна суцільнометалева конструкція та однодвигунна компоновка роблять його простим в експлуатації. Він виконує життєво важливі допоміжні завдання, підтримуючи постачання та мобільність наших військ."
 #Ar.232
 GER_transport_plane_equipment_2: "Junkers Transportflugzeug 52"
 GER_transport_plane_equipment_2_short: "Ju 52"
 GER_transport_plane_equipment_2_desc: "Розвиваючи успіх Ju 34, літак Junkers Ju 52 пропонує сучаснішу конструкцію для задоволення зростаючих логістичних потреб збройних сил. Покращені двигуни та значно збільшена вантажопідйомність дозволяють виконувати триваліші перельоти з важчим корисним навантаженням, роблячи його незамінним для постачання віддалених гарнізонів по всій території Імперії."
 GER_transport_plane_equipment_3: "Junkers Transportflugzeug 390"
 GER_transport_plane_equipment_3_short: "Ju 390"
 GER_transport_plane_equipment_3_desc: "Ju 390 — справжній велетень неба, створений для виконання дальніх транспортних місій на неозорих просторах Імперії. Завдяки величезному радіусу дії та колосальній вантажопідйомності він ідеально підходить для стратегічних перевезень і великомасштабної логістики. Попри значні габарити, літак зберіг притаманні всім машинам Junkers високу надійність та міцність конструкції."

 GER_helicopter_equipment_1: "Flettner Hubschrauber 282 Kolibri"
 GER_helicopter_equipment_1_short: "Fl 282"
 # GER_helicopter_equipment_1_desc: "The Flettner Fl 282 Kolibri represents a remarkable step forward in rotary-wing aviation, developed to support reconnaissance and coordination missions. Its intermeshing rotor design provides unmatched stability and manoeuvrability, making it ideal for operations in confined spaces such as naval vessels or rough terrain. Though primarily used for observation, its reliability and ease of maintenance ensure its place as a valued asset to the Luftstreitkräfte."

 GER_strat_bomber_intercontinental_equipment_1: "Horten Langstreckenbomber 18"
 GER_strat_bomber_intercontinental_equipment_1_short: "Ho 18"
 # GER_strat_bomber_intercontinental_equipment_1_desc: "A breakthrough in aviation design, the Horten Ho 18 is the pinnacle of German engineering for long-range strategic bombing. Its radical flying wing configuration allows for reduced radar cross-section and improved aerodynamics, making it faster and more fuel-efficient than traditional bombers. Designed for intercontinental operations, including missions across the Atlantic, the Ho 18 symbolizes the Luftstreitkräfte's ambition to maintain aerial dominance globally."

