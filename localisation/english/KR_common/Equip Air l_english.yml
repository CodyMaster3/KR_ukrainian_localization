 ICE_CAS_equipment_1: "SAI KZ IIA"
 ICE_CAS_equipment_1_short: "KZ IIA"
 ICE_CAS_equipment_1_desc: "Уже за кілька місяців після свого заснування компанія SAI (Skandinavisk Aero Industri), створена двома технічно обізнаними авіаентузіастами, випустила два різні спортивні літаки. Їхня друга модель привернула увагу данських військових, які зрештою уклали контракт на виробництво штурмової модифікації цього літака."

