### FIN - Kingdom of Finland ###
###

 FIN_CAS_equipment_1: "Fokker-VL C.X III"
 FIN_CAS_equipment_1_short: "C.X III"
 FIN_CAS_equipment_1_desc: "Прийнятий на озброєння нідерландцями в 1933 році, Fokker C.X створювався для польотів на гранично малих висотах, аби уникати зенітного вогню, і завдяки цьому мав низьку швидкість звалювання. Варіант серії III фінського виробництва вирізнявся дещо зміненим шасі, переробленим крилом та новим двигуном."
 FIN_CAS_equipment_2: "Fokker C.XIII"
 FIN_CAS_equipment_2_short: "C.XIII"
 FIN_CAS_equipment_3: "SAAB A 21"
 FIN_CAS_equipment_3_short: "A 21"
 FIN_CAS_equipment_3_desc: "Saab A 21 спочатку створювався як винищувач під назвою J 21, однак для цієї ролі його льотні характеристики виявилися недостатніми. Попри це, конструкторське бюро Saab зрозуміло, що його планер стане чудовою платформою для штурмовика. Унікальна схема зі штовхальним гвинтом, потужний двигун і багатий вибір озброєння зробили його грізним літаком безпосередньої підтримки."

 FIN_fighter_equipment_0: "Gloster Kukko"
 FIN_fighter_equipment_0_short: "Kukko"
 FIN_fighter_equipment_0_desc: "«Kukko» — це модифікований ліцензійний Gloster Gamecock Mk II з новим німецьким двигуном."
 FIN_fighter_equipment_1: "VL Myrsky"
 FIN_fighter_equipment_1_short: "Myrsky"
 FIN_fighter_equipment_1_desc: "У 1930-х роках Фінляндія усвідомила, що стрімко відстає як від союзників, так і від ворогів у розробці винищувачів, не маючи жодного моноплана зі сталевим каркасом. Myrsky був спроєктований Державним авіаційним заводом Фінляндії на основі німецьких напрацювань і оснащений канадським двигуном."
 FIN_fighter_equipment_2: "VL Humu"
 FIN_fighter_equipment_2_short: "Humu"
 FIN_fighter_equipment_2_desc: "Хоча палубний винищувач Brewster Buffalo спочатку було відхилено на озброєння США й відправлено на доопрацювання, фіни відразу ж зацікавилися початковою моделлю компанії Brewster. Ще до того, як було збудовано перший прототип, Фінляндія замовила партію цих літаків. Після прибуття до країни машини були повністю переобладнані."
 FIN_fighter_equipment_3: "VL Pyörremyrsky"
 FIN_fighter_equipment_3_short: "Pyörremyrsky"
 FIN_fighter_equipment_3_desc: "Pyörremyrsky розроблявся на основі пізніх моделей Focke-Wulf Fw 190 із суттєвими змінами для покращення маневреності, дальності польоту та озброєння. Pyörremyrsky вирізняється винятковою швидкістю та маневреністю."
 FIN_jet_fighter_equipment_1: "SAAB J 21R"
 FIN_jet_fighter_equipment_1_short: "J 21R"
 FIN_jet_fighter_equipment_2: "SAAB 29 Tunnan"
 FIN_small_plane_airframe_5: "SAAB 29 Tunnan"
 FIN_jet_fighter_equipment_2_short: "SAAB 29"
 FIN_small_plane_airframe_5_short: "SAAB 29"

 FIN_nav_bomber_equipment_1: "Blackburn Ripon"
 FIN_nav_bomber_equipment_1_short: "Ripon"
 FIN_nav_bomber_equipment_1_desc: "Blackburn Ripon на озброєнні Фінляндії — справді дивовижне видовище. І не тому, що цей літак є винятково видатним морським торпедоносцем, а тому, що виготовляла його державна компанія Blackburn Union у синдикалістському Союзі Британії. Те, як Фінляндії вдалося придбати ці літаки, отримати схвалення та необхідну оснастку для їх ліцензійного виробництва, залишається предметом численних здогадок. Фінський Ripon випускався за проєктом Ripon IIF."
 FIN_nav_bomber_equipment_2: "VL Kotka"
 FIN_nav_bomber_equipment_2_short: "Kotka"
 FIN_nav_bomber_equipment_2_desc: "Спершу задуманий як дешевша альтернатива «Ріпону», Kotka перевершує його майже за всіма параметрами. Оснащений новим канадським двигуном, Kotka є швидким і здатним летіти на низькій висоті та малій швидкості без загрози звалювання, що вкрай важливо під час торпедних атак."
 FIN_nav_bomber_equipment_3: "Hansa-Brandenburg 115"
 FIN_nav_bomber_equipment_3_short: "Hb 115"

 FIN_heavy_fighter_equipment_1: "VL Tähti"
 FIN_heavy_fighter_equipment_1_short: "Tähti"
 FIN_heavy_fighter_equipment_1_desc: "Розроблений на базі канадського середнього бомбардувальника Beaufort подібно до канадського проєкту Beaufighter, VL Tähti отримав значно полегшену конструкцію, а також модернізовані для нової ролі двигуни та озброєння. Проте, на відміну від канадського варіанта, відсік бомбардира не було демонтовано — натомість Tähti отримав поворотну носову турель."
 FIN_heavy_fighter_equipment_2: "Петляков Пе-3"
 FIN_heavy_fighter_equipment_2_short: "Пе-3"
 FIN_heavy_fighter_equipment_2_desc: "Помітивши успіх комунарських та британських важких винищувачів, у 1941 році відомий авіаконструктор Володимир Петляков та його фірма розпочали роботу над винищувальним варіантом середнього бомбардувальника Пе-2. Як і у випадку з багатьма російськими розробками, попри напружені відносини між країнами, фінський уряд уклав контракт на постачання значної кількості нових літаків."
 FIN_heavy_fighter_equipment_3: "VL Vihuri"
 FIN_heavy_fighter_equipment_3_short: "Vihuri"
 FIN_heavy_fighter_equipment_3_desc: "Хоча дехто звинувачує фінів у копіюванні британського «Москіто», фінський Vihuri насправді є власною розробкою, що запозичила вдалі рішення німецьких, російських, антантовських та синдикалістських моделей."

 FIN_tac_bomber_equipment_0: "Avro VL Anson"
 FIN_tac_bomber_equipment_0_short: "Anson"
 FIN_tac_bomber_equipment_0_desc: "Avro Anson — середній бомбардувальник, створений на основі канадського пасажирського літака Avro 652. Не маючи змоги дозволити собі сучасні німецькі літаки, у 1935 році фіни вирішили взяти Anson на озброєння як тимчасове розв'язання проблеми нестачі бомбардувальної авіації."
 FIN_tac_bomber_equipment_1: "Bristol-VL Blenheim"
 FIN_tac_bomber_equipment_1_short: "Blenheim"
 FIN_tac_bomber_equipment_1_desc: "Середній бомбардувальник Blenheim — перший суцільнометалевий бомбардувальник Канади. Він був прийнятий на озброєння ВПС Фінляндії після несподіваного успіху Anson, який приємно вразив керівництво країни якістю канадського літакобудування."
 FIN_tac_bomber_equipment_2: "Туполєв СБ 2М-103"
 FIN_tac_bomber_equipment_2_short: "СБ 2М-103"
 FIN_tac_bomber_equipment_2_desc: "До створення СБ фірми Туполєва російські розробники помітно відставали від західних колег у сегменті сучасних середніх бомбардувальників. Проте складний шлях розробки та випробувань СБ надав країні вкрай потрібного інноваційного поштовху. Модифікація «103» отримала низку вдосконалень проти ранніх серій. Хоча фінський варіант суворо кажучи не був справжнім «103-м», наявні у Фінляндії літаки СБ були модернізовані аналогічним чином."
 FIN_tac_bomber_equipment_3: "Архангельський СББ-2"
 FIN_tac_bomber_equipment_3_short: "СББ-2"
 FIN_tac_bomber_equipment_3_desc: "Створений на основі пізньої моделі Туполєва СБ, новий літак СБ-РК був спроєктований бюро Архангельського наприкінці 1940 року як заміна СБ, адаптована радше для пікірування, ніж для швидкісних ударів на бриючому польоті. Пізніше СБ-РК перейменували на СББ, а після відхилення прототипу російськими військовими машину переробили під назвою СББ-2. Проєкт було запропоновано іноземним державам, і Фінляндія успішно придбала ліцензію на його виробництво."
