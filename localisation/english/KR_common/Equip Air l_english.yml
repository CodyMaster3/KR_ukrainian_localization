 HOL_CAS_equipment_1: "Fokker C.X"
 HOL_CAS_equipment_1_short: "C.X"
 HOL_CAS_equipment_2: "Fokker C.XIII"
 HOL_CAS_equipment_2_short: "C.XIII"
