 SUR_strat_bomber_equipment_1: "Fokker T.VI (Ontwerp 115)"
 SUR_strat_bomber_equipment_1_short: "T.VI (Ontwerp 115)"
 SUR_strat_bomber_equipment_1_desc: "Між серпнем 1934 та лютим 1935 року розпочалася робота над проєктом Ontwerp 115.\nOntwerp 115 мав схему чотиримоторного низькоплана з шасі, що прибиралося, та двокільовим оперенням. Літак мав оснащуватися чотирма радіальними двигунами, характеристики яких розраховувалися під Gnome-Rhône 14Krfs на 900 к. с., 14Krsd на 1110 к. с. або Wright Cyclone SFR-1820-F2 на 712 к. с. Гвинти передбачалися трилопатеві, зі змінним кроком у польоті. Бомбове навантаження проєктувалося на рівні двох тонн."
