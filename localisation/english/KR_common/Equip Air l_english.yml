### SLO - Slovakia ###
###

 SLO_CAS_equipment_1: "Aero Vodochody A.101"
 SLO_CAS_equipment_1_short: "A.101"
 SLO_CAS_equipment_1_desc: "Не маючи сучасних штурмовиків, Дуалістична монархія спробувала переобладнати наявні моделі під цю роль. A.101 став результатом кількох спроб модернізувати біплан A.230 для виконання таких завдань. Суттєво більший і краще озброєний за своїх попередників, A.101 здатний як штурмувати наземні цілі, так і здійснювати бомбометання нарівні з будь-якими своїми сучасниками."
 SLO_CAS_equipment_2: "Weiss Manfréd WM.231"
 SLO_CAS_equipment_2_short: "WM.231"
 SLO_CAS_equipment_2_desc: "Компанія Weiss Manfréd представила винищувач WM.23 для конкуренції з проєктом Avia. Хоча кулемети Гебауера з моторним приводом, встановлені в капоті, справили враження на комітет, натомість було обрано B.135. У відповідь Weiss Manfréd дещо переробила конструкцію і повторно подала її вже як пікіруючий бомбардувальник, покликаний доповнити застарілий парк біпланів A.101."
 SLO_CAS_equipment_3: "Weiss Manfréd WM.44"
 SLO_CAS_equipment_3_short: "WM.44"
 SLO_CAS_equipment_3_desc: "Спроєктований Ласло Варгою, він був фактично зменшеною двомісною версією серії важких винищувачів і швидкісних бомбардувальників WM.31. Як і його попередник, літак виготовлявся з дерева та металу для покращення льотних характеристик. Він виявився цілком придатним, хоч і легкоброньованим, для завдань безпосередньої авіаційної підтримки."

 SLO_fighter_equipment_0: "Phönix D.V"
 SLO_fighter_equipment_0_short: "D.V"
 SLO_fighter_equipment_0_desc: "Із завершенням Світової війни запланована компанією Phönix модернізація свого відомого біплана D.III з очікуваним позначенням «D.IV» так і не відбулася. Проте в 1931 році компанія відродила назву D.IV, представивши абсолютно новий біплан із передовими на той час характеристиками. Модернізований варіант літака з позначенням D.V був прийнятий на озброєння Дуалістичною монархією в 1933 році."
 SLO_fighter_equipment_1: "Avia B.534"
 SLO_fighter_equipment_1_short: "B.534"
 SLO_fighter_equipment_1_desc: "У 1932 році відомий богемський інженер Франтішек Новотний розпочав співпрацю з компанією Avia над новим суцільнометалевим біпланом. Ці зусилля увінчалися створенням B-34, який майже був прийнятий на озброєння Дуалістичною монархією замість Phönix. Не втрачаючи надії, Новотний переробив B-34, встановивши новий двигун і шасі, а також повністю закриту кабіну. На відміну від попередника, цю модель, B-534, Дуалістична монархія все ж прийняла на озброєння."
 SLO_fighter_equipment_2: "Avia B.135"
 SLO_fighter_equipment_2_short: "B.135"
 SLO_fighter_equipment_2_desc: "Після успіху біплана B-534 компанія Avia незабаром розпочала роботу над надсучасним монопланом, яким зрештою став B-135. Він використовував 860-сильний двигун Austro-Daimler V12D і був оснащений 20-мм автоматичною гарматою в носовій частині та двома синхронізованими 8-мм кулеметами в капоті, що забезпечувало йому чудову маневреність і високу точність вогню."
 SLO_fighter_equipment_3: "Avia-Ikarus B.224"
 SLO_fighter_equipment_3_short: "B.224"
 SLO_fighter_equipment_3_desc: "Фактично остання еволюція конструкції Новотного, створена за участі Кости Сивчева та іллірійської компанії Ikarus. Двигун B.224 було замінено на чудовий 1000-сильний Austro-Daimler V12E, а кулемети — на два 12,7-мм великокаліберні кулемети Гебауера з моторним приводом, що збільшило швидкість і вогневу міць літака порівняно з попередником. Примітними рисами є новий краплеподібний ліхтар кабіни та витончений фюзеляж."
 SLO_jet_fighter_equipment_1: "Avia Bf.262"
 SLO_jet_fighter_equipment_1_short: "Bf.262"
 SLO_jet_fighter_equipment_1_desc: "Відстаючи у розробці реактивних винищувачів, Avia придбала ліцензію на виробництво Bf 262 для Авіаційного корпусу (Fliegerkorps), замінивши у своїй дещо зміненій конструкції німецькі 30-мм гармати на гармати калібру 20 мм місцевого виробництва."
 SLO_jet_fighter_equipment_2: "Letov L.52"
 SLO_small_plane_airframe_5: "Letov L.52"
 SLO_jet_fighter_equipment_2_short: "L.52"
 SLO_small_plane_airframe_5_short: "L.52"
 SLO_jet_fighter_equipment_2_desc: "Коли Austro-Daimler розробила двигун U2 «Uzelac», Letov створила ультрасучасний реактивний винищувач, який став першим власним реактивним літаком Монархії, прийнятим на озброєння."

 SLO_nav_bomber_equipment_1: "Letov Š.328.v"
 SLO_nav_bomber_equipment_1_short: "Š.328.v"
 SLO_nav_bomber_equipment_1_desc: "Š.328.v був поплавковим гідролітаком — модифікацією серії Š.28. Він озброювався двома курсовими 8-мм кулеметами та ще двома на турелі в задній частині, а корисне навантаження становило близько 500 кг."
 SLO_nav_bomber_equipment_2: "Lohner-Fokker T.VIII W/C"
 SLO_nav_bomber_equipment_2_short: "T.VIII W/C"
 SLO_nav_bomber_equipment_2_desc: "Компанія Lohner, яка раніше під час війни виготовляла гідролітаки та літаючі човни для Імператорсько-королівського морського авіаційного корпусу (k.u.k. Seefliegerkorps), придбала права на виробництво Fokker T.VIII для Австро-Угорського флоту."
 SLO_nav_bomber_equipment_3: "Weiss Manfréd WM.442"
 SLO_nav_bomber_equipment_3_short: "WM.442"
 SLO_nav_bomber_equipment_3_desc: "WM.442 — це поплавковий варіант WM.44, створений для Морського авіаційного корпусу (Seefliegerkorps) і призначений для протикорабельних операцій в Адріатичному та Середземному морях."

 SLO_heavy_fighter_equipment_1: "Praga E.51"
 SLO_heavy_fighter_equipment_1_short: "E.51"
 SLO_heavy_fighter_equipment_1_desc: "Спочатку розроблений як розвідувальний літак, E.51 невдовзі був визнаний цілком придатним для швидкої адаптації під важкий винищувач для протидії стратегічним бомбардувальникам."
 SLO_heavy_fighter_equipment_2: "Weiss Manfréd WM.31"
 SLO_heavy_fighter_equipment_2_short: "WM.31"
 SLO_heavy_fighter_equipment_2_desc: "Угорський авіаконструктор Ласло Варга спроєктував цей тримісний винищувач під експериментальні газотурбінні двигуни. Проте через технічні труднощі з двигунами їх замінили на два Austro-Daimler V12D. Примітно, що WM.31 мав змішану конструкцію."
 SLO_heavy_fighter_equipment_3: "Weiss Manfréd WM.50"
 SLO_heavy_fighter_equipment_3_short: "WM.50"
 SLO_heavy_fighter_equipment_3_desc: "WM.50 вирізнявся досить передовою для свого часу конструкцією: дводвигунний літак Ласло Варги з двобалковою схемою та конфігурацією «тягни-штовхай» був покликаний суттєво покращити характеристики двомоторних винищувачів для боротьби з високогірними бомбардувальниками."

 SLO_tac_bomber_equipment_0: "Avia F.39"
 SLO_tac_bomber_equipment_0_short: "F.39"
 SLO_tac_bomber_equipment_0_desc: "Спочатку розроблений компанією Fokker як транспортний літак F.IX, цей борт швидко привернув увагу компанії Avia своїм військовим потенціалом. Отримавши ліцензію на виробництво, Avia переробила F.IX на бомбардувальник F.39. Дуалістична монархія, відчуваючи нестачу бомбардувальників, прийняла F.39 як тимчасове рішення, поки розроблялися нові моделі."
 SLO_tac_bomber_equipment_1: "Letov Š-50"
 SLO_tac_bomber_equipment_1_short: "Š-50"
 SLO_tac_bomber_equipment_1_desc: "Прагнучи задовольнити запит Авіаційного корпусу на багатоцільовий дводвигунний літак з екіпажем із трьох осіб, Letov представила Š-50. Однак проєкт не викликав зацікавлення і так і не пішов у серію; натомість зрештою було обрано розробку компанії Aero."
 SLO_tac_bomber_equipment_2: "Aero Vodochody A.300"
 SLO_tac_bomber_equipment_2_short: "A.300"
 SLO_tac_bomber_equipment_2_desc: "Цей бомбардувальник конструкції Антоніна Гусніка на момент надходження на озброєння був одним із найшвидших літаків у строю, поступаючись лише щойно прийнятому винищувачу B.135. Швидкий та з хорошим корисним навантаженням, він зарекомендував себе як універсальний бомбардувальник і розвідник."
 SLO_tac_bomber_equipment_3: "Weiss Manfréd WM.311"
 SLO_tac_bomber_equipment_3_short: "WM.311"
 SLO_tac_bomber_equipment_3_desc: "WM.31 швидко адаптували під роль швидкісного тактичного бомбардувальника, послабивши наступальне озброєння та збільшивши корисне бомбове навантаження."
 SLO_jet_tac_bomber_equipment_1: "Letov L.11"
 SLO_jet_tac_bomber_equipment_1_short: "L.11"
 SLO_jet_tac_bomber_equipment_1_desc: "Створений на основі проєкту реактивного винищувача від Bayerische Flugzeugwerke, L.11 був перероблений на швидкісний легкий багатоцільовий реактивний бомбардувальник, покликаний замінити застарілий парк поршневих тактичних бомбардувальників Монархії."
 SLO_jet_tac_bomber_equipment_2: "Aero L.44"
 SLO_jet_tac_bomber_equipment_2_short: "L.44"
 SLO_jet_tac_bomber_equipment_2_desc: "Зі зростанням надійності реактивних двигунів та загостренням конкуренції компанія Aero взялася за розробку швидкісного бомбардувальника нового покоління, підсумком чого став проєкт L.44."

 SLO_strat_bomber_equipment_1: "Avia-Dornier Do.19"
 SLO_strat_bomber_equipment_1_short: "Do.19"
 SLO_strat_bomber_equipment_1_desc: "Не маючи власних розробок стратегічних бомбардувальників, Avia закупила партію чотиримоторних бомбардувальників Dornier, аби продемонструвати їхній потенціал військово-повітряним силам."
 SLO_strat_bomber_equipment_2: "Avia-Junkers Ju.290"
 SLO_strat_bomber_equipment_2_short: "Ju.290"
 SLO_strat_bomber_equipment_2_desc: "Avia придбала низку Ju.290 для поповнення невеликого наявного парку Do.19."
 SLO_strat_bomber_equipment_3: "Weiss Manfréd WM.65"
 SLO_strat_bomber_equipment_3_short: "WM.65"
 SLO_strat_bomber_equipment_3_desc: "Проєкт чотиримоторного бомбардувальника Ласло Варги став першим важким бомбардувальником власного виробництва в Імперії."
 SLO_jet_strat_bomber_equipment_1: "Aero-Flugzeugbau Friedrichshafen FF.16"
 SLO_jet_strat_bomber_equipment_1_short: "FF.16"
 SLO_jet_strat_bomber_equipment_1_desc: "Німецький Flugzeugbau Friedrichshafen FF.16 був прийнятий як австрійський дальній бомбардувальник із локалізацією виробництва на заводах Aero Vodochody."

 SLO_scout_plane_equipment_1: "Weiss Manfréd WM.21"
 SLO_scout_plane_equipment_1_short: "WM.21"
 SLO_scout_plane_equipment_2: "Praga E.55"
 SLO_scout_plane_equipment_2_short: "E.55"

 SLO_transport_plane_equipment_1: "Aero A.204"
 SLO_transport_plane_equipment_1_short: "A.204"

###
### SWE - Sweden ###
###

 SWE_fighter_equipment_0: "Svenska Aero J 6 Jaktfalken"
 SWE_fighter_equipment_0_short: "J 6 Jaktfalken"
 SWE_fighter_equipment_0_desc: "Старий винищувач-біплан міжвоєнного періоду, збудований спочатку компанією Svenska Aero у 20-х роках, а згодом — AB Svenska Järnvägsverkstädernas Aeroplanavdelning, що використовувався по всій Скандинавії. Попри ефективність у патрульних і розвідувальних місіях, його час у наших ВПС уже минув, і він більше не відповідає вимогам сучасної повітряної війни."
 SWE_fighter_equipment_1: "Seversky EP-106 J 9"
 SWE_fighter_equipment_1_short: "J 9"
 SWE_fighter_equipment_1_desc: "Винищувач американського виробництва від компанії Seversky. Військова авіація США віддала перевагу його конкуренту — P-36 від Curtiss, проте ця машина надійна та ідеально відповідає нашим потребам для виконання завдань у небі Швеції. Після переговорів Seversky продала нам креслення та права на виробництво, що дозволило налагодити його випуск."
 SWE_fighter_equipment_2: "FFVS J 22"
 SWE_fighter_equipment_2_short: "J 22"
 SWE_fighter_equipment_2_desc: "J 22, розроблений Управлінням королівської авіації в Стокгольмі (FFVS), є нашим першим монопланом власної розробки. Високо оцінений пілотами за відмінну керованість, він також простий в обслуговуванні. Цей літак дозволить ефективно захистити Швецію від будь-яких загроз."
 SWE_fighter_equipment_3: "FFVS J 27"
 SWE_fighter_equipment_3_short: "J 27"
 SWE_fighter_equipment_3_desc: "Повітряна війна зазнала значних змін під час Другої світової війни: через запеклі бої над Балтикою безліч іноземних літаків не змогли повернутися на бази або розбилися на нашому узбережжі. Після захоплення (чи вилучення уламків найбільш невдалих екземплярів) наші технічні підрозділи ретельно вивчили ці новітні машини. Оскільки J 21 не відповідав вимогам до ефективного винищувача, ці дослідження привели до появи J 27 — сучасного літака, натхненного німецькими та американськими напрацюваннями, а найбільше — британським Supermarine «Spitfire». Потужний двигун, висока маневреність, співвісні гвинти протилежного обертання та грізне озброєння... наш «Шведський супер-спітфайр» стане кошмаром для будь-якої країни, яка наважиться на нас напасти!"
 SWE_jet_fighter_equipment_1: "SAAB J 21R"
 SWE_jet_fighter_equipment_1_short: "J 21R"
 SWE_jet_fighter_equipment_1_desc: "Після років досліджень і розробок ми нарешті створили реактивний винищувач. Поршневий J 21 справді не показав себе видатним винищувачем, але став надійною та міцною платформою. Отримавши реактивний двигун і 20-мм гармати, J 21R здатен повноцінно захищати наше небо від повітряних загроз прийдешніх років. Час гвинтів минув — настав час реактивної авіації."
 SWE_jet_fighter_equipment_2: "SAAB 29 Tunnan"
 SWE_small_plane_airframe_5: "SAAB 29 Tunnan"
 SWE_jet_fighter_equipment_2_short: "SAAB 29"
 SWE_small_plane_airframe_5_short: "SAAB 29"
 SWE_jet_fighter_equipment_2_desc: "Після успіху J 21R настав час збудувати новий реактивний винищувач із власним планером, а не перероблений зі старої машини. J 29 став вершиною нашої авіапромисловості: він оснащений передовим радаром, збільшеними паливними баками, ракетами класу «повітря — повітря» та розвиває високу швидкість. Якщо ми продовжуватимемо будувати такі машини, як «Туннан», майбутнє шведського неба буде в безпеці."

 SWE_cv_fighter_equipment_0: "Svenska Aero J 6HS Jaktfalken"
 SWE_cv_fighter_equipment_0_short: "J 6HS Jaktfalken"
 SWE_cv_fighter_equipment_1: "Seversky EP-106 J 9HS"
 SWE_cv_fighter_equipment_1_short: "J 9HS"
 SWE_cv_fighter_equipment_2: "FFVS J 22HS"
 SWE_cv_fighter_equipment_2_short: "J 22HS"
 SWE_cv_fighter_equipment_3: "SAAB J 25HS"
 SWE_cv_fighter_equipment_3_short: "J 25HS"
 SWE_cv_fighter_equipment_3_desc: "Дослідний планер. Попри чудові результати J 25HS на випробуваннях, було виготовлено лише кілька екземплярів до того, як йому на зміну прийшов FFVS J 27."

 SWE_CAS_equipment_1: "Northrop A-17 B 5"
 SWE_CAS_equipment_1_short: "B 5"
 SWE_CAS_equipment_1_desc: "A-17 — американський легкий штурмовик-бомбардувальник, спроєктований і збудований фірмою Northrop. Це проста й надійна машина, легка в обслуговуванні. Її можливості дещо обмежені, але вона чудово виконує роль безпосередньої підтримки наших сухопутних військ. Завдяки американській інженерній школі конструкція планера не є складною, що дозволяє встановлювати зимове обладнання, зокрема лижне шасі."
 SWE_CAS_equipment_2: "SAAB B 17"
 SWE_CAS_equipment_2_short: "B 17"
 SWE_CAS_equipment_2_desc: "Вивчивши новітні штурмові літаки провідних європейських держав, ми успішно створили власну машину, здатну ефективно підтримувати сухопутні війська з повітря. Розроблений фірмою SAAB літак B 17 має високу тягооснащеність, несе солідний бомбовий запас і здатен виконувати бомбометання з пікірування. Його модульне шасі також дозволяє встановлювати лижі або поплавки."
 SWE_CAS_equipment_3: "SAAB A 21"
 SWE_CAS_equipment_3_short: "A 21"
 SWE_CAS_equipment_3_desc: "Saab A 21 спочатку створювався як винищувач під назвою J 21, однак для цієї ролі його льотні характеристики виявилися недостатніми. Попри це, конструкторське бюро Saab зрозуміло, що його планер стане чудовою платформою для штурмовика. Унікальна схема зі штовхальним гвинтом, потужний двигун і багатий вибір озброєння зробили його грізним літаком безпосередньої підтримки."

 SWE_cv_CAS_equipment_1: "Seversky EP-106 B 9HS"
 SWE_cv_CAS_equipment_1_short: "B 9HS"
 SWE_cv_CAS_equipment_1_desc: "Оскільки флот визнав модифіковану версію B 5 незадовільною, наявний варіант J 9HS натомість було доопрацьовано додатковими вузлами підвіски для збільшення бомбового навантаження під ці конкретні завдання."
 SWE_cv_CAS_equipment_2: "SAAB B 17HS"
 SWE_cv_CAS_equipment_2_short: "B 17HS"
 SWE_cv_CAS_equipment_3: "SAAB A 21HS"
 SWE_cv_CAS_equipment_3_short: "A 21HS"

 SWE_nav_bomber_equipment_1: "Hansa-Brandenburg S 12"
 SWE_nav_bomber_equipment_1_short: "S 12"
 SWE_nav_bomber_equipment_2: "SAAB T 17S"
 SWE_nav_bomber_equipment_2_short: "T 17S"
 SWE_nav_bomber_equipment_2_desc: "Морська модифікація літака B 17 розробки Saab. Модульне шасі повністю замінили на поплавки, а хвостову частину вдосконалили для кращої керованості на воді. Це ідеальна машина для морського патрулювання чи ударів по кораблях, яку також можна використовувати як розвідувальний гідролітак для нашого флоту."
 SWE_nav_bomber_equipment_3: "SAAB T 18"
 SWE_nav_bomber_equipment_3_short: "T 18"

 SWE_cv_nav_bomber_equipment_1: "Svenska Aero T/J 6HS Jaktfalken"
 SWE_cv_nav_bomber_equipment_1_short: "T/J 6HS Jaktfalken"
 SWE_cv_nav_bomber_equipment_1_desc: "Старий планер біплана переробили під несення авіаційних торпед — скоріше для перевірки концепції для майбутніх розробок, ніж для масової серії, адже низька швидкість робить його легкою мішенню в реальному бою. Цей проєкт заклав основу для подальшого розвитку шведських морських торпедоносців."
 SWE_cv_nav_bomber_equipment_2: "FFVS T 22HS"
 SWE_cv_nav_bomber_equipment_2_short: "T 22HS"
 SWE_cv_nav_bomber_equipment_2_desc: "Модифікація винищувача J 22HS, адаптована для застосування авіаційних торпед. Завдяки простоті в обслуговуванні літак ідеально підходить для корабельного базування як перша лінія оборони в разі виявлення ворожого флоту."
 SWE_cv_nav_bomber_equipment_3: "SAAB SB 21HS"
 SWE_cv_nav_bomber_equipment_3_short: "SB 21HS"
 SWE_cv_nav_bomber_equipment_3_desc: "Цей поршневий літак став першим і останнім, створеним спеціально як торпедоносець, оскільки невдовзі шведські виробники повністю перейшли на виробництво реактивних машин."

 SWE_heavy_fighter_equipment_1: "SAAB J 19"
 SWE_heavy_fighter_equipment_1_short: "J 19"
 SWE_heavy_fighter_equipment_1_desc: "Наші винищувачі J 6 та J 9 мають суттєві обмеження щодо дальності польоту. У разі війни вони не зможуть супроводжувати наші бомбардувальники або перехоплювати ворожі літаки на далеких відстанях і великих висотах. Ми були змушені розробити новий літак, яким став J 19. Оснащений додатковими паливними баками та 20-мм гарматами, він здатен дістати ворога навіть на значному віддаленні."
 SWE_heavy_fighter_equipment_2: "SAAB J 23"
 SWE_heavy_fighter_equipment_2_short: "J 23"
 SWE_heavy_fighter_equipment_2_desc: "Після успіху J 19 постала потреба покращити його конструкцію та характеристики. J 23, натхненний розробками сусідніх держав, підвищує боєздатність наших ВПС. Радара літак іще не має, проте відпала потреба в підвісних баках. Це надійне рішення для захисту нашого нейтралітету та контролю повітряного простору над Балтійським морем."
 SWE_heavy_fighter_equipment_3: "SAAB J 24"
 SWE_heavy_fighter_equipment_3_short: "J 24"
 SWE_heavy_fighter_equipment_3_desc: "Важчий, більший і міцніший Saab J 24 — перехоплювач останнього покоління. Два потужні двигуни, важке озброєння, герметична кабіна, сучасний радар і місткі баки дозволяють йому виконувати перехоплення навіть у найсуворіших погодних умовах, хай де ховатиметься ворог. Це найкращий літак такого типу, який ми коли-небудь будували."

