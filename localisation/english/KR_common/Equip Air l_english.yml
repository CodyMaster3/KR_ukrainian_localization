 #Laz-9:
 BUL_CAS_equipment_3: "DAR 13"
 BUL_CAS_equipment_3_short: "DAR 13"

 BUL_fighter_equipment_0: "Avia B-34"
 BUL_fighter_equipment_0_short: "B-34"
 BUL_fighter_equipment_0_desc: "Коли Дуалістична монархія відхилила проєкт літака B-34 від компанії Avia, фірма звернулася до експортного ринку, аби повернути свої інвестиції. Відчуваючи нестачу сучасних біпланів, Болгарія прийняла B.34 на озброєння в 1934 році."
 BUL_fighter_equipment_1: "Avia B.534"
 BUL_fighter_equipment_1_short: "B.534"
 BUL_fighter_equipment_1_desc: "У 1932 році відомий богемський інженер Франтішек Новотний розпочав співпрацю з компанією Avia над новим суцільнометалевим біпланом. Ці зусилля увінчалися створенням B-34, який майже був прийнятий на озброєння Дуалістичною монархією замість Phönix. Не втрачаючи надії, Новотний переробив B-34, встановивши новий двигун і шасі, а також повністю закриту кабіну. Як і B-34, цю модель взяли на озброєння болгари, а на відміну від свого попередника, B-534 був прийнятий і Дуалістичною монархією."
 BUL_fighter_equipment_2: "DAR 11 «Лястовиця»"
 BUL_fighter_equipment_2_short: "DAR 11"
 BUL_fighter_equipment_2_desc: "Після успіху свого біплана B-534 Avia незабаром розпочала роботу над ультрасучасним монопланом, яким зрештою став B-135. Він використовував 860-сильний двигун Austro-Daimler V12D і був оснащений 20-мм автоматичною гарматою в носовій частині та двома синхронізованими 8-мм кулеметами в капоті, що забезпечувало чудову маневреність і точний вогонь. Підприємство ДАР отримало права на виробництво літака в Болгарії з огляду на його вражаючі показники на службі в Габсбургів. Попри незначні зміни, внесені фахівцями заводу, машина залишилася майже ідентичною оригіналу."
 BUL_fighter_equipment_3: "DAR 12"
 BUL_fighter_equipment_3_short: "DAR 12"
 BUL_fighter_equipment_3_desc: "Коли розроблений головним конструктором ДАР Цветаном Лазаровим винищувач на базі ДАР-10А було відхилено керівництвом на користь місцевої модифікації B-135 від компанії Avia, він зі своєю командою почав усе з чистого аркуша. Зрештою вони створили абсолютно новий висотний винищувач — перший повністю болгарський літак із герметичною кабіною. Цей винищувач був прийнятий на озброєння болгарських ВПС під позначенням DAR-12."
 #Laz-14:
