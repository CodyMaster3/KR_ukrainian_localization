l_english:
 models_warning.1: "ПОПЕРЕДЖЕННЯ - Відсутні доповнення!"
 models_warning.1.master_event: "Ви використовуєте сабмод 'Kaiserreich Models' без необхідних доповнень. Це може призвести до неправильного відображення моделей, мерехтіння екрану та інших візуальних проблем. Будь ласка відпишіться від відповідного сабмоду або придбайте необхідне доповнення.[ModelsSubmodsEasternFrontWarning][ModelsSubmodsAlliedArmorWarning][ModelsSubmodsAxisArmorWarning]"
 models_warning.1.missing_dlc: "Відсутнє доповнення:\n\n"
 models_warning.1.axis_armor_pack: "$models_warning.1.missing_dlc$§oAxis Armor Pack§!\n\n$models_warning.1.master_event$"
 models_warning.1.aat: "$models_warning.1.missing_dlc$§oArms Against Tyranny§!\n\n$models_warning.1.master_event$"
 models_warning.1.lar: "$models_warning.1.missing_dlc$§oLa Résistance§!\n\n$models_warning.1.master_event$"
 models_warning.1.bba: "$models_warning.1.missing_dlc$§oBy Blood Alone§!\n\n$models_warning.1.master_event$"
 models_warning.1.gtd: "$models_warning.1.missing_dlc$§oGötterdämmerung§!\n\n$models_warning.1.master_event$"
 models_warning.1.bftb: "$models_warning.1.missing_dlc$§oBattle for the Bosporus§!\n\n$models_warning.1.master_event$"
 models_warning.1.nsb: "$models_warning.1.missing_dlc$§oNo Step Back§!\n\n$models_warning.1.master_event$"
 models_warning.1.toa: "$models_warning.1.missing_dlc$§oTrial of Allegiance§!\n\n$models_warning.1.master_event$"
 models_warning.1.dev_main: "Dev Submod - Головна гілка\n\n$models_warning.1.master_event$\n\nЩоб використовувати головну гілку, переконайтеся, що у вас є наступні доповнення: Axis Armor Pack, Allied Armor Pack, Eastern Front Planes Pack, AAT, LaR, BBA, GTD, BTFB, NSB, ToA."
 models_warning.1.a: "Зрозуміло."
 models_warning.2: "ПОПЕРЕДЖЕННЯ - Відсутній сабмод!"
 models_warning.2.desc: "Ви використовуєте один або кілька сабмодів Kaiserreich model без увімкненого сабмоду §oKaiserreich Models - Base Game§!. Це може призвести до неправильного відображення моделей, мерехтіння екрану та інших візуальних проблем. Будь ласка увімкніть сабмод або підпишіться на нього в Steam."
 models_warning_eastern_front_tt: "\n\nВи використовуєте сабмод §oEastern Front Plane Pack§!. Переконйтеся, що ви придбали доповнення 'Eastern Front Plane Pack', або відпишіться. Цей сабмод може спричини §oмерехтіння екрану§! якщо використовувати його без доповнення!"
 models_warning_allied_armor_tt: "\n\nВи використовуєте сабмод §oAllied Armor Pack§!. Переконйтеся, що ви придбали доповнення 'Allied Armor Pack', або відпишіться."
 models_warning_axis_armor_tt: "\n\nВи використовуєте сабмод §oAxis Armor Pack§!. Переконйтеся, що ви придбали доповнення 'Axis Armor Pack', або відпишіться."
