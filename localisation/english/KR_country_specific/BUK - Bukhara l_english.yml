 BUK_yb_weak_loc: "Революційна активність:\n§GРеволюційні рухи тихі або належно придушені.§!\n\n"
 BUK_yb_moderate_loc: "Революційна активність:\n§LТривожні повідомлення про революційну активність у Самарканді.§!\n\n"
 BUK_yb_strong_loc: "Революційна активність:\n§RСамаркандські дисиденти відкрито й активно виступають проти нас!§!\n\n"
 BUK_balancing_act_prewar: "Балансування потреб і бажань фракцій є життєво важливим для безпеки Бухари. Якщо будь-яка з місцевих груп буде незадоволена напрямком розвитку держави, вона може стати §Rнебезпечним п’ятим ешелоном§! для наших численних ворогів! [BUK_get_balancing_act_russia]\n\n"
 BUK_balancing_act_postwar: "Після завершення конфлікту в Центральній Азії та зміцнення нашого контролю над регіоном ми можемо значно спокійніше ставитися до загроз з боку різних фракцій. Однак ми все ще повинні враховувати вплив, який ці групи продовжують мати. [BUK_get_balancing_act_russia]\n\n"
 BUK_balancing_act_prerussia: "Особливо важливо зберігати §cприхильність Росії§!, інакше вони можуть втратити підтримку нашого управління Центральною Азією. Якщо їхнє ставлення до нас буде §RРоздратоване§! або §RЛюте§!, вони можуть анексувати нас після завершення війни в Центральній Азії!"

### Decisions ###
 BUK_balancing_act: "Бухарський баланс влади"
 BUK_balancing_act_desc: "Бухара — це держава, розділена за ідеологічними, релігійними та племінними лініями, і досі майже нічого не зроблено для того, щоб виправити цю ситуацію чи об’єднати ці розрізнені народи. Щоб вести уряд уперед, ці групи потрібно або заспокоїти, або приборкати. §PТрадиціоналісти§!, союзники аталика та значної частини військового апарату, побоюються втрати своїх давніх привілеїв, тоді як §0Реформісти§!, що представляють бюрократію, особливо в напівавтономному самаркандському самоврядуванні, вимагають модернізації та змін.\n\n[BUK_get_balancing_act][BUK_get_yb_strength][BUK_get_young_bukharan_support][BUK_get_atalyk_support][BUK_get_russian_support]"
 BUK_samarkand_timer: "Знатні самаркандці вимагають дій"
 BUK_reformists_timer: "Задушений меджліс вимагає дій"
 BUK_traditionalist_timer: "Військові діячі вимагають дій"

 BUK_war_preparation: "Підготовка до війни"
 BUK_war_preparation_desc: "Бої, що спалахнули в Центральній Азії під час Громадянської війни в Росії та Ташкентської кризи, довели одне: перед шквалом кулеметного вогню й артилерійських обстрілів навіть найзавзятіші воїни не витримують довго. Тож не дивно, що всі центральноазійські держави зосередили увагу на модернізації та централізації своїх армій, готуючись до нового конфлікту, який поставить кожну з недолугих басмацьких армій на випробування.\n\nПоточний рівень підготовки: £GFX_supply_texticon [?BUK_prep|H0]§Y%§!\n\nЯкщо підготовка буде нижче §Y50%§! на момент початку війни, якість наших солдатів постраждає через нашу недбалість.\n"
