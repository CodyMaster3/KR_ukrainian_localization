### Bookmark ###
 BUK_KR_gathering_storm_desc: "Емірат Бухара був винагороджений за підтримку білого руху й залишався непохитним проросійським союзником.\n\nАле реформісти зсередини прагнуть підірвати владу еміра Алімхана, а сусіди Бухари на півночі й заході зазіхають на її багаті землі — майбутнє залишається непевним.\n\nЧи втримається Емірат, чи впаде в смітник історії як ще одна клієнтська держава Москви?"

### Intro Screen ###
 BUK_country_intro_background: "GFX_BUK_intro"
 BUK_country_intro_header: "Бухара і громадянська війна"
 BUK_country_intro_header_1: "Зсередини і ззовні"
 BUK_country_intro_header_2: "Реформа проти реакції"

 BUK_country_intro_content: "Поки в Росії вирувала громадянська війна, рух Молодих бухарців також набрав обертів — у березні 1918 року вони спробували захопити владу в Еміраті Бухара. Їх було рішуче розгромлено; консервативний емір Мухаммед Алімхан намагався зберегти свою абсолютну владу перед обличчям радикалізованого руху, страчуючи червоних емісарів і жорстко придушуючи будь-яке інакомислення. Протекторат встояв, головно завдяки підтримці білого руху. Довоєнні домовленості й угоди були швидко поновлені, і емір із задоволенням пригнічував дедалі бунтівніших підданих за підтримки старих російських союзників.\n\nПісля усунення зовнішньої червоної загрози емір Бухари звернув увагу на підступний радикальний рух у самому місті. Стративши низку видатних реформістів на піку громадянської війни, напруга між консервативним автократичним правлінням еміра та популярним рухом Молодих бухарців загрожувала розірвати місто навпіл. Хоча Алімхан спершу готувався викорінити «ракову пухлину» лібералізму через жорстоку чистку, новини про заплановану різанину дійшли до новоствореного уряду СР/Кадетів у Москві, який сильно натиснув на еміра, змусивши його вести переговори з демократичною опозицією. Під загрозою російського втручання емір негайно взявся за розробку пакету реформ, який би задовольнив Москву, водночас зберігаючи якомога більше влади."
 BUK_country_intro_content_1: "Емір відкрив виборний Комунальний меджліс, який міг подавати пропозиції на розгляд еміра та новоствореної Ради міністрів — призначеного органу зі старших державників, що служили напряму еміру. Як жест примирення з Молодими бухарцями, старший ліберал Мірзо Абдулвохід Мунзім був призначений першим головою Ради міністрів. Ці реформи зняли російський тиск з Бухари й дали народу голос у законодавчих ініціативах, хоча емір неохоче ухвалював будь-що, що потрапляло на його стіл. Утім, Рада міністрів виявилася динамічним органом, і Мунзім очолив низку дрібних реформ, скоротивши бюрократичну надмірність і започаткувавши меритократичні інституції.\n\nПісля перевороту 1929 року та хаосу в Центральній Азії емір зробив свій хід. Відчувши можливість розширити вплив, Алімхан проголосив себе «Захисником Самарканда» й втрутився в конфлікт. Побачивши спустошення Семиріччя, місто прийняло бухарські війська, а командувач армії еміра, дисциплінований Ібрагім-бек, почав готувати облогу. Побоюючись російської або аласької атаки з півночі й визнавши сильного ворога на півдні, Мадамін скасував вторгнення в Самарканд і почав готувати оборону своїх нових територій."
 BUK_country_intro_content_2: "Після конфлікту розкол між еміром і Радою міністрів поглибився, адже ліберальна рада розширила свої повноваження за рахунок влади еміра. Коли здавалося, що Молоді бухарці зможуть змусити Алімхана запровадити конституцію й демократизувати державу, ліберали зазнали серйозного удару — помер їхній фактичний лідер, голова Ради Мірзо Абдулвохід Мунзім. Побачивши шанс повернути хід реформ назад, емір відмовився призначити нового голову, залишивши посаду вакантною, а раду — без керма.\n\nНатомість емір передав більше повноважень консервативному й люто антиросійському аталику Ібрагім-беку, хоча така схема є непопулярною серед народу й дедалі менш ефективною. Джадидські реформатори обурені його правлінням, а багато міністрів вважають новонаділеного аталика скаженим псом, який може втягнути Емірат у конфлікт із Росією. Алімхан не переконаний такими аргументами й вірить, що поки він сидить в Арку Бухари, Емірат залишатиметься непохитним союзником Москви."
 BUK_guide: "Центральноазійські держави отримають §Cдодаткові шляхи та контент§! у майбутніх оновленнях.\n\n£white_dot Бухара стане §Pпатріархальним автократом§!, якщо буде обрано фокус §YДжихад проти джадидизму§!. Інакше вона залишиться §aавторитарною демократією§!.\n£white_dot Якщо Росія стане соціалістичною, Бухара згодом перейде до §Rрадикального соціалізму§! на початку Самаркандської кризи, перед війною з Туркестаном і Хівою."

### Events ###

### Opening Events  ###

 bukhara_events.200.t: "Бухарський баланс влади"
 bukhara_events.200.d: "Бухара — держава, розділена за ідеологічними, релігійними та племінними лініями, і емір Саїд Алімхан та його уряд зробили вкрай мало, щоб виправити цю ситуацію за бурхливе останнє десятиліття. Коли в Росії спалахнула громадянська війна, емір відчайдушно намагався зберегти нейтралітет, боячись, що війна покладе край його правлінню. Він відкинув реформи поміркованого кушбегі Мірзи Насрулли, звільнивши його на користь улюбленця старійшин Нізамаддіна Урганжі. Хоча тверда рука Урганжі та його жорстка реакція на будь-який соціалістичний спротив були схвально сприйняті традиціоналістами й росіянами, він був абсолютно неготовий зцілити глибокі ідеологічні рани, що роздирають Бухару. За десятиліття уряд Урганжі став символом стагнації для лівих, але саме зміни з боку правих сил остаточно зруйнували статус-кво.\n\nІбрагім-бек, племінний лідер зі східної Бухари, який довів свою лояльність і здібності в останні дні громадянської війни, був піднесений еміром до посади аталика — туманної ролі, яку вперше обіймали регенти Золотої Орди. Завдяки нечітким межам своїх нових повноважень Ібрагім-бек розколов традиціоналістську фракцію між старими союзниками кушбегі в улемі, які вважають Росію єдиною перепоною для безбожних соціалістів, і новими племінними та військовими елітами, які бачать у Росії чергового тиранічного гнобителя. Хоча емір особисто глибоко лояльний до Росії, він розглядає Ібрагіма як цінну противагу владі Урганжі й прагне ще більше посилити цього дикого чоловіка зі сходу, якщо конфлікт із реформістами загостриться. Звісно, реформісти — переважно дрібні бюрократи й прогресивні джадидські інтелектуали — сприймають піднесення аталика як екзистенційну загрозу своїй політичній владі, а головне — своєму життю. Вони не дозволять йому закріпити свою владу без боротьби."
 bukhara_events.200.a: "Рано чи пізно всі стануть на коліна!"

 bukhara_events.201.t: "Південний бастіон Москви"
 bukhara_events.201.d: "У порівнянні з буремними днями новорічного перевороту останні п’ять років були періодом миру й стагнації, коли всі сторони заліковують рани й сподіваються на відновлення. Центральна Азія сьогодні — це казан, що ось-ось закипить, де інтелектуали, бандити, революціонери й деспоти намагаються розірвати статус-кво. За кордоном наші союзники в Росії намагаються розібратися в цьому хаосі, складаючи плани й розраховуючи логістику для відновлення порядку в регіоні. Повстанці з Хіви й туркестанські бандити розхитують наші кордони, і роботи в росіян вистачає. Це лише питання часу, коли в Центральній Азії знову спалахне відкритий конфлікт, а армії й ополчення держав регіону залишаються недисциплінованими, недофінансованими й майже небоєздатними. Щоб перетворити селянське збіговисько й самозваних ватажків на справжні армії, знадобиться чимало зусиль — і лише час покаже, як кожна держава планує реформувати свої війська.\n\nОднак одне відомо напевно — §Rмир 1929 року не триватиме.§!"
 bukhara_events.201.a: "Маємо бути напоготові!"

 bukhara_events.202.t: "Чорний понеділок дістався Бухари"
 bukhara_events.202.d: "Як би нам не хотілося це визнавати, Бухара — економічний майданчик для авантюрних російських і німецьких промисловців, які давно бачили в нашій державі невикористане джерело бавовни, що чекає на експлуатацію. Роки ми пожинали плоди цієї співпраці, навіть коли наша економіка дедалі більше залежала від голодних європейських ринків. І ось, після економічного краху в Берліні й Москві, настав момент істини. Тюки бавовни гниють на складах і станціях, іноземні агенти й спекулянти масово тікають, компанії банкрутують, а паніка шириться. Коли пил осяде, нам доведеться зібрати уламки й врятувати все, що можна, готуючись до відновлення світових ринків, щоб знову заробляти золоті марки й рублі."
 bukhara_events.202.a: "О ні!"

 bukhara_events.203.t: "Надзвичайна нарада міністрів"
 bukhara_events.203.d: "Після спустошення, спричиненого крахом Чорного понеділка, емір і його кушбегі скликали серію нарад з усією Радою міністрів, щоб затягнути паски й оговтатися від економічного спаду. Спільної позиції знайти не вдалося — кожен міністр більше дбає про підтримку планів своїх покровителів, ніж про компроміс і пошук найкращого рішення. Кушбегі Нізамаддін Урганжі запропонував примусову відставку дорогих військових проєктів і їхніх лобістів. Він вважає, що хоча емір навряд чи підтримає скорочення армії, тимчасові труднощі можна пережити завдяки тіснішій координації з Росією, що дозволить спрямувати більше коштів на порятунок економіки.\n\nЙому рішуче протистоїть аталик і його військові союзники, які натомість пропонують жорстку кампанію проти корупції як засіб відновлення фінансової ініціативи, зберігаючи при цьому силу армії для захисту від дедалі агресивніших сусідів. Звісно, навіть він розуміє, що гроші не ростуть на деревах, але наполягає на тому, що інвестиції в армію створять робочі місця й зміцнять здатність еміра збирати податки та приборкувати корупцію.\n\nРосіяни ж вважають, що жодна з фракцій Ради міністрів не має життєздатного плану порятунку Емірату. Натомість їхні покровительські міністри запропонували передати широкі повноваження «незалежному» комітету технократів і експертів для реформування бухарської економіки. Звісно, більшість таких технократів будуть росіянами — факт, який важко прийняти більшості бухарців, включно з еміром."
 bukhara_events.203.a: "Маємо посилити армію!"
 bukhara_events.203.b: "Скоротити бюрократію й затягнути паски."
 bukhara_events.203.c: "Звернутися до російських радників."

 bukhara_events.204.t: "Вбивство Мірзи Насрулли"
 bukhara_events.204.d: "У переддень проголошення Ташкентської ради та втягування Центральної Азії в вир громадянської війни кушбегі Мірза Насрулла тісно співпрацював із російським агентом Олександром Міллером над пакетом ліберальних реформ, щоб заспокоїти лівих у Еміраті й зберегти стабільність держави. Однак Насрулла не зміг переконати еміра ухвалити ці «Квітневі реформи» й зрештою втратив політичний капітал, підтримку еміра та росіян, після чого був безцеремонно звільнений на користь кушбегі Нізамаддіна Урганжі. Росіяни згодом пошкодували про свою відмову від Насрулли, особливо коли їм довелося працювати з Урганжі, намагаючись відновити його провалені пропозиції у 1921 році. Емір же майже повністю забув про цього старого державника. За останні п’ять років Насрулла повернувся з політичного вигнання у східних бейліках і став шахвалом — міністром закордонних справ — головно завдяки підтримці Росії. На цій посаді він зарекомендував себе як гнучкий і розсудливий лідер, створюючи компромісні коаліції між росіянами та реформістами для просування важливих торговельних і дипломатичних реформ.\n\nОднак у великій «грі» впливу між кушбегі та його традиціоналістами, аталиками, росіянами й реформістами жодна фігура не застрахована від небезпеки. Після урочистого бенкету Мірза Насрулла раптово захворів і помер уночі, після чого його швидко поховали урядовці. Ніхто не зміг з’ясувати, хто наказав його нічне поховання, і багато хто — особливо серед росіян і реформістів — вважає, що Насруллу отруїли вороги. Ймовірними підозрюваними є кушбегі або аталик. Дехто навіть натякає на причетність еміра, і чутки лише посилюються, поки Алімхан мовчить, а отруйник залишається на свободі."
 bukhara_events.204.a: "Може, це просто стрес від роботи?"

 bukhara_events.205.t: "Знатні самаркандці просять допомоги"
 bukhara_events.205.d: "Економічна криза охопила всі верстви й регіони нашої держави, і можливості вислухати окремі скарги підданих губляться на тлі загального стогону занепаду. Проте є особи, чий голос завжди чути — завдяки їхньому впливу або здатності достукатися до еміра. У Самарканді Емірат Бухара зміг утвердити бодай якусь владу над містом і його околицями лише завдяки мовчазній підтримці ради міських лідерів, що прийшли до влади під час Ташкентської кризи.\n\nТепер ці самі лідери звертаються до нас із проханням надати допомогу для відновлення міста після економічного краху. Насправді це складне завдання — хоча Бухара є столицею Емірату, Самарканд — більш розвинене місто, і в ідеальному світі саме Бухара просила б допомоги у сильнішого сусіда. Але це також чудова нагода зміцнити наші зв’язки із Самаркандом і трохи скоротити його автономію. Зрештою, ми технічно лише «захисники» Самарканда, і наша підтримка зараз може перетворити цей статус на щось більш зобов’язуюче."
 bukhara_events.205.a: "Гаразд, зробимо все, що зможемо!"

 bukhara_events.206.t: "Аталик вимагає дій"
 bukhara_events.206.d: "У міру зростання напруги в Центральній Азії, особливо між нашою державою та бандитським князівством самозванця Мадаміна Бека, дедалі більше голосів закликають уряд до рішучих дій — належного оснащення й підготовки армії, здатної протистояти туркестанським, перським чи афганським провокаціям. Найгучнішим голосом у цьому таборі є аталик, який наполегливо вимагає реформ міліції, армії та інтендантських служб.\n\nЗвісно, більшість із запропонованих змін випадково посилюють владу аталика та його союзників, але він не єдиний, хто вважає ситуацію терміновою, а перспективи — невтішними. Росіяни також почали тиснути на еміра, сподіваючись, що з огляду на загострення ситуації на заході вони зможуть менше уваги приділяти нашому регіону, покладаючись на боєздатну автономну бухарську армію. Хоча між росіянами й аталиком немає особливої дружби чи координації, їхні об’єднані голоси створили серйозний тиск на еміра та його кушбегі."
 bukhara_events.206.a: "Гаразд, зробимо все, що зможемо!"

 bukhara_events.207.t.normal: "Реформісти вимагають реформ"
 bukhara_events.207.t.complete: "Реформісти схвалюють наші реформи"
 bukhara_events.207.d.normal: "Комунальна рада — демократичний дорадчий орган при емірі, створений у межах Квітневих реформ — по суті, позбавлена реальної влади. Її повноваження були сильно обмежені поправками еміра, а смерть невтомного лідера Мірзи Абдулвахіда Мунзіма ознаменувала кінець її значущості. Емір скористався вакуумом влади, щоб заблокувати створення нового органу, передаючи дедалі більше контролю над державою до рук неліберального аталика. Хоча колишні радники більше не є офіційними членами уряду, вони залишаються впливовими політичними фігурами, які разом формують неформальну реформістську фракцію бюрократії та вільний політичний союз / таємне товариство Молодих бухарців.\n\nХоча реформістам бракує реального політичного впливу, вони мають широку мережу зв’язків серед населення й адміністрації. Вони активізували зусилля, щоб домогтися серйозних інституційних реформ, чинячи тиск через критику, ретельно сформульовану, щоб пройти цензуру, і поширювану через газети та з вуст у вуста. Ми можемо просто ігнорувати цих набридливих критиків, але очевидно, що вони очікують дій і будуть розчаровані, якщо ми просто сидітимемо склавши руки."
 bukhara_events.207.d.complete: "Комунальна рада — демократичний дорадчий орган при Емірі, створений у межах Квітневих реформ, по суті є політичним тілом без зубів. Її повноваження були сильно обмежені поправками Еміра, а смерть невтомного лідера Мірзи Абдулвахіда Мунзіма ознаменувала кінець її значущості. Емір скористався вакуумом влади, щоб заблокувати створення нового органу, передаючи дедалі більше контролю над державою до рук неліберального аталика. Хоча колишні радники більше не є офіційними членами уряду, вони залишаються впливовими політичними фігурами, які разом формують неформальну реформістську фракцію бюрократії та вільний політичний союз / таємне товариство Молодих бухарців.\n\nХоча реформісти рідко хвалять наш уряд, наші останні зусилля з реформування центральної бюрократії Емірату привернули увагу багатьох провідних діячів їхнього руху. Ліберальна преса, яка часто відзначається подвійною риторикою — коли критика ховається за похвальними словами на адресу Еміра — цього разу щиро висловила зацікавленість і підтримку останніх зусиль щодо оновлення та оптимізації роздутої бюрократії."
 bukhara_events.207.a: "Спробуймо не ігнорувати їх."
 bukhara_events.207.b: "Чудово!"

 bukhara_events.208.t: "Міллер зустрічається з Мансуровим"
 bukhara_events.208.d: "Хоч емір і любить уявляти, що його радник Олександр Міллер є його лояльним підлеглим, правда в тому, що він має мало реального контролю над російським агентом, який перебуває в центрі неформального контролю Москви над еміратом. За свою плідну кар’єру як людина Росії в Бухарі, Міллер довів, що він надзвичайно вправний політик, зробивши себе незамінним як для російського президента, так і для бухарського еміра. Більше за все, Міллер прагматичний — він підтримував нейтралітет Бухари на піку громадянської війни, придушив попередні російські плани повалити еміра одразу після Ташкентської кризи та допоміг провести автономістське крило товариства Молодих Бухарців через зростання націоналістичного духу останнього десятиліття.\n\nСаме ця остання роль тепер привела Міллера до будинку багатого бухарського прогресивного лідера Мухіддіна Мансурова, провідної постаті в русі Молодих Бухарців. Міллер не чужий закулісним угодам із демократичною опозицією в місті, саме його переговори з ними під час громадянської війни запобігли республіканській революції, і він тісно співпрацював із ліберальними діячами над розробкою реформ, які він запропонував після неї. Хоча офіційно їхня зустріч — не більше ніж соціальний візит між двома найвпливовішими людьми Бухари, почали ширитися чутки про таємні теми їхньої вечірньої розмови. Найпоширеніша версія стверджує, що Мансуров запросив Міллера до свого будинку з єдиною метою переконати його, що емір стримує Бухару від того, щоб бути продуктивним і ефективним союзником Росії, і що республіка, очолювана Молодими Бухарцями, краще служила б інтересам Москви, якби їм дозволили взяти владу. Нібито Мансуров навіть виклав потенційний план, за яким його союзники могли б ізолювати та усунути найзапекліших антиросійських союзників еміра за умови підтримки та запевнень від Москви.\n\nЦі чутки одностайно закінчуються твердженням, що Міллер відреагував на ці плани,..."
 bukhara_events.208.a: "...розгнівано вибігши."
 bukhara_events.208.b: "...уважно слухаючи."

 bukhara_events.209.t: "Низька якість уніформи"
 bukhara_events.209.d: "У багатьох аспектах престиж королівства є його найціннішою валютою. Коли атрибути монархії відсутні, це лише питання часу, коли піддані почнуть сумніватися в праведності їхнього становища. Ніде це не є важливішим, ніж у лавах армій емірату, солдати яких одягнені в строкату мішанину уніформ. Останніми роками робилися спроби уніфікувати одяг наших солдатів, але кожна спроба була зірвана через розкрадання ресурсів і змішані пріоритети.\n\nНещодавній парад, призначений для святкування річниці дня народження нашого чудового еміра та його сходження на посаду правителя Бухари, закінчився ганьбою, оскільки ми не змогли знайти достатньо добре одягнених людей, щоб поповнити лави, залишивши парад демонстрацією наших невдач. Ця катастрофа знову винесла це питання на перший план серед низки наших військових лідерів, які попросили нас докласти спільних зусиль для створення єдиної універсальної бухарської уніформи прийнятної якості, принаймні для тих людей, які мають брати участь у щорічних святкових парадах!"
 bukhara_events.209.a: "Замінити ці ганчірки!"
 bukhara_events.209.b: "Зовнішність — не все..."

 bukhara_events.210.t: "Купці зазнають нападів бандитів"
 bukhara_events.210.d: "Хоча міста Бухара і Самарканд добре охороняються місцевими ополченнями та солдатами еміра, сільська місцевість емірату залишається переважно беззаконною землею. Місцеві племена роблять усе можливе, щоб підтримувати мир серед своїх, але ніхто не патрулює торговельні шляхи, які є основою нашої економіки. Хоча наша мозаїка губернаторів і племінних лідерів зуміла підтримувати колеса комерції в русі, хоча й повільно, деякі купецькі родини прийшли безпосередньо до Арка, просячи нашої допомоги. За їхніми словами, банди бандитів захопили контроль над південними перевалами між Карші та Самаркандом, задушивши торгівлю в регіоні. Хоча наші сили більш ніж здатні забезпечити ці проходи, нам довелося б відтягнути наших людей з інших постів, що потенційно зробило б нас вразливими в інших місцях. Зрештою, чому ми повинні фінансувати охорону купецьких караванів, коли вони могли б так само легко заплатити за це самі?"
 bukhara_events.210.a: "Забезпечити зброю для цих караванів."
 bukhara_events.210.b: "Вони можуть найняти власну охорону!"

### Post War Organisation ###

 bukhara_events.700.t: "Пережити Самаркандську кризу"
 bukhara_events.700.d: "Хоча в офіційних звітах йдеться про «антитерористичну операцію» проти басмацьких повстанців, а газети й чиновники голосно проголошують, що наша перемога над цими відсталими племенами була «неминучою» і що вони «розсипалися так само легко, як піддалися спокусі диявола», насправді багато хто в столиці з полегшенням зітхає. Перемога над Туркестаном, Хівою, казахами та власними бунтівними громадянами була далеко не гарантованою. Конфлікт довів нашу армію й уряд до межі, поставивши під загрозу всі реформи, здійснені за останні кілька років. Прикро визнавати, але ми повинні дякувати росіянам за наше спасіння — саме їхня переважаюча військова сила розгромила ворогів і врятувала нашу державу. Правду важче проковтнути, ніж зручну брехню, і навіть зараз міські глашатаї та газети розповідають пишномовні історії про бухарську доблесть на полі бою."
 bukhara_events.700.a: "Ми знову вистояли перед бурею!"

 bukhara_events.701.t: "Фігури у Великій грі"
 bukhara_events.701.d: "Сто років тому степи Центральної Азії були ареною Великої гри між Британією та Росією — дипломатичного протистояння за контроль над регіонами між російським серцем і Британською Індією. Спадщина цієї боротьби проявилася навіть у вирі громадянської війни, коли британські солдати втрутилися, щоб захистити білий Ашгабат, заклавши основу для його повернення під контроль Ірану. Хоча Велика гра фактично завершилася (один із гравців вийшов), великі держави досі тримають кермо над нашою батьківщиною. Навіть сьогодні наша держава — лише одна з багатьох фігур на шахівниці Москви, і ми змушені схилятися перед волею наших ляльководів. Росія могла врятувати нас від агресії Туркестану й Хіви, але питання залишається — що буде далі? Ми сподіваємося, що Москва визнає нас відповідальним партнером і передасть контроль над новопідкореними територіями, але в повітрі витають чутки, що, розчарувавшись у постійній нелояльності місцевих, росіяни готуються анексувати весь регіон. Якби вони справді пішли на таку зраду, ми не змогли б їм протистояти — наші сили виснажені, а адміністрація фактично під їхнім контролем.\n\nВтім, у нас є один козир, який може допомогти переконати російських військових і політичних лідерів. Ми можемо мобілізувати підтримку серед російських радників і бізнесменів, що перебувають у Бухарі, й надіслати їх на північ, щоб вони виступили за нову, бухарську главу в історії Центральної Азії. Якщо ці лідери задоволені нашим управлінням і ефективністю «місцевого» уряду, вони можуть переконати Москву передати нам контроль над регіоном. Але якщо агенти російського впливу незадоволені нашим правлінням — ми не матимемо жодного впливу на рішення, які ухвалюватимуться в Москві, і які матимуть доленосні наслідки для нашої держави."
 bukhara_events.701.a: "Залучити російських союзників до лобіювання в Москві!"
 bukhara_events.701.b: "Ми довіримося рішенню Москви."
 bukhara_events.701.c: "На жаль, у нас немає вибору — доведеться довіритися Москві..."

 bukhara_events.702.t: "Вирішення питання Центральної Азії"
 bukhara_events.702.d.nolobby: "Тепер, коли ми забезпечили контроль над більшою частиною Центральної Азії, постає питання — що робити з цими територіями, а також із нашим колишнім бухарським васалом на півдні. Традиційно ми керували регіоном через поєднання прямого військового управління (у Закаспії та Російському Туркестані) та клієнтських королівств (у Хіві та Бухарі) — заплутана система, яка часто приносила більше клопоту, ніж користі. Останніми роками наші союзники-васали виявилися сумнівно лояльними й не надто компетентними, що змусило багатьох виступити за більш пряме управління цим бунтівним регіоном. Інші ж наполегливо закликають створити єдину «незалежну» тюркську державу, стверджуючи, що саме поділ регіону дозволив повстанням розростись, і попереджаючи, що витрати на управління Центральною Азією перевищать будь-які вигоди від прямого контролю. Через нечітку інформацію про регіон, стан союзників і ефективність нашої адміністрації ми змушені покладатися на поради російських радників Емірату, які доповіли нам про ситуацію в столиці та надали чимало бажаних (і небажаних) рекомендацій.\n\nОднак наші люди на місцях розділилися в думках: одні просувають еміра як близького союзника нашого режиму, інші виступають за створення нової республіканської влади, а треті — за анексію Емірату й реорганізацію Центральної Азії в керований російський регіон. Збереження еміра як номінального лідера нової центральноазійської держави могло б сприяти миру в регіоні, а ісламська монархія — стати корисним пропагандистським інструментом для налагодження зв’язків із Близьким Сходом. З іншого боку, емір перешкоджає модернізації, а серед тюркської інтелігенції зростає попит на республіку під місцевим керівництвом. Найпростіший шлях — просто анексувати землі для цілісного управління, але це, ймовірно, викличе гнів місцевого населення. Без чітких вказівок від експертів у Бухарі рішення залишається за урядом."
 bukhara_events.702.d.baselobby: "Наші люди на місцях рішуче виступають за певну форму місцевого правління в Туркестані, попереджаючи про небезпеку анексії для національної єдності та про її високу ціну в крові й золоті. Втім, далі їхні думки розходяться. Деякі агенти в Бухарі налагодили тісні зв’язки з еміром і його союзниками, інші — з реформістськими бюрократами, які давно прагнуть запровадити сучасну республіканську владу. Ці позиції розмиваються ще й тим, що багато наших адміністраторів взагалі байдужі до майбутнього уряду регіону. Вони вважають, що ні республіка, ні Емірат не є очевидним вибором: збереження еміра як символічного лідера могло б сприяти стабільності, а ісламська монархія — стати корисним інструментом для зовнішньої політики. Водночас емір гальмує модернізацію, а серед тюркської інтелігенції зростає попит на республіку. Враховуючи ці суперечності, більшість агентів радять підтримати ту форму правління, яка найкраще відповідає нашим союзникам і ідеології."
 bukhara_events.702.d.replobby: "Наші люди на місцях рішуче виступають за місцеве правління в Туркестані, попереджаючи про небезпеку анексії для національної єдності та про її високу ціну. Наші агенти успішно інтегрувалися в місцеву владу й переконані, що з їхньою допомогою можна створити сильний і лояльний центральноазійський уряд, який захищатиме наші інтереси. Найбільше вони зблизилися з реформістськими бюрократами Бухари, які давно прагнуть створити сучасну республіку. Наш провідний агент у регіоні, Олександр Міллер, вже виклав детальний план усунення еміра, стабілізації регіону й створення нового союзного уряду. Оскільки наші агенти майже одностайно підтримують створення нової республіки в нашій сфері впливу, ігнорувати їхню думку було б нерозумно."
 bukhara_events.702.d.monlobby: "Наші люди на місцях рішуче виступають за місцеве правління в Туркестані, попереджаючи про небезпеку анексії для національної єдності та про її високу ціну. Наші агенти успішно інтегрувалися в місцеву владу й переконані, що з їхньою допомогою можна створити сильний і лояльний центральноазійський уряд, який захищатиме наші інтереси. Найбільше вони зблизилися з еміром і його оточенням, просуваючи його як ключову фігуру нашого контролю над регіоном. Незалежно від нашого ставлення до монархії, факт залишається фактом — емір є найближчим союзником Москви в Бухарі й може стати безцінним активом. Оскільки наші агенти майже одностайно підтримують розширення Емірату як опори нашої сфери впливу, ігнорувати їхню думку було б нерозумно."
 bukhara_events.702.a: "Це надто складно — анексуймо їх!"
 bukhara_events.702.b: "Надаймо їм контроль над регіоном і збережімо еміра"
 bukhara_events.702.c: "Створімо нову Центральноазійську республіку в нашій сфері!"

 bukhara_events.703.t: "Незручна тиша"
 bukhara_events.703.d: "Незручна тиша нависла над двором у Бухарі. Чутки про російські обговорення майбутнього Центральної Азії починалися з оптимізму — з пошепки обіцяли бухарське панування над усім регіоном як вірного союзника Росії, з палкими дискусіями про географічні та адміністративні межі. Але з кожним днем ці чутки з Москви ставали дедалі рідшими, а росіяни в нашій адміністрації — дедалі мовчазнішими, збираючись у невеликі групи, гаряче обговорюючи щось у кутках і замовкаючи при появі наших агентів. Не треба бути генієм, щоб зрозуміти, що відбувається — з перших днів нашої перемоги були ознаки того, що, попри нашу лояльність, росіяни вирішили, що вся Центральна Азія має управлятися як частина Росії. Останні зміни в атмосфері лише підтвердили наші найгірші побоювання, а зростаюча кількість російських солдатів, що прибувають до нашої держави «для підтримання миру та ліквідації залишків басмацького повстання», видає справжні наміри Москви. Емір дедалі більше ізольований і має мало вибору, окрім як підкоритися волі Москви — і з отриманням листа з запрошенням до російської столиці, схоже, його час в Арку добігає кінця."
 bukhara_events.703.a: "Емір сідає на поїзд на північ із важким серцем."

 bukhara_events.704.t: "Росія надає нам контроль"
 bukhara_events.704.d: "Свято в Арку! Зібрання на вулицях! Нашій великій державі надано контроль над усією Центральною Азією як вірному союзнику великої Росії. Століття служби нарешті принесло плоди влади. Великі уми Москви нарешті визнали нашу важливість як охоронця півдня та опікуна численних мусульманських племен Центральної Азії. Російська армія вже почала передавати адміністрацію окупованих територій, оскільки її частини відкликаються в інші регіони. Звісно, нам доведеться швидко розширити бюрократію та армію, щоб забезпечити ці нові землі, і ми продовжимо покладатися на росіян для стабільності та підтримки — отже, немає особливої потреби витісняти москвичів: зрештою, кожен російський солдат на посту — це один бухарець менше! Як би там не було, майбутнє наших земель виглядає яскравим, і емір уже готує парад на честь цієї нової глави в історії Бухари!"
 bukhara_events.704.a: "Чудово!"

 bukhara_events.705.t: "Великий парад"
 bukhara_events.705.d: "Емір, частково сформований своїм перебуванням у Санкт-Петербурзі, є прихильником елегантних і пишних демонстрацій військової могутності Емірату. Хоча його мрії про грандіозні паради часто розбиваються об бідність Бухари та військову корупцію, йому все ж вдалося сформувати зародкову «парадну культуру» в Еміраті. Сьогодні цей прогрес був продемонстрований у повній красі — підрозділи бухарської армії, ветерани численних битв по всій Центральній Азії, марширували містом як справжні професіонали. Звісно, ілюзію спокою порушив перехожий, який почав закликати до громадянського протесту — але порядок швидко відновився після його передчасної загибелі під копитами гордого бухарського драгуна. Коли пил осів, стало зрозуміло: настав час еміру створити нову державу — Емірат усього Туркестану! Без сумніву, попереду будуть труднощі, але емір засвоїв одне — немає заміни наполегливості."
 bukhara_events.705.a: "Нове сонце сходить над Центральною Азією!"

 bukhara_events.706.t: "Moscow Requests the Emir's Presence"
 bukhara_events.706.d: "Jubilation in the Ark! Gatherings in the street! Our grand realm has been granted dominion over the whole of Central Asia, as loyal allies of the great Russian nation. A century of service has finally borne the fruits of power. The great minds of Moscow finally realised our importance as a guardian of the south and as a steward of the numerous Muslim tribes of Central Asia. The Russian military has already begun the process of handing over administration of the various occupied regions, as units are called elsewhere. Of course, we will need to rapidly expand our bureaucracy and military to secure these new lands, and we will continue to rely on the Russians for stability and support, meaning that there is little impetus to push any of the Muscovites out - after all, every Russian soldier manning a post is one less Bukharan! The Russians have requested Emir Alim Khan to join them in Moscow to celebrate this new chapter, and to further discuss future Russian military planning as we together turn towards the German dogs who helped to fund the Turkestani and Khivan rebels. The Emir has excitedly gathered his family and a number of leading officials to join him in this grand tour of Bukhara's greatest ally."
 bukhara_events.706.a: "The Emir boards a train north, excited for the future!"

 bukhara_events.707.t: "The [GetMonth] Putsch"
 bukhara_events.707.d: "A coup is made considerably easier for every loyal or motivated man on the inside of a government: they ease transitions, lend legitimacy and credibility to new figures, and isolate and confuse those who would be most detrimental to the success of the plotters. In the case of Bukhara, just about every man remaining on the inside was at least amenable to the Russian plot to overthrow the Emir and install a new caretaker republican government. When the order was given, Russian soldiers and some key native military officers stormed the Ark looking to capture Ibrahim Bek. The wild Uzbek chieftain did not intend to go quietly, and a brief and violent confrontation within the fortress claimed the lives of about thirty men, Ibrahim included. Immediately the plotters moved to install a new government, pulling Jadid leaders, moderate military figures, and minor nobles into the fortress. The Emir had betrayed the realm to Germany, they were informed, and was going to be placed under house arrest upon his arrival in Moscow. Bukhara, and Central Asia as a whole, would be reformed into a new republic, to avoid the dangers of a disloyal Emir from ever again selling our lands to foreign rulers.\n\nThe Russians have scrambled to find figures willing to take part in a new government. While the majority of the bureaucracy cares little for the nuances of politics, it is considerably more difficult to find a figure willing to be a figurehead for this new regime. Many are wary that the public's opinion will be stridently against a new president, while others are philosophically opposed to the idea of leading any sort of ‘puppet' administration. However, with the aid of some loyal ideologues and after a mixture of threats and promises, the increasingly worried Russian agents were able to convince eminent Jadid leader Mahmudkhodja Behbudiy to take up the republican mantle as a new caretaker president. With his (tepid) support, the new republican future seems bright."
 bukhara_events.707.a: "Cut out deadwood to make way for a bright future!"

 bukhara_events.708.t: "Our New Regime in Turkestan"
 bukhara_events.708.d: "After some preparation, we have been incredibly successful in our mission to depose the Emir and replace him with a Republican government. Any large-scale resistance against our manoeuvres died with the Uzbek chief Ibrahim Bek, who fought to the end against the forces we sent to subdue him. Most factions and forces within the old Emirate have pledged themselves to our new allied government under the caretaker leadership of the well regarded Jadid progressive Mahmudkhodja Behbudiy. While Behbudiy is free-spirited and unlikely to fully bend to our directives, he will have to rely on our agents to support his regime, and his goal of modernising the region broadly aligns with our own. If he proves to be too slippery, we could simply call for elections in the new Republic of Turkestan to bring a new, more pliable native into power. As it stands, we have gained a valuable buffer state and erstwhile ally in the south, with precious little expenditure of resources and rubles on our part. Of course, only time will tell whether this puppet state proves to be more trouble than it is worth, but in the meantime we should simply reap the rewards of a coup-well-plotted."
 bukhara_events.708.a: "Towards a more reasonable future in Central Asia!"

 bukhara_events.709.t: "The Uncomfortable Diarchy"
 bukhara_events.709.d: "The weeks following the establishment of our new republican government have been both stormy and exciting. Various ancient laws have been stripped from the books, oppositional officials purged, and a fresh air of reform hangs in the air. The Young Bukharan Party, since renamed to the Young Turkestan Party, has secured their grip on the various rungs of government, with Mahmudkhodja Behbudiy acting as a wary mediator between the various factions of the liberal movement, many who would rather see this new republic free of Russian influence. The Russians themselves, however, have made exceptional progress in their goals to leverage control over the republic, fostering support in a small band of radical republican reformists, who see Moscow as a model of modernism which Turkestan would do well to replicate. Abdurauf Fitrat, in part coloured by his experiences with the Ottoman Young Turk movement, has become a lighthouse for those feeling that Behbudiy and the Jadid old guard are too moderate, and a number of young proteges have found themselves rapidly elevated by tacit Russian support, securing several cabinet positions and vital bureaucratic positions for this new clique of new nationalists. Of course, the progressive and moderate Jadids have pushed back against this new galvanised movement, claiming that they represent Russian imperial intervention into the republic's governance. As various posts are filled by Russian agents with ‘ideologically loyal' natives, a government within the government has grown stronger and stronger - creating a diarchy between Russian backed junior officers and the various old-guard idealists they nominally report to. To their credit, these two factions are united by many of their goals and their shared experiences fighting against the oppression of the Emir, leading to many opportunities for genteel ideological debate and bipartisan reform efforts."
 bukhara_events.709.a: "Daggers in the shadows, but smiles in the halls."

 bukhara_events.710.t: "Rise of the Republic!"
 bukhara_events.710.d: "Тижні після створення нашого нового республіканського уряду були надзвичайно насиченими. Різні стародавні закони було скасовано, опозиційних чиновників — усунуто, і в повітрі витає дух реформ. Партія Молодих бухарців, перейменована на Партію Молодого Туркестану, закріпилася на всіх щаблях влади, а Махмудходжа Бехбуді проявив себе як стійкий посередник між фракціями ліберального руху, багато з яких прагнуть бачити нову республіку вільною від російського впливу. Багато джадидів, які співпрацювали з еміром, сподіваючись провести реформи під його контролем, опинилися в складному становищі, оскільки їхні радикальніші однодумці використовують антимонархічні настрої. Бехбуді дедалі більше стає захисником цих «старих лібералів», тоді як радикальні фракції об’єднуються навколо прогресивного лідера Абдурауфа Фітрата. Хоча дехто побоюється, що ці «болючі зростання» можуть призвести до небезпечного розколу в Партії Молодого Туркестану, більшість визнає, що серед її лідерів — зокрема Бехбуді й Фітрат — достатньо прихильників компромісу, щоб зберегти єдність у найближчі роки. Зміцнивши контроль над органами влади, Партія Молодого Туркестану розробляє грандіозні плани революціонізувати майбутнє Центральної Азії."
 bukhara_events.710.a: "Триразове «Слава республіці!»"

 bukhara_events.711.t: "Питання Закаспійської губернії"
 bukhara_events.711.d: "З появою нового протекторату на півдні постало суперечливе питання: що робити із Закаспійською губернією. У 1929 році Хіва фактично захопила цю територію, і слід визнати, що це було популярне рішення серед місцевого населення. Можливо, буде розумніше узаконити це відокремлення, передавши губернію під контроль держави [BUK.GetNameDef]."
 bukhara_events.711.a: "Вони на це заслуговують."
 bukhara_events.711.b: "Вона залишиться російською."
### Fired by Focus ###

 bukhara_events.1000.t: "Проблеми з дрібними землевласниками"
 bukhara_events.1000.d: "Хоча переважна більшість плантацій і сільськогосподарських угідь у нашому краї належить обраній групі заможних землевласників, є низка мусульманських фермерів, які ледве виживають у конкуренції з купецькими елітами та російськими компаніями. Поки на графіках великих фермерів та їхніх друзів у адміністрації еміра показники зростають, багато фермерів перебувають за крок від втрати своєї землі через борги перед іноземними кредиторами або втрати тих скромних заощаджень, які їм вдалося накопичити. Ці фермери нещодавно почали координуватися між собою, щоб об’єднати ресурси та виручати один одного з боргів, проект, який значною мірою підтримує невелике аграрно-соціалістичне крило партії Молодих Бухарців. Наші друзі з плантацій попросили нас втрутитися, перш ніж цей новий рух вийде з-під контролю — адже ці дрібні землевласники асоціюються з соціалістичними радикалами та використовують комунальні практики, щоб підірвати наших союзників. Особи з оточення двору запевняють нас, що арешт одного з лідерів за звинуваченням у корупції швидко змусить інших підкоритися. Однак ці відважні мусульманські фермери є одними з останніх залишків нашого краю, не зачеплених хваткою Москви, і нам варто двічі подумати, перш ніж жертвувати ними, щоб догодити нашим друзям."
 bukhara_events.1000.a: "Придушити цих комуністів у зародку"
 bukhara_events.1000.b: "Залишити цих фермерів у спокої"

 bukhara_events.1001.t: "Проблеми з офіцерами"
 bukhara_events.1001.d: "Хоча в нашій армії є деякі незначні впливи Османської імперії та Британії, найбільший вплив мають наші російські партнери, які залишили найглибший слід на регулярних армійських підрозділах, що дедалі більше стають гордістю еміра. З іншого боку, нерегулярні племінні сили, які формували основу нашої армії з часів громадянської війни, перебувають під повним контролем Ібрагіма Бека, затятого антиросійського традиціоналіста, який твердо перешкоджав будь-якому реальному впливу Москви на ці сили. З новим підвищенням Ібрагіма Бека до посади аталика емірату, він намагався відібрати контроль над регулярними армійськими підрозділами Лашкаря у російських спостерігачів і тренерів, але без особливого успіху. Однак нещодавнє рішення провести парад цих підрозділів стало ще одним полем битви для двох конкуруючих таборів у бухарському військовому апараті, змусивши Кушбеггі Нізамаддіна Урганджі вкотре намагатися переконати еміра стримати свого улюбленого атакуючого пса. Ібрагім Бек вимагав, щоб жоден російський громадянин не брав участі в майбутньому параді, і щоб жоден росіянин не сидів поруч із еміром під час цього демонстраційного показу національної сили. Звичайно, Кушбеггі попередив, що така дія буде серйозною образою для наших найближчих союзників, і до того ж можуть виникнути проблеми з відстороненням наших менш компетентних підрозділів від їхніх навчених російських офіцерів — адже ми не хочемо, щоб хтось почав марширувати в неправильному напрямку."
 bukhara_events.1001.a: "Залишити російських радників і гостей у строю"
 bukhara_events.1001.b: "Це святкування бухарської могутності, а не російського контролю!"

 bukhara_events.1002.t: "Аталик звинувачує в корупції"
 bukhara_events.1002.d: "На думку Кушбеггі Нізамаддіна Урганджі, навіть зламаний годинник буває правильним двічі на день. Хоча він має мало спільного з аталиком Ібрагімом Беком, навіть він погоджується, що значні елементи королівського двору надзвичайно корумповані. Звичайно, його власні друзі та родина, які стали надзвичайно багатими після його призначення на посаду Кушбеггі, просто пощастило — немає жодного шансу, що найнадійніший радник еміра міг би бути корумпованим.\n\nНа превелике полегшення Урганджі, Ібрагім Бек нещодавно зосередив свою увагу виключно на вільному альянсі реформаторських бюрократів та їхніх покровителів серед руху Молодих Бухарців, купців і росіян. Кушбеггі потрібно прийняти рішення: дозволити Ібрагіму Беку влаштувати хаос у бухгалтерських книгах і особистих скарбницях реформаторів може втамувати його жагу до крові та справедливості, і врятувати тих, хто близький до нього, від подібної уваги.\n\nОднак, коли двері відчиняться, навряд чи Ібрагім Бек задовольниться викоріненням лише кількох липких бюрократів. Може бути кращою ідеєю просто вимагати, щоб Кушбеггі та його офіс взяли контроль над цими останніми розслідуваннями щодо корупції, дозволяючи Урганджі тримати звинувачення відносно під контролем."
 bukhara_events.1002.a: "Дозволити Ібрагіму Беку розгулятися."
 bukhara_events.1002.b: "Тримати це обмеженим і під контролем."

 bukhara_events.1003.t: "Питання бюрократичного суверенітету"
 bukhara_events.1003.d: "Наше рішення подолати нещодавню економічну катастрофу за допомогою росіян викликало гнів з несподіваного джерела — реформаторів. Щодо питання російського втручання та допомоги нашій державі, зазвичай аталик Ібрагім Бек нарікає на неодноразові поступки нашого краю вимогам Москви, але коли він це робить, ліберальні еліти завжди найголосніше виступають проти нього. У цьому випадку аталик мовчить, надувшись через те, що ми проігнорували армію на користь порятунку економіки, тоді як ліберали скаржаться на небезпеку технократичного впливу на державу. Звичайно, якщо читати між рядків, стає зрозуміло, що це не більше ніж димова завіса для легітимізації особистих скарг групи місцевих «економістів», які вважають, що їхні відпустки на навчання в Берліні, Петрограді та Стамбулі дають їм право диктувати відновлення краю. Звичайно, ми могли б заспокоїти ці голоси, надавши кільком більш прийнятним прикладам аудієнцію з нашими російськими експертами та змусивши їх прийняти деякі пропозиції від давніх членів двору, хоча це, ймовірно, буде розцінено як образа тими, хто зараз працює над виправленням корабля держави."
 bukhara_events.1003.a: "Змусити їх вислухати наших економістів"
 bukhara_events.1003.b: "Ігнорувати цих нарікальників і дати росіянам працювати!"

 bukhara_events.1004.t: "Втеча баронів"
 bukhara_events.1004.d: "Після нещодавнього економічного краху навіть найзахищеніші та найлояльніші російські власники плантацій покидають емірат, щоб шукати своєї долі на батьківщині. За словами деяких наших інформаторів, нарікання почалися ще до нещодавнього спаду, коли все більше капіталістів бачили, що їхні дні полічені через зростання впливу аталика Ібрагіма Бека, який давно і голосно закликав до 'смерті всіх язичницьких іноземних дияволів' і 'знищення безбожних бавовняних полів'.\n\nХоча очевидно, що Ібрагім Бек не керує Бухарою, він дедалі більше привертає увагу еміра, змушуючи багатьох росіян задуматися, коли їхній час у Бухарі може бути перерваний. Звичайно, переважна більшість великих землевласників залишилася, і наш лояльний Кушбеггі Нізамаддін Урганджі об’їздив основні плантації, запевняючи цих вірних підприємців, що ми залишаємося відданими їхньому процвітанню та добробуту, особливо коли ми вкрай потребуємо їхніх грошей."
 bukhara_events.1004.a: "Нам шкода, що вони йдуть."

 bukhara_events.1005.t: "Нарікання серед офіцерів"
 bukhara_events.1005.d: "Нещодавно ми отримали петицію від кількох наших старших офіцерів, які просять нагородити їхніх підлеглих широкими медалями та відзнаками, які ми обіцяли лише місяць тому. Ці підвищення були запропоновані як компенсація за ігнорування деяких старих балакунів, і, здається, багато хто поставив свою репутацію перед молодшими солдатами на ці нагороди та грошові призи. Хіба вони не бачать, що ми перебуваємо в розпалі економічної руїни? Це вина офіцера, який обіцяє скарби та славу своїм молодшим офіцерам, а не держави, коли ці обіцянки не виконуються. Цим парадним генералам доведеться проковтнути свою гордість, що є сумнівною перспективою. Натомість, ймовірно, вони отруюватимуть вуха рядових солдатів і скаржитимуться Ібрагіму Беку, чия ненависть до Кушбеггі та фінансових офіцерів є благодатним ґрунтом для сумних історій цих старих балакунів. У будь-якому випадку, ми буквально нічого не можемо зробити, окрім як підірвати наше відновлення від руїни на користь підживлення цих его."
 bukhara_events.1005.a: "Їм просто доведеться проковтнути свою гордість"

 bukhara_events.1006.t: "Звіт квартирмейстера за [GetMonth]"
 bukhara_events.1006.d: "Наше нещодавнє переглянення готовності до збройного конфлікту проти наших сусідів показало, що ми катастрофічно не готові до відкритої війни. Багато складів, зазначених у запилених книгах і позначених на картах, стоять порожніми, окрім зброї, яку тримають охоронці, що патрулюють вигаданий арсенал. Ті підрозділи, які озброєні, часто виглядають строкато, з невідповідними уніформами та озброєнням, де одні використовують сучасну надлишкову зброю, а інші змушені користуватися нарізними гвинтівками та грубими списами.\n\nЩоб протидіяти цим недолікам, офіцери та квартирмейстери вимагають нового вливання грошей для закупівлі іноземних надлишкових гвинтівок, щоб краще підготувати наших солдатів. На жаль, більшість цих офіцерів і квартирмейстерів надзвичайно корумповані, і є питання, чи дійде значна частина будь-яких мішків грошей до ринків зброї, або чи ящики зі зброєю дійсно потраплять до рук наших воїнів чи заповнять склади."
 bukhara_events.1006.a: "Дати цим офіцерам те, що їм потрібно."
 bukhara_events.1006.b: "Ми просто не можемо собі цього дозволити."

 bukhara_events.1007.t: "Зустріч із східними вождями"
 bukhara_events.1007.d: "Локаї — третя за величиною узбецька племінна група у східній Бухарі, сукупність малих сімейних кланів, які невпинно боролися за владу та вивищення в еміраті. На цьому шляху вони нажили ворогів серед сусідів і покійного еміра, здобувши репутацію безрозсудних і диких порушників спокою, які зроблять усе, щоб збільшити свою владу та закріпити своє становище. На короткий момент здавалося, що емір збирається розчавити локаїв і придушити цих порушників, але насильство російської громадянської війни зробило затятих фундаменталістів племені локаїв дуже цінним товаром.\n\nУ наступні роки вождь локаїв знайшов слух молодого еміра, ставши провідним радником і військовою постаттю, перш ніж нещодавно був підвищений до посади аталика емірату, потенційно найвищої посади в краї. Відтоді клани локаїв розгулюють над своїми сусідами, порушуючи межі традицій і ігноруючи несприятливі рішення місцевих казі. Обурені племінні лідери потроху просочилися до столиці, шукаючи слуху Кушбеггі та еміра, щоб врегулювати низку їхніх менш значних скарг. Вони зібралися разом, обіцяючи значні внески від своїх побратимів на національну справу, якщо емір приборкає свого пса, але його величність не поспішає карати Ібрагіма Бека, і знадобиться серйозне наполягання від Кушбеггі та інших, щоб змусити його вислухати цих ображених старійшин."
 bukhara_events.1007.a: "Підтримка малих племен занадто цінна"
 bukhara_events.1007.b: "Ворог мого друга — мій ворог"

 bukhara_events.1008.t: "Робота з 'Міллеровими казі'"
 bukhara_events.1008.d: "Традиційно право надавати печатки посади є значною перевагою, яка дає відповідному органу уряду широкі повноваження щодо складу цієї посади. У випадку з казі, магістратами або суддями наших шаріатських судів, які також виконують функції посередників, опікунів сиріт, вчителів і наглядачів за громадськими роботами, печатки посади традиційно надавалися самим еміром через його міністрів і за порадою улемів. Реформи Олександра Міллера, запроваджені через Квітневий маніфест, закликали до фундаментальної реформи системи казі, дозволяючи обирати деяких суддів казі місцевими радами та надаючи Комунальному Маджлісу право розподіляти печатки посади цим обраним суддям.\n\nПісля фактичного закриття Маджлісу після смерті Мірзо Абдулвахіда Мунзіма практика обрання казі практично припинилася, оскільки немає органу, який би розподіляв печатки для цих осіб. Тим не менш, досі є низка діючих суддів, обраних у перші дні реформ, які часто тлумачать фікх у більш ліберальному ключі, ніж консервативні улеми, часто посилаючись на племінне право, суфійський містицизм і місцеві практики при винесенні своїх рішень. Улеми наполегливо закликають нас відкликати печатки у низки найбільш єретичних суддів казі, хоча юридичних прецедентів для цього мало."
 bukhara_events.1008.a: "Вони небезпечні єретики."
 bukhara_events.1008.b: "Вони служили нам достатньо добре."

 bukhara_events.1009.t: "Перетасувати парванчі та токсабабаші?"
 bukhara_events.1009.d: "Парванчі (майстер церемоній) і токсабабаші (начальник штандартів) є одними з менших офіцерів, призначених еміром для служби при його дворі, головним чином зайнятих дрібними справами гобеленів, помпезності та церемоній. Останніми роками ці посади більш-менш 'продавалися' багатим меценатам корони, причому останнім дуетом стали кілька видатних узбецьких купців, які використали свої новопридбані посади, куплені за розкішні подарунки еміру, як засіб винагороди своїх ділових партнерів у текстильній торгівлі. Хоча їхня корупція очевидна, ці люди мають друзів по всьому емірату, серед бюрократів, дворянства і особливо в нині мовчазному Маджлісі, де багато їхніх колег-купців вимагають демонтажу нашого божественного абсолютизму. Усунення їх може виявитися непопулярним, але еміра легко переконати у вигодах, коли він побачить, скільки вони коштують скарбниці щороку."
 bukhara_events.1009.a: "Позбутися цих корумпованих паразитів"
 bukhara_events.1009.b: "У них занадто багато союзників!"

 bukhara_events.1010.t: "Усунення мір-ахора та караулбегі?"
 bukhara_events.1010.d: "Мір-ахор, або майстер коней, є почесною посадою в еміраті, навіть якщо сучасність ставить під сумнів роль найшляхетніших створінь у війні. Сучасна роль частково моделювалася за зразком російського конюшого, з подібними обов’язками щодо стайні еміра та розведення військових коней. Центральна скарбниця виділяє цій посаді значні суми золота для закупівлі та оснащення коней еміра упряжжю, кінською бронею та для придбання племінних жеребців, що робить цю роль прибутковою, а також почесною для більш безпринципних призначенців. Нинішній мір-ахор — колишній бейлік з одного зі східних узбецьких племен, якого поважають традиціоналісти та емір, але беззаперечно непридатний для своєї ролі. За його перебування стайні занепали, що спонукало Кушбеггі виступити за його заміну.\n\nКараулбегі, з іншого боку, досить компетентний, але, на жаль, близький до аталика Ібрагіма Бека. Хоча Кушбеггі особисто може бажати його усунення, є мало доказів його некомпетентності, і мало шансів, що Алім-хан ризикне засмутити свого придворного фаворита, щоб усунути його."
 bukhara_events.1010.a: "Вигнати цього стародавнього мір-ахора!"
 bukhara_events.1010.b: "Традиціоналісти були б у люті..."

 bukhara_events.1011.t: "Заміна мірзабаші?"
 bukhara_events.1011.d: "Мірзабаші, або головний секретар, є життєво важливим елементом нашого щоденного управління. Маючи вплив на всіх рівнях уряду та координуючи роботу з різними міністрами, російським агентом Олександром Міллером і навіть аталиком, мірзабаші займає унікальну позицію для впливу на державну політику. Хоча наш нинішній мірзабаші безумовно ефективний, його дедалі більше розглядають як маріонетку Олександра Міллера та його команди російських радників, які занадто залучені до підтримки нашої адміністрації. Деякі наші шпигуни бачили, як він зустрічався з росіянами за межами Арка, можливо, плануючи усунення еміра або його найлояльнішого Кушбеггі та заміну їх більш податливою фігурою для Москви. Вже після закінчення російської громадянської війни Міллер намагався усунути Кушбеггі Нізамаддіна Урганджі, і між цими двома немає втраченої любові. Створивши деякі творчі докази участі мірзабаші в змові та поширивши ці докази еміру, ми були б виправдані в його усуненні, але ймовірно, що самі росіяни розпізнають цю хитрість, що може зіпсувати робочі відносини, які ми з ними вибудували."
 bukhara_events.1011.a: "Усунути цю московську маріонетку!"
 bukhara_events.1011.b: "Ми не можемо дозволити собі засмутити наших російських гостей"

 bukhara_events.1012.t: "Розкриття змови аталика"
 bukhara_events.1012.d: "Кушбеггі Нізамаддін Урганджі не є другом лібералізму, соціалізму, прогресивізму чи будь-яких '-ізмів' загалом. Він набагато більше зосереджений на благочесті, традиціях і підтримці чесноти. Звичайно, не його глибокі знання догм привели до його призначення еміром на посаду головного міністра в 1917 році, а його прийнятність для росіян і передбачувана млявість, які підняли його вгору по сходах. У десятиліття після його підвищення Урганджі провів більшу частину свого життя, борючись проти сил реформ і радикалізму, неодноразово перехитрюючи Комунальний Маджліс, щоб зірвати їхні спроби змінити фундаментальні основи нашого емірату.\n\nПроте дивні часи створюють дивних союзників, і драматичний підйом жорстокого та фанатичного узбецького племінника Ібрагіма Бека до невизначено потужної ролі аталика загрожує зруйнувати ретельно вибудувану та хитко збалансовану машину держави Урганджі. Замість того, щоб знешкоджувати Маджліс і стравлювати фракційну лівицю одну проти одної, Ібрагім Бек 'вирішив' демократичну проблему з крайнім насильством і повним ігноруванням традицій краю, змусивши колись безкермових і сварливих реформаторів згуртуватися та зміцнити свою рішучість проти правої руки еміра.\n\nУ міру радикалізації демократичної опозиції радикалізувався і аталик. Насправді, Кушбеггі нещодавно розкрив змову Ібрагіма Бека, спрямовану на провокацію 'контрольованої' революції в столиці, щоб виправдати широкомасштабну чистку Молодих Бухарців та їхніх союзників. Цей план надзвичайно небезпечний — що, якщо революціонери вийдуть з-під контролю? Що робитиме Ібрагім Бек, коли вулиці Бухари заллються кров’ю? Кушбеггі доведеться вирішити, де він стоїть: він може зібрати ліберальну опозицію разом і представити еміру всебічну справу проти аталика, детально описуючи небезпечне ставлення Ібрагіма Бека та його численні перевищення повноважень і вимагаючи позбавлення його деяких надмірних неформальних повноважень. Звичайно, він також може спробувати долучитися до змови аталика. Зрештою, аталик є фаворитом еміра, і немає гарантії, що петиція до нього призведе до якихось дій. Хоча Ібрагім Бек, безумовно, вимагатиме повного підпорядкування Кушбеггі в адміністрації після чистки, і союз із ним віддасть контроль над державою жадібному воєначальнику, це може бути найкращим шансом Урганджі вижити."
 bukhara_events.1012.a: "Емір не може ігнорувати свого Кушбеггі та підданих!"
 bukhara_events.1012.b: "Краще бути підлеглим Ібрагіма Бека, ніж його жертвою"

 bukhara_events.1013.t: "Новий голова Маджлісу"
 bukhara_events.1013.d: "Пів десятиліття емір використовував вакансію, що залишилася після смерті великого Мірзо Абдулвахіда Мунзіма, щоб обмежувати молодий і переважно дорадчий законодавчий орган емірату. Однак після нещодавнього конфлікту між аталиком і Кушбеггі, який завершився на користь ліберальної опозиції, емір фактично змушений громадською думкою та наполяганнями своїх російських радників повернути лібералів до влади. Для цього він знову скликав Маджліс, пообіцявши схвалити будь-кого, кого вони оберуть головою.\n\nУ ліберальному таборі Молоді Бухарці розгорнули бурхливу діяльність, коли різні партійні функціонери намагаються здобути роль нового обличчя відновленого Маджлісу. На чолі стоїть реформатор освіти старої гвардії та письменник Мунаввар Корі, чия довга служба в найближчому оточенні Мунзіма надає йому певної легітимності, а його майстерність в ораторському мистецтві та текстах відома.\n\nЙого головним опонентом є Мухіддін Мансуров, один із найбагатших людей у Бухарі. Без його фінансової підтримки рух Молодих Бухарців давно б згас, а його роль головного редактора відомої газети «Сонце» дала йому значний вплив, коли ліберали були поза урядом. На жаль для Мансурова, його таджицьке походження викликає занепокоєння у багатьох, хто вважає, що емір ніколи не дозволить неузбеку зайняти таку значну посаду.\n\nЗвичайно, є також темна конячка — старий, мудрий і переважно аполітичний таджицький поет Садріддін Айні. Хоча Айні також страждає через своє таджицьке походження, деякі вказують на нього як на постать, яка може бути найбільш прийнятною для еміра, оскільки він далекий від радикального крила партії і не такий політично активний, як його опоненти. Якщо Корі та Мансуров поринуть у особливо неприємні сварки, ті, хто втомився від більш огидного боку політики, можуть побачити Айні, поважного та старшого поета, у зовсім новому світлі."
 bukhara_events.1013.a: "Мунаввар Корі забезпечує свою перемогу"
 bukhara_events.1013.b: "Мухіддін Мансуров нарешті отримує віддачу від інвестицій"
 bukhara_events.1013.c: "Садріддін Айні висунутий як компроміс"

 bukhara_events.1014.t: "Емір поступається"
 bukhara_events.1014.d: "Зустріч відбулася в темній кімнаті в будинку друга Мухіддіна Мансурова, прихована від сторонніх очей міста. Настрій учасників був далекий від приємного — між реформаторами та Кушбеггі Нізамаддіном Урганджі мало втраченої любові. Однак те, чого бракувало ночі у дружбі, вона більш ніж компенсувала нагальністю ситуації та рішучістю всіх залучених членів вижити. Об’єднані цією місією, дві групи, які довго були заклятими ворогами, склали надзвичайно ґрунтовну справу проти аталика, перш ніж разом вирушили протистояти еміру під покровом темряви.\n\nХоча емір був шокований і засмучений тим, що його перервали ввечері невеликою армією радників, міністрів і ворогів держави, він швидко зрозумів, що справа ясна. Після довгих вагань і умовлянь він був змушений прийняти низку вимог цієї групи, включаючи скорочення контролю аталика над певними військовими підрозділами, заміну обраного Ібрагімом Беком командира палацової гвардії на лояліста Кушбеггі та нечіткі обіцянки відновити статус-кво 1920-х років. Хоча ніхто з присутніх не впевнений, що емір дотримуватиметься цих змін, швидка підтримка їхнього маневру російськими агентами майже забезпечила їхню позицію. З аталиком, що відступає, залишається питання, чи втримає Кушбеггі свою провідну позицію, чи його змете хвиля оптимізму серед більш радикальних членів 'Анти-Аталицького пакту'."
 bukhara_events.1014.a: "Пес нарешті приборканий."

 bukhara_events.1015.t: "Оксамитова чистка"
 bukhara_events.1015.d: "Коли Кушбеггі принизився перед аталиком та його союзниками, він швидко з’ясував, наскільки близько Ібрагім Бек був до запланованого військового перевороту. Він уже почав збирати лояльних солдатів у столиці, використовуючи свою дружбу з командиром палацової гвардії, щоб просувати лоялістів локаїв на позиції, добре придатні для ізоляції міста, щоб викурювати реформаторів.\n\nНа щастя, і, відверто кажучи, несподівано, аталик був дуже відкритий до пропозицій свого нового союзника, і незабаром Кушбеггі спровокував кілька модифікацій його планів. Замість того, щоб ходити від дверей до дверей із загонами лояльних солдатів, щоб очистити місто від усіх інакомислячих, Кушбеггі запропонував використати повноваження еміра, щоб арештувати найбільш ненависних реформаторів протягом кількох днів, перш ніж викорінити нелояльних із бюрократії та армії. Хоча деякі ліві щури можуть заритися і вижити в цій більш 'стратегічній' чистці, Кушбеггі зміг переконати Ібрагіма Бека зрозуміти, що з наростанням напруги ми не можемо ризикувати нашими солдатами у вогняному протистоянні в столиці. Тепер ці двоє стоять пліч-о-пліч проти будь-якого лібералізму, хоча Кушбеггі вже почав помічати, що його контроль над кораблем держави вислизає, оскільки його підлеглі дедалі частіше звертаються до аталика за вказівками та командами."
 bukhara_events.1015.a: "Необхідна жертва для порятунку держави"

 bukhara_events.1016.t: "Розробка нової конституції"
 bukhara_events.1016.d: "Відтоді, як 'Квітневий маніфест' 1917 року був задушений у зародку, ліберальні сили Бухари вимагали ухвалення конституції, яка б зміцнила демократичний процес і забезпечила базові права для громадян емірату. Хоча за часів піку впливу старшого державного діяча Мірзо Абдулвахіда Мунзіма як голови Комунального Маджлісу була надія, що він за підтримки ліберального російського уряду зможе провести конституцію через органи управління, роки після його смерті не лише зруйнували ці надії, але й загрожували скасувати будь-який прогрес у демократизації нації.\n\nЗ відновленням Маджлісу та призначенням нового голови еміром, настав час створити юридичні основи для сучасної та ліберальної монархії. Звичайно, жодна конституція не зможе бути ухвалена без певної підтримки еміра та Кушбеггі, що означає, що багато радикальних членів ліберального руху будуть розчаровані отриманим документом. Зокрема, емір одержимий російською конституцією 1906 року, що означає, що, на жаль, вона мусить слугувати основою наших пропозицій.\n\nПісля довгих обговорень Конституційний комітет подав кілька проєктів пропозицій на розгляд Кушбеггі та голові. Не дивно, що комітет зажадав, щоб повноваження недемократичної Ради міністрів були передані Комунальній раді, а лазівки, які використовував емір для обходу законодавчого органу, були ліквідовані. Крім того, вони закликали до реформування провінційних урядів, щоб надати більше повноважень місцевим радам, зокрема можливість обирати та призначати посадовців амлакдарів і суддів казі.\n\nКушбеггі відповів на цю пропозицію кількома коментарями, заявивши, що проєкти документів потрібно буде дещо модифікувати, щоб вони були прийнятними для еміра. Зокрема, він закликав до того, щоб емір зберігав право призначати деяких міністрів, щоб право скасовувати монарші вето було ще більше обмежено, а права громадян, які можна тлумачити як 'комуністичні', були вилучені з документа. Хоча ймовірно, що Кушбеггі лише намагається зберегти повноваження своєї власної посади, правда в тому, що він добре відчуває думки еміра, і ми не повинні легковажно ставитися до його рекомендацій."
 bukhara_events.1016.a: "Піти за більш розширеною версією"
 bukhara_events.1016.b: "Прислухатися до пропозицій Кушбеггі"

 bukhara_events.1017.t: "Дилема Кушбеггі"
 bukhara_events.1017.d: "Хоча дехто вважав би нашу перемогу над повстанцями та нашими заздрісними сусідами доказом ефективності нашого королівського управління, Кушбеггі на власні очі бачив, як близько ми були до поразки і як сильно нам довелося покладатися на росіян, щоб вижити. Останні роки остаточно довели важливість сильної держави та небезпеку революційного населення, залишивши Кушбеггі з серйозною дилемою.\n\nРеформи, якими б огидними вони не були, необхідні. Кушбеггі провів більшу частину останніх тижнів, розробляючи та складаючи конституцію, яка б кодифікувала багато адміністративних і політичних реформ, розроблених за останні місяці, водночас захищаючи Кушбеггі та еміра від примх жорстоких революціонерів. Звичайно, Кушбеггі тісно дотримувався положень Квітневого маніфесту та улюбленої еміром російської конституції 1906 року для створення власного проєкту, і, як наслідок, його конституція далека від мрій Молодих Бухарців та їхніх однодумців.\n\nНе дивно, що делегація лібералів прийшла до Кушбеггі з проханням врахувати їхні побажання, представивши йому радикальну пропозицію реформувати уряд краю шляхом консолідації Ради міністрів і Комунальної ради в один орган разом із деякими іншими положеннями, які б обмежили повноваження еміра. Хоча такий крок лише послабив би нашого славного еміра та його Кушбеггі, правда в тому, що ліберальна опозиція відіграла ключову роль у захисті емірату від терору правління Ібрагіма Бека, і подальша координація з ними може критично зміцнити наш стабільний контроль над краєм."
 bukhara_events.1017.a: "Триматися своєї позиції"
 bukhara_events.1017.b: "Врахувати лібералів"

 bukhara_events.1018.t: "Робота з конституційним питанням"
 bukhara_events.1018.d: "Десятиліттями двір нашого краю був домом для шарлатанів, підлих магів, поклонників диявола та іноземних псів — багатьох, хто невпинно вимагав, щоб нашого славного еміра закували в кайдани зачарованих слів. Ця 'конституція' нібито зачарувала б нашого великого лідера, дозволяючи цій чудовиській кабалі іноземних агентів і боягузливих атеїстів захопити контроль над краєм. На щастя, своєчасне втручання нашого аталика Ібрагіма Бека запобігло здійсненню цього підлого плану, і тепер, коли наш двір очищено від їхніх гріхів, у залах Арка мало говорять про 'конституції'.\n\nПоки аталик тримає двір, є лише один голос, який шепоче про переваги письмових меж влади — російський агент і неохочий союзник Ібрагіма Бека Філіп Панов. Панов, старий друг Бориса Савінкова та давня російська постать у найближчому оточенні еміра, давно стверджував, що аталик міг би серйозно виграти від створення власної конституції, яка б позбавила останні залишки влади послабленого Кушбеггі та зміцнила б хватку аталика над державою.\n\nЗвичайно, більшість у найближчому оточенні аталика знають, що сама концепція конституції плює на честь еміра. Зрештою, якщо він божественно призначений, то чому він повинен бути підвладний якомусь шматку паперу? Такий огидний документ був би нечистою плямою на нашому краї! З іншого боку, ідея використання чаклунства наших ворогів проти них є спокусливою, і Панов висунув кілька переконливих аргументів, підкріплених його важливістю як посередника між Бухарою та Москвою. Сам емір висловив певну зацікавленість у такому документі, можливо, вважаючи себе новим, більш шляхетним Миколою II."
 bukhara_events.1018.a: "Скласти конституцію, що зміцнить нашу владу"
 bukhara_events.1018.b: "Ми правимо божественною силою, а не словами відьом!"

 bukhara_events.1019.t: "Бухарська конституція, частина 1" #демократична
 bukhara_events.1019.d: "Вступ (статті 1–2) проголошує, що Емірат Туркестану є 'єдиним і неподільним' під величчю еміра, встановлює обов’язкове використання придворної перської та узбецької мов у деяких державних установах і збройних силах, водночас визнаючи захищене використання таджицької, сартської, туркменської, киргизької, казахської та бухарської мов у місцевих органах влади.\n\nРозділ перший (статті 3–17) стосується божественних і суверенних повноважень еміра, перелічуючи його прерогативи як монарха Туркестану. Емір володіє правом вето на обрання голови Маджлісу та ухвалення законодавства (з можливістю подолання вето двома третинами голосів), має верховне командування збройними силами, право карбувати монети, надавати помилування, єдиноосібно призначати Кушбеггі та призначати Істінаф за схваленням улемів. Емір може призначити аталика як верховного командувача збройними силами, хоча ця особа не має законодавчих чи адміністративних повноважень поза військовою сферою.\n\nРозділ другий (статті 18–32) стосується питань регентства, якщо емір є неповнолітнім, із віком повноліття у шістнадцять років і правом призначати регента, наданого Маджлісу, при цьому Кушбеггі гарантовано входить до регентської ради.\n\nРозділ третій (статті 33–36) стосується вступу на престол, присяги вірності, яку мають скласти всі чоловіки емірату 'згідно з їхньою вірою та законом', а також численних титулів, що належать еміру та його сім’ї, разом із описом королівської печатки та державного герба.\n\nРозділ четвертий (статті 37–40) стосується відносин емірату з різними релігіями, які сповідують його піддані. Суннітський іслам проголошений державною релігією, і емір зобов’язаний сповідувати цю релігію. Ті, хто сповідує інші течії ісламу, а також юдеї, християни та язичники, отримують гарантію повної релігійної свободи."
 bukhara_events.1019.a: "Цікаво..."

 bukhara_events.1020.t: "Бухарська конституція, частина 2"
 bukhara_events.1020.d: "Розділ п’ятий (статті 41–54) стосується прав і обов’язків чоловіків-громадян Туркестану. Громадянам гарантується захист від свавільного арешту та незаконного обшуку й вилучення, обмежене право на подорожі, право володіти приватною власністю, свобода зібрань, свобода вираження поглядів, свобода створювати профспілки та подібні організації, а також свобода релігії. Військова служба та сплата податків є обов’язковими для всіх чоловіків-підданих.\n\nРозділ шостий (статті 55–62) стосується ухвалення законів. Стаття 56 вимагає схвалення еміра та Маджлісу для всіх законів, тоді як стаття 57 дозволяє 'конструктивне схвалення' еміра через подолання вето двома третинами голосів у Маджлісі. Стаття 58 дозволяє еміру видавати обов’язкові укази, коли Маджліс не засідає, хоча ці укази втрачають силу, якщо не будуть схвалені Маджлісом протягом місяця після їх введення. Еміру заборонено використовувати укази для зміни Конституції чи законів, що стосуються виборів.\n\nРозділ сьомий (статті 63–77) регулює роботу Маджлісу. Є лише один законодавчий орган — Комунальна рада, або Маджліс. Рада міністрів ліквідується. Маджліс зобов’язаний збиратися принаймні раз на рік, але емір може розпустити його в будь-який час, за умови, що нові вибори будуть призначені протягом місяця. Члени Маджлісу обираються на п’ятирічний термін за системою непрямого голосування, де місцеві підрозділи з трьохсот до п’ятисот чоловіків-громадян висувають делегата для голосування від їхнього імені. І Маджліс, і емір можуть пропонувати законодавство, включаючи поправки до конституції. Маджлісу заборонено використовувати свої бюджетні повноваження для відмови у запитах на фінансування чи людські ресурси від армії — якщо Маджліс відмовляє у такому запиті без схвалення еміра, він повинен надати фінансування на рівні попереднього року."
 bukhara_events.1020.a: "До демократичного майбутнього!"

 bukhara_events.1021.t: "Бухарська конституція, частина 1" #змішана
 bukhara_events.1021.d: "Вступ (статті 1–2) проголошує, що Емірат Туркестану є 'єдиним і неподільним' під величчю еміра, встановлює обов’язкове використання придворної перської та узбецької мов у деяких державних установах і збройних силах, водночас визнаючи обмежені гарантії використання таджицької, сартської, туркменської, киргизької, казахської та бухарської мов у місцевих органах влади.\n\nРозділ перший (статті 3–19) стосується божественних і суверенних повноважень еміра, перелічуючи його прерогативи як монарха Туркестану. Емір володіє верховною суверенною владою, і суворе підкорення його наказам вимагається Аллахом. Емір має широкі прерогативи і є особисто недоторканним, йому надано верховне командування збройними силами, право карбувати монети, надавати помилування, єдиноосібно призначати більшість міністрів, включаючи Кушбеггі. Емір володіє правом перешкоджати обранню голови Маджлісу та ухваленню законодавства, і це право вето може бути подолане лише трьома чвертями голосів Маджлісу. Емір може призначити аталика як верховного командувача збройними силами, хоча ця особа не має законодавчих чи адміністративних повноважень поза військовою сферою.\n\nРозділ другий (статті 20–34) стосується питань регентства, якщо емір є неповнолітнім. Вік повноліття становить шістнадцять років, і Кушбеггі виконує обов’язки регента еміра з регентською радою, поділеною між міністрами попереднього уряду та членами, призначеними Маджлісом.\n\nРозділ третій (статті 35–38) стосується вступу на престол, присяги вірності, яку мають скласти всі чоловіки емірату 'згідно з їхньою вірою та законом', а також численних титулів, що належать еміру та його сім’ї, разом із описом королівської печатки та державного герба.\n\nРозділ четвертий (статті 39–42) стосується відносин емірату з різними релігіями, які сповідують його піддані. Суннітський іслам проголошений вищою державною релігією, і емір зобов’язаний сповідувати цю релігію. Ті, хто сповідує інші течії ісламу, а також юдеї, християни та язичники, отримують гарантію повної релігійної свободи."
 bukhara_events.1021.a: "Цікаво..."

 bukhara_events.1022.t: "Бухарська конституція, частина 2"
 bukhara_events.1022.d: "Розділ п’ятий (статті 43–53) стосується прав і обов’язків чоловіків-громадян Туркестану. Громадянам гарантується захист від свавільного арешту та незаконного обшуку й вилучення, обмежене право на подорожі, право володіти приватною власністю, свобода зібрань, свобода вираження поглядів і свобода релігії. Військова служба та сплата податків є обов’язковими для всіх чоловіків-підданих.\n\nРозділ шостий (статті 54–61) стосується ухвалення законів. Стаття 55 вимагає схвалення еміра та Маджлісу для всіх законів, тоді як стаття 56 дозволяє 'конструктивне схвалення' еміра через подолання вето трьома чвертями голосів у Маджлісі. Стаття 57 дозволяє еміру видавати обов’язкові укази, коли Маджліс не засідає, хоча ці укази втрачають силу, якщо не будуть схвалені Маджлісом протягом року після їх введення. Еміру заборонено використовувати укази для зміни Конституції. Комунальний Маджліс може оголосити імпічмент міністрам уряду або членам регентської ради трьома чвертями голосів.\n\nРозділ сьомий (статті 62–76) регулює роботу Маджлісу. Є лише один законодавчий орган — Комунальна рада, або Маджліс. Рада міністрів ліквідується. Маджліс зобов’язаний збиратися принаймні раз на рік, але емір може розпустити його в будь-який час, за умови, що нові вибори будуть призначені протягом місяця. Члени Маджлісу обираються на п’ятирічний термін за системою непрямого голосування, де місцеві підрозділи з п’ятисот до восьмисот чоловіків-громадян висувають делегата для голосування від їхнього імені. І Маджліс, і емір можуть пропонувати законодавство, включаючи поправки до конституції. Маджлісу заборонено використовувати свої бюджетні повноваження для відмови у запитах на фінансування чи людські ресурси від армії — якщо Маджліс відмовляє у такому запиті без схвалення еміра, він повинен надати фінансування на рівні попереднього року."
 bukhara_events.1022.a: "До стабільного майбутнього разом!"

 bukhara_events.1023.t: "Бухарська конституція, частина 1" #Кушбеггі
 bukhara_events.1023.d: "Вступ (статті 1–2) проголошує, що Емірат Туркестану є 'єдиним і неподільним' під величчю еміра, встановлює обов’язкове використання придворної перської та узбецької мов у державних установах і збройних силах, водночас визнаючи деякі обмежені гарантії використання таджицької, сартської, туркменської, киргизької, казахської та бухарської мов.\n\nРозділ перший (статті 3–24) стосується божественних і суверенних повноважень еміра, перелічуючи його прерогативи як монарха Туркестану. Емір володіє верховною суверенною владою, і суворе підкорення його наказам вимагається Аллахом. Емір має широкі прерогативи і є особисто недоторканним, йому надано єдиноосібне право оголошувати війну, укладати мир і вести переговори про договори, верховне командування збройними силами, право карбувати монети, надавати помилування, припиняти судові провадження та єдиноосібно призначати та звільняти своїх міністрів. Емір володіє правом перешкоджати обранню голови Комунального Маджлісу та ухваленню законодавства, маючи абсолютне вето. Лише емір може пропонувати зміни до конституції або виборчого законодавства. Емір може призначити аталика як верховного командувача збройними силами, хоча ця особа не має законодавчих чи адміністративних повноважень поза військовою сферою.\n\nРозділ другий (статті 25–39) стосується питань регентства, якщо емір є неповнолітнім. Вік повноліття становить шістнадцять років, і Кушбеггі виконує обов’язки регента та має право вибирати регентську раду для управління від імені еміра.\n\nРозділ третій (статті 40–43) стосується вступу на престол, присяги вірності, яку мають скласти всі чоловіки емірату 'згідно з їхньою вірою та законом', а також численних титулів, що належать еміру та його сім’ї, разом із описом королівської печатки та державного герба."
 bukhara_events.1023.a: "Цікаво..."

 bukhara_events.1024.t: "Бухарська конституція, частина 2"
 bukhara_events.1024.d: "Розділ четвертий (статті 44–47) стосується відносин емірату з різними релігіями, які сповідують його піддані. Суннітський іслам проголошений вищою державною релігією, і емір зобов’язаний сповідувати цю релігію. Ті, хто сповідує інші течії ісламу, а також юдеї, християни та язичники, отримують гарантію релігійної свободи.\n\nРозділ п’ятий (статті 48–58) стосується прав і обов’язків чоловіків-громадян Туркестану. Громадянам гарантується захист від свавільного арешту та незаконного обшуку й вилучення, обмежене право на подорожі, право володіти приватною власністю, свобода зібрань, свобода вираження поглядів і свобода релігії. Військова служба та сплата податків є обов’язковими для всіх чоловіків-підданих.\n\nРозділ шостий (статті 59–68) стосується ухвалення законів. Стаття 55 вимагає схвалення еміра, Ради міністрів і Комунального Маджлісу для всіх законів, тоді як стаття 56 дозволяє еміру та його кабінету видавати обов’язкові укази, коли Маджліс не засідає, хоча ці укази втрачають силу, якщо не будуть схвалені Маджлісом протягом року після їх введення. Еміру заборонено використовувати укази для зміни Конституції.\n\nРозділ сьомий (статті 69–87) регулює роботу Маджлісу (Ради міністрів і Комунальної ради). Обидва органи зобов’язані збиратися принаймні раз на рік. Емір може призначати до половини членів Ради міністрів, тоді як члени Комунальної ради обираються на п’ятирічний термін за системою непрямого голосування, де місцеві підрозділи з п’ятисот до восьмисот чоловіків-громадян висувають делегата для голосування від їхнього імені. Обидві палати мають право пропонувати законодавство, окрім поправок до конституції, які може пропонувати лише емір. Бюджетні повноваження, надані Раді міністрів, не можуть бути використані для відмови у запитах на фінансування чи людські ресурси від армії без схвалення еміра. Лише емір може звільняти членів Ради міністрів, а правила, інструкції та накази цього органу не можуть суперечити чинному законодавству."
 bukhara_events.1024.a: "До благочестивого та стабільного майбутнього під проводом Кушбеггі!"

 bukhara_events.1025.t: "Бухарська конституція, частина 1" #авторитарна
 bukhara_events.1025.d: "Вступ (статті 1–2) проголошує, що Емірат Туркестану є 'єдиним і неподільним' під величчю еміра та його найлояльнішого слуги аталика і встановлює обов’язкове використання чагатайської перської мови при дворі.\n\nРозділ перший (статті 3–37) стосується божественних і суверенних повноважень еміра, перелічуючи його прерогативи як монарха Туркестану. Емір володіє верховною суверенною владою, і суворе підкорення його наказам вимагається Аллахом. Емір має широкі прерогативи і є особисто недоторканним. Він має єдиноосібне право оголошувати війну, укладати мир і вести переговори про договори, верховне командування збройними силами, право карбувати монети, надавати помилування, припиняти судові провадження, видавати укази, єдиноосібно відповідати за адміністративні та зовнішні справи емірату, єдиноосібно призначати та звільняти своїх міністрів і визначати характер і обсяг їхніх обов’язків. Емір має право призначити аталика як свого представника та речника, надаючи йому ті ж повноваження та владу, при цьому аталик підзвітний лише еміру, який може відкликати його в будь-який час.\n\nРозділ другий (статті 38–50) стосується питань регентства та вступу еміра на престол. Вік повноліття становить шістнадцять років, і аталик виконує обов’язки регента та має право вибирати регентську раду для управління від імені еміра. Усі чоловіки емірату повинні скласти присягу вірності еміру та його аталику після його вступу на престол."
 bukhara_events.1025.a: "Цікаво..."

 bukhara_events.1026.t: "Бухарська конституція, частина 2"
 bukhara_events.1026.d: "Розділ третій (статті 51–54) стосується відносин емірату з різними релігіями, які сповідують його піддані. Суннітський іслам проголошений вищою державною релігією, і емір зобов’язаний сповідувати цю релігію.\n\nРозділ четвертий (статті 55–61) стосується прав і обов’язків чоловіків-громадян Туркестану. Громадянам гарантується захист від свавільного арешту та незаконного обшуку й вилучення, обмежене право на подорожі та право володіти приватною власністю. Емір може призупиняти ці права в надзвичайних ситуаціях, і ці права скасовуються для будь-яких громадян, підозрюваних у революційних зв’язках чи діях. Військова служба та сплата податків є обов’язковими для всіх чоловіків-підданих.\n\nРозділ п’ятий (статті 62–70) регулює роботу Ради міністрів і ухвалення законів. Комунальна рада розпускається, а всі її повноваження передаються Раді міністрів. Емір може безпосередньо призначати до половини членів Ради міністрів, тоді як інша половина призначається бейліками, улемами та місцевими радами. Рада міністрів може пропонувати законодавство за схваленням еміра та його аталика. Емір може видавати обов’язкові укази, але укази, які змінюють Конституцію, повинні бути схвалені Радою міністрів. Аталику надаються будь-які бюджетні повноваження, необхідні для фінансування та розширення армії за потреби."
 bukhara_events.1026.a: "До славного майбутнього під проводом аталика!"

 bukhara_events.1027.t: "Петиція до Росії за справжню незалежність"
 bukhara_events.1027.d: "Технічно Емірат Бухари є повністю незалежною державою з тісними дружніми зв’язками з великою нацією Росією, але без юридичних механізмів, за допомогою яких Росія могла б контролювати чи маніпулювати нашим суверенітетом. Однак насправді Росія здійснює значний контроль над нашою державою через легіон радників і бюрократів, які звітують безпосередньо до Москви і часто ігнорують накази своїх місцевих 'керівників', створюючи своєрідну 'державу в державі', яка перешкоджає нам повною мірою насолоджуватися законною незалежністю. Хоча ми повністю лояльні до нашого російського союзника, зростають зусилля, спрямовані на послаблення пут, якими Росія нас зараз утримує, особливо з огляду на наше зростання сили. Звичайно, є також питання російського економічного контролю, який дещо послабився (від всеосяжного до просто гнітючого) у міру зростання нашої власної промисловості та виробництва. У нас є кілька варіантів: ми можемо попросити Росію послабити частину їхнього політичного контролю, можливо, запропонувавши натомість посилений економічний контроль або компенсацію, або ж просто змиритися з нашим нинішнім становищем."
 bukhara_events.1027.a: "Попросити більшої незалежності"
 bukhara_events.1027.b: "Запропонувати компенсацію за незалежність"
 bukhara_events.1027.c: "Навіщо взагалі їх турбувати?"

 bukhara_events.1028.t: "Наші туркестанські союзники вимагають більшої незалежності"
 bukhara_events.1028.d: "Ми створили Туркестанський емірат, щоб захистити наш південний кордон і краще регулювати місцеві тюркські племена, сартів і персів регіону. Щоб забезпечити їхню лояльність, ми організували значну частину їхньої бюрократії та уряду під наглядом російських агентів у бухарському дворі, які останніми роками лише посилили свою владу. Однак Туркестанський емірат сам по собі став потужним, із зростаючою армією колись нелояльних бандитів-басмачів, які тепер марширують у ногу з нашими арміями у великому європейському конфлікті. Нещодавно місцеві дипломати наполягали на тому, щоб ми внесли значні зміни до ролі російських радників у дворі емірату, зміни, які зробили б їх більш незалежними. Хоча офіційно емірат є лише союзною державою в нашій сфері впливу, їхній обмежений суверенітет дозволяв нам тісно контролювати їхні справи. Усунення наших агентів із позицій контролю, безумовно, порадувало б туркестанців — але, очевидно, ми стурбовані тим, що це може бути першим доміно на шляху до повної туркестанської незалежності та повстання."
 bukhara_events.1028.a: "Виконати їхнє прохання"
 bukhara_events.1028.b: "Абсолютно ні!"

 bukhara_events.1029.t: "Росія відкликає частину своїх щупалець контролю"
 bukhara_events.1029.d: "Визнаючи нашу зростаючу силу та давню лояльність, Росія відкликала низку своїх провідних 'радників', послабивши основи їхнього прямого контролю над нашою адміністрацією. З дедалі більшою кількістю ролей, заповнених нашими місцевими узбеками, ми більше не залежимо від постійного схвалення наших російських союзників. Звичайно, на повсякденному рівні не так багато змінилося — російська підтримка залишається життєво важливою для підтримки адміністрації емірату, і низка молодших посад все ще зайнята росіянами або експертами, навченими в Росії. Однак немає сумніву, що меч Дамокла дещо опустився. Тепер малоймовірно, що емір та його найближчі союзники могли б бути тихо вилучені з управління нашою нацією, і якби росіяни сьогодні спробували повалити наш уряд, вони зіткнулися б із значно більшим опором, ніж колись. Цей поворот знаменує нову главу в нашій історії, дозволяючи нам по-справжньому розправити крила та показати світові, наскільки могутньою може бути Центральна Азія!"
 bukhara_events.1029.a: "Фантастично!"

 bukhara_events.1030.t: "Росія відхиляє наші прохання"
 bukhara_events.1030.d: "Незважаючи на розумний і добре продуманий характер нашого прохання до Москви послабити їхній неформальний контроль над нашим урядом, ми отримали повну відмову. Наші дипломатичні колеги зв’язалися з нами через неофіційні канали, пояснивши, що хоча може настати час, коли Росія буде готова ще більше скоротити свої політичні інвестиції в наш край, цей день ще не настав. Правда в тому, що Росія вклала занадто багато крові та скарбів у забезпечення нашої нації в свою сферу, і вони не можуть дозволити собі тепер порушити цей порядок. З цією метою вони попередили нас, що будь-який наш крок, спрямований на обхід або послаблення їхнього контролю, призведе до негайного військового втручання, якому ми були б абсолютно неспроможні протистояти. На жаль, зараз ми мало що можемо зробити, особливо після того, як ми розкрили свої карти нашому російському колезі з нашими проханнями. Нам просто доведеться продовжувати мріяти про майбутнє, де ми зможемо бути вільним і рівним партнером нашого російського союзника."
 bukhara_events.1030.a: "Тоді ми мусимо відступити..."

