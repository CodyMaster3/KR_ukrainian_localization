### Tooltips ###
 BUK_tt_reform_bonus: "§CЯкщо §0Реформісти§! будуть §GЗадоволені§! або §GПримирені§! на момент завершення цього фокусу, ми отримаємо підвищену §Yстабільність§!.§!"
 BUK_tt_traditional_bonus: "§CЯкщо §PТрадиціоналісти§! будуть §GЗадоволені§! або §GПримирені§! на момент завершення цього фокусу, ми отримаємо додаткову §Yполітичну силу§!.§!"
 BUK_tt_traditional_malus: "Якщо §PТрадиціоналісти§! будуть §RНевдоволені§! або §RБунтівні§! на момент завершення цього фокусу, ми §Rвтратимо§! трохи §Yстабільності§!."
 BUK_constitutional_draft_tooltip: "Ми розробимо §YКонституцію Емірату§!, що надасть особливі бонуси залежно від наших виборів.\n\n"
 BUK_auth_constitutional_draft_tooltip: "Ми вирішимо, чи розробляти §YКонституцію Емірату§!, що може кардинально змінити напрямок нашого режиму.\n\n"
 BUK_leaving_russian_sphere: "Якби ми зараз звернулися до росіян, ми втратили б останні залишки нашої незалежності! Ми повинні впоратися з цим самостійно!"
 BUK_left_russian_sphere: "§CЧерез зміни в геополітичній ситуації Бухара тимчасово вислизнула з-під нашого контролю! Щойно ми відновимо наше панування та захист над Еміратом, вони повернуться під наш контроль.§!"
 BUK_auth_constitution_natpop_tt: "Аталик затягне Бухару в нове, більш радикальне майбутнє під проводом §nРадикальних абсолютистів§!, конвертуючи половину популярності §aАвторитарних демократів§! та §PПатерналістських автократів§! у популярність §nНаціональних популістів§!."
 BUK_proletariat_popularity_tt: "Чверть популярності наших §cСоціал-консерваторів§! та §aАвторитарних демократів§! конвертується в популярність §rРадикальних соціалістів§!."

 BUK_language_unification_tt: "Отримуємо §G1§! тимчасовий дослідницький слот, поки цей національний дух активний.\n\nЧерез §Y500§! днів:\nМодифікуємо §YРеформу освіти джадідів§! на\n$MODIFIER_RESEARCH_SPEED_FACTOR$: §G+15.00%§!\n$MODIFIER_STABILITY_FACTOR$: §G+15.00%§!"
 BUK_folk_shrine_tt: "Через §Y100§! днів:\nМодифікуємо §YБандитизм і незгода§! на\n$MODIFIER_POLITICAL_POWER_GAIN$: §G-0.10§!\n$MODIFIER_STABILITY_WEEKLY$: §G+0.20%§!\n$MODIFIER_COMPLIANCE_GROWTH$: §G+10%§!\n$MODIFIER_RESISTANCE_DAMAGE_TO_GARRISONS$: §G-10.00%§!"
 BUK_revolution_secured_tt: "Об’єднаємо §YРеспубліканську конституцію§! та §YКонтроль над тіньовою радою§! у §YРеволюцію забезпечено§!\nЕфективна зміна:\n$MODIFIER_COMPLIANCE_GAIN_ADD$: §R-0.01%§!\nОрганізація дивізій: §G+10%§!\n$MODIFIER_STABILITY_POPULARITY_FACTOR$: §G+20%§!\n$MODIFIER_COMMAND_POWER_GAIN$: §G+0.15§!\nЩоденна підтримка тоталістів: §G+0.02§!\n"
 BUK_unified_in_party_and_purpose_tt: "Об’єднаємо §YНаціонал-популістську конституцію§! та §YНепевний альянс§! у §YОб’єднані в партії та меті§!\nЕфективна зміна:\n$MODIFIER_POLITICAL_POWER_FACTOR$: §G+7%§!\n$MODIFIER_ARMY_MORALE_FACTOR$: §G+5%§!\n$MODIFIER_STABILITY_FACTOR$: §G+5%§!\n$MODIFIER_STABILITY_POPULARITY_FACTOR$: §G+15%§!\n$MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY_FACTOR$: §G+15%§!\n$national_populist_drift$: §G+0.01§!\n"

