### Ideas ###
 BUK_southern_bulwark: "Південний бастіон Москви"
 BUK_russian_economic_control: "Російський економічний контроль"
 BUK_russian_economic_control_desc: "На піку центральноазійського повстання Російська Республіка визнала нас незалежною державою з домінуванням над регіоном Самарканда. Незважаючи на нову геополітичну реальність, наш старий гегемон досі має значний вплив на нашу економіку. Російський капітал і техніка принесли Бухарі великі технологічні та економічні досягнення. Проте майже весь прибуток від нових залізниць, бавовняних плантацій і золотих копалень іде до російських власників, залишаючи нам лише мізерну частку доходів, отриманих із наших родючих земель і багатих ресурсів."
 BUK_russian_economic_control_BM: "Спустошення після Чорного понеділка"
 BUK_retaking_economic_control: "Повернення економічного контролю"
 BUK_reinvigorated_builders_council: "Оновлена рада будівельників"
 BUK_tribal_auxiliaries: "Племінні допоміжні сили"
 BUK_holding_out_for_russia: "Очікування на Росію"
 BUK_ulemma_support: "Підтримка улемів"

 BUK_emergency_taxes_traditionalist: "Додаткове фінансування армії"
 BUK_emergency_taxes_reformist: "Заходи жорсткої економії"
 BUK_emergency_taxes_russian: "Технократичний план відновлення"

 BUK_struggling_bureaucracy: "Бюрократична криза"
 BUK_struggling_bureaucracy_desc: "Між численними гілками уряду Емірату існує явна напруга. Останніми роками добре налагоджений державний механізм фактично зупинився, оскільки Емір Алімхан дедалі більше втручається в справи своїх міністрів. Побоюючись джадидського домінування в Меджлісі, Емір залишив центральний орган влади без керівництва, заповнивши посади підлабузниками та лоялістами. Реформісти побоюються, що державна бюрократія близька до повного краху, тоді як консерватори звинувачують реформістів у руйнуванні адміністративної системи."
 BUK_stagnant_bureaucracy: "Занепад уряду"
 BUK_stagnant_bureaucracy_desc: "Економічна криза, що охопила наш уряд на початку 1936 року, стала останнім цвяхом у труну нашої хворої адміністрації. Меджліс бездіяльний і без керівництва, а фаворити Еміра не здатні впоратися з поточною кризою. Основні функції управління зруйновані, а бюрократія залишилася дезорганізованою й розгубленою. Реформісти називають це наслідком систематичного демонтажу реформ Міллера, тоді як консерватори звинувачують у всьому корупцію та роздутість адміністративної системи Емірату."
 BUK_antiquated_army: "Застаріла армія"
 BUK_antiquated_army_desc: "Хоча Емір Алімхан особисто навчався в російських військових академіях і давно отримує допомогу від російських радників, наші спроби реформувати бухарську армію — це постійна боротьба з мізерними результатами. Більшість наших сил — це фактично ополчення й племінні загони, які скликаються лише в часи кризи. Постійна армія демонструє певний прогрес, але повільно адаптується до сучасного озброєння й нових тактик. Потрібно діяти, поки нас не втягнули в нову війну."

