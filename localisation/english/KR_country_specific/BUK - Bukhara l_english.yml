### Characters ###
 BUK_mohammed_alim_khan: "Мохаммед Алім Хан"
 BUK_mohammed_alim_khan_leader_desc: "§YНародився:§! §L3 січня 1880 року, Бухара, Емірат Бухари§!\n§YПоходження:§! §LЕмір Саїд Мір Мухаммед Алім Хан був підготовлений з народження, щоб бути пішаком іноземного імператора. У тринадцять років молодого принца відправили до Санкт-Петербурга, де він вивчав сучасну військову стратегію та адміністрацію, вбираючи культуру російського двору. Він повернувся додому в 1909 році як Великий князь за наказом царя і через рік став Еміром. Його першим указом було заборонити міністрам, посадовцям і збирачам податків брати хабарі, що спонукало багатьох прогресивних інтелектуалів-джадідів оголосити його великим реформатором, якого так потребував Емірат. Однак цей оптимізм швидко згас, коли було оприлюднено його другий указ, який відправив кількох відомих джадідів у сибірське заслання. Алім Хан охоче скорочував стародавню бюрократичну громіздкість, але добре знав, що в планах реформаторів немає місця для всемогутнього не обраного диктатора, і протягом усього свого правління він провокував і викорінював цих настирливих критиків.\n\nЕмір виявився хитрим, хоча й повільним, політичним гравцем під час Російської громадянської війни. Він не підтримував ні червоних, ні білих, поки переможець не став очевидним, і (ледве) відвернув революцію всередині країни за допомогою пакета обмежених демократичних і меритократичних реформ. У мирні роки після цього Емір робив усе можливе, щоб підірвати та скасувати ці поступки, за підтримки жорстко консервативного вождя племені Локай Ібрагіма Бека, якого він призначив Аталиком (регентом) царства. Забезпечивши свою фундаменталістську базу, лише питання часу, коли Алім Хан відчує себе достатньо впевненим, щоб спробувати остаточно придушити своїх бунтівних підданих.§!"
