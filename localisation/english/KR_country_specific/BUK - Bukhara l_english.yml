### Focus ###
 BUK_focus: "Дерево фокусів [BUK.GetName]"

 BUK_parade_the_lashkarya: "Парад Лашкарії"
 BUK_parade_the_lashkarya_desc: "Постійна «армія» Бухари — це переважно строката суміш недолугих дивізій і фантомних військ, які існують лише на папері, просто витягуючи гроші на рахунки безчесних адміністраторів і командирів. Ми повинні показати ті небагато частини, які є винятком — ці блискучі елітні підрозділи Емірату."

 BUK_meet_with_cotton_barons: "Зустрітися з бавовняними баронами"
 BUK_meet_with_cotton_barons_desc: "Далеко від склепінчастих стель і величної кам’яної архітектури Арку Бухари, невеликий європейський будинок приймає найвпливовіших людей Емірату. Ці великі титани бавовняної промисловості сперечаються й бурчать у задимлених кімнатах, по суті визначаючи економічну долю держави на своїх балансах і торгових угодах. Настав час завітати до них."

 BUK_reaffirm_emergency_taxes: "Підтвердити надзвичайні податки"
 BUK_reaffirm_emergency_taxes_desc: "На піку Центральноазійської кризи наші міністри запропонували серію надзвичайних податків на товари, сподіваючись, що шок для військового бюджету призведе до модернізації армії. Хоча зусилля з модернізації здебільшого застигли, нові надходження стали життєво важливими для щоденної роботи уряду. Продовження цих податків ще на рік буде непопулярним, але необхідним."

 BUK_untangling_the_administration: "Розплутати адміністрацію"
 BUK_untangling_the_administration_desc: "Сотні років інституційного гниття роз’їдають наш уряд, душать ефективність управління та залишають нас вразливими до корупції й безладдя. Радники й експерти надто слабкі й мляві, щоб кинути виклик цьому статус-кво, але в уряді ще залишилися ті, хто розуміє: іноді найкращий спосіб позбутися щурів — просто перебити їх усіх."

 BUK_shuffle_the_builders: "Перетасувати Раду Будівельників"
 BUK_shuffle_the_builders_desc: "Мало хто приїжджає до Бухари, не помилувавшись її архітектурною величчю, але ще менше тих, хто скаже, що великі споруди міста — не давні. Рада Будівельників була неформальним об’єднанням майстрів, створеним у найгірші часи реформ. Сьогодні це радше паразит, що жиріє на державних коштах."

 BUK_expand_the_cotton: "Придбати занепалі бавовняні плантації"
 BUK_expand_the_cotton_desc: "Хоча на наших землях є родючі ґрунти, ми отримуємо мало прибутку з сільського господарства. Масштабні російські інвестиції в бавовну дали певні результати, але через нестабільність світових ринків наші шановні гості метушаться, намагаючись розплатитися з кредиторами. Настав час придбати деякі з цих маргінальних плантацій, навіть якщо це не сподобається нашим союзникам у Москві."

 BUK_silk_road_sisters: "Близнючки Шовкового шляху"
 BUK_silk_road_sisters_desc: "На піку трансконтинентальної торгівлі через Центральну Азію Бухара й Самарканд були двома найяскравішими перлинами степу. У наступні роки Самарканд став центром ісламського правління в регіоні й резиденцією багатьох славетних правителів — від Абу Мусліма до самого Тимура. Ми повинні віддати цьому місту належну шану як автономній, але підлеглій частині нашої держави."

 BUK_the_emirs_right_hand: "Права рука Еміра"
 BUK_the_emirs_right_hand_desc: "Відтоді як червона загроза намагалася скинути нашого Еміра, стара ворожнеча між лідером локайців Ібрагімом Беком і Алімханом перетворилася на прагматичний союз проти тих, хто хоче продати Бухару дияволу. Досвідчений військовий командир і побожний мусульманин, Ібрагім — безцінний союзник трону, і ми чітко покажемо це, піднісши роль Аталик вище за всі інші посади в Еміраті."

 BUK_strengthen_the_militias: "Зміцнити ополчення"
 BUK_strengthen_the_militias_desc: "Серцем нашої армії давно були селянські ополчення, які скликалися в часи кризи як неохочі гарматні м’ясо й демотивовані солдати. Минуло багато років з часу останнього перепису працездатних чоловіків у нашій державі, що дозволяє деяким хитрим селянам уникати призову в разі конфлікту. Це неприйнятно."

 BUK_reform_professional_army: "Реформувати професійну армію"
 BUK_reform_professional_army_desc: "Постійна армія Бухари, «Лашкарія», — це радше збірна група прикордонників, які не здатні протистояти жодній силі, сильнішій за деморалізованих бандитів чи зухвалих селян. Потрібні масштабні реформи, щоб привести Королівську армію до сучасних стандартів, особливо з огляду на зростаючий опір з боку консервативних членів нашої адміністрації."

 BUK_expand_our_fortifications: "Розширити укріплення"
 BUK_expand_our_fortifications_desc: "Останнє десятиліття наш північний кордон перебуває під загрозою з боку самозваного воєначальника Мадаміна Бека, який прагне багатств Самарканда. Хоча пильне око наших російських покровителів досі нас захищало, ми повинні взяти справу у свої руки. Серія застав уздовж північного кордону допоможе стримати агресивного сусіда й виграти час для мобілізації ополчення."

 BUK_refurbish_artillery: "Оновити стародавню артилерію"
 BUK_refurbish_artillery_desc: "Бідність породжує винахідливість, і мало де бідніше, ніж у Бухарі. Те, що гармату використовували для розгону туркменських племен у 1762 році, не означає, що вона не зможе розігнати туркменів сьогодні. Ми оновимо старі запаси, щоб забезпечити якомога більше наших підрозділів хоча б якоюсь важкою зброєю — навіть якщо вона зовсім не відповідає сучасним стандартам."

 BUK_reassess_our_military: "Переоцінити нашу військову позицію"
 BUK_reassess_our_military_desc: "Протягом багатьох років офіційна позиція наших військових сил полягала в тому, що вони мають бути не більше ніж допоміжними силами наших російських покровителів. Оскільки ситуація в Європі загострюється, а воєначальник у Туркестані набирає впевненості, ми можемо зіткнутися з новою, лякаючою реальністю. Якщо басмачі рушать на південь, захищати наші домівки доведеться нам самим."

 BUK_import_foreign_expertise: "Залучити іноземний досвід"
 BUK_import_foreign_expertise_desc: "Хоча це розчаровує нашу адміністрацію, правда полягає в тому, що ми значною мірою залежимо від іноземців у використанні наших природних багатств і фінансуванні модернізації держави. Разом із припливом іноземних технологій та інвестицій виникає потреба в талановитих людях з-за кордону. Зрештою, хіба великий Емір не навчався в засніжених залах Санкт-Петербурга?"

 BUK_recall_mission_to_kostantiniye: "Просунути «молодотурків»"
 BUK_recall_mission_to_kostantiniye_desc: "Кілька років тому деякі з наших найкращих офіцерів були запрошені до столиці Османської імперії, щоб краще опанувати мистецтво сучасної війни. Хоча наші російські покровителі скреготали зубами через це втручання, навіть вони не могли заперечити користь такої ініціативи. Настав час пожинати плоди цієї місії — просунути молодих офіцерів на ключові посади й реформувати Королівську армію навколо них."

 BUK_invite_russians: "Запросити додаткових російських радників"
 BUK_invite_russians_desc: "Ядро нашої нової Королівської армії — це повністю російське формування, навчане за їхніми стандартами й оснащене найкращим надлишковим російським обладнанням, яке можна купити за золото. Усі наші успіхи в оновленні збройних сил стали можливими завдяки співпраці та досвіду російських радників. Якщо ми хочемо досягти нових висот — нам знову потрібна підтримка сміливих і новаторських москвичів."

 BUK_concentrated_fire: "Тактика вогневого залпу"
 BUK_concentrated_fire_desc: "Артилерія — це сучасна технологія з сучасними застосуваннями й проблемами. Для такої країни, як наша, з обмеженою промисловою базою й малою можливістю закуповувати передове озброєння, ми повинні зосередити непрямий вогонь у ретельно обраних точках, щоб забезпечити локальну перевагу й краще підтримати наших солдатів."

 BUK_defence_in_depth: "Тактика ешелонованої оборони"
 BUK_defence_in_depth_desc: "Рельєф Центральної Азії ускладнює фортифікацію, але передгір’я й степи ідеально підходять для розтягування логістики ворога. Це означає, що, утримуючи значні резерви й мобілізуючи наші обмежені сили, ми потенційно можемо протистояти противникам із більшими ресурсами й чисельністю."

 BUK_support_of_the_clans: "Приборкати клани"
 BUK_support_of_the_clans_desc: "За межами столиці наша держава управляється переважно через мережу феодальних патронатних зв’язків, де могутні лідери кланів лише формально визнають центральну владу. Хоча останні десятиліття принесли помітну централізацію околиць, остання недбалість призвела до того, що кілька незалежно налаштованих беїв раптом забули про свої нові обов’язки перед урядом. Ми нагадаємо їм."

 BUK_restore_magok_i_attari: "Відновити мечеть Магокі-Аттарі"
 BUK_restore_magok_i_attari_desc: "Спершу зороастрійський храм у самому серці Бухари, мечеть Магокі-Аттарі була збудована одразу після арабського завоювання регіону. Комплекс неодноразово реставрувався протягом наступного тисячоліття й має багату історію як місце поклоніння для мусульман і єврейської громади Бухари. Ми повинні повернути йому колишню велич."

 BUK_contacts_in_afghanistan: "Наші контакти в Афганістані"
 BUK_contacts_in_afghanistan_desc: "Багато таджицьких і узбецьких племінних лідерів у нашій державі мають зв’язки через кордон в Афганістані. Зрештою, у глибинці нашого Емірату лояльність належить місцевій владі, а не Кабулу чи Бухарі. Ми повинні використати ці транскордонні зв’язки собі на користь, залучаючи ресурси від дружніх вождів на півдні."

 BUK_honour_the_ulama: "Вшанувати улемів"
 BUK_honour_the_ulama_desc: "Улема Джемієті, або Рада вчених мужів — це рада мусульманських лідерів, яка дбає про збереження позицій ісламу та його духовенства в Туркестані. Наша відданість шаріату — абсолютна, і, незважаючи на російський вплив, мулли панують у нашому суспільстві. З огляду на те, що безбожні соціалісти та їхні джадидські союзники підбурюють проти Еміра, втручання улемів необхідне."

 BUK_call_for_the_faithful: "Заклик до вірних"
 BUK_call_for_the_faithful_desc: "Основою нашого Емірату є наша віра та відданість їй, і хоча ми мало зважаємо на думку мас, саме віряни становлять наших найвідданіших підданих. Ми повинні мобілізувати цю групу справжніх віруючих проти отруйних слів і зрадницьких дій безбожників і зблудлих, інакше ці бунтівні натовпи розірвуть наш великий Емірат на шматки."

 BUK_jadidism_jihad: "Джихад проти джадидизму"
 BUK_jadidism_jihad_desc: "Коли постає загроза ісламу в нашій державі, улеми можуть оголосити «Газават» — священну війну спротиву, мобілізуючи всіх працездатних мусульманських чоловіків на службу нашому відданому Еміру. Такий заклик не звучав з часів Російської революції, але наша релігія нині під загрозою через єретичні вчення джадидів і їхніх союзників."

 BUK_manage_the_ministries: "Керувати міністерствами"
 BUK_manage_the_ministries_desc: "Центральний уряд Бухари складається з складного набору чиновників, які часто сваряться через перекриття повноважень. Останнім часом уряд фактично перетворився на діархію, де міністри, лояльні кушбегі, і адміністратори, лояльні аталику, роздирають залишки здорового управління. Ми повинні поставити цих бунтівників на місце."

 BUK_strengthen_the_kushbeggi: "Посилити кушбегі"
 BUK_strengthen_the_kushbeggi_desc: "Немає жодної душі в Бухарі, яка б не вважала кушбегі Нізамаддіна Урганжі маріонеткою консервативних мулл, але є причина, чому цей мудрий державник утримує свою посаду понад десятиліття. Він неодноразово доводив свою відданість Еміру й був надійним щитом проти радикалізму, що дедалі глибше проникає в нашу державу. За нашої повної підтримки він зможе продовжити свою сумлінну службу."

 BUK_loosen_uzbekisation: "Послабити узбекізацію"
 BUK_loosen_uzbekisation_desc: "Наш Емір багато чого дізнався про русифікацію, яку проводила стара царська влада, навчаючись у Санкт-Петербурзі, й розробив стратегію примусового навчання таджиків узбецьким звичаям і мові. Ця політика лише породила покоління таджицьких підданих, які ненавидять свого Еміра. Послабивши цю політику примусової асиміляції, ми зможемо простягнути оливкову гілку."

 BUK_appoint_a_new_chairman: "Наділити повноваженнями Меджліс"
 BUK_appoint_a_new_chairman_desc: "У роки після громадянської війни джадидський старійшина Мірзо Абдулвохід Мунзім домінував у внутрішній політиці країни як голова Меджлісу, очолюючи десятиліття напівконституційного правління. Його смерть дозволила Алімхану обійти реформи, але останні події змусили Еміра знову скликати раду, що може ознаменувати нову епоху бухарського реформізму."

 BUK_call_for_a_council: "Примусити до зустрічі поміркованих"
 BUK_call_for_a_council_desc: "Після авантюри аталика за владу різні опозиційні фракції при дворі знову повернулися до безплідних чвар, що загрожують знову паралізувати уряд. Хоча кушбегі й меджліс можуть не любити одне одного, вони вже показали здатність діяти спільно в кризовій ситуації. Ми змусимо їх зробити це знову."

 BUK_strengthen_state_institutions: "Зміцнити державні інституції"
 BUK_strengthen_state_institutions_desc: "Період подвійного правління аталика й кушбегі породив плутанину на всіх рівнях управління: чиновники самі вирішували, кому звітувати, куди мають надходити податки й які закони слухати. Настав час відновити чітку ієрархію влади та сильні інституції, на які держава зможе справді покластися в часи потреби."

 BUK_central_asia_in_flames: "Запровадити надзвичайні заходи"
 BUK_central_asia_in_flames_desc: "Через безбожну підступність і насильницьке повстання соціалісти та їхні союзники в Туркестані дестабілізували наш контроль над Самаркандом, поставивши під загрозу серце нашої держави. Тепер, коли уряд більше не скутий глухим кутом, ми можемо діяти швидко, щоб відновити контроль над кордонами й запобігти подальшій революційній активності."

 BUK_open_the_caches: "Відкрити склади"
 BUK_open_the_caches_desc: "На піку Центральноазійської кризи російські гарнізони, відступаючи з Ташкента й Ашгабата, вивезли величезні запаси зброї, щоб не допустити їх захоплення персами чи басмацькими ватажками. Коли ситуація стабілізувалася, ці запаси — здебільшого застаріле озброєння — були заховані й забуті імперією, що загрузла в безладі. Росіяни могли покинути цю зброю, але ми забезпечимо її повернення на поле бою!"

 BUK_the_last_stand: "Останній рубіж Бухари"
 BUK_the_last_stand_desc: "Пси Мадаміна Бека й бандити Джунаїд-хана наступають на нашу столицю, погрожуючи грабунком і спустошенням кожної вулиці й площі, поки від нашого Емірату не залишиться нічого, крім димлячих руїн. Ми не будемо тікати — ми триматимемося, укріпимо ворота Каршина й захистимо мости через Амудар’ю, Кашкадар’ю та Зеравшан."

 BUK_reconstruction: "Відбудова Емірату"
 BUK_reconstruction_desc: "Битва за Самарканд залишила глибокі шрами на нашому Еміраті: нове покоління торкнулася жорстокість війни, скарбниця спустошена, а віра в Росію похитнулася. І все ж ми стоїмо, як ніколи раніше. Баламутники з Ташкента називали нас прикутими псами кафіра, але ми показали їм глибину нашої стійкості, коли розтопили їх на полі бою."

 BUK_expand_the_beyliks: "Розширити систему бейліків"
 BUK_expand_the_beyliks_desc: "Традиційно Емірат Бухара був поділений на кілька бейліків — провінцій, кожна з яких управлялася призначеним губернатором. Ця адміністративна система служила нам століттями й стане основою для нового поділу держави на губернаторства, кожне з яких очолюватиме бей, чия вірність має належати Еміру, а не землі, якою він править."

 BUK_okhrana: "Власна охрана"
 BUK_okhrana_desc: "Занадто довго контроль над населенням тримався виключно на плечах губернаторів, які створювали неформальні мережі донощиків і грубо придушували будь-які ознаки непокори. Ми повинні звернутися до російської моделі нагляду, створивши спеціальне агентство для моніторингу й боротьби з революційною активністю."

 BUK_restore_order_to_territories: "Відновити порядок у провінціях"
 BUK_restore_order_to_territories_desc: "Бої в Самарканді та прикордонних землях довели одне: хоча наш контроль над Бухарою й околицями повний, наша здатність проєктувати владу за межі столиці обмежена слабкою комунікацією, транспортом і застарілою системою губернаторів і військових округів. Ми повинні реорганізувати військові командування відповідно до нещодавніх реформ системи бейліків."

 BUK_develop_heartland: "Розвивати серце Емірату"
 BUK_develop_heartland_desc: "Хоча заманливо дивитися далеко за межі столиці, ми повинні пам’ятати, що наш дім — це Бухара, серце Емірату. Багатство має текти з околиць до столиці, а не навпаки! Ми започаткуємо низку громадських проєктів, щоб зробити столицю гідною нашої держави."
 BUK_develop_heartland_tt: "§YБухара§! отримує модифікатор §YПерлина Центральної Азії§!, який надає\n      $MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+15%§!\n      $MODIFIER_LOCAL_BUILDING_SLOTS$: §G+3§!\n\n"
 BUK_develop_heartland_state_spirit: "Перлина Центральної Азії"

 BUK_draft_a_constitution: "Написати конституцію Еміра"
 BUK_draft_a_constitution_desc: "Емір правив десятиліттями через укази, його влада стримувалася лише радниками й командирами. Помірковані джадиди давно вимагали проголошення конституції та створення парламенту, а абсолютисти дедалі більше сприймають конституцію як спосіб узаконити статус-кво. Після нашої перемоги у Війні на степах ми маємо змогу обрати шлях уперед."

 BUK_deal_with_tajiks: "Вирішити питання з таджиками"
 BUK_deal_with_tajiks_desc: "На піку кризи в Самарканді бунтівні таджицькі піддані загрожували дестабілізувати весь Емірат. Протягом років ми пробували всі можливі підходи до вирішення цієї проблеми — укладали угоди й рубали голови в рівних пропорціях. Ця нерішучість має скінчитися, якщо ми хочемо стабілізувати державу. Потрібна чітка політика щодо таджиків."

 BUK_feared_and_loved: "Страх і повага"
 BUK_feared_and_loved_desc: "Колись італійський філософ Нікколо Макіавеллі сказав: «Краще бути страшним, ніж улюбленим, якщо не можна бути обома». Ніхто з наших підданих не сумнівається, що Емір — постать, яку слід боятися. Ще важливіше — багато хто в державі бачить у ньому справжнього захисника консерватизму, який оберігає цінності ісламу від загроз реформ і революції."

 BUK_new_islamic_renaissance: "Нове ісламське відродження"
 BUK_new_islamic_renaissance_desc: "Зростання джадидського реформістського руху серед узбецького й таджицького духовенства стало катастрофою для культури й релігії нашої держави. Ці люди зрадили віру, яку самі ж проголошують, натомість обравши чвари й змови проти правління побожного правителя. Ми вкладемо ресурси в нове покоління вчених, які зможуть спростувати єретичні вчення кафіра."

 BUK_push_our_claims: "Розправити крила"
 BUK_push_our_claims_desc: "Занадто довго ми були пригнічені вірністю байдужим сюзеренам і інтересам іноземних держав. Настав час розправити крила як регіональна сила, заявивши про себе як про рівного партнера, а не слабку провінцію. Можливо, ми навіть знову поглянемо на кордони й повернемо те, що по праву належить нашій державі."

# BUK_expand_conscription: "Call the Levies"
# BUK_expand_conscription_desc: "In times of crisis, the informal militias of our Emirate, the “Na-kary,” are called up to serve as the bulk of our armies. These militias must be called up to service to protect against Madamin Bek's invasion, even if their training is limited and their equipment outdated."

# BUK_call_the_tribes: "Call the Tribes"
# BUK_call_the_tribes_desc: "Most people across Central Asia hold little loyalty beyond their family and tribal affiliation, and it is the leaders of these groups which collectively hold power on the steppes. Without the support of the tribes, we cannot hope to truly rule over these lands. Our Emir shall call the headsmen to Bukhara, so that he may hear out their needs and desires, and convince them of his magnanimity."

# BUK_form_a_new_council_of_ministers: "Form a New Advisory"
# BUK_form_a_new_council_of_ministers_desc: "Ever since the disastrous March Reforms, Bukhara has been shackled by an advisory parliament, whose elected members serve as mouthpieces for the dissident and revolutionary elements of our state. Obviously, there is precious little common ground found between our learned Emir and these radicals. By forming a new Advisory, however, filled with men who share the Emir's vision for Turkestan, we can better rule our lands."

# BUK_expand_the_ark: "Rebuild the Ark"
# BUK_expand_the_ark_desc: "In legends, the Ark of Bukhara was constructed by the epic hero Siyavusha, who built a great palace within the bounds of a bull skin to win the hand of his love, the king's daughter. In reality, the fort at the heart of the city has been demolished and rebuilt countless times over hundreds of years. We must reinforce it, lest it be demolished again."

 BUK_raise_urban_militias: "Сформувати міське ополчення"
 BUK_raise_urban_militias_desc: "Коли Еміра було повалено й проголошено нову демократичну та соціалістичну республіку, більшість племінних військових і міліційних формувань покинули нашу національну справу, присягнувши місцевим ватажкам або ворогам. Хоча ми змушені покладатися на російських союзників, ми також можемо озброїти міських робітників, організувавши їх у вільні кадри для захисту своїх домівок."

 BUK_promote_overlooked_merit: "Просувати забутий талант"
 BUK_promote_overlooked_merit_desc: "Століттями кастова система, племінні порядки й спадкова стагнація призводили до того, що тисячі здібних і талановитих людей ігнорувалися на користь бездарних родичів жирних беїв. Ми просуватимемо нове покоління цілеспрямованих і розумних лідерів — не з крові Чингісхана, а з найжорсткіших фабричних ліній і найтемніших сільських хат. Вони досягнуть успіху там, де стара кров зазнала поразки!"

 BUK_complete_the_purge: "Завершити чистку"
 BUK_complete_the_purge_desc: "Справу повалення століть жорстокого авторитарного гніту, відсталої жорстокості та монархічної стагнації не назвеш приємною чи легкою. За кожного корумпованого паразита, якого ми засуджуємо до трудового перевиховання, двоє реакціонерів прослизують повз наш погляд. У будь-якому разі, ми повинні перейти від шаленої програми політичного очищення до чогось більш сталого, якщо хочемо стабілізувати державу."

 BUK_form_a_provisional_governemnt: "Сформувати тимчасовий уряд"
 BUK_form_a_provisional_governemnt_desc: "Щоб здобути таку необхідну легітимність, ми повинні простягнути руку нашим республіканським братам, навіть якщо ми принципово не погоджуємося з їхнім баченням майбутнього нашої молодої республіки. Ми використаємо зв’язки товариша Ходжаєва з рухом Молодих бухарців, щоб запросити кількох представників до зародкового урядового органу. Хоч їхній внесок буде обмеженим, вони стануть цінними символами нашої єдності!"

 BUK_draft_political_officers: "Призначити політичних офіцерів"
 BUK_draft_political_officers_desc: "Військова ситуація в нашій державі позначена прикрою дилемою: ті, хто має значний військовий досвід у попередньому режимі, політично ненадійні, а ті, хто найбільш ідеологічно відданий — майже не мають військових навичок. Найкраще рішення — вбудувати політично активних офіцерів у наші частини, щоб солдати краще розуміли справу, за яку борються!"

 BUK_emergency_military_council: "Запровадити «воєнний соціалізм»"
 BUK_emergency_military_council_desc: "Спроба координувати племінні й міські ополчення, залишки армії та майже-бандитські нерегулярні формування — це титанічне завдання, а відсутність чіткої ієрархії загрожує розвалити військову координацію. Ми підпорядкуємо всі наші сили надзвичайній військовій раді, що складатиметься з невеликої групи відносно надійних офіцерів. Страшно давати їм такі широкі повноваження, але іншого вибору немає."

 BUK_awaken_the_proletariats: "Пробудити сплячий пролетаріат"
 BUK_awaken_the_proletariats_desc: "Народ Бухари століттями був закутий у кайдани феодальної жорстокості, а будь-яка спроба просвітити пролетаріат щодо їхньої боротьби жорстоко придушувалася старою системою. Тож не дивно, що ідеологічний розвиток серед населення Бухари — майже нульовий, навіть серед міських робітників. Ми повинні дати їм зрозуміти, що ми боремося за їхню свободу!"

 BUK_dawn_of_modern_turkestan: "Світанок сучасного Туркестану"
 BUK_dawn_of_modern_turkestan_desc: "Понад тисячу років племена Центральної Азії перебували під владою дрібних ханів, жорстоких автократів і чужоземних губернаторів. Нарешті наша держава може вийти з темряви монархічного контролю й ступити в світло сучасного світу! Кров’ю, потом і сльозами ми перетворимо Туркестан на славну й сучасну республіку!"

 BUK_sweeping_land_reform: "Масштабна земельна реформа"
 BUK_sweeping_land_reform_desc: "Землі Центральної Азії мають великий потенціал. Хоча значна частина регіону сувора й неродюча, є території, які можуть стати квітучими сільськогосподарськими громадами. На жаль, ці землі контролюють жирні землевласники, які неефективно керують і марнують щедрі угіддя, даровані їм давніми Емірами. На жаль для них, ми більш ніж готові експропріювати ці землі."
 BUK_sweeping_land_reform_tt: "§YХорезм§!, §YБухара§!, §YСамарканд§!, §YТашкент§! і §YКоканд§! отримують модифікатор §YЗемельна реформа§!, який надає\n      $MODIFIER_LOCAL_SUPPLIES$: §G+20%§!\n      $MODIFIER_RECRUITABLE_POPULATION_FACTOR$: §G+5%§!\n      $MODIFIER_LOCAL_BUILDING_SLOTS$: §G+1§!\n\n"
 BUK_sweeping_land_reform_state_spirit: "Земельна реформа"

 BUK_draft_a_republican_constitution: "Написати республіканську конституцію"
 BUK_draft_a_republican_constitution_desc: "Коли Олександр Міллер намагався проштовхнути конституцію через зали Арку Бухари, Емір відкинув її, побоюючись «магічної сили», яку вона нібито надає. В одному Емір мав рацію — повноваження, що надає конституція — стримування й противаги, фундаментальні права громадян, процедури та інституції — справді мають певну магію, яку ми щиро прагнемо використати."

 BUK_implement_education_reforms: "Запровадити освітні реформи"
 BUK_implement_education_reforms_desc: "Прогресивна освітня кампанія джадидів була одним із перших справжніх політичних рухів у Центральній Азії, що об’єднала сотні провідних інтелектуалів і державників задля реальних і тривалих реформ застарілої традиційної системи медресе. На відміну від наших попередників, які нагороджували цих сміливих і старанних новаторів батогами, засланням і стратою — ми підтримаємо й профінансуємо ці плани модернізації!"

 BUK_hold_local_elections: "Провести місцеві вибори"
 BUK_hold_local_elections_desc: "Одним із ключових джерел легітимності нашої республіки є зв’язок уряду з народом Центральної Азії. Ми — захисники волі народу, і саме через запровадження місцевих національних виборів ми справді відобразимо дух нашого громадянства. Звісно, деякі обмеження будуть необхідні для захисту фундаментальної природи нашої республіки."

 BUK_eliminate_the_warlords: "Знищити польових командирів"
 BUK_eliminate_the_warlords_desc: "Навіть після наших перемог над бандитськими державами Джунаїд-хана й Мадаміна Бека наші землі залишаються зараженими залишками їхніх нелегітимних режимів — бродячими бандами головорізів і польових командирів, яких підтримують таємні повстанські осередки. З новою національною армією, що отримала повноваження й реорганізована, ми нарешті маємо засоби, щоб повністю захистити нашу державу, знищивши цих жорстоких мародерів і тих, хто їх прикриває."

 BUK_promote_a_unified_language: "Просувати єдину мову"
 BUK_promote_a_unified_language_desc: "Чагатайська тюркська мова була спільною мовою нашої держави протягом століть, але за останні двісті років місцеві діалекти різко відійшли від її архаїчного коріння. Однак існує група сміливих інтелектуалів, які вірять, що за умови належної модернізації та впровадження ми знову зможемо створити спільну мову — на основі чагатайської, але без її найскладніших особливостей."

 BUK_tear_down_the_folk_shrines: "Знести народні святині"
 BUK_tear_down_the_folk_shrines_desc: "Практика ісламу в Центральній Азії зіпсована місцевими забобонами, а божественна істина — спотворена понад тисячу років місцевих перекручень. Ми створили мережу місцевих релігійних рад, які мають стати ланкою між урядом і народом, і боротимуться за знищення зайвих надбудов і хибних тлумачень ісламу."

 BUK_empower_the_national_army: "Реорганізувати республіканську армію"
 BUK_empower_the_national_army_desc: "Без централізованої, організованої й лояльної армії наша молода республіка не має шансів. На відміну від попередників, ми не можемо покладатися на підтримку й командування місцевих феодальних вождів для постачання солдатів і захисту уряду. Натомість ми повинні створити нові інституції військової організації з нуля, викорінити атрофовану офіцерську верхівку Емірату й знищити її традиційну структуру."

 BUK_break_the_crowns: "Зламати корони"
 BUK_break_the_crowns_desc: "Хоча наш народ звільнився від ярма монархічного гніту, ті, хто живе в чужих землях, досі страждають під п’ятою садистських і жорстоких монархів та зловісних інституцій, що підтримують їхню владу. Ми з гордістю беремо участь у хрестовому поході, щоб очистити світ від цих потворних виродків — реліктів старого світу, яких слід витягти, як отруту з рани."

