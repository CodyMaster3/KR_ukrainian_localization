 CEN_land_reform_desc: "Хоча ми вже розібралися з великими землевласниками, перерозподіл їхніх земель був зроблений поспіхом. З нещодавнім успіхом аграрної реформи, з'явився відновлений інтерес до більш справедливого перерозподілу, а також додалася мета збереження будь-якого вільного простору для подальшого промислового будівництва."
 CEN_land_reform_in_yucatan: "Земельна реформа на Юкатані"
 CEN_land_reform_in_guatemala: "Земельна реформа у Гватемалі"
 CEN_land_reform_in_el_salvador: "Земельна реформа в Сальвадорі"
 CEN_land_reform_in_honduras: "Земельна реформа в Гондурасі"
