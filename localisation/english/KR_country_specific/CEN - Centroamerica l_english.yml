### Intro Screen ###
 CEN_guide: "[ROOT.CEN_GetCountryGuideContent]"

 CEN_pre_guide: "Ми отримаємо один із наступних шляхів, залежно від нашої поточної правлячої ідеології, коли завершимо рішення £decision_icon_small §Y$CEN_unite_central_america$§!:\n\n$CEN_guide_soc$\n------------------------------------------\n$CEN_guide_dem$\n------------------------------------------\n$CEN_guide_mil$"

 CEN_guide_soc: "§MЦентральноамериканський Конгрес§! ($radical_socialist_coloured$ / $syndicalist_coloured$ / $totalist_coloured$)\n£white_dot Через деякий час після завершення фокусу §YПерший Центральноамериканський Конгрес§! з'являться 4 події, що стосуються наших внутрішніх справ («$central_america_socialist_events.009.t$», «$central_america_socialist_events.010.t$», «$central_america_socialist_events.011.t$» та «$central_america_socialist_events.012.t$»)\n£white_dot Щоб до влади прийшли §SПомірковані§!, оберіть надати повноваження конгресу, створити консолідовану армію, підтримувати аграрну економіку та дозволити народу вирішувати майбутні вибори.\n£white_dot Щоб до влади прийшли §RРеволюціонери§!, оберіть надати повноваження голові, підтримувати ополчення, підтримувати аграрну економіку та дозволити народу вирішувати майбутні вибори.\n£white_dot Щоб до влади прийшла §rРобітнича Конфедерація§!, оберіть надати повноваження конгресу, підтримувати ополчення, індустріалізувати економіку та дозволити раді вирішувати майбутні вибори.\n£white_dot Щоб до влади прийшли $totalist_coloured$, оберіть надати повноваження голові, створити консолідовану армію, індустріалізувати економіку та дозволити раді вирішувати майбутні вибори.\n\n£white_dot Якщо жодна з партій не має більшості, дві найбільші зайдуть у глухий кут, і ми будемо змушені обрати одну."

 CEN_guide_dem: "§MЦентральноамериканські Вибори§! ($social_conservative_coloured$ / $market_liberal_coloured$ / $social_liberal_coloured$ / $social_democrat_coloured$)\n£white_dot Після завершення фокусу §YРозпочати Конституційний Конвент§! відбудуться блискавичні вибори, на яких зможуть бути обрані §SПартія Праці§!, §lЛіберальна Партія§!, §mПартія Демократичного Об'єднання§!, §cПартія Уніоністів§! та §SНаціональна Революційна Партія§!.\n£white_dot Після цього вибори відбуватимуться кожні 4 роки з тими ж самими партіями.\n\n§MЗовнішня політика§!\n§MАнтанта§!\nАбо:\n£white_dot Завершити фокус §YЗахист Наших Інтересів§!.\n£white_dot Якщо Федерація Вест-Індії перебуває в Антанті; завершити рішення £decision_icon_small §Y$CENdem_status_british_honduras$§! та обрати будь-який варіант у наступній події.\n£white_dot Завершити рішення £decision_icon_small §YПриєднатися до Антанти§!, щоб приєднатися до фракції.\n\n£white_dot Або, завершити фокус §YЗвернутися до Антанти§! та обрати будь-який варіант у наступній події.\n\n§MДемократичний Альянс Карибського Басейну§!\n£white_dot Завершити будь-який із наступних фокусів: §YЗахист Наших Інтересів§!, §YДружба у Центральній Америці§!, §YНакинутися у Влучну Нагоду§! або §YНа Захист Карибського Басейну§!.\n£white_dot Завершити рішення £decision_icon_small §Y$CENdem_form_faction$§!, щоб отримати доступ до рішення запросити всі демократичні нації Центральної Америки, Карибського басейну та північної Південної Америки до нашої фракції."

 CEN_guide_mil: "§MЦентральноамериканський Військовий Конгрес§! ($authoritarian_democrat_coloured$ / $paternal_autocrat_coloured$ / $national_populist_coloured$)\n§CПримітка: Якщо Мартінес та §nНПРП§! були повалені в Сальвадорі, він не зможе стати нашим лідером, і варіанти, які підвищують підтримку $national_populist_coloured$, також не з'являться.§!\n\n£white_dot Після початку фокусу §YВійськовий Конгрес§! з'являться 4 події, що стосуються наших внутрішніх справ («Економіка Центральної Америки», «Новий Голова Міністерства Внутрішніх Справ», «Новий Міністр Закордонних Справ» та «Реформування Армії»), кожна з яких матиме 3 варіанти.\n£white_dot Щоб до влади прийшли Сомоса та §aПомірковані§!, оберіть принаймні тричі варіанти, що надають підтримку $authoritarian_democrat_coloured$.\n£white_dot Щоб до влади прийшли Убіко та §PМілітаристи§!, оберіть принаймні тричі варіанти, що надають підтримку $paternal_autocrat_coloured$.\n£white_dot Щоб до влади прийшли Мартінес та §nРадикали§!, оберіть принаймні тричі варіанти, що надають підтримку $national_populist_coloured$.\n\n£white_dot Якщо жодна з фракцій не зможе отримати достатньої підтримки, ми зможемо обрати, яка з трьох фракцій прийде до влади.\n\n§MЗовнішня політика§!\n£white_dot Щоб отримати доступ до нашого рішення щодо зовнішньої політики, ми повинні завершити наступний фокус залежно від нашого шляху: §YТривалий Режим§!, §YПолітичне Домінування§! або §YНаціональна Монополія§!.\n§MРайхспакт§!\n£white_dot Завершити рішення £decision_icon_small §Y$CENmil_protection_GER$§! і після отримання гарантії від них завершити рішення £decision_icon_small §YПриєднатися до Райхспакту§!.\n§MАнтанта§!\n£white_dot Завершити рішення £decision_icon_small §YСтатус Белізу§! та обрати будь-який варіант у наступній події.\n£white_dot Завершити рішення £decision_icon_small §Y$CENmil_protection_ENT$§! і після отримання гарантії від них завершити рішення £decision_icon_small §YПриєднатися до Антанти§!.\n§MСполучені Штати§!\n£white_dot Домогтися, щоб не-соціалістична Америка виграла свою громадянську війну, щоб з'явилося рішення £decision_icon_small §Y$CENmil_protection_US$§!, завершити його. Почекати, доки вони приєднаються або створять фракцію, щоб з'явилося рішення про приєднання до цієї фракції, та завершити його."

### Characters ###
 CEN_revolutionary_council: "Революційна рада"
 CEN_revolutionary_council_leader_desc: "§YПоходження:§! §LЦентральна Америка нарешті возз'єдналася, але політична структура нації ще не остаточно сформована. Наразі створено тимчасовий перехідний уряд, у якому номінально представлені більшість соціалістичних владних блоків з усього регіону.§!"

 CEN_democratic_council: "Центральноамериканська рада"
 CEN_democratic_council_leader_desc: "§YПоходження:§! §LЦентральна Америка нарешті возз'єдналася, але політична структура нації ще не остаточно сформована. Наразі створено тимчасовий перехідний уряд, у якому номінально представлені більшість демократичних владних блоків з усього регіону.§!"

 CEN_military_council: "Військова рада"
 CEN_military_council_leader_desc: "§YПоходження:§! §LЦентральна Америка нарешті возз'єдналася, але політична структура нації ще не остаточно сформована. Наразі створено тимчасовий перехідний уряд, у якому номінально представлені більшість владних блоків, що базуються на збройних силах, з усього регіону.§!"

### Decisions ###
 Forming_Central_America: "Центральноамериканська політика"
 Forming_Central_America_desc: "Політика в Центральній Америці часом може бути складною. Вона глибоко пов'язана з грою один проти одного, залишаючись при цьому на хорошому боці тих, хто поклав око на регіон, і в ній потрібно буде ретельно орієнтуватися."

 CEN_unite_central_america: "[CEN_unite_central_america_title]"
 CEN_unite_central_america_desc: "[CEN_unite_central_america_description]"

 CEN_unite_central_america_socialist: "Створити Центральну Америку"
 CEN_unite_central_america_socialist_desc: "Революція перемогла! Кайдани військового уряду і тих, хто виступає проти соціалізму, було скинуто з наших законних земель, залишивши по собі лише звільнені землі. Це був би ідеальний час для створення об'єднаної Центральної Америки, щоб назавжди захиститися від іноземного впливу."
 CEN_unite_central_america_liberal: "Створити Центральноамериканську Конфедерацію"
 CEN_unite_central_america_liberal_desc: "Після усунення корумпованих військових урядів і радикальних соціалістів, все, що залишилося в Центральній Америці - це ідея лібералізму. Разом ми звільнимо народи Центральної Америки як від самих себе, так і від зовнішніх загроз."
 CEN_unite_central_america_military: "Створити Центральноамериканську Республіку"
 CEN_unite_central_america_military_desc: "Зараз ми стоїмо вище за всіх інших як військові уряди, орієнтовані на Америку, з ідеями лібералізму та соціалізму, які були ретельно придушені. Тепер ми можемо сформувати центральноамериканську націю, щоб принести користь нації, а також допомогти американцям у їхньому скрутному становищі."

 CEN_conflict_escalates_mission: "Битва за Центральну Америку"
 CEN_conflict_escalates_mission_desc: "Те, що колись здавалося таким достатком, скоро залишиться в минулому. Мир - це те, чого ми не знатимемо деякий час, оскільки весь регіон вступає в конфлікт. Безсумнівним є те, що Центральна Америка зміниться назавжди, і саме від нас залежить, чи зміниться вона на краще. Доля регіону лежить на шальках терезів..."

 CEN_form_ties: "Налагодити зв'язки з [FROM.GetNameDef]"
 CEN_form_ties_desc: "[CEN_form_ties_desc_text]"

 CEN_form_ties_GUA_socialist: "Гватемальцям нарешті вдалося повалити попередні три десятиліття військового правління, забезпечивши державу для себе. Хоча Гватемала все ще перебуває в коаліції з Партією єдності, сьогодні великий день для Гватемали, з яким ми повинні їх привітати."
 CEN_form_ties_ELS_socialist: "Сальвадор зумів помститися за різанину 1932 року, усунувши від влади занепадницьку партію "Про-Патріа". Їхній народ більше не буде забитий, як свині, натомість бачить нове світле життя в майбутньому, в яке ми можемо крокувати разом."
 CEN_form_ties_HON_socialist: "Хоча "революція" в Гондурасі кілька років тому була дещо світлішою порівняно зі старим диктатором, селянська рада виявилася лише ще однією замаскованою диктатурою. Однак це не надовго, адже гондураський народ звільнився і крокує до нового світла для Центральної Америки, до якого ми підемо разом з ним."
 CEN_form_ties_NIC_socialist: "З 1932 року Нікарагуа слугує домівкою для ідеалів центральноамериканського соціалізму, і вони не підвели нас. Залишаючись завжди вірними революції, ми тепер крокуватимемо до світла пліч-о-пліч з ними, щоб звільнити решту Центральної Америки."

 CEN_form_ties_GUA_liberal: "Гватемалі вдалося вийти з коаліції з соціалістами, на чолі якої стала Партія єдності. Тепер Гватемала має слугувати маяком демократичної єдності Центральної Америки, і ми повинні стати її союзником."
 CEN_form_ties_ELS_liberal: "Сальвадору вдалося відновити посаду президента після правління партії "Про-Патріа". Ми повинні переконатися, що залишимося на їхньому боці у випадку майбутніх конфліктів."
 CEN_form_ties_HON_liberal: "Гондурасу вдалося провести свої перші по-справжньому відкриті вибори після розпаду Америки, що відкриває можливість створення нового демократичного бастіону в Центральній Америці. Ми повинні зробити так, щоб він таким і залишився."
 CEN_form_ties_NIC_liberal: "Нікарагуа несподіваним поворотом подій вдалося усунути Сандіно з Нікарагуа і встановити "Справжню революційну республіку", засновану на ідеалах лібералізму. Ми повинні приєднатися до них у святкуванні цієї трансформації."

 CEN_form_ties_GUA_military: "Завдяки загальній наполегливості та рішучості Ліберальна партія Гватемали утримала владу, незважаючи на революційну загрозу. Ми повинні зробити так, щоб вони ніколи більше не опинилися під загрозою."
 CEN_form_ties_ELS_military: "Диктатура в Сальвадорі зуміла пережити другу революцію за останнє десятиліття, довівши свою стійкість. Ми повинні забезпечити подальшу співпрацю з ними в майбутньому."
 CEN_form_ties_HON_military: "Нова влада Гондурасу в 30-х роках зуміла зберегти себе, переживши важкі випробування, які принесла Громадянська війна в США. В ім'я запобігання нової кризи, подібної до цієї, ми повинні забезпечити тіснішу співпрацю між нашими країнами."
 CEN_form_ties_NIC_military: "Нікарагуа вдалося опинитися на задвірках війни проти Гондурасу, де до влади прийшла вигнана Гвардія. Можливо, нам варто відправити туди посланця, щоб привітати їх?"

 CEN_found_revolutionary_pact: "Заснувати Революційний фронт"
 CEN_found_revolutionary_pact_desc: "Обговоривши це з багатьма нашими політиками, ми дійшли висновку, що нам потрібно укласти пакт між нинішніми і майбутніми соціалістичними країнами Центральної Америки, щоб протистояти лібералам і диктаторам, які виступають проти нас."

 CEN_found_liberal_pact: "Заснувати Ліберальний пакт"
 CEN_found_liberal_pact_desc: "Ідея пакту між ліберальними країнами Центральної Америки - це те, що ми повинні розглянути, щоб протистояти військовим урядам і соціалістичним революціонерам разом з іншими країнами в майбутньому."

 CEN_found_military_pact: "Заснувати Народний авангард"
 CEN_found_military_pact_desc: "Народний авангард, покликаний захистити центральноамериканців від зовнішніх загроз, намагається чинити опір революції за будь-яку ціну."

 CEN_join_faction: "Приєднатися до [ROOT.CEN_join_faction_title]"
 CEN_join_faction_socialist: "[CEN_socialist_leader.GetFactionName]"
 CEN_join_faction_military: "[CEN_military_leader.GetFactionName]"
 CEN_join_faction_liberal: "[CEN_liberal_leader.GetFactionName]"

 CEN_join_faction_desc: "[ROOT.CEN_join_faction_desc]"
 CEN_join_faction_desc_socialist: "Революційний фронт, заснований однодумцями, які сподіваються об'єднатися, щоб принести соціалізм у Центральну Америку. Наше завдання - приєднатися до нього заради наших братів за кордоном."
 CEN_join_faction_desc_military: "Народний авангард був заснований у спробі захистити людей від них самих, і це, безумовно, те, до чого нам варто було б приєднатися."
 CEN_join_faction_desc_liberal: "Ліберальний пакт був заснований демократичною країною, готовою повалити як соціалістичні, так і автократичні режими в ім'я народу."

 CEN_leave_faction: "Покинути [FROM.GetFactionName]"

 CEN_invite_country_to_faction: "Запросити [FROM.GetNameDef] до [ROOT.GetFactionName]"
 CEN_invite_country_to_faction_desc: "[CEN_invite_country_to_faction_desc_text]"

 CEN_invite_country_to_faction_GUA_socialist: "Гватемалі вдалося покласти край трьом десятиліттям військового застою, і вона готова рухатися в майбутнє. Разом ми звільнимо Центральну Америку."
 CEN_invite_country_to_faction_ELS_socialist: "Гондурас, незважаючи на те, що дехто ставить під сумнів їхні методи правління, став жертвою революції і є необхідним членом фронту."
 CEN_invite_country_to_faction_HON_socialist: "Сальвадор, маючи одного з найжорстокіших диктаторів у всій Центральній Америці, зумів звільнитися від кайданів, що їх зв'язували. Їх участь на фронті необхідна."
 CEN_invite_country_to_faction_NIC_socialist: "Нікарагуа служила бастіоном центральноамериканської революції з 1933 року і буде важливим членом фронту."

 CEN_invite_country_to_faction_GUA_liberal: "Гватемалі вдалося завершити свою боротьбу за свободу та ідеали об'єднання Центральної Америки, і вона готова приєднатися до нас у нашій боротьбі за свободу."
 CEN_invite_country_to_faction_ELS_liberal: "Зараз Сальвадор є законною президентською республікою, яка бачить світло демократії та ідеалів лібералізму."
 CEN_invite_country_to_faction_HON_liberal: "Гондурасу вдалося мирно перейти до періоду демократії, і, здається, він готовий приєднатися до нас у нашій боротьбі проти тих, хто нам протистоїть."
 CEN_invite_country_to_faction_NIC_liberal: "Нікарагуа вдалося позбутися особистих кайданів як соціалізму, так і Сполучених Штатів, і вона готова стояти разом з нами за кращу Центральну Америку."

 CEN_invite_country_to_faction_GUA_military: "Десятирічне президентство Гватемали вдалося утримати кров'ю, потом і сльозами, і вона готова забезпечити збереження статус-кво раз і назавжди."
 CEN_invite_country_to_faction_ELS_military: "Сальвадор, переживши свою другу революцію, вважає, що готовий викорінити соціалізм і лібералізм, щоб запобігти ще більшій кількості смертей серед свого народу."
 CEN_invite_country_to_faction_HON_military: "Гондурасу вдалося зберегти статус-кво протягом минулого року, довівши свою готовність захищати свій народ від самого себе в Народному авангарді."
 CEN_invite_country_to_faction_NIC_military: "Нікарагуа змогла стати незалежною після окупації Гондурасу і вважає, що готова допомогти нам у нашій справі."

 CEN_attack_country: "[CEN_attack_country_title]"
 CEN_attack_country_desc: "[CEN_attack_country_description]"

 CEN_attack_country_socialist_vs_liberal: "Покінчити з дрібним лібералізмом"
 CEN_attack_country_socialist_vs_liberal_desc: "Хоча лібералізм і не становить такої прямої загрози, як диктатори навколо нас, він є дуже небезпечною причиною, оскільки слугує нашою прямою протидією. Він також повинен бути викорінений."

 CEN_attack_country_socialist_vs_military: "Повалити диктаторів"
 CEN_attack_country_socialist_vs_military_desc: "Ці диктатори занадто довго перешкоджали розвитку соціалізму, і тепер це закінчиться."

 CEN_attack_country_liberal_vs_socialist: "Викорінити радикалів"
 CEN_attack_country_liberal_vs_socialist_desc: "Соціалізм є прямою загрозою свободі та самовизначенню народу і становить таку ж загрозу, як і деспотичні диктатори."

 CEN_attack_country_liberal_vs_military: "Відновити нашу долю"
 CEN_attack_country_liberal_vs_military_desc: "Наші давні суперники, військові та диктатори Центральної Америки, нарешті будуть притягнуті до відповідальності раз і назавжди нашими власними руками."

 CEN_attack_country_military_vs_socialist: "Викорінити соціалізм"
 CEN_attack_country_military_vs_socialist_desc: "З напруженістю, готовою вибухнути будь-якої хвилини в Центральній Америці, можливо, настав час розпалити конфлікт з соціалістами?"

 CEN_attack_country_military_vs_liberal: "Покласти край загрозі лібералізму"
 CEN_attack_country_military_vs_liberal_desc: "Лібералізм загрожував нашому виду досить довго, і коли ситуація вже досягла точки кипіння, чому б не почати все це з лібералів?"

