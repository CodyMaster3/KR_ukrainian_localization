### Central American Flavour by Drozdovite
### Events ###
 central_america_flavour_events.1.t: "Археологічна Експедиція до Місцевості Сан-Андрес"
 central_america_flavour_events.1.d: "Американський археолог Джон Діммік прибув сьогодні до нашої країни і висловив дуже особливе прохання. У садибі Сан-Андрес відвідувачі родини Дуеньяс повідомили про частково поховані стародавні споруди, які можуть пролити світло на історію доколумбових Мезоамериканських цивілізацій. Він стверджує, що повністю профінансує експедицію з власних коштів, і їм просто потрібно, щоб ми дали зелене світло. [Root.GetLeader] вже оголосив про свою підтримку проєкту та особисто зв'язався з родиною Дуеньяс, щоб попросити дозволу на відвідування їхніх земель експедицією. Після зустрічі з представником родини Дуеньяс, Дімміком та [Root.GetLeader], вони погодилися надати експедиції карт-бланш на місці розкопок до кінця травня, з наближенням сезону дощів. Сподіваємося, їхні відкриття підтримуватимуть інтерес археологів до нашої країни протягом багатьох років."
 central_america_flavour_events.1.a: "Вони можуть досліджувати наше Минуле."

 central_america_flavour_events.2.t: "Вулкан Ісалько Посилює Свою Стромболіанську Активність"
 central_america_flavour_events.2.d: "Вулкан Ісалько, розташований у департаменті Сансонате, Сальвадор, розпочав серію нерегулярних вивержень, порушуючи цикл одного стромболіанського виверження на місяць до майже одного кожні двадцять хвилин, разом із збільшенням кількості попелу та лави, що виходить з його надр. Хоча Ісалько вивергається майже безперервно з моменту свого народження у 1722 році, «Фаро дель Пасіфіко» (Маяк Тихого океану) спричиняє занепокоєння серед нашого населення, оскільки починають з'являтися побоювання щодо сильного вулканічного виверження."
 central_america_flavour_events.2.a: "Нам доведеться пильно стежити за ним."

 central_america_flavour_events.3.t: "Вулкан Ісалько Ще Більше Посилює Свою Стромболіанську Активність"
 central_america_flavour_events.3.d: "Звіти наших геологів свідчать про те, що вулкан Ісалько справді ще більше посилює свою активність, ніж раніше. Тепер вулкан вивергається раз на вісім хвилин, і місцеве цивільне населення стає все більш неспокійним щодо ситуації, оскільки наразі немає жодних урядових планів на випадок виверження."
 central_america_flavour_events.3.a: "Підготувати плани евакуації, про всяк випадок..."

 central_america_flavour_events.4.t: "Вулкан Ісалько Повертається до Нормального Рівня Активності"
 central_america_flavour_events.4.d: "Незважаючи на нещодавню паніку щодо вулкана Ісалько, наші геологи повідомляють, що вулкан нарешті повернувся до своєї нормальної активності, і хоча він все ще має звичайні викиди попелу та лави у південний сектор, народ Сансонате може бути спокійний, оскільки вулканічна активність починає відступати."
 central_america_flavour_events.4.a: "Дякувати Богу, що це скінчилося."

 central_america_flavour_events.5.t: "Повінь у Сан-Сальвадорі"
 central_america_flavour_events.5.d: "Через нещодавню погоду та погане обслуговування дренажної системи Сан-Сальвадора, у Сальвадорському місті сталася повінь. Хоча про загиблих внаслідок інциденту не повідомлялося, шкода, завдана інфраструктурі міста, все ще значна, і знадобиться деякий час, доки місто повернеться до нормального життя."
 central_america_flavour_events.5.a: "Прикрий поворот подій."

 central_america_flavour_events.6.t: "Виверження Вулкана Парікутін у Мічоакані"
 central_america_flavour_events.6.d: "Сьогодні ми отримали повідомлення про погані новини з маленького містечка Парікутін. Найближчий вулкан Парікутін почав вивергатися вдень, і населення маленького містечка тепер під загрозою дощу з попелу, і наші фахівці підтверджують, що потік лави покриє місто за поточного темпу викидів. Було наказано негайно евакуювати населення міста, і мають розпочатися зусилля з їхнього переселення поблизу Уруапана. Однак це вимагатиме часу та зусиль, але це необхідний крок для забезпечення безпеки наших громадян від стихійного лиха."
 central_america_flavour_events.6.a: "Прикрий поворот подій."

 central_america_flavour_events.7.t: "Землетрус Вражає Гватемалу!"
 central_america_flavour_events.7.d: "О 17:37 розпочався землетрус силою 7,7 балів за шкалою Ріхтера поблизу тихоокеанського узбережжя Гватемали. Землетрус завдав значної шкоди інфраструктурі району, поваливши телеграфні лінії та зруйнувавши Міжамериканське шосе. Місто Текпан також було сильно пошкоджене, причому майже 60% цивільного житла було зруйновано землетрусом. Історичний Паласіо де лос Капітанес Хенералес в Антігуа-Гватемала також був частково пошкоджений, як і багато старих церков колоніальної епохи в цьому районі. На жаль, тридцять вісім людей загинули в цьому трагічному інциденті, і тепер нам доведеться боротися з наслідками такого жахливого стихійного лиха."
 central_america_flavour_events.7.a: "Сподіваємося, це не перший із багатьох."

 central_america_flavour_events.8.t: "Заснування Регіонального Музею Археології в Копані"
 central_america_flavour_events.8.d: "Сьогодні в місті Копан нарешті було засновано Регіональний Музей Археології. Археологічна пам'ятка Копан є одним із найбільших збережених архітектурних комплексів раннього докласичного періоду, а також одним із найбільших міст стародавньої цивілізації Майя. У 1935 році об'єкт був закритий для громадськості, і було проведено масштабні реставраційні роботи, причому головною увагою реставраційних зусиль були Акрополь, головна площа, «Сходи ієрогліфів», Храми 11 та 22, а також «38 Естел» та всі вівтарі. З відкриттям музею археологічна пам'ятка знову відкрита для публіки, щоб дослідити минуле доколумбової Центральної Америки."
 central_america_flavour_events.8.a: "Ще один крок до збереження нашої історії."

 central_america_flavour_events.9.t: "Землетрус Вражає Сальвадор"
 central_america_flavour_events.9.d: "Сильний землетрус вразив невеликі містечка Санта-Клара та Сан-Естебан, що лежать поблизу вулкана Сан-Вісенте. Землетрус силою 6,1 балів за шкалою Ріхтера знищив невеликі містечка, забравши життя двохсот людей та спричинивши значні пошкодження як у обох містечках, так і на дорогах, що їх з'єднують. Однак, землетрус, схоже, не був спричинений найближчим вулканом, тож жителі департаменту Сан-Вісенте можуть зітхнути з полегшенням, оскільки вулкан не подає жодних ознак активізації найближчим часом."
 central_america_flavour_events.9.a: "Сподіваємося, наша удача покращиться."

 central_america_flavour_events.10.d: "Черговий землетрус вразив Сальвадор, цього разу в муніципалітеті Агуачапан. Землетрус, силою 5,9 балів за шкалою Ріхтера, завдав серйозної шкоди муніципалітетам Агуачапан та Атікізайя. На щастя, про загиблих внаслідок землетрусу не повідомлялося, і хоча фізичні пошкодження обох муніципалітетів значні, їхнє відновлення не буде складним завданням, оскільки обидва вони були досить нерозвиненими."
 central_america_flavour_events.10.a: "Принаймні всі в безпеці."

 central_america_flavour_events.11.d: "Черговий землетрус вразив Сальвадор, цього разу в муніципалітеті Хукуапа. Землетрус розпочався о 5:02 ранку силою 6,2 балів за шкалою Ріхтера, і коли аварійні служби вже мобілізовувалися, о 5:06 ранку розпочався ще один землетрус, який завдав ще більшої шкоди, ніж перший. Землетрус спричинив серйозні пошкодження в департаментах Ла-Пас, Усулутан та Сан-Мігель, і за оцінками, забрав життя чотирьохсот людей, поранив майже тисячу та залишив без даху над головою понад двадцять тисяч людей. Комітет «Comité General Ejecutivo Prodamnificados» вже розробляє плани переселення жертв до Сальвадору, але це буде дороге починання..."
 central_america_flavour_events.11.a: "Схоже, що Мати-Природа сьогодні помстилася..."

 central_america_flavour_events.12.t: "Тропічний Шторм Вражає Нікарагуанське Атлантичне Узбережжя"
 central_america_flavour_events.12.d: "Шторм вразив наше Атлантичне узбережжя і зараз триває в цьому районі. З сильними вітрами та небезпечним припливом торгівля з Атлантикою була тимчасово призупинена, і багато хто побоюється, що шторм посилиться найближчим часом. Хоча сам шторм не подає жодних ознак погіршення, можливо, було б розумно почати готувати зусилля з евакуації на випадок, якщо насувається ураган..."
 central_america_flavour_events.12.a: "Нам потрібно готуватися до найгіршого."

 central_america_flavour_events.13.t: "Ураган Вражає Нікарагуанське Атлантичне Узбережжя"
 central_america_flavour_events.13.d: "Коли наші плани були нарешті завершені, сталося найгірше: ураган сформувався поблизу наших берегів, і його сильні вітри почали спустошувати Пуерто-Кабесас, перш ніж рушити вгору до Карибського моря. На щастя, наші плани евакуації спрацювали досить швидко, щоб уникнути будь-яких жертв серед цивільного населення, але район потрібно буде відремонтувати, щоб він знову запрацював."
 central_america_flavour_events.13.a: "Ми добре обрали і ефективно підготувалися."

 central_america_flavour_events.14.t: "Черговий Ураган Вражає Нікарагуанське Атлантичне Узбережжя"
 central_america_flavour_events.14.d: "Ураган знову вдарив по Нікарагуанському Атлантичному узбережжю. Шторм сформувався майже з нічого, і непідготовлене цивільне населення постраждало через непередбачуваність Центральноамериканської погоди. На щастя, шторм прямував до Мексиканської затоки і не торкнувся берега, але сильні вітри все ж завдали деякої шкоди по всьому Центральноамериканському Атлантичному узбережжю."
 central_america_flavour_events.14.a: "Нам пощастило, що він не прямував до нас."

 central_america_flavour_events.15.t: "Парікутін Загрожує Санта-Ана-Сіросто"
 central_america_flavour_events.15.d: "Оскільки виверження Парікутіна триває, ще одне містечко опиняється на шляху руйнування. Невелике містечко Санта-Ана-Сіросто, засноване за колоніальних часів, тепер знаходиться на шляху потоків лави. Місту наказано евакуюватися, і вони приєднаються до населення Парікутіна в зусиллях з переселення поблизу Уруапана."
 central_america_flavour_events.15.a: "Нам залишається лише сподіватися, що вони зможуть оговтатися."

 central_america_flavour_events.16.t: "Парікутін Загрожує Сан-Хуан-Парангарікутіро"
 central_america_flavour_events.16.d: "Хоча наші фахівці запевняють нас, що виверження Парікутіна наближається до кінця, містечко Сан-Хуан-Парангарікутіро, з майже двома тисячами жителів, тепер знаходиться на шляху лави. На щастя, мер уже готував запасний план на випадок, якщо вулкан загрожуватиме місту, але наша допомога все одно буде доречною. Місто та його жителі будуть переселені до старої ферми Конехос, майже за тридцять кілометрів від початкового місця розташування міста. Президент [Root.GetLeader] похвалив мера за його передбачливість, і зусилля з переселення вже тривають."
 central_america_flavour_events.16.a: "Сподіваємося, це скоро закінчиться."

 central_america_flavour_events.17.t: "Парікутін Нарешті Припиняє Виверження"
 central_america_flavour_events.17.d: "Вулкан Парікутін нарешті припинив випускати лаву, і хоча вулкан може все ще становити загрозу для найближчого населення протягом наступних років, ми уникли великої катастрофи, евакуювавши наше цивільне населення, і хоча хмари попелу все ще можуть впливати на наші найближчі сільськогосподарські угіддя та містечка. Міста, які були поховані, будуть оголошені меморіалами для старих мешканців і вважатимуться невід'ємною частиною їхньої адміністрації, незважаючи на їхнє переселення, щоб вони могли робити зі своїми старими містами все, що забажають."
 central_america_flavour_events.17.a: "Нарешті, це скінчилося."

 central_america_flavour_events.18.t: "Щорічне Святкування «15 вересня»"
 central_america_flavour_events.18.d: "Сьогодні весь Центральноамериканський регіон святкує день, коли делегація депутатів з усіх тепер уже колишніх провінцій Іспанії зібралася у мерії міста Гватемала та разом підготувала декларацію Незалежності, написану Хосе Сесіліо дель Вальє, яка перетворила наші колись іноземно-керовані країни на вільні нації. Протягом усього вересня вся Центральна Америка святкує, кожна зі своїми відмінними традиціями, використовуючи всілякі розваги від парадів та концертів до публічних промов високопоставлених урядовців. Сьогодні справді день єдності для наших націй!"
 central_america_flavour_events.18.a: "¡Feliz Día de la Independencia! (З Днем Незалежності!)"

 central_america_flavour_events.20.t: "Публікація Книги «Археологія Північного Узбережжя Гондурасу»"
 central_america_flavour_events.20.d: "Американський археолог та етнограф Доріс Земюррей Стоун опублікувала свою книгу, що містить висновки різних археологів щодо кількох Центральноамериканських археологічних пам'яток у Гондурасі. Одна з найкращих робіт археологічних досліджень у своїй галузі, її книга зосереджується переважно на нотатках Джорджа Клаппа Вайланта та Дороті Поупноу щодо Плайя де лос Муертос та на тому, як вони формують новий образ Мезоамериканських культур. Книга швидко стала обов'язковою для прочитання для будь-якого ентузіаста доколумбової Мезоамериканської історії та підняла престиж молодого директора Національного музею Коста-Ріки на нові висоти."
 central_america_flavour_events.20.a: "Її робота змушує нас усіх пишатися."

