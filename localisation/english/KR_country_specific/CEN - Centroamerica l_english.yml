 CEN_extent_road_south: "Продовження Дороги на Південь"
 CEN_infra_project_in_costa_rica: "Розширення інфраструктури в Коста-Ріці"
 CEN_infra_project_in_panama: "Розширення інфраструктури в Панамі"

 CEN_resources_decisions: "Рішення щодо ресурсів"
 CEN_nationalize_MEX_oil: "Націоналізувати Мексиканську нафтову промисловість"
 CEN_nationalize_MEX_oil_desc: "Війна з Юкатаном не дозволила Мексиці націоналізувати свою нафту, що дало змогу іноземним компаніям продовжувати її експлуатувати. Давайте виправимо це і використаємо прибутки для поліпшення нашого народу."
 CEN_steal_southern_MEX_resources: "Захопити Ресурси Південної Мексики"
 CEN_steal_southern_MEX_resources_desc: "Наша нація гостро потребує ресурсів для стимулювання наших промислових проєктів, але з нашим завоюванням, а тепер і домінуванням над Мексикою, відкрилася можливість захопити їхні ресурси. Але хоча було б добре володіти всіма їхніми ресурсами, інфраструктури, необхідної для їх транспортування, бракує, тож давайте задовольнимося лише районами, що знаходяться нижче і поблизу Мехіко."
 CEN_request_oil: "Запит на Додаткову Нафту"
 CEN_lower_oil: "Знизити імпорт Нафти"

 CEN_naval_expansion: "Розширення Нашого Флоту"
 CEN_subs: "Фінансування Нових Підводних Човнів"
 CEN_destroyers: "Фінансування Нових Есмінців"
 CEN_cruisers: "Фінансування Нових Крейсерів"
 CEN_battleships: "Фінансування Нових Лінкорів"
 CEN_battlecruiser: "Фінансування Нових Лінійних Крейсерів"

 CEN_expanding_socialism_in_central_america: "Розширення Соціалізму в Центральній Америці"
 CEN_core_british_honduras: "Завершити Інтеграцію Белізу"
 CEN_core_british_honduras_desc: "Оскільки більшість наших нагальних внутрішніх проблем вирішено, обраний нами уряд сформулював спосіб залучити Беліз глибше до союзу."
 CEN_take_costa_rica: "Повернути Коста-Ріку до Союзу"
 CEN_take_panama: "Принести Соціалізм у Панаму"
 CEN_approach_yucatan: "Зблизитися з Юкатаном"
 CEN_dealing_with_mexico: "Врегулювання Справ з Нашим Північним Сусідом"
 CEN_dealing_with_mexico_desc: "Занадто довго ми, як Центральноамериканці, терпіли [MEX.GetName]. Тепер, коли вони одягли авторитарний капелюх, ми більше не можемо цього терпіти. Ми повинні завдати удару якнайшвидше, інакше ми можемо опинитися у програшній ситуації у війні з ними."
 CEN_integrate_yucatan: "Інтегрувати Юкатан"

 CEN_increasing_totalist_support: "Збільшення Нашої Підтримки Серед Населення"
 CEN_antitotalist_timer: "Зростаюча Підозра"
 CEN_antitotalist_timer_desc: "Наші нещодавні більш спокійні дії привернули увагу Поміркованих, які, здається, більш недовірливі, ніж будь-коли. Ми не повністю впевнені, чи розкрили вони наші плани, але краще просто продовжувати їх реалізацію."
 CEN_begin_talks_in_guatemala: "Розпочати Переговори у Гватемалі"
 CEN_begin_talks_in_el_salvador: "Розпочати Переговори в Сальвадорі"
 CEN_begin_talks_in_nicaragua: "Розпочати Переговори в Нікарагуа"

### Focuses ###
 CEN_congress: "Перший Центральноамериканський конгрес"
 CEN_congress_desc: "Ми об'єднали всі держави Центральної Америки під одним прапором, але тепер ми повинні вирішити, як керувати цією країною.\nМи закличемо всіх членів конгресу і проведемо Перший Центральноамериканський конгрес!"
 CEN_congress_totalist: "Максимісти"
 CEN_congress_totalist_desc: "Тоталісти безкарно панують!"
 CEN_atheistic_socialism: "Атеїстичний соціалізм"
 CEN_atheistic_socialism_desc: "Богу немає місця в управлінні нацією, тільки люди.\nМи запевнимо, що всі підуть істинним соціалістичним шляхом, атеїстичним шляхом."
 CEN_ensure_loyal_officers: "Забезпечення лояльності офіцерів"
 CEN_ensure_loyal_officers_desc: "Є й такі, що не погоджуються з нашими методами.\nДля того, щоб наша країна рухалася без перешкод, ми повинні гарантувати, що всі будуть слідувати за нами, з силою чи без неї."
 CEN_purging_foreign_influence: "Очищення від іноземного впливу"
 CEN_purging_foreign_influence_desc: "Не тільки зсередини, але й ззовні намагаються підірвати нашу владу.\nВжиття заходів для того, щоб жодна іноземна держава або, що ще гірше, капіталісти не спричинили хаосу, має вирішальне значення."
 CEN_our_supreme_chairman: "Наш Верховний Голова"
 CEN_our_supreme_chairman_desc: "Центральним стовпом нашого товариства є голова Венасіо Кальєхас.\nВін подорожуватиме країною, переконуючись, що всі знають, хто допоміг нам вийти з темної ночі у світлий день!"
 CEN_congress_syndicalist: "Синдикалісти"
 CEN_congress_syndicalist_desc: "Синдикалісти правлять для всіх!"
 CEN_give_natives_some_love: "Права корінних народів"
 CEN_give_natives_some_love_desc: "Ми не самотні в цьому світі і в цій країні.\nМи повинні усвідомити це і залишити будь-які імперіалістичні думки позаду.\nВстановлення прав корінних народів забезпечить зростання нашої бази."
 CEN_promote_trade_unionism: "Сприяння профспілкам"
 CEN_promote_trade_unionism_desc: "Працівники є основою будь-якої нації. Сприяння розвитку профспілок гарантує, що працівники залишатимуться щасливими і, що більш важливо, лояльними."
 CEN_european_model: "Європейська модель"
 CEN_european_model_desc: "Синдикалізм має європейське коріння, і ми повинні йти їхнім шляхом, якщо хочемо досягти успіху."
 CEN_central_american_identity: "Центральноамериканська ідентичність"
 CEN_central_american_identity_desc: "Щоб наша нація вижила довше, ніж кілька десятиліть, ми повинні зробити так, щоб наші люди бачили себе не сальвадорцями чи гватемальцями, а центральноамериканцями.\nМи всі - брати"
 CEN_empower_chairman: "Надання повноважень голові"
 CEN_empower_chairman_desc: "Щоб змінити світ на краще, нам потрібна одна людина, яка представлятиме нас. Наявність голови повністю відповідає цій меті."
 CEN_empower_congress: "Надання повноважень конгресу"
 CEN_empower_congress_desc: "Правління виборного конгресу гарантує, що наша країна залишиться бастіоном соціалізму.\nОдна людина не може керувати нацією, але багато хто може."
 CEN_consolidate_army: "Консолідація армії"
 CEN_consolidate_army_desc: "Будучи новою нацією, народженою з багатьох, ми маємо розрізнену армію. Ми повинні консолідувати її, щоб забезпечити компетентну оборону."
 CEN_retain_militias: "Збереження ополчення"
 CEN_retain_militias_desc: "Ліси, гори та узбережжя - у нас є все. Кожен регіон знає свою територію найкраще, а збереження розрізненої природи означає, що ми готові скрізь."
 CEN_socialist_breadbasket: "Соціалістична житниця"
 CEN_socialist_breadbasket_desc: "Основою будь-якої нації є фермерські господарства, аграрії! Забезпечення того, щоб цей кістяк залишався міцним, означає, що ми можемо підтримати велику націю!"
 CEN_a_step_forward: "Крок вперед"
 CEN_a_step_forward_desc: "Якщо ми хочемо зберегти актуальність, ми повинні йти в ногу з часом та індустріалізуватися. Заводи - це майбутнє!"
 CEN_peoples_elections: "Всенародні вибори"
 CEN_peoples_elections_desc: "Саме для людей існує наш уряд, і саме волею народу буде обраний наш уряд. Давайте залишимо часи автократії позаду і відкриємо нову еру для Центральної Америки, коли держава служитиме народу, а не навпаки."
 CEN_congress_elections: "Вибори Конгресу"
 CEN_congress_elections_desc: "Люди не повинні перейматися вибором того, хто буде лідером. Політика - це складне павутиння, і люди повинні зосередити свої зусилля на власному житті."
 CEN_congress_radical_socialist: "Революціонери"
 CEN_congress_radical_socialist_desc: "Радикальні соціалісти були очевидним вибором для управління нашою країною, і тому зараз вони керують Конгресом і всіма державними справами!"
 CEN_develop_core_of_country: "Внутрішній розвиток"
 CEN_develop_core_of_country_desc: "Нікарагуа та Гондурас є найбільш слаборозвиненими регіонами союзу.\nКорупція з боку іноземних впливів ніколи не дозволяла регіону процвітати, але ми виправимо це, запровадивши швидкі реформи, надавши допомогу фермерам та провівши повний перерозподіл усіх колишніх земель UFC."
 CEN_religious_socialism: "Релігійний соціалізм"
 CEN_religious_socialism_desc: "Протягом століть релігія відігравала важливу роль. Щоб керувати народом, ми повинні включити її в нашу соціалістичну політику."
 CEN_hispanfication: "Іспанізація"
 CEN_hispanfication_desc: "Ми повинні бути єдиними, і найкращий підхід - це мати однакову, вищу культуру: розмовляти іспанською, мати однакові традиції, однакові свята і так далі. Ми повинні прагнути до цього ідеалу, зупинити іноземців від блуду і розбещення іспаномовної раси.\nХочуть вони того чи ні.\nЦентральноамериканські аборигени можуть чинити опір, але з цією проблемою ми розберемося пізніше!"
 CEN_militarization: "Висока мілітаризація"
 CEN_militarization_desc: "Вороги соціалізму оточують нас з усіх боків, і ми повинні бути готові будь-якої миті взяти в руки зброю і захистити нашу націю!\nДуже важливо, щоб наші люди це зрозуміли."
 CEN_spreading_light_god: "Поширення Божого світла"
 CEN_spreading_light_god_desc: "Інші, менш освічені народи повинні зрозуміти, що їхні шляхи застарілі, неправильні.\nПоказуючи їм світло нашого Господа, мирним чи силовим шляхом, ми виправимо це."
 CEN_congress_moderate: "Модерадос"
 CEN_congress_moderate_desc: "Народна партія править справедливо!"
 CEN_universal_suffrage: "Загальне виборче право"
 CEN_universal_suffrage_desc: "Ми представляємо всіх людей, чоловіків і жінок. Ми повинні представляти це і дозволити кожному голосувати!"
 CEN_stand_small_man: "Відстоювання інтересів маленької людини"
 CEN_stand_small_man_desc: "Багатьма країнами керують корпорації та люди з глибокими кишенями. Ми, однак, відрізняємося від багатьох країн і гарантуємо, що від найнижчого з найнижчих до найбагатшого з найбагатших представлені всі."
 CEN_education_reform: "Реформи освіти"
 CEN_education_reform_desc: "Реформування освіти зробить все наше населення щасливим, грамотним і допоможе нашій країні стати більш розвиненою, ніж вона була раніше!"
 CEN_food_distribution: "Розподіл продуктів харчування"
 CEN_food_distribution_desc: "Доведено, що нестача їжі в дитинстві призводить до відставання в розвитку дітей. Ми повинні подбати про те, щоб усі діти мали достатньо їжі, і наша нація стала такою ж сильною, як і вони."
 CEN_healthcare: "Забезпечення національної охорони здоров'я"
 CEN_healthcare_desc: "Один із способів забезпечити здоров'я нації - це забезпечити здоров'я її населення. Створення Національної системи охорони здоров'я гарантує, що жодна дитина, чоловік чи жінка не залишиться без лікування в майбутньому."
 CEN_own_socialism: "Власний соціалізм"
 CEN_own_socialism_desc: "Для того, щоб ми могли керувати нашим народом, ми повинні забезпечити власний соціалізм. Ми будемо надихатися, але не копіювати Європу, і представляти себе і свій народ в повній мірі."
 CEN_into_world: "В світ"
 CEN_into_world_desc: "Ми зміцнили нашу владу. Тепер ми можемо зосередитися на справах за межами наших кордонів, не відволікаючись на внутрішні проблеми."

 CEN_agricultural_union: "Аграрний союз"
 CEN_agricultural_union_desc: "Ми вирішили зосередити нашу націю на маленькій людині, фермері."
 CEN_internationale_exports: "Експорт до Інтернаціоналу"
 CEN_internationale_exports_desc: "Якщо ми зосередимося на експорті деяких наших товарів до Інтернаціоналу, ми зможемо реінвестувати прибутки та вдосконалити власне виробництво."
 CEN_big_ol_railway: "Центральноамериканський шлях"
 CEN_big_ol_railway_desc: "Старі ґрунтові дороги не принесуть нам багато користі в наші дні. Ми повинні створити велику центральноамериканську дорогу, яка з'єднає нашу націю."
 CEN_agricultural_reform: "Аграрна реформа"
 CEN_agricultural_reform_desc: "Навіть якщо ми зосередимося на сільському господарстві, ми не повинні сидіти на місці. Реформа сільського господарства дозволить більшій кількості чоловіків працювати на наших заводах."
 CEN_cash_crop_boom: "Бум товарних культур"
 CEN_cash_crop_boom_desc: "Товарні культури стають все більш цінними. Ми можемо скористатися цими змінами і підняти нашу власну економіку, зосередившись на цих культурах!"
 CEN_military_production: "Розширення військового виробництва"
 CEN_military_production_desc: "Хоча виробляти більше врожаю - це добре, ми не можемо захистити нашу країну за допомогою кукурудзи.\nМи також повинні розширювати наше військове виробництво, якщо ми хочемо залишатися в безпеці в майбутньому."
 CEN_working_conditions: "Покращення умов праці"
 CEN_working_conditions_desc: "Щасливі працівники - це продуктивні працівники. Якщо ми виснажуватимемо свою націю до знемоги, ми будемо нічим не кращими за тих автократів. Нова політика скорочення робочого тижня та підвищення заробітної плати надзвичайно допоможе нашій нації."
 CEN_self_suffeciency: "Встановлення самодостатності"
 CEN_self_suffeciency_desc: "Хоча друзі та союзники є необхідними, на них не можна покладатися повністю. Ми повинні гарантувати, що зможемо вижити в майбутньому без імпорту чи інших зовнішніх джерел."
 CEN_peoples_defense: "Народна оборона"
 CEN_peoples_defense_desc: "Основою нашого суспільства, навіть нації, є люди. Ми повинні гарантувати, що вони будуть захищені за будь-яку ціну."
 CEN_improving_production: "Покращення рослинництва"
 CEN_improving_production_desc: "Нещодавні іноземні винаходи покращили продуктивність їхніх садів та фермерських господарств. Ми не повинні залишатися позаду і впроваджувати їх у своїй країні."
 CEN_profit_rakein: "Отримання прибутку"
 CEN_profit_rakein_desc: "Широкомасштабні реформи в нашій країні значно збільшили виробництво нашої країни, а разом з ним і її прибутки. Хоча ми є нацією для свого народу, нам теж дещо потрібно."
 CEN_central_american_university: "Центральноамериканський університет"
 CEN_central_american_university_desc: "Тепер, коли на наших фермах працює менше людей, ми можемо створити університет для найрозумніших і виробляти більше знань, ніж будь-коли раніше!"
 CEN_preparing_future_crisis: "Підготовка до майбутньої кризи"
 CEN_preparing_future_crisis_desc: "Наша нація може бути сильною, але не безгрішною. Ми повинні готуватися до нашого майбутнього, будь-якого майбутнього, поганого чи хорошого."

 CEN_beginning_industrialization: "Початок індустріалізації"
 CEN_beginning_industrialization_desc: "Давайте почнемо довгий процес переходу в 20 століття!"
 CEN_airports: "Зв'язок через повітря"
 CEN_airports_desc: "Не тільки земля, але й повітря стає все більш важливим. Ми повинні це усвідомити і будувати авіабази!"
 CEN_socialist_funding: "Соціалістична фінансова підтримка"
 CEN_socialist_funding_desc: "Відновлення промисловості - справа не з дешевих. Треба спробувати знайти кошти на майбутні проекти!"
 CEN_readjusting_budget: "Коригування промислового бюджету"
 CEN_readjusting_budget_desc: "Ми витрачаємо надто багато грошей на несуттєві речі. Якщо ми скоригуємо наш бюджет, то зможемо досягти набагато більших успіхів!"
 CEN_arming_military: "Озброєння армії"
 CEN_arming_military_desc: "Як би ми не хотіли, ми не можемо озброїти армію гайковими ключами. Якщо ми хочемо захистити свою країну, нам потрібні заводи, які вироблятимуть зброю, боєприпаси та інше."
 CEN_farmers_factories: "Переміщення фермерів на заводи"
 CEN_farmers_factories_desc: "Якщо всі наші чоловіки будуть вирощувати кукурудзу, ми не отримаємо ніякої індустрії землі. Ми повинні перемістити чоловіків із сіл до міст!"
 CEN_road_project: "Зв'язок на землі"
 CEN_road_project_desc: "Якщо ми не зможемо переміщати наші верстати, гайкові ключі та зброю в нашій країні, ми нікуди не дійдемо. Ми повинні розпочати інфраструктурні проекти, щоб забезпечити собі можливість рухатися швидше, ніж равлик у нашій країні."
 CEN_extend_road_north: "Продовження шляху на північ"
 CEN_extend_road_north_desc: "Ми досягли значного прогресу в реалізації наших інфраструктурних проектів, але ми не повинні зупинятися на досягнутому. Північ залишається не підключеною до нашої нової мережі, і ми повинні це виправити!"
 CEN_statewide_projects: "Загальнодержавні проєкти"
 CEN_statewide_projects_desc: "Зосередження на дрібних речах за один раз ні до чого не призведе. Ми повинні розпочати серію великих загальнодержавних проектів, які дійсно змінять ситуацію!"
 CEN_ports: "Зв'язок через море"
 CEN_ports_desc: "Останній з трьох шляхів, морський, залишився недоторканим. Можливо, у нас немає великого флоту, але ніколи не пізно це змінити!"
 CEN_normalize_budget: "Нормалізація бюджету"
 CEN_normalize_budget_desc: "Тепер, коли більшість наших реформ завершено, ми можемо нарешті нормалізувати бюджет і переконатися, що жоден сектор не залишиться обділеним. Це потребуватиме певних зусиль, але має забезпечити довгострокове виживання!"
 CEN_school_projects: "Сприяння освіті"
 CEN_school_projects_desc: "Якщо все, що ми виробляємо - це застаріле обладнання, ми нікуди не прийдемо, тому ми повинні працювати над тим, щоб наші знання також відповідали сучасності і виробляти зброю, автомобілі та машини, які відповідають потребам нашої нації!"
 CEN_our_own_fuel: "Використання малих шахт"
 CEN_our_own_fuel_desc: "Нам завжди не вистачатиме ресурсів, яких ми хочемо, але ми можемо принаймні полегшити деякі наші потреби, використовуючи більше невеликих шахт, які розкидані по всій нашій землі!"

 CEN_peoples_army: "Народна армія"
 CEN_peoples_army_desc: "Наша армія перебуває в легкому безладі після злиття наших націй, і ми повинні швидко реорганізувати наші збройні сили, щоб захистити нас від тих, хто хоче зруйнувати соціалізм."
 CEN_formalize_general_staff: "Формалізація Генерального штабу"
 CEN_formalize_general_staff_desc: "Ми повинні обрати найкомпетентніших центральноамериканців на чолі наших сил, і нехай вони реорганізують армію!"
 CEN_moving_from_jungle: "Поза межами джунглів"
 CEN_moving_from_jungle_desc: "Сучасна армія воює в повітрі і на полях, а не тільки в джунглях. Ми повинні адаптувати нашу доктрину до цього факту!"
 CEN_arming_forces: "Озброєння наших військ"
 CEN_arming_forces_desc: "Ми хочемо мати більшу армію, але без зброї ми просто підемо на смерть. Ми можемо використати частину списаної зброї, щоб заповнити цю прогалину."
 CEN_foreign_design: "Використання зарубіжних зразків"
 CEN_foreign_design_desc: "Заклопотані возз'єднанням Центральної Америки під соціалістичним прапором, ми забули про дослідження нової стрілецької зброї. Ми можемо надолужити згаяне, але, можливо, доведеться покладатися на європейський дизайн. Зрештою, кулі є кулі."
 CEN_imports: "Покращення комунікації"
 CEN_imports_desc: "Використання бігунів не підходить для країни нашої величі, і навіть моторизовані транспортні засоби стають занадто повільними. Ми повинні інвестувати в електронні комунікації, щоб об'єднати нашу націю!"
 CEN_military_academy: "Військова академія"
 CEN_military_academy_desc: "Сподіватися на те, що наші офіцери навчаються за застарілими книжками та польовими тренуваннями, марно. Ми повинні створити належну академію, щоб наші нові сили були належним чином очолені новим поколінням офіцерів!"
 CEN_gotta_go_fast: "Фокус на швидкості"
 CEN_gotta_go_fast_desc: "Наша країна має довжину понад 1500 км. Марширування або використання застарілих вантажівок не підходить для країни такої довжини. Ми повинні інвестувати в нову моторизовану техніку, щоб залишатися мобільною армією."
 CEN_forces_spread_revolution: "Сила для поширення революції"
 CEN_forces_spread_revolution_desc: "Ми не просто армія Центральної Америки, ми - армія революції. Наші вороги повинні зрозуміти, що ми йдемо, щоб поширити її на них, але спочатку це повинні зробити наші власні солдати!"
 CEN_new_generation: "Нове покоління генералів"
 CEN_new_generation_desc: "Нова академія, нова доктрина - все це приносить свої плоди, і ми дійсно можемо сказати, що виростили нове покоління генералів, які можуть належним чином захищати нашу Центральну Америку."

 CEN_peoples_liberation_force: "Народно-визвольні сили"
 CEN_peoples_liberation_force_desc: "Армія для народу повинна складатися з народу. Використовуючи досвід кожної людини, ми створимо визвольну силу, якої будуть боятися вороги соціалізму!"
 CEN_evolving_guerilla: "Розвиток партизанської доктрини"
 CEN_evolving_guerilla_desc: "Старі методи є такими, якими вони є, старими і застарілими. Ми повинні розвивати нашу доктрину, якщо хочемо залишатися на передовій війни."
 CEN_training_generals: "Інтенсифікація навчання"
 CEN_training_generals_desc: "Солдати їдять як королі, і вони повинні знати, що ми робимо з королями. Переведення наших військ на нові тренування (і дієту) має допомогти зменшити споживання припасів і зменшити ймовірність голоду, якщо ми коли-небудь потрапимо в оточення!"
 CEN_increase_conscription: "Збільшення призову до армії"
 CEN_increase_conscription_desc: "Зброя, набої, снаряди - все це ми можемо виробляти на заводах. Чоловіків, однак, важче виробляти швидко; ми повинні збільшити призов, якщо хочемо поширювати революцію, тільки не кажіть їм про дієту..."
 CEN_overwhelm_enemy: "Перемога над ворогом"
 CEN_overwhelm_enemy_desc: "З якоїсь дошки оголошень нам сказали, що оточення - це чудово. Якщо ми хочемо наслідувати цю військову стратегію, ми повинні забезпечити готовність механізованих підрозділів!"
 CEN_foreign_legion: "Погляд на процес навчання"
 CEN_foreign_legion_desc: "Наш навчальний процес застарів, базується на старих принципах і був створений для диктаторів. Ми повинні використати наші накопичені знання і перебудувати процес з нуля, зробивши його швидшим та ефективнішим!"
 CEN_conserving_ammunition: "Модернізація обладнання"
 CEN_conserving_ammunition_desc: "Окрім тренувального процесу, ми також повинні модернізувати наше спорядження. Спрямування зусиль на нову стрілецьку зброю дуже допоможе у війні."
 CEN_rumble_in_the_jungle: "Утримання висот"
 CEN_rumble_in_the_jungle_desc: "Розуміння місцевості - це ключ до перемоги над ворогом. Якщо вони прийдуть за нами, ми сховаємося в пагорбах, горах і сільській місцевості. Кожен ворог революції впаде до рук солдатів, яких він ніколи не побачить, бо ми вміємо ховатися."
 CEN_all_terrain: "Високомобільні війська"
 CEN_all_terrain_desc: "Центральна Америка є домом для багатьох типів місцевості: пагорби, гори, джунглі, рівнини. Ми повинні пристосуватися до всіх і зробити так, щоб жоден з наших солдатів не залишився на поталу природі."
 CEN_defending_home: "Захист нашого дому"
 CEN_defending_home_desc: "Наша нація в безпеці завдяки нашій армії, наша революція в безпеці завдяки нашій армії. Наш народ може спати спокійно, знаючи, що ми зосереджені не лише на поширенні революції, але й на захисті кожного чоловіка, жінки та дитини, які коли-небудь носили ім'я центральноамериканця!"

 CEN_a_new_air_force: "Ejército del Aire"
 CEN_a_new_air_force_desc: "Ми повинні організувати велику зустріч між усіма родами військово-повітряних сил, щоб реорганізувати і визначити структуру нашого об'єднаного Ejércite del Aire de Centroamérica!"
 CEN_air_combine: "Об'єднані ВПС"
 CEN_air_combine_desc: "Будучи союзом націй, наші військово-повітряні сили також повинні бути об'єднані. Ми зосередимо наші авіабази в столиці і забезпечимо можливість відправити великі сили в будь-яку точку, де ворог може напасти!"
 CEN_air_spread: "Розпорошені ВПС"
 CEN_air_spread_desc: "Кожна нація найкраще знає свою місцевість. Ми дозволимо кожному регіону створювати свої власні підрозділи ВПС для захисту повітряного простору!"
 CEN_air_construction: "Будівництво аеродромів"
 CEN_air_construction_desc: "Забезпечити частину нашої країни авіабазами недостатньо. Ми повинні докласти організованих зусиль, щоб прискорити будівництво нових злітно-посадкових смуг, ангарів і всього іншого, необхідного для функціонування військово-повітряних сил!"
 CEN_air_officers: "Офіцери ВПС"
 CEN_air_officers_desc: "Нашим військово-повітряним силам не вистачає компетентних офіцерів. Ми будемо шукати компетентних офіцерів у сухопутних військах та місцевих коледжах. Як тільки ми заповнимо наші ряди, ми зможемо досягти кращого прогресу в нашій доктрині!"
 CEN_air_aa: "Протиповітряна оборона"
 CEN_air_aa_desc: "Захищати повітряний простір нашої країни можна не лише з повітря. Побудувавши зенітні гармати в м.[Root.Capital.GetCapitalVictoryPointName], ми можемо спати спокійно, знаючи, що наша столиця захищена з повітря!"
 CEN_air_fighters: "Фокус на винищувачах"
 CEN_air_fighters_desc: "Контроль повітряного простору - ключ до збереження життя нашої армії. Зосередженість на дослідженнях винищувачів гарантує, що наші літаки завжди матимуть перевагу над ворожими."
 CEN_air_cas: "Фокус на штурмовиках"
 CEN_air_cas_desc: "Допомога нашим бійцям на полі бою - найважливіший елемент повітряної війни. Зрештою, війну виграють не лише літаки.\nЗосередження на наших дослідженнях штурмовиків дозволить нашим літакам зробити наші армії ще більш ефективними!"
 CEN_air_radar: "Виявлення ворога"
 CEN_air_radar_desc: "Яка користь від великих гармат і швидких літаків, якщо ми навіть не можемо виявити ворога!\n\nМи будемо більше досліджувати радіолокаційні технології і виявляти цих ворогів революції ще краще!"
 CEN_air_paratrooper: "Fuerzas Aerotransportadas"
 CEN_air_paratrooper_desc: "У нашому десантному корпусі їх не вистачало, в основному використовували старі скатертини та шпагат, щоб відпрацьовувати приземлення, стрибаючи зі столів.\nТак більше не може тривати, і ми повинні реформувати корпус у щось таке, чого буде боятися ворог.\nРозробка нових парашутів і відповідних гармат, легких і коротких, буде вартим зусиль!"
 CEN_air_soc_airforce: "Захист Батьківщини"
 CEN_air_soc_airforce_desc: "Наші військово-повітряні сили нарешті реформовані.\nНаші льотчики сповнені гордості, коли сідають у літаки!\nНаші хлопці на землі посміхаються, коли бачать наш хоровод у небі!\nВсі вороги революції повинні здригнутися від страху, коли почують гуркіт наших літаків!"

 CEN_naval_start: "Armada Centroamericana"
 CEN_naval_start_desc: "Для об'єднання Центральної Америки під нашим соціалістичним прапором наявність великого військово-морського флоту не була необхідною умовою. Тепер, коли ми це зробили, ми можемо нарешті зосередитися на створенні великої армади для захисту і поширення соціалізму."
 CEN_naval_bases: "Розвиток суднобудування"
 CEN_naval_bases_desc: "Ми не можемо змусити кораблі існувати, тому ми повинні зосередитися на будівництві верфей, щоб реалізувати наше бачення великої армади!"
 CEN_blood_of_navy: "Кров флоту"
 CEN_blood_of_navy_desc: "Нафта є одним із найважливіших ресурсів для функціонування флоту, і, на жаль, нам її гостро бракує.\nОднак, наш північний сусід контролює кілька досить великих нафтових родовищ у своїх південних регіонах. Можливо, ми зможемо досягти з ними домовленості, щоб отримати доступ до частини їхніх запасів."
 CEN_naval_doctrine: "Розвиток військово-морської доктрини"
 CEN_naval_doctrine_desc: "Багато офіцерів не мають жодного уявлення про те, як правильно розробляти стратегію з більш ніж одним кораблем, це жахливо! Ми маємо це виправити і почати докладати зусиль до навчання наших офіцерів!"
 CEN_naval_marines: "Infantería de Marina"
 CEN_naval_marines_desc: "Війни виграють не лише кораблі, але ми можемо використовувати їх для того, щоб поставити чоботи на землю. Ця революційна ідея ще не спадала на думку нашим офіцерам, але тепер, коли вони нарешті почали використовувати свою освіту, ми можемо модернізувати наші морські підрозділи!"
 CEN_naval_heavy: "Океанський флот"
 CEN_naval_heavy_desc: "Будівництво великого флоту займе багато часу і буде дуже дорогим. Цей великий флот на блакитних водах забезпечить набагато більшу потужність і контроль у порівнянні з якимись крихітними есмінцями!"
 CEN_naval_battleship: "Los Acorazados"
 CEN_naval_battleship_desc: "Ключовим елементом військово-морського флоту на блакитній воді є бойові кораблі. Нам катастрофічно не вистачає сучасних кораблів, і ми повинні докласти великих зусиль, щоб виправити це!"
 CEN_naval_battlecruiser: "Los Cruceros de Batalla"
 CEN_naval_battlecruiser_desc: "Наявність легших бойових кораблів, бойових крейсерів поряд з нашими великими суднами стане сильним поєднанням, як довела наша нещодавно досліджена доктрина!"
 CEN_naval_heavy_production_focus: "Покращення доків"
 CEN_naval_heavy_production_focus_desc: "Незважаючи на те, що було докладено багато зусиль для будівництва нових грандіозних кораблів, воно не йде так швидко, як ми сподівалися.\nЗбільшення розмірів та покращення робочого процесу на наших верфях дозволить швидше будувати більше кораблів!"
 CEN_naval_lighter: "Флот для боротьби з торгівлею"
 CEN_naval_lighter_desc: "Прагнення мати великий флот - це добре, але нездійсненно для країни, яка кілька років тому ледве трималася на воді.\nЯкщо ми прагнемо створити флот для переслідування торгівлі, то есмінці і крейсери будуть простішими у будівництві і, що найважливіше, дешевшими!"
 CEN_naval_cruiser: "Los Cruceros"
 CEN_naval_cruiser_desc: "Майже нічого не знаючи про крейсери, наші офіцери вирішили провести невелику відпустку на американському узбережжі, як вони сказали, для огляду визначних пам'яток.\n\nФотографії, з якими вони повернулися, показують чимало американської краси!"
 CEN_naval_destroyer: "Los Destructores"
 CEN_naval_destroyer_desc: "Менші кораблі, такі як есмінці, мають вирішальне значення для захисту наших вод від підводних човнів та подібних підступних авторитарних тактик!"
 CEN_naval_light_production: "Розширення сухих доків"
 CEN_naval_light_production_desc: "Більшість наших сухих доків пристосовані для менших суден або крейсерів. Ми перепрофілюємо і розширимо їх, щоб вони підходили для більших кораблів, необхідних для нашої великої соціалістичної армади!"
 CEN_naval_submarines: "Submarinos de la Armada"
 CEN_naval_submarines_desc: "Поки ми вище підступної авторитарної тактики, ми можемо використовувати її, ховаючись під водою, поки нічого не підозрюючі ворожі кораблі пропливають повз нас!\nПідводні човни мають вирішальне значення для того, щоб тримати ворога подалі від наших берегів!"
 CEN_naval_planes: "Морські літаки"
 CEN_naval_planes_desc: "Спільними зусиллями аерокосмічних інженерів та військово-морських інженерів були розроблені деякі плани щодо нових військово-морських літаків. У нас немає носіїв, на яких їх можна було б розмістити, але головне - це ідея!"
 CEN_naval_carrier: "Придбання старого авіаносця"
 CEN_naval_carrier_desc: "Здобуття нарешті досвіду у створенні авіаносця не означає, що він з'явиться сам по собі, як за помахом чарівної палички. Поки ми чекаємо, поки його побудують, ми можемо поцікавитися в американців, чи не завалялася у них старіша модель, яку ми могли б придбати!"
 CEN_join_internationale: "Вступ до Інтернаціоналу"
 CEN_join_internationale_desc: "Ми нарешті привели до ладу всі національні справи і можемо подивитися, що ми можемо зробити для решти світу.\nІнтернаціонал підтримує наші цінності, і ми повинні приєднатися до них, якщо хочемо, щоб соціалізм переміг у ці бурхливі часи!"

### Events
 central_america_socialist_events.001.t: "Заснування Центральноамериканського Конгресу"
 central_america_socialist_events.001.d: "Соціалісти з усієї країни збираються, щоб визначити майбутнє та основи об'єднаної соціалістичної Центральної Америки! Найвидатнішими є ті, хто найзавзятіше чинив опір різним військовим диктаторам та ворогам соціалізму, але не всі можуть досягти вершини, як би вони цього не бажали. Ми побачимо найближчими тижнями, хто зуміє заявити про себе."
 central_america_socialist_events.001.a: "До нового майбутнього!"

 central_america_socialist_events.002.t: "Національна Революційна Партія"
 central_america_socialist_events.002.d: "Національна Революційна Партія була заснована Сандіно і збирає невелику групу Гватемальців під свою справу, залишаючи свого попереднього партнера Секвейру переважно на самоті. Вони прагнуть єдиної Центральноамериканської Ідентичності і бажають поширити цю ідентичність та революцію на більшу частину Латинської Америки. Багато хто називає Сандіно монстром за те, що він залишив Секвейру, який був ключовим у його революції в Нікарагуа, але його популярність все ще неухильно зростає."
 central_america_socialist_events.002.a: "Починають виявлятися розколи."

 central_america_socialist_events.003.t: "Партія Максимістів"
 central_america_socialist_events.003.d: "Хуан Вейнрайт сформував Партію Максимістів. Його бачення — це бачення сильного голови, який веде Центральну Америку вперед до світлого майбутнього, поширюючи своє бачення соціалізму по всій Латинській Америці. З його основною та єдиною реальною базою підтримки, розташованою в Гондурасі, він розглядається як малоймовірний кандидат на те, щоб насправді вийти на перше місце у майбутньому нашої нової нації, але він стверджує, що «може просто здивувати нас»."
 central_america_socialist_events.003.a: "Справді дуже небезпечна партія..."

 central_america_socialist_events.004.t: "Робітнича Конфедерація Центральної Америки"
 central_america_socialist_events.004.d: "Робітнича Конфедерація Центральної Америки, очолювана Агустіном Марті, заснована на ідеалах Європейського Синдикалізму, створеного Британцями та Французами. Вони хочуть створити уряд, який керує народом і для народу; безпечне місце для майбутніх поколінь і особливо корінних жителів, оскільки значна частина їхньої бази підтримки походить від корінного населення, розташованого в межах нашого союзу. Крім загальної підтримки корінного населення, Марті користується захопленням у своїй рідній країні Сальвадорі, яка бачить у ньому свого визволителя."
 central_america_socialist_events.004.a: "Європейська модель все ж може спрацювати..."

 central_america_socialist_events.005.t: "Народна Партія"
 central_america_socialist_events.005.d: "Народна Партія, очолювана Сільверіо Ортісом, хоче зайняти помірковану позицію. Забезпечити, щоб люди мали їжу в животі та отримували необхідну освіту. Розглядається деким як занадто поміркована і може зіткнутися з опором з боку людей, які вважають, що вони не дотримуються справжнього Соціалізму. Будучи партією, що базується у Гватемалі, вони сподіваються забезпечити, щоб Максимісти не змогли захопити контроль, навіть якщо вони не виграють, стверджуючи, що вони є більшою загрозою, ніж військові диктатори до них."
 central_america_socialist_events.005.a: "Людина з народу!"

 central_america_socialist_events.006.d: "Народна Партія, очолювана Рафаелем Кальдероном, прагне врятувати свій народ від злиднів, хоче впровадити кращу систему охорони здоров'я. Недоброзичливцям, які звинувачують його в потуранні лібералам, він каже, що його унікальна форма поміркованого соціалізму збереже країну цілою, функціонуючою та живою!"

 central_america_socialist_events.007.t: "Секвейра, Втрачений і Знайдений"
 central_america_socialist_events.007.d: "Оскільки Сандіно залишив Секвейру в пилу, Секвейра шукає новий дім у політичному спектрі. Багато хто пророкує, що він буде змушений підкоритися Сандіно, але інші вважають, що він може вдарити його в спину за його зраду та приєднатися до Гватемальців у Народній Партії. Все можливо, але він вирішує стати на бік..."
 central_america_socialist_events.007.a: "Він схиляє їх до Національної Революційної Партії!"
 central_america_socialist_events.007.b: "Він робить Народну Партію досить привабливою!"

 central_america_socialist_events.008.t: "Скликання Конгресу"
 central_america_socialist_events.008.d: "Представники з усієї країни прибули і готуються розпочати великі дебати через тиждень!"
 central_america_socialist_events.008.a: "Почнімо."

 central_america_socialist_events.009.t: "Статус Влади"
 central_america_socialist_events.009.d: "Конгрес чи Голова. Дехто стверджує, що влада ніколи не повинна належати одній людині, інші стверджують, що будь-яка нація потребує лідера, який зможе провести її через темні часи. Після багатьох днів дебатів партії нарешті домовилися про відповідь."
 central_america_socialist_events.009.a: "Конгрес завжди залишатиметься важливим."
 central_america_socialist_events.009.b: "Голова є остаточним фактором."

 central_america_socialist_events.010.t: "Статус Армії"
 central_america_socialist_events.010.d: "Союз націй породжує кілька проблем: кожна мала свою власну армію, свою власну структуру. Чи повинні вони бути об'єднані в єдину велику силу, професійну армію, чи вони повинні залишатися окремими, як загони ополчення, розкидані по всій країні та працюючі автономно?"
 central_america_socialist_events.010.a: "Ополчення — наше коріння!"
 central_america_socialist_events.010.b: "Можливо, настав час створити консолідовану армію!"

 central_america_socialist_events.011.t: "Статус Промисловості"
 central_america_socialist_events.011.d: "Хоча промислова революція далеко позаду нас, ми ще не повністю перейшли на цей шлях. Дехто закликає до того, щоб це ніколи не змінювалося, і зосередитися на тому, щоб стати Соціалістичним Хлібним Кошиком, забезпечуючи ситі шлунки. Інші пропонують більш радикальні зміни для індустріалізації, стверджуючи, що менше людей мають працювати на полях і більше можуть працювати на фабриках, виробляючи предмети розкоші та зброю!"
 central_america_socialist_events.011.a: "За міцніше майбутнє, індустріалізація!"
 central_america_socialist_events.011.b: "За кращий народ, аграризм!"

 central_america_socialist_events.012.t: "Статус Майбутніх Виборів"
 central_america_socialist_events.012.d: "Якщо люди працюють на фабриках та полях, вони не можуть турбуватися про політику, принаймні, так розмірковують Максимісти та Робітнича Конфедерація. Інші стверджують, що незважаючи ні на що, люди повинні голосувати, тому що саме їх вони представляють. Інакше, хто вони, якщо не самозванці для революції!"
 central_america_socialist_events.012.a: "Рада є основою союзу."
 central_america_socialist_events.012.b: "Народ — справжній вирішувач тут!"

 central_america_socialist_events.013.t: "Максимісти Перемогли!"
 central_america_socialist_events.013.d: "Результати надійшли! Максимісти довели, що вони є переможцями виборів, і вже почали впроваджувати свої суперечливі реформи. З цим ми можемо очікувати централізації влади, якій чинитимуть опір інші соціалістичні кліки."
 central_america_socialist_events.013.a: "Перемога!"

 central_america_socialist_events.014.t: "Робітнича Конфедерація Центральної Америки Перемогла!"
 central_america_socialist_events.014.d: "Результати надійшли! Робітнича Конфедерація Центральної Америки опинилася на вершині в конгресі, і вже почала вступати на посаду під керівництвом Марті. Гучні вигуки чути від тих, хто хоче, щоб Центральна Америка відігравала більшу роль у соціалістичній політиці, і особливо від корінного населення. Що буде далі, ще належить побачити."
 central_america_socialist_events.014.a: "За Соціалізм!"

 central_america_socialist_events.015.t: "Революціонери Перемогли!"
 central_america_socialist_events.015.d: "Результати надійшли! Національна Революційна Партія вийшла на перше місце в нашій нації, як багато хто, здавалося, очікував. Сандіно завжди був популярним вибором серед народу завдяки своєму початковому успіху в Нікарагуа, і багато хто очікує, що зараз буде не інакше. Що чекає його політичну кар'єру далі, ще належить побачити, але багато хто дивиться на це з нетерпінням."
 central_america_socialist_events.015.a: "За Революцію!"

 central_america_socialist_events.016.t: "Помірковані Перемогли!"
 central_america_socialist_events.016.d: "Результати надійшли! Розглядані як соціалісти, наскільки це можливо, не входячи до ліберального табору, Помірковані бажають бачити народ головним вирішальним фактором у нашому новому союзі над дріб'язковими політиками, а також забезпечити їхню безпеку та задоволення повсякденних потреб. Інші політики дивляться з презирством на тих, кого вони вважають брудними поміркованими, але сьогодні народ є тим, хто радіє."
 central_america_socialist_events.016.a: "За народ!"

 central_america_socialist_events.017.t: "Глухий Кут!"
 central_america_socialist_events.017.d: "Після тижнів дебатів конгрес не зміг визначити явного переможця. Має відбутися ще одне голосування, сподіваємося, тепер із чіткішим результатом. Хто виграє нове голосування?"
 central_america_socialist_events.017.a: "Помірковані."
 central_america_socialist_events.017.b: "Максимісти."
 central_america_socialist_events.017.c: "Робітнича Конфедерація."
 central_america_socialist_events.017.e: "Революціонери."

 central_america_socialist_events.018.t: "Дебати Про Столицю"
 central_america_socialist_events.018.d: "Нова нація вимагає, можливо, нової столиці. Ми повинні вирішити, чи хочемо ми перенести нашу столицю в нове місце, більш придатне для нашого нового уряду, чи ми залишимося на місці. Зрештою, новий конгрес приймає рішення, і їхній вибір щойно оголошено!"
 central_america_socialist_events.018.a: "Сан-Сальвадор цілком підійде."
 central_america_socialist_events.018.b: "Тегусігальпа цілком підійде."
 central_america_socialist_events.018.c: "Гватемала цілком підійде."
 central_america_socialist_events.018.e: "Манагуа цілком підійде."
 central_america_socialist_events.018.f: "Сан-Хосе цілком підійде."

 central_america_socialist_events.019.t: "Наше Фінансування?"
 central_america_socialist_events.019.d: "Ми не можемо відбудувати країну лише на обіцянках.\n\nЗвідкись ми повинні отримати фінансування для наших масштабних проєктів. Ми можемо відкрити наші власні скарбниці, але у нас є більше рахунків, які потрібно сплатити, тож якщо ми хочемо уникнути витрачання ще більшої кількості грошей, ми могли б привласнити частину фабрик у їхніх власників, щоб отримати більше активів для використання, однак це не зробить людей щасливими."
 central_america_socialist_events.019.a: "Нам доведеться відкрити скарбниці."
 central_america_socialist_events.019.b: "Ми можемо просто позичити кілька фабрик."

 central_america_socialist_events.020.t: "Перегляд Бюджету"
 central_america_socialist_events.020.d: "Настав час вирішити, на якому рівні слід переглянути бюджет і використати його для подальшого просування наших промислових цілей."
 central_america_socialist_events.020.a: "Давайте планувати, виходячи з високого бюджету."
 central_america_socialist_events.020.b: "Давайте планувати, виходячи з середнього бюджету."
 central_america_socialist_events.020.c: "Давайте планувати, виходячи з низького бюджету."

 central_america_socialist_events.021.t: "Фокус Нашого Промислового Бюджету"
 central_america_socialist_events.021.d: "Коли сума бюджету вирішена, залишається лише обрати, на що його витратити."
 central_america_socialist_events.021.a: "Зосередимося на покращенні наших дослідницьких можливостей."
 central_america_socialist_events.021.b: "Зосередимося на будівництві."
 central_america_socialist_events.021.c: "Зосередимося на масовому виробництві."

 central_america_socialist_events.022.t: "Зближення з Юкатаном"
 central_america_socialist_events.022.d: "Бачачи, що Юкатан має соціалістичний уряд, подібний до нашого, ми вирішили підготувати зустріч. Там стало дуже зрозуміло їхнє бажання приєднатися до нашої нації та допомогти поширити соціалізм на решту Центральної Америки.\nПриродно, ми скористалися такою можливістю і вже почали готувати кілька проєктів для посилення їхньої інтеграції до ширшого союзу."
 central_america_socialist_events.022.a: "Це великий день для соціалізму."
 central_america_socialist_events.022.b: "Ми повинні спочатку запитати їхнього сюзерена."
 central_america_socialist_events.022.c: "Ми повинні спочатку запитати їхнього сюзерена і запропонувати невелику компенсацію."

 central_america_socialist_events.023.t: "Центральна Америка Просить Про Союз з Юкатаном"
 central_america_socialist_events.023.d: "Представник Центральноамериканського уряду прибув сьогодні, просячи дозволу об'єднатися з нашою маріонеткою Юкатаном.\nВони стверджують, що угода між ними вже досягнута і що відмова в цьому буде порушенням бажань людей, які там проживають, але ми все ще маємо останнє слово в цьому питанні, і ми можемо діяти, як нам заманеться."
 central_america_socialist_events.023.a: "Давайте віддамо його їм, все одно мало що втрачаємо."
 central_america_socialist_events.023.b: "Вони мали боротися за це самі."

 central_america_socialist_events.024.t: "Наше Прохання Було Прийнято"
 central_america_socialist_events.024.d: "Сюзерен Юкатану побачив розум і прийняв наше прохання про його анексію."
 central_america_socialist_events.024.a: "Союз, який, безсумнівно, протримається."

 central_america_socialist_events.025.t: "У Нашому Проханні Було Відмовлено"
 central_america_socialist_events.025.d: "Сюзерен Юкатану відхилив наше прохання про його анексію."
 central_america_socialist_events.025.a: "Більше ми нічого не можемо зробити."

 central_america_socialist_events.026.t: "Центральноамериканські Війська Скупчуються На Кордоні"
 central_america_socialist_events.026.d: "Розвідувальні загони повідомили про досить велику кількість Центральноамериканських військ уздовж нашого південного кордону, причому деякі посланці Центральної Америки несуть листи, адресовані останнім соціалістичним залишкам у нашій країні, підбурюючи їх до повстання проти нашого «авторитарного» уряду, з обіцянками відновити попередній демократичний революційний режим. \nНа щастя, ми їх захопили, але ясно, що вторгнення неминуче."
 central_america_socialist_events.026.a: "Ми захищатимемо нашу Батьківщину, незалежно від того, якою буде ціна!"

 central_america_socialist_events.027.t: "Кораблі Центральної Америки Помічені біля Давіда"
 central_america_socialist_events.027.d: "Берегова охорона повідомила про дивні військово-морські пересування Центральної Америки поблизу Панами останнім часом, а загальна активність ФНСА зросла до загрозливого рівня. Військовим зрозуміло, що Центральна Америка планує вторгнутися в Панаму, щоб включити нас до Союзу."

 central_america_socialist_events.028.d: "Масовий рух військ був помічений на нашому південному кордоні, причому деякі посланці Центральної Америки несуть листи, адресовані останнім соціалістичним залишкам у нашій країні, підбурюючи їх до повстання проти нашого «авторитарного» уряду, з обіцянками відновити попередній демократичний революційний режим. \nНа щастя, ми їх захопили, але ясно, що вторгнення неминуче."
 central_america_socialist_events.028.a: "Ми знову захищатимемо нашу Батьківщину від соціалістів!"

 central_america_socialist_events.029.t: "Інтеграція Юкатану"
 central_america_socialist_events.029.d.mex: "Після нашої нещодавньої перемоги над північним сусідом відбулося відновлення революційного демократичного режиму.\n\nАле все ще існує багато страху та невизначеності, оскільки ця нова демократія може впасти так само, як і попередня. Ось чому велика група людей у нашій країні та регіоні Юкатан вважає, що ми повинні анексувати регіон, щоб захистити людей та корінних жителів від подальшої несправедливості.\n\nХоча дехто вважає, що слід анексувати регіони Чіапас та Табаско, щоб мати набагато коротший та більш захищений кордон."
 central_america_socialist_events.029.d.yuc: "Після нашої нещодавньої перемоги над північним сусідом було вирішено створити нову Юкатанську сестринську республіку та відновити революційну демократію в Мексиці.\n\nАле все ще існує багато страху та невизначеності, оскільки ця нова демократія може впасти так само, як і попередня. Ось чому велика група людей у нашій країні та регіоні Юкатан вважає, що ми повинні анексувати регіон, щоб захистити людей та корінних жителів від подальшої несправедливості.\n\nХоча дехто вважає, що слід анексувати регіони Чіапас та Табаско, щоб мати набагато коротший та більш захищений кордон."
 central_america_socialist_events.029.a: "Можливо, більш небезпечно, але це найкраще для народу."
 central_america_socialist_events.029.b: "Нам потрібна більша безпека від подальших загроз з боку Мексики."

 central_america_socialist_events.030.t: "Подальше Розширення Нашого Військово-Морського Потенціалу"
 central_america_socialist_events.030.d: "Коли наші, досить скромні, військово-морські плани нарешті завершилися. Сьогодні наші військово-морські експерти здивували нас, прийшовши з планом ще більшого збільшення наших військово-морських можливостей, але оскільки більша частина військово-морського бюджету вже витрачена, вони попросили виділити більше ресурсів, щоб ця мрія про ще більшу військово-морську армаду, яка принесе повне панування на морях, стала реальністю.\n\nЦе зашкодить іншим нашим виробничим секторам, але вони стверджували, що нам потрібно наздогнати інші сили регіону і що план був розроблений для максимально ефективного використання ресурсів."
 central_america_socialist_events.030.a: "Панування на морях має першочергове значення."
 central_america_socialist_events.030.b: "Давайте ввічливо відхилимо їхню пропозицію."

 central_america_socialist_events.031.t: "Продовжувати Відволікати Ресурси На Флот?"
 central_america_socialist_events.031.d: "Через рік результати програми принесли дуже неоднозначні результати, але не зашкодили нам так сильно, як ми думали.\n\nАле наші експерти запевняють нас, що продовження цього плану збереже конкурентоспроможність нашого флоту з іншими державами і навіть перевершить їх."
 central_america_socialist_events.031.a: "Жодна ціна не є надто великою для високоякісного флоту."
 central_america_socialist_events.031.b: "Давайте покладемо край цьому виснаженню ресурсів."

 central_america_socialist_events.032.t: "Ведення Переговорів Щодо Нафтових Концесій з Мексикою"
 central_america_socialist_events.032.d: "Наші плани щодо великого флоту зіткнулися з ще однією проблемою, а саме з нашою нестачею нафти для підтримки роботи нашого флоту не лише для невеликих місій берегової оборони. На щастя, наш північний сусід має величезні поклади нафти по всій країні, хоча їх більше на півночі та в центрі країни, набагато простіше транспортувати нафту з тих, що знаходяться в Чіапасі та Юкатані, тож давайте попросимо їх і сподіватимемося на краще."
 central_america_socialist_events.032.a: "Звернемося до них із нашою найкращою посмішкою."
 central_america_socialist_events.032.b: "Запропонуємо деякі економічні поступки взамін."

 central_america_socialist_events.033.t: "Центральна Америка Просить Про Невелику Оренду Нафти"
 central_america_socialist_events.033.d: "До нас звернулися наші південні сусіди, просячи оренду невеликої кількості нафтових родовищ на півдні нашої нації. Вони стверджують, що це буде використано для заправки їхнього флоту в майбутньому, що здається досить підозрілою причиною, але з огляду на відсталість їхньої економіки, важко уявити, що вони використають це для чогось, що могло б нам загрожувати."
 central_america_socialist_events.033.a: "Відхилити їхню угоду."
 central_america_socialist_events.033.b: "Поділитися лише невеликою частиною."
 central_america_socialist_events.033.c: "Дати їм те, що вони просять."
 central_america_socialist_events.033.e: "На їхню щедрість слід відповісти взаємністю, давши їм трохи більше нафти."

 central_america_socialist_events.034.t: "Мексика Відхиляє Нашу Угоду"
 central_america_socialist_events.034.d: "Мексика відхилила нашу запропоновану угоду через побоювання щодо наших «справжніх» намірів щодо їхньої нафти та загальну недовіру до нашого уряду."
 central_america_socialist_events.034.a: "Ось тобі і соціалістична солідарність."
 central_america_socialist_events.034.b: "Очікувана відповідь від реакційного сміття."

 central_america_socialist_events.035.t: "Мексика Приймає Нашу Угоду"
 central_america_socialist_events.035.d: "Мексика прийняла нашу угоду та орендувала частину нафти, що надходить з їхнього півдня, що, очевидно, супроводжується невеликою платою."
 central_america_socialist_events.035.a: "Ми вдячні за їхню співпрацю."
 central_america_socialist_events.035.b: "У яку гру вони з нами грають?"

 central_america_socialist_events.036.t: "Центральна Америка Хоче Збільшити Оренду Нафти"
 central_america_socialist_events.036.d: "Центральна Америка сьогодні зателефонувала нам, щоб збільшити кількість нафти, до якої ми маємо доступ у їхній країні. Вони готові також збільшити свої збори, щоб компенсувати це, тож що ми повинні сказати?"
 central_america_socialist_events.036.a: "Продовжувати угоду."
 central_america_socialist_events.036.b: "Зберегти поточні рівні."

 central_america_socialist_events.037.t: "Відповідь Мексики"
 central_america_socialist_events.037.d.oil: "Мексика погодилася надати нам більше доступу до своїх нафтових родовищ."
 central_america_socialist_events.037.d.noil: "Мексика відхилила нашу угоду і вважала за краще зберегти поточні рівні нафти."
 central_america_socialist_events.037.a: "Чудово!"
 central_america_socialist_events.037.b: "Чорт."

 central_america_socialist_events.038.t: "Центральна Америка Хоче Зменшити Свої Нафтові Збори"
 central_america_socialist_events.038.d: "Центральна Америка сьогодні зателефонувала нам, щоб зменшити свої збори, одночасно зменшивши кількість нафти, яку вони отримують, тож що ми повинні сказати?"

 central_america_socialist_events.039.d.less: "Мексика погодилася на зменшення наших зборів і кількості нафти разом із цим."
 central_america_socialist_events.039.d.no: "Мексика відхилила нашу угоду і вважала за краще зберегти поточні збори."

 central_america_socialist_events.100.t: "Потурати «Брудним» Поміркованим?"
 central_america_socialist_events.100.d: "Дехто серед нас вважає, що ми повинні більше симпатизувати іншим фракціям і намагатися включити їхні ідеї до наших. Інші називають цю ідею мерзенною і називають тих, хто дотримується їх, «брудними» поміркованими. Ми могли б спробувати бути більш інклюзивними, що дасть нам трохи стабільності, ціною розлючення нинішніх Поміркованих, або ми могли б просто ігнорувати їх і намагатися вигнати людей, які виступали б за це!"
 central_america_socialist_events.100.a: "Їх недарма називають брудними."
 central_america_socialist_events.100.b: "Ми керуємо для всіх!"

 central_america_socialist_events.101.t: "Нарешті, Процвітання!"
 central_america_socialist_events.101.d: "Наша нова політика окупилася! Наша важка робота, спрямована на покращення життя, приносить свої дивіденди, але нам ще далеко до завершення. Хоча ми можемо зосередитися на всій нації, можливо, краще зосередитися на одній державі. Це може розлютити деякі штати, які залишаться позаду, але призведе до більших покращень..."
 central_america_socialist_events.101.a: "Продовжити зосереджуватися на Гватемалі."
 central_america_socialist_events.101.b: "Продовжити зосереджуватися на Нікарагуа."
 central_america_socialist_events.101.c: "Продовжити зосереджуватися на Сальвадорі."
 central_america_socialist_events.101.e: "Продовжити зосереджуватися на Гондурасі."
 central_america_socialist_events.101.f: "Продовжити зосереджуватися на Коста-Ріці!"
 central_america_socialist_events.101.g: "Зосередитися на всій країні!"

 central_america_socialist_events.102.t: "Важка Праця Окуповується"
 central_america_socialist_events.102.d: "Робота, яку ми виконали місяці тому, нарешті окуповується. Люди в [CEN_prosper_state.GetName] радіють, коли ми сьогодні відкриваємо нові фабрики!"
 central_america_socialist_events.102.a: "Ах, плоди праці."

 central_america_socialist_events.103.t: "Ортіс Святкує Нашу Перемогу"
 central_america_socialist_events.103.d: "Сільверіо Ортіс, колишній лідер партії, надіслав повідомлення з Гватемали, вітаючи нашу перемогу і бажаючи найкращого нашому правлінню, оскільки він зосередиться на своїй рідній провінції."
 central_america_socialist_events.103.a: "З півночі на південь ми принесемо процвітання всім."

 central_america_socialist_events.104.t: "Секвейра Висловлює Підтримку Нашим Освітнім Реформам"
 central_america_socialist_events.104.d: "Сьогодні на вулицях Манагуа була помічена велика група людей на чолі з Секвейрою. Почувши про нові освітні реформи уряду, він вирішив використати свою популярність, щоб заохотити всіх відправляти своїх дітей до однієї з багатьох нових створених шкіл.\nВін закінчив своє повідомлення, сказавши, що поїде до кожного села Нікарагуа, щоб поширити інформацію про новини та допомогти майбутньому поколінню мати можливості, про які ми могли лише мріяти."
 central_america_socialist_events.104.a: "Все ще людина з народу."

 central_america_socialist_events.200.t: "Послідовники Сандіно"
 central_america_socialist_events.200.d: "Все більше людей збирається навколо слів Сандіно, що не личить соціалістичній нації...\n\nВони називають себе Сандіністами і стають все більш голосливими у своїй підтримці Сандіно замість уряду. Ми повинні вирішити, чи зупинити це на корені, чи дозволити йому продовжувати і ризикувати, що це вийде з-під нашого контролю..."
 central_america_socialist_events.200.a: "Приборкати його зростання!"
 central_america_socialist_events.200.b: "Нехай розважається!"

 central_america_socialist_events.201.t: "Опір Змінам"
 central_america_socialist_events.201.d: "Прогрес не відбувається без жертв. Ми повинні провести чистку всіх неіспанських впливів, які зараз нас стримують. Був певний опір нашим намірам.\n\nМи могли б змусити їх замовкнути і просувати свій шлях, або ми могли б прислухатися до них і діяти трохи повільніше..."
 central_america_socialist_events.201.a: "Їм доведеться з цим жити."
 central_america_socialist_events.201.b: "Можливо, нам варто прислухатися."

 central_america_socialist_events.202.t: "Центральноамериканська Іспанізація"
 central_america_socialist_events.202.d: "Центральна Америка робить тривожні кроки до іспанізації, змушуючи розривати шлюби, висилаючи іммігрантів та забороняючи будь-які традиції, що не є частиною іспанської культури.\n\nБагато хто в нашій нації спостерігає з настороженими очима на південь і чекає осуду..."
 central_america_socialist_events.202.a: "Засудити це."
 central_america_socialist_events.202.b: "Це не наша проблема."

 central_america_socialist_events.203.t: "Невдоволення в Гондурасі"
 central_america_socialist_events.203.d: "Наша нова та більш відкрита позиція у релігійному питанні розлютила Максимістів у Гондурасі. Вони розпочали мітинги в Тегусігальпі, заявляючи, що лише чоловіки можуть керувати іншими чоловіками і що бог — це лише ще один інструмент для контролю над населенням.\nНарод відреагував на них апатією, тож очевидної безпосередньої загрози немає, але було б розумно тримати їх під контролем."
 central_america_socialist_events.203.a: "Вони не варті часу."
 central_america_socialist_events.203.b: "Давайте «тихо» придушимо їх."

 central_america_socialist_events.204.t: "Культ Сандіно Зростає"
 central_america_socialist_events.204.d: "Ми були необережними, і Сандіністи завойовують все більше і більше послідовників...\n\nМи все ще можемо діяти і заборонити організацію, але це дорого обійдеться нам і ще більше розлютить Сандіно. Однак, якщо ми цього не зробимо, Сандіно може почати мати ідеї та спробувати захопити ще більше влади, що призведе до небезпеки для революції.\n\nМи повинні швидко прийняти рішення!"
 central_america_socialist_events.204.a: "Він занадто могутній зараз..."
 central_america_socialist_events.204.b: "Давайте викорінимо його востаннє!"

 central_america_socialist_events.300.t: "Питання Корінного Населення"
 central_america_socialist_events.300.d: "На цих землях люди проживають вже давно. Корінне населення спостерігає за новим конгресом, не знаючи, що й думати. Кілька днів тому до нас прийшов представник, шукаючи заяви щодо їхнього статусу.\n\nЧи будуть їх і надалі поважати та вважати повноправними громадянами? Ми дали їм швидку відповідь:"
 central_america_socialist_events.300.a: "Ми вітаємо нових і старих жителів!"
 central_america_socialist_events.300.b: "Ми не потребуємо вас!"

 central_america_socialist_events.301.t: "Центральноамериканська Ідентичність"
 central_america_socialist_events.301.d: "З нашим прийомом корінного населення з розпростертими обіймами, відносини значно потеплішали. Група корінних жителів взяла на себе ініціативу і сформувала Центральноамериканську Ідентичність. Вони поширюють думку, що ми всі є Центральноамериканцями, а не Гватемальцями, Нікарагуанцями чи Сальвадорцями!\n\nЦе, безсумнівно, принесе більшу єдність нашій нації!"
 central_america_socialist_events.301.a: "Ми стоїмо за всіх Центральноамериканців."

 central_america_socialist_events.302.t: "Слідуючи Європейському Прикладу"
 central_america_socialist_events.302.d: "Протягом останніх місяців наш уряд намагався ще більше узгодити наші цінності та інститути з тими, що існують у Комуні Франції.\nЗростають зусилля щодо швидкої індустріалізації та пропаганди для збільшення кількості людей, які вступають до профспілок, і наш лідер, Фарабундо Марті, оголосив про свій майбутній план віддалитися від своєї початкової ідеї «соціалізму відповідно до Центральноамериканських умов», оскільки обставини повільно змінюються, дозволяючи нам бути більш схожими на наших західноєвропейських союзників."
 central_america_socialist_events.302.a: "Усе, щоб принести світле майбутнє."

 central_america_socialist_events.303.d: "$central_america_socialist_events.302.d$\nАле після того, як «Тоталісти» прийшли до влади на останніх виборах, невідомо, чи буде достатньо наших поточних дій, щоб узгодити їх із цим більш радикальним режимом у Парижі."
 central_america_socialist_events.303.a: "Залишається лише сподіватися, що це не затьмарить наше процвітання."

 central_america_socialist_events.400.t: "Протест проти Нових Релігійних Законів"
 central_america_socialist_events.400.d: "По всій країні проходять численні мітинги проти нових законів.\nНародна Партія використовує всі протести, щоб заявити, що порушення індивідуальних свобод триватимуть під нашим правлінням.\n\nЦе спричинило численні глухі кути у конгресі, оскільки більшість виступає проти нас, заявляючи, що вони «стоять за народ».\nУсе це не залишило іншого вибору, як трохи пом'якшити наші закони наразі."
 central_america_socialist_events.400.a: "Нам слід бути обережнішими у майбутньому..."

 central_america_socialist_events.401.t: "Початок Консолідації Нашого Правління"
 central_america_socialist_events.401.d: "Оскільки минуло достатньо часу, щоб більшість суперечок навколо нашого релігійного закону вщухла, обговорення наших законів про централізацію розпочалося знову, але багато членів партії висловили різні думки щодо того, як нам слід діяти.\n\nДехто вважає, що немає сенсу навіть намагатися, оскільки інші партії згуртують народ проти нас і усунуть нас від влади, щоб зберегти ту невелику регіональну владу, яка у них залишилася.\n\nБільшість вважає, що ми можемо укласти угоду з Марті та його партією, що дасть нам достатньо влади, щоб більшість часу мати більшість у конгресі, що забезпечить нам достатню підтримку для застосування наших законів у двох інших адміністраціях.\n\nАле деякі інші все ще хочуть дотримуватися початкових планів, спочатку зробивши себе більш приязними до народу та конгресменів, щоб мати більше шансів на прийняття наших законів."
 central_america_socialist_events.401.a: "Краще залишити все як є."
 central_america_socialist_events.401.b: "Спробуймо об'єднатися з Робітничою Конфедерацією."
 central_america_socialist_events.401.c: "Ми розпочали наше правління з метою, і якщо це закінчиться її виконанням, то нехай буде так."

 central_america_socialist_events.402.t: "Зближення з Робітничою Конфедерацією"
 central_america_socialist_events.402.d: "Зустріч розпочалася без особливих подій, але ми вирішили швидко перейти до основної теми — альянсу між нами обома, щоб не мати стільки обмежень та керувати із спільним баченням.\n\nЗвісно, спочатку ми мали створити це спільне бачення. Першим пунктом була релігія: хоча вони допомагали у глухих кутах, вони пояснили, що це було лише для того, щоб зберегти підтримку народу, і що якщо наш альянс справді відбудеться, вони перейдуть на підтримку нашого атеїстичного бачення.\n\nДругий пункт стосувався статусу корінних американців: ми не маємо сильних почуттів щодо них, тому ми погоджуємося зберегти поточні позиції Робітничої Конфедерації.\n\nНарешті, ми обоє мали схожі бачення сильного центрального уряду для управління нацією, тож це також не було проблемою.\n\nЗрештою, схоже, що у нас більше спільного, ніж протилежного, тому альянс здається цілком можливим."
 central_america_socialist_events.402.a: "Ми не будемо згинати наші ідеали, щоб отримати їхню підтримку."
 central_america_socialist_events.402.b: "Ідеально, це послужить частковому досягненню наших цілей."

 central_america_socialist_events.403.t: "Збір Підтримки у Гватемалі"
 central_america_socialist_events.403.d: "Майже все готово, щоб розпочати нашу розмову у Сьюдад-де-Гватемала, але на якій темі ми зосередимося?\n\nДехто пропонує атакувати їхню, здавалося б, дуже ідеалістичну політику, наголошуючи на тому, яку шкоду це завдало їхній місцевій економіці, або на тому, як мало вони насправді досягли у своїй меті.\n\nТоді як інші говорять про тимчасове прийняття їхнього соціального забезпечення або просто про брехню про це, щоб переконати місцевих жителів та перетягнути більше з них на наш бік."
 central_america_socialist_events.403.a: "Зосередитися на атаці їхніх ідеалістичних цілей."
 central_america_socialist_events.403.b: "Більше зосередитися на безпосередніх економічних проблемах"
 central_america_socialist_events.403.c: "Соціальне забезпечення приверне народ на наш бік."
 central_america_socialist_events.403.e: "Дати порожню обіцянку допомоги."

 central_america_socialist_events.404.t: "Збір Підтримки в Сальвадорі"
 central_america_socialist_events.404.d: "Майже все готово, щоб розпочати нашу розмову в Сан-Сальвадорі, але на якій темі ми зосередимося?\n\nДехто пропонує атакувати те, що власні ідеї соціалізму Фараундо є збоченими та не відповідають справжньому соціалізму, або те, що їхні програми індустріалізації надто екстремальні і можуть завдати шкоди людям.\n\nТоді як інші говорять про прискорення наших власних програм індустріалізації, щоб запропонувати їх як кращий і схвалений урядом план."
 central_america_socialist_events.404.a: "Зосередитися на атаці соціалізму Марті."
 central_america_socialist_events.404.b: "Більше зосередитися на тому, як безрозсудна індустріалізація вплине на людей."
 central_america_socialist_events.404.c: "Ми більш здатні принести нову промисловість."
 central_america_socialist_events.404.e: "Пообіцяти принести більше промисловості, але поки що нічого не робити."

 central_america_socialist_events.405.t: "Збір Підтримки в Нікарагуа"
 central_america_socialist_events.405.d: "Майже все готово, щоб розпочати нашу розмову в Манагуа, але на якій темі ми зосередимося?\n\nДехто пропонує атакувати мілітаристичні амбіції Сандіно, який навіть стверджував, що об'єднає всю Латинську Америку в союз, або його палкі погляди на релігію, які він навіть намагався поширити серед свого лояльного ополчення.\n\nТоді як інші говорять про пропозицію підтримки фермерам, основній базі підтримки Сандіно, шляхом забезпечення кращих умов та інфраструктури."
 central_america_socialist_events.405.a: "Зосередитися на атаці мілітаризму Сандіно."
 central_america_socialist_events.405.b: "Більше зосередитися на тому, наскільки незбагненними є його ідеї про релігію."
 central_america_socialist_events.405.c: "Ми будемо захисниками фермерів."
 central_america_socialist_events.405.e: "Пообіцяти допомогти фермерам, але поки що нічого не робити."

 central_america_socialist_events.406.t: "Помірковані Роблять Свій Хід"
 central_america_socialist_events.406.d: "День почався спокійно, Вейнрайт працював за своїм столом. Незабаром двері розчинилися, і озброєні люди увірвалися до кімнати.\n\nНевдовзі Вейнрайт був у кайданках і виведений з будівлі.\n\nОфіцерів армії успішно переконали співпрацювати з Поміркованими, щоб здійснити переворот проти Максимістів і забезпечити новий уряд, корисний для народу, а не лише для себе."
 central_america_socialist_events.406.a: "Повернемо Центральну Америку на її правильний шлях."

 central_america_socialist_events.408.t: "Помірковані Пропонують Переворот"
 central_america_socialist_events.408.d: "Коли всі наші документи були готові, ми скликали новий конгрес.\n\nАле коли настав час приймати наші закони, більшість із них була швидко відхилена. Ми були готові покинути конгрес, але тут Помірковані закликали до остаточної резолюції, згідно з якою вони візьмуть на себе посаду голови та скасують багато наших законів; на подив, інші партії погодилися з цим, схоже, наша агресивна та антагоністична поведінка щодо них залишила нас без будь-якої громадської чи політичної підтримки, і без неї нам не залишалося нічого іншого, як погодитися."
 central_america_socialist_events.408.a: "Повернемо Центральну Америку на її правильний шлях."

 central_america_socialist_events.409.t: "Успішна Консолідація Влади"
 central_america_socialist_events.409.d: "Завдяки кількості підтримки, яку ми змогли зібрати, наші закони були прийняті без особливих проблем. Маючи стільки контролю в наших руках, ми нарешті можемо розібратися з сильним впливом місцевих урядів в інших провінціях, це займе час, але ми нарешті створимо бачення сильного та організованого союзу, яке ми завжди уявляли."
 central_america_socialist_events.409.a: "Справжній і сильний союз постає сьогодні."

