 CEN_land_development_in_eastern_nicaragua: "Подальший розвиток у Східній Нікарагуа"
 CEN_land_reform_in_costa_rica: "Земельна реформа в Коста-Ріці"
 CEN_land_reform_in_panama: "Земельна реформа в Панамі"

