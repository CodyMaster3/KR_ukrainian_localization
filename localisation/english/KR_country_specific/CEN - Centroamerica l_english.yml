### Decisions ###
 CENmil_political_decisions: "Рішення [CEN.GetLeader]"
 CENmil_political_decisions_desc: "Після гучної перемоги його партії на Військовому Конгресі Центральної Америки, [CEN.GetLeader] готовий трансформувати Союз у те, як він вважає, він має виглядати. Шляхом маніпулювання іноземними державами, іноземними інвесторами та компаніями, а також населенням Центральної Америки, мрія про сильну Центральну Америку під сильним лідером є досяжною.\n"
 CENmil_combat_corruption: "Боротьба з корупцією"
 CENmil_combat_corruption_desc: "Корупція — це те, що руйнує Центральну Америку. Без чесної, функціонуючої адміністрації, яка виконує свої завдання з сильним почуттям обов'язку, наш Союз повільно, але вірно розпадеться на колишні, корумповані нації."
 CENmil_more_ubiquistas: "Призначити більше Убікістів"
 CENmil_more_ubiquistas_desc: "Убікісти — це назва, дана бюрократам, призначеним та лояльним до нашого Президента Убіко, і нам їх потрібно більше. На відміну від бюрократів старої гвардії, Убікісти є непідкупними та мають дуже сильне почуття обов'язку та лояльності."
 CENmil_public_works: "Громадські роботи"
 CENmil_public_works_desc: "Громадські роботи є взаємовигідними для всіх учасників: ці великі будівельні проєкти допомагають зменшити безробіття та створюють робочі місця для людей з низькою освітою, і водночас будівлі мають високу престижну цінність та представляють велич нашого союзу."
 CENmil_travel_casual: "Поїздка до громад Союзу"
 CENmil_travel_casual_desc: "Президент погано служить своєму народу, якщо він залишається у Президентському Палаці цілий день. Відвідуючи всі куточки союзу, люди побачать в Убіко президента, який справді дбає про них."
 CENmil_travel_big_time: "Подорож по всьому Союзу"
 CENmil_travel_big_time_desc: "Президент Убіко планує відвідати кожне місто, кожне село та кожну ферму в Центральній Америці під час місячної поїздки як масовий PR-хід та щоб перевершити будь-якого іншого президента в історії будь-якої нації Центральної Америки."
 CENmil_visit_US: "Відвідати Сполучені Штати"
 CENmil_visit_US_desc: "Наш найважливіший союзник та торговий партнер також є нашим найважливішим головним спонсором. Відвідавши цю прекрасну націю, Сомоса може отримати додаткові очки репутації, які можуть стати в нагоді під час його президентства."
 CENmil_visit_GER: "Відвідати Німецьку Імперію"
 CENmil_visit_GER_desc: "Німецька Імперія може бути за дні плавання від Центральної Америки, але це не заважає нам здійснити турне по нації квашеної капусти, ковбас та надзвичайно довгих слів. Отримання підтримки Берліна вартуватиме витрат."
 CENmil_visit_ENT: "Відвідати [ENT.GetName]"
 CENmil_visit_ENT_desc: "[ENT.GetAdjective] можуть бути не найсильнішою великою державою у світі, однак їхньої сили достатньо, щоб захистити нас від наших ворогів. Їхня нація дуже красива, тож коротка політична відпустка там нікому не зашкодить."
 CENmil_backing_from_world_power: "Отримати Підтримку від Великих Націй"
 CENmil_backing_from_world_power_desc: "З підтримкою великих націй світу, ніхто не зможе поставити під сумнів нашу політику."
 CENmil_replace_ministers: "Замінити нелояльних Міністрів"
 CENmil_replace_ministers_desc: "Лояльність є найважливішою річчю у будь-яких стосунках, і спорідненість з президентом забезпечує лояльність будь-якого міністра. Однак, нелояльні міністри, які не є частиною родинного дерева Сомоси, мають піти..."
 CENmil_block_enemies: "Блокувати Ворогів Економічно"
 CENmil_block_enemies_desc: "Контролюючи засоби виробництва та транспортування, ми можемо відмовити в обслуговуванні особам, нелояльним до режиму, і змусити членів опозиції стати перед нами на коліна."
 CENmil_eat_more_land: "Передати більше землі під контроль Сомоси"
 CENmil_eat_more_land_desc: "Контролюючи залізниці, ми можемо гарантувати, що жоден ворожий до режиму фермер не зможе транспортувати свої товари до портів. Володіючи землею, якою він керує, ми можемо гарантувати, що жоден фермер не буде ворожим до режиму в першу чергу."
 CENmil_soft_loans: "Роздати Пільгові Кредити"
 CENmil_soft_loans_desc: "Пільгові кредити — це надання урядом або організацією грошей для приватних проєктів розвитку тощо за дуже низькими відсотковими ставками. Ніхто не може сказати, що ми не намагаємося допомогти нашому народу."
 CENmil_affordable_housing: "Побудувати Доступне Житло"
 CENmil_affordable_housing_desc: "З бродяжництвом потрібно боротися всіма засобами, оскільки безхатня особа не може робити внесок у суспільство. Проєкти доступного житла допоможуть прибрати бідних людей з вулиць."
 CENmil_combat_debt: "Зменшити Національний Борг"
 CENmil_combat_debt_desc: "Ми нічого не винні жодній іншій нації, і ми самі створили кожен шматочок процвітання та багатства в Центральній Америці! Хоча ми все ще винні гроші іноземним державам, це ненадовго."
 CENmil_combat_crime: "Боротьба зі Злочинністю"
 CENmil_combat_crime_desc: "Злочинність має бути викорінена з Центральної Америки, бо злочинність не створює багатства чи процвітання, вона їх руйнує."

 CENmil_economic_decisions: "Економічні Справи"
 CENmil_economic_decisions_desc: "Економіка Центральної Америки переважно побудована навколо сільськогосподарського сектора, контрольованого іноземними компаніями, найголовніше United Fruit Company. Щоб покращити стан союзу та його народу, економіка має бути пріоритетом. Інвестиції, земельні гранти тощо покращать економічну ситуацію або допоможуть нашому уряду вирішити проблеми, з якими стикається Союз.\n"
 CENmil_major_strike_decision: "Боротьба з Великим Генеральним Страйком"
 CENmil_major_strike_decision_desc: "Великий генеральний страйк паралізував наш союз. Хоча ми могли б перечекати страйкарів, більшість землевласників у Центральній Америці закликають нас негайно вжити заходів."
 CENmil_major_port_strike_decision: "Боротьба з Великим Портовим Страйком"
 CENmil_major_port_strike_decision_desc: "Великий портовий страйк паралізував наш союз. Хоча ми могли б перечекати страйкарів, експортні компанії Центральної Америки закликають нас негайно вжити заходів."
 CENmil_major_rail_strike_decision: "Боротьба з Великим Залізничним Страйком"
 CENmil_major_rail_strike_decision_desc: "Великий залізничний страйк паралізував наш союз. Хоча ми могли б перечекати страйкарів, залізничні компанії Центральної Америки закликають нас негайно вжити заходів."
 CENmil_land_grants: "Земельні Гранти"
 CENmil_land_grants_desc: "Корпорації створюють велику кількість багатства та процвітання в Центральній Америці та створюють багато життєво важливих робочих місць. В обмін на подальшу політичну підтримку ми повинні надати більше землі нашим корпоративним союзникам."
 CENmil_promote_investments: "Сприяти Інвестиціям"
 CENmil_promote_investments_desc: "Використовуючи вигідні угоди, податкові пільги та інші інструменти, уряд може спонукати іноземні компанії більше інвестувати в Центральноамериканську економіку."
 CENmil_buy_up_stuff: "Викупити Іноземні Активи"
 CENmil_buy_up_stuff_desc: "Компанії та інвестори — це добре та корисно, але кожен шматочок землі, яким вони володіють, — це шматочок землі, яким не володіє Центральноамериканець. Викуп іноземних активів зміцнить наше економічне становище."
 CENmil_nationalize_stuff: "Націоналізувати Іноземні Активи"
 CENmil_nationalize_stuff_desc: "Наша економіка перебуває в хаотичному стані, що є саме тим часом, щоб здійснити великомасштабну програму націоналізації. Хоча ми назавжди відчужимо наших корпоративних союзників, це значно зміцнить уряд."

 CENmil_infrastructure_decisions: "Інфраструктурні Проєкти"
 CENmil_infrastructure_decisions_desc: "Інфраструктура Центральної Америки погано підтримується, і багато регіонів залишаються недоступними для важких транспортних засобів та транспорту. Щоб відродити Центральноамериканську економіку, пріоритетом має бути будівництво нових залізниць та доріг по всій країні, щоб до кожного міста та села можна було дістатися вантажівкою та потягом.\n"
 CENmil_clarify_irca: "Уточнити Статус IRCA"
 CENmil_clarify_irca_desc: "Міжнародні Залізниці Центральної Америки, скорочено IRCA, підтримують монополію на залізничні перевезення та право власності на колії у Гватемалі та Сальвадорі. Хоча деякі колії перебувають під контролем уряду, нам потрібно уточнити статус тих, що належать IRCA, щоб розпочати наші програми розширення залізниць."
 CENmil_plan_trans_central_american_rail: "Спланувати Трансцентральноамериканську Залізницю"
 CENmil_plan_trans_central_american_rail_desc: "Трансцентральноамериканські Залізниці є дуже дорогим та амбітним проєктом, і для з'єднання міста Гватемала з Панамським Каналом, як заплановано, проєкт має пройти через джунглі та гори."
 CENmil_expand_irca_rails: "Розширити Колії IRCA"
 CENmil_expand_irca_rails_desc: "Колії IRCA добре підходять для потреб перевезення фруктів їхньої материнської компанії, United Fruit Company, однак вони непридатні для вимог Трансцентральноамериканської залізниці, яка має бути побудована за Європейськими стандартами."
 CENmil_tegucigalpa_rails: "Продовжити Залізницю до Тегусігальпи"
 CENmil_tegucigalpa_rails_desc: "Тегусігальпа є першою ціллю секції для Трансцентральноамериканської залізниці. Ця секція буде дуже дорогою за кілометр через горбистий характер місцевості, але досягнення міста покаже наше бажання з'єднати північ та південь."
 CENmil_managua_rails: "Продовжити Залізницю до Манагуа"
 CENmil_managua_rails_desc: "Манагуа є другою ціллю секції для Трансцентральноамериканської залізниці. Проходячи через колишні революційні землі Нікарагуа, охоронні сили перебувають у стані підвищеної готовності до будь-яких синдикалістських нападів та саботажу."
 CENmil_san_jose_rails: "Продовжити Залізницю до Сан-Хосе"
 CENmil_san_jose_rails_desc: "Сан-Хосе є третьою ціллю секції для Трансцентральноамериканської залізниці."
 CENmil_panama_rails: "Продовжити Залізницю до Панамського Каналу"
 CENmil_panama_rails_desc: "Панамський Канал є останньою ціллю секції для Трансцентральноамериканської залізниці. Канал є найбільшим та найважливішим водним шляхом у Центральній Америці та життєво важливою віссю для Тихоокеанської та Атлантичної торгівлі."
 CENmil_belize_rails: "З'єднати Беліз із Залізничною Мережею"
 CENmil_belize_rails_desc: "Колишня Британська колонія Беліз практично недоступна сушею з наших міських регіонів на Тихоокеанському узбережжі, проте це один із найбільш бунтівних регіонів. Залізниця дозволить життєво важливому транспорту військ швидко дістатися до Белізу у разі повстання."
 CENmil_atlantic_rails: "Розширити Залізницю вздовж Атлантики"
 CENmil_atlantic_rails_desc: "Атлантичні регіони Центральної Америки є найменш розвиненими частинами Республіки, і, як такі, їм бракує належної інфраструктури з великою пропускною здатністю. Залізниця від Белізу до Манагуа вздовж Атлантичного узбережжя вирішить цю проблему."
 CENmil_central_american_highway_1: "Північне Центральноамериканське Шосе"
 CENmil_central_american_highway_1_desc: "У міру зростання рівня процвітання в Центральній Америці, все більше людей зможуть дозволити собі приватні автомобілі, і, як такі, нам знадобиться більше доріг по всій країні. Шосе від Кетцальтенанго до Манагуа стане віссю нашої дорожньої системи."
 CENmil_central_american_highway_2: "Південне Центральноамериканське Шосе"
 CENmil_central_american_highway_2_desc: "Центральноамериканське Шосе стало життєво важливою інфраструктурною віссю в Північних частинах Центральної Америки, однак шосе зупиняється в Манагуа, що обмежує його здатність бути головною дорожньою віссю Центральної Америки. Необхідне продовження до Панамського Каналу."

 CENmil_foreign_policy_decisions: "Зовнішня Політика"
 CENmil_foreign_policy_decisions_desc: "У неспокійні часи, у яких ми опинилися, ми не можемо залишатися неприєднаними назавжди. Поки світ горить, оскільки Синдикалізм руйнує все більше і більше націй, ми повинні залишатися пильними та заручитися підтримкою антисиндикалістських світових держав. Наш союз більше не буде неактуальним!"
 CENmil_civil_war_volunteers: "Надіслати Добровольців на Американську Громадянську Війну"
 CENmil_civil_war_volunteers_desc: "Американська Громадянська Війна зараз вирує, і наш обов'язок — допомогти нашим союзникам, які допомагали нам протягом останніх десятиліть. Однак нам потрібно мудро обрати сторону."
 CENmil_protection_US: "Запросити Американський Захист"
 CENmil_protection_US_desc: "Сполучені Штати були нашим природним союзником протягом останніх десятиліть, допомагаючи нам розвиватися завдяки Американському фінансуванню та ноу-хау. Оскільки Синдикалізм поширюється по всій Америці, нам знадобиться їхній захист."
 CENmil_join_faction_US: "Приєднатися до Американців"
 CENmil_status_british_honduras: "Статус Белізу"
 CENmil_status_british_honduras_desc: "Колишня Британська колонія Беліз зараз знаходиться під твердим контролем Центральної Америки, однак Федерація Вест-Індії все ще претендує на цю територію як на свою. Якщо ми не вирішимо цю суперечку, ми не зможемо приєднатися до Антанти або повністю інтегрувати Беліз."
 CENmil_protection_ENT: "Запросити Захист Антанти"
 CENmil_protection_ENT_desc: "Залишки Британської Імперії можуть бути не такими сильними, як до Світової війни, однак їхні сильні флоти та повітряні сили, тим не менш, можуть захистити нас від щупалець Синдикалізму."
 CENmil_join_faction_ENT: "Приєднатися до Антанти"
 CENmil_protection_GER: "Запросити Німецький Захист"
 CENmil_protection_GER_desc: "Німецька Імперія стала гегемоном у Європі та бореться на першій лінії проти Синдикалістської хвороби. У своїй боротьбі проти Синдикалізму вони будуть дорого захищати своїх союзників."
 CENmil_join_faction_GER: "Приєднатися до Райхспакту"

 CENmil_foreign_equipment_purchases: "Закупівля Іноземного Спорядження"
 CENmil_buy_guns: "Купити Іноземну Зброю"
 CENmil_buy_guns_desc: "Наша армія недоукомплектована і все ще використовує застарілу зброю. Оскільки наша промислова база невелика, нам доведеться покладатися на імпорт, щоб отримати сучасну, надійну зброю."
 CENmil_buy_artillery: "Купити Іноземні Важкі Гармати"
 CENmil_buy_artillery_desc: "Важкі гармати, такі як артилерійські установки, не так легко виробляти, як піхотну зброю, і оскільки наша важка промисловість все ще перебуває на початковій стадії, нам доведеться покладатися на іноземний імпорт."
 CENmil_buy_tanks: "Купити Іноземну Броню"
 CENmil_buy_tanks_desc: "Вже на Соммі танк довів, що він стане життєво важливим активом у війні майбутнього. Хоча це дорого, імпорт сучасних танків допоможе нам захистити наш народ."
 CENmil_buy_planes: "Купити Іноземні Літаки"
 CENmil_buy_planes_desc: "Літак здійснив революцію у війні, оскільки тепер ми можемо атакувати не лише з землі та моря, але й з повітря. Нам потрібні сучасні літаки для наших новостворених повітряних сил."

 CENmil_restoring_the_old_union_decisions: "Відновлення Старого Союзу"
 CENmil_restoring_the_old_union_decisions_desc: "У минулому столітті було багато спроб об'єднати Центральну Америку під єдиним прапором, однак усі вони зазнали невдачі через кілька років.\nНаш новий союз не повторить ту саму долю! Ми зробимо правильно те, що наші предки зробили неправильно, і наш союз простягнеться від Мексиканського кордону до Колумбійського, як і має бути!"
 CENmil_core_british_honduras: "Інтегрувати Беліз"
 CENmil_core_british_honduras_desc: "Колишня Британська колонія Беліз поки що чинила опір нашим спробам інтеграції. Однак, оскільки Федерація Вест-Індії тепер визнає, що вона не може відвоювати свою колонію, народу Белізу не залишається іншого вибору, як здатися нашій адміністрації."
 CEN_core_matagalpa: "Реінтегрувати Східну Нікарагуа"
 CEN_core_matagalpa_desc: "Східні провінції Нікарагуа чинили опір нашим спробам запровадити призов до армії в цьому районі. Через хаос після закінчення Американської окупації та подальшої Нікарагуанської революції регіон досі не перебуває під нашим повним адміністративним контролем."
 CENmil_take_costa_rica: "Реорганізувати Коста-Ріку"
 CENmil_take_costa_rica_desc: "Коста-Ріка проголосила себе маяком демократії, але вона стала жертвою Синдикалістської загрози. Нам потрібно звільнити її від самої себе."
 CENmil_take_panama: "Захопити Панаму"
 CENmil_take_panama_desc: "На відміну від інших Центральноамериканських націй, Панама відмовилася від своєї справжньої ідентичності та стала жертвою Колумбійського імперіалізму та егоїстичного націоналізму. Нам потрібно захопити їх для їхнього ж блага."

