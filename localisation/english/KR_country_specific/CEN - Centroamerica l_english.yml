### Tooltips ###
 cenmil_congress_events_tt: "§CПід час цього фокусу військовий конгрес обговорюватиме майбутнє союзу, обиратиме міністрів, політику та першого президента.§!\n"
 cenmil_if_pataut_tt: "Якщо нас очолює §PPLP§!:"
 cenmil_if_natpop_tt: "Якщо нас очолює §nPNPP§!:"
 CENmil_diplomatic_efforts_for_a_while: "Ми зосередимо наші дипломатичні зусилля на деякий час, блокуючи інші ініціативи."

 cenmil_money_tt: "§YЧерез нашу інтервенціоністську політику нам доведеться інвестувати частину урядового бюджету.§!\n"

 cenmil_you_may_only_ask_one_tt: "§RВи можете отримати гарантії лише від однієї великої держави, обирайте мудро, з ким ви об'єднуєтеся.§!\n"
 CENmil_grand_visit_done_tt: "§RВи можете відвідати лише одну велику державу.§!\n"
 CENmil_foreign_companies_influence_above_20: "Вплив іноземних компаній не нижче §Y20%§!.\n"
 cenmil_more_gov_control_tt: "§GМи зможемо претендувати на більшість доходів залізниць, роблячи їх більш прибутковими для уряду.§!\n"
 cenmil_wait_tt: "Як тільки ми отримаємо контроль над територією, про яку йдеться, ми отримаємо подію для продовження залізниці."

### Events ###
 central_america_dictatorship_events.1.t: "Новий Союз"
 central_america_dictatorship_events.1.d: "З моменту краху Федеративної Республіки Центральної Америки у 1843 році не було жодної успішної спроби возз'єднати Центральну Америку під єдиним прапором.\n\nКерований збройними силами різних націй Центральної Америки, наш новий Союз не піде тим самим шляхом, як спроби протягом останнього століття. Оскільки Нікарагуанська революція нарешті завершилася і кордони між нашими націями зникають, наш Союз залишиться бастіоном свободи та волі під керівництвом сильних військових.\n\nМи, як союз націй, стоятимемо об'єднаними проти Синдикалізму та всього, що загрожує нашому способу життя."
 central_america_dictatorship_events.1.a: "Хай живе Республіка!"

 central_america_dictatorship_events.3.t: "Відкриття Військового Конгресу"
 central_america_dictatorship_events.3.d: "Після реорганізації та об'єднання Центральної Америки настав час обрати новий режим, який поведе нас у майбутнє! З цією метою військові формування колишніх держав Центральної Америки сьогодні зібралися на першу сесію у Президентському Палаці в місті Гватемала. Військовий Конгрес Центральної Америки матиме завдання написати нову конституцію для нашого Союзу, а також обрати міністрів та нового Президента."
 central_america_dictatorship_events.3.a: "Хай живе Республіка!"

 central_america_dictatorship_events.4.d_shared: "З моменту, як перші американські бізнесмени висадилися в Коста-Ріці, United Fruit Company та багато інших іноземних компаній та інвесторів контролювали нашу економіку. Однак, з революцією в Нікарагуа та політичним хаосом, що панував у північних націях, економіка була серйозно пошкоджена та сильно ослаблена. Тепер, коли революція придушена, і політична ситуація стабілізувалася, Конгресу потрібно вирішити єдиний економічний план та головного міністра, відповідального за реформи.\nОбидва прихильники політики невтручання, ПЛН запропонувала Хуана Мануеля Гальвеса, а ПЛП запропонувала Аладану Сандовала на цю посаду."
 central_america_dictatorship_events.4.d.yes.martinez: "$central_america_dictatorship_events.4.d_shared$, тоді як НПРП запропонувала інтервенціоніста Хоакіна Вальдеса."
 central_america_dictatorship_events.4.d.no.martinez: "$central_america_dictatorship_events.4.d_shared$."
 central_america_dictatorship_events.4.a: "Політика невтручання Хуана Мануеля Гальвеса."
 central_america_dictatorship_events.4.b: "Політика невтручання Аладани Сандовала."
 central_america_dictatorship_events.4.c: "Інтервенціонізм Хоакіна Вальдеса."

 central_america_dictatorship_events.5.t: "Новий Міністр Закордонних Справ"
 central_america_dictatorship_events.5.d_shared: "Як щойно сформована нація, наша Республіка повинна швидко визначити свій курс на світовій арені. Хоча ми залишимося з нашими старими союзниками у Сполучених Штатах та в антисиндикалістських фракціях, ми повинні швидко вжити заходів для встановлення вигідних угод. Оскільки міністерство закордонних справ має велику владу через вплив іноземних держав у нашій нації, фракції запекло борються за цю посаду.\nАбрахам Вільямс Кальдерон балотується від ПЛН,"
 central_america_dictatorship_events.5.d.yes.martinez: "$central_america_dictatorship_events.5.d_shared$ Хуан Федеріко Понсе Вайдес від ПЛП, а Сальвадор Пенья Трехо балотується від НПРП."
 central_america_dictatorship_events.5.d.no.martinez: "$central_america_dictatorship_events.5.d_shared$ та Хуан Федеріко Понсе Вайдес балотується від ПЛП."
 central_america_dictatorship_events.5.a: "Абрахам Вільямс Кальдерон."
 central_america_dictatorship_events.5.b: "Хуан Федеріко Понсе Вайдес."
 central_america_dictatorship_events.5.c: "Сальвадор Пенья Трехо."

 central_america_dictatorship_events.6.t: "Новий Голова Міністерства Внутрішніх Справ"
 central_america_dictatorship_events.6.d_shared: "Незважаючи на серйозні внутрішні загрози та проблеми, з якими стикається молода Республіка, ми все ще не маємо організованого, централізованого інституту, який би захищав наш спосіб життя. Оскільки ми не можемо покладатися на неорганізовані поліцейські сили колишніх націй, щоб вони вічно займалися цим, нам потрібно реформувати наше міністерство внутрішніх справ. Міністерству потрібен голова, щоб керувати цим, і така впливова посада дуже бажана.\nКарлос Хартлінг балотується від ПЛН,"
 central_america_dictatorship_events.6.d.yes.martinez: "$central_america_dictatorship_events.6.d_shared$ Франсіско Хав'єр Арана є кандидатом від ПЛП, а НПРП висунула Фіделя Крістіно Гарая."
 central_america_dictatorship_events.6.d.no.martinez: "$central_america_dictatorship_events.6.d_shared$ та ПЛП висунула Франсіско Хав'єра Арану."
 central_america_dictatorship_events.6.a: "Карлос Хартлінг."
 central_america_dictatorship_events.6.b: "Франсіско Хав'єр Арана."
 central_america_dictatorship_events.6.c: "Фідель Крістіно Гарай."

 central_america_dictatorship_events.7.t: "Промова Сомоси"
 central_america_dictatorship_events.7.d: "Анастасіо Сомоса Гарсіа, лідер Націоналістичної Ліберальної Партії, поміркованої фракції військового конгресу, вийшов на балкон Президентського Палацу Гватемали, щоб виступити з промовою перед великим натовпом. Як і побоювалися багато військових, він бажає використати той факт, що його фракція є найбільш поміркованою, щоб переконати населення у своїй справі, хоча він не активно практикує те, що проповідує.\n\nНезважаючи на попередження та погрози, висловлені більш радикальними ПЛП та НПРП, промова також транслювалася по радіо.\n\n«Люди Гватемали, люди Сальвадору, люди Гондурасу, люди Нікарагуа, тепер ми всі люди Центральноамериканської Республіки. Синдикалісти намагалися гнобити нас, але більше ні! Наша нація тепер вільна від Синдикалістської загрози, завдяки зусиллям кожного Центральноамериканського патріота. Тепер, коли священне завдання виконано, ваш голос має бути почутий і буде почутий!»\n\nНа наступній зустрічі військовий конгрес був настільки розлючений на Сомосу, що кілька конгресменів вийшли на трибуну і кричали, що Сомоса має бути відданий під військовий трибунал за державну зраду."
 central_america_dictatorship_events.7.a: "Можливо, його ідеї не такі вже й неправильні..."
 central_america_dictatorship_events.7.b: "Сомоса справді має бути відданий під військовий трибунал!"

 central_america_dictatorship_events.8.t: "Реформування Армії"
 central_america_dictatorship_events.8.d_shared: "Військові були рушійною силою об'єднання Центральної Америки, але говорити про це в однині досить неправильно. Через відмінності між колишніми націями Центральної Америки, наша армія наразі є хаотичною сумішшю, і залежно від того, яку національність ви маєте, ви дотримуєтеся різних військових доктрин та використовуєте різне обладнання. В армії зараз використовується не менше 5 різних модифікацій гвинтівки Mauser!\n"
 central_america_dictatorship_events.8.d.yes.martinez: "$central_america_dictatorship_events.8.d_shared$ПЛН та НПРП представили плани щодо регуляризації та професіоналізації збройних сил, тоді як ПЛП запропонувала політику великої мілітаризації для максимального розширення армії для захисту союзу."
 central_america_dictatorship_events.8.d.no.martinez: "$central_america_dictatorship_events.8.d_shared$ПЛН представила плани щодо регуляризації та професіоналізації збройних сил, тоді як ПЛП запропонувала політику великої мілітаризації для максимального розширення армії для захисту союзу."
 central_america_dictatorship_events.8.a: "Реформи професіоналізації Сомоси."
 central_america_dictatorship_events.8.b: "Реформи мілітаризації Убіко."
 central_america_dictatorship_events.8.c: "Реформи дисципліни Мартінеса."

 central_america_dictatorship_events.9.t: "Промова Мартінеса" # This event only appears if Martínez ain't dead so no need for dynamic loc
 central_america_dictatorship_events.9.d: "Максиміліано Ернандес Мартінес, лідер Національної Про-Батьківської Партії, найбільш радикальної фракції у конгресі, зарезервував годину для промови перед конгресом. Відомий своєю величезною ненавистю до Синдикалістів та опонентів загалом, він найбільш (не)славиться своїми діями під час селянського повстання 1932 року.\n\n«Шановні конгресмени, шановні чоловіки, які привели нас до перемоги проти безбожних Синдикалістів, хрестовий похід проти Синдикалізму не закінчено! Наші Мексиканські сусіди страждають від широкого розповсюдження Синдикалізму, а наших південних сусідів спокушають до рук Інтернаціоналу. Як маяк свободи та процвітання, Центральноамериканська Республіка потребує потужного, сильного та об'єднуючого лідера, щоб повести нас у вічній боротьбі проти безбожних зрадників! Наші люди боротимуться в джунглях, на пагорбах, у горах та в містах, і ми ніколи не здамося тим, хто бажає знищення основ суспільства!»"
 central_america_dictatorship_events.9.a: "Мартінес поведе нас до перемоги!"
 central_america_dictatorship_events.9.b: "Мартінес поведе нас до руїн..."

 central_america_dictatorship_events.10.t: "Хорхе Убіко Виступає з Патріотичною Промовою"
 central_america_dictatorship_events.10.d_shared: "«Центральна Америка часто розглядалася зовнішнім світом як відстала. Наші дороги описувалися як смертоносні, наші нації як корумповані та жорстокі, а наша економіка як неефективна та нерозвинена.\nБільше ні, славетний Союз доведе світові, що Центральна Америка — це земля хоробрих, сильних та інноваційних! Ми більше не страждатимемо під зрадницькими Синдикалістськими режимами, більше не страждатимемо від корумпованих чиновників, більше не страждатимемо від розколу!\nНам потрібен сильний, потужний режим, із сильним потужним лідером, щоб нарешті досягти майбутнього, тож кожному конгресмену, кожному громадянину Союзу, кожному я кажу, я принесу процвітання нашому славетному Союзу! Лише хоробрі та сильні досягнуть величі, лише ті, хто має силу волі, увійдуть в історію, лише ті, хто веде свою націю до слави, будуть пам'ятати вічно!\n\nЦентральноамериканська Республіка має йти до цивілізації! Хай живе Союз і хай живе кожен Центральноамериканський громадянин!»"
 central_america_dictatorship_events.10.d.yes.martinez: "Промова Максиміліано Ернандеса Мартінеса справила значне враження на членів конгресу, однак не всі були задоволені його умовами. Хорхе Убіко, лідер Прогресивної Ліберальної Партії, написав власну промову, щоб протистояти промові Мартінеса, і представив її перед конгресом, також транслюючи її по всьому Союзу через радіо.\n\n$central_america_dictatorship_events.10.d_shared$"
 central_america_dictatorship_events.10.d.no.martinez: "Хорхе Убіко, лідер Прогресивної Ліберальної Партії, написав дуже патріотичну промову, сподіваючись переконати народ у своїй справі, і представив її перед конгресом, також транслюючи її по всьому Союзу через радіо.\n\n$central_america_dictatorship_events.10.d_shared$"
 central_america_dictatorship_events.10.a: "Хорхе Убіко вирішить проблеми, які мучать наш Союз!"
 central_america_dictatorship_events.10.b: "Наполеон зрештою зазнав невдачі, і Убіко, здається, йде тим самим шляхом..."

 central_america_dictatorship_events.11.t: "Розпочинається Голосування"
 central_america_dictatorship_events.11.d: "Протягом кількох тижнів Військовий Конгрес Центральної Америки збирався у місті Гватемала, щоб обговорити та вирішити майбутнє Союзу. Промови, аргументи, суперечки та хабарництво були звичайним явищем, щоб переконати (або змусити) конгресменів приєднатися та проголосувати за одну з фракцій, а троє сильних людей, які очолюють їх відповідно, робили все можливе, щоб забезпечити якомога більше голосів. Останнє засідання конгресу відбудеться за кілька днів, і воно вирішить майбутнє Союзу, оскільки буде обрано нового президента, який поведе його."
 central_america_dictatorship_events.11.a: "Захоплююче!"

 central_america_dictatorship_events.12.t.somoza: "Президентські Вибори - Перемога ПЛН"
 central_america_dictatorship_events.12.t.ubico: "Президентські Вибори - Перемога ПЛП"
 central_america_dictatorship_events.12.t.martinez: "Президентські Вибори - Перемога НПРП"
 central_america_dictatorship_events.12.t.draw: "Президентські Вибори - Нічия"
 central_america_dictatorship_events.12.d_shared: "Сьогодні було оголошено про завершення останнього засідання Військового Конгресу Центральної Америки. Протягом кількох годин конгресмени віддавали свої голоси, укладалися ставки та обмінювалися хабарі. Голосування закінчилося після багатьох довгих та виснажливих годин, і ще більше болісних годин пішло на підрахунок голосів незалежними військовими.\nЗрештою,"
 central_america_dictatorship_events.12.d.somoza: "$central_america_dictatorship_events.12.d_shared$ Сомоса Гарсіа зміг отримати більшість голосів у першому турі, ставши першим президентом Центральноамериканської Республіки."
 central_america_dictatorship_events.12.d.ubico: "$central_america_dictatorship_events.12.d_shared$ Хорхе Убіко зміг отримати більшість голосів у першому турі, ставши першим президентом Центральноамериканської Республіки."
 central_america_dictatorship_events.12.d.martinez: "$central_america_dictatorship_events.12.d_shared$ Максиміліано Ернандес Мартінес зміг отримати більшість голосів у першому турі, ставши першим президентом Центральноамериканської Республіки."
 central_america_dictatorship_events.12.d.draw: "$central_america_dictatorship_events.12.d_shared$ жоден кандидат не зміг отримати більшість, що означає, що різним фракціям доведеться сформувати коаліційний уряд, щоб керувати Центральноамериканською Республікою."
 central_america_dictatorship_events.12.a: "Хай живе Президент Сомоса Гарсіа!"
 central_america_dictatorship_events.12.b: "Хай живе Президент Хорхе Убіко!"
 central_america_dictatorship_events.12.c: "Хай живе Президент Максиміліано Ернандес Мартінес!"
 central_america_dictatorship_events.12.a.draw: "Формується коаліція під керівництвом Сомоси Гарсіа."
 central_america_dictatorship_events.12.b.draw: "Формується коаліція під керівництвом Хорхе Убіко."
 central_america_dictatorship_events.12.c.draw: "Формується коаліція під керівництвом Максиміліано Ернандеса Мартінеса."

 central_america_dictatorship_events.13.t: "Боротьба з Іншими Військовими Фракціями"
 central_america_dictatorship_events.13.d: "Однопартійна держава, як випливає з назви, має бути домінована та контрольована однією партією. Позбутися демократичної та синдикалістської опозиції буде легко, однак інші військові фракції не здадуться. Тепер, коли ми перемогли в Конгресі, нам потрібно позбутися наших опонентів..."
 central_america_dictatorship_events.13.a: "Знищити їх."
 central_america_dictatorship_events.13.b: "Військові тримаються разом!"

 central_america_dictatorship_events.14.t: "Виникає Військове Суперництво"
 central_america_dictatorship_events.14.d: "Схоже, наш крок до знищення опозиції всередині армії залишив її дезорганізованою та розділеною. Незважаючи на ретельне планування, багато бригад оголосили про свою лояльність своїм колишнім командирам до завершення об'єднання."
 central_america_dictatorship_events.14.a: "Розпустити нелояльні бригади."

 central_america_dictatorship_events.15.t: "Виділити Більше Живої Сили для Поліції?"
 central_america_dictatorship_events.15.d: "З прийняттям нових, більш суворих законів, ми виявили, що нам катастрофічно бракує поліцейських для їхнього виконання. Хоча ми могли б взяти кадри з нашої Армії для вирішення цієї проблеми, це може лише розпалити полум'я цивільного невдоволення, яке може розцінити це як мілітаризацію поліції."
 central_america_dictatorship_events.15.a: "Так, виділити більше живої сили."
 central_america_dictatorship_events.15.b: "Ні, нам не потрібно ще більше гнівити громадськість."

 central_america_dictatorship_events.16.t: "Цивільна Маріонеткова Держава"
 central_america_dictatorship_events.16.d: "ПЛН перемогла в конгресі завдяки значній підтримці з боку населення, однак тепер вони очікують від нас виконання наших обіцянок. Зрада їхніх очікувань ризикує відкритим повстанням, але Сомоса насправді ніколи не планував передавати жодної влади цивільному населенню. Щоб уникнути другої революції, має бути створена цивільна держава, яку контролюватимуть військові. Однак, щоб досягти легітимності, наскільки ми готові домовлятися з цивільними політиками?"
 central_america_dictatorship_events.16.a: "Скасувати заборону на опозиційні партії, але затверджувати лише лояльних політиків."
 central_america_dictatorship_events.16.b: "Дозволити деяку цивільну опозицію, але лише під керівництвом контрольованих політиків."
 central_america_dictatorship_events.16.c: "Зміцнити нашу владу хабарами та погрозами!"

 central_america_dictatorship_events.17.t: "Президентські Вибори"
 central_america_dictatorship_events.17.d: "Схоже, народ не задоволений свободами, які ми їм надали, оскільки вони демонструють на підтримку нових виборів. Однак, на відміну від виборів у конгресі, люди хочуть голосувати самі та обирати власного президента. Ці вимоги досить божевільні, але ми не повинні ризикувати другою революцією.\n\nПісля незліченних годин голосування та очікування, виборчі бюро нарешті закрили свої двері, і результати голосування були розкриті виборчій комісії. Не було зареєстровано жодних інцидентів хабарництва чи фальсифікації виборів... принаймні жодних, про які військові дозволили б повідомити."
 central_america_dictatorship_events.17.a: "Переможець — Сомоса Гарсіа!"
 central_america_dictatorship_events.17.b: "ПЛН отримала абсолютну більшість!"
 central_america_dictatorship_events.17.c: "Сомоса Гарсіа забезпечив собі другий термін!"

 central_america_dictatorship_events.18.t: "Засудження Виборів"
 central_america_dictatorship_events.18.d: "Вулиці Центральної Америки заповнені протестувальниками та зрадниками, які вважають, що президентські вибори були сфальсифіковані на користь Сомоси Гарсіа та ПЛН!"
 central_america_dictatorship_events.18.a: "Нісенітниця..."

 central_america_dictatorship_events.36.t: "Інавгурація Убіко"
 central_america_dictatorship_events.36.d: "Прогресивна Ліберальна Партія під керівництвом Генерала Хорхе Убіко Кастаньєди зміцнила свої позиції на чолі Центральноамериканської Республіки.\n\nУбіко, тепер перший президент Союзу, був змушений боротися із Синдикалістськими революціонерами, демократичними агітаторами та зрадниками у військових, однак він довів свою непохитність та свою непідкупність у часи негараздів, які тепер залишилися позаду. Хорхе Убіко, який часто називав себе Наполеоном Центральної Америки, довів громадянам Центральної Америки, що він готовий «маршувати до цивілізації», як він обіцяв під час своєї найвідомішої радіопередачі. Сьогодні в місті Гватемала зібралися натовпи для інавгурації Хорхе Убіко, і по всьому Союзу можна було почути ту саму фразу..."
 central_america_dictatorship_events.36.a: "Хай живе Хорхе Убіко, Хай живе Республіка!"

 central_america_dictatorship_events.37.t: "Хорхе Убіко Подорожує Союзом"
 central_america_dictatorship_events.37.d: "Як справжній президент народу, Хорхе Убіко сьогодні оголосив, що подорожуватиме Центральною Америкою, відвідуючи кожне велике та мале місто, а також прекрасні сільські райони Союзу. Він перетинатиме Союз на машині та літаку, щоб мати можливість зустрітися з якомога більшою кількістю громадян Республіки та побачити кожен куточок нашого прекрасного союзу. Сьогодні він вирушає до Кетцальтенанго, після чого продовжить свій шлях до спірного регіону Белізу. Вздовж його маршруту, який був опублікований у всіх головних газетах Союзу, зібралися натовпи радісних та лояльних громадян, щоб побачити та зустріти президента особисто. "
 central_america_dictatorship_events.37.a: "Вперед!"

 central_america_dictatorship_events.38.t: "Хорхе Убіко Прибуває до Белізу"
 central_america_dictatorship_events.38.d: "У другому пункті свого туру по Республіці Хорхе Убіко прибув до Беліз-Сіті.\n\nБеліз, колишня Британська колонія під контролем Гватемали, а пізніше Центральноамериканської Республіки з моменту краху Британської імперії, залишається об'єктом претензій Федерації Вест-Індії, незважаючи на те, що він не перебуває під Британським контролем майже два десятиліття. Візит Хорхе Убіко, який був зустрінутий потоком Республіканських прапорів, доводить, що народ Белізу справді відчуває себе частиною Союзу, а не частиною гнилої федерації за морем.\n\nНаступним пунктом призначення є Гондурасське прикордонне місто Сан-Педро-Сула, яке тепер є головним Атлантичним портом Центральної Америки."
 central_america_dictatorship_events.38.a: "Убіко справді об'єднує нашу Республіку."

 central_america_dictatorship_events.39.t: "Хорхе Убіко Перетинає Гондураські Сільські Райони"
 central_america_dictatorship_events.39.d: "Гондурас, колишній бастіон проти Синдикалістських зрадників Нікарагуа, постраждав від статусу прикордонного району проти ворожої сили. Сільська місцевість є домом для більшої частини бідного населення Гондурасу, яке ледве зводить кінці з кінцями з тим небагатьом, що вони мають. Хорхе Убіко, який зараз подорожує із Сан-Педро-Сула до Матагальпи, Нікарагуа, зробив великий об'їзд, щоб відвідати якомога більше сільських районів Гондурасу. Незалежно від того, куди він прибуває, переважно неграмотні громадяни зустрічають його з найбільшою повагою та гостинністю, розмахуючи Республіканським прапором вздовж його маршруту. Хорхе Убіко пообіцяв допомогти кожному чоловікові, жінці та дитині Центральної Америки, незалежно від їхнього соціального класу чи рангу, і дотримується своєї обіцянки. Прислухаючись до потреб і вимог простої людини, Убіко здобув велику популярність у сільській місцевості, що допоможе йому у його «марші до цивілізації»."
 central_america_dictatorship_events.39.a: "Як хтось може не підтримувати Убіко?"

 central_america_dictatorship_events.40.t: "Синдикалістські Зрадники Нападають На Убіко!"
 central_america_dictatorship_events.40.d: "На шляху до Манагуа, столиці Нікарагуа, група Синдикалістських зрадників та терористів спробувала влаштувати засідку на Убіко та покінчити з життям нашого великого президента!\n\nНа щастя, Синдикалісти, як і їхня ідеологія, виявилися недостатньо розумними, щоб приховати свої плани, і були виявлені хоробрими лоялістами! Коли група зрадників готувалася влаштувати засідку на машину президента, використовуючи численні Французькі гвинтівки, лояльні поліцейські сили здолали та заарештували терористів. Хорхе Убіко та його супутники не були присутні під час бою між лоялістами та зрадниками, і, як такі, не постраждали.\n\nНезважаючи на ризики, на які пішов Убіко, подорожуючи у відкритому автомобілі через батьківщину Центральноамериканського Синдикалізму, досі не відбулося жодних загрозливих нападів."
 central_america_dictatorship_events.40.a: "Скатертиною дорога."

 central_america_dictatorship_events.41.t: "Хорхе Убіко Перетинає Сальвадор Потягом"
 central_america_dictatorship_events.41.d: "Залізниця, символ індустріалізації та вестернізації, проходить лише через обмежені частини Центральної Америки. Одна з найбільших колій розташована в Сальвадорі, з'єднуючи порти Акахутла та Кутуко і проходячи через Сан-Сальвадор та Сан-Мігель. Сьогодні спеціальний потяг доставив Хорхе Убіко із Сан-Мігеля до Сальвадорської столиці. Зупиняючись в Усулутані, Сакатеколузі, Сан-Вісенте та на інших станціях уздовж залізниці, його на кожній точці зустрічали радісні натовпи та Республіканський прапор. Після прибуття до Сан-Сальвадора він оголосив, що надасть більше фінансування та стимулів для Трансцентральноамериканської залізниці, яка також буде відкрита для цивільного транспортування."
 central_america_dictatorship_events.41.a: "Залізниця стане наріжним каменем Маршу до Цивілізації."

 central_america_dictatorship_events.42.t: "Хорхе Убіко Повертається до Міста Гватемала"
 central_america_dictatorship_events.42.d: "Після більше ніж місяця подорожі Центральною Америкою, відвідавши всі куточки Союзу та всі соціальні класи, Хорхе Убіко прибув до міста Гватемала. Тур виявився геніальним маркетинговим ходом, і популярність Хорхе Убіко різко зросла у всіх регіонах Союзу. Перед президентським палацом величезний натовп привітав Хорхе Убіко, який пізніше виголосив промову, що транслювалася по радіо. Під час туру Убіко пообіцяв багато реформ, і люди переконані, що він виконає їх усі."
 central_america_dictatorship_events.42.a: "З поверненням!"

 central_america_dictatorship_events.43.t: "Завершено Будівництво Статуї Хорхе Убіко"
 central_america_dictatorship_events.43.d: "Президент Хорхе Убіко, герой Гватемальської громадянської війни, рятівник Центральної Америки від Синдикалістських зрадників, тепер вічно спостерігатиме за Президентським Палацом.\n\nБудівництво його статуї, яка домінує на площі перед палацом, розпочалося, коли над флагштоком палацу все ще майорів Гватемальський прапор, коли Центральна Америка все ще була розділена через Синдикалістських зрадників.\n\nОднак тепер прекрасний прапор об'єднаної Республіки охороняє вхід до палацу, і все це завдяки нашому герою, Хорхе Убіко. Інавгурація, цього прекрасного червневого дня, була оголошена святом, щоб усі робітники, студенти та інтелігенція Центральної Америки мали можливість вшанувати нашого великого лідера.\n\nНатовпи, які зібралися, щоб побачити статую, оцінюються у понад двадцять тисяч хоробрих громадян, і Республіканський прапор майорить на кожній вулиці міста Гватемала у цей благословенний день."
 central_america_dictatorship_events.43.a: "Вражаюча статуя для вражаючого лідера."

 central_america_dictatorship_events.201.t: "Центральноамериканська Республіка Просить Про Захист"
 central_america_dictatorship_events.201.d: "Центральноамериканська Республіка звернулася до нашої нації з проханням захистити її від її ворогів, які загрожують цілісності та виживанню Республіки. Прийняття їхнього прохання зрештою призведе до їхнього приєднання до нашої фракції, однак наше зобов'язання щодо їхньої оборони може порушити і без того крихкий баланс сил у регіоні."
 central_america_dictatorship_events.201.a: "Гарантувати їхню Незалежність."
 central_america_dictatorship_events.201.b: "Де знову Центральна Америка?"

 central_america_dictatorship_events.202.t: "Центральноамериканська Республіка Просить Приєднатися до Нашої Фракції"
 central_america_dictatorship_events.202.d: "Центральноамериканська Республіка звернулася з проханням приєднатися до нашої військової фракції. Хоча ми могли б отримати додаткового союзника, який потенційно міг би контролювати Панамський Канал у майбутньому, баланс сил у регіоні може бути зруйнований таким кроком."
 central_america_dictatorship_events.202.a: "Прийняти їхню вимогу."
 central_america_dictatorship_events.202.b: "Центральна Америка знаходиться поруч із Бразилією, чи не так?"

 central_america_dictatorship_events.203.t: "Статус Белізу"
 central_america_dictatorship_events.203.d: "Окупований під час Британської революції 1925 року, Британський Гондурас, або як він тепер відомий як Беліз, відтоді є частиною Гватемали. Тепер, коли Гватемала еволюціонувала до Центральноамериканської Республіки, Беліз залишається частиною нашої нації. Однак Британці, точніше Федерація Вест-Індії, все ще претендують на Беліз як на законну частину своєї нації, що унеможливлює повну інтеграцію Белізу. Наша єдина можливість налагодити зв'язки з Антантою — це повернути землю, але це серйозно зашкодить нашому міжнародному престижу. Утримання ж його назавжди заблокує нам шлях до Антанти."
 central_america_dictatorship_events.203.a: "Повернути Беліз."
 central_america_dictatorship_events.203.b: "Запропонувати Угоду Федерації."

 central_america_dictatorship_events.204.t: "Центральна Америка Вимагає, Щоб Ми Відкликали Наші Претензії На Беліз"
 central_america_dictatorship_events.204.d: "Центральноамериканський уряд надіслав нам угоду щодо колишньої колонії Беліз. Вони вимагають, щоб ми відмовилися від наших претензій на Беліз і визнали його власність Центральною Америкою, а в обмін наші дві нації підпишуть вигідні торговельні угоди для відновлення ділових зв'язків."
 central_america_dictatorship_events.204.a: "Прийняти угоду."
 central_america_dictatorship_events.204.b: "Божевільні та неприйнятні умови!"

 central_america_dictatorship_events.205.t: "Федерація Відмовилася Від Наших Умов!"
 central_america_dictatorship_events.205.d: "Федерація Вест-Індії відмовилася відкликати свої претензії на Беліз і назвала наші умови божевільними та неприйнятними!"
 central_america_dictatorship_events.205.a: "Відступити та підтримувати Статус-Кво."
 central_america_dictatorship_events.205.b: "Накласти Ембарго на Федерацію!"

 central_america_dictatorship_events.206.t: "Центральна Америка Накладає на Нас Ембарго!"
 central_america_dictatorship_events.206.d: "Розлючений нашою непохитною позицією щодо статусу Белізу, Центральноамериканський уряд наклав на нас ембарго! Вони обіцяли покращити торговельні зв'язки, але тепер вони зробили протилежне. Хоча це зашкодить обом нашим економікам, поступка зараз була б політичним приниженням."
 central_america_dictatorship_events.206.a: "Нам доведеться прийняти їхні умови."
 central_america_dictatorship_events.206.b: "А чим взагалі торгувати з Центральною Америкою?"

 central_america_dictatorship_events.207.t: "Федерація Розірвала з Нами Всі Зв'язки!"
 central_america_dictatorship_events.207.d: "Федерація Вест-Індії проігнорувала наші попередження, і тепер ігнорує наше ембарго! Схоже, суперечка щодо Белізу ніколи не закінчиться..."
 central_america_dictatorship_events.207.a: "Продовжувати ембарго."

 central_america_dictatorship_events.208.t: "Федерація Відкликала Свої Претензії!"
 central_america_dictatorship_events.208.d: "Федерація Вест-Індії нарешті погодилася відкликати свої претензії на Беліз, що відкриє шлях для його повної інтеграції."
 central_america_dictatorship_events.208.a: "Чудово!"

 central_america_dictatorship_events.209.t: "Наше Прохання Було Прийнято"
 central_america_dictatorship_events.209.d: "Ми забезпечили гарантію, яку просили, і тепер захищені від ворогів Республіки."
 central_america_dictatorship_events.209.a: "Чудово!"

 central_america_dictatorship_events.210.t: "У Нашому Проханні Було Відмовлено"
 central_america_dictatorship_events.210.d: "Нам не вдалося забезпечити гарантію, яку ми просили, і тепер ми залишаємося наодинці проти ворогів Республіки."
 central_america_dictatorship_events.210.a: "Розчаровує."

 central_america_dictatorship_events.211.d: "Нас офіційно прийняли до фракції, і тепер ми можемо брати участь у міжнародному хрестовому поході проти Синдикалізму!"

 central_america_dictatorship_events.212.d: "Нас не прийняли до фракції, але ми продовжимо нашу боротьбу проти Синдикалізму самостійно."

 central_america_dictatorship_events.220.t: "Статус IRCA"
 central_america_dictatorship_events.220.d: "Міжнародні Залізниці Центральної Америки, скорочено IRCA, утримували монополію на залізничні перевезення та право власності на більшість залізничних колій у Центральній Америці з 1912 року. IRCA, яка тепер є частиною United Fruit Company, буде головним партнером або перешкодою у нашому прагненні прокласти залізницю від міста Гватемала до Панами. Попередні Гватемальські адміністрації підписали різні угоди з IRCA, і тепер нам вирішувати, чи поважати ці підписи, чи розірвати угоди на користь залізниці, контрольованої державою."
 central_america_dictatorship_events.220.a: "Надати їм монополію, якщо вони виконуватимуть наші накази."
 central_america_dictatorship_events.220.b: "Поважати попередні угоди."
 central_america_dictatorship_events.220.c: "Націоналізувати IRCA."

 central_america_dictatorship_events.221.t: "Планування Залізниці"
 central_america_dictatorship_events.221.d: "Будівництво залізниці через сувору місцевість Центральної Америки — непросте завдання, і належна залізниця, придатна для всіх видів транспортування, буде дуже дорогою. Оскільки Трансцентральноамериканська залізниця є великим престижним проєктом для уряду, дехто виступає за те, щоб уряд повністю взяв на себе всю вартість залізниці. Хоча це дуже дорого, це також гарантувало б державний контроль над коліями. Водночас іноземні інвестори також зацікавлені у будівництві залізниці та могли б взяти на себе частину витрат."
 central_america_dictatorship_events.221.a: "Дозволити інвесторам покрити витрати."
 central_america_dictatorship_events.221.b: "Взяти на себе частину рахунку."
 central_america_dictatorship_events.221.c: "Фінансувати проєкт лише державними коштами."

 central_america_dictatorship_events.222.t: "Брак Фінансування для Наступної Залізничної Секції"
 central_america_dictatorship_events.222.d: "Хоча розширення вже існуючих колій IRCA було відносно дешевим, продовження до Тегусігальпи виявилося дуже дорогим. Бюджет, запланований на цю секцію, вже перевищено, а залізниця все ще знаходиться на великій відстані від Гондураського міста. Горбиста місцевість спричинила значні затримки, і тепер організатори будівництва просять додаткового фінансування."
 central_america_dictatorship_events.222.a: "Дозволити нашим корпоративним партнерам заплатити."
 central_america_dictatorship_events.222.b: "Збільшити наше фінансування."

 central_america_dictatorship_events.223.t: "Проходження Через Синдикалістську Землю"
 central_america_dictatorship_events.223.d: "Наступна секція Трансцентральноамериканської залізниці проходитиме через Нікарагуа, яка ще не повністю оговталася від Синдикалістської революції. Організатори будівництва чітко висловили свої побоювання щодо потенційного Синдикалістського саботажу та нападів і попросили додаткової живої сили від армії для охорони будівельних майданчиків."
 central_america_dictatorship_events.223.a: "Що може піти не так."
 central_america_dictatorship_events.223.b: "Збільшити живу силу охоронних військ."

 central_america_dictatorship_events.224.t: "Синдикалістський Напад на Залізницю"
 central_america_dictatorship_events.224.d: "Синдикалістські партизани викрали кількох планувальників будівництва, яких відправили планувати залізничну секцію, що проходила через пагорби поблизу міста Леон, і вимагали значний викуп за їхнє звільнення. Щоб повернути наших людей, ми були змушені заплатити викуп, і Синдикалісти, швидше за все, використовують гроші для купівлі спорядження для майбутніх операцій."
 central_america_dictatorship_events.224.a: "То це те, що могло піти не так?"

 central_america_dictatorship_events.225.t: "Вступ до Коста-Ріки"
 central_america_dictatorship_events.225.d.costa.exists: "Незважаючи на Синдикалістське переслідування, Трансцентральноамериканська залізниця вчасно дісталася Манагуа. Однак наступна секція залізниці проходитиме через Коста-Ріканську землю, тому нам доведеться або просити дозволу у їхнього уряду на будівництво, у чому вони, швидше за все, відмовлять, або чекати, доки ми нарешті захопимо Коста-Ріку."
 central_america_dictatorship_events.225.d.costa.no.exists: "Незважаючи на Синдикалістське переслідування, Трансцентральноамериканська залізниця вчасно дісталася Манагуа. Наступна секція залізниці пройде до нещодавно умиротвореної Коста-Ріки, де ми очікуємо незначного опору будівництву."
 central_america_dictatorship_events.225.a: "Наступного року в Сан-Хосе."
 central_america_dictatorship_events.225.b: "Наступного року в Сан-Хосе, з дозволу."
 central_america_dictatorship_events.225.c: "Наступного року в Сан-Хосе, як тільки вона стане частиною Союзу."
 central_america_dictatorship_events.225.e: "Ми досягли нашого призначення: Манагуа."

 central_america_dictatorship_events.226.t: "Центральна Америка Просить Дозволу на Залізничний Проєкт"
 central_america_dictatorship_events.226.d: "Центральноамериканський уряд попросив у нас дозволу на будівництво секції Трансцентральноамериканської залізниці, що проходить через Коста-Ріку. Залізниця, після завершення, збільшить транскордонну торгівлю з рештою Центральної Америки, однак значна частина уряду побоюється, що залізниця буде використовуватися не для торгівлі, а для інтеграції нас у Центральну Америку, коли настане час."
 central_america_dictatorship_events.226.a: "Надати їм дозвіл."
 central_america_dictatorship_events.226.b: "Відмовити."

 central_america_dictatorship_events.227.t: "[FROM.GetNameDefCap] Надав Дозвіл!"
 central_america_dictatorship_events.227.d: "Уряд Коста-Ріки надав нам дозвіл продовжити Трансцентральноамериканську залізницю до Сан-Хосе"
 central_america_dictatorship_events.227.a: "Наступного року в Сан-Хосе!"

 central_america_dictatorship_events.228.t: "[FROM.GetNameDefCap] Відмовив"
 central_america_dictatorship_events.228.d: "Уряд Коста-Ріки відмовився надати нам дозвіл продовжити Трансцентральноамериканську залізницю до Сан-Хосе"
 central_america_dictatorship_events.228.a: "Наступного року в Сан-Хосе, як тільки вона стане частиною Союзу."
 central_america_dictatorship_events.228.b: "Оголосити Манагуа кінцевою станцією."

 central_america_dictatorship_events.229.t: "Рухаємося до Каналу"
 central_america_dictatorship_events.229.d.panama.exists: "$central_america_dictatorship_events.229.d.panama.no.exists$ Однак нам знадобиться дозвіл Панамського уряду на будівництво залізниці."
 central_america_dictatorship_events.229.d.panama.no.exists: "Оскільки Сан-Хосе тепер з'єднаний з рештою Центральної Америки, планується остання секція Трансцентральноамериканської залізниці. Панамський Канал є єдиним найважливішим морським шляхом в Америці і з'єднує Тихий океан з Карибським морем, але він також відділяє головні міські регіони Панами від решти Центральної Америки. Остання секція з'єднає Сан-Хосе, проходячи через Давид, із західним берегом Каналу."
 central_america_dictatorship_events.229.a: "Наступного року біля Каналу."
 central_america_dictatorship_events.229.b: "Наступного року біля Каналу, з дозволу."
 central_america_dictatorship_events.229.c: "Наступного року біля Каналу, як тільки він стане частиною Союзу."

 central_america_dictatorship_events.230.d: "Центральноамериканський уряд попросив у нас дозволу на будівництво останньої секції Трансцентральноамериканської залізниці, яка з'єднає Сан-Хосе із західним берегом Панамського Каналу. Хоча це покращило б інфраструктуру західної Панами, значна частина уряду побоюється, що залізниця буде використана у військових цілях для інтеграції нас у Центральноамериканську Республіку."

 central_america_dictatorship_events.231.d: "Панамський уряд надав нам дозвіл на будівництво останньої секції Трансцентральноамериканської залізниці"
 central_america_dictatorship_events.231.a: "Наступного року на Каналі!"

 central_america_dictatorship_events.232.d: "Панамський уряд відмовився надати нам дозвіл на будівництво останньої секції Трансцентральноамериканської залізниці"
 central_america_dictatorship_events.232.a: "Наступного року біля Каналу, як тільки він стане частиною Союзу."
 central_america_dictatorship_events.232.b: "Оголосити Сан-Хосе кінцевою станцією."

 central_america_dictatorship_events.233.t: "Коста-Ріка Тепер Наша!"
 central_america_dictatorship_events.233.d: "Оскільки Коста-Ріка нарешті є частиною Центральноамериканської Республіки, ми можемо продовжити Трансцентральноамериканську залізницю до Сан-Хосе."
 central_america_dictatorship_events.233.a: "Наступного року в Сан-Хосе."
 central_america_dictatorship_events.233.b: "Це того не варте."

 central_america_dictatorship_events.234.t: "Панама Тепер Наша!"
 central_america_dictatorship_events.234.d: "Оскільки Панама нарешті є частиною Центральноамериканської Республіки, ми можемо побудувати останню секцію Трансцентральноамериканської залізниці."
 central_america_dictatorship_events.234.a: "Наступного року на Каналі."
 central_america_dictatorship_events.234.b: "Це того не варте."

 central_america_dictatorship_events.250.t: "Великий Страйк!"
 central_america_dictatorship_events.250.d: "Незадоволені своїми поточними зарплатами та умовами праці, багато плантаційних робітників у Центральній Америці приєдналися до великого страйку. Їхні вимоги — божевільні речі, як-от зарплати, на які можна жити, та менше жорстокості з боку землевласників."
 central_america_dictatorship_events.250.a: "Кляті Синдикалісти."

 central_america_dictatorship_events.252.t: "Боротьба з Великим Страйком"
 central_america_dictatorship_events.252.d: "Оскільки страйкарі завдають шкоди як нашій економіці, так і нашим діловим відносинам, конгрес вирішив припинити чекати, доки вони припинять страйк, і втрутитися. Відправивши або армію, або поліцію, ми задовольнимо землевласників, але можуть бути жертви. Згода на їхні вимоги буде принизливою, але зашкодить іноземцям більше, ніж нам."
 central_america_dictatorship_events.252.a: "Ввести Армію."
 central_america_dictatorship_events.252.b: "Ввести Поліцію."
 central_america_dictatorship_events.252.c: "Прийняти їхні Вимоги."

 central_america_dictatorship_events.253.t: "Великий Портовий Страйк!"
 central_america_dictatorship_events.253.d: "Незадоволені своїми поточними умовами праці та зарплатами, багато робітників різних портів нашої нації повстали у страйку. Їхні вимоги ще божевільніші, ніж у попередніх страйкарів, оскільки вони вимагають, крім покращених зарплат та умов праці, оплачуваної медичної допомоги у разі травм на виробництві."
 central_america_dictatorship_events.253.a: "Кляті Синдикалісти."

 central_america_dictatorship_events.255.t: "Боротьба з Великим Портовим Страйком"
 central_america_dictatorship_events.255.d: "Оскільки страйкарі завдають шкоди як нашій економіці, так і нашим діловим відносинам, конгрес вирішив припинити чекати, доки вони припинять страйк, і втрутитися. Відправивши або армію, або поліцію, ми задовольнимо експортні компанії, але можуть бути жертви. Згода на їхні вимоги буде принизливою, але зашкодить іноземцям більше, ніж нам."
 central_america_dictatorship_events.255.a: "Ввести Армію."
 central_america_dictatorship_events.255.b: "Ввести Поліцію."
 central_america_dictatorship_events.255.c: "Прийняти їхні Вимоги."

 central_america_dictatorship_events.257.t: "Великий Залізничний Страйк!"
 central_america_dictatorship_events.257.d: "Незадоволені своїми поточними умовами праці та зарплатами, багато робітників різних залізниць нашої нації повстали у страйку. Їхні вимоги ще божевільніші, ніж у попередніх страйкарів, оскільки вони вимагають, крім покращених зарплат, умов праці та оплачуваної медичної допомоги у разі травм на виробництві, покращеного житла на будівельних майданчиках замість простих наметів, що пропускають дощ."
 central_america_dictatorship_events.257.a: "Кляті Синдикалісти."

 central_america_dictatorship_events.259.t: "Боротьба з Великим Залізничним Страйком"
 central_america_dictatorship_events.259.d: "Оскільки страйкарі завдають шкоди як нашій економіці, так і нашим діловим відносинам, конгрес вирішив припинити чекати, доки вони припинять страйк, і втрутитися. Відправивши або армію, або поліцію, ми задовольнимо залізничні компанії, але можуть бути жертви. Згода на їхні вимоги буде принизливою, але зашкодить іноземцям більше, ніж нам."
 central_america_dictatorship_events.259.a: "Ввести Армію."
 central_america_dictatorship_events.259.b: "Ввести Поліцію."
 central_america_dictatorship_events.259.c: "Прийняти їхні Вимоги."

 central_america_dictatorship_events.260.t: "Залізниці Використовуються Наполегливо"
 central_america_dictatorship_events.260.d: "Новобудовані залізничні колії інтенсивно використовуються як вантажними, так і пасажирськими потягами. Завдяки нашій частковій власності на колії, ми почнемо отримувати гроші від зборів за користування."
 central_america_dictatorship_events.260.a: "Чудово!"

 central_america_dictatorship_events.261.t: "Залізниці Приносять Прибутки"
 central_america_dictatorship_events.261.d: "Залізниці нарешті приносять прибутки через збори за користування, тож ми незабаром зможемо підтримувати їх, використовуючи прибутки, якщо ніщо не стане між нами та грошима."
 central_america_dictatorship_events.261.a: "Чудово!"

 central_america_dictatorship_events.262.t: "Великий Корупційний Скандал"
 central_america_dictatorship_events.262.d: "Незважаючи на прибутки, які приносять залізниці, до урядової скарбниці надійшло мало фактичних грошей, оскільки урядовці, які контролюють залізничний бюджет, були замішані у великому корупційному скандалі. Збагачуючи себе та своїх корпоративних партнерів, вони викрали більшу частину прибутків. Хоча це не перший скандал такого роду, він був найбільшим."
 central_america_dictatorship_events.262.a: "Не надто добре..."

 central_america_dictatorship_events.263.t: "Залізниці Окупають Самі Себе"
 central_america_dictatorship_events.263.d: "Залізниці нарешті приносять достатньо грошей, щоб окупити самі себе."
 central_america_dictatorship_events.263.a: "Чудово!"

 central_america_dictatorship_events.307.t: "Центральноамериканські Війська Скупчуються На Кордоні"
 central_america_dictatorship_events.307.d: "Розвідувальні загони повідомили про досить велику кількість Центральноамериканських військ уздовж нашого кордону. Військовим зрозуміло, що Центральна Америка планує напасти на нас, щоб змусити нас приєднатися до Союзу. Оскільки ця інформація була опублікована в газетах, багато патріотичних чоловіків записалися на захист нації, але незалежність Коста-Ріки знаходиться у серйозній небезпеці."
 central_america_dictatorship_events.307.a: "Ми захищатимемо нашу батьківщину, незалежно від ціни!"

 central_america_dictatorship_events.308.t: "Кораблі Центральної Америки Помічені біля Давіда"
 central_america_dictatorship_events.308.d: "Берегова охорона повідомила про дивні військово-морські пересування Центральної Америки поблизу Панами останнім часом, і загальна активність ФНСА зросла до загрозливого рівня. Військовим зрозуміло, що Центральна Америка планує вторгнутися в Панаму, щоб включити нас до Союзу."
 central_america_dictatorship_events.308.a: "Ми захищатимемо нашу батьківщину, незалежно від ціни!"

# This event only appears if Martinez ain't dead so no need for dynamic loc
 central_america_dictatorship_events.9.t: "Промова Максиміліано Ернандеса"
 central_america_dictatorship_events.9.d: "Максиміліано Ернандес Мартінес, лідер Національної Про-Батьківської Партії, найбільш радикальної фракції у конгресі, зарезервував годину для промови перед конгресом. Відомий своєю величезною ненавистю до Синдикалістів та опонентів загалом, він найбільш (не)славиться своїми діями під час селянського повстання 1932 року.\n\n«Шановні конгресмени, шановні чоловіки, які привели нас до перемоги проти безбожних Синдикалістів, хрестовий похід проти Синдикалізму не закінчено! Наші Мексиканські сусіди страждають від широкого розповсюдження Синдикалізму, а наших південних сусідів спокушають до рук Інтернаціоналу. Як маяк свободи та процвітання, Центральноамериканська Республіка потребує потужного, сильного та об'єднуючого лідера, щоб повести нас у вічній боротьбі проти безбожних зрадників! Наші люди боротимуться в джунглях, на пагорбах, у горах та в містах, і ми ніколи не здамося тим, хто бажає знищення основ суспільства!»"
 central_america_dictatorship_events.9.a: "Мартінес поведе нас до перемоги!"
 central_america_dictatorship_events.9.b: "Мартінес поведе нас до руїн..."

 central_america_dictatorship_events.10.t: "Хорхе Убіко Виступає з Патріотичною Промовою"
 central_america_dictatorship_events.10.d_shared: "«Центральна Америка часто розглядалася зовнішнім світом як відстала. Наші дороги описувалися як смертоносні, наші нації як корумповані та жорстокі, а наша економіка як неефективна та нерозвинена.\nБільше ні, славетний Союз доведе світові, що Центральна Америка — це земля хоробрих, сильних та інноваційних! Ми більше не страждатимемо під зрадницькими Синдикалістськими режимами, більше не страждатимемо від корумпованих чиновників, більше не страждатимемо від розколу!\nНам потрібен сильний, потужний режим, із сильним потужним лідером, щоб нарешті досягти майбутнього, тож кожному конгресмену, кожному громадянину Союзу, кожному я кажу, я принесу процвітання нашому славетному Союзу! Лише хоробрі та сильні досягнуть величі, лише ті, хто має силу волі, увійдуть в історію, лише ті, хто веде свою націю до слави, будуть пам'ятати вічно!\n\nЦентральноамериканська Республіка має йти до цивілізації! Хай живе Союз і хай живе кожен Центральноамериканський громадянин!»"
 central_america_dictatorship_events.10.d.yes.martinez: "Промова Максиміліано Ернандеса справила значне враження на членів конгресу, однак не всі були задоволені його умовами. Хорхе Убіко, лідер Прогресивної Ліберальної Партії, написав власну промову, щоб протистояти Ернандесу, і представив її перед конгресом, також транслюючи її по всьому Союзу через радіо.\n\n$cenmil.10.d_shared$"
 central_america_dictatorship_events.10.d.no.martinez: "Хорхе Убіко, лідер Прогресивної Ліберальної Партії, написав дуже патріотичну промову, сподіваючись переконати народ у своїй справі, і представив її перед конгресом, також транслюючи її по всьому Союзу через радіо.\n\n$cenmil.10.d_shared$"
 central_america_dictatorship_events.10.a: "Хорхе Убіко вирішить проблеми, які мучать наш Союз!"
 central_america_dictatorship_events.10.b: "Наполеон зрештою зазнав невдачі, і Убіко, здається, йде тим самим шляхом..."

 central_america_dictatorship_events.11.t: "Розпочинається Голосування"
 central_america_dictatorship_events.11.d: "Протягом кількох тижнів Військовий Конгрес Центральної Америки збирався у місті Гватемала, щоб обговорити та вирішити майбутнє Союзу. Промови, аргументи, суперечки та хабарництво були звичайним явищем, щоб переконати (або змусити) конгресменів приєднатися та проголосувати за одну з фракцій, і троє сильних людей, які очолюють їх відповідно, робили все можливе, щоб забезпечити якомога більше голосів. Останнє засідання конгресу відбудеться за кілька днів, і воно вирішить майбутнє Союзу, оскільки буде обрано нового президента, який поведе його."
 central_america_dictatorship_events.11.a: "Захоплююче!"

 central_america_dictatorship_events.12.t.somoza: "Президентські вибори - Перемога ПЛН"
 central_america_dictatorship_events.12.t.ubico: "Президентські вибори - Перемога ПЛП"
 central_america_dictatorship_events.12.t.martinez: "Президентські вибори - Перемога НПРП"
 central_america_dictatorship_events.12.t.draw: "Президентські вибори - Нічия"
 central_america_dictatorship_events.12.d_shared: "Сьогодні було оголошено про завершення останнього засідання Військового Конгресу Центральної Америки. Протягом годин конгресмени віддавали свої голоси, укладалися ставки та обмінювалися хабарі. Голосування закінчилося після багатьох довгих та виснажливих годин, і ще більше болісних годин пішло на підрахунок голосів незалежними військовими.\nЗрештою,"
 central_america_dictatorship_events.12.d.somoza: "$cenmil.12.d_shared$ Сомоса Гарсіа зміг отримати більшість голосів у першому турі, ставши першим президентом Центральноамериканської Республіки."
 central_america_dictatorship_events.12.d.ubico: "$cenmil.12.d_shared$ Хорхе Убіко зміг отримати більшість голосів у першому турі, ставши першим президентом Центральноамериканської Республіки."
 central_america_dictatorship_events.12.d.martinez: "$cenmil.12.d_shared$ Максиміліано Ернандес зміг отримати більшість голосів у першому турі, ставши першим президентом Центральноамериканської Республіки."
 central_america_dictatorship_events.12.d.draw: "$cenmil.12.d_shared$ жоден кандидат не зміг отримати більшість, що означає, що різним фракціям доведеться сформувати коаліційний уряд, щоб керувати Центральноамериканською Республікою."
 central_america_dictatorship_events.12.a: "Хай живе Президент Сомоса Гарсіа!"
 central_america_dictatorship_events.12.b: "Хай живе Президент Хорхе Убіко!"
 central_america_dictatorship_events.12.c: "Хай живе Президент Максиміліано Ернандес!"
 central_america_dictatorship_events.12.a.draw: "Формується коаліція під керівництвом Сомоси Гарсіа"
 central_america_dictatorship_events.12.b.draw: "Формується коаліція під керівництвом Хорхе Убіко"
 central_america_dictatorship_events.12.c.draw: "Формується коаліція під керівництвом Максиміліано Ернандеса"
 central_america_dictatorship_events.12.liegnitz: "Ми перестали бути військовим режимом."

 central_america_dictatorship_events.13.t: "Боротьба з Іншими Військовими Фракціями"
 central_america_dictatorship_events.13.d: "Однопартійна держава, як випливає з назви, має бути домінована та контрольована однією партією. Позбутися демократичної та синдикалістської опозиції буде легко, однак інші військові фракції не здадуться. Тепер, коли ми перемогли в Конгресі, нам потрібно позбутися наших опонентів..."
 central_america_dictatorship_events.13.a: "Знищити їх."
 central_america_dictatorship_events.13.b: "Військові тримаються разом!"

 central_america_dictatorship_events.14.t: "Виникає Військове Суперництво"
 central_america_dictatorship_events.14.d: "Схоже, наш крок до знищення опозиції всередині армії залишив її дезорганізованою та розділеною. Незважаючи на ретельне планування, багато бригад оголосили про свою лояльність своїм колишнім командирам до завершення об'єднання."
 central_america_dictatorship_events.14.a: "Розпустити нелояльні бригади."

 central_america_dictatorship_events.15.t: "Виділити Більше Живої Сили для Поліції?"
 central_america_dictatorship_events.15.d: "З прийняттям нових, більш суворих законів, ми виявили, що нам катастрофічно бракує поліцейських для їхнього виконання. Хоча ми могли б взяти кадри з нашої Армії для вирішення цієї проблеми, це може лише розпалити полум'я цивільного невдоволення, яке може розцінити це як мілітаризацію поліції."
 central_america_dictatorship_events.15.a: "Так, виділити більше живої сили."
 central_america_dictatorship_events.15.b: "Ні, нам не потрібно ще більше гнівити громадськість."

 central_america_dictatorship_events.16.t: "Цивільна Маріонеткова Держава"
 central_america_dictatorship_events.16.d: "ПЛН перемогла в конгресі завдяки значній підтримці з боку населення, однак тепер вони очікують від нас виконання наших обіцянок. Зрада їхніх очікувань ризикує відкритим повстанням, але Сомоса насправді ніколи не планував передавати жодної влади цивільному населенню. Щоб уникнути другої революції, має бути створена цивільна держава, яку контролюватимуть військові. Однак, щоб досягти легітимності, наскільки ми готові домовлятися з цивільними політиками?"
 central_america_dictatorship_events.16.a: "Скасувати заборону на опозиційні партії, але затверджувати лише лояльних політиків."
 central_america_dictatorship_events.16.b: "Дозволити деяку цивільну опозицію, але лише під керівництвом контрольованих політиків."
 central_america_dictatorship_events.16.c: "Зміцнити нашу владу хабарами та погрозами!"

 central_america_dictatorship_events.17.t: "Президентські Вибори"
 central_america_dictatorship_events.17.d: "Схоже, народ не задоволений свободами, які ми їм надали, оскільки вони демонструють на підтримку нових виборів. Однак, на відміну від виборів у конгресі, люди хочуть голосувати самі та обирати власного президента. Ці вимоги досить божевільні, але ми не повинні ризикувати другою революцією.\n\nПісля незліченних годин голосування та очікування, виборчі бюро нарешті закрили свої двері, і результати голосування були розкриті виборчій комісії. Не було зареєстровано жодних інцидентів хабарництва чи фальсифікації виборів... принаймні жодних, про які військові дозволили б повідомити."
 central_america_dictatorship_events.17.a: "Переможець — Сомоса Гарсіа!"
 central_america_dictatorship_events.17.b: "ПЛН отримала абсолютну більшість!"
 central_america_dictatorship_events.17.c: "Сомоса Гарсіа забезпечив собі другий термін!"

 central_america_dictatorship_events.18.t: "Засудження Виборів"
 central_america_dictatorship_events.18.d: "Вулиці Центральної Америки заповнені протестувальниками та зрадниками, які вважають, що президентські вибори були сфальсифіковані на користь Сомоси Гарсіа та ПЛН!"
 central_america_dictatorship_events.18.a: "Нісенітниця..."

 central_america_dictatorship_events.36.t: "Інавгурація Убіко"
 central_america_dictatorship_events.36.d: "Прогресивна Ліберальна Партія під керівництвом Генерала Хорхе Убіко Кастаньєди зміцнила свої позиції на чолі Центральноамериканської Республіки.\n\nУбіко, тепер перший президент Союзу, був змушений боротися із Синдикалістськими революціонерами, демократичними агітаторами та зрадниками у військових, однак він довів свою непохитність та свою непідкупність у часи негараздів, які тепер залишилися позаду. Хорхе Убіко, який часто називав себе Наполеоном Центральної Америки, довів громадянам Центральної Америки, що він готовий «маршувати до цивілізації», як він обіцяв під час своєї найвідомішої радіопередачі. Сьогодні в місті Гватемала зібралися натовпи для інавгурації Хорхе Убіко, і по всьому Союзу можна було почути ту саму фразу..."
 central_america_dictatorship_events.36.a: "Хай живе Хорхе Убіко, Хай живе Республіка!"

 central_america_dictatorship_events.37.t: "Хорхе Убіко Подорожує Союзом"
 central_america_dictatorship_events.37.d: "Як справжній президент народу, Хорхе Убіко сьогодні оголосив, що подорожуватиме Центральною Америкою, відвідуючи кожне велике та мале місто, а також прекрасні сільські райони Союзу. Він перетинатиме Союз на машині та літаку, щоб мати можливість зустрітися з якомога більшою кількістю громадян Республіки та побачити кожен куточок нашого прекрасного союзу. Сьогодні він вирушає до Кетцальтенанго, після чого продовжить свій шлях до спірного регіону Белізу. Вздовж його маршруту, який був опублікований у всіх головних газетах Союзу, зібралися натовпи радісних та лояльних громадян, щоб побачити та зустріти президента особисто."
 central_america_dictatorship_events.37.a: "Вперед!"

 central_america_dictatorship_events.38.t: "Хорхе Убіко Прибуває до Белізу"
 central_america_dictatorship_events.38.d: "У другому пункті свого туру по Республіці Хорхе Убіко прибув до Беліз-Сіті.\n\nБеліз, колишня Британська колонія під контролем Гватемали, а пізніше Центральноамериканської Республіки з моменту краху Британської імперії, залишається об'єктом претензій Федерації Вест-Індії, незважаючи на те, що він не перебуває під Британським контролем майже два десятиліття. Візит Хорхе Убіко, який був зустрінутий потоком Республіканських прапорів, доводить, що народ Белізу справді відчуває себе частиною Союзу, а не частиною гнилої федерації за морем.\n\nНаступним пунктом призначення є Гондурасське прикордонне місто Сан-Педро-Сула, яке тепер є головним Атлантичним портом Центральної Америки."
 central_america_dictatorship_events.38.a: "Убіко справді об'єднує нашу Республіку."

 central_america_dictatorship_events.39.t: "Хорхе Убіко Перетинає Гондураські Сільські Райони"
 central_america_dictatorship_events.39.d: "Гондурас, колишній бастіон проти Синдикалістських зрадників Нікарагуа, постраждав від статусу прикордонного району проти ворожої сили. Сільська місцевість є домом для більшої частини бідного населення Гондурасу, яке ледве зводить кінці з кінцями з тим небагатьом, що вони мають. Хорхе Убіко, який зараз подорожує із Сан-Педро-Сула до Матагальпи, Нікарагуа, зробив великий об'їзд, щоб відвідати якомога більше сільських районів Гондурасу. Незалежно від того, куди він прибуває, переважно неграмотні громадяни зустрічають його з найбільшою повагою та гостинністю, розмахуючи Республіканським прапором вздовж його маршруту. Хорхе Убіко пообіцяв допомогти кожному чоловікові, жінці та дитині Центральної Америки, незалежно від їхнього соціального класу чи рангу, і дотримується своєї обіцянки. Прислухаючись до потреб і вимог простої людини, Убіко здобув велику популярність у сільській місцевості, що допоможе йому у його «марші до цивілізації»."
 central_america_dictatorship_events.39.a: "Як хтось може не підтримувати Убіко?"

 central_america_dictatorship_events.40.t: "Синдикалістські Зрадники Нападають На Убіко!"
 central_america_dictatorship_events.40.d: "На шляху до Манагуа, столиці Нікарагуа, група Синдикалістських зрадників та терористів спробувала влаштувати засідку на Убіко та покінчити з життям нашого великого президента!\n\nНа щастя, Синдикалісти, як і їхня ідеологія, виявилися недостатньо розумними, щоб приховати свої плани, і були виявлені хоробрими лоялістами! Коли група зрадників готувалася влаштувати засідку на машину президента, використовуючи численні Французькі гвинтівки, лояльні поліцейські сили здолали та заарештували терористів. Хорхе Убіко та його супутники не були присутні під час бою між лоялістами та зрадниками, і, як такі, не постраждали.\n\nНезважаючи на ризики, на які пішов Убіко, подорожуючи у відкритому автомобілі через батьківщину Центральноамериканського Синдикалізму, досі не відбулося жодних загрозливих нападів."
 central_america_dictatorship_events.40.a: "Скатертиною дорога."

 central_america_dictatorship_events.41.t: "Хорхе Убіко Перетинає Сальвадор Потягом"
 central_america_dictatorship_events.41.d: "Залізниця, символ індустріалізації та вестернізації, проходить лише через обмежені частини Центральної Америки. Одна з найбільших колій розташована в Сальвадорі, з'єднуючи порти Акахутла та Кутуко і проходячи через Сан-Сальвадор та Сан-Мігель. Сьогодні спеціальний потяг доставив Хорхе Убіко із Сан-Мігеля до Сальвадорської столиці. Зупиняючись в Усулутані, Сакатеколузі, Сан-Вісенте та на інших станціях уздовж залізниці, його на кожній точці зустрічали радісні натовпи та Республіканський прапор. Після прибуття до Сан-Сальвадора він оголосив, що надасть більше фінансування та стимулів для Трансцентральноамериканської залізниці, яка також буде відкрита для цивільного транспортування."
 central_america_dictatorship_events.41.a: "Залізниця стане наріжним каменем Маршу до Цивілізації."

 central_america_dictatorship_events.42.t: "Хорхе Убіко Повертається до Міста Гватемала"
 central_america_dictatorship_events.42.d: "Після більше ніж місяця подорожі Центральною Америкою, відвідавши всі куточки Союзу та всі соціальні класи, Хорхе Убіко прибув до міста Гватемала. Тур виявився геніальним маркетинговим ходом, і популярність Хорхе Убіко різко зросла у всіх регіонах Союзу. Перед президентським палацом величезний натовп привітав Хорхе Убіко, який пізніше виголосив промову, що транслювалася по радіо. Під час туру Убіко пообіцяв багато реформ, і люди переконані, що він виконає їх усі."
 central_america_dictatorship_events.42.a: "З поверненням!"

 central_america_dictatorship_events.43.t: "Завершено Будівництво Статуї Хорхе Убіко"
 central_america_dictatorship_events.43.d: "Президент Хорхе Убіко, герой Гватемальської громадянської війни, рятівник Центральної Америки від Синдикалістських зрадників, тепер вічно спостерігатиме за Президентським Палацом.\n\nБудівництво його статуї, яка домінує на площі перед палацом, розпочалося, коли над флагштоком палацу все ще майорів Гватемальський прапор, коли Центральна Америка все ще була розділена через Синдикалістських зрадників.\n\nОднак тепер прекрасний прапор об'єднаної Республіки охороняє вхід до палацу, все завдяки нашому герою, Хорхе Убіко. Інавгурація, цього прекрасного червневого дня, була оголошена святом, щоб усі робітники, студенти та інтелігенція Центральної Америки мали можливість вшанувати нашого великого лідера.\n\nНатовпи, які зібралися, щоб побачити статую, оцінюються у понад двадцять тисяч хоробрих громадян, і Республіканський прапор майорить на кожній вулиці міста Гватемала у цей благословенний день."
 central_america_dictatorship_events.43.a: "Вражаюча статуя для вражаючого лідера."

 central_america_dictatorship_events.200.t: "Підтримка Сторони у Громадянській Війні"
 central_america_dictatorship_events.200.d: "Сполучені Штати Америки охоплені другою громадянською війною, більш руйнівною, ніж перша. Центральна Америка завжди була глибоко пов'язана зі Сполученими Штатами завдяки United Fruit Company та подібним підприємствам, проте військові розділені щодо того, кому допомагати. Дехто виступає за допомогу офіційному уряду Сполучених Штатів, тоді як інші воліють підтримати новий Американський Союзний Штат. Залежно від того, яку сторону ми оберемо, перемога чи поразка цієї фракції може мати серйозні наслідки."
 central_america_dictatorship_events.200.a: "Допомогти офіційному режиму!"
 central_america_dictatorship_events.200.b: "Підтримати Союзний Штат!"

 central_america_dictatorship_events.201.t: "Центральноамериканська Республіка Просить Про Захист"
 central_america_dictatorship_events.201.d: "Центральноамериканська Республіка звернулася до нашої нації з проханням захистити її від її ворогів, які загрожують цілісності та виживанню Республіки. Прийняття їхнього прохання зрештою призведе до їхнього приєднання до нашої фракції, однак наше зобов'язання щодо їхньої оборони може порушити і без того крихкий баланс сил у регіоні."
 central_america_dictatorship_events.201.a: "Гарантувати їхню Незалежність."
 central_america_dictatorship_events.201.b: "Де знову Центральна Америка?"

 central_america_dictatorship_events.202.t: "Центральноамериканська Республіка Просить Приєднатися до Нашої Фракції"
 central_america_dictatorship_events.202.d: "Центральноамериканська Республіка звернулася з проханням приєднатися до нашої військової фракції. Хоча ми могли б отримати додаткового союзника, який потенційно міг би контролювати Панамський Канал у майбутньому, баланс сил у регіоні може бути зруйнований таким кроком."
 central_america_dictatorship_events.202.a: "Прийняти їхню вимогу."
 central_america_dictatorship_events.202.b: "Центральна Америка знаходиться поруч із Бразилією, чи не так?"

 central_america_dictatorship_events.203.t: "Статус Белізу"
 central_america_dictatorship_events.203.d: "Окупований під час Британської революції 1925 року, Британський Гондурас, або як він тепер відомий як Беліз, відтоді є частиною Гватемали. Тепер, коли Гватемала еволюціонувала до Центральноамериканської Республіки, Беліз залишається частиною нашої нації. Однак Британці, точніше Федерація Вест-Індії, все ще претендують на Беліз як на законну частину своєї нації, що унеможливлює повну інтеграцію Белізу. Наша єдина можливість налагодити зв'язки з Антантою — це повернути землю, але це серйозно зашкодить нашому міжнародному престижу. Утримання ж його назавжди заблокує нам шлях до Антанти."
 central_america_dictatorship_events.203.a: "Повернути Беліз."
 central_america_dictatorship_events.203.b: "Запропонувати Угоду Федерації."

 central_america_dictatorship_events.204.t: "Центральна Америка Вимагає, Щоб Ми Відкликали Наші Претензії На Беліз"
 central_america_dictatorship_events.204.d: "Центральноамериканський уряд надіслав нам угоду щодо колишньої колонії Беліз. Вони вимагають, щоб ми відмовилися від наших претензій на Беліз і визнали його власність Центральною Америкою, а в обмін наші дві нації підпишуть вигідні торговельні угоди для відновлення ділових зв'язків."
 central_america_dictatorship_events.204.a: "Прийняти угоду."
 central_america_dictatorship_events.204.b: "Божевільні та неприйнятні умови!"

 central_america_dictatorship_events.205.t: "Федерація Відмовилася Від Наших Умов!"
 central_america_dictatorship_events.205.d: "Федерація Вест-Індії відмовилася відкликати свої претензії на Беліз і назвала наші умови божевільними та неприйнятними!"
 central_america_dictatorship_events.205.a: "Відступити та підтримувати Статус-Кво."
 central_america_dictatorship_events.205.b: "Накласти Ембарго на Федерацію!"

 central_america_dictatorship_events.206.t: "Центральна Америка Накладає на Нас Ембарго!"
 central_america_dictatorship_events.206.d: "Розлючений нашою непохитною позицією щодо статусу Белізу, Центральноамериканський уряд наклав на нас ембарго! Вони обіцяли покращити торговельні зв'язки, але тепер вони зробили протилежне. Хоча це зашкодить обом нашим економікам, поступка зараз була б політичним приниженням."
 central_america_dictatorship_events.206.a: "Нам доведеться прийняти їхні умови."
 central_america_dictatorship_events.206.b: "А чим взагалі торгувати з Центральною Америкою?"

 central_america_dictatorship_events.207.t: "Федерація Розірвала з Нами Всі Зв'язки!"
 central_america_dictatorship_events.207.d: "Федерація Вест-Індії проігнорувала наші попередження, і тепер ігнорує наше ембарго! Схоже, суперечка щодо Белізу ніколи не закінчиться..."
 central_america_dictatorship_events.207.a: "Продовжувати ембарго."

 central_america_dictatorship_events.208.t: "Федерація Відкликала Свої Претензії!"
 central_america_dictatorship_events.208.d: "Федерація Вест-Індії нарешті погодилася відкликати свої претензії на Беліз, що відкриє шлях для його повної інтеграції."
 central_america_dictatorship_events.208.a: "Чудово!"

 central_america_dictatorship_events.209.t: "Наше Прохання Було Прийнято"
 central_america_dictatorship_events.209.d: "Ми забезпечили гарантію, яку просили, і тепер захищені від ворогів Республіки."
 central_america_dictatorship_events.209.a: "Чудово!"

 central_america_dictatorship_events.210.t: "У Нашому Проханні Було Відмовлено"
 central_america_dictatorship_events.210.d: "Нам не вдалося забезпечити гарантію, яку ми просили, і тепер ми залишаємося наодинці проти ворогів Республіки."
 central_america_dictatorship_events.210.a: "Розчаровує."

 central_america_dictatorship_events.211.d: "Нас офіційно прийняли до фракції, і тепер ми можемо брати участь у міжнародному хрестовому поході проти Синдикалізму!"

 central_america_dictatorship_events.212.d: "Нас не прийняли до фракції, але ми продовжимо нашу боротьбу проти Синдикалізму самостійно."

 central_america_dictatorship_events.220.t: "Статус IRCA"
 central_america_dictatorship_events.220.d: "Міжнародні Залізниці Центральної Америки, скорочено IRCA, утримували монополію на залізничні перевезення та право власності на більшість залізничних колій у Центральній Америці з 1912 року. IRCA, яка тепер є частиною United Fruit Company, буде головним партнером або перешкодою у нашому прагненні прокласти залізницю від міста Гватемала до Панами. Попередні Гватемальські адміністрації підписали різні угоди з IRCA, і тепер нам вирішувати, чи поважати ці підписи, чи розірвати угоди на користь залізниці, контрольованої державою."
 central_america_dictatorship_events.220.a: "Надати їм монополію, якщо вони виконуватимуть наші накази."
 central_america_dictatorship_events.220.b: "Поважати попередні угоди."
 central_america_dictatorship_events.220.c: "Націоналізувати IRCA."

 central_america_dictatorship_events.221.t: "Планування Залізниці"
 central_america_dictatorship_events.221.d: "Будівництво залізниці через сувору місцевість Центральної Америки — непросте завдання, і належна залізниця, придатна для всіх видів транспортування, буде дуже дорогою. Оскільки Трансцентральноамериканська залізниця є великим престижним проєктом для уряду, дехто виступає за те, щоб уряд повністю взяв на себе всю вартість залізниці. Хоча це дуже дорого, це також гарантувало б державний контроль над коліями. Водночас іноземні інвестори також зацікавлені у будівництві залізниці та могли б взяти на себе частину витрат."
 central_america_dictatorship_events.221.a: "Дозволити інвесторам покрити витрати."
 central_america_dictatorship_events.221.b: "Взяти на себе частину рахунку."
 central_america_dictatorship_events.221.c: "Фінансувати проєкт лише державними коштами."

 central_america_dictatorship_events.222.t: "Брак Фінансування для Наступної Залізничної Секції"
 central_america_dictatorship_events.222.d: "Хоча розширення вже існуючих колій IRCA було відносно дешевим, продовження до Тегусігальпи виявилося дуже дорогим. Бюджет, запланований на цю секцію, вже перевищено, а залізниця все ще знаходиться на великій відстані від Гондураського міста. Горбиста місцевість спричинила значні затримки, і тепер організатори будівництва просять додаткового фінансування."
 central_america_dictatorship_events.222.a: "Дозволити нашим корпоративним партнерам заплатити."
 central_america_dictatorship_events.222.b: "Збільшити наше фінансування."

 central_america_dictatorship_events.223.t: "Проходження Через Синдикалістську Землю"
 central_america_dictatorship_events.223.d: "Наступна секція Трансцентральноамериканської залізниці проходитиме через Нікарагуа, яка все ще не повністю оговталася від Синдикалістської революції. Організатори будівництва чітко висловили свої побоювання щодо потенційного Синдикалістського саботажу та нападів і попросили додаткової живої сили від армії для охорони будівельних майданчиків."
 central_america_dictatorship_events.223.a: "Що може піти не так."
 central_america_dictatorship_events.223.b: "Збільшити живу силу охоронних військ."

 central_america_dictatorship_events.224.t: "Синдикалістський Напад на Залізницю"
 central_america_dictatorship_events.224.d: "Синдикалістські партизани викрали кількох планувальників будівництва, яких відправили планувати залізничну секцію, що проходила через пагорби поблизу міста Леон, і вимагали значний викуп за їхнє звільнення. Щоб повернути наших людей, ми були змушені заплатити викуп, і Синдикалісти, швидше за все, використовують гроші для купівлі спорядження для майбутніх операцій."
 central_america_dictatorship_events.224.a: "То це те, що могло піти не так?"

 central_america_dictatorship_events.225.t: "Вступ до Коста-Ріки"
 central_america_dictatorship_events.225.d.costa.exists: "Незважаючи на Синдикалістське переслідування, Трансцентральноамериканська залізниця вчасно дісталася Манагуа. Наступна секція залізниці однак проходитиме через Коста-Ріканську землю, тож нам доведеться або просити дозволу у їхнього уряду на будівництво, у чому вони, швидше за все, відмовлять, або чекати, доки ми нарешті захопимо Коста-Ріку."
 central_america_dictatorship_events.225.d.costa.no.exists: "Незважаючи на Синдикалістське переслідування, Трансцентральноамериканська залізниця вчасно дісталася Манагуа. Наступна секція залізниці пройде до нещодавно умиротвореної Коста-Ріки, де ми очікуємо незначного опору будівництву."
 central_america_dictatorship_events.225.a: "Наступного року в Сан-Хосе."
 central_america_dictatorship_events.225.b: "Наступного року в Сан-Хосе, з дозволу."
 central_america_dictatorship_events.225.c: "Наступного року в Сан-Хосе, як тільки вона стане частиною Союзу."
 central_america_dictatorship_events.225.e: "Ми досягли нашого призначення: Манагуа."

 central_america_dictatorship_events.226.t: "Центральна Америка Просить Дозволу на Залізничний Проєкт"
 central_america_dictatorship_events.226.d: "Центральноамериканський уряд попросив у нас дозволу на будівництво секції Трансцентральноамериканської залізниці, що проходить через Коста-Ріку. Залізниця, після завершення, збільшить транскордонну торгівлю з рештою Центральної Америки, однак значна частина уряду побоюється, що залізниця не буде використовуватися для торгівлі, а для інтеграції нас у Центральну Америку, коли настане час."
 central_america_dictatorship_events.226.a: "Надати їм дозвіл."
 central_america_dictatorship_events.226.b: "Відмовити."

 central_america_dictatorship_events.227.t: "[FROM.GetNameDefCap] Надав Дозвіл!"
 central_america_dictatorship_events.227.d: "Уряд Коста-Ріки надав нам дозвіл продовжити Трансцентральноамериканську залізницю до Сан-Хосе"
 central_america_dictatorship_events.227.a: "Наступного року в Сан-Хосе!"

 central_america_dictatorship_events.228.t: "[FROM.GetNameDefCap] Відмовив"
 central_america_dictatorship_events.228.d: "Уряд Коста-Ріки відмовився надати нам дозвіл продовжити Трансцентральноамериканську залізницю до Сан-Хосе"
 central_america_dictatorship_events.228.a: "Наступного року в Сан-Хосе, як тільки він стане частиною Союзу."
 central_america_dictatorship_events.228.b: "Оголосити Манагуа кінцевою станцією."

 central_america_dictatorship_events.229.t: "Рухаємося до Каналу"
 central_america_dictatorship_events.229.d.panama.exists: "Оскільки Сан-Хосе тепер з'єднаний з рештою Центральної Америки, планується остання секція Трансцентральноамериканської залізниці. Панамський Канал є єдиним найважливішим морським шляхом в Америці і з'єднує Тихий океан з Карибським морем, але він також відділяє головні міські регіони Панами від решти Центральної Америки. Остання секція з'єднає Сан-Хосе, проходячи через Давид, із західним берегом Каналу. Однак нам знадобиться дозвіл Панамського уряду на будівництво залізниці."
 central_america_dictatorship_events.229.d.panama.no.exists: "Оскільки Сан-Хосе тепер з'єднаний з рештою Центральної Америки, планується остання секція Трансцентральноамериканської залізниці. Панамський Канал є єдиним найважливішим морським шляхом в Америці і з'єднує Тихий океан з Карибським морем, але він також відділяє головні міські регіони Панами від решти Центральної Америки. Остання секція з'єднає Сан-Хосе, проходячи через Давид, із західним берегом Каналу."
 central_america_dictatorship_events.229.a: "Наступного року біля Каналу."
 central_america_dictatorship_events.229.b: "Наступного року біля Каналу, з дозволу."
 central_america_dictatorship_events.229.c: "Наступного року біля Каналу, як тільки він стане частиною Союзу."
 central_america_dictatorship_events.229.e: "Ми досягли нашого призначення: Сан-Хосе."

 central_america_dictatorship_events.230.d: "Центральноамериканський уряд попросив у нас дозволу на будівництво останньої секції Трансцентральноамериканської залізниці, яка з'єднає Сан-Хосе із західним берегом Панамського Каналу. Хоча це покращило б інфраструктуру західної Панами, значна частина уряду побоюється, що залізниця буде використана у військових цілях для інтеграції нас у Центральноамериканську Республіку."

 central_america_dictatorship_events.231.d: "Панамський уряд надав нам дозвіл на будівництво останньої секції Трансцентральноамериканської залізниці"
 central_america_dictatorship_events.231.a: "Наступного року на Каналі!"

 central_america_dictatorship_events.232.d: "Панамський уряд відмовився надати нам дозвіл на будівництво останньої секції Трансцентральноамериканської залізниці"
 central_america_dictatorship_events.232.a: "Наступного року біля Каналу, як тільки він стане частиною Союзу."
 central_america_dictatorship_events.232.b: "Оголосити Сан-Хосе кінцевою станцією."

 central_america_dictatorship_events.233.t: "Коста-Ріка Тепер Наша!"
 central_america_dictatorship_events.233.d: "Оскільки Коста-Ріка нарешті є частиною Центральноамериканської Республіки, ми можемо продовжити Трансцентральноамериканську залізницю до Сан-Хосе."
 central_america_dictatorship_events.233.a: "Наступного року в Сан-Хосе."
 central_america_dictatorship_events.233.b: "Це того не варте."

 central_america_dictatorship_events.234.t: "Панама Тепер Наша!"
 central_america_dictatorship_events.234.d: "Оскільки Панама нарешті є частиною Центральноамериканської Республіки, ми можемо побудувати останню секцію Трансцентральноамериканської залізниці."
 central_america_dictatorship_events.234.a: "Наступного року на Каналі."
 central_america_dictatorship_events.234.b: "Це того не варте."

 central_america_dictatorship_events.250.t: "Великий Страйк!"
 central_america_dictatorship_events.250.d: "Незадоволені своїми поточними зарплатами та умовами праці, багато плантаційних робітників у Центральній Америці приєдналися до великого страйку. Їхні вимоги — божевільні речі, як-от зарплати, на які можна жити, та менше жорстокості з боку землевласників."
 central_america_dictatorship_events.250.a: "Кляті Синдикалісти."

 central_america_dictatorship_events.252.t: "Боротьба з Великим Страйком"
 central_america_dictatorship_events.252.d: "Оскільки страйкарі завдають шкоди як нашій економіці, так і нашим діловим відносинам, конгрес вирішив припинити чекати, доки вони припинять страйк, і втрутитися. Відправивши або армію, або поліцію, ми задовольнимо землевласників, але можуть бути жертви. Згода на їхні вимоги буде принизливою, але зашкодить іноземцям більше, ніж нам."
 central_america_dictatorship_events.252.a: "Ввести Армію."
 central_america_dictatorship_events.252.b: "Ввести Поліцію."
 central_america_dictatorship_events.252.c: "Прийняти їхні Вимоги."

 central_america_dictatorship_events.253.t: "Великий Портовий Страйк!"
 central_america_dictatorship_events.253.d: "Незадоволені своїми поточними умовами праці та зарплатами, багато робітників різних портів нашої нації повстали у страйку. Їхні вимоги ще божевільніші, ніж у попередніх страйкарів, оскільки вони вимагають, крім покращених зарплат та умов праці, оплачуваної медичної допомоги у разі травм на виробництві."
 central_america_dictatorship_events.253.a: "Кляті Синдикалісти."

 central_america_dictatorship_events.255.t: "Боротьба з Великим Портовим Страйком"
 central_america_dictatorship_events.255.d: "Оскільки страйкарі завдають шкоди як нашій економіці, так і нашим діловим відносинам, конгрес вирішив припинити чекати, доки вони припинять страйк, і втрутитися. Відправивши або армію, або поліцію, ми задовольнимо експортні компанії, але можуть бути жертви. Згода на їхні вимоги буде принизливою, але зашкодить іноземцям більше, ніж нам."
 central_america_dictatorship_events.255.a: "Ввести Армію."
 central_america_dictatorship_events.255.b: "Ввести Поліцію."
 central_america_dictatorship_events.255.c: "Прийняти їхні Вимоги."

 central_america_dictatorship_events.257.t: "Великий Залізничний Страйк!"
 central_america_dictatorship_events.257.d: "Незадоволені своїми поточними умовами праці та зарплатами, багато робітників різних портів нашої нації повстали у страйку. Їхні вимоги ще божевільніші, ніж у попередніх страйкарів, оскільки вони вимагають, крім покращених зарплат, умов праці та оплачуваної медичної допомоги у разі травм на виробництві, покращеного житла на будівельних майданчиках замість простих наметів, що пропускають дощ."
 central_america_dictatorship_events.257.a: "Кляті Синдикалісти."

 central_america_dictatorship_events.259.t: "Боротьба з Великим Залізничним Страйком"
 central_america_dictatorship_events.259.d: "Оскільки страйкарі завдають шкоди як нашій економіці, так і нашим діловим відносинам, конгрес вирішив припинити чекати, доки вони припинять страйк, і втрутитися. Відправивши або армію, або поліцію, ми задовольнимо залізничні компанії, але можуть бути жертви. Згода на їхні вимоги буде принизливою, але зашкодить іноземцям більше, ніж нам."
 central_america_dictatorship_events.259.a: "Ввести Армію."
 central_america_dictatorship_events.259.b: "Ввести Поліцію."
 central_america_dictatorship_events.259.c: "Прийняти їхні Вимоги."

 central_america_dictatorship_events.260.t: "Залізниці Використовуються Наполегливо"
 central_america_dictatorship_events.260.d: "Новобудовані залізничні колії інтенсивно використовуються як вантажними, так і пасажирськими потягами. Завдяки нашій частковій власності на колії, ми почнемо отримувати гроші від зборів за користування."
 central_america_dictatorship_events.260.a: "Чудово!"

 central_america_dictatorship_events.261.t: "Залізниці Приносять Прибутки"
 central_america_dictatorship_events.261.d: "Залізниці нарешті приносять прибутки через збори за користування, тож ми незабаром зможемо підтримувати їх, використовуючи прибутки, якщо ніщо не стане між нами та грошима."
 central_america_dictatorship_events.261.a: "Чудово!"

 central_america_dictatorship_events.262.t: "Великий Корупційний Скандал"
 central_america_dictatorship_events.262.d: "Незважаючи на прибутки, які приносять залізниці, до урядової скарбниці надійшло мало фактичних грошей, оскільки урядовці, які контролюють залізничний бюджет, були замішані у великому корупційному скандалі. Збагачуючи себе та своїх корпоративних партнерів, вони викрали більшу частину прибутків. Хоча це не перший скандал такого роду, він був найбільшим."
 central_america_dictatorship_events.262.a: "Не надто добре..."

 central_america_dictatorship_events.263.t: "Залізниці Окупають Самі Себе"
 central_america_dictatorship_events.263.d: "Залізниці нарешті приносять достатньо грошей, щоб окупити самі себе."
 central_america_dictatorship_events.263.a: "Чудово!"

 central_america_dictatorship_events.307.t: "Центральноамериканські Війська Скупчуються На Кордоні"
 central_america_dictatorship_events.307.d: "Розвідувальні загони повідомили про досить велику кількість Центральноамериканських військ уздовж нашого кордону. Військовим зрозуміло, що Центральна Америка планує напасти на нас, щоб змусити нас приєднатися до Союзу. Оскільки ця інформація була опублікована в газетах, багато патріотичних чоловіків записалися на захист нації, але незалежність Коста-Ріки знаходиться у серйозній небезпеці."
 central_america_dictatorship_events.307.a: "Ми захищатимемо нашу батьківщину, незалежно від ціни!"

 central_america_dictatorship_events.308.t: "Кораблі Центральної Америки Помічені біля Давіда"
 central_america_dictatorship_events.308.d: "Берегова охорона повідомила про дивні військово-морські пересування Центральної Америки поблизу Панами останнім часом, і загальна активність ФНСА зросла до загрозливого рівня. Військовим зрозуміло, що Центральна Америка планує вторгнутися в Панаму, щоб включити нас до Союзу."
 central_america_dictatorship_events.308.a: "Ми захищатимемо нашу батьківщину, незалежно від ціни!"

### Focuses ###
### Political Tree
 CENmil_military_congress: "Військовий Конгрес"
 CENmil_military_congress_desc: "Нарешті, після багатьох десятиліть конфліктів, внутрішніх чвар та суперництва, Центральна Америка знову об'єднана під прапором об'єднаних армій Центральної Америки. Однак, як це буває, коли кілька країн утворюють союз, має бути обраний новий уряд для нашого нового союзу. Ми зберемо представників різних збройних сил Центральної Америки для обрання першого президента."

## NatPop
 CENmil_military_state: "Військова Держава"
 CENmil_military_state_desc: "Максиміліано Ернандес Мартінес та його Національна Про-Батьківська Партія перемогли у Військовому Конгресі Центральної Америки та швидко консолідують свою владу над союзом. Будучи найбільш радикальною військовою фракцією, правління Мартінеса в Сальвадорі вже довело, що він перетворить союз на потужну, централізовану військову державу без толерантності до опозиції."
 CENmil_catholic_union: "Католицький Союз"
 CENmil_catholic_union_desc: "Багато речей розділяють народ Центральної Америки; національності, як-от Гондурасська, вже сильно зашкодили ідеалу Центральноамериканської ідентичності, а Іспанська мова не змогла залагодити розколи, що утворилися вздовж національних кордонів. Проте те, що об'єднує всіх Центральноамериканців, — це їхня релігія: Католицизм."
 CENmil_speak_spanish: "Говоріть Іспанською!"
 CENmil_speak_spanish_desc: "Окрім Католицької віри, нації Центральної Америки мають спільну мову: Іспанську. Однак, більша частина корінного населення не може говорити Іспанською, і багато хто відверто відмовляється її вивчати. Ми не можемо дозволити дисидентам від урядової політики, навіть на рівні мови."
 CENmil_eradicate_syndies: "Викорінити Синдикалізм"
 CENmil_eradicate_syndies_desc: "«Синдикалізм — це рак 20-го століття», принаймні так кажуть найбільш радикальні члени режиму. Хоча неважливо, з якою хворобою порівнювати Синдикалізм, наш богоугодний обов'язок — викорінити Синдикалізм із Центральної Америки, оскільки Синдикалізм зруйнував цілісність наших націй."
 CENmil_tighter_borders: "Посилений Прикордонний Контроль"
 CENmil_tighter_borders_desc: "Головною проблемою, з якою доводилося боротися Гватемальському уряду протягом останніх десятиліть, було Мексиканське транскордонне розбійництво, яке здійснювало набіги на Гватемальські регіони заради власної вигоди. Запровадивши жорсткий прикордонний контроль із військовими патрулями, ми зможемо знищити цю незаконну діяльність, а також забезпечити, що ніщо не потрапить до Центральної Америки, чому там не місце."
 CENmil_centralized_union: "Централізований Союз"
 CENmil_centralized_union_desc: "Минуле століття показало, що національні розбіжності та кордони між різними Центральноамериканськими країнами завдали шкоди цілісності нашого регіону та дозволили радикальним групам, як-от синдикалісти Сандіно, захоплювати окремі держави. Влада має бути централізована у центральному уряді, і ніхто, крім президента, не повинен мати жодної влади у нашому союзі."
 CENmil_lasting_regime: "Тривалий Режим"
 CENmil_lasting_regime_desc: "Влада централізована в місті Гватемала, ніщо не потрапляє до Центральної Америки без дозволу уряду, опозиція до режиму повністю знищена, а наш народ об'єднаний вірою та мовою. Ніщо, окрім особистого втручання Бога, не повалить військовий режим Мартінеса."

## PatAuth
 CENmil_military_centralism: "Військовий Централізм"
 CENmil_military_centralism_desc: "Військовий Конгрес Центральної Америки надав Хорхе Убіко Кастаньєді та його Прогресивній Ліберальній Партії право керувати новоствореною Центральноамериканською Республікою. З амбітним гаслом «Наш Марш до Цивілізації» Хорхе Убіко пообіцяв Центральній Америці реформувати її у процвітаючу державу."
 CENmil_watch_pop: "Спостерігати за Населенням"
 CENmil_watch_pop_desc: "Нікарагуанська революція довела, що не кожному чоловікові в Центральній Америці можна довіряти. Ніхто не може бути впевнений, що їхні сусіди не є Синдикалістськими терористами, і щоб запобігти будь-якому Синдикалістському повстанню, ми будемо спостерігати за всім населенням на кожному кроці. Ніхто не залишиться непоміченим, жодне речення не почутим, і жодна дія не зафіксованою."
 CENmil_spy_networks: "Шпигунські Мережі"
 CENmil_spy_networks_desc: "Доноси сусідів можуть бути дуже потужним інструментом, щоб переконатися, що ніхто не зраджує Центральну Америку, але нам потрібні професійні шпигуни та агенти, щоб гарантувати, що навіть найбільш організована Синдикалістська терористична група не зможе залишатися в тіні."
 CENmil_militarize_nation: "Мілітаризувати Союз"
 CENmil_militarize_nation_desc: "Ми не можемо довіряти вчителям, телеграфістам, поштовим працівникам та іншим життєво важливим роботам, які виконуються цивільними, не пов'язаними з урядом. Синдикалістське втручання може завдати значної шкоди нашим службам, тому нам потрібно замінити небезпечні робочі місця справжніми військовими, які лояльні до режиму та мають сильне почуття обов'язку."
 CENmil_replace_bureaucrats: "Замінити Бюрократів"
 CENmil_replace_bureaucrats_desc: "Бюрократія найбільше постраждала б від Синдикалістського втручання, проте ми дозволили багатьом бюрократам з попередніх націй зберегти свої робочі місця в адміністрації союзу. Необхідна масштабна програма заміни, щоб перетворити адміністрацію на лояльний та відданий інструмент уряду, інакше нас скинуть за допомогою невеликого письмового тексту в випадкових бюрократичних паперах."
 CENmil_loyal_military: "Лояльні Військові"
 CENmil_loyal_military_desc: "Військові не просто існують для захисту нації від її ворогів. Військові — це потужний політичний інструмент, який можна використовувати для здобуття влади в будь-якій справі та посаді держави, і може бути використаний для знищення внутрішніх загроз та інакомислення. Ми повинні зберігати лояльність військових за будь-яких обставин, бо вони гарантують існування нашої держави."
 CENmil_political_domination: "Політичне Домінування"
 CENmil_political_domination_desc: "Військові під керівництвом Президента Хорхе Убіко Кастаньєди мають повну монополію на кожну державну владу, і ніщо, окрім військового перевороту, який не може статися завдяки лояльності військових, не може скинути Наполеона Центральної Америки."

## Shared NatPop/PatAuth Tree
 CENmil_one_party_state: "Однопартійна Держава"
 CENmil_one_party_state_desc: "Надто велика опозиція робить режим нестабільним та нездатним виконувати свої обов'язки. Навіть невелика кількість опозиції все ще вимагає уваги від режиму, яка могла б бути кориснішою деінде. Однопартійна Держава гарантує, що режим повністю зосереджується на управлінні нацією."
 CENmil_abolish_elections: "Скасувати Конгрес"
 CENmil_abolish_elections_desc: "Військовий конгрес виконав свій обов'язок і тепер є ще одним джерелом опозиції. В інтересах нації формально скасувати конгрес і передати всю владу, яку він ще мав, правлячій партії. Хоча ми не будемо проводити чистку наших товаришів-офіцерів та солдатів, тепер лише ми матимемо владу."
 CENmil_destroy_opposition: "Знищити Опозицію"
 CENmil_destroy_opposition_desc: "Опозиція — це марний спосіб зменшити владу режиму, відволікаючи його від важливих питань управління та адміністрації. Нам не потрібна опозиція, щоб говорити нам, що ми робимо те чи інше неправильно; Ми не робимо нічого неправильного, вони просто думають неправильно."

## AuthDem
 CENmil_military_control: "Військовий Контроль"
 CENmil_military_control_desc: "Анастасіо Сомоса Гарсіа та його Націоналістична Ліберальна Партія виграли вибори у конгресі і тепер керують нацією. Військові знищили Синдикалізм у Центральній Америці, і військові відкрили шлях до об'єднання, тому військові мають право керувати, але відверта диктатура шкодить репутації держави."
 CENmil_puppet_civil_state: "Маріонеткова Цивільна Держава"
 CENmil_puppet_civil_state_desc: "Військова диктатура — це скоріше принизливий термін, ніж об'єктивний. Ні, Центральна Америка — це не військова диктатура, це повноцінна демократія, лише з Центральноамериканськими особливостями. Ми просто прибираємо «демо» і замінюємо його на «страто»."
 CENmil_permit_elections: "Дозволити Вибори"
 CENmil_permit_elections_desc: "Народ вимагає виборів; народ вимагає голосувати... У нас немає іншого вибору, як погодитися, але на наших умовах. Правда полягає в тому, що вибори були сфальсифіковані від самого початку."
 CENmil_check_opposition: "Тримати Опозицію Під Контролем"
 CENmil_check_opposition_desc: "Опозиція є природною, хоча й дратівливою частиною будь-якої нації. Деякі люди завжди знайдуть спосіб не погодитися з урядом, навіть якщо останній захистив весь регіон від щупалець Синдикалізму і навіть якщо останній захистив свободу та волю своїх громадян перед обличчям небезпеки диктатури."
 CENmil_foreign_collaboration: "Іноземна Співпраця"
 CENmil_foreign_collaboration_desc: "В інтересах нації — підтримувати тісні стосунки з головними світовими державами та співпрацювати з сильними націями навколо нас. Було б нерозумно ізолюватися, оточеним Синдикалістами на півночі та прото-Синдикалістами на півдні."
 CENmil_empower_companies: "Надати Повноваження Компаніям"
 CENmil_empower_companies_desc: "Ми повинні співпрацювати не лише з головними світовими державами, але й з головними компаніями світу. United Fruit Company, головна історія успіху, принесла сучасні залізниці, дороги, радіоустановки та багато іншого до Центральної Америки, а також багато грошей у гаманці родини та друзів Сомоси Гарсіа."
 CENmil_edit_constitution: "Редагувати Конституцію"
 CENmil_edit_constitution_desc: "Конституція — це священний документ, який має бути захищений завжди, але зміст конституції не заслуговує на такий самий захист. Якщо закон нам не підходить, ми просто видаляємо його. Якщо ми виявляємо, що чогось бракує, ми просто додаємо це. Ніщо не є легшим, ніж редагування конституції, якщо ти володієш усією владою."
 CENmil_limit_rights: "Обмежити Права"
 CENmil_limit_rights_desc: "Права не завжди є правильним підходом для гарантування свободи. Наші громадяни можуть мати право на власні думки, але це призводить до створення Синдикалістів, які борються за свободу. Щоб захистити свободу та волю нашого народу, нам потрібно обмежити права, які їй загрожують."
 CENmil_economic_control: "Економічний Контроль"
 CENmil_economic_control_desc: "Контролюючи всю економіку Центральної Америки, ми можемо забезпечити, щоб її прибутки та продукти використовувалися для правильних речей, таких як збагачення членів родини Сомоси Гарсіа. Ми також зможемо блокувати, наприклад, фермерів, які вороже ставляться до нашої урядової політики, від транспортування своїх товарів до порту, використовуючи державні транспортні системи."
 CENmil_national_monopoly: "Національна Монополія"
 CENmil_national_monopoly_desc: "Націоналістична Ліберальна Партія контролює державу, вона контролює економіку, вона контролює ЗМІ, вона контролює кожен аспект Центральної Америки. Ми повільно і тихо провели чистку опозиції, і ніхто не стоїть між нами та повною владою."

### Economic Tree
 CENmil_interventionism: "Інтервенціонізм"
 CENmil_interventionism_desc: "Ми не можемо покладатися лише на компанії та інвесторів, щоб вони вирішували економічні проблеми, з якими стикається Республіка. Уряд має втрутитися в економічний процес, щоб створити нові можливості та покращити промисловість та інфраструктуру нашої нації."
 CENmil_laissez_faire: "Laissez-Faire (Невтручання)"
 CENmil_laissez_faire_desc: "Уряд є за своєю суттю неефективним у питаннях економіки, і тому ми повинні передати роботу з виправлення економіки бізнесменам та інвесторам, які мають великий досвід у цьому секторі. Уряд повинен лише забезпечувати безпеку та вселяти довіру до нашої економіки."

# Infrastructure
 CENmil_infrastructure_fund: "Інфраструктурний фонд"
 CENmil_infrastructure_fund_desc: "У Центральній Америці бракує основних доріг та залізничних мереж. Потягом можна дістатися лише з міста Гватемала до Сан-Сальвадора, та й то, наявні колії переважно використовуються Американськими підприємствами для перевезення вантажів. Багато сіл та регіонів Центральної Америки навіть не мають дорожнього сполучення, яким можна було б користуватися для важкого транспорту. Це має змінитися!"
 CENmil_portuary_expansion: "Розширення наших портів"
 CENmil_portuary_expansion_desc: "Головним економічним сектором Центральної Америки залишається експорт сільськогосподарської продукції. Щоб збільшити наші експортні потужності і, як наслідок, прибутки, нам потрібно розширити наші порти, щоб дозволити великим вантажним суднам ставати там на якір. Ці порти також можуть стати в нагоді для ARCA."
 CENmil_world_exports: "Світовий ринок"
 CENmil_world_exports_desc: "Наш сільськогосподарський сектор не припиняє зростання, і наш експорт досяг рекордних значень. Завдяки доступу до всього світового ринку, наші фермери зможуть продавати продукцію на ринки Софії та [202.GetName], до Токіо та Сіднея, отримуючи великі прибутки."
 CENmil_roads_and_rails: "Дороги та залізниці"
 CENmil_roads_and_rails_desc: "Наша економіка швидко зростає, однак погана інфраструктура Центральної Америки стримує темпи нашого зростання. Уряд запустив нову масштабну програму «Дороги та залізниці», яка виділяє частину бюджету на інфраструктурні проєкти для з'єднання різних регіонів Центральної Америки."
 CENmil_infrastructural_profits: "Інфраструктурні прибутки"
 CENmil_infrastructural_profits_desc: "Наші інфраструктурні проєкти, такі як ініціатива «Дороги та залізниці», коштували багато грошей і змусили уряд взяти додаткові борги. Тепер, коли ці проєкти переважно завершені, вони починають приносити прибутки через збори за користування та додаткове економічне зростання."
 CENmil_briding_ca: "З'єднання Центральної Америки"
 CENmil_briding_ca_desc: "Лінії зв'язку Центральної Америки дуже рідкісні, а наявні лінії погано підтримуються. Нам потрібно активно інвестувати у технології зв'язку, такі як телеграф та радіо, щоб з'єднати джунглі та пагорби Центральної Америки, залишаючись в урядових офісах."

# Industry
 CENmil_industrialization_program: "Програма індустріалізації"
 CENmil_industrialization_program_desc: "Промислова база Центральної Америки дуже обмежена, і наша невелика база важкої промисловості не може належним чином задовольнити потреби громадян та армії. Нам потрібно індустріалізувати нашу націю, щоб вивести її з 17-го століття у 20-те століття."
 CENmil_local_manufacturing: "Місцеве виробництво"
 CENmil_local_manufacturing_desc: "На відміну від промислових регіонів Рейнланду чи Валлонії, Центральна Америка не має жодних концентрованих промислових зон і має дуже обмежену промисловість споживчих товарів. Сприяючи місцевому виробництву та надаючи допомогу місцевим виробникам, ми можемо збільшити наш промисловий випуск."
 CENmil_made_in_ca: "Зроблено в Центральній Америці"
 CENmil_made_in_ca_desc: "Досі на більшості споживчих товарів у магазинах Центральної Америки було написано «Зроблено в Німеччині» або «Зроблено в Канаді»... Замість протекціоністських заходів, щоб спробувати витіснити ці продукти, ми повинні просувати місцеве виробництво, щоб «Зроблено в Центральній Америці» стало домінуючим у магазинах нашої нації."
 CENmil_invite_foreign: "Запросити іноземних інвесторів"
 CENmil_invite_foreign_desc: "Уряд не має коштів, щоб індустріалізувати всю націю самотужки. Нам потрібно співпрацювати з нашими корпоративними друзями та нашими союзниками-інвесторами, щоб допомогти розвинути нашу націю."
 CENmil_corporate_investments: "Корпоративні інвестиції"
 CENmil_corporate_investments_desc: "Нам потрібно сприяти подальшим корпоративним інвестиціям для прискорення промислового розвитку нашої нації."
 CENmil_cheap_labour: "Дешева робоча сила"
 CENmil_cheap_labour_desc: "Щоб залучити іноземні компанії, ми значно знизили корпоративні податки та надали серйозний правовий захист. Однак головним аргументом Центральної Америки залишається дуже низька заробітна плата, що дозволяє, наприклад, Американським компаніям виробляти набагато дешевше, ніж у США."

# Agriculture
 CENmil_agricultural_dev: "Сільськогосподарський розвиток"
 CENmil_agricultural_dev_desc: "Сільськогосподарський сектор Центральної Америки залишається найважливішим стовпом нашої економіки, і більшість іноземних інвестицій надходять на наші ферми та плантації. Нам потрібно надати додаткову підтримку для механізації нашого сільськогосподарського сектора та покращення умов життя наших фермерів."
 CENmil_ufc_protecc: "Захист корпоративних активів"
 CENmil_ufc_protecc_desc: "У хаосі, що виник після Нікарагуанської революції та заворушень в інших націях Центральної Америки, наші корпоративні союзники зазнали серйозних нападів як з боку Синдикалістів, так і Лібералів. Нам потрібно захистити корпоративні активи, щоб відновити довіру до нашої економіки."
 CENmil_ufc_attacc: "Подальші земельні гранти"
 CENmil_ufc_attacc_desc: "Іноземні компанії, такі як United Fruit Company, мають великий вплив, як економічний, так і політичний, у нашій нації. Надаючи цим компаніям додаткові, безподаткові землі, вони підтримають політику нашої нинішньої адміністрації та збільшать сільськогосподарський випуск нашої нації."
 CENmil_cash_crop_export: "Прибутки від товарних культур"
 CENmil_cash_crop_export_desc: "Товарні культури становлять значну частину нашого сільськогосподарського виробництва та приносять великі прибутки."
 CENmil_efficent_plantations: "Ефективні плантації"
 CENmil_efficent_plantations_desc: "Багато плантацій Центральної Америки мають дуже низький випуск, оскільки вони використовують застарілі методи ведення господарства та неефективно облаштовані. Завдяки додатковому державному фінансуванню та інвестиціям в освіту ми можемо значно збільшити сільськогосподарський випуск нашої економіки."
 CENmil_diverse_output: "Різноманітний випуск"
 CENmil_diverse_output_desc: "Як і в будь-якому економічному секторі, ми не можемо покладатися на один тип культури. У разі коливань цін або неврожаю нам потрібне різноманітне сільське господарство для подолання труднощів."

### Army
 CENmil_army_investments: "Армійські інвестиції"
 CENmil_army_investments_desc: "Армія є основою всієї Республіки. Заслуга за успішне об'єднання належить нашим військовим, і вони захищатимуть та розширюватимуть наш Союз назавжди. Щоб зміцнити державу та збройні сили, необхідно різко збільшити оборонний бюджет."

## Warfare with European Characteristics
 CENmil_army_european: "Європейська доктрина"
 CENmil_army_european_desc: "Вороги, з якими стикається Центральноамериканська Республіка, — це не якісь неорганізовані партизанські сили чи армія, що складається з однієї дивізії. Наші вороги на півночі та півдні мають потужні промислові бази, сильні повітряні сили та великі армії. Щоб захистити наш спосіб життя, нам потрібно адаптувати сучасну, Європейську доктрину."
 CENmil_standardised_equipment: "Стандартизоване обладнання"
 CENmil_standardised_equipment_desc: "Наша армія наразі використовує величезну кількість різноманітного обладнання, наприклад, ми використовуємо не одну, а кілька версій застарілої гвинтівки Mauser! У хаосі, який панує в нашому військовому арсеналі, лише масштабна програма стандартизації зможе навести лад."
 CENmil_heavy_guns: "Важкі гармати"
 CENmil_heavy_guns_desc: "Нашій армії бракує важкої вогнепальної зброї, незважаючи на те, що артилерія виявилася вирішальною в битвах Світової війни. Нам потрібно швидко оснастити нашу армію важкими гарматами та навчити спеціалізовані батальйони для їхньої експлуатації."
 CENmil_motorisation_effort: "Зусилля з моторизації"
 CENmil_motorisation_effort_desc: "Реформуючи та розширюючи нашу армію, ми стикаємося із серйозними логістичними проблемами. Місцевість Центральної Америки сувора, а дороги рідкісні, проте нам все одно потрібно доставляти наші артилерійські установки з фабрики чи порту до наших дивізій на кордоні. Вантажівки вирішать цю проблему."
 CENmil_chain_command: "Реорганізувати Командну Ієрархію"
 CENmil_chain_command_desc: "Подібно до нашого військового арсеналу, наша командна ієрархія — це не що інше, як анархія. Оскільки ми перебуваємо у процесі інтеграції армій з різних націй в одну, які мали різні доктрини та ієрархії, ніхто більше не знає, хто від кого приймає накази і хто стоїть на вершині. Нам потрібно повністю реорганізувати всю командну ієрархію."
 CENmil_trained_officers: "Навчені Офіцери"
 CENmil_trained_officers_desc: "Нашій армії гостро бракує молодших офіцерів, і загалом, навчені офіцери, які знають, що роблять, наразі є такою ж рідкістю, як і успішний Синдикалізм. Обширна програма набору та навчання стане першим кроком до виправлення цієї жахливої проблеми."
 CENmil_border_exercises: "Прикордонні Навчання"
 CENmil_border_exercises_desc: "Місцевість Центральної Америки дуже сувора та невблаганна, і погано нанесена на карту. Проводячи регулярні навчання та військові ігри поблизу кордонів наших ворогів, ми знатимемо місцевість набагато краще, ніж загарбники, і водночас ми тренуватимемо нашу армію."
 CENmil_professional_soldiers: "Професійні Солдати"
 CENmil_professional_soldiers_desc: "Звичайні призовники можуть мати дух і бажання боротися, однак, коли перші кулі летять у повітрі, вони будуть безнадійно налякані. Професійний солдат, з іншого боку, залишатиметься спокійним і виконуватиме свій обов'язок захисту своєї нації завжди."

## Central Army Tree
 CENmil_industrial_warfare: "Індустріальна Війна"
 CENmil_industrial_warfare_desc: "Сильна армія — це не армія з великим запасом живої сили, а армія з потужною промисловою базою, яка її підтримує. Без належної економіки жодна нація не зможе воювати у 20-му столітті."
 CENmil_mil_ind_complex: "Військово-Промисловий Комплекс"
 CENmil_mil_ind_complex_desc: "Наші військові та важкі галузі не можуть повністю оснастити та забезпечити нашу армію. Уряду доведеться втрутитися, щоб збільшити потужність військово-промислового комплексу, щоб кожен солдат отримав гвинтівку та шолом, які йому потрібні."
 CENmil_scientific_warfare: "Наукова Війна"
 CENmil_scientific_warfare_desc: "Сильна армія — це не армія з великим запасом живої сили, або армія з потужною промисловою базою, яка її підтримує, а армія, яка має доступ до найсучаснішого та найскладнішого обладнання та тактик."
 CENmil_military_science: "Військова Наука"
 CENmil_military_science_desc: "Центральна Америка не має багато освічених науковців, і більшість із них не працює на військових. Хоча ми переважно користуємося технологіями, розробленими нашими союзниками, ми не можемо залишатися залежними назавжди."
 CENmil_economic_warfare: "Економічна Війна"
 CENmil_economic_warfare_desc: "Сильна армія — це не армія з великим запасом живої сили, армія з потужною промисловою базою, яка її підтримує, або армія, яка має доступ до найсучаснішого та найскладнішого обладнання та тактик, а армія, яка може використовувати всі ці три аспекти за підтримки економіки та виробничих потужностей усієї нації."
 CENmil_arms_deals: "Збройові Угоди"
 CENmil_arms_deals_desc: "З нашими обмеженими військово-промисловими потужностями, нам доведеться імпортувати більшу частину нашого обладнання наразі. Домовляючись про хороші угоди та торгуючи з нашими близькими союзниками, наша армія матиме сучасне обладнання за низькою ціною."
 CENmil_saving_our_men: "Порятунок Наших Людей"
 CENmil_saving_our_men_desc: "Коли наші запаси важливих військових матеріалів майже заповнені новітніми моделями, ми використаємо наших небагатьох військових науковців для спроби розробити покращене допоміжне медичне обладнання, щоб допомогти більшій кількості наших людей безпечно повернутися з передової."

## Warfare with Central American Characteristics
 CENmil_army_ca: "Центральноамериканська Доктрина"
 CENmil_army_ca_desc: "На півночі та півдні вороги, з якими ми стикаємося, набагато сильніші за нас. Хоча це важко визнати, Сандіно та його Синдикалістські зрадники, тим не менш, довели, що менша сила може перемогти набагато більшого ворога, використовуючи місцевість та підтримку народу на свою користь."
 CENmil_autonomous_officers: "Автономні Офіцери"
 CENmil_autonomous_officers_desc: "Партизанська війна вимагає швидких реакцій та рішень, прийнятих тими, хто знаходиться у прямому контакті з ворогом, тому нам потрібно буде надати офіцерам на місцях велику автономію для незалежних дій від вищого командування."
 CENmil_adapt_terrain: "Адаптація до Місцевості"
 CENmil_adapt_terrain_desc: "Місцевість Центральної Америки дуже сувора та невблаганна, за винятком тих, хто її добре знає. Під час наступів ворога ми зможемо турбувати та знищувати їх завдяки нашому знанню місцевості."
 CENmil_small_units: "Малі Підрозділи"
 CENmil_small_units_desc: "Ведення війни на такій складній місцевості вимагає великої гнучкості та мобільності, якої не мають більші підрозділи. Загони з кількох людей зможуть перехитрити та перевершити ворога в джунглях та на пагорбах Центральної Америки."
 CENmil_improved_conscrip: "Покращений Призов"
 CENmil_improved_conscrip_desc: "Щоб відбити наших ворогів, нам потрібно значно збільшити розмір та живу силу нашої армії. Нам потрібно підвищити рівень призову, щоб залучити якомога більше чоловіків до збройних сил."
 CENmil_guerrila_tactics: "Партизанська Тактика"
 CENmil_guerrila_tactics_desc: "Щоб бути ефективним партизаном, потрібно знати набагато більше, ніж довкілля. Мистецтво маскування та обману може значно підвищити ефективність наших солдатів, і їм також потрібно знати, коли вступати в бій, а коли ні."
 CENmil_guerilla_spirit: "Партизанський Дух"
 CENmil_guerilla_spirit_desc: "Потрібна залізна воля, щоб успішно воювати як партизан. Багато підрозділів мають вижити у жахливих умовах, переслідувані ворожою авіацією та артилерією."
 CENmil_large_force: "Велика Сила"
 CENmil_large_force_desc: "Щоб конкурувати з силами наших ворогів, нам потрібно далі розширювати розмір нашої армії."

# Finisher of Entire Tree
 CENmil_military_with_a_state: "Військові з Державою"
 CENmil_military_with_a_state_desc: "На військових лежить вся нація. Армія об'єднала Центральну Америку, армія відбила ворогів Центральної Америки, і армія збереже Центральну Америку об'єднаною. Військові не служать державі, а держава служить військовим."

### Air and Naval Tree
## Air Tree
 CENmil_faca: "ВПС ЦАР"
 CENmil_faca_desc: "Сформовані з повітряних сил націй, які тепер є частиною Республіки, Повітряні Сили Республіки Центральна Америка (Fuerza Area Republicana de Centroamérica) потребуватимуть набагато більшого бюджету та живої сили, щоб ефективно виконувати своє завдання із захисту повітряного простору Центральної Америки."
 CENmil_air_lads: "Повітряні Офіцери"
 CENmil_air_lads_desc: "Як і будь-який рід військ, повітряні сили — це не щойно створений підрозділ, а результат злиття повітряних сил складових націй Союзу. Як такий, він не має стандартизованої командної ієрархії чи доктрини та потребує реформ."
 CENmil_aa_positions: "Зенітні Позиції"
 CENmil_aa_positions_desc: "Наші повітряні сили далеко не достатньо великі, щоб гарантувати захист наших промислових та інфраструктурних центрів від ворожих бомбардувальників. Щоб захистити ці життєво важливі центри, нам потрібно більше і кращих зенітних батарей."
 CENmil_airfield_expansion: "Розширення Аеродромів"
 CENmil_airfield_expansion_desc: "Для належного функціонування нашим повітряним силам потрібні нові, модернізовані авіабази."
 CENmil_fighters: "Винищувачі ВПС ЦАР"
 CENmil_fighters_desc: "Наші повітряні сили наразі переважно використовують застарілі біплани. Щоб боротися у майбутніх повітряних битвах, нам потрібно імпортувати нові, сучасні проєкти."
 CENmil_cas: "Літаки Ближньої Авіаційної Підтримки ВПС ЦАР"
 CENmil_cas_desc: "Наші повітряні сили не мають стандартного літака ближньої авіаційної підтримки, а наші найкращі засоби підтримки наземних військ — це переобладнані біплани-винищувачі. Щоб допомогти нашим військам, нам потрібно імпортувати нові, сучасні проєкти."
 CENmil_bombers: "Бомбардувальники ВПС ЦАР"
 CENmil_bombers_desc: "Наші повітряні сили не мають важких літаків, і як такі не можуть виконувати бомбардувальні місії проти ворожих промислових цілей. Нам потрібно імпортувати нові, сучасні проєкти."
 CENmil_protecc_sky: "Захист Неба"
 CENmil_protecc_sky_desc: "Завдяки нашим реформам, наші повітряні сили більше не розглядаються як повітряний фарс, а як справжня бойова сила. З новими, сучасними літаками та кваліфікованими пілотами, вони зможуть захистити прекрасне небо Центральної Америки."

# Shared Air/Navy Tree
 CENmil_naval_air_coord: "Координація військово-морських і повітряних сил"
 CENmil_naval_air_coord_desc: "Оскільки наша країна розташована на дуже вузькому перешийку, будь-який потенційний ворог намагатиметься скористатися перевагами довгих берегових ліній та легких підходів з моря і повітря. Ми повинні першими скористатися цією можливістю та відмовити в ній ворогу."
 CENmil_nav_bombers: "Морські бомбардувальники ВПС ЦАР"
 CENmil_nav_bombers_desc: "Беззаперечний контроль над обома сторонами Панамського каналу можна досягти за допомогою переважаючого флоту, але це вимагає величезних інвестицій, яких ми не можемо собі дозволити. Контроль пересування військово-морських сил з неба є найбільш економічно вигідним рішенням."

## Naval Tree
 CENmil_fnca: "АРЦА"
 CENmil_fnca_desc: "З нашою новоствореною нацією виникають нові потреби. Попередні Центральноамериканські нації не мали потреби у великому флоті і мало робили для досягнення будь-якого військово-морського домінування. З нашим возз'єднанням нам потрібно відновити свої позиції на регіональному рівні, і ми не можемо цього зробити без флоту. Таким чином, ми заснуємо «Військово-Морські Сили Республіки Центральна Америка» (Armada de la Republica de Centroamérica) і почнемо інвестувати в їхній розвиток, щоб проєктувати нашу силу!"
 CENmil_select_main_port: "Вибір Головної Військово-Морської Бази"
 CENmil_select_main_port_desc: "Враховуючи відсутність інтересу в минулому до формування функціональних флотів, усі наші порти були побудовані з огляду на торгівлю і не придатні для розміщення великого надводного флоту. У нашій нації є кілька дуже перспективних портів для інвестування в їхнє покращення, але нам потрібно вибрати, який саме, оскільки ми, очевидно, не маємо засобів для оновлення всіх наших портів."
 CENmil_screens: "Кораблі Прикриття"
 CENmil_screens_desc: "Одним із кроків до створення нового флоту було б створення функціонального флоту ескорту, здатного захищати наші торгові шляхи від підводних човнів-ізгоїв у разі війни. Це також допоможе в майбутньому, коли ми зможемо виставити більші кораблі, оскільки ескортні кораблі є настільки ж життєво важливими для великого надводного флоту, як і сам флагман. Оскільки нам бракує будь-яких верфей у нашій нації, наш найкращий варіант швидко створити флот — це придбати іноземні кораблі прикриття, доки ми не зможемо створити власні верфі."
 CENmil_cruisers: "Крейсери"
 CENmil_cruisers_desc: "Одним із кроків до створення нового флоту було б придбання легкого крейсера, здатного надавати підтримку нашим силам на узбережжі та боротися з ворожими есмінцями в морі. Оскільки нам бракує будь-яких верфей у нашій нації, наш найкращий варіант виставити крейсер — це придбати іноземний крейсер наразі, принаймні доки ми не зможемо створити верфі для підтримки власного флоту."
 CENmil_flagship: "Флагман для Нашого Флоту"
 CENmil_flagship_desc: "З ескортними кораблями та крейсером, готовими до відплиття, нам тепер потрібен флагман для нашого молодого флоту. З флагманом ми нарешті зможемо почати проєктувати нашу військово-морську міць у бік Карибського басейну і, нарешті, мати засоби для протистояння невеликому флоту у відкритому морі. Оскільки нам бракує будь-яких верфей у нашій нації, наш найкращий варіант отримати флагман — це придбати його у іноземної держави, доки ми не зможемо створити верфі для будівництва флагмана самостійно."
 CENmil_naval_lads: "Військово-Морські Офіцери"
 CENmil_naval_lads_desc: "З нашим новим флотом виникає новий попит на офіцерів, щоб вони очолили наші кораблі, та нових адміралів для координації нашого флоту. Хоча деякі нації були у процесі створення військово-морської академії, як-от Сальвадор, наш найкращий вибір — відправити наших офіцерів до іноземних військово-морських академій, щоб ознайомитися з сучасними основами військово-морської війни та маневрування флоту."
 CENmil_merchant_navy: "Центральноамериканський Торговий Флот"
 CENmil_merchant_navy_desc: "Центральній Америці потрібні не лише військові кораблі. Нашій великій нації, на жаль, бракує багатьох ресурсів, яких багато в інших місцях світу, і ми не можемо продовжувати наш розвиток, якщо не матимемо способу доставляти ці ресурси до нас. З огляду на це, ми інвестуємо в торговий флот, який матиме завдання підтримувати Центральноамериканську торгівлю живою та процвітаючою."
 CENmil_dual_sea_protecc: "Доктрина Двох Морів"
 CENmil_dual_sea_protecc_desc: "Наша нація є однією з небагатьох у світі, яка займає вузький перешийок, маючи порти як в Атлантичному, так і в Тихому океані. Однак це благословення є також і прокляттям, оскільки нам доведеться розділити наші зусилля, щоб охопити обидва океани одночасно у разі конфлікту. Враховуючи, що нам бракує кораблів для перемоги у війні на виснаження, захист наших двох берегів має першочергове значення."

