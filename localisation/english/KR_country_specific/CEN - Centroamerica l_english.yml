### Decisions ###
 CENdem_status_of_belize: "Статус Белізу"
 CENdem_status_of_belize_desc: "Гватемальський уряд зміг захопити Беліз під час Британської революції, і з приходом Синдикалістів до влади у Великій Британії шанси Британців повернути такий незначний порт були низькими.\nАле оскільки дехто бажає приєднатися до Антанти, нам потрібно врегулювати цю територіальну суперечку, перш ніж просити приєднатися до їхньої фракції або взяти на себе повну інтеграцію регіону."
 CENdem_joining_the_Entente: "$CENmil_join_faction_ENT$ (Приєднатися до Антанти)"
 CENdem_expansionism: "Опортуністична експансія"
 CENdem_core_british_honduras: "Розпочати інтеграцію Белізу"
 CENdem_marlib_core_british_honduras_desc: "Оскільки Канадці надали нам гарантію, схоже, вони відмовилися від своїх бажань щодо Белізу, тому ми розпочнемо його інтеграцію."
 CENdem_status_british_honduras: "Переговори з Вест-Індією"
 CENdem_status_british_honduras_desc: "Як уряд, відповідальний за всі колишні Британські справи в Карибському басейні, ми заплануємо візит до Вест-Індії, щоб обговорити з ними ситуацію з Белізом."
 CENdem_continue_integration_of_COS: "Продовжити інтеграцію Коста-Ріки"
 CENdem_continue_integration_of_PAN: "Продовжити інтеграцію Панами"

 CENdem_Democratic_Alliance_of_the_Caribbean_decisions: "Демократичний альянс Карибського басейну"
 CENdem_form_faction: "Сформувати $democratic_alliance_of_the_caribbean$"

#Decision only avaliable to CEN, better fit for this file
 CENdem_integrate_COS: "Встановити тісніші зв'язки з Коста-Рікою"
 CENdem_integrate_COS_desc: "Однією з наших цілей при створенні Альянсу було відновлення Федерації в її повному обсязі. Оскільки чотири з оригінальних республік вже є частиною Союзу, республіка, що залишилася, на щастя, приєдналася до нашого альянсу, і, хоча вона не є найбільш населеною чи розвиненою, вона все одно забезпечить гарний поштовх нашій армії та економіці.\nНам доведеться повільно інтегрувати їхню систему, оскільки вони, здається, не виявляють тієї ж готовності, яку інші демократичні республіки демонстрували до ідеї об'єднання."
 CENdem_car_core_british_honduras: "Інтегрувати Беліз"
 CENdem_car_core_british_honduras_desc: "Перш ніж повністю інтегрувати Беліз у нашу націю, давайте попросимо Вест-Індію відмовитися від своїх претензій."

