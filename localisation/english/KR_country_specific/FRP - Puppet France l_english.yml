### Ideas ###

 FRP_ashes_of_syndicalism: "Попіл синдикалізму"
 FRP_ashes_of_syndicalism_desc: "Для сьогоднішньої Франції капіталізм — це не лише нова економічна модель, а й новий спосіб життя. Анулювання всіх важливих інституцій Комуни спричиняє хвилі економічного шоку по всій країні. Реорганізація вимагатиме часу."
 FRP_bloc_of_rights: "Блок правих"
 FRP_bloc_of_rights_desc: "Уряд складається з §mПартії республіканського центру§!, §cНародного республіканського руху§! та §gФранцузької селянської та аграрної партії§!, об'єднаних бажанням захистити нову Францію від інсурекційних елементів, поважаючи водночас демократичний процес."
 FRP_bloc_of_rights_authdem: "Блок правих"
 FRP_bloc_of_rights_authdem_desc: "Уряд складається з §cНародного республіканського руху§! та §gФранцузької селянської та аграрної партії§!, об'єднаних бажанням захистити нову Францію від інсурекційних елементів, поважаючи водночас демократичний процес."
 FRP_republican_front: "Республіканський фронт"
 FRP_republican_front_desc: "Уряд складається з §SРеспубліканської робітничої партії§!, §lРадикальної, республіканської та соціал-демократичної партії§! та §cНародного республіканського руху§!, об'єднаних бажанням завершити парламентаризацію нової Франції та створити справедливу нову модель для економіки."
 FRP_new_national_bloc: "Новий національний блок"
 FRP_new_national_bloc_desc: "Уряд складається з §lрадикальної, республіканської та соціал-демократичної партії§!, §mПартії республіканського центру§! та §cНародного республіканського руху§!, об'єднаних бажанням завершити парламентаризацію нової Франції та забезпечити плавний перехід до лібералізованої економіки."
 FRP_coalition_of_expertise: "Коаліція експертів"
 FRP_coalition_of_expertise_desc: "Уряд складається з §gСелянського фронту§! та §Pгрупи X-Crise§!, які мають намір усунути надмірності бюрократичної демократії на користь потужної виконавчої влади, яка може підтримувати домінування французького націоналізму."
