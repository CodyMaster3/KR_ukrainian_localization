### Renaming Events ###

 germany_puppet_events.1.t: "Демократизація нашої адміністрації"
 germany_puppet_events.1.d: "Щоб порвати зі старим реакційним режимом, ми повинні позбутися його впливу в кожному куточку нашої нової нації. Адміністрацію потрібно демократизувати, викладачів перекваліфікувати, а армію реструктуризувати. Частиною цього процесу є усунення почестей, якими вони нагороджували шовіністичних живодерів, таких як Отто фон Бісмарк та Пауль фон Гінденбурґ. Найбільшими прикладами є незліченні меморіальні вежі Бісмарка по всій нашій нації, а також місто Гінденбурґ. Наш президент виступив із пропозицією назвати його на честь Карла Маркса, тоді як місцеві жителі воліли залишити безглузду назву."
 germany_puppet_events.1.a: "Перейменувати на честь Карла Маркса."
 germany_puppet_events.1.b: "Назва, що відображає його промислове походження."

 germany_puppet_events.2.t: "Відновлення старого порядку"
 germany_puppet_events.2.d: "Після перемоги над нашими соціалістичними ворогами настав час відновити порядок і на місцевому рівні. Їхній режим змінив назви місць, вулиць та бульварів, названих на честь героїв нашої нації, бо їх вважали нерепрезентативними чи контрреволюційними. Їхні початкові назви мають бути відновлені."
 germany_puppet_events.2.a: "Це буде Гінденбурґом назавжди."

 germany_puppet_events.3.t: "Німецькі наміри до незалежності"
 germany_puppet_events.3.d: "Німецький уряд витратив значний час на своє становлення. Вперше здається, що його більше не вважають нашим клієнтським станом. Можливо, нарешті настав час повністю надати їм незалежність, вільну від нашого нагляду."
 germany_puppet_events.3.a: "Вони це заслужили."
 germany_puppet_events.3.b: "Німцям не можна довіряти."

 germany_puppet_events.4.t: "Операція «Брат»"
 germany_puppet_events.4.d: "Наш клієнтський стан у Німеччині останнім часом намагався розпалити революцію в Австрії. Їхні дії, безсумнівно, призведуть до війни між ними та австрійцями. Ми повинні подумати, чи готові ми до такої війни."
 germany_puppet_events.4.a: "Схвалити операцію."
 germany_puppet_events.4.b: "Наказати їм відступити."

 germany_puppet_events.5.t: "Операція «Кузен»"
 germany_puppet_events.5.d: "Наш клієнтський стан у Німеччині останнім часом намагався розпалити революцію в Польщі. Їхні дії, безсумнівно, призведуть до війни між ними та поляками. Ми повинні подумати, чи готові ми до такої війни."
 germany_puppet_events.5.a: "Схвалити операцію."
 germany_puppet_events.5.b: "Наказати їм відступити."

 germany_puppet_events.6.t: "Операція «Сестра»"
 germany_puppet_events.6.d: "Наш клієнтський стан у Німеччині останнім часом намагався розпалити революцію в Пруссії, намагаючись роздмухати полум'я німецького об'єднання. Їхні дії, безсумнівно, призведуть до війни між ними та прусським урядом. Ми повинні подумати, чи готові ми до такої війни."
 germany_puppet_events.6.a: "Схвалити операцію."
 germany_puppet_events.6.b: "Наказати їм відступити."

