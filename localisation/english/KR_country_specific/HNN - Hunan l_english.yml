 HNN_tan_daoyuan: "Тань Даоюань"
 HNN_tan_daoyuan_advisor_desc: "§YНародився:§! §L1887 рік, повіт Сянсян, провінція Хунань, Велика Цін§!\n§YПолітична орієнтація:§! §lреспубліканці§!\n§YПоходження:§! §LТань Даоюань був одним із перших членів Тунменхою. Пізніше він служив під началом Цай Е та брав участь у вторгненні в Сичуань під час війни на захист республіки. У 1923 році за дорученням Сунь Ятсена він приєднався до Тань Янькая для спроби відбити Хунань у Чжао Хенці, яка закінчилася невдачею. Тань також допомагав Гоміньдану розгромити Чень Цзюнміна в Ґуандуні.\n\nВін служив у 2-й армії Тань Янькая і допомагав захоплювати Цзянсі. Проте успіх Гоміньдану був перекреслений німецьким втручанням на боці У Пейфу, через що 2-га армія опинилася в оточенні. Тань Даоюань прийняв амністію від Чжао Хенці і відтоді перебуває у відставці. Його поважають за хоробрість, і Тань Янькай неодмінно звернеться до нього по допомогу, якщо вирішить повернутися у політику.§!"

 HNN_lu_diping: "Лу Діпін"
 HNN_lu_diping_advisor_desc: "§YНародився:§! §L1887 рік, повіт Нінсян, провінція Хунань, Велика Цін§!\n§YПолітична орієнтація:§! §lреспубліканці§!\n§YПоходження:§! §LЛу Діпін долучився до революційної політики в останні роки імперії Цін. У 1915 році він приєднався до табору Сунь Ятсена. Протягом наступних років Лу став впливовим мілітаристом у Хунані, балансуючи між Чжао Хенці та Тань Янькаєм. Зрештою він обрав бік Таня і пішов за ним у вигнання після Пінцзянського заколоту.\n\nУ 1925 році він став заступником командувача 2-ї армії НРА. Під час Північного походу Лу брав участь у наступі на Хунань, але втручання німців призвело до розгрому Гоміньдану. Лу та Тань покинули Ґуйчжоуську хунту, аби не підпорядковуватися Чен Цяню, і прийняли амністію від Чжао Хенці. Відтоді Лу веде мирне життя в Хунані, але готовий знову служити Тань Янькаю, якщо той повернеться до влади.§!"

 HNN_lu_dangping: "Лу Данпін"
 HNN_lu_dangping_advisor_desc: "§YНародився:§! §L1895 рік, повіт Нінсян, провінція Хунань, Велика Цін§!\n§YПолітична орієнтація:§! §lреспубліканці§!\n§YПоходження:§! §LМолодший брат Лу Діпіна, він став урядовцем у 1915 році і послідував за братом та Тань Янькаєм у вигнання. Лу Данпін був здібним офіцером 2-ї армії під час Північного походу. Після повернення до Хунані він був помилуваний Чжао Хенці. Відтоді Лу став журналістом і часто обговорює політику з Тань Янькаєм. Тань високо цінує інтелект Лу і розраховує на його підтримку у майбутньому.§!"

 HNN_zhang_huizan: "Чжан Хуйцзань"
 HNN_zhang_huizan_advisor_desc: "§YНародився:§! §L1884 рік, Чанша, провінція Хунань, Велика Цін§!\n§YПолітична орієнтація:§! §lреспубліканці§!\n§YПоходження:§! §LЧжан Хуйцзань навчався у військовій академії Хунані та вивчав піхотну справу в Японії. Через незгоду з імперськими амбіціями Юань Шикая він повернувся до Хунані та організував опір диктатору. Чжан незмінно служив Тань Янькаю, зокрема у боротьбі проти Чжан Цзін'яо.\n\nВін супроводжував Таня до Ґуанчжоу і брав участь у Північному поході у складі 2-ї армії. Після краху фронту перебуває у напіввідставці, проте готовий піти за Тань Янькаєм, якщо той знову вийде на політичну арену.§!"

 HNN_wang_zhi: "Ванг Чжи"
 HNN_wang_zhi_advisor_desc: "§YНародився:§! §L1907 рік, Чанша, провінція Хунань, Велика Цін§!\n§YПолітична орієнтація:§! §lаполітичний§!\n§YПоходження:§! §LВанг Чжи є представником нового покоління освічених офіцерів хунанської армії. Він навчався в США, зокрема у Вест-Пойнті у 1928 році. Після повернення до Китаю він обіймав посади від командира взводу до полковника податкової поліції та провінційної армії. Завдяки службі в поліції Ванг навчився майстерно виявляти ворожих агентів та інфільтраторів, тому був обраний як нове обличчя для розвитку розвідувального сектору Хунані.§!"

 HNN_liu_zhesheng: "Лю Чжешен"
 HNN_liu_zhesheng_air_chief_desc: "§YНародився:§! §L22 лютого 1914 року, повіт Баодін, провінція Чжилі, Китайська Республіка§!\n§YПолітична орієнтація:§! §lаполітичний§!\n§YПоходження:§! §LЛю Чжешен народився у Баодіні у відомій родині вихідців із Хунані. Його батько порушив сімейну традицію займатися бізнесом і вступив до військового училища. Лю пішов стопами батька, вступивши до Баодінської академії у 1933 році. Під час навчання він захопився польотами і склав іспити на пілота. Після випуску уряд Хунані запросив його для навчання кадетів авіації на його історичній батьківщині.§!"

