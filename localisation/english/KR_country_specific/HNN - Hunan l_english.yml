 HNN_totalist_party: "КСП — радикали"
 HNN_totalist_party_long: "Китайська синдикалістська партія — радикальна фракція (Zhongguo Gongtuandang-jijon Pai)\n§LПодібно до своїх колег в основній течії, хунанське відділення Китайської синдикалістської партії має у своєму складі молодий, енергійний і, що найважливіше, політично радикальний підрозділ. Номінально згуртувавшись навколо невпинного Жень Біші, який постійно курсує між Хунанню та Шанхаєм, радикальна фракція виступає за більш активний і безкомпромісний підхід до ролі КСП у китайській політиці.\n\nЗавдяки впливу Жень Біші особлива увага приділяється молодіжному руху. Їхній матеріалістичний соціалістичний радикалізм покликаний принести Китаю світле майбутнє, вільне від тиранічної хватки капіталізму. Завзяті за своєю природою, вони чинять збройний опір як Чжао, так і чжилійцям, іноді вступаючи у сутички навіть з правовірною фракцією Цай Хесеня.§!\n"

 HNN_syndicalist_party: "КСП — правовірні"
 HNN_syndicalist_party_long: "Китайська синдикалістська партія — правовірна фракція (Zhongguo Gongtuandang-zhengtong Pai)\n§LДомінуюча сила у підпільному робітничому русі Хунані, правовірна фракція Китайської синдикалістської партії має значну вагу в Чанші та Чанде. Своє коріння вона веде від перших лідерів КСП із Ліги китайських синдикалістів. Хунанське відділення діє переважно під керівництвом Цай Хесеня. Підтримуючи підпільні контакти з головним офісом партії та робітничими рухами по всьому Китаю, вони вважають себе останнім бастіоном для робітників Хунані.\n\nАктивна діяльність фракції розпочалася після повернення Цай Хесеня в країну у 1932 році. КСП виступає головною перешкодою для антипрофспілкової політики Чжао Хенці. У внутрішній боротьбі між Лі Лісанем та Цай Хесенем, а також у питаннях єдиного фронту Гоміньдану та КСП, хунанське відділення тримається осторонь, зосереджуючись виключно на справах провінції.§!\n"

 HNN_radical_socialist_party: "ГМД — 8-ма армія (радикали)"
 HNN_radical_socialist_party_long: "Гоміньдан — 8-ма армія (радикали) (Guomin Geming Jun Di Ba Jun (Jijin Pai))\n§LСимволом усіх радикалів у складі 8-ї армії є її командувач і неофіційний лідер Хе Лун. Більшість ветеранів підрозділу належали до оригінальних дивізій Хе в арміях Хунані та Сичуані, слідуючи за своїм командиром із непохитною відданістю. Він привів свої війська до лав Національно-революційної армії в липні 1926 року.\n\nДивізія Хе відзначилася як першокласна бойова сила під час Північного походу, зокрема при взятті Ханьяна. Проте похід захлинувся під німецьким чоботом, і Хе разом зі своїм керівником Тан Шенчжі опинився в зоні повстання МіньҐань. Там він познайомився з Пен Дехуаєм. Ці двоє чоловіків зі схожим походженням і сильними соціалістичними поглядами сформували власну групу впливу — «радикалів».\n\nБудучи членами Тимчасового комітету дії, Хе та Пен послідовно просувають ідеї аграрного соціалізму, сподіваючись навернути Тан Шенчжі до своїх ідеалів.§!\n"

 HNN_social_democrat_party: "ГМД — 8-ма армія"
 HNN_social_democrat_party_long: "Гоміньдан — 8-ма армія (Guomin Geming Jun Di Ba Jun)\n§LБеручи свій початок від четвертої дивізії хунанської армії під командуванням Тан Шенчжі та бригади Є Ці нової кліки Ґуансі, 8-ма армія Національно-революційної армії є вельми специфічною гібридною силою. У липні 1926 року вона з великим успіхом розпочала Північний похід, здобувши перемогу під Ханьяном.\n\nОднак зусилля були марними: чжилійська кліка закликала на допомогу своїх німецьких благодійників, які розчавили сили захисників Ґуандуна. 8-ма армія відважно билася в битві при Цзіньхуа, але зазнала нищівної поразки. Відступаючи до Східної Хунані, Тан Шенчжі знову зіткнувся з військами Є Кайсіня, втратив значну частину армії та відійшов до МіньҐаня.\n\nВ умовах відсутності центрального контролю 8-ма армія радикалізувалася, розколовшись на фракції. Ядро лоялістів Тан Шенчжі підтримує його еклектичний аграрний соціалізм, тоді як радикали під проводом Хе Луна та Пен Дехуая тяжіють до більш жорсткої лінії Тимчасового комітету дії.§!\n"

 HNN_social_liberal_party: "ФКДП"
 HNN_social_liberal_party_long: "Федерація китайських демократичних партій (Zhongguo Minzhu Zhengtuan Tongmeng)\n§LЗгуртувавшись навколо місцевого інтелектуала Чжоу Шічжао, ця широка група дрібних партій та незалежних діячів не приєдналася ні до товариства Чжао, ні до партії «Молодий Китай». Схожі на однойменні групи в пекінській легіслатурі, ці політики формують власний блок у Хунані, користуючись підтримкою Товариства народного оновлення та будучи союзниками Хуан Яньпея.\n\nНа відміну від Пекіна, ФКДП у Хунані має реальну владу через місцеву асамблею — справжню зірку китайської демократії. Поки що вони не можуть перемогти партію Чжао Хенці за кількістю голосів, але хунанська демократія дає їм надію на майбутнє. Наразі вони залишаються широкою політичною фракцією, обмеженою власними незалежними кампаніями.§!\n"

 HNN_market_liberal_party: "ФКДП — КНДА"
 HNN_market_liberal_party_long: "Федерація китайських демократичних партій — Китайська національна демократична асоціація (Zhongguo Minzhu Zhengtuan Tongmeng-Zhongguo Minzhu Jianguo Hui)\n§LУнікальний випадок для Хунані: КНДА під керівництвом Хуан Яньпея походить не звідси, а з Цзянсу. Спочатку Хуан заснував у Шанхаї «Товариство професійної освіти Китаю», зосереджуючись на навчанні практичним навичкам. У 1925 році вони були значною демократичною силою під час Руху 30 травня.\n\nПісля придушення Шанхайського повстання 1932 року маршал Сунь розпочав репресії проти інтелектуалів. Хуан та його товариство втекли до Хунані, де Чжао Хенці прийняв їх із розпростертими обіймами. Вони реформувалися у Китайську національну демократичну асоціацію, ставши повноцінною партією. Хоча вони поділяють демократичні цілі Чжао, КНДА виступає як ліберальна опозиція, більш орієнтована на захист прав робітників та профспілок. У разі загрози вони готові співпрацювати з владою задля захисту хунанської демократії.§!\n"

 HNN_social_conservative_party: "Товариство народного оновлення"
 HNN_social_conservative_party_long: "Товариство народного оновлення (Міньсіньше)\n§LНайбільший політичний блок у Хунані, Товариство народного оновлення (ТНО), веде свою історію з 1922 року. Сформоване навколо Чжао Хенці, ТНО підтримувало його під час першого терміну, заколоту Тан Шенчжі та відновлення при владі маршалом У Пейфу. Протягом «десятиліття чжилійців» партія була опорою губернатора, підтримуючи реформи в освіті та розвиток громадських робіт за рахунок скорочення військових витрат.\n\nПраве крило партії підтримується хунанськими поміщиками-ґентрі та елітами, що надає йому консервативного характеру. Це створює напруженість у відносинах із робітничими активістами. Інша опора партії — інтелігенція, яка цінує зусилля Чжао зі створення демократичної системи і формує ліве крило ТНО. Товариство залишається відданим Чжао Хенці, який вміло балансує між обома крилами партії.§!\n"

 HNN_authoritarian_democrat_party: "ГМД — 6-та армія"
 HNN_authoritarian_democrat_party_long: "Гоміньдан — 6-та армія (Guomin Geming Jun Di Liu Jun)\n§LСформована у січні 1926 року на базі хунанської армії, 6-та армія Національно-революційної армії незмінно підпорядковується Чен Цяню. Під час Північного походу вона зазвичай діяла у другому ешелоні, закріплюючи успіхи 4-ї, 7-ї та 8-ї армій. Коли фронт упав, 6-та армія опинилася затиснутою у західній частині Хунані. Майже не ушкоджена, вона разом із залишками інших підрозділів відступила у вигнання до Ґуйчжоу.\n\nПеребуваючи в Ґуйчжоу, 6-та армія позиціонує себе як «аполітичну» силу серед вигнанців Гоміньдану. Підтримуючи зв'язки як із лівим Центральним комітетом, так і з правими фракціями на кшталт Хе Їнціня, вона слугує сполучною ланкою між ними. Насправді ж армія є прихистком для старих революціонерів часів Тунменхою, які потай опиралися реорганізації партії. Вони бажають швидкого встановлення періоду опіки і готові битися за свої переконання.§!\n"

 HNN_paternal_autocrat_party: "Юеянський гарнізон"
 HNN_paternal_autocrat_party_long: "Юеянський гарнізон (Yueyang Zhujun)\n§LЮеянський гарнізон з'явився майже одночасно з призначенням Чжао Хенці губернатором, ставши результатом домовленостей між ним та У Пейфу. Розташований у важливому прикордонному місті між Хунанню та Хубеєм, гарнізон є прямим інструментом впливу чжилійської кліки. Після повстання Тан Шенчжі маршал У вирішив посилити цей пост і у 1927 році призначив командувачем адмірала Тана Сянміна. За останнє десятиліття Тан перетворив свій підрозділ на зразок суворої дисципліни. Він може розраховувати на абсолютну відданість своїх солдатів у будь-якій ситуації.§!\n"

 HNN_national_populist_party: "Стара ґуйчжоуська кліка"
 HNN_national_populist_party_long: "Стара ґуйчжоуська кліка (Jiu Qian Xi)\n§LКоріння кліки сягає Тан Цзіяо, який захопив владу в Ґуйчжоу у 1912 році. Пізніше він повернувся до Юньнані, залишивши намісником Лю Сяньші. У 1920 році небіж Тана, Ван Веньхуа, влаштував переворот, відомий як інцидент Міньцзю, але через свою жорстокість так і не зміг закріпитися і був убитий Юань Цзуміном у 1921-му.\n\nЦе зробило Юаня лідером старої ґуйчжоуської кліки. Попри те, що його двічі вибивали з влади, Юань залишався на чолі свого угруповання. Зрадивши Гоміньдан наприкінці Північного походу за порадою Чжао Юйсуна, Юань отримав від Пекіна посаду губернатора, але контролює лише клаптик Ґуйчжоу. З 1927 року кліка радикалізувалася на ґрунті антикомунізму. Чжао Юйсун очолив осередок партії «Молодий Китай» у провінції, яка фактично стала цивільним крилом кліки, підтримуючи Юаня як «аполітичного сильного лідера».§!\n"

