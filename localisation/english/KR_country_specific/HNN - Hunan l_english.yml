 HNN_KR_gathering_storm_desc: "Оточений мілітаристами з усіх боків, Чжао Хенті мусить діяти вкрай обережно, якщо він хоче зберегти важко здобутий мир у Хунані. Будучи оплотом федералізму, Чжао мріє про вільний Китай, заснований на принципах провінційної автономії та демократії. Проте як внутрішні, так і зовнішні загрози кидають виклик його федералістському порядку денному.\n\nНаціоналістичні сили під керівництвом Чен Цяня та Тан Шенчжи причаїлися просто за кордонами Хунані, готові до нападу, а адмірал Тан Сянмін пильнуватиме, щоб вплив Чжилі в провінції залишався незмінним. Чи зможе Чжао захистити демократію Хунані, чи провінція впаде під натиском партійної держави та мілітаристських сил?"

### Intro Screen ###
 HNN_country_intro_background: "GFX_HNN_intro"
 HNN_country_intro_header: "Хунань та Сіньхай"
 HNN_country_intro_content: "Хунань, одна з перших провінцій, що приєдналася до §lСіньхайської революції§! під проводом губернатора §RЦзяо Дафена§!, має бурхливу історію. Після загибелі §RЦзяо§! у бою в 1911 році його наступником став §cТань Янькай§!. Проте термін §cТаня§! тривав лише два роки: через його нейтралітет у конфлікті між §PЮань Шикаєм§! та §aСунь Ятсеном§! §PЮань усунув§! §cТаня§! з посади, замінивши його на §PTан Сянміна§!.\n\nГубернаторство §PTан Сянміна§! тривало з 1913 по 1916 рік, доки губернатор Юньнані §aТан Цзіяо§! не проголосив незалежність у відповідь на сходження §PЮаня§! на імператорський престол під іменем §cімператора Хунсяня§!. Наче падіння доміно, провінція за провінцією почали наслідувати цей приклад, об'єднуючись із Юньнанню та проголошуючи незалежність, і невдовзі..."

 HNN_country_intro_header_1: "Буремні часи"
 HNN_country_intro_content_1: "...Хунань опинилася в облозі. Коли місцевий мілітарист §PТянь Інчжао§! підтримав Армію національного захисту, це стало останньою краплею. Адмірал §PTан Сянмін§! у хаосі втік із Хунані на човні, прямуючи вгору по Янцзи. У серпні прем'єр-міністр центрального уряду §PДуань Ціжуй§! знову призначив §cТань Янькая§! губернатором провінції. Це правління також було недовгим, і після коротких термінів §aЧен Цяня§!, §PФу Лянцзо§! та §aЧжоу Чжаосяна§! §PДуань Ціжуй§! призначив губернатором §nЧжан Цзіяо§!.\n\nРежим сумнозвісного «м'ясника Хунані» був просякнутий кров'ю. Бандитизм і мародерство стали фактично офіційною державною політикою, а по всій провінції вирували масові заворушення. Це безумство призвело до вигнання §nЧжана§! лише два роки по тому, коли §cТань Янькай§! та його підлеглий §cЧжао Хенті§! об'єднали сили та виставили «м'ясника» з провінції. На жаль для §cТаня§!, як і в попередні рази, він не затримався на посаді довго.\n\nЧерез тиск інтелектуалів-федералістів §cТань§! вагався зі створенням офіційної конституції. Все завершилося заколотом командира гарнізону Пінцзяна §aЮй Інсяна§!, лояльного до §aЧен Цяня§!. Оскільки командувач армії §cЧжао Хенті§! відмовився допомагати губернатору, §cТань Янькай§! пішов у відставку та передав повноваження самому §cЧжао§!."

 HNN_country_intro_header_2: "Десятиліття під владою §cЧжао§!"
 HNN_country_intro_content_2: "Ставши новим губернатором, §cЧжао Хенті§! негайно запросив найкращі уми Китаю для розробки конституції, гідної Хунані та його федералістських ідеалів. 1 січня 1922 року §cЧжао Хенті§! офіційно оприлюднив «Конституцію провінції Хунань» і у вересні того ж року став першим демократично обраним губернатором.\n\nПроводячи цивільні реформи, §cЧжао Хенті§! у 1925 році захистив «нефритового маршала» §PУ Пейфу§! після зради §aФен Юйсяна§!, і §PУ§! невдовзі віддячив за цю послугу. У середині 1926 року між його підлеглими, §STан Шенчжи§! та §cЄ Кайсінем§!, виникла суперечка, яку §cЧжао§! вирішив на користь §cЄ§!. Вважаючи, що губернатор виявляє фаворитизм, §STан Шенчжи§! підняв заколот і приєднався до §RГоміньдану§! у Гуанчжоу, поклавши початок Північному походу.\n\nЦе призвело до повної поразки сил §cЧжао§! та їх витіснення з Хунані. Однак за допомогою §cЄ Кайсіня§! федералісти попросили §PУ Пейфу§! допомогти відбити провінцію. Після перемоги над Гоміньданом §PУ Пейфу§! знову призначив §cЧжао§! губернатором. Проте §PУ§! висунув вимогу скасувати конституцію провінції. Опинившись під загрозою з боку залишків §RГоміньдану§! в Гуйчжоу, Чжао потрапив у скрутне становище.\n\nЧжао звернувся до «усміхненого тигра» §PСунь Чуаньфана§! з проханням захистити автономію Хунані. Той погодився і дозволив Хунані приєднатися до своєї Ліги восьми провінцій. Однак, сумніваючись у лояльності §cЧжао§!, У Пейфу «призначив» до уряду Хунані прямого аташе кліки Чжилі — командира гарнізону Юеяна §PTан Сянміна§!, який повернувся до провінції через десять років.\n\nХоча правління Чжао було переважно мирним, повстання в Шанхаї 1932 року змусило Є Кайсіня рушити на схід для придушення повстанців. Водночас заворушення робітників у Чанші переросли в насильство. Вибори 1932 року стали референдумом щодо здатності Чжао вести провінцію крізь кризу. Чжао виграв, але лише завдяки допомозі §Pдіархії§!, їхньої §aАсоціації автономії Сянсі§! та §nМолодої китайської партії§!.\n\nВідтоді Хунань залишалася стабільною під керівництвом §cЧжао§!, але з наближенням року Щура часи обіцяють бути важкими: гільйотина Чжилі готова впасти, а присутність §Pдіархії§! та §nстарої кліки Гуйчжоу§! лише додає напруги..."

 HNN_guide: "§MУсе під владою губернатора§! ($paternal_autocrat_coloured$)\n£white_dot Оберіть §aЧен Цяня§! або §STан Шенчжи§! на §Yпровінційних виборах у Хунані§!.\n£white_dot Коли §PTан Сянмін§! вирушить із Юеяна, зробіть так, щоб його сили успішно скинули чинного губернатора.\n£white_dot Крім того, §PTан§! може захопити владу, якщо §cЧжао Хенті§! не зможе придушити §Yантидемократичну опозицію§!.\n\n§MДемократичний мандат§! ($social_conservative_coloured$)\n£white_dot На §Yпровінційних виборах§! переконайтеся, що популярність §cЧжао Хенті§! вища за популярність §RЄдиного фронту Гоміньдану§! або рівна їй.\n£white_dot Щоб утримати §cЧжао§! при владі та запобігти перевороту §PTан Сянміна§!, ви мусите перемогти §Yантидемократичну опозицію§!.\n\n§MХунань під владою Гоміньдану§! ($authoritarian_democrat_coloured$ / $social_democrat_coloured$)\n£white_dot На §Yвиборах§! переконайтеся, що популярність §RЄдиного фронту Гоміньдану§! вища за популярність §cЧжао§!.\n£white_dot На початку виборів ви отримаєте івент для вибору лідера §RЄдиного фронту Гоміньдану§!.\n£white_dot Щоб піти шляхом §a«Авангарду революції»§!, оберіть лідером §aЧена§!.\n£white_dot Щоб піти шляхом §S«Революційної темної конячки»§!, оберіть лідером §STана§!.\n£white_dot Коли §PTан Сянмін§! вирушить із Юеяна, зробіть так, щоб спроба перевороту провалилася.\n"

