### Tang Xiangming

 HNN_all_under_the_governor:0 "Усе під владою губернатора"
 HNN_all_under_the_governor_desc:0 "Генерал Тан захопив Чаншу, і ті, хто виступав проти колишнього губернатора, швидко згуртувалися під його знаменами. Настав час для рішучих дій: ми використаємо всі необхідні засоби, щоб забезпечити абсолютну лояльність Хунані до кліки Чжилі."

 HNN_strongarm_the_assembly:0 "Тиск на Асамблею"
 HNN_strongarm_the_assembly_desc:0 "Коли Хунань під нашим контролем, нам потрібна сильна рука для підтримки стабільності проти Гоміньдану. З цією метою Тан Сянмін змусив Асамблею офіційно призначити його губернатором Хунані, а свого брата Тан Хуалуна, мера Юеяна — спікером Асамблеї."

 HNN_declare_martial_law:0 "Оголосити воєнний стан"
 HNN_declare_martial_law_desc:0 "У сільській місцевості та поблизу наших провінційних кордонів повстанці Гоміньдану, що вижили, чинять зухвалий хаос. Вони атакують гарнізони Бейяна, а потім змішуються з населенням. Цьому треба покласти край будь-якою ціною. Ми оголошуємо воєнний стан, щоб належним чином розправитися з інсургентами."

 HNN_establish_the_defence_commission:0 "Створити Комісію оборони"
 HNN_establish_the_defence_commission_desc:0 "Навколо провінції та в усій кліці Чжилі затаїлися зрадники, чекаючи на шанс для нападу. Вони невпинно гострять ножі, шукаючи будь-яку слабкість. Оскільки повноваження губернатора наразі обмежені, буде створена надсудова «Комісія оборони» для гарантування безпеки кордонів Хунані."

 HNN_speak_with_the_diarchy:0 "Переговори з діархією"
 HNN_speak_with_the_diarchy_desc:0 "Нещодавнє оголошення воєнного стану цілком зрозуміло занепокоїло лідерів діархії — Чень Цюйчженя та Тянь Інчжао. Ми повинні зустрітися з ними, надати необхідні запевнення та офіційно закріпити наш союз."

 HNN_crush_the_kmt:0 "Розгромити повстанців Гоміньдану"
 HNN_crush_the_kmt_desc:0 "Мерзенні зрадники з Гоміньдану мали свій шанс і очікувано схилилися перед могутністю Чжилі. Тепер, коли революціонери знищені, залишається лише піддати такій самій долі їхні пропагандистські органи. Газети, сільські базіки та їм подібні вже замовкли. Однак, якщо ми не знищимо корінь, з’являться нові підбурювачі. Тому губернатор повинен контролювати кожну сферу врядування."

 HNN_march_to_the_sea:0 "Марш до моря"
 HNN_march_to_the_sea_desc:0 "Друга війна між Гуандуном і Гуансі завершилася, і губернатор Двох Гуанів навряд чи є нашим другом. Губернатор Тан має план наступу на південь, щоб захопити портове місто Гуанчжоу для кліки Чжилі та для самого себе. Це ризикований крок, але він може принести величезні дивіденди."

 HNN_expand_governor_powers:0 "Розширити повноваження губернатора"
 HNN_expand_governor_powers_desc:0 "Попри всі зусилля нашої адміністрації, загрози Хунані лише зростають. Цей факт вимагає посилення повноважень Комісії оборони та людини, що стоїть на її чолі — губернатора Тан Сянміна."

 HNN_cooperation_with_guizhou:0 "Співпраця з Гуйчжоу"
 HNN_cooperation_with_guizhou_desc:0 "На захід від нас лежить провінція Гуйчжоу, офіційно підконтрольна нашому другу, губернатору Юань Цзуміну. Проте більша частина провінції незаконно окупована Юньнаньською клікою, що змусило Юаня покладатися на допомогу Чжао. Ми успадкували цю ситуацію, і оскільки Юань допомагав нам відбивати Гоміньдан, ми повинні запропонувати йому руку дружби."

 HNN_ensure_rural_loyalty:0 "Забезпечити лояльність селян"
 HNN_ensure_rural_loyalty_desc:0 "Навіть після розгрому повстанців Гоміньдану заворушення серед селянства залишаються значними. Губернатор, хоч і не є другом селян, прислухався до свого брата Тан Хуалуна і вирішив прийняти кілька формальних реформ на їхню користь, не порушуючи при цьому влади шляхти, щоб гарантувати їхню відданість режиму."

 HNN_appease_workers_concerns:0 "Заспокоїти робітників"
 HNN_appease_workers_concerns_desc:0 "Робітники Чанші та Чанде вагаються щодо прийняття нового режиму. На щастя для нас, реформи Тан Хуалуна на посаді мера задовольнили робітників Юеяна. Нам слід поширити ці реформи на решту Хунані, щоб вгамувати занепокоєння робітничого класу."

 HNN_southern_heir_to_beiyang:0 "Південний спадкоємець Бейяна"
 HNN_southern_heir_to_beiyang_desc:0 "Ми встановили стабільність у Хунані та зміцнили наші позиції. Тепер ми виступаємо як справжній південний бастіон бейянських традицій та порядку кліки Чжилі."

 HNN_expel_zhili_enemies:0 "Вигнати ворогів Чжилі"
 HNN_expel_zhili_enemies_desc:0 "Попри заяви про лояльність до Чжилі, Чжао Хенті переховував багатьох противників нашої кліки. Ми зобов'язані вигнати цих нелояльних діячів з Хунані: ми не потерпимо прихованих зрадників серед нас."

 HNN_bolster_loyal_intellectuals:0 "Підтримати лояльну інтелігенцію"
 HNN_bolster_loyal_intellectuals_desc:0 "Поки попередній губернатор дбав про те, щоб утікачі від репресій центрального уряду знаходили притулок у містах Хунані, це принесло більше шкоди, ніж користі. Навіть зараз слабка інтелігенція виступає проти новопризначеного губернатора. Настав час дати слово тим, хто більш... лояльний."

 HNN_wipe_out_socialists:0 "Викорінити соціалістів"
 HNN_wipe_out_socialists_desc:0 "Хоча реформи Тан Хуалуна схилили поміркованих на наш бік, все ще залишається багато екстремістів та соціалістів, які вперто підтримують Гоміньдан та Китайську синдикалістську партію. Якщо оливкова гілка їх не переконує, ми мусимо розчавити їх залізним каблуком. Жодні революціонери не скинуть нашого губернатора, навіть якщо доведеться правити під дулом гвинтівки."

 HNN_rule_by_decree:0 "Правління через укази"
 HNN_rule_by_decree_desc:0 "Повноваження Комісії оборони були важливими для захисту Хунані Тан Сянміном, але цього замало. Ми можемо звернутися до досвіду Заходу: Сполучені Штати мають «виконавчі укази» для негайних дій. Ми впровадимо це в наше врядування, надавши губернатору право видавати укази на власний розсуд."

 HNN_safety_and_security:0 "Мир і безпека"
 HNN_safety_and_security_desc:0 "Режим Тан Сянміна приніс громадянам Хунані нову еру миру та безпеки. Загрози Гоміньдану та соціалізму вичищені з нашої провінції. Вороги Чжилі знищені, і губернатор Тан має всю необхідну владу для захисту краю. Нарешті прийшов справжній правитель, забезпечивши Хунані безпеку та процвітання."

 HNN_restore_civilian_rule:0 "Відновити цивільне правління"
 HNN_restore_civilian_rule_desc:0 "Коли вороги губернатора зникли, питання воєнного стану постало знову. Тан Хуалун запропонував братові скасувати воєнний стан і повернути цивільний контроль. Ми згодні з цим, що призведе до злиття нашого політичного кола з колом Тан Хуалуна для створення уряду, справді присвяченого добробуту кожного громадянина."

 HNN_maintain_martial_law:0 "Зберегти воєнний стан"
 HNN_maintain_martial_law_desc:0 "Хоча багато хто навколо нас, включаючи брата губернатора, хотів би скасування воєнного стану, сувора реальність така: Хунань все ще оточена загрозами, готовими вдарити в ту ж секунду, як ми виявимо слабкість. З цієї причини наш губернатор і головнокомандувач вирішив зберегти воєнний стан, принаймні до остаточного знищення зовнішніх загроз."

### Zhao Hengti

 HNN_the_democratic_mandate:0 "Демократичний мандат"
 HNN_the_democratic_mandate_desc:0 "Отримавши оновлений демократичний мандат, губернатор Чжао Хенті дивиться у майбутнє. Нашою першочерговою турботою є те, що Чжао вважає автократичними силами в провінції. Губернатор переконаний, що він повинен використати цей мандат для зміцнення та посилення демократії в Хунані, щоб вона не пала під натиском радикалізму чи апатії."

 HNN_form_a_grand_coalition:0 "Сформувати «Велику коаліцію»"
 HNN_form_a_grand_coalition_desc:0 "Маючи таку потужну антидемократичну силу в Асамблеї, нам необхідно сформувати «Велику коаліцію» з прихильних партій, щоб разом працювати над розвитком молодої демократії та захищати її від тих, хто волів би її знищити."

 HNN_reach_out_to_the_peasantry:0 "Звернутися до селянства"
 HNN_reach_out_to_the_peasantry_desc:0 "Пересічний селянин є, безумовно, найбільшою опорою, на яку може покластися Гоміньдан. Якщо ми хочемо підірвати їхню підтримку і не дати їм використати популістську риторику для вбивства нашої молодої демократії, ми повинні звернутися до простої людини, до пересічного селянина."

 HNN_revise_the_monroe_doctrine:0 "Переглянути «доктрину Монро»"
 HNN_revise_the_monroe_doctrine_desc:0 "Хунаньська «доктрина Монро» стверджує, що армія Хунані не може залишати межі провінції, а армії інших провінцій не можуть входити до неї. Хоча наміри були добрими — вберегти Хунань від кровопролиття, хаос, що перекинувся з Ґуйчжоу та Мінь-Ґань, чітко продемонстрував необхідність переглянути нашу доктрину і дозволити Хунані вступити в бій."

 HNN_appeal_to_the_legislature:0 "Звернутися до Асамблеї"
 HNN_appeal_to_the_legislature_desc:0 "Провінційна Асамблея є важливим органом уряду та демократії Хунані. Водночас вона дріб'язкова і часто намагається оголосити імпічмент губернатору Чжао без видимих причин. З огляду на нещодавню загрозу для демократії, ми повинні закликати їх зарити сокиру війни та припинити це політичне глухе куті, принаймні доки безпека Хунані не буде належним чином гарантована."

 HNN_bolster_the_intelligensia:0 "Підтримати інтелігенцію"
 HNN_bolster_the_intelligensia_desc:0 "Сильна інтелігенція є важливою ознакою будь-якої демократичної країни. Чанша вже стала центром для інтелектуалів Китаю, тому нам слід надати їм заступництво, щоб ще більше зміцнити наш інтелектуальний осередок, що розвивається."

 HNN_introduce_basic_welfare:0 "Запровадити базове соціальне забезпечення"
 HNN_introduce_basic_welfare_desc:0 "Однією з найпопулярніших обіцянок Гоміньдану була «мережа безпеки» соціального забезпечення, яка б підтримувала безробітних та збіднілих. Хоча ми самі не вели кампанію з цим гаслом, очевидно, що це була надзвичайно популярна політика, і нам слід прийняти план базового добробуту, щоб підірвати їхню риторику та підтримку."

 HNN_support_peasant_organisations:0 "Підтримати селянські організації"
 HNN_support_peasant_organisations_desc:0 "Ми почали налагоджувати зв'язки з селянством. Щоб продовжувати розвивати цю підтримку, ми маємо заохочувати селянські організації до участі в уряді. Сподіваємось, це ще більше прихилить селян до нас і збільшить нашу популярність серед них."

 HNN_the_federalist_revival:0 "Федералістське відродження"
 HNN_the_federalist_revival_desc:0 "Ми захопили Ґуанчжоу, оплот федералістів, і закріпили свою владу в провінції Ґуандун. Завдяки цим подіям ми можемо оголосити себе претендентом на національне об'єднання, спадкоємцем федералістського руху та носієм прапора федералізму!"

 HNN_improve_rural_schooling:0 "Покращити сільську освіту"
 HNN_improve_rural_schooling_desc:0 "Хоча Чанша і є центром навчання в Китаї, наші сільські громадяни часто позбавлені тих самих можливостей, що надаються мешканцям міст. Ми повинні негайно виправити це і розпочати масштабний проект з покращення нашої сільської академічної інфраструктури."

 HNN_expand_changsha_university:0 "Розширити Університет Чанші"
 HNN_expand_changsha_university_desc:0 "Найбільший університет у Хунані, Університет Чанші, є важливим центром знань та навчання в нашій провінції. Тому вкрай важливо спрямувати йому фінансування, щоб він міг розширюватися ще більше, встигаючи за нашою інтелігенцією, що зростає."

 HNN_guaranteed_liberty:0 "Гарантувати особисту свободу"
 HNN_guaranteed_liberty_desc:0 "Особисті свободи є основою будь-якої стабільної демократії, тому ми маємо зробити усну прокламацію прав, що надаються всім громадянам Хунані, з обіцянкою впровадити їх у закон якнайшвидше."

 HNN_court_the_unions:0 "Залучити профспілки"
 HNN_court_the_unions_desc:0 "Наші відносини з профспілками та робітничими активістами були... м'яко кажучи, складними. Але настав час зарити сокиру війни та натомість запропонувати профспілкам Хунані оливкову гілку. Сподіваємось, профспілки відплатять нам добротою, і агітація міських робітників сповільниться або припиниться зовсім."

 HNN_invest_in_the_countryside:0 "Інвестувати в село"
 HNN_invest_in_the_countryside_desc:0 "Фінальна частина нашого плану із забезпечення підтримки селянства: ми запровадимо масштабну програму з покращення інфраструктури сільської Хунані, що з'єднає провінцію та принесе відчутні покращення в життя простих людей."

 HNN_encourage_legislative_debates:0 "Заохочувати законодавчі дебати"
 HNN_encourage_legislative_debates_desc:0 "Однією з найважливіших частин законодавчого процесу є дебати щодо переваг та недоліків будь-якого закону. Оскільки наша демократія все ще перебуває в зародковому стані, для нас важливо заохочувати та брати участь у цих дебатах."

 HNN_rights_of_man:0 "Права людини"
 HNN_rights_of_man_desc:0 "Наша усна прокламація була зустрінута з обережною надією, і тепер ми повинні довести справу до кінця. Знадобиться час, щоб переконати Асамблею та проштовхнути цей акт, але Хунань повинна мати власний «Білль про права»!"

 HNN_undermine_the_diarchs:0 "Підірвати владу діархів"
 HNN_undermine_the_diarchs_desc:0 "Західна діархія (Чень Цюйчжень та Тянь Інчжао) є однією з найбільших виразок на демократії Хунані. Хоча наразі ми не можемо усунути цю пару мілітаристів, ми можемо використати наше зміцнене становище, щоб підірвати їхню базу влади, що, сподіваємось, стримає їхнє свавілля."

 HNN_foster_democratic_traditions:0 "Плекати демократичні традиції"
 HNN_foster_democratic_traditions_desc:0 "Одним із найважливіших запобіжників проти авторитаризму є традиція демократії. Хоча її важко виростити, у минулому були яскраві приклади того, як демократичні традиції встигали повалити будь-яких потенційних автократів. Якщо ми закладемо фундамент цих традицій зараз, навіть у ці буремні часи, то молода демократія Хунані ставатиме дедалі сильнішою."

 HNN_the_democratic_stronghold:0 "Оплот демократії"
 HNN_the_democratic_stronghold_desc:0 "Це була значна робота, але наші демократичні реформи досягли відмінних успіхів. Залишилося лише впровадити останні кілька змін, щоб ще більше зміцнити нашу місцеву демократію і показати Китаю та всьому світу, що федералістська мрія не просто досяжна, а вже стає реальністю."

### Kuomintang

 HNN_victory_of_the_united_front:0 "Перемога «Об'єднаного» фронту"
 HNN_victory_of_the_united_front_desc:0 "Попри все, дуету Гоміньдану вдалося відбитися як від Чжилі, так і від федералістів. Проте їхні першочергові турботи після перемоги — розібратися з деспотичними мілітаристами, з якими співпрацював Чжао, і змиритися з існуванням Провінційної асамблеї. Вони здобули владу через виборчу систему Хунані, але чи є вона справді здоровою?"

 HNN_dismantling_the_diarchy:0 "Демонтаж діархії"
 HNN_dismantling_the_diarchy_desc:0 "Попередня співпраця Чжао Хенті з мерзенними деспотами на сході та заході Хунані є явною ознакою слабкості федералістів та їхньої готовності схилятися перед мілітаристами. Гоміньдан, однак, не боїться ні польових командирів, ні їхніх армій. Негайно ми розпочнемо роботу з викорінення будь-якого впливу Бейяна в провінції, адже їм немає місця в Національній революції."

 HNN_handling_the_assembly:0 "Робота з Асамблеєю"
 HNN_handling_the_assembly_desc:0 "Критичне питання для лідерів Гоміньдану: Провінційна асамблея — це той самий інструмент, що дає їм легітимність, проте вона повністю суперечить концепціям «Данґо» (партійної держави) та «Політичної опіки». У той час як Чень Цянь схиляється до збереження інституції, Тан Шенчжі вкрай обурений самою цією ідеєю. Доля демократії в Хунані висить на волосині..."

 HNN_an_emergency_congress:0 "Надзвичайний конгрес"
 HNN_an_emergency_congress_desc:0 "Зрештою, розбіжності між Шостою та Восьмою арміями Національно-революційної армії здаються непримиренними: Чень Цянь та Тан Шенчжі постійно конфліктують через власні плани. «Радикали» та «Стара гвардія» на межі розколу провінції! Необхідно провести надзвичайний конгрес!"

 HNN_repudiate_the_canton_squatters:0 "Зречення кантонських самозванців"
 HNN_repudiate_the_canton_squatters_desc:0 "Ми повинні офіційно відмовитися від визнання тих, хто незаконно утримує владу в Кантоні, і проголосити наш уряд єдиним законним представником волі народу."

 HNN_formenting_the_kuomintang_revival:0 "Стимулювання відродження Гоміньдану"
 HNN_formenting_the_kuomintang_revival_desc:0 "Із захопленням Гуанчжоу здається, що прапор Національної революції Гоміньдану перейшов до хунаньського дуету. В інших місцях Гоміньдан може бути мертвим або в підпіллі, але ми не дамо «Білому сонцю на синьому небі над цілком червоною землею» потьмяніти! Ми боремося не лише за мрію доктора Суня, а за всю націю, і не спочинемо, доки нашу місію не буде виконано."

 HNN_expansion_of_yuelu_academy:0 "Розширення академії Юелу"
 HNN_expansion_of_yuelu_academy_desc:0 "Престижна установа, заснована ще у 976 році за династії Сун, академія Юелу останнім часом перебувала в занепаді. Оскільки попередні адміністрації віддавали пріоритет Університету Чанші, це призвело до того, що навчальна програма такої великої установи застаріла. Щоб показати нації наше прагнення до справжньої модернізації, ми розширимо легендарну академію."

 HNN_the_magistrate_problem:0 "Проблема магістратів"
 HNN_the_magistrate_problem_desc:0 "Попри перемогу на виборах, місцеві бюрократи та окружні магістрати, що служать новому уряду, залишаються пережитками попередньої корумпованої адміністрації. Голова служби охорони спокою Хе Цзянь запропонував масштабну програму реформ, спрямовану на реструктуризацію місцевих адміністративних посад."

 HNN_reforming_the_militias:0 "Реформа ополчення"
 HNN_reforming_the_militias_desc:0 "Місцеве ополчення є в кожній китайській провінції, проте в Хунані ситуація більше нагадує легалізований бандитизм. Ополчення попередніх адміністрацій контролювалося місцевими елітами та було автономним. Під егідою своєї служби Хе Цзянь прагне централізувати контроль над ополченням, щоб покласти край хаосу."

 HNN_planning_hunans_national_revolution:0 "Планування Національної революції в Хунані"
 HNN_planning_hunans_national_revolution_desc:0 "Можливо, через хаос епохи мілітаристів або через недбалість Чжао, Хунань позбавлена низки критично важливих комітетів для справжнього врядування. Хе Цзянь, відіграючи ключову роль у реформуванні інституцій, виступив за створення консультативного комітету для планування майбутнього хунаньського народу."

 HNN_ensuring_rural_pacification:0 "Забезпечення умиротворення сіл"
 HNN_ensuring_rural_pacification_desc:0 "Попри ранні реформи ополчення, Хе Цзянь повідомив голову провінції про намір впровадити другу серію реформ для перетворення ополчення на регулярну армію. Консолідуючи існуючі формування та запроваджуючи нові методи підготовки, він обіцяє, що його сили стануть ідеальним доповненням до Шостої та Восьмої армій."

 HNN_the_basis_of_peoples_livelihood:0 "Основа народного добробуту"
 HNN_the_basis_of_peoples_livelihood_desc:0 "Народний добробут, або «Міньшен» — один із трьох критичних принципів Гоміньдану. Він вимагає широких програм соціального забезпечення, яких у Хунані катастрофічно бракує. Якщо ми хочемо по-справжньому втілити Три принципи, ми повинні закласти фундамент для їх впровадження."

 HNN_providing_universal_literacy:0 "Загальна ліквідація неписьменності"
 HNN_providing_universal_literacy_desc:0 "Ситуація з неписьменністю в провінції жахлива. Попри те, що Чжао залучав інтелектуалів, це лише посилило прірву між громадянами та елітами. Сидячи у своїй вежі зі слонової кістки в Чанші, вони мало дбали про освіту народу. Ми повинні викорінити неписьменність у Хунані."

 # Гілка Чень Цяня
 HNN_vanguard_of_the_revolution:0 "Авангард революції"
 HNN_vanguard_of_the_revolution_desc:0 "Якщо і є хтось, хто служив Революції самовіддано і з залізною волею, то це Чень Цянь. Захищаючи революцію все життя, він і зараз вийшов на передній план, щоб не допустити радикального викривлення ідеалів Гоміньдану. На протилежному боці — опортуністичний вовк в овечій шкурі, і Чень Цянь зробить усе, щоб врятувати Хунань."

 HNN_preventing_subversive_elements:0 "Запобігання підривним елементам"
 HNN_preventing_subversive_elements_desc:0 "Демократія все ще потребує керівної руки, щоб вести її до просвітлення. Під проводом Партії ми вирвемо з коренем усіх, хто виступає проти Трьох принципів і Національної революції, чи то мілітаристи, реакціонери чи опортуністи."

 HNN_preaching_social_liberation:0 "Проповідування соціального визволення"
 HNN_preaching_social_liberation_desc:0 "Попри значні успіхи в соціальній мобільності та політичному зрівнянні наших жінок-товаришок, багато хто все ще залишається на узбіччі. Посилюючи співпрацю з феміністичними рухами, партія працюватиме над просуванням глобальної боротьби за права всіх людей, незалежно від статі."

 HNN_exalt_scientific_advancement:0 "Звеличення наукового прогресу"
 HNN_exalt_scientific_advancement_desc:0 "На відміну від радикальних соціалістів, які нещодавно проникли в партію зі своїм обожнюванням насильства та класової боротьби, справжні прихильники Гоміньдану виступають за наукове майбутнє, яке зрештою приведе нас до «Датун» (Великого єднання). Партія працюватиме над вступом у нову еру винахідливості."

 HNN_establishment_of_youth_orgs:0 "Створення молодіжних організацій"
 HNN_establishment_of_youth_orgs_desc:0 "Гоміньдан не може покладатися лише на свою стару гвардію — касту революціонерів Тунменхою, що поступово відходить. Натомість партія має виховати нове покоління. Як закликав доктор Сунь, ми розширимо молодіжні товариства для підвищення політичної свідомості молоді."

 HNN_cooperating_with_dangwai:0 "Співпраця з Данґвай"
 HNN_cooperating_with_dangwai_desc:0 "Попри сподівання Чень Цяня, Тан Шенчжі миттєво знищив десятиліття провінційної демократії. Хоча вона була недосконалою, вона показала, що народ Хунані здатний до самоврядування. Ми не можемо виправити шкоду минулого, але можемо налагодити зв'язки у майбутньому."

 HNN_developing_national_consciousness:0 "Розвиток національної свідомості"
 HNN_developing_national_consciousness_desc:0 "Проявивши ознаки здорової демократії, Хунань була визнана придатною для проведення місцевих виборів. Хоча кожен кандидат ретельно відбирається, щоб еліти не зловживали впливом, Хунань стане зразковою провінцією справжньої китайської демократії."

 HNN_hunans_shield:0 "Щит Хунані"
 HNN_hunans_shield_desc:0 "Попри всі виклики та випробування, командувач Шостої армії генерал Чень Цянь зумів здобути повну перемогу після зрадницьких дій Тан Шенчжі. Стверджуючи панування справжніх революціонерів над так званими «мілітаристами Гоміньдану», народ Хунані може спокійно відпочивати під захистом Оборонця Хунані."

 # Гілка Тан Шенчжі
 HNN_the_revolutionary_dark_horse:0 "Революційна темна конячка"
 HNN_the_revolutionary_dark_horse_desc:0 "Тан Шенчжі, якого партія тривалий час вважала вигнанцем, залишається революціонером до мозку кісток. Вступивши до Тунменхою під впливом Тань Женьфена і пройшовши через Синьхайську революцію, Тан є вірним сином революції. Будучи рушійною силою Північного походу і невтомно працюючи для селянства, Тан сподівається втілити власну інтерпретацію доктрини Тимчасового комітету дій."

 HNN_consolidate_the_province:0 "Консолідація провінції"
 HNN_consolidate_the_province_desc:0 "Переконлива перемога Гоміньдану на виборах чітко показала прагнення народу до впровадження Трьох принципів. Проте навіть після розпуску Асамблеї багато аспектів старих адміністрацій конфліктують з нашим урядом. Для справжнього тріумфу Національної революції ми маємо консолідувати абсолютну владу в Хунані."

 HNN_provide_the_peoples_alms:0 "Народна допомога"
 HNN_provide_the_peoples_alms_desc:0 "Правда в тому, що селяни та робітники були жорстоко експлуатовані під час губернаторства Чжао Хенті. Його лицемірні селянські асоціації та «жовті» профспілки служили лише інтересам шляхти та капіталістів. Використовуючи політику Тимчасового комітету дій, ми реформуємо трудове законодавство та реорганізуємо селянські спілки на користь народу."

 HNN_establish_the_political_and_officer_academy:0 "Створення політико-офіцерської академії"
 HNN_establish_the_political_and_officer_academy_desc:0 "Оригінальна Хунаньська офіцерська академія занепала після від'їзду її засновника Тан Шенчжі. Бачачи завзятість кадетів Вампу в Північному поході, ми відродимо цю установу як єдину академію, де кадри та офіцери вивчатимуть Три принципи, чесноти та військову справу в одному місці."

 HNN_construct_rural_autonomy:0 "Створення сільської автономії"
 HNN_construct_rural_autonomy_desc:0 "Як казав Тан Шенчжі, селяни — це хребет революції. Щоб полегшити врядування в селах і запобігти гнобленню, ми реформуємо «Групи поквартирного нагляду» в загони самооборони та створимо сільські комітети під егідою партії, щоб вони могли захищатися від реакціонерів, будуючи краще майбутнє."

 HNN_promote_buddhisation:0 "Впровадження буддійських чеснот"
 HNN_promote_buddhisation_desc:0 "На відміну від багатьох деспотів і тиранів, Тан Шенчжі — людина глибоко віруюча і непохитна у своїй моралі. Прийнявши буддизм у часи особистих випробувань, генерал отримав новий погляд на життя. Хоча було б нерозумно влаштовувати масове навернення, ми можемо принаймні прищепити народу духовні засади."

 HNN_revolution_in_the_countryside:0 "Революція в селах"
 HNN_revolution_in_the_countryside_desc:0 "Попри наші зусилля, масштаби ендемічної аграрної кризи в Хунані вражають. Якщо ми хочемо докорінно революціонізувати націю, ми мусимо співпрацювати з масами, що працюють на полях. Поєднуючи реформи «зверху» з підходом від самих коренів, ми викличемо цунамі революційної справедливості проти всіх, хто гнобить селянство Хунані."

 HNN_dawn_of_a_new_hunan:0 "Світанок нової Хунані"
 HNN_dawn_of_a_new_hunan_desc:0 "Попри сильний опір поміркованих товаришів із Шостої армії, Хунань була втягнута в нову еру революційної сучасності. Ми більше не будемо вважатися сільською глушиною, де селяни працюють за копійки, а еліти забирають весь прибуток. Натомість у Китаї постало нове, моральне суспільство — рай для нижчих класів."

 ##- Economy -##

 ##- Industry -##

 HNN_the_crossroads_of_china:0 "Перехрестя Китаю"
  HNN_the_crossroads_of_china_desc:0 "Завдяки своєму важливому розташуванню в центрі нації, Хунань виконує роль «перехрестя Китаю», полегшуючи економічні зв'язки між північчю та півднем, сходом та заходом. Однак таке становище є водночас благословенням і прокляттям: хоча через наші кордони проходять величезні потоки товарів, мало що залишається всередині. Бо навіщо комусь інвестувати в сільськогосподарські лабіринти Хунані, коли поряд є перспективніші краї?"

  HNN_securing_our_sovereignty:0 "Гарантування нашого суверенітету"
  HNN_securing_our_sovereignty_desc:0 "Хіба не глобальні ринки спричинили крах нашої промисловості? Ті самі капіталісти, що злетіли надто близько до сонця, нерозважливо наполягають на поверненні до старих методів управління економікою. Проте певні економісти в провінції рекомендують новий шлях, ставлячи потреби провінційного уряду та народу на перше місце. Скориставшись чистим аркушем, який подарував нам крах, почнімо працювати над незалежною індустріальною економікою."

  HNN_facilitating_investments:0 "Стимулювання інвестицій"
  HNN_facilitating_investments_desc:0 "Глобальний економічний крах стався не з вини самої світової торгівлі, а через безглузді дії венчурних капіталістів, які інвестували без розсудливості, а тепер плачуть над банкрутством. Маючи тверду руку в уряді, ми можемо відродити процвітання, яке спостерігалося в Лізі, Маньчжурії та Центральному уряді. Нам лише потрібно підійти до справи з холодною головою, виваженими рішеннями та обмеженням надмірностей."

  HNN_nationalising_critical_industries:0 "Націоналізація критичних галузей"
  HNN_nationalising_critical_industries_desc:0 "Китай — країна, сповнена несправедливості: від мілітаристів та бандитів до дрібних деспотів. Проте нікого не зневажають так сильно, як іноземні концесії, що залишаються постійним нагадуванням про підпорядкування Китаю іноземним державам. Гірше того, вони контролюють багато критичних галузей у Хунані, як-от водопостачання чи електрику. Будь-якими засобами ми маємо забезпечити, щоб ключові галузі перебували в руках самої Хунані."

  HNN_opening_our_doors:0 "Відкриття наших дверей"
  HNN_opening_our_doors_desc:0 "Щоб забезпечити справжнє економічне процвітання в нашій молодій індустріальній утопії, створімо додаткові стимули та субсидії для будь-якого відважного підприємця, чи то з нашої нації, чи звідкись іще. Завдяки їхньому рясному капіталу ми зробимо так, щоб провінція стала «сяючим містом на пагорбі», змагаючись за фінансовим успіхом з будь-яким іншим регіоном."

  HNN_ensuring_healthy_competition:0 "Забезпечення здорової конкуренції"
  HNN_ensuring_healthy_competition_desc:0 "Хоча ми дозволили великій кількості капіталістів наповнити Чанде та Чаншу, більшість із них походять із жорстокого світу Концесій. Серед усіх прибережних міст Шанхай особливо відомий своєю пристрастю до брудної гри. Хунань, однак, не є другом для тих, хто прагне визискувати її жителів. Хоча ми не будемо надто втручатися в систему, краще забезпечити здорову конкуренцію між сторонами."

  HNN_rewards_for_arms_manufacturers:0 "Винагороди для виробників зброї"
  HNN_rewards_for_arms_manufacturers_desc:0 "Призначивши себе надзвичайним губернатором після безглуздих результатів виборів, Тан Сянмін прагне зробити так, щоб Хунань слугувала щитом інтересів Чжилі на хаотичному південному заході. З неблагонадійними губернаторами Ґуансі та Ґуандуну на півдні та затятим республіканським бастіоном на південному заході, Хунань жахливо непідготовлена до оборони. На щастя, у Тана є план."

  HNN_utilising_changsha_unions:0 "Використання профспілок Чанші"
  HNN_utilising_changsha_unions_desc:0 "Відомі своєю люттю та палкістю, синдикалістські профспілки в Чанші мають великий вплив серед представників робітничого класу. Простягнувши їм руку чесної співпраці та заступництва в обмін на деякі поступки, ми, можливо, зможемо використати їхній вплив, щоб завоювати прихильність робітників. Нарешті уряд працюватиме на них, а не навпаки."

  HNN_from_the_pearl_river_to_the_yangtze:0 "Від Перлинної річки до Янцзи"
  HNN_from_the_pearl_river_to_the_yangtze_desc:0 "З бурхливим хабом Ґуанчжоу на півдні, у дельті Перлинної річки, та промисловим гігантом Уханем на півночі, Чанша та Чанде перебувають у вигідному становищі як посередники для транспортування товарів. Збільшивши пропускну здатність нашої залізниці на північ, ми зможемо значно полегшити таку торгівлю та отримати з цього вигоду."

  HNN_industrial_self_sufficiency:0 "Промислова самодостатність"
  HNN_industrial_self_sufficiency_desc:0 "Як багато хто передбачав, коли ми розпочали програму індустріальних реформ, економіка відновилася вражаючими темпами. Бізнес процвітає, робітники сумлінно служать, а наша промислова міць підноситься над тими мізерними можливостями, що ми мали раніше. Більше не покладаючись повністю на милість будь-якого володаря, промисловість Хунані здатна стояти на власних ногах, і провінції від цього лише краще."

  HNN_fostering_national_reconstruction:0 "Сприяння національній відбудові"
  HNN_fostering_national_reconstruction_desc:0 "Настав час використати наш промисловий потенціал для відновлення єдності та міці всього Китаю."

  ##- Сільське господарство -##

  HNN_our_most_critical_issue_of_the_day:0 "Наша найгостріша проблема сьогодення"
  HNN_our_most_critical_issue_of_the_day_desc:0 "Набагато серйознішими за промислові негаразди є наші проблеми в аграрному секторі. Велика частина доходів провінції збирається з сільськогосподарської продукції, а через ширшу економічну кризу, що вдарила по торгівлі, наші селяни працюють за мізерний прибуток і в результаті караються землевласниками. Необхідні рішучі дії, щоб оновити та покращити нашу жахливу аграрну систему."

  HNN_mobilising_the_masses:0 "Мобілізація мас"
  HNN_mobilising_the_masses_desc:0 "Надто довго селянство працювало під гнітом місцевих тиранів та лихої шляхти. Надто довго вони страждали від несправедливості своїх господарів. Нарешті уряд почув їхні крики — знущання припиняться тут і зараз. Хоча пряме зіткнення з укоріненими елітами призведе до катастрофи, ми можемо мобілізувати селян під ними на боротьбу за світле майбутнє. Можливо, тоді землевласники дослухаються."

  HNN_expanding_our_exports:0 "Розширення експорту"
  HNN_expanding_our_exports_desc:0 "Завжди маючи відносно слабку економіку, наш експорт був так само дефіцитним і позбавленим різноманіття. З новою ініціативою уряду ми розширимо виробництво наших основних експортних товарів: чаю, рамі, конопель і тютюну, а також зосередимося на готових виробах, як-от бавовняний одяг та кераміка."

  HNN_harmony_in_the_land_harmony_at_home:0 "Гармонія в краї, гармонія вдома"
  HNN_harmony_in_the_land_harmony_at_home_desc:0 "Як можна досягти гармонії у світі, якщо сама земля страждає від лиха? Колись ми практикували відновлювальне фермерство, але через хаос епохи мілітаристів та численні війни багато хто втратив ці навички. Ми не можемо їх звинувачувати, проте можемо знову навчити наших трударів шанобливому ставленню до Матері-Природи, адже вона дарує нам свої блага, і найменше, що ми можемо зробити — це віддячити їй тим самим."

  HNN_negotiating_with_the_landowners:0 "Переговори із землевласниками"
  HNN_negotiating_with_the_landowners_desc:0 "Прихильники радикального перерозподілу землі діють у короткозорій люті, не розуміючи важливості поступового, ретельного підходу. Замість того, щоб принижувати критичну роль землевласників у нашому суспільстві, чому б не співпрацювати з ними для впорядкування аграрної системи без руйнування їхнього життя?"

  HNN_annihilating_exploitation:0 "Знищення експлуатації"
  HNN_annihilating_exploitation_desc:0 "Розпаливши вогонь селянської люті, ми можемо використати завзяття народу, щоб нарешті покласти край кричущій експлуатації праці. Хоча засоби можуть бути безпринципними, а дехто вважатиме їх жорстокими, селянам постійно доводилося миритися з жахливою долею, яку їм готували власники землі. Настав час уряду відновити справедливість."

  HNN_alliance_with_the_peasantry:0 "Альянс із селянством"
  HNN_alliance_with_the_peasantry_desc:0 "Засновані місцевими лідерами як противага політичним важковаговикам із класу землевласників, селянські ради Хунані доблесно билися за права побратимів. Якщо ми надамо їм широку підтримку для розширення, ми не лише революціонізуємо село, а й завоюємо серця всього населення."

  HNN_for_our_mutual_benefit:0 "Задля взаємної вигоди"
  HNN_for_our_mutual_benefit_desc:0 "Попри наші постійні нагадування, що реформи необхідні для збереження їхнього статусу та доходів, землевласники все ще вагаються. Проте через спільні зусилля, зустрічі з головами земельних інституцій та огляд маєтків ми зможемо донести наше послання. Хоча вони можуть нарікати на наші програми, це точно краще за відкриту революцію."

  HNN_enhance_tea_manufacturing:0 "Покращення виробництва чаю"
  HNN_enhance_tea_manufacturing_desc:0 "Чай є критично важливим не лише для китайської культури, а й для економіки Хунані. Будучи пріоритетним експортним товаром до фінансової кризи, він забезпечував стабільний приплив доходів до скарбниці. Зважаючи на таку важливу роль, модернізація та механізація збору врожаю принесе ще кращі результати."

  HNN_hunans_brilliant_success_story:0 "Блискуча історія успіху Хунані"
  HNN_hunans_brilliant_success_story_desc:0 "Понад усе, аграрна історія успіху Хунані заслуговує на вивчення та похвалу. Поставши з хаотичної, феодальної злиденності, випаленої вогнем «Чорного понеділка», з попелу виринув стрімкий фенікс. Тепер, коли селяни та землевласники задоволені своєю роллю в економіці провінції, крокуймо рука об руку до нової ери процвітання."

  ##- Спільні фокуси -##

  HNN_balancing_the_books:0 "Зведення бюджету"
  HNN_balancing_the_books_desc:0 "Фінансове становище Хунані завжди було жалюгідним, і уряду часто доводилося брати позики, щоб запобігти колапсу. Як і в інших провінціях країни, наші фінансові звіти в жахливому стані, а борги — ще гірші. Залучивши найкращих бухгалтерів та бюрократів провінції, ми нарешті зможемо здобути хоча б трохи економічної свободи."

  HNN_excavating_the_interior:0 "Освоєння внутрішніх районів"
  HNN_excavating_the_interior_desc:0 "Через безгосподарність або некомпетентність провінційний уряд не міг розкрити справжній потенціал внутрішніх ресурсів Хунані. З новими економічними свободами, отриманими після виходу з Ліги, та виправленням стану скарбниці ми нарешті можемо почати видобувати все те багатство, яке дарує нам наша прекрасна земля."

  HNN_the_vital_economic_linchpin:0 "Життєво важливий економічний стрижень"
  HNN_the_vital_economic_linchpin_desc:0 "Відіграючи центральну роль у нації, Хунань бачила багато успіхів і багато труднощів. Однак завдяки тактовному управлінню індустріалізацією, місцевими та іноземними силами, Хунань заслужила роль великої провінційної потуги. Здатна впливати на інших, вона справді є життєво важливим економічним стрижнем країни."

 ##- Military -##

 HNN_our_provincial_army:0 "Провінційна армія Хунані"
  HNN_our_provincial_army_desc:0 "Майже не беручи участі в боях після Північного походу, провінційна армія Хунані перетворилася на звичайну примітку в історії, отримавши дуже мало від німецької військової місії при кліці Чжилі. З тими мізерними ресурсами, що в нас є, армія Хунані має бути відроджена, відбудована та навчена, щоб стати грізною силою, здатною суперничати з Чжилі, Фентянем та будь-ким іншим, хто зазіхне на провінцію."

  HNN_following_in_great_footsteps:0 "Йдучи славетними стопами"
  HNN_following_in_great_footsteps_desc:0 "Люті та непохитні. Політично свідомі та віддані. Усе це — риси відважних солдатів Національно-революційної армії. Навіть зараз ті, хто справді підтримує ідеали доктора Сунь Ятсена та Гоміньдану, борються за свої переконання в зоні повстання Мінь-Ґань та в Ґуйчжоу. Йдучи стопами наших товаришів, ми повинні намагатися наслідувати їхню силу."

  HNN_arise_hunans_peasantry:0 "Повстань, селянство Хунані!"
  HNN_arise_hunans_peasantry_desc:0 "Селянство Хунані більше не страждатиме під чоботом лихої шляхти чи деспотичних мілітаристів. З приходом Гоміньдану до влади ми нарешті можемо дарувати їм омріяну свободу. Через інтеграцію в допоміжні формування, що підсилять наші регулярні війська, селянство Хунані змусить увесь Китай здригнутися від своєї люті."

  HNN_disintegrating_their_walls:0 "Руйнуючи їхні стіни"
  HNN_disintegrating_their_walls_desc:0 "Як молот по ковадлу, вогнева міць артилерії знищує все на своєму шляху. Як показала Світова війна і, що важливіше, епоха мілітаристів — перемагає той, у кого більші гармати. Завдяки досвіду Чень Цяня в командуванні артилерійськими з'єднаннями, наша армія обрушить грім на голови ворогів."

  HNN_steel_hearts_tenacious_minds:0 "Сталеві серця, запеклі уми"
  HNN_steel_hearts_tenacious_minds_desc:0 "Ніщо не характеризує національно-революційного солдата краще за його безмежну відданість Трьом принципам та Національній революції. Завдяки завзяттю, люті та мужності наші війська будуть одночасно і шанованими, і жахливими. Зі сталевими серцями та запеклими умами ми об'єднаємо країну та виженемо іноземних імперіалістів геть."

  HNN_disciplined_and_motivated:0 "Дисципліновані та вмотивовані"
  HNN_disciplined_and_motivated_desc:0 "Попри меншу кількість людей та зброї під час Північного походу, Національно-революційна армія перемогла всупереч усьому. Багато наших перемог стали можливими завдяки винятковій вмотивованості та дисципліні звичайного солдата порівняно з військами мілітаристів. Навіть під час Мінь-Ґаню та вигнання в Ґуйчжоу наші армії трималися, щоб побачити, як промені Білого Сонця засяють над усією країною."

  HNN_critiquing_our_mistakes:0 "Аналіз наших помилок"
  HNN_critiquing_our_mistakes_desc:0 "Ми знаємо свої промахи. Кожен командир НРА знає їх. Наші помилки в минулому мало не коштували Китаю майбутнього, і ми ніколи не дозволимо цьому повторитися. Аналізуючи минулі конфлікти та впроваджуючи сувору програму післябойових розборів, ми зробимо наші сили неперевершеними на полі бою."

  HNN_modernised_cavalry_command:0 "Модернізоване кавалерійське командування"
  HNN_modernised_cavalry_command_desc:0 "Китайська оборонна промисловість наразі не здатна виробляти справжні бронетанкові чи механізовані сили, порівнянні з західними, проте це не означає, що ми не можемо прийняти перевагу маневрової війни. Наслідуючи провідних теоретиків Москви, Берліна та Лондона, ми доповнимо наші обмежені запаси моторизованої техніки кавалерійськими загонами, щоб по-справжньому розвивати прориви."

  HNN_pincer_and_envelopment:0 "Кліщі та оточення"
  HNN_pincer_and_envelopment_desc:0 "Вороги можуть використовувати кращу зброю або чисельну перевагу, намагаючись розчавити нашу Революцію, проте тактика кліщів та охоплення дозволяє розбити навіть сильнішого супротивника. Ізолюючи ворожі колони завдяки знанню місцевості та координації регулярної армії з кавалерією, ми зможемо виснажувати та нищити цілі дивізії."

  HNN_luring_the_enemy_in_deep:0 "Заманювання ворога вглиб"
  HNN_luring_the_enemy_in_deep_desc:0 "Китайські військові теоретики давно розробляли концепцію «заманювання ворога вглиб». Це доведено працями часів Цін та сучасними революційними діячами, такими як Цай Е. Нарешті ми застосуємо ці методи на практиці. Обережно змушуючи ворога йти за нами, ми дозволимо неозорим просторам нашої землі розчавити його."

  HNN_centralised_planning_decentralised_execution:0 "Централізоване планування, децентралізоване виконання"
  HNN_centralised_planning_decentralised_execution_desc:0 "Історія вчить: сліпе дотримання наказів часто призводить до катастрофи, якщо ситуація на полі бою змінюється. Хоча ми маємо складати конкретний план операцій, ми делегуємо право приймати миттєві рішення окремим командирам на місцях, надаючи їм ініціативу діяти за обставинами."

  HNN_hallmark_of_revolutionary_warfare:0 "Взірець революційної війни"
  HNN_hallmark_of_revolutionary_warfare_desc:0 "Злиття 6-ї та 8-ї Національно-революційних армій породило фанатичну силу, сповнену рішучості не дати баченню доктора Суня згаснути. Несучи смолоскип за полеглих товаришів та за майбутній китайський народ, ми вирушаємо у власний хоробрий шлях. Мобілізація всіх класів, єдність заради блага нації — ми є справжнім взірцем революційної війни."

  HNN_victors_of_weltkrieg_victors_of_china:0 "Переможці Світової війни, переможці Китаю"
  HNN_victors_of_weltkrieg_victors_of_china_desc:0 "У запеклих битвах Світової війни саме кайзерівський Гір (Heer) зрештою вийшов переможцем. Вони тріумфували знову, коли німецькі війська втрутилися на боці кліки Чжилі та розбили Національно-революційну армію під час Північного походу. Ми повинні створити армію, здатну на такі ж перемоги, водночас мінімізуючи недоліки німецького гіганта."

  HNN_our_own_heer:0 "Наш власний Гір"
  HNN_our_own_heer_desc:0 "Весь світ знає, що збройні сили Німецької імперії — найперша бойова сила планети. Німецький Орел розправляє крила завдяки боєздатності своєї армії. Хоча наша провінція має значно менше зв'язків з Німеччиною, ніж Пекін, наші теоретики вивчили досвід німецької місії, і ми прагнемо його відтворити."

  HNN_acting_as_one:0 "Діючи як єдине ціле"
  HNN_acting_as_one_desc:0 "Ключем до успіху німців була здатність координувати масові дії армії для досягнення єдиної мети. З розвитком радіозв'язку ефективність такої координації зросла в рази. Інвестуючи в розробку власних засобів зв'язку, ми впровадимо в Китаї військову справу нової епохи."

  HNN_concealment_and_reconnaissance:0 "Маскування та розвідка"
  HNN_concealment_and_reconnaissance_desc:0 "Коли світ стрімко наближається до лиха, китайська нація неминуче опиниться у вирі подій. Щоб зберегти перевагу, ми навчимо наших командирів принципам маскування та розвідки. Надаючи особливого значення секретності та розширюючи розвідувальні загони, ми завжди володітимемо ініціативою в бою."

  HNN_defence_and_industry_in_tandem:0 "Оборона та промисловість у тандемі"
  HNN_defence_and_industry_in_tandem_desc:0 "Як стверджують німецькі теоретики, армія та промисловий сектор повинні працювати заради спільної синергійної мети — захисту нашої незалежності. Укладаючи спеціальні контракти з підприємцями, ми мобілізуємо всю міць промисловості та людських ресурсів Хунані."

  HNN_victory_through_innovation:0 "Перемога через інновації"
  HNN_victory_through_innovation_desc:0 "Світова війна яскраво продемонструвала, як швидкий розвиток озброєнь змінює хід конфлікту. Танки, повітряні флоти та підводні човни схилили шальки терезів на один бік. Попри обмежені можливості, наш уряд спрямує значні інвестиції в освіту, щоб Хунань зберігала технологічну перевагу над суперниками."

  HNN_officers_example:0 "Приклад офіцера"
  HNN_officers_example_desc:0 "Самі по собі солдати не змогли б перемогти, адже саме офіцерський корпус веде їх у бій. Командири, що планують стратегічні цілі через правильне застосування тактики на місцях, заслуговують на особливу шану. Ці видатні особи є мечоносцями спасіння Хунані."

  HNN_new_infantry_drill_regulations:0 "Новий статут піхотних навчань"
  HNN_new_infantry_drill_regulations_desc:0 "«Цаофа», або «Новий статут піхотних навчань», був головним джерелом навчання в пізній цінській армії. Хоча він походить з часів до сучасної маневрової війни, його базові принципи залишаються актуальними. Надаючи пріоритет піхотному строю та наступальній доктрині, ми зобов'яжемо офіцерів вивчати цю корисну літературу."

  HNN_pinnacle_of_the_new_army:0 "Вершина Нової Армії"
  HNN_pinnacle_of_the_new_army_desc:0 "Ми досягли вершини військової підготовки. Наша армія тепер поєднує традиційну витримку з найсучаснішими методами ведення війни."

  HNN_the_example_for_the_nation:0 "Приклад для нації"
  HNN_the_example_for_the_nation_desc:0 "Наша армія не знає меж. Неперевершена та безстрашна, вона є дороговказом для всієї країни. Нехай вона ще не зрівнялася з німецьким Гіром, на китайському полі бою їй не буде рівних. Як чесне врядування Хунані є моделлю для інших провінцій, так само нею стане і наша військова міць."

  HNN_revitalise_zhuzhou_arsenal:0 "Відродити арсенал у Чжучжоу"
  HNN_revitalise_zhuzhou_arsenal_desc:0 "Попри фінансові труднощі на початку року, арсенал у Чжучжоу все ще здатний виробляти величезну кількість зброї. Ми відновимо інвестиції в це ключове підприємство, щоб воно могло конкурувати навіть з арсеналом у Тайюані."

  HNN_a_thorough_reexamination_of_strategy:0 "Ретельний перегляд стратегії"
  HNN_a_thorough_reexamination_of_strategy_desc:0 "За час нашої військової сплячки командний склад відстав від сучасності; дехто все ще живе епохою воєн Чжилі-Фентянь. Порівняно з західними арміями, наші сили виглядають слабко. Ми розпочнемо ґрунтовний перегляд стратегій, бо на кону стоїть цілісність провінції."

  HNN_a_new_academy:0 "Нова академія"
  HNN_a_new_academy_desc:0 "Створення нової військової академії закладе фундамент для виховання офіцерів нового покоління, відданих нашому політичному курсу."

  HNN_provincial_redoubts:0 "Національні редути"
  HNN_provincial_redoubts_desc:0 "Не маючи змоги покладатися лише на мобільну оборону, наш інженерний корпус запропонував будівництво мережі національних редутів на кордонах із найнебезпечнішими ворогами. Завдяки державному фінансуванню будуть зведені бетонні бункери, що стануть бастіоном у разі спроби захопити Чаншу."

  HNN_producing_a_viable_air_fleet:0 "Створення дієздатного повітряного флоту"
  HNN_producing_a_viable_air_fleet_desc:0 "Спроби Китаю контролювати власне небо поки що мізерні. Найкращі флотилії — це застарілі біплани в Ґуандуні чи Фентяні. Ми не можемо кинути виклик іноземним авіаціям, але маємо працювати над захистом власного повітряного простору. Принаймні, щоб громадяни Хунані не жахалися неба."

  HNN_securing_hunans_airspace:0 "Захист неба Хунані"
  HNN_securing_hunans_airspace_desc:0 "Через відсутність авіаційної промисловості та коштів на її створення, уряд вирішив інвестувати в розгортання зенітних батарей. Це дозволить нашим хоробрим солдатам на землі збивати ворожі бомбардувальники чи винищувачі."

  HNN_developing_native_pilots:0 "Підготовка власних пілотів"
  HNN_developing_native_pilots_desc:0 "Для більшості населення Хунані авіація є чимось зовсім чужим, тому навчання пілотів для тих небагатьох машин, що в нас є, стало складним процесом. Зусиллями уряду ми запровадимо навчальну програму, щоб виховати відважних хунанських літунів, гідних звання асів."

  HNN_importing_fighter_designs:0 "Імпорт конструкцій винищувачів"
  HNN_importing_fighter_designs_desc:0 "Не маючи власних розробок, але володіючи ресурсами для закупівлі іноземних винаходів, уряд вважає за необхідне імпортувати креслення з країн, готових їх надати. Це вимушений крок, доки Китай не створить власну авіаіндустрію."

########################################
#####- Section 07: Ideas - #############
########################################

 HNN_a_democratic_province:0 "Конституційна спадщина"
  HNN_a_democratic_province_desc:0 "На відміну від інших провінцій, Хунань унікальна тим, що має власну конституцію. Проголошена Чжао Хенті та дванадцятьма іншими діячами 1 січня 1922 року, Провінційна конституція прагне підтримувати права кожного жителя Хунані: чоловіка, жінки чи дитини. Вона обіцяє вільні вибори, обрану Провінційну раду та губернатора. Хоча Чжао щиро відданий демократії, його вірність ідеалам (і часто буйна Асамблея) призводять до частих політичних глухих кутів. Конституція також містить пункт про хунаньську «доктрину Монро», яка забороняє хунаньським військам виходити за межі провінції, а військам інших провінцій — входити до неї."

  HNN_constitutional_hopes_dashed:0 "Розвіяні конституційні надії"
  HNN_constitutional_hopes_dashed_desc:0 "Тан Сянмін офіційно скасував конституцію Хунані, призначив себе військовим губернатором і розчавив полум'я демократії своїм залізним чоботом."

  HNN_intellectual_hub:0 "Інтелектуальний центр"
  HNN_intellectual_hub_desc:0 "У межах Китаю Хунань є одним із небагатьох місць, де інтелектуали можуть вільно збиратися та висловлюватися. Хоча це сприяє прогресу, утримання такої кількості мислителів дорого коштує нашій відносно бідній провінції."

  # Регіональні конфлікти
  HNN_the_western_diarchy:0 "Західна діархія"
  HNN_the_western_diarchy_desc:0 "Західна частина Хунані, Сянсі, перебуває під владою двох мілітаристів — Чень Цюйчженя та Тянь Інчжао. Номінально лояльні до Чжао, вони більше симпатизують Тан Сянміну. У будь-якому разі, вони є скалкою в оці губернатора: з ними доведеться або домовлятися, або приборкувати, або повалити їхню діархію."

  # Військові моделі та командування
  HNN_the_revolutionary_model:0 "Революційна модель"
  HNN_the_german_model:0 "Німецька модель"
  HNN_hunanese_high_command_KMT:0 "Вище командування Хунані (КМТ)"
  HNN_hunanese_high_command_ger:0 "Вище командування Хунані (Німецьке)"

  # Реформи армії
  HNN_clearing_house:0 "Кадрова чистка"
  HNN_clearing_house_desc:0 "Коли політична ситуація в Хунані нарешті стабілізувалася, уряд може розпочати критично важливі реформи, щоб оживити наш офіцерський корпус і штаб. Завдяки процесу ретельної перевірки, суворим покаранням за будь-які ознаки корупції та інтенсивним навчанням, армія Хунані засяє як ніколи раніше."

 HNN_arise_hunans_peasantry_idea:0 "Винахідливе виробництво зброї"
  HNN_arise_hunans_peasantry_idea_desc:0 "Хоча Хунань не має такої славетної промисловості, як Шеньян, Тайюань чи Нанкін, брак виробничих потужностей ми компенсуємо винахідливістю. Завдяки відновленню непридатного спорядження, повторному використанню застарілого обладнання та переоснащенню верстатів, збройова промисловість Хунані може ефективніше виробляти нове покоління гвинтівок для нашого нового покоління солдатів."

  HNN_reexamining_our_strategies:0 "Перегляд наших стратегій"
  HNN_reexamining_our_strategies_desc:0 "Через ретельний процес аналізу наших минулих промахів на полі бою, а також вивчення дій армій Чжилі та Національно-революційної армії, ми прагнемо модернізувати власну армію Хунані до західних стандартів. Проте додаткова бюрократія та нові стратегії тимчасово знижують здатність наших командирів діяти в реальному бою."

  # Економічний та промисловий стан
  HNN_perilous_industrial_sector:0 "Хиткий промисловий сектор"
  HNN_perilous_industrial_sector_desc:0 "На півдні сяє Гуанчжоу — зірка дельти Перлинної річки. На північному сході лежить тримістя Ухань, а на заході — мегаполіс Чунцин. На перехресті між ними розташовані скромні промислові центри Чанде та Чанша. Попри аграрний характер провінції, ці два міста забезпечують основну частину нашого промислового потенціалу. Проте інвестори воліють вкладати гроші в перспективніші сусідні провінції, залишаючи нас у небезпечному становищі, де вся індустрія залежить від двох недофінансованих центрів."

  HNN_intense_agricultural_imbalance:0 "Гострий аграрний дисбаланс"
  HNN_intense_agricultural_imbalance_desc:0 "Хунань — це переважно сільськогосподарська економіка. Система землеволодіння тут є справжнім феодальним кошмаром: місцева шляхта та землевласники правлять селами як монархи своїми вотчинами. Уряд у Чанші змушений рахуватися з ними, оскільки саме вони тримають у руках нитки, що керують економікою провінції."

  # Криза та "Чорний понеділок"
  HNN_derelict_industrial_sector:0 "Занедбаний промисловий сектор"
  HNN_derelict_industrial_sector_desc:0 "Цунамі «Чорного понеділка» нарешті накрило Східну Азію. Катаклізм разом із заворушеннями, що стали смертним вироком для Ліги, знищили і мізерні промислові здобутки Хунані. Хаос на сході вдарив по підприємствах у Чанші та Чанде: малі бізнеси закриваються, а великі проводять масові скорочення. Життєва сила міст згасає, і уряд мусить діяти негайно."

  HNN_catastrophic_agricultural_crisis:0 "Катастрофічна аграрна криза"
  HNN_catastrophic_agricultural_crisis_desc:0 "Світовий економічний спад зруйнував аграрну стабільність Хунані. Грошей бракує, врожаї гниють через відсутність покупців, а землевласники скорочують робочі місця для захисту власних активів, що провокує подальші заворушення."

  # Стабілізація та відновлення
  HNN_stabilising_industrial_sector:0 "Стабілізація промислового сектора"
  HNN_stabilising_industrial_sector_desc:0 "Завдяки втручанню уряду промисловість почала стабілізуватися в унісон з іншими економіками світу. Хоча ситуація все ще гірша, ніж до кризи, підприємства більше не закриваються, а безробіття припинило зростання. Тепер ми можемо почати оновлення економіки з чистого аркуша."

  HNN_renewed_agricultural_balance:0 "Оновлена аграрна рівновага"
  HNN_renewed_agricultural_balance_desc:0 "Розпочавши місію з порятунку економіки, уряд домігся певної рівноваги завдяки обмеженню влади землевласників. Хоча зловживання ще трапляються, цей стан дає фундамент, необхідний для розбудови сільського господарства Хунані на нових засадах."

 HNN_independent_industrial_sector: "Незалежний промисловий сектор"
 HNN_independent_industrial_sector_desc: "Дотримуючись політики економічної незалежності, уряд подбав про те, щоб промисловість Хунані працювала на благо її мешканців, а не іноземних інвесторів за межами провінції. Прибічники вільного ринку вважають цю політику радикальною, проте уряд на власні очі бачив результати нестримного капіталізму, і вони геть не втішні."

 HNN_developing_industrial_sector: "Промисловий сектор, що розвивається"
 HNN_developing_industrial_sector_desc: "Фінансуючи міський розвиток Хунані шляхом залучення іноземних інвесторів, наша економіка прийме визначну політику «відкритих дверей» задля зростання. Завдяки стимулам, обіцяній стабільності та субсидіям Чанша має стати осередком промислових інновацій та виробництва, що суперничатиме навіть із височенними димарями Маньчжурії."

 HNN_self_sufficient_industry: "Самодостатня промисловість"
 HNN_self_sufficient_industry_desc: "Досягнувши справжньої економічної самодостатності, ініціативи уряду Хунані створили економіку, що працює на народ, а не на інвесторів. Оскільки добробут наших людей поступово зростає, провінція стає лише кращою. Хоча вона й не здобула світової слави, для народу Хунані настала нова ера процвітання."

 HNN_export_oriented_industry: "Експортоорієнтована промисловість"
 HNN_export_oriented_industry_desc: "Наша промисловість ще не може зрівнятися з сучасними економіками Токіо чи Заходу, проте її стан не варто недооцінювати. Пріоритет експорту, стрімкий розвиток заводів та бум виробництва товарів перетворили нашу економіку на взірець ефективного управління. Попри залежність від стабільності іноземних інвестицій та торгівлі, економіка Хунані все одно процвітає."

 HNN_careful_agricultural_reform: "Обережна аграрна реформа"
 HNN_careful_agricultural_reform_desc: "Передбачаючи, що повний перерозподіл землі неминуче призведе до хаосу, політики Хунані вирішили розпочати помірковану аграрну реформу. Вона впроваджує низку програм, спрямованих на припинення грубих зловживань еліти землевласників, водночас використовуючи державні кошти для викупу та перерозподілу землі між працівниками. Проте навіть такі помірковані плани викликали спротив шляхти, яка занепокоєна, що це лише хитрощі губернатора задля зміцнення власної влади."

 HNN_embers_of_agricultural_redistribution: "Зачатки аграрного перерозподілу"
 HNN_embers_of_agricultural_redistribution_desc: "Вирішивши, що для порятунку та оновлення хиткої аграрної системи Хунані необхідні радикальні кроки, політики в Чанші розпочали програму обмеженого перерозподілу землі. Уряд почав викуповувати (та вилучати) маєтки землевласників, продаючи їх великим сім'ям або селянським радам. Це викликало очікуваний гнів еліт, які намагалися блокувати дії уряду, проте без особливого успіху."

 HNN_revitalised_agricultural_balance: "Оновлений аграрний баланс"
 HNN_revitalised_agricultural_balance_desc: "Завершуючи свої аграрні ініціативи, уряд завдяки виваженому підходу до земельної реформи зміг створити новий, оновлений аграрний баланс. Керівники в Чанші впорядкували феодальну клаптикову систему землеволодіння Хунані. Хоча радикальніші верстви суспільства можуть вважати, що цього недостатньо, селяни та шляхта відчули взаємне покращення у повсякденному житті, а голоси незгодних переважно стихли."

 HNN_peasant_oriented_agriculture: "Сільське господарство, орієнтоване на селян"
 HNN_peasant_oriented_agriculture_desc: "Завершивши економічну програму, уряд завдяки підходу, орієнтованому на селян, отримав значні переваги для їхнього добробуту. За підтримки місцевих селянських кооперативів та рад, а також завдяки перерозподілу землі від небагатьох багатьом, аграрна система Хунані стала справжньою зіркою серед аграрних регіонів Китаю. Спроби старих еліт зупинити прогрес виявилися марними — їхня влада значно послабла."

 HNN_peasant_oriented_self_sufficient_economy: "Орієнтована на селян самодостатня економіка"
 HNN_peasant_oriented_self_sufficient_economy_desc: "На щастя, завершення та інтеграція економічних реформ Хунані дали фантастичний результат. З новим фокусом на інтересах провінції, економіка набула унікального селянського спрямування. Пріоритетність потреб селянства та робітників дозволила всім хунанцям нарешті отримати довгоочікуваний перепочинок від нескінченної праці за мізерні крихти, які їм кидали з «доброї волі» іноземні фінансисти та шляхта. Зі стабільним економічним сектором Хунань процвітатиме посеред хаосу Ери мілітаристів."

 HNN_revitalised_export_oriented_economy: "Оновлена експортоорієнтована економіка"
 HNN_revitalised_export_oriented_economy_desc: "Завершення економічних реформ Хунані дало фантастичний результат. Завдяки прагненню перетворити провінцію на економічний центр, фінансова система набула сучасного індустріального вигляду. Хунань тепер суперничає з економічною міцдю Ліги та Фентяню, не маючи при цьому сумнівних зобов'язань. Безмежні можливості чекають на хунанську капіталістичну утопію."

 HNN_peasant_oriented_export_oriented_economy: "Орієнтована на селян експортна економіка"
 HNN_peasant_oriented_export_oriented_economy_desc: "Попри те, що деякі ідеологічні фанатики назвали б це сумішшю суперечливих принципів, реформи створили еклектичну експортну економіку з пріоритетом на селянство. Селяни чесно працюють у полі, а їхня продукція перетворюється на одяг чи предмети розкоші для міжнародних ринків. Ця меритократична модель гарантує, що і робітники, і селяни розділять успіх провінції."

 HNN_revitalised_self_sufficient_economy: "Оновлена самодостатня економіка"
 HNN_revitalised_self_sufficient_economy_desc: "Завдяки двосторонньому підходу до управління, економіка Хунані отримала дві опори. З одного боку — поміркована земельна реформа, що зрівняла шанси шляхти та селян. З іншого — розвиток міських центрів та повний державний контроль над критичними галузями. Фінансова ситуація покращилася: уряд бачить приплив доходів, а народ відчуває зростання добробуту. Відновлення Хунані — це взірець успіху."

 HNN_balancing_the_books_idea: "Балансування бюджету"
 HNN_balancing_the_books_idea_desc: "Шляхом критичної оцінки, очищення від корупції, усунення зайвих витрат та скорочення бюджету, уряд проходить період інтенсивного економічного балансування. Завдяки нашим зусиллям ситуація в регіоні має покращитися настільки, щоб повернути процвітання, навіть ціною періоду тяганини в бюрократичному болоті."

 HNN_seized_foreign_assets: "Конфісковані іноземні активи"
 HNN_seized_foreign_assets_desc: "Відповідно до курсу на економічну незалежність Хунані, уряд провів націоналізацію та вилучення стратегічних галузей промисловості з рук імперіалістів. Державна скарбниця швидко наповнюється, а в економіці спостерігається невеликий бум, навіть попри втечу іноземних інвесторів."

 HNN_subsidised_military_industry: "Субсидована військова промисловість"
 HNN_subsidised_military_industry_desc: "Вважаючи Хунань оплотом процвітання Чжилі, губернатор Тан Сянмін використав свої зв'язки в центральному уряді, щоб залучити військово-промислових магнатів для будівництва нових заводів озброєння. Хунань має стати центром виробництва зброї, що не поступатиметься арсеналам Хубею чи Шаньсі."

 HNN_open_for_business: "Відкриті для бізнесу"
 HNN_open_for_business_desc: "З новою ініціативою щодо відкриття ринків для іноземних інвестицій, Хунань побачила потік підприємницьких проектів від місцевих та міжнародних капіталістів. Економіка переживає успіх, хоча державний апарат ледве встигає обробляти потреби бізнесменів через складні бюрократичні процедури."

 HNN_union_government_synergy: "Синергія профспілок та уряду"
 HNN_union_government_synergy_desc: "Діалог із профспілками Чанші призвів до угоди: уряд обіцяє пріоритет добробуту робітників у межах курсу на самодостатність, а профспілки натомість забезпечують значне зростання продуктивності праці."

 HNN_industrial_self_sufficiency_idea: "Промислова самодостатність"
 HNN_industrial_self_sufficiency_idea_desc: "І критики, і союзники погодяться: нова економіка Хунані — це суто хунанське творіння. Вона більше не залежить від великих фракцій на кшталт Ліги, а стоїть на власних ногах, працюючи перш за все для народу провінції. Ця стійкість дозволить витримати будь-які економічні потрясіння в майбутньому."

 HNN_industrial_self_sufficiency_aat_idea: "Промислова самодостатність"
 HNN_industrial_self_sufficiency_aat_idea_desc: "І критики, і союзники погодяться: нова економіка Хунані — це суто хунанське творіння. Вона більше не залежить від великих фракцій на кшталт Ліги, а стоїть на власних ногах, працюючи перш за все для народу провінції. Ця стійкість дозволить витримати будьякі економічні потрясіння."

 HNN_harmonious_land_development: "Гармонійний розвиток землі"
 HNN_harmonious_land_development_desc: "Наші економічні ініціативи принесли успіх, і уряд досяг нового рівня «гармонії» в аграрному секторі. Виробництво тепер орієнтоване не лише на ринок, а й на потреби людей. Хунань досягла ідеальної форми управління сільським господарством."

 HNN_peasant_councils: "Селянські ради"
 HNN_peasant_councils_desc: "Політика підтримки селянства дозволила створити місцеві селянські ради, які служать противагою політичному контролю шляхти. Організація рад та підтримка з боку Чанші забезпечили уряду хвилю патріотизму та політичної підтримки по всій провінції."

### Politics

 ## Tang Xiangming

 HNN_lingering_kmt_insurgents: "Залишки повстанців Гоміньдану"
 HNN_lingering_kmt_insurgents_desc: "Попри нашу перемогу над Гоміньданом, у Хунані все ще існують осередки повстанців. Губернатору Тан Сянміну та його силам знадобляться злагоджені зусилля, щоб остаточно викорінити останніх прибічників Гоміньдану з нашої провінції."

 HNN_turbulent_intelligentsia: "Бунтівна інтелігенція"
 HNN_turbulent_intelligentsia_desc: "Захопивши владу в Хунані, ми переспрямували кошти, які раніше надавалися інтелігенції провінції, на більш важливі потреби. Це, разом із суворим характером нашого режиму, налаштувало численну інтелігенцію Хунані проти нас, що гальмує наш розвиток, доки ми не розправимося з нелояльними інтелектуалами."

 HNN_martial_law: "Воєнний стан"
 HNN_martial_law_desc: "Щоб належним чином розгромити повстанців Гоміньдану, яким вдалося вижити після перших сутичок, губернатор оголосив воєнний стан. Хоча стороннім і особливо іноземним спостерігачам це може здатися жорстоким заходом, він необхідний для безпеки громадян Хунані — це єдиний спосіб завадити гоміньданівцям грабувати села."

 HNN_eradicated_opposition: "Викорінена опозиція"
 HNN_eradicated_opposition_desc: "Зі знищенням Гоміньдану та приборканням «демократичних» союзників попереднього губернатора, Тан Сянмін успішно ліквідував будь-яку опозицію кліці Чжилі та власному правлінню. Дехто запитує, чи означає це кінець воєнного стану, але сумна правда полягає в тому, що Хунань все ще має багато зовнішніх ворогів і перебуває під постійною загрозою."

 HNN_defence_commission: "Комісія оборони — §LСтворена§!"
 HNN_defence_commission_desc: "«Комісія з оборони провінції Хунань», або скорочено Комісія оборони — це нещодавно створений урядовий орган, що надає губернатору Тану широкі повноваження у «будь-яких питаннях, пов'язаних з обороною Хунані». Губернатор швидко скористався цією владою, щоб гарантувати безпеку кожному громадянину."

 HNN_defence_commission_2: "Комісія оборони — §gРозширені повноваження§!"
 HNN_defence_commission_2_desc: "Повноваження Комісії оборони були нещодавно розширені: тепер вони охоплюють як внутрішні, так і зовнішні загрози. Це дає губернатору величезну владу над внутрішніми справами провінції — звісно ж, заради безпеки."

 HNN_defence_commission_3: "Комісія оборони — §PПравління декретами§!"
 HNN_defence_commission_3_desc: "Повноваження Комісії стали настільки широкими, що губернатор Тан Сянмін фактично може правити за допомогою декретів. Йому навіть не потрібна асамблея як формальний орган для схвалення його рішень."

 HNN_alliance_with_the_diarchy: "Альянс із діархією"
 HNN_alliance_with_the_diarchy_desc: "Після нещодавніх переговорів з діархією в західній Хунані губернатор Тан дійшов з ними згоди. Їхні знання регіону будуть безцінними для планування оборони провінції."

 HNN_consolidating_power: "Консолідація влади"
 HNN_consolidating_power_desc: "Оскільки наше прохання про похід на південь було відхилено керівництвом Чжилі, ми зосередили зусилля на зміцненні контролю всередині Хунані, як того вимагає центр."

 HNN_joint_drills_with_guizhou: "Спільні навчання з Гуйчжоу"
 HNN_joint_drills_with_guizhou_desc: "Ми провели спільні навчання з військами губернатора Гуйчжоу Юань Цзуміня. Його суворі методи підготовки допомогли нашим солдатам стати більш уважними та активними у вдосконаленні своїх навичок."

 HNN_rural_loyalty_ensured: "Лояльність сіл гарантована"
 HNN_rural_loyalty_ensured_desc: "Сільські реформи нашої адміністрації вгамували невдоволення селянства, зробивши його покірним і прихильним до нового режиму, що забезпечило стабільність нашої влади."

 HNN_yueyang_reforms: "Юеянські реформи"
 HNN_yueyang_reforms_desc: "Ми поширили Юеянські реформи Тан Хуалуна на решту Хунані. Ці заходи дозволили задобрити міських робітників та приборкати заворушення у великих містах, значно стабілізувавши режим."

 HNN_socialism_vanquished: "Соціалізм переможений"
 HNN_socialism_vanquished_desc: "Завдяки реформам Тан Хуалуна та репресіям Тан Сянміна підтримка соціалізму в Хунані швидко тане. Оскільки вплив Гоміньдану та китайських синдикалістів слабшає, влада нашого губернатора з кожним днем стає все міцнішою."

 HNN_safe_and_secure: "У безпеці та спокої"
 HNN_safe_and_secure_desc: "Губернатор Тан Сянмін гарантував дві речі: безпеку та порядок. Уклавши союз із діархією Сянсі та розгромивши соціалістичних терористів, він консолідував владу через Комісію оборони. Тепер він може бути впевнений у непохитності свого залізного контролю над Хунанню."

 # Чжао Хенті

 HNN_a_democratic_province_2: "Конституційна спадщина"
 HNN_a_democratic_province_2_desc: "На відміну від інших провінцій, Хунань унікальна тим, що має конституцію. Оприлюднена Чжао Хенті 1 січня 1922 року, вона покликана захищати права кожної людини. Вона гарантує вільні вибори провінційної ради та губернатора. Чжао вдалося налагодити співпрацю з асамблеєю, проте «доктрина Монро» для Хунані все ще діє, і її зміна потребує подальших переговорів."

 HNN_a_democratic_province_3: "Конституційна спадщина"
 HNN_a_democratic_province_3_desc: "Конституція Хунані обіцяє вільні вибори та захист прав громадян. Завдяки успішним переговорам Чжао не лише змусив асамблею працювати на користь провінції, а й переглянув «доктрину Монро», що дозволило Хунані підтримати процес возз’єднання Китаю."

 HNN_peasant_support_weak: "Підтримка селян: §RСлабка§!"
 HNN_peasant_support_weak_desc: "Наші зусилля з налагодження зв'язків із селянами ще не принесли значного успіху, але ми повільно, проте впевнено починаємо завойовувати прихильність простого люду."

 HNN_peasant_support_growing: "Підтримка селян: §OЗростає§!"
 HNN_peasant_support_growing_desc: "Завдяки підтримці місцевих селянських організацій наш авторитет серед селянства почав зростати. Коли люди побачили, що ми пропонуємо не лише обіцянки, підтримка радикалів нарешті пішла на спад."

 HNN_peasant_support_strong: "Підтримка селян: §CСильна§!"
 HNN_peasant_support_strong_desc: "З покращенням сільської інфраструктури та повсякденного життя, все більше селян підтримують або принаймні толерують наш уряд. Оскільки Гоміньдан втратив свою головну опору, він навряд чи знову стане серйозною загрозою для демократії Хунані."

 HNN_bolstered_intellectual_hub: "Посилений інтелектуальний центр"
 HNN_bolstered_intellectual_hub_desc: "Під патронатом губернатора Чжао Хенті інтелігенція Хунані стала ще впливовішою. Можна без перебільшення сказати, що Чанша стала одним із найкращих місць для китайського інтелектуала."

 HNN_robust_academic_infrastructure: "Міцна освітня інфраструктура"
 HNN_robust_academic_infrastructure_desc: "Цього року в селах відкриється багато нових шкіл. Разом із нашою чисельною інтелігенцією це забезпечило провінції одну з найкращих освітніх мереж у Китаї. Розширення сільських шкіл також дало роботу багатьом місцевим інтелектуалам, зменшивши навантаження на бюджет."

 HNN_basic_welfare: "Базове соціальне забезпечення"
 HNN_basic_welfare_desc: "У межах боротьби проти впливу Гоміньдану ми впровадили базову систему соціального забезпечення, включаючи допомогу з безробіття. Ці реформи зменшили невдоволення серед бідних верств населення, знизивши ймовірність їхнього голосування за автократичних популістів."

 HNN_peace_with_the_unions: "Мир із профспілками"
 HNN_peace_with_the_unions_desc: "Наші відносини з профспілками, особливо в часи перебування в Лізі, були складними. Але ці дні минули — лідери профспілок позитивно відреагували на пропозицію Чжао. Після напружених переговорів було досягнуто миру, який має стати фундаментом для кращих відносин між урядом та робітниками."

 HNN_building_federalism_at_home: "Розбудова федералізму"
 HNN_building_federalism_at_home_desc: "Ми зосередили зусилля на розбудові місцевої демократії згідно з федералістськими традиціями, одночасно допомагаючи центральному уряду в його намаганнях об'єднати Китай."

 HNN_rights_guaranteed: "Гарантія прав"
 HNN_rights_guaranteed_desc: "Губернатор Чжао публічно гарантував дотримання прав кожного мешканця Хунані. Хоча це ще не закріплено законодавчо, такий крок чітко вказує на демократичний напрямок його правління."

 HNN_bill_of_rights: "Білль про права"
 HNN_bill_of_rights_desc: "Тепер Білль про права офіційно закріплений у законах Хунані. Він гарантує свободу слова, право на зібрання та інші свободи. Цей крок привітали видатні демократичні мислителі країни, як-от Ху Ші та Чжан Цзюньмай, назвавши його першим кроком до загальнонаціональної демократії."

 HNN_legislative_debates: "Законодавчі дебати"
 HNN_legislative_debates_desc: "У Провінційній асамблеї заохочується практика активного обговорення кожного законопроєкту. Культура дебатів змушує представників відповідальніше ставитися до голосування та оживляє нашу молоду демократію."

 HNN_diarchy_influence_curbbed: "Вплив діархії обмежено"
 HNN_diarchy_influence_curbbed_desc: "Хоча ми не можемо повністю усунути західну діархію, нам вдалося підірвати їхню базу влади достатньо, щоб приборкати їхні найбільші зловживання. Демократія Хунані більше не залежатиме від примх дрібних мілітаристів."

 HNN_democratic_traditions: "Демократичні традиції"
 HNN_democratic_traditions_desc: "Наша демократія ще молода, але ми вже заклали міцний фундамент. Завдяки Біллю про права та жвавим дебатам в асамблеї, політична система Хунані стає прикладом для всіх інших провінцій Китаю."

 HNN_democratic_stronghold: "Оплот демократії"
 HNN_democratic_stronghold_desc: "Під керівництвом губернатора Чжао Хунань стала сяючим маяком демократії в Китаї! Антидемократичний опір придушено, створено освітню систему та Білль про права. Ми замирилися з профспілками та заручилися підтримкою селян. Попри турбулентне майбутнє, Хунань залишається світлою плямою в ці темні часи."

##Kuomintang

 HNN_the_western_diarchy_3_desc: "Західна частина Хунані опинилася в стані облоги та ізоляції після перемоги Гоміньдану над силами Тан Сянміна та Чжао Хенті. Діархія Тянь Інчжао та Чень Цюйчженя, що діє як окрема провінція мілітаристів, на кожному кроці протидіє впливу Гоміньдану, фактично ведучи кампанію за відокремлення. На захід від них стара кліка Гуйчжоу під егідою Юань Цзуміня так само заблокувала свою частину регіону. Їхні запеклі зусилля продовжують паралізувати наше управління."

 HNN_local_militias: "Місцеві ополчення"
 HNN_local_militias_desc: "Місцеві ополчення, які вважалися невід'ємною частиною попередніх адміністрацій Хунані, є деспотичними угрупованнями, подібними до загонів дрібних мілітаристів. Командири цих ополчень у деяких повітах повністю перебувають під контролем місцевих еліт. Гірше того, якість цих загонів сильно різниться. Якщо Хунань справді хоче вирватися з пазурів Бейяну, проблему ополчення необхідно вирішити."

 HNN_popular_support_desc: "Гоміньдан може мати демократичні та популістські ідеали, але йому ще належить пройти довгий шлях, щоб втілити їх у життя. Для селян і робітників Хунані вже з’являлося чимало мрійників з утопічними обіцянками, проте мало хто їх виконував. Якщо партія хоче завоювати серця людей, вона має спочатку врятувати пригноблених простолюдинів від їхніх вічних злиднів.\n\nЗнадобиться тривалий період державотворення та ретельної політики, щоб народ Хунані визнав провінційний уряд легітимним. Поки що багато хто бачить у Гоміньдані лише чергову зміну одного силовика-мілітариста на іншого."

 HNN_popular_support_1: "Легітимність партії: §RЖахлива§!"
 HNN_popular_support_1_desc: "$HNN_popular_support_desc$"

 HNN_popular_support_2: "Легітимність партії: §nЗростає§!"
 HNN_popular_support_2_desc: "$HNN_popular_support_desc$"

 HNN_popular_support_3: "Легітимність партії: §GПровінційний уряд§!"
 HNN_popular_support_3_desc: "$HNN_popular_support_desc$"

 HNN_popular_support_for_the_peasants_and_workers: "Легітимність партії: §SЗадля селян і робітників§!"
 HNN_popular_support_for_the_peasants_and_workers_desc: "Тепер, коли контроль Тан Шенчжи над провінцією закріплено, робітники та селянство Хунані зможуть реалізувати свій справжній потенціал. Більше ними не будуть маніпулювати еліти, автократи та шляхта, прагнучи отримати вигоду з їхніх нещасть. Хунань крокуватиме в ногу з усією країною заради об'єднання нації, а Тан стане її прапороносцем."

 HNN_popular_support_the_nations_revival: "Легітимність партії: §gВідродження нації§!"
 HNN_popular_support_the_nations_revival_desc: "Завдяки тому, що Чен Цянь спрямував провінцію до поміркованості та порятунку від хвиль насильницької революції, роль Хунані в Національній революції остаточно закріплена. Шляхом проведення місцевих виборів та співпраці з незалежними республіканцями, майбутнє нації виглядає світлим, поки Чен Цянь залишається при владі."

 HNN_universal_education_efforts: "Зусилля щодо загальної освіти"
 HNN_universal_education_efforts_desc: "Поширення загальної освіти серед бідних і пригноблених верств Хунані вимагає величезних витрат, але ця мета варта будь-яких жертв, на які доводиться йти провінційному уряду. Проте ідеали та вірування не скасовують того навантаження, яке ці витрати накладають на наше управління."

 HNN_universal_education: "Загальна освіта"
 HNN_universal_education_desc: "Завдяки майстерному впровадженню ретельних освітніх програм та швидкому розширенню шкіл на всіх етапах навчання, рівень грамотності в Хунані помітно зріс. Хоча провінція та країна все ще потерпають від неписьменності в деяких районах, провінційний уряд може пишатися тим, що майбутнє для значної частини населення стало світлішим."

 HNN_centralising_militia_control: "Централізація контролю над ополченням"
 HNN_centralising_militia_control_desc: "Провінційний уряд зробив великі кроки у викоріненні гнилої системи місцевого ополчення. Завдяки розширенню повноважень Управління охорони спокою, Хе Цзянь зміг об’єднати місцеві загони та сільське ополчення під керівництвом єдиного бюро. Ополченці швидко підпорядковуються волі партії."

 HNN_peace_preservation_corps: "Корпус охорони спокою"
 HNN_peace_preservation_corps_desc: "Не вагаючись у застосуванні своєї влади, Хе Цзянь почав втручатися в життя мешканців Хунані через офіси сільського умиротворення та охорони спокою. Занепокоєний активністю місцевих бандитів та соціалістів, він вирішив консолідувати всі підрозділи старого ополчення в єдині дивізії «охорони спокою». Завдяки професійним методам навчання та організації за армійськими стандартами, Хунань буде суворо захищена своєю новою силою."

 HNN_revolutionary_progress_corps: "Корпус революційного прогресу"
 HNN_revolutionary_progress_corps_desc: "Тан Шенчжи впровадив низку заходів для радикалізації та революціонізації корпусів «охорони спокою», створених Хе Цзянем. Вважаючи, що Хе Цзянь прагнув використовувати ці дивізії як власних лояльних поплічників, Тан запровадив програми політичної освіти. Це перетворило ці сили з інструменту реакціонерів на інструмент революціонерів."

 HNN_a_reformed_administration: "Реформована адміністрація"
 HNN_a_reformed_administration_desc: "Після десятиліть безгосподарності та корупції з боку мілітаристів і місцевих тиранів, адміністрація Хунані потребувала докорінних реформ. Завдяки розбудові місцевого управління та впровадженню системи іспитів для повітових магістратів, місцева бюрократія нарешті починає процвітати."

 HNN_a_peoples_administration: "Народна адміністрація"
 HNN_a_peoples_administration_desc: "Хоча спочатку планувалося лише реформувати існуючу бюрократію, Тан Шенчжи вирішив повністю революціонізувати структуру управління. Це гарантує, що місцеві чиновники суворо дотримуватимуться справжніх принципів Гоміньдану."

 HNN_public_safety_bureau: "Бюро громадської безпеки"
 HNN_public_safety_bureau_desc: "Створене за наказом голови провінції, Бюро громадської безпеки покликане проводити лінію партії в питаннях внутрішньої безпеки. Воно також розбудовує мережу контррозвідки та шпигунства для захисту національної революції від ворогів."

 HNN_intellectual_safehaven: "Притулок для інтелектуалів"
 HNN_intellectual_safehaven_desc: "Завдяки зусиллям Чжао Хенті Хунань перетворилася на одне з небагатьох місць у Китаї, де панує інтелектуальна свобода. Наша співпраця з мислителями, багато з яких поділяють ідеї Гоміньдану, посилила науковий потенціал провінції. Хунань справді стала науковою скарбницею нації."

 HNN_assurances_of_dangguo: "Принципи Данго"
 HNN_assurances_of_dangguo_desc: "Постійні чвари та опозиція в колишній провінційній асамблеї наочно продемонстрували потребу в авангардній партії, здатній вести народ Хунані до демократичного ідеалу. Основоположний принцип ідеології Гоміньдану — інститут Данго, або Партійної держави — необхідний для успішного завершення Національної революції."

 HNN_nationalist_youth_organisations: "Націоналістичні молодіжні організації"
 HNN_nationalist_youth_organisations_desc: "Доктор Сунь Ятсен вірив, що саме молодь має брати участь у національній революції. Молодь — це фундамент майбутнього, і дух китайського націоналізму має передаватися наступним поколінням. Через націоналістичні організації ми залучаємо хлопців та дівчат до вивчення трьох народних принципів доктора Суня."

 HNN_scientific_advancement: "Науковий прогрес"
 HNN_scientific_advancement_desc: "Тільки через рішучу віру в науковий прогрес Китай зможе знайти свій порятунок. Як стверджували видатні філософи Гоміньдану, вчений клас має нести просвіту трудящим класам. Уряд інвестує в наукові дослідження заради розвитку китайського народу."

 HNN_belief_in_minsheng: "Віра в Міньшен"
 HNN_belief_in_minsheng_desc: "Через брак інфраструктури для втілення принципу Міньшен (народного добробуту), уряд розпочав будівництво шосейних доріг та залізниць. Революціонізуючи систему охорони здоров'я старого Китаю, Хунань демонструє зростання рівня життя для всіх своїх громадян."

 HNN_expanded_social_services: "Розширені соціальні послуги"
 HNN_expanded_social_services_desc: "Прагнучи до модернізації, Шоста армія розширила можливості провінції щодо забезпечення населення. За підтримки дорадчого комітету Хе Цзяня, роль мешканців Хунані в Національній революції надійно закріплена. Хоча це не так радикально, як хотіла б Восьма армія, це дозволило уникнути хаосу."

 HNN_supporting_unions: "Підтримка профспілок"
 HNN_supporting_unions_desc: "Дотримуючись політики Єдиного фронту, провінційний уряд Хунані обрав шлях відкритої підтримки профспілок Чанші, зміцнюючи зв'язки Гоміньдану з місцевим відділенням Китайської синдикалістської партії. Ми зробили великі кроки для покращення життя робітників у провінції."

 HNN_local_democratic_elections: "Місцеві демократичні вибори"
 HNN_local_communes: "Місцеві комуни"

 HNN_rule_of_the_kuomintang_cheng_1: "Правління Гоміньдану"
 HNN_rule_of_the_kuomintang_cheng_1_desc: "Правління Гоміньдану в Хунані стало непохитним. Завдяки масштабним реформам стара провінція не йде ні в яке порівняння з новою. Партія завоювала серця людей і принесла революційну модернізацію. Стаючи дороговказом для народу, вона відкриває перед нацією справді оптимістичне майбутнє."

 HNN_rule_of_the_kuomintang_cheng_2_desc: "$HNN_rule_of_the_kuomintang_cheng_1_desc$"
 HNN_rule_of_the_kuomintang_cheng_3_desc: "$HNN_rule_of_the_kuomintang_cheng_1_desc$"
 HNN_rule_of_the_kuomintang_cheng_4_desc: "$HNN_rule_of_the_kuomintang_cheng_1_desc$"
 HNN_rule_of_the_kuomintang_cheng_5_desc: "$HNN_rule_of_the_kuomintang_cheng_1_desc$"
 HNN_rule_of_the_kuomintang_cheng_6_desc: "$HNN_rule_of_the_kuomintang_cheng_1_desc$"
 HNN_rule_of_the_kuomintang_cheng_7_desc: "$HNN_rule_of_the_kuomintang_cheng_1_desc$"
 HNN_rule_of_the_kuomintang_cheng_8_desc: "$HNN_rule_of_the_kuomintang_cheng_1_desc$"

 HNN_rule_of_the_kuomintang_tang_1: "Правління Гоміньдану"
 HNN_rule_of_the_kuomintang_tang_1_desc: "Досягнувши свого зеніту, правління Гоміньдану в Хунані стало непохитним. Завдяки низці масштабних реформ стара провінція цілковито тьмяніє порівняно з новою. Зрештою, партія завоювала серця народу та селянства, принісши нову революційну боротьбу в життя нації. Діючи як народна сила, партія та селянство крокують вперед у повній гармонії."

 HNN_rule_of_the_kuomintang_tang_2_desc: "$HNN_rule_of_the_kuomintang_tang_1_desc$"
 HNN_rule_of_the_kuomintang_tang_3_desc: "$HNN_rule_of_the_kuomintang_tang_1_desc$"
 HNN_rule_of_the_kuomintang_tang_4_desc: "$HNN_rule_of_the_kuomintang_tang_1_desc$"
 HNN_rule_of_the_kuomintang_tang_5_desc: "$HNN_rule_of_the_kuomintang_tang_1_desc$"
 HNN_rule_of_the_kuomintang_tang_6_desc: "$HNN_rule_of_the_kuomintang_tang_1_desc$"
 HNN_rule_of_the_kuomintang_tang_7_desc: "$HNN_rule_of_the_kuomintang_tang_1_desc$"
 HNN_rule_of_the_kuomintang_tang_8_desc: "$HNN_rule_of_the_kuomintang_tang_1_desc$"

 HNN_revolution_in_the_countryside_idea: "Революція в селах"
 HNN_revolution_in_the_countryside_idea_desc: "Завдяки тісній співпраці з місцевими селянськими організаціями та масштабній пропаганді, Гоміньдану вдалося мобілізувати маси Хунані з небаченою силою. Налаштоване захищати провінцію будь-якою ціною, селянство розпочало власну форму національної революції під пильним наглядом партії."

 HNN_training_new_cadres: "Підготовка нових кадрів"
 HNN_training_new_cadres_desc: "Потоки нових членів Гоміньдану входять до Провінційної політичної та офіцерської академії. Навчаючись за програмою начальника Тан Шенчжи, молоді кадри вивчають «три народні принципи» доктора Суня. Подібно до Вампу, ця академія має на меті підготувати нове покоління революціонерів. Унікальною рисою програми є буддійська філософія та чесноти самого Тан Шенчжи, що прищеплюють офіцерам глибоке почуття моралі та обов'язку."

 HNN_cooperation_with_the_CSP: "Співпраця з Китайською синдикалістською партією"
 HNN_cooperation_with_the_CSP_desc: "Помірковані в 6-й армії та загалом у правому Гоміньдані відкололися від лівих через одне питання: Єдиний фронт із Китайською синдикалістською партією. Відкидаючи революційне братерство, праві вважають свою інтерпретацію «трьох народних принципів» єдино правильною, не заплямованою класовою боротьбою. Проте вони не бачать вигоди від співпраці братніх партій. Продемонструймо світові революційну єдність Гоміньдану та КСП задля майбутнього всіх трудящих!"

 HNN_consolidating_our_rule: "Зміцнення нашої влади"
 HNN_consolidating_our_rule_desc: "Побоювання Чжао повністю присвятити себе революційній боротьбі стали його крахом. Якби він не обрав федералістські ідеали Чень Цзюнміна, можливо, він став би гідним товаришем по Гоміньдану. Тепер, коли Чжао та його союзники-мілітаристи пішли, ми маємо викорінити всі залишки корумпованого федералістського правління."

 HNN_support_CHI_idea: "Підтримка Міньганьського повстання"
 HNN_support_CHI_idea_tt: "(§Y[CHI.GetNameWithFlag]§!) $volunteer_limit_plus_two_tt$"

