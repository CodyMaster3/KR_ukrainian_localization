 HNN_repudiate_the_canton_squatters_independent: "Зречення кантонських самозванців"
 HNN_repudiate_the_canton_squatters_independent_desc: "Хоча ми закріпили Хунань за Національною революцією та Гоміньданом, здається, що наші революційні брати та сестри в інших місцях похитнулися. Ми не дамо мрії померти тут! На півдні засідли підступні самозванці в «революційному П'ємонті» доктора Суня. Іронічно, що ми багато разів намагалися вийти на північ із Гуандуна, але тепер мусимо йти на південь, щоб відбити революційне місто."

 HNN_repudiate_the_canton_squatters_puppet: "Наша роль у грі"
 HNN_repudiate_the_canton_squatters_puppet_desc: "Хунань була лише гвинтиком на великому полі битви Ери мілітаристів. Хоча ми зробили її стійкою революційною провінцією, боротьба ще не закінчена. Наші покровителі та союзники продовжують свою справу, і ми мусимо виконати свій обов'язок перед ними. Проте чому б спершу не підтвердити їм нашу відданість альянсу?"

 HNN_southern_heir_to_beiyang_puppet: "Маршал Південного Заходу"
 HNN_southern_heir_to_beiyang_independent: "Південний спадкоємець Бейяну"

 HNN_southern_heir_to_beiyang_puppet_desc: "Продемонструвавши неабиякий інтелект і здібності адмірала Тан Сянміна, посадовці центрального уряду прийняли його план захоплення потужних провінцій Гуандун і Гуансі. Тепер, коли вони під нашим контролем, давайте працювати над тим, щоб підпорядкувати губернатору весь Південний Захід."
 HNN_southern_heir_to_beiyang_independent_desc: "Із захопленням Гуанчжоу ми маємо легітимність оголосити себе претендентами на національне об'єднання, і ми це зробимо! Ми — справжні спадкоємці Бейянської республіки! Смерть фальшивим претендентам і зрадникам на півночі!"

 HNN_academy_desc_zhao: "Найбільше вогнище революційних настроїв на південному заході — окрім, хіба що, Вампу — Військова академія Куньміна показала себе справжнім взірцем того, як має виглядати військовий істеблішмент Китайської Республіки. Віддані духом, витривалі в тренуваннях і вірні девізу «терпіти труднощі, в яких полягає основа реформ», ми відкриємо в Чанші нову академію, побудовану на принципах Куньміна."
 HNN_academy_desc_kmt: "Будучи однією з нових військових академій у країні, академія Вампу чудово впоралася зі своїм завданням. Завдяки інтенсивній політичній підготовці та чудовим інструкторам, вона змогла швидко створити елітні сили. З девізом «Братерство, Відданість, Щирість», давайте перенесемо цей дух у нову академію Чанші."
 HNN_academy_desc_tang: "Будучи стовпом міцності Бейянського уряду, військова академія Баодіна виховала одні з найвидатніших умів нації. Це свідчення того, яких блискучих командирів може підготувати такий заклад. З девізом «Будь вірним, Будь пунктуальним, Навчайся наполегливо, Тренуйся старанно», ми відкриємо нову сторінку військової освіти в Хунані."
 HNN_a_new_academy_desc_fallback: "Як доводять приклади Куньміна, Баодіна чи Вампу, армія здатна настільки, наскільки здатні її командири, а командири формуються в навчальних класах. Давайте створимо власну військову академію в Чанші, щоб підготувати власні кадри геніальних офіцерів."

 HNN_pinnacle_of_the_new_army_zhao: "Вершина Сянської армії"
 HNN_pinnacle_of_the_new_army_tang: "Вершина Нової армії"

 HNN_pinnacle_of_the_new_army_zhao_desc: "Хто б міг подумати. Не армії Чжилі чи Юе, і навіть не Національно-революційна армія, а саме Сянська армія губернатора Чжао Хенті стала провідною силою в країні. Завдяки нашій відданості демократії та закону, ці збройні сили викликають повагу, а не осуд."
 HNN_pinnacle_of_the_new_army_tang_desc: "Вважаючи це своїм обов’язком перед нацією або своїми покровителями в Пекіні, губернатор Тан Сянмін подбав про те, щоб провінційна армія Хунані стала справжнім втіленням «армій нового зразка», заснованих Юань Шикаєм. Під керівництвом Тана вороги пізнають справжню міць нашої сили."

 HNN_fostering_national_reconstruction_kmt: "Початок національної відбудови"
 HNN_fostering_national_reconstruction_nokmt: "Сприяння середньому класу"

 HNN_fostering_national_reconstruction_loc_desc_kmt: "Дотримуючись третього етапу Національної революції доктора Суня, влада в Хунані зробила великі кроки на шляху до завершення його місії. Хоча економісти на кшталт Сун Цзивеня не можуть допомогти нам прямо, ми розробимо власний план відбудови для інтеграції з рештою країни."
 HNN_fostering_national_reconstruction_loc_desc_nokmt: "Завдяки промисловим реформам різні класи провінції відчувають ріст мобільності, небачений в Еру мілітаристів. Колишні наймити тепер мають заощадження, що веде до появи середнього класу. В наших інтересах підтримати цей розвиток."

