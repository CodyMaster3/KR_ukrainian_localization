 #Hunan Election Category
 HNN_elections_category: "Провінційні вибори в Хунані"
 HNN_elections_category_desc: "Відданий федералістським ідеалам, §cЧжао Хенці§! вирішив провести заплановані на цей рік вибори, попри хаос після колапсу ліги. Спочатку планувалося, що основними суперниками будуть §cвін сам§! та §mліберальні§! §lкандидати§!, проте прибуття генералів Національно-революційної армії §SТана Шенчжі§! та §aЧен Цяня§! докорінно змінило розклад сил. Оскільки обидва кандидати від §aГМД§! лише трохи відстають від §cЧжао Хенці§! в опитуваннях, результат виборів залишається непередбачуваним.\n\nПідтримка §cЧжао Хенці§!: [?HNN_zhao_election_percentage_var|c%]\n\nПідтримка §SТана Шенчжі§!: [?HNN_tang_election_percentage_var|S%]\n\nПідтримка §aЧен Цяня§!: [?HNN_cheng_election_percentage_var|g%]\n\nЗагальна підтримка §RГоміньдану§!: [?HNN_kmt_election_percentage_var|R%]"

 HNN_add_zhao_votes: "Агітувати за Чжао Хенці"
 HNN_add_zhao_votes_desc: "Попри статус фаворита, рейтинги Чжао виявилися нижчими за очікувані. Ми маємо подвоїти зусилля в агітації, аби забезпечити його перемогу на прийдешніх виборах!"

 HNN_add_chen_votes: "Агітувати за Чен Цяня"
 HNN_add_chen_votes_desc: "Як «темна конячка» цих перегонів, Чен Цянь потребує будь-якої переваги. Наша кампанія має зосередитися на його послужному списку, відносно поміркованих поглядах та обіцянках світлого майбутнього для Хунані!"

 HNN_add_tang_votes: "Агітувати за Тана Шенчжі"
 HNN_add_tang_votes_desc: "Хоча Тан Шенчжі не є лідером опитувань, його перемога цілком реальна. Необхідно задіяти всі ресурси: наголошувати на перевагах його програми, земельній реформі та підтримці профспілок і КСП."

 HNN_remove_zhao_votes: "Агітувати проти Чжао Хенці"
 HNN_remove_zhao_votes_desc: "Як чинний губернатор, Чжао Хенці є головним претендентом на перемогу. Нам слід зосередити критику на його зв'язках із лігою та юеянським гарнізоном."

 HNN_remove_chen_votes: "Агітувати проти Чен Цяня"
 HNN_remove_chen_votes_desc: "Націоналістичні гасла Чен Цяня несподівано знайшли відгук у виборців. У відповідь ми маємо нагадати, що його коротке губернаторство призвело до приходу до влади Чжан Цзін'яо, а також вказати на його причетність до насильства на заході."

 HNN_remove_tang_votes: "Агітувати проти Тана Шенчжі"
 HNN_remove_tang_votes_desc: "Заклики Тана Шенчжі поставити селян на перше місце стали вельми популярними. Нам слід викрити його опортуністичну натуру та готовність зрадити будь-кого заради власної вигоди."

