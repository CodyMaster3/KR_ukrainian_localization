 HNN_zhili_clique: "Чжилійська кліка"
 HNN_zhili_clique_long: "Чжилійська кліка (Zhili Xi Junfa)\n§LХунанська гілка чжилійської кліки, що сформувалася з гарнізону губернатора Тана в Юеяні, вірна своєму головнокомандувачу. Складаючись із північан, переважно з рідної провінції Тана Сянміна — Хубею, вони тримаються осторонь від ліги та південних чжилійців, віддаючи перевагу північним чжилійцям у Пекіні та Чунцині. Хоча внутрішнє коло кліки, особливо У Пейфу, часто здається... байдужим до губернатора, його підлеглі визнають його майстерність у бою та в управлінні. Чжилійська кліка в Хунані, незмінно вірна адміралу, є його військовою опорою, готовою розчавити будь-якого опонента залізним каблуком.§!\n"

 HNN_CERA: "Китайська конституційна партія"
 HNN_CERA_long: "Китайська конституційна партія (Xianfa Yanjiu Hui)\n§LКитайська конституційна партія під керівництвом Тана Хуалуна веде свій початок від Прогресивної партії та кола Лян Цічао. Служачи під началом Юань Шикая, фракція Тана намагалася пом'якшити його режим, але після самопроголошення Юаня імператором Тан розчарувався в ньому і порадив зректися престолу. Зі смертю Юаня та піднесенням Дуань Ціжуя вплив Тана Хуалуна згас, і він на кілька років вирушив у подорож світом.\n\nТан повернувся до Китаю у 1927 році, коли його союзник Лян Цічао очолив ТРАК. Він працював у Пекіні, доки його брат, Тан Сянмін, не запросив його до Юеяна, пообіцявши посаду мера. Вигравши вибори, Тан Хуалун створив потужний політичний блок, відомий як «юеянська група», який нині очолює хунанське відділення партії. Коли його брат став губернатором, вони намагаються виступати стримувальною силою, спрямовуючи режим у помірковане русло.§!\n"

 HNN_harmony_association: "Товариство гармонії"
 HNN_harmony_association_long: "Товариство гармонії (Hexie Shetuan)\n§LЗапозичивши назву у однойменної групи в Пекіні, хунанське «Товариство гармонії» є вільним політичним колом навколо губернатора Тана Сянміна. Складаючись переважно з представників місцевої шляхти-ґентрі, товариство має виразно консервативний ухил, хоча й перебуває під впливом Тана Хуалуна та його конституціоналістів. Віддане губернатору, товариство слугує його цивільним крилом, готовим запропонувати політичним опонентам як відкриту долоню, так і міцно стиснутий кулак.§!\n"

 HNN_kuomintang_second_army: "ГМД — 2-га армія"
 HNN_kuomintang_second_army_long: "Гоміньдан — 2-га армія (Guomin Geming Jun Di Er Jun)\n§L2-га армія бере свій початок від сил мілітариста Тань Янькая восени 1923 року, коли доктор Сунь Ятсен підтримав його як командувача хунанської армії розбудови держави. Будучи осередком поміркованої думки в революційному Гоміньдані, бійці 2-ї армії відгукнулися на заклик до боротьби проти бейянських військ. \n\nПід час реорганізації Національно-революційної армії у 1925 році генералісимус Чан Кайші включив сили Таня до складу НРА. Після доблесних боїв під час Північного походу армія була оточена в Хунані, де Чжао Хенці запропонував своєму колишньому командиру Тань Янькаю помилування в обмін на капітуляцію. З приходом Гоміньдану до влади в Хунані Тань Янькай відновив 2-гу армію. Хоча вона позбавлена реальної військової сили, армія є каналом для висловлення думок старих поміркованих лідерів, намагаючись бути посередником між радикальнішими 6-ю та 8-ю арміями.§!\n"

 HNN_rural_pacification: "Управління умиротворення"
 HNN_rural_pacification_long: "Хунанське управління нагляду за сільським умиротворенням (Hunan Qing Xiang Duban)\n§LЦя структура поєднує в собі функції Управління сільського умиротворення та Управління збереження спокою, а її очільником є єдина людина — Хе Цзянь. Після перемоги Гоміньдану на виборах почалися міжусобиці, і Хе Цзянь підлив масла у вогонь, перевівши свою дивізію з 8-ї армії до 6-ї армії Чен Цяня. Здобувши підвищення та нові посади, амбітний генерал взявся за реформування рідної провінції.\n\nОфіційно генерал має вирішити хронічну проблему хунанського сільського ополчення, але фактично він використовує свої сили для значно ширших цілей. Управління лобіює реформи Хе Цзяня, намагаючись заручитися підтримкою Чен Цяня та Тан Шенчжі. Дехто в близькому оточенні генерала вважає, що «король» Хунані містить амбіції посісти крісло голови уряду. У будь-якому разі, управління прагне стабільного врядування... звісно, якщо ви не соціаліст.§!\n"

