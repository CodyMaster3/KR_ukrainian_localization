 #趙恆惕
 HNN_zhao_hengti: "Чжао Хенці"
 HNN_zhao_hengti_bio: "Чжао Хенці був губернатором Хунані понад десять років. Народився у 1880 році в Хен'яні, закінчив 6-й китайський клас Військової академії армії Японії за спеціальністю «артилерія». Він приєднався до Тунменхою під керівництвом Сунь Ятсена і брав участь як військовий командир у Сіньхайській революції та Другій революції. Після поразки останньої був ув'язнений Таном Сянміном за наказом Юань Шикая. Через два роки його звільнив Цай Е, давши під командування першу дивізію Хунані. У 1920 році він разом із Тань Янькаєм вигнав губернатора Чжан Цзін'яо, після чого Тань став губернатором, а Чжао — генеральним директором армії.\n\nПісля заколоту в Пінцзяні Тань пішов у відставку на користь Чжао, який започаткував перший у провінції (і в Азії) конституційний рух, розробивши конституцію провінції Хунань та встановивши виборність губернатора. У 1922 році він переміг на цих виборах. Як губернатор, Чжао добровільно обмежив власну владу, що викликало повагу багатьох. Під час Північного походу його витіснив колишній підлеглий Тан Шенчжі. Чжао звернувся по допомогу до У Пейфу, який відновив його на посаді. Повернувшись, він відновив дію конституції, скасовану Гоміньданом. Хоча Чжао мав найбільшу владу у провінції і фактично не звітував перед Нанкіном, він залишався лояльним до Ліги восьми провінцій, аби уникнути проблем із Німеччиною."
 HNN_zhao_hengti_leader_desc: "§YНародився:§! §L12 січня 1880 року, повіт Хеншань, провінція Хунань, Велика Цін§!\n§YПоходження:§! §L$HNN_zhao_hengti_bio$§!"
 HNN_zhao_hengti_commander_desc: "§YНародився:§! §L12 січня 1880 року, повіт Хеншань, провінція Хунань, Велика Цін§!\n§YПолітична орієнтація:§! §cфедераліст§!\n§YПоходження:§! §L$HNN_zhao_hengti_bio$§!"

 HNN_tang_shengzhi: "Тан Шенчжі"
 HNN_tang_shengzhi_desc_body: "Випускник першого класу Баодінського військового училища, де вивчав піхотну справу. Тан Шенчжі починав як офіцер у губернатора Чжао Хенці. У березні 1926 року він підняв повстання проти Чжао, яке було придушене, що змусило Тана тікати до Ґуанчжоу. Там його прийняли з розпростертими обіймами, а його війська переформували у 8-му армію НРА. Вони проявили себе як одна з найбоєздатніших частин Гоміньдану, вибивши Чжао з Хунані та навіть здобувши перемоги над У Пейфу. Проте революція була розгромлена після німецького втручання, що призвело до загибелі Чан Кайші та втечі Центрального комітету до Парижа. Тан із 8-ю армією відступив у гори Цзянсі та Фуцзяня, де роками чинив опір силам ліги Сунь Чуаньфана. Після Шанхайського повстання Ден Яньда та Сун Цінлін приєдналися до Тана, сформувавши повстанський рух МіньҐань."
 HNN_tang_shengzhi_leader_desc: "§YНародився:§! §L12 жовтня 1889 року, повіт Дун'ань, провінція Хунань, Велика Цін§!\n§YПоходження:§! §L$HNN_tang_shengzhi_desc_body$ Після розпаду ліги Тан переміг на хунанських виборах і тепер прагне створити міцний націоналістичний оплот, вірний лише йому.§!"
 HNN_tang_shengzhi_sic_desc: "§YНародився:§! §L12 жовтня 1889 року, повіт Дун'ань, провінція Хунань, Велика Цін§!\n§YПолітична орієнтація:§! §S8-ма армія§!\n§YПоходження:§! §L$HNN_tang_shengzhi_desc_body$ Попри скрутне становище націоналістів, «буддійський генерал» плекає надію одного дня визволити рідну провінцію від несправедливого правління Чжао.§!"

 HNN_cheng_qian: "Чен Цянь"
 HNN_cheng_qian_desc_start: "Народився у заможній родині землевласників. Здобув традиційну конфуціанську освіту і склав імперські іспити, сподіваючись стати вченим. Проте, усвідомивши політичну ситуацію в Китаї кінця XIX століття, обрав військову кар'єру. Навчався в Японії, де познайомився з революціонерами Хуан Сіном та Сун Цзяоженем. У 1905 році зустрівся з Сунь Ятсеном і вступив до Тунменхою. Закінчив Військову академію армії Японії разом із Тан Цзіяо. Під час Сіньхайської революції 1911 року брав участь у битві за Чаншу. Залишався вірним ідеалам Суня під час війни на захист республіки. У 1917 році був демократично обраний губернатором Хунані."
 HNN_cheng_qian_leader_desc: "§YНародився:§! §L31 березня 1882 року, повіт Лілін, провінція Хунань, Велика Цін§!\n§YПоходження:§! §L$HNN_cheng_qian_desc_start$\n\nПід час Північного походу він командував 6-ю армією, зокрема в битві за Наньчан. Коли похід провалився, Чен опинився у Західній Хунані. Разом із потоком біженців Гоміньдану він відступив до Ґуйчжоу, де використав свою армію як важіль у переговорах із Тан Цзіяо про захист. Співпрацюючи з соратником по партії Таном Шенчжі, він допоміг перемогти Чжао на виборах і був обраний поміркованим лідером Гоміньдану в Хунані.§!"
 HNN_cheng_qian_sic_desc: "§YНародився:§! §L31 березня 1882 року, повіт Лілін, провінція Хунань, Велика Цін§!\n§YПолітична орієнтація:§! §a6-та армія§!\n§YПоходження:§! §L$HNN_cheng_qian_desc_start$\n\nОдин із найближчих соратників Суня, він був військовим інструктором і свого часу розглядався як кандидат на посаду начальника академії Вампу. Брав участь у Східному поході, був обраний до Центрального виконавчого комітету. Після краху Північного походу його 6-та армія відступила до Ґуйчжоу. Зберігши значні сили у вигнанні, Чен Цянь чекає слушної нагоди, аби повернутися і знову взяти владу в Хунані. Користуючись великою повагою, він цілком здатний втілити свою мрію.§!"

 HNN_tang_xiangming: "Тан Сянмін"
 HNN_tang_xiangming_bio: "Кар'єра Тана Сянміна почалася в чині адмірала Великої Цін. Під час революції 1911 року він перейшов на бік повстанців. У 1913 році Юань Шикай призначив його губернатором Хунані. Тан підтримав спроби Юаня проголосити себе імператором і правив провінцією залізною рукою, за що отримав прізвисько «Тан-м'ясник». У 1916 році через підтримку Юаня він був змушений тікати з Хунані. У 1917-му приєднався до чжилійської кліки. Після поразки Північного походу Тан отримав під командування гарнізон у Юеяні. Хоча У Пейфу офіційно підтримував Чжао Хенці, він тримав Тана напоготові на випадок, якщо Чанша виступить проти Пекіна. Тан має вплив на західних мілітарів та губернатора Ґуйчжоу Юаня Цзуміна, тож він готовий до радикальних кроків, аби зберегти Хунань під контролем чжилійців."
 HNN_tang_xiangming_leader_desc: "§YНародився:§! §L1885 рік, Хуанчжоу, провінція Хубей, Велика Цін§!\n§YПоходження:§! §L$HNN_tang_xiangming_bio$\n\nЗі здобуттям статусу губернатора Хунані кар'єра Тана Сянміна сягнула нової висоти. Спираючись на військову силу, він має намір утримати провінцію для чжилійської кліки будь-якою ціною. Створена ним «комісія оборони», за задумом, має назавжди викорінити античжилійські настрої в регіоні.§!\n\n§YПримітки: Попри весь пафос і регалії, Тан все ще вважається чужинцем у чжилійській кліці. Понад усе він залишається вірним своїй першій любові — морю, і мріє знову командувати кораблями.§!"
 HNN_tang_xiangming_army_chief_desc: "§YНародився:§! §L1885 рік, Хуанчжоу, провінція Хубей, Велика Цін§!\n§YПолітична орієнтація:§! §Pчжилієць§!\n§YПоходження:§! §L$HNN_tang_xiangming_bio$§!"

 HNN_yuan_zuming: "Юань Цзумін"
 HNN_yuan_zuming_bio: "Юань Цзумін змалку захоплювався військовою справою. У 1921 році він убив Ван Веньхуа, захопивши владу в Ґуйчжоу і повернувши провінцію під контроль Пекіна. Це розлютило губернатора Юньнані Тан Цзіяо, який витіснив Юаня до Сичуані. Там його армію розбили Ян Сень та Лю Сян. Втративши майже все, Юань приєднався до Гоміньдану, а його війська стали 12-ю армією НРА. Він допомагав Тану Шенчжі у вторгненні в Хунань, але після німецького втручання і загибелі Чан Кайші знову перейшов на бік Пекіна. Нині він номінально є губернатором Ґуйчжоу, але контролює лише східну частину провінції, тоді як решта перебуває під владою хунти Гоміньдану. Юань впевнений, що настане день, коли він покарає революціонерів за їхню зраду."
 HNN_yuan_zuming_army_chief_desc: "§YНародився:§! §L9 червня 1889 року, повіт Сіньї, провінція Ґуйчжоу, Велика Цін§!\n§YПолітична орієнтація:§! §nстара ґуйчжоуська кліка§!\n§YПоходження:§! §L$HNN_yuan_zuming_bio$§!\n\n§YПримітки: У 1920-х роках Юань розглядався як кандидат на підтримку федералістського самоврядування, але досі не виявив прихильності до цієї ідеології.§!"
 HNN_yuan_zuming_leader_desc: "§YНародився:§! §L9 червня 1889 року, повіт Сіньї, провінція Ґуйчжоу, Велика Цін§!\n§YПоходження:§! §L$HNN_yuan_zuming_bio$§!"

 HNN_he_long: "Хе Лун"
 HNN_he_long_sic_desc: "§YНародився:§! §L22 березня 1896 року, повіт Санчжі, провінція Хунань, Велика Цін§!\n§YПолітична орієнтація:§! §R8-ма армія (радикали)§!\n§YПоходження:§! §LЗа національністю туцзя, Хе Лун народився у бідній селянській родині. У 1914 році вступив до Китайської революційної партії Сунь Ятсена. У 1918-му сформував загін добровольців у Західній Хунані, здобувши репутацію місцевого «Робін Гуда». Під впливом інтелектуалів схилився до марксизму. У 1926 році приєднався до 8-ї армії Тан Шенчжі, аби відбити Хунань у Чжао Хенці. Хе Лун героїчно бився під час Північного походу, але після німецького втручання був змушений відступити до Цзянсі. Нині він є неофіційним лідером радикального крила 8-ї армії разом із Пен Дехуаєм і сподівається схилити свого командира Тана Шенчжі до співпраці з селянським комітетом Сун Цінлін.§!"

 #蔡和森
 HNN_cai_hesen: "Цай Хесень"
 HNN_cai_hesen_advisor_desc: "§YНародився:§! §L30 березня 1895 року, Шанхай, Шанхайський міжнародний сеттльмент, Велика Цін§!\n§YПолітична орієнтація:§! §rКСП§!\n§YПоходження:§! §LЦай Хесень народився у Шанхаї в сім'ї, що розпалася. Не бажаючи брати участь у батьківському бізнесі, він поїхав на батьківщину матері до Хунані. Там він навчався у Першому хунанському педагогічному університеті, де потрапив під вплив видатного педагога Ян Чанцзі та заснував Товариство вивчення нового народу.\n\nУ 1919 році Цай разом із сестрою виїхав до Франції. У Парижі він організував Кооперативне товариство праці та навчання і став палким прихильником синдикалізму. На відміну від анархістів, він виступав за створення централізованої Китайської синдикалістської партії (КСП). У 1922 році він отримав дозвіл на створення її офіційного відділення.\n\nПовернувшись до Китаю, Цай заснував першу газету партії. Після поразки Північного походу він знову опинився в Парижі, але таємно повернувся у 1932 році для участі у Шанхайському повстанні. Відтоді він переховується між Хунанню та Шанхаєм, сподіваючись на початок синдикалістської революції.§!\n\n§YПримітки: Будучи близьким другом Мао Цзедуна, Цай глибоко шкодує про його загибель під час повстання «Осіннього врожаю». Проте він не схвалює безрозсудні заколоти, вважаючи, що лише співпраця з Гоміньданом допоможе справі робітників.§!"

 HNN_assorted_leaders: "Різні лідери"

 HNN_tan_yankai: "Тань Янькай"
 HNN_tan_yankai_advisor_desc: "§YНародився:§! §L25 січня 1880 року, Ханчжоу, провінція Чжецзян, Велика Цін§!\n§YПолітична орієнтація:§! §lреспубліканці§!\n§YПоходження:§! §LСпочатку прихильник конституційної монархії, Тань перейшов до революційної політики після краху Цін. Він був губернатором Хунані на зорі республіки, але був усунутий Юань Шикаєм. Його замінив «м'ясник» Тан Сянмін, який жорстоко придушував революціонерів.\n\nТань повертався на посаду губернатора чотири рази — рекорд для Хунані. У 1920-х він обстоював провінційну автономію та мирне об'єднання Китаю. Пізніше він приєднався до Сунь Ятсена в Ґуанчжоу і став офіційним членом Гоміньдану. Під час Північного походу він командував 2-ю армією, але після втручання німців був змушений піти у вигнання до Ґуйчжоу. Не бажаючи підкорятися своєму супернику Чен Цяню, Тань прийняв пропозицію Чжао Хенці про амністію і повернувся до Чанші. Зараз він веде тихе життя, але готовий повернутися у політику, якщо обставини дозволять йому знову служити країні.§!"

 ##- Генерали -##
 HNN_song_xilian: "Сун Сілянь"
 HNN_song_xilian_commander_desc: "§YНародився:§! §L9 квітня 1907 року, повіт Сянсян, провінція Хунань, Велика Цін§!\n§YПолітична орієнтація:§! §a6-та армія§!\n§YПоходження:§! §LНародившись у заможній селянській родині, Сун змалку вивчав класичну поезію. У 1921 році в Чанші він вперше долучився до революційної діяльності, критикуючи іноземний імперіалізм та мілітаристів. \n\nВін став наймолодшим випускником першого набору академії Вампу. У 1924 році вступив до Гоміньдану і брав участь у Східному поході проти Чень Цзюнміна. Сун відзначився під час Північного походу, де його бійці сходилися у рукопашних сутичках із чжилійцями. Після краху фронту він відступив до Ґуйчжоу разом зі своїм наставником Чен Цянем. Хоча технічно він не є кадровим офіцером 6-ї армії, його зв'язки з ними настільки тривалі, що його вважають повноправним членом цього угруповання.§!"

 HNN_yang_jie: "Янь Цзє"
 HNN_yang_jie_theorist_desc: "§YНародився:§! §L25 січня 1889 року, повіт Далі, провінція Юньнань, Велика Цін§!\n§YПолітична орієнтація:§! §a6-та армія§!\n§YПоходження:§! §LЯнь Цзє мав фотографічну пам'ять і з дитинства вражав вчителів своїми питаннями. Його військова кар'єра почалася в Юньнані, а згодом він навчався в Японії, де познайомився з Чан Кайші та вступив до Тунменхою у 1909 році. \n\nЯнь вважався одним із найблискучіших умів у галузі військової теорії. Він навчався у Військовому коледжі Японії, де став найкращим студентом випуску і отримав почесну шаблю від японського імператора. Повернувшись до Китаю, він став начальником штабу Сунь Юе, а у 1926 році приєднався до Національно-революційної армії як радник 6-ї армії. Після поразки революції він пішов у вигнання за Чен Цянем, продовжуючи розробляти стратегії, які роблять його одним із найздібніших генералів у лавах НРА.§!"

 HNN_li_minghao: "Лі Мінхао"
 HNN_li_minghao_army_chief_desc: "§YНародився:§! §L19 вересня 1897 року, повіт Лілін, провінція Хунань, Велика Цін§!\n§YПолітична орієнтація:§! §a6-та армія§!\n§YПоходження:§! §LПрофесійний військовий, Лі Мінхао навчався в Японії, після чого став інструктором у військовій академії Чанші. У 1923 році на запрошення Чен Цяня він приєднався до Гоміньдану в Ґуанчжоу. Сунь Ятсен призначив Чена міністром військових справ, а той своєю чергою зробив Лі начальником навчальної частини академії Вампу.\n\nПід час Північного походу Лі командував полком у складі 6-ї армії. Після колапсу фронту він залишився вірним Чен Цяню і відступив до Ґуйчжоу, де згодом очолив 17-ту дивізію. Через зростання напруженості між 6-ю та 8-ю арміями він отримав звання генерал-майора. Попри політичну відстороненість, ширяться чутки, що він симпатизує лівому Центральному комітету та синдикалістам, хоча доказів цьому немає.§!"

 HNN_peng_dehuai: "Пен Дехуай"
 HNN_peng_dehuai_high_command_desc: "§YНародився:§! §L24 жовтня 1888 року, повіт Сянтань, провінція Хунань, Велика Цін§!\n§YПолітична орієнтація:§! §R8-ма армія (радикали)§!\n§YПоходження:§! §LПен народився у бідній селянській родині. Після смерті матері та хвороби батька він працював на виснажливих роботах, аби прогодувати родину. Його захоплювали народні повстанці, що грабували багатих заради бідних, і у 1916 році він сам став солдатом.\n\nВін швидко прославився своєю відвагою. У 1926 році Пен став командиром дивізії у 8-й армії Тан Шенчжі. Під час повстання МіньҐань він зарекомендував себе як найздібніший офіцер Тана і потоваришував із Хе Луном на ґрунті спільного селянського походження та ненависті до поміщиків-експлуататорів. Пен готовий розірвати кайдани імперіалізму та побудувати новий Китай, вільний і рівний для всіх.§!"

 HNN_he_jian: "Хе Цзянь"
 HNN_he_jian_sic_desc: "§YНародився:§! §L10 квітня 1887 року, повіт Лілін, провінція Хунань, Велика Цін§!\n§YПолітична орієнтація:§! §a6-та армія§!\n§YПоходження:§! §LХе Цзянь мріяв про цивільну службу, але після революції 1911 року зрозумів, що слави легше досягти в армії. Він закінчив Баодінське військове училище у 1916 році. Під час виступів проти «м'ясника» Тана Сянміна він сформував власний партизанський загін для боротьби з бейянськими загарбниками.\n\nВін почав довгу кар'єру під началом Тан Шенчжі, ставши командиром дивізії у 8-й армії. Після Північного походу він опинився у МіньҐані, проте його стосунки з радикальними соціалістами на кшталт Хе Луна та Пен Дехуая стали напруженими. Зараз Хе Цзянь є однією з найвпливовіших постатей у Хунані і прагне втілити власні масштабні реформи, не гребуючи жодними засобами.§!"

 HNN_li_pinxian: "Лі Піньсянь"
 HNN_li_pinxian_army_chief_desc: "§YНародився:§! §L22 квітня 1890 року, повіт Цанву, провінція Ґуансі, Велика Цін§!\n§YПолітична орієнтація:§! §S8-ма армія§!\n§YПоходження:§! §LЛі народився у впливовій родині, здобув класичну освіту і палко захоплювався поезією. Проте через безглузду помилку на іспиті (він пропустив сторінку в роботі) його академічна кар'єра була зруйнована, і він обрав шлях військового.\n\nВін приєднався до хунанської армії, де зблизився з Тан Шенчжі. Лі незмінно слідував за Таном у всіх підвищеннях. Під час Північного походу він командував дивізією у 8-й армії. Лі займає серединну позицію у розколі між лівим і правим Гоміньданом, офіційно залишаючись «аполітичним». У вільний час він пише вірші і вважається однією з найприємніших постатей у лавах НРА.§!"

 HNN_liu_jianxu: "Лю Цзяньсюй"
 HNN_liu_jianxu_high_command_desc: "§YНародився:§! §L2 жовтня 1892 року, повіт Лілін, провінція Хунань, Велика Цін§!\n§YПолітична орієнтація:§! §a6-та армія§!\n§YПоходження:§! §LЛю Цзяньсюй пройшов стандартний шлях офіцера, навчаючись у Баодіні, де познайомився з Хе Цзянем. Згодом він приєднався до партизанського загону Хе для боротьби з бейянцями. Лю став найздібнішим командиром і довіреною особою Хе Цзяня.\n\nЙого бригада відзначилася під час Північного походу захопленням арсеналів у Ханьяні. Після краху походу він разом із Хе Цзянем сформував антисоціалістичний блок у складі 8-ї армії. Лю продовжує допомагати своєму другові на кожному кроці, особливо після піднесення Хе Цзяня до керівних посад у структурах умиротворення Хунані.§!"

 HNN_liu_xing: "Лю Сін"
 HNN_liu_xing_high_command_desc: "§YНародився:§! §L22 листопада 1887 року, повіт Ціян, провінція Хунань, Велика Цін§!\n§YПолітична орієнтація:§! §S8-ма армія§!\n§YПоходження:§! §LНавчаючись у Баодіні разом із Тан Шенчжі, Лю Сін разом із другом так сильно побили своїх інструкторів, що військове міністерство розлючено відправило обох додому. У 1916 році він повернувся до служби в Хунані. Коли Тан Шенчжі був змушений тікати до Ґуанчжоу у 1926-му, Лю пішов за ним.\n\nВін командував дивізією під час Північного походу і особисто керував взяттям Ханькоу. Попри катастрофу решти фронту, Лю залишився вірним Тану Шенчжі, супроводжуючи його у партизанській війні в горах Цзянсі та Фуцзяня. Минуло десять років, але Лю Сін залишається так само відданим лідерству Тана, як і в часи їхньої буремної юності.§!"

 HNN_gong_hao: "Ґун Хао"
 HNN_gong_hao_high_command_desc: "§YНародився:§! §Lвересень 1887 року, повіт Їян, провінція Хунань, Велика Цін§!\n§YПолітична орієнтація:§! §S8-ма армія§!\n§YПоходження:§! §LОднокласник Тана Шенчжі, Ґун Хао з ранніх років симпатизував революціонерам. Він брав участь у повстанні в Учані 1911 року та війні на захист республіки. Коли Тан приєднався до Гоміньдану, Ґун став начальником штабу 8-ї армії.\n\nПісля поразки Північного походу він допомагав Тану переховуватися в Цзянсі, поки вони не об'єдналися з іншими повстанцями МіньҐаня. Ґун — надзвичайно здібний інструктор, який навчає новобранців мистецтву війни. Його поважають за скромність і гостинність. У вільний час він вивчає даосизм та праці Лао-цзи.§!"

 HNN_tao_guang: "Тао Ґуан"
 HNN_tao_guang_high_command_desc: "§YНародився:§! §L1887 рік, повіт Лілін, провінція Хунань, Велика Цін§!\n§YПолітична орієнтація:§! §S8-ма армія§!\n§YПоходження:§! §LТао спочатку був художником, але вирішив змінити професію і закінчив кілька військових академій. Під час Північного походу він командував полком, а згодом і бригадою у 8-й армії. Попри загальну поразку Гоміньдану, Тао зміг забезпечити армію тисячами гвинтівок, за що отримав звання командира дивізії. Десятиліття боїв у МіньҐані перетворили колишнього художника на досвідченого експерта з партизанської війни, якого Тан Шенчжі надзвичайно цінує.§!"

 HNN_tang_shengming: "Тан Шенмін"
 HNN_tang_shengming_commander_desc: "§YНародився:§! §L10 жовтня 1906 року, повіт Дун'ань, провінція Хунань, Велика Цін§!\n§YПолітична орієнтація:§! §S8-ма армія§!\n§YПоходження:§! §LМолодший брат генерала Тан Шенчжі, Тан Шенмін закінчив академію Вампу у 1926 році. Він супроводжував брата під час відступу до Цзянсі та брав участь у створенні повстанського руху МіньҐань. Призначення Шенміна генералом багато хто сприймає як прояв кумівства та знак зростаючого впливу Тан Шенчжі у хунанській політиці, незалежно від реальних здібностей самого молодого офіцера.§!"

