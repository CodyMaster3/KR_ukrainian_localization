########################################

 hunan_events.1.t: "Хунань порриває з Лігою"
 hunan_events.1.d: "Після смерті Сунь Чуаньфана Хунань — одна з автономних провінцій Ліги восьми провінцій — знову повернула собі повну самостійність під керівництвом Чжао Хенті. Попереду буремні часи: насильство в регіоні Міньгань може перекинутися на нашу провінцію, як це вже було в 1932 році, тому ми маємо пильнувати східні кордони. Водночас нам слід стежити і за західним кордоном з Юньнанню. Хоча Тан Цзіяо також є федералістом, його готовність дати притулок правому Гоміньдану в західному Гуйчжоу зіпсувала наші відносини та стала ще одним джерелом загрози.\n\nНа щастя, ситуація на півночі та півдні спокійніша. На півдні ми маємо потенційного друга — кліку Гуансі на чолі з Лу Юйгуаном. Хоча він і не федераліст, Лу — син покійного Лу Жунтіна, колишнього командира Чжао. А на півночі стоїть інший наш друг — У Пейфу та його уряд у Пекіні. Хоча Чжао особисто ворогує з Тан Сянміном, командиром гарнізону Чжилі в Юеяні, через свій арешт у 1913 році, він залишається близьким другом У Пейфу. Це означає, що ми можемо розраховувати на кліку Чжилі як на одного з наших союзників у Китаї."
 hunan_events.1.a: "Обережне балансування..."

 hunan_events.2.t: "Конституція та вибори 1936 року"
 hunan_events.2.d: "Губернатор Чжао Хенті прийшов до влади в 1920-х роках на хвилі федералістського руху. Його першим кроком було залучення інтелектуалів з усього Китаю для написання Конституції Хунані, яка була відновлена в 1928 році.\n\nПоки інші застерігають від створення провінційної конституції без підтримки центрального федерального уряду, губернатор Чжао вірить, що федералізм має спершу зародитися на рівні провінцій. Кожна провінція повинна скинути своїх мілітаристів, створити власну конституцію та розбудувати демократію. Тільки тоді конфедерація провінцій зможе сформувати центральний уряд.\n\nПроте через колапс Ліги та хаос 1936 року виникли сумніви щодо доцільності проведення виборів у такий нестабільний час. За порадою Лі Цзяньнуна Чжао Хенті все ж вирішив проводити вибори, щоб не повторювати суперечливих дій центрального уряду 1933 року."
 hunan_events.2.a: "Важливий крок у майбутнє!"

 # Події виборів

 hunan_election_events.1.t: "Виборча кампанія починається!"
 hunan_election_events.1.d: "Останні вибори в Хунані проходили в 1932 році, і вогонь демократії продовжує мерехтіти на роздоріжжі Китаю. Чжао виступив сьогодні в Чанші, оголосивши, що вибори відбудуться за три місяці, і висунув свою кандидатуру від «Товариства народного оновлення». Важливо пам'ятати, що губернатор Хунані обирається не прямим голосуванням: виборці обирають депутатів асамблеї, а ті вже голосують за губернатора.\n\nНевдовзі з’явилися й інші кандидати. Головним суперником Чжао став Хуан Яньпей від «Китайської асоціації демократичної національної відбудови». Третій кандидат — Чжоу Шічжао, голова ФКДП у Хунані. Завдяки своїй посаді він має вплив на ліве крило асамблеї. Нарешті, Тань Янькай — людина, що стоїть між федералістами та Гоміньданом — також оголосив про участь, що може відтягнути голоси у Чжао.\n\nХоча Чжао є фаворитом, усі кандидати готуються до серйозної боротьби. Хунань покаже приклад справжніх демократичних виборів для всього Китаю!"
 hunan_election_events.1.a: "За молоду демократію Хунані!"

 hunan_election_events.2.t: "Тан Шенчжи вирушає до Хунані"
 hunan_election_events.2.d: "Генерал Тан Шенчжи, уславлений командир 8-ї армії часів Північного походу, несподівано повідомив своїх соратників про намір взяти участь у виборах у Хунані. У розпал війни Ліги багато командирів у зоні повстання висловили лють, звинувачуючи генерала в тому, що він готовий пожертвувати виживанням Гоміньдану заради шансу на владу в рідній провінції.\n\nОднак Тан та залишки 8-ї армії вже залишили свої позиції і, ймовірно, саме зараз перетинають кордон провінції. Його гамбіт може закінчитися провалом, але він також може здобути всю Хунань для Національної революції. Тільки час покаже."
 hunan_election_events.2.a: "Принаймні, успіху йому."

 hunan_election_events.3.t: "Тан Шенчжи прибуває до Хунані"
 hunan_election_events.3.d1: "Тривожні новини надійшли до офісу губернатора в Чанші. Тан Шенчжи, повстанець із Міньганю, перетнув кордон провінції. У супроводі Хе Луна, Пен Дехуая та невеликого загону 8-ї армії, генерал готується кинути виклик Чжао Хенті.\n\nРаніше Тан був підлеглим Чжао і навіть усував його від влади, перш ніж сам був зміщений напередодні Північного походу. Тан завжди прагнув губернаторства в рідній Хунані. Завдяки своїм зв'язкам із селянством та лівими силами він став серйозним претендентом, що ставить під загрозу гарантовану перемогу Чжао."
 hunan_election_events.3.d2: "Тан Шенчжи, втікаючи від розгрому своїх товаришів у Фуцзяні, перетнув кордон Хунані. У супроводі Хе Луна та Пен Дехуая він готується до відчайдушної боротьби за посаду губернатора.\n\nМаючи підтримку селянства, Тан Шенчжи став серйозним суперником для Чжао Хенті. Навіть без офіційної підтримки всього Гоміньдану він здатний змінити хід виборів."
 hunan_election_events.3.a: "Одного Тана вже було достатньо..."

 hunan_election_events.4.t: "Чен Цянь вторгається через Гуйчжоу!"
 hunan_election_events.4.d: "Чергова несподіванка на виборах губернатора. Поки лівий Гоміньдан діяв у Міньгані, ті, хто виступав проти співпраці з синдикалістами, втекли до провінції Гуйчжоу під захист губернатора Тан Цзіяо.\n\nТан Цзіяо не є членом Гоміньдану, але він використовував присутність «правих» націоналістів як розмінну монету проти експансії Чжилі, навіть попри дружбу з Чжао Хенті.\n\nЧен Цянь, один із лідерів правого Гоміньдану та уродженець Хунані, командував 6-ю армією НРА. Схоже, не координуючи свої дії з Тан Шенчжи, генерал обійшов сили Юань Цзуміня і також вступив у виборчі перегони."
 hunan_election_events.4.a: "Ситуація виходить з-під контролю, тепер їх двоє!"

 hunan_election_events.5.t: "Кампанія починається в Хен'яні"
 hunan_election_events.5.d: "Два дні тому губернатор Чжао Хенті повернувся до рідного міста Хен'ян. Він відвідав родину, зустрівся з друзями дитинства та виступив із кількома промовами. Попри присутність Чен Цяня та Тан Шенчжи, саме Чжао зібрав найбільші натовпи.\n\nПопулярність Чжао становить загрозу для обох представників Гоміньдану. Розуміючи, що поодинці їм не перемогти, вони зустрілися після виступів, щоб обговорити створення «Єдиного фронту». Хоча ці двоє не є друзями, вони радше бачитимуть губернатором товариша по партії, ніж федераліста Чжао."
 hunan_election_events.5.a: "Чжао Хенті продовжить демократичну спадщину Хунані!"
 hunan_election_events.5.b: "Гоміньдан принесе Національну революцію до Хунані!"

 hunan_election_events.6.t: "Хто очолить Єдиний фронт?"
 hunan_election_events.6.d: "Коли Чен Цянь і Тан Шенчжи погодилися на союз, виникло питання: хто саме має його очолити?\n\nЗ одного боку — Тан Шенчжи. Орієнтований на селянство та співпрацю з синдикалістами, він є популярним кандидатом у аграрній Хунані. Проте він вважається «аутсайдером» у партії, мілітаристом та опортуністом, що може зашкодити єдності Гоміньдану.\n\nЗ іншого боку — Чен Цянь. Партійна людина, що цінує дисципліну та солідарність, він міг би стати поміркованою та об’єднавчою фігурою. Він — представник «старої гвардії», відомий своєю впертістю. Занепокоєння викликає лише те, що він може бути не таким яскравим лідером, як його радикальний опонент.\n\nОбидва мають свої переваги та недоліки. Кого ми оберемо?"
 hunan_election_events.6.a: "Єдність партії — понад усе, Чен очолить фронт"
 hunan_election_events.6.b: "Нам потрібен радикальний лідер, дайте кермо Тану"

 hunan_election_events.7.t: "Угода з дияволом?"
 hunan_election_events.7.d: "Поява Чен Цяня та Тан Шенчжи поставила губернатора Чжао у скрутне становище. Знаючи про авторитарні тенденції Гоміньдану, він боїться за майбутнє демократії Хунані. Провінційна асамблея відома своєю корумпованістю, і Чжао досі не міг подолати це зло. Корумповані депутати не дбають про демократію, але вони не лояльні і до Гоміньдану...\n\nБуло б можливо знайти з ними спільну мову та отримати їхню підтримку на виборах, якщо Чжао погодиться... заплющити очі на їхні оборудки. Допомагати корупціонерам прикро, але іноді краще злегка викривити правила, ніж дозволити їх остаточно зламати."
 hunan_election_events.7.a: "Я людина принципів!"
 hunan_election_events.7.b: "Це прикро, але обставини вимагають цього."

 hunan_election_events.8.t: "Заворушення серед ультралівих"
 hunan_election_events.8.d: "З прибуттям Тан Шенчжи соціалістичні заворушення в Хунані різко посилилися. На кордоні з Цзянсі соціалістичні загони нападають на представників уряду. Водночас у Чанші та Чанде активізувалися профспілки та синдикалісти, підбурювані Гоміньданом.\n\nТан Шенчжи використовує це, заявляючи, що заворушення — це результат неспроможності Чжао дбати про робітників, і що при Гоміньдані кожен отримає своє. Чжао ж відповідає, що саме Тан роздмухує полум'я насильства, а тепер обіцяє вирішити проблему, яку сам і створив."
 hunan_election_events.8.a: "Тан звертається до соціалістів"
 hunan_election_events.8.b: "Насильство лякає людей, і вони згуртувалися навколо Чжао."

 hunan_election_events.9.t: "Вибір Тань Янькая"
 hunan_election_events.9.d: "У Чанші перебуває колишній губернатор Тань Янькай. Після краху Північного походу Чжао надав йому амністію заради старої дружби. Тань вирішив балотуватися на виборах, забираючи голоси у Чжао серед шляхти та інтелігенції.\n\nСьогодні він думає: чи приєднатися йому до Гоміньдану Тан Шенчжи та Чен Цяня, чи продовжувати кампанію самостійно? Хоча він був лідером під час Північного походу, він особисто недолюблює обох конкурентів. Крім того, його підтримка серед шляхти може зникнути, якщо він пов’яже своє ім’я з соціалістичними погромами на сході."
 hunan_election_events.9.a: "Балотуватися як незалежний."
 hunan_election_events.9.b: "Балотуватися під прапором Гоміньдану."

 hunan_election_events.10.t: "Кампанія в Чанші"
 hunan_election_events.10.d: "Чанша сильно зросла останнім часом завдяки індустріалізації. Оскільки Тань Янькай забрав у Чжао частину шляхти, губернатор покладається на інтелігенцію. Середній клас же почав симпатизувати Чен Цяню та його обіцянкам. Обидва намагаються схилити місто на свій бік: Чжао апелює до зроблених реформ, а Чен обіцяє подальший розвиток. Тан Шенчжи самоусунувся від міських перегонів, зосередившись на селах. Чия риторика переможе?"
 hunan_election_events.10.a: "Популярність Чжао серед інтелігенції забезпечує йому перемогу в місті!"
 hunan_election_events.10.b: "Обіцянки Чена дають йому підтримку середнього класу!"

 hunan_election_events.11.t: "Федерація китайських демократичних партій"
 hunan_election_events.11.d: "На фоні популізму Гоміньдану лідери ФКДП, Хуан Яньпей та Чжоу Шічжао, мають зробити вибір. Вони не хочуть загибелі демократії. Хуан пропонує зняти їхні кандидатури на користь Чжао, щоб створити «демократичний фронт». Чжоу ж вважає, що треба продовжувати боротьбу, щоб отримати власну нішу в асамблеї та вести переговори з Чжао вже після виборів. Обидві стратегії мають сенс."
 hunan_election_events.11.a: "Стати під прапор федералістів."
 hunan_election_events.11.b: "Продовжувати власну кампанію."

 hunan_election_events.12.t: "Гарнізон Юеяну"
 hunan_election_events.12.d: "На кордоні з Хубеєм лежить місто Юеян — стратегічний пункт між нашою провінцією та північним урядом. Містом керує Тан Сянмін, а мером є його брат Тан Хуалун. Жоден із них не є другом Чжао, але обидва симпатизують кліці Чжилі. Брати зібралися, щоб обговорити вибори. Хуалун боїться перемоги Гоміньдану і пропонує підтримати Чжао. Тан Сянмін же не вірить в успіх націоналістів і вважає, що треба максимально послабити Чжао, щоб той не загордився своєю перемогою."
 hunan_election_events.12.a: "Тан Сянмін правий, треба стримувати Чжао"
 hunan_election_events.12.b: "Тан Хуалун має рацію, Гоміньдан — більша загроза"

 hunan_election_events.13.t: "Зіткнення класів"
 hunan_election_events.13.d: "Політична боротьба йде не тільки на трибунах. Риторика Гоміньдану викликала хвилю обурення серед селян, спрямовану проти шляхти. Дійшло навіть до нападів на землевласників. Чжао намагається заспокоїти шляхту, обіцяючи вирішити проблеми законним шляхом. Тан продовжує підбурювати селян до боротьби за свої права. Чен Цянь, як поміркований лідер, закликає до компромісу між усіма громадянами Хунані заради спільного майбутнього."
 hunan_election_events.13.a: "Чжао втихомирює страхи шляхти."
 hunan_election_events.13.b: "Тан роздмухує полум'я селянських заворушень."
 hunan_election_events.13.c: "Чен робить усе можливе для посередництва між сторонами."

 hunan_election_events.14.t: "Діархія Сянсі"
 hunan_election_events.14.d: "На заході Хунані правлять мілітаристи Тянь Інчжао та Чень Цюйчжень. Останнє десятиліття вони були частиною кліки Чжао, але Тан Сянмін намагається переманити їх на свій бік. З огляду на ворожу риторику Гоміньдану щодо «західних мілітаристів», діархія серйозно занепокоєна. Вони можуть або підтримати Чжао ресурсами своєї «Асоціації автономії Сянсі», або прийняти пропозицію Тан Сянміна і створити антигоміньданівський альянс."
 hunan_election_events.14.a: "Тан Сянмін забезпечить порядок."
 hunan_election_events.14.b: "Перемога Чжао стримає загрозу."

 hunan_election_events.15.t: "Кампанія в сільській місцевості"
 hunan_election_events.15.d: "Історично підтримка Чжао зосереджена в містах, і ці вибори не виняток. Селянство апатично ставиться до його адміністрації. Тан Шенчжи ж обіцяє радикальну земельну реформу, що робить його популярним. Чен Цянь також пропонує зміни, але не такі радикальні. Якщо він посилить роботу в селах, він може відібрати частину голосів у Тана і закріпити їх за собою."
 hunan_election_events.15.a: "Риторика Тана забезпечує йому підтримку селян!"
 hunan_election_events.15.b: "Чен з великими труднощами здобуває перевагу!"

 hunan_election_events.16.t: "Чанша та Гуйчжоу"
 hunan_election_events.16.d: "На заході лежить Гуйчжоу, де править Юань Цзумінь. Він визнаний Пекіном, але слабкий і змушений покладатися на уряд у Чанші. Чжао і Юань симпатизують Чжилі, але їхній альянс став напруженим через вибори. Чжао думає, чи не переспрямувати кошти, призначені для Гуйчжоу, на власну виборчу кампанію. Водночас Чен Цянь гостро критикує «автократичний режим» Юаня і заявляє, що Гоміньдан припинить його підтримку."
 hunan_election_events.16.a: "Позиція Чена проти Юаня стає популярною!"
 hunan_election_events.16.b: "Чжао скорочує підтримку, щоб зосередитися на виборах."

 hunan_election_events.17.t: "Результати виборів готові!"
 hunan_election_events.17.d: "Голоси підраховані. Вибори в Хунані добігають кінця. Хоча Чжао був фаворитом, єдиний фронт Чена та Тана значно змінив ситуацію. Майбутнє провінції залежить від цього результату, і ми чекаємо на оголошення переможця затамувавши подих..."
 hunan_election_events.17.a: "Переможцем виборів 1936 року стає..."

#Tang Xiangming Events

 hunan_zhili_events.1.t: "Марш на Чаншу"
 hunan_zhili_events.1.d.qing: "Після нашої нещодавньої перемоги на виборах сили Чжилі, що займали Юеян, під проводом Тан Сянміна спустилися залізницею і за лічені години прибули до Чанші. Хоча ми, ймовірно, могли б здолати його загони, що зараз стоять на північ від міста, власними силами, нам вдалося отримати звіт про те, що Пекін надсилає підкріплення. Чен Цянь і Тан Шенчжи вирішили окопатися і спробувати утримати Чаншу. На жаль, підкріплення Тан Сянміна вже підійшло, посиливши північ і створивши другий фронт на сході, затиснувши місто та наші сили в лещата. Наші перспективи виглядають вкрай похмурими..."
 hunan_zhili_events.1.d.zhao: "Через наші невдачі у приборканні залишків Гоміньдану по всій Хунані, командир гарнізону Юеяну Тан Сянмін оголосив наш уряд нездатним «захистити стійких і вірних громадян провінції Хунань» і заприсягся, що піде маршем на Чаншу, щоб «встановити уряд, справді відданий безпеці всієї Хунані». Він швидко виконав цю обіцянку, скориставшись залізницею, щоб за кілька годин перекинути свою армію з Юеяну. Оскільки наші сили все ще розпорошені по всій провінції в спробах придушити повстанців, ми не змогли організувати гідну контратаку. Перемога Тан Сянміна здається неминучою..."
 hunan_zhili_events.1.d: "Після нашої нещодавньої перемоги на виборах сили Чжилі, що займали Юеян, під проводом Тан Сянміна спустилися залізницею і за лічені години прибули до Чанші. На щастя для нас, схоже, у нього є лише власний гарнізон без жодних додаткових підкріплень. Побачивши можливість, Тан Шенчжи негайно виступив зі своєю восьмою армією і зустрів ворога на підступах до Чанші. Чен Цянь дізнався про це вже згодом і швидко вивів свою шосту армію на допомогу... проте, як не дивно, провінційна армія Хунані все ще залишається в Чанші, не поспішаючи на допомогу своєму губернатору."
 hunan_zhili_events.1.a: "Тан Сянмін захоплює Чаншу!"
 hunan_zhili_events.1.b: "Гоміньдан виходить переможцем!"

 hunan_zhili_events.2.t: "Нова людина в Чанші"
 hunan_zhili_events.2.d: "Тан Сянмін йшов вулицями Чанші, де майже на кожному розі все ще стояли його війська. Минуло багато часу відтоді, як він міг називати себе губернатором Хунані — востаннє він обіймав цю посаду у 1916 році, два десятиліття тому. Його контроль над провінцією ще не був абсолютним: сили попереднього губернатора швидко відступили в сільську місцевість, а повстанці, лояльні до Гоміньдану, здійснюють набіги на його війська. Він увійшов до офісу губернатора і офіційно підписав наказ про виступ військ. Губернатор Тан Сянмін забезпечить абсолютний контроль над Хунанню будь-якими засобами."
 hunan_zhili_events.2.a: "Тепер — взяти все інше."

 hunan_zhili_events.3.t: "Перемога губернатора [ROOT.GetLeader]"
 hunan_zhili_events.3.d: "Попри те, що Єдиний фронт Гоміньдану був застигнутий зненацька, сили Тан Сянміна негайно зустріли запеклий опір найкращих підрозділів восьмої та шостої армій Національно-революційної армії. Спрямувавши свої сили залізницею просто на Чаншу, адмірал зіткнувся з оперативно розгорнутими частинами Сун Сіляня, які нав'язали йому виснажливий бій.\n\nКоли вістря атаки було притуплено, решта шостої та восьмої армій змогли швидко приєднатися до бою. Завдяки хитрим маневрам Хе Цзяня його дивізія змогла обійти сили Чжилі з флангу та атакувати слабші колони Тана разом із діями Хе Луна та Пен Дехуая, які повністю оточили війська Чжилі. Ця битва підняла бойовий дух Гоміньдану та довела життєздатність Єдиного фронту.\n\nПо всій країні звістка про розгром Чжилі в Хунані отримала схвалення від багатьох, включаючи радикальних революціонерів у Центральному комітеті та правих залишків Гоміньдану в Гуйчжоу. Тим не менш, «м'яснику Хунані» вдалося уникнути полону: він прорвався з оточення разом із ротою елітних військ і, за повідомленнями, перетнув кордон дружньої території."
 hunan_zhili_events.3.a: "Сподіваємося, ми бачимо його востаннє."

 hunan_zhili_events.4.t: "Відновлення порядку в Хунані"
 hunan_zhili_events.4.d: "Хоча ми номінально були новим урядом Хунані, наш контроль обмежувався північним сходом. Так було донедавна: наші війська рушили на південь і захід, розбиваючи будь-яких прихильників Гоміньдану чи федералістів. Одне за одним міста Хен'ян, Ченьчжоу та Шаоян потрапляли під наш контроль. Губернатор Тан Сянмін особисто вирушив на захід, де зустрівся з Чень Цюйчженем із діархії Сянсі, щоб гарантувати, що вони не створюватимуть проблем. З підкоренням діархії провінція Хунань опинилася міцно в наших руках."
 hunan_zhili_events.4.a: "Усе під владою губернатора."

 hunan_zhili_events.5.t: "Закріплення у східному Гуйчжоу"
 hunan_zhili_events.5.d: "Закріпившись у Хунані, Тан звернув погляд на східне Гуйчжоу, де правив лояльний до Чжилі Юань Цзумінь. Про всяк випадок тримаючи армію в західній Хунані, два губернатори зустрілися для переговорів. Переговори були короткими: Тан Сянмін пообіцяв зберегти відносини, які Юань мав з минулою адміністрацією, а Юань заявив, що з будь-якими залишками Гоміньдану в його провінції поводитимуться як зі зрадниками."
 hunan_zhili_events.5.a: "Добре, що він прислухався до голосу розуму."

 hunan_zhili_events.6.t: "Комісія оборони"
 hunan_zhili_events.6.d: "Зважаючи на загрози, з якими стикається Хунань — повстанців Гоміньдану в наших лавах та сусідні держави, що ласо дивляться на наші землі — губернатор Тан вважає за необхідне створити «Комісію з оборони провінції Хунань». Цей надзвичайний орган надає губернатору широкі виконавчі повноваження у питаннях оборони. На практиці це означає можливість ефективніше захищати Хунань від оточуючих загроз. Це може здатися кроком до авторитаризму, але це необхідно для безпеки кожного вірного громадянина Хунані."
 hunan_zhili_events.6.a: "За безпечне та надійне суспільство."

 hunan_zhili_events.7.t: "Ліквідація Гоміньдану"
 hunan_zhili_events.7.d: "При Чжао Хенті Гоміньдану дозволяли безперешкодно існувати та ширитися Хунанню, наче хворобі. В ім'я демократії Чжао відмовився діяти проти них під час виборів, дозволивши цій рані гноїтися. На щастя для Хунані, [HNN_tang_xiangming_title] Тан готовий викорінити причину цього болю та остаточно знищити інфекцію в провінції.\n\nЙого дії були швидкими та рішучими: повстанці Гоміньдану були розбиті, кинуті до в'язниць або страчені. У провінції швидко запанувала атмосфера страху перед самопроголошеними «революціонерами». Несподіваним наслідком дій Тана стало те, що коло впливових осіб, переважно шляхти, почали гуртуватися навколо нього, утворивши «Асоціацію гармонії». Тепер контроль Тана над асамблеєю став ще глибшим."
 hunan_zhili_events.7.a: "Будемо сподіватися, що цього разу вони не піднімуться."

 hunan_zhili_events.8.t: "Гамбіт заради узбережжя"
 hunan_zhili_events.8.d: "Губернатор Тан Сянмін завжди був людиною моря. Будучи адміралом задовго до того, як став генералом, він гостро відчуває іронію свого становища — бути губернатором провінції, що не має виходу до моря. Щоб виправити це, він розробив план удару на південь, по Гуансі та Гуандуну, з метою захопити портове місто Гуанчжоу. Хоча він впевнений у власному задумі, йому знадобиться схвалення лідерів Чжилі. З цією метою він підготував петицію, яку надішле до [HNN_zhili_home_base], сподіваючись, що вони прислухаються до голосу розуму та дозволять йому розпочати марш на південь, щоб закріпити Лянгуан за клікою Чжилі... і за ним самим."
 hunan_zhili_events.8.a: "Надіслати петицію."

 hunan_zhili_events.9.t: "Петиція з міста [HNN.Capital.GetCapitalVictoryPointName]"
 hunan_zhili_events.9.d: "[HNN_a_petition_from_changsha_loc_desc]"
 HNN_a_petition_from_changsha_loc_desc_qie_gxc: "Сьогодні з Чанші до нас надійшла петиція. Новий губернатор Тан Сянмін пропонує розпочати наступ на режим у Лянгуані. Швидкий удар на південь, поки вони ще оговтуються від війни, дозволив би нам отримати ці традиційно бунтівні провінції-близнюки. Фактично, один із наших адміралів, Са Чженьбін, виступив на підтримку свого колишнього підлеглого, заявляючи, що довіряє його розсудливості. Ризик, однак, полягає в тому, що перекидання армії на південь може залишити нас відкритими для інших загроз, насамперед для кліки Фентянь на північному сході.\n\nЯк нам вчинити? Прийняти петицію губернатора Тана і дозволити йому ризикнути, чи відхилити її та зосередитися на збереженні того, що ми вже маємо?"
 HNN_a_petition_from_changsha_loc_desc_szc_gxc: "Сьогодні з Чанші надійшла петиція. Губернатор Тан Сянмін пропонує вдарити по режиму в Лянгуані. Швидкий марш на південь міг би забезпечити нам контроль над багатим Гуандуном, що стало б вагомим здобутком. Ризик, звісно, полягає в загрозі з боку маньчжурів просто біля наших дверей — похід на південь може відкрити шлях для атаки з півночі.\n\nЯк ми вчинити? Дозволимо Тану його гамбіт чи залишимо карти при собі?"
 HNN_a_petition_from_changsha_loc_desc_qie_szc: "Після успішного захоплення Гуанчжоу генерал-інспектором Тан Сянміном та створення ним Політичної ради Південно-Західного Китаю, сьогодні від нього надійшла чергова петиція. Оскільки сичуанська кліка на нашому кордоні налаштована вороже, він пропонує спільний марш, щоб включити цей регіон до своєї ради. Вигода очевидна — закріплення південно-західного флангу. Питання лише в тому, чи хочемо ми й надалі посилювати Тан Сянміна, адже створення настільки потужної автономної ради може стати проблемою в майбутньому.\n\nОтже, чи приймемо ми петицію генерал-інспектора, чи спробуємо стримати його амбіції?"
 HNN_a_petition_from_changsha_loc_desc_qie_yun: "Генерал-інспектор Тан Сянмін надіслав нову петицію. Юньнаньська кліка, як і завжди, відмовляється визнавати Пекін законним урядом. Тан просить дозволу розібратися з цією скалкою, повернувши решту Гуйчжоу під контроль Юань Цзуміня та включивши Юньнань до своєї ради. Чи готові ми надати Тану ще більше влади, ніж він уже має?"
 HNN_a_petition_from_changsha_loc_desc_szc_yun: "Юньнань тепер опинилася в оточенні між нами та територіями Тана. Генерал-інспектор вважає це загрозою, оскільки вони можуть вдарити нам у спину в момент нашого наступу на північ чи схід. Він пропонує завдати випереджального удару. Тан, безперечно, правий щодо небезпеки, але чи хочемо ми витрачати людей і зброю на подальше посилення його позицій?"
 hunan_zhili_events.9.a: "Фортуна любить сміливих, прийняти петицію!"
 hunan_zhili_events.9.b: "Ми маємо бути обережними, щоб не втратити все — відхилити петицію."

 hunan_zhili_events.10.t: "Нашу петицію прийнято!"
 hunan_zhili_events.10.d: "[HNN_petition_accepted_loc_desc]"
 HNN_petition_accepted_loc_desc_gxc: "З [HNN_zhili_home_base] надійшли добрі новини: керівництво Чжилі після довгих роздумів вирішило прийняти нашу петицію про марш на південь. Отримавши дозвіл, губернатор Тан Сянмін швидко підготував армію. Він уже бачить перед собою краєвид на океан у Гуанчжоу; він провів майже десять років, споглядаючи озеро Дунтін зі своєї резиденції в Юеяні, але скоро він зможе вдихнути справжнє морське повітря. З цією думкою він віддав наказ."
 HNN_petition_accepted_loc_desc_szc: "З Пекіна прийшли гарні новини. Визнавши аргументи генерал-інспектора Тана, керівництво погодилося на марш проти Чунціна. За умови координації дій із Пекіном Тан висунув війська на південь, поки сили У Пейфу тиснуть із півночі. З крихтою везіння конфлікт буде коротким, а Сичуань швидко увійде до складу Політичної ради Південно-Західного Китаю."
 HNN_petition_accepted_loc_desc_yun: "Гарні новини з [HNN_zhili_home_base]: там визнали загрозу з боку Юньнані та прийняли петицію про марш на Куньмін. Генерал-інспектор Тан уже відправив телеграму губернатору Гуйчжоу Юань Цзуміню, запевнивши його, що той скоро поверне контроль над усією провінцією! Нам залишається лише віддати наказ про наступ."
 hunan_zhili_events.10.a: "[HNN_petition_accepted_loc_option]"
 HNN_petition_accepted_loc_option_gxc: "Негайно рушаємо на південь!"
 HNN_petition_accepted_loc_option_szc: "Порядок у Сичуані нарешті буде відновлено"
 HNN_petition_accepted_loc_option_yun: "Ми негайно повернемо Гуйчжоу та захопимо Юньнань!"

 hunan_zhili_events.11.t: "Нашу петицію відхилено"
 hunan_zhili_events.11.d: "З [HNN_zhili_home_base] надійшли невтішні новини: керівництво Чжилі вирішило відхилити нашу петицію. [HNN_tang_xiangming_title] Тан зрозуміло розчарований, але завдяки своїй відданості військовій дисципліні він прийняв це рішення з гідністю. Оскільки зовнішня експансія тепер неможлива, він зосередив увагу на внутрішніх справах та зміцненні своїх позицій на підконтрольних територіях."
 hunan_zhili_events.11.a: "Прикро, але ми мусимо це прийняти."

 hunan_zhili_events.12.t: "Наші друзі в Гуйчжоу"
 hunan_zhili_events.12.d: "[HNN_tang_xiangming_title] Тан Сянмін та губернатор Юань Цзумінь зустрілися сьогодні на кордоні, де їхні армії провели спільні навчання. Спостерігаючи за маневрами військ, губернатор Юань відвів Тана вбік, [HNN_friends_in_guizhou_end_text]"
 hunan_zhili_events.12.guizhou.split: "і підняв питання щодо ситуації в Гуйчжоу та юньнаньської кліки. Він заявив, що був би радий надати Хунані більшу підтримку, якби вони допомогли повернути Гуйчжоу під владу законного правителя.\n\n[HNN_tang_xiangming_title] Тан погодився, запевнивши губернатора Юаня, що зробить усе можливе для відновлення влади в Гуйчжоу, і висловив сподівання, що цей день стане початком ще міцнішого альянсу."
 hunan_zhili_events.12.guizhou.united: "говорячи про нещодавнє повернення Гуйчжоу та його офіційне приєднання до Політичної ради Південно-Західного Китаю.\n\nДякуючи Тану за допомогу у відвоюванні рідної провінції, він висловив сподівання на плідне партнерство між Гуйяном та Чаншею. Генерал-інспектор погодився, наголосивши, що в єдності — сила."
 hunan_zhili_events.12.a: "За довге та плідне партнерство!"

 hunan_zhili_events.13.t: "Втеча федералістів"
 hunan_zhili_events.13.d: "Викорінивши отруту Гоміньдану в Хунані, [HNN_tang_xiangming_title] Тан звернув увагу на ще підступнішого ворога — федералістів. Колишній губернатор Чжао стверджував, що вірний Чжилі, але охоче давав притулок тим, хто бажав їхнього повалення. Не маючи терпіння до неслухняних, Тан наказав своїм людям розшукати цих зрадників. На жаль, багатьом вдалося втекти до інших частин Китаю.\n\nСеред нечисленних колишніх союзників Чжао, яким можна довіряти — діархія Сянсі. Тан провів нові переговори з Тянь Інчжао. Ця людина контролює значну частину асамблеї, і оскільки він почав інтегруватися до кліки Тана, цілком логічно об’єднати його парламентську групу з «Асоціацією гармонії» Тана, щоб ефективніше використовувати спільні ресурси."
 hunan_zhili_events.13.a: "У нас немає місця для зрадників."

 hunan_zhili_events.14.t: "Залізна п'ята"
 hunan_zhili_events.14.d: "Однією з найнебезпечніших рис Гоміньдану є їхня відданість соціалістичним ідеалам та інтернаціоналізму, який радше бачив би Китай проданим самопроголошеним «антиімперіалістам». Ми не можемо дозволити цим ідеям ширитися нашою провінцією.\n\n[HNN_tang_xiangming_title] Тан не шкодував зусиль для розправи над соціалістами. Після заборони профспілок почалися страйки, які були швидко придушені армією, що силоміць повернула робітників до праці. Ватажків було кинуто до в'язниць у жахливі умови. У відповідь лідери КСП втекли, а сама партія розбита. З відсіченими головами соціалістичної гідри цей рух згасне сам собою."
 hunan_zhili_events.14.a: "Зрадники та боягузи."

 hunan_zhili_events.15.t: "Нові вибори?"
 hunan_zhili_events.15.d: "Коли безпеку Хунані було забезпечено, з'явилися заклики припинити воєнний стан і повернути цивільний контроль. Тан прислухався до них і оголосив про завершення періоду воєнного стану.\n\n[HNN_new_elections_middle_text] Тан Сянмін переконав свого брата, Тан Хуалуна, повністю інтегрувати Китайську конституційну партію до коаліції «Асоціації гармонії». Завдяки спільній силі вони здобули перемогу на виборах, отримавши більшість в асамблеї, яка швидко обрала Тан Сянміна новим цивільним губернатором Хунані.\n\nХоча дехто поза межами провінції заявляє про несправедливість виборів, всередині Хунані таких повідомлень немає, тож губернатор вважає ці заяви звичайними чутками. Маючи на руках «демократичний» мандат, Тан Сянмін готується до нового терміну."
 hunan_zhili_events.15.scpc: "Переходячи від статусу військового губернатора до цивільного, він визнає потребу в офіційному мандаті та оголосив про негайне проведення виборів. Він також заявив, що працюватиме з Гуандуном і Гуансі для відновлення цивільного контролю, після чого складе повноваження генерал-інспектора Сян-Юе-Гуй і правитиме лише в Хунані."
 hunan_zhili_events.15.hnn: "Переходячи від статусу військового губернатора до цивільного, він визнає потребу в офіційному мандаті та оголосив про негайне проведення виборів."
 hunan_zhili_events.15.a: "За нашого «цивільного» губернатора!"

 hunan_zhili_events.16.t: "Головнокомандувач Хунані"
 hunan_zhili_events.16.d: "Незважаючи на заклики повернути цивільний контроль, Тан Сянмін розуміє, що це лише ілюзія безпеки. Бачачи загрози навколо, він відхилив спроби пом’якшити режим і заявив, що воєнний стан триватиме доти, доки не буде забезпечено «абсолютну безпеку від зовнішніх загроз».\n\nЦя жорстка позиція змусила багатьох інтелектуалів та демократів дистанціюватися від режиму, включаючи його власного брата, Тан Хуалуна. Хоча Тан Хуалун не пішов у відставку, він дав зрозуміти братові, що вважає це відвертим захопленням влади.\n\nТан Сянмін провів приватну розмову з братом, переконуючи його у своїй правоті. Забезпечивши підтримку брата, адмірал заявив, що кожен зрадник Хунані постане перед швидким судом, а уряд не терпітиме непокори."
 hunan_zhili_events.16.a: "Головнокомандувач несе порядок, а не свободу."

 hunan_zhili_events.17.t: "Створення Політичної ради Південно-Західного Китаю"
 hunan_zhili_events.17.d: "Після переговорів із Пекіном Тан Сянмін оголосив про створення Політичної ради Південно-Західного Китаю. Його статус було підвищено до генерал-інспектора Сян-Юе-Гуй (Хунань, Гуандун, Гуансі), що дало йому прямий контроль над військовими справами та фактичну владу над цими регіонами.\n\nУ Хунані мало що змінилося, але в обох Гуанах це означало припинення окупації міст армією. У Гуансі він вирішив співпрацювати з місцевими кланами та колишніми мілітаристами, як-от Лю Чженьхуань, щоб забезпечити порядок.\n\nУ Гуандуні знадобився м'якший підхід. Тан послав брата Хуалуна на переговори з асамблеєю. Тан Хуалун зміг знайти компроміс, граючи на страхах торговців та консерваторів. З підпорядкуванням обох Гуанів Тан Сянмін створив потужний південний блок та здобув значну автономію від Пекіна."
 hunan_zhili_events.17.a: "За генерал-інспектора Сян-Юе-Гуй, за Тан Сянміна!"

 hunan_zhili_events.18.t: "Відновлення порядку в Сичуані"
 hunan_zhili_events.18.d: "Завоювання Сичуні, найбільш роздробленої провінції Китаю, принесло певну стабільність. Тан Сянмін, не бажаючи особисто занурюватися в політичний хаос регіону, знайшов відповідного губернатора — Тянь Суняо. Він — запеклий антисоціаліст, який знає політику провінції краще за будь-кого ззовні. Тан надіслав йому телеграму, дозволивши зайняти території, що контролювалися армією, щоб тримати інших виживших мілітаристів у вузді."
 hunan_zhili_events.18.a: "Порядок у Ченду нарешті відновлено."

 hunan_zhili_events.19.t: "Приборкання оплоту республіканізму"
 hunan_zhili_events.19.d: "Юньнань, одна з найбунтівніших провінцій, нарешті була приборкана Тан Сянміном. Відтоді як Цай Е проголосив незалежність у відповідь на коронацію Юань Шикая, цей регіон традиційно був ворожим до центру. Проте Юньнань пав перед нашими силами. Тан швидко знайшов союзника — генерала Ху Жоюя, який поважає центральну владу і як уродженець краю зможе втихомирити заворушення. Тан повідомив його про призначення губернатором, отримавши запевнення, що порядок буде відновлено негайно."
 hunan_zhili_events.19.a: "Республіканський оплот падає перед генерал-інспектором."

 hunan_zhili_events.20.t: "Повернення Гуйчжоу"
 hunan_zhili_events.20.d: "Тимчасово залишивши Чаншу на брата, Тан Сянмін прибув до Гуйяна, оцінюючи стан міста після боїв. Разом із ним прибув губернатор Юань Цзумінь, який нарешті повернувся до столиці своєї провінції вперше з 1921 року.\n\n[HNN_reclamation_of_guizhou_end_text]"
 hunan_zhili_events.20.alliance: "Це була їхня перша розмова з часів навчань на кордоні. Тан Сянмін дотримав слова і зробив усе для відновлення влади Юаня. Повернення Гуйчжоу стало світлим днем для їхнього альянсу та всієї історії Китаю."
 hunan_zhili_events.20.no.alliance: "Коли Тан тільки очолив Хунань, Юань не знав, чого чекати від нового режиму. Возз'єднання Гуйчжоу стало для нього приємним сюрпризом. Він коротко поспілкувався з Таном, зазначивши, що зараз мусить зосередитися на інтеграції провінції, але висловив бажання зустрітися знову найближчим часом."
 hunan_zhili_events.20.a: "Гуйчжоу, так довго розділене, нарешті об'єднане."

#Kuomintang events
 hunan_kuomintang_events.1.t: "Приголомшливий успіх на виборах"
 hunan_kuomintang_events.1.d: "На подив усім, спільний список Гоміньдану здобув перемогу над «Товариством народного оновлення» Чжао Хенті та іншими ліберальними партіями. Будучи аутсайдерами на початку перегонів, дует зміг завоювати серця та розуми жителів Хунані: Тан беззаперечно здобув голоси робітників, тоді як Чену вдалося схилити на свій бік поміркованих виборців, що скептично ставилися до радикальних дій Тана.\n\nХоча вибори супроводжувалися сплеском політичного насильства з боку Гоміньдану, дует увійшов до провінційної асамблеї як переможці. [HNN_kmt_leader] склав присягу як губернатор провінції, а [HNN_kmt_sic] став спікером асамблеї. Вони швидко наповнили кабінет своїми соратниками по партії.\n\nПроте не всі в регіоні згодні з таким розвитком подій. Тан Сянмін, командувач гарнізону в Юеяні, виявився таємничо несприйнятливим до телеграм від нового уряду. Так само на сході та заході партнери Чжао — Юань Цзумінь та діархія Тянь Інчжао і Чень Цюйчженя — відмовилися відповідати на будь-які повідомлення. Провідні військові фігури, зокрема Хе Цзянь та Сун Сілянь, попередили своїх командирів, що бейянські мілітаристи можуть планувати повалення революційного уряду, і Гоміньдану варто діяти першим."
 hunan_kuomintang_events.1.a: "Над Чаншею згущуються хмари..."

 hunan_kuomintang_events.2.t: "Останній виступ адмірала"
 hunan_kuomintang_events.2.d: "Після розгрому Тана «М'ясника» Сянміна та повного розриву зв'язків із клікою Чжилі, Єдиний фронт Гоміньдану подолав шторм хаосу і нарешті може зосередитися на проведенні Національної революції. Як показало вагання частин провінційної армії, тільки Гоміньдан здатний вести Хунань до світлого майбутнього.\n\nОднак робота ніколи не закінчується, адже на заході та сході Гуйчжоу залишаються дві загрози. Діархія Тянь Інчжао та Чень Цюйчженя в Сянсі, а також стара кліка Гуйчжоу, що закріпилася на сході, залишаються ворожими. Спільна міць Єдиного фронту знадобиться, щоб викорінити обидві загрози.\n\nПроте вони не самотні у своїх зусиллях. Тань Янькай, колишній командувач 2-ї армії Гоміньдану та ексгубернатор Хунані, вирішив відродити своє військове формування. Попри особисту неприязнь до Чена і Тана через минулі конфлікти, Тань все ж протягнув руку допомоги — якщо не самому Гоміньдану, то республіканському руху в цілому."
 hunan_kuomintang_events.2.a: "Час збирати каміння."

 hunan_kuomintang_events.3.t: "Раптовий фінець"
 hunan_kuomintang_events.3.d: "Чен Цянь наполегливо працював над викоріненням місцевих мілітаристів та бандитів. Тим часом Тан Шенчжи та Тань Янькай займалися загальним управлінням провінцією, намагаючись повернутися до нормального життя після хаотичних виборів та спроби перевороту Тан Сянміна.\n\nПроте, скориставшись новими повноваженнями, Тан нещодавно скликав екстрене засідання провінційної асамблеї. Коли зали заповнилися депутатами, натовп помітив відсутність кліки Тань Янькая та інших лібералів. Тан Шенчжи відкрив засідання оголошенням про те, що провінційна асамблея розпускається, конституція оголошується недійсною, а Гоміньдан проголошує створення нової революційної партійної держави. Коли галас вщух, Тан висунув усім присутнім звинувачення в «революційній зраді» і наказав почати негайні арешти.\n\nДізнавшись про розпуск асамблеї, Чен Цянь негайно надіслав телеграму до столиці, але не отримав відповіді. Натомість йому відповів Тань Янькай, який встиг евакуювати ключових республіканців, щоб вони не були ув'язнені підрозділами 8-ї армії."
 hunan_kuomintang_events.3.a: "Перший удар по місцевих тиранах та злій шляхті!"
 hunan_kuomintang_events.3.b: "Ви зовсім втратили глузд?"

 hunan_kuomintang_events.4.t: "Розплата для зрадників"
 hunan_kuomintang_events.4.d: "Генерали Чен Цянь і Тан Шенчжи погодилися на одночасний удар по Юань Цзуміню в Гуйчжоу та діархії на заході Хунані. Чен атакував діархію, використавши потужні артилерійські обстріли для придушення моралі ворога, після чого дивізія Сун Сіляня оточила Сянсі. Сили Тянь Інчжао та Чень Цюйчженя не змогли переломити ситуацію і здалися 6-й армії.\n\nНа фронті у східному Гуйчжоу 8-ма армія Тана розгорнула кампанію за підтримки партизанів. Завдяки допомозі Ван Тяньпея, який надав дані про слабкі місця Юань Цзуміня, 8-ма армія здобула перемогу з мінімальними втратами.\n\nПісля захоплення Юаня дивізією Хе Цзяня, мілітарист був переданий Тану, а губернатором Гуйчжоу призначили лояліста Лу Дао. Згодом з’явилися новини, що Юань помер під вартою. Це викликало підозри у Тань Янькая, який звинуватив Тана в таємній страті Юаня за його зраду під час Північного походу. Чен Цянь також дорікнув Тану за таку безжальність."
 hunan_kuomintang_events.4.a: "Помста за Північний похід."
 hunan_kuomintang_events.4.b: "Помста — це доля дурнів."

 hunan_kuomintang_events.5.t: "Розкол у «Єдиному» фронті"
 hunan_kuomintang_events.5.d: "Страх перед невдачею дедалі частіше переслідує Чен Цяня. Альянс із лівим Гоміньданом Тана, який він бачив як перший крок до примирення партії, був зруйнований реальністю. Тань Янькай намагався бути посередником між 6-ю та 8-ю арміями, але марно — вони стали майже непримиренними.\n\nПроте серед командирів 8-ї армії з’явився «дисидент» — Хе Цзянь. На відміну від Хе Луна чи Пен Дехуая, він не поділяє селянського соціалізму. Конфліктуючи з Таном через його радикальні дії, Хе Цзянь надіслав петицію Чен Цяню з проханням перевести його 2-гу дивізію до складу 6-ї армії в обмін на підвищення для себе та свого заступника Лю Цзяньсюй.\n\nНа екстреному конгресі Чен Цянь оголосив про низку призначень та створення нових управлінь охорони спокою для боротьби з проблемами ополчення. Тан Шенчжи у відповідь призначив своїх лоялістів на ключові посади в провінційній армії. Єдиний фронт фактично перестав існувати, і тепер залишитися має лише один..."
 hunan_kuomintang_events.5.a: "З’являється четвертий гравець."

 hunan_kuomintang_events.6.t: "Проблема місцевого ополчення"
 hunan_kuomintang_events.6.d: "Місцеві ополчення в Хунані мали захищати громади, але на практиці вони стали інструментом місцевих еліт. Командири часто корумповані та зловживають владою, а рівень підготовки загонів сильно різниться від повіту до повіту.\n\nХе Цзянь запропонував реформу: розділити ополчення на регулярні кадрові частини та масове народне ополчення («дозорні патрулі»). Усіх чоловіків до 40 років зобов’яжуть брати участь у патрулях, з яких потім обиратимуть людей для служби в регулярних ротах. Питання лише в тому, проти кого спрямувати ці сили. Тан Шенчжи наполягає на боротьбі з «ворогами народу», тоді як Чен Цянь вважає, що ополчення має зосередитися на бандитах та залишках дрібних мілітаристів."
 hunan_kuomintang_events.6.a: "Спрямувати наші зусилля проти ворогів народу!"
 hunan_election_events.6.b: "Зосередитися на бандитах та дрібних мілітаристах."

 hunan_kuomintang_events.7.t: "Створення Корпусу охорони спокою"
 hunan_kuomintang_events.7.d: "Реформа ополчення Хе Цзяня не дала очікуваних результатів. Магістрати були занадто зайняті, тому управління перейшло до заступників із числа місцевої еліти, що призвело до старих зловживань. Замість патрулів фактично з’явилися легалізовані найманці.\n\nХе Цзянь запропонував нову реформу: об’єднати всі роти в повітові полки «охорони спокою» з армійською підготовкою та професійними офіцерами, підпорядкованими йому особисто. Тан Шенчжи та його соратники висловили занепокоєння антисоціалістичними поглядами Хе Цзяня, звинувачуючи його в створенні особистої армії «легальних головорізів» для розправи над бідними громадянами. Хе ж запевняє, що його мета — мілітаризувати народ Хунані для захисту від будь-якого загарбника."
 hunan_kuomintang_events.7.a: "Це образа для самої партії!"
 hunan_kuomintang_events.7.b: "Стримати найгірші прояви."

 hunan_kuomintang_events.8.t: "Фінансування освіти"
 hunan_kuomintang_events.8.d: "Хе Цзянь і Чен Цянь запропонували амбітний план розширення початкових шкіл у Хунані з 18 000 до 23 800, а також створення середніх шкіл у кожному повіті та запровадження іспитів для вчителів. План також включає стипендії для бідних сімей та кампанію з ліквідації неписьменності.\n\nГоловне питання — де взяти гроші. Хе Цзянь наполягає на виділенні чверті бюджету на ці потреби. Тан Шенчжи зауважує, що виплати держслужбовцям і так затримуються, тому потрібні скорочення. Він пропонує забрати кошти в управлінь охорони спокою Хе Цзяня, щоб вони не могли діяти незалежно від армії. Хе Цзянь же пропонує скоротити фінансування профспілкових програм, стверджуючи, що вони лише посилюють вплив синдикалістів."
 hunan_kuomintang_events.8.a: "Переспрямувати кошти з управлінь охорони спокою."
 hunan_kuomintang_events.8.b: "На жаль, доведеться скоротити фінансування профспілок."

 hunan_kuomintang_events.9.t: "Геть старе, нехай живе нове"
 hunan_kuomintang_events.9.d: "Хе Цзянь пропонує реформувати місцеву адміністрацію, запровадивши систему іспитів для магістратів та регулярні перевірки їхньої ефективності. Тан Шенчжи виступив проти цього, заявивши, що чиновників треба оцінювати не за ефективністю, а за лояльністю до партії. Він нагадує, як у минулому місцева шляхта контролювала магістратів через хабарі. Лише партійна лояльність може виправити помилки минулого."
 hunan_kuomintang_events.9.a: "Партійна лояльність понад усе!"
 hunan_kuomintang_events.9.b: "Призначати магістратів на основі заслуг, а не ідеології."

 hunan_kuomintang_events.10.t: "Межі тимчасових дій"
 hunan_kuomintang_events.10.d: "Хе Цзянь пропонує створити низку дорадчих комітетів та правил для підготовки до наступних етапів Національної революції. Він вважає, що провінція ще не готова до «політичної опіки», тому детальні інструкції мають стати дороговказом для майбутніх дій. Чен Цянь підтримує цей підхід, вважаючи його важливим кроком у розбудові держави.\n\nТан Шенчжи та 8-ма армія категорично проти. Вони вважають, що бюрократизація лише затягне партію в болото паперової тяганини. Тан виступає за політику короткого планування та негайних дій, стверджуючи, що революційне управління — це сувора справа, а надмірне писарство перетворить уряд на подобу неефективного Бейяну."
 hunan_kuomintang_events.10.a: "Плани нічого не варті без відповідних дій!"
 hunan_kuomintang_events.10.b: "Управління — це не кількість слів, а результат їх впровадження."

 hunan_kuomintang_events.11.t: "Закладання фундаменту"
 hunan_kuomintang_events.11.d: "За порадою Хе Цзяня уряд розпочав розширення транспортної мережі Хунані, плануючи збільшити протяжність доріг з 1 000 до 4 000 миль. Це дозволить налагодити автомобільне сполучення з усіма сусідніми провінціями. Також планується модернізація залізниці Гуанчжоу — Пекін та розширення телефонних ліній.\n\nТан Шенчжи розкритикував ці проєкти, назвавши їх марнуванням ресурсів. Він зазначає, що будівництво доріг мало допомагає фермерам, у яких немає машин, і є лише ознакою того, що провінційний уряд та 6-та армія дбають про власні вигоди."
 hunan_kuomintang_events.11.a: "Ці зусилля не доходять до тих, хто потребує їх найбільше."
 hunan_kuomintang_events.11.b: "Чудова ініціатива, Хе Цзяню!"

 hunan_kuomintang_events.12.t: "Революційний савант Хунані"
 hunan_kuomintang_events.12.d: "Коли Тан Шенчжи вперше зрадив Чжао напередодні Північного походу, він не знав, як це змінить його життя. Можливо, якби він залишився з Чжао, він був би одним із його вірних лейтенантів. Але чи був би він задоволений? Чи зміг би він спостерігати, як Чжао придушує робітничий рух та співпрацює з деспотами?\n\nГенерал зрозумів, чому Сіньхайська революція 1911 року зазнала невдачі: їй бракувало участі робітників і селян. Успіх революції залежить від масового повстання народних мас. Обійшовши свого суперника Чен Цяня, Тан скликав другий конгрес, на якому оголосив про негайне усунення всіх членів 6-ї армії з урядових посад та розпуск управлінь охорони спокою.\n\nПроте Тан не позбавив нікого з 6-ї армії партійного квитка, можливо, з поваги до спільних жертв. Він простягнув руку своїм суперникам, сподіваючись, що разом вони зможуть захистити народ Хунані."
 hunan_kuomintang_events.12.a: "Нарешті на вершині."

 hunan_kuomintang_events.13.t: "Роздуми старої гвардії"
 hunan_kuomintang_events.13.d: "Загартований та битий долею, проте впертий і непохитний. Немає влучніших слів, щоб описати тривалу революційну боротьбу Чен Цяня за китайський народ. Хоча молоді радикали з іншого боку вважають його реліктом минулої епохи, саме Чен забезпечує впевнене керування майбутнім Хунані. Навіть якщо він сам розпалив полум'я міжусобиць, що призвело до хаосу в молодій провінційній адміністрації, він залишається впевненим, що це був єдино правильний вибір.\n\nЗавдяки майстерній політичній грі старому генералу вдалося переграти радикальний натиск Тан Шенчжи. Голова скликав другий конгрес провінційного уряду Хунані, де оголосив про усунення Тан Шенчжи та восьмої армії з усіх державних посад, а також про повну дерадикалізацію управління. Рішучим кроком він призначив Хе Цзяня, натхненника останніх реформ та очільника Управління охорони спокою, виконувати обов'язки на колишній посаді Тана.\n\nПопри всі несправедливості та дії, які багато хто в партії вважав би зрадою, старий генерал вирішив не застосовувати до Тана смертну кару та не позбавляти його партійного квитка. Протягуючи руку компромісу, як і завжди, генерал сподівається, що Тан реабілітує себе службою нації та Національній революції.\n\nТим не менш, за зачиненими дверима генерал наказав Бюро громадської безпеки пильно стежити за кожним кроком Тана та його заступників — Пен Дехуая та Хе Луна. Хоча він і сподівається на їхнє щире каяття, він уже засвоїв уроки, до яких призводить безглузда довірливість. Тепер залишається лише дивитися вперед, у світле майбутнє китайської нації."
 hunan_kuomintang_events.13.a: "Мрія наших товаришів живе."

 hunan_kuomintang_events.14.t: "Наші союзники в Хунані"
 hunan_kuomintang_events.14.d1: "[ROOT.GetLeader] отримав телеграму про підтримку від голови провінції [HNN.GetLeader], яка підтверджує його зв'язки з нашим федеральним урядом. Враховуючи, що [HNN.GetLeader] нещодавно вже вдруге усунув нашого вірного союзника-федераліста Чжао Хенті, природно, що багато хто в уряді ставиться до нього з недовірою. Гірше того, саме перше повалення Чжао Таном призвело до катастрофічного Північного походу.\n\nПроте революція створює дивних союзників, і [ROOT.GetLeader] не вперше йде на компроміс із безпринципними опортуністами заради створення федеративного Китаю. Коли прихильники [HNN.GetLeader] у Гоміньдані зазнали поразки, він звернувся до [ROOT.GetLeader], який прихильно прийняв цей альянс, попри протести Чжао.\n\nЗрештою, [HNN.GetLeader] мусить рахуватися з могутністю свого головного союзника і суперника водночас — [HNN.GetSecondInCommand], який виступає категорично проти ідеології нашого уряду. На щастя, [HNN.GetLeader] запевняє, що його становище в уряді Хунані є абсолютно стабільним."
 hunan_kuomintang_events.14.d2: "Попри сувору партійну лінію Асоціації реорганізованих товаришів, хунанський Гоміньдан сміється в обличчя подібним ідеалам. Керуючись діархією восьмої армії Тан Шенчжи та шостої армії Чен Цяня, цей дует демонструє зовнішню єдність крил партії. Проте наше підпілля запевняє, що ця єдність — лише фасад. Під блиском офіціозу ховається уряд, роздертий міжусобицями та інтригами.\n\nМожливо, це дивним чином нагадує нашу власну внутрішню боротьбу за владу. Тим не менш, обидва хунанські лідери виступають проти Асоціації реорганізованих товаришів: Тан Шенчжи був ключовим генералом Тимчасового комітету дії під час повстання в Міньгані, а Чен Цянь є палким прихильником поміркованої позиції фракції відбудови Сунь Фо.\n\nПроте було б нерозумно не визнати великих успіхів провінційного уряду. Хунань продемонструвала дивовижну здатність до підтримки, нехай і недосконалої, але демократії. Провінція служить взірцевою моделлю для всієї нації на шляху до завершення Національної революції."
 hunan_kuomintang_events.14.d3: "Блискуче продемонструвавши свій стратегічний розум, Чен Цянь зміг успішно усунути одного з суперників Гоміньдану — Чжао Хенті. Цікаво, що командувач шостої армії досяг цього завдяки спільним зусиллям із радикалом з лівого Гоміньдану Тан Шенчжи. Обидва генерали увійшли в Хунань після оголошення виборів і виступили єдиним списком.\n\nХоча ідеалісти мріяли б бачити в цьому знак возз'єднання крил партії, реальність довела протилежне. Навіть зараз Чен і Тан сперечаються, б'ються та ведуть шпигунські ігри, намагаючись витіснити один одного з владних крісел.\n\nЗ огляду на обставини, вкрай важливо, щоб переможцем вийшов Чен Цянь, проте ми не маємо ресурсів для відкритої підтримки. Тим не менш, [ROOT.GetLeader] бачить, що попри чвари, Хунань впевнено стає моделлю провінції Гоміньдану на шляху до поширення Національної революції."
 hunan_kuomintang_events.14.d4: "Будучи «білою вороною» серед членів Альянсу національного захисту, голова провінції [HNN.GetLeader] надіслав низку детальних телеграм до [ROOT.GetLeader], запевняючи в постійній підтримці альянсу. Революціонер за духом і діями, голова опинився серед тих, хто зазвичай не погоджується з його методами управління, але він продовжує битися на їхньому боці.\n\nПопри союзників вельмишановного голови, сама Хунань залишається осередком революційного запалу з потужним робітничим рухом та ще міцнішим селянським фундаментом. Можливо, Гоміньдан збережеться в Хунані навіть після возз'єднання країни силами АНЗ.\n\nЗрештою, [HNN.GetLeader] змушений змагатися за вплив зі своїми більш ортодоксальними соратниками по партії. Поки голова підтверджує свою відданість нам, його заступник і головний суперник [HNN.GetSecondInCommand] зовсім не є нашим другом і буде запекло протидіяти нам у кожному питанні. [ROOT.GetLeader] залишається лише сподіватися, що голові вдасться втихомирити своїх радикалів."
 hunan_kuomintang_events.14.a: "Краще знайоме зло..."
 hunan_kuomintang_events.14.b: "Вітаємо голову провінції [HNN.GetLeader]!"
 hunan_kuomintang_events.14.c: "Сподіваємося, Чен Цянь зможе втримати контроль."

 hunan_kuomintang_events.15.t.hejian: "Перебіжчик, що став переможцем"
 hunan_kuomintang_events.15.t.song: "Світло Вампу"
 hunan_kuomintang_events.15.t.cheng: "Вічний революціонер"
 hunan_kuomintang_events.15.t.peng: "Найяскравіший розум восьмої"
 hunan_kuomintang_events.15.t.helong: "Герой червоного селянства"
 hunan_kuomintang_events.15.t.tang: "«Буддійський» генерал"
 hunan_kuomintang_events.15.d.hejian: "Людина, яка багатьох вводить в оману, але викликає не меншу огиду в інших — Хе Цзянь є втіленням кадрового офіцера. Його амбіції змусили його змінити повільний шлях вченого на стрімку військову кар'єру в арміях нового зразка. Хе Цзянь — ветеран багатьох конфліктів, де його гострий розум та швидкість мислення допомагали йому виживати. Спершу він ішов слідами Тан Шенчжи, дослужившись до командира бригади, але почав проявляти себе як самостійна постать після Північного походу. Досягнувши вершини кар'єри на посаді командира дивізії та очільника Управління охорони спокою, Хе, можливо, і не є найлояльнішим чи ідейним офіцером, але його досягнення говорять самі за себе."
 hunan_kuomintang_events.15.d.song: "Втілення покоління кадрів Вампу, Сун Сілянь є новим молодим обличчям у Національно-революційній армії. Схильний до революційної діяльності з юних років, у віці 13 років він разом із однокласниками заснував революційну газету, відому своєю гострою критикою Чжао Хенті. Ставши наймолодшим випускником у історії академії Вампу, Сун увірвався на поля битв, відзначившись у Східному та Північному походах. Його справжня кар'єра ще тільки починається, і хоча його вважають одним із найкращих офіцерів Гоміньдану, він намагається зберігати аполітичну позицію у внутрішньопартійних чварах, хоча його особиста лояльність належить старому командиру — Чен Цяню."
 hunan_kuomintang_events.15.d.cheng: "Ведучи революційну боротьбу протягом десятиліть, Чен Цянь бачив багато злетів та падінь, проте ніколи не був остаточно переможений. Його служба в часи Сіньхайської революції та Північного походу робить його символом непохитних революціонерів Тунменхою — покоління, що вже відходить у минуле. Поміркований у очах сучасників як з правого, так і з лівого крила Гоміньдану, Чен більше наслідує шлях Сун Цзяоженя чи Хуан Сіна, ніж доктора Сунь Ятсена. Тим не менш, старий тигр бився пліч-о-пліч із покійним генералісимусом Чан Кайші та генералом Лі Цзішенем, завжди сподіваючись побачити тріумф Національної революції. Завдяки останнім перемогам на полі бою Чен зміг завоювати серця людей для своєї славетної шостої армії."
 hunan_kuomintang_events.15.d.peng: "Народившись у сім'ї з давніми фермерськими традиціями, Пен Дехуай був змушений йти на численні жертви задля виживання родини в часи її занепаду. Взявши участь у селянському повстанні, він мусив тікати з дому і згодом, у 1916 році, вступив до армії Тан Сянміна. Це стало початком славетної революційної кар'єри, протягом якої Пен вічно боровся за права своїх побратимів-селян. Маючи хист до військового командування, він постійно вдосконалював свої навички, що призвело до його призначення командиром дивізії в Міньгані. Вважаючись другим стовпом восьмої армії поряд із Хе Луном, цей дует продовжує просувати доктрину аграрного соціалізму під проводом свого начальника Тан Шенчжи, попри його більш помірковані погляди."
 hunan_kuomintang_events.15.d.helong: "Оскільки його батько був членом товариства Гелаохуей та офіцером армії Цін, доля Хе Луна, здавалося, була наперед визначена військовою та революційною діяльністю. Після бурхливого шляху, де він захоплювався соціалізмом, брав участь у замаху на Тань Янькая та зазнав поразки від Чжао Хенті, Хе приєднався до Національно-революційної армії, де служив із честю. Після поразки Північного походу він пішов за восьмою армією в зону повстання, де зблизився з Тимчасовим комітетом дії. Закріпивши свої аграрно-соціалістичні погляди, Хе використовує військові успіхи як трибуну для просування ідеалів своєї радикальної фракції у восьмій армії. Проте наскільки сильно він зможе впливати на політику Тан Шенчжи — залишається питанням часу."
 hunan_kuomintang_events.15.d.tang: "Багато хто вважає його зрадником, опортуністом та ознакою занепаду Гоміньдану, проте ніхто не може заперечити революційні заслуги Тан Шенчжи. Вступивши до Тунменхою у 1909 році, Тан бився у студентському корпусі під час Сіньхайської революції, служив під началом Чжао Хенті у 1923 році, а згодом, у 1926-му, виступив проти самого Чжао. Очоливши восьму армію того ж року, Тан став іскрою, що розпалила полум'я Північного походу, здобувши низку швидких перемог. Спостерігаючи за боротьбою за владу та наживу в Хунані, Тан впав у депресію, доки не зустрів буддійського наставника Гу Босюя, після чого прийняв його вчення. Поки політичні опоненти намагаються зобразити його релігійним фанатиком, Тан з гордістю носить прізвисько «буддійський генерал»."
 hunan_kuomintang_events.15.a: "Небачені амбіції, проте сумнівна вдача."
 hunan_kuomintang_events.15.b: "Наш промінь надії в ці скрутні часи."
 hunan_kuomintang_events.15.c: "Старий пес ще знає кілька фокусів."
 hunan_kuomintang_events.15.d: "Непохитний у своїх переконаннях."
 hunan_kuomintang_events.15.e: "Б'ється за народ."
 hunan_kuomintang_events.15.f: "«Буддійський» генерал? Забавно."

 hunan_kuomintang_events.16.t: "Домінування восьмої армії"
 hunan_kuomintang_events.16.d: "Варто визнати, що радикальна революція потребує радикальних дій, проте такі дії здатні повалити самі опори, на яких тримається держава. Звісно, восьма армія — не анархісти, і навіть вони розуміють цінність підтримки принаймні ввічливих стосунків з опозицією. Накопичуючи владу в усіх органах управління, їм вдалося відтіснити шосту армію на межу політичного небуття.\n\nЦей тотальний контроль перетворився на потужний потік, у якому будь-яка опозиція Тану була заглушена відділом пропаганди восьмої армії. Однак це викликає побоювання, що таке домінування призведе до майбутньої слабкості. Радикали восьмої армії стають дедалі пихатішими, починаючи тиснути навіть на поміркованих офіцерів у власних лавах.\n\nШоста армія похитнулася, але вона ще не вибула з гри. Можливо, через наші зв'язки та почуття братерства Тан зможе відкрити шлях шостій армії для удару у відповідь проти радикалів у його таборі. Це був би мудрий вибір, адже на кону стоїть доля всієї Хунані."
 hunan_kuomintang_events.16.a: "Закликати Тань Янькая стати посередником."
 hunan_kuomintang_events.16.b: "Розвивати перевагу заради повної перемоги!"

 hunan_kuomintang_events.17.t: "Домінування шостої армії"
 hunan_kuomintang_events.17.d: "Поки шоста армія позиціонує себе як щит поміркованості проти ймовірної тиранії восьмої, наші дії з «захисту» можуть як оберігати народ, так і придушувати його голос. Зрештою, успіхи шостої армії на політичному фронті призвели до майже повного панування її офіцерів в уряді, тоді як вплив усіх лоялістів Тан Шенчжи чи Китайської синдикалістської партії був ізольований.\n\nВважаючи це ціною, яку ми мусимо заплатити за порятунок, призначенці шостої армії стають дедалі самовпевненішими, втрачаючи пильність, яка принесла їм могутність. Водночас управління охорони спокою діють дедалі зухваліше, більше не вважаючи за потрібне приховувати свої антисоціалістичні зловживання.\n\nЗанепокоєний стабільністю Хунані, Чен міг би звернутися до Тана, щоб вирівняти шальки терезів і дозволити восьмій армії відновити вплив. Це виглядає як слушна можливість, поки Хунань не поринула у відкриту громадянську війну."
 hunan_kuomintang_events.17.a: "Закликати Тань Янькая стати посередником."
 hunan_kuomintang_events.17.b: "Розвивати перевагу заради повної перемоги!"

 hunan_kuomintang_events.18.t: "Пишність та урочистість"
 hunan_kuomintang_events.18.d: "Гоміньдану не звикати до грандіозних військових парадів, щедрого нагородження дивізій медалями та відзнаками. Шоста та восьма Національно-революційні армії пройшли огляд під наглядом голови [HNN.GetLeader] та [HNN.GetSecondInCommand]. Офіційно це подається як демонстрація військової моці партії, проте в уряді вважають, що це спроба лідерів довести перевагу своєї армії над суперником.\n\nНатовп у 15 000 людей зібрався, щоб побачити кращих солдатів обох армій. Першою виступала шоста армія Чен Цяня під проводом їхньої «зірки» Сун Сіляня. Втілюючи міць правого Гоміньдану, загартовані в боях солдати з гордістю несли стандартну форму партії. Крокуючи в унісон під гучну музику, вони випромінювали рішучість.\n\nНа противагу їм, восьма армія Тан Шенчжи представляла суміш іррегулярних частин, регулярних військ та елітних ветеранів Тана. Ймовірно, через особливу увагу командира до презентації, їхня форма була бездоганною, явно виготовленою спеціально для параду.\n\nПроте найбільшу цікавість викликали відзнаки елітних солдатів Тана. Усі вони носили «Медаль великої доброчесності та спасіння людства» — явну ознаку буддійського впливу командира. Фактично, ці підрозділи походять із часів, коли всі підлеглі Тана мали сповідувати буддизм, щоб служити під його началом. Після завершення параду мало хто знав, як ставитися до створеного образу: еклектичного поєднання ревних буддійських воїнів із солдатами НРА."
 hunan_kuomintang_events.18.a: "Гордість Національно-революційної армії!"
 hunan_kuomintang_events.18.b: "Він індоктринував і наших товаришів?"

 hunan_kuomintang_events.19.t: "Роздуми"
 hunan_kuomintang_events.19.d: "У постійній боротьбі важко знайти час для спокою, а надто — якщо ти перебував у вигнанні з рідної провінції майже десятиліття. Гоміньдан — це організація революціонерів, молодих і радикальних. Проте в її корінні закладені тихіші часи поетів, інтелектуалів та політиків, а не мілітаристів та опортуністів. В країні все ще залишаються ті, кому вдається поєднувати обидва світи: мислителя і тактика, письменника і воїна. Чен Цянь — один із них. Хоча він все життя був військовим, генерал підтримує зв'язки з багатьма мислителями та зібрав чималу колекцію поезії та прози.\n\nВідвідавши вежу Юеян, генерал замислився. Про битву, яку він вів тут проти У Пейфу в 1917 році. Про краєвид, що залишився майже незмінним після війни та вигнання. У меланхолійному настрої генерал почав накидати нові рядки:\n\n«Що країна цінує понад усе? Немає й сліду від старих фортів минулих днів.\nНамагаюся вгледітись у далечінь, та краєвид гнітючий, шлях попереду довгий, а хуртовина лютує.\nМаленький острів у морі плекають птахи, та човни й кораблі все одно прагнуть битви з хвилями.\nКрізь віки тисне меланхолія, незліченні милості та образи протистоять одна одній.\nГори Цзюї та гора Хен здаються зовсім близькими, та пекло все одно стоїть на заваді».\n\nРозмірковуючи про боротьбу проти мілітаристів, проти власної партії та тих, хто спотворює революцію, він бачить історію цієї нації заплямованою кров'ю та стражданнями. Проте боротьба мусить тривати, попри все. Оточений з усіх фронтів, він не дасть революції Хунані згаснути."
 hunan_kuomintang_events.19.a: "Це наш тягар, який ми мусимо нести."
 hunan_kuomintang_events.19.b: "Марнувати час на вірші — недозволена розкіш."

#Zhao Hengti Events

 hunan_federalist_events.1.t: "Демократичний мандат!"
 hunan_federalist_events.1.d_1: "Оскільки коаліція Чжао та Гоміньдан опинилися в глухому куті в асамблеї, вирішальну роль у виборі губернатора відіграла низка незалежних політиків. Боючись опинитися на узбіччі у разі перемоги Гоміньдану, вони віддали свої голоси за Чжао, забезпечивши йому перемогу. У своїй інавгураційній промові Чжао говорив про захист Хунані в буремні часи та пообіцяв зміцнити молоду демократію. Він подякував усім за допомогу та запевнив, що гарантує вільну і справедливу Хунань для кожного громадянина, незалежно від його походження."
 hunan_federalist_events.1.d_2: "Коаліція Чжао Хенті здобула перемогу на виборах із помітним відривом. Цей результат навряд чи став несподіванкою, адже він від початку був фаворитом. У своїй промові Чжао наголосив на важливості збереження безпеки Хунані та зміцнення демократичних інститутів. Він подякував виборцям за довіру та пообіцяв працювати на благо всіх жителів провінції."
 hunan_federalist_events.1.a: "За Хунань і за демократію!"

 hunan_federalist_events.2.t: "Межа проведена"
 hunan_federalist_events.2.d: "Губернатор Чжао переміг на виборах, але це не означає, що демократія Хунані в безпеці. Навпаки, успіх Гоміньдану та присутність в асамблеї депутатів під впливом мілітаристів (Тан Сянміна, Чень Цюйчженя та Тянь Інчжао) лише посилили позиції прихильників авторитаризму.\n\nЦі сили не є союзниками, але всі вони загрожують нашому ладу. Якщо Гоміньдан стане занадто сильним, Тан Сянмін може рушити на південь і знищити нашу демократію. Крім того, діархія Сянсі дедалі більше віддаляється від нас, схиляючись до союзу з Таном. Ми мусимо діяти першими.\n\nНа щастя, ми не самотні. Губернатор Чжао швидко сформував «Велику коаліцію» з іншими демократичними партіями та незалежними депутатами. Це дає нам інструменти, щоб підірвати вплив автократів і завадити їм знищити справу, яка так дорога серцю губернатора."
 hunan_federalist_events.2.a: "Лінії фронту визначено. Питання лише в тому, хто переможе?"

 hunan_federalist_events.4.t: "Арешт Тан Сянміна"
 hunan_federalist_events.4.d: "Зміцнивши свої позиції, губернатор Чжао нарешті може розправитися з однією з найбільших загроз — Тан Сянміном. Ворожнеча між ними триває з 1913 року, коли Тан за наказом Юань Шикая заарештував Чжао. Попри те, що обидва симпатизують Чжилі, Чжао ніколи не довіряв цій людині.\n\nГубернатор наказав командувачу 1-ї дивізії Хе Яоцзу вирушити до Юеяну та офіційно заарештувати Тана. За кілька годин війська Хе вже були під містом, де вступили в сутичку з гарнізоном Тана. Зрештою Тан зазнав поразки і втік через кордон. Хоча Чжао не вдалося заарештувати суперника особисто, Тан Сянмін більше не становить загрози для нашої демократії."
 hunan_federalist_events.4.d.zhili: "Зміцнивши свої позиції, губернатор Чжао нарешті діє проти Тан Сянміна. Спершу він надіслав телеграму до [HNN_zhili_home_base], пояснивши, що акція спрямована виключно проти Тана, а сам губернатор залишається вірним кліці Чжилі. Після цього війська Хе Яоцзу підійшли до Юеяну. Після короткої сутички Тан був змушений тікати за кордон провінції. Його вплив у Хунані остаточно підірвано."
 hunan_federalist_events.4.a: "Скатертиною дорога."

 hunan_federalist_events.5.t: "Наша адміністрація та інтелігенція"
 hunan_federalist_events.5.d: "Однією з опор нашої влади є інтелігенція Хунані. Відтоді як Ліга почала репресії проти вчених, багато інтелектуалів знайшли притулок у нашій провінції. Уряд і мислителі утворили симбіотичний союз, який став ключовим для нашого переобрання. Чанша перетворилася на інтелектуальний центр Китаю, місце для дискусій про долю нації.\n\nЦе позитивно впливає на репутацію нашої адміністрації та доводить, що демократія і вільна думка можливі навіть у часи мілітаристського хаосу. Вражаюче досягнення для провінції, яка ще кілька років тому була частиною Ліги, що придушувала освіту."
 hunan_federalist_events.5.a: "За оновлене партнерство!"

 hunan_federalist_events.6.t: "Проблеми з Монро"
 hunan_federalist_events.6.d: "Однією з найбільш специфічних частин конституції Хунані є стаття 89, відома як «доктрина Монро». Вона забороняє іноземним військам входити в Хунань, а хунанським — залишати її. Хоча це мало б захистити провінцію, на практиці це лише обмежує наші можливості. Мілітаристи ззовні не зважають на нашу конституцію, тож вона не дає реального захисту.\n\nЧжао виступив за внесення змін до цієї статті, щоб дозволити армії Хунані діяти за межами провінції, а центральному уряду — проходити крізь наші землі за потреби. В асамблеї він нагадав про Північний похід та дії Гоміньдану, які не зупинилися перед «доктриною Монро» ні на секунду.\n\nНа його подив, асамблея сприйняла аргументи дуже прихильно. Схоже, загроза з боку націоналістів змусила багатьох усвідомити: Хунань буде в безпеці лише тоді, коли весь Китай об'єднається під одним прапором."
 hunan_federalist_events.6.a: "За нову Хунань у новому Китаї!"

 hunan_federalist_events.7.t: "Оливкова гілка для робітників"
 hunan_federalist_events.7.d: "Наші відносини з робітничим рухом завжди були складними. Загибель активістів у минулому стала символом цієї напруги. Але губернатор Чжао рішуче налаштований це змінити. Організовані робітники є опорою Гоміньдану, і щоб підірвати вплив «партійної держави», ми мусимо укласти мир із профспілками.\n\nНа зустрічі з лідерами робітників у Чанде Чжао запропонував «оливкову гілку». Представники профспілок негайно висунули вимоги щодо нового законодавства, яке б посилило їхні права. Хоча Чжао розумів, що радикальні вимоги не пройдуть через асамблею, після напружених переговорів було досягнуто компромісу. Ця угода дозволить вибити грунт з-під ніг Гоміньдану в найбільших містах провінції."
 hunan_federalist_events.7.a: "Перший крок до гармонії з робітниками."

 hunan_federalist_events.8.t: "Наш власний Білль про права"
 hunan_federalist_events.8.d: "Конституція Хунані вже надає громадянам низку прав: недоторканність особи, право на приватну власність, свободу віросповідання та загальну освіту. Це великі досягнення, але ми мусимо піти далі. Потрібно офіційно закріпити право на свободу слова, право критикувати уряд та свободу преси.\n\nГубернатор Чжао провів конференцію за участю видатних вчених провінції для розробки Білля про права. Після тривалих дебатів проєкт був підготовлений. Завдяки політичному авторитету Чжао документ пройшов через асамблею без змін, гарантуючи розширені права кожному громадянину нашої провінції!"
 hunan_federalist_events.8.a: "Важливий крок для свободи."

 hunan_federalist_events.9.t: "Старі союзники, нові проблеми"
 hunan_federalist_events.9.d: "Діархія Сянсі на заході зазвичай була лояльною до Чжао, проте тепер вона стала перешкодою для демократії. Використовуючи свої повноваження, Чжао провів реформи, що обмежили владу Тянь Інчжао та забезпечили чесне представництво західних сіл. Мілітаристи в асамблеї намагалися заблокувати ці зміни.\n\nНа наше здивування, підтримка прийшла від депутатів Гоміньдану, які вважають «західних мілітаристів» ще гіршим злом, ніж губернатора Чжао. Колишній губернатор Тань Янькай навіть виступив із палкою промовою на підтримку реформ. Ми не знаємо його справжніх мотивів, але вдячні за допомогу в усуненні впливу мілітаристів у Хунані."
 hunan_federalist_events.9.a: "Союзний мілітарист — все одно мілітарист."

 hunan_federalist_events.10.t: "Взірцева провінція федералізму"
 hunan_federalist_events.10.d: "Попри шалений опір та ворогів з усіх боків, губернатор Чжао успішно захистив демократію Хунані. Балансуючи між Тан Сянміном та Гоміньданом, він виявив неабияку майстерність. Він обмежив вплив радикалів через соціальні реформи, не давши їм використати народне невдоволення як зброю. Водночас гарнізон Юеяну вигнано, і загроза перевороту зникла. Зусилля Чжао призвели до розквіту демократичних традицій. Хунань стала справжнім оплотом свободи в самому серці Китаю, моделлю для всіх федералістів."
 hunan_federalist_events.10.a: "За Хунань, за конституцію та за федеративний Китай!"

 hunan_federalist_events.11.t: "День конституції"
 hunan_federalist_events.11.d: "Сьогодні річниця відновлення конституції Хунані — унікальне свято нашої провінції. У кожному місті тривають урочистості. Губернатор Чжао виступив у Чанші, наголосивши, що для нього честь очолювати одну з небагатьох справді демократичних провінцій Китаю. Після промови він очолив парад вулицями столиці. Енергія свята відчувалася в усьому: Хунань стала яскравим променем у темряві Ери мілітаристів, прикладом, який має наслідувати кожен!"
 hunan_federalist_events.11.a: "За ще один успішний рік!"

#Economic

 hunan_economy_events.1.t: "Світова криза досягла Хунані"
 hunan_economy_events.1.d: "Будучи однією з провінцій Ліги восьми провінцій, економіка Хунані була тісно інтегрована в ширшу німецьку систему. Проте, залишаючись переважно аграрною та оточеною промисловими центрами в Ухані, Гуанчжоу та Нанкіні, провінція переживала не найкращі часи протягом усієї Ери мілітаристів. Хто при здоровому глузді став би інвестувати в Хунань, коли поруч є значно привабливіші варіанти?\n\nПроте не все втрачено, адже збереження автономії від Сунь Чуаньфана принесло нам користь у багатьох аспектах. Попри жахливі економічні умови після так званого «Чорного понеділка», Хунань впоралася трохи краще, ніж її сусіди по Лізі чи центральний уряд.\n\nПроте, оскільки наші основні економічні партнери переживають ще гірші потрясіння, наш аграрний сектор відчуває катастрофічні наслідки, а інвестори масово тікають. Провінційний уряд мусить негайно вжити всіх доступних заходів, щоб криза не поглибилася."
 hunan_economy_events.1.a: "А я думав, що Ліга мала гарантувати нашу стабільність?"

 hunan_economy_events.2.t: "План порятунку села"
 hunan_economy_events.2.d_zhili: "Сільськогосподарський сектор Хунані нерозривно пов'язаний із природою її земель. Благодатна річка Сян забезпечує родючість, необхідну для існування багатих фермерських маєтків по всій провінції. Проте, як і на більшості родючих земель Китаю, тут панує хижацька культура орендного землеробства, що межує з феодалізмом. Ситуацію погіршує те, що сільське господарство становить значну частину доходів провінції через орієнтацію на експорт. Отже, ми маємо таку картину: праця селян породжує обурення, спрямоване проти шляхти, тоді як остання пожинає плоди свого статусу.\n\nБудучи військовим до мозку кісток, [HNN.GetLeader] не має належної кваліфікації в аграрних питаннях, проте він змушений вирішувати цю складну ситуацію. Члени асамблеї, зокрема його брат Тан Хуалун, закликають губернатора зважити на колективну травму селянства. Але впертий адмірал відмовляється слухати: він не збирається посилювати тих, хто прагне його усунення. На його думку, хунанцям потрібен захист, і лише правляча каста може його забезпечити.\n\nПопри те, що попередні спроби порушити баланс сил викликали спротив шляхти, амбіції нового проєкту залишаються непохитними. Щоб стати сучасною провінцією, Хунань мусить розробити міцну земельну політику. Губернатор [HNN.GetLeader] вирішив обрати курс на..."
 hunan_economy_events.2.d_kmt: "Сільськогосподарський сектор Хунані тримається на родючих землях біля річки Сян. Проте тут панує несправедлива система оренди, яку теоретики Гоміньдану визначають як феодальну. Місцеві землевласники використовують політичну силу для захоплення земель та експлуатації селян, зосереджуючи в руках шляхти всю економічну, військову та політичну владу. Абсолютним прерогативом партії є втручання та звільнення працівників від цього архаїчного рабства. Дотримуючись принципу «земля тим, хто її обробляє», ми покладемо край цій жорстокій системі.\n\nПопередні спроби реформ блокувалися шляхтою, але тепер ми налаштовані рішуче. Щоб стати гідною частиною Національної революції, Хунань мусить оновити земельну політику. Губернатор [HNN.GetLeader] та [HNN.GetSecondInCommand] вирішили обрати курс на..."
 hunan_economy_events.2.d_fed: "Сільськогосподарський сектор Хунані, попри свою родючість, страждає від несправедливої системи оренди, що нагадує феодалізм. [HNN.GetLeader] звернувся за порадою до асамблеї, щоб вирішити майбутнє аграрної реформи. Оскільки багато депутатів самі є землевласниками або залежать від них, голоси за помірковану реформу звучать найгучніше. З іншого боку, ліве крило коаліції наполягає на реформах в інтересах селян, наголошуючи, що це допоможе уникнути революції та позбавить Гоміньдан підтримки.\n\nПопри складний баланс інтересів, Хунань мусить створити міцний фундамент для національного відродження. Після довгих роздумів губернатор [HNN.GetLeader] вирішив обрати курс на..."
 hunan_economy_events.2.a: "Реформу, орієнтовану на селян!"
 hunan_economy_events.2.b: "У кращому випадку — обмежену реформу."

 hunan_economy_events.3.t: "Подолання фінансової кризи"
 hunan_economy_events.3.d_zhili: "Оскільки більшість промисловості Хунані зосереджена в Чанші та Чанде, саме вони стануть центром зусиль уряду з відновлення економіки. Протягом десятиліття індустріальне ядро провінції занепадало через неефективне управління та війни. Промисловці тікають, а робітники залишаються в кайданах непотизму та некомпетентності.\n\nЦей застій заважав провінції процвітати. Проте Хунань багата на ресурси, а її робітники мають технічні навички. Крім того, залізниця Гуанчжоу — Пекін відкриває шлях до зовнішніх ринків. У таборі [HNN.GetLeader] є прихильники ідеї «Хунань понад усе», проте губернатор вважає, що без ресурсів центрального уряду та бізнес-спільноти нам не обійтися. Попри можливе невдоволення робітників, Хунань потребує глибшої інтеграції."
 hunan_economy_events.3.d_kmt: "Промислове серце Хунані — Чанша та Чанде — роками занепадало через хаос Ери мілітаристів. Проте місто має потенціал: кваліфікованих робітників та зручне залізничне сполучення. Визнаючи вплив Китайської синдикалістської партії на робітників, Гоміньдан залишається партією пригноблених класів. Передбачаючи майбутнє без капіталізму, партія припинила будь-які переговори з іноземними інвесторами. Уряд затвердив масштабний план реконструкції, зосереджений на розвитку власної економіки через державний контроль, щоб забезпечити розквіт державного капіталізму в країні."
 hunan_economy_events.3.d_fed: "Промисловий сектор Хунані потребує негайного відновлення після років безгосподарності. Губернатор [HNN.GetLeader] опинився між двома таборами. Його ліві партнери закликають до автаркії та державного управління, щоб захистити робітників. З іншого боку, його власна партія виступає проти націоналізації, вважаючи її прихованим соціалізмом. Замість цього вони пропонують залучати іноземний капітал та інвестиції для стрімкого зростання. Зваживши всі варіанти, губернатор має прийняти остаточне рішення."
 hunan_economy_events.3.a: "Світові ринки вже привели нас до кризи, було б нерозумно пробувати знову."
 hunan_economy_events.3.b: "Прогрес можливий лише через інтеграцію, за будь-яку ціну!"

 hunan_economy_events.4.t: "Аграрні реформи завершено"
 hunan_economy_events.4.d: "Сільськогосподарський сектор Хунані, що роками потерпав від бідності та нерівності, нарешті звільнився від стагнації. Завдяки зусиллям чиновників та всього народу ми поклали край десятиліттям несправедливості. Досягнувши довгоочікуваної стабільності, люди тепер із надією дивляться у майбутнє. Перерозподіл земель та вирівнювання балансу між селянами та шляхтою створили міцний фундамент для майбутніх звершень губернатора [HNN.GetLeader].\n\nВикористовуючи наші родючі землі, традиційне вирощування чаю та конопель поступається місцем новим полям бавовни та рису. Завдяки підтримці малих підприємств та зростанню рівня освіти на селі Хунань досягла справжньої модернізації."
 hunan_economy_events.4.a: "За нову еру процвітання!"

 hunan_economy_events.5.t: "Промислові реформи завершено"
 hunan_economy_events.5.d: "Завдяки мобілізації всіх доступних ресурсів народ Хунані нарешті досяг бажаного успіху в індустріалізації. Поки ми віддаємо належне розробникам реформ, найбільша подяка належить простим хунанцям, чия кров і піт дозволили провінції досягти цієї мети. Наша промислова міць тепер може суперничати навіть із Маньчжурією. Безробітні повертаються на заводи, бізнес відроджується. [HNN.Capital.GetCapitalVictoryPointName] перетворилося на справжній економічний центр південно-західного Китаю. Хунань нарешті скинула кайдани минулого."
 hunan_economy_events.5.a: "Новий промисловий гігант Китаю!"

#Military
 hunan_military_events.1.t: "Передостанній стан китайської війни"
 hunan_military_events.1.d_zhili: "Народжена на руїнах Великої Цін, Бейянська армія Юань Шикая та її наступники десятиліттями правили нацією. «Армії нового зразка», як їх називали, розпалися на кліки за провінційними кордонами. Навіть сьогодні деякі з них домінують, і найвеличнішою є кліка Чжилі, яка під мудрим керівництвом Нефритового маршала зуміла об'єднати ядро нації.\n\nДля справжнього об'єднання необхідна краща зброя та кращі офіцери. Розуміючи це, губернатор [HNN.GetLeader] провів масштабні військові реформи, взірцем для яких став переможний німецький орел. Вірний Чжилі, губернатор створив справжнє втілення Нової армії: елітні офіцери та вишколені солдати готові показати ворогам безглуздість їхніх дій."
 hunan_military_events.1.d_fed: "Мало хто очікував, що провідною силою нації стане Сянська армія [HNN.GetLeader]. Після невдач 1920-х років, коли Гоміньдан неодноразово витісняв Чжао, його військо вважали виснаженим. Проте залізна рішучість Чжао принесла Хунані жадану стабільність.\n\nУ часи міжусобиць переможе той, хто матиме краще озброєння та командний склад. Визнаючи ліміти провінції, [HNN.GetLeader] розпочав глибокі реформи за німецьким зразком. Хоча Чжао є федералістом, його сили повністю незалежні від Юньнані чи Гуандуна. Без сторонньої допомоги він створив армію елітних офіцерів, готову втілити мрії федералістського руху в життя."
 hunan_military_events.1.a: "Гордість нації!"

 hunan_military_events.2.t: "Командування на передовій"
 hunan_military_events.2.d_zhili: "Хунаньські солдати відомі своєю люттю та завзяттям у бою. Попри всі труднощі, вони неодноразово переламували хід битв. Завдяки реформам Хунань повернула собі цю славу, але розквітли не лише солдати, а й офіцерський склад.\n\n[HNN.GetLeader] не є уродженцем Хунані, але доля пов'язала його з цією землею. Починаючи як адмірал флоту Цін, Тан очолив сухопутні сили лише під час війни на захист республіки у 1916 році. Ставши генералом у 1917-му, він приніс в армію дух професіоналізму, притаманний флоту. Хоча він волів би командувати ескадрами, Тан знайшов свій новий дім у Новій армії."
 hunan_military_events.2.d_fed: "Чжао Хенті зарекомендував себе як надійний капітан біля керма провінції. Очолюючи Хунань понад десять років, він бачив різні стани її військ — від місцевих загонів до ополчень мілітаристів. Зараз жодна сила не може зрівнятися з його армією. Для Чжао це не просто показник міці, а доказ відданості революції.\n\nПредставник старшого покоління революціонерів та випускник Військової академії Японії, Чжао — «старий тигр», що пройшов крізь моря крові. Колишній підлеглий Тань Янькая та друг У Пейфу, він готовий зіграти свою ключову роль у возз'єднанні країни."
 hunan_military_events.2.a: "Урочисті роздуми про цих великих лідерів."

 hunan_military_events.3.t: "Конференції з розбору бойових дій"
 hunan_military_events.3.d: "Нова концепція, запроваджена командирами 8-ї армії Хе Луном та Пен Дехуаєм: армія Хунані експериментує з проведенням післябойових конференцій. Офіцери та солдати можуть вільно спілкуватися, аналізуючи дії кожного та обговорюючи плани кампаній. Командири особисто роз'яснюють політичну та військову ситуацію, щоб солдати розуміли, за що вони б'ються. Хе та Пен сподіваються, що така ініціатива допоможе усунути некомпетентних офіцерів та зміцнити меритократію. Час покаже, чи принесе ця «демократизація» армії плоди."
 hunan_military_events.3.a: "Справді демократична армія!"

 hunan_military_events.4.t: "Справжній дух Національно-революційної армії"
 hunan_military_events.4.d: "Подібно до побратимів із Вампу, 6-та та 8-ма армії НРА несуть у собі дух Національної революції. Ці кадри — невблаганна сила революційної мужності, цілковито віддана мрії доктора Сунь Ятсена. Вони розуміють, що їхні надії та життя нічого не варті, якщо революція зазнає поразки. Тому вони йдуть вперед — крізь загони мілітаристів, тиранів та іноземних імперіалістів. На кону майбутнє Китаю, і вони готові пожертвувати всім заради його спасіння."
 hunan_military_events.4.a: "Нехай жертви наших солдатів наблизять перемогу революції."

 hunan_military_events.5.t: "Прибуття вигнанців Чжилі!"
 hunan_military_events.5.d: "Після хаосу маньчжурського перевороту наші хоробрі соратники з Чжилі вели відчайдушну, але програшну боротьбу. Падіння Лояна багато хто вважав смертним вироком для кліки. Проте в темряві спалахнуло світло: Тан Сянмін закріпив Хунань за Чжилі, давши кліці шанс на останній бій. Залишки сил Чжилі почали гуртуватися навколо губернатора, присягаючи йому на вірність."
 hunan_military_events.5.a: "Наша боротьба ще не закінчена!"

 hunan_military_events.7.t: "Доля імператора Сянсі"
 hunan_military_events.7.d: "Хоча Чень Цюйчжень здається справжнім королем Сянсі, навіть королі підкоряються імператорам. У Західній Хунані такою постаттю є Тянь Інчжао. Проте де-факто і де-юре — це різні речі. Хоча Чень демонструє непохитну вірність, Тянь — старий друг Сунь Ятсена та Юань Шикая — вже давно не в стані керувати навіть собою, не те що державою.\n\nЖиття, сповнене невдач, перетворило колись енергійного генерала на хронічного опіумного наркомана в полоні депресії. Усіма справами займаються штабісти в Чанші та Чень у Сянсі. Його учні вже давно перевершили вчителя. Проте Чень Цюйчжень надіслав [ROOT.GetLeader] благального листа з проханням профінансувати реабілітацію свого старого друга. Він переконаний, що досвід Тяня у військових питаннях стане в пригоді у майбутніх війнах."
 hunan_military_events.7.a: "«Дружба — це і спільні страждання, і спільні випробування»."
 hunan_military_events.7.b: "Уряд навряд чи має втручатися в особисті справи індивіда."

 hunan_military_events.8.t: "Герой Сянсі"
 hunan_military_events.8.d: "Державна інвестиція в реабілітацію Тянь Інчжао пройшла успішно! Кращі лікарі провінції допомогли йому змінити життя на радість Чень Цюйчженю. Після двох десятиліть опіумного дурману «імператор» Сянсі повернувся з небуття. Сповнений нової енергії та почуття обов'язку, він готовий надолужити згаяне. Хоча дехто сумнівається в щирості Тяня, вважаючи його запал лише спробою повернути особисту владу після довгої відсутності."
 hunan_military_events.8.a: "Ви все життя протистояли бурі, тепер час виправити помилки."

#Foreign Tag events

 hunan_events.106.t: "Тан Шенчжи перемагає на виборах у Хунані"
 hunan_events.106.d: "Можливо, гамбіт бунтівного генерала виправдав себе. Те, що багато хто в Центральному комітеті вважав несподіванкою — рішення Тан Шенчжи та 8-ї армії відійти від бойових дій у війні Ліги та взяти участь у виборах у Хунані — призвело до його впевненої перемоги. Хоча початкові перспективи були неясними, участь нашого колишнього товариша Чен Цяня у виборах, імовірно, змінила результат їхніх спільних зусиль.\n\nЗавдяки спільному квитку Гоміньдану правий Чен Цянь та лівий Тан Шенчжи об’єдналися, щоб підірвати позиції Чжао Хенті. За результатами виборів до законодавчих зборів Хунані було вирішено, що посаду губернатора посяде Тан Шенчжи, тоді як Чен Цянь обійме важливу посаду в провінційному уряді.\n\n[CHI.GetLeader], що більше симпатизує лівим, щиро привітав нового офіційного губернатора від Гоміньдану, закріпивши вплив партії в країні."
 hunan_events.106.a: "Це, безумовно, несподіванка, але приємна."

 hunan_events.107.t: "Чжао Хенті перемагає на виборах у Хунані"
 hunan_events.107.d: "Очікуваним результатом провінційних виборів у Хунані стало те, що чинний губернатор Чжао Хенті впевнено забезпечив собі ще один термін біля керма. Хоча для Центрального комітету це не стало сюрпризом, багато хто все ще обурений тим, що цей деспот зберігає контроль над провінцією. Що важливіше, схоже, що бунтівний генерал Тан Шенчжи разом із 8-ю армією втік із Хунані та нещодавно прибув до [CHI.Capital.GetCapitalVictoryPointName].\n\nВисловивши щирі вибачення за свій раптовий відхід, генерал благав [CHI.GetLeader] про прощення та запропонував знову воювати на боці Національно-революційної армії. Формально він пов’язаний із Тимчасовим комітетом дії, і це може бути шансом для [CHI.GetLeader] усунути потенційного політичного ворога, проте Тан та його підлеглі неймовірно талановиті на полі бою, що може принести неабияку користь."
 hunan_events.107.a: "Це від самого початку була безглузда затія."
 hunan_events.107.b: "У НРА немає місця для перебіжчиків."

 hunan_events.108.t: "Чен Цянь перемагає на виборах у Хунані"
 hunan_events.108.d: "Хоча наш власний кандидат, Тан Шенчжи, раптово покинув фронт, щоб кинути сили на вибори в Хунані, виявилося, що він був не єдиним представником Гоміньдану з великими амбіціями. Перебуваючи в розділеній провінції Гуйчжоу, залишки правого крила Гоміньдану дозволили голові 6-ї армії, Чен Цяню, вступити в передвиборчі перегони.\n\nЗавдяки такому сміливому кроку генерал домовився про спільний квиток Гоміньдану з Тан Шенчжи, і спільними зусиллями вони вибороли перемогу. Згодом було вирішено, що Чен Цянь отримає посаду губернатора, а Тан Шенчжи збереже критично важливу посаду в уряді.\n\nРадикали в партії заявляють про зраду через альянс Тана з правим крилом, проте інші, зокрема з Тимчасового комітету дії, вважають це блискучою перемогою та здобуттям ключового союзника."
 hunan_events.108.a: "Ми взагалі координували ці дії?"

 hunan_events.109.t: "Чен Цянь прибуває в [ROOT.Capital.GetCapitalVictoryPointName]"
 hunan_events.109.d: "На подив усіх у [ROOT.Capital.GetCapitalVictoryPointName], один зі стовпів правого Гоміньдану та лідер 6-ї армії НРА, Чен Цянь, за повідомленнями, залишив свій табір у нашій частині Гуйчжоу, перетнув кордон і спробував виграти вибори в Хунані. Ще абсурднішим є те, що генерал зробив це одночасно з представником лівого Гоміньдану Тан Шенчжи.\n\nУ марній спробі скинути Чжао Хенті обидва генерали висунули спільний квиток єдності Гоміньдану, проте він був приречений від самого початку. Майстерно і впевнено володіючи політичною сферою Хунані, Чжао легко переміг зусилля Гоміньдану.\n\nЇхній союз розпався так само швидко, як і з’явився. Зрештою, дискредитований генерал повернувся до [ROOT.Capital.GetCapitalVictoryPointName], пропонуючи свої послуги [ROOT.GetLeader]. Проте існують побоювання, що прийняття його пропозиції викличе гнів Чжилі та Чжао в Хунані. Інші пропонують заарештувати віроломного генерала за дії проти начальства."
 hunan_events.109.a: "Це була благородна спроба, ви можете реабілітуватися службою."
 hunan_events.109.b: "Ви могли потопити весь корабель! Заарештувати його!"

 hunan_events.111.t: "Лівий Гоміньдан захоплює владу в Хунані!"
 hunan_events.111.d: "Тан Шенчжи, командувач 8-ї армії НРА, успішно усунув чинного губернатора Чжао Хенті завдяки спільному квитку єдності Гоміньдану з командувачем 6-ї армії Чен Цянем. Поки вони формують свій уряд, ширяться чутки про заворушення в гарнізоні Юеяну та серед його ляльководів у Пекіні.\n\nТан Шенчжи формально приєднався до Центрального комітету Гоміньдану, і хоча він не такий ідейний, як його колеги, очікується, що він підтримуватиме їх у політичних питаннях."
 hunan_events.111.a: "Ми будемо уважно за ним стежити."

 hunan_events.112.t: "Правий Гоміньдан захоплює владу в Хунані!"
 hunan_events.112.d: "Чен Цянь успішно усунув Чжао Хенті через спільний список із Тан Шенчжи. Поки створюється новий уряд, у Юеяні зростає напруга.\n\nЧен Цянь відданий правим залишкам Гоміньдану в Гуйчжоу. Хоча Тан Шенчжи служить певним противагою, забезпечуючи центристську позицію, очікується, що генерал підтримає своїх соратників у разі їхнього приходу до влади."
 hunan_events.112.a: "Партійна держава міцнішає."

 hunan_events.113.t: "Тан Сянмін закріплює Хунань за Чжилі"
 hunan_events.113.d: "Коли вибори в Хунані привели до влади античжилійський уряд, було цілком очікувано, що аташе Чжилі в Юеяні, Тан Сянмін, почне діяти. Так і сталося: по новому уряду Хунані було завдано нищівного удару. Війська Чжилі заполонили провінцію, а солдати НРА здійснили відчайдушну спробу стримати натиск.\n\nПроте ситуація змінилася, коли місцеві армії Хунані завагалися і не підтримали свого губернатора — доля Гоміньдану була вирішена. Тепер Тан Сянмін, ставши військовим губернатором, став на шлях війни. Він люто налаштований вигнати весь античжилійський вплив із провінції, правлячи під дулом пістолета і розірвавши конституцію."
 hunan_events.113.a: "Прикра смерть для молодої демократії Хунані."
 hunan_events.113.b: "Важкі часи для Хунані."

 hunan_events.114.t: "Чжао Хенті перемагає на виборах у Хунані"
 hunan_events.114.d: "Чжао Хенті здобув абсолютну перемогу на виборах губернатора. Відданий федераліст, Чжао є батьком демократії в Хунані та її непохитним захисником. Хоча спільний список Гоміньдану був серйозним суперником, майстерна політика Чжао та його палкі промови в розпал хаотичних виборів забезпечили йому успіх.\n\nЗнову підтвердивши свою вірність демократії, він сподівається, що Хунань стане моделлю для інших провінцій. Проте якщо Хунань опиниться в ізоляції, йому, можливо, доведеться поступитися принципами і звернутися за захистом до старого друга У Пейфу."
 hunan_events.114.a: "Рідко можна побачити людину, що так вірна своїм принципам."

 hunan_events.115.t: "Чжао Хенті та Є Кайсінь тікають"
 hunan_events.115.d: "Пригнічений політичним насильством та міжусобицями, що супроводжували прихід Гоміньдану на вибори, Чжао впав у ще більший відчай після повного скасування виборів у Хунані через спробу перевороту Тан Сянміна. Бачачи, як його улюблену провінцію та конституцію плюндрують автократи, ексгубернатор не мав іншого вибору.\n\nЗібравши речі та зв'язавшись із союзниками — Є Кайсінем та Хе Яоцзу — тріо втекло до будь-якого уряду, що погодиться їх прийняти. Будь то федералісти чи Чжилі, вони сподіваються домовитися про підтримку, щоб повернути провінцію та відновити законну владу."
 hunan_events.115.a: "Прощавай, Чжао Хенті."

 hunan_events.116.t: "Чжао Хенті та Є Кайсінь прибувають"
 hunan_events.116.d: "Через нещодавні події в Хунані чинний губернатор Чжао Хенті був усунутий від влади. Поважаючи демократичний процес, Чжао виявив, що його опоненти не поділяють цієї поваги: після хаосу та спроби перевороту Чжилі провінція схилилася до автократії.\n\nПопри пригнічений стан, Чжао не збирається мовчки спостерігати за смертю демократії. Він та його вірні командири прибули до [ROOT.Capital.GetCapitalVictoryPointName], пропонуючи свій досвід в обмін на звільнення провінції з лап деспотів.\n\nДехто в нашому уряді готовий прийняти Чжао через особисті зв'язки чи ідеологічну близькість. Проте інші вважають, що Чжао час піти на спокій, оскільки він вичерпав свій політичний та військовий потенціал."
 hunan_events.116.a: "Твоя боротьба ще не закінчена!"
 hunan_events.116.b: "Тобі час на пенсію, Чжао."

 hunan_events.117.t: "Тан Сянмін захоплює Хунань!"
 hunan_events.117.d: "Після раптового виходу Тан Шенчжи з зони повстання багато хто чекав на його поразку на виборах. Проте хитрий генерал уклав альянс із лідером правого Гоміньдану Чен Цянем. Вони перемогли, але гарнізон Юеяну на чолі з Тан Сянміном завдав удару у відповідь.\n\nВиснажені сили 8-ї та 6-ї армій не мали шансів проти натиску Чжилі. Після їхньої поразки Тан Сянмін оголосив воєнний стан, скасував конституцію і проголосив себе губернатором для «наведення порядку».\n\nУ партії точаться суперечки щодо того, чи варто приймати розбиті сили Тана або Чена, але зрештою їм було надано притулок як знак доброї волі, що дуже розлютило [ROOT.GetLeader]."
 hunan_events.117.a: "Ще більше людей опинилися під владою терору мілітаристів."

 hunan_events.118.t: "Тан Сянмін захоплює Хунань!"
 hunan_events.118.d: "Чжао Хенті вдалося перемогти радикалів на виборах, але він не встояв перед впливом Чжилі. На півночі Тан Сянмін правив Юеяном як власною вотчиною. Чжао не зміг утримати стабільність, і Тан Сянмін рушив на столицю Чанша, щоб усунути губернатора під приводом «боротьби з хаосом та некомпетентністю».\n\nТан розірвав усі дипломатичні зв'язки з союзниками Чжао, включаючи [FROM.GetLeader], і переорієнтував провінцію на своїх чжилійських покровителів."
 hunan_events.118.a: "Цей мерзенний м'ясник Хунані!"

 #Overlord Uniting China Events

 #Cheng
 hunan_events.119.t: "Від 1911 до [GetYear]"
 hunan_events.119.d_rkmt: "З возз'єднанням нації, що настало зараз, занепадницька та катастрофічна Ера мілітаристів добігає кінця. Рухаючись вперед, Китай вступає в нову епоху. Щоб досягти цієї миті, знадобилося багато жертв. Чимало товаришів віддали свої життя, щоб ми могли жити далі, і це принесло краще майбутнє для цілих поколінь. Китайський народ більше не буде знемагати під вагою дрібних автократів чи мілітаристів, адже прокинувся справжній революційний вогонь. Під егідою Гоміньдану нація об'єдналася, і Хунань відіграла в цьому життєво важливу роль.\n\nТепер, коли країна об'єднана зусиллями [THIS.overlord.GetNameDef], [HNN.GetLeader] вважається ключовим лідером революційної боротьби. Вступивши до Тунменхою ще в 1905 році, він став свідком конфліктів від самого кінця монархії Цін, пройшовши крізь війни на захист конституції, Північний похід та Другу японо-китайську війну. Завжди прагнучи безпеки, процвітання та єдності народу Хунані, він є взірцем того, що означає бути справжнім революціонером.\n\nХоча між [THIS.overlord.GetLeader] та [HNN.GetLeader] можуть виникати розбіжності щодо впровадження «трьох народних принципів» доктора Суня, вони все одно залишаються бойовими побратимами. У зв'язку з централізацією влади, розглядається питання про повернення [HNN.GetLeader] до складу Центрального виконавчого комітету. Попереду період національної відбудови та політичної опіки, тож робота [HNN.GetLeader] ще далеко не закінчена."
 hunan_events.119.d_lkmt: "З возз'єднанням нації занепадницька та катастрофічна Ера мілітаристів добігає кінця. Настає нова ера для Китаю. Китайський народ більше не буде страждати під вагою дрібних тиранів, адже справжній революційний вогонь нарешті запалав. Під егідою Гоміньдану нація об'єдналася, і Хунань відіграла в цьому ключову роль.\n\nТепер, коли країна об'єднана зусиллями [THIS.overlord.GetNameDef], [HNN.GetLeader] визнаний важливим лідером революції. Його шлях почався в Тунменхої ще у 1905 році, і він пройшов крізь усі бурі китайської історії — від падіння династії Цін до великих визвольних воєн. Його відданість народу Хунані робить його справжнім символом революційного духу.\n\nБудучи «чужаком» для внутрішніх фракцій та клік Центрального комітету, [HNN.GetLeader] завдяки своєму становищу в Хунані створив справжню фортецю для поміркованих членів Гоміньдану. Підтримуючи тісні контакти з Сунь Фо та іншими ліберально налаштованими лідерами партії, шанований генерал став фігурою, прихильності якої шукають усі сторони. Попри це, [HNN.GetLeader] офіційно зберігає нейтралітет, лише підтверджуючи свою вірність революції. Оскільки на обрії вже Третій з'їзд та план національної відбудови, [HNN.GetLeader] може знову знадобитися для захисту громадян Хунані."
 hunan_events.119.a: "Якби тільки Хуан, Сун і Сунь могли нас бачити."

 #Tang S
 hunan_events.120.t_lkmt: "Від Міньганю до Фентяню"
 hunan_events.120.t_nokmt: "Приборкана революція"
 hunan_events.120.t_rkmt: "Радикальний форпост"
 hunan_events.120.d_lkmt: "З возз'єднанням нації, що настало зараз, занепадницька та катастрофічна Ера мілітаристів добігає кінця. Рухаючись вперед, Китай вступає в нову епоху. Щоб досягти цієї миті, знадобилося багато жертв. Чимало товаришів віддали свої життя, щоб ми могли жити далі, і це принесло краще майбутнє для цілих поколінь. Китайський народ більше не буде знемагати під вагою дрібних автократів, адже прокинувся справжній революційний вогонь. Під егідою Гоміньдану нація об'єдналася, і Хунань відіграла в цьому життєво важливу роль.\n\nТепер, коли країна об'єднана зусиллями [THIS.overlord.GetNameDef], [HNN.GetLeader] вважається ключовим лідером революційної боротьби. Хоча спочатку мало хто міг подумати, що він буде настільки відданим цій місії. Вступивши до Тунменхою під впливом Тань Женьфена, він брав участь у Сіньхайській революції, проте згодом його запал згас. Лише у 1926 році він знову підняв смолоскип, і його 8-ма армія стала інструментом, яким він спопелив старий лад.\n\nФормально перебуваючи в таборі Тимчасового комітету дії, Тан допомагав організувати повстання в Міньгані після завершення Північного походу. Пройшовши крізь вогонь боротьби в Хунані, він проніс його аж до Маньчжурії. Тепер, коли нація єдина, хор голосів, що закликають до скликання Третього з'їзду, стає дедалі гучнішим, і «буддійському» генералу час посісти своє місце."
 hunan_events.120.d_nokmt: "З возз'єднанням нації катастрофічна Ера мілітаристів добігає кінця. Настає нова ера для Китаю. Китайський народ більше не буде страждати від зловживань тих, хто використовував його у власних цілях, адже життя в процвітанні вже зовсім поруч. Під егідою [THIS.overlord.GetNameDef] нація знову стала єдиною.\n\nПісля об'єднання багато хто в партії звинувачує [HNN.GetLeader] у зраді революції, доктора Суня та принципів Гоміньдану. Проте їхні заперечення суперечать істині. Якби Тан не бачив майбутнього під знаком «трьох народних принципів», навіщо б він впроваджував їх у рідній Хунані? Або навіщо б він давав притулок біженцям із Гоміньдану, коли їхній вплив у інших провінціях зникав? Революційний вогонь Хунані міг пригаснути, а ідеалізм поступитися місцем нескінченному прагматизму, але краще продовжувати мрію в такий спосіб, ніж дозволити їй остаточно згаснути.\n\nХоча Тан став «білою вороною» серед своїх союзників, він відіграв вирішальну роль в об'єднанні країни. Можливо, Гоміньдан ще вирветься за межі Хунані в останній відчайдушній спробі проти [THIS.overlord.GetLeader], а можливо, вони гратимуть у довгу гру, ведучи війну зсередини. Це покаже лише час."
 hunan_events.120.d_rkmt: "Ера мілітаристів добігла кінця, і перед Китаєм відкривається нова сторінка історії. Під егідою Гоміньдану нація возз’єдналася, і Хунань стала невід’ємною частиною цього успіху.\n\n[HNN.GetLeader] визнаний важливим лідером революції, хоча його шлях був непростим. Почавши з Тунменхою та Сіньхайської революції, він знову став до лав борців у 1926 році, перетворивши свою 8-му армію на справжнє полум'я революції.\n\nПопри те, що Тан був важливою постаттю в зоні повстання Міньгань і належав до лівого крила партії, він виявився радикалом серед поміркованих та автократів. Попри тиск як знизу, так і зверху, Тан стоїть непохитно, перетворюючи Хунань на осередок соціалістичної думки в країні. Тепер, коли настає час розбудови держави, лівий Гоміньдан може і не бути панівною фракцією, але поки «буддійський» генерал керує своєю провінцією, їхня справа житиме."
 hunan_events.120.a_lkmt: "Третій з'їзд чекає..."
 hunan_events.120.a_nokmt: "Останній бастіон Гоміньдану."
 hunan_events.120.a_rkmt: "Серед моря реакціонерів ми стоїмо гордо."

 # Чжао
 hunan_events.121.t_fed: "Демократична Хунань — демократичний Китай!"
 hunan_events.121.t_zhili: "Острів демократії"
 hunan_events.121.t_feng_negotiation: "Республіка, народжена пером"
 hunan_events.121.d_fed: "Сутінки ери мілітаристів нарешті огорнули нас, а попереду видніється світле майбутнє. У Хунані Чжао Хенті успішно пройшов крізь хаос 1936 року та складні вибори. Приборкавши вплив радикального Гоміньдану та вигнавши м’ясника Тан Сянміна, Чжао довів здатність федералістської моделі до успіху та процвітання.\n\nІ хоча Хунань — це найяскравіший приклад успіху федералізму, вона не єдина. [HNN_fed_central_government_desc] Федералізм продемонстрував свою міць і посів законне місце провідної ідеології Китаю. Без сумніву, інші провінційні уряди братимуть за взірець хунанську модель для захисту своєї демократії.\n\nПопереду ще багато роботи: мілітаризм не подолано остаточно, а молоду федеральну демократію потрібно плекати. Але це питання майбутнього. Сьогодні ми святкуємо успіх нашої провінції та всієї країни. Коли сонце ери мілітаристів заходить, над Китаєм сходить новий світанок надії."
 hunan_events.121.d_zhili: "Сутінки ери мілітаристів нарешті огорнули нас. У Хунані Чжао Хенті успішно впорався з викликами 1936 року, зберігши молоду демократію. Решту Китаю об'єднав уряд Чжилі, досягнувши справжнього, а не ілюзорного возз'єднання.\n\nЧжао приєднався до Чжилі частково через особисті зв'язки з У Пейфу та Цзян Байлі, а частково заради того, щоб уберегти провінцію від подальшого кровопролиття. Хунань стала демократичним островом у цьому єдиному Китаї. Завдяки домовленості Чжао з У, провінція зберігає свого виборного губернатора. Цей острів демократії слугуватиме прикладом для всіх, хто поділяє демократичні ідеали в нашій країні.\n\nХунань стане нагадуванням: демократія в Китаї можлива. Губернатор Чжао вірить, що хунанська модель — це шлях, яким піде решта країни. Майбутнє може бути невизначеним, але з’явилася надія — те, що було таким дефіцитним у часи мілітаристів."
 hunan_events.121.d_fengtian: "Ера мілітаристів добігає кінця. Чжао Хенті в Хунані вдалося зберегти федералістську модель, попри всі виклики. Тим часом решта Китаю була об'єднана Фентянським урядом. Коли Чжан Цзолінь рушив на Пекін, Чжао опинився без союзників.\n\nЙого прагматизм щодо Бейяну та республіканські ідеали привели його до переговорів із представниками Фентяню. Зумівши зберегти місцевий уряд Хунані, він погодився визнати нову владу. Наша провінція залишається демократичним островом у Китаї, і ми зробимо все можливе, щоб захистити його. Цей приклад показуватиме всій країні, що свобода можлива навіть у найскладніші часи."
 hunan_events.121.d_feng_negotiation: "Завіса над найтемнішою епохою нашої нації нарешті опускається. У Хунані Чжао Хенті успішно захистив провінційну демократію. Разом із ним Чень Цзюнмін у Гуандуні також перечекав бурю 1936 року, і південні провінції стали оплотом федералізму.\n\nОбидва лідери були запрошені Чжаном на «Конференцію з об'єднання». Після напружених переговорів, очолюваних Ченем, було досягнуто згоди. Обидва федералісти приєдналися до уряду в Пекіні, визнавши його законним урядом Китаю. Завдяки цьому було врятовано незліченні життя. Тепер настав час дивитися вперед — до розбудови нового федерального уряду та нового Китаю."
 hunan_events.121.a_fed: "«Ми можемо грітися в променях нашого нового світанку»."
 hunan_events.121.a_zhili: "«І ця надія має зберегтися»."
 hunan_events.121.a_feng_negotiation: "«Давайте разом іти вперед у цьому новому Китаї»."

 #Tang X
 hunan_events.122.t_qie: "Імперія та її адмірал"
 hunan_events.122.t_szc: "Перечекавши бурю"
 hunan_events.122.t_zhili: "Бейянське відродження"
 hunan_events.122.d_qie: "Сутінки ери мілітаристів нарешті огорнули нас, а попереду видніється світле майбутнє. Завіса над найтемнішою епохою нашої нації нарешті опускається, і може розпочатися наступна дія.\n\nСтрімке сходження адмірала Тан Сянміна до влади в Хунані стало несподіванкою для багатьох ззовні, але ті, хто служив під його началом, знали, що він подолає цей виклик. Коли Ліга розпалася, а гегемонія Цін похитнулася, Тан Сянмін скористався моментом і гарантував, що Хунань залишиться лояльною законному уряду Китаю.\n\nВелика Цін, зі свого боку, блискуче розгромила суперників — кліка Чжилі подбала про те, щоб спроба відродження Гоміньдану залишилася лише нездійсненною мрією. Їхні північно-східні вороги були розчавлені чоботами У Пейфу. Адмірал Тан Сянмін завжди був поруч, щоб допомогти, прикрити фланги та спрямувати всі ресурси Хунані на втілення мрії про єдиний Китай.\n\nІ ця мрія здійснилася. Китай нарешті може залишити еру мілітаристів у минулому та рушити до кращої долі. Тепер, коли країна готова вийти у відкрите море, їй знадобиться гідний адмірал, щоб керувати нею на океанських просторах, і Тан Сянмін завжди буде готовий допомогти там, де він потрібен."
 hunan_events.122.d_szc: "Сутінки ери мілітаристів нарешті огорнули нас, а попереду видніється світле майбутнє. Завіса над найтемнішою епохою нашої нації нарешті опускається, і може розпочатися наступна дія.\n\nСтрімке сходження адмірала Тан Сянміна до влади в Хунані стало несподіванкою для багатьох, але його підлеглі знали, що він впорається. Коли Ліга розпалася, а гегемонія Чжилі затріщала по швах, Тан Сянмін забезпечив лояльність Хунані законному уряду Китаю.\n\nОднак для Чжилі не все йшло гладко. Після смерті У Пейфу та витіснення їхніх сил із центру влади, вони були змушені тікати до Сичуані. У цей найважчий момент адмірал Тан залишався непохитним і стояв на їхньому боці. Він допоміг їм відбити Пекін і Ухань, забезпечивши відродження Бейянської республіки під керівництвом її справжнього спадкоємця.\n\nТепер Чжилі повернули собі належну владу, проголосивши переродження Китайської Республіки. Адмірал Тан із гордістю спостерігає за тим, як Чжилі, перечекавши бурю 1936 року, пливуть до ясного неба та кращої долі. Настає новий світанок, і наш адмірал пишається своєю роллю в історії."
 hunan_events.122.d_zhili: "Сутінки ери мілітаристів нарешті огорнули нас, а попереду видніється світле майбутнє. Завіса над найтемнішою епохою нашої нації нарешті опускається, і може розпочатися наступна дія.\n\nСтрімке сходження адмірала Тан Сянміна до влади в Хунані стало несподіванкою для багатьох, але ті, хто знав нашого адмірала, не сумнівалися в ньому. Після колапсу Ліги та потрясінь гегемонії Чжилі, Тан Сянмін подбав про те, щоб Хунань залишилася вірною законному уряду Китаю.\n\nКоли маньчжури та колишній імператор спробували вчинити переворот, У Пейфу успішно знищив загрозу для Чжилі, а [THIS.overlord.GetNameDef] суттєво допоміг стабілізувати ситуацію. Закріпивши позиції, молода Республіка розгромила фальшивих спадкоємців на північному сході та взяла під контроль решту нації. Ера мілітаристів нарешті добігає кінця.\n\nНаш адмірал стояв на захисті Бейянської республіки у 1911 році, і він залишився з нею у 1936-му. Сама назва «Бейян» означає «Північний океан», тому цілком природно, що наш адмірал любить Республіку так само палко, як і море. І як належить будь-якому адміралу, він завжди буде готовий прийти на допомогу."
 hunan_events.122.a_qie: "«Настав час відчалити та насолодитися видом на океан»."
 hunan_events.122.a_szc: "«Ми дивимося на горизонт, де на нас чекає чисте небо»."
 hunan_events.122.a_zhili: "«Хай живе Республіка!»"

