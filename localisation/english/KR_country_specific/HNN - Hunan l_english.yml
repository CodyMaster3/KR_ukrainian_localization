 HNN_bop_mechanic_warning_tt: "§RБаланс сил надто сильно змістився в один бік! Хоча це дає певні переваги, стабільність буде поступово вичерпуватися, доки баланс не вирівняється. Задля довгострокової стабільності варто шукати компроміс.§!"

 HNN_bop_mechanic_explanation_tt: "§CМеханіка §YБалансу сил§! вимірює вплив фракцій Національно-революційної армії — §a6-ї армії Чена§! та §S8-ї армії Тана§!. Залежно від того, хто має перевагу, ви отримаєте бонуси або штрафи. Чи зможете ви втримати Гоміньдан єдиним?§!"

 HNN_end_coalition_tt: "§RБоротьба за владу закінчена, коаліції зміняться...§!"
 HNN_champion_effect_tt: "§LКоли певні командири (з рисою «Герой війни») отримують новий рівень, вони посилюють вплив своєї фракції.§!"

 HNN_utilise_tongmenghui_ties_decision: "Використати зв'язки в Тунменхої"
 HNN_utilise_tongmenghui_ties_decision_desc: "Зберігши контакти зі старими союзниками по Тунменхою, Чен Цянь може зупинити радикальну хвилю, підняту 8-ю армією. Свобода тільки прийшла в Хунань, і він не дозволить Тан Шенчжи її спотворити."

 HNN_rally_moderates_decision: "Згуртувати поміркованих"
 HNN_rally_moderates_decision_desc: "Чен Цянь почав налагоджувати зв'язки з поміркованими силами поза партією («Данвай»). Він закличе їх та Тань Янькая на боротьбу проти радикальних соціалістів із табору Тан Шенчжи."

 HNN_reshuffle_magistrates: "Перестановка магістратів"
 HNN_reshuffle_magistrates_desc: "Реформа місцевого управління дозволяє 6-й армії регулярно переміщувати повітових магістратів. Офіційно це робиться для боротьби з елітами, але також допомагає знищити соціалістичні тенденції, посіяні пропагандою 8-ї армії."

 HNN_deploy_militia_against_socialists: "Виставити ополчення проти соціалістів"
 HNN_deploy_militia_against_socialists_desc: "Хе Цзянь — запеклий антисоціаліст. Він без вагань використовує Управління охорони спокою для арешту соціалістично налаштованих селян і робітників. Це може бути несправедливо, але необхідно для запобігання анархії."

 HNN_ensure_bureaucrat_loyalty: "Забезпечити лояльність бюрократів"
 HNN_ensure_bureaucrat_loyalty_desc: "Старі бюрократи не віддані ідеалам Гоміньдану. Ми відправимо наші кадри в їхні кабінети, щоб вони дотримувалися «Трьох принципів» або були замінені на більш... лояльних до 8-ї армії."

 HNN_fight_against_reactionaries: "Боротьба з реакціонерами"
 HNN_fight_against_reactionaries_desc: "Навколо нас плететься мережа зрадників-реакціонерів. Навіть 6-та армія готова з ними співпрацювати. Ми маємо викорінити всі джерела корупції та реакції силою 8-ї армії."

 HNN_hold_peasant_rallies_decision: "Провести селянські мітинги"
 HNN_hold_peasant_rallies_decision_desc: "Саме завдяки мужності селян революція вижила. Тепер офіцери 6-ї армії хочуть зруйнувати їхнє життя. Селяни пам'ятають нас як захисників своїх прав — використаємо цей дух проти мілітаристів."

 HNN_mobilise_striking_workers: "Мобілізувати страйкуючих робітників"
 HNN_mobilise_striking_workers_desc: "Співпраця з Синдикалістською партією дає нам зв'язки в робітничих рухах. Мобілізувавши профспілки Чанші, ми вдаримо по 6-й армії та їхніх поміркованих союзниках за їхню бездіяльність."

 HNN_engage_in_skirmishes_decision: "Вступити в сутички"
 HNN_engage_in_skirmishes_decision_desc: "Наші суперники занадто загордилися. Ми загнані в кут і мусимо вдарити у відповідь. Невеликі військові зіткнення необхідні. Це боляче, але революція вимагає жертв. Нехай історія простить нам цей гріх."
