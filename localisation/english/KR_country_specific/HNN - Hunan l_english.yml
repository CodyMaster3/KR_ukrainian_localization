 #Комісія оборони Тана Сянміна

 HNN_defence_commission_category: "Комісія оборони"
 HNN_defence_commission_category_desc: "Комісія з оборони провінції Хунань, або просто Комісія оборони — це позасудовий орган влади, який надає губернатору §Pособливі повноваження§! для «захисту провінції Хунань». Ці повноваження дозволяють нам діяти в обхід провінційної асамблеї та вживати заходів в інтересах усієї провінції, а не окремих громадян. Розширення повноважень комісії відкриватиме нам нові §Cрішення§!. Кожне з них має свою ціну, але приносить значну користь адміністрації, тож їх слід використовувати з розумом."

 HNN_drill_the_troops: "Муштрувати війська"
 HNN_drill_the_troops_desc: "Наші солдати мають бути завжди напоготові. Армія Хунані повинна перебувати в ідеальній формі, адже зовнішні вороги та зрадники постійно загрожують нашому бастіону свободи. Армія Сян — найкраща бойова сила в Китаї, і ми маємо зберегти цю перевагу. Наше військо було і буде об'єктом заздрощів для всієї Серединної держави!"

 HNN_foster_militarist_sentiment: "Плекати мілітаристські настрої"
 HNN_foster_militarist_sentiment_desc: "Під владою південних революціонерів дух Хунані був отруєний слабкістю фанатичного республіканізму. Час нашому вельмишановному губернатору нагадати народу Сян, що сила не в ідеалістичних системах демократії чи соціалізму, а у славі армії. Розквіт Китаю припав на епоху великої династії Хань за правління імператора У-ді, коли жодна сила в світі не могла кинути виклик китайській зброї. Народ Хунані має знову пізнати силу мілітаризму."

 HNN_emergency_planning: "Надзвичайне планування"
 HNN_emergency_planning_desc: "Німецький фельдмаршал Гельмут фон Мольтке казав, що жоден план не витримує першого зіткнення з ворогом. Губернатор Тан засвоїв цю мудрість і запровадив сесії надзвичайного планування, аби армія Хунані не потерпала від застарілих доктрин."

 HNN_construct_a_grand_fleet: "Побудувати великий флот"
 HNN_construct_a_grand_fleet_desc: "Перш ніж ощасливити нас своєю присутністю, Тан Сянмін був адміралом флоту Цін. На жаль, його таланти тоді не визнали. Проте тепер з'явилася можливість: захист китайського узбережжя вимагає створення власних військово-морських сил. Армія Сян — перша серед провінційних армій, тепер і флот Сян очолить справу модернізації флоту Китаю!"

 HNN_arrest_dissidents: "Арештовувати дисидентів"
 HNN_arrest_dissidents_desc: "Немає людини, більш відданої безпеці народу Хунані, ніж Тан Сянмін. Проте революційні дурні та корисливі бандити прагнуть визискувати народ, як це було за часів Чжао. Ці бунтівники не зруйнують Хунань; нехай усі знають, що в нашій провінції панує закон і порядок."

 HNN_enforce_work_quotas: "Запровадити робочі квоти"
 HNN_enforce_work_quotas_desc: "Економічна модернізація критично важлива для покращення життя людей. Проте географія не на боці Хунані: віддаленість від заможних прибережних міст уповільнює розвиток. Тому народ має працювати наполегливо заради майбутніх поколінь. Працьовитість — ключ до успіху; ми не можемо дозволити собі лінощі."

 HNN_deals_with_the_gentry: "Угоди зі шляхтою"
 HNN_deals_with_the_gentry_desc: "За часів Чжао шляхта-ґентрі отримала забагато влади, використовуючи його у власних інтересах. Губернатор Тан — людина іншого гарту, і шляхті варто ставитися до нього з належною повагою. Губернатор розуміє важливість цього класу, тож у Хунані знайдеться для них місце, доки вони знають межі."

 HNN_encourage_a_military_economy: "Указ про військово-промисловий комплекс"
 HNN_encourage_a_military_economy_desc: "Комерціалізація економіки — гарна мета для майбутнього, але сьогодні Китаю потрібна лише сильна армія. Як завжди наголошувала німецька військова місія, модернізація армії неможлива без модернізації промисловості. Тому губернатор Тан спрямовує економіку Хунані на рейки сучасного військового виробництва."

 HNN_emergency_conscription: "Указ про призов"
 HNN_emergency_conscription_desc: "Наші сусіди мають більше населення та кращі арсенали. Губернатор Тан розробив реформи, що виправлять цей недолік, вдосконаливши систему призову та закривши всі лазівки, залишені недбалою адміністрацією Чжао. Подивимося, як вороги намагатимуться взяти нас кількістю тепер!"

 HNN_ensure_loyalty: "Указ про лояльність"
 HNN_ensure_loyalty_desc: "Аби отримати підвищення в сучасному Китаї, треба мати зв'язки — Тан Сянмін знає це надто добре. Пекін постійно ігнорував його через відсутність зв'язків з елітою чжилійців, тож йому довелося доводити відданість ділом. Хунань Тана — це меритократія, але в такій системі політичну лояльність важко знайти. Губернатор має запровадити поняття вірності, зберігаючи при цьому принципи просування за заслугами."

 #Hunan Zhao Anti-Democratic Opposition Mechanic
 HNN_democratic_reform_category: "Зміцнення хунанської демократії"
 HNN_democratic_reform_category_desc: "§cЧжао Хенці§! успішно переміг §RГоміньдан§!, але це не означає, що загроза для хунанської демократії минула. Через тривалий вплив §RГоміньдану§! та присутність §Pюеянського гарнізону§! Тана Сянміна в провінції все ще сильні антидемократичні настрої. Аби запобігти §Pповаленню нашого уряду§!, ми маємо обмежувати їхній вплив усюди, де це можливо. Якщо опозиція стане занадто сильною, проведення подальших демократичних реформ через провінційну асамблею стане неможливим.\n\nПоточна сила §Pантидемократичної опозиції§!: [HNN_opposition_strength_variable_loc]"

 HNN_arrest_tang_xiangming: "Заарештувати Тана Сянміна"
 HNN_opposition_growing: "Антидемократична опозиція посилюється"

 HNN_opposition_strength_low: "§GНизька§!"
 HNN_opposition_strength_moderate: "§OПомірна§!"
 HNN_opposition_strength_high: "§RВисока§!"

 HNN_opposition_change_moderate: "Сила §Pопозиції§! зросте, і її рівень стане §Oпомірним§! наприкінці цього ходу."
 HNN_opposition_change_high: "Сила §Pопозиції§! зросте, і її рівень стане §Rвисоким§! наприкінці цього ходу."
 HNN_opposition_change_nothing: "Сила §Pопозиції§! зросте, але рівень §Gне зміниться§! наприкінці цього ходу."

 HNN_opposition_strength_slight_requirement: "Сила §Pопозиції§! — §gнизька§!"
 HNN_opposition_strength_moderate_requirement: "Сила §Pопозиції§! — §Oпомірна§! або нижче"

 HNN_weaken_the_opposition: "Це послабить §Pопозицію§!."

 #Категорія фінансового відновлення Хунані
 HNN_financial_recovery_category: "Наші біди Чорного понеділка"
 HNN_financial_recovery_category_desc: "[HNN_financial_recovery_category_desc_loc]"

 HNN_financial_recovery_category_desc_loc_kmt: "Встановлення нової провінційної адміністрації §RГоміньдану§! в Хунані принесло чимало викликів, як військових, так і політичних. Проте найбільш нагальним питанням для спадкоємців §cЧжао Хенці§! є жахлива економічна ситуація, спричинена недбалим капіталістичним врядуванням. Відкинувши програми відновлення попередньої адміністрації, прихильники §RГоміньдану§! [HNN_financial_recover_category_desc_kmtleader] та [HNN_financial_recover_category_desc_kmtsic] розпочали нову програму економічної реконструкції, побіжно дотримуючись ідеалів доктора Суня та інших теоретиків партії.\n\nХоча номінально це мало бути досягнуто лише на третьому етапі національної революції, повний крах економіки дав адміністрації [HNN_financial_recovery_category_desc_kmtparty] чистий аркуш для масштабної програми національної відбудови. Чи принесуть їхні амбіції плоди — залежить виключно від жертв, на які готові піти вони та §Y[HNN.GetAdjectiveCap]§! народ."

 HNN_financial_recovery_category_desc_loc_zhili: "Після незадовільних результатів нещодавніх виборів провінційна асамблея вирішила обрати радикальних §Rвискочнів із Гоміньдану§!, що мали намір знищити вплив чжилійців у провінції. Проте палкі революціонери не очікували швидкого та успішного кінця свого режиму від рук §P[HNN.GetLeader]§!, який з тріумфом захопив столицю. Ті, хто програв, втекли під час боїв, залишивши по собі розтерзану Хунань. Провінція спустошена в усіх аспектах, але найкритичнішою є руйнація економіки.\n\nГлобальний фінансовий крах, зупинка планів відновлення §cЧжао Хенці§! та нестабільність після перемоги §RГоміньдану§! призвели до справжньої катастрофи. Ситуація змінюється зараз, коли новий губернатор §P[HNN.GetLeader]§! та його союзники з §P[HNN.GetRulingParty]§! беруться покласти край лихам Хунані. Чи принесе його тверда рука результати — залежить від жертв, на які готовий піти §Y[HNN.GetAdjectiveCap]§! народ."

 HNN_financial_recovery_category_desc_loc_fed: "Тепер, коли глобальний фінансовий крах накрив провінцію, §c[HNN.GetLeader]§! та його союзники в §aпровінційній асамблеї§! поспішають ратифікувати законопроєкти, здатні полегшити фінансові труднощі. Поки §c[HNN.GetLeader]§! впевнено тримає штурвал, його міністри пропонують два радикально різні підходи до реформ.\n\nЗ одного боку, §cЧжао§! може покластися на старих друзів у §aістеблішменті§!, §cшляхту§! та §mіноземних інвесторів§!, аби витягнути Хунань із могили. З іншого боку, він може прийняти прогресивний ідеалізм своїх союзників-федералістів §mХуан Яньпея§! та §OЧжоу Шічжао§!, змістивши фокус уряду на §Rселян§! та §rробітників§!. Ця програма реформ може визначити майбутнє провінції назавжди, проте вона мусить зачекати, адже на горизонті — вибори..."

 HNN_financial_recovery_category_desc_loc_fed_electionover: "Після фінансового краху та непередбачуваного хаосу виборів, §c[HNN.GetLeader]§! та його союзники в §aпровінційній асамблеї§! нарешті вільні впроваджувати реформи. Міністри пропонують два шляхи: покластися на §aістеблішмент§! та §mінвестиції§!, або обрати шлях прогресивного ідеалізму, орієнтований на §Rселян§! та §rробітників§!. Цей вибір визначить долю провінції, і тягар його наслідків ляже на плечі §Y[HNN.GetAdjectiveCap]§! народу."

 HNN_financial_recovery_category_desc_loc_kmt_cheng: "§aЧен Цянь§!"
 HNN_financial_recovery_category_desc_loc_kmt_tang: "§SТан Шенчжі§!"
 HNN_financial_recovery_category_desc_loc_kmt_8th: "§S8-ма армія§!"
 HNN_financial_recovery_category_desc_loc_kmt_6th: "§a6-та армія§!"

 HNN_kmt_leader_tang: "Тан Шенчжі"
 HNN_kmt_leader_cheng: "Чен Цянь"
 HNN_kmt_sic_tang: "Тан Шенчжі"
 HNN_kmt_sic_cheng: "Чен Цянь"

 HNN_agricultural_reform_mission_timer:0 "Прогрес сільськогосподарської реформи"
  HNN_agricultural_reform_mission_timer_desc:0 "Провінція Хунань переживає значні зміни у своєму найважливішому секторі, докладаючи критичних зусиль, щоб розплутати феодальне плетиво землеволодіння. Рішення уряду можуть прискорити реформи, але якою ціною? У будь-якому разі, Хунань не зможе по-справжньому відновитися, доки аграрна криза не буде розв'язана."

  HNN_increase_taxation:0 "Перегляд системи оподаткування"
  HNN_increase_taxation_desc:0 "Для належного фінансування наших економічних реформ вкрай важливо збільшити обсяг доходів, що надходять до скарбниці. Хоча ми не наважуємося надто сильно порушувати хитку рівновагу аграрної системи Хунані, перерахунок земельного податку разом з іншими зборами дозволить ефективно залучити багатства шляхти та інших землевласників. Вони, безсумнівно, протестуватимуть і кричатимуть про тиранію, проте вибір стоїть між цим і повною анархією."

  HNN_maintain_order_in_countryside:0 "Підтримання порядку в селах"
  HNN_maintain_order_in_countryside_desc:0 "Наше сільське суспільство зараз переживає тектонічні зрушення у сприйнятті того, що означає бути селянином і землевласником. Щоб відмовити селян від спроб організуватися проти уряду чи бюрократів, єдиною справедливою відповіддю є спроба збалансувати систему. Регулярні перевірки маєтків та примусове бюджетування для шляхти суттєво допоможуть схилити шальки терезів на користь селян. Також, задля запобігання поширенню антиурядових настроїв, відправка додаткових загонів поліції в села допоможе підтримати безпеку та здобути вдячність еліт."

  HNN_emphasising_cooperation:0 "Акцент на співпраці зі шляхтою"
  HNN_emphasising_cooperation_desc:0 "Хоча уряд діє справедливо та логічно у земельному питанні, шляхта та еліти продовжують запекло протестувати проти будь-яких спроб обмежити їхню політичну вагу. Згідно з нашими принципами, ми відправимо міністрів для особистих зустрічей із місцевими землевласниками, щоб запевнити їх, що їхні права захищені належним чином."

  HNN_limited_redistribution:0 "Обмежений перерозподіл землі"
  HNN_limited_redistribution_desc:0 "Після впровадження низки реформ, спрямованих на завоювання прихильності як селян, так і землевласників, настав час докласти серйозних зусиль для розв'язання кореня проблеми. За підтримки нового покоління відданих окружних чиновників ми розпочнемо політику обмеженого перерозподілу земель. Надаючи пріоритетне право на викуп землі місцевим фермерам за державної підтримки, ми дозволимо поступову реорганізацію орних угідь Хунані без відкритого насильства."

  HNN_strike_against_landowners:0 "Удар по землевласниках"
  HNN_strike_against_landowners_desc:0 "[HNN_strike_against_landowners_desc_loc]"
  HNN_strike_against_landowners_desc_nokmt:0 "Попри те, що губернатор протягом десятиліття забезпечував безпеку шляхти, а світовий фінансовий крах підірвав економіку Хунані, еліти продовжують мобілізувати свої ресурси, щоб зупинити земельну реформу. Оскільки вони відмовляються слухати голос розуму і поважають лише силу, настав час уряду втрутитися в їхнє життя. Відправивши армійські підрозділи в села, ми покажемо шляхті, що уряд налаштований серйозно. Якщо вони й надалі перешкоджатимуть нам, то втратять і права на свої землі."
  HNN_strike_against_landowners_desc_kmt:0 "Занадто довго корумповані бейянські деспоти правили Хунанню, перетворюючи провінцію та селянство на огидну феодальну імперію, поки уряд не діяв. Цьому прийшов край. Тепер, коли Гоміньдан при владі, ми повністю підтримаємо народ і мобілізуємо його на боротьбу проти тиранічних панів. Хоча ми маємо виявляти стриманість, щоб уникнути анархії, озброєння селян та підготовка місцевого ополчення покаже елітам: терпіння народу Хунані вичерпалося, і уряд почув їхні крики."

  HNN_supporting_non_compliance:0 "Підтримка громадянської непокори"
  HNN_supporting_non_compliance_desc:0 "Не всі форми опозиції елітам мають бути насильницькими. Існує мирний метод, який завдає найбільшої шкоди інходам шляхти. Субсидуючи селянські родини для формування пактів «непокори», ми досягнемо того, що величезна кількість людей просто відмовиться працювати на полях. Під захистом уряду нам залишиться лише чекати, поки еліти прийдуть до столу переговорів."

  HNN_reducing_gentry_control:0 "Обмеження контролю шляхти"
  HNN_reducing_gentry_control_desc:0 "[HNN_reducing_gentry_control_desc_loc]"
  HNN_reducing_gentry_control_desc_kmt:0 "Попри наші зусилля, шляхта продовжує триматися за багатство та політичну владу. Їхній опір дратує як радикальних ідеологів Гоміньдану, так і селянство. Місцеві чиновники часто ставали інструментами експлуатації в руках еліт. Встановивши контроль Гоміньдану, ми усунемо всіх симпатиків еліт з окружних урядів і замінимо їх нашими кадрами."
  HNN_reducing_gentry_control_desc_nokmt:0 "Шляхта відчайдушно чіпляється за старі порядки, створюючи блок політичної опозиції в провінційних зборах. Відмова від співпраці змусила губернатора до радикальних дій. Заміна місцевих магістратів на нові кадри з Чанші, віддані ідеалам федералізму, дозволить встановити контроль навіть на найнижчому рівні врядування. Сподіваємося, це покладе край саботажу з боку шляхти."

  HNN_seizing_estates:0 "Конфіскація маєтків"
  HNN_seizing_estates_desc:0 "[HNN_seizing_estates_desc_loc]"
  HNN_seizing_estates_desc_nokmt:0 "Терпіння увірвалося. Колись шляхта була союзником у стабілізації Хунані, але їхнє небажання відмовлятися від минулого стало їхньою загибеллю. Губернатор санкціонував примусове вилучення, націоналізацію та перерозподіл маєтків, які порушують принципи реформи. Це крайній крок, але він має звільнити селян Хунані від кайданів."
  HNN_seizing_estates_desc_kmt:0 "Зверхність землевласників надто дорого коштує провінції та нації. Як Хунань може допомогти Національній революції, якщо вона надто нерішуча, щоб навести лад вдома? За наказом провінційного уряду солдати Національно-революційної армії розпочнуть конфіскацію елітних маєтків для реалізації програми «Земля тим, хто її обробляє». Питання шляхти буде вирішене раз і назавжди."

  HNN_cheap_credit:0 "Дешеві кредити"
  HNN_cheap_credit_desc:0 "Сільське господарство в Хунані часто заганяє фермерів у борги через необхідність купувати добрива та інструменти. Поганий врожай створює замкнене коло хронічної заборгованості. Щоб підтримати трударів, ми домовимося з банками про кредити на вигідних умовах та забезпечимо страхування врожаю."

  HNN_maintaining_proper_irrigation:0 "Підтримка іригаційної системи"
  HNN_maintaining_proper_irrigation_desc:0 "Річка Сян дарує Хунані родючість, але на заході, в провінції Ґуйчжоу, безгосподарність призвела до нерівномірності врожаїв. Будівництво іригаційних каналів від річки Сян дозволить створити резервуари, щоб жоден врожай не був втрачений через посуху."

  HNN_modernising_our_communication:0 "Модернізація мереж зв'язку"
  HNN_modernising_our_communication_desc:0 "Хунань прагне до прогресу в галузі телекомунікацій. Якщо раніше телеграф використовувався лише для військових потреб, то тепер ми розширимо мережу на всі округи та інтегруємо її в національну систему. Тільки так Хунань стане справді сучасною провінцією."

  HNN_kaili_to_changsha:0 "Із заходу на схід"
  HNN_kaili_to_changsha_desc:0 "Залізнична мережа Китаю зараз нагадує розірвані нитки. Через Чаншу проходить лінія Пекін-Ґуанчжоу, але навіть у межах нашої провінції великі міста залишаються відрізаними від столиці. За державної підтримки ми залучимо залізничні компанії, щоб нарешті з'єднати Кайлі з рештою країни."

  ### Промислові реформи
  HNN_industrial_reform_mission_timer:0 "Прогрес промислових реформ"
  HNN_industrial_reform_mission_timer_desc:0 "У промисловому секторі Хунані відбуваються значні зміни. Уряд намагається виправити десятиліття ігнорування потреб міських центрів. Ці рішення можуть прискорити прогрес, але ціна буде високою. Хунань не відновиться, доки промислова криза не мине."

  HNN_pursuing_new_partners:0 "Пошук нових економічних партнерів"
  HNN_pursuing_new_partners_desc:0 "Щоб реформувати експортно-орієнтовану економіку в самодостатню, необхідно мобілізувати народ. Акцент на місцевих партнерах дозволить залишити капітал всередині Хунані для подальшого розвитку провінції."

  HNN_securing_urban_support:0 "Завоювання підтримки містян"
  HNN_securing_urban_support_desc:0 "Міські центри Хунані довгий час були осередками Китайської синдикалістської партії, що створювало прірву між робітниками та адміністрацією. Попри великі витрати, ми мусимо зблизити робітників з урядом, адже прогрес не має часу на дрібні чвари."

  HNN_economic_controls_board:0 "Створення Ради економічного контролю"
  HNN_economic_controls_board_desc:0 "Прихильники капіталізму називають це авторитаризмом, але Рада економічного контролю Хунані регулюватиме імпорт через ліцензування. Це захистить внутрішнє виробництво від іноземних товарів. Контроль стосуватиметься і товарів з інших провінцій Китаю, що може зашкодити єдності, але це необхідно для економічного відновлення."

  HNN_zhuzhou_industrial_zone:0 "Промислова зона Чжучжоу"
  HNN_zhuzhou_industrial_zone_desc:0 "Місто Чжучжоу на річці Сян має ідеальне розташування для розвитку. Ми плануємо перетворити його на промислову зону, де державні заводи дадуть поштовх металургійній та хімічній галузям провінції."

  HNN_reinforce_the_banks_of_hunan:0 "Зміцнення банківського сектора"
  HNN_reinforce_the_banks_of_hunan_desc:0 "Банки Хунані часто поглинаються зовнішніми структурами або банкрутують. Існує ризик ліквідації їхніх активів у будь-який момент. Крім того, різноманіття валют підриває довіру до місцевих грошей. Створення центрального банку та державний нагляд закладуть фундамент для майбутнього розвитку."

  HNN_influx_of_capital:0 "Приплив капіталу"
  HNN_influx_of_capital_desc:0 "Нещодавній сплеск інвестицій дає надію на успіх. Інвесторів цікавить чай, рамі та коноплі, а також інфраструктурні проекти. Ми зробимо все, щоб забезпечити потреби цих проектів."

  HNN_privatise_railroads:0 "Приватизація залізниць"
  HNN_privatise_railroads_desc:0 "Магістраль Ґуанчжоу-Пекін є ласим шматком для приватних покупців. Раніше влада відмовлялася її продавати, але тепер приватизація може принести капітал, необхідний для будівництва нових колій по всій провінції."

  HNN_acquiring_foreign_expertise:0 "Залучення іноземного досвіду"
  HNN_acquiring_foreign_expertise_desc:0 "Наші інтелектуали сильні в культурі, але промисловим експертам бракує досвіду. Уряд розпочне програму найму іноземних фахівців з електроніки та індустрії, щоб навчити наших робітників і вивести галузь на новий рівень."

  ### Політичні та територіальні рішення
  HNN_attack_SZC:0 "Включити Сичуань до Політичної ради Південно-Західного Китаю"
  HNN_attack_YUN:0 "Включити Юньнань до Політичної ради Південно-Західного Китаю"

  HNN_expanding_local_elections_category:0 "Розбудова основ демократії"
  HNN_expand_local_elections_decision:0 "Розширити місцеву демократію в: [HNN_expand_local_elections_decision_loc]"
  HNN_expand_local_elections_decision_desc:0 "Компроміс між Гоміньданом та республіканцями дозволив провести обмежені демократичні вибори в Хунані. Кандидати проходитимуть ретельну перевірку на відповідність «Трьом народним принципам», щоб уникнути впливу мілітаристів та реакціонерів на виборчий процес."

  HNN_local_elections_guizhou:0 "Кайлі"
  HNN_local_elections_changde:0 "Чанде"
  HNN_local_elections_changsha:0 "Чанша"

  HNN_constructing_rural_autonomy_category:0 "Створення сільських автономій"
  HNN_constructing_rural_autonomy_decision:0 "Розвинути комуну в: [HNN_construct_rural_autonomy_decision_loc]"
  HNN_constructing_rural_autonomy_decision_desc:0 "Тан Шенчжі вірить, що сила революції — у селянстві. Програма підтримки сільських комун надасть громадам право на самоврядування та оборону. Проте партія наглядатиме за лідерами комун, щоб вони не виступили проти самого Гоміньдану."

  HNN_rural_autonomies_guizhou:0 "Східне Ґуйчжоу"
  HNN_rural_autonomies_changde:0 "Сянсі"
  HNN_rural_autonomies_changsha:0 "Лоуді"

