 HNN_chen_GXC: "Чень Цзюнмін вийшов переможцем у 1936 році та закріпив за собою обидва Гуани. Після цього він рушив на північ, від Гуанчжоу до Пекіна, щоб об'єднати решту країни."
 HNN_tang: "Зберігши контроль над Юньнанню, Тан Цзіяо підняв прапор федералізму та рушив на Пекін."

 # Риси
 HNN_civilian_governor: "«Цивільний» губернатор"
 HNN_civilian_governor_desc: "§LТан Сянмін відомий як запеклий прихильник верховенства права. Він готовий повернути народу Хунані «демократію», але таку, де бандити на кшталт Тан Шенчжи не матимуть шансу на владу. Нехай народ радіє: М'ясник пішов, а Цивільний губернатор уже тут!§!"

 HNN_commander_in_chief: "Головнокомандувач"
 HNN_commander_in_chief_desc: "§LУ 1916 році Тан Сянмін невтомно працював, щоб принести мир і правосуддя в провінцію. Проте революціонери зруйнували все, що він створив. Тан Сянмін — як батько для народу Хунані, і його любов до цієї землі не знає меж!§!"

 HNN_inspector_general: "Генерал-інспектор Сян-Юе-Гуй"

 HNN_first_son_of_the_revolution: "Перший син революції"
 HNN_first_son_of_the_revolution_desc: "§LТан Шенчжи став іскрою, що запалила Північний похід, і його соціалістичні переконання очевидні. Дехто називає його опортуністом, але він — прагматик, який бореться за народ Хунані на кожному кроці.§!"

 HNN_old_guard_revolutionary: "Революціонер старої гвардії"
 HNN_old_guard_revolutionary_desc: "§LЧен Цянь боровся за свободу Китаю ще з часів Сіньхайської революції. Хоча він схильний до поміркованості перед обличчям авторитаризму, він самовіддано служить Гоміньдану до останнього подиху.§!"

