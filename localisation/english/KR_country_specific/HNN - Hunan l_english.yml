 #賀耀祖
 HNN_he_yaozu: "Хе Яоцзу"
 HNN_he_yaozu_high_command_desc: "§YНародився:§! §L8 травня 1889 року, повіт Нінсян, провінція Хунань, Велика Цін§!\n§YПолітична орієнтація:§! §cфедераліст§!\n§YПоходження:§! §LНародився у заможній родині, здобув приватну освіту, а згодом навчався у Військовій академії армії Японії, де вивчав логістику. Там він приєднався до Тунменхою та брав участь у Сіньхайській революції. У 1916 році повернувся до Китаю для участі у революціях під проводом Сунь Ятсена.\n\nНаступного року він вступив до хунанської армії Чжао Хенці, за 6 років пройшовши шлях від командира полку до комдива. Попри тиск з боку Тан Шенчжі, Хе залишився вірним Чжао під час наступу Національно-революційної армії. Хоча його дивізія була витіснена з провінції, згодом, завдяки підтримці чжилійців та зраді Юаня Цзуміна, Хе та його союзники змогли повернути контроль над Хунанню, розгромивши війська Гоміньдану. Тепер Хе прагне підтримувати сувору дисципліну в армії, аби Хунані більше ніколи не довелося покладатися на допомогу Пекіна.§!"

 HNN_ye_kaixin: "Є Кайсінь"
 HNN_ye_kaixin_army_chief_desc: "§YНародився:§! §L1885 рік, повіт Нінсян, провінція Хунань, Велика Цін§!\n§YПолітична орієнтація:§! §cфедераліст§!\n§YПоходження:§! §LНародився в Хунані, навчався в університеті Цзяннань. У 1913 році очолив другу дивізію хунанської армії, ставши довіреною особою Чжао Хенці. \n\nКоли Північний похід досяг Хунані, саме Є Кайсінь першим виступив проти Тан Шенчжі. Після тимчасового відступу під крило У Пейфу, саме його війська відбили Чаншу, повернувши її під номінальний контроль чжилійців. Хоча Є прийняв входження Хунані до Ліги восьми провінцій, він не довіряє Сунь Чуаньфану і воліє тримати свою армію на східному кордоні, захищаючи автономію провінції. Протягом останнього десятиліття він залишається надійним стовпом режиму Чжао Хенці.§!"

 HNN_gong_xian: "Ґун Сянь"
 HNN_gong_xian_high_command_desc: "§YНародився:§! §L1892 рік, повіт Чанша, провінція Хунань, Велика Цін§!\n§YПолітична орієнтація:§! §cфедераліст§!\n§YПоходження:§! §LҐун Сянь навчався на офіцера в Чанші і служив під началом Хе Яоцзу. Він відомий своєю відвагою, яка межує з безрозсудністю.§!\n\n§YПримітки: Харизматичний командир, він часто демонструє майже самовбивчу хоробрість. Під час Північного походу він вів своїх солдатів проти значно переважаючих сил ворога, переслідуючи їх вдень і вночі. Він неодноразово був на межі загибелі, але дивом продовжує службу.§!"

 HNN_tao_zhiyue: "Тао Чжиюе"
 HNN_tao_zhiyue_army_chief_desc: "§YНародився:§! §L18 вересня 1892 року, повіт Нінсян, провінція Хунань, Велика Цін§!\n§YПолітична орієнтація:§! §cфедераліст§!\n§YПоходження:§! §LЗакінчив Баодінське військове училище за спеціальністю «піхота», брав участь в Учанському повстанні. Майже всю кар'єру провів у Хунані під керівництвом Хе Яоцзу. Його відданість робить його надійним офіцером кліки Чжао.§!\n\n§YПримітки: Відомий адміністратор із прогресивними ідеями, Тао докладає зусиль для пом'якшення етнічної напруженості в Хунані та часто використовує війська для захисту селян від свавілля шляхти-ґентрі. Дехто вважає, що він потай симпатизує Гоміньдану через дружбу з Чжан Чжичжуном.§!"

 HNN_jiang_chuou: "Цзян Чуоу"
 HNN_jiang_chuou_high_command_desc: "§YНародився:§! §L1891 рік, повіт Дун'ань, провінція Хунань, Велика Цін§!\n§YПолітична орієнтація:§! §cфедераліст§!\n§YПоходження:§! §LПісля участі в Сіньхайській революції приєднався до хунанської армії. Брав участь у вигнанні Чжан Цзін'яо та придушенні заколоту Тан Шенчжі. Під керівництвом Є Кайсіня він зарекомендував себе як здібний офіцер крила Чжао Хенці.§!\n\n§YПримітки: Палкий прихильник модернізації армії, Цзян особливо цікавиться бронетехнікою та залізничною артилерією. Він навіть опублікував статтю про передові військові технології Заходу.§!"

 HNN_chen_quzhen: "Чень Цюйчжень"
 HNN_chen_quzhen_high_command_desc: "§YНародився:§! §L22 вересня 1883 року, повіт Фенхуан, провінція Хунань, Велика Цін§!\n§YПолітична орієнтація:§! §Pдіархія§!\n§YПоходження:§! §LПочав службу в новій армії Хунані, воював проти тибетських сепаратистів під час революції 1911 року. Після падіння Цін став заступником начальника штабу гарнізону Сянсі. \n\nПід час війни на захист конституції він став правою рукою Тянь Їнчжао. Мало що змінилося для Ченя після Північного походу: він продовжує утримувати регіональну владу в Сянсі за мовчазної згоди Чжао Хенці.§!\n\n§YПримітки: Хоча Тянь Їнчжао залишається його номінальним начальником, через опіумну залежність Тяня Чень став фактичним правителем. Разом вони керують Західною Хунанню як діархія. Чень тримається осторонь політичних інтриг Чанші, воліючи вичікувати.§!"

 HNN_tian_yingzhao: "Тянь Їнчжао"
 HNN_tian_yingzhao_commander_desc: "§YНародився:§! §L1876 рік, повіт Фенхуан, провінція Хунань, Велика Цін§!\n§YПолітична орієнтація:§! §Pдіархія§!\n§YПоходження:§! §LНавчався в Японії, де зустрів Сунь Ятсена і вступив до Тунменхою. Повернувшись до Китаю, викладав у Сичуанській військовій академії, готуючи майбутніх мілітаристів Лю Сяна та Яна Сеня. \n\nУ 1913 році був призначений посланцем у Сянсі. Під час подальших воєн він то захоплював міста, то відступав під тиском Фен Юйсяна. У цей період він призвичаївся до опіуму і дедалі більше делегував владу Чень Цюйчженю. Нині він залишається в Чанші, тоді як Чень править у Сянсі від його імені. Хоча вони належать до старої хунанської кліки, їхня лояльність до Чжао Хенці не є безумовною.§!"

 HNN_zhou_xicheng: "Чжоу Січен"
 HNN_zhou_xicheng_high_command_desc: "§YНародився:§! §L7 квітня 1893 року, повіт Тунцзи, провінція Цзянсі, Велика Цін§!\n§YПолітична орієнтація:§! §nстара ґуйчжоуська кліка§!\n§YПоходження:§! §LНародився в родині землевласника. Його військова кар'єра почалася в Ґуйчжоу. Він пройшов крізь численні конфлікти в Хунані та Сичуані, зрештою очоливши власну бригаду під командуванням Юаня Цзуміна. \n\nПобоюючись амбіцій Юаня, Чжоу зумів увійти до його внутрішнього кола і здобути довіру. Наразі він залишається поруч із Юанем, допомагаючи утримувати той клаптик Ґуйчжоу, що не окупований юньнанцями.§!\n\n§YПримітки: Має репутацію командира, який завжди веде війська в бій особисто. Відомий масштабними операціями проти бандитів та нещадним ставленням до корупції: він особисто карав винних чиновників на смерть.§!"

 HNN_long_yunfei: "Лун Юньфей"
 HNN_long_yunfei_high_command_desc: "§YНародився:§! §L1886 рік, повіт Фенхуан, провінція Хунань, Велика Цін§!\n§YПолітична орієнтація:§! §Pчжилієць§!\n§YПоходження:§! §LЗа національністю мяо. У 18 років пішов із дому і став бандитом. Займався азартними іграми, контрабандою цигарок та супроводом купців. Після революції 1911 року, як і багато інших впливових бандитів, отримав звання комдива. Нині служить діархії Сянсі. Хоча він не найшляхетніша людина, принаймні він чесний бандит.§!\n\n§YПримітки: Подейкують, що Лун володіє понад 14 гектарами землі в Хунані, купленими за незаконні прибутки, проте він відмовляється казати, де саме ця земля.§!"

 HNN_dai_jitao: "Дай Цзітао"
 HNN_dai_jitao_army_chief_desc: "§YНародився:§! §L1891 рік, повіт Фенхуан, провінція Хунань, Велика Цін§!\n§YПолітична орієнтація:§! §Pдіархія§!\n§YПоходження:§! §LЗакінчив Юньнанську військову академію за спеціальністю «інженерія». Служив у Сянсі під командуванням Тянь Їнчжао та Чень Цюйчженя. Коли У Пейфу встановив контроль над Південним Китаєм, Дай залишився вірним де-факто лідерству Ченя в Сянсі.§!\n\n§YПримітки: Дай почав збирати та описувати всі подвиги діархії Сянсі, готуючи історичну статтю про період правління Ченя та Тяня.§!"

 HNN_yang_xuancheng: "Янь Сюаньчен"
 HNN_yang_xuancheng_navy_chief_desc: "§YНародився:§! §L1889 рік, Чанша, провінція Хунань, Велика Цін§!\n§YПолітична орієнтація:§! §lаполітичний§!\n§YПоходження:§! §LНародився у традиційній родині, навчався морській справі в Японії. Після повернення служив артилерійським офіцером на кораблі «Чутай» флоту Цін. \n\nУ 1913 році був відібраний для навчання в США, але через скасування фінансування повернувся до Японії. З 1920 року працював у дипломатичному відділі уряду Хунані. Протягом десятиліття він сумлінно забезпечував безпеку водних шляхів провінції. Маючи хист до розвідки та палке бажання повернутися у відкрите море, Янь цілком може отримати свій шанс у майбутньому.§!"

 ##- Advisors -##

 #RKMT
 #覃振
 HNN_qin_zhen: "Цінь Чжень"
 HNN_qin_zhen_advisor_desc: "§YНародився:§! §L1885 рік, повіт Таоюань, провінція Хунань, Велика Цін§!\n§YПолітична орієнтація:§! §a6-та армія§!\n§YПоходження:§! §LРеволюційний дух Цінь Чженя проявився ще в юності, коли війська Альянсу восьми держав увірвалися до Пекіна у 1900 році. Тоді ще студент, Цінь виступив на площі рідного повіту з палкою промовою, викриваючи злочини двору Цін, що призвели до приниження країни.\n\nПісля знайомства з Сун Цзяоженем він вступив до товариства Хуасін, за що був виключений зі школи. Він став президентом хунанського відділення Тунменхою і був заарештований владою Цін під час спроби організувати повстання, зазнавши жорстоких катувань та довічного ув'язнення. Звільнений під час Сіньхайської революції, Цінь служив у Палаті представників Бейяна. Після вбивства Сун Цзяоженя він приєднався до боротьби Сунь Ятсена, навіть пропонуючи себе як камікадзе для замаху на Юань Шикая. Після поразки Північного походу він опинився під захистом Чен Цяня.§!"

 HNN_li_shizhang: "Лі Шічжан"
 HNN_li_shizhang_advisor_desc: "§YНародився:§! §L1900 рік, повіт Цзіньсянь, провінція Цзянсі, Велика Цін§!\n§YПолітична орієнтація:§! §a6-та армія§!\n§YПоходження:§! §LЛі навчався на економічному факультеті Пекінського університету, де долучився до Руху 4 травня. У 1922 році вступив до соціалістичної спілки молоді, а наступного року — до Китайської синдикалістської партії (КСП). Працював репортером та вчителем, а згодом став прессекретарем Сунь Ятсена під час його хвороб.\n\nЗа запрошенням Чжоу Еньлая він став політичним інструктором в академії Вампу, а згодом — секретарем політвідділу 6-ї армії. Після колапсу Північного походу він відступив до Ґуйчжоу разом із частинами Чен Цяня, продовжуючи виконувати функції ключового адміністратора армії.§!\n\n§YПримітки: Оскільки він ніколи не виходив із КСП і мав тісні зв'язки з Чжоу Еньлаєм, праві гоміньданівці вважають його «кротом» соціалістів. Проте його невтомна праця задля боєздатності 6-ї армії ставить ці чутки під сумнів.§!"

 HNN_lu_dao: "Лу Дао"
 HNN_lu_dao_advisor_desc: "§YНародився:§! §L1882 рік, повіт Їшань, провінція Ґуансі, Велика Цін§!\n§YПолітична орієнтація:§! §LГоміньдан§!\n§YПоходження:§! §LЛу починав як секретар у цінській армії, але під впливом революціонерів вступив до Тунменхою. Закінчив Юньнанське військове училище. Під час Сіньхайської революції воював у складі юньнанської армії в Сичуані та Ґуйчжоу.\n\nНе змирившись із автократією Тан Цзіяо, він перейшов на службу до мілітариста Лю Сяньші. Після хаотичного інциденту Міньцзю 1920 року Лу обіймав різні посади, а згодом приєднався до Гоміньдану в Шаоґуані. Після поразки Північного походу він відійшов від політики, оселившись у хунанському селі. Повернення Гоміньдану в провінцію знову зробило його затребуваним: багато цивільних діячів бачать у ньому ідеального кандидата на посаду губернатора Ґуйчжоу завдяки його чесності та республіканським чеснотам.§!"

 HNN_ren_bishi: "Жень Біші"
 HNN_ren_bishi_advisor_desc: "§YНародився:§! §L30 квітня 1904 року, повіт Сян'їнь, провінція Хунань, Велика Цін§!\n§YПолітична орієнтація:§! §oКСП — радикали§!\n§YПоходження:§! §LНародився у сільській родині вчителів. У 1921 році в Шанхаї приєднався до молодіжного крила майбутньої синдикалістської партії. Натхненний більшовицькою революцією, він у 1923 році вирушив до Франції у складі делегації КСП для вивчення досвіду Комуни Франції.\n\nПовернувшись до Китаю, викладав французьку мову в Шанхайському університеті. Будучи амбітним лідером, він очолив Соціалістичну спілку молоді Китаю і значно розширив вплив партії під час подій 30 травня. Після поразки Північного походу він переховується у Шанхаї та в підпільних осередках Хунані, готуючи молоді кадри до майбутньої соціальної та національної революції.§!"

 HNN_huang_gonglue: "Хуан Ґунлюе"
 HNN_huang_gonglue_advisor_desc: "§YНародився:§! §L24 січня 1898 року, повіт Сянсян, провінція Хунань, Велика Цін§!\n§YПолітична орієнтація:§! §R8-ма армія (радикали)§!\n§YПоходження:§! §LХуан розпочав службу в армії у 1916 році, де потоваришував із Пен Дехуаєм. Разом вони організовували таємні гуртки допомоги бідним у своєму підрозділі. Закінчив хунанське військове училище у 1923 році та приєднався до 8-ї армії Тан Шенчжі.\n\nВін успішно бився у Північному поході, а після його провалу став одним із засновників партизанського руху. Хуан є палким прихильником програми селянського соціалізму Тимчасового комітету дії (ТКД). Разом із Хе Луном він формує радикальне ядро 8-ї армії. Хуан Ґунлюе не заспокоїться, поки Китай не звільниться від імперіалізму та гноблення.§!"

 HNN_tang_duo: "Тан Дуо"
 HNN_tang_duo_air_chief_desc: "§YНародився:§! §L1904 рік, повіт Їян, провінція Хунань, Велика Цін§!\n§YПолітична орієнтація:§! §rКСП§!\n§YПоходження:§! §LНародився в родині вчителів і здобув чудову освіту. У Першій хунанській школі він познайомився з Жень Біші, з яким згодом поїхав до Франції за програмою «навчання та робота» в Комуні Франції. Там Тан став відданим членом Китайської синдикалістської партії.\n\nУ 1923 році за запрошенням Тань Янькая він допомагав Сунь Ятсену в організації авіаційного заводу. Тан став одним із перших інструкторів майбутніх революційних ВПС Китаю. За рішенням КСП та націоналістичного уряду він був відправлений для подальшого авіаційного навчання до Соціалістичної Республіки Італія, Комуни Франції та Британського Союзу. Повернувся до Китаю у 1932 році для участі в невдалому Шанхайському повстанні.§!"

 HNN_men_bingyue: "Мень Бін'юе"
 HNN_men_bingyue_high_command_desc: "§YНародився:§! §L24 червня 1891 року, повіт Дунґуан, провінція Чжилі, Велика Цін§!\n§YПолітична орієнтація:§! §S8-ма армія§!\n§YПоходження:§! §LПрофесійний революціонер, Мень вивчав німецьку мову в бейянських училищах та кавалерійську справу в Баодіні. Брав участь у Сіньхайській революції та Другій революції. Служив кавалерійським командиром у різних частинах республіки. \n\nПісля вигнання Фен Юйсяна з Пекіна фентянцями, Мень перебрався на південь до свого однокласника по Баодіну — Тан Шенчжі. Мень почувається дещо чужим у кліці Тана, оскільки є одним із небагатьох неофіцерів-хунанців у її складі. Попри це, Тан часто радиться з ним і вважає його надійним офіцером.§!"

 #Feds
 #李劍農
 HNN_li_jiannong: "Лі Цзяньнун"
 HNN_li_jiannong_sic_desc: "§YНародився:§! §L10 червня 1880 року, повіт Шаоян, провінція Хунань, Велика Цін§!\n§YПолітична орієнтація:§! §cфедераліст§!\n§YПоходження:§! §LНародившись у селянській родині, Лі Цзяньнун змалку відчув неприязнь до чиновників через їхню некомпетентність. Він закінчив хунанську середню школу в 1904 році зі спеціалізацією на історії. Під час вивчення економіки в Японії Лі зблизився з Сунь Ятсеном та Тунменхоєм. Після падіння династії Цін став палким захисником республіки.\n\nУ своїх газетах Лі обстоював провінційну автономію та виступав проти панування мілітаристів. Його праці з політичних реформ привернули увагу губернатора Чжао Хенці, який запросив Лі до Чанші для розробки провінційної конституції в 1922 році. Відтоді Лі залишається в Хунані, допомагаючи Чжао просувати його політичну програму. Робота Лі з популяризації федералізму перетворила його на праву руку губернатора та провідного теоретика хунанського федералістського руху.§!"

 HNN_zhao_junmai: "Чжао Цзюньмай"
 HNN_zhao_junmai_advisor_desc: "§YНародився:§! §L1901 рік, повіт Хеншань, провінція Хунань, Велика Цін§!\n§YПолітична орієнтація:§! §cфедераліст§!\n§YПоходження:§! §LМолодший брат Чжао Хенці, здобув освіту в Японії та США. Він закінчив Університет Вісконсину за спеціальністю «цивільне будівництво» і був запрошений братом на роботу в хунанський уряд. Хоча його нинішнє становище зумовлене владою брата, Чжао Цзюньмай сповнений рішучості бути компетентним міністром та гідно служити інтересам провінції.§!"

 HNN_zhong_boyi: "Чжун Бої"
 HNN_zhong_boyi_advisor_desc: "§YНародився:§! §L1880 рік, повіт Ланьшань, провінція Хунань, Велика Цін§!\n§YПолітична орієнтація:§! §cфедераліст§!\n§YПоходження:§! §LЧжун Бої був членом консультативного бюро Хунані за часів Цін до Сіньхайської революції. Він став на бік революціонерів і був обраний депутатом палати представників. У 1917 році приєднався до уряду Сунь Ятсена в Ґуанчжоу, створеного на противагу кліці Аньхой. У 1921 році обійняв посаду директора фінансів Хунані та допоміг оприлюднити хунанську конституцію. Він досі працює в уряді провінції і вважається впливовою постаттю в таборі Чжао.§!"

 HNN_huang_yanpei: "Хуан Яньпей"
 HNN_huang_yanpei_advisor_desc: "§YНародився:§! §L1 жовтня 1878 року, повіт Чуаньша, провінція Цзянсу, Велика Цін§!\n§YПолітична орієнтація:§! §mКНДА§!\n§YПоходження:§! §LХуан Яньпей рано втратив батьків і виховувався бабусею. Він досконало вивчив конфуціанську класику та склав імперські іспити. Через революційну діяльність був змушений тікати до Японії, де вступив до Тунменхою. Після 1912 року очолював низку провідних університетів Китаю.\n\nВін заснував у Шанхаї Китайське товариство професійної освіти. Хуан продовжував просувати освітні реформи, поки Сунь Чуаньфан не розпочав переслідування інтелектуалів після Шанхайського повстання 1932 року. Хуан втік до Хунані, де губернатор Чжао Хенці прийняв його як друга і вченого. У Чанші Хуан реорганізував свою групу в Китайську національну демократичну асоціацію, аби продовжувати боротьбу за демократичні ідеали.§!"

 HNN_qian_yongming: "Цянь Юнмін"
 HNN_qian_yongming_advisor_desc: "§YНародився:§! §L29 серпня 1885 року, Усін, провінція Чжецзян, Велика Цін§!\n§YПолітична орієнтація:§! §mКНДА§!\n§YПоходження:§! §LУродженець Чжецзяна, Цянь Юнмін вивчав економіку в Бейянському університеті Тяньцзіня. Після Сіньхайської революції став міністром фінансів у Шанхаї. Коли Юань Шикай розпочав чистки прихильників Сунь Ятсена, Цянь покинув бейянський уряд. Разом із Хуан Яньпеєм він заснував Китайське товариство професійної освіти в Шанхаї. У 1932 році втік разом із Хуаном до Хунані, ставши членом реформованої Китайської національної демократичної асоціації.§!"

 HNN_zhou_shizhao: "Чжоу Шічжао"
 HNN_zhou_shizhao_advisor_desc: "§YНародився:§! §L12 березня 1897 року, повіт Нінсян, провінція Хунань, Велика Цін§!\n§YПолітична орієнтація:§! §lреспубліканці§!\n§YПоходження:§! §LНародився в Чанші у бідній селянській родині. Навчався у Першому хунанському педагогічному університеті разом із Мао Цзедуном. Вони стали близькими друзями і разом із Цай Хесенем заснували Товариство Сіньмінь у 1918 році. Хоча Чжоу симпатизував Гоміньдану, він залишився в Хунані після Північного походу.\n\nУ 1932 році Мао Цзедун очолив повстання «Осіннього врожаю» на знак солідарності з Шанхаєм, але був убитий військами Чжао Хенці та Тана Сянміна. Чжоу затаїв глибоку образу на них за смерть друга. Через це він висунув свою кандидатуру проти Чжао на виборах 1932 року і ледь не переміг, втративши посаду лише через зраду конституціоналістів та ПМК. Спільно з КНДА Хуан Яньпея він виступає проти присутності чжилійців та губернаторства Чжао.§!"

 HNN_tang_hualong: "Тан Хуалун"
 HNN_tang_hualong_sic_desc: "§YНародився:§! §L27 листопада 1874 року, Хуанчжоу, провінція Хубей, Велика Цін§!\n§YПолітична орієнтація:§! §SТРАК§!\n§YПоходження:§! §LСтарший брат Тана Сянміна, він у багатьох відношеннях відрізняється від адмірала. Тан Хуалун — здібний економіст і мислитель-раціоналіст. Під час Сіньхайської революції він закликав офіцерів переходити на бік республіканців. Він служив в уряді Юань Шикая, поки не розчарувався в його імперських амбіціях.\n\nТан повернувся до Китаю в 1927 році разом із Лян Цічао, а через рік приєднався до свого брата в Хунані. Він став мером Юеяна і очолив розширення Китайської конституційної партії в провінції. Його амбіції посісти крісло губернатора розвіялися після виборів 1932 року через політичні незгоди з іншими демократами. Тепер його надії на повернення до великої політики залежать від дій його брата та того, наскільки адмірал буде готовий дотримуватися конституційних реформ.§!"

 HNN_hu_shuhua: "Ху Шухуа"
 HNN_hu_shuhua_advisor_desc: "§YНародився:§! §L24 грудня 1886 року, повіт Ю, провінція Хунань, Велика Цін§!\n§YПолітична орієнтація:§! §lаполітичний§!\n§YПоходження:§! §LСклав імперські іспити у 1903 році, навчався у приватній школі Мінде, а згодом за державний кошт поїхав до Німецької імперії. У 1920 році отримав докторський ступінь із металургії заліза в Берліні. Повернувшись до Китаю, Ху очолив низку університетів, де втілював своє бачення індустріального розвитку.\n\nСаме в Хунанському університеті він відновив факультет гірничої та металургійної інженерії, запросивши численних експертів для викладання. Ху наголошував на поєднанні теоретичної освіти з практикою на металургійних підприємствах провінції. Влітку 1934 року він організував 11-ту щорічну конференцію Економічного товариства Китаю в Хунані — вперше за межами розвинених прибережних міст.§!"

 HNN_huang_shiheng: "Хуан Шіхен"
 HNN_huang_shiheng_advisor_desc: "§YНародився:§! §L1889 рік, повіт Ченьчжоу, провінція Хунань, Велика Цін§!\n§YПолітична орієнтація:§! §lаполітичний§!\n§YПоходження:§! §LВиходець із родини вчених, Хуан Шіхен змалку полюбив самоосвіту. Через два роки після революції 1911 року він поїхав на навчання до США, отримавши дипломи Колумбійського університету та Університету Айови. Повернувшись до Китаю у 1920 році, він працював у провідних наукових виданнях.\n\nХуан відіграв ключову роль у заснуванні Хунанського університету. Попри політичні потрясіння, він двічі очолював департамент освіти провінції, зосереджуючись на розширенні мережі державних та приватних шкіл. Його кар'єра радника пішла вгору за часів правління Чжао Хенці. Він зробив значний внесок у культурні ініціативи, зокрема жертвуючи кошти школам та бібліотекам під юрисдикцією Чжао.§!"

 HNN_wang_tianpei: "Ванг Тяньпей"
 HNN_wang_tianpei_advisor_desc: "§YНародився:§! §Lгрудень 1888 року, повіт Тяньчжу, провінція Ґуйчжоу, Велика Цін§!\n§YПолітична орієнтація:§! §lреспубліканці§!\n§YПоходження:§! §LВійськова кар'єра Ван Тяньпея почалася під час повстання в Учані, де Хуан Сін призначив його командиром фортеці. Після успіху Сіньхайської революції він навчався у престижному Баодінському військовому училищі. Ван брав участь у війні на захист республіки проти Юань Шикая.\n\nСпочатку він був підлеглим мілітариста Юаня Цзуміна, але розчарувався в ієрархії воєнних вождів. Знайомство з Сунь Ятсеном пробудило в ньому республіканський дух. Ван приєднався до Північного походу як лідер 10-ї армії НРА, здобувши низку перемог на півночі Хунані. Проте після краху походу він залишився в провінції і тепер служить радником в уряді Чжао Хенці, спеціалізуючись на боротьбі з бандитизмом у прикордонних районах.§!"

 HNN_hu_ying: "Ху Ін"
 HNN_hu_ying_advisor_desc: "§YНародився:§! §L1884 рік, повіт Таоюань, провінція Хунань, Велика Цін§!\n§YПолітична орієнтація:§! §lаполітичний§!\n§YПоходження:§! §LЩе підлітком Ху Ін долучився до революційної діяльності, плануючи невдале повстання в Чанші у 1904 році. Після кількох невдалих замахів на цінських чиновників він втік до Японії, а згодом повернувся за наказом Сунь Ятсена, але був ув'язнений. \n\nВін опинився в центрі Сіньхайської революції одразу після звільнення і став першим міністром закордонних справ молодої республіки. Ху Ін був одним із «шести джентльменів Хунсянь», які підтримали монархічні наміри Юань Шикая, але зміг уникнути переслідувань після смерті диктатора. З 1920 року працював у гірничому бюро Хунані. Коли Чжао Хенці закріпив свою владу, Ху Ін підтримав його, ставши стабільною дипломатичною сполучною ланкою в його кабінеті.§!"

 HNN_ye_dehui: "Є Дехуей"
 HNN_ye_dehui_advisor_desc: "§YНародився:§! §L1864 рік, повіт Усянь, провінція Цзянсу, Велика Цін§!\n§YПолітична орієнтація:§! §lаполітичний§!\n§YПоходження:§! §LНавчався в академії Юелу в Чанші, склав імперські іспити і обіймав високі посади в цінському уряді. Він запекло атакував реформаторські ідеї Кан Ювея та Лян Цічао. Під час катастрофічної повені 1910 року Є накопичував зерно, що призвело до голодних бунтів і позбавлення його імперських почестей.\n\nВін підтримав спробу Юань Шикая реставрувати монархію. Зараз, офіційно перебуваючи на спочинку, Є зосереджується на впорядкуванні конфуціанських праць та написанні історичних книг, зберігаючи вплив як один із найавторитетніших вчених Хунані. Хоча його консерватизм викликає лють у селян та профспілок, він користується незмінною підтримкою місцевої шляхти та губернатора Чжао Хенці.§!"

 HNN_zhao_yusong: "Чжао Юйсун"
 HNN_zhao_yusong_advisor_desc: "§YНародився:§! §L26 грудня 1897 року, повіт Ліпін, провінція Ґуйчжоу, Велика Цін§!\n§YПолітична орієнтація:§! §nстара ґуйчжоуська кліка§!\n§YПоходження:§! §LУродженець Ґуйчжоу, Чжао обрав військову кар'єру. Він служив під началом Юаня Цзуміна — суворого командира, якого боялися і вороги, і підлеглі. Чжао, будучи членом ПМК, переконав Юаня зрадити Гоміньдан, за що Пекін винагородив того посадою губернатора Ґуйчжоу.\n\nЧжао очолює хунанське відділення партії «Молодий Китай» (ПМК) і активно нав'язує свої ідеї начальнику. Для Чжао Юань Цзумін є зразком китайця, який приведе націю до модернізації та створить сильну державу, не обтяжену демократією. Юань мало розуміє ідеологію ПМК, але їхня готовність підтримувати його одноосібну владу його цілком влаштовує.§!"

 HNN_zuo_shunsheng: "Цзо Шуньшен"
 HNN_zuo_shunsheng_bio: "Цзо Шуньшен народився в Чанші, вивчав іноземні мови та навчався в шанхайському коледжі Аврора, де потоваришував із Цзен Ці та Лі Хуанем. Разом вони сформували праве крило Товариства «Молодий Китай», виступаючи проти марксизму Лі Дачжао. У 1924 році він заснував журнал «Пробуджений лев», офіційно проголосивши створення Китайської молодіжної партії (ПМК).\n\nВін був затятим антимарксистом і в 1926 році був обраний до Центрального виконавчого комітету ПМК. На відміну від колег, Цзо більш схильний до парламентської діяльності та співпрацює з демократами на кшталт Хуан Яньпея. Він сприяв розквіту партії в межах національного порядку чжилійців."
 HNN_zuo_shunsheng_leader_desc: "§YНародився:§! §L13 жовтня 1893 року, повіт Чанша, провінція Хунань, Велика Цін§!\n§YПоходження:§!§L$HNN_zuo_shunsheng_bio$§!"
 HNN_zuo_shunsheng_advisor_desc: "§YНародився:§! §L13 жовтня 1893 року, повіт Чанша, провінція Хунань, Велика Цін§!\n§YПолітична орієнтація:§! §nПМК§!\n§YПоходження:§! §L$HNN_zuo_shunsheng_bio$§!"

