### Short War
# Decisions
 JAP_short_war_cat: "Імперські збройні сили Японії"
 JAP_short_war_cat_desc: "Дві гордості нашої нації, з часів Реставрації Мейдзі, Імперська армія та флот Японії перетворилися на потужні бойові сили, здатні не лише захищати Японські інтереси на Азійському континенті, але й тріумфувати над ворогами, що переважають у ресурсах та населенні, завдяки поєднанню чистої сили волі та блискучого керівництва.\n\nПроте, у новому та мінливому середовищі світу після Великої війни, майбутнє обох родів військ запекло обговорюється, Армія розділена між тими, хто бажає підготувати націю до затяжної, тотальної війни, і тими, хто бажає забезпечити, щоб Японія могла закінчити будь-яку війну, в яку вона вступає, серією швидких, рішучих битв, а Флот більш ретельно аналізує свою стратегію у світлі мінливої Американської ситуації. Ця справа додатково ускладнюється особливо гострим міжвидовим суперництвом, що спонукає обидва роди військ готуватися до різних воєн, щоб заробити більшу кількість фінансування, і перешкоджає встановленню єдиної національної оборонної стратегії. Незалежно від того, що може статися, військові мають бути готові до війни."

