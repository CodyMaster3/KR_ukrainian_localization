 JAP_nippon_kokuminto_long: "Nippon Kokumintō (Японська націоналістична партія)\n§LПісля раптового краху імперської влади внаслідок Китайської перемоги у Японо-Китайській війні, революційний Китайський уряд створив тимчасовий уряд та партію на чолі з Носакою Сандзо, щоб управляти Японськими рідними островами та принести Японцям ідеали Трьох принципів народу. Новостворена Ніппон Кокумінто (Японська націоналістична партія) прагне підтримувати тісні зв'язки з Китайцями, а також розвивати власні ідеали Міньшен, Міньцзу та Міньцюань, щоб здійснити принципи доктора Сунь про пан-Азійську світову революцію.§!\n"

 JAP_zantei_gunseifu: "Дзантей Гунсейфу"
 JAP_zantei_gunseifu_long: "Zantei Gunseifu (Тимчасовий військовий уряд)\n§LГордий Японський народ ніщо не могло підготувати до раптового краху імперської та військової влади після поразки у війні та подальшої повної окупації та капітуляції. Тепер окупаційна іноземна країна створила тимчасовий військовий уряд, щоб управляти Японськими рідними островами та забезпечити здоровий і стабільний перехід від колишньої монархії до, сподіваємося, нової яскравої демократії в Азії.§!\n"

