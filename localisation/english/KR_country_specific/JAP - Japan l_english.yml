 ### Socialist Advisors ###
 JAP_nosaka_sanzo: "Носака Сандзо"
 JAP_nosaka_sanzo_desc_body: "Син заможного Японського купця, Носака виріс у буржуазному середовищі та навчався в Університеті Кейо. Саме під час навчання в Кейо Носака зацікавився міжнародним робітничим рухом, інтерес, який підтримував один із його професорів, Кіічі Хоріе. Потім він завершив дослідження поміркованої робітничої організації, відомої як «Юайкай», а після закінчення навчання став редактором журналу організації.\n\nПісля Більшовицької революції 1917 року та наступної Французької революції 1919 року Носака став переконаним Марксистом і прибув до Франції у 1919 році, де познайомився з Британськими та Французькими соціалістами. Впливовий через Третій Інтернаціонал як один із фактичних лідерів Японського соціалістичного руху, що зароджувався, він зміг зблизитися з лівим керівництвом Гоміндану після їхнього вигнання з Китаю після провалу Першої Північної експедиції. Він брав участь у підготовці Шанхайського повстання 1932 року, організованого як Гомінданом, так і Лігою Китайських Синдикалістів, але провал повстання призвів до того, що він брав участь у повстанні в Мінгані як доброволець."
 JAP_nosaka_sanzo_leader_desc: "§YНародився:§! §L30 березня 1892 року в Хагі, Префектура Ямаґучі, Японська імперія§!\n§YПоходження:§! §L$JAP_nosaka_sanzo_desc_body$, допомагаючи сприяти перевихованню захоплених Японських військовополонених під час Другої Японо-Китайської війни. Саме цим завданням він заслужив довіру Гоміндану, щоб очолити нову Японську Соціалістичну Республіку до нового світанку разом із їхньою Китайською сестринською Республікою.§!"
 JAP_nosaka_sanzo_commander_desc: "§YНародився:§! §L30 березня 1892 року в Хагі, Префектура Ямаґучі, Японська імперія§!\n§YПоходження:§! §L$JAP_nosaka_sanzo_desc_body$. Вітаючи будь-яку допомогу, Центральний Комітет дозволив йому служити генералом у Китайській Національно-Революційній Армії. Хоча Носака відокремлений від своєї батьківщини на службі іншій нації, він сподівається одного дня повернутися до Японії та здійснити Японську Соціалістичну Революцію під своїм керівництвом.§!\n\n§YПримітки: Сподіваючись лише допомогти Китайській Національній Революції, Носака Сандзо тримався осторонь політичних чвар у Гоміндані і розглядається як нейтральна фігура.§!"

