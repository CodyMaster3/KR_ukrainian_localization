### Traits ###
 JAP_samurai_lineage: "Самурайський рід"
 JAP_samurai_lineage_desc: "§LЦя людина походить із гордого роду самураїв і залишається вірною старим традиціям і відданості.§!"

 JAP_hirohito_defeat_trait: "Імператор у поразці"
 JAP_hirohito_symbol_trait: "Символ Японії"
 JAP_hirohito_symbol_trait_desc: "§L«Нехай уся нація продовжує бути однією сім’єю з покоління в покоління, завжди непохитною у своїй вірі у незламність своєї священної землі, і пам’ятаючи про свій важкий тягар відповідальності та довгий шлях перед собою».§!"

 JAP_regent_trait: "Сессьо"
 JAP_regent_trait_desc: "§LПісля примусового зречення Хірохіто, Принц Такамацу був призначений діяти від імені Кронпринца Акіхіто до досягнення останнім повноліття.§!"
