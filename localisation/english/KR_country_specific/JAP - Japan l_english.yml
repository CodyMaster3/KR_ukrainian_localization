 JAP_unpopular_republic_idea_desc: "Відповідно до вимог [JAP.overlord.GetNameDef], у Японії було введено республіку, крок, який, як кажуть, є популярним удома, але зустрічає широке обурення та гнів у самій Японії. Новий уряд обтяжений незавидною задачею завоювання Японського населення, щоб не спіткала його та сама доля, як і багато подібних режимів після першої Світової війни."
