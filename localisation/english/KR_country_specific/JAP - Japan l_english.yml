### Bookmark ###
 JAP_KR_gathering_storm_desc: "Після послідовних принижень Версальського договору та Цінтаоської угоди не все було гаразд в Імперії висхідного сонця. Період економічних потрясінь завершився синдикалістським замахом на життя принца-регента Хірохіто у 1926 році, а рік кризи ознаменувався зміною нестабільних урядів - спочатку генерала Танаки, потім демократичного коаліційного кабінету - та інтервенцією у північно-східний Китай. Однак на світанку 1936 року Японія, здається, готова розширити свою імперію - оскільки домінування Німеччини, схоже, занепадає, японці жадібно дивляться на домінований Німеччиною Китай і німецькі володіння в Тихому океані..."

### Intro Screen ###
 JAP_country_intro_background: "GFX_JAP_intro"
 JAP_country_intro_header: "Відновлення після втраченого десятиліття"
 JAP_country_intro_content: "1920-ті роки, які стали відомі як \"Втрачене десятиліття\", були позначені економічною депресією та політичною нестабільністю в Японії. Особливо важким було становище в аграрному секторі, що спричинило масові демографічні зміни, оскільки фермери тікали з депресивної сільської місцевості до міст, заполонивши ринок праці та ще більше знизивши заробітну плату.\n\nПісля відходу з 'конституційної коаліції' Кенсейкай і з поста глави уряду, Інукаї та його кабінет успішно розширили японську сферу впливу до Маньчжурії та кордонів Сибіру, відкривши для японської економіки життєво важливий ринок експорту, при цьому ситуація в сільському господарстві продовжувала погіршуватися. Настав 1936 рік, триваюче переозброєння і державні інвестиції повністю перекроїли промислову економіку Японії, проте проблема сільської бідності все ще залишається невирішеною."

 JAP_guide: "§MМінсейто§! / §MСейюкай§! / §MСякай Тайшюто§! / §MКокумін Домей§! ($market_liberal_coloured$ / $social_conservative_coloured$ / $social_democrat_coloured$ / $authoritarian_democrat_coloured$)\n£white_dot Насильно провести Закон про національну безпеку.\n£white_dot Якщо §cСейюкай§! збереже свою більшість під час виборів 1936 року, Імператор завжди надаватиме їм підтримку, інакше ви маєте обрати «Він перегинає палицю!» ($He is out of Line!$), коли він відмовиться підтримати уряд.\n£white_dot Якщо §cСейюкай§! втратить більшість у парламенті, партії можуть тимчасово об'єднатися до наступних виборів під §aУрядом національної єдності§!, інакше відбудуться блискавичні вибори, на яких може перемогти §cСейюкай§! або §mМінсейто§!.\n£white_dot На майбутніх виборах ви також зможете обирати між обранням §aКокумін Домей§! або §SСякай Тайшюто§!.\n\n§MКьовакай§! ($paternal_autocrat_coloured$)\n£white_dot Якщо §cСейюкай§! втратить більшість під час виборів 1936 року, і Закон про національну безпеку буде проведено силою, військові можуть спробувати здійснити переворот.\n£white_dot Коли Імператор висловить свою думку щодо Закону про національну безпеку, оберіть виступити проти уряду, що спровокує військовий переворот, внаслідок якого владу захоплять §PЦентристи Імперської армії Японії§!.\n\n§MТайсей Йокусанкай§! ($national_populist_coloured$)\n£white_dot Якщо Закон про національну безпеку буде відхилено, військові здійснять переворот проти уряду та тимчасово захоплять владу як §PЦентристи Імперської армії Японії§!.\n£white_dot Незабаром після цього більш радикальні елементи армії здійснять контрпереворот, внаслідок якого владу захоплять §nРеставраціоністи Імперської армії Японії§!.\n\n"

### Events ###
 japan_domestic_events.2.t: "Розпуск парламенту"
 japan_domestic_events.2.d: "Чотирирічний термін обраного в 1932 році Імператорського парламенту поточного скликання добігає кінця. Прем'єр-міністр Інукаї Цуйосі оголосить про проведення загальних виборів щойно з'явиться така можливість."
 japan_domestic_events.2.a: "Дуже добре"

 japan_domestic_events.3.t: "Загальні вибори 1936 року"
 japan_domestic_events.3.d: "Після відновлення дії конституції 1926 року і подальшої політичної перебудови, домінантні позиції в японській політиці посіли дві партії: консервативна Ріккен Сейюкай (Партія друзів конституційного правління) і ліберальна Мінсейто (Конституційно-демократична партія).\n\nРіккен Сейюкай набрала абсолютну більшість на загальних виборах 1932 року, проте її підтримка в сільській місцевості (традиційній виборчій базі) продовжує знижуватися. Оскільки політична ситуація обернулася проти правлячої партії, Мінсейто, яка до 1927 року була відома як Кенсейкай (Асоціація конституційного уряду), зміцнила свою виборчу базу в усіх містах і почала розширюватися в село, сподіваючись позбавити Сейюкай абсолютної більшості в парламенті. Новим, третім гравцем на загальних виборах 1936 року є заснована соціал-демократами і синдикалістами 1933 року Сякай Тайсюто (Соціалістична масова партія).\n\nНастав час дізнатися, чи вдасться Сейюкай набрати достатню кількість місць для збереження своєї абсолютної більшості..."
 japan_domestic_events.3.a: "Сейюкай зберегла абсолютну більшість!"
 japan_domestic_events.3.b: "Сейюкай втратила абсолютну більшість!"

 japan_domestic_events.4.t: "Вбивство Катаями Сен"
 japan_domestic_events.4.d: "Народжений 1859 року, Катаяма Сен був одним із найстаріших лідерів японських синдикалістів і відомий як "батько японського синдикалізму". Після участі в ранньому соціал-демократичному русі, його вигнали до США, де він потрапив під вплив синдикаліста Джека Ріда, який перетворив організацію "Індустріальні робітники світу" на ОСА. Катаяма повернувся до Японії після відновлення дії конституції 1926 року і заснував першу узаконену в імперії синдикалістську партію, Рьодо-Номінто (Партію трудящих і селян). Після того, як 1932 року партію було оголошено поза законом, він сформував іншу, під назвою Сякай Тайсюто (Соціалістична масова партія), яка стала об'єднанням соціал-демократичних партій і синдикалістських рухів. Учора, під час відвідин Кіото, щоб привітати Ямамото Сенджі, члена Тайсюто, з його обранням на посаду голови партії, банда правих активістів штурмувала його офіс і побила чоловіків кийками. Ямамото вижив, але 75-річний Катаяма так і не приходив до тями і помер сьогодні вранці."
 japan_domestic_events.4.a: "Це погано..."

 japan_domestic_events.5.t: "Чвари серед японських лівих"
 japan_domestic_events.5.d: "Шок, що стався після вбивства Катаями Сен, спочатку об'єднав Сякай Тайсюто в боротьбі з "білим терором", але ця єдність довго не тривала. Спочатку партія являла собою коаліцію різних соціал-демократичних і синдикалістських організацій, які були об'єднані лише з метою "соціалізації економічної структури з пролетаріатом в її основі". До своєї смерті, Катаяма оберігав фракцію від внутрішніх ідеологічних суперечностей, але залишившись без свого лідера партія була змушена зіткнутися з питанням своєї чіткої ідеологічної позиції, що незабаром призвело до внутрішньопартійної боротьби.\n\nУпродовж усієї весни 1936 року, націонал-синдикалісти, представлені Нітірокей (Кліка японських робітників), перейнялися ідеями тоталізму та почали енергійно залучати нових членів до своїх лав не лише всередині партії за рахунок поміркованої Сеямінкеї (Соціал-демократична кліка), а й поза партією, особливо всередині Ніхон Рьодо Сьодомей (Японська федерація праці), що контролюється Сеямінкеєю. Незабаром між двома угрупованнями почалося відкрите протистояння. Нітірокей звинуватила Сьодомей у "створенні бюрократизму в середовищі робітників", а Сьодомей і Сямінкей звинуватили Нітірокей у захопленні влади і перетворенні трудових організацій на свої маріонетки. На початку цього місяця, членів Нітірокей вигнали як із Сьодомей, так і з Тайсюто, дозволивши націонал-синдикалістам діяти незалежно від інших лівих фракцій."
 japan_domestic_events.5.a: "Цікавий розвиток подій"

 japan_domestic_events.6.t: "Інцидент 15 травня"
 japan_domestic_events.6.d: "Прем'єр-міністра вбито! Пов'язані з Нітірокей радикально налаштовані офіцери увірвалися в офіційну резиденцію прем'єр-міністра Інукаї і розстріляли його. Вони стверджують, що зробили це в помсту за смерть Катаями Сен і вбивство робітників у Ніїгаті. Цей інцидент сильно потряс країну. Ображена інцидентом, Адміралтейська рада вже почала засідання трибуналу і ретельно розслідує діяльність радикалів у лавах імператорського флоту."
 japan_domestic_events.6.a: "Призначити Сузукі Кісабуро на місце Інукаї"

 japan_domestic_events.7.t: "Реставраціоністи та централісти"
 japan_domestic_events.7.d: "Фракція Ісінха є організацією радикально налаштованих молодших офіцерів, які бажають повернути імператору абсолютну владу. В їхню ідеологію входять антикапіталізм, антиолігархізм і антипарламентаризм. Багато хто з цих офіцерів походить із неблагополучних або бідних сімей, які з дитинства знайомі з голодом і відчувають відразу до того, що вони називають "злісним впливом фаворитизму". Життєві негаразди привели їх до ідеї того, що нинішній уряд відібрав владу в імператора і веде країну до занепаду. Як результат, розв'язання проблем вони вбачають у позбавленні від правлячих еліт і відновленні абсолютної влади імператора, що потім має призвести до початку проведення реформ, які мають змінити вигляд країни. Їм протистоїть фракція Тюусінха, що має зв'язки з центральним військовим керівництвом і підтримує співпрацю з нинішнім урядом, а також прагне мілітаризації."
 japan_domestic_events.7.a: "Це завдасть нам проблем..."

 japan_domestic_events.8.t: "Обговорення питання державної безпеки"
 japan_domestic_events.8.d: "Останні кілька місяців у парламенті зростала кількість порушуваних на засіданнях питань, зараз їхня кількість сягнула лякаючого значення. Багато парламентаріїв бояться за свої життя, і процес вирішення обговорюваних проблем більше не питання нарощування політичної влади або кар'єри, а виживання. Зростає кількість згодних із думкою про те, що поточних законів про безпеку недостатньо для захисту демократії, потрібно щось більше. У будь-якому разі, інцидент 15 травня не повинен повторитися."
 japan_domestic_events.8.a: "Нам необхідний всеосяжний закон!"

 japan_domestic_events.9.t: "Закон про національну безпеку"
 japan_domestic_events.9.d: "Сумнозвісний Закон про збереження миру запровадив режим Танакі на початку 1924 року, після повстання анархістів у Канто у вересні 1923 року та замаху синдикалістів на тоді ще спадкоємного принца Хірохіто в грудні того ж року. Закон різко обмежив громадянські права і став символом драконівського правління генерала Танакі. Коли режим був повалений конституційною реставрацією 1926 року, закон було скасовано, але зараз прем'єр-міністр Сузукі Кісабуро хоче повернути його, хоча і в більш поміркованій і перейменованій формі у вигляді Закону про національну безпеку. Він зустрів сильну опозицію навіть у своєму кабінеті, громадська думка опустилася до нового мінімуму. Сузукі все ж вважає, що повернення закону є необхідним кроком для протидії наростаючій хвилі синдикалізму, і він не самотній у цій думці. Очолювана Накадзімою Тікухей з Ріккен Сейюкай і Адаті Кензо з Мінсейто міжпартійна парламентська група оголосила цей закон "останнім оплотом конституційного уряду" і підтримує його. Крім того, Палата перів і Таємна рада також підтримують цей закон."
 japan_domestic_events.9.a: "Заради захисту нашої демократії, закон буде ухвалено через силу."
 japan_domestic_events.9.b: "Громадська думка та опозиція не дають закону бути ухваленим"

 japan_domestic_events.10.t: "Суд над учасниками інциденту 15 травня"
 japan_domestic_events.10.d: "Минулого місяця розпочався військово-польовий суд над одинадцятьма вбивцями прем'єр-міністра Інукаї. До закінчення судового процесу до суду надійшла петиція, що містить понад 350 000 підписів кров'ю від співчуваючих по всій країні, в якій підписанти благають пом'якшити вирок. На додаток до петиції, суд також отримав прохання від одинадцяти юнаків у Ніїгаті, щоб замість офіцерів стратили їх. Як жест щирості своїх намірів, кожен із них відправив разом із проханням свій відрубаний палець! Весь судовий розгляд не мав достатньої популярності в суспільстві, щоб переконати суд прискорити процес. Хоч смертні вироки і були оголошені ще вчора, вбивці були страчені сьогодні на світанку."
 japan_domestic_events.10.a: "Ця країна божеволіє..."

 japan_domestic_events.11.t: "Вбивство Сузукі Кісабуро"
 japan_domestic_events.11.d: "Знову сталося немислиме! Сьогодні вдень прем'єр-міністр Сузукі і його свояк Хатояма Ітіро були присутні на партійних зборах у Каваго. Коли Хатояма встав, щоб виступити з промовою, синдикаліст із "Молодіжного добровольчого корпусу національного порятунку Саїтами" застрелив Сузукі і Хатояму, щоб помститися за страту вбивць прем'єр-міністра Інукаї. Рана Сузукі виявилася смертельною."
 japan_domestic_events.11.a: "Спочивайте з миром"

 japan_domestic_events.12.t: "Уряд у люті"
 japan_domestic_events.12.d: "Не дивно, що відмова від ухвалення Закону про національну безпеку викликала негативну реакцію в бік прем'єр-міністра. Консерватори і бюрократи, які підтримали законопроєкт, почуваються обдуреними вчинком Сузукі. Палата перів і Таємна рада, розчаровані нездатністю уряду вжити якихось заходів проти синдикалізму, втратили всяке терпіння щодо кабінету міністрів."
 japan_domestic_events.12.a: "Дні Сузукі злічені..."

 japan_domestic_events.13.t: "Відставка Сузукі Кісабуро"
 japan_domestic_events.13.d: "Всіма знехтуваний і принижений прем'єр-міністр подав у відставку, коли пери висловили свій осуд кабінету міністрів, а також з теплотою і схваленням призначили колишнього міністра внутрішніх справ Мізуно Рентаро на його місце. У вельми похмурому розвитку подій, Таємна рада та її ультраконсервативний голова барон Хіранума оголосили про те, що "парламентська імпотенція" має бути замінена більш стабільною системою."
 japan_domestic_events.13.a: "Скличте екстрену нараду!"

 japan_domestic_events.14.t: "Обрання Мізуно Рентаро"
 japan_domestic_events.14.dead: "Смерть Сузукі приголомшила Ріккен Сейюкай, було скликано екстрену нараду. Бюрократична фракція Токонамі, названа на честь Токонамі Такеіро (1867-1935), голови Сейю Хонто - партії, що підтримувала Танаку під час та після його диктатури, була підкошена втратою свого лідера, залишивши всю владу над фракцією реакціонеру Накадзімі. Зі своєї нової посади в якості директора загальних справ, Накадзіма радий можливості ухвалювати будь-які рішення за всю партію, але при цьому він не став призначати себе головою і замість цього на цю посаду призначив нинішнього прем'єр-міністра Мізуно Рентаро."
 japan_domestic_events.14.notdead: "Відставка Сузукі приголомшила Ріккен Сейюкай, було скликано екстрену нараду. Бюрократична фракція Токонамі, названа на честь Токонамі Такеіро (1867-1935), голови Сейю Хонто - партії, що підтримувала Танаку під час та після його диктатури була підкошена втратою свого лідера, залишивши всю владу над фракцією реакціонеру Накадзімі. Зі своєї нової посади в якості директора загальних справ, Накадзіма радий можливості ухвалювати будь-які рішення за всю партію, але при цьому він не став призначати себе головою і замість цього на цю посаду призначив нинішнього прем'єр-міністра Мізуно Рентаро."
 japan_domestic_events.14.a: "Нарешті хоч якась стабільність у політиці"

 japan_domestic_events.15.t: "Найдовша зима Японії"
 japan_domestic_events.15.d: "Японський уряд виявився паралізованим. Відставка двох поспіль прем'єр-міністрів від Ріккен Сейюкаї серйозно послабила владу нового прем'єр-міністра, а відкриті заклики Хірануми знищити парламентську систему тільки погіршили політичну ситуацію. Екстремістські групи зростають з кожним днем, як і ступінь обурення військових кіл. Кілька високопоставлених офіцерів готували змову з метою повалення цивільної адміністрації та "порятунку" Імперії. Змовники підійшли до міністра сухопутних військ Хаясі Сендзюро з проханням підтримати їх..."
 japan_domestic_events.15.a: "Майбутнє Японії залежить від нього"

 japan_domestic_events.16.t: "Найдовший день Японії"
 japan_domestic_events.16.d: "Після десяти років політичної опали, армія знову взяла владу у свої руки. Цього разу, за допомогою перевороту. Ультраконсервативний політик барон Хіранума Кіітіро зараз є прем'єр-міністром, на всій території Великої Японської Імперії запроваджено воєнний стан."
 japan_domestic_events.16.a: "Banzai!"

 japan_domestic_events.17.t: "Невдала спроба перевороту"
 japan_domestic_events.17.d: "Навіть незважаючи на те, що міністр армії відмовився підтримати переворот, він не доклав жодних зусиль, щоб зупинити змову. Змовники сприйняли це як сигнал дозволу і почали діяти. Сьогодні вранці сили перевороту захопили Головне управління столичної поліції, резиденцію прем'єр-міністра і нову будівлю Імперського парламенту, але не змогли захопити Імператорський палац. На подив змовників, Імператор вчинив опір державному перевороту і віддав імператорський наказ придушити заколотників, вирішивши їхню долю. Сили перевороту здалися без опору, і ключові змовники були швидко спіймані, а деякі з них наклали на себе руки ще до того, як їх вдалося заарештувати."
 japan_domestic_events.17.a: "Демократія перемогла!"

 japan_domestic_events.18.t: "Боротьба за владу"
 japan_domestic_events.18.d: "Офіцери-реставраціоністи були головними учасниками перевороту, який повалив обраний уряд. Змовники розглядали парламентську систему як інститут плутократичної та капіталістичної влади, проте в перехідному уряді централісти зайняли ключові місця, залишивши реставраціоністів без роботи. Керівництво останніх дійшло висновку, що їх обдурили. Почалася нова боротьба за владу."
 japan_domestic_events.18.a: "Це колись закінчиться?"

 japan_domestic_events.19.t: "Контр-переворот фракції Ісінха"
 japan_domestic_events.19.d: "Сьогодні молодші офіцери-реставраціоністи організували новий державний переворот у районі Токіо! Рано вранці 1400 офіцерів і рядових військовослужбовців розпочали захоплення контролю над основними вузлами зв'язку та адміністративними об'єктами. Міністерство оборони, офіс геншатабу, штаб-квартира столичної поліції, офіційна резиденція прем'єр-міністра і будівля парламенту - всі вони були швидко захоплені, а імператорський палац потрапив в облогу. Опівдні сам імператор звернувся до солдатів і оголосив про свою офіційну підтримку путчу."
 japan_domestic_events.19.a: "Переворот відбувся!"

 japan_domestic_events.20.t: "Реставраціоністи намагаються влаштувати переворот!"
 japan_domestic_events.20.d: "Сьогодні молодші офіцери-реставраціоністи організували новий державний переворот у районі Токіо! Рано вранці 1400 офіцерів і рядових військовослужбовців розпочали захоплення контролю над основними вузлами зв'язку та адміністративними об'єктами. Міністерство оборони, офіс геншатабу, штаб-квартира столичної поліції, офіційна резиденція прем'єр-міністра і будівля парламенту - всі вони були швидко захоплені, а імператорський палац потрапив в облогу. Після того як імператор відкрито засудив путчистів, флот мобілізував дивізії морської піхоти для евакуації палацу, а надвечір сили змовників були розтрощені."
 japan_domestic_events.20.a: "Боже, бережи імператорський флот!"

 japan_domestic_events.21.t: "Перемога централістів!"
 japan_domestic_events.21.d: "Переворот реставраціоністів провалився, їх затаврували зрадниками і шукають по всій країні. Деякі закликають передати збройним силам провідну роль в уряді з метою допомогти викорінити як зрадників, так і синдикалістів."
 japan_domestic_events.21.a: "Міністр армії Хаясі прийме прем'єрство."
 japan_domestic_events.21.b: "Зараз в цьому немає потреби"

 japan_domestic_events.22.t: "Уряд національної єдності"
 japan_domestic_events.22.d: "Накадзіма Тікухеі з Ріккен Сейюкай і Адаті Кензо з Мінсейто, підтримуючи Закон про національну безпеку, опублікували спільну заяву, в якій закликали обидві основні партії сформувати багатопартійний "уряд національної єдності" для захисту Кокутай (національної держави) від синдикалістської загрози."
 japan_domestic_events.22.a: "Нам потрібен сильний уряд"
 japan_domestic_events.22.b: "Ми не потребуємо цієї нісенітниці, нам потрібні вибори!"

 japan_domestic_events.23.t: "Про основні засади національної оборони"
 japan_domestic_events.23.d: "Після взяття влади, централісти шукали політичний план для свого нового режиму. Вони представили проєкт під назвою "Про основні засади національної оборони" і поширили його серед централістського керівництва. Представляючи "просунуту державу національної оборони" (Кодо Кокубо Кокка), у документі пропонується об'єднати державу і підготувати її до тотальної війни. Щоб домогтися цього, необхідно не тільки реорганізувати економічну структуру Японії і поставити її на військові рейки, а й "ідеологічно просвітити" японський народ, допомогти йому відкинути корисливість і особисті інтереси. Японці повинні відмовитися від класової боротьби, що завдає шкоди національній безпеці, і реструктурувати суспільство разом з економікою."
 japan_domestic_events.23.a: "Саме цим шляхом ми й маємо йти"

 japan_domestic_events.24.t: "Про засадничі принципи національної структури"
 japan_domestic_events.24.d: ""Про засадничі принципи національної структури" - це 156-сторінковий памфлет, підготовлений міністерством освіти для створення офіційного опису "Кокутай", або національної структури (слово також можна перекласти як "національна сутність", "національна держава" тощо). Памфлет, згідно з легендою про богиню Аматерасу, офіційно закріплює статус імператора як живого бога, а також "безперервну лінію імператорів" (Бансеііккей). Щоб служити божественному імператору, його піддані повинні відкинути своє "Я" заради соціальної гармонії (Ва) і процвітання японської культури. Певною мірою памфлет є відповіддю на критику централістського "нео-сьогунізму"."
 japan_domestic_events.24.a: "Саме цим шляхом ми й маємо йти"

 japan_domestic_events.25.t: "Рух нової держави"
 japan_domestic_events.25.d: "З метою мобілізації підтримки режиму і його програми реформ було організовано "Рух нової держави" (Сінтайсей Ундо). Очолюваний принцом Коное Фумімаро, рух спрямований на створення політичного інституту, здатного об'єднати і зв'язати людей в органічне ядро нації, що, по суті, представляє собою японський корпоратизм, на чолі якого перебуває імператор. Найближчою метою руху є об'єднання всіх політичних течій в одну партію - Асоціацію допомоги трону (Тайсей Екусанкай)."
 japan_domestic_events.25.a: "Саме цим шляхом ми й маємо йти"

 japan_domestic_events.26.t: "Перший з'їзд Тайсей Йокусанкай"
 japan_domestic_events.26.d: "Тайсей Йокусанкай, або Асоціація допомоги трону, структурована як новий основний політичний інститут, який, на відміну від старого "плутократичного" парламенту, представлятиме кожен аспект японського суспільства. Асоціація впливатиме на кожен адміністративний рівень, від села до префектури, і створить центральну керівну групу, яка складатиметься з найталановитіших людей з усіх соціальних кіл - академічних, культурних, економічних, урядових, військових, політичних тощо. У теорії, створення прямого зв'язку між політикою і народом, і завдяки тому, що кожна важлива група матиме представників у центральному органі влади, дасть змогу формувати та ефективно координувати національну політику. На жаль, це бачення державного устрою вже приречене, оскільки різноманітні рухи Тайсей Йокусанкай, які за задумом мали б об'єднатися і співпрацювати між собою, вже почали боротьбу за владу.\n\nНа з'їзді з'явилися три основні угруповання. Провідним угрупованням є очолювана принцом Коное Какусінха (фракція реформістів), що складається з інтелігентів і політиків, які бажають проведення реформ. Другим угрупованням є Кодоха (фракція імперського шляху), названа на честь часто використовуваного генералом Аракі слова "Кодо", або "Імперський шлях", і складається з офіцерів-реставраціоністів. Третім угрупованням є Йокусейха, яке в основному складається з колишніх парламентських політиків, які раніше співчували справі реставраціоністів. Назва "Йокусейха" походить від абревіатури політичної асоціації прихильників реставраціоністів Йокусан Сейдзікай (Асоціація політичної допомоги трону).\n\nОстанні два угруповання заперечують проти порядку денного Какусінха і навіть сумніваються в істинності цілей Тайсей Йокусанкай. Коное розробив останню як центральну нервову систему майбутньої "нової держави", в якій об'єднані законодавча, виконавча та адміністративна влади. Принц запевнив, що стара конституція Мейдзі залишиться без змін, а Тайсей Йокусанкай не замінить парламенту, однак сама ідея формування політичного моноліту зустріла потужну опозицію."
 japan_domestic_events.26.a: "Саме цим шляхом ми й маємо йти"

 japan_domestic_events.27.t: "Коное Фумімаро заручається підтримкою"
 japan_domestic_events.27.d: "Після п'ятнадцятиденного з'їзду, принц Коное успішно просунув свій порядок денний і заручився підтримкою в Тайсей Йокусанкай."
 japan_domestic_events.27.a: "Саме цим шляхом ми й маємо йти"

 japan_domestic_events.31.t: "Загальні вибори"
 japan_domestic_events.31.d: "Демократичний режим пережив доленосну зиму, виборча реформа нарешті була проведена. Однак, у зв'язку з невдачами уряду національної єдності, поточному уряду не вистачає влади і підтримки для того, щоб ефективно управляти державою. При всьому при цьому, рішення проблеми очевидне: довіритися виборчим реформам і продемонструвати це народу. Таким чином, уряд проведе вибори для підтвердження свого виборчого мандата і поверне собі політичну ініціативу!"
 japan_domestic_events.31.a: "Обрати Ріккен Сейюкай (консерватори)"
 japan_domestic_events.31.b: "Обрати Мінсейто (ліберали)"
 japan_domestic_events.31.c: "Зберегти правлячу коаліцію"

 japan_domestic_events.32.t: "Розкол у партії"
 japan_domestic_events.32.d: "Під час з'їзду Ріккен Сейюкай 1936 року Накадзіма вважав, що його провідна роль ненадійна, і тому уклав угоди про розподіл влади з іншими фракціями. Одна з таких угод полягала в тому, що пост Генерального секретаря, який має широку владу, залишиться вакантним (але не скасованим), а його завдання будуть передані колективному керівництву Генеральної ради.\n\nМинулого місяця, вважаючи, що він зміцнив свою позицію, Накадзіма спробував остаточно закріпити свою домінуючу позицію, захопивши офіс Генерального секретаря. З цією метою він офіційно порекомендував Генеральній раді повернути на цю посаду колишнього генерального секретаря Кухару Фусаносуке, колишній генеральний секретар Кухару Фусаносуке, який співчував реформістам, і 28 квітня Накадзіма зі своєю клікою сформував "Какусін Домей" ("Альянс реформістів"), яка фактично є партією всередині партії, яка ще більше тисне на Генеральну раду. Після того, як загальні вибори добігли кінця, 14 травня про-Накадзимський голова Генеральної ради Хорікірікі Зенбе запропонував провести в раді держоловання з цього питання, але на цю пропозицію було накладено вето всіма іншими фракціями. Реформісти спробували подолати ситуацію, що склалася, і закликали раду мобілізувати свої місцеві партійні кадри, але цю пропозицію знову відкинули всі інші лідери, які не належать до реформістів, що ще більше засмутило Накадзіму. Сьогодні, всього через місяць після виборів, Какусін Домей офіційно оголосила про свою незалежність від Ріккен Сейюкай."
 japan_domestic_events.32.a: "Настав час обрати наш власний шлях"

 japan_domestic_events.33.t: "Формування Кокумін Домей"
 japan_domestic_events.33.d: "Після того як Адаті Кензо і його кліка пішли з Мінсейто і сформували незалежну Какусін Домей, Накадзіма реорганізував партію і перейменував її в Кокумін Домей (Національний альянс)."
 japan_domestic_events.33.a: "Настав час обрати наш власний шлях"

 japan_domestic_events.34.t: "Уряд національної єдності розпадається"
 japan_domestic_events.34.d: "Хоча від самого початку уряд було створено для того, щоб дати парламентській політиці сильне обличчя, яке можна було б представити як армії, так і народу, від самого початку було зрозуміло, що головними бенефіціарами уряду Національної Єдності стануть опозиційні фракції Адачі та Накадзіма в Мінсейто і Сейюкай відповідно. За останні роки напруженість усередині двох партій неухильно досягала межі. Коаліція розпалася, Адачі і Кухара залишили свої партії і сформували новий Національний альянс (Kokumin Dōmei), а консервативні фракції Мінсейто і Сейюкай відновили контроль."
 japan_domestic_events.34.a: "Настав час знайти свій власний шлях"

 japan_domestic_events.45.t: "Інцидент із Народним фронтом"
 japan_domestic_events.45.d: "Сьогодні 446 лівих академіків, інтелектуалів і політиків (включно з двома чинними членами парламенту) заарештували, їм висунули звинувачення відповідно до порушення Закону про національну безпеку. Усіх їх звинуватили в організації "Народного фронту" і погрозах Кокутай."
 japan_domestic_events.45.a: "Ситуацію розв'язано, вірно?"

 japan_domestic_events.46.t: "Другий інцидент із Народним фронтом"
 japan_domestic_events.46.d: "Сьогодні були проведені додаткові арешти інтелектуалів, коли 38 лівих професорів були заарештовані за звинуваченням в організації "народного фронту"."
 japan_domestic_events.46.a: "Та скільки ж тут цих червоних?!"

 japan_domestic_events.47.t: "Інцидент із групою робітників у Кейхіні"
 japan_domestic_events.47.d: "Було виявлено й заарештовано підпільне синдикалістське угруповання, що діяло в районі Кейхін (Токіо-Іокогама)."
 japan_domestic_events.47.a: "Все добре, вірно?"

 japan_domestic_events.48.t: "Інцидент із радою з планування"
 japan_domestic_events.48.d: "Сьогодні було заарештовано сімнадцятьох членів Міністерської ради з планування, їм висунуто звинувачення в організації "народного фронту" всередині уряду."
 japan_domestic_events.48.a: "Ситуація виходить з під контролю!"

 japan_domestic_events.49.t: "Інцидент із Науково-дослідним бюро"
 japan_domestic_events.49.d: "Двадцять дев'ять бюрократів із Науково-дослідного бюро (Тьосабу) Південно-Маньчжурської залізниці заарештували, сьогодні їм висунули звинувачення в організації підпільного синдикалістського руху всередині Південно-Маньчжурської залізниці.."
 japan_domestic_events.49.a: "Ситуація виходить з під контролю!"

 japan_domestic_events.50.t: "Інцидент в Йокогамі"
 japan_domestic_events.50.d: "Шістдесят письменників і журналістів заарештовано за звинуваченням у спробі сформувати підпільну синдикалістську партію. Однак з'ясувалося, що більшість їхніх зізнань було отримано під тортурами."
 japan_domestic_events.50.a: "Стає тільки гірше!"

 japan_domestic_events.51.t: "Офіцери Токко звинувачуються в тортурах"
 japan_domestic_events.51.d: "Токко, або "Особлива вища поліція" - це поліцейський відділ, що спеціалізується на думкозлочинах. Токко також сумно відоме через свої образливі та жорстокі методи допиту, які часом навіть призводять до смерті. Коли було ухвалено Закон про національну безпеку, Токко швидко розширило свій штат і повноваження, їхнє ставлення до безпеки обвинувачених знизилося ще більше. Сьогодні одна велика газета повідомила, що людина померла під час утримання під вартою і звинуватила Токко в тому, що співробітники відділу мучили жертву до смерті."
 japan_domestic_events.51.a: "О ні..."

 japan_domestic_events.53.t: "Велика посуха 1939 року"
 japan_domestic_events.53.d: "Країна перебуває в кульмінаційній стадії найгіршої посухи, яку вона тільки спостерігала в цьому столітті. Води на все не вистачає, сільськогосподарські культури вмирають від спраги. У деяких регіонах місцеві чиновники організовують ритуали заклику дощу у відчайдушній спробі викликати бурі та заспокоїти людей, але все безуспішно. На щастя, посуха здебільшого зачіпає тільки південну Корею, західний Хонсю і південні острови, і хоча врожай рису значно знизився, нам все ж вдалося уникнути голоду на цих територіях. Однак порушення продовольчого виробництва внаслідок посухи є досить серйозною проблемою, щоб змусити нас закрити кілька рисових бірж, зокрема знамениту біржу Додзіма, і контролювати поставки рису напряму, принаймні до певного часу."
 japan_domestic_events.53.a: "Принаймні, ніхто не голодує..."

 japan_domestic_events.54.t: "Загальні вибори 1940 року"
 japan_domestic_events.54.d: "Настав час для нових загальних виборів. З огляду на те, що всі основні та опозиційні партії беруть у них участь, вибір більш різноманітний, ніж наприкінці XIX століття. Після підбиття підсумків виборів, Його Величність Імператор попросить нового прем'єр-міністра сформувати свій кабінет."
 japan_domestic_events.54.a: "Обрати Ріккен Сейюкай (консерватори)"
 japan_domestic_events.54.b: "Обрати Мінсейто (ліберали)"
 japan_domestic_events.54.c: "Обрати Кокумін Домей (націоналісти)"
 japan_domestic_events.54.e: "Обрати Сякай Тайсюто (соціалісти)"

 japan_domestic_events.55.t: "Загальні вибори 1944 року"

 japan_domestic_events.58.t: "Хаясі Сенджуро мертвий!"
 japan_domestic_events.58.d.pataut: "Настав сумний день - прем'єр-міністр Хаясі Сенджуро помер у своєму будинку. Людина, яка грала як із централістською, так і з реставраторською фракціями, щоб стати лідером нового воєнного режиму, його прем'єрство призвело до великих змін у всіх аспектах японського життя, без сумніву, закріпивши його як одну з найвпливовіших - і, можливо, найсумнішим чином відомих - постатей у сучасній історії нашої країни.\n\nЄдиний реальний вибір наступника Хаясі, генерал Нагата Тецудзан, здається, підтверджує шлях, яким іде Японія. Відомий як головний теоретик централістської фракції армії, Нагата з 30-х років працював за лаштунками, щоб заручитися підтримкою бізнесменів і політиків для перетворення Японії на державу національної оборони, про яку мріють прихильники тотальної війни. Схоже, що армійський режим тут і залишиться."
 japan_domestic_events.58.d.defaul: "Настав сумний день - відставного генерала Хаясі Сенджуро знайшли померлим у своєму будинку. Людина, яка грала як на боці централістів, так і на боці реставраторів упродовж усієї своєї зрештою невдалої політичної кар'єри, її зв'язок з армійськими радикалами часом непокоїв багатьох, але в кінцевому підсумку все це, схоже, виявилося дрібницею."
 japan_domestic_events.58.a: "Призначити Нагату Тецузан"
 japan_domestic_events.58.b: "Призначити Барона Хірануму."
 japan_domestic_events.58.c: "Спочивайте з миром"

 japan_domestic_events.60.t: "Посуха бере своє"
 japan_domestic_events.60.d: "Попри те, що сільські райони країни і без того зазнають поневірянь після втраченого десятиліття, посуха посприяла подальшому зубожінню селян і банкрутству багатьох сільськогосподарських компаній. Найімовірніше, наслідки посухи найближчим часом нікуди не подінуться."
 japan_domestic_events.60.a: "Нічого не вдієш"

 japan_domestic_events.61.t: "Фентяно-Корейсько-Японська домовленість"
 japan_domestic_events.61.d_pervasive: "Вивчивши характер тривалої посухи, міністерства Японії дійшли висновку, що можна зробити трохи більше для запобігання наслідкам посухи, окрім тих заходів, які вже було вжито. Однак міністерство у справах колоній висунуло пропозицію, в якій Фентянь міг би бути примушений до експорту пшона і рису до Кореї, а Корея, своєю чергою, надасть свій рис Японії. Більша частина Маньчжурії впоралася з посухою, хоч її жителям і доведеться на деякий час трохи урізати свій раціон, нашого політичного та економічного впливу над Фентянем має бути достатньо для запобігання будь-якому інакомисленню."
 japan_domestic_events.61.d_normal: "Вивчивши характер тривалої посухи, міністерства Японії дійшли висновку, що можна зробити трохи більше для запобігання наслідкам посухи, окрім тих заходів, які вже було вжито. Однак міністерство у справах колоній висунуло пропозицію, в якій Фентянь міг би бути примушений до експорту пшона і рису до Кореї, а Корея, своєю чергою, надасть свій рис Японії. Більша частина Маньчжурії впоралася з посухою, хоч її жителям і доведеться на деякий час трохи урізати свій раціон, уряд Фентьяня, безумовно, буде готовий у скрутну хвилину надати допомогу своєму покровителю."
 japan_domestic_events.61.a: "У них не буде вибору"
 japan_domestic_events.61.b: "Надіслати запит"
 japan_domestic_events.61.c: "Ми вистоїмо"

 japan_domestic_events.62.t: "Фентянь відмовляється від нашої пропозиції"
 japan_domestic_events.62.t.cutoff: "Фентянь відмовляється нам допомогти"
 japan_domestic_events.62.d: "У своєму акті безпрецедентного нахабства, уряд Фентяня відмовився від нашої пропозиції щодо пом'якшення наслідків посухи. Зрозуміло, цей акт грубої і неприйнятної неповаги повинен зіткнутися з нашою нещадною відплатою!"
 japan_domestic_events.62.d.cutoff: "У своєму акті безпрецедентного нахабства, уряд Фентяня вирішив припинити постачання продовольства і нам знову доведеться самотужки боротися з посухою. Зрозуміло, цей акт грубої і неприйнятної неповаги повинен зіткнутися з нашою нещадною відплатою!"
 japan_domestic_events.62.a: "Покарати їх за нахабство!"
 japan_domestic_events.62.b: "Нічого не вдієш"

 japan_domestic_events.63.t: "Закінчення посухи"
 japan_domestic_events.63.d: "Після багатьох місяців страждань, посуха остаточно закінчилася і країна почала відновлюватися."
 japan_domestic_events.63.a: "Нарешті!"

 japan_domestic_events.64.t: "Фентянь погоджується надавати продукти харчування"
 japan_domestic_events.64.d: "Фентянський уряд погодився надати продовольство, основні негативні наслідки посухи мають скоро зникнути."
 japan_domestic_events.64.a: "Гарні новини!"

 japan_domestic_events.65.t: "Імператор та демократія"
 japan_domestic_events.65.d: "Уряд визнав свою слабкість і тому в розпачі попросив імператора про втручання в ситуацію. Він прийшов до парламенту при повному параді і, на щастя, підтримав уряд. Його слова мають велику вагу і їх може бути достатньо, щоб тримати уряд на плаву. Чи згодні ми з його підтримкою?"
 japan_domestic_events.65.a: "Погодитися з імператором"

 japan_domestic_events.72.t: "Імператор та демократія"
 japan_domestic_events.72.d: "Уряд визнав свою слабкість і тому в розпачі попросив імператора про втручання в ситуацію. Він прийшов до парламенту при повному параді, але відмовився підтримати уряд. Його слова мають велику вагу і брак підтримки з його боку може стати смертельним ударом для уряду. Без стороннього втручання на уряд безсумнівно чекає провал. Чи згодні ми з позицією імператора?"
 japan_domestic_events.72.a: "Погодитися з імператором"
 japan_domestic_events.72.b: "Він збожеволів!"

 japan_domestic_events.74.t: "Заміна залізничної колії"
 japan_domestic_events.74.d: "Знадобилися величезні зусилля, але, нарешті, заміна колії вже в процесі і як ніколи близька до завершення. Найгірший час позаду, ми вже починаємо бачити як негативні наслідки наших старих, вузьких рейкових шляхів починають зникати."
 japan_domestic_events.74.a: "Слава!"

 japan_domestic_events.75.t: "Земельна реформа завершена"
 japan_domestic_events.75.bad: "Земельна реформа завжди була нагальною проблемою Японії і ми не були першим урядом, який намагався вирішити цю проблему. На жаль, останніми в черзі ми теж не будемо. Наші зусилля були марною тратою часу, ми домоглися нічого іншого як повної катастрофи! Нам не вдалося навіть трохи вплинути на проблему, яка, безумовно, продовжить отруювати нашу економіку в найближчі роки..."
 japan_domestic_events.75.okay: "Земельна реформа завжди була нагальною проблемою Японії і ми не були першим урядом, який спробував вирішити цю проблему. Нехай нам і не вдалося вирішити її повністю, але ми хоча б змогли послабити її негативний вплив на нашу економіку."
 japan_domestic_events.75.good: "Земельна реформа завжди була нагальною проблемою Японії і ми не були першим урядом, який спробував її вирішити, але там, де інші зазнали невдачі, ми досягли успіху! Нам вдалося виправити безліч прихованих проблем, однак на цьому ми не зупинилися; ми викупили і перерозподілили десятки тисяч гектарів землі селянам, які цього потребують. Наші старання вже почали приносити вигоду!"
 japan_domestic_events.75.great: "Це диво! Земельна реформа завжди була нагальною проблемою Японії і ми не були першим урядом, який спробував її розв'язати, але там, де багато хто зазнав невдачі, ми змогли зробити те, що вважалося неможливим! Нам вдалося провести те, що по всьому світу почали називати не інакше як "найбільшою в історії програмою з перерозподілу землі". Під час реформи, фемерам було передано 2,3 мільйона гектарів землі. Система приватного землеволодіння, яку раніше знала Японія, більше не існує."
 japan_domestic_events.75.a: "Як ми могли допустити таке..."
 japan_domestic_events.75.b: "Непогано!"
 japan_domestic_events.75.c: "Банзай!"
 japan_domestic_events.75.d: "Банзай, банзай, банзай!"

 japan_domestic_events.76.t: "Створення бюджетного та дослідницького органу"
 japan_domestic_events.76.d: "Прем'єр-міністр [GetSecondInCommand], разом з іншими армійськими чиновниками, запропонував новий орган, який займатиметься бюджетом та проводитиме політичні дослідження і підпорядковуватиметься безпосередньо офісу Прем'єр-міністра. Начебто метою цього є підготовка необхідних коштів та проведення політик, які є сприятливими для довгострокових планів Армії.\n\nПроте Парламент висловив велике несхвалення цій пропозиції, оскільки створення такого органу перевищило б повноваження багатьох окремих міністерств. Певний компроміс не виключений — питання лише в тому, якою мірою ми маємо реалізувати цей план."
 japan_domestic_events.76.a: "Запевнити Парламент у наших планах."
 japan_domestic_events.76.b: "Це має бути зроблено незалежно від ціни."

 japan_domestic_events.77.t: "Неефективні міністерства"
 japan_domestic_events.77.d: "Керівництво армії внесло до Парламенту пропозицію про злиття кількох міністерств, нібито для усунення неефективності та сприяння централізації. Зокрема, вони пропонують об'єднати Міністерство розвитку з Міністерством закордонних справ та Міністерство сільського господарства та лісівництва з Міністерством торгівлі та промисловості.\n\nПарламент досить скептично ставиться до таких пропозицій, додаючи, що це призведе до ліквідації багатьох посад — те, що, за їхніми словами, лише посилить вплив Армії на політику, навіть більший, ніж зараз."
 japan_domestic_events.77.a: "Запевнити Парламент, що ніхто не втратить свої посади."
 japan_domestic_events.77.b: "Це має бути зроблено незалежно від ціни."

 japan_domestic_events.78.t: "Деталі п'ятирічного плану"
 japan_domestic_events.78.d: "Серед багатьох планів військових щодо трансформації нації, створення П'ятирічних Планів, безперечно, буде одним із найбільш суперечливих. Багато чиновників, включаючи Міністра Армії Тераучі Хісаїчі, висунули ці плани для спрямування Імперії на війну, що передало б кілька галузей промисловості під державну власність та забезпечило б Японську безпеку на суші та на морі.\n\nОднак малоймовірно, що Парламент або Дзайбацу схвалять такі широкі пропозиції. Завдяки певному компромісу ми можемо просунути їх — але альтернативно, загроза насильства для їхнього просування також є варіантом."
 japan_domestic_events.78.a: "Давайте розробимо план разом із Парламентом та Дзайбацу."
 japan_domestic_events.78.b: "Використати погрози та хабарі, щоб просунути наші плани."

 japan_domestic_events.79.t: "Обмеження дзайбацу"
 japan_domestic_events.79.d: "Дзайбацу, найбільші промислові конгломерати в Японії, потрапили під обстріл з боку членів нашої коаліції, особливо з фракції Кодоха. Вони стверджують, що дзайбацу активно беруть участь у занепаді Японії: корумповані, непотичні, вони представляють найгірші надмірності капіталізму, отримуючи всі прибутки, тоді як сільські Японські сім'ї, сама душа нашої нації, повністю залишаються позаду.\n\nЦе правда, що дзайбацу пережили вражаюче зростання за останні десятиліття, і наші інвестиції в Маньчжурії лише посилюють їхній вплив на економіку Японії. Щоб виправити це, дехто в нашій коаліції та у військових рішуче запропонував нам націоналізувати їхні активи та виробництво, з кінцевою метою повного усунення їхнього впливу. Інші також натякнули на ідею високого податку на спадщину, що, безумовно, допомогло б відірвати конгломерати від їхньої сімейної структури.\n\nОднак, деякі голоси висловили занепокоєння цими ідеями, головним чином ті, хто в Сьова Додзінкай, які стверджували, що дзайбацу є патріотичними компаніями, і що перешкоджання їхньому бізнесу матиме катастрофічні наслідки у довгостроковій перспективі. У відповідь, члени Кодоха швидко вказали на зв'язки провідної фігури Додзінкай Фусаносуке Кухара з Ніссан, заснованим його швагром, використовуючи його активи.\n\nХоча багато хто в уряді амбівалентно ставиться до дзайбацу, зрештою було вирішено, що ми повинні обмежити їхній вплив, але якою мірою, залишається питанням."
 japan_domestic_events.79.a: "Їхня корупція має припинитися, розпочати націоналізацію їхніх активів."
 japan_domestic_events.79.b: "Це занадто безрозсудно, дещо пом'якшити наші плани."

 japan_domestic_events.90.t: "Очищення нашої адміністрації"
 japan_domestic_events.90.d: "Незважаючи на всі труднощі, схоже, що демократія в Японії пережила наслідки Інциденту 15 травня, попри величезні потрясіння, які він спричинив у минулі місяці. Тим не менш, замість того, щоб хвалити стабільність наших інститутів, багато хто спантеличений тим, як щось подібне взагалі могло статися: соціалістичний терор, кульмінацією якого стали успішні екстремістські напади на Прем'єр-міністра, причому двічі за рік. \n\nЯк наслідок, серед значної частини політичного істеблішменту почала поширюватися параноя, і атмосфера напружена. Як можливо, що ці фанатики націлилися на голову нашого уряду кілька разів, і досягли успіху? Ширяться чутки, що вся наша адміністрація захоплена соціалістичними симпатиками, які надають інформацію шпигунам Інтернаціоналу та синдикалістським агітаторам. Зокрема, Сякай Тайшюто, зі своєю популістською платформою та закликами до відволікання коштів від військових, потрапили під критику як такі, що занадто симпатизують тим, хто ледь не вкинув нашу націю в анархію. Незалежно від того, чи правдиві ці звинувачення, стало зрозуміло, що ситуація все ще крихка, і подальше ігнорування цих попереджувальних знаків може означати катастрофу.\n\nПроте є й світлий бік. Нещодавно прийнятий Закон про національну безпеку надає уряду широкі повноваження щодо боротьби з радикалами. Дійсно, Акт дозволяє нам усунути будь-яких нижчих бюрократів, підозрюваних у зацікавленості революційними ідеями, судячи їх як підривників, що намагаються змінити Національну Сутність Японії зсередини. Після визнання винними ми могли б або суворо засудити їх, щоб відрадити будь-кого від небезпечних ідей, або передати їх Токко (Спеціальній Вищій Поліції), щоб показати їм помилковість їхніх шляхів через *тенко* — процес, за допомогою якого Токко змушує винну сторону відмовитися від своєї шкідливої ідеології, використовуючи будь-які засоби, які вважатиме за потрібне. Зрештою, багато державних службовців та політиків є дуже компетентними, і можуть продовжити добре служити нам, якщо їх достатньо переконати."
 japan_domestic_events.90.a: "Придушити найгірших із них та примусити тих, хто може визнати свої помилки."
 japan_domestic_events.90.b: "Ми не можемо ризикувати, необхідна ретельна чистка будь-яких підозрілих елементів."

 japan_domestic_events.239.t: "Загальні вибори [GetYear]"
 japan_domestic_events.239.d: "Настав час для нових загальних виборів. Оскільки балотуються головні та опозиційні партії, вибір більш різноманітний, ніж був з кінця 19 століття."
 japan_domestic_events.239.a: "Міншуто (Консерватори)"
 japan_domestic_events.239.b: "Дзіюто (Ліберали)"
 japan_domestic_events.239.c: "Сякайто (Соціалісти)"

 japan_domestic_events.240.t: "Доля Імператора"
 japan_domestic_events.240.d: "З завершенням формування останніх гілок нової урядової системи, необхідно обговорити майбутнє Японського Трону. Хоча Хірохіто, безсумнівно, несе відповідальність за ведення війни проти нас, справжня справедливість, ймовірно, залишить його мертвим або ув'язненим довічно, а нам принесе неможливу проблему громадського порядку. Проте багато хто з нашого народу все ще виступає за повне скасування Імператорського інституту, звинувачуючи їх у житті, втрачених під час дорогого вторгнення на їхні рідні острови, і це задовольнило б їхню жагу помсти. Наші дипломати та навіть більшість генералів, з іншого боку, радили цього не робити, пропонуючи натомість або дозволити королівським особам продовжувати існувати у символічному статусі, або принаймні лише змусити Хірохіто зректися, щоб уникнути потенційно постійного повстання проти наших колабораціоністів."
 japan_domestic_events.240.a: "Залишити його на троні, але передати суверенітет народу."
 japan_domestic_events.240.b: "Примусити його зректися."
 japan_domestic_events.240.c: "Весь Імператорський інститут має бути скасований."

 japan_domestic_events.241.t: "Доля імператорської родини"
 japan_domestic_events.241.d: "Із завершенням створення останніх гілок нової урядової системи необхідно обговорити майбутнє японської імператорської сім'ї. Хоча багато членів імператорської сім'ї, безсумнівно, відповідальні за розв'язання війни проти нас, істинне правосуддя, найімовірніше, залишить кількох із них мертвими або довічно ув'язненими, а нас - із непосильною проблемою громадського порядку на руках. Наші дипломати і навіть більшість генералів наполягають на тому, що натомість ми повинні використовувати м'якші заходи. Ми не можемо залишити монархію недоторканою, але деякі варіанти все ж можуть бути."
 japan_domestic_events.241.a: "Просто позбавте їх влади, вистачить із нас аристократії"
 japan_domestic_events.241.b: "Вигнати їх з Японії"

 japan_domestic_events.242.t: "Чорний Понеділок дістався до наших берегів"
 japan_domestic_events.242.d: "Зрештою, як і очікувалося, викликаний економічним колапсом німецької економіки, принцип доміно досяг нашої імперії. Через нашу вельми сильну ізольованість від німецького ринку, ефект економічного занепаду не вплинув на нас так сильно, як на сусідні по відношенню до нас країни, але, тим не менш, Чорному понеділку вдалося зачепити нашу економіку. Дзайбацу і нашим банкам кілька наступних місяців доведеться несолодко."
 japan_domestic_events.242.a: "Це було очікувано"

 japan_domestic_events.400.t: "Королівська дитина"
 japan_domestic_events.400.d: "Сьогодні вранці Імператорський Двір оголосив чудову новину: Імператриця Нагако народила ще одну дочку після надзвичайно короткого періоду пологів. Незважаючи на побоювання всередині самого Двору, з огляду на вік Імператриці та те, що це її сьома дитина, і мати, і її дитина, як повідомляється, перебувають у доброму здоров'ї без серйозних ускладнень. Більша частина Імператорської Родини вже була представлена своїй новонародженій родичці, а сам Імператор прибув приблизно через годину, щоб вперше побачити свою дочку.\n\nЗгідно з Імператорською традицією, нова принцеса ще не отримала імені, оскільки це зарезервовано для традиційної церемонії найменування, яка відбувається через сім днів після королівського народження. Незважаючи на це, багато хто по всій імперії вже почав спекулювати, яке ім'я та звертання буде обрано для дитини. Одна з найпоширеніших з цих теорій полягає в тому, що ім'я може бути похідним від Ман'йосю, найстарішої зі збережених збірок традиційної Японської поезії, подібно до імені її дядька Мікаси. Незалежно від того, чи виявляться ці теорії правильними, радісний характер, який приносить таке народження нації, завжди є фантастичним часом для її народу."
 japan_domestic_events.400.a: "Народження королівської особи — це завжди чудова новина."

 japan_domestic_events.401.t: "Країна Вранішнього Скраму"
 japan_domestic_events.401.d: "Оскільки статус Імператорської Родини часто ставить їх поза критикою, політичні суперечки, що виникають між її членами та урядом, зазвичай рідкісні, хоча й не зовсім нечувані. Нещодавня суперечка, яка виникла між Принцом Чічібу, молодшим братом Імператора, та численними членами уряду, є ще більш незвичайною тим, наскільки буденним є предмет обговорення порівняно зі звичайною підкилимною політикою.\n\nХоча Принц широко відомий своєю підтримкою та просуванням розвитку широкого спектру видів спорту в Японії, той, до якого він найбільше прихилився, — це Британський спорт регбі. Представлений спорту Каямою Шігеру, колишнім президентом Японського регбійного союзу та тренером національної команди, Принц Чічібу став обличчям Японського регбі як удома, так і за кордоном. За допомогою Принца спорт поширився по всій Японії, і багато команд з нації почали навіть змагатися на міжнародному рівні проти команд Британської Співдружності.\n\nСаме тут виникла суперечка, оскільки деякі більш жорсткі традиціоналісти в уряді почали розглядати зростання цього іноземного спорту як «зародження раку, який охопить нашу національну ідентичність». Наполягаючи на придушенні цієї підтримки регбі на користь більш традиційних видів спорту та перейменуванні регбі на справжню Японську назву, вони стали на курс прямого зіткнення з Принцом та його активізмом. Оскільки Принц уже висловив заперечення щодо цих потенційних політик, здається, що прийняття офіційного рішення про подальші дії є неминучим."
 japan_domestic_events.401.a: "Японська культура не буде зруйнована простою грою з м'ячем."
 japan_domestic_events.401.b: "Традиція важлива, можливо, Принцу слід допомогти зберегти натомість кемарі."

 japan_domestic_events.402.t: "$fengtian.173.t$"
 japan_domestic_events.402.desc: "$fengtian.173.d$ Не всі в Маньчжурії належним чином оцінюють Японські спроби допомогти розвинути їхню націю, а деякі навіть відкрито протестували проти того, що вони називають «відвертим актом колоніалізму». Тим не менш, запуск лінії є потужним свідченням зусиль Японії принести сучасність як Фентяню, так і всій Азії в цілому, незалежно від того, що можуть думати деякі дисиденти."
 japan_domestic_events.402.a: "Тричі ура спільному процвітанню!"

 japan_domestic_events.403.t: "Піднесення Datsun"
 japan_domestic_events.403.desc: "Протягом більше десяти років Американські автомобільні компанії повністю домінували на Японських ринках. Хоча вітчизняні виробники досягли успіху останніми роками, їхнє загальне сукупне виробництво було б схоже на похибку округлення, якщо порівнювати з виробництвом Великої Трійки — Ford, GM та Chrysler. Навіть попри хаос удома, філії Великої Трійки в Японії продовжували працювати, хоча для багатьох стає очевидним, що їхня продуктивність почала сильно страждати.\n\nБачачи чудову можливість захопити потенційно втрачену частку ринку, Nissan випустив нову модель своїх автомобілів марки Datsun, відому як Тип 16. Незважаючи на те, що вона майже ідентична попередньому Типу 15, час їхнього випуску та пов'язана маркетингова кампанія, включаючи надання безкоштовної моделі Імператорській армії Японії, вже призвели до тисяч продажів, включаючи навіть деякі продажі заможним Австралійським імпортерам. Хоча ще зарано говорити, чи збережеться цей імпульс, особливо після того, як Американська ситуація вирішиться, схоже, що це може бути фантастичний рік для Японського бізнесу."
 japan_domestic_events.403.a: "Це лише початок!"

 japan_domestic_events.404.t: "Хоум-Ран на Рідних Островах"
 japan_domestic_events.404.desc: "З моменту свого впровадження в Японії кілька десятиліть тому бейсбол став одним із найпопулярніших видів спорту в усій країні. Незважаючи на це, до недавнього часу цей вид спорту загалом вважався переважно аматорською грою, у яку люди грають у вільний час або в рамках шкільної програми. Все це почало змінюватися кілька років тому, коли медіа-магнат Шорікі Мацутаро організував команду найкращих гравців Японії для змагань проти найкращих Американських гравців, включаючи Бейба Рута та Джиммі Фокса. Беручи участь у турі, що охопив 12 міст по всій країні, концепція професійного бейсболу швидко охопила націю.\n\nЦе призвело до сьогоднішньої новини про формування першої професійної бейсбольної ліги Японії, Японської Професійної Бейсбольної Ліги. Очікується, що дебютний сезон, що складається з семи команд, включаючи «Токіо Джайентс», сформованих із команди, яка брала участь у попередньому турі, і розділений на три частини, розпочнеться протягом наступних кількох тижнів. Завдяки такому високому попиту громадськості на професійні ігри, і, звичайно, значній рекламній підтримці з боку газети Шорікі, очікується, що ця нова ліга матиме гучний успіх, який розважатиме націю протягом багатьох років."
 japan_domestic_events.404.a: "Дайте нам кілька років, і ми з легкістю переможемо Янкі!"

 japan_domestic_events.405.t: "Відкриття Міського Краєзнавчого Музею Абашірі"
 japan_domestic_events.405.desc: "Сьогодні в Ашібарі велике хвилювання та радість, оскільки Міський Краєзнавчий Музей Абашірі відкрив свої двері для публіки. Три тисячі археологічних та етнографічних об'єктів, зібраних Йонемурою Йошіо. Музей був спроєктований Йошією Таноуе, учнем шановного Американського архітектора Френка Ллойда Райта. Артефакти в музеї датуються Японським палеолітом, проходячи через періоди Дзьомон та Дзоку-Дзьомон, аж до повсякденного життя ери Сьова, і включають матеріали, що стосуються культури Сацумон, культури Охотська та Айнської культури."
 japan_domestic_events.405.a: "Гордий день для нашої нації!"

 japan_domestic_events.406.t: "Випробування Морської Гармати Типу 94 Калібру 46 см/45"
 japan_domestic_events.406.desc: "Вперше задумана на HMS Incomparable, пропозиція щодо дуже великого лінійного крейсера від Британського адмірала Джекі Фішера, гармата залишалася лише мрією військово-морських архітекторів дотепер. О 10 ранку Земля затремтіла, коли була випробувана одна з найбільших коли-небудь побудованих гармат. Це сталося після місяців планування наступного «абсолютного лінкора», як його назвали деякі більш ніж захоплені дизайнери, причому деякі проєкти пропонували гармати калібру до 18 дюймів (46 см), які змогли б домінувати на морях. Відкинута прихильниками повітряної міці як улюблений проєкт і марна трата цінних ресурсів та часу, гармата, ймовірно, не надійде на службу, доки не буде встановлена на своєму відповідному кораблі."
 japan_domestic_events.406.a: "Ніхто не зможе зрівнятися з нашою вогневою міццю!"

 japan_domestic_events.407.t: "Нагойська Пан-Тихоокеанська Мирна Виставка"
 japan_domestic_events.407.desc: "Спонсорована урядом, Нагойська Пан-Тихоокеанська Мирна Виставка мала на меті просування промисловості, транспорту, освіти, науки, будівництва, архітектури, соціального забезпечення, туризму, образотворчого мистецтва та ремесел. За два з половиною місяці роботи Нагойська Виставка прийняла понад 4 800 000 відвідувачів, або приблизно в чотири рази більше населення великого району Нагої на той час. Середня щоденна відвідуваність становила 61 643 особи."
 japan_domestic_events.407.a: "Ми показали світові найкраще, що маємо!"
 japan_domestic_events.407.b: "Якщо хочеш миру, готуйся до війни!"

 japan_domestic_events.408.t: "Завершено Будівництво Нової Будівлі Національного Парламенту"
 japan_domestic_events.408.desc: "Після деякої затримки через політичні заворушення в останнє десятиліття, сьогодні завершено будівництво нової Будівлі Національного Парламенту, повністю з Японських матеріалів, за винятком вітражів, дверних замків та пневматичної системи. На момент відкриття цього дня вона є найвищою будівлею в країні. Дах та вежа будівлі могли бути натхненні іншим учасником, володарем третього місця Такеучі Шіншічі, і вважається, що їх обрали, оскільки вони відображали більш сучасну гібридну архітектуру, ніж суто Європейські та Східно-Азійські проєкти, запропоновані іншими архітекторами. Міністерство спонсорувало публічний конкурс дизайну у 1918 році, і для нової будівлі було подано 118 проєктів. Переможець першого місця, Ватанабе Фукузо, представив проєкт, схожий на проєкт Енде та Бьокманна. Будівля Парламенту була зрештою побудована між 1920 та 1936 роками з планом поверхів, заснованим на роботі Фукузо."
 japan_domestic_events.408.a: "Сподіваємося, це вартувало очікування!"

 japan_domestic_events.409.t: "Землетрус Тотторі 1943 року"
 japan_domestic_events.409.desc: "О 17:36 за місцевим часом 10 вересня в префектурі Тотторі стався землетрус магнітудою 7,0. Епіцентр був зафіксований у районі Кетака, а сейсмічна активність була зареєстрована аж до Окаями на узбережжі Внутрішнього моря. Повідомляється про сотні загиблих, а приблизно 80% міста Тотторі зруйновано, забравши з собою багато історичних будівель. Два інші землетруси сталися раніше цього року, але не завдали значних збитків."
 japan_domestic_events.409.a: "Це жахливо!"

 japan_domestic_events.410.t: "Завершено Будівництво Громадського Аудиторіуму Міста Тайхоку"
 japan_domestic_events.410.desc: "Спроєктований як данина сходженню Імператора Сьова у 1928 році та для заміни старого офісу губернатора Імперії Цін для острова, Громадський Аудиторіум Тайхоку завершив будівництво після 4 років за вартістю трохи менше мільйона єн. Місто тепер має престиж єдиного великого міста з громадським аудиторіумом за межами Рідних Островів. Головний архітектор проєкту Іде Каору, усвідомлюючи значні відмінності у спеці, опадах та вологості острова порівняно з Рідними Островами, прагнув підкреслити місцевий характер острова, водночас використовуючи сучасні архітектурні проєкти, які застосовуються до решти острова через інші проєкти."
 japan_domestic_events.410.a: "Будівля, гідна Імператора!"

 japan_domestic_events.411.t: "«Маленька Марін і Моряк» - Найновіша Книга на Японських Полицях" #Formerly in 00 Literature events.txt
 japan_domestic_events.411.d: "Недавня війна нашої країни надихнула багатьох тих, хто повертається додому, висловити свій досвід у мистецтві, одним із них є автор романтичного роману з безпрецедентними показниками продажів.\n\nКнига під назвою «Marin-chan to Kaigun-kun», або «Маленька Марін і Моряк», розповідає історію двох друзів дитинства та їхнє трагічне кохання: хлопчика та дівчинку, які виросли близько одне до одного, беручи участь у, здавалося б, незмінному житті. Однак, щойно вони закінчують середню школу, Японія готується до війни, і хлопчика викликають до Флоту. Двоє мають розлучитися, Марін залишається вдома. Лише тепер, коли вони розлучені, вони помічають свої почуття одне до одного, але намагаються висловити їх у небагатьох листах, якими можуть обмінятися. Якраз коли війна наближається до кінця, і Марін прагне повернення свого коханого, його листи припиняють надходити.\n\nХоча книга не представляє найвищого рівня Японської літератури, вона дає напрочуд детальний погляд як на повсякденне життя дочки фермера у сільській Японії, так і на Японського морського піхотинця. Книгу заплановано перекласти на Німецьку, Англійську та Російську мови."
 japan_domestic_events.411.a: "Скажіть мені, чим вона закінчується?"

 japan_foreign_events.1.t: "Мантецу оголошує про рекордні прибутки"
 japan_foreign_events.1.d: "Японія була присутня в Маньчжурії з моменту завершення російсько-японської війни, і за роки, що минули з того часу, наш контроль над регіоном значно зміцнився. Переговори в Шанхаї в 1928 році змусили світ визнати наше право на "свободу рук у Маньчжурії", що відкрило безмежні можливості для наших громадян під пильним оком Квантунської армії.\n\nОднак наш контроль не є абсолютним, а уряд Чжан Цзуоліня не завжди йде на співпрацю. Йому пощастило, що наше бажання зберегти вигідний мир у Маньчжурії залишається для нас першочерговим, як і наша надія на те, що його уряд одного дня стане інструментом для реалізації наших великих китайських амбіцій. З цих причин центром наших зусиль в Маньчжурії є Південно-Маньчжурська залізнична компанія, або скорочено "Мантецу", яка стала відповідальною за розвиток і експлуатацію величезних масивів маньчжурської економіки, перетворивши регіон на основне джерело вугілля і сталі для Японії, а також на виробника понад половини світових поставок соєвих бобів.\n\nСьогодні Мантецу оголосила про свої найвищі прибутки на сьогоднішній день."
 japan_foreign_events.1.a: "Маньчжурія - це справді ріг достатку!"

 japan_foreign_events.3.t: "Японія пропонує нам інструкторів"
 japan_foreign_events.3.d: "Сьогодні до нас прибула [From.GetNameDef] делегація, яка запропонувала нам свої сили, щоб підняти наші сили до 'необхідного рівня'. Від такої пропозиції складно відмовитися..."
 japan_foreign_events.3.a: "Будь-ласка!"
 japan_foreign_events.3.b: "Відмовити їм"

 japan_foreign_events.4.t: "Японія надає збройові заводи"
 japan_foreign_events.4.d: "Японці, які очевидно намагаються лестити нам, надали нам річний доступ до найсучасніших засобів збройового виробництва. Ми не знаємо характер їхніх намірів, але дарованому коню, все ж таки, в зуби не дивляться..."
 japan_foreign_events.4.a: "Як щедро!"
 japan_foreign_events.4.b: "Відмовитися"

 japan_foreign_events.5.t: "Японія підтримує наш наступ"
 japan_foreign_events.5.d: "Японці звернулися до нас, пропонуючи провіант, бомбардувальники і боєприпаси як допомогу для нашої наступальної операції. Чи приймемо ми їхню пропозицію?"
 japan_foreign_events.5.a: "Звісно!"
 japan_foreign_events.5.b: "Ніколи!"

 japan_foreign_events.6.t: "Японія надає креслення винищувачів"
 japan_foreign_events.6.d: "Японські військові дозволили потрапити в наші руки кільком кресленням винищувачів, які значно перевершують наші, а також надали інструкції з найбільш ефективного складання цих літаків. Сюрприз, звичайно, але бажаний."
 japan_foreign_events.6.a: "Все, що нам потрібно, ми беремо в Японії"

 japan_foreign_events.7.t: "Японія підтримує наш суверенітет"
 japan_foreign_events.7.d: "Сьогодні до нас звернулися японські радники, принісши з собою подарунки і підтримуючи нас у боротьбі з китайцями. Ми вдячні їм за цей великодушний жест, але чи справді ми так потребуємо японської допомоги?"
 japan_foreign_events.7.a: "Приймемо все, що тільки зможемо"
 japan_foreign_events.7.b: "Відмовити їм"

 japan_foreign_events.8.t: "Абдурашид Ібрагімов прибуває до [Root.GetNameDef]"
 japan_foreign_events.8.d: "Сьогодні в [Root.GetNameDef] прибув імам на ім'я Абдурашид Ібрагімов, представник японського уряду. Від імені своїх покровителів, він дуже високо оцінює нашу справу і боротьбу з китайською тиранією, а також бажає об'єднати всіх азіатів під одним антиімперіалістичним прапором. Для нас велика честь почути такі приємні слова від шанованої людини."
 japan_foreign_events.8.a: "Ласкаво просимо, вчителю"

 japan_foreign_events.21.t: "Токійська конференція"
 japan_foreign_events.21.d: "Японці запросили нас узяти участь у їхній 'Паназіатській конференції' в Токіо. Вони стверджують, що хочуть організувати співпрацю між країнами Азії для боротьби із західним імперіалізмом, що збоку видається вельми благородною метою. Однак дехто закликає нас ігнорувати їхню пропозицію, стверджуючи, що це всього лише виверт, покликаний дозволити Японській імперії, яка почала свій шлях панування над Азією, поширювати на нас свій вплив."
 japan_foreign_events.21.a: "Пакуй мій найкращий костюм."
 japan_foreign_events.21.b: "Давайте цього року залишимося вдома."

 japan_foreign_events.22.t: "[From.GetNameDefCap] відвідує Токійську конференцію"
 japan_foreign_events.22.d: "Представники держави [From.GetNameDef] прибули до Токіо і дискусії вже процесі!"
 japan_foreign_events.22.a: "Вітаємо!"

 japan_foreign_events.23.t: "[From.GetNameDefCap] відмовляється від участі"
 japan_foreign_events.23.d: "[From.GetNameDefCap] відмовилися від участі в Токійській конференції, в яку ми вклали великі гроші. Коли їх запитують про їхні причини, вони дають лише ухильні та невпевнені виправдання."
 japan_foreign_events.23.a: "Яка ганьба для них"

 japan_foreign_events.24.t: "Спільний осуд західного імперіалізму"
 japan_foreign_events.24.d: "Сьогодні саміт у Токіо провів своє перше засідання. На подив він не був суперечливим, усі делегати підписалися під декларацією засудження західного колоніального гноблення і наполегливою відмовою від нерівних договорів. Ми очікуємо широкої підтримки та подальшої плідної співпраці."
 japan_foreign_events.24.a: "Підпишіть ось тут"
 japan_foreign_events.24.b: "Не ризикуйте, 'заохочуйте' їх до підписання."

 japan_foreign_events.25.t: "Токіо: Засудження західного імперіалізму"
 japan_foreign_events.25.d: "Наших делегатів у Японії, мабуть, просять вказати свої імена в досить стандартній декларації. У ній засуджується 'антиазійський расизм', 'експлуатація пригноблених народів європейськими державами', та 'інститутів нерівноправних договорів, за допомогою яких населення Азії навмисно позбавляється права голосу на своїх землях'. Чи повинні ми приєднатися до [JAP.GetNameDef] у цій ініціативі?"
 japan_foreign_events.25.a: "Звісно!"
 japan_foreign_events.25.b: "Напевно, ні (покинути конференцію)"

 japan_foreign_events.26.t: "[From.GetNameDefCap] залишає конференцію"
 japan_foreign_events.26.d: "Судячи з усього, [From.GetAdjective]их сановників не влаштовують наші умови, на яких ми проводимо Токійську конференцію, і вони вирішили перервати подальші переговори."
 japan_foreign_events.26.a: "Ганьба!"

 japan_foreign_events.27.t: "Токіо: Резолюція про торгівлю"
 japan_foreign_events.27.d: "...таким чином, учасники конференції погоджуються з тим, що для заохочення паназіатського співробітництва та братерства мають бути складені та підписані торговельні договори, чиє виконання повинно мати вищий пріоритет у національній політиці кожної азіатської країни, з метою створення єдиного азіатського митного союзу, який забезпечуватиме захист азіатських народів та ринків від хижацьких західних економічних принципів, які..."
 japan_foreign_events.27.a: "Ідеально, вони мають погодитися..."
 japan_foreign_events.27.b: "...але, можливо, ми зможемо пом'якшити умови."

 japan_foreign_events.28.t: "Токіо: Обговорення паназійської торгівлі"
 japan_foreign_events.28.d: "...таким чином, учасники конференції погоджуються з тим, що для заохочення паназіатського співробітництва та братерства мають бути складені та підписані торговельні договори, чиє виконання повинно мати вищий пріоритет у національній політиці кожної азіатської країни, з метою створення єдиного азіатського митного союзу, який забезпечуватиме захист азіатських народів та ринків від хижацьких західних економічних принципів, які..."
 japan_foreign_events.28.a: "Звучить непогано"
 japan_foreign_events.28.b: "Який абсурд (покинути конференцію)"

 japan_foreign_events.29.t: "Токіо: Зміцнення економічних зв'язків"
 japan_foreign_events.29.d: "Азія має стати успішною! Для Токійської конференції ми готуємо пакет меморандумів, який закликає країни-підписанти посилити економічну інтеграцію між нашими ринками. Вигідні умови торгівлі, привілеї для японських компаній, механізми обміну валютою та багато іншого, що є частиною масштабного плану. Однак у нинішньому вигляді пакет може відштовхнути деяких учасників і вони відмовляться від участі. Ми можемо пом'якшити умови, надавши їм вигіднішу угоду і підвищивши ймовірність їхньої згоди, але ціною того, що в довгостроковій перспективі економічна інтеграція буде складнішою."
 japan_foreign_events.29.a: "Презентуйте це на конференції."
 japan_foreign_events.29.b: "Знизити умови угоди"

 japan_foreign_events.30.t: "Токіо: Японія хоче зміцнити економічні зв'язки"
 japan_foreign_events.30.d: "Чи слід сказати 'Токіо закликає до економічної інтеграції'? У будь-якому разі, перед конференцією стало відомо про бажання Японії зміцнити наші зв'язки на зовсім іншому рівні, який виходить за рамки економічної політики, з якою ми спочатку погодилися. Ухвалення пропозиції буде великим кроком для нас, проте в довгостроковій перспективі [Root.GetAdjective]а економіка отримає набагато більше прибутку, ніж наша."
 japan_foreign_events.30.a: "Ми згодні!"
 japan_foreign_events.30.b: "Ні! (покинути конференцію)"

 japan_foreign_events.31.t: "Остання резолюція: Військовий альянс"
 japan_foreign_events.31.d: "Нібито для боротьби із західним імперіалізмом, настав час запросити учасників конференції, що залишилися, до нашого військового альянсу, щоб на ділі мати можливість протистояти нашим суперникам. Буде краще, якщо вони братимуть удар на себе, замість нас!"
 japan_foreign_events.31.a: "Хочеш миру - готуйся до війни"
 japan_foreign_events.31.b: "Чиніть тиск на присутніх, щоб вони поставили свої підписи."

 japan_foreign_events.32.t: "Токіо: Заклик до воєнних дій"
 japan_foreign_events.32.d: "Сьогодні Токійську конференцію охопила полеміка між країнами-учасницями після того, як вони дізналися про справжні цілі Японії: уклавши з нами торговельні угоди, вона закликає нас вступити в її військовий блок, метою якого є боротьба з Німеччиною та іншими 'західними імперіалістичними державами'. Зрозуміло, Японія в цьому альянсі матиме провідну роль. Нас справді влаштовує така ідея?"
 japan_foreign_events.32.a: "Народи Азії, вперед!"
 japan_foreign_events.32.b: "Вони точно збожеволіли!"

 japan_foreign_events.33.t: "[From.GetNameDefCap] приєднується до Японії!"
 japan_foreign_events.33.d: "Судячи з усього, чиновники [From.GetNameDef] погодилися, що шлях до процвітання і сили їхньої країни лежить через співпрацю з найвидатнішою силою Азії, уособленою в державі [JAP.GetNameDef]. Ми зробимо все необхідне, щоб вони офіційно приєдналися до нашого військового союзу, який лежить в основі Великої східноазіатської Сфери Співпроцвітання."
 japan_foreign_events.33.a: "Чудово!"

 japan_foreign_events.34.t: "Японський альянс"
 japan_foreign_events.34.d: "Сьогодні надійшло повідомлення з Японії, в якому вказувалося, що в рамках своєї політики підтримки самовизначення не-ханьських культур на території, яка формально є китайською, імперія має укласти з нами військовий союз. Прийняти пропозицію?"
 japan_foreign_events.34.a: "Звісно!"
 japan_foreign_events.34.b: "Звісно!"

 japan_foreign_events.340.t: "[From.GetNameDefCap] прийняли нашу пропозицію"
 japan_foreign_events.340.d: "[From.GetAdjective]ий уряд виявив розсудливість і погодився приєднатися до нашого альянсу."
 japan_foreign_events.340.a: "Чудово"

 japan_foreign_events.341.t: "[From.GetNameDefCap] відмовляється"
 japan_foreign_events.341.d: "[From.GetAdjective]ий уряд відкинув пропозицію приєднатися до нашого альянсу."
 japan_foreign_events.341.a: "Безглуздий вибір"

 japan_foreign_events.342.t: "Приєднання до японської сфери"
 japan_foreign_events.342.d: "Помітивши на Токійській конференції нашу зацікавленість в офіційному приєднанні до японського військового альянсу, японці прибули до [Root.GetNameDef] щоб особисто запропонувати нам розширену угоду."
 japan_foreign_events.342.a: "Вчасно!"
 japan_foreign_events.342.b: "Ми передумали..."

 japan_foreign_events.41.t: "Японський ультиматум"
 japan_foreign_events.41.d: "Ось уже кілька місяців японці висловлюють свої агресивні амбіції щодо наших колоній у рамках своєї експансіоністської політики. Сьогодні японський посол висунув нам ультиматум: японці вимагають віддати їм усі наші території в Південно-Східній Азії та Тихому океані, інакше вони погрожують обрушити на нас усю міць своєї Імператорської армії..."
 japan_foreign_events.41.a: "Навіть не думайте відповідати їм"
 japan_foreign_events.41.b: "Прийняти їхні вимоги"

 japan_foreign_events.42.t: "Наш ультиматум проігнорували!"
 japan_foreign_events.42.d: "Ми так і не отримали жодної відповіді від [From.GetNameDef] сторони на наш ультиматум. Ми повинні мобілізувати сили і почати війну, щоб закріпити наше становище гегемона Східної Азії!"
 japan_foreign_events.42.a: "Оголосити війну!"
 japan_foreign_events.42.b: "Надто ризиковано"

 japan_foreign_events.43.t: "[From.GetNameDefCap] уряд приймає наші вимоги"
 japan_foreign_events.43.d: "[From.GetNameDefCap] сторона прийняла наші вимоги. У цьому немає нічого дивного: вони не посміли б протистояти могутності армій імператора!"
 japan_foreign_events.43.a: "Чудово!"

 japan_foreign_events.45.t: "Японський емісар"
 japan_foreign_events.45.d: "Сьогодні до нас прибув японський дипломат, він просить про зустріч із [Root.GetLeader] для обговорення однієї пропозиції: [From.GetNameDef] уряд надасть військову допомогу та інструкторів для [PRF.GetNameDef] в обмін на приєднання до Азійської сфери співпроцвітання. Поки що не йдеться про військовий альянс, лише про приєднання до клубу держав, які об'єднують свої економічні можливості під захистом Японії. Ухвалення пропозиції, безумовно, принесе прибуток [Root.GetAdjective]ій економіці, але багато хто побоюється, що японці насправді хочуть згодом збільшити свій вплив на нас і в кінцевому підсумку перетворити нашу державу на свою колонію."
 japan_foreign_events.45.a: "Ми приймаємо їхню пропозицію"
 japan_foreign_events.45.b: "Ми маємо дати їм ввічливу відмову"

 japan_foreign_events.46.t: "Індійці прийняли наші вимоги!"
 japan_foreign_events.46.d: "Нашу щедру пропозицію індійцям зустріли з теплотою. Представники [From.GetNameDef] уряду вітали великодушність і проникливість японців у справі зближення наших великих народів. Ми запропонували їм відкрити своє посольство в Токіо."
 japan_foreign_events.46.a: "Чудово!"

 japan_foreign_events.47.t: "Індійці відхилили нашу пропозицію!"
 japan_foreign_events.47.d: "З гірших спонукань, [From.GetNameDef] дипломати відкинули нашу великодушну пропозицію дружби та співпраці. Японські газети відреагували публікацією карикатур, у якій індійський уряд виставлено наляканою шавкою за небажання вжити необхідних заходів для звільнення субконтиненту від колоніалізму."
 japan_foreign_events.47.a: "Ганьба їм!"

 japan_foreign_events.54.t: "Циндао належить нам!"
 japan_foreign_events.54.d: "Німецька військова гавань у Східній Азії впала перед нашими арміями. Замість прапора їхніх ВМС, зараз над містом гордо майорить прапор Японії. На вулицях німецькі крамарі з кам'яними обличчями дивляться на парад наших полків."
 japan_foreign_events.54.b: "Блискуча перемога!"

 japan_foreign_events.55.t: "Японія погрожує нам!"
 japan_foreign_events.55.d: "Японська оперативна група висадилася на наші острови і погрожує нам нападом якщо ми не здамося!"
 japan_foreign_events.55.a: "Дати їм бій і покликати на допомогу!"
 japan_foreign_events.55.b: "Нам залишається лише здатися"

 japan_foreign_events.56.t: "Філіппіни просять про допомогу!"
 japan_foreign_events.56.d: "Японія стукає у двері Філіппінців, які просять нас про допомогу. Якою буде наша відповідь?"
 japan_foreign_events.56.a: "Запропонувати їм свій захист"
 japan_foreign_events.56.b: "На жаль, ми не можемо"

 japan_foreign_events.57.t: "Філіппіни заручилися [philippines_backer.GetAdjective]ою допомогою"
 japan_foreign_events.57.d: "Філіппінці не хочуть виконувати наші вимоги, їхню незалежність підтримує [philippines_backer.GetNameDef]."
 japan_foreign_events.57.a: "Ми знищимо їх, незважаючи ні на що"
 japan_foreign_events.57.b: "Відступимо, до певного часу"

 japan_foreign_events.5701.t: "Японці відступили"
 japan_foreign_events.5701.d: "Японці безумовно не хочуть випробовувати нас на міцність. Вони перестали надсилати погрози і відступили, до певного часу."
 japan_foreign_events.5701.a: "Яке полегшення"

 japan_foreign_events.58.t: "Філіппіни чинять опір!"
 japan_foreign_events.58.d: "Філіппінці не хочуть виконувати наші вимоги, при цьому не маючи за собою жодної держави, яка могла б прийти до них на допомогу. За свою зухвалість вони розплатяться кров'ю."
 japan_foreign_events.58.a: "Ми знищимо їх"

 japan_foreign_events.59.t: "Філіппіни здалися!"
 japan_foreign_events.59.d: "Побачивши міць наших збройних сил, у Філіппін не залишалося вибору, окрім як підкоритися хоробрим синам нашої імперії!"
 japan_foreign_events.59.a: "Вони стануть нашими маріонетками!"
 japan_foreign_events.59.b: "Анексуємо їх!"

 japan_foreign_events.62.t: "Японія погрожує нам!"
 japan_foreign_events.62.d: "Японська оперативна група висадилася на наші острови і погрожує нам нападом якщо ми не здамося!"
 japan_foreign_events.62.a: "Дати їм бій і покликати на допомогу!"
 japan_foreign_events.62.b: "Нам залишається лише здатися"

 japan_foreign_events.63.t: "Гаваї здаються!"
 japan_foreign_events.63.d: "Вони зробили правильний вибір. Утім, по суті його в них не було."
 japan_foreign_events.63.a: "Вони стануть нашими маріонетками!"
 japan_foreign_events.63.b: "Анексуємо їх!"

 japan_foreign_events.64.t: "Гаваї просять про допомогу"
 japan_foreign_events.64.d: "Японія стукає у двері Гавайців, які просять нас про допомогу. Якою буде наша відповідь?"
 japan_foreign_events.64.a: "Запропонувати їм свій захист"
 japan_foreign_events.64.b: "Вони покинули нас, хіба ви не пам'ятаєте?"

 japan_foreign_events.65.t: "Гаваї заручилися допомогою Америки"
 japan_foreign_events.65.d: "Гавайці не хочуть виконувати наші вимоги, їхню незалежність підтримує [From.GetNameDef]."
 japan_foreign_events.65.a: "Ми знищимо їх, незважаючи ні на що"
 japan_foreign_events.65.b: "Відступимо, до певного часу"

 japan_foreign_events.66.t: "Гаваї чинять опір!"
 japan_foreign_events.66.d: "Гавайці не хочуть виконувати наші вимоги, при цьому вони не мають за собою підтримки з Америки. За свою зухвалість вони розплатяться кров'ю."

 japan_foreign_events.90.t: "[FROM.GetNameDefCap] націлена на Міста-Концесії"
 japan_foreign_events.90.d: "Новини з Шанхая в останні кілька днів набували дедалі тривожнішого тону, оскільки загроза війни, здавалося, нависла над округою. Позиція [FROM.GetNameDef] по відношенню до поселення, схоже, змінила свою лінію лише 10 років тому, оскільки тепер вони засуджують існування Міст-Концесій як символ "кричущого західного імперіалізму", а повідомлення показують, що Імператорський флот Японії готується до захоплення столиці мандата. Усі ці ознаки, здавалося б, підтверджують, що Японія готується до війни. Але оскільки міжнародна ситуація напружена, [LEC.GetNameDef] знаходиться далеко від нашої країни, а потужний флот підтримує дії Японії, багато хто в нашому уряді вважає допомогу містам програною справою. Однак впливові люди в суспільстві й особливо в ділових колах благають уряд виконати свої іноземні зобов'язання і зупинити японську агресію."
 japan_foreign_events.90.a: "Відступайте - ми не можемо дозволити собі воювати з Японією."
 japan_foreign_events.90.b: "Ми захищатимемо наші інтереси!"

 japan_foreign_events.91.t: "[FROM.GetNameDefCap] залишає Міста-Концесії"
 japan_foreign_events.91.d: "Схоже, що японська загроза нашому існуванню не залишилася непоміченою [FROM.GetNameDef]. Але замість того, щоб виконати свої зобов'язання щодо нашого захисту, вони зберігають підозріле мовчання. Насправді, [FROM.GetNameDef] зараз, схоже, намагається покинути Шанхай з максимально можливою кількістю своїх активів, одночасно заперечуючи відповідальність за наш захист. Перед лицем кричущої іноземної агресії наші захисники покинули нас."
 japan_foreign_events.91.a: "О ні..."

 japan_foreign_events.92.t: "[FROM.GetNameDefCap] гарантують Міста-Концесії"
 japan_foreign_events.92.d: "Шокуюча заява надійшла від [FROM.GetNameDef]. Нібито занепокоєний 'агресивними діями' щодо [LEC.GetNameDef], [FROM.GetAdjective]ий міністр закордонних справ засудив наші нещодавні дії і заявив, що зобов'язання його країни щодо Шанхаю не будуть проігноровані. Йдучи наперекір розуму, [FROM.GetNameDef] готовий битися, щоб захистити [LEC.GetNameDef]."
 japan_foreign_events.92.a: "Вони отримають свою війну."

 japan_foreign_events.200.t: "Німці просять про мир!"
 japan_foreign_events.200.d: "Німці, пригнічені нашою переважаючою армією, приходять до нас із молитвами про мир. Вони пропонують нам натомість усю Індонезію і деякі свої власні колонії. Як ми повинні реагувати?"

 japan_foreign_events.202.t: "Фентяньська срібна криза"
 japan_foreign_events.202.d: "Коли Банк Японії і банк Міцуї, два найбільших у нашій країні, зажадали виплати за своїми кредитами поспіль, Центральний банк Фентяня оголосив дефолт через раптовий і нібито незрозумілий брак срібних резервів. Чи було це просто грубою некомпетентністю і безгосподарністю, чи щось жахливіше, незрозуміло, але немає жодних сумнівів у тому, що уряд Фентяня опинився у важкій економічній ситуації та звернувся до нас із проханням про допомогу.\n\nХоча наш вплив дасть змогу забезпечити виплату як Міцуї, так і Банку Японії належних їм виплат першочергово, провал фентяньського уряду серйозно підірве їхні претензії на легітимність і наші твердження про прихильність. У нас є можливість внести заставу."
 japan_foreign_events.202.a: "У нас немає вибору"
 japan_foreign_events.202.b: "Це їхні проблеми"

 japan_foreign_events.203.t: "Фентянь звинувачує нас у срібній кризі!"
 japan_foreign_events.203.d: "Фентянь публічно засудив наш уряд, заявивши, що це навмисна змова з метою дестабілізації їхнього уряду внаслідок нещодавньої Срібної кризи, пославшись на випадкові вимоги як Банку Японії, так і Банку Міцуї щодо погашення кредитів, що підтримуються срібним запасом Фентяня. З резервом, який, вочевидь, містить набагато менше, ніж стверджував Фентяньський уряд, їхня економіка вийшла з-під контролю, тому що уряд втрачає довіру до себе щогодини, і видається цілком імовірним, що ця груба і безглузда спроба відволікти увагу від відповідальності є, здебільшого, реакцією на їхню внутрішню політичну ситуацію.\n\nУ будь-якому разі, ми можемо спростувати ці безглузді твердження, але чи можемо ми також залишити це кричуще нахабство безкарним?"
 japan_foreign_events.203.a: "Ці звинувачення - брехня!"
 japan_foreign_events.203.b: "Покарати їх за нахабство!"

 japan_foreign_events.204.t: "Фентянь виганяє нашу військову місію"
 japan_foreign_events.204.d: "Фентянь виганяє нашу військову місію, давши їм двадцять чотири години на те, щоб покинути країну, забравши з собою всю техніку та інше майно. Однак, всупереч нашим очікуванням, це супроводжувалося дипломатичним листом, в якому пояснювалося, що місія досягла своєї мети, і що тепер Фентяню цілком достатньо досвіду для виконання своїх командних функцій. Посол Фентяня також витратив останні кілька годин, намагаючись переконати МЗС, звісно ж, приватно, що це було лише необхідністю внутрішньої політики, і що стосовно Японії не буде жодної ворожості.\n\nХоча це може бути правдою, а може й ні, не виникає жодних сумнівів у тому, що це зменшить наш вплив на Фентянь, а це, своєю чергою, може поставити під загрозу безпеку Корейського півострова. Хто скаже, що китайці робитимуть далі?"
 japan_foreign_events.204.d_mantetsu: "Фентянь виганяє нашу військову місію, давши їм двадцять чотири години на те, щоб покинути країну, забравши з собою всю техніку та інше майно. Однак, всупереч нашим очікуванням, це супроводжувалося дипломатичним листом, у якому пояснювалося, що місія досягла своєї мети, і що тепер Фентяню цілком достатньо досвіду для виконання своїх командних функцій.\n\nНа щастя, наш контроль над Фентянем через Мантецу є досить великим, і ми майже напевно можемо змусити їхній уряд скасувати своє рішення. Це може змусити більш патріотичні та мілітаристські елементи уряду самостійно оголосити війну, і наслідки такої ситуації також мають бути розглянуті."
 japan_foreign_events.204.a: "Оголосити війну"
 japan_foreign_events.204.b: "Змусити Фентянь передумати"
 japan_foreign_events.204.c: "Покарати Фентянь"
 japan_foreign_events.204.e: "Нічого не робити"

 japan_foreign_events.205.t: "Фентянь виганяє нашу військову місію"
 japan_foreign_events.205.d: "Фентянь вигнав нашу військову місію, давши їм двадцять чотири години на те, щоб покинути країну, забравши з собою всю техніку та інше майно. Це не тільки серйозно загрожує підірвати наш контроль над Фентяньським урядом, а й потенційно наражає Корею, а тим самим і Японію на небезпеку нападу. Це абсолютно неприйнятно як для наших генералів, так і для японського почуття честі. Такий акт невдячної непокори має бути зустрінутий відповідною відповіддю!"
 japan_foreign_events.205.a: "Висунути ультиматум"
 japan_foreign_events.205.b: "Нічого не робити"

 japan_foreign_events.206.t: "Фентянь засуджує нас!"
 japan_foreign_events.206.d: "Єдиним найприбутковішим підприємством з видобутку залізної руди поза рідними островами є філія ЮМЖК під назвою 'Залізо і сталь Аньшана'. Наразі компанія хоче розширитися і, безумовно, почала проводити буріння без чийогось відома, що призвело до знищення посівних наділів, а це, своєю чергою, призвело до протестів серед місцевого китайського населення. Протести переросли в сутички і, на жаль, наш місцевий гарнізон був змушений втрутитися, позбавивши життя деяких протестувальників.\n\nУряд Фентяня засудив дії наших військ. Якою буде наша реакція?"
 japan_foreign_events.206.a: "Покарати їх за нахабство!"
 japan_foreign_events.206.b: "Засудити Фентянь"
 japan_foreign_events.206.c: "Зберігати мовчання"

 japan_foreign_events.215.t: "Філіппіни прийняли нашу пропозицію"
 japan_foreign_events.215.d: "Філіппіни вирішили приєднатися до нас, вони мудро передбачали, що опір буде марним, і замість цього вирішили стати нашим союзником."
 japan_foreign_events.215.a: "Приємно чути"

 japan_foreign_events.216.t: "Філіппіни приєдналися до Антанти"
 japan_foreign_events.216.d: "Філіппіни вирішили вступити в Антанту; вони відмовилися від пропозиції дружби. Це не повинно залишитися безкарним, але Антанта сильна, тож ми маємо виграти час."
 japan_foreign_events.216.a: "Скоро, скоро"

 japan_foreign_events.217.t: "Філіппіни приєдналися до Райхспакту"
 japan_foreign_events.217.d: "Філіппіни вирішили приєднатися до Рейхспакту; вони відмовилися від пропозиції дружби. Це не повинно залишитися безкарним, але Райхспакт сильний, тож ми маємо виграти час."
 japan_foreign_events.217.a: "Скоро, скоро"

 japan_foreign_events.218.t: "Гаваї прийняли нашу пропозицію"
 japan_foreign_events.218.d: "Гаваї вирішили приєднатися до нас, вони мудро розсудили, що опір буде марним, і замість цього вирішили стати нашим союзником."
 japan_foreign_events.218.a: "Приємно чути"

 japan_foreign_events.225.t: "США в сум'ятті"
 japan_foreign_events.225.d: "У Сполучених Штатах почалася громадянська війна, розриваючи на частини залишки федеративної єдності. Ситуація, що склалася, дає нам змогу позбавити від американської присутності центральну частину Тихого океану шляхом окупації Гуаму. Невелика ймовірність, що уряд США захоче зупинити нас."
 japan_foreign_events.225.a: "Зайняти Гуам... і просунутися далі!"
 japan_foreign_events.225.b: "Зайняти Гуам"
 japan_foreign_events.225.c: "Я думаю, краще залишити все як є"

 japan_foreign_events.226.t: "Японія захоплює Гуам"
 japan_foreign_events.226.d: "Оскільки Америка в хаосі, Японія перемістилася на острів Гуам. На даний момент уряд США майже нічого не може зробити, щоб зупинити Японію."
 japan_foreign_events.226.a: "Дуже погано"

 japan_foreign_events.227.t: "Японія націоналізує наші автомобільні компанії"
 japan_foreign_events.227.d: "В умовах, коли нація перебуває в хаосі, Японія захопила контроль над кількома американськими автомобільними компаніями, що працюють у цьому регіоні. Громадянська війна призвела до того, що багато компаній втратили зв'язок зі своїми головними компаніями, і вони боролися за отримання запчастин для своїх складальних ліній. Це дало змогу японцям досить легко захопити контроль над ними під виглядом 'допомоги'. Незважаючи на те, що це явно незаконна дія, ми не в змозі зробити нічого, окрім як надіслати їм суворо сформульованого листа."
 japan_foreign_events.227.a: "Надішліть їм якомога різкішого листа!"

 japan_foreign_events.230.t: "Японія просить про мир"
 japan_foreign_events.230.d.taiwan_kept: "Зазнавши повної поразки на полях битв на всьому азіатському континенті від наших переможних армій, японці відступили зі своїх баз у Маньчжурії та Кореї. Не маючи особливої надії оскаржити нашу відновлену перевагу на суходолі, зниження громадської думки і страх перед катастрофою, що поглиблюється, змусили Токіо сісти за стіл переговорів, однак не без того, щоб розіграти останню карту, яка залишилася в їхніх руках: Імператорський Японський Флот.\n\nПосилаючись на загрозу триваючої японської блокади і необхідність для обох держав бути достатньо сильними, щоб протистояти західному імперіалізму, умови, які вони запропонували, були здебільшого щедрими, хоча, відверто кажучи, просто визнанням статус-кво. Наша власність на континентальну китайську територію буде визнана і всі 'орендовані' території будуть повернуті, Корея буде звільнена, ми підемо від будь-яких інших окупованих членів [JAP.GetFactionName], буде підписано пакт про ненапад, і Японія утримається від подальшого втручання в китайські справи. Однак, у договорі відсутній острів Тайвань, який японці мають намір залишити собі.\n\nЗ огляду на нашу нинішню нездатність оскаржити японське панування на морях та інші проблеми, з якими стикається наш уряд, розумною дією буде підписання цього договору. Японська блокада берегової лінії - непросте завдання з їхнього боку, але вона порушить нашу торгівлю та економічну стабільність до катастрофічної міри. Однак Тайвань розглядається як невід'ємна китайська територія, безславно відібрана у нас після поразки в першій китайсько-японській війні. Повна перемога може зайняти роки, але чи може вона коштувати того, щоб забезпечити об'єднання Китаю?"
 japan_foreign_events.230.d.taiwan_handed_over: "Будучи повністю переможеними на полях битв по всьому азіатському континенту нашими переможними арміями, японці відступили зі своїх баз у Маньчжурії та Кореї. Їхній військово-морський потенціал також був ослаблений за ці роки, як нашими діями, так і діями інших, що залишило їм мало можливостей домагатися сильніших умов. Маючи мало надії оскаржити нашу відновлену перевагу на суші, зниження громадської думки і побоювання погіршення катастрофи змусили Токіо сісти за стіл переговорів.\n\nВирішивши зберегти обличчя і скоротити свої втрати, вони сформулювали пропоновану угоду як таку, що необхідна для того, щоб обидві держави були достатньо сильні, щоб протистояти західному імперіалізму. Однак здебільшого умови є визнанням статус-кво. Нашу власність на китайську територію буде визнано і всі 'орендовані' території буде повернуто, Корею і Тайвань буде звільнено, ми відійдемо від будь-яких інших окупованих членів [JAP.GetFactionName], буде підписано пакт про ненапад, і Японія утримається від подальшого втручання в китайські справи.\n\nЗ огляду на логістичні проблеми вторгнення в Японію та інші більш нагальні проблеми, що стоять перед нами, ніж повна поразка Японії, розумною дією може бути підписання цієї угоди. З іншого боку, поки Японія залишається великою державою, вона становить загрозу нашій територіальній цілісності, і деякі прихильники жорсткої лінії радять нам домагатися повної поразки Японії і розпуску [JAP.GetFactionName]."
 japan_foreign_events.230.d.taiwan_occupied: "Будучи повністю переможеними на полях битв по всьому азіатському континенту нашими переможними арміями, японці відступили зі своїх баз у Маньчжурії та Кореї. Їхній військово-морський потенціал також був ослаблений за ці роки, як нашими діями, так і іншими, що залишило їм мало можливостей домагатися сильніших умов. Маючи мало надії оскаржити нашу відновлену перевагу на суші, зниження громадської думки і побоювання погіршення катастрофи змусили Токіо сісти за стіл переговорів.\n\nВирішивши зберегти обличчя і скоротити свої втрати, вони сформулювали пропоновану угоду як таку, що необхідна для того, щоб обидві держави були достатньо сильні, щоб протистояти західному імперіалізму. Однак здебільшого умови є визнанням статус-кво. Нашу власність на китайську територію буде визнано і всі 'орендовані' території буде повернуто, Корею і Тайвань буде звільнено, ми відійдемо від будь-яких інших окупованих членів [JAP.GetFactionName], буде підписано пакт про ненапад, і Японія утримається від подальшого втручання в китайські справи.\n\nЗ урахуванням логістичних проблем вторгнення в Японію та інших більш нагальних проблем, що стоять перед нами, ніж повна поразка Японії, розумною дією може бути підписання цієї угоди. З іншого боку, поки Японія залишається великою державою, вона становить загрозу нашій територіальній цілісності, і деякі прихильники жорсткої лінії радять нам домагатися повної поразки Японії і розпуску [JAP.GetFactionName] раз і назавжди."
 japan_foreign_events.230.d.no_taiwan: "Зазнавши повної поразки на полях битв на всьому азіатському континенті від наших переможних армій, японці відступили зі своїх баз у Маньчжурії та Кореї. Не маючи особливої надії оскаржити нашу відновлену перевагу на суходолі, зниження громадської думки і страх перед катастрофою, що поглиблюється, змусили Токіо сісти за стіл переговорів, однак не без того, щоб розіграти останню карту, яка залишилася в їхніх руках: Імператорський Японський Флот.\n\n\nПосилаючись на загрозу триваючої японської блокади і необхідність для обох держав бути достатньо сильними, щоб протистояти західному імперіалізму, умови, які вони запропонували, були здебільшого щедрими, хоча, відверто кажучи, просто визнанням статус-кво. Нашу власність на континентальну китайську територію буде визнано і всі 'орендовані' території буде повернуто, Корею буде звільнено, ми підемо від будь-яких інших окупованих членів [JAP.GetFactionName], буде підписано пакт про ненапад, і Японія утримається від подальшого втручання в китайські справи. Однак не буде згадано острів Тайвань, який було відібрано в японців зовнішньою силою, - це питання вирішуватиметься іншим разом.\n\nЗ огляду на логістичні труднощі вторгнення в Японію та інші більш нагальні проблеми, ніж повна поразка Японії, розумною дією може бути підписання цієї угоди. З іншого боку, поки Японія залишається великою державою, вона становить загрозу нашій територіальній цілісності, і деякі прихильники жорсткої лінії радять нам домагатися повної поразки Японії і розпуску [JAP.GetFactionName] раз і назавжди."
 japan_foreign_events.230.a: "Нехай залишають собі свої жалюгідні рідні острови."
 japan_foreign_events.230.b: "Наш прапор майорітиме в Токіо!"

 japan_foreign_events.231.t.peace: "Мир із Китаєм"
 japan_foreign_events.231.d.peace_taiwan_kept: "У світлі відступу наших армій з материкової частини Китаю і триваючого фінансового тягаря, який цей конфлікт поклав на нашу напружену економіку, наш уряд вирішив змінити стратегію. Імператорський Японський Флот успішно запобіг будь-якій подальшій ганьбі нашої нації, захищаючи водні шляхи та блокуючи китайське узбережжя, заходи, що забезпечили нам деякі важелі впливу на переговори. Тому ми обрали найбільш розсудливий спосіб дій - знайти прийнятну мирну угоду.\n\nПісля довгих обговорень китайці погодилися на умови. Ми визнаємо їхню окупацію Маньчжурії та Кореї і відмовляємося від претензій та оренди їхньої території. Однак ми зможемо зберегти за собою Тайвань, великий острів, на який претендують китайці і який був наданий нам за Симоносекським договором після нашого більш успішного виступу в першій Китайсько-Японській війні.\n\nНезважаючи на гіркі обставини, принаймні вдалося уникнути важкого і затяжного конфлікту. Буде підписано договір про ненапад, і ми сподіватимемося на більш мирні відносини з китайцями в майбутньому."
 japan_foreign_events.231.d.peace_taiwan_handed_over: "У світлі відступу наших армій з китайського материка і триваючого фінансового тягаря, який цей конфлікт накладає на нашу напружену економіку, наш уряд вирішив змінити стратегію. Імператорський Японський Флот також зазнає значних труднощів у блокуванні китайського узбережжя, завдаючи шкоди нашим важелям впливу на переговорах. Тому ми обрали найбільш розсудливий курс дій - знайти прийнятну мирну угоду.\n\nПісля довгих обговорень китайці погодилися на умови. Ми визнаємо їхню окупацію Маньчжурії та Кореї і відмовимося від претензій та оренди їхньої території. На жаль, це включатиме Тайвань, великий острів, на який претендують китайці і який був відданий нам за Симоносекським договором. Хоча ми продовжуємо окупувати острів, стан нашого флоту означає, що наша хватка неміцна. Повернення їм острова дасть змогу, принаймні, не допустити західних імперіалістів та інших зовнішніх агресорів.\n\nНезважаючи на гіркі обставини, принаймні вдалося уникнути виснажливого і затяжного конфлікту. Буде підписано договір про ненапад, і ми сподіватимемося на більш мирні відносини з китайцями в майбутньому."
 japan_foreign_events.231.d.peace_taiwan_occupied: "У світлі відступу наших армій з китайського материка і триваючого фінансового тягаря, який цей конфлікт накладає на нашу напружену економіку, наш уряд вирішив змінити стратегію. Імператорський Японський Флот також зазнає значних труднощів у блокуванні китайського узбережжя, завдаючи шкоди нашим важелям впливу на переговорах. Тому ми обрали найбільш розсудливий курс дій - знайти прийнятну мирну угоду.\n\nПісля довгих обговорень китайці погодилися на умови. Ми визнаємо їхню окупацію Маньчжурії та Кореї і відмовимося від претензій та оренди їхньої території. На жаль, це включатиме Тайвань, великий острів, на який претендують китайці і який був відданий нам за Симоносекським договором. Китайська окупація острова значно зменшила нашу проєкцію сили на півдні. Принаймні в руках Китаю він, сподіваюся, хоча б не заважатиме західним імперіалістам та іншим зовнішнім агресорам.\n\nНезважаючи на гіркі обставини, принаймні вдалося уникнути виснажливого і затяжного конфлікту. Буде підписано договір про ненапад, і ми сподіватимемося на більш мирні відносини з китайцями в майбутньому."
 japan_foreign_events.231.d.peace_no_taiwan: "У світлі відступу наших армій з китайського материка і триваючого фінансового тягаря, який цей конфлікт накладає на нашу напружену економіку, наш уряд вирішив змінити стратегію. Імператорський Японський Флот також зазнає значних труднощів у блокуванні китайського узбережжя, що завдає шкоди нашому впливу на переговори. Тому ми обрали найбільш розсудливий курс дій - знайти прийнятну мирну угоду.\n\nПісля довгих обговорень китайці погодилися на умови. Ми визнаємо їхню окупацію Маньчжурії та Кореї і відмовимося від претензій та оренди їхньої території. Усіх ув'язнених, яких утримують з обох боків, буде звільнено, і наші військові тепер вільні для інших необхідних завдань із захисту нашої батьківщини.\n\nНезважаючи на гіркі обставини, принаймні вдалося уникнути важкого і затяжного конфлікту. Буде підписано договір про ненапад, і ми сподіватимемося на більш мирні відносини з китайцями в майбутньому."
 japan_foreign_events.231.a: "Війна розвивалася не завжди на користь Японії."

 japan_foreign_events.231.t.no_peace: "Мирні переговори відхилені"
 japan_foreign_events.231.d.no_peace: "Очевидно, Китай ненавидить нас настільки, що не бажає вести з нами переговори. Незважаючи на великі поразки на суші, нам доведеться спробувати перемогти в Китаї. Це означає, що в Східній Азії почнеться тотальна війна, і схоже, вона не буде ні легкою, ні короткою."
 japan_foreign_events.231.b: "Схоже, це життя або смерть."

 japan_foreign_events.232.t: "Кінець Другої китайсько-японської війни"
 japan_foreign_events.232.d: "Війна 1894-1895 років стала принизливою поразкою для нашої країни. Тепер японських агресорів остаточно вигнано, і ми нарешті помстилися за наших полеглих братів у Першій Китайсько-Японській війні. Більше ми не дозволимо іноземним імперіалістичним державам втручатися у справи нашої гордої нації, більше Китай не буде поневолений, бо ми будемо господарями своєї долі!"
 japan_foreign_events.232.a: "Wansui!"

 japan_foreign_events.233.t: "[FROM.GetNameDefCap] відмовляється від миру"
 japan_foreign_events.233.d: "[FROM.GetNameDefCap] відмовилися від нашої мирної пропозиції. Вони не зможуть загрожувати нашому узбережжю, оскільки в китайців немає флоту, гідного цієї назви. Однак протистояти китайцям у сухопутній битві буде нелегко, враховуючи нашу попередню величезну поразку на материку. Виграти цю війну нам буде важко."
 japan_foreign_events.233.a: "Нам доведеться битися до останньої людини."

 japan_foreign_events.238.t: "Японія пропонує мир"
 japan_foreign_events.238.d: "Після повного приниження російською армією, Японія запропонувала умовну капітуляцію, пропонуючи повний відступ з незаконно окупованих ними по праву російських регіонів. Їхній флот не може зробити нічого, крім блокування наших портів на тихоокеанському узбережжі, а їхня армія майже повністю знищена. Більшість військових керівників і міністрів кажуть, що ми повинні прийняти їхню умовну капітуляцію, в той час як меншість пропонує нам домагатися повної перемоги, враховуючи нашу промислову перевагу над японцями."
 japan_foreign_events.238.a: "Ми приймаємо їхні умови, Мукден відомщений."
 japan_foreign_events.238.b: "Ми не заспокоїмося, поки наша армія не буде марширувати руїнами Токіо."

 japan_foreign_events.239.t: "Росія згодна на мир"
 japan_foreign_events.239.d: "Росія прийняла нашу умовну капітуляцію, дозволивши нам відвести нашу армію з материкової Азії назад у безпеку Домашніх островів. Хоча це принизлива поразка, принаймні, вона не була повною. Наша незалежність від європейських імперіалістів була збережена."
 japan_foreign_events.239.a: "Принаймні, наші хлопці в безпеці вдома."

 japan_foreign_events.240.t: "Мир з імперією згасаючого сонця"
 japan_foreign_events.240.d: "Боягузлива японська нація була принижена, а сонце на Сході згасає. Самураї впали на землю під тиском сталі та вогню, розв'язаного нашою армією. Наші горді солдати змогли вигнати японських окупантів назад на їхні жалюгідні \"рідні острови\", звільнивши тисячі російських людей, які тепер зможуть возз'єднатися з Батьківщиною. Хай живе Росія, єдина і неподільна!"
 japan_foreign_events.240.a: "Слава!"

 japan_foreign_events.241.t: "Росія відмовляється від миру"
 japan_foreign_events.241.d: "Росія відмовилася від нашої умовної капітуляції, посилаючись на те, що вони \"не дозволять ворогу, якого вони принизили на полі бою, диктувати умови миру\". Хоча ми зазнали поразки на суші, ми зможемо влаштувати їм пекло на морі та на Домашніх островах, якщо до цього дійде. Як ми відбили монгольських загарбників 800 років тому, так само ми відіб'ємо і російських загарбників."
 japan_foreign_events.241.a: "Ми будемо битися до останньої людини! Banzai!"

 japan_foreign_events.251.t: "Японія зазнає краху"
 japan_foreign_events.251.d: "Не так давно Японська Імперія здавалася непереможною, енергійною нацією з безмежними амбіціями, покликаною зламати хребет західному імперіалізму в Азії. Тепер це не так. Після капітуляції вищого японського командування і незважаючи на те, що деякі підрозділи запекло б'ються по всій Азії, [JAP.GetFactionName] остаточно завалилася навколо нас. Тепер ми повинні битися поодинці; наш вибір - це наш вибір."
 japan_foreign_events.251.a: "Я думав, вони сильніші..."

 japan_foreign_events.252.t: "Розпад Японської Імперії"
 japan_foreign_events.252.d: "Безпрецедентно зростаюча азіатська держава, Японська Імперія, оголосила, що офіційно здала всі свої сили на Домашніх островах у зв'язку з недавньою капітуляцією. Упертий і войовничий народ Японії не звик підкорятися, але, опинившись перед обличчям знищення, вони, безсумнівно, вирішили позбавити свою країну від подальшого руйнування. Колись Японія вважалася провідною індустріальною країною Тихого океану з одним із найсучасніших у світі військово-морських флотів і армій, але поразка Японії призвела до остаточного розпаду країни. Перед обличчям такої нищівної поразки різні члени Спів-Процвітання опинилися розрізненими і дрейфуючими - можливо, схильними до іноземної агресії. Однак одне залишається безсумнівним: сонце, що сходить, остаточно померкло, і на його місце в Азії незабаром можуть прийти нові сили."
 japan_foreign_events.252.a: "Сонце згасає."

# Involving Anqing #
 japan_foreign_events.257.t: "Аньцін і Фентянь просять у нас допомогу"
 japan_foreign_events.257.d: "Кліка Аньцін, яка завдяки нашій допомозі нещодавно здобула перемогу над Лігою, звернулася до нас із проханням про допомогу. Фентяньський Уряд зобов'язався допомогти Аньціну в його відновленні, сподіваючись, що це переконає їх узяти участь у Війні за Повстання, щоб повернути Пекін. Якщо ми також візьмемо на себе таке зобов'язання, це, безсумнівно, поліпшить їхні шанси."
 japan_foreign_events.257.a: "Ми надамо ресурси"
 japan_foreign_events.257.b: "Це того не варте"

 japan_foreign_events.258.t: "Аньцін починає відновлюватися"
 japan_foreign_events.258.d: "З нашою допомогою, Аньцін почав відновлюватися."
 japan_foreign_events.258.a: "Гаразд"

 japan_foreign_events.259.t: "Аньцін відмовляється від своїх амбіцій"
 japan_foreign_events.259.d: "Аньцін відступив від від проєкту меліорації, а Фентянь прокреслив кордон на піску. Ми змушені були припинити посилати їм допомогу на відновлення."
 japan_foreign_events.259.a: "Так і бути"

 japan_foreign_events.260.t: "Аньцін відмовляється від своїх амбіцій"
 japan_foreign_events.260.d: "Аньцін відступив від від проекту меліорації, але Фентянь вирішив не знімати їх з відновлення, схоже, що вони можуть продовжувати працювати самостійно."
 japan_foreign_events.260.a: "Приємно чути"

 japan_foreign_events.261.t: "Аньцін відмовляється від своїх амбіцій"
 japan_foreign_events.261.d: "Аньцін відступив від проєкту меліорації, і в той час як Фентянь вирішив не знімати їх із процесу відновлення, Аньцін все одно відступив за власним бажанням."
 japan_foreign_events.261.a: "Утім, це все одно не мало сенсу"

 japan_foreign_events.262.t: "Анкінські сили захоплюють Ханчжоу"
 japan_foreign_events.262.d: "Оскільки розпад Ліги Восьми Провінцій переріс у хаотичну громадянську війну, контроль над важливими прибережними містами постійно змінювався. Однак, схоже, Чень Тяоюань зміг утримати контроль над містом Ханчжоу і, у скрутний для нього час, налагодив торговий шлях між його портом і Нагасакі. Хоча ми надавали певну підтримку протягом останніх кількох тижнів, тривалий контроль Анкіна над містом може дозволити нам зробити більший внесок, і, як потенційний колабораціоніст, допомога Чень Тяоюаню може виправдати інвестиції у довгостроковій перспективі."
 japan_foreign_events.262.a: "Надати їм деяку допомогу."
 japan_foreign_events.262.b: "Здається, це марна трата зброї."

 japan_foreign_events.263.t: "Японія пропонує спорядження"
 japan_foreign_events.263.d: "Завдяки нашому постійному утриманню портового міста Ханчжоу, ми забезпечили судноплавство до Японії та назад. Хоча досі їхня матеріальна підтримка була переважно непомітною, до нас звернулися з пропозицією щодо значно більшої поставки вогнепальної зброї. Хоча це спокуслива пропозиція, дехто висловив занепокоєння, що це може призвести до зростаючої залежності від Японії у постачанні зброї. Тим не менш, враховуючи наше нині мляве вітчизняне виробництво, це цілком може бути тим, що нам потрібно для відновлення порядку."
 japan_foreign_events.263.a: "Нам потрібна вся можлива допомога."
 japan_foreign_events.263.b: "Відмовитися, ми можемо обійтися без цього."

 japan_foreign_events.264.t: "Анкін Приймає Матеріальну Підтримку"
 japan_foreign_events.264.d: "Чень Тяоюань прийняв нашу пропозицію щодо додаткового спорядження, негайно."
 japan_foreign_events.264.a: "Будь ласка."

 japan_foreign_events.265.t: "Анкін Відхиляє Матеріальну Підтримку"
 japan_foreign_events.265.d: "Незважаючи на наші спільні інтереси, схоже, Чень Тяоюань відмовився від нашої пропозиції щодо додаткового спорядження."
 japan_foreign_events.265.a: "Їхня втрата."

### New Foreign Policy Events ###
 japan_foreign_events.316.t: "Японці просуваються в Тихому океані"
 japan_foreign_events.316.d: "Японський посол спокійно увійшов до кабінету [Root.GetLeader] з телеграмою. Японський флот відправили на Гаваї, і протягом кількох годин буде висаджено десант, щоб встановити 'кордон безпеки'.  Він заявив, що в інтересах жителів Тихого океану, щоб хаос, який охопив Америку, не поширився за межі її кордонів, і що японці візьмуть на себе ініціативу зі встановлення стабільності та миру. Він каже, що сподівається, що Америка співпрацюватиме в інтересах миру за океаном, і запрошує нас надіслати своїх представників для забезпечення мирної передачі влади. Це кричуще захоплення влади не залишилося непоміченим, але в умовах нинішніх заворушень в Америці наші провідні офіцери сумніваються у здатності гарнізону Гонолулу стримати сили вторгнення. Яструби в кабінеті міністрів наполягають на тому, що громадянська війна буде короткою і що наші люди зможуть протриматися до прибуття підкріплень. І що японці, найімовірніше, відступлять перед лицем американської впевненості. Інші закликають до спокою і сподіваються переконати [Root.GetLeader] почекати з помстою доти, доки Америка не стабілізується. Тепер президенту належить вирішити, чи слід наказати нашим тихоокеанським гарнізонам відступити чи ні. Очевидно, що його рішення може дуже добре вплинути на майбутнє вод."
 japan_foreign_events.316.a: "Ми обов'язково повернемося..."
 japan_foreign_events.316.b: "Всім до бою!"

 japan_foreign_events.317.t: "Американці здали Тихий океан"
 japan_foreign_events.317.d: "Перемога в Тихому океані! Американський уряд, який нині охоплений політичними заворушеннями і не має політичної волі, щоб утримати владу над Тихим океаном, вирішив визнати наше панування і передати контроль над своїми острівними базами. Хоча дехто в Америці називає це зрадою, їхні голоси досі заглушалися реальністю на місцях. Було відправлено делегацію для зустрічі з американськими офіційними особами в Гонолулу, щоб забезпечити мирне передання влади, і наші війська висадилися без жодного пострілу. Хоча американці наполягають, що це 'тимчасовий' захід, це, безсумнівно, величезна перемога для нас у нашому прагненні до розширення сфери впливу. Однак дехто в нашому уряді тихо задається питанням, чи не занадто далеко ми зайшли. Що якщо ми перестаралися? І що якщо американці повернуться, щоб помститися? Однак зараз немає часу для такого поразженства, Японія рухається вперед, і ми оберемо свою долю в Азії!"
 japan_foreign_events.317.a: "Subarashi!"

 japan_foreign_events.318.t: "Америка непохитна!"
 japan_foreign_events.318.d: "Ескалація кризи в Тихому океані! Незважаючи на хаос, що охопив Північну Америку, їхній впертий уряд відмовляється послабити свою хватку на Тихому океані, обіцяючи сувору відплату за будь-яку спробу порушити їхній суверенітет. Такого зарозумілого і жадібного ставлення можна було очікувати тільки від цих колонізаторів, але це ставить нас у скрутне становище. Хоча немає сумнівів у тому, що ми можемо захопити ці острови силою, дехто сумнівається у здатності нашого флоту утримувати ці острови понад кілька років. Сполучені Штати - це сила, на яку потрібно зважати, дехто називає їх сплячим гігантом. Але інші кажуть, що японський дух завжди полягав у тому, щоб кидати виклик труднощам, чи то утихомирення китайського дракона 1895 року, чи то вигнання росіян з Маньчжурії 1905 року. Втратити обличчя, навіть коли американці перебувають у найслабшому становищі, було б рівносильно капітуляції, назавжди прирікаючи японський народ на другорядну роль у Тихоокеанському регіоні. Отже, Японія перебуває на роздоріжжі - що ж країна висхідного сонця робитиме далі?"
 japan_foreign_events.318.a: "Tora! Tora! Tora!"
 japan_foreign_events.318.b: "Відкличте флот, терпіння - це чеснота"

 japan_foreign_events.401.t: "Запрошення від [From.GetNameDef]"
 japan_foreign_events.401.d.conf: "На Токійській конференції, японські офіційні особи порушили питання про глибші економічні зв'язки між їхньою та нашою країною. Тепер вони звернулися до [Root.GetAdjective]ому уряду, представивши свою пропозицію прийняти нас у те, що вони вважають економічною частиною своєї 'Сфери Співпроцвітання'. Вони кажуть, що ми вільні приєднатися або відмовитися, як ми побажаємо."
 japan_foreign_events.401.d.noconf: "Японський уряд звернувся до нас із пропозицією приєднатися до економічної частини їхньої 'Великої азіатської Сфери Співпроцвітання'. З його допомогою, ми б послабили обмеження для японських інвестицій у [Root.GetNameDef], і принесли б із цими інвестиціями певний ступінь процвітання та незалежності від 'західного імперіалізму'. Дехто, однак, каже, що це було б просто обміном західного імперіалізму на японський імперіалізм, і що ми повинні остерігатися відкриття скриньки, яку ми, можливо, не зможемо закрити знову."
 japan_foreign_events.401.a: "Ми згодні з їхньою пропозицією"
 japan_foreign_events.401.b: "Нам це не потрібно"

 japan_foreign_events.402.t: "[From.GetNameDefCap] погоджується"
 japan_foreign_events.402.d: "[From.GetAdjective]ий уряд бачить мудрість і економічні вигоди, які принесе включення в нашу економічну сферу. Вони погодилися з нашими умовами."
 japan_foreign_events.402.a: "Чудово"

 japan_foreign_events.403.t: "[From.GetNameDefCap] відмовляється"
 japan_foreign_events.403.d: "[From.GetAdjective]ий уряд, імовірно, побоюючись наших справжніх мотивів, відхилив нашу пропозицію щодо вступу в японську економічну сферу."
 japan_foreign_events.403.a: "Нерозумний вибір"

 japan_foreign_events.405.t: "Збільшення японських інвестицій"
 japan_foreign_events.405.d: "За активної підтримки [From.GetAdjective]ого уряду, інвестори з [From.GetNameDef] масово приїжджали в [Root.GetNameDef]. Їхня присутність матиме деякі переваги, це правда, але зростає страх, що це домінування [From.GetAdjective]ої економіки зрештою призведе до того, що ми станемо залежними від [From.GetAdjective]ого уряду... якщо ми ще не стали такими."
 japan_foreign_events.405.a: "Інвестиції означають більше грошей, правильно?"

 japan_foreign_events.406.t: "Інвестори будують фабрики"
 japan_foreign_events.406.d: "Японські інвестори в [Root.GetNameDef] були зайняті створенням нових фабрик - схоже, це відчутна вигода від нашої участі в Азійській сфері спільного процвітання."
 japan_foreign_events.406.a: "Гаразд!"

 japan_foreign_events.407.t: "[Root.GetAdjective]ий уряд підкоряється Японії"
 japan_foreign_events.407.d: "Якщо були побоювання з приводу триваючих інвестицій Японії в [Root.GetNameDef], що призводять до їхнього домінування, то їх можна відкласти вбік - це вже сталося. [Root.GetAdjective]а політика вже регулярно проводиться на догоду інтересам Японії, і будь-які думки про нашу незалежність поступово стають ввічливою фікцією. Приїзд кількох 'радників' з [From.GetNameDef], поклав кінець будь-яким думкам про те, що ми можемо діяти так, як захочемо, в рамках Сфери Співпроцвітання."
 japan_foreign_events.407.a: "Так і бути"

 japan_foreign_events.408.t: "[From.GetNameDefCap] виходить із нашого альянсу"
 japan_foreign_events.408.d: "По дурості, [From.GetAdjective]ий уряд вирішив розірвати свій військовий союз із нами. Схоже, вони відчувають, що зможуть впоратися без нашої допомоги."
 japan_foreign_events.408.a: "Подивимося"

 japan_foreign_events.409.t: "[From.GetNameDefCap] віддаляється від Сфери"
 japan_foreign_events.409.d: "Відчуваючи деякі ірраціональні побоювання з приводу того, що ми домінуємо над ними, [From.GetAdjective]ий уряд вирішив припинити свою участь в Азіатській Сфері Процвітання, розірвавши зв'язки між [From.GetAdjective]ою економікою та нашою."
 japan_foreign_events.409.a: "Як безглуздо"

 japan_foreign_events.410.t: "[From.GetAdjective]ий уряд націоналізує інвестиції"
 japan_foreign_events.410.d: "[From.GetAdjective]ий уряд зробив рішучий крок щодо насильницької націоналізації вкладених нами в [From.GetNameDef] інвестицій, а також відмовився від свого місця в Сфері Співпроцвітання під час цього процесу. Можливо, їх турбує перспектива японського контролю над своєю економікою? Якщо так, то вони дали нам привід для вторгнення - якщо ми хочемо скористатися їхньою провокацією."
 japan_foreign_events.410.a: "Залишити їх"
 japan_foreign_events.410.b: "Слід дати їм урок!"

 japan_foreign_events.411.t: "[withdraw_country.GetNameDefCap] залишає економічну сферу"
 japan_foreign_events.411.d: "Приєднавшись до [withdraw_country.GetFactionName], [withdraw_country.GetNameDef] вже не можна вважати частиною нашої економічної сфери. Їм доведеться піти."
 japan_foreign_events.411.a: "Як безглуздо з їхнього боку"

 japan_foreign_events.412.t: "Віддалення від японської Сфери"
 japan_foreign_events.412.d: "З нашим приєднанням до [Root.GetFactionName] ми більше не можемо вважатися частиною економічної сфери Японії."
 japan_foreign_events.412.a: "Хай буде так!"

 japan_foreign_events.420.t: "Інвестори будують верф"
 japan_foreign_events.420.d: "Японські інвестори в [Root.GetNameDef] були зайняті будівництвом нової верфі - значний зиск від нашої участі в Азійській Сфері Співпроцвітання."
 japan_foreign_events.420.a: "Дуже добре!"

 japan_foreign_events.421.t: "Японія надсилає радників"
 japan_foreign_events.421.d: "Як частина плану з розвитку флоту, Японська Імперія відправила групу радників до нас, щоб допомогти у виконанні програми. Вони дуже освічені та спеціалізуються в безлічі аспектів, тож ми можемо направити їх туди, де вони справді необхідні."
 japan_foreign_events.421.a: "Направити їх на допомогу інженерам."
 japan_foreign_events.421.b: "Їхні знання тактики нам допоможуть."
 japan_foreign_events.421.c: "Практичний досвід у процесі тренувань буде вельми доречним."

 japan_foreign_events.422.t: "Перший корабель процвітання"
 japan_foreign_events.422.d: "Японські інженери, які прибули з [Root.GetNameDef], були зайняті навчанням наших робітничих верфей з виробництва сучасних японських вантажних кораблів, так звані "Кораблі процвітання" - значний зиск від нашої участі в Азійській Сфері Співпроцвітання."
 japan_foreign_events.422.a: "Чудові новини!"

 japan_foreign_events.423.t: "Японія бажає контролювати наші верфі"
 japan_foreign_events.423.d: "Японські генерали й адмірали цього ранку офіційно зажадали отримати контроль над усіма нашими верфями для своїх компаній. Вони пояснюють це тим, що під час війни морське виробництво має бути об'єднане під одним командуванням."
 japan_foreign_events.423.a: "Хай буде так."
 japan_foreign_events.423.b: "За кого вони себе вважають?"

 japan_foreign_events.424.t: "Японія повернула контроль над верфями"
 japan_foreign_events.424.d: "Оскільки наш спільний ворог упав, немає жодної законної причини для Японії контролювати наші верфі, тому вони повертають їх нам."
 japan_foreign_events.424.a: "Безумовно, несподіванка, але приємна."

 japan_foreign_events.425.t: "[From.GetNameDefCap] просить військово-морських радників"
 japan_foreign_events.425.d: "Цього ранку ми отримали запит від [From.GetNameDef], щоб ми направили групу радників до них для підтримки в розвитку морського виробництва."
 japan_foreign_events.425.a: "Справедливе прохання."
 japan_foreign_events.425.b: "Ми так не думаємо."

 japan_foreign_events.426.t: "Японія відхилила запит"
 japan_foreign_events.426.d: "На жаль, Японія відмовила нам у наданні радників."
 japan_foreign_events.426.a: "Шкода."

 japan_foreign_events.427.t: "[From.GetNameDefCap] відмовляє в наданні контролю над верфями"
 japan_foreign_events.427.d: "У досить зухвалій манері ми отримали відмову в контролі над тими самими верфями, які самі ж і будували. Хоча дипломатично було б нерозумно реагувати гостро, ми не забудемо цю зраду. Вони ще пошкодують про це."
 japan_foreign_events.427.a: "Теж мені союзники."

 japan_foreign_events.450.t: "Японія накладає ембарго на [Root.GetNameDef]!"
 japan_foreign_events.450.d: "Протягом кількох місяців, ми турбувалися про масштаби японських амбіцій та їхні агресивні дії в південній частині Тихого океану, і тепер у нас є на те причини. Вони заявили про свій намір спрямувати свою сферу впливу на негайне припинення торгівлі з [Root.GetNameDef], назвавши нас 'форпостом європейського колоніалізму та імперіалізму в Азії'. Не варто недооцінювати те навантаження, яке це може чинити на нашу економіку..."
 japan_foreign_events.450.a: "Переживемо"
 japan_foreign_events.450.b: "Вони хочуть торговельної війни!"
 japan_foreign_events.450.c: "Нам варто зблизитися з Японією"

 japan_foreign_events.451.t: "[From.GetNameDefCap] мститься нам!"
 japan_foreign_events.451.d: "[From.GetAdjective]ий уряд запровадив проти нас тарифи! Це дає нам саме той 'казус беллі', на який ми сподівалися!"
 japan_foreign_events.451.a: "Так, але не зараз..."
 japan_foreign_events.451.b: "Відповісти воєнними діями!"

 japan_foreign_events.452.t: "[From.GetNameDefCap] хоче зміцнити зв'язок з нами"
 japan_foreign_events.452.d: "У відповідь на наше ембарго, [From.GetAdjective]ий уряд попросив стати частиною нашої економічної сфери, вочевидь вважаючи, що краще працювати з нами, ніж проти нас."
 japan_foreign_events.452.a: "Так навіть краще!"

 japan_foreign_events.453.t: "[From.GetNameDefCap] нічого не робить"
 japan_foreign_events.453.d: "Боягузливий [From.GetAdjective]ий уряд вирішив нічого не робити у відповідь на наше ембарго. Вони мають намір просто витримати його. Якщо ми хочемо втягнути їх у війну, нам доведеться зробити це складним шляхом."
 japan_foreign_events.453.a: "Так і бути!"

 japan_foreign_events.455.t: "Японія планує напад"
 japan_foreign_events.455.d: "Ми зібрали розвіддані, які свідчать про те, що Японія прагне захопити нашу колонію в Голландській Ост-Індії. Наші військові експерти попереджають, що ми, можливо, не зможемо відбитися від такого вторгнення з огляду на стан японських та урядових військово-морських сил і чисельність японських військових. Вони пропонують нам звернутися до Кайзера і попросити його про допомогу: їхні інтереси, збереження статус-кво, зближення з нами, і японське захоплення також загрожуватиме їхнім володінням. Можливо, це наш найкращий шанс зберегти наше колоніальне володіння."
 japan_foreign_events.455.a: "Повідомити Берліну!"
 japan_foreign_events.455.b: "В цьому немає необхідності..."

 japan_foreign_events.456.t: "Нідерландці благають про допомогу"
 japan_foreign_events.456.d: "Нідерландці виявили докази того, що японці планують вторгнення в їхню колонію, розуміючи, що вони ніколи не зможуть захистити свою колонію за допомогою своєї значною мірою перевантаженої колоніальної армії та обмежених військово-морських засобів порівняно з Японією. Однак вони зазначають, що захоплення японцями їхньої колонії серйозно порушило б нашу власну оборонну ситуацію, і немає жодних сумнівів у тому, що японці прагнуть вигнати нас із цього регіону!"
 japan_foreign_events.456.a: "Ми вам допоможемо!"
 japan_foreign_events.456.b: "Вони не заслуговують на свої колонії..."

 japan_foreign_events.457.t: "Німеччина надсилає допомогу"
 japan_foreign_events.457.d: "Німці погодилися допомогти захистити Голландську Ост-Індію від нашої спільної японської загрози, яка прагне забрати в нас колонію."
 japan_foreign_events.457.a: "Піднімемо келихи за наших друзів!"

 japan_foreign_events.458.t: "Німеччина відмовляється захищати нас!"
 japan_foreign_events.458.d: "Німці дали нам знати, що не в їхніх інтересах давати захист нашим колоніальним володінням в Індії. Схоже, ми залишилися самі!"
 japan_foreign_events.458.a: "У нас вийде захистити Ост-Індію, правда ж??"

 japan_foreign_events.459.t: "[From.GetNameDefCap] сама по собі"
 japan_foreign_events.459.d: "Не маючи можливості або бажання отримати допомогу, [From.GetNameDefCap] тепер залишається сама. Їхні збройні сили становлять лише малу дещицю від наших, а їхні лідери слабкі; ніщо нас не зупинить."
 japan_foreign_events.459.a: "Banzai!"

 japan_foreign_events.460.t: "Інсуліндія чинить опір за підтримки Німеччини"
 japan_foreign_events.460.d: "Німці погодилися допомогти захистити Голландську Ост-Індію від нас! Поки ми ще можемо напасти, ми повинні добре подумати, чи готові ми розпочати таку війну."
 japan_foreign_events.460.a: "Ми непохитні"
 japan_foreign_events.460.b: "Можливо, час ще не настав"

 japan_foreign_events.461.t: "Японія використовує стратегію "Розділяй і володарюй""
 japan_foreign_events.461.d: "Схоже, що давні претензії Японії до легітимності нашого уряду, не кажучи вже про 'братню азійську співдружність', були не більше ніж словами. Зараз вони рухаються до стратегії 'розділяй і володарюй' для всього Китаю. Нашого Китаю. Хоча це і сигналізує про те, що війна з ними може розпочатися раніше ніж ми думаємо, це також зашкодило репутації Асоціації Конкордія, надавши нам більше простору для маневру."
 japan_foreign_events.461.a: "Вони пошкодують про це"

 japan_foreign_events.462.t: "Японія використовує стратегію "Спалити вщент""
 japan_foreign_events.462.d: "Чутки про зловживання японських військ щодо китайських цивільних осіб вже деякий час доходять до наших вух. Японське консульство в Мукдені завжди запевняло нас у тому, що вони перебільшені, а там, де такі злочини справді мали місце, їх було скоєно з вини недисциплінованих військ, і це скоріше виняток, ніж норма. Однак зараз Японія зробила немислиме. Вона не тільки відкрито заявила про свою підтримку цих жахливих злодіянь, а й класифікувала їх як частину офіційної стратегії. З таким безпрецедентним варварством не можна миритися, і ми не можемо дозволити собі, щоб нас зображували винними на асоціації з ними. На щастя, прояпонській Асоціації Конкордія буде важко пояснити це, і вона втратить вплив у нашому уряді."
 japan_foreign_events.462.a: "Нам слід замислитися над планом дій"

 japan_foreign_events.464.t: "Японія нагороджує нас за лояльність"
 japan_foreign_events.464.d: "У своїй глибокій мудрості японський уряд вирішив винагородити нашу вірність, повернувши землю, яка по праву належить нам. Звісно, ми раді такому жесту, але ми маємо бути обережними; зрештою, Асоціація Конкордія отримала велику підтримку, що ускладнить нам протистояння з Японією в майбутньому, якщо ми того забажаємо."
 japan_foreign_events.464.a: "Насамперед, ця земля має належати нам"

 japan_foreign_events.465.t: "Ворог має переважну силу"
 japan_foreign_events.465.d: "До теперішнього моменту стало відомо, що сила наших ворогів набагато перевершує нашу. Те, що починалося як чутки від нашої розвідки, тепер збулося. У той час як ми робитимемо все можливе для підтримки суспільної моралі, навіть наша найтвердіша опора починає сумніватися в тому, чи варто продовжувати боротьбу; чи не розтягуємо ми на цьому етапі невідворотне?"
 japan_foreign_events.465.a: "Має бути час, щоб усе виправити..."

 japan_foreign_events.466.t: "У нас є переважна сила"
 japan_foreign_events.466.d: "Як для нас, так і для Японії стає дедалі очевиднішим, що наші сили набагато переважають їхні. У міру того, як новини про це просочуються в японську громадськість, наростають заворушення, а підтримка їхнього уряду падає. Якщо ми збережемо цю перевагу, вони капітулюють навіть раніше, ніж ми сподівалися."
 japan_foreign_events.466.a: "Які чудові новини!"

 japan_foreign_events.467.t: "Японія Розширює Пропагандистські Операції"
 japan_foreign_events.467.d: "Завдяки своїм перемогам на полі бою проти Китайських армій-претендентів, зокрема захопленню Пекіна та Нанкіна, Японці закликають ворога скласти зброю та об'єднатися в мирі. Їхня пропаганда вихваляє [FNG.GetLeader] як єдиного лідера всього Китаю та висміює інших претендентів як дрібних воєначальників, зацікавлених лише у набиванні власних кишень. Хоча добра воля з боку Японії, безперечно, вітається, це лише підбадьорило проЯпонські голоси в нашому уряді, які вказують на ці події як на доказ того, що Японія є необхідним та надійним союзником."
 japan_foreign_events.467.a: "Зрозуміло."

### Korea Events ###
 japan_foreign_events.500.t: "Кітей Сон і Нан Сьору"
 japan_foreign_events.500.d: "Олімпійські ігри 1936 року пройшли, і у нас є привід для гордості. Наші спортсмени завоювали дев'ять медалей, встановивши новий національний рекорд, але деякі з наших переможців були... проблемними. Спортсмени Кітей Сон і Нан Сьору - або, як їх краще називати, Сон Кі-Чунг і Нам Сунг-Йонг - добре виступили в марафонському забігу, перший навіть посів перше місце, але загалом вони не проявили ентузіазму, належного підданим імператора. Вони опускали голови під час виконання національного гімну, ховали прапор на грудях і наполягали на тому, щоб їх називали корейцями, а не японцями, багато хто в нашій країні соромився їхньої поведінки, на відміну від популярного ставлення в Чосені, яке здебільшого підтримувало їхні дії. У результаті центральний уряд заборонив спортсменам брати участь у майбутніх змаганнях, а також встановив за ними спостереження. Було б шкода, якби їхню перемогу було використано для поширення нестабільності в імперії.\n\nМіністерство закордонних справ також спробувало забезпечити мінімальне співчуття за кордоном, подавши скаргу до уряду Ірландії та Міжнародного олімпійського комітету щодо передбачуваної нестачі турботи про те, щоб наші спортсмени належним чином представляли імперію. Вони поки не відповіли."
 japan_foreign_events.500.a: "Шкода."

### Puppet Military Exercise Event ###
 japan_foreign_events.550.t: "Спільні військові навчання з [JAP.GetNameDef]"
 japan_foreign_events.550.d: "З моменту встановлення дружнього уряду в Японії, наше Вище Командування прагнуло скористатися можливістю вивчити тактику колишніх Імперської армії та флоту Японії, особливо у сфері морських вторгнень та амфібійної війни. Найкращою пропозицією для цього були спільні навчання, які, крім того, були б корисними для [JAP.GetName] Сил Оборони, що відновлюються. Тож після місяців планування минулого тижня була проведена спільна операція. Під час 3-денних навчань підрозділ розміром у корпус був навчений висаджуватися та захоплювати ключові стратегічні точки поблизу берега і захищати новостворений плацдарм. Наші солдати брали участь у наступі, при цьому до кожної дивізії були прикріплені Японські радники з бойовим досвідом.\n\nКілька років тому навіть найбільш оптимістичні голоси не могли уявити, що наші дві армії зустрінуться на навчаннях, де вони стрілятимуть одне в одного лише в уяві, або що більш-менш успішні розмови з раптово підготовленими словниковими буклетами відбуватимуться в такій напрочуд дружній атмосфері."
 japan_foreign_events.550.a: "Сьоґі? Це фрукт чи... ?"

### Sino - Japanese War Events ###
 japan_foreign_events.600.t: "Японці наступають на Китай"
 japan_foreign_events.600.d: "Те, чого ми так довго боялися, нарешті настало. Довгий час японці жадібно дивилися на наші великі землі, користуючись нашими природними ресурсами і розділеною національною єдністю. Тепер вони тут у повному складі, це вторгнення перевірить нашу хоробрість і мужність, і ми не здригнемося. Японці - огидні варвари. До нас уже дійшли повідомлення про невимовні злочини, і можна тільки уявити собі долю своїх співвітчизників від рук огидних піратів. Західні держави, стурбовані подіями в Європі та Америці, кинули нас напризволяще.\n\nІ поки ми в небезпеці, хіба Китай не чинив опір і не давав відсіч загарбникам протягом століть? Наша цивілізація налічує 4 000 років - це свідчення нашої славної волі та рішучості. Ми чинитимемо опір їхньому вторгненню з найбільшою завзятістю і виженемо японців назад на їхні острови. Qilái! Ми більше не будемо розділені і не станемо рабами японських собак, зараз не той час!"
 japan_foreign_events.600.a: "Разом ми стоїмо - порізно ми падаємо."

 japan_foreign_events.601.t: "Китайці опираються нашому славному просуванню"
 japan_foreign_events.601.d: "Завдяки вмілим стратегічним операціям імператорських військ і зусиллям кожної людини, Японія здобуває постійні перемоги. З кожним днем китайські армії розпадаються і ламаються, і перемога - лише питання часу.\nКитайці, однак, чинять значний опір нашому звільненню. Вони не розуміють наших справжніх мирних намірів і прагнення до єдиного азіатського фронту проти німецького імперіалізму. Ходять навіть чутки, що якщо наше просування зайде досить далеко вглиб Китаю, китайці навіть зруйнують набережні Жовтої річки, жертвуючи життями сотень тисяч невинних співвітчизників. Такий обурливий і жорстокий акт ніколи не буде допущений ні людьми, ні Небом.\nПроте не варто сумніватися в силі та рішучості армії Його Імператорської Величності! Для нас велика честь померти за Його Величність, виконуючи справжнє призначення Японії - зібрати всю Азію під одним дахом."
 japan_foreign_events.601.a: "Tennōheika Banzai!"

 japan_foreign_events.602.t: "Війна опору проти японської агресії"
 japan_foreign_events.602.d: "Китай стоїть перед обличчям найбільшої національної небезпеки, і все ж за кожен втрачений сантиметр китайської землі лунає терміновий заклик до дії! Наші війська відважно чинять опір без застарілої зброї, нас кидають імперіалістичні держави - але з кожним днем японська військова машина страждає, не в силах зломити наш незламний дух. Солдати і громадяни, воєначальники і республіканці, поміщики і селяни - відкиньте свої чвари, бо настав час єдності! Жадібні варвари завжди заздритимуть нашій прекрасній країні, але вона їм не дістанеться. Ми здобудемо над ними перемогу, нехай китайський народ буде єдиний у боротьбі з бандитами - китайський народ нарешті звільниться від імперіалізму!"
 japan_foreign_events.602.a: "Ми будемо битися до смерті! Wansui!"

 japan_foreign_events.603.t: "Війна в Китаї"
 japan_foreign_events.603.d: "У міру ескалації війни в Китаї наші доблесні війська опинилися в невигідному становищі, незважаючи на чудове спорядження і підготовку. Наші командири на місцях уже почали сперечатися і сваритися, роблячи свої власні розбіжні ініціативи, які уряд у Токіо, а іноді навіть імператорський штаб не можуть стримати. Крім того, давнє суперництво між армією і флотом уже вилилося в китайську війну, оскільки флот відмовляється відправляти спорядження або навіть викидає його за борт у портах, залишаючи армії виловлювати його з води.\n\nТепер, коли ми збираємося просуватися далі в Китай, наші шляхи постачання пролягатимуть брудними стежками і через підступні гірські перевали, ця проблема може тільки посилитися. Ми повинні прагнути розв'язати внутрішні конфлікти й оптимізувати наші засоби ведення війни, інакше ми ризикуємо зазнати поразки перед обличчям слабшого супротивника."
 japan_foreign_events.603.a: "Shō ga nai..."

 japan_foreign_events.604.t: "Японська пропагандистська кампанія"
 japan_foreign_events.604.d: "Після захоплення Пекіна та Нанкіна Японці розширюють пропагандистські операції, закликаючи до миру в ім'я Пан-Азіатизму. Хоча ми знаємо, що вони говорять неправду, схоже, їхня риторика заразила наше населення."
 japan_foreign_events.604.a: "Прикро."

 japan_foreign_events.605.t: "Японська пропагандистська кампанія"
 japan_foreign_events.605.d: "Після захоплення Пекіна та Нанкіна Японці розширюють пропагандистські операції, закликаючи до миру та примирення між Японією та Китаєм, щоб усунути непорозуміння між «двома великими націями». Хоча ми знаємо, що вони говорять неправду, схоже, їхня риторика заразила наше населення, а також деяких у нашій армії."

 japan_foreign_events.606.t: "Японська пропагандистська кампанія"
 japan_foreign_events.606.d: "Після захоплення Пекіна та Нанкіна Японці розширюють пропагандистські операції, закликаючи до миру та того, щоб воєначальники склали зброю, щоб до Китаю знову прийшла єдність. Хоча ми знаємо, що вони говорять неправду, схоже, їхня риторика заразила наше населення, а також деяких у нашій армії."

 japan_foreign_events.470.t: "Велика Тихоокеанська війна"
 japan_foreign_events.470.d: "З часів Другої Американської Громадянської війни Японська Імперія практично безроздільно панувала в Тихому океані, і багато хто пророкував, що вона стане головною державою в регіоні, затьмаривши за впливом своїх американських і німецьких суперників. Відновивши свою військову і промислову міць після громадянської війни, американський уряд знову звернув свій погляд на Тихий океан, відкрито оскаржуючи домінування Японії, про що свідчать повідомлення про морські зіткнення між двома великими державами.\n\nНезважаючи на приголомшливі успіхи Японії на Тихому океані, тепер вона зіткнулася з найсерйознішим викликом для себе, так як промисловий джаггернаут Америки обтрушується від уламків громадянської війни і її військова машина знову оживає."
 worldnews_japan_vs_america_JAP: "Сонце не зайде над нами!"
 worldnews_japan_vs_america_JAP_allies: "Хай ми переможемо, і швидко!"
 worldnews_japan_vs_america_USA: "У хвилину слабкості ми оступилися, але не впали!"
 worldnews_japan_vs_america_USA_allies: "Ми стоїмо разом з орлом!"
 worldnews_japan_vs_america_GER: "Схоже, що Японія востаннє переступила межі дозволеного."
 worldnews_japan_vs_america_INT: "Імперіалісти б'ються між собою!"
 worldnews_japan_vs_america_neutralasia: "Баланс сил буде врегульований так чи інакше."
 worldnews_japan_vs_america_generic: "Чи зможе "Джаггернаут" протистояти домінуванню Японії?"

 japan_foreign_events.471.t: "Висхідне сонце"
 japan_foreign_events.471.d.default: "Ситуація в Японії була в критичному становищі відтоді, як були підписані угоди в Циндао. Цю азіатську країну один за одним турбували заворушення та економічні кризи. Безрезультатна відповідь на німецьку інтервенцію в Китай призвела до падіння авторитарного режиму Танаки. Однак Імперія Вранішнього Сонця змогла пережити всі негаразди і знову вирішила показати себе на політичній арені в Східній Азії.\n\nСьогодні весь світ дізнався про плани японського уряду перетворити Японію на одну з великих держав, навіть якщо для цього доведеться застосувати силу. Ці новини вже досягли Берліна. Кайзер і його міністри ще не висловили свою позицію щодо такої неприкритої загрози своїм колоніальним володінням."
 japan_foreign_events.471.d.defeated_in_china: "Могутня Японська Імперія тільки почала розправляти крила після падіння Берлінської біржі та панування Цин над Китаєм. Однак, в результаті запеклих боїв, Китай зміг розгромити японські війська і відстояти свою незалежність, повністю вибивши Японію з материка. Багато сторонніх спостерігачів пророкували японцям статус регіонального гегемона у Східній Азії, але такий різкий поворот подій сильно змінив їхню впевненість у цьому.\n\nУ нещодавньому публічному зверненні уряд Японії заявив, що поразка в Китаї була не більше, ніж 'маленькою негараздами', і що ця східна країна не має наміру відмовлятися від своїх домагань на статус великої держави. Час покаже, наскільки здійсненні їхні амбіції."
 japan_foreign_events.471.a: "Тривожно."

### Fengtian Events ###
 japan_fengtian_events.4.t: "Японія розпочала операцію Іті-го"
 japan_fengtian_events.4.d: "Сьогодні вранці глава японської військової місії в нашій країні оголосив, що наразі між номінальними урядами Китаю оголошено стан війни, маючи на увазі, що Японія збирається відігравати активну роль у нестабільній політичній сфері Китаю. Оскільки Квантунська армія діє і захищає японські інтереси в Маньчжурії, нашому уряду наказано вжити термінових заходів для забезпечення японських потреб у постачанні та військових потребах.\n\nБа більше, ми повинні взяти участь у війні Японії з Китаєм. Японський уряд неясно висловив своє ставлення до японських планів щодо Китаю, але він запросив нас узяти участь у їхньому Великому Паназіатському Альянсі. Щоб сприяти миру і безпеці в Азії і перешкодити західним імперіалістам і далі використовувати Китай у своїх інтересах, Японія закликала нас приєднатися до боротьби проти китайського уряду. Хоча це означає, що ми будемо боротися проти наших співвітчизників-китайців разом із японцями, не схоже, що в нас є великий вибір, зважаючи на присутність і загрозу Японії так близько до дому."
 japan_fengtian_events.4.a: "Дуже добре."

 japan_fengtian_events.5.t: "Принц Канін готується відвідати Фентянь"
 japan_fengtian_events.5.d: "Принц Канін Котохіто, двоюрідний дід Імператора, повідомив уряд про свій намір здійснити державний візит до уряду [FNG.GetLeader] у Маньчжурії. Це не перший візит Принца до [716.Controller.GetVictoryPointName_11771], але з огляду на амбіції Фентяня поширити своє правління на весь Китай, що здається все більш імовірним, Принц висловив особистий інтерес в огляді готовності їхнього уряду до цієї боротьби.\n\nХоча уряд, звичайно, схвалив прохання Принца і вже почав готуватися до деталей його візиту, багато хто побоюється, що він може бути не зовсім звичайним. Як, на жаль, багато хто усвідомив останніми роками, Китай сповнений радикальних елементів, і особливо у Фентяні багато хто з них не упустить можливості завдати шкоди члену Японської королівської родини. Щоб запобігти цьому, точні деталі та маршрут мають бути суворо засекречені, і через консульство у [716.Controller.GetVictoryPointName_11771] було надіслано лист, який попереджає [FNG.GetLeader], щоб він не зірвав це, висловлене, звісно, максимально дипломатично."
 japan_fengtian_events.5.a: "Візит Принца пройде без сучка і задирки, якщо Чжан знає, що для нього добре."

 japan_fengtian_events.6.t: "Фентянь Достроково Скасовує Візит Принца"
 japan_fengtian_events.6.d: "Посилаючись на потенційно розкриту змову з метою вбивства Принца Каніна, Уряд Фентяня раптово скасував решту візиту Принца до Маньчжурії. Протягом кількох годин Принц повертався на кораблі, що прямував до Японії, причому, як повідомляється, Принц висловлював усім, хто готовий був слухати, своє зневагу до нездатності [FNG.GetLeader] забезпечити продовження його туру."
 japan_fengtian_events.6.a: "Хоча прикро, принаймні він не постраждав."

 japan_fengtian_events.7.t: "Візит Принца Скасовано Достроково"
 japan_fengtian_events.7.d: "Оскільки Уряд Фентяня зараз перебуває у стані війни, було прийнято спільне рішення про скасування візиту Принца до нації. Хоча скасування, звичайно, насамперед пов'язане з міркуваннями безпеки, Принц буде потрібен удома в Японії, щоб допомогти координувати плани допомоги Фентяню в його наступах."
 japan_fengtian_events.7.d_FNG: "Оскільки Уряд Фентяня зараз перебуває у стані війни, було прийнято спільне рішення про скасування візиту Принца до нації. Скасування, звичайно, насамперед пов'язане з міркуваннями безпеки, причому оточення Принца поспішно евакуювали назад до Японії, тепер, коли ми перебуваємо з ними у стані війни."
 japan_fengtian_events.7.a: "Шкода, але це зрозуміло."

 japan_fengtian_events.8.t: "Принц Канін Повертається до Японії"
 japan_fengtian_events.8.d: "На полегшення, і значне здивування, більшої частини уряду, Принц Канін Котохіто завершив свій тур по територіях Уряду Фентяня без будь-яких серйозних ускладнень. Після повного огляду головних міст Уряду та його військових об'єктів, Принц повернувся додому до Японії кораблем, який прибув пізно ввечері минулої ночі.\n\nНе гаючи часу, Принц склав короткий звіт про свої спостереження під час візиту. Хоча він, звичайно, залишався дуже ввічливим щодо недоліків Фентяня протягом свого візиту, те саме не стосується його звіту. Описуючи у великих деталях військові, соціальні та навіть економічні недоліки держави [FNG.GetLeader], звіт зрештою ставить під сумнів, чи зможе Фентянь навіть утримати контроль над Маньчжурією, не кажучи вже про решту нації."
 japan_fengtian_events.8.a: "Що ж, завжди могло бути й гірше."

 japan_fengtian_events.9.t: "Принц Канін Повертається до Японії"
 japan_fengfian_events.9.d: "На полегшення, і значне здивування, більшої частини уряду, Принц Канін Котохіто завершив свій тур по територіях Уряду Фентяня без будь-яких серйозних ускладнень. Після повного огляду головних міст Уряду та його військових об'єктів, Принц повернувся додому до Японії кораблем, який прибув пізно ввечері минулої ночі.\n\nНе гаючи часу, Принц склав короткий звіт про свої спостереження під час візиту. Досить шокуюче, звіт містив майже лише похвалу режиму Фентяня та велику похвалу чудовому лідерству [FNG.GetLeader]. Схоже, Принц високо впевнений, що за винятком надзвичайних обставин, Фентянь незабаром зможе поширити своє правління на весь Китай. На довершення всього, схоже, Принц особисто домовився про невеликий подарунок для Фентяня як «подяку» за відмінну забезпечену йому безпеку."
 japan_fengtian_events.9.a: "Схоже, він отримав задоволення."

 japan_fengtian_events.10.t: "Невдала Спроба Вбивства Принца Каніна!"
 japan_fengtian_events.10.d: "Схоже, побоювання багатьох в уряді здійснилися, і була здійснена спроба вбивства Принца Каніна Котохіто під час його туру по територіях Уряду Фентяня. Хоча це, звичайно, катастрофічна новина, є принаймні одна втішна обставина, оскільки Принц пережив цей жорстокий вчинок відносно неушкодженим. Після швидкого лікування Японським медичним персоналом, надісланим супроводжувати його на випадок, якщо така подія станеться, схоже, що Принц одужує напрочуд швидко.\n\nНовина про цю невдалу спробу вбивства надзвичайно швидко дійшла до [JAP.Capital.GetCapitalVictoryPointName], викликавши хвилю гнівних вимог протягом ночі про голову [FNG.GetLeader], бажано на срібному блюді. Коли почало світати, ці вимоги почали зміщуватися до більш розумного заклику тимчасово припинити Японську допомогу Фентяню як покарання за їхню зухвалість. Проте ці заклики не є загальними, і дехто, навпаки, стверджує, що таке суворе покарання союзника просто завдасть шкоди Японським інтересам у довгостроковій перспективі, і виступає лише за символічне засудження. Схоже, необхідно прийняти виконавче рішення щодо того, як реагувати."
 japan_fengtian_events.10.a: "Вони мають бути покарані за цю зухвалість!"
 japan_fengtian_events.10.b: "Вони просто зробили все можливе."

### News Events ###
 japan_news.1.t: "Крах Японської імперії" # (!)
 japan_news.1.d: "Безпрецедентно зростаюча Азійська держава, Японська імперія, оголосила, що вона офіційно здала всі свої сили на Рідних Островах з огляду на їхню нещодавню капітуляцію. Упертий і войовничий народ Японії не звик підкорятися, але, зіткнувшись із знищенням, вони, безсумнівно, вирішили врятувати свою країну від подальшого руйнування. Колись вважалася головною промисловою нацією в Тихому океані, яка могла похвалитися одним із найсучасніших флотів та армій світу, поразка Японців призвела до остаточного розпаду їхньої сфери. Перед обличчям такої нищівної поразки, різні члени Сфери Спільного Процвітання залишилися розсіяними та збитими з пантелику — можливо, схильними до іноземної агресії. Одне залишається певним, однак, і це те, що сонце, що сходить, нарешті згасло, і разом з ним нові сили в Азії можуть незабаром зайняти його місце." # (!)
 japan_news.1.a: "Сонце згасло." # (!)

 japan_news.2.t: "Велика Тихоокеанська війна" # (!)
 japan_news.2.d: "З часів Другої громадянської війни в Америці Японська імперія стояла практично беззаперечно у Тихому океані, причому багато хто передбачав, що вона стане головною силою в регіоні, затьмаривши своїх Американських та Німецьких суперників у впливі. Відновивши свою військову та промислову міць після громадянської війни, Американський уряд знову націлився на Тихий океан, відкрито кидаючи виклик домінуванню Японії — з повідомленнями про військово-морські бої між двома великими державами.\n\nНезважаючи на гучні успіхи Японії по всьому Тихому океану, вона стикається зі своїм найбільшим викликом, оскільки промисловий джаггернаут Америки струшує з себе уламки Громадянської війни та її військова машина знову оживає." # (!)
 japan_news.2.a.JAP: "Сонце не зайде над нами!" # (!)
 japan_news.2.a.JAP_allies: "Нехай ми переможемо, і швидко!" # (!)
 japan_news.2.a.USA: "У момент слабкості ми спіткнулися, але не похитнемося!" # (!)
 japan_news.2.a.USA_allies: "Ми стоїмо з орлом!" # (!)
 japan_news.2.a.GER: "Схоже, Японія востаннє переступила свої межі." # (!)
 japan_news.2.a.INT: "Імперіалісти сперечаються між собою!" # (!)
 japan_news.2.a.neutralasia: "Баланс сил буде встановлено так чи інакше." # (!)
 japan_news.2.a.generic: "Чи зможе джаггернаут протистояти домінуванню Японії?" # (!)

 japan_news.3.t: "Сонце, що Сходить" # (!)
 japan_news.3.d.default: "Ситуація в Японії була критичною з часів Циндаоського договору, затьмарена численними економічними кризами та заворушеннями. Їхня неефективна реакція на Німецькі інтервенції в Китаї призвела до краху автократичного режиму Танаки. Однак Імперії Сонця, що Сходить, вдалося відновити свої позиції як регіональної сили, обмеженої Східною Азією.\n\nСьогодні Японське керівництво оголосило про новий план захопити своє місце серед Великих Держав, силою, якщо це буде визнано за необхідне. Ця новина вже почала доходити до Берліна, але Кайзер та канцелярія ще не відповіли на цю неприховану загрозу щодо їхніх колоніальних володінь." # (!)
 japan_news.3.d.defeated_in_china: "Могутня Японська імперія лише почала розправляти крила влади після краху Берлінської фондової біржі та домінування Цін над Китаєм. Однак, у приголомшливому повороті подій, Китаю вдалося здолати Японські сили по всій Кореї та повністю витіснити їх з материка. Багато спостерігачів до цього моменту погодилися б, що Японія стане домінуючою силою у Східній Азії, але це залишається незрозумілим після їхньої катастрофічної поразки.\n\nУ недавньому публічному зверненні керівництва Японії, здається, вони не стурбовані цією «незначною незручністю» та оголосили про свої плани знову стати великою державою. Лише час покаже, чи зможе Японія справді здійснити свої амбіції." # (!)
 japan_news.3.a: "Тривожно." # (!)

 japan_news.4.t: "Невдалий Військовий Переворот у Токіо" # (!)
 japan_news.4.d: "Шокуючі новини з Японії. Сьогодні радикальні елементи Імперської армії на чолі з ультрамонархістами та націоналістами здійснили спробу путчу проти хиткого демократичного уряду в Токіо. Незважаючи на захоплення контролю над ключовими державними апаратами та будівлями по всій столиці, Імператор відверто відмовився підтримати фракцію, що призвело до майже неминучого краху перевороту протягом кількох годин.\n\nНизка старших армійських офіцерів та їхніх прихильників вчинили ритуальне самогубство через ганьбу. Ключовий елемент демократії був збережений у Східній Азії, принаймні наразі." # (!)
 japan_news.4.a: "Японська демократія виживає." # (!)

 japan_news.5.t: "Доля Японської Імператорської Родини" # (!)
 japan_news.5.d.exile: "Після зміни режиму в колишній Японській імперії доля Імператорської Родини Ямато залишалася невизначеною — до вчорашнього дня. З завершенням першого Конгресу Народної Республіки Японія було вирішено, що Родині Ямато не буде дозволено залишатися в Японії. Сьогодні Родина Ямато відплила з Токіо на океанському лайнері, прямуючи до Америки, до життя у вигнанні.\n\nЦей крок викликав страйк у Токійській гавані, а також протести у більшості великих міст, але очікується, що ситуація нормалізується через кілька місяців." # (!)
 japan_news.5.d.abolishsocialist: "Після зміни режиму в колишній Японській імперії доля Імператорської Родини Ямато залишалася невизначеною — до вчорашнього дня. З завершенням першого Конгресу Народної Республіки Японія було вирішено скасувати титули та статус Імператорської Родини — від сьогодні Родина Ямато має статус громадян, не відрізняючись від своїх колишніх підданих.\n\nЦей крок викликав страйк у центрі Токіо, а також невеликі протести в Осаці та Нагасакі, але очікується, що ситуація нормалізується протягом місяця." # (!)
 japan_news.5.d.abolishdem: "Після зміни режиму в колишній Японській імперії доля Імператорської Родини Ямато залишалася невизначеною — до вчорашнього дня. Відповідно до вимог [JAP.overlord.GetNameDef], Імператорський інститут було скасовано, а Імператорську Родину позбавлено всіх титулів та статусу — від сьогодні Родина Ямато має статус громадян, не відрізняючись від своїх колишніх підданих.\n\nЦей крок викликав страйк у центрі Токіо, а також невеликі протести в Осаці та Нагасакі, причому широка громадська опозиція, ймовірно, стане постійною ознакою перебування нового уряду при владі, незалежно від того, як довго це триватиме." # (!)
 japan_news.5.d.symbol: "Після зміни режиму в колишній Японській імперії доля Імператорської Родини Ямато залишалася невизначеною — до вчорашнього дня. З завершенням спеціальної сесії Парламенту [JAP.GetName] було вирішено, що Імператор, як символ Держави та Японського народу, і в ширшому сенсі, Імператорська Родина можуть виконувати публічні та офіційні обов'язки, але не матимуть жодної ролі в новому уряді.\n\nЩоб підкреслити це, у надзвичайній радіопромові Імператор [JAP.GetLeader] публічно відмовився від власної божественності, наголошуючи, що зв'язки між Троном та народом завжди ґрунтувалися на взаємній довірі та прихильності, а не на простих міфах чи легендах." # (!)
 japan_news.5.d.abdicate: "Після зміни режиму в колишній Японській імперії доля Імператорської Родини Ямато залишалася невизначеною — до вчорашнього дня. З завершенням спеціальної сесії Парламенту [JAP.GetName] було вирішено, що Імператор, як символ Держави та Японського народу, і в ширшому сенсі, Імператорська Родина можуть виконувати публічні та офіційні обов'язки, але не матимуть жодної ролі в новому уряді.\n\nВ інтерв'ю міжнародній пресі, принц-регент Такамацу наголосив, що незважаючи на загальнонаціональний ступор, викликаний зреченням покійного Імператора, це необхідний крок для забезпечення довготривалого періоду миру та відновлення зв'язків між Японією та її колабораціоністами." # (!)
 japan_news.5.a: "Одна ера закінчується, інша починається." # (!)

 japan_news.6.t: "Реставрація Сьова" # (!)
 japan_news.6.d: "Повідомлення з Токіо за останні кілька тижнів були мізерними, але тепер мало хто може сумніватися, що Японська демократія мертва. Після того, як уряд не зміг придушити синдикалістський рух, що зароджувався в країні, консервативні офіцери здійснили державний переворот, усунувши Прем'єр-міністра та встановивши військову диктатуру. Але навіть це виявилося тимчасовим — офіцери, узгоджені з конкуруючою фракцією Реставраціоністів, розпочали контрпереворот.\n\nПоки вулиці найбільшого міста Азії залиті кров'ю, вони оголосили Реставрацію Сьова — відновлення абсолютної влади Імператора та відродження Японії, вільної від згубного впливу Синдикалізму, демократії та Заходу." # (!)
 japan_news.6.a: "Sonnō tōkan! (Шануймо Імператора, проженемо варварів!)" # (!)
 japan_news.6.b: "О ні..." # (!)

 japan_news.7.t: "Військовий Переворот у Японії" # (!)
 japan_news.7.d: "Повідомлення з Токіо за останні кілька тижнів були мізерними, але тепер виявляється, що Японська демократія мертва. Після років внутрішніх чвар, скандалів та корупції серед політичних партій, радикальні офіцери-реставраціоністи здійснили державний переворот, прагнучи перетворити країну на ультранаціоналістичний режим. Зрештою, схоже, їхні зусилля були марними — війська, лояльні до уряду, змогли здійснити контрпереворот та успішно розгромити повстанців.\n\nПроте цей епізод безсумнівно показав слабкість партій. Японія фактично перетворилася на військову диктатуру, з націоналізмом, корпоратизмом та мілітаризмом як керівними принципами." # (!)
 japan_news.7.a: "Банзай!" # (!)
 japan_news.7.b: "О ні..." # (!)

### Characters ###
 JAP_arahata_kanson: "Арахата Кансон"
 JAP_arahata_kanson_leader_desc: "§YНародився:§! §L14 серпня 1887 року в Йокогамі, Префектура Канагава, Японська імперія§!\n§YПоходження:§! §LПерший Голова Народної Республіки Японія, Арахата Кансон, обійняв посаду під час негайної зміни політичного ландшафту нації. Бувши заарештованим під час Інциденту з Червоним Прапором, Арахата мусив приховувати свої просоціалістичні тенденції, пізніше створивши соціалістичне підпілля для лівих активістів. Кажуть, Арахата може бути відповідальним за все радикальне ліве насильство проти Імперського режиму.§!"

