 JAP_shared_modernisation_1_desc: "Незважаючи на відмінності у доктрині та стратегії між прихильниками теорій Довгої та Короткої війни, обидві сторони сходяться на кількох фундаментальних моментах, таких як необхідність Армії забезпечити ранні перемоги та територіальні здобутки, щоб або змусити ворога до мирних переговорів, або створити оборонну лінію проти сильнішого супротивника, а також сильний акцент на агресії, розглядаючи відступ як неприпустимий результат. Завдяки цим спільним цілям Армія зможе здійснювати модернізацію на послідовній основі."
