### Japan LKMT Puppet Tree ###
 JAP_white_dawn_eclipses_red_sun: "Білий світанок затьмарює Червоне сонце"
 JAP_white_dawn_eclipses_red_sun_desc: "Вперше в історії Японії Японія опиняється в окупації та під владою колись нижчої Китайської нації та народів. Китайський Гоміндан сповнений рішучості перетворити та реорганізувати Японію на нову антиімперіалістичну державу, керовану Трьома принципами народу."
 JAP_total_demobilisation: "Повна демобілізація"
