### Focuses - Political - Base ###
 JAP_NSA_focus: "Закон про національну безпеку"
 JAP_NSA_focus_desc: "Бурхливі обговорення закону про національну безпеку ось уже кілька тижнів стрясають стіни будівлі парламенту. Консервативні парламентарії побоюються, що в разі неприйняття закону, радикали спробують захопити владу. Прийшла пора вирішити, яким курсом піде імперія. Майбутнє Японії в наших руках."

### Focuses - Political - Democratic ###
 JAP_protect_constitutional_government: "Захистити конституційний уряд"
 JAP_protect_constitutional_government_desc: "Японія є маяком сучасності в Азії, і наш народ довго насолоджувався стабільністю, яка є предметом заздрості та натхнення для багатьох на континенті. На жаль, недавні події виявили тріщини в наших молодих інститутах. Ми маємо попрацювати, щоб відновити довіру народу до нашого уряду... і забезпечити кращу безпеку для обраних народом представників, щоб такі події, як Інцидент 15 травня, ніколи більше не повторилися."
 JAP_civil_servant_purge: "Чистка державних службовців"
 JAP_civil_servant_purge_desc: "Якщо ми хочемо викорінити будь-яку і всі небезпеки від соціалістичних радикалів, вкрай важливо почати з нейтралізації будь-якої політичної влади, яку вони можуть мати. І хоча деякі більш помірковані голоси відкидають ці побоювання як перебільшені, ми не можемо дозволити собі ризикувати: наш адміністративний апарат має бути ретельно очищений від будь-яких ідеологічно небажаних елементів."
 JAP_promote_conciliation_unions: "Просувати примирні профспілки"
 JAP_promote_conciliation_unions_desc: "Хоча здорова демократія повинна дозволяти робітникам організовуватися для кращих умов, дозвіл профспілкам діяти з невеликим наглядом швидко призведе до того, що фабрики перетворяться на розсадники радикальної ідеології. Щоб запобігти виходу профспілкової діяльності з-під нашого контролю, ми повинні сприяти примиренню з трудовими організаціями, які відкидають класову боротьбу, і заохочувати роботодавців створювати та контролювати власні компанійські профспілки."
 JAP_investigate_corruption: "Розслідувати корупцію"
 JAP_investigate_corruption_desc: "Після ретельного обстеження виявляється, що багато хто в нашій місцевій адміністрації йшли на поступки іншим партіям в обмін на подарунки чи послуги. Що ще гірше, попередній уряд Сейюкай явно дуже співпрацював із могутніми людьми, з якими деякі його високопосадовці були особисто знайомі, закриваючи очі на деякі тіньові угоди в обмін на їхню постійну підтримку. Така нечесність неприпустима, і ми повинні почати боротися з нею зараз."
 JAP_peace_preservation_laws: "Закони про збереження миру"
 JAP_peace_preservation_laws_desc: "Хоча ліберальні партії відбивалися від Закону про збереження миру генерала Танаки більше десяти років тому, недавні події показали, що навіть у демократичній системі потрібна сильна рука для захисту її інститутів від радикальних загроз. Як останній крок у захисті Японського парламентаризму, Закон про національну безпеку буде змінено, щоб полегшити боротьбу з будь-ким, хто загрожує Національній Сутності Японії, починаючи, звісно, з відомих синдикалістів та анархістів."

 JAP_rebuild_public_faith: "Відновити суспільну довіру"
 JAP_rebuild_public_faith_desc: "Оскільки країна страждає від нестабільності та економічних труднощів, не дивно, що люди втрачають довіру до істеблішменту. Вкрай важливо, щоб ми працювали над відновленням підтримки демократичних інститутів, не за допомогою залякування чи цензури, а за допомогою дипломатії. Інтерв'ю у пресі, виконання передвиборчих обіцянок та заохочення обраних посадових осіб до спілкування зі своїми громадами забезпечать, що з часом буде відновлено здоровий політичний клімат."
 JAP_rural_outreach: "Робота з сільською місцевістю"
 JAP_rural_outreach_desc: "Поряд із процвітаючими промисловими центрами Японії, є й небажані побічні ефекти. На даний момент сільська місцевість залишена позаду, дехто тяжко працює в умовах, непридатних для двадцятого століття. Хоча радикальна земельна реформа була б безглуздою, кращий захист орендарів, а також забезпечення доступності сучасного сільськогосподарського обладнання для тих, хто працює на землі, допоможе полегшити їхній тягар."
 JAP_elite_mediation: "Посередництво еліти"
 JAP_elite_mediation_desc: "Щоб відновити владу нашого уряду, ми маємо десь знайти союзників. На щастя, Сейюкай має у своїх лавах багато людей із впливовими зв'язками з багатими та могутніми людьми Японії. Дехто може назвати це клієнтелізмом, але ці люди є патріотами, які наполегливо працюють на Японську націю, і вони, безумовно, будуть вдячні, якщо ми надамо їм деякі поступки."
 JAP_ties_to_the_zaibatsu: "Зв'язки з дзайбацу"
 JAP_ties_to_the_zaibatsu_desc: "Якщо Японська промисловість процвітає, то значною мірою завдяки дзайбацу. Завдяки зв'язкам, які багато з них мають із нашою партією, ми можемо розвивати взаємовигідні стосунки, що забезпечують нам легітимність, тоді як наше постійне покровительство, у свою чергу, буде корисним для подальшого зростання нашої економіки."

 JAP_reorganise_public_finance: "Реорганізувати державні фінанси"
 JAP_reorganise_public_finance_desc: "Період так званого «втраченого десятиліття» серйозно позначився на наших державних фінансах. Заходи жорсткої економії призвели до втрати державного фінансування для будь-яких інвестицій та державних послуг. Починаючи з цього моменту, ми будемо прагнути підтримати мляві галузі, будувати лікарні та субсидувати виробництва по всій країні."
 JAP_support_from_unions: "Підтримка від профспілок"
 JAP_support_from_unions_desc: "У міру зростання промислового ядра Японії зростала й нерівність між простим робітником та власником фабрики. Нарікання реакціонерів та консерваторів, профспілки є лише логічним способом для пригноблених робітників забезпечити кращі умови від своїх роботодавців. Замість того, щоб ворогувати з ними, спробуймо заручитися їхньою підтримкою, вислухавши їхні вимоги."
 JAP_protection_for_tenants: "Захист орендарів"
 JAP_protection_for_tenants_desc: "Багато хто, хто працює на землі в сільській місцевості Японії, залишається безземельним і ледве зводить кінці з кінцями. Хоча ґрунтовна земельна реформа вимагатиме багато часу для досягнення, захист законних прав тих, хто працює на землі, та забезпечення належної допомоги у будь-якій суперечці з орендодавцями допоможе нам завоювати підтримку значної частини селянства."
 JAP_building_the_mass_party: "Побудова масової партії"
 JAP_building_the_mass_party_desc: "Завдяки своєму недавньому сплеску популярності та доведеній дипломатичній майстерності, Мінсейто прагне перетворитися на справжню масову партію. На противагу корумпованій та елітарній Сейюкай, вони представляють простий народ Японії, а не корумповану еліту, яка хоче обмежити їхні права. Отже, переговори про підтримку з іншими організаціями та заохочення більшої активності всередині партії сприятимуть її подальшому зростанню."

 JAP_parliamentary_socialism: "Парламентський соціалізм"
 JAP_parliamentary_socialism_desc: "Те, що багато хто називає неймовірним переворотом, Партія Сякай Тайшюто вийшла з загальних виборів як великий переможець. Партія прагне представляти Японський робітничий клас та селянство, оскільки країна потребує підтримки трудящих мас. Обмовляні консерваторами як відверті синдикалісти, їхні цілі полягають лише у побудові Японії для багатьох, а не для небагатьох."
 JAP_utilise_the_peace_preservation_laws: "Використовувати Закони про збереження миру"
 JAP_utilise_the_peace_preservation_laws_desc: "Хоча попередні роки ми бачили, що Закони про збереження миру використовувалися проти багатьох у нашій партії, тепер ми можемо використати їх проти наших опонентів. Корумповані бюрократи Мінсейто та Сейюкай, які мають зв'язки з промисловцями, будуть під пильною увагою, і приватна власність більше не буде вважатися священною. Відтепер Японський робітник буде захищений будь-якими необхідними засобами."
 JAP_city_housing_projects: "Проєкти міського житла"
 JAP_city_housing_projects_desc: "Багато хто, хто проживає у великих містах Японії, не може дозволити собі належне житло, вдаючись до ночівлі в напівзруйнованих будинках або залишаючись у нетрях. Водночас ми не в змозі задовольнити попит на зростаючу кількість людей, які переїжджають до міст із сільської місцевості. Щоб забезпечити гідне життя якомога більшій кількості людей, уряд розробив масштабну програму державного житла."
 JAP_promote_artistic_expression: "Сприяти художньому самовираженню"
 JAP_promote_artistic_expression_desc: "Хоча все більше людей переїжджають до великих міських центрів, мало хто все ще може створювати або навіть цінувати мистецтво самостійно. Кіно, живопис, музика, театр... Необхідно надати фінансування для заохочення творчих починань художників-початківців та рекламувати їх нашому народу, щоб вони могли їх відчути. Наступні десятиліття Японські художники стануть відомими по всій Азії, а можливо, і в усьому світі."
 JAP_entrench_bureaucracy: "Закріпити нову бюрократію"
 JAP_entrench_bureaucracy_desc: "Завдяки своїм успіхам на останніх виборах, Мінсейто нарешті має достатньо важелів для здійснення кардинальних змін в адміністрації. Багато посад, які обіймали консерватори, будуть замість цього зайняті чиновниками з наших лав, готовими невтомно працювати на процвітання демократії в Японії. Сподіваємося, це також завдасть значного удару нашим опонентам у Сейюкай."
 JAP_primacy_of_the_diet: "Першість Парламенту"
 JAP_primacy_of_the_diet_desc: "Японія може пишатися тим, що є сяючим маяком демократії в Азії, і щоб зберегти полум'я лібералізму, ми маємо забезпечити, щоб парламент залишався центральним елементом прийняття урядових рішень. Посадові особи, яким Японці довірили свою долю, повинні мати можливість належним чином представляти їх, не будучи скутими консервативними аристократами чи роздутою бюрократією."

 JAP_divert_funding_to_military: "Перенаправити фінансування на військових"
 JAP_divert_funding_to_military_desc: "Хоча останнє десятиліття було здебільшого періодом економічних труднощів, можна з упевненістю сказати, що наша економіка нарешті повернулася на правильний шлях. Однією з перших речей, яку зробить переможна Сейюкай, буде виділення більшої частини бюджету на оборону, щоб забезпечити наше місце як найбільшої сили у Східній Азії на роки вперед."
 JAP_loosen_economic_regulations: "Послабити економічне регулювання"
 JAP_loosen_economic_regulations_desc: "Зі, здавалося б, віддаленою загрозою соціалістичного саботажу та постійно зростаючою кількістю нових ділових партнерів по всій Азії, настав час переглянути деякі економічні норми, запроваджені у попередньому десятилітті. Як зазначають деякі з наших найбільших прихильників, які є важливими підприємцями, підхід laissez-faire необхідний для продовження зростання економіки Японії, тоді як відмова від нього перешкоджатиме інноваціям та прибуткам."
 JAP_devotion_to_war_effort: "Відданість військовим зусиллям"
 JAP_devotion_to_war_effort_desc: "Наступне десятиліття буде десятиліттям війни, оскільки великі Європейські держави знову опиняться у відкритому конфлікті. Щоб Японія захистила своє законне місце у світі, кожен має зрозуміти, що у ці важкі часи їм доведеться працювати вдвічі більше, щоб забезпечити своїх співвітчизників, які воюють далеко від дому, бо вони хоробрі герої Японії, і для їхнього успіху жодні зусилля не будуть надто великими."
 JAP_cult_imperial_institution: "Культ Імператорського інституту"
 JAP_cult_imperial_institution_desc: "Більше, ніж просто номінальна фігура, Імператор представляє тисячоліття традицій та спільної ідентичності для народу Японії. Як представники Його Величності, наша мета також полягає в тому, щоб наш народ пам'ятав, що їхні жертви допомагають захистити саму сутність нашої нації від тих, хто прагне змінити її, на благо прийдешніх поколінь."
 JAP_towards_nationalist_mass_party: "До націоналістичної масової партії"
 JAP_towards_nationalist_mass_party_desc: "Створена антиосновною політикою, яка розходиться з істеблішментом у своїх партіях, Кокумін Домей стала новою, потужною націоналістичною силою в парламенті. Якщо дехто стверджує, що їхня перемога є кроком назад для демократії, вони наполягають на тому, що найбільше підходять для представлення народу, на відміну від млявих партій, які ледь не призвели до падіння нації до синдикалізму. Японський народ буде мобілізований і змушений підтримувати державу та армію у їхніх починаннях."
 JAP_dirigiste_economics: "Дирижистська економіка"
 JAP_dirigiste_economics_desc: "Оскільки Японія стає зростаючою силою на світовій арені, стало зрозуміло, що вона не може надійно довіряти іншим на світовому ринку, щоб ті були чесними, довготривалими партнерами. Що ще гірше, багато наших співвітчизників надають пріоритет наповненню власних кишень, а не потребам нації. Щоб гарантувати, що ми більше ніколи не будемо залишені напризволяще ринку, необхідна значна державна інтервенція в промисловість та банківську справу, щоб економіка працювала як добре налагоджений механізм."

### Focuses - Political - Centralism ###
 JAP_military_centralism: "Військовий централізм"
 JAP_military_centralism_desc: "Імператор відмовився підтримати уряд, державний переворот неминучий. Питання вже не 'чи буде?', а 'коли?' і 'хто?'..."
 JAP_create_cabinet_planning_board: "Створити Раду Кабінету Планування"
 JAP_create_cabinet_planning_board_desc: "Хоча ми позбулися старої системи, є кваліфіковані політики, які все ще є патріотами, що підтримують нашу справу. Створення ради кабінету планування допоможе забезпечити нашу владу та цілі для нації."
 JAP_budget_research_and_policy_section: "Секція досліджень бюджету та політики"
 JAP_budget_research_and_policy_section_desc: "Окремі міністерства довго боролися між собою за питання фінансування — настав час покласти край таким дрібним суперечкам. Створення нової секції для вирішення питань майбутнього бюджету та дослідження політики допоможе виправити наші проблеми, а також дозволить нам підтримувати наші довгострокові цілі для нації."
 JAP_expand_propaganda_agency: "Розширити Агентство Пропаганди"
 JAP_expand_propaganda_agency_desc: "Надаючи додаткове фінансування Агентству Пропаганди, ми можемо зробити так, щоб наше повідомлення лунало не лише по всій Японії, але й в Азії. Це починання буде необхідним у найближчі роки, щоб усі знали слово Імперії та прагнули його захищати."
 JAP_merge_small_ministries: "Об'єднати малі міністерства"
 JAP_merge_small_ministries_desc: "Малі та неефективні міністерства часто блокують шлях до більшого прогресу як нації та створюють непотрібну бюрократію. Щоб виправити це, буде запропоновано об'єднання кількох міністерств, хоча дехто в парламенті може виступити проти наших дій."
 JAP_promote_nationalist_education: "Сприяти націоналістичній освіті"
 JAP_promote_nationalist_education_desc: "Жодна нація не досягає величі з неписьменним населенням, проте навіть найкращі уми відхиляються від великої долі Японії. Щоб запобігти цьому, іноземні ідеали мають бути відкинуті на користь ідеалів братерства, які викладатимуться молоді, щоб вони могли залишатися на шляху, який приносить користь їм та їхнім співвітчизникам."
 JAP_rationalise_industrial_development: "Раціоналізувати промисловий розвиток"
 JAP_rationalise_industrial_development_desc: "Статус Японії як великої держави був викуваний війною та подальшими успіхами, як і інших націй, і це те, що ми не повинні забувати. Поки світ горить навколо нас, ми повинні швидко перетворити нашу економіку на ту, що орієнтована на війну, щоб нас не перевершили ті, хто прагне нас знищити."
 JAP_create_five_year_plan: "Створити П'ятирічний План"
 JAP_create_five_year_plan_desc: "Щоб підготувати наші майбутні плани, ми повинні реорганізувати нашу націю, щоб поставити її на один рівень з імперіалістами заходу, щоб створити нову потужну промисловість та армію у рамках підготовки до звільнення Азії від імперіалістів."
 JAP_reorganisation_of_aerial_industries: "Реорганізація авіаційної промисловості"
 JAP_reorganisation_of_aerial_industries_desc: "Повітряна міць — це майбутнє війни, і вона буде необхідною умовою для перемоги в ній. Швидкий розвиток нашої авіаційної промисловості забезпечить реалізацію цього майбутнього."
 JAP_develop_manchurian_resources: "Розвивати Маньчжурські ресурси"
 JAP_develop_manchurian_resources_desc: "Японії, на жаль, бракує власних природних ресурсів, але це можна виправити, інвестуючи у наших союзників, які мають їх вдосталь. Доки вони залишаються лояльними, подальші інвестиції у нашого союзника в Маньчжурії — це безпечна ставка — інвестиція, яка послужить нам обом."
 JAP_zabaitsu_contracts_focus: "Контракти з дзайбацу"
 JAP_zabaitsu_contracts_focus_desc: "Дзайбацу були дещо неприємністю щодо наших планів, бажаючи більшої автономії, ніж це справді необхідно. Тим не менш, вони все ще можуть бути корисними, і ми можемо укласти взаємовигідну угоду з ними, якщо вони безкорисливо служитимуть більшому благу нації."
 JAP_nationalise_the_railways: "Націоналізувати залізниці"
 JAP_nationalise_the_railways_desc: "Японія не може розвиватися, коли частини її власної залізничної системи перебувають під контролем приватного сектора. Вилучення її з рук бізнес-класу та повне підпорядкування нашому контролю значно допоможе нашим майбутнім військовим зусиллям."
 JAP_national_defence_state: "Національна оборонна держава"
 JAP_national_defence_state_desc: "Хоча Армія просунула багато своїх пропозицій, факт полягає в тому, що уряди приходять і йдуть, і наш прогрес може бути змитий у майбутньому. Щоб захиститися від такої можливості, ми створимо політичну партію, яка офіційно об'єднає Японський народ і слугуватиме інструментом для утримання Парламенту під контролем."

### Focuses - Political - Shōwa Restoration ###
 JAP_showa_restoration: "Реставрація Сьова"
 JAP_showa_restoration_desc: "З офіційним схваленням перевороту Його Величністю, реставрація була успішною! Однак, основа ще не закладена — захопити владу — це одне, а керування — це інше. Фракції Реставраціоністів вже сперечаються, і, щоб послабити напругу, Прем'єр Коное забезпечить, щоб справа реставраціоністів була об'єднуючою для всієї Японії."
 JAP_destroy_degenerative_individualism: "Знищити дегенеративний індивідуалізм"
 JAP_destroy_degenerative_individualism_desc: "Індивідуалізм — західний імпорт — безсумнівно, приносить егоїзм та небажання служити нації. Прояви його та його сестринських гасел — «демократія», «свобода», «рівність» — розбестили націю до її самого ядра. Настав час викорінити ці концепції та працювати над їхнім повним усуненням."
 JAP_eliminate_party_politics: "Усунути партійну політику"
 JAP_eliminate_party_politics_desc: "Ми віримо в єдність думки та дії, а не в нескінченні, розділяючі суперечки, які принесли руїну. Економіка може зростати, і держава процвітає, але це нічого не означатиме, якщо нація помре. Лише справа Реставраціоністів може повернути життя нації."

 JAP_work_through_the_dojinkai: "Працювати через Додзінкай"
 JAP_work_through_the_dojinkai_desc: "Політичний рух не може жити лише словами, і щоб забезпечити, що наш не перетвориться на неефективний короткочасний спалах, ми маємо чітко дати зрозуміти бізнесменам, бюрократам та кар'єрним політикам, які підтримують функціонування країни, що для них є місце за столом.\n\nНа щастя, Сьова Додзінкай робить саме це."
 JAP_one_country_one_party: "Одна країна, одна партія"
 JAP_one_country_one_party_desc: "Немає нічого більш дріб'язкового, ніж провінційна партійна політика. Було б набагато ефективніше, якби ми мали систему, в якій усі колишні політичні партії та їхні члени були поглинені Тайсей Йокусанкай, навіть у найвіддаленіших селах."
 JAP_rural_development: "Розвиток сільської місцевості"
 JAP_rural_development_desc: "Поза увагою, поза розумом більше не буде: тепер, коли регіональні магнати є частиною нашої адміністрації, ми можемо ризикнути у невідому досі сільську місцевість та принести Йокусан масам."
 JAP_work_with_the_elite: "Звернення до великого бізнесу"
 JAP_work_with_the_elite_desc: "Популістська риторика багатьох у нашій коаліції, яка закликає до обмеження впливу бізнесменів та землевласників та повної націоналізації промисловості, відштовхнула деяких із найвпливовіших та найяскравіших людей у нашій країні. Ми повинні дати зрозуміти, що їхня допомога все ще потрібна у наших зусиллях по створенню нової Японії."
 JAP_development_of_a_new_way: "Новий шлях"
 JAP_development_of_a_new_way_desc: "Один з ефектів збору всіх видатних діячів Японського бізнес-світу в одній кімнаті полягає в тому, що вони зрештою усвідомлюють, що ефективніше працювати разом, ніж конкурувати. Колективні петиції щодо скасування того чи іншого регулювання або залучення більшої кількості робітників на їхні фабрики є набагато ефективнішими, ніж підкуп, до якого вони звикли."
 JAP_continue_zaibatsu_ties: "Послуга між друзями"
 JAP_continue_zaibatsu_ties_desc: "Дзайбацу є ключем до підтримки постійного зростання Японії, і їхня покірність має бути достатнім доказом їхньої доброї волі. В інтересах країни ми повинні продовжувати це партнерство і виявляти готовність йти на поступки, доки вони продовжують підтримувати наші починання.\n\nЗрештою, що таке одна-дві послуги між друзями?"

 JAP_appease_the_kodoha: "Задобрити Кодоха"
 JAP_appease_the_kodoha_desc: "Хоча нелегко примирити жорсткі погляди Кодоха з реальністю управління країною, ми не повинні забувати, що саме вони привели наш режим до влади. Лише дурень кусає руку, яка його годує."
 JAP_shison_danran: "Шісон Данран"
 JAP_shison_danran_desc: "Поза всім, існує велика основа Японської держави: стосунки між Імператором та його підданими, організовані царським чином. Ця основа робила Японію вищою за будь-яку іншу націю понад тисячу років, і вона продовжуватиме це робити."
 JAP_revere_imperial_power: "Поважати Імператорську Владу"
 JAP_revere_imperial_power_desc: "Нація завжди була обмежена інтригами бюрократів та сварками політиків, які стверджували, що працюють в ім'я Імператора, але вони лише прагнули жадібності та зміцнення власної влади на шкоду Його Величності. Тепер, коли справжні патріоти при владі, настав час відновити владу тому, хто її заслуговує."
 JAP_enact_economic_controls: "Запровадити Економічний Контроль"
 JAP_enact_economic_controls_desc: "Хоча промисловість, безсумнівно, допомогла Японії стати могутньою, домінування приватного сектора над нашою економікою мало жахливі побічні ефекти. Зростання міського класу, сповненого корумпованих, натхненних Америкою ідей, спрямованих на обмеження влади уряду, може повністю поставити під загрозу майбутнє Японії як провідної нації у світі. Кодоха наполягає на обмеженні надмірностей капіталізму та натомість зосередженні нашої економіки на військових зусиллях."
 JAP_colonial_investments: "Колоніальна Промисловість"
 JAP_colonial_investments_desc: "Наші заморські володіння є гарним випробувальним полігоном для великомасштабних та довгострокових проєктів індустріалізації. Те, що працює для Чосону та Маньчжурії сьогодні, спрацює для Тохоку та Хоккайдо завтра. Також досить зручно, що ключовий персонал Кодоха вже відповідає за нагляд за районами, яким були призначені ці проєкти індустріалізації."
 JAP_curtail_the_zaibatsu: "Кінець Надмірності"
 JAP_curtail_the_zaibatsu_desc: "Дзайбацу втілюють найгірші аспекти Японського суспільства: корупцію, непотизм, і їхні зв'язки з демократичними партіями дають зрозуміти, що ми повинні припинити будь-яку співпрацю з ними та працювати над обмеженням їхнього впливу. Безсумнівно, це займе час, але ми розпочнемо програму націоналізації найбільших конгломератів та почнемо боротися з відомими колабораціоністами у нашому уряді."

 JAP_build_the_mass_party: "Впровадження Шинтайсей"
 JAP_build_the_mass_party_desc: "Протягом свого існування Шьова Кенкюкай розробив багато планів для виправлення політики, економіки, глобального становища та культури Японії. Тепер, коли її благодійник при владі, щоб реалізувати ці плани, Японія буде трансформована відповідно до її ідей."
 JAP_nation_service_draft_ordinance: "Указ про призов на національну службу"
 JAP_nation_service_draft_ordinance_desc: "Ми можемо полегшити навантаження на наші виробничі лінії, призначаючи робітників безпосередньо до промислових проєктів, які потребують додаткової робочої сили."
 JAP_mobilise_the_nation: "Мобілізувати Націю"
 JAP_mobilise_the_nation_desc: "Останні десятиліття, завдяки парламентським суперечкам та дозволу на поширення радикальних ідей, призвели до стану розколу Японського суспільства. Спрямовані на сприяння спорідненості через патріотичні асоціації, освіту та націоналізацію ЗМІ для плекання любові до нації замість розколу, ми докладемо великих зусиль для реструктуризації суспільства, щоб зміцнити вроджений зв'язок нашого народу, допомагаючи їм пам'ятати, за що вони борються та тяжко працюють."
 JAP_independence_and_self_sufficiency: "Незалежність та Самодостатність"
 JAP_independence_and_self_sufficiency_desc: "Хоча економіка Японії процвітає, нашій країні, на жаль, бракує природних ресурсів, що змушує нас купувати їх у іноземних держав. Японська економіка не лише несправедливо напружена цим імпортом, якщо Японія коли-небудь буде відрізана від західних ринків, це може поставити під загрозу наші військові зусилля. Оскільки ми можемо покладатися лише на себе, ми будемо продовжувати програми видобутку ресурсів та вводити тарифи на Японські ресурси, з кінцевою метою повної автаркії."
 JAP_banking_and_agriculture_control: "Контроль Банківської Справи та Сільського Господарства"
 JAP_banking_and_agriculture_control_desc: "Приватний контроль над банками, сільськогосподарським сектором та іншими сферами є західними лихами, що загрожують економічному та політичному суверенітету Японії. Щоб демонтувати всепроникний вплив лібералізму, ми маємо запровадити урядову монополію на рис та жорсткі заходи контролю над банками та страховими компаніями, оскільки їхні інтереси мають бути повністю підпорядковані інтересам нації, а не навпаки."
 JAP_cabinet_information_committee: "Комітет Кабінету Інформації"
 JAP_cabinet_information_committee_desc: "Взявши під прямий контроль ЗМІ, ми можемо забезпечити, щоб громадськість була добре поінформована та підтримувала плани нашого уряду."
 JAP_ennoble_the_national_spirit: "Облагородити Національний Дух"
 JAP_ennoble_the_national_spirit_desc: "Світ минулого, і справді сьогодення, є світом конкуренції — велика, тотальна війна насувається на нас, і всі нації прагнутимуть оголосити себе переможцем. Лише нації, які мають сильний бойовий дух, волю процвітати у найважчий час, мають право на існування. Як нація, придатна для виживання, ми будемо вести війну до кінця, фанатичну Дарвінівську боротьбу, щоб побачити Японію на вершині гори!"

### Focuses - Economic - Base ###
 JAP_national_rd_institutes: "Національні інститути R&D"
 JAP_national_rd_institutes_desc: "Фінансуючи Національні Інститути Досліджень та Розробок, ми можемо полегшити співпрацю незалежних дослідницьких команд, покращуючи наш дослідницький результат та дозволяючи нам краще спрямовувати національні дослідницькі пріоритети."
 JAP_narrow_gauge_railways: "Стандартизувати ширину колії залізниць"
 JAP_narrow_gauge_railways_desc: "Наші вузькоколійні залізниці мали свої переваги під час будівництва, але тепер вони стримують нашу зростаючу промисловість. Майбутнє нікого не чекає, і найменше — Японію."
 JAP_prioritise_military_oil: "Надати пріоритет військовій нафті"
 JAP_prioritise_military_oil_desc: "З огляду на те, що країна перебуває у стані війни, нафта є більш життєво важливою, ніж будь-коли. Хоча вона корисна для багатьох цивільних цілей, вона є життєво необхідною для наших збройних сил. Таким чином, ми повинні надавати пріоритет нафті для військових потреб."
 JAP_land_reform_focus: "Земельна реформа"
 JAP_land_reform_focus_desc: "Землекористування в Японії вкрай неефективне. Майже всі фракції згодні з тим, що потрібно вжити заходів щодо перерозподілу землі, але як це зробити — питання дискусійне. Проте, якщо ми хочемо розкрити економічну міць Японії, то маємо вирішити цю проблему."

### Focuses - Economic - Zaibatsu ###
 JAP_support_the_zaibatsu: "Підтримка дзайбацу"
 JAP_support_the_zaibatsu_desc: "За останні десятиліття дзайбацу помітно збільшили свій політичний та економічний вплив. У наших інтересах співпрацювати з ними."
 JAP_finance_factory_projects: "Фабрики для дзайбацу"
 JAP_finance_factory_projects_desc: "Деякі дзайбацу попросили допомогу держави в будівництві заводів на території рідних островів. Надана допомога створить багато робочих місць і допоможе впоратися з економічною кризою."
 JAP_raw_materials_excavation_endeavours: "Ресурсні проєкти дзайбацу"
 JAP_raw_materials_excavation_endeavours_desc: "Багато дзайбацу звернулися до нас із перспективними планами з видобутку сировини, від нас вимагається лише фінансування. Наші фінанси мають забезпечити їм доступ до таких необхідних нам рідкісних ресурсів."
 JAP_foster_technological_innovation: "Дослідження дзайбацу"
 JAP_foster_technological_innovation_desc: "Державне фінансування зробить довгий шлях до того, щоб у кваліфікованих учених дзайбацу було все необхідне для того, щоб вести Японію до майбутнього і дати уряду контроль над дослідницькою діяльністю."
 JAP_the_central_railroad_plan: "Центральна залізниця дзайбацу"
 JAP_the_central_railroad_plan_desc: "Центральний план залізниць - це серія нових і модернізованих залізничних ліній на домашніх островах, які перебувають в авангарді нашого постійного прагнення до ефективного та продуктивного суспільства. Однак його реалізація відтерміновується вже протягом багатьох років, і для цього бракує ані фінансування, ані фахівців. Однак, на щастя, дзайбацу в змозі забезпечити і те, й інше, а тому, за їхньої підтримки, проєкт може бути, нарешті, завершений."

### Focuses - Economic - Shared ###"
 JAP_build_new_aircraft_facilities: "Побудувати нові авіаційні потужності"
 JAP_build_new_aircraft_facilities_desc: "Авіаційна промисловість — життєво важлива частина національної оборони. Оскільки війни, ймовірно, вирішуватимуться в повітрі, наша промисловість має бути здатною забезпечити наших пілотів великою кількістю якісних, вітчизняних літаків. Будівництво нових авіаційних заводів забезпечить задоволення наших зростаючих потреб у найближчі роки."
 JAP_invest_in_heavy_industry: "Інвестувати у важку промисловість"
 JAP_invest_in_heavy_industry_desc: "Для того, щоб Японія залишалася конкурентоспроможною економічною державою, необхідно, щоб ми інвестували більше у великомасштабні промислові проєкти. Зазначені промислові проєкти, у свою чергу, дозволять нам адекватно забезпечувати державу, коли йдеться про оборону."

 JAP_riken_north: "РІКЕН Північ"
 JAP_riken_north_desc: "РІКЕН Північ — це кодова назва для ключового об'єкта, який незабаром буде створено в рамках нашого Проєкту Ні-Го, розташованого у префектурі Фукусіма.\nПроєкт Ні-Го — це наше надсекретне підприємство в атомних дослідженнях, спрямоване на розділення урану-235 методом термальної дифузії.\nІнші об'єкти, що беруть участь у цьому проєкті, знаходяться в Токійському комплексі РІКЕН та в Конані, Північна Корея."
 JAP_rocket_science: "Ракетна наука"
 JAP_rocket_science_desc: "Розробки ракет можуть забезпечити нас не лише ракетним озброєнням, але навіть, як теоретизують науковці, ракетними двигунами для високошвидкісних подорожей."
 JAP_colonial_incentives: "Колоніальні стимули"
 JAP_colonial_incentives_desc: "Щоб врятувати наш занепадаючий аграрний сектор та далі розширити нашу економіку, ми гостро потребуємо інвестування в колоніальні проєкти. Імперія — це майбутнє Японії."

### Focuses - Economic - Bureaucratic ###
 JAP_bureaucratic_economy: "Бюрократична економіка"
 JAP_bureaucratic_economy_desc: "Уряд вирішив реформувати економіку таким чином, щоб вона регулювалася бюрократичною структурою, яка покликана обмежити владу дзайбацу та збільшити прибуток держави."
 JAP_rapid_industrialisation: "Швидке розширення озброєнь"
 JAP_rapid_industrialisation_desc: "Хоча наша економіка зростає, і ми уникли значної частини наслідків Чорного понеділка, наше виробництво озброєнь все ще не використовує свій потенціал. Будуючи фабрики, спроєктовані спеціально для таких цілей, ми зможемо значно розширити наше виробництво озброєнь."
 JAP_regulating_the_automotive_industry: "Регулювання автопрому"
 JAP_regulating_the_automotive_industry_desc: "Протягом 20-х і 30-х років японський автопром був неконкурентоспроможним на світовому ринку. Щоб виправити ситуацію і дозволити вітчизняним фірмам конкурувати з набагато більшими західними колегами, ми можемо змусити невеликі автомобільні фірми Японії об'єднатися в кілька великих."
 JAP_reorganise_resource_extraction: "Реорганізація видобутку ресурсів"
 JAP_reorganise_resource_extraction_desc: "По всьому світу наростає напруженість і зараз як ніколи важливо забезпечити ефективність видобувної промисловості. Щоб домогтися цього, ресурсодобувні фірми мають бути підпорядковані великому бюрократичному наглядовому органу та реорганізувати свою внутрішню структуру відповідно до рекомендацій держави."
 JAP_the_shinkansen_proposal: "Пропозиція Сінкансен"
 JAP_the_shinkansen_proposal_desc: "Настав час прийняти пропозицію Сінкансена, створити сполучений комплекс швидкісних залізниць, і тоді поєднати їх із новими паровими та електричними локомотивами. Ці лінії зможуть перевозити пасажирів і вантажі на небачених раніше швидкостях."

### Focuses - Military ###
 JAP_revise_imperial_defence_policy: "Переглянути Імперську Оборонну Політику"
 JAP_revise_imperial_defence_policy_desc: "«Jakuniku Kyōshoku» або «Виживання найпристосованіших» є фундаментальним розумінням у нашій військовій філософії; Західні імперіалісти значно розширили свої повітряні та військово-морські сили, і якщо ми не зробимо того ж, ми, безсумнівно, станемо жертвою їхніх сил. Фракційність в армії залишається, і тому наші збройні сили не змогли повністю розкрити свій потенціал, тож вибір нашої доктрини має першочергове значення."
 JAP_long_war_doctrine: "Доктрина Довгої Війни"
 JAP_long_war_doctrine_desc: "Прихильники Доктрини Довгої Війни стверджують, що якщо Японія має вижити у боротьбі між націями, вона повинна готуватися до тотальної війни, можливо, навіть більшої за масштабом, ніж попередня. З цією метою ми повинні створити міцну промислову базу, оснастити наших солдатів новітнім озброєнням і підготувати населення до прийдешньої бурі."
 JAP_short_war_doctrine: "Доктрина Короткої Війни"
 JAP_short_war_doctrine_desc: "Вказуючи на слабку промислову базу Японії, брак ресурсів та її становище в Азії, прихильники стратегії Короткої Війни вважають, що Японія повинна натомість готуватися до короткого, вирішального конфлікту, у стилі Російсько-Японської та Китайсько-Японської воєн до нас, і з цією метою створити велику постійну армію, здатну завдавати нищівних поразок на початку війни."
 JAP_phase_out_arisakas: "Поступово Вивести Арісаки"
 JAP_phase_out_arisakas_desc: "Наша основна гвинтівка, Арісака, була надійно використовуваною гвинтівкою протягом кількох десятиліть, але вона відстала від останніх досягнень у війні, частково через свою конструкцію із ковзним затвором. Тому ми повинні оновити наше озброєння до більш потужних та ефективних напівавтоматичних гвинтівок. Це забезпечить, що наша піхота витримає випробування часом і зможе перемогти навіть найбільш просунуті армії заходу."
 JAP_agile_and_indomitable: "Спритний та Незламний"
 JAP_agile_and_indomitable_desc: "Наша піхота — ніщо без різноманітності снарядів, випущених їхніми надійними гаубицями. Тому ми не повинні уповільнювати їхній наступ масивною гарматою, яку важко транспортувати, і яка є перешкодою в експлуатації. Розробивши легку, міцну гармату, зберігаючи при цьому здатність заряджати потужний та руйнівний снаряд, наша піхота буде позбавлена будь-яких подальших проблем у прориві ворожих ліній."
 JAP_supremacy_of_logistics: "Перевага Логістики"
 JAP_supremacy_of_logistics_desc: "Покращення логістичного обладнання та навчання є необхідністю для підтримки великої збройної сили на багатьох фронтах у Східній Азії. Ми безглуздо викидатимемо хоробрі Японські душі, якщо наші компанії не будуть оснащені найсучаснішим допоміжним обладнанням. Наші морські піхотинці потребуватимуть останніх досягнень у медичних технологіях, логістичній підготовці, а також розвідувальній підтримці, щоб забезпечити, що кожне вторгнення завершиться тріумфом для Японії!"
 JAP_backbone_of_the_army: "Основа Армії"
 JAP_backbone_of_the_army_desc: "Піхота — це основа будь-якої сучасної армії, якщо наша піхота похитнеться перед нашими противниками, то не буде надії на наше заплановане завоювання Азії. Натомість ми повинні зміцнити наші сили, оснастити кожного чоловіка не лише найкращим обладнанням, яке ми можемо запропонувати, але й вселити в них мужність, щоб знищити ворогів Японії. Хто ми такі, щоб називати себе гегемоном Східної Азії без елітних сухопутних військ для підтримки наших претензій?"
 JAP_armoured_experiments: "Бронетанкові Експерименти"
 JAP_armoured_experiments_desc: "Натхнені використанням примітивних броньованих машин наприкінці першої Світової війни кількома європейськими державами, виникла мотивація до виробництва вітчизняного проєкту танка. Армійське Технічне Бюро розробило невеликий, дешевий та простий у виготовленні танк, здатний пересуватися на високих швидкостях, а також здатний пом'якшувати ураження стрілецькою зброєю. Ці бронетанкові дивізії стануть благом у майбутній війні з Китаєм!"
 JAP_retention_of_mobility: "Збереження Мобільності"
 JAP_retention_of_mobility_desc: "Хоча порівняно з Азією наші сили не поступаються, коли йдеться про чисту вогневу міць та технологічну перевагу, не лише ці фактори виграють нам війни. Наявність мобільної армії є настільки ж важливою, і на величезних Китайських рівнинах це те, що виграє нам вирішальні битви."
 JAP_coordinate_intelligence_services: "Координувати Служби Розвідки"
 JAP_coordinate_intelligence_services_desc: "Наші служби розвідки наразі надто дезорганізовані, не лише розділені між цивільними, армійськими та військово-морськими агентствами, але й надто часто ігноруються оперативним командуванням. Ми повинні зміцнити міжвідомчу співпрацю, щоб цінна робота наших розвідувальних оперативників могла мати значення на полі бою."
 JAP_f_agency: "Агентство F"
 JAP_f_agency_desc: "Вельми ймовірно, що наші війська незабаром будуть розгорнуті для бою в тропічних зонах. Ця складна та сувора місцевість створює проблеми для проведення військових операцій, але вона також може надати можливість, якщо ми зможемо опанувати цей стиль ведення війни раніше за наших ворогів."
 JAP_expand_the_kenpeitai: "Розширити Кемпейтай"
 JAP_expand_the_kenpeitai_desc: "У міру розширення нашої імперії, зростає і кількість дисидентів, які незаконно йдуть проти нашого морального шляху. Кемпейтай служив нам у придушенні інакомислення вдома, а також забезпечував шпигунство та контррозвідку протягом деякого часу, і це правильно, що ми продовжуємо набір до нього."
 JAP_strengthen_the_ijaas: "Зміцнити ВПС Імперської Армії Японії"
 JAP_strengthen_the_ijaas_desc: "Літаки давно перестали бути лише інструментами розвідки та переслідування. Інтегруючи їх повністю в наші армійські операції, повітряні сили здатні завдавати шкоди та просувати наші операції не менше, ніж середнє Армійське Командування."
 JAP_intensive_pilot_training: "Інтенсивна Підготовка Пілотів"
 JAP_intensive_pilot_training_desc: "Підготовка Японських пілотів-винищувачів є однією з найскладніших у світі, але це так з дуже вагомої причини. Наші літаки швидкі, наші наземні екіпажі кваліфіковані, а наші командири розумні, але ніщо не є важливішим за мужність і талант окремих пілотів."
 JAP_open_new_flight_schools: "Відкрити Нові Льотні Школи"
 JAP_open_new_flight_schools_desc: "Наші повітряні кампанії вимагають не лише більшої якості, але й кількості пілотів. Будуть відкриті нові школи для навчання новобранців ВПС Імперської Армії Японії, щоб не лише збільшити кількість наших повітряних крил, але й надати практичний досвід у нашому розумінні повітряних операцій."
 JAP_found_teishindan: "Заснувати Тейшиндан"
 JAP_found_teishindan_desc: "Експерименти довели практичність та корисність використання повітряно-десантних сил для висадки військ за лінією ворога. Інші нації почали формувати підрозділи парашутистів, то чому б не наші власні? Тейшин Шудан стане новим підрозділом спеціальних сил, здатним практикувати вертикальне охоплення та захоплювати ключові об'єкти."
 JAP_plan_edit_1: "[GetPlanEditOne]"
 JAP_plan_edit_1_desc: "[GetPlanEditOneDesc]"
 JAP_plan_edit_2: "[GetPlanEditTwo]"
 JAP_plan_edit_2_desc: "[GetPlanEditTwoDesc]"
 JAP_plan_edit_3: "[GetPlanEditThree]"
 JAP_plan_edit_3_desc: "[GetPlanEditThreeDesc]"
 JAP_ideological_indoctrination: "Ідеологічна Індоктринація"
 JAP_ideological_indoctrination_desc: "Що відрізняє Японського солдата від солдата інших країн? Це його бойовий дух, його повна відданість своїй країні та божественному Імператору, його відмова здатися, на відміну від його боягузливих ворогів. Ось чому Японія завжди перемагатиме своїх супротивників, бо той, хто не боїться смерті, завжди буде переможцем!"
 JAP_new_field_manuals: "Нові Польові Статути"
 JAP_new_field_manuals_desc: "Наші поточні польові статути просто не відповідають стандартам сучасної війни, що швидко розвиваються, тому їх оновлення для підтримки нашої оперативної ефективності є необхідністю."
 JAP_logistics_corps: "Корпус Логістики"
 JAP_logistics_corps_desc: "Відділ в армії, призначений для логістичних питань — забезпечення необхідних поставок, технічного обслуговування, інформації та іншого — допоможе нам подолати складні умови, особливо на деяких більш несприятливих територіях по всій Азії."
 JAP_envolepment_tactics: "Тактика Охоплення"
 JAP_envolepment_tactics_desc: "Якщо є урок, який слід винести з Великої війни, то це те, що лобові атаки самі по собі рідко є вирішальними. Набагато краще проривати фланги ворога та атакувати тил, спричиняючи велику дезорганізацію з меншими втратами для наших власних сил."
 JAP_expand_the_engineer_corps: "Розширити Армійський Інженерний Корпус"
 JAP_expand_the_engineer_corps_desc: "Зважаючи на різноманітність місцевості, у якій ми будемо воювати, у поєднанні з часто відсутньою інфраструктурою в Азії, створення спеціалізованого інженерного корпусу було б великим благом для наших збройних сил. Ми спрямуємо кошти саме на такий підрозділ."
 JAP_update_the_imperial_war_college: "Оновити Імперський Військовий Коледж"
 JAP_update_the_imperial_war_college_desc: "Армійський Військовий Коледж готує найкращих офіцерів нашої країни. Спочатку натхненний Прусським Штабним Коледжем, його навчальні методики майже не змінилися за п'ятдесят років. Настав час, щоб ця шанована установа була приведена до сучасних стандартів."

### Focuses - Navy ###
 AP_start_the_third_circle_plan: "Розпочати Третій План «Коло»"
 JAP_start_the_third_circle_plan_desc: "Оскільки ми не можемо вести затяжну війну з ворогом, наш єдиний варіант — продовжити поточне нарощування військово-морських сил та зосередитися на остаточній перемозі у вирішальній битві."
 JAP_expand_the_snlf: "Розширити СМПС"
 JAP_expand_the_snlf_desc: "Спеціальні морські піхотні сили, морська піхота Імперського флоту Японії, матимуть вирішальне значення у майбутніх конфліктах — завдяки їхнім зусиллям ми зможемо здійснювати висадки як на Китайському узбережжі, так і в Ост-Індії."
 JAP_pacific_defence_zone: "Тихоокеанська Оборонна Зона"
 JAP_pacific_defence_zone_desc: "Здатність Японії проєктувати силу по всьому Тихому океану ніколи не була такою потужною, як нам хотілося б, але з недавніми конфліктами ми можемо забезпечити, щоб контроль над Тихим океаном був у наших руках. Ми також можемо захиститися від будь-яких вторгнень, що загрожують Рідним Островам, шляхом сильного укріплення військово-морських баз в океані."
 JAP_reexamine_naval_doctrine: "Переглянути Військово-Морську Доктрину"
 JAP_reexamine_naval_doctrine_desc: "Як ми бачили два десятиліття тому, нерозумно думати, що наступна війна буде виграна вирішальною битвою. Швидше за все, наступна війна буде виграна завдяки ресурсам, промисловості та виснаженню. Ми повинні змінити своє мислення, інакше це нас погубить."
 JAP_maintain_kantai_kessen: "Підтримувати Кантай Кессен"
 JAP_maintain_kantai_kessen_desc: "Наші верфі та наша промисловість мають обмежену потужність порівняно з нашими суперниками в Європі та Північній Америці, але наші дизайнери та інженери перевершують їх у всіх відношеннях. Один наш корабель буде вартий десятка їхніх кораблів."
 JAP_experimental_division: "Експериментальна Дивізія"
 JAP_experimental_division_desc: "Хоча Японський флот могутній, він може не відповідати Американському чи Німецькому флоту, і якщо ми сподіваємося отримати перевагу в Тихому океані, ми повинні продовжувати інвестувати в дослідження та розробки, бо саме винахідливість та нестандартне мислення виграють нам морські битви, а не чиста вогнева міць."
 JAP_improve_the_long_lance: "Покращити Довгий Спис"
 JAP_improve_the_long_lance_desc: "Торпеди, хоча і малі, є надзвичайно смертоносною зброєю, здатною потопити навіть наймогутніший лінкор, як навчився жалюгідний Російський флот під час Битви при Цусімі. Однак кораблі значно більші, ніж 30 років тому, і тому ми повинні працювати над збільшенням наших торпед."
 JAP_refit_old_ships: "Переобладнати Старі Кораблі"
 JAP_refit_old_ships_desc: "Навіть якщо флот Японії є одним із найбільших у світі за розміром, багато наших кораблів не відповідають сучасним вимогам, і їм буде важко функціонувати у майбутньому конфлікті. Оскільки нам бракує ресурсів для побудови нового флоту з нуля, ми повинні натомість прагнути вдосконалити наші старі кораблі та надати їм належне обладнання, щоб вони були майже такими ж хорошими, як нові."
 JAP_revise_kantai_kessen: "Переглянути Кантай Кессен"
 JAP_revise_kantai_kessen_desc: "Наш поточний флот не розроблений відповідно до наших нових доктринальних змін. Йому просто бракує достатньої кількості менших суден, необхідних для нових завдань. Є лише один варіант вирішення цієї ситуації: масове нарощування уніфікованих, спрощених і особливо модульних конструкцій."
 JAP_expand_shipping_capacity: "Розширити Пропускну Здатність Судноплавства"
 JAP_expand_shipping_capacity_desc: "Військові кораблі можуть бути більш вражаючими, але торгове судноплавство є настільки ж, якщо не більш, важливим для підтримки військових зусиль. Це особливо стосується нас, оскільки, будучи острівною нацією, ми повинні імпортувати ресурси та забезпечувати наші експедиційні сили морем."
 JAP_start_the_fourth_circle_plan: "[GetMaruKeikaku] (Розпочати Четвертий План «Коло»)"
 JAP_start_the_fourth_circle_plan_desc: "Четверта Програма Доповнення Військово-Морських Озброєнь, або Четвертий Мару Кейкаку, — це останній план Міністерства Військово-Морських Сил щодо розширення Імперського Флоту Японії. З шестирічним терміном та бюджетом у сотні тисяч єн, ми очікуємо виробництва десятків суден усіх типів."
 JAP_expand_personnel_reserves: "Розширити Кадровий Резерв"
 JAP_expand_personnel_reserves_desc: "Хоча про це часто забувають, флот має потреби в живій силі так само, як і армія. Нарощування чисельності наших військово-морських резервів дозволить нам швидко замінювати втрати."
 JAP_scrap_and_build_program: "Програма «Брухт і Будівництво»"
 JAP_scrap_and_build_program_desc: "Хоча наш флот великий, сила вимірюється не лише тоннажем. Багато наших суден, відверто кажучи, застаріли і не можуть конкурувати з сучасними військовими кораблями. Ми повинні списати ці старі кораблі та використати брухт для будівництва заміни, оснащеної новітніми військово-морськими технологіями."
 JAP_naval_wargames: "Морські Військові Ігри"
 JAP_naval_wargames_desc: "Дослідження показали корисність проведення військових симуляцій не лише для загального навчання наших офіцерів, але й для фактичного прогнозування результатів та ефективності потенційних військових операцій. Проведення таких симуляцій буде незамінним під час розробки наших військових планів."
 JAP_destroyer_development: "Розвиток Есмінців"
 JAP_destroyer_development_desc: "Далеко від свого походження як винищувачів торпедних катерів, сучасні есмінці стали квінтесенцією судна прикриття та незамінним інструментом у протичовновій війні. Конструкції есмінців ставатимуть лише більшими та швидшими, тому ми повинні йти в ногу з часом."
 JAP_floating_fortresses: "Плавальні Фортеці"
 JAP_floating_fortresses_desc: "Усім відомо, що військово-морська авіація стала вирішальним фактором у сучасній морській війні. Авіаносці особливо важливі для нас завдяки їхній здатності проєктувати силу по всій нашій зростаючій Тихоокеанській імперії. Тому ми повинні збільшити кількість авіаносних груп, які ми можемо виставити."
 JAP_diversify_submarine_models: "Диверсифікувати Моделі Підводних Човнів"
 JAP_diversify_submarine_models_desc: "Незалежно від того, чи це для бою між флотами, рейдерства чи навіть постачання, підводні човни є незамінним компонентом флоту. Маючи стільки потенційних ролей, ми повинні диверсифікувати та виробляти широкий спектр різних типів підводних човнів."
 JAP_leviathans_of_the_pacific: "Левіафани Тихого Океану"
 JAP_leviathans_of_the_pacific_desc: "Незважаючи на появу авіаносців, лінкори залишаються гордістю Імперського Флоту Японії: вони є найбільшими, найміцнішими та найсильнішими військовими кораблями на плаву, втілюючи міць Японської імперії. З ще більш технологічно просунутими лінкорами ми зможемо завдати вирішальної поразки будь-якому ворогу, який наважиться кинути нам виклик."
 JAP_cruiser_innovation_efforts: "Зусилля з Інновацій Крейсерів"
 JAP_cruiser_innovation_efforts_desc: "Щоб наші великі лінкори могли ефективно боротися проти протилежних флотів, вони повинні бути належним чином супроводжені. Інвестування у розвиток середніх та легких крейсерів є першочерговим для нашого флоту, щоб зберегти свою перевагу над Тихим океаном."
 JAP_naval_aviation_department: "Департамент Морської Авіації"
 JAP_naval_aviation_department_desc: "Без літаків наші авіаносці — це просто металеві коробки, які можуть плавати. Ми повинні забезпечити, щоб наші авіаносці завжди були оснащені лише найкращими літаками та пілотами."
 JAP_the_zero: "Зеро"
 JAP_the_zero_desc: "Завдяки зусиллям Компанії Mitsubishi Aircraft, ми змогли розробити новий винищувач, який послужить нашим зусиллям як на морі, так і на суші. «Зеро», як його називають, буде передовим палубним винищувачем."

 JAP_plan_edit_name_1: "Покращення Армії"
 JAP_plan_edit_name_1_desc: "Хоча традиціоналісти в армії наполягали на розширенні чисельності нашої постійної армії, реформісти наполягали на переході до трикутних дивізій, щоб ми могли мати кращу оперативну ефективність на полі бою. Лише час покаже, який план спрацює."
 JAP_plan_edit_name_2: "Планування Війни"
 JAP_plan_edit_name_2_desc: "Традиціоналісти в армії закликали до ретельного планування, щоб зрозуміти географію та зібрати розвідувальні дані про наші протилежні армії, тоді як реформісти закликали до великих інвестицій у науку, щоб мати технологічну перевагу над ворогом."
 JAP_plan_edit_name_3: "Кампанія Мобілізації"
 JAP_plan_edit_name_3_desc: "Реформісти в армії вказували на велику національну мобілізацію як на спосіб, яким Японія вийде переможцем у своїх конфліктах, тоді як традиціоналісти наголошували на моральній перевазі та священному обов'язку Імперської армії, якому вона повинна присвятити себе, щоб витримати наступну війну."

 JAP_expand_the_army: "Розширити Постійну Армію"
 JAP_expand_the_army_desc: "Розмір — це не все, але чисельна перевага несе в собі численні переваги — ми можемо розраховувати на менш катастрофічні втрати, підтримувати широкий спектр спеціалізованих підрозділів і розгортати війська широко та далеко по всій Азії."
 JAP_war_plan_expansions: "Розширене Військове Планування"
 JAP_war_plan_expansions_desc: "Знання місцевості нашого ворога, збір розвідувальних даних про нього та розуміння того, куди завдати удару, має першочергове значення, якщо ми хочемо завдати нокаутуючого удару. Незалежно від того, чи це рівнини Китаю, чи джунглі Бірми, розуміння важливості природних бар'єрів буде ключем до перемоги у наших війнах."
 JAP_extensive_planning: "Духовна Мобілізація"
 JAP_extensive_planning_desc: "Війни виграються не лише зіткненням куль на землі, морі чи небі — а здатністю не здаватися. Хто б не виграв війну, це буде тому, що він мав силу продовжувати, і солдати Імперії знатимуть, за що вони борються, коли завдадуть першого вирішального удару."

 JAP_the_four_year_plan: "Створити Трикутні Дивізії"
 JAP_the_four_year_plan_desc: "Трикутні дивізії менші за квадратні дивізії, і, отже, не мають тих самих проблем з командуванням та контролем, які мають квадратні дивізії. Хоча вони можуть складатися з меншої кількості живої сили на дивізію, вони більш мобільні та здатні нести більшу вогневу міць. Настав час нам здійснити цей перехід."
 JAP_scientific_war_planning: "Наукове Військове Планування"
 JAP_scientific_war_planning_desc: "Те, чого Японії бракує в ресурсах та чистому економічному виробництві, ми можемо компенсувати, наголошуючи на важливості технології. Лише будучи технологічно вищими за наших ворогів в Азії, ми подолаємо наші природні недоліки."
 JAP_national_mobilisation: "Національна Мобілізація"
 JAP_national_mobilisation_desc: "Війни виграються не лише зіткненням куль на землі, морі чи небі — а тим, хто зміг належним чином залучити весь свій народ до військових зусиль. Сто мільйонів оспівують святу справу Японії зі звільнення Азії від Західного імперіалізму, усі об'єднані та віддані тому, щоб побачити нашу остаточну перемогу в кінці."

 JAP_revise_the_third_circle_plan: "Переглянути Третій План «Коло»"
 JAP_revise_the_fourth_circle_plan: "Розпочати Четвертий План «Коло»"
 JAP_third_naval_armaments_idea_no_mtg: "Програма Доповнення Третього Військово-Морського Озброєння"
 JAP_naval_innovation: "Військово-Морський Інноваційний Відділ"
 JAP_the_long_lance_idea: "Довгий Спис"
 JAP_naval_aviation_breakthroughs: "Прориви в Морській Авіації"
 JAP_quality_shipbuilding: "Якісне Кораблебудування"
 JAP_mass_shipbuilding: "Масове Кораблебудування"
 JAP_naval_personnel_expansion: "Розширення Військово-Морського Персоналу"

### Focuses - Foreign - Base ###
 JAP_rising_sun: "Hakkō Ichiu"
 JAP_rising_sun_desc: "Правильний напрямок зовнішньої політики Японії довгий час обговорювали як ідеологи, так і військові теоретики. Усі вони зійшлися в одному - світ стане кращим, якщо перебуватиме під одним дахом."

### Focuses - Nanshin-ron ###
 JAP_nanshin_ron: "Nanshin-ron"
 JAP_nanshin_ron_desc: "За всієї своєї могутності, Японія має стратегічний недолік - залежність від іноземної нафти. Прагнучи самозабезпечення та безпеки від постійних зазіхань з боку західного імперіалізму, чи не було б розумно одночасно роздобути нафтові родовища та розширити нашу сферу безпеки?"
 JAP_extend_pacific_security_zone: "Тихоокеанська зона безпеки"
 JAP_extend_pacific_security_zone_desc: "Америку поглинув хаос і буде нерозумно цим не скористатися. На порядок денний винесено питання про створення тихоокеанської зони безпеки, яка покликана забезпечити захист і розширення наших тихоокеанських володінь."
 JAP_hawaii: "Тиск на Гаваї"
 JAP_hawaii_desc: "Позиція Америки на Тихому океані ослабла, що дає нам можливість анексувати невизнані Гаваї. Зайнявши острови, ми на найближчі роки забезпечимо нашу імперію непробивним кордоном на заході."
 JAP_target_east_indies: "Ціль: Ост-Індія"
 JAP_target_east_indies_desc: "Острови Ост-Індії століттями перебували під гнітом нідерландців, чиї великі ресурси осідали в кишенях гнобителів. Ми повинні покінчити з цією несправедливістю, шляхом звільнення цих ресурсів для сфери співпроцвітання - для тих, кому ці ресурси належать по праву!"
 JAP_philippines: "Тиск на Філіппіни"
 JAP_philippines_desc: "З відходом імперіалістів, ми можемо відправити наші кораблі на захоплення Філіппін для їхньої інтеграції у Сферу Співпроцвітання. Зрозуміло, не всі філіппінці оцінять наше рішення."
 JAP_claim_colonies: "Територія Південних морів"
 JAP_claim_colonies_desc: "Кожен не захоплений японцями острів у Тихому океані ставить під удар безпеку рідних островів. Німецька Імперія не має права на жоден із цих островів, і тому вони належать нам по праву. Спочатку ми формалізуємо наші домагання на територію Південного моря. Потім ми можемо використовувати ці домагання, щоб ввести їх у нашу імперію, чи то за допомогою дипломатії, чи то за допомогою могутності Японського Імператорського Флоту."
 JAP_ultimatum: "Колоніальний ультиматум"
 JAP_ultimatum_desc: "Ми повинні використати можливість стати єдиною імперією Азії та Тихого океану. Одним із кроків до цього буде вимога від німців усіх їхніх східноазійських і тихоокеанських володінь, а також китайських концесій. Відмова від наших вимог означає війну!"
 JAP_target_indochina: "Ціль: Індокитай"
 JAP_target_indochina_desc: "Індокитай не повинен залишатися незалежним, питання його суверенітету має бути вирішене якомога швидше."
 JAP_target_siam: "Тиск на Сіам"
 JAP_target_siam_desc: "Ми сподівалися, що сіамці проявлять розсудливість і приєднаються до нас, але отримавши від них їхню відмову, у нас немає іншого вибору, окрім як змусити їх підкоритися нам!"

### Focuses - The New Order ###
 JAP_new_order_in_east_asia: "Новий порядок у Східній Азії"
 JAP_new_order_in_east_asia_desc: "Оскільки Росія не становить загрози за Амуром, а американці втягнуті в громадянську війну, настав час виконати наше призначення. Китай є слабким, корумпованим і розділеним, і його необхідно привести в сучасну епоху під керівництвом Японії. Якщо китайці не погодяться, то ми просто повинні викласти їм суворий урок непокори."
 JAP_mantetsu_projects: "Проєкти Мантецу"
 JAP_mantetsu_projects_desc: "Маньчжурська залізниця управляє залізницями Маньчжурії та Кореї від нашого імені, і, як наслідок, глибоко залучена в економіку Північно-Західного Китаю. У міру того, як ми розширюємо свій вплив на внутрішні райони і узбережжя нашої китайської маріонетки, вони, безсумнівно, будуть пропонувати все більш амбітні проекти з розвитку регіону."
 JAP_support_allies: "Підтримка союзних мілітаристів"
 JAP_support_allies_desc: "Багато китайських мілітаристів шикуються в ряд для отримання допомоги від нас, як це свого часу зробив Чжан Цзолінь. Ми повинні добре екіпірувати їх і змусити працювати на нас."
 JAP_five_races_under_the_sun: "П'ять рас під Сонцем"
 JAP_five_races_under_the_sun_desc: "Хоча багато воєначальників піднімають п'ятиколірний прапор, правда полягає в тому, що Китайці хань пригнічували інші чотири раси Китаю протягом століть. Під нашим керівництвом ми допоможемо тим, хто пригнічений їхнім гнобленням, і працюватимемо над більш ретельним розділенням Китаю, незалежно від думки наших довірених осіб."
 JAP_national_mobilisation_law: "Закон про національну мобілізацію"
 JAP_national_mobilisation_law_desc: "Війна в Китаї стане грандіозним починанням, яке безумовно помітно позначиться на нашій економіці. Ми маємо бути впевнені, що наш народ готовий перенести тяготи війни."
 JAP_peace_and_reconstruction: "Мир та реконструкція"
 JAP_peace_and_reconstruction_desc: "Багаторічний період воєнного панування добігає кінця, оскільки наші війська успішно окупували дві стародавні столиці Китаю, але це ще не кінець. Воєначальники продовжують чинити опір нашим зусиллям зробити Китай знову цілісним, іронічно, це те, що вони нібито самі відстоюють. Просування миру, примирення та реконструкції — ідеалів, до яких справді варто прагнути, — стане нашим ключем до остаточного припинення цього конфлікту."
 JAP_peace_and_reconstruction_tt: "Ці рішення послаблять Китайські фракції, з якими ми воюємо."
 JAP_victory_with_vision: "Перемога з баченням"
 JAP_victory_with_vision_desc: "Нескінченна війна на виснаження нікому не принесе користі. Ті, хто каже, що ми вступили у конфлікт з воєначальниками через якесь благородне бажання возз'єднати Китайський народ та досягти паназійського процвітання, помиляються: це велика війна за домінування над усією Східною Азією, і ми маємо намір забезпечити, щоб наші важко здобуті перемоги принесли процвітання додому."
 JAP_continental_warfare: "Континентальна війна"
 JAP_continental_warfare_desc: "Запланована низка вирішальних битв під назвою «Операція Ічі-ґо», покликана об'єднати наші різні армії та остаточно розгромити Китайців. Ми ставимо на це багато, і якщо ми зазнаємо невдачі, наша стабільність, безсумнівно, постраждає, оскільки війна здаватиметься громадськості невиграшною. Але ми повністю віримо у наших генералів, що вони нарешті принесуть перемогу. Вперед, Японські солдати! Тенно Хейка Банзай!"
 JAP_the_fruits_of_loyalty: "Плоди лояльності"
 JAP_the_fruits_of_loyalty_desc: "Уряд Чжан Цзоліня був нашим головним союзником у Китаї протягом багатьох років, і підтримка його у прагненні об'єднати Китай була нашою метою та причиною цієї війни. Тому вкрай важливо, щоб ми передали йому всі землі, які ми захопили і на які він претендує як на основну частину Китаю."
 JAP_plant_cherry_blossoms: "Посадити Сакури"
 JAP_plant_cherry_blossoms_desc: "Кров, пролита нами в Китаї, була дорогою, а наші перемоги — важко здобутими. Ми не дозволимо якомусь вискочню-воєначальнику з ідеями про свої права чи Китайський націоналізм забрати їх у нас. Наші ключові претензії в Китаї залишаться під нашим контролем і відкритими для поселення Японським народом, що ми символізуємо посадкою сакур."
 JAP_dismantle_legation_cities: "Демонтувати Посольські Міста"
 JAP_dismantle_legation_cities_desc: "Самовпевнені західники, які керують [LEC.GetNameDef], вважали за потрібне виключити нас зі своїх рад і залів влади. Ми покажемо їм ціну їхньої зухвалості."

### Focuses - Foreign - Factions ###
 JAP_tokyo_conference: "Токійська конференція"
 JAP_tokyo_conference_desc: "Паназіатська думка була щиро підтримана більшістю наших політиків. Проведення масштабної конференції в Токіо, за участю дипломатів з усієї Азії, дасть нам змогу надихнути східні народи на спільну співпрацю проти західного імперіалізму."
 JAP_osaka_conference: "Економічне бюро Осаки"
 JAP_osaka_conference_desc: "В Осаці, одному з наших найбільших промислових міст, ми вирішили заснувати торгову комісію з представників з усієї Азії. Основним завданням комісії має стати створення економічних зв'язків між членами Сфери Спроцвітання, що дасть нам змогу популяризувати серед них економічну самодостатність і розширити наш вплив."
 JAP_mission_to_india: "Делегація до Індії"
 JAP_mission_to_india_desc: "[PRF.GetNameDefCap] готова вступити до наших лав. Вона має всі причини побоюватися як панування європейців, так і синдикалістів. Було б розумно зробити з Індії добровільного союзника, ніж безпосередньо підпорядкувати її."
 JAP_target_india: "Ціль: Індія"
 JAP_target_india_desc: "Індія є непідвладною нам силою, у якої достатньо людських ресурсів, щоб у перспективі становити для нас загрозу. Ми повинні якнайшвидше підпорядкувати її."
 JAP_isolate_australasia: "Ізоляція Австралазії"
 JAP_isolate_australasia_desc: "Сфера спільного процвітання має сильний контроль над торгівлею в Тихоокеанському регіоні, і ми повинні продемонструвати це за допомогою каральних санкцій проти імперіалістичного форпосту європейського колоніалізму, яким є '[AST.GetNameDefCap]'."
 JAP_integrate_asian_economies: "Економіка Великої Азії"
 JAP_integrate_asian_economies_desc: "Економічна влада - ключ до всього, і ось тепер, коли Японія стала незаперечною володаркою Азії, у наших силах почати процес, який ми розпочали в Осаці, - зміцнити економічні зв'язки східноазійських держав із нами з метою їхнього підпорядкування нашій волі."
 JAP_final_victory: "Перемога над імперіалізмом"
 JAP_final_victory_desc: "Нарешті, перемога в наших руках. Японія стала незаперечною господинею всієї Східної Азії! Ми поставили кожного нашого конкурента на своє місце і вигнали європейців із земель, які по праву є нашими. Рідні острови стали центром азіатської економіки. Коли тигр гарчить - світ здригається!"
 JAP_prosperity_ships: "Кораблі «Процвітання»"
 JAP_prosperity_ships_desc: "Ми вже будуємо наші кораблі, використовуючи певні серійні модулі, але тепер наш попит на вантажні судна вищий, ніж будь-коли раніше. Наші світлі інженери пропонують будувати цілі кораблі з модулів, які будуть виготовлятися на заводській лінії."
 JAP_copro_development_plan: "План військово-морського розвитку Спільного Процвітання"
 JAP_copro_development_plan_desc: "Потужність верфей більшості наших союзників просто смішна. Хоча їхні робітники ніколи не зрівняються з Японським духом, ми повинні підтримати нарощування їхніх військово-морських потужностей, оскільки кожен корабель буде потрібен у наступній війні."
 JAP_naval_engineering_assistance: "Допомога у військово-морській інженерії"
 JAP_naval_engineering_assistance_desc: "Мета Програми Допомоги у Військово-Морській Інженерії проста: дозволити нашим союзникам будувати щось більше, ніж просто вантажні судна."
 JAP_unified_production: "Уніфіковане виробництво"
 JAP_unified_production_desc: "Тепер, коли військово-морське виробництво наших союзників налагоджено, ми можемо використовувати їхні нові потужності для побудови флоту, достатньо великого, щоб захистити всю Сферу."

 ### Japan Socialist Puppet Tree ###
 JAP_dawn_of_a_revolution: "Світанок революції"
 JAP_dawn_of_a_revolution_desc: "Протягом тисяч років імператори та сьогуни керували Японією, встановлюючи прецедент імперської влади. Тепер Японський пролетаріат виявив, що його ланцюги розірвані, оскільки революція нарешті прийшла на береги рідних островів і має розпочатися новий світанок."
