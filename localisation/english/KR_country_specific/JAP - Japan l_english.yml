### Puppet Ideas - Suzuha ###
 JAP_Imperial_Family_exiled: "Імператорська родина у вигнанні"
 JAP_Imperial_Family_exiled_desc: "Імператор та його родина були вислані, і їх більше ніколи не бачили на рідних островах. Хоча на вулицях можна було почути гнівні голоси населення, жодного більшого насильства не спалахнуло. Проте наш національний престиж та можливості армії помітно постраждали."
 JAP_Imperial_Family_powerless: "Імператорська родина скасована"
 JAP_Imperial_Family_powerless_desc: "Конгрес вирішив скасувати Імператорські титули Родини Ямато. Імператор та його родина тепер мають статус громадян, як і всі ми. Цей крок переконав значну частину нашого населення підтримати Соціалізм та новий режим."
 JAP_country_unrest: "Загальнонаціональні заворушення"
 JAP_country_unrest_desc: "Позбавлення монархії обурило частини Японського суспільства: деякі міста занурилися у хаос, а військові відмовляються прийняти новий режим. Сподіваємося, час загоїть усі рани."
 JAP_shattered_people_idea: "Розбитий народ"
 JAP_shattered_people_idea_desc: "Протягом століть Японський народ непохитно підтримував свого імператора та вірив у нього. Країна Японія ніколи раніше не була переможена, але всі ці вірування розбилися каскадом зруйнованих мрій та довіри, оскільки Японські рідні острови вперше опинилися в повній окупації. Потрібні серйозні зусилля, щоб відновити довіру Японського народу та подолати почуття поразки та песимізму."
 JAP_devastated_national_economy_idea: "Зруйнована національна економіка"
 JAP_devastated_national_economy_idea_desc: "Безпрецедентна поразка Японії та повна капітуляція перед іноземним окупантом призвела до краху всієї Японської економіки. Незважаючи на економічний хаос, що стався після падіння Мантецу, немає більшої економічної катастрофи в історії Японії, ніж повна окупація та призупинення всієї економічної діяльності. Оскільки економіка нації хитається і стогне під вагою боргу та відсутності інвестицій, знадобиться багато часу, перш ніж економіка Японії зможе повністю відновитися."
 JAP_disarmed_nation_idea: "Роззброєна нація"
 JAP_disarmed_nation_idea_desc: "Згідно з вимогами її нового іноземного окупанта, уся армія, флот та повітряні сили Японської імперії мають бути розпущені на деякий час як покарання за імперіалістичні війни Японії по всій Азії. Доки довіра Японії не буде відновлена в очах її сюзерена, вона не матиме жодної форми збройних сил протягом найближчого часу."
 JAP_jpel_influence_idea: "Перехід до JPEL"
 JAP_jpel_influence_idea_desc: "Японська ліга звільнення народу (JPEL) складається з Японських солдатів, які вирішили здатися Гоміндану, та біженців, що тікають з наших земель. Відкрита для всіх, JPEL об'єднує багато незадоволених громадян нашої нації обіцянкою нового світанку в Японії, який проголосить кінець мілітаризму. Перехід до JPEL зашкодив нашому моральному духу та рішучості."

# Socialist & CHI KMT
 JAP_sister_republic_idea: "Сестринська республіка"
 JAP_sister_republic_idea_desc: "Незважаючи на терор, який Японці принесли на Китайський народ, роки Китайського наставництва надихнули Японців провести власну форму національної революції. Дотримуючись Трьох принципів народу, вони також стануть товаришами у великій Пан-Азійській боротьбі проти імперіалізму. Виходячи з хаосу та приниження поразки, Японія тепер знайшла себе на шляху до нової долі — тієї, що відкидає імперіалізм та шукає солідарності зі своїми побратимами-соціалістами."
 JAP_communist_republic_of_japan_idea: "Комуністична Республіка Японія"
 JAP_communist_republic_of_japan_idea_desc: "Всупереч усім обставинам, комуністи в Японії створили справжню народну республіку — народний уряд, відданий робітникам та селянам Японії. Вони більше не будуть скуті феодальними ланцюгами Імператора та його двору, і не будуть змушені служити примхам капіталістів-мілітаристів. Новий світанок та нове сонце сходить над Азією, оскільки народ справді повстав!"
 JAP_the_revolution_successful_idea: "Революція: Успішна"
 JAP_the_revolution_successful_idea_desc: "Всупереч усім обставинам, соціалісти та соціал-демократи об'єдналися та сформували єдиний фронт, присвячений справжньому пролетаріату Японії. Тепер ми зробимо все можливе, щоб забезпечити успіх революції та щоб Червоний Прапор не перестав майоріти! Пам'ятайте про мучеників 1911 року та про тих товаришів, які були до нас, хай живе Японський соціалізм!"
 JAP_chinese_construction_crews_idea: "Китайсько-Японська схема будівництва"
 JAP_chinese_construction_crews_idea_desc: "Через руйнівні наслідки війни Китайці зголосилися допомогти нам, надіславши тисячі Китайських робітників для відновлення цивільної і навіть військової промисловості Японії. Мета полягає в тому, щоб промисловість Японії була відновлена не заради війни, а для відновлення довоєнної якості життя в Японії."
 JAP_five_year_plan_idea: "П'ятирічний план"
 JAP_war_reparations_chi_overlord_idea: "Наказ про воєнні репарації"
 JAP_war_reparations_chi_overlord_idea_desc: "Як частина болю та страждань, які Японці принесли на Китайський народ, Японський уряд погодився на принизливі умови погашення та компенсації у вигляді воєнних репарацій протягом визначеного періоду часу."
 JAP_war_reparations_overlord_idea: "Воєнні репарації"
