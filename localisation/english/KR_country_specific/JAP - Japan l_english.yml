 ## Peace and Reconciliation ##
 JAP_pan_asianism: "Використовувати паназійську риторику"
 JAP_pan_asianism_desc: "Протягом багатьох років Китай нещадно експлуатувався Європейськими державами. В ім'я паназіатизму та братерства ми будемо підривати рішучість Китайців, звертаючись до цього факту — якби лише вони змогли подолати свої розбіжності, Китай та Японія могли б працювати разом, щоб сформувати новий потужний блок, який може протистояти Західному імперіалізму."
 JAP_harmony_and_reconciliation: "Гармонія та примирення"
 JAP_harmony_and_reconciliation_desc: "Хоча воєначальники можуть чинити нам опір на кожному кроці, Китайський народ побачить нас такими, якими ми є. Багато разів ми попереджали про експлуатацію Китайського народу воєначальниками та про катастрофи, які розгорнуться, якщо Китай продовжить свій нинішній курс. Лише ми можемо звільнити їх від цього неминучого краху та забезпечити гармонійне майбутнє між Китаєм та Японією."
 JAP_unity_through_peace: "Єдність та мир"
 JAP_unity_through_peace_desc: "Настав час для всієї Китайської нації знову бути разом, не експлуатованою жадібними до влади воєначальниками. Ми закличемо воєначальників скласти зброю і справді усвідомити ідеал, до якого вони нібито прагнуть."
 JAP_finish_off_stragglers: "Добити [FROM.GetNameDef]"
 JAP_finish_off_stragglers_desc: "З тієї чи іншої причини [FROM.GetLeader] та його поплічники з [FROM.GetRulingParty] змогли уникнути конфлікту з нами, можливо, в надії зберегти владу через нейтралітет. Але Китай має бути об'єднаний під належною владою, і в нашому новому порядку мало місця для тих, хто відстає, і тому ми ліквідуємо цей останній пережиток воєнного панування."
 JAP_peace_effects: "§YКожна Китайська країна, з якою ми воюємо§!:"

