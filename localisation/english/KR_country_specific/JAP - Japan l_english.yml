 JAP_hirohito: "Хірохіто"
 JAP_hirohito_leader_desc: "§YНародився:§! §L29 квітня 1901 року в Палаці Тоґу, Аояма, Префектура Токіо, Японська імперія§!\n§YПоходження:§! §L$JAP_hirohito_desc_body$ Однак, зі зростанням внутрішньої та зовнішньої напруги, невідомо, що допоможе повести Японію до слави та величі.§!"
 JAP_hirohito_desc_body: "Довірений обов'язкам, які личать Тенно, Хірохіто посів трон після смерті свого батька 25 грудня 1926 року, правлячи як 124-й імператор на Хризантемовому троні. До цього тодішній принц-регент ледь не загинув, коли на нього було скоєно замах після невдалого анархістського повстання 1923 року, яке прагнуло наслідувати події, що відбувалися в Європі. Цей травматичний досвід залишив глибокий шрам у Хірохіто, і він нелегко пробачить будь-кого, хто спробує збити Японію зі шляху."
 JAP_hirohito_defeat_desc_body: "Схоже, на колись велику Японську державу спіткали важкі та непевні часи. Колись вважалася найсильнішою морською силою у всій Східній Азії, гідною конкурувати з Kaiserliche Marine, зухвала амбіція Японської імперії незабаром стала її падінням. Після переможної сухопутної та морської кампанії ворожих сил, Японія вперше у своїй історії опинилася повністю окупованою."
 JAP_hirohito_defeat_leader_desc: "§YНародився:§! §L29 квітня 1901 року в Палаці Тоґу, Аояма, Префектура Токіо, Японська імперія§!\n§YПоходження:§! §L$JAP_hirohito_desc_body$\n\n$JAP_hirohito_defeat_desc_body$ Хоча Хірохіто продовжує залишатися номінальним главою держави та Імператором Японського народу, лише час покаже, чи є це домовленості постійними.§!"
 JAP_hirohito_symbol_leader_desc: "§YНародився:§! §L29 квітня 1901 року в Палаці Тоґу, Аояма, Префектура Токіо, Японська імперія§!\n§YПоходження:§! §L$JAP_hirohito_desc_body$\n\n$JAP_hirohito_defeat_desc_body$ Зі створенням нової Японської держави було остаточно вирішено, що роль імператора має полягати у тому, щоб бути символом Японської держави та єдності Японського народу без будь-яких номінальних політичних повноважень.§!"

