 ### Decisions ###
 KUM_influence_category:0 "Сили в ханстві"
 KUM_influence_category_desc:0 "На нашій землі є багато груп, що прагнуть влади. Уміле керування ними стане ключем до збереження нашого правління.\n\n§YПоточний ханьський вплив:§! [?KUM_chinese_influence|L0]\n\n§YПоточний уйгурський вплив:§! [?KUM_turkic_influence|C0]\n\n§YПоточний вплив Ма Чжун'їна:§! [?KUM_military_influence|R0]"
 KUM_a_gathering_in_kumul_mission:0 "Збори у Кумулі..."
 KUM_a_gathering_in_kumul_mission_desc:0 "Збори впливових людей у місті Кумул можуть стати катастрофою для нашого режиму..."
 KUM_grant_han_concessions:0 "Надати поступки ханьцям"
 KUM_continue_secularization:0 "Продовжити секуляризацію"
 KUM_anti_han_rhetoric:0 "Антиханьська риторика"
 KUM_appoint_military_advisor:0 "Призначити військового радника"
 KUM_request_support_equipment:0 "Закупити [QIE.GetAdjective] допоміжне спорядження"
 KUM_request_infantry_equipment:0 "Закупити [QIE.GetAdjective] гвинтівки"
 KUM_pull_strings_with_industrialists:0 "Скористатися зв'язками з промисловцями"
 KUM_internal_category:0 "Допомога ханству"
 KUM_internal_category_desc:0 "Попередній хан мав слабкі зв'язки з владою у Пекіні, яка перебуває там і сьогодні. Якщо пекінський уряд цінує нашу лояльність, вони приймуть наш запит на зброю, щоб перемогти реакційні сили, що заполонили Сіньцзян."
 KUM_war_decision_category:0 "Війна в Сіньцзяні"
 KUM_war_decision_category_desc:0 "У Сіньцзяні спалахнула війна, і ми мусимо докласти всіх зусиль, аби перемогти як повстанців, так і корумпованих генералів."
 KUM_assassinate_sabit_damulla_decision:0 "Усунути Сабіта Дамуллу"
 KUM_assassinate_sabit_damulla_decision_desc:0 "Сабіт Дамулла наразі очолює коаліцію повстанських уйгурських лідерів на південному заході Сіньцзяну. Після розгрому ворогів у Діхуа ми маємо звернути погляд на Кашгар та Хотан."
 KUM_foreign_category:0 "Зовнішня політика"
 KUM_zhongying_war_on_xsm_decision:0 "Родичі-зрадники"
 KUM_zhongying_war_on_xsm_decision_desc:0 "Найбільша загроза для Хамі криється у претензіях родини Ма на ці землі. Їхня пам'ять про Ма Чжун'їна призведе до нашої дипломатичної ізоляції, якщо ми не завдамо удару першими."
 KUM_zhongying_war_on_mon_decision:0 "Забезпечити покору монголів"
 KUM_zhongying_war_on_mon_decision_desc:0 "Ми не можемо забути монголів, які грабували Джунгарію під час нашої громадянської війни. Монгольський уряд несе відповідальність за їхню присутність і має відшкодувати збитки за їхні злочини."
 KUM_zhongying_war_on_tib_decision:0 "Покарати Тибет"
 KUM_zhongying_war_on_tib_decision_desc:0 "Тибетці — першопричина нещасть Хамі. Їхня буддійська побожність псує нашу репутацію серед індійців, а пам'ять про родину Ма Чжун'їна означає, що вони неодмінно спробують помститися у майбутньому."

### Intro Screen ###
 KUM_country_intro_header:0 "§PКумульське ханство§!"
 KUM_country_intro_content:0 "§PКумульське ханство§!, що є прямим нащадком §PЧагатайського улусу§!, зуміло пережити §cдинастію Цін§!, §lеру Республіки§! та знову повернутися під крило §cЦін§!. Офіційно будучи протекторатом §cЦінської імперії§!, §PКумул§! контролює головний шлях між §PСіньцзяном§! та рештою §lКитаю§!. Династія лояльних §Pуйгурських ханів§! сплачує данину як §cімператору§! в §cПекіні§!, так і власне §Pсіньцзянському уряду§!.\n\nПопередній §Pкумульський хан§!, §PМаксуд-шах§!, був відомий найавторитарнішим правлінням у скромній історії §Pханства§!, що призвело до двох повстань проти нього у 1907 та 1912 роках. Ця ненависть до §Pхана§! перейшла і на нашого нового правителя, §PНасір-шаха§!, який прагне провести бодай мінімальні реформи в §Pханстві§!, аби зменшити непомірні податки та панщину і знову заслужити прихильність свого народу. Чи принесе це результат — поки невідомо, оскільки він досі вагається, на кого покластися: на §cуйгурську знать§!, відому як §cбеки§!, чи на своє коло §gкумульських лоялістів§! — §PЮлбарс-хана§! та колишнього антикумульського революціонера §PХоджа-Ніяза§!.\n\n§PКумул§! вважається останньою запорукою миру та процвітання в §PСіньцзяні§!, адже навіть попри наявність опонентів у §PНасіра§!, він уособлює мрію про можливе самоврядування в майбутньому для багатьох інших §Nуйгурських жителів§! §PСіньцзяну§!. Попри наші малі розміри, сам факт нашого існування відлунює по всьому §PСіньцзяну§!, роблячи нас непрямими миротворцями, які запобігають масовим повстанням."

 KUM_guide:0 "§MКліка Фаня§! ($social_democrat_coloured$) / §MБеки§! ($social_conservative_coloured$) / §MКліка Башира§! ($paternal_autocrat_coloured$) / §MКліка Насіра§! ($paternal_autocrat_coloured$) / §MКліка Чжун'їна§! ($national_populist_coloured$) / §MКліка Ходжа-Ніяза§! ($paternal_autocrat_coloured$)\n£white_dot Після перемоги у Сіньцзянській війні, у мінігрі за вплив обирайте варіанти, що посилюють ханьський вплив, аби отримати кліку Фаня; вплив Ма Чжун'їна — для кліки Чжун'їна; або уйгурський вплив — для кліки Ходжа-Ніяза.\n£white_dot Фракція, чий вплив буде на 20 пунктів вищим за всі інші, переможе через 150 днів.\n£white_dot §SФань Яонань§! перейменує Кумульське ханство на Сіньцзянську кліку.\n£white_dot §nМа Чжун'їн§! перейменує Кумульське ханство на Сіньцзянську кліку.\n£white_dot §PХоджа-Ніяз§! перейменує Кумульське ханство на Уйгурську Республіку.\n£white_dot Якщо всі фракції збалансовані (жодна не має переваги у понад 20 пунктів), ханство виживе.\n£white_dot Оберіть конституційну монархію в івенті «Рішення Башир-хана», аби отримати §cбеків§!, або автократію, аби залишити §Mкліку Насіра§! чи §Mкліку Башира§!.\n£white_dot Примітка: існує шанс (RNG), що Насір-хан втече і знову стане ханом, щойно Ма Чжун'їн приєднається до вас у війні проти Сіньцзяну. Функціонально він діє так само, як і Башир-хан.\n£white_dot Фань Яонань та Ма Чжун'їн діють як інші китайські мілітаристи: вони можуть створити національний уряд або навіть об'єднати Китай."

### Events ###
 kumul_khanate_events.1.t:0 "Зростання невдоволення проти Насіра"
 kumul_khanate_events.1.d:0 "Через повільний поступ обіцяних Насіром реформ невдоволення на наших територіях лише зростає. Кілька днів тому в передмісті Кумула спалахнули насильницькі протести, які наш радник Юлбарс-хан встиг придушити, перш ніж вони розрослися до масштабів повстань 1907 чи 1912 років. Ситуацію наразі стабілізовано, проте нам слід діяти рішуче та визначити конкретний план і терміни реформ. Народ, беки та рада радників з відчаєм чекають на наступний крок Насіра, який визначить наше майбутнє."
 kumul_khanate_events.1.a:0 "Які ж ці люди непокірні!"

 kumul_khanate_events.2.t:0 "Чутки про невдоволення серед радників"
 kumul_khanate_events.2.d:0 "Оскільки наша політика поступово схиляється на бік беків, які контролюють податкові надходження, і Юлбарс, і Ніяз починають виявляти роздратування. Юлбарс — відданий лояліст і ніколи не піде на заколот, проте Ходжа-Ніяз викликає значно більше занепокоєння. Його участь у повстаннях 1907 та 1912 років робить імовірною зраду, якщо проти нашого правління знову розпочнеться масовий бунт. Ми маємо задобрити його та Юлбарса, аби вони залишилися на нашому боці у майбутніх конфліктах із підданими."
 kumul_khanate_events.2.a:0 "Чому керувати так складно?"

 kumul_khanate_events.3.t:0 "Заворушення серед беків"
 kumul_khanate_events.3.d:0 "Беки — це уйгурська знать у Кумулі та решті Сіньцзяну, що має контролювати збір податків у регіонах та забезпечувати їх надходження до центрального уряду. Наша прихильність до ради радників замість них вочевидь розлютила беків. Найменше, що нам потрібно — це збирачі податків, які розкрадають гроші хана, або, що ще гірше, стануть на бік народу у разі повстання. Поки вони зберігають лояльність, проте ми маємо діяти обережно, аби запобігти найгіршому сценарію."
 kumul_khanate_events.3.a:0 "Ці беки завжди щось замислюють."

 kumul_khanate_events.4.t:0 "Сплата данини Сіньцзяну"
 kumul_khanate_events.4.d:0 "Наш обов'язок — щороку сплачувати данину сіньцзянському уряду через наш статус протекторату. Це переважно символічний жест, що демонструє зв’язки між династією Цін та уйгурським народом: наша данина — це просто кумульська диня, яку ми даруємо губернатору Сіньцзяну. Наразі це [SIK.GetLeader], який милостиво прийняв наш дарунок. Традиції важливі, якими б безглуздими вони не здавалися чужинцям, адже зв’язок між уйгурами та ханьцями є запорукою майбутнього миру в нашому домі."
 kumul_khanate_events.4.a:0 "Мир між народами завдяки одній дині."

 kumul_khanate_events.5.t:0 "Некомпетентність"
 kumul_khanate_events.5.d:0 "Новий кабінет міністрів, відповідальний за Хамі... гірший, ніж можна було уявити. Ці близькі друзі Цзінь Шуженя погрязли в корупції: постійне розкрадання грошей, знущання та визиск народу, а також загальна нетерпимість до всіх, хто не належить до їхнього кола. Нинішній головний міністр Хамі Лун Сєлінь не є винятком: він використовує тактику Цзіня, спрямовуючи податкові надходження до власної скарбниці. Хоча поки що це вдається приховувати, посилення влади цих корумпованих чиновників лише зашкодить нам у майбутньому цієї нової префектури."
 kumul_khanate_events.5.a:0 "Хамі справді під прокляттям."

 kumul_khanate_events.6.t:0 "Відкриття імміграції"
 kumul_khanate_events.6.d:0 "За згодою Цзінь Шуженя та Лун Сєліня було дозволено імміграцію з Ганьсу до Хамі. Хамі контролює головний шлях, що з’єднує Сіньцзян із рештою Китаю, проте попередня заборона ханства на неуйгурську імміграцію закривала китайцям доступ до регіону. Цьому покладено край: Цзінь уже відправив першу групу переселенців хуейцзу та ханьців зі своєї рідної провінції освоювати це нове порубіжжя. Ми можемо лише сподіватися, що це забезпечить процвітаюче майбутнє нашого народу навіть у найвіддаленіших куточках Центральної Азії, хоча на це знадобиться чимало часу."
 kumul_khanate_events.6.a:0 "До чудового майбутнього!"

 kumul_khanate_events.7.t:0 "Проблеми імміграції"
 kumul_khanate_events.7.d:0 "Хоча дозвіл на імміграцію в Хамі безперечно приніс покращення цьому раніше некультурному мусульманському місту, не обійшлося і без проблем. Місцеве населення розлючене нашими щедрими програмами земельної реформи, хоча їм справедливо виділили менші необроблені ділянки, аби звільнити місце для важливіших поселенців. Сталося кілька вбивств ханьських іммігрантів, проте поки що це поодинокі випадки. Схоже, кумульців таки можна приборкати."
 kumul_khanate_events.7.a:0 "Невдячне кодло."

 kumul_khanate_events.8.t:0 "Дивна пропозиція"
 kumul_khanate_events.8.d:0 "Новий збирач податків Чжан Гоху, призначений Цзінь Шуженем, нібито зацікавився молодою мусульманкою в місті та попросив її руки. Зазвичай це не варте уваги, проте Чжан не є мусульманином, тому місцеві улеми висловили рішучий протест. З невідомих причин батько дівчини погодився на шлюб, і церемонія запланована за кілька тижнів.\n\nНапруженість серед кумульців після анексії небезпечно зросла, і цей зухвалий вчинок лише піділлє масла у вогонь. Проте Цзінь Шужень нібито підтримав Чжана у цьому шлюбі, тож навряд чи його вдасться зупинити."
 kumul_khanate_events.8.a:0 "Любов не знає меж."

 kumul_khanate_events.9.t:0 "Гірка розплата"
 kumul_khanate_events.9.d:0 "Катастрофа! Напруга в Хамі виявилася вищою, ніж будь-хто міг передбачити: минулої ночі Чжан Гоху та його загін солдатів були вбиті кумульськими радикалами. Він був на бенкеті з нагоди майбутнього свята, коли велика група чоловіків влаштувала засідку на нього та його війська. Якби вони не були п'яними, у них був би шанс, але тепер їх немає.\n\nПроте це лише початок наших бід: повстанці, кількість яких зросла вдесятеро, штурмували все місто. Багато ханьських іммігрантів було вбито, їхні голови відтяли та закопали в землю. Захопивши зовнішнє місто, вцілілі ханьці та адміністратори забарикадувалися у стінах старого міста, чекаючи на підкріплення від військ Цзінь Шуженя, якщо ті прийдуть."
 kumul_khanate_events.9.a:0 "Можливо, цьому не судилося статися..."

 kumul_khanate_events.10.t:0 "Кривавий податок на Сіньцзян"
 kumul_khanate_events.10.d:0 "Залишки залоги Чжана Гоху прибули до маєтку Цзінь Шуженя з повідомленням про небачену різанину ханьців у Хамі. Схоже, кумульці були менш задоволені, ніж стверджували звіти Чжана, і його гарнізон був застигнутий зненацька натовпом мусульманських агітаторів. Ті, хто вижив, розповідають про домовлений шлюб між Чжаном та донькою улема, а також про податковий спротив, про який Чжан обіцяв доповісти Цзіню, але так і не зробив цього. Очевидно, що Хамі втрачено для людей Цзіня, і життя ханьських іммігрантів висять на волосині, якщо Цзінь не зможе завдати удару у відповідь."
 kumul_khanate_events.10.a:0 "Сіньцзян знову здригнеться від болю."

 kumul_khanate_events.11.t:0 "В облозі та в скруті"
 kumul_khanate_events.11.d:0 "Наш джихад проти ханьських окупантів зупинився, ми зайшли у глухий кут. У нас немає ні людей, ні зброї, аби розбити сили у старому місті, проте й у них бракує сил чи волі для контрнаступу. Наш найкращий генерал, Юлбарс-хан, оголосив, що вирушає на пошуки армії, здатної розгромити будь-якого ворога. Хоча багато хто сумнівається, що він знайде таке диво, подейкують, що він може укласти союз із найжорстокішим із мілітаристів родини Ма — Ма Чжун'їном. Такий крок був би безпрецедентним і викликав би багато люті, проте він дав би нам такий необхідний шанс на перемогу."
 kumul_khanate_events.11.a:0 "Сподіваємося, старий знайде те, що нам потрібно."

 kumul_khanate_events.12.t:0 "Вчасна зустріч"
 kumul_khanate_events.12.d:0 "Коли Юлбарс увійшов до намету Ма Чжун'їна, безперечно найбільшого у військовому таборі, його ледь не збив з ніг сморід опіуму. Він ледь не повернув назад, але не міг відступити від завдання, покладеного на нього богом. Скрізь цей запах, він наблизився до величної постаті Чжун'їна в центрі намету.\n\n«Тигр-принц Кумула прийшов зробити мене своєю здобиччю?» — засміявся мілітарист Ма.\n\n«Я лише старий чоловік, що шукає сили у м’ясника з Ганьсу».\n\nФормальності були короткими, бо кожен знав наміри іншого. Хоча візит мав виглядати як несподіванка, останніми тижнями вони активно листувалися. У Чжун'їна була армія без держави, а у Юлбарса — держава без армії. Коли домовленостей було досягнуто, Чжун'їн швидко вирушив зі своїми людьми, а Юлбарс пішов слідом. Зрештою, як він міг пропустити видовище цього вісника самої смерті?"
 kumul_khanate_events.12.a:0 "Найбільш нечестивий із союзів..."

 kumul_khanate_events.13.t:0 "Вісник смерті"
 kumul_khanate_events.13.d:0 "Схоже, чутки були правдивими: Юлбарс повернувся зі славетним Ма Чжун'їном. Хоча сама його присутність жахає багатьох, раптова поява тисяч нових вояків вселила страх у серця виснаженого гарнізону старого міста.\n\nКоли настала ніч, Чжун'їн пішов у наступ. Сотні кумульських вершників із палким духом кинулися на укріплення, але були вмить скошені кулеметним вогнем. Проте це не зупинило мілітариста. Протягом похмурих нічних годин хвиля за хвилею штурмували гарнізон. Атаки відбивали, але ціною величезних втрат для захисників. Коли набої закінчилися, люди залишили гвинтівки, взялися за мечі та піки і билися з первісною люттю.\n\nПроте вдача любить сміливих. На світанку тепер уже виснажені сили Чжун'їна завдали вирішального удару по залишках гарнізону. Як нагороду для солдатів старе місто було вщент розграбоване, і все цінне опинилося в руках його людей. Навіть після такого жорстокого бою Чжун'їн пообіцяв [?Root.GetLeader], що продовжуватиме кампанію, доки останні війська Цзінь Шуженя не будуть розчавлені його чоботом."
 kumul_khanate_events.13.a:0 "Жахлива сила."

 kumul_khanate_events.15.t:0 "Велика втеча"
 kumul_khanate_events.15.d:0 "Рано-вранці план, що готувався кілька тижнів, було втілено в життя. Насір-шах, який перебував у в'язниці після захоплення Цзінь Шуженем, чекав у камері на сигнал. Коли двері зачинилися за останнім охоронцем, підземеллям пролунав пташиний щебіт. Це був сигнал. Насір витягнув кілька цеглин зі стіни камери, які він розхитував тижнями. За ними був тунель, що вів до свободи. Проповзши крізь нього, він зустрів двох підозрілих чоловіків у каптурах. Один із них кинув Насіру накидку, і той поспіхом переодягнувся. Завдяки цьому Насір зміг вийти просто з Діхуа, під самим носом у [SIK.GetLeader].\n\nНовина про втечу Насіра вже дісталася Кумула, хоча сам він прибуде лише за кілька днів. Його відважна втеча вже підняла бойовий дух."
 kumul_khanate_events.15.a:0 "Чудово."

 kumul_khanate_events.16.t:0 "Повернення Насір-шаха"
 kumul_khanate_events.16.d:0 "Коли Насір в’їжджав у Кумул у супроводі двох охоронців, вулиці були забиті людьми. Вигуки селян лунали по всьому місту — він став символом стабільності в ці неспокійні часи. На честь його повернення влаштували бенкет, цього разу менш небезпечний, ніж останній для Насіра. Шах поговорив із Юлбарс-ханом, подякував йому за службу та вислухав звіт про останні події на війні. Після цього він виголосив промову, дякуючи військам та закликаючи всіх продовжувати боротьбу проти тиранів у Діхуа."
 kumul_khanate_events.16.a:0 "З поверненням."

 kumul_khanate_events.17.t:0 "Насір мертвий!"
 kumul_khanate_events.17.d:0 "Рано-вранці план, що готувався кілька тижнів, було втілено в життя. Насір-шах, який перебував у в'язниці після захоплення Цзінь Шуженем, чекав у камері на сигнал. Коли двері зачинилися за останнім охоронцем, підземеллям пролунав пташиний щебіт. Це був сигнал. Насір витягнув кілька цеглин зі стіни камери, які він розхитував тижнями. За ними був тунель, що вів до свободи. Проповзши крізь нього, він зустрів двох підозрілих чоловіків у накидках. Усе йшло за планом, поки вони не відкрили обличчя. Це були не агенти Насіра. Один із чоловіків миттєво дістав пістолет і вистрелив Насір-шаху в голову, убивши його на місці.\n\nНовина про це дійшла до нас сьогодні вранці, після того як один із справжніх агентів Насіра, виявивши пастку, втік із Діхуа."
 kumul_khanate_events.17.a:0 "Будьте ви прокляті!"

 kumul_khanate_events.18.t:0 "Насір мертвий"
 kumul_khanate_events.18.d:0 "Рано-вранці план, що готувався кілька тижнів, було втілено в життя. Насір-шах, який перебував у в'язниці, чекав у камері на сигнал. Коли двері зачинилися за останнім охоронцем, підземеллям пролунав пташиний щебіт. Це був сигнал. Насір витягнув кілька цеглин зі стіни камери та проповз у тунель, де очікував зустріти своїх людей. Проте ми дізналися про заколот заздалегідь, і [SIK.GetLeader] замінив його агентів своїми людьми. Як і було наказано, один із наших оперативників вистрелив Насіру в голову, поклавши край усім його планам."
 kumul_khanate_events.18.a:0 "Туди йому й дорога."

 kumul_khanate_events.19.t:0 "Новий лідер Кумула"
 kumul_khanate_events.19.d:0 "Після трагічної загибелі Насір-шаха в Діхуа настав час продовжити лінію престолонаслідування. Хоча син Насіра, Башир-шах, ще зовсім молодий, його офіційно зводять у сан кумульського хана. Через його юний вік Юлбарс залишатиметься регентом, поки Башир не досягне повноліття. Попри глибоку жалобу хлопця за батьком, часу на зволікання немає — війна в Сіньцзяні розгорається з новою силою."
 kumul_khanate_events.19.a:0 "Башир-шах тепер править Кумулом!"

 kumul_khanate_events.20.t:0 "Що робити з Насір-шахом?"
 kumul_khanate_events.20.d:0 "Кумульське ханство оголосило нам війну кілька тижнів тому, і тепер постає питання про подальшу долю Насір-шаха, який сидить у в'язниці в Діхуа. Поки що він у кайданах, проте столицею ширяться чутки, що він готує втечу. Якщо Насір повернеться до Кумула, це неймовірно підніме бойовий дух ворога, тоді як звістка про його смерть лише деморалізує їх. Крім того, після смерті Насіра трон успадкує його юний син Башир, який не здатен керувати. Одна куля в голову Насіра може суттєво полегшити нам цю війну."
 kumul_khanate_events.20.a:0 "Вбити його. Негайно."
 kumul_khanate_events.20.b:0 "Нехай гниє в камері."

 kumul_khanate_events.21.t:0 "Ма Чжун'їн залишає Ганьсу"
 kumul_khanate_events.21.d:0 "М’ясник із Ганьсу Ма Чжун'їн разом зі своїм поплічником Ма Хушанем та армією залишили провінцію Ганьсу. Ходили чутки, що його відвідував кумульський генерал Юлбарс-хан, і що вони готують спільне повстання. Тепер ці здогадки підтвердилися: війська Чжун'їна помічені на території Сіньцзяну."
 kumul_khanate_events.21.a:0 "Народ Ганьсу зітхнув із полегшенням!"

 kumul_khanate_events.22.t:0 "Страта Насір-шаха"
 kumul_khanate_events.22.d:0 "На світанку в Діхуа біля резиденції губернатора зібрався натовп. На сходах стояв Цзінь разом зі своїми лоялістами, серед яких був і колишній головний міністр Хамі Лун Сєлінь. Коли крізь розлючений натовп вивели Насір-шаха в тюремному вбранні, люди почали вигукувати образи. Насіра поставили на коліна, і Цзінь жестом закликав до тиші.\n\n«Насір-шаху, я, як губернатор Сіньцзяну, визнаю тебе винним у зраді та заколоті. Покарання за це — смерть. Твоє останнє слово?»\n\n«Цією кулею, Цзіню, твоє правління закінчиться».\n\nЦзінь вихопив пістолет і вистрелив Насіру в потилицю. Натовп вибухнув радісними вигуками, коли тіло хана впало на кам'яну підлогу."
 kumul_khanate_events.22.a:0 "Смерть зрадника."

 kumul_khanate_events.23.t:0 "Страта Насір-шаха"
 kumul_khanate_events.23.d:0 "(Зміст аналогічний івенту 22 — опис страти для кумульського гравця). Коли наш агент у Діхуа повідомив цю новину, вона швидко розлетілася країною. Смуток охопив націю."
 kumul_khanate_events.23.a:0 "Трагедія."

 kumul_khanate_events.26.t:0 "Перемога в Сіньцзяні"
 kumul_khanate_events.26.d:0 "Нарешті, після місяців боротьби проти тиранічних губернаторів та повстанців, ми відновили порядок у Сіньцзяні. Проте тепер головне завдання — втримати владу. Ми перетворилися з адміністрації одного маленького міста на володарів величезного регіону. Нам слід бути пильними з тими, хто пропонує допомогу. І Ходжа-Ніяз, і Ма Чжун'їн готові служити, але невідомо, чи дбають вони про народ, чи про власну вигоду. Також значний вплив матимуть ханьці: ширяться чутки, що Фань Яонань, якого вважали мертвим після подій у сіньцзянській кліці, живий. Ми маємо використовувати ці групи, але не давати їм надто багато влади, інакше вони покладуть край самому ханству."
 kumul_khanate_events.26.a:0 "Чудово."

 kumul_khanate_events.27.t:0 "Рішення [KUM.GetLeader]"
 kumul_khanate_events.27.d:0 "Тепер, коли влада в ханстві захищена від внутрішніх загроз, час подумати про майбутнє. Ще до Насіра, за правління деспотичного Максуд-шаха, почалися спроби модернізації Кумула. Ці реформи були перервані зрадою Цзінь Шуженя. Тепер [KUM.GetLeader] стоїть перед вибором: перетворити Кумульське ханство на демократичнішу державу через раду беків чи назавжди закріпити абсолютну монархію."
 kumul_khanate_events.27.a:0 "Конституційна монархія: влада бекам!"
 kumul_khanate_events.27.b:0 "Автократія: вся влада [KUM.GetLeader]!"

 kumul_khanate_events.28.t:0 "Сіньцзян просить адміністраторів"
 kumul_khanate_events.28.d:0 "Фань Яонань у Сіньцзяні визнав нас законним урядом Китаю. У своєму листі він зазначає, що як законна влада ми маємо допомогти його адміністрації. Фань стверджує, що йому бракує чесних ханьських чиновників, здатних керувати без корупції. Він благає надіслати йому досвідчених бюрократів. Ми можемо скористатися цим, аби позбутися наших найменш здібних або корумпованих кадрів."
 kumul_khanate_events.28.a:0 "Відправити досвідчених адміністраторів."
 kumul_khanate_events.28.b:0 "Відправити корумпованих адміністраторів."
 kumul_khanate_events.28.c:0 "У нас немає часу на Фаня."

 kumul_khanate_events.29.t:0 "Пекін надсилає досвідчених адміністраторів"
 kumul_khanate_events.29.d:0 "Ми отримали відповідь із Пекіна. Вони вирішили направити групу ханьських бюрократів, які допоможуть ефективно та чесно керувати Сіньцзяном."
 kumul_khanate_events.29.a:0 "Чудово."

 kumul_khanate_events.30.t:0 "Пекін надсилає корумпованих адміністраторів"
 kumul_khanate_events.30.d:0 "З Пекіна прийшла відповідь на наш запит. Вони надіслали групу адміністраторів, проте Фань впізнав у списках імена одних із найкорумпованіших бюрократів Пекіна. Схоже, центральний уряд використав наше прохання як привід, аби здихатися хабарників і зробити їх нашою проблемою."
 kumul_khanate_events.30.a:0 "Зійдуть і такі."

 kumul_khanate_events.31.t:0 "План"
 kumul_khanate_events.31.d:0 "Розрізнені повстанці Східного Туркестану об'єднані лише однією постаттю — Сабітом Дамуллою. Братів Бугра з Хотана та купця-бека Тимура тримає разом лише Сабіт. Якщо усунути його, коаліція розвалиться. Після допиту ми дізналися місцеперебування Дамулли. Військовий штаб вирішив: час діяти. Найкраще для цієї місії підходить генерал Махмут Мухіті. Раніше він був пов'язаний з тюркським рухом за незалежність, але зараз довів свою лояльність нам. Ми відправимо його з невеликим загоном спецпризначенців, аби вони напали на будинок Дамулли, поки той спить."
 kumul_khanate_events.31.a:0 "Щасти Мухіті."

 kumul_khanate_events.32.t:0 "Замах на Сабіта Дамуллу!"
 kumul_khanate_events.32.d:0 "Сталася трагічна подія. Поки Сабіт Дамулла спав у своєму будинку, охоронці безтурботно сиділи зовні. Один із них, що саме розбирав рушницю, отримав кулю в голову. Постріл розірвав тишу долини, і загін із 18 солдатів під командуванням Махмута Мухіті кинувся на штурм. Вони перебили охорону зовні, втративши трьох своїх. При спробі увійти в будинок ще двоє нападників загинули від вогню з вікон. Мухіті вибив двері й особисто застрелив ще одного охоронця. Загін зачистив будинок, але коли Мухіті увірвався до спальні Сабіта, він знайшов лише порожнє ліжко та відчинене вікно. Дамулла вислизнув. За годину до будинку прибули сотні повстанців, проте Мухіті та його люди вже зникли.\n\nПопри невдачу, замах мав серйозні наслідки. Переляканий Сабіт Дамулла пішов у підпілля, що майже паралізувало зв’язок між підрозділами повстанців. Їхні дивізії дезорганізовані та подекуди починають ворогувати між собою."
 kumul_khanate_events.32.a:0 "Будьте ви прокляті!"

 kumul_khanate_events.33.t:0 "Провал замаху на Сабіта Дамуллу"
 kumul_khanate_events.33.d:0 "Махмут Мухіті повернувся, не виконавши завдання. Він розповів, як його люди штурмували будинок і перебили охорону, проте Сабіт встиг утекти через вікно спальні.\n\nВтім, це не повна поразка. Наші шпигуни повідомляють, що Дамулла охоплений параноєю і повністю ізолював себе від оточення. Це спричинило повний хаос у лавах сил Східного Туркестану."
 kumul_khanate_events.33.a:0 "Не найгірший результат."

 kumul_khanate_events.50.t:0 "Наша адміністрація занадто слабка"
 kumul_khanate_events.50.d:0 "Як і очікувалося, наша адміністрація наразі не здатна ефективно керувати провінцією. У Сіньцзяні спалахнула низка дрібних повстань: хтось досі вірний Цзіню, хтось звик до анархії, а більшість просто лютує через брак їжі. [KUM.GetLeader] вже збирався відправити Ма Чжун'їна на придушення бунтів, коли надійшла звістка: Фань Яонань живий. Ханьський бюрократ переховувався в гірському селі. Тепер він прибув до Кумула, аби присягнути на вірність [KUM.GetLeader] та запропонувати допомогу в організації держави. Він популярний серед ханьців Сіньцзяну, проте чи варто довіряти йому таку велику відповідальність так швидко — питання спірне."
 kumul_khanate_events.50.a:0 "Використати адміністративний талант Фань Яонаня для наведення порядку."
 kumul_khanate_events.50.b:0 "Використати військову силу Ма Чжун'їна для наведення порядку."
 kumul_khanate_events.50.c:0 "Адміністрація впорається сама, втручання не потрібне."

 kumul_khanate_events.51.t:0 "Ходжа-Ніяз збирає уйгурських лідерів"
 kumul_khanate_events.51.d:0 "Після нашої перемоги Ходжа-Ніяз почав подорожувати провінцією, зустрічаючись із лідерами уйгурських племен на півдні. Хоча це допомагає зміцнити нашу владу в регіоні, дехто побоюється, що Ніяз просто збирає прихильників для себе. Якщо потрібно, ми можемо відправити Ма Чжун'їна, аби той продемонстрував силу і стримав амбіції Ходжа-Ніяза."
 kumul_khanate_events.51.a:0 "Нехай робить що хоче."
 kumul_khanate_events.51.b:0 "Відправити Ма Чжун'їна, аби той змусив його зупинитися."

 kumul_khanate_events.52.t:0 "Фань веде переговори з великим бізнесом"
 kumul_khanate_events.52.d:0 "Сіньцзян — гірський, малонаселений і відсталий край. Проте деякі китайські бізнесмени вбачають у ньому потенціал. Стало відомо, що Фань Яонань провів серію зустрічей із великими підприємцями та власниками фабрик. Кажуть, він навіть спілкувався з інвесторами з Пекіна, намагаючись переконати їх будувати заводи в Сіньцзяні."
 kumul_khanate_events.52.a:0 "Що він замислив..."

 kumul_khanate_events.53.t:0 "Ма Чжун'їн готує рейд"
 kumul_khanate_events.53.d:0 "Ми дізналися, що Ма Чжун'їн, м’ясник із Ганьсу, планує набіг на кілька сіл поблизу Діхуа, ймовірно, аби пограбувати їх та відібрати опіум. Юлбарс-хан пропонує план: дати Чжун'їну більше влади в уряді та підвищити йому платню, аби він залишився в місті. Проте Ходжа-Ніяз вважає це жахливою ідеєю, стверджуючи, що Чжун'їн надто небезпечний, аби наділяти його додатковими повноваженнями."
 kumul_khanate_events.53.a:0 "Дати йому те, що він просить."
 kumul_khanate_events.53.b:0 "Грабіжник має грабувати."

 kumul_khanate_events.54.t:0 "Фань веде діалог із Пекіном"
 kumul_khanate_events.54.d:0 "Бюрократ Фань Яонань зробив публічну заяву в Діхуа про свої зв’язки з урядом у Пекіні. Хоча це додає нашому режиму легітимності, це також створює ілюзію, ніби Фань має значно більше влади, ніж насправді. Дехто починає вірити, що Фань — єдина людина в нашому уряді, яка має законне право правити."
 kumul_khanate_events.54.a:0 "Тривожно."

 kumul_khanate_events.55.t:0 "Зростання нестабільності"
 kumul_khanate_events.55.d:0 "Головна проблема після захоплення Діхуа — утримати владу. Наша маленька адміністрація тепер має керувати величезним Сіньцзяном. Нестабільність зростає щодня і наближається до критичної межі. Є рішення: армія. Пропонують надати військовим надзвичайні повноваження для наведення порядку. Проте з політичного погляду це може бути небезпечним кроком."
 kumul_khanate_events.55.a:0 "Надати армії більше влади."
 kumul_khanate_events.55.b:0 "Нестабільність мине сама собою."

 kumul_khanate_events.56.t:0 "Повстання уйгурів на півдні"
 kumul_khanate_events.56.d:0 "Уйгурські племена на півдні, особливо біля Хотана, живуть у хаосі з моменту падіння Цзінь Шуженя. Озброєні лідерами повстанців, вони грабують і палять села. Це треба зупинити. У нас є вибір: відправити Ходжа-Ніяза для мирних переговорів — він дипломат і надзвичайно популярний серед уйгурів. Або ж ми можемо розчавити заколотників залізним кулаком Ма Чжун'їна та його залежних від опіуму солдатів, які тільки й чекають на наказ діяти."
 kumul_khanate_events.56.a:0 "Ходжа-Ніяз залагодить ситуацію мирно."
 kumul_khanate_events.56.b:0 "Ма Чжун'їн покінчить із заколотом силою."

 kumul_khanate_events.57.t:0 "Зростання імміграції"
 kumul_khanate_events.57.d:0 "Після завершення війни з попередньою адміністрацією ханьська імміграція знову посилилася. Шлях через Кумул переповнений людьми, які переїжджають до регіону в надії почати нове життя. Однак деякі політики ставлять під сумнів доцільність такого відкритого кордону."
 kumul_khanate_events.57.a:0 "Нехай їдуть."
 kumul_khanate_events.57.b:0 "Закрити кордон."

 kumul_khanate_events.58.t:0 "Захисники від уйгурських набігів"
 kumul_khanate_events.58.d:0 "М’ясник із Ганьсу Ма Чжун'їн вселяє жах у кожного, кому не пощастило зустріти його армію. У відповідь на посилення його грабіжницьких рейдів Ходжа-Ніяз сформував загін захисту уйгурів. Хоча ця група гарантує безпеку населення, ми ризикуємо дати Ходжа-Ніязу занадто багато влади. З іншого боку, розпуск загону розв'яже руки Ма Чжун'їну."
 kumul_khanate_events.58.a:0 "Ходжа-Ніяз має розпустити свій загін."
 kumul_khanate_events.58.b:0 "Нехай Ходжа-Ніяз захищає народ, якщо бажає."

 kumul_khanate_events.59.t:0 "Необхідність фінансування"
 kumul_khanate_events.59.d:0 "Для підтримки порядку в Сіньцзяні нам конче потрібні кошти. Ми вичерпали майже всі резерви, розширюючи адміністрацію та намагаючись зберегти мир. Потрібні гроші є у трьох найвпливовіших людей у країні: Ходжа-Ніяза, Фань Яонаня та Ма Чжун'їна. Ми маємо попросити когось із них поділитися коштами."
 kumul_khanate_events.59.a:0 "Скористатися коштами Фаня."
 kumul_khanate_events.59.b:0 "Скористатися коштами Ходжа-Ніяза."
 kumul_khanate_events.59.c:0 "Скористатися коштами Ма Чжун'їна."

 kumul_khanate_events.70.t:0 "Низькі податкові надходження"
 kumul_khanate_events.70.d:0 "Протягом століть, поки ми були лояльні до режиму в Діхуа, більшу частину доходів ми отримували саме через них. Сам регіон Кумул дуже малий, і зборів із нього бракувало. Раніше кумульці сплачували податки худобою. Тепер, взявши Діхуа під прямий контроль, ми зіткнулися з проблемою: у нас немає належної податкової інфраструктури. Нам бракує збирачів та сили для примусу до сплати. У віддалених районах корумповані чиновники попередньої влади досі збирають податки, але забирають їх собі. Юлбарс-хан уже готує загони, аби навести лад у фінансовій сфері."
 kumul_khanate_events.70.a:0 "Прокляття!"

 kumul_khanate_events.71.t:0 "Ма Чжун'їн відступає в гори"
 kumul_khanate_events.71.d:0 "Відколи наше правління в Сіньцзяні зміцнилося, Ма Чжун'їн відверто нудьгує від політичних ігор. Він прийшов до Кумула за владою, але, зазнавши невдачі, вирішив відступити в гори, аби повернутися до звичних набігів. Він обіцяв знову з'явитися лише у разі великої війни. Жителі Сіньцзяну, принаймні ті, чиї села він не грабує, зітхнули з полегшенням: М’ясник більше не претендує на владу в провінції."
 kumul_khanate_events.71.a:0 "М’ясник залишив будівлю."

 kumul_khanate_events.72.t:0 "Запровадження ісламського права"
 kumul_khanate_events.72.d:0 "Більшість населення Сіньцзяну сповідує іслам. Наша династія — уйгурська, а цей етнос культурно ближчий до тюркських народів Центральної Азії, ніж до ханьців. Тому було вирішено поступово приводити закони провінції у відповідність до ісламських норм. Проте ханьське населення, що нещодавно переселилося до регіону, чинить запеклий опір, вимагаючи збереження світського ладу."
 kumul_khanate_events.72.a:0 "Невдовзі вони всього навчяться."

 kumul_khanate_events.80.t:0 "Зустріч з уйгурськими повстанцями"
 kumul_khanate_events.80.d:0 "Ходжа-Ніяз зустрівся з лідерами колишніх повстанців Східного Туркестану. Це був ризикований крок, заснований на спільній етнічній приналежності. Після багатогодинних розмов у кумульських медресе повстанці погодилися підкоритися Ходжа-Ніязу. В обмін на це він пообіцяв їм місця в уряді заради стабільності в регіоні."
 kumul_khanate_events.80.a:0 "Агабей!"

 kumul_khanate_events.81.t:0 "Проблеми з шаріатом"
 kumul_khanate_events.81.d:0 "Ухвалення конституції заклало основу для впровадження шаріату в Кумулі, проте проблеми виникли негайно. Останній муфтій Сіньцзяну втік до [773.GetCapitalVictoryPointName] ще десятиліття тому. Призначення нового муфтія викликає суперечки, оскільки не існує єдиного протоколу вибору головного судді серед імамів. Для тих, хто неохоче приєднався до Кумула, той факт, що ідея незалежного Східного Туркестану народилася в медресе Кашгара, вже робить майбутнього муфтія політичним інструментом, а не незалежним юристом, як того вимагає Коран."
 kumul_khanate_events.81.a:0 "Якби ж ми могли залучити Шакіба Арслана..."

 kumul_khanate_events.82.t:0 "Угода з монголами про гвинтівки"
 kumul_khanate_events.82.d:0 "Адміністрація зрозуміла, що ексклюзивна торгівля з османами вигідна більше їм, ніж нам. Наш агент зміг вийти на монгольських торговців. Монголи, які майстерно грабують російські та китайські склади, готові продати нам зброю. В обмін на партію гвинтівок [KUM.GetLeader] пообіцяв розрахуватися вишуканими хотанськими килимами."
 kumul_khanate_events.82.a:0 "Вигідна угода."

 kumul_khanate_events.90.t:0 "Розвиток міст"
 kumul_khanate_events.90.d:0 "Століття політичного хаосу в Китаї породили в Кумулі покоління, яке покладається лише на себе, цурається сучасної політичної думки і лишається заручником неграмотності. Аби подолати це невігластво, [KUM.GetLeader] максимально знизив ціну на оселення в містах. Це має заохотити кочівників осісти в центрах, де владі буде легше їх контролювати."
 kumul_khanate_events.90.a:0 "Тільки не смійте називати це вестернізацією!"

 kumul_khanate_events.91.t:0 "Усі дороги ведуть до Діхуа"
 kumul_khanate_events.91.d:0 "Фань Яонань розпочинає втілення плану «Усі дороги ведуть до Діхуа». Проєкт будівництва мережі шляхів, що з'єднають усю країну зі столицею, був тепло зустрінутий народом. Люди пам'ятають, як їм доводилося мандрувати через пустелю Такла-Макан, аби уникнути зустрічі з жадібними арміями. Нові дороги також будуть прокладені через стратегічно важливі оази."
 kumul_khanate_events.91.a:0 "Чудово."

 kumul_khanate_events.92.t:0 "Ще один шлях до Китаю"
 kumul_khanate_events.92.d:0 "Дорога між Кумулом та Хесі завжди була небезпечною для мандрівників: бандити, шахраї та численні пастки чекали на кожного біля Західної брами. Для [KUM.GetLeader] цей занедбаний шлях є головною перешкодою для отримання допомоги з Китаю. Тому було наказано заново заасфальтувати дорогу та посилити охорону, аби остаточно вибити розбійників із регіону."
 kumul_khanate_events.92.a:0 "Добра робота."

 kumul_khanate_events.100.t:0 "Бенкет у місті Кумул"
 kumul_khanate_events.100.d:0 "Місяцями міністри та чиновники працювали над зміцненням влади Кумула в Сіньцзяні. Через поганий зв'язок [KUM.GetLeader] вирішив скликати велику зустріч, супроводжувану грандіозним бенкетом. Хоча офіційно метою було обговорення стабільності, всі розуміли: шах і Юлбарс-хан хочуть приборкати ключові постаті уряду — уйгура-відступника Ходжа-Ніяза, ханьського бюрократа Фань Яонаня та м’ясника Ма Чжун'їна. Хоча вони клянуться у вірності, їхні справжні наміри викликають острах.\n\nМісто гуділо від приготувань. Першим прибув Фань Яонань зі своїми прибічниками, за ним — Ходжа-Ніяз із гірськими воїнами. Останнім, із запізненням на годину та шлейфом опіумного смороду, з'явився Ма Чжун'їн. Зустріч у палаці тривала годинами і була сповнена сварок: Ніяз погрожував піти, а Чжун'їн навіть тицяв пістолетом в обличчя Юлбарсу. Проте на заході сонця згоди було досягнуто. На стіл подали наїдки, і присутні підняли келихи за стабільність у Сіньцзяні."
 kumul_khanate_events.100.a:0 "Ханство в безпеці."

 kumul_khanate_events.101.t:0 "Бенкет у місті Кумул"
 kumul_khanate_events.101.d:0 "(Опис прибуття Фаня та Чжун'їна аналогічний попередньому). Проте Ходжа-Ніяз так і не з'явився. Поки шах та Юлбарс розгублено розпочинали зустріч без нього, Ніяз увійшов до міста на чолі 500 вірних солдатів. Перебивши міську варту та людей Ма Чжун'їна, вони оточили палац. Ходжа-Ніяз увірвався до зали засідань і оголосив про арешт Фаня, Чжун'їна, шаха та Юлбарс-хана. Схоже, вони більше не побачать волі. Маючи величезний вплив в уряді, Ходжа-Ніяз остаточно захопив владу."
 kumul_khanate_events.101.a:0 "Ходжа-Ніяз тепер править у Кумулі."

 kumul_khanate_events.102.t:0 "Бенкет у місті Кумул"
 kumul_khanate_events.102.d:0 "(Опис прибуття Ніяза та Чжун'їна аналогічний попередньому). Проте Фань Яонань, попри свої обіцянки прийти, був відсутній. Поки шах розпочинав зустріч, Фань увійшов до Кумула з 250 ханьськими солдатами. Міська варта, яку він підкупив заздалегідь, перейшла на його бік. Солдати Ма Чжун'їна, що розслабилися в опіумній курильні, були швидко знищені. Люди Фаня оточили палац, а сам він увірвався на бенкет та заарештував усіх лідерів. Відтепер Фань Яонань є єдиним господарем Сіньцзяну."
 kumul_khanate_events.102.a:0 "Фань Яонань тепер править у Кумулі."

 kumul_khanate_events.103.t:0 "Бенкет у місті Кумул"
 kumul_khanate_events.103.d:0 "(Опис прибуття Фаня та Ніяза аналогічний попередньому). Але Ма Чжун'їн зник. Поки шах та Юлбарс обмінювалися тривожними поглядами, М’ясник увійшов до міста з 500 загартованими в боях воїнами. Винищивши варту, вони оточили палац. Ма Чжун'їн увійшов до зали, дістав пістолет і холоднокровно пустив по кулі в потилицю кожному: Фань Яонаню, шаху та Юлбарс-хану. Його влада тепер незаперечна."
 kumul_khanate_events.103.a:0 "Ма Чжун'їн тепер править у Кумулі."

 kumul_khanate_events.110.t:0 "Хвиля злочинності: контрабанда опіуму"
 kumul_khanate_events.110.d:0 "Працьовиті кумульські фермери зуміли зберегти свої незаконні посіви опіуму під час війни. Тепер, коли поліція відволіклася на придушення політичного насильства, у селах з'явилися контрабандисти. Колишні солдати Яна Цзенсіня, яким немає місця за нового режиму, масово відкривають опіумні курильні. Імами Кумула, які роками проповідували проти наркотиків як імперіалістичної змови, у повному розпачі."
 kumul_khanate_events.110.a:0 "Ми дарма купували поліцейським таку гарну форму!"

 kumul_khanate_events.111.t:0 "Бандити порушують кордон Кумула"
 kumul_khanate_events.111.d:0 "Звичайна розбійність повернулася до Кумула. Колишні шахраї, торговці людьми та фальшивомонетники об'єдналися у злочинні синдикати. Найгірше те, що деякі з цих бандитів — колишні державні чиновники, чий авторитет усе ще має вагу у віддалених сільських куточках."
 kumul_khanate_events.111.a:0 "Принаймні нам не доведеться їх милувати."

 kumul_khanate_events.112.t:0 "Найкращий опіум у Китаї"
 kumul_khanate_events.112.d:0 "Незалежні спостерігачі та злочинці підтверджують: кумульський опіум — найкращий у Китаї. Один відважний репортер навіть опублікував «огляд» наркосцени, пояснивши, що курить опіум лише для контролю його якості, «як це роблять правоохоронці». Він додав, що місцевий продукт став надто міцним, і звинуватив у цьому [QIE.GetLeader], який своїми діями «пошкодив мізки багатьом людям»."
 kumul_khanate_events.112.a:0 "Чудово."

 kumul_khanate_events.113.t:0 "Імператор Пуї визнає Кумул"
 kumul_khanate_events.113.d:0 "Звістку про реставрацію династії Маньчжурів спочатку зустріли скептично, проте нова прокламація молодого імператора змінила все. Пуї продемонстрував справжню мудрість, підтримавши нашу автономію від Сіньцзяну. Законна спадщина віків об'єднується проти сучасного терору Цзінь Шуженя."
 kumul_khanate_events.113.a:0 "Досконало."

### Focuses ###
 KUM_nasir_reign:0 "Реформи Насіра"
 KUM_nasir_reign_desc:0 "Політика Максуд-шаха, що полягала у непомірних податках та примусовій панщині, настільки зневажена народом Кумула, що будь-який крок до її скасування принесе владі шалену популярність."

 KUM_working_begs:0 "21 бек"
 KUM_working_begs_desc:0 "Збори 21 бека — найбагатших уйгурських землевласників Кумула — тиснуть на Насіра, вимагаючи взяти під контроль скарбницю. Беки прагнуть оновлення перепису населення, аби зменшити свій податковий тягар."

 KUM_reordering_tax:0 "Упорядкування податків"
 KUM_reordering_tax_desc:0 "Першу вимогу беків щодо перепису та податкової реформи можна виконати. Щойно буде проведено облік усіх орендарів, вільних людей та худоби, деякі види доходів, як-от виробництво халяльного м'яса та машинна праця, будуть звільнені від оподаткування."

 KUM_opening_autonomy:0 "Відкриття автономії"
 KUM_opening_autonomy_desc:0 "Максуд-шах вважав, що зможе зміцнити свою владу, закривши місто для іммігрантів без дозволу Пекіна. Беки просять дозволити в'їзд до міста додатковим уйгурським громадянам та ставитися до них як до вільних людей."

 KUM_reform_administration:0 "Малі адміністративні реформи"
 KUM_reform_administration_desc:0 "Палац у Кумулі укомплектований абсолютно некваліфікованими бюрократами. Максуд-шах не наймав нікого з результатами імператорських іспитів. Просто вимагаючи від наших адміністраторів сертифікації, ми зможемо відсіяти найгірших дармоїдів."

 KUM_incorporate_advisory:0 "Регулювання ради радників"
 KUM_incorporate_advisory_desc:0 "Вплив двох радників завжди був ризиком для ханства. Особливо це стосується Ходжа-Ніяза. Якщо ми відправимо радників на міські стіни, ми зможемо провести реформи без їхнього втручання."

 KUM_increase_begs:0 "30 беків"
 KUM_increase_begs_desc:0 "Зі збільшенням кількості уйгурів у Кумулі було б корисно додати ще дев'ятьох чоловіків до ради. Тридцять беків, можливо, і не зможуть вийти з глухого кута при голосуванні, проте ми отримаємо користь від їхніх порад."

 KUM_keys_kumul:0 "Ключі від Кумула"
 KUM_keys_kumul_desc:0 "Влада над залогою Кумула десятиліттями належала радникам. Беки обіцяють, що їхні уйгурські ополченці зможуть охороняти міські стіни без такого жорстокого визиску народу. Це зніме частину наших турбот."

 KUM_kind_hand:0 "Добра рука"
 KUM_kind_hand_desc:0 "Оновлення іміджу кумульського хана потребує постійної підтримки беків. Завдяки більш гідному вигляду, дотриманню мусульманських звичаїв та добрим словам беків Насір-шах зможе повернути довіру народу."

 KUM_crush_corvee:0 "Скасування панщини"
 KUM_crush_corvee_desc:0 "Використання примусової праці для впорядкування земель та утримання міста було ідеєю Максуда. Згідно з традиційним ісламським правосуддям та китайським цивільним правом, панщина не повинна використовуватись, якщо злочини робітників цього не виправдовують."

 KUM_increased_constitutionalism:0 "Посилення конституціоналізму"
 KUM_increased_constitutionalism_desc:0 "Різноманітні політичні конституції, що ширяться південним та східним Китаєм, нарешті дісталися Кумула. Щонайменше вони можуть стати основою для написання наших майбутніх законів у сучасний спосіб."

 KUM_working_advisory:0 "Два радники"
 KUM_working_advisory_desc:0 "Два генерали-радники, Юлбарс-хан та Ходжа-Ніяз, тиснуть на Насіра, вимагаючи захисту його володінь. Для початку слід скласти списки радикальних лівих у Кумулі та встановити за ними нагляд. Про всяк випадок."

 KUM_opening_reform:0 "Коригування повноважень"
 KUM_opening_reform_desc:0 "Максуд-шах залишив лише тимчасову роль для своїх військових радників, роздаючи їм завдання за власною забаганкою. Визначення конкретних ролей дозволить Юлбарс-хану та Ходжа-Ніязу ефективніше захищати Кумул."

 KUM_niyaz_ideals:0 "Ідеали Ходжа-Ніяза"
 KUM_niyaz_ideals_desc:0 "Ходжа-Ніяз під час свого невдалого повстання проти батька Насіра помітив, що його бійці билися краще, коли за ними наглядав імам і вони мали час на щоденну молитву. Ніяз вірить, що ця політика змусить захисників Кумула битися з духом воїнів давнини."

 KUM_sideline_begs:0 "Усунення беків"
 KUM_sideline_begs_desc:0 "21 бек Кумула — це релікт самотності Максуд-шаха та його відчуженості від інших мусульман через пияцтво. Буде краще, якщо радники зустрічатимуться з Насіром без попередніх консультацій із беками."

 KUM_yulbars_doctrine:0 "Доктрина Юлбарса"
 KUM_yulbars_doctrine_desc:0 "Юлбарс-хан, що служив ханству ще з часів діда Насіра, має достатньо досвіду, аби пропонувати реформи. Він вважає, що переведення платні солдатам зі срібла на товари зробить їх більш залежними від держави."

 KUM_lower_taxation:0 "Зниження податків"
 KUM_lower_taxation_desc:0 "Ще одна область реформ Юлбарс-хана включає зниження податків для солдатів нашої армії, аби заохотити більше людей до служби, хоча це і призведе до незначного зменшення доходів."

 KUM_cavalry_horde:0 "Кумульський кавалерійський полк"
 KUM_cavalry_horde_desc:0 "Радники рекомендують сформувати тимчасовий кавалерійський полк за зразком полків хуейцзу. Це дозволить Насіру швидко придушувати повстання, що час від часу спалахують у Кумулі."

 KUM_strengthining_nasir:0 "Збереження влади хана"
 KUM_strengthining_nasir_desc:0 "Радники створюють образ Насіра як доброзичливого диктатора, що захистить Кумул від хвиль невизначеності, які несуть китайці. Водночас вони змальовують його як звитяжного нащадка Чагатая, подібного до тих, хто перемагав Тибет."

 KUM_maintaining_corvee:0 "Збереження панщини"
 KUM_maintaining_corvee_desc:0 "Хоча це і жорстоко, радники виправдали примусову працю поза межами ісламського права, стверджуючи, що злочинці перебувають на межі перетворення на фаджирів (грішників), і що ця робота виснажить їхню енергію для скоєння нових злочинів."

 KUM_soft_fist:0 "М'який кулак"
 KUM_soft_fist_desc:0 "Радники почали поширювати свою військову політику на інші верстви населення Кумула. Громадяни, що стикаються з ними, бачать у Насірі побожну та надійну заміну Максуду, що викликає у народу щире захоплення."

 KUM_xinjiang_administration:0 "Сіньцзянська адміністрація"
 KUM_xinjiang_administration_desc:0 "День підкорення настав через злочинні дії Цзінь Шуженя. Магістрати хана тепер змушені виконувати накази китайської залоги. Нам знадобиться час, аби зрозуміти, чого саме загарбники хочуть від нашої провінції."

 KUM_greater_taxes:0 "Нові податки"
 KUM_greater_taxes_desc:0 "Першою вимогою залоги є надання обіцяної данини для уряду Цін. Данини, вочевидь, немає, тож залога змусила нас підвищити податки для городян. Це безсумнівно розлютить уйгурів."

 KUM_hire_more_tax_collectors:0 "Найм нових збирачів податків"
 KUM_hire_more_tax_collectors_desc:0 "Залога висварила наших збирачів податків, які все ще сподіваються на звільнення Насіра. Ми маємо прийняти запропонованих залогою збирачів — усі вони китайці і будуть нещадно визискувати уйгурів."

 KUM_even_higher_taxes:0 "Ще вищі податки!"
 KUM_even_higher_taxes_desc:0 "Городяни не в змозі забезпечити достатньо їжі для щорічної данини Пекіну, яку залога наполягає накопичувати, попри те, що Пекін нічого не просив уже роками. Вводяться нові податки; залога вірить, що це втішить Цзінь Шуженя."

 KUM_seize_nobles_money:0 "Конфіскація грошей знаті"
 KUM_seize_nobles_money_desc:0 "Залога почала полювання на беків ханства задля додаткового оподаткування під приводом «національної безпеки». Родини беків тепер переховуються разом зі своїм золотом, бо обоє є цілями для загребущих рук загарбників."

 KUM_punish_opposition:0 "Покарання опозиції"
 KUM_punish_opposition_desc:0 "Залога нарешті зрозуміла, що магістрати намагаються чинити опір. Серед збирачів податків та бюрократів були звільнені всі ті, хто відмовився зректися символів Насіра — Корану та своїх власних традиційних імен."

 KUM_road_through_hami:0 "Шлях через Хамі"
 KUM_road_through_hami_desc:0 "Шлях від Хамі до Діхуа підступний: він пролягає паралельно до Таримської западини і оточений милями пустелі. Залога наказала зібрати нову групу на панщину для ремонту дороги на пекучій спеці. Шанси на повернення в'язнів мізерні."

 KUM_consolidating_xinjiang:0 "Консолідація Сіньцзяну"
 KUM_consolidating_xinjiang_desc:0 "Ризик Юлбарс-хана та Ходжа-Ніяза виправдався. Міста Сіньцзяну тепер наші, і наше наступне завдання — знайти достойних людей, які стануть нашими союзниками в новій адміністрації."

 KUM_rebuilding_xinjiang:0 "Відбудова Сіньцзяну"
 KUM_rebuilding_xinjiang_desc:0 "Лихо, що охопило Кумул та Сіньцзян, нарешті позаду, і ми можемо почати відбудову. До міст будуть відправлені посланці, аби знайти знедолених людей, яких ми зможемо підняти своїм заступництвом."

 KUM_southern_textiles:0 "Південний текстиль"
 KUM_southern_textiles_desc:0 "Виробники килимів у Хотані потерпають без клієнтів. Ма Хушань запропонував найняти хотанських ткачів, аби монополізувати виробництво їхніх славетних килимів."

 KUM_expand_kumul_road:0 "Розширення кумульського шляху"
 KUM_expand_kumul_road_desc:0 "Дорога вздовж Таримської западини була місцем багатьох битв на шляху до перемоги. Зусилля, докладені в'язнями на панщині для її ремонту, доведеться повторити."

 KUM_nascent_industry:0 "Зародження промисловості"
 KUM_nascent_industry_desc:0 "Штамповані форми для зброї та примітивні кузні — це лише початок повноцінної військової промисловості в Кумулі. Нам знадобляться нові інженери та генератори енергії, проте результат того вартий."

 KUM_military_expansion:0 "Військова експансія"
 KUM_military_expansion_desc:0 "Оборонні дивізії, поспіхом сформовані під час війни, мають бути замінені. Не поспішаючи, ми зможемо спланувати більшу та надійнішу армію для майбутніх конфліктів."

 KUM_civilian_investments:0 "Цивільні інвестиції"
 KUM_civilian_investments_desc:0 "Спустошення, принесене в Кумул, торкнулося кожної оселі. Було б вельми корисно витратити час на відбудову зруйнованих кузень."

 KUM_new_manufactories:0 "Нові мануфактури"
 KUM_new_manufactories_desc:0 "До Кумула надходять вантажі з сучасними інструментами для лиття, які будуть передані нашим лояльним ветеранам. Весь Сіньцзян невдовзі почне процвітати."

 KUM_chinese_integration:0 "Інтеграція китайців"
 KUM_chinese_integration_desc:0 "Використання китайської мови не повинно бути заборонене в Кумулі. Навпаки, двомовна адміністрація гарантуватиме, що наші накази виконуватимуться з більшою точністю, ніж на те були здатні наші вороги."

 KUM_restart_immigration:0 "Відновлення імміграції"
 KUM_restart_immigration_desc:0 "Біди Західної брами надто довго відлякували потенційних іммігрантів. Декларація [KUM.GetLeader], сподіваємось, заохотить переселення та вгамує страхи перед подальшою війною."

 KUM_reach_out_to_china:0 "Зв'язок із Китаєм"
 KUM_reach_out_to_china_desc:0 "Данина, яку ми сплачували Пекіну кожні сім років, дозволила нам накопичити певний досвід спілкування з північними мілітаристами. Ми маємо використати ці зв'язки та звернутися до Китаю за військовим захистом."

 KUM_autonomy_in_vogue:0 "Популярна автономія"
 KUM_autonomy_in_vogue_desc:0 "Аби керувати величезними просторами Сіньцзяну, ми маємо повернутися до того самого принципу автономії, який нам надав губернатор Ян Цзенсінь."

 KUM_promote_local_businesses:0 "Підтримка місцевого бізнесу"
 KUM_promote_local_businesses_desc:0 "Торгівля в Сіньцзяні відображає десятиліття напруженості та сегрегації, нав'язаної нам губернаторами. Тепер ми можемо сприяти гармонійному розвитку економіки, якщо станемо покровителями місцевого бізнесу в усіх великих містах Сіньцзяну."

 KUM_pardon_rebellious_uyghurs:0 "Помилування уйгурських повстанців"
 KUM_pardon_rebellious_uyghurs_desc:0 "Міністерство вважає, що уйгурів можна легко змусити прийняти наше правління. Слід помилувати групу побожних уйгурів, якщо вони погодяться скласти зброю."

 KUM_seek_legitimacy:0 "Пошук легітимності"
 KUM_seek_legitimacy_desc:0 "Більша частина Китаю вважає нас лише бунтівними слугами. Вишукані подарунки можуть переконати їхніх господарів у тому, що ми гідні стати наступниками влади в Сіньцзяні."

 KUM_internal_stability:0 "Внутрішня стабільність"
 KUM_internal_stability_desc:0 "Довгий список безвідповідних претензій чекає на наш розгляд. Якщо ми задовольнимо хоча б половину прохачів, ми зможемо розплутати клубок нестабільності в нашій адміністрації."

 KUM_responsible_government:0 "Відповідальний уряд"
 KUM_responsible_government_desc:0 "Довіра до нашої влади приходить через призначення відповідальних людей. Хоча багато хто з нас починав як повстанець, це не заважає нам наймати компетентних виконавців нашої волі."

 KUM_defensive_neutrality:0 "Оборонний нейтралітет"
 KUM_defensive_neutrality_desc:0 "Західна брама тепер є привабливою ціллю для заколотників із Маньчжурії та Південного Китаю. Ми маємо закликати генеральний штаб розробити стратегію загальної оборони, аби запобігти новій війні, такій же руйнівній, як попередня."

 KUM_crossroads_of_empires:0 "Перехрестя імперій"
 KUM_crossroads_of_empires_desc:0 "Росіяни, турки та навіть японці дивляться на нас як на нове порубіжжя. Ми більше не можемо заперечувати присутність їхніх агентів на нашій землі, тож маємо встановити формальні дипломатичні контакти з цими потенційними ворогами й дізнатися, чи підтримує хтось із них нашу автономію."

 KUM_safety_and_prosperity:0 "Безпека та процвітання"
 KUM_safety_and_prosperity_desc:0 "Якщо уйгури, ханьці та хуейцзу не будуть розділені, безпека та процвітання будуть гарантовані. Це наша велика мета — співпраця між народами Сіньцзяну."

 KUM_khanate_continuation:0 "Збереження ханства"
 KUM_khanate_continuation_desc:0 "Коли [KUM.GetLeader] зійшов на престол, його обіцянку реформувати ханство не сприйняли серйозно. Тепер, спираючись на силу, хан має намір втілити реформи в життя і довести свою гідність народу."

 KUM_constitutionalism_prevails:0 "Тріумф конституціоналізму"
 KUM_constitutionalism_prevails_desc:0 "Уламки ідеалізму, занесені з півдня, перемогли в кумульській політиці. Провінційна конституція поєднуватиме елементи османського Основного закону (Kanun-u Esasi) та принципи однопартійної опіки, які просував Сунь Ятсен."

 KUM_invest_in_begs:0 "Інвестиції в беків"
 KUM_invest_in_begs_desc:0 "Лояльні беки, які не здалися Цзінь Шуженю, будуть щедро винагороджені. Їхні маєтки будуть розширені, а самі вони отримають додаткові пенсії за службу ханству в часи екзистенційної боротьби."

 KUM_lessons_from_qing:0 "Уроки династії Цін"
 KUM_lessons_from_qing_desc:0 "Реформи, які провів імператор Пуї під наглядом Чжилійської кліки, надихають нас. Сучасний монарх має делегувати повноваження та плекати довіру через опору на меритократичний цивільний уряд."

 KUM_abolish_the_advisory:0 "Скасування ради радників"
 KUM_abolish_the_advisory_desc:0 "Ходжа-Ніяз та Юлбарс-хан вичерпали свою корисність. Наявність військових, не підпорядкованих нам безпосередньо, лише надихатиме майбутніх диктаторів видавати себе за легітимну владу."

 KUM_constitutional_council:0 "Конституційна рада"
 KUM_constitutional_council_desc:0 "З-поміж беків буде сформована поважна конституційна рада. Її обов'язки будуть схожі на функції османської Палати депутатів, і вона звеличуватиме свого хана так само, як колись звеличували султана."

 KUM_under_the_khan:0 "Під владою хана"
 KUM_under_the_khan_desc:0 "[KUM.GetLeader] дослухався до порад генералів і обрав шлях прямого управління своїми новими землями за допомогою військової сили."

 KUM_reform_advisory:0 "Реформа ради радників"
 KUM_reform_advisory_desc:0 "Хан вирішив виявити вдячність своїм двом радникам, повернувши їм довоєнні повноваження."

 KUM_ensure_loyalty:0 "Забезпечення лояльності"
 KUM_ensure_loyalty_desc:0 "Радники обіцяють, що мають достатньо важелів впливу в містах, аби гарантувати, що мулли та радикали не знайдуть прихильників для виступу проти нас."

 KUM_royal_guards:0 "Створення гвардії хана"
 KUM_royal_guards_desc:0 "Хану потрібно мати змогу придушувати майбутні виступи непокірних радників чи беків. Найкраще це зробить гвардія в Кумулі, що фінансується особисто ханом і служить лише йому."

 KUM_end_power_struggle:0 "Кінець боротьби за владу"
 KUM_end_power_struggle_desc:0 "Плутанина в обіцянках, даних народу Кумула, призвела до недовіри в нашій адміністрації. Аби покінчити з боротьбою за владу назавжди, ми маємо відмовитися від деяких обіцянок, які давали людям під час їхнього визволення."

 KUM_necessary_adjustments:0 "Необхідні коригування"
 KUM_necessary_adjustments_desc:0 "Деякі магістрати виділили кошти на проєкти, які нам просто не потрібні. Відкликання цих грошей дозволить нам виконати обіцянки на інших, важливіших напрямках."

 KUM_public_schooling:0 "Запровадження державних шкіл"
 KUM_public_schooling_desc:0 "Державна освіта — один із небагатьох принципів, у яких ми згодні з Шен Шіцаєм. Проте ми не збираємося підривати роль медресе, а навпаки — підтримаємо їх, навчаючи людей корисним додатковим навичкам."

 KUM_contain_nationalism:0 "Стримування джадидизму"
 KUM_contain_nationalism_desc:0 "Прагнення джадидистів панувати в Сіньцзяні є небезпечним для Кумула — чи то через їхнє бажання воювати з Росією, чи через звеличення Османського султанату нашим коштом. Ми маємо приборкати націоналістичні настрої, інакше на нас чекає новий заколот."

 KUM_divine_right:0 "Божественне право"
 KUM_divine_right_desc:0 "Згідно зі школою ісламу Сідаотан, законне управління провінцією має належати традиційній династії. Рід ханів давніший за рід Османів, тому наша влада є справедливою."

 KUM_modern_monarchy:0 "Сучасна монархія"
 KUM_modern_monarchy_desc:0 "Ми бачили багато прикладів успішного відродження монархізму в країнах, що колись стояли на порозі хаосу. Династія Цін та Османи — чудові приклади. Ми маємо наслідувати їхній успіх."

 KUM_benevolent_autocracy:0 "Доброзичлива автократія"
 KUM_benevolent_autocracy_desc:0 "Поки дехто стверджує, що наша адміністрація використовує ту саму силу, проти якої боролася, ці критики виглядають дурнями. Проста істина полягає в тому, що наша провінція була стабільною лише за доброзичливих диктатур."

 KUM_khanate_no_more:0 "Більше не ханство"
 KUM_khanate_no_more_desc:0 "Останнього хана скинуто, і уйгурський народ радіє. Під проводом більш компетентного та підзвітного лідера провінція зможе рухатися вперед, не будучи обтяженою прадавньою історією."

 KUM_hoja_niyaz:0 "Відступник"
 KUM_hoja_niyaz_desc:0 "Повстанець одного разу — повстанець назавжди. Ходжа-Ніяз подолав слабкий внутрішній контроль Кумула і має намір закріпитися на своїй новій посаді."

 KUM_exploit_nationalism:0 "Експлуатація джадидизму"
 KUM_exploit_nationalism_desc:0 "Джадидисти не такі вже й погані, особливо ті, що мають конкретні потреби. Чи то заборона релігій поза межами книг Писання, чи офіційне схвалення шаріатських судів — ці дрібні жести створять значну підтримку нашому режиму."

 KUM_keep_them_divided:0 "Розділяй і володарюй"
 KUM_keep_them_divided_desc:0 "Етнічна сегрегація, яку просував Максуд-шах, насправді була корисною для виживання Кумула, і [KUM.GetLeader] вшанує його ідеали, зберігши ці закони."

 KUM_matters_of_state:0 "Державні справи"
 KUM_matters_of_state_desc:0 "Роки некомпетентної та ледачої зовнішньої дипломатії тепер можуть бути перекреслені. Державні справи та зовнішня політика нарешті будуть уніфіковані під керівництвом Ходжа-Ніяза."

 KUM_cast_off_ideology:0 "Відкинути ідеологію"
 KUM_cast_off_ideology_desc:0 "Хоча самозвані лідери Центральної Азії керують своїми народами за допомогою ідеології, в основі її лежить той самий посил. У відповідь ми готові об'єднатися з будь-якою силою в регіоні, яка гарантує нам більшу автономію, ніж ту, що давав Сіньцзян."

 KUM_hojas_republic:0 "Республіка Ходжа-Ніяза"
 KUM_hojas_republic_desc:0 "Коли Ходжа-Ніяз боровся проти Максуд-шаха, він не знав, за що саме воює. З віком приходить мудрість, і тепер [KUM.GetLeader] усвідомив: маючи абсолютну владу, він має служити президентом республіки."

 KUM_flexible_diplomacy:0 "Гнучка дипломатія"
 KUM_flexible_diplomacy_desc:0 "Міністерству закордонних справ у Кумулі було наказано не давати жодних обіцянок і не брати жодних зобов'язань перед нашими сусідами. Дотримання гнучкої політики дозволить нам контролювати нашу лояльність і, зрештою, нашу долю."

 KUM_let_them_pick_us:0 "Нехай вони обирають нас"
 KUM_let_them_pick_us_desc:0 "Зовнішньополітичне відомство нарешті привчене до ефективної нерішучості, і тепер Ходжа-Ніяз здатний належним чином задобрювати фракції Китаю на своїх умовах."

 KUM_fan_yaonan:0 "Бюрократ"
 KUM_fan_yaonan_desc:0 "Уникнувши смерті, Фань Яонань маневрував так, що отримав другий унікальний шанс як губернатор Сіньцзяну в Кумулі."

 KUM_open_for_business:0 "Відкриті для бізнесу"
 KUM_open_for_business_desc:0 "Причиною краху Сіньцзяну був ізоляціонізм Яна Цзенсіня. Фань Яонань безперечно готовий виправити десятиліття драконівської торгової політики та повернути процвітання до Сіньцзяну."

 KUM_request_administrators:0 "Запит на адміністраторів"
 KUM_request_administrators_desc:0 "Фань Яонань використовує свої законні повноваження губернатора, аби найняти нових адміністраторів, які склали іспити на державну службу."

 KUM_safe_investment:0 "Надійні інвестиції"
 KUM_safe_investment_desc:0 "Багатства, які накопичували корумповані губернатори, тепер можуть бути належним чином інвестовані в економіку Сіньцзяну. Це дозволить більшій кількості людей отримати короткострокову вигоду від нашого оподаткування, а не лише самому губернатору."

 KUM_open_the_gates:0 "Відчинити браму"
 KUM_open_the_gates_desc:0 "Західна брама нарешті знову відчинена. Фань Яонань добре усвідомлює свою відповідальність перед народом Сіньцзяну щодо збереження миру між ханьцями, хуейцзу та уйгурами."

 KUM_common_cause:0 "Спільна справа"
 KUM_common_cause_desc:0 "Спільна справа всіх народів Сіньцзяну — це процвітання. Від гірників Хотана до мисливців Джунгарії. Єдина валюта, оборона та конкуренція зі спільними ворогами, як-от Монголія, можуть об'єднати нас усіх."

 KUM_political_malleability:0 "Політична піддатливість"
 KUM_political_malleability_desc:0 "Зовнішньополітичному відомству в Кумулі було наказано уникати твердих обіцянок. Зберігаючи гнучкість, ми самі визначатимемо, кому бути вірними."

 KUM_stability_means_prosperity:0 "Стабільність означає процвітання"
 KUM_stability_means_prosperity_desc:0 "Стабільність, яку Фань Яонань створив у Сіньцзяні, майже не має рівних у решті Китаю. Це зробило регіон значно кращим місцем для економічного розвитку та інвестицій."

 KUM_zhongying_gang:0 "Мстивий генерал"
 KUM_zhongying_gang_desc:0 "Завдяки могутності своїх військ Ма Чжун’їн тріумфував у Хамі. Цілком очевидно, що феодали та бандити мали поступитися місцем сучасному автократичному керівництву, яке забезпечує Ма Чжун’їн."

 KUM_punish_dissent:0 "Покарання інакомислення"
 KUM_punish_dissent_desc:0 "Сучасні автократії мають розпізнавати та перехоплювати радикальні рухи до того, як вони наберуть обертів. Ось чому Ма Чжун’їн вирішив скасувати багато помилувань, які він обіцяв дати командирам, що здалися."

 KUM_slash_and_burn:0 "Випалена земля"
 KUM_slash_and_burn_desc:0 "Бандити Джунгарії покладаються на слабкість народу та їхні запаси їжі. Ми не можемо прищепити їм китайські цінності спротиву, тому ми маємо натомість витіснити їх і виснажити голодом наших ворогів."

 KUM_army_with_state:0 "Армія з державою"
 KUM_army_with_state_desc:0 "Армія Ма Чжун’їна має першорядне значення для сучасної автократичної держави. Вона повинна отримувати найвищий пріоритет в оподаткуванні та розквартируванні офіцерів."

 KUM_all_for_one:0 "Один за всіх"
 KOM_all_for_one_desc:0 "Увесь Хамі має згуртуватися навколо Ма Чжун’їна, якщо ми хочемо вижити у найближчі кілька років."

 KUM_the_kumul_army:0 "Кумульська армія"
 KUM_the_kumul_army_desc:0 "Роздута з того, що мало бути лише силами самооборони, кумульська армія може бути перетворена на найзагартованішу бойову силу в Центральній Азії."

 KUM_small_but_strong:0 "Малий, але сильний"
 KUM_small_but_strong_desc:0 "Кумул відрізняється від «ганьсуйських сміливців» чи провінційної армії своєю успішною самодостатністю. Поки інші армії слабшають через погане постачання, ми здатні бачити майбутню перемогу перед собою на довгих дорогах пустелі."

 KUM_new_guns:0 "Аналіз трофейної зброї"
 KUM_new_guns_desc:0 "За браком зовнішньої підтримки ми мусимо покладатися на китайські моделі, які вже є копіями європейської зброї, аби створити спорядження, здатне здолати загарбників, з якими ми можемо зіткнутися в майбутньому."

 KUM_increased_conscription:0 "Посилення призову"
 KUM_increased_conscription_desc:0 "Кожен чоловік віддав би свого єдиного сина за Кумул!"

 KUM_cold_warriors:0 "Крижані воїни"
 KUM_cold_warriors_desc:0 "Бригади, акліматизовані до холоду, перевершать втомлених та змерзлих іноземців, що загрожують Кумулу."

 KUM_new_factory:0 "Збройовий завод у Діхуа"
 KUM_new_factory_desc:0 "Тепер, коли Діхуа належить нам, її збройовий завод може бути спрямований на потреби національної оборони."

 KUM_steppe_scouts:0 "Степові розвідники"
 KUM_steppe_scouts_desc:0 "Створення спеціальних дивізій із мешканців степу надасть нашим підрозділам кращу розвідувальну міць, швидкість та рекогносцировку."

 KUM_mountainous_province:0 "Гірська підготовка"
 KUM_mountainous_province_desc:0 "Призначення спеціальних бригад із народів Каракумів, що живуть у горах, дозволить створити унікально витривалі підрозділи для боїв у суворих гірських хребтах Сіньцзяну."

### Characters ###
 KUM_nasir_shah:0 "Насір-шах"
 KUM_nasir_shah_leader_desc:0 "§YОпис лідера\nНародився:§! 1888 рік, Кумул, провінція Сіньцзян, Цінська імперія\n§YПолітична кар'єра:§! Насіра з народження готували до ролі майбутнього кумульського хана. Його рід походить від давніх ханів, які правили Кумулом протягом багатьох століть. Батько Насіра, Максуд-шах, був жорстоким автократом, що призвело до повстань 1907 та 1912 років. Хоча ті заколоти придушили, приховане невдоволення нікуди не зникло, і коли Насір успадкував престол у 1930 році, воно перейшло на нього. Проте Насір не схожий на свого деспотичного батька — він значно відкритіший до реформ і прагне надати більше повноважень своїм радникам та бекам."

