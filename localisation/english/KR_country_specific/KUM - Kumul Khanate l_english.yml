 KUM_keeping_peace:0 "Миротворець Сіньцзяну"
 KUM_keeping_peace_desc:0 "Існування Кумульського ханства є запорукою поточної стабільності в Сіньцзяні, яка була милістю для нас протягом понад двадцяти років. Наш народ бачить у нас символ самоврядування та надію на майбутнє, попри нашу незначну політичну роль у загальних масштабах Сіньцзянського губернаторства."

