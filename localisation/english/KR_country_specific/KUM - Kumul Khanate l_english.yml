### Ideas ###
 KUM_legacy_masqud:0 "Спадщина Максуда"
 KUM_legacy_masqud_desc:0 "Максуд-шах, попередній правитель Кумульського ханства, був одним із найавтократичніших лідерів у нашій історії. Постійне пияцтво, підвищення податків і панщини, а також повна ненависть до технологій зробили його вкрай суперечливою постаттю. Це призвело до повстань 1907 та 1912 років, учасники яких намагалися повалити його та саме ханство. Насір-шах тепер намагається виправити помилки батька, аби заслужити схвалення підданих, проте це потребуватиме значних зусиль у майбутньому."

