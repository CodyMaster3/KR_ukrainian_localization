 LEC_william_ewart_fairbairn: "Вільям Еварт Фейрберн"
 LEC_william_ewart_fairbairn_army_chief_desc: "§YНародився:§! §L28 лютого 1885 року, Рікмансворт, Гертфордшир, Англія§!\n§YІсторична довідка:§! §LКолишній морський піхотинець та офіцер поліції в одному з районів «червоних ліхтарів» Шанхая, Вільям Еварт Фейрберн найбільш відомий своєю страхітливою колекцією шрамів, отриманих у сотнях вуличних бійок під час виконання обов’язків, а також організацією спеціального загону боротьби із заворушеннями шанхайської муніципальної поліції. Відомий як «Небезпечний Ден», Фейрберн є майстром боксу, боротьби, савату, джиу-джитсу, дзюдо та кунг-фу, які він використав для розробки власного стилю бою під назвою «Дефенду». Згідно з поліцейськими записами, на його рахунку понад 500 підтверджених реальних сутичок (озброєних і рукопашних), а також виготовлений на замовлення куленепробивний жилет, здатний зупинити кулю з маузера калібру 7,63x25 мм. Зараз він присвячує час навчанню бійців волонтерського корпусу основам ближнього бою.§!"

 LEC_german_time: "Герман Тайм"
 LEC_german_time_commander_desc: "§YНародився:§! §L2 лютого 1891 року, Перм, Пермська губернія, Російська імперія§!\n§YІсторична довідка:§! §LГерман Германович Тайм походить із родини Тіме німецького походження, яка протягом століть належала до спадкового російського дворянства. Тайм закінчив Миколаївське кавалерійське училище у 1912 році та командував різними гвардійськими кавалерійськими частинами під час Великої війни. Воював на Сибірському та Уральському фронтах у складі білих військ. У 1925 році Тайм був призначений до російського полку в Шанхаї. Попри замороження права голосу Росії в Раді концесій після фентянського конфлікту, невелика частина російських військ залишилася на службі концесій, і Тайм був призначений їхнім командиром у 1935 році. Хоча більшу частину кар'єри цей кавалерійський командир провів у поліцейських операціях, за потреби він цілком здатен взяти на себе справжнє військове командування.§!"

 LEC_reginald_yorke_tyrwhitt: "Реджинальд Йорк Тірвітт"
 LEC_reginald_yorke_tyrwhitt_navy_chief_desc: "§YНародився:§! §L10 травня 1870 року, Оксфорд, Англія§!\n§YІсторична довідка:§! §LЗарахований кадетом на корабель «Британія» у 1883 році, сер Реджинальд Йорк Тірвітт пройшов шлях по службі і під час Світової війни командував Гарвічським загоном, який здійснив перші постріли у війні 1914 року. Найвідомішою дією під командуванням Тірвітта був рейд на Куксгафен, де гідролітаки зіграли ключову роль в атаці німецького порту з повітря, повернувшись без втрат. Єдиною великою плямою на його репутації є схвалення капітана Джона Ноулза Ім Терна перед тим, як його невміле керівництво спричинило Плімутські бунти 1925 року. Обіймаючи посаду головнокомандувача в Китаї у 1926 році під час Північного походу, Тірвітт несе принаймні часткову відповідальність за евакуацію британських військ до Австралії та подальший перехід Гонконгу під «захист» німців — вчинок, за який співвітчизники так і не змогли йому повністю вибачити.§!"

