 LEC_francis_wogan_festing: "Френсіс Воган Фестінг"
 LEC_francis_wogan_festing_commander_desc: "§YНародився:§! §L28 серпня 1902 року, Дублін, графство Дублін, Ірландія§!\n§YІсторична довідка:§! §LВипускник Сандгерста 1921 року. На Фестінга чекала багатообіцяюча кар'єра в британській армії Індії або в Східному командуванні; він служив ад'ютантом Джона Бернетт-Стюарта, колишнього головнокомандувача Мадраського округу, аж до самої революції. Тепер, як і більшість британських офіцерів без синдикалістських поглядів, він мандрує колишніми колоніями. Через брак бюджету для його утримання імперія вирішила не продовжувати його службу в жодному з наявних домініонів, і він оселився зі старими армійськими друзями в Шанхаї, де ніхто не забороняє носити стару форму і завжди є шанс хильнути джину зранку.§!"

