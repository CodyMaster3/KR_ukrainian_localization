### Characters ###
 LEC_pan_hannian: "Пань Ханнянь"
 LEC_yuan_zhenying: "Юань Чженьїн"
 LEC_yun_daiying: "Юнь Даїнь"
 LEC_robert_ho_shai_lai: "Роберт Хо Шай Лай"
 LEC_robert_ho_shai_lai_leader_desc: "§YНародився:§! §L15 травня 1906 року, Гонконг, Британський Гонконг§!\n§YІсторична довідка:§! §LНародився в надзвичайно заможній євразійській родині, третій син сера Роберта Хотуна, могутнього гонконзького магната. Хо навчався в єпархіальній школі для дівчат — ставши єдиним хлопчиком у дівочому закладі. У 1916 році він перевівся до Квінс-коледжу, а згодом вступив до Нанкінської військової академії. Захоплений перспективою військової кар’єри, він намагався вступити до Баодінської військової академії за порадою У Пейфу та Ці Сєюаня, але чжилійсько-фентянська війна призвела до закриття академії. Його спроба вступити до Королівської військової академії у Вуліджі в 1925 році була так само зірвана Британською революцією, яка повалила старий лад, з яким його родина мала глибокі зв’язки.\n\nЗамість цього він вступив до Королівського військового коледжу Канади, який закінчив у 1927 році, ставши членом розбитого Королівського танкового корпусу. Він також вивчав важку артилерію. Події в Китаї 1927-1928 років завершилися тріумфом Чжилі над більшістю ворогів, але ціною створення численних величезних концесій, відомих як міста-концесії. Обурений роллю Британії в цих подіях і усвідомлюючи, що вона втратила вплив, він у патріотичному пориві офіційно відмовився від британського громадянства і був позбавлений чину. Потім він вирушив до Німеччини для подальшого вивчення артилерії, де отримав похвалу за свою майстерність, перш ніж у 1930 році урочисто повернутися до Гонконгу на борту круїзного лайнера.\n\nВлаштувавшись на службу до Ліги, він розчарувався в її жорстокості під час повстання 1932 року. Відправлений до шанхайської нейтральної зони під командування німецьких офіцерів, аби уникнути порушення міжнародних договорів, він досі не повернувся на службу до Ці Сєюаня.§!"
