### Focuses ###
 LEC_new_status_quo: "Новий статус-кво"
 LEC_new_status_quo_desc: "Міста-концесії пережили період нестабільності та невизначеності. Однак тепер, коли нинішній верховний комісар мандату безсумнівно залишається на посаді, багато хто зітхнув із полегшенням, знаючи, що майбутнє мандату визначено."

 LEC_german_tool: "Західне знаряддя"
 LEC_german_tool_desc: "Німці завжди були гостро зацікавлені в контролі над Радою концесій, і тепер, коли верховний комісар Боденгаймер склав присягу, він зобов'язав міста підтримувати німецьку справу збереження статус-кво на Далекому Сході."

 LEC_german_military_investors: "Залучення німецьких промисловців"
 LEC_german_military_investors_desc: "Німецька економічна присутність на даний момент суворо регулюється, як і більша частина іноземної промисловості в містах. Послаблення цих правил, наприклад, скасування залишків захисту прав робітників, може заохотити більше німецьких промисловців будувати та інвестувати тут."

 LEC_zhili_in_cities: "Чжилійські солдати в сталевих шоломах"
 LEC_zhili_in_cities_desc: "У 1932 році Німеччина запросила солдатів Південної Чжилі до міст-концесій для підтримки порядку проти лівих агітаторів. Однозначне прийняття сторони єдиного надійного німецького союзника в Китаї, [LEP.GetNameDef], шляхом запрошення їхніх військ до міст було б гарною ідеєю."

 LEC_GEA_cooperation: "Німецька координація"
 LEC_GEA_cooperation_desc: "Єдиний спосіб захистити міста від неминучої японської загрози — це координувати наші збройні сили з німецьким флотом та авіацією. Дехто може протестувати проти такого відкритого фаворитизму, але їхні заперечення не мають значення для справи стабільності."

 LEC_fight_jap_influence: "Боротьба з японським впливом"
 LEC_fight_jap_influence_desc: "Японці мають надто сильну присутність у містах і можуть використати свій вплив із великим успіхом під час конфлікту. Вислання їхніх бізнесменів та припинення їхньої незаконної діяльності обмежить їхню владу."

 LEC_coastal_defence: "Покращення берегової оборони"
 LEC_coastal_defence_desc: "Єдиний шанс вижити під час японської атаки — це міцні берегові укріплення, а наші німецькі союзники є експертами в цій справі. Ми повинні залучити їх до виконання цього завдання."

 LEC_open_door: "Відкриті двері"
 LEC_open_door_desc: "Міста-концесії були створені, щоб слугувати відкритими дверима світу до Китаю, і вони залишаться такими! Англо-американське правління в містах продовжуватиме політику нейтралітету та співпраці, яка вела до успіху протягом останніх десятиліть."

 LEC_forum_of_peace: "Форум миру та процвітання"
 LEC_forum_of_peace_desc: "Міста-концесії завжди проектувалися як місце для збереження миру між німцями, китайцями, японцями та американцями. Ми повинні повністю присвятити мандат цій меті."

 LEC_encourage_cooperation: "Заохочення співпраці великих держав"
 LEC_encourage_cooperation_desc: "Ми не віддаємо перевагу жодній стороні в конфлікті за Китай. Зрештою, всі можуть приїхати до Шанхая, щоб обговорити свої позиції. Наша головна місія — тривалий мир на Далекому Сході."

 LEC_free_trade_in_china: "Вільна торгівля в Китаї"
 LEC_free_trade_in_china_desc: "Політика відкритих дверей була гаслом засновників мандату, і вона залишається важливою. Ми докладемо подальших зусиль, щоб усі держави-члени Ради концесій, як і сама рада, отримували солідний прибуток."

 LEC_multipolar_mandate: "Багатополярний мандат"
 LEC_multipolar_mandate_desc: "У раді представлено більше ніж три держави, і настав час їх цінувати! Ми повинні використати наш контроль над радою, щоб надати більшої ваги послам малих націй та їхнім точкам зору."

 LEC_bring_back_the_brits: "Повернення британців"
 LEC_bring_back_the_brits_desc: "Британська корона була несправедливо усунута від засідань ради під час її заснування. Ми повинні відновити їхнє право голосу, оскільки вони є вирішальним оплотом поточного статус-кво."

 LEC_seek_third_parties: "Відкритий форум"
 LEC_seek_third_parties_desc: "Міжнародний мандат — це не елітний клуб, де вирішується доля решти Сходу. Тут цінується кожна держава з концесіями, і кожна держава має голос."

 LEC_gateway_to_the_east: "Ворота на Схід"
 LEC_gateway_to_the_east_desc: "Тепер, коли японці домінують у Раді концесій, майбутнє Азії виглядає яскравішим. Постає важливе питання: чи повинні міста залишатися відкрито нейтральними, пропонуючи лінії постачання та контрабандну зброю ізольованій Японії, чи міста мають намагатися максимально допомогти японським військовим зусиллям?"

 LEC_compromised_neutrality: "Компромісний нейтралітет"
 LEC_compromised_neutrality_desc: "Міста занадто важливі як джерело торгівлі та міжнародної взаємодії, щоб намагатися підпорядкувати їх японській військовій машині. Рада все ще має відігравати свою роль в Азії!"

 LEC_supply_lines: "Лінії постачання світу"
 LEC_supply_lines_desc: "Японці очікують на певні проблеми в торгівлі та ембарго в майбутньому, коли вони розпочнуть визволення Азії. Ми забезпечимо японській військовій машині канал постачання сировини, отримуючи вигоду як посередник."

 LEC_weapons_smuggling: "Склади зброї"
 LEC_weapons_smuggling_desc: "Японці не можуть дозволити собі втратити східне узбережжя Китаю, коли почнуть свою війну. Ми повинні забезпечити канал для переправлення зброї та людей до наземних сил Японії та її союзників."

 LEC_pressure_westerners: "Відсторонення західних країн"
 LEC_pressure_westerners_desc: "Західні країни та імперіалісти надто довго тримали Далекий Схід мертвою хваткою! Обмеження їхнього бізнесу, незаконної діяльності та навіть розслідування щодо деяких членів іноземних делегацій незабаром приборкають їхній згубний вплив."

 LEC_TMKKD: "Заснування TMKKD"
 LEC_TMKKD_desc: "TMKKD служитиме для вербування мешканців міст-концесій, які готові допомогти Японії організованою службою. Ми будемо авангардом японського наступу!"

 LEC_fengtian_troops_in_tianjin: "Фентянські війська в Тяньцзіні"
 LEC_fengtian_troops_in_tianjin_desc: "Японські союзники у фентянському уряді досі не визнані Радою концесій. Крім того, якщо ми хочемо, щоб вони перемогли [QIE.GetAdjective] уряд, надання нашим китайським союзникам вільного проходу через Тяньцзінь, як це зробили німці в 1932 році, може схилити чашу терезів війни на їхню користь. Ми повинні рішуче підтримати маршала Чжана!"

 LEC_deal_with_zhang: "Угода з Чжан Сяолінем"
 LEC_deal_with_zhang_desc: "«Зелена банда» Чжан Сяоліня дуже допомогла нам у забезпеченні безпеки міст. Проте його допомога дещо сумнівна, і багато хто зараз задається питанням, чи все ще нам потрібні його послуги..."

 LEC_remove_japanese: "Виключення Японії з ради"
 LEC_remove_japanese_desc: "Японці показали себе лише як злочинці та бандити на міжнародній арені! Їхнє безсоромне втручання в китайські справи має бути покаране, і вони більше не повинні мати офіційного голосу у вирішенні долі Китаю."

 LEC_remove_germans: "Виключення Німеччини з ради"
 LEC_remove_germans_desc: "Німецька імперія явно більше не діє сумлінно в межах Міжнародного мандату. Їхні концесії — це лише інструмент для їхньої експлуатаційної зовнішньої політики, тому вони повинні бути виключені."

 LEC_neutral_zone_crackdown: "Окупація нейтральної зони"
 LEC_neutral_zone_crackdown_desc: "Теоретично в нейтральні зони не можуть входити війська ні китайської, ні міжнародних армій. Це робить їх справжнім кошмаром для контролю та ефективного використання. Щоб убезпечити міста від лівих та іноземних впливів, вони повинні бути зайняті нашими волонтерськими силами."

 LEC_war_industrialists: "Військова промисловість"
 LEC_war_industrialists_desc: "Військова промисловість у Містах-концесіях обмежена, оскільки все ще залишається багато юридичних бар'єрів для безперешкодного виробництва. Усунення цих бар'єрів та зниження торгових обмежень для міжнародних збройових компаній має призвести до зростання військового виробництва, яке можна було б використовувати під час війни."

 LEC_stable_markets: "Стабільні ринки"
 LEC_stable_markets_desc: "На даний момент Міста-концесії абсолютно не підготовлені до війни. На жаль, збройний конфлікт не є неможливим варіантом розвитку подій. Ми повинні підготувати інвесторів до війни, щоб вони масово не втратили віру в мандат."

 LEC_they_made_ready: "Підготовка до війни"
 LEC_they_made_ready_desc: "Основи мандату під загрозою. Міжнародні гарантії, які колись робили нашу безпеку надійною, більше не діють. Світ змінюється, і Міста-концесії повинні змінюватися разом із ним."

 LEC_stabilize_shanghai: "Стабілізація Шанхая"
 LEC_stabilize_shanghai_desc: "Після хаосу останніх кількох тижнів, коли німецькі та японські війська стримувалися лише своїми національними урядами від початку війни, яка б охопила весь Далекий Схід, Шанхай потребує трохи старої доброї стабільності. Міста-концесії могли зазнати невдачі, але «Париж Сходу» ще не впав!"

 LEC_under_japanese_rule: "Під владою Японії"
 LEC_under_japanese_rule_desc: "З крахом міст-концесій багато районів міжнародних кварталів охоплені пожежами, мародерством та руйнуваннями. Після кількох днів розрізнених боїв японці вийшли переможцями, нарешті витіснивши нікчемні війська кайзера назад до Берліна. Відбувся парад перемоги: морська піхота японського імператорського флоту маршує Нанкінською дорогою, знаменуючи нову еру миру, порядку та процвітання. Азією мають правити азіати!"

 LEC_indulge_luxury: "Потакання розкоші"
 LEC_indulge_luxury_desc: "Тепер, коли Шанхай наш, обмеження на азартні ігри будуть скасовані. Новий Шанхай стане місцем розваг та задоволень, величним містом, що приваблюватиме найвідоміших бізнесменів із Токіо. Оскільки на самих островах азартні ігри заборонені, туристи приїжджатимуть до Шанхая, аби насолодитися покером чи японськими іграми, як-от пачінко. Все, що стається в Шанхаї, залишається в Шанхаї."

 LEC_japanese_entrepot: "Японське депо"
 LEC_japanese_entrepot_desc: "Як члени шанхайського району «ніхонматі», ми можемо зробити внесок у велику азійську економіку, замовляючи товари з Японії. Це заохочує нас інвестувати в бурхливу японську економіку, уникаючи при цьому мит та податків."

 LEC_employ_the_tmkkd: "Залучити TMKKD"
 LEC_employ_the_tmkkd_desc: "«Тайсі мондай кайкецу кокумін домей» (TMKKD), або Національна ліга вирішення китайських проблем — це наша найкраща ставка на відновлення порядку та зміцнення лояльності в Шанхаї. Ця прояпонська група з китайськими та японськими членами прагне тісніших зв'язків з метрополією і готова допомагати владі придушувати дисидентів на вулицях."

 LEC_weapons_stockpiles: "Запаси зброї"
 LEC_weapons_stockpiles_desc: "Цзяннаньський арсенал колись був найвизначнішим збройовим заводом у Східній Азії. Тепер, коли ми контролюємо Шанхай, цю зброю можна відправити на острови метрополії, де солдати імператорської армії зможуть краще використати її у своєму поході за нову Азію."

 LEC_illicit_industries: "Незаконні промисли"
 LEC_illicit_industries_desc: "Не можна заперечувати, що Шанхай відіграє ключову роль у китайській індустрії героїну та опіуму. Подібно до того, як мілітаристи в Китаї утримують свої армії на прибутки від опіуму, ми будемо фінансувати шанхайську залогу за рахунок доходів, які приносить «Шанхайська Саллі»."

 LEC_shanghai_in_japanese_china: "Шанхай у японському Китаї"
 LEC_shanghai_in_japanese_china_desc: "Завдяки втручанню Японії після краху міст-концесій ми нарешті звільнилися з лещат західного імперіалізму. Після нещодавніх перемог у Пекіні та Нанкіні маршал Чжан оголосив про відновлення Республіки Китай. У дусі національного єднання ми маємо негайно приєднатися до нього."

 LEC_under_german_protection: "Під захистом Німеччини"
 LEC_under_german_protection_desc: "Шанхай не здався японській залозі, і міська влада звернулася до Кайзерліхмаріне за захистом. Ставши частиною Райхспакту та Міттельєвропи, Шанхай тепер протистоїть японській загрозі як непохитна частина китайсько-німецького альянсу."

 LEC_sino_german_collaboration: "Китайсько-німецька співпраця"
 LEC_sino_german_collaboration_desc: "Попри руйнівний вплив Чорного понеділка на німецьку економіку, не можна заперечувати, що німці володіють економічними та технологічними засобами, які значно перевершують наші. Тісно співпрацюючи з Берліном, ми отримаємо доступ до їхніх радників та інструкторів для модернізації Шанхая. Під захистом кайзера Шанхай стане містом, яким захоплюватиметься вся Азія."

 LEC_restore_chinese_government: "Відновлення китайського цивільного уряду"
 LEC_restore_chinese_government_desc: "Крах міст-концесій довів, що міжнародний мандат не може керувати Шанхаєм. Оскільки наші ресурси обмежені, було б найкраще дозволити місцевим китайцям відновити порядок — звісно, під нашим наглядом."

 LEC_unsavory_allies: "Сумнівні союзники"
 LEC_unsavory_allies_desc: "Співпраця з «Зеленою бандою» та іншими тріадами може здаватися негідною, проте не можна заперечувати цінність розвідданих та процвітання, які ми отримуємо від такої взаємодії. Тріади запропонували допомогу у відновленні порядку, якщо ми очистимо їхні досьє від усіх кримінальних доказів."

 LEC_fight_the_green_gangs: "Боротьба з «Зеленими бандами»"
 LEC_fight_the_green_gangs_desc: "«Зелені банди» несуть відповідальність за злочинність і корупцію в Шанхаї. Якщо Шанхай має уособлювати нову еру азійського процвітання, їх не можна залишати. Спираючись на повну силу Кемпейтаю та TMKKD, ми назавжди покінчимо з цим занепадом."

 LEC_abolish_the_volunteer_force: "Скасувати волонтерський корпус?"
 LEC_abolish_the_volunteer_force_desc: "З розміщенням морських батальйонів та кораблів Кайзерліхмаріне в гавані Шанхая німецька військова присутність відновила порядок у місті. З розпуском міжнародних гарнізонів більше немає потреби в Шанхайському волонтерському корпусі."

 LEC_the_transfer_of_power: "Передача влади"
 LEC_the_transfer_of_power_desc: "Німці вирішили розпочати процес передачі влади поступово. Ми довели свою лояльність і тепер пожинаємо плоди. Одного дня Шанхай возз'єднається з Китаєм і стане фінансовим центром нової модерної країни!"

 LEC_support_chinese_allies: "Підтримка китайських союзників"
 LEC_support_chinese_allies_desc: "Серед впливових бізнесменів Шанхая багато симпатій до націоналістичних та республіканських фракцій. Раніше ми воліли допомагати їм негласно, але Світова війна в Європі означає, що Німеччина не зможе кинути всі сили на наш захист від Японії. Ми маємо шукати підтримки у фракцій, що прагнуть єдності."

 LEC_choose_a_side: "Обрати сторону"
 LEC_choose_a_side_desc: "Занадто довго Шанхай стояв осторонь, поки Китай ставав дедалі слабшим і розділеним. Тепер, коли з’являються сили, здатні об’єднати країну, нам час остаточно обрати сторону. Шанхай стане авангардом нової модерної держави!"

 LEC_maintain_western_rule: "Зберегти західне правління"
 LEC_maintain_western_rule_desc: "Наша перемога над японцями довела одне: азіати не можуть керувати Шанхаєм самостійно. Їм потрібен м'який провід західного наставництва та сувора прусська військова дисципліна для відновлення порядку. Під захистом кайзера Шанхай буде процвітати."

 LEC_ensure_financial_openness: "Забезпечити фінансову відкритість"
 LEC_ensure_financial_openness_desc: "Під німецьким керівництвом «Перлина Сходу» переживе економічне відродження. Статус Шанхая як відкритого ринку в Тихому океані дозволить нам пожинати плоди торгівлі. Зі збільшенням інвестицій та офіційним вступом до Міттельєвропи Шанхай стане одним із провідних світових економічних центрів."

 LEC_secure_the_streets: "Безпека на вулицях"
 LEC_secure_the_streets_desc: "Попри стабілізацію ситуації силами Кайзерліхмаріне, в таких районах як Хуанпу все ще повно кишенькових злодіїв та гангстерів. За допомогою місцевої поліції та німецьких військ ми очистимо ці брудні вулиці. Порядок буде відновлено раз і назавжди."

 LEC_ties_to_the_aog: "Зв'язки з AOG"
 LEC_ties_to_the_aog_desc: "Наглядова рада Східноазійської генеральної адміністрації (AOG) давно домінує в торгівлі Східної Азії; більшість німецьких підприємств працюють під їхньою егідою. Тепер, коли Шанхай міцно перебуває у німецькій сфері впливу, ми можемо звернутися до філії Krupp за високоякісною німецькою зброєю та спорядженням."

 LEC_sailing_with_the_kaiserlich_marine: "У строю з Кайзерліхмаріне"
 LEC_sailing_with_the_kaiserlich_marine_desc: "Японці прийдуть до Шанхая, і в силі їхнього імператорського флоту немає сумнівів. Проте тепер ми маємо ресурси та радників найкращого флоту світу — Кайзерліхмаріне. Цзяннаньська корабельня буде модернізована за німецькими стандартами, щоб стати гідною базою для флоту кайзера."

 LEC_cooperate_with_the_lep: "Співпраця з Південною Чжилі"
 LEC_cooperate_with_the_lep_desc: "Наші зв'язки з Південною Чжилі мають бути зміцнені перед обличчям японських амбіцій. Як і ми, вони визнають німецьку міць і готові співпрацювати, аби Східна Азія залишалася вільною від японського імперіалізму."

 LEC_vanguard_against_japan: "Авангард проти Японії"
 LEC_vanguard_against_japan_desc: "За підтримки всієї Східноазійської ескадри та морських батальйонів кайзера Шанхай стоїть як авангард проти японського імперіалізму! Ми не дозволимо їм знищити процвітання міста чи далі принижувати Китай!"

 LEC_jardines: "Субсидувати Jardine, Matheson & Co"
 LEC_jardines_desc: "Торгова компанія Jardine, Matheson & Co базується в Південному Китаї та є життєво важливою для азійської торгівлі. Субсидуючи їх, ми отримаємо значні економічні вигоди."

 LEC_HSBC: "Позика від HSBC"
 LEC_HSBC_desc: "Банківська корпорація Гонконгу та Шанхая є одним із найбільших банків Азії. Позика від них суттєво зміцнить наші валютні резерви."

 LEC_deutsch_asiatische_bank: "Позика від Німецько-азійського банку"
 LEC_deutsch_asiatische_bank_desc: "Німецько-азійський банк (DAB) є одним із найстабільніших у місті. Поповнення наших резервів за рахунок їхніх значних коштів буде гарною ідеєю."

 LEC_yokohama_specie_bank: "Позика від банку Йокогами"
 LEC_yokohama_specie_bank_desc: "Yokohama Specie Bank глибоко залучений у китайську торгівлю, тому він зацікавлений у наданні нам позики, що допоможе нам оговтатися від наслідків Чорного понеділка."

 LEC_russo_asiatic_bank: "Позика від Російсько-азійського банку"
 LEC_russo_asiatic_bank_desc: "Російсько-азійський банк дещо нестабільний, але він непогано пережив Чорний понеділок і веде великі справи в Тяньцзіні; отримання їхніх активів — надійна справа."

 LEC_turn_a_blind_eye: "Ворота до Сибіру"
 LEC_turn_a_blind_eye_desc: "Владивосток, головний російський порт на Тихому океані, відкриває доступ до багатств Сибіру як через легальні підприємства, так і через більш «креативні» маршрути. Підтримка зв'язків із діловими колами Примор'я збагатить нас."

 LEC_social_provisioning: "Ігнорування злочинів французів"
 LEC_social_provisioning_desc: "Хоча багато французів прийняли [BEL.GetAdjective] громадянство, ті, хто не зміг цього зробити, стали особами без громадянства, і багато хто став на шлях злочину. Беручи відкати від найповажніших серед них, ми забезпечимо стабільні відносини."

 LEC_wheelock_and_marden: "Інвестувати у Wheelock and Marden"
 LEC_wheelock_and_marden_desc: "Wheelock and Marden — судноплавна компанія, заснована британськими купцями. Купуючи частку в ній, ми зможемо розширити їхні операції та збільшити прибуток у довгостроковій перспективі."

 LEC_green_island_cement: "Підтримати Green Island Cement"
 LEC_green_island_cement_desc: "Green Island Cement — компанія з Гонконгу, великий виробник для будівельної індустрії, яка занепала після Чорного понеділка. Підтримка їх у цій кризі є життєво важливою для наших майбутніх прибутків."

 LEC_china_light_and_power: "Викупити China Light & Power"
 LEC_china_light_and_power_desc: "CL&P керує значною частиною електричної інфраструктури Шанхая. Зараз фірма ледь зводить кінці з кінцями, тож це ідеальний момент, аби викупити її та додати до активів міста."

 LEC_improving_shipping_lanes: "Розширення судноплавних шляхів"
 LEC_improving_shipping_lanes_desc: "Судноплавство зараз важливіше, ніж будь-коли, аби подолати наслідки Чорного понеділка. Підтвердивши нашу відданість вільній торгівлі, ми заспокоїмо ринок і змусимо людей знову інвестувати."

 LEC_improving_port_facilities: "Розширення портових потужностей"
 LEC_improving_port_facilities_desc: "Зі збільшенням обсягів торгівлі зростає потреба у причалах. Шляхом поглиблення дна та розширення естуарних доків у Шанхаї ми забезпечимо подальше процвітання міста."

 LEC_improving_infrastructure: "Покращення сухопутної інфраструктури"
 LEC_improving_infrastructure_desc: "Трамвайні мережі з’єднують міста зсередини і є життєво важливими для місцевої комерції. Фінансуючи їх, ми забезпечимо зручність пересування та задоволення мешканців."

 LEC_railway_profiteering: "Інвестування в залізниці Китаю"
 LEC_railway_profiteering_desc: "Китайські залізниці десятиліттями були улюбленим проєктом європейців. Проте деякі з них застаріли і потребують грамотного керівництва для модернізації."

 LEC_arnold_and_karlberg: "Співпраця з Arnold & Karlberg"
 LEC_arnold_and_karlberg_desc: "Arnold & Karlberg — авіаційна компанія, що працює над створенням літаків у Китаї. Співпраця з ними дозволить нам бути в авангарді цієї нової галузі."

 LEC_star_ferry_tax: "Гонконзькі поромні збори"
 LEC_star_ferry_tax_desc: "Гонконзьку поромну переправу обслуговують різні компанії. Запровадивши подушний податок на пасажирів, ми зможемо збільшити державні доходи."

 LEC_standardise_rates: "Стандартизація ставок"
 LEC_standardise_rates_desc: "Податкові ставки на нерухомість різняться в різних містах. Стандартизувавши їх, ми впорядкуємо потоки доходів і зменшимо марнотратство."

 LEC_to_the_coal_fields: "Вугілля з Учана"
 LEC_to_the_coal_fields_desc: "Учан у глибині країни є великим виробником вугілля, а Тяньцзінь якраз потребує палива для розширення сталеливарної промисловості. Уклавши відповідні гірничі угоди, ми принесемо зайнятість і процвітання цьому напруженому форпосту цивілізації."

 LEC_string_of_pearls_scheme: "Схема «Низка перлин»"
 LEC_string_of_pearls_scheme_desc: "План розвитку міст за межами Шанхая під назвою «Низка перлин» спрямований на поширення процвітання в усіх наших регіонах та збільшення їхнього виробництва."

 LEC_hong_kong_land: "Спекуляції в Коулуні"
 LEC_hong_kong_land_desc: "Півострів Коулун — найновіша частина Гонконгу, що ідеально підходить для експлуатації. Земля там доступна в районі з величезним попитом на новий простір через стрімке зростання населення."

 LEC_tianjin_rail_hub: "Тяньцзіньський залізничний вузол"
 LEC_tianjin_rail_hub_desc: "Тяньцзінь — це перехрестя в Північному Китаї, ворота з Маньчжурії до Пекіна, а звідти до Шаньдуна та Лояна. Розширення цього вузла обов'язково допоможе нам."

 LEC_the_small_cities: "Розвиток малих міст"
 LEC_the_small_cities_desc: "Малими містами часто нехтують, але заохочуючи бізнес переносити туди діяльність, ми можемо зробити їх прибутковішими."

 LEC_electrifying_china: "Електрифікація Китаю!"
 LEC_electrifying_china_desc: "Електрифікація — це хвиля майбутнього. Маючи добре налагоджену вугільну енергетику в Шанхаї, ми розробили амбітний план розгортання електромереж уздовж усього басейну Янцзи."

 LEC_shantou_docks: "Розширення доків Шаньтоу"
 LEC_shantou_docks_desc: "Шаньтоу на півдні є непоганим портом, але він може бути кращим. Розширивши сухі доки та покращивши крани, ми забезпечимо більшу щільність судноплавства."

 LEC_bypass_the_aog: "В обхід AOG"
 LEC_bypass_the_aog_desc: "Порти AOG пропонують німецьким купцям вигідні умови торгівлі. Змінивши податкові стимули, ми заохотимо конкуренцію та подолаємо німецьку монополію."

 LEC_the_legation_yuan: "Долар концесій"
 LEC_the_legation_yuan_desc: "Валютна ситуація в містах вкрай складна, що створює головний біль для комерції. Запровадивши єдиний долар концесій, ми впорядкуємо торгівлю та зробимо Китай відкритішим для всіх."

 LEC_pieces_of_a_puzzle: "Частини пазла"
 LEC_pieces_of_a_puzzle_desc: "Наші міста — лише частина більшої головоломки під назвою Китай. Сприймаючи їх як елементи великої мережі комерції, ми розкриємо їхній справжній потенціал."

 LEC_all_china_university: "Університети Китаю"
 LEC_all_china_university_desc: "Університетами Китаю довго нехтували. Зараз ми в змозі відкрити нові заклади та зробити освіту доступною для всіх."

 LEC_greater_shanghai_plan: "План великого Шанхая"
 LEC_greater_shanghai_plan_desc: "Наші міста надто розкидані, щоб бути зв'язаними, і легко впадуть у разі конфлікту. Тому ми маємо зробити Шанхай центром промислового розвитку. Наше місто завжди буде сяючою перлиною Сходу!"

 LEC_renovate_the_bund: "Оновлення набережної Бунд"
 LEC_renovate_the_bund_desc: "Шанхайський Бунд — це старий район доків, через який проходить величезна частка китайської торгівлі. Фінансування його оновлення допоможе створити новий динамічний вузол світового судноплавства."

 LEC_invest_in_mannufactures: "Розширення вторинних галузей"
 LEC_invest_in_mannufactures_desc: "Торгівля створює багатство не лише через самі товари, а й через послуги морякам, банківські операції, ремонт та проживання. Підтримуючи ці супутні бізнеси, ми збільшимо добробут міст."

 LEC_land_spec_in_neutral_zone: "Спекуляції в нейтральній зоні"
 LEC_land_spec_in_neutral_zone_desc: "Спекуляція землею — це великий бізнес. Хоча відносне беззаконня нейтральної зони ускладнює підтримання порядку, ми можемо виставити там частину землі на аукціон для збору коштів."

 LEC_invest_in_naval_mannufactures: "Естуарна корабельня"
 LEC_invest_in_naval_mannufactures_desc: "Естуарій Янцзи широкий і глибокий. Якщо провести належні днопоглиблювальні роботи, він підійде для створення військової корабельні."

 LEC_invest_in_heavy_mannufactures: "Відновлення Цзяннаньського арсеналу"
 LEC_invest_in_heavy_mannufactures_desc: "Сунь Чуаньфан та нанкінська кліка спустошили Цзяннаньський арсенал. Тепер, коли Сунь мертвий, а Ліга розпалася, ми маємо переоснастити його та повернути в експлуатацію."

 LEC_expand_shanghai_university: "Підтримка Шанхайського університету"
 LEC_expand_shanghai_university_desc: "Шанхайський університет давно підозрюють у синдикалістській агітації, але це також великий освітній центр. Підтримка закладу розширить наші дослідницькі можливості."

 LEC_consolidate_stock_exchanges: "Консолідація фондових бірж"
 LEC_consolidate_stock_exchanges_desc: "Об'єднання двох шанхайських та чотирьох гонконзьких бірж у єдину муніципальну фондову біржу — складне, але варте уваги завдання. Проте британці можуть не оцінити підрив їхньої влади в Гонконгу."

 LEC_new_council_building: "Нова будівля ради"
 LEC_new_council_building_desc: "Раді концесій потрібна нова будівля, аби ствердити свою владу над містом. Під нашим наглядом постане розкішний комплекс у найсучаснішому архітектурному стилі."

 LEC_the_shanghai_yuan: "Шанхайський юань"
 LEC_the_shanghai_yuan_desc: "Шанхай — найважливіше місто, але йому бракує єдиної валюти. Запровадивши шанхайський юань, ми позбавимо бізнес проблем із обміном валют."

 LEC_in_defence_of_commerce: "На захист комерції"
 LEC_in_defence_of_commerce_desc: "Світ швидко стає небезпечним місцем. Коли прийде час захищати міста, ми маємо бити не лише «невидимою рукою ринку»."

 LEC_renovate_wei: "Оновлення форту Вей"
 LEC_renovate_wei_desc: "Форт Вей — це старе укріплення часів боксерського повстання в Тяньцзіні. Розоброєний згідно з договорами, він має бути відновлений для військового використання."

 LEC_renovate_hai: "Оновлення форту Хай"
 LEC_renovate_hai_desc: "Форт Хай — ще одне укріплення в Тяньцзіні для захисту від морської агресії. Його оновлення є критичним для майбутньої оборони міста."

 LEC_reactivate_gin_drinkers_line: "Відновлення лінії «П'яниць»"
 LEC_reactivate_gin_drinkers_line_desc: "Лінія «П'яниць» — це стара оборонна лінія в Гонконгу, збудована до британської революції на випадок вторгнення Японії. Вона занепала, але ремонт зробить її нездоланною."

 LEC_the_kowloon_redoubt: "Укріплення Коулуна"
 LEC_the_kowloon_redoubt_desc: "Коулун — це півострів на північ від Гонконгу, звідки можливі найнебезпечніші удари з суходолу. Ми маємо укріпити його, аби усунути загрозу від ґуандунських мілітаристів."

 LEC_defending_shanghai: "Гармати Усуна"
 LEC_defending_shanghai_desc: "Форт Усун у Шанхаї — це напівзруйнована стара споруда. Ми маємо відновити її, встановивши найкращі нові гармати, щоб гарантувати безпеку міста та серця мандату."

 LEC_fortify_minor_cities: "Укріплення малих міст"
 LEC_fortify_minor_cities_desc: "Малі міста мандату не повинні бути забуті в наших оборонних планах. Необхідно підготувати їх до захисту від нападів, відновивши старі китайські укріплення та збудувавши власні опорні пункти."

 LEC_settle_enlistment_debate: "Майбутнє волонтерського корпусу"
 LEC_settle_enlistment_debate_desc: "Світ швидко змінюється, і волонтерський корпус у його нинішньому вигляді може виявитися непридатним для захисту міст. Зокрема, багато хто занепокоєний браком живої сили. Ми могли б винести на голосування ради захід щодо посилення призову серед тих, хто придатний до служби."

 LEC_expanding_the_volunteers: "Розширення волонтерського корпусу"
 LEC_expanding_the_volunteers_desc: "Волонтерський корпус має стати більшим, якщо ми хочемо захиститися від нестабільності в Китаї, але нам також слід реформувати структуру цих сил."

 LEC_care_for_the_wounded: "Корпус хворих та поранених"
 LEC_care_for_the_wounded_desc: "Створений Мейбл Сент-Клер Стобарт у Британії в 1910 році, Корпус хворих та поранених досі залишається сучасною медичною силою. Оскільки наш корпус волонтерський, кожен боєць на вагу золота, тож ми маємо забезпечити належну медичну допомогу за зразком WSWCC."

 LEC_weltkrieg_lessons: "Уроки Світової війни"
 LEC_weltkrieg_lessons_desc: "Велика війна дала нашим офіцерам важливі уроки. Дозволивши їм спільно працювати над новими статутами, ми зможемо багато дізнатися про ведення як конвенційної, так і нетрадиційної війни."

 LEC_volunteer_flying_corps: "Створення волонтерського авіаційного корпусу"
 LEC_volunteer_flying_corps_desc: "О, ці величні люди на своїх літальних апаратах! Волонтери прагнуть використовувати літаки так само завзято, як і наземну зброю, хоча б заради престижу. Їхня військова міць також буде необхідною в будь-якій майбутній війні."

 LEC_pomp_and_circumstance: "Пишність та урочистість"
 LEC_pomp_and_circumstance_desc: "Хай сурмлять труби, б’ють барабани — влаштуємо парад! Демонстрація слави волонтерського корпусу має заохотити більше людей вступати до наших лав."

 LEC_establish_chinese_militia: "Створення китайської дивізії"
 LEC_establish_chinese_militia_desc: "Китайців уже давно залучають до служби в поліції, але створення офіційної волонтерської китайської дивізії може стати вирішальним для нашого виживання."

 LEC_special_squads: "Загони спеціальної підготовки"
 LEC_special_squads_desc: "Вибір певних підрозділів для спеціалізованої тактичної підготовки допоможе підвищити нашу ефективність і дозволить вдосконалити окремі секції наших сил."

 LEC_sinified_officers: "Китайські офіцери"
 LEC_sinified_officers_desc: "Після того як вщухли наслідки війни Ліги, багато китайських офіцерів втекли до міст. Ці офіцери можуть стати гарним доповненням до наших лав, за умови проходження належного інструктажу."

 LEC_urban_combat: "Методи коммандос Фейрберна"
 LEC_urban_combat_desc: "«Небезпечний Ден» розробив унікальний стиль бою ножем та голіруч, який він називає «Дефенду». Викладаючи його як частину стандартної програми, ми забезпечимо пікову ефективність наших військ у ближньому бою."

 LEC_tank_experiments: "Бронетанкова підготовка"
 LEC_tank_experiments_desc: "Танки вважаються зброєю майбутнього. Розробляючи методи їх використання в міських умовах, ми створимо надійну опору для захисту міст у майбутньому."

 LEC_preemptive_planning: "Превентивне планування"
 LEC_preemptive_planning_desc: "Попри нашу формальну міжнародну підтримку, міста мають багато ворогів у Китаї, і ми, ймовірно, наживемо ще більше на світовій арені. Напад неминучий, тому ми маємо почати готуватися до цього сценарію вже зараз."

 LEC_a_legation_navy: "Флот концесій?"
 LEC_a_legation_navy_desc: "Якщо ми хочемо захистити себе в цей нестабільний час, нам знадобиться відповідний військово-морський загін під нашим прямим контролем. Ми попросимо Раду концесій проголосувати за пропозицію, яка надасть нам початок флоту з кораблів країн-членів ради."

 LEC_modern_dockyards: "Сучасні кораблі"
 LEC_modern_dockyards_desc: "Наш флот створюється з нуля, тому він має можливість перейняти найновіші методи суднобудування."

 #LEC_undercutting_the_council: "Undercut The Council..."
 #LEC_undercutting_the_council_desc: "What they don't know won't hurt them..."
 #LEC_du_yuesheng: "Working With Du Yuesheng"
 #LEC_du_yuesheng_desc: "Big Ears Du is a friend to the community, he's got a big heart, a big wallet and wants to find his lost sister. He's also a vicious gangster who has personally killed a number of men and ruthlessly dominates the Shanghai underworld and the drug trade, particularly from his family's temple which is widely known to be a front for a heroin factory. But who has counting?"
 #LEC_opium_profiteering: "The Other White Gold"
 #LEC_opium_profiteering_desc: "Opium, it makes China tick. Ensuring a steady supply by making some more questionable investments is a good idea for our future."
 #LEC_suspend_inspections: "Suspend Cargo Inspections"
 #LEC_suspend_inspections_desc: "An elaborate system of bribes and markings means we can designate certain cargo to be waved through. What are they carrying? We don't know and we won't ask."
 #LEC_opium_sources: "Keep It Coming"
 #LEC_opium_sources_desc: "More opium, more more more opium. The market might be getting a bit saturated but that just means there aren't enough customers yet."
 #LEC_KMT_loans: "'Donate' To Nanjing"
 #LEC_KMT_loans_desc: "Some of Yuesheng's more interesting associates live in Nanjing we're told and could REALLY do with a loan. They'll offer us interests. Someday. We're being told. By these nice men with machetes."
 #LEC_southern_gun_running: "Facilitate The Yangtze Arms Trade"
 #LEC_southern_gun_running_desc: "The arms trade up the Yangtzee is a good source of income for the gangs and there might be kickbacks in it for us. As for who they're selling to? Don't worry, these men have friends on all sides."
 #LEC_ryu_ga_gotoku: "Dragons Clash..."
 #LEC_ryu_ga_gotku_desc: "It seems matters are finally going to come to a head, Xiaolin and Yuesheng's differences have become irreconcilable and a gang war is about to break out that will end with one of them dead."

 #LEC_zhang_xiaolin: "Working With Zhang Xiaolin"
 #LEC_zhang_xiaolin_desc: "Zhang Xiaolin is widely known as Shanghai's most infamous gangster. There's little positive to be said about him other than that he's pliable and willing to work with anyone. He's reputed to have fed his mistress to a tiger, murdered dozens and be knee deep in the trade in drugs, slaves and weapons."
 #LEC_counterfitting: "Counterfeiting Operations"
 #LEC_counterfitting_desc: "Currency, passports and legal documents need to be arranged sometimes, and often by less than legal means. By suspending investigations into various operations on our radar we can make our new friends very happy."
 #LEC_people_smuggling: "Vice and Trafficking"
 #LEC_people_smuggling_desc: "The sex trade in Shanghai is huge, they did call it the Paris of the East before the blight of socialism after all. By turning yet another blind eye to the exploitation of certain segments of the population we can bring in some healthy kickbacks."
 #LEC_black_dragon_deal: "Meeting Zhang's Masters"
 #LEC_black_dragon_deal_desc: "Xiaolin works with a number of shady characters, but standing behind him is a foreign backer of some sort. We could gain a clue as to their identity if we reach out, and offer to cut a profitable deal to give them what they want..."
 #LEC_special_branch_informants: "The Anhui Connection"
 #LEC_special_branch_informants_desc: "Former Anhui warlords and Zeijiang personnel are old friends of Zhang from his time as an army officer. We could gain the service of some of them if we sweet-talk him a little."
 #LEC_northern_gun_running: "Facilitate The Northern Arms Trade"
 #LEC_northern_gun_running_desc: "The arms trade northward sees foreign weapons smuggled to Port Arthur and Tianjin and thence who knows where. By facilitating this we can earn a little extra."

