 ### Ideas ###
 LEC_neutrality: "Міжнародний нейтралітет"
 LEC_neutrality_desc: "Створені на основі міжнародної угоди 1928 року, Міста-концесії мають залишатися нейтральними до всіх сторін, незалежно від глобальної ситуації... принаймні в теорії."

 LEC_currency: "Валютні резерви"
 LEC_currency_desc: "Валютні резерви Міст-концесій представляють готівку та активи, що перебувають у власності Ради концесій та Шанхайської муніципальної ради, законно чи незаконно. Якщо вони впадуть занадто низько, це матиме тяжкі наслідки, оскільки міста опиняться на межі банкрутства."

