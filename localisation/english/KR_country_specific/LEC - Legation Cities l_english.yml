 legation_cities_events.1.t: "Відчинено для бізнесу!"
 legation_cities_events.1.d: "Створений під тінню можливої німецько-японської війни за американського посередництва, Міжнародний мандат китайських концесій, розмовно відомий як міста-концесії, є символом як неспроможності Китаю успішно протистояти іноземному імперіалізму, так і американського прагнення до політики «відкритих дверей», згідно з якою всі нації повинні мати рівний доступ до одного з найбільших ринків світу. Вплив Шанхая виходить далеко за його межі та за межі тридцятимильної «нейтральної зони», що стала притулком для злочинців, простягаючись уздовж Янцзи розгалуженим шляхом залізниць, заводів і телеграфних ліній, що утворюють серце китайської промисловості. Гроші приходять і йдуть у цих містах на всіх рівнях суспільства, немов вода.\n\nНа півночі Тяньцзінь слугує світовим депо для Пекіна та процвітаючим центром залізничних спекуляцій для всього Китаю; на півдні розташований старий Гонконг — останній проблиск британської слави, що підтримується лише завдяки чудовій гавані та доступу до Південного Китаю. У самому серці всього цього лежить Шанхай — діамант, вирваний із рук Китаю та відшліфований до дзеркального блиску. «Париж Сходу» переживає свій розквіт: вулиці гудуть від електрики, в опіумних кублах в'ється таємничий дим, а західні люди витрачають гроші так, ніби вони виходять із моди, і заробляють їх так само швидко.\n\nАле, звісно, все не зовсім так, як здається. Під золотою поверхнею Шанхая ховається жахливе підчерев'я вбивств, інтриг та революції."
 legation_cities_events.1.a: "Який дивовижний світ."

 legation_cities_events.2.t: "Право голосу в Раді концесій"
 legation_cities_events.2.d.germany: "Міста-концесії були сформовані у 1928 році внаслідок втручання американців у японсько-китайський конфлікт, який загрожував перерости у відкриту війну між нами та японцями. Коли китайські мілітаристи напали на пасажирський потяг, Америка побачила можливість стати посередником не лише для створення постійного рішення щодо нестабільності на Сході, а й для закріплення політики «відкритих дверей» у Китаї, що дає всім державам рівний доступ до китайських ринків.\n\nСкладаючись з усіх офіційних концесій у Китаї, а також тридцятимильної нейтральної зони, міста-концесії, офіційно відомі як Міжнародний мандат китайських концесій, також мають свій форум — Раду концесій, де різні держави з інтересами в Китаї можуть вирішувати суперечки та працювати разом. Як провідна європейська держава на Сході, ми, природно, маємо право голосу в раді та просуваємо свій східний порядок денний."
 legation_cities_events.2.d.japan: "Міста-концесії були сформовані у 1928 році внаслідок втручання американців у чжилійсько-фентянський конфлікт, який, на їхню думку, міг призвести до відкритої війни між нами та Чжилі та їхніми німецькими покровителями. Коли китайські мілітаристи напали на пасажирський потяг, Америка побачила можливість стати посередником для закріплення політики «відкритих дверей», що дозволяє всім державам рівний доступ до китайських ринків.\n\nСкладаючись з усіх офіційних концесій та тридцятимильної нейтральної зони, міста-концесії, офіційно відомі як Міжнародний мандат китайських концесій, мають свій форум — Раду концесій, для координації політики держав у Китаї. Як провідна держава Далекого Сходу, ми маємо право голосу в раді, що дозволяє нам просувати свої інтереси в Китаї та стримувати ворогів."
 legation_cities_events.2.d.usa: "Міста-концесії були сформовані у 1928 році внаслідок нашого втручання у чжилійсько-фентянський конфлікт, який загрожував перерости у відкриту війну між двома іншими силами на Далекому Сході — Німеччиною та Японією. Прагнучи покласти край конфлікту, ми також знайшли спосіб створити тривале рішення для імперського суперництва в Китаї та просунути нашу політику «відкритих дверей», змусивши інші держави об'єднати свої концесії в один конгломерат.\n\nРада концесій слугує форумом для держав, де вони можуть вирішувати суперечки та працювати разом. Ми часто стаємо вирішальним фактором у суперечках між японцями та німцями, тоді як другорядні держави переважно підігрують нам. Наш голос зазвичай спрямований на збереження статус-кво «відкритих дверей», що дозволяє кожному отримувати вигоду без необхідності втручатися у справи окремих китайських фракцій. Для американських громадян міста-концесії — це не лише чудовий спосіб розбагатіти, а й сяючий приклад американського прогресивного мислення та нашої відданості миру."
 legation_cities_events.2.d.austria: "Міста-концесії були сформовані у 1928 році після втручання американців у чжилійсько-фентянський конфлікт, аби запобігти війні між японцями з їхніми фентянськими маріонетками та чжилійцями з німецькими покровителями. Коли китайські мілітаристи напали на пасажирський потяг, Америка використала це як привід для впровадження політики «відкритих дверей».\n\nРада концесій є місцем для співпраці у далекосхідній політиці. Хоча Австро-Угорська імперія має право голосу в цій раді, ми переважно утримуємося від участі у безглуздих планах, запропонованих американцями, німцями чи японцями, підтримуючи лише очевидно розумні заходи, такі як економічна допомога китайцям та нашим власним громадянам."
 legation_cities_events.2.d.belgium: "Міста-концесії були сформовані у 1928 році внаслідок американського втручання з метою забезпечення рівного доступу до китайських ринків через політику «відкритих дверей».\n\nЯк держава з розгалуженими концесіями в Тяньцзіні та частині внутрішнього Китаю, Фландрія-Валлонія має право голосу в цій раді. Хоча ми переважно підтримуємо німецькі пропозиції, бували випадки, коли ми приставали на позицію американців, якщо вона здавалася більш розумною або вигідною для наших громадян."
 legation_cities_events.2.a: "Ідеальний варіант!"
 legation_cities_events.2.b: "Як захоплююче!"

 legation_cities_events.3.t: "Статус спостерігача в Раді концесій"
 legation_cities_events.3.d.ostasien: "Міста-концесії були сформовані у 1928 році після інциденту «Нефритового вітру», коли китайські бандити напали на європейський потяг. Хоча мандат мав на меті зупинити чжилійсько-фентянський конфлікт, американці також використали його як інструмент своєї політики «відкритих дверей». Як дієве крило німецької політики в Азії, багато наших дипломатів служать делегатами в Раді концесій у Шанхаї, хоча політику в раді формує саме Берлін. Берлін рідко втручається в поточні справи, тож ми відповідаємо за управління повсякденною та таємною діяльністю Німеччини в містах-концесіях. Однак більшість наших справ у Китаї фактично передбачають обхід мандату, адже ми маємо багато напівлегальних екстериторіальних концесій у Лізі восьми провінцій нашого союзника Сунь Чуаньфана. Якщо в Китаї спалахне хаос, Нанкін, ймовірно, буде нашим єдиним справжнім другом."
 legation_cities_events.3.d.australasia: "Коли Британська імперія розпалася у 1925 році, тодішній губернатор Гонконгу запросив війська Німеччини та інших великих держав окупувати британські концесії для захисту від китайців. Це спровокувало прихований конфлікт між американцями, японцями та німцями, який був припинений Америкою у 1928 році зі створенням Міжнародного мандату китайських концесій. Як і в усьому світі, хоча Німеччина використовує наші імперські володіння, ми теоретично зберігаємо право власності на них. Так само і в Китаї наші великі концесії гарантують нам місце в Раді концесій. Проте німецька відмова визнавати уряд в Оттаві як відповідальний британський уряд позбавляє нас права голосу в Шанхаї.\n\nЯк гарант британських інтересів на Далекому Сході, Канберра відповідає за утримання китайських концесій. Таким чином, ми маємо вплив і можливість спробувати домогтися визнання та повернути наше право голосу в раді — або, принаймні, домогтися повернення Гонконгу."
 legation_cities_events.3.d.canada: "Після розпаду Британської імперії у 1925 році британські концесії в Китаї стали об'єктом боротьби великих держав. Це завершилося у 1928 році створенням міст-концесій. Хоча ми теоретично зберігаємо право власності на наші концесії, що гарантує нам місце в раді, німецька відмова визнавати легітимність уряду в Оттаві позбавляє нас права голосу в Шанхаї.\n\nОскільки Канберра взяла на себе роль гаранта британських інтересів на Далекому Сході, наша неучасть дозволяє нам зосередитися на поверненні трону Георга V. Проте якщо Австралазія зануриться в нестабільність, ми будемо зобов'язані зайняти їхнє місце в містах."
 legation_cities_events.3.d.russia: "Коли Британська імперія впала, три великі держави (Японія, Німеччина та США) вели холодну війну за британські концесії в Китаї. Після втручання Америки були створені міста-концесії з політикою «відкритих дверей». Росія отримала місце в раді завдяки своїм концесіям у Тяньцзіні.\n\nОднак невдача в Маньчжурії, де ми зіткнулися з китайськими та японськими силами у 1928 році, була розцінена як обурливе порушення договорів. У рідкісному єдиному пориві Берлін та Токіо тимчасово заморозили наше право голосу, «поки Москва не почне поважати підписані нею договори». На практиці це було лише приводом усунути нас — союзника США в раді — з китайської політики. Малоймовірно, що наші права будуть відновлені, поки це залежить від німців чи японців."
 legation_cities_events.3.d.qing: "Міста-концесії були сформовані у 1928 році згідно з імперіалістичною політикою «відкритих дверей». Пекінський уряд був усунутий від усіх процесів прийняття рішень у Раді концесій, попри те, що ці території номінально перебувають у нас в «оренді». Ми маємо статус спостерігача в раді, що дозволяє нам стежити за рішеннями, які приймаються на їхніх засіданнях, але поза цим наша взаємодія з цим органом на державному рівні обмежена."
 legation_cities_events.3.d.fengtian: "Міста-концесії були створені у 1928 році за ініціативи США для забезпечення доступу до китайських ринків через політику «відкритих дверей». Внаслідок цих імперіалістичних цілей справжній китайський уряд був відсторонений від прийняття рішень у Раді концесій. Ми маємо лише статус спостерігача, що дає змогу бачити хід засідань, проте наш реальний вплив на цей орган на урядовому рівні є мінімальним."
 legation_cities_events.3.a: "Ми заслуговуємо на голос у Шанхаї!"

 legation_cities_events.4.t: "Рада голосує за флот Концесій"
 legation_cities_events.4.d: "Верховний комісар скликав раду для голосування за особливу пропозицію — дозволити містам-концесіям мати власний флот. Оскільки світ стає дедалі більш поляризованим і понівеченим війною, цілком природно, що ізольовані міста-концесії мають подбати про власну оборону, а не покладатися на іноземні флоти, багато з яких зараз задіяні на власних театрах воєнних дій. Сподіваємося, вони достатньо розумні, щоб побачити, наскільки ми їм потрібні, і надати нам кілька кораблів."
 legation_cities_events.4.a: "Хай Господь дасть їм проголосувати мудро."

 legation_cities_events.5.t: "Рада голосує за флот концесій"
 legation_cities_events.5.d: "Верховний комісар скликав раду для голосування за особливу пропозицію — дозволити містам-концесіям мати власний флот. Світ щодня стає все більш неспокійним, і цілком логічно, що міста-концесії прагнуть самостійності в обороні — але чи можемо ми дозволити собі витрати на надання корабля для їхнього флоту?"

 legation_cities_events.6.t: "Результати голосування за флот концесій"
 legation_cities_events.6.d: "Голосування щодо того, чи дозволити містам-концесіям мати власний флот, завершилося, і, схоже, пропозиція..."
 legation_cities_events.6.a: "Була прийнята!"
 legation_cities_events.6.b: "Була відхилена."

 legation_cities_events.7.t: "Настав Чорний понеділок!"
 legation_cities_events.7.d: "Будучи центром світових фінансів, Шанхай навряд чи міг уникнути Чорного понеділка, що прийшов разом із крахом берлінського фондового ринку через надмірну емісію державних облігацій Німеччини. Інвестори поспіхом переглядають свої портфелі, а основні галузі промисловості зазнають збитків, хоча ті, хто постачає товари першої необхідності та послуги Китаю в цілому, ймовірно, досить швидко подолають кризу."
 legation_cities_events.7.a: "Жах! Який жах!"

 legation_cities_events.8.t: "Флот концесій прибуває до Шанхая"
 legation_cities_events.8.d: "Міжнародна ескадра кораблів прибула до Шанхая, щоб реорганізуватися у флот міст-концесій. Нові екіпажі будуть набрані безпосередньо в містах, аби уникнути подвійної лояльності, а також було сформовано нове адміралтейство на чолі з першим адміралом Реджинальдом Йорком Тірвіттом. Це великий день для Міст-концесій!"
 legation_cities_events.8.a: "Ура!"

 legation_cities_events.9.t: "Бюджет на 1936 рік затверджено"
 legation_cities_events.9.d: "Дебати щодо бюджету на 1936 рік розпочалися наприкінці минулого року і закінчилися досить швидко. Китай, а отже і міста-концесії, були визнані стабільними. Не було жодних надзвичайних обставин, що вимагали б спрямування коштів у будь-яку конкретну сферу управління, тому Раді концесій було виділено мільйон доларів для витрат на власний розсуд до початку наступного фінансового року. Єдине, про що домовилися — почати обговорення раніше, оскільки до кінця 1936 року ситуація може бути не такою доброю, як наприкінці 1935-го."
 legation_cities_events.9.a: "Грошам завжди знайдеться застосування."

 legation_cities_events.10.t: "Відновлення права голосу Росії?"
 legation_cities_events.10.d: "Під час заснування Міст-концесій Росія, як держава з концесіями в Китаї, отримала право голосу в раді під головуванням Олександра Гучкова. Росія була дипломатичним союзником Сполучених Штатів, що викликало роздратування як у Берліна, так і в Токіо. Вони знайшли привід торпедувати російський вплив після фентянського конфлікту 1928 року, коли Росія ненадовго вторглася в Маньчжурію і зіткнулася з японськими силами. Спираючись на власне тлумачення установчих договорів Ради концесій, вони заявили, що питання Китайсько-східної залізниці мало бути винесене на розгляд ради, а застосування військової сили Росією в Китаї було засуджено Токіо, Берліном і Брюсселем. Це призвело до того, що Росію, члена-засновника ради, фактично понизили до статусу спостерігача без права голосу. Але з останніми геополітичними змінами посол із Москви закликав нас повернути його уряду право голосу.\n\nОскільки це досить суттєве питання, технічно воно має пройти через Раду концесій. Однак, оскільки малоймовірно, що Японія чи Німеччина (суперники росіян) колись пропустять це рішення, ми можемо просто дозволити голові ради провести його як процедурне питання. Хоча це дало б потужного нового виборця, не пов'язаного з японцями чи німцями, такий крок, ймовірно, розлютить деякі держави в раді."
 legation_cities_events.10.a: "Рада концесій має проголосувати."
 legation_cities_events.10.b: "Це суто процедурне питання."

 legation_cities_events.11.t: "Рада концесій голосує за відновлення права голосу Росії"
 legation_cities_events.11.d: "Російський голос у Раді концесій був заморожений після їхньої військової авантюри в Маньчжурії у 1928 році, здебільшого через дипломатичний тиск Німеччини та Японії. Посилаючись на зміну обставин, питання про відновлення права голосу Росії знову винесено на порядок денний. Як члену-засновнику, Росії було б справедливо повернути право голосу. Проте Росія, безперечно, є геополітичною загрозою для націй Євразії, і дехто сумнівається, чи мудро так легко надавати їй більше впливу."

 legation_cities_events.12.t: "Рада концесій голосує за відновлення нашого права голосу"
 legation_cities_events.12.d: "При заснуванні Міст-концесій Росія отримала право голосу в раді. Ми були союзниками США, що не подобалося Берліну та Токіо. Вони використали конфлікт 1928 року в Маньчжурії як привід позбавити нас впливу, звинувативши в порушенні статуту ради через справу КВЖД. Нас фактично понизили до спостерігачів.\n\nГолова ради вирішив поставити на голосування питання про відновлення нашого права голосу. Якщо в цьому світі є справедливість, ми його повернемо, але не можна скидати з рахунків злість та заздрість Токіо і Берліна."
 legation_cities_events.12.a: "Хай рада прислухається до здорового глузду."

 legation_cities_events.13.t: "Результати голосування щодо права голосу Росії"
 legation_cities_events.13.d: "Голосування щодо того, чи повертати право голосу російському уряду, завершилося. Хоча малі держави підтримали пропозицію як неоціненну противагу Німеччині та Японії, багато хто все ж пішов за лідерами. Зрештою, схоже, пропозиція..."
 legation_cities_events.13.a: "Була прийнята!"
 legation_cities_events.13.b: "Була відхилена."

 legation_cities_events.14.t: "Росія отримує право голосу в Раді концесій"
 legation_cities_events.14.d: "Схоже, Рада концесій надала Росії право голосу. Хоча процедурно це вірно, той факт, що рішення було прийнято без повноцінного узгодження з усіма членами ради, створює тривожний прецедент і загрожує домінуванню Японії та Німеччини. На жаль, зараз у нас немає іншого вибору, окрім як прийняти це."
 legation_cities_events.14.a: "Це не повинно повторитися."

 legation_cities_events.15.t: "Наше право голосу відновлено!"
 legation_cities_events.15.d: "Рада концесій після гострих дебатів вирішила відновити наше право голосу. Нарешті у світі з’явилася справедливість. Це великий день для Росії та всієї Азії!"
 legation_cities_events.15.a: "Чудові новини!"

 legation_cities_events.16.t: "Рада концесій проголосувала проти відновлення нашого права голосу"
 legation_cities_events.16.d: "Рада концесій проголосувала проти відновлення нашого права голосу, посилаючись як на неважливість наших концесій, так і на наші агресивні дії на Сході. Схоже, страх перед Японією та Німеччиною переміг здоровий глузд і надію на майбутнє."
 legation_cities_events.16.a: "Ось і вся міжнародна співпраця."

 legation_cities_events.17.t: "Крах Ліги Восьми провінцій"
 legation_cities_events.17.d: "Від моменту закінчення Північного походу південна Чжилійська кліка правила південно-західним Китаєм як Ліга Восьми провінцій. За цей час вони стали близькими союзниками німців та AOG, що принесло кліці багатство, але й стало причиною її загибелі. Схоже, що повстання селян проти концесій, відокремлення провінції Аньхой та вбивство Сунь Чуаньфана зробили Лігу вразливою для тих, хто виграє від її знищення.\n\nГоміньдан знову підняв повстання у Фуцзяні, [SHD.GetAdjective] загрожують північним кордонам, а [ANQ.GetNameDef] вдарив на захід проти нанкінської кліки, яку тепер очолює [LEP.GetLeader]. Тим часом Хунань та федералісти в Лянґуані покинули Лігу, сподіваючись перечекати шторм і скористатися нагодою. Багатьом здається, що чжилійський порядок руйнується. Дехто також занепокоєний антиконцесійними тенденціями Гоміньдану та деяких північних мілітаристів."
 legation_cities_events.17.a: "Тривожні новини."

 legation_cities_events.18.t: "Потік біженців до міст"
 legation_cities_events.18.d: "Рятуючись від хаосу, що настав після краху Ліги Сунь Чуаньфана, тисячі біженців хлинули до нейтральних зон. Наша адміністрація поки що здатна впоратися з цим, але це аж ніяк не сприяє стабілізації міст після Чорного понеділка."
 legation_cities_events.18.a: "Схоже, ми приймаємо всіх охочих."

 legation_cities_events.19.t: "Конфлікт призводить до нестабільності ринку"
 legation_cities_events.19.d: "Схоже, довіра ринку до мандату концесій стрімко впала після нещодавнього початку бойових дій у регіоні. Хоча рада запевнила інвесторів, що міста залишаться на плаву протягом усього конфлікту, багато хто відмовився підтримувати форум, який не здатний забезпечити обіцяний мир."
 legation_cities_events.19.a: "Мені начхати на ваш пацифізм!"

 legation_cities_events.20.t: "Голосування про допомогу Сичуаню?"
 legation_cities_events.20.d: "Сичуань зараз переживає жахливий голод і намагається організувати хоч якусь відповідь. Вони надіслали емісарів з проханням до Ради концесій проголосувати за надання їхньому уряду коштів для відкриття нових шляхів імпорту зерна. Ми можемо собі це дозволити, але багато хто в нашій бюрократії цікавиться, чи справді ці гроші дістануться народу Сичуаня, чи осядуть у кишенях мілітаристів."
 legation_cities_events.20.a: "Звісно, ми допоможемо народу Сичуаня!"

 legation_cities_events.21.t: "Рада концесій голосує за надання допомоги провінції Сичуань"
 legation_cities_events.21.d: "Південнокитайська провінція Сичуань зараз потерпає від жахливого голоду. Вони звернулися до ради з проханням дозволити містам-концесіям допомогти їм знайти нові джерела постачання зерна. Однак експерти з китайської політики попереджають, що гроші можуть піти безпосередньо місцевим воєначальникам."

 legation_cities_events.22.t: "Рада концесій голосує за допомогу"
 legation_cities_events.22.d: "У відповідь на наше благання про допомогу Рада концесій погодилася проголосувати за надання нам підтримки. Це може врятувати життя тисяч людей у Сичуані."
 legation_cities_events.22.a: "Слава раді!"

 legation_cities_events.23.t: "Результати голосування щодо допомоги Сичуаню"
 legation_cities_events.23.d: "Після тривалих обговорень консенсусу було досягнуто. Пропозицію про надання продовольчої допомоги провінції Сичуань було..."
 legation_cities_events.23.a: "Прийнято!"
 legation_cities_events.23.b: "Відхилено."

 legation_cities_events.24.t: "Рада концесій відмовляється голосувати за допомогу"
 legation_cities_events.24.d: "Рада концесій відмовилася навіть розглядати питання про надання нам допомоги, стверджуючи, що наша «розгульна корупція» та «відсутність відповідального уряду» зроблять їхні гроші марними для народу Сичуаня. Схоже, нам доведеться справлятися самотужки."
 legation_cities_events.24.a: "І вони ще називають нас нецивілізованими..."

 legation_cities_events.25.t: "Рада концесій каже «так» допомозі!"
 legation_cities_events.25.d: "Сьогодні в Ченду панує радість: стало відомо про позитивне рішення Ради концесій. Вони проголосували за виділення нам п'ятдесяти тисяч доларів на імпорт великої партії зерна. Це чудова новина для народу Сичуаня!"
 legation_cities_events.25.a: "Ці західні люди не такі вже й погані."

 legation_cities_events.26.t: "Рада концесій відхиляє допомогу"
 legation_cities_events.26.d: "Попри наше активне лобіювання та значну підтримку в раді, Німеччина успішно переконала більшість проголосувати проти надання нам допомоги. Схоже, вони вважають нашу політичну систему ворожою до європейських інтересів, і що будь-які гроші підуть прямо в кишені [SZC.GetLeader]. Допомоги не буде."
 legation_cities_events.26.a: "Жадібні імперіалісти!"

 legation_cities_events.27.t: "Голосування провалено!"
 legation_cities_events.27.d: "Останнє голосування в Раді концесій провалилося з невеликим розривом. Пропозицію не можна висувати повторно."
 legation_cities_events.27.a: "Цікаво."

 legation_cities_events.28.t: "Голосування прийнято!"
 legation_cities_events.28.d: "Останнє голосування в Раді концесій було прийнято впевненою більшістю. Рішення набуває чинності."
 legation_cities_events.28.a: "Цікаво."

 legation_cities_events.30.t: "Рада концесій голосує за бюджет на наступний рік"
 legation_cities_events.30.d: "Термін дії бюджету на [GetYear] рік закінчується за два місяці, і членів ради скликали, аби визначити пріоритети на наступний рік. Через нестабільність у Китаї дехто рекомендує зосередитися на обороні. Інші пропонують виділити кошти на прийом біженців та підтримку відносин із Пекіном. Ще одна пропозиція — зосередитися на ліквідації останніх наслідків Чорного понеділка. Що ми оберемо?"
 legation_cities_events.30.a: "Нам просто потрібно більше грошей."
 legation_cities_events.30.b: "Ми маємо спрямувати фінансування на волонтерський корпус."
 legation_cities_events.30.c: "Нам потрібна промислова допомога!"
 legation_cities_events.30.e: "Нам потрібно більше коштів на управління міграцією."

 legation_cities_events.31.t: "Рада концесій розширює операції"
 legation_cities_events.31.d: "Рада нещодавно відновила зусилля з розширення прибутків від вільної торгівлі для всіх держав-членів. Вони закликали китайських виробників знизити ціни, обіцяючи компенсації в інший спосіб, а посередників — знизити тарифи. Тепер наш бізнес пожинає плоди китайської праці."
 legation_cities_events.31.a: "Наші робітники будуть задоволені."

 legation_cities_events.32.t: "Антиконцесіоністи атакують внутрішні території!"
 legation_cities_events.32.d: "Під час війни Ліги кілька міжнародних концесій у глибині Китаю, зокрема в Ханькоу, Сямені та Чженцзяні, були атаковані антиконцесіоністськими військами та бандитами. Схоже, Нанкін не зможе виграти війну швидко і без шкоди міжнародній власності. Рада дозволила розгорнути міжнародний волонтерський корпус для захисту внутрішніх концесій від Гоміньдану та іншого наброду."
 legation_cities_events.32.a: "Розгорнути сили по всьому Китаю."

 legation_cities_events.33.t: "Цін підтримує антиконцесіоністів!"
 legation_cities_events.33.d: "У відповідь на відокремлення провінції Аньхой від Ліги восьми провінцій, уряд Цін у Пекіні вирішив підтримати кліку Аньціна. Схоже, чжилійський уряд сподівається використати антиконцесійні настрої для підняття власної популярності. На жаль для них, цим кроком вони також відрізали себе від німецької допомоги та визнання."
 legation_cities_events.33.a: "Жахливо!"

 legation_cities_events.34.t: "Офіцери волонтерського корпусу протестують проти надмірної спеціалізації"
 legation_cities_events.34.d: "Після того як ми разом із німцями встановили берегову оборону в наших малих містах, кілька офіцерів корпусу звернулися з пропозицією перетворити частину нових укріплень на сухопутні. Вони стверджують, що надмірні інвестиції в морську оборону залишають нас вразливими перед атакою китайців із суші. Чи приймемо ми їхню пропозицію?"
 legation_cities_events.34.a: "Вони мають рацію, слід змінити плани."
 legation_cities_events.34.b: "Китайці ніколи не наважилися б напасти на нас!"

 legation_cities_events.35.t: "Німеччина надсилає війська до Шанхая"
 legation_cities_events.35.d: "Посилаючись на проблеми безпеки після краху німецького союзника в Нанкіні, німці надіслали додаткові контингенти до волонтерських сил у Шанхаї, а також посилили власні підрозділи в містах. Це підвищило популярність Німеччини серед мешканців та збільшило наші мобілізаційні ресурси."
 legation_cities_events.35.a: "Більше людей нам не завадить."

 legation_cities_events.37.t: "Міста-концесії просять про вступ до Райхспакту"
 legation_cities_events.37.d: "Теоретична мережа міжнародних гарантій цілісності міст-концесій завжди викликала сумніви. Оскільки наш дипломат у Шанхаї очолює Раду концесій, міста подали заявку на вступ до нашого альянсу. Вони стануть корисним інструментом у боротьбі проти японців, хоча дехто стверджує, що вони втягнуть нас у безнадійні війни в Китаї."
 legation_cities_events.37.a: "Ласкаво просимо до Райхспакту!"
 legation_cities_events.37.b: "Це занадто серйозне зобов'язання."

 legation_cities_events.38.t: "Німеччина погоджується!"
 legation_cities_events.38.d: "Німці прийняли нашу пропозицію щодо вступу до їхнього альянсу. Тепер ми маємо захист Кайзерліхмаріне та офіційну дипломатичну підтримку Берліна."
 legation_cities_events.38.a: "Чудово!"

 legation_cities_events.39.t: "Німеччина відмовляє"
 legation_cities_events.39.d: "Берлін, очевидно, вважає наш вступ до альянсу надто великим ризиком для безпеки і відповів відмовою. Нам доведеться протистояти японцям самотужки."
 legation_cities_events.39.a: "Прокляття!"

 legation_cities_events.40.t: "Німеччина вимагає виключення [BEL.GetName]!"
 legation_cities_events.40.d: "Оскільки [BEL.GetName] вийшла з німецької сфери впливу, німці внесли пропозицію до ради про виключення бельгійців та конфіскацію їхньої концесії, посилаючись на їхню «очевидну міжнародну нестабільність»."
 legation_cities_events.40.a: "Винесемо це на голосування."
 legation_cities_events.40.b: "Це безглуздя!"
 legation_cities_events.40.c: "Це звучить логічно."

 legation_cities_events.41.t: "[LEC.GetNameDefCap] відмовляється виключати [BEL.GetNameDef]"
 legation_cities_events.41.d: "Схоже, Рада концесій відмовилася навіть розглядати ідею виключення [BEL.GetName] з ради, повністю відкинувши наші посилання на бельгійську нестабільність як «дріб'язкові скарги», не варті їхнього часу."
 legation_cities_events.41.a: "Ця рада повністю упереджена проти нас!"

 legation_cities_events.42.t: "[LEC.GetNameDefCap] погоджується виключити [BEL.GetNameDef]"
 legation_cities_events.42.d: "Рада побачила очевидну нестабільність [BEL.GetName] і відповідно конфіскувала її концесії в Тяньцзіні та на материковій частині Китаю на користь пекінського уряду. Вони також усунули бельгійський уряд від участі в раді. Це беззаперечна перемога німецької дипломатії!"
 legation_cities_events.42.a: "Вони прислухалися до розуму."

 legation_cities_events.43.t: "Рада концесій конфіскує наші концесії"
 legation_cities_events.43.d: "Відколи ми вийшли з-під впливу Німеччини, німці намагалися дипломатично ізолювати нас усіма можливими способами. Ми зіткнулися з високими тарифами на експорт до країн Міттельєвропи, нас вигнали з Райхспакту. Останньою краплею в цьому списку образ стало те, що німці успішно домоглися нашого виключення з Ради концесій у Шанхаї. Хоча наші китайські володіння ніколи не були пріоритетом, ця образа все одно дошкуляє. З позитивного боку: ми більше не несемо відповідальності за багатьох французів у містах, яким раніше надали громадянство."
 legation_cities_events.43.a: "Мене ніколи не хвилював Тяньцзінь."

 legation_cities_events.44.t: "Рада концесій виключає [BEL.GetNameDefCap]"
 legation_cities_events.44.d: "Німці дипломатично ізолювали Брюссель відтоді, як бельгійці вигнали німецького монарха та залоги під час революції. Останнім кроком стало переконати верховного комісара [LEC.GetNameDef] конфіскувати концесії [BEL.GetName] на користь Пекіна та виключити їх з ради. Формальна законність цього кроку без голосування викликала сумніви в Шанхаї, але наразі німецький маневр є фактом."
 legation_cities_events.44.a: "Їм ніколи не було діла до нас..."

 legation_cities_events.45.t: "Рада концесій голосує за конфіскацію концесій [BEL.GetNameDef]"
 legation_cities_events.45.d: "Верховний комісар вирішив розглянути запит німецького посла про виключення [BEL.GetName] з ради. Ймовірно, всі сторони, що прагнуть домінувати в раді, проголосують за видалення непотрібної третьої сторони, тоді як прихильники багатополярності (британці, австрійці та американці), ймовірно, скажуть «ні»."
 legation_cities_events.45.a: "Час і випадок панують над усіма ними."

 legation_cities_events.46.t: "Рада концесій голосує за виключення бельгійців"
 legation_cities_events.46.d: "Німці дипломатично ізолювали Брюссель після бельгійської революції. Останнім кроком стало переконання комісара провести голосування за виключення [BEL.GetName] з ради. Це може змінити баланс сил у Шанхаї на роки вперед."

 legation_cities_events.47.t: "Результати голосування щодо виключення [BEL.GetNameDef]"
 legation_cities_events.47.d: "Термін голосування за виключення [BEL.GetName] з Ради концесій минув, і схоже, пропозиція..."
 legation_cities_events.47.a: "Була прийнята."
 legation_cities_events.47.b: "Була відхилена!"

 legation_cities_events.48.t: "Статус бельгійських концесій"
 legation_cities_events.48.d.flanders: "З розпуском бельгійського уряду статус їхніх концесій опинився під питанням. Китайський уряд не погодився надати нову концесію ні фламандському уряду, ні бельгійському уряду у вигнанні в Канаді. Схоже, невеликий бельгійський форпост у Тяньцзіні повернувся до рук Китаю, хоча, звісно, поки що він залишатиметься під управлінням міст-концесій."
 legation_cities_events.48.d.syndies: "З революцією в Бельгії статус їхніх концесій став сумнівним. Бельгійський уряд повідомив мандат, що більше не бажає брати участь в імперіалістичній структурі. Китайський уряд не погодився надати концесію бельгійському уряду у вигнанні в Канаді, тож невеликий бельгійський форпост у Тяньцзіні повернувся під контроль Китаю, хоча формально ним досі керуватимуть міста-концесії."
 legation_cities_events.48.a: "Конфіскувати той склад!"

 legation_cities_events.49.t: "Доля бельгійських концесій у Китаї"
 legation_cities_events.49.d.flanders: "Як законний правонаступник багатьох закордонних зобов'язань Фландрії-Валлонії, ми очікували замінити бельгійців і в Раді концесій. Натомість міжнародний мандат оголосив, що концесії повернулися до китайського уряду, і ми більше не маємо жодних прав чи обов'язків у Китаї. Звісно, це дипломатичне розчарування, але принаймні нам більше не доведеться піклуватися про всіх тих франкофонів у містах-концесіях."
 legation_cities_events.49.d.syndies: "Після нашої революції багато хто в уряді закликав [ROOT.GetLeader] розірвати зобов'язання перед імперіалістичною Радою концесій. Нарешті він це зробив, і хоча ми більше не маємо безперешкодного доступу до китайських ринків, ми принаймні зберегли моральну перевагу."
 legation_cities_events.49.a: "Скатертиною дорога"

 legation_cities_events.50.t: "Бельгійські концесії конфісковано"
 legation_cities_events.50.d: "Схоже, Рада концесій конфіскувала концесії Фландрії-Валлонії та усунула їхнього посла з ради. Хоча теоретично ці території тепер повертаються до нас, ймовірно, ними керуватиме рада, оскільки вони розташовані в нейтральній зоні Тяньцзіня. Ба більше, не виключено, що інша консульська держава спробує викупити їх у нас або в ради. Поки що багато хто приватно радіє завершенню дії одного з нерівноправних договорів."
 legation_cities_events.50.a: "Прощавайте!"

 legation_cities_events.51.t: "Виключення Японії з Ради концесій"
 legation_cities_events.51.d: "Японці — загроза стабільності Азії, і вони мають бути покарані, принаймні формально. Ми повинні виключити їх із Ради концесій та конфіскувати підконтрольні їм території, але як саме?"
 legation_cities_events.51.a: "Слід проголосувати за це."
 legation_cities_events.51.b: "Виключити їх без голосування."

 legation_cities_events.52.t: "Нас виключено з Ради концесій"
 legation_cities_events.52.d: "Схоже, Рада концесій повністю вийшла за межі своїх повноважень. На закритому засіданні, без присутності чи повідомлення наших делегатів, рада поспіхом виключила Японську імперію зі свого складу! Зухвалість цього кроку підсилюється тим, що рада спочатку мала бути платформою для посередництва між нами, китайцями та німцями, а тепер ключова сторона відсторонена. Наш уряд дізнався про це з ранкових газет. Армія вимагає рішучої відповіді, яка безперечно дасть військовим мандат на удар по містах, аби назавжди покінчити із західним пануванням у Китаї."
 legation_cities_events.52.a: "Це обурливо!"

 legation_cities_events.53.t: "Рада концесій виключає Японію"
 legation_cities_events.53.d: "Німецький верховний комісар, а отже і Рада концесій, сьогодні виключили Японську імперію з ради. Це очікувано розлютило японців, які вимагають вибачень і негайного відновлення прав, що виглядає малоймовірним. Багато націй уже відкликали свої гарантії містам-концесіям, не маючи бажання захищати їх від імовірної японської атаки. Що нам робити?"
 legation_cities_events.53.a: "Це було законне рішення, ми підтримаємо Шанхай."
 legation_cities_events.53.b: "Ми повинні відмовитися від гарантій!"

 legation_cities_events.54.t: "Рада концесій голосує за конфіскацію японських концесій"
 legation_cities_events.54.d: "Посол Боденгаймер вніс пропозицію про виключення Японії з Ради концесій, і голосування розпочалося. Лише час покаже, чи вдасться зупинити японського монстра."
 legation_cities_events.54.a: "Японців треба стримати!"

 legation_cities_events.55.t: "Рада концесій голосує за конфіскацію японських концесій"
 legation_cities_events.55.d.nojap: "Японська імперія була дестабілізуючою силою в Азії з моменту завершення періоду ізоляції, і глобальні альянси та договори ледь стримували її самовпевненість. Тепер здається, що навіть міста-концесії не змогли зупинити японську агресію. Рада перейшла до дій, і верховний комісар розпочав голосування за виключення японців. Як ми маємо проголосувати?"
 legation_cities_events.55.d.jap: "Рада концесій по-зрадницькому винесла на розгляд пропозицію про наше виключення! Ми не зробили нічого, що заслуговувало б на таке ставлення, але ці західні країни, здається, сповнені рішучості знову ізолювати нашу велику імперію. Якщо ми хочемо уникнути дипломатичної ізоляції, наші люди в Шанхаї повинні діяти швидко, аби не допустити прийняття цього заходу."

 legation_cities_events.56.t: "Результати голосування щодо виключення Японії з ради"
 legation_cities_events.56.d: "Голосування щодо виключення Японії з ради завершилося, і схоже, що німецька пропозиція..."
 legation_cities_events.56.a: "Пройшла!"
 legation_cities_events.56.b: "Провалилася."

 legation_cities_events.57.t: "Рада концесій голосує проти нас"
 legation_cities_events.57.d: "Підступні європейці та американці проголосували за наше виключення з Ради концесій! Наших дипломатів вигнали із зали засідань, а також із муніципальних рад окремих міст. Наші сили офіційно попросили покинути міста. Уряд і армія вимагають військових дій, щоб змити цю ганьбу!"
 legation_cities_events.57.a: "Ці імперіалісти не знають меж!"

 legation_cities_events.58.t: "Рада концесій скасовує японські концесії"
 legation_cities_events.58.d: "Японці, очевидно, перейшли межу в містах-концесіях, і рада їх усунула. Хоча японський вплив у Маньчжурії все ще великий, це знаменний день для перспективи незалежного Китаю."
 legation_cities_events.58.a: "Ще один нерівноправний договір скасовано!"

 legation_cities_events.59.t: "Імперський переворот у Пекіні"
 legation_cities_events.59.d: "Нестабільність у центральному уряді Цін призвела до драматичної зміни режиму в Пекіні. Влада завжди належала У Пейфу та його чжилійській кліці, але тепер вони втратили її на користь оновленої імперської фракції, яку підтримали союзні мілітаристи на південному сході та заході. Новий режим звинуватив іноземне втручання в попередній боротьбі за владу, і багато хто в містах-концесіях тепер боїться початку нової ери офіційного антиконцесіонізму на півночі. Дехто закликає відкликати дипломатичне визнання уряду Цін і визнати законним урядом Китаю або південну Чжилі, або фентянську кліку."
 legation_cities_events.59.a: "Будемо сподіватися, що ситуація покращиться."

 legation_cities_events.60.t: "Валютні резерви вичерпано"
 legation_cities_events.60.d: "Повсякденна діяльність Ради концесій значною мірою залежить від валютних резервів у сховищах Шанхайської банківської корпорації. На жаль, вони майже вичерпалися, а пануюча у світі невизначеність означає, що міста майже не мають кредитів для роботи. Без грошей міста-концесії не зможуть нормально функціонувати. Якщо ми не поповнимо запаси найближчим часом, раді, можливо, доведеться припинити дію мандату."
 legation_cities_events.60.a: "Сподіваємось, усе не буде настільки погано."

 legation_cities_events.61.t: "Рада оголошує про банкрутство"
 legation_cities_events.61.d: "Після кількох днів важких роздумів рада прийняла рішення. Проєкт міст-концесій остаточно провалився. У резервах немає грошей, інтереси держав не задовольняються, а якість життя стрімко падає. Таким чином, було оголошено про припинення міжнародного мандату над усіма китайськими концесіями та початок переговорів з пекінським урядом. Міські комісари та багато бюрократів рішуче протестували, але посли залишили залу засідань і повернулися до своїх резиденцій під охороною національних військ. На вулицях японські та німецькі війська вже почали агресивні маневри, а китайці вийшли на протести по всьому місту. Незабаром нас поглине хаос."
 legation_cities_events.61.a: "Ми намагалися зробити все можливе."

 legation_cities_events.62.t: "Окупація Фучжоу"
 legation_cities_events.62.d: "Рада концесій збанкрутувала, що поклало край міжнародному мандату. Поки Шанхай занурюється у вуличні бої та хаос, віддалені міста мандату залишаються незахищеними. У Фучжоу бунтівники та банди вже захопили контроль над вулицями, а відповідальної влади бракує. Чи маємо ми повернути Фучжоу Китаю?"
 legation_cities_events.62.a: "Місто вразливе, захоплюйте його!"

 legation_cities_events.63.t: "[FROM.GetNameDefCap] окупує Фучжоу"
 legation_cities_events.63.d: "[FROM.GetNameDefCap] ввів свої війська у Фучжоу, посилаючись на очевидне бажання жителів міста возз'єднатися з китайською нацією. Через хаос у Шанхаї ми просто не можемо виділити ресурси на війну з Китаєм зараз."
 legation_cities_events.63.a: "Жахливо!"

 legation_cities_events.64.t: "Окупація Нінбо"
 legation_cities_events.64.d: "Рада концесій збанкрутувала, і міжнародний мандат припинив існування. Поки в Шанхаї панує хаос, віддалені міста залишилися напризволяще. У Нінбо бунтівники та банди переважно придушені, а міська поліція повільно повертає контроль. Проте вони навряд чи зможуть чинити опір окупації з материка. Чи маємо ми повернути Нінбо Китаю?"
 legation_cities_events.64.a: "Місто вразливе, захоплюйте його!"

 legation_cities_events.65.t: "[FROM.GetNameDefCap] окупує Нінбо"
 legation_cities_events.65.d: "[FROM.GetNameDefCap] ввів свої війська в Нінбо, посилаючись на бажання народу повернутися до Китаю, хоча наші сили були близькі до відновлення контролю. Через хаос у Шанхаї ми не маємо ресурсів для протидії."
 legation_cities_events.65.a: "Жахливо!"

 legation_cities_events.66.t: "Окупація Шаньтоу"
 legation_cities_events.66.d: "Рада концесій збанкрутувала. Поки в Шанхаї тривають сутички, Шаньтоу залишилося без захисту. Тамтешні повстанці захопили владу і проголосували за приєднання до нашої країни. Чи маємо ми повернути Шаньтоу Китаю?"
 legation_cities_events.66.a: "Місто вразливе, захоплюйте його!"

 legation_cities_events.67.t: "[FROM.GetNameDefCap] окупує Шаньтоу"
 legation_cities_events.67.d: "[FROM.GetNameDefCap] ввів сили в Шаньтоу. З огляду на ситуацію в Шанхаї, ми не можемо дозволити собі розпилювати сили на захист цього порту."
 legation_cities_events.67.a: "Жахливо!"

 legation_cities_events.68.t: "Окупація Тяньцзіня"
 legation_cities_events.68.d: "Рада концесій збанкрутувала. У Тяньцзіні бунтівники та банди переважно придушені, а поліція повільно повертає контроль за допомогою японців та впливових тріад, кожен з яких намагається захопити місто для своєї фракції. Проте вони не зможуть протистояти регулярній армії з материка. Чи маємо ми повернути Тяньцзінь Китаю?"
 legation_cities_events.68.a: "Місто вразливе, захоплюйте його!"

 legation_cities_events.69.t: "[FROM.GetNameDefCap] окупує Тяньцзінь"
 legation_cities_events.69.d: "[FROM.GetNameDefCap] окупував Тяньцзінь, не бажаючи залишати таке велике місто в руках японців чи криміналітету. Хоча це удар по мандату, ми нічого не можемо вдіяти."
 legation_cities_events.69.a: "Жахливо!"

 legation_cities_events.70.t: "Окупація Гонконгу"
 legation_cities_events.70.d.AST: "В останні дні своєї імперії британська влада розпачливо намагалася зберегти контроль над цінним портом Гонконг, що сприяло формуванню міст-концесій. Проте згодом уряд Австралазії перебрав контроль над містом від мандату від імені Антанти.\n\nЦя домовленість виявилася такою ж крихкою, як і попередня, оскільки Австралазія, колишній захисник інтересів Антанти на сході, вирішила розірвати зв'язки з альянсом. Це зробило місто вразливим і дало нам можливість виправити несправедливість сторічної давнини. Чи маємо ми нарешті покласти край британській присутності в Китаї?"
 legation_cities_events.70.d.LEC: "Рада концесій збанкрутувала, що поклало край міжнародному мандату. Тепер, коли Шанхай занурюється у вуличні бої та хаос, віддалені міста мандату залишилися незахищеними. У Гонконгу британці та товариство Вермільйон співпрацюють для підтримки стабільності, причому обидві сторони прагнуть анексії — до Британії та нашої країни відповідно. Проте британців тут ще немає, і ми маємо шанс на вторгнення. Чи маємо ми повернути Гонконг Китаю?"
 legation_cities_events.70.a: "Він вразливий, захоплюйте його!"

 legation_cities_events.71.t: "[FROM.GetNameDefCap] окупує Гонконг"
 legation_cities_events.71.d.AST: "[FROM.GetNameDefCap] скористався нашим виходом з Антанти, щоб окупувати Гонконг. Поки Австралазія бореться із заворушеннями, схоже, це кінець британської присутності в Китаї."
 legation_cities_events.71.d.LEC: "[FROM.GetNameDefCap] окупував Гонконг, не бажаючи, щоб таке велике місто потрапило до рук британців чи німців. Хоча це удар по мандату, ми нічого не можемо вдіяти зараз."
 legation_cities_events.71.a: "Байдуже."
 legation_cities_events.71.b: "Жахливо!"

 legation_cities_events.72.t: "Крах уряду Ради концесій"
 legation_cities_events.72.d: "Коли Шанхай охоплює хаос після рішення ради про припинення мандату, наші війська, заблоковані в місті, залишаються без наказів. Японці готуються окупувати місто, але ми ще не знаємо їхніх намірів. Схоже, вони збираються захопити доки в очікуванні підкріплень, тож дехто пропонує нашим військам випередити їх, щоб забезпечити лінії постачання. Інші вважають, що ми маємо залишитися в центрі міста і тримати оборону там. Що нам робити?"
 legation_cities_events.72.a: "Ми повинні вдарити першими — захопити доки та центр міста!"
 legation_cities_events.72.b: "Наказати військам залишатися на місцях і чекати на підкріплення."

 legation_cities_events.73.t: "Крах уряду Ради концесій"
 legation_cities_events.73.d: "Поки західні люди масово покидають Китай, наші війська в містах-концесіях залишилися напризволяще. Повідомляють, що німці вдаються до агресивних кроків, аби закріпитися в місті, і наше керівництво закликає нас зробити те саме."
 legation_cities_events.73.a: "Розосередитися по всьому місту."
 legation_cities_events.73.b: "Зайняти доки та чекати на підкріплення."

 legation_cities_events.74.t: "Сутички в Шанхаї"
 legation_cities_events.74.d: "Поки Шанхай поглинає хаос, німецькі та японські війська вступили у бої по всьому місту. Обидві фракції поспішили захопити доки, залишивши решту міста під наглядом волонтерського корпусу. Рада тепер має право вирішити, кого підтримати на дипломатичному та військовому фронтах війни за Шанхай — хто правитиме нашим містом?"
 legation_cities_events.74.a: "Німці перемогли!"
 legation_cities_events.74.b: "Японці перемогли!"

 legation_cities_events.75.t: "Шанхай у безпеці"
 legation_cities_events.75.d: "Наші війська розгромили ворога в Шанхаї, і Шанхайська муніципальна рада відновила контроль над містом під нашим захистом."
 legation_cities_events.75.a: "Чудово!"

 legation_cities_events.76.t: "Поразка в Шанхаї"
 legation_cities_events.76.d.cant_strike: "На жаль, наші сили були вщент розгромлені в Шанхаї, і ненависна імперія тепер окупує місто через офіси Шанхайської муніципальної ради. Зараз ми нічого не можемо вдіяти, але шлях до війни між Німеччиною та Японією відкрито."
 legation_cities_events.76.d.banzai: "Наші війська захопили доки в Шанхаї, але зараз зазнають поразки від німців та їхніх західних союзників. У нас є вагома причина надіслати підкріплення до Шанхая і почати війну проти західних країн, аби вигнати їх з Азії раз і назавжди."
 legation_cities_events.76.a: "Прокляття!"

 legation_cities_events.77.t: "Міста-концесії просять про вступ до Сфери спільного процвітання"
 legation_cities_events.77.d: "Міста-концесії довгий час були змушені мандатом залишатися нейтральними у світових справах. Проте тепер, коли Китайське агентство та наш посол у Шанхаї мають повний контроль над містами, вони можуть покласти край дрібним чварам у раді та приєднатися до своїх азійських братів!"
 legation_cities_events.77.a: "Азія для азіатів!"
 legation_cities_events.77.b: "Відмовити, ми ще не можемо гнівати Німеччину."

 legation_cities_events.78.t: "Японія погоджується!"
 legation_cities_events.78.d: "Японці прийняли нашу пропозицію щодо вступу до їхнього альянсу. Тепер ми маємо захист японського імператорського флоту та армії, а також дипломатичну та фінансову підтримку Японії. На жаль, наша автономія була суворо обмежена формальним розпуском ради, і тепер ми, по суті, є лише слухняним знаряддям японських військових."
 legation_cities_events.78.a: "Стривайте, а що там було в кінці?"

 legation_cities_events.79.t: "Японія відмовляє"
 legation_cities_events.79.d: "Токіо, очевидно, вважає наш вступ до альянсу надто великим ризиком для безпеки і відповів відмовою. Нам доведеться протистояти китайцям самотужки."
 legation_cities_events.79.a: "Прокляття!"

 legation_cities_events.80.t: "Доля Чжан Сяоліня"
 legation_cities_events.80.d: "Чжан Сяолінь був корисним інструментом для японців, використовуючи свої кримінальні зв'язки для забезпечення контролю над містами та отримуючи при цьому чималий прибуток. Однак тепер, коли позиції японців стали досить міцними, деякі дипломати та офіцери починають замислюватися, чи справді допомога Сяоліня все ще необхідна на цьому етапі.\n\nБуло організовано зустріч із Сяолінем та його найближчими підлеглими. Коли наші офіційні особи наближаються до будинку розваг чудового шанхайського вечора, поліцейські та гангстери оцінюють один одного, гадаючи, хто зробить перший крок. Після прийому окружний комісар засовує руку в кишеню. Що він звідти витягне?"
 legation_cities_events.80.a: "Свій револьвер!"
 legation_cities_events.80.b: "Призначення Сяоліня в уряд."

 legation_cities_events.81.t: "Виключення Німеччини з Ради концесій"
 legation_cities_events.81.d: "Німецька імперія вразлива, і настав час виправити їхні зловживання на Далекому Сході, виключивши їх із ради. Як нам діяти?"
 legation_cities_events.81.a: "Слід проголосувати за їхнє виключення."
 legation_cities_events.81.b: "Європейці захистять їх, ми повинні діяти самостійно."

 legation_cities_events.82.t: "Рада концесій скасовує наші концесії"
 legation_cities_events.82.d: "Підступна Рада концесій усунула нашу країну від участі в засіданнях, попри наші неодноразові заперечення. Вони конфіскували наші китайські концесії, принизили нас перед світом і закрили нам шлях до важелів влади в Китаї. Колоніальне відомство та кайзер вимагають ворожої відповіді. Наш Східноазійський флот має бути готовий до удару."
 legation_cities_events.82.a: "Обурливо!"

 legation_cities_events.83.t: "Рада концесій виключає Німеччину"
 legation_cities_events.83.d: "Рада концесій у Шанхаї на закритому засіданні виключила Німеччину зі свого складу. Вони стверджують, що Німеччина підриває дух Шанхайської конференції, і закликають усі держави-члени допомогти їм."
 legation_cities_events.83.a: "Німеччина переоцінила свої сили."
 legation_cities_events.83.b: "Ми не будемо воювати з Німеччиною, відмовляємося від наших концесій!"

 legation_cities_events.84.t: "Рада починає голосування за виключення німецьких концесій"
 legation_cities_events.84.d: "Рада розпочала голосування за пропозицією японського посла про виключення Німеччини з Ради концесій."
 legation_cities_events.84.a: "Сподіваємося, вони проголосують «за»."

 legation_cities_events.85.t: "Рада концесій голосує за скасування німецьких концесій"
 legation_cities_events.85.d.noger: "Німці вже кілька років поступово ізолюють себе в Раді концесій. Про їхню зарозумілість та нечесну гру добре відомо поінформованим колам Шанхая, навіть коли вони заявляють, що відстоюють справу глобальної стабільності та співпраці. Схоже, тепер рада вирішила усунути їх від тих частин Китаю, де вона вважає це юридично можливим. Чи варто нам скористатися можливістю завдати удару світовому гегемону, чи це занадто ризиковано?"
 legation_cities_events.85.d.ger: "Рада концесій розпочала голосування за пропозицію виключити наш Райх із китайських територій, якими вона керує, та вигнати наших дипломатів із ради! Якщо це рішення пройде, це стане величезним ударом по німецькій могутності в Азії, і ми повинні зробити все можливе, аби цього не допустити."

 legation_cities_events.86.t: "Результати голосування щодо виключення німецьких концесій"
 legation_cities_events.86.d: "Голосування щодо виключення Німеччини завершилося, і схоже, що воно..."
 legation_cities_events.86.a: "Пройшло!"
 legation_cities_events.86.b: "Провалилося."

 legation_cities_events.87.t: "Рада концесій голосує за наше виключення"
 legation_cities_events.87.d: "Підступна Рада концесій усунула нашу країну від участі в засіданнях. Вони конфіскували наші китайські концесії, принизили нас перед світом і закрили нам доступ до влади в Китаї. Колоніальне відомство та кайзер вимагають відповіді. Наш флот має бути готовий до дії."
 legation_cities_events.87.a: "Прокляття!"

 legation_cities_events.88.t: "Рада концесій скасовує німецькі концесії"
 legation_cities_events.88.d: "Рада концесій нещодавно виключила Німеччину зі свого складу та конфіскувала її концесії. Хоча вони колись були формальним союзником Китаю, їхня пиха та закулісні ігри, безперечно, заслуговували на це."
 legation_cities_events.88.a: "Імперіалізм повільно відступає з Китаю."

 legation_cities_events.89.t: "Рада концесій виключає нас із ради"
 legation_cities_events.89.d: "Підступна Рада концесій усунула нашу країну від участі в засіданнях. Вони конфіскували наші китайські концесії та принизили нас перед світом. Колоніальне відомство та кайзер вимагають ворожої відповіді."
 legation_cities_events.89.a: "Це обурливо!"

 legation_cities_events.90.t: "Домінування в Раді концесій"
 legation_cities_events.90.d: "Схоже, що в Раді концесій почала домінувати одна країна — [LEC_voter1]. Оскільки рада контролює всі справи мандату, ми тепер фактично підпорядковуємося диктату цієї держави."
 legation_cities_events.90.a: "Це ніяково."

 legation_cities_events.91.t: "Повний вплив у містах-концесіях"
 legation_cities_events.91.d: "Міста-концесії замислювалися як форум для всіх держав з концесіями в Китаї, аби спільно гарантувати зону вільної торгівлі. Однак дивний стан справ у раді, де наша країна є єдиною державою з правом голосу, фактично перетворив міста на продовження нашої власної політики."
 legation_cities_events.91.a: "Вони виконуватимуть нашу волю."

 legation_cities_events.92.t: "Перемога Нанкіна"
 legation_cities_events.92.d: "Наші найманці та таємні агенти, які допомагали нанкінській кліці, можливо, не були єдиною вирішальною силою у війні, але схоже, що [LEP.GetLeader] здобув перемогу над антиконцесіоністами, які його оточували. Наш статус у Східному Китаї, принаймні зараз, у безпеці."
 legation_cities_events.92.a: "Чудово!"

 legation_cities_events.93.t: "Мир із західними країнами?"
 legation_cities_events.93.d: "Ми покінчили з фізичною присутністю імперіалістичних міст-концесій у Китаї. Тепер залишився лише клаптик паперу, який західна коаліція намагається захистити... і наша війна з більшою частиною світу. Ми могли б офіційно припинити і те, і інше, принісши мир в Азію, запросивши західні держави, що протистоять нам, за стіл переговорів. Чи варто зробити таку пропозицію?"
 legation_cities_events.93.a: "Ми повинні закінчити війну."
 legation_cities_events.93.b: "Західників треба вигнати з Китаю!"

 legation_cities_events.94.t: "Мир із [FROM.GetNameDef]?"
 legation_cities_events.94.d: "Китайці розгромили незалежні сили Міжнародного мандату та захопили наші концесії. Вони вже почали інтеграцію колишніх міст мандату до своєї держави. Дехто в нашій країні стверджує, що ми воюємо лише за клаптик паперу. Інші ж заперечують, що ми боремося за нашу честь як нації та раси. Чи варто погодитися на [FROM.GetAdjective] запит?"
 legation_cities_events.94.a: "Війна закінчена, треба лише це визнати."
 legation_cities_events.94.b: "Ми ніколи не здамося китайцям!"

 legation_cities_events.95.t: "[From.GetNameDefCap] приймає мир"
 legation_cities_events.95.d: "[From.GetAdjective] посли повернулися до нас із новиною: вони та їхні союзники прийняли нашу пропозицію миру. Вони визнають нашу владу над колишніми містами-концесіями та всіма іншими територіями в Китаї в обмін на символічну контрибуцію. Бойові дії припиняються."
 legation_cities_events.95.a: "Чудово!"

 legation_cities_events.96.t: "[FROM.GetNameDefCap] відхиляє нашу пропозицію"
 legation_cities_events.96.d: "Зарозумілі [FROM.GetAdjective] імперіалісти відхилили нашу шляхетну пропозицію миру! Схоже, нам доведеться битися до переможного кінця."
 legation_cities_events.96.a: "Іншого годі було й чекати."

 legation_cities_events.97.t: "Другий вельткріґ"
 legation_cities_events.97.d: "Французи та німці знову воюють після двадцятирічного миру. [CAN_king_full_name] та його союзники в Алжирі скористалися цією можливістю і починають підготовку до нападу. У відповідь на це шанхайський фондовий ринок знову обвалився, і мандату загрожує чергова рецесія. Хоча цього ще можна уникнути, німецький та британський бізнес постраждали особливо сильно: багато крамниць по всьому місту зачинилися."
 legation_cities_events.97.a: "Війна — це справді пекло."

 legation_cities_events.98.t: "Окупація Макао"
 legation_cities_events.98.d: "Рада концесій збанкрутувала, що поклало край міжнародному мандату. Поки Шанхай занурюється у хаос, віддалені міста залишилися без захисту. Після краху португальських військових зусиль волонтерський корпус мандату був запрошений до Макао для захисту міста. Проте падіння [LEC.GetAdjective] уряду залишає нас єдиним шансом на безпеку в цій найстарішій з концесій. Чи маємо ми повернути цей порт Китаю?"
 legation_cities_events.98.a: "Місто вразливе, захоплюйте його!"

 legation_cities_events.99.t: "[FROM.GetNameDefCap] окупує Макао"
 legation_cities_events.99.d: "[FROM.GetNameDefCap] окупував Макао раніше, ніж наші сили встигли навести порядок або португальці — повернутися. Хоча це удар по мандату, ми нічого не можемо вдіяти."
 legation_cities_events.99.a: "Жахливо!"

 legation_cities_events.100.t: "Крах німецьких військових зусиль"
 legation_cities_events.100.d: "Німецька зброя виявилася неспроможною захистити батьківщину від ворогів. Берлін упав, і поки уряд у вигнанні створюється за морем, Райх явно втратив більшу частину свого впливу на Далекому Сході."
 legation_cities_events.100.a: "Тривожно."
 legation_cities_events.100.b: "Застосувати статтю 14!"
 legation_cities_events.100.c: "І не повертайтеся, імперіалістичні свині!"

 legation_cities_events.101.t: "Друге застосування статті 14"
 legation_cities_events.101.d: "З падінням Німеччини настав час знову вирішувати майбутнє міст. Верховний комісар застосував статтю 14, і рада зібралася, аби визначити долю мандату. Хоча американці прагнуть повернути свою першість, їхня країна навряд чи в кращому стані за Німеччину. Британці закликають раду звернутися до них, адже вони, хоч і у вигнанні, довели свою стійкість. Інші ж намагаються переконати комісара Боденгаймера, що час іноземного контролю минув. Чи маємо ми задовольнити їхнє прохання? Чи міста занадто цінні, щоб повертати їх у хаотичні руки китайців?"
 legation_cities_events.101.a: "Ми повинні повернутися під крило Америки."
 legation_cities_events.101.b: "Британці допоможуть нам."
 legation_cities_events.101.c: "Епоха імперіалізму закінчилася — поверніть міста Китаю."

 legation_cities_events.102.t: "Американці перебирають контроль у Шанхаї"
 legation_cities_events.102.d: "Після краху Німеччини міста-концесії знову звернулися до американців, аби ті вели їх у майбутнє."
 legation_cities_events.102.a: "Цікаво."

 legation_cities_events.103.t: "Британське домінування в Шанхаї"
 legation_cities_events.103.d: "Після всесвітнього краху Німеччини міста-концесії попросили британців про керівництво та захист."
 legation_cities_events.103.a: "Цікаво."

 legation_cities_events.104.t: "Кінець міжнародного мандату"
 legation_cities_events.104.d: "Після краху німецьких військових зусиль міста-концесії залишилися без міжнародного покровителя. Не маючи до кого звернутися і побоюючись японського вторгнення, рада попросила нашу країну повернути контроль над містами мандату."
 legation_cities_events.104.a: "Нерівноправним договорам покладено край!"

 legation_cities_events.105.t: "Кінець міжнародного мандату"
 legation_cities_events.105.d: "Сьогодні, [?global.date.GetDateStringNoHourLong], верховний комісар [LEC.GetLeader] офіційно розпустив Раду міжнародного мандату китайських концесій і провів церемонію з [FROM.GetLeader], де назавжди передав повноваження над містами колишнього мандату законному уряду Китаю. Потім він був звільнений від обов'язків і повернувся до посольства, готуючись до подорожі додому. Протягом наступних днів за ним підуть незліченні європейці. Це кінець епохи, але ми маємо надію, що Шанхай процвітатиме у складі об’єднаного Китаю, хоча саме його існування зараз під питанням."
 legation_cities_events.105.a: "«Париж Сходу» відпливає."

 legation_cities_events.106.t: "Кінець міжнародного мандату"
 legation_cities_events.106.d: "Сьогодні, [?global.date.GetDateStringNoHourLong], верховний комісар [LEC.GetLeader] офіційно розпустив раду та передав владу над містами законному Китаю. Хоча новий Шанхай, імовірно, не буде таким вигідним для нашої нації, як старий, ми мало що можемо вдіяти, адже саме крах більшості імперіалістичних держав світу став поштовхом до цієї передачі."
 legation_cities_events.106.a: "Кінець ери."

 legation_cities_events.107.t: "Рада обговорює Лігу лівих письменників"
 legation_cities_events.107.d: "Ліга лівих письменників була сформована у 1933 році в Шанхаї, імовірно за підбурювання Гоміньдану, під впливом знаменитого автора Лу Сюня. Метою групи було просування соціалістичного реалізму в Китаї. Вони часто вели запеклі дебати з товариством «Півмісяця» — групою, яка стверджує, що мистецтво має існувати лише заради мистецтва. Останнім часом письменники посилили пропаганду на користь лівого Гоміньдану, що, на думку ради та поліції, стало загрозою для мандату. Що нам робити з цими баламутами?"
 legation_cities_events.107.a: "Заарештувати їх та конфіскувати матеріали!"
 legation_cities_events.107.b: "Просто заборонити їхні відверто політичні публікації."
 legation_cities_events.107.c: "Мистецтво — поняття відносне, нехай пишуть..."

 legation_cities_events.108.t: "Ізольований мандат"
 legation_cities_events.108.d: "З поразкою або усуненням усіх членів ради міжнародний мандат втратив сенс. Хоча багато емігрантів хотіли б, аби міста залишалися незалежними під власним урядом, без міжнародного захисту така держава з правлінням меншості навряд чи виживе в цьому буремному регіоні. Комісар [LEC.GetLeader] прийняв рішення повернути міста китайському уряду."
 legation_cities_events.108.a: "Це був гарний час."

 legation_cities_events.118.t: "Чень Цзюнмін проводить конференцію в Шаньтоу"
 legation_cities_events.118.d: "Федералізм у Китаї багато разів зазнавав поразок, але завжди повставав із попелу. Головною причиною цього є наполегливість його головного прихильника, Чень Цзюнміна з Ґуандуна. Нещодавно він переміг ворожу кліку Ґуансі та зрадників у власних лавах, і тепер готовий до походів на північ і схід. Для організації свого режиму він проводить конференцію в Шаньтоу — одному з міст нашого мандату. Оскільки місто формально належить Китаю, у нас немає законних підстав йому відмовити. Нам навряд чи нададуть навіть статус спостерігача, тож ми можемо лише збоку стежити за тим, як вирішується доля Китаю."
 legation_cities_events.118.a: "Що ж, успіхів..."

 legation_cities_events.119.t: "Ду Юешен завчасно вніс заставу"
 legation_cities_events.119.d: "Коли поліція прибула до чайної Ду Юешена, аби заарештувати його до суду, гангстер швидко надіслав підлеглого з «зустрічною пропозицією». Оскільки за законом він може бути звільнений під заставу до початку суду, немає сенсу навіть везти його до відділку. Уряд охоче погодився прийняти негайну оплату готівкою. Офіцери зголосилися, і тепер Ду Юешен чекає на суд у звичній для нього обстановці — на волі."
 legation_cities_events.119.a: "Стривайте, ми не отримали нічого з цих грошей!"

 legation_cities_events.120.t: "Ду Юешень зник"
 legation_cities_events.120.d.american: "Коли офіцери нарешті зібралися виконати вирок щодо Ду Юешеня — довічне ув'язнення в Японії, подалі від його бази в Шанхаї, — вони прибули до його чайної і не знайшли там нікого. Рада концесій розіслала орієнтування силам безпеки по всьому мандату. Проте після місяця пошуків стало зрозуміло, що Ду зник, а ті, хто знає його місцеперебування, мовчать. За його відсутності лідерство в тріадах перейшло до менш значущих постатей, але роль лідера націоналістичної китайської громади тепер остаточно закріпилася за Робертом Хотуном, «великим старцем Гонконгу»."
 legation_cities_events.120.d.germans: "Коли офіцери прибули за Ду Юешенем, його вже не було. Пошуки по всьому мандату не дали результатів. За його відсутності вплив у південних містах перехопив Східнокитайський директорат (AOG). Зокрема, тепер Лотара Айзентреґера називають однією з найвпливовіших постатей у мандаті."
 legation_cities_events.120.d.brit: "Ду Юешень зник до того, як вирок було виконано. Поки сили безпеки марно шукають його, вплив у Гонконгу перейшов до офіційного британського генерал-губернатора міста."
 legation_cities_events.120.d.japanese: "Ду Юешень втік. Поки тріади шукають нового лідера, фактична влада над кримінальним світом перейшла до рук здібного, хоч і дещо божевільного Хіраї Амане."
 legation_cities_events.120.a: "Головне, що він пішов..."

 legation_cities_events.121.t: "Чжан Сяолінь уникає арешту"
 legation_cities_events.121.d: "Схоже, Чжан Сяолінь не збирався ризикувати. Рада видала ордер на його арешт, але його ніде не бачили, хоча всі знають, що він десь у Фучжоу. Він або підкупив поліцію, або надійно сховався. Це не завадило йому передати до офісу верховного комісара записку, загорнуту в пачку цигарок «Золотий дракон», де він повідомляє, що продовжить співпрацю, якщо його не засудять."
 legation_cities_events.121.a: "Ми не ведемо переговорів зі злочинцями!"

 legation_cities_events.122.t: "Смерть Чжана Сяоліня"
 legation_cities_events.122.d.american: "Чжана Сяоліня судили заочно і засудили до довічного ув'язнення у Владивостоці. Велику винагороду за інформацію про нього нарешті отримали: колишні спільники видали його місцеперебування. Тиждень тому поліція оточила склад у Фучжоу. На вимогу здатися гангстери відповіли вогнем. Під час штурму Чжана було поранено в ногу, а потім застрелено власним підручним, аби той не потрапив у полон. Після його смерті промисловець Лю Хуншен, відомий як «король сірників», перебрав контроль над напівлегальною діяльністю Чжана в Шанхаї та Фучжоу."
 legation_cities_events.122.d.brit: "Чжан Сяолінь загинув під час штурму складу у Фучжоу. Після його смерті вплив у Шанхаї здобув апостольський вікарій Томас Тянь Кенсінь, що трохи відвернуло місто від злочинності в бік католицизму."
 legation_cities_events.122.d.germans: "Чжан Сяолінь був убитий власними людьми під час поліцейської облави. Тепер жорстокий оперативник AOG Вальтер Штеннес захопив контроль у Фучжоу, просуваючи інтереси своєї організації."
 legation_cities_events.122.d.japanese: "Чжан Сяолінь мертвий. Тепер оперативник Китайського агентства Масахіко Амакасу встановив повний контроль над Фучжоу, зміцнюючи японські позиції."
 legation_cities_events.122.a: "Він був занадто небезпечним, щоб лишати його в живих."

 legation_cities_events.123.t: "Розслідування щодо Хуан Цзіньжуна"
 legation_cities_events.123.d: "Хуан Цзіньжун наразі перебуває під судом за непрофесійні та незаконні методи розкриття злочинів. Незважаючи на це, він усе ще залишається начальником поліції Шанхая і не виявляє жодного страху. Ба більше, його часто бачать у компанії державного прокурора під час дружніх прогулянок містом."
 legation_cities_events.123.a: "Він напевно не зробив нічого поганого."

 legation_cities_events.124.t: "Переведення Хуан Цзіньжуна"
 legation_cities_events.124.d.american: "Хоча Хуан Цзіньжун, безперечно, скоїв багато жахливих вчинків, більшість із них були на службі нашого уряду. Тому його просто понизили: він більше не шеф поліції Шанхая, а переведений до Нінбо. Його наступник у Шанхаї, американський фінансист Соломон Адлер, уже налагоджує контакти зі старою мережею Чжана."
 legation_cities_events.124.d.brit: "Хуан Цзіньжуна перевели до Нінбо. Його наступником став тихий британський чиновник, чия єдина чеснота — абсолютна лояльність до гонконзького банкіра Ванделера Моліньє Грейберна."
 legation_cities_events.124.d.germans: "Хуан Цзіньжуна відправлено до Нінбо. Новий шеф поліції Шанхая — німецький дипломат Губерт Кніппінг."
 legation_cities_events.124.d.japanese: "Хуан Цзіньжуна переведено в Нінбо. Його посаду обійняв японський генерал і голова безпеки Китайського агентства Мітітаро Комацубара."
 legation_cities_events.124.a: "Успіхів усім вам."

 legation_cities_events.125.t: "Відновлення міст-концесій"
 legation_cities_events.125.d: "[FROM.GetNameDefCap] нещодавно окупував колишні міста мандату, але вирішив повернути владу Раді концесій. Оскільки ми маємо там свої інтереси, нам повернули місце в раді. Цього разу багато націй, раніше виключених із голосування, знову отримали свої права."
 legation_cities_events.125.a: "Чудово!"

 legation_cities_events.126.t: "Вимагати китайські концесії наших союзників?"
 legation_cities_events.126.d: "Як міжнародний мандат, ми формально відповідаємо за захист та регулювання всіх іноземних територій у Китаї. Оскільки наші союзники нещодавно здобули нові землі, дехто в Шанхаї пропонує раді вимагати передачі цих територій під наше управління."
 legation_cities_events.126.a: "Звісно, вони по праву наші."
 legation_cities_events.126.b: "Ми і так ледь справляємося з тим, що маємо."

 legation_cities_events.127.t: "Міста-концесії вимагають наші території в Китаї"
 legation_cities_events.127.d: "Рада концесій звернулася до нас із вимогою передати під їхнє управління наші нещодавно здобуті території в Китаї, посилаючись на свій статус міжнародного мандату."
 legation_cities_events.127.a: "Хто ми такі, аби стояти на заваді інтернаціоналізму?"
 legation_cities_events.127.b: "Нам самим потрібні ці колонії!"

 legation_cities_events.128.t: "[FROM.GetNameDefCap] передає концесії"
 legation_cities_events.128.d: "Наші союзники погодилися на наш запит. Нові території повністю інтегровані в нашу адміністрацію. Наш контроль над китайською торгівлею розширюється."
 legation_cities_events.128.a: "Дякуємо, [FROM.GetNameDef]!"

 legation_cities_events.129.t: "[FROM.GetNameDefCap] відмовляється передавати концесії"
 legation_cities_events.129.d: "Підступні та жадібні [FROM.GetAdjective] імперіалісти відмовилися передати нам свої нові колонії. Це смертельна образа нашому мандату!"
 legation_cities_events.129.a: "Прокляття!"

 legation_cities_events.130.t: "Капітуляція Японської імперії"
 legation_cities_events.130.d.hostiletojapanese: "Наш великий ворог, Японська імперія, нарешті капітулювала перед силами свободи та цивілізації! З крахом їхніх військових зусиль японські щупальця назавжди прибрані з Азії."
 legation_cities_events.130.d.friendlytojapanese: "Наш головний покровитель здався. Попри те, що ми вціліли як єдність, наша політика зруйнована. Японський верховний комісар більше не може обіймати посаду — потрібно застосувати статтю 14."
 legation_cities_events.130.d.neutraltojapanese: "Японія капітулювала. Багато хто ставить під сумнів доцільність існування мандату тепер, коли холодна війна в Азії закінчилася."
 legation_cities_events.130.a: "Тривожно."
 legation_cities_events.130.b: "Ми маємо знову застосувати статтю 14!"
 legation_cities_events.130.c: "І не повертайтеся!"

 legation_cities_events.131.t: "Друге застосування статті 14"
 legation_cities_events.131.d: "Після капітуляції Японії її було виключено з ради. Настав час вирішити майбутнє міст. Американці хочуть повернути лідерство, але їхня країна не в кращому стані за Японію. Німці, що зберегли імперію, теж є варіантом. Британці закликають покластися на них. Інші ж вважають, що час іноземного правління минув. Чи повернемо ми міста Китаю?"
 legation_cities_events.131.a: "Ми маємо повернутися під крило Америки."
 legation_cities_events.131.b: "Британці допоможуть нам."
 legation_cities_events.131.c: "Німці — наша єдина надія."
 legation_cities_events.131.e: "Епоха імперіалізму закінчилася — поверніть міста Китаю."
 legation_cities_events.131.f: "Епоха імперіалізму закінчилася — ми і є Китай!"

 legation_cities_events.132.t: "Американці беруть під контроль Шанхай"
 legation_cities_events.132.d: "Після японської капітуляції міста-концесії знову звернулися до американців за лідерством."
 legation_cities_events.132.a: "Цікаво."

 legation_cities_events.133.t: "Британське домінування в Шанхаї"
 legation_cities_events.133.d: "Після капітуляції Японії міста-концесії попросили британців про захист."
 legation_cities_events.133.a: "Цікаво."

 legation_cities_events.134.t: "Німці повертаються до Шанхая"
 legation_cities_events.134.d: "Після капітуляції Японії міста-концесії попросили німців знову взяти на себе керівництво."
 legation_cities_events.134.a: "Цікаво."

 legation_cities_events.135.t: "Кінець міжнародного мандату"
 legation_cities_events.135.d: "Після капітуляції Японії міста-концесії залишилися без підтримки. Рада попросила нашу націю повернути контроль над містами мандату."
 legation_cities_events.135.a: "Нерівноправні договори скасовано!"

 legation_cities_events.138.t: "Рада голосує за призов до волонтерського корпусу"
 legation_cities_events.138.d: "Верховний комісар скликав раду для вирішення питання про початок призову жителів міжнародного кварталу. Багато хто в Шанхаї вважає це необхідним для захисту міст. Якщо призов схвалять, рада, ймовірно, не буде залучати етнічних китайців, проти чого виступає керівництво корпусу."
 legation_cities_events.138.a: "Хай проголосують мудро."

 legation_cities_events.139.t: "Рада голосує за обмежений призов"
 legation_cities_events.139.d: "На розгляд винесено питання про обмежений призов. Оскільки надія на мир на Далекому Сході тане, посилення власних сил захисту стає пріоритетом. Рада може дозволити збільшити чисельність корпусу, що дасть нам змогу менше покладатися на зовнішню допомогу."

 legation_cities_events.140.t: "Результати голосування за призов"
 legation_cities_events.140.d: "Голосування щодо призову завершилося. Схоже, пропозиція..."
 legation_cities_events.140.a: "Була прийнята!"
 legation_cities_events.140.b: "Була відхилена."

 legation_cities_events.141.t: "Голосування за призов прийнято попри протести експатріантів"
 legation_cities_events.141.d: "Наші громадяни в Шанхаї, Тяньцзіні та інших прибережних містах під міжнародним захистом рішуче протестують проти запровадження призову. Вони стверджують, що цей захід безповоротно нищить вільний дух міст. Багато хто звернувся до нашого уряду з вимогою скасувати рішення, яке, на їхню думку, порушує належні їм привілеї."
 legation_cities_events.141.a: "Вже пізно щось змінювати."

 legation_cities_events.142.t: "Війна з містами-концесіями"
 legation_cities_events.142.d: "Хоча міста-концесії спочатку замислювалися як мирний гарант торгівлі з Китаєм, світ змінився непередбачувано. Ми перебуваємо у стані війни з мандатом, тож нам слід тимчасово вийти з ради та відмовитися від привілеїв членства до нашої неминучої перемоги."
 legation_cities_events.142.a: "Світ перевернувся догори дриґом."

 legation_cities_events.143.t: "Розпуск Шанхайського волонтерського корпусу"
 legation_cities_events.143.d: "Волонтерський корпус добре служив міжнародним інтересам, але часи змінилися. Чи варто нам розпустити його і створити армію самого Шанхая і для Шанхая?"
 legation_cities_events.143.a: "Ми маємо розпустити його."
 legation_cities_events.143.b: "Він усе ще цінний."

 legation_cities_events.144.t: "Шанхай прагне об'єднатися з Китаєм"
 legation_cities_events.144.d: "Наш маріонетковий уряд у Шанхаї, встановлений задовго до нашої славної перемоги над імперіалістами, прагне об'єднатися з нашим китайським союзником, [FNG.GetNameDef]. Чи маємо ми перешкодити їм, чи дозволити діяти?"
 legation_cities_events.144.a: "Дозволити їм об'єднатися зі своєю країною."
 legation_cities_events.144.b: "Розділяй і володарюй!"

 legation_cities_events.145.t: "Шанхай прагне об'єднання"
 legation_cities_events.145.d: "Японській маріонетковій державі в Шанхаї нарешті дозволили повернутися до складу Китаю! Наша нація стає ближчою до процвітання."
 legation_cities_events.145.a: "Чудово!"
 legation_cities_events.145.b: "Вони нам не потрібні."

 legation_cities_events.146.t: "Возз'єднання з [FNG.GetName]"
 legation_cities_events.146.d: "Нарешті Китай возз'єднаний! Японці та китайці домовилися про передачу контролю над урядом Шанхая Пекіну."
 legation_cities_events.146.a: "За країну!"

 legation_cities_events.147.t: "Японія відхиляє запит Шанхая про об'єднання"
 legation_cities_events.147.d: "Наші японські «друзі» відхилили патріотичний запит Шанхая про возз'єднання з пекінським урядом!"
 legation_cities_events.147.a: "Ми ніколи не могли їм довіряти."

 legation_cities_events.148.t: "Шанхайська драма"
 legation_cities_events.148.d: "У світових новинах з'явилася нова французька драма з Алжиру «Шанхайська драма». Знятий відомим Г. В. Пабстом, фільм розповідає про вигнану французьку аристократку, яка працює співачкою в кабаре Шанхая. Критики відзначають, що стрічка є коментарем до роздробленого стану Китаю, водночас висвітлюючи гедоністичний спосіб життя європейських вигнанців у міжнародних кварталах. Попри політичний підтекст, фільм вважається успішним, а глядачі в захваті від акторської гри Крістль Мардайн."
 legation_cities_events.148.a: "Ходімо в кіно."

 legation_cities_events.149.t: "Розквіт «дацай»"
 legation_cities_events.149.d: "У тьмяному світлі вулиці Фучжоу в районі Хуанпу з'явилася нова химерна кухня. Ці заклади відкрили кантонці, які звикли готувати із західних та китайських інгредієнтів. Страви, прозвані «дацай» (великі страви), є домашнім ф'южном дешевої західної їжі, адаптованої до китайського смаку. Популярні страви включають борщ без буряка, запечену лазанью та свинячі відбивні з ворчестерським соусом. Замість вина часто подають китайську горілку. Особливу популярність дацай здобув серед повій, які сподіваються знайти там клієнтів."
 legation_cities_events.149.a: "Смачного!"

 legation_cities_events.150.t: "Кінець американської громадянської війни"
 legation_cities_events.150.d.wca_won: "Громадянська війна в США закінчилася, і по нашому мандату завдано чергового удару. З повною поразкою пробізнесових сил у серці Америки ми більше ніколи не побачимо американських кораблів чи військ як союзників. Якщо вони й прийдуть, то лише як «визволителі» китайців."
 legation_cities_events.150.d.capitalists_won: "Громадянська війна в США закінчилася, що трохи посилило позиції нашого мандату. З перемогою пробізнесових сил у нас з'явився надійний союзник. Ми з нетерпінням чекаємо на повернення американських миротворців до нашого міста та посла до ради."
 legation_cities_events.150.a: "Сонце заходить на заході."
 legation_cities_events.150.b: "Добре! Тепер до справ..."

 legation_cities_events.151.t: "Ангел з вулиці ([GetYear])"
 legation_cities_events.151.d: "Новим хітом шанхайського прокату став «Ангел з вулиці» режисера Юань Мучжі. Ліга лівих письменників назвала цей фільм «шедевром» китайського лівого руху. Стрічка розповідає про життя в нетрях старого Шанхая і є відкритою критикою корупції та бідності, спричинених колоніальним статусом міста."
 legation_cities_events.151.a: "Чудово! Але як щодо стабільності?"

 legation_cities_events.152.t: "Трагічний кінець Жуань Лін'юй"
 legation_cities_events.152.d: "Сьогодні весь Китай відчув велику втрату: прекрасна акторка Жуань Лін'юй покінчила з собою у віці 28 років. Понад 100 000 людей прийшли на її похорон у Шанхаї. Її бурхливе приватне життя нещадно експлуатувалося таблоїдами, що і призвело до трагедії. У передсмертній записці вона написала лише: «Плітки — це страшна річ»."
 legation_cities_events.152.a: "Весь Китай у жалобі..."

 legation_cities_events.153.t: "Ейлін Чанг"
 legation_cities_events.153.d: "У Шанхаї з'явився новий бестселер — «Золота канга», розповідь про життя в містах-концесіях, сповнене розбрату та криміналу. Авторка — 23-річна Чжан Ін, відома як Ейлін Чанг. Її твори ілюструють побут звичайних китайців під гнітом нерівності та стресу війни. Критики відзначають незвичайну для такого молодого віку літературну зрілість."
 legation_cities_events.153.a: "Справді чудова книга!"

 legation_cities_events.154.t: "Мулань іде до армії"
 legation_cities_events.154.d: "Історія Мулань — давня балада про дівчину, яка йде на війну замість батька. Фільм, знятий попри японську цензуру, сповнений патріотичних тем. Образ Мулань порівнюють із лідером Сун Цінлін, а заклики до боротьби проти варварів знайшли глибокий відгук у серцях китайців."
 legation_cities_events.154.a: "Припиніть цю пропаганду!"
 legation_cities_events.154.b: "Який чудовий фільм!"

 legation_cities_events.155.t: "Міста-концесії анулюють мандат"
 legation_cities_events.155.d: "Політиці «відкритих дверей», що підтримувала мир між західними країнами та Японією в Китаї, настав кінець. Через зростання напруги у світі міста-концесії приєдналися до фракції [LEC.GetFactionName], розірвавши традиційний нейтралітет. Міжнародний мандат припинив існування, іноземні війська виводяться. Це знаменує кінець епохи та робить міста вразливими для зовнішньої агресії."
 legation_cities_events.155.a: "Ось і все."

 legation_cities_green_gang_events.1.t: "Зіткнення «Зелених банд»!"
 legation_cities_green_gang_events.1.d: "Кримінальний світ Шанхая давно перебуває під контролем трьох таємничих постатей, які очолюють об'єднання «Зелена банда». На чолі цього союзу стоїть кримінальний авторитет Ду Юешень, відомий як «Вухатий Ду».\n\nЗалізна хватка Юешеня на торгівлі опіумом у Шанхаї давно відома, а зі створенням міст-концесій перед ним відкрився шлях до Гонконгу. Місцеві тріади чинили запеклий опір, що вилилося у збройне зіткнення в одному з будинків розваг Гонконгу. Повідомляють, що в бійці з мачете, ножами та пістолетами брали участь щонайменше п'ятдесят осіб. Це лише підкреслило проблему злочинності в містах."
 legation_cities_green_gang_events.1.a: "Як жахливо!"

 legation_cities_green_gang_events.2.t: "Вбивство серед білого дня!"
 legation_cities_green_gang_events.2.d: "Жахлива подія сталася в Шанхаї: члена однієї з останніх ворожих банд ліквідувала «Зелена банда». Він якраз виходив із поліцейської дільниці в німецькій (колишній французькій) концесії, коли група чоловіків у західних костюмах влаштувала засідку. Його тіло буквально пошматували сокирами. Попри наявність свідків, ніхто нічого «не бачив», адже поліція в той час була «надзвичайно зайнята»."
 legation_cities_green_gang_events.2.a: "Жахливо..."

 legation_cities_green_gang_events.3.t: "Розслідування діяльності «Зеленої банди»"
 legation_cities_green_gang_events.3.d: "Оскільки сутички між «Зеленою бандою» та гонконзькими тріадами стають дедалі зухвалішими, ситуацію більше неможливо ігнорувати. Створено комісію для призначення головного слідчого, який зможе централізувати інформацію та, сподіваємось, винищити злочинців."
 legation_cities_green_gang_events.3.a: "Призначити німецького слідчого."
 legation_cities_green_gang_events.3.b: "Покластися на гонконзькі сили."
 legation_cities_green_gang_events.3.c: "Звернутися до шанованого шефа поліції Шанхая Хуан Цзіньжуна!"

 legation_cities_green_gang_events.4.t: "Напрямок німецького розслідування"
 legation_cities_green_gang_events.4.d: "Начальник німецької поліції — дуже зайнята людина. У нього обмаль часу на розслідування «дрібних» злочинів, адже фондовий ринок коливається щодня! Йому потрібно обрати один конкретний напрямок для розслідування, інакше він нічого не досягне."
 legation_cities_green_gang_events.4.a: "Гонконг — зміїне кубло!"
 legation_cities_green_gang_events.4.b: "Шанхай — саме там усе почалося!"

 legation_cities_green_gang_events.5.t: "Облава на опіумне кубло!"
 legation_cities_green_gang_events.5.d: "Німецькі жандарми сьогодні увірвалися до опіумного кубла в Гонконгу. Окрім самих наркотиків, вони знайшли у сейфі фінансові документи щодо підприємств, які використовувалися для відмивання грошей. Тепер під підозру потрапили поважні банки."
 legation_cities_green_gang_events.5.a: "Цікаво..."

 legation_cities_green_gang_events.6.t: "Арешт гангстерів"
 legation_cities_green_gang_events.6.d: "Попри заперечення законодавчої ради Гонконгу, німецька поліція провела кілька ключових арештів. Схоже, це змусило злочинців діяти набагато стриманіше."
 legation_cities_green_gang_events.6.a: "Чудово!"

 legation_cities_green_gang_events.7.t: "Член «Зеленої банди» заговорив!"
 legation_cities_green_gang_events.7.d: "Під час інтенсивного допиту німецькою поліцією в Шанхаї затриманий член банди «розколовся». Він назвав імена, дати та місця великих операцій: від проституції та контрабанди до торгівлі зброєю. Усі нитки ведуть до однієї людини — Ду Юешеня."
 legation_cities_green_gang_events.7.a: "Чудово!"

 legation_cities_green_gang_events.8.t: "Член «Зеленої банди» заговорив!"
 legation_cities_green_gang_events.8.d: "Під час суворого допиту в Шанхаї член «Зеленої банди» розповів усе, що знає. Він детально описав притони, які працювали від імені Чжана Сяоліня, лідера банди та суперника Ду Юешеня. Деякі історії про нього звучать просто огидно..."
 legation_cities_green_gang_events.8.a: "Чудово!"

 legation_cities_green_gang_events.9.t: "Затримано члена тріад"
 legation_cities_green_gang_events.9.d: "Сьогодні поліція Гонконгу затримала члена тріади «Є Он Сон». На допиті він зізнався, що його банда переправляла зброю для різних груп, зокрема — як не дивно — для японського «спеціального агентства», що підтримує дисидентів у Китаї..."
 legation_cities_green_gang_events.9.a: "Інтригуюче..."

 legation_cities_green_gang_events.10.t: "Документи знайдено!"
 legation_cities_green_gang_events.10.d: "Поліція Гонконгу вилучила купу документів під час облави на бар, що слугував прикриттям для інтересів «Зеленої банди». Проте через бюрократичну плутанину вдалося зберегти лише один важливий фрагмент інформації..."
 legation_cities_green_gang_events.10.a: "Імена деяких агентів Цзюньтуна."
 legation_cities_green_gang_events.10.b: "Цікаві нотатки про пана Ду Юешеня."

 legation_cities_green_gang_events.11.t: "Розслідування провалилося!"
 legation_cities_green_gang_events.11.d: "Схоже, що після місяця розслідувань шанований шеф поліції Хуан Цзіньжун не зміг виявити достатньо доказів для висунення звинувачень проти будь-кого. Проте нещодавно він покатав члена ради на своєму новому «Роллс-Ройсі» разом із молодою дружиною — оперною співачкою, що молодша за нього на 20 років. Справді, вражаюче щедра людина."
 legation_cities_green_gang_events.11.a: "Щось із цим Хуаном Цзіньжуном не так..."
 legation_cities_green_gang_events.11.b: "Японці можуть щось знати, якщо їх підкупити."

 legation_cities_green_gang_events.12.t: "Обурені значним хабарем"
 legation_cities_green_gang_events.12.d: "Хоча японські агенти спочатку виявили надзвичайне обурення через грубу спробу підкупу в обмін на інформацію, згодом вони охоче поділилися даними, відкривши свої досьє на Ду Юешеня та розкривши кілька пікантних фактів про Хуан Цзіньжуна!"
 legation_cities_green_gang_events.12.a: "На кого ще в них є досьє?"

 legation_cities_green_gang_events.13.t: "Портрет гангстера: Ду Юешень"
 legation_cities_green_gang_events.13.d: "Продовжуючи розслідування щодо Ду Юешеня, ми маємо спершу вивчити його історію. Наші досьє повідомляють наступне:\n\nДу Юешень народився у бідному китайському селі (нині це територія нейтральної зони) в 1888 році. У віці чотирьох років він втратив матір та батька, а його сестру продали в рабство. У чотирнадцять років він повернувся до Шанхая, де працював у фруктовій лавці, поки його не звільнили за крадіжку. Робота вишибалою в борделі звела його з «Зеленою бандою». Там його представили Хуану Цзіньжуну — найвищому за рангом китайському детективу у французькій (нині німецькій) концесії. Дружина Цзіньжуна розгледіла в хлопцеві потенціал і доручила йому допомогу у великих опіумних угодах, що дозволило Ду розширити мережу контактів та накопичити багатство.\n\nУ 1924 році, коли Хуан Цзіньжун потрапив за ґрати за побиття сина місцевого мілітариста, Ду перебрав на себе управління кримінальними підприємствами німецької концесії. Хоча Цзіньжуна згодом випустили, Ду назавжди залишився найвпливовішим гангстером Шанхая.\n\nДу відомий під прізвиськом «Вухатий Ду». Він має товариську вдачу, щедрий до друзів, але безжальний до ворогів. Він очолює кілька законних підприємств (деякі з них навіть не є прикриттям для нелегальних справ), керує Асоціацією китайських платників податків та входить до правління Шанхайської торгової палати."
 legation_cities_green_gang_events.13.a: "Зрозуміло."

 legation_cities_green_gang_events.14.t: "Портрет гангстера: Хуан Цзіньжун"
 legation_cities_green_gang_events.14.d: "Продовжуючи розслідування щодо нашого поліцейського Хуана Цзіньжуна, ми виявили наступне:\n\nХуан Цзіньжун є невід'ємною частиною шанхайського підпілля з 1892 року, коли він у віці 24 років вступив до лав поліції французької концесії. Завдяки таланту детектива його залишили на службі, а згодом німці призначили його шефом поліції своєї нової концесії через брак компетентних кадрів. Він легко адаптувався до нової ролі; єдиним серйозним збоєм став його арешт за побиття сина Лу Юнсяна, що дозволило Ду Юешеню вийти на перший план. Відтоді Хуан перебуває в боргу перед Ду.\n\nЦзіньжун — терпляча людина. Здається, він воліє дозволяти молодшому Ду керувати справами, поки сам насолоджується багатством, яке приносить йому посада «другого пілота». Казали, що справжнім мозком його операцій була його колишня дружина Лінь Ґуйшен, проте після створення мандату Цзіньжун майстерно зробив свою групу домінуючою в усьому Шанхаї, тож за його спиною стоїть щось більше, ніж просто велика записна книжка."
 legation_cities_green_gang_events.14.a: "Зрозуміло."

 legation_cities_green_gang_events.15.t: "Портрет гангстера: Чжан Сяолінь"
 legation_cities_green_gang_events.15.d: "Наші файли щодо Чжана Сяоліня, «темної конячки» великої трійки «Зеленої банди», свідчать:\n\nЧжан Сяолінь народився в провінції Чжецзян і закінчив тамтешню військову академію. Він прибув до Шанхая у 1912 році, вже маючи зв'язки з провінційними мілітаристами. Працюючи під керівництвом Хуана Цзіньжуна, він використав армії воєначальників для встановлення контролю над торговими шляхами Янцзи та опіумним ринком міста.\n\nПопри його ключову роль, Хуан Цзіньжун та Лінь Ґуйшен обійшли його при виборі офіційного голови банди, віддавши перевагу Ду Юешеню. Чжан так і не зміг цього пробачити. Зараз між ним та Ду зріє розкол: Ду не довіряє Чжану через його жорстокість та огидні чутки про те, як він поводиться з тими, хто стає йому на шляху. Це лише питання часу, коли розкол стане офіційним і комусь із них доведеться піти..."
 legation_cities_green_gang_events.15.a: "Зрозуміло."

 legation_cities_business_events.1.t: "Інсайдерська торгівля?"
 legation_cities_business_events.1.d: "Після Чорного понеділка всі зализують фінансові рани. Всі, окрім групи бізнесменів (переважно американців), які зробили ставку на падіння державних облігацій Німеччини за кілька днів до краху. Вони, мовою вулиці, обібрали всіх як розбійники. Східнокитайський директорат здійняв галас, коли з'ясувалося, що найбільшим невдахою в цій угоді став державний Німецько-азійський банк (DAB). Німці вимагають розслідування звинувачень в інсайдерській торгівлі!"
 legation_cities_business_events.1.a: "Тільки тому, що у нас, американців, є здоровий глузд..."

 legation_cities_business_events.2.t: "Врятувати DAB?"
 legation_cities_business_events.2.d: "Найгостріше питання для бізнес-спільноти Шанхая — похитнуте становище Німецько-азійського банку. Якщо Рада концесій схвалить виділення коштів, це може запобігти напливу вкладників та заспокоїти ринок."
 legation_cities_business_events.2.a: "Скликайте засідання, ставимо на голосування!"

 legation_cities_business_events.3.t: "Голосування міст-концесій: порятунок банку?"
 legation_cities_business_events.3.d: "Чорний понеділок залишив глибокі шрами, особливо на Німецько-азійському банку в Шанхаї, який став жертвою недобросовісних методів і, можливо, інсайдерської торгівлі. Наша делегація просить вказівок щодо того, як голосувати за надання допомоги банку."

 legation_cities_business_events.4.t: "Результати голосування ради"
 legation_cities_business_events.4.d: "Проблеми DAB були детально розглянуті, і в результаті рішення про порятунок банку було..."
 legation_cities_business_events.4.a: "Схвалено!"
 legation_cities_business_events.4.b: "Відхилено!"

 legation_cities_business_events.5.t: "Крах Німецько-азійського банку!"
 legation_cities_business_events.5.d: "Сьогодні вранці масовий наплив вкладників до DAB став смертним вироком для установи, обтяженої знеціненими німецькими облігаціями. Банк починає процедуру банкрутства, а його активи розпродаються. Це викликало лють впливових німців через бездіяльність ради. Схоже, ніхто не отримає свої гроші назад найближчим часом..."
 legation_cities_business_events.5.a: "О, ні."

 legation_cities_business_events.6.t: "Стабілізація Німецько-азійського банку!"
 legation_cities_business_events.6.d: "Схоже, фінансовий оплот Німеччини на сході поки що втримається. Знайдено достатньо гарантій для захисту активів, що дещо втихомирило німецьке занепокоєння щодо інсайдерських махінацій."
 legation_cities_business_events.6.a: "Яке полегшення."

 legation_cities_business_events.7.t: "Німецька лють — голови мають полетіти!"
 legation_cities_business_events.7.d: "Після краху їхнього головного банку на Сході, німці надіслали гнівну телеграму Раді концесій: хтось має бути заарештований або депортований за це, інакше наслідків не уникнути!"
 legation_cities_business_events.7.a: "Нехай японці очолять розслідування!"
 legation_cities_business_events.7.b: "Нехай британці очолять розслідування!"
 legation_cities_business_events.7.c: "Нехай це зробить шанований шеф поліції Хуан Цзіньжун!"

 legation_cities_business_events.8.t: "Німецький гнів — хтось за цим стоїть!"
 legation_cities_business_events.8.d: "Німці, попри стабілізацію DAB, вимагають ретельного розслідування інсайдерської торгівлі. Це дуже серйозне звинувачення, і якщо з'ясується, що хтось попередив американських бізнесменів про німецьку монетарну політику, винним може загрожувати екстрадиція..."
 legation_cities_business_events.8.a: "Довірити розслідування японцям."
 legation_cities_business_events.8.b: "Нехай британці як фінансові експерти проведуть розслідування."
 legation_cities_business_events.8.c: "Нехай Хуан Цзіньжун візьме кермо у свої руки!"

 legation_cities_business_events.9.t: "Японці розслідують — ефективно"
 legation_cities_business_events.9.d: "Японське спеціальне агентство втрутилося у справу про інсайдерську торгівлю. Їхньою першою дією став раптовий рейд на штаб-квартиру DAB, де вони затримали кількох впливових німців, а потім і американців. Хоча німці обурені дискримінаційними діями японців, інші хвалять їх за рішучість. Доказів махінацій не знайдено, проте під тиском було отримано цінну інформацію про діяльність одного американського діяча..."
 legation_cities_business_events.9.a: "Цікаво, про що саме вони питали?"

 legation_cities_business_events.10.t: "Британці розслідують — ретельно"
 legation_cities_business_events.10.d: "Британці місяць вивчали справу DAB і повернулися зі звітом: жодних доказів протиправних дій американців не знайдено. Схоже, вони просто дуже проникливі бізнесмени."
 legation_cities_business_events.10.a: "Ви впевнені?"

 legation_cities_business_events.11.t: "Хуан Цзіньжун береться за справу!"
 legation_cities_business_events.11.d: "Здається, Хуан Цзіньжун зміг здійснити неможливе: за лічені дні він провів арешти серед німецьких бізнесменів, чим неабияк їх присоромив, та викрив канал передачі інформації американцям. Кілька трейдерів отримали пожиттєву заборону на торгівлю, а репутація німців як суворих законників сильно похитнулася."
 legation_cities_business_events.11.a: "Ура!"

 legation_cities_business_events.12.t: "HSBC купує акції Німецько-азійського банку"
 legation_cities_business_events.12.d: "Сьогодні Банківська корпорація Гонконгу та Шанхая (HSBC) несподівано викупила велику частку в DAB. Попри економічний спад, це дуже агресивний крок. Дехто переконаний, що це прямо пов'язано з нещодавнім розслідуванням гонконзької поліції."
 legation_cities_business_events.12.a: "Дивний маневр."

 legation_cities_business_events.13.t: "Японці ведуть розслідування"
 legation_cities_business_events.13.d: "Японське розслідування цього разу було нехарактерно стриманим, можливо, через відсутність німецького тиску. У будь-якому разі вони виявили цікаву інформацію, особливо щодо такого собі Лотара Айзентреґера..."
 legation_cities_business_events.13.a: "Ого."

 legation_cities_business_events.14.t: "Хуан Цзіньжун знову на коні!"
 legation_cities_business_events.14.d: "За кілька днів після початку розслідування Хуан Цзіньжун заарештував американського бізнесмена. Документи DAB вивчаються, але жодних доказів проти інших осіб не знайдено. До речі, ви вже бачили нову дружину пана Цзіньжуна? На ній найкращі коштовності."
 legation_cities_business_events.14.a: "Тут щось нечисто..."

 legation_cities_business_events.15.t: "Британське розслідування"
 legation_cities_business_events.15.d: "Після кількох тижнів роботи гонконзьких посадовців жодних порушень не виявлено. На жаль, часи складні, але принаймні рада показала себе як ефективний орган підтримки порядку."
 legation_cities_business_events.15.a: "Що ж."

 legation_cities_british_events.1.t: "Британське занепокоєння шанхай-центризмом"
 legation_cities_british_events.1.d: "Консорціум британських бізнесменів висловив протест проти наших планів будівництва трамваїв у Шанхаї, вимагаючи зрівняти інвестиції в Шанхай та Гонконг. Це зухвала вимога, але вони, ймовірно, готові до компромісу. Якщо ми їм не допоможемо, вони звернуться до британської корони, яка може почати активно втручатися в політику міст."
 legation_cities_british_events.1.a: "Виділити фінансування на інвестиції в Гонконг."
 legation_cities_british_events.1.b: "Ігнорувати вимоги, вони нічого не зможуть зробити."
 legation_cities_british_events.1.c: "Скасувати трамвайний проєкт, ми маємо зрівняти фінансування."

 legation_cities_british_events.2.t: "Протест японців"
 legation_cities_british_events.2.d: "Японці обурені тим, що ми піддалися тиску таких груп. Їхні газети рясніють звинуваченнями на адресу «американських маріонеток» у раді, які нібито розпихують гроші по кишенях. Це може мати серйозні наслідки."
 legation_cities_british_events.2.a: "Буря у склянці води."

 legation_cities_british_events.3.t: "Німці звинувачують раду у фаворитизмі"
 legation_cities_british_events.3.d: "Німецькі групи в містах-концесіях висловили невдоволення фаворитизмом щодо Гонконгу. Газета «Ціндао Нахріхтен» опублікувала кілька нищівних статей про корупцію в раді. Вони вимагають припинити фінансування проєктів поза Шанхаєм та Тяньцзінем."
 legation_cities_british_events.3.a: "Нам байдуже на них."
 legation_cities_british_events.3.b: "Добре, припиняємо фінансування!"

 legation_cities_british_events.4.t: "Британці обурені"
 legation_cities_british_events.4.d: "Британці лютують, а гонконзька преса знову скаржиться на несправедливість умов, нав'язаних їм після революції на батьківщині. Шанхай отримує всі привілеї, тоді як Гонконг втрачає свій особливий статус."
 legation_cities_british_events.4.a: "Жертви неминучі."

 legation_cities_british_events.5.t: "Американці заступаються за інвестиції в Гонконг"
 legation_cities_british_events.5.d: "Великі американські бізнесмени звернулися до ради, висловлюючи занепокоєння щодо відкритості міст. Вони наполягають на інвестиціях у Гонконг і попереджають, що притік американського капіталу може припинитися, якщо ми не підтримаємо інфраструктуру міста."
 legation_cities_british_events.5.a: "Нехай спробують!"
 legation_cities_british_events.5.b: "Якщо це дійсно найкраще для фінансів..."

 legation_cities_british_events.6.t: "Китайці готуються до боротьби"
 legation_cities_british_events.6.d: "Групи китайських громадян сьогодні подали офіційний протест до Шанхайської муніципальної ради та ключових органів мандату. Вони заявили, що розцінюють скасування трамвайних проєктів у Шанхаї як колоніальне нехтування та гноблення. Сотні людей підписали петицію з вимогою включити китайського представника до Ради концесій для забезпечення балансу та представництва більшості."
 legation_cities_british_events.6.a: "Це просто смішно."

 legation_cities_british_events.7.t: "Синдикалістські протести?"
 legation_cities_british_events.7.d: "Сьогоднішній вибух у поліцейській дільниці підкреслив, наскільки швидко може загостритися ситуація в Шанхаї. Протестувальники та повстанці, ховаючись у нейтральній зоні, ведуть тривалу кампанію непокори. Схоже, вони завжди знають про наступний крок поліції."
 legation_cities_british_events.7.a: "Спробуйте з'ясувати, хто їх інформує."

 legation_cities_british_events.8.t: "Вбивство посадовця"
 legation_cities_british_events.8.d: "Сьогодні було холоднокровно вбито великого чиновника та члена волонтерського корпусу. Очевидно, це було сплановане політичне вбивство! Триває розшук убивць."
 legation_cities_british_events.8.a: "Краще замкнути вікна..."

 legation_cities_british_events.9.t: "[QIE.GetName] протестує"
 legation_cities_british_events.9.d: "Уряд [QIE.GetAdjective] видав офіційну заяву щодо останніх подій у містах-концесіях. У ній стверджується, що якщо ми відповідальні за міста, то маємо бути відповідальними і перед китайським народом. [QIE.GetLeader] починає сумніватися, чи справді нинішня влада виконує свій обов'язок. Фактично він поставив під сумнів мандат ради."
 legation_cities_british_events.9.a: "Скажіть [QIE.GetLeader], що він може забрати наших китайських дисидентів собі."

 legation_cities_british_events.10.t: "Заворушення в Гонконгу"
 legation_cities_british_events.10.d: "Невдоволення мандатом у Гонконгу різко зросло після того, як рада відхилила прохання впливових місцевих бізнесменів про фінансування. Багато хто в місті з ностальгією згадує часи, коли Гонконг належав британській короні. Ми маємо скористатися цією можливістю."
 legation_cities_british_events.10.a: "І швидко!"
 legation_cities_british_events.10.b: "Нам не потрібні ці слизькі ділки!"

 legation_cities_british_events.11.t: "Британська активність у Гонконгу"
 legation_cities_british_events.11.d: "Після поразки у дебатах щодо фінансування британські бізнесмени звернулися до націй колишньої Британської імперії. Схоже, король-імператор охоче погодився їм допомогти, і тепер гонконзьці вдаються до небезпечних кроків проти нас."
 legation_cities_british_events.11.a: "Нам слід тримати руку на пульсі."

 legation_cities_british_events.12.t: "Заворушення в Гонконгу вщухли"
 legation_cities_british_events.12.d: "Схоже, що хвилювання в Гонконгу проти «шанхай-центризму» були придушені Шанхаєм. Рада пообіцяла зрівняти фінансування міст і навіть скасувала залізничний проєкт, який став причиною проблем. Цей інцидент, ймовірно, перекреслив будь-яку можливість для відновлення нашого впливу в Гонконгу."
 legation_cities_british_events.12.a: "Хай йому грець!"

 legation_cities_british_events.13.t: "Призначення нового губернатора Гонконгу"
 legation_cities_british_events.13.d: "Хоча Гонконг вислизнув з наших рук у 1925 році, коли ми попросили німецького захисту, юридично ми завжди володіли цією територією. Навіть під управлінням ради ми зберігали теоретичне право власності. \n\nНаше право призначати губернатора залишалося незмінним, хоча ми не робили цього понад десять років. Нинішній виконувач обов'язків адміністратора — Норман Локхарт Сміт. Він лояльний до корони, але має місцеві зв'язки, які можуть зробити його надто незалежним. Ми могли б висунути його кандидатом на посаду верховного комісара міст-концесій, а на його місце в Гонконгу призначити Марка Ейчісона Янга — більш лояльного службовця. Або ж призначити Янга нашим голосом у Шанхаї, залишивши Сміта на місці. Кого обрати?"
 legation_cities_british_events.13.a: "Сміт добре послужив нам у Гонконгу."
 legation_cities_british_events.13.b: "Сміт краще прислужиться нам у Шанхаї."

 legation_cities_british_events.14.t: "Канада призначає нового консула в Шанхаї"
 legation_cities_british_events.14.d: "Схоже, британці продовжують посилювати свій вплив. Вони зв'язалися з губернатором Гонконгу Смітом і призначили нового консула в Шанхаї — Марка Ейчісона Янга. Тепер він відповідає за всі британські концесії в Китаї поза Гонконгом. Очікується, що канадці незабаром перейдуть до рішучих дій. Однак Сміт — людина статус-кво, і він може багато втратити від змін. Ми могли б зупинити ці змови, якщо натиснемо на нього."
 legation_cities_british_events.14.a: "Це не варте коментарів."
 legation_cities_british_events.14.b: "Слід розслідувати ситуацію в Гонконгу та натиснути на адміністратора Сміта."

 legation_cities_british_events.15.t: "Британці призначають нового губернатора Гонконгу"
 legation_cities_british_events.15.d: "Британці призначили Марка Ейчісона Янга новим губернатором Гонконгу, а колишнього адміністратора Нормана Локхарта Сміта зробили своїм послом у Шанхаї. Ця посада залишалася вакантною з моменту виходу британців у 1926 році."
 legation_cities_british_events.15.a: "Тривожні кроки."

 legation_cities_british_events.16.t: "Розслідування щодо британців у Гонконгу"
 legation_cities_british_events.16.d: "Британська присутність у містах зростає, і призначення посла в Шанхаї непокоїть членів ради. Вони бояться, що британці спробують повернути собі місце в раді або навіть відновити пряме правління в Гонконгу. Чи варто відправити когось розслідувати зв'язки Сміта з короною?"
 legation_cities_british_events.16.a: "Попросити допомоги у Ду Юешеня."
 legation_cities_british_events.16.b: "Хуан Цзіньжун — здібна людина!"
 legation_cities_british_events.16.c: "Японцям можна довіряти."

 legation_cities_british_events.17.t: "Результати Ду Юешеня"
 legation_cities_british_events.17.d: "Люди Ду Юешеня провели кілька обшуків та допитів. Тріада впевнена, що вона на правильному шляху. Ду вважає, що гонконзьці намагаються повернутися під владу британської імперії, запросивши австралазійські або канадські війська. Він стверджує, що зможе дізнатися все, якщо йому дозволять «допитати» губернатора Сміта. Чи дозволимо ми це?"
 legation_cities_british_events.17.a: "Дій."
 legation_cities_british_events.17.b: "Це надто небезпечно."

 legation_cities_british_events.18.t: "Висновки Хуана Цзіньжуна"
 legation_cities_british_events.18.d: "Хуан Цзіньжун, схоже, найняв кількох відомих бізнесменів для розслідування. Він представив комісару докази, які нібито вказують на змову японських підприємців з метою повернути Британію до ради. Це виглядає підозріло, але Хуан якраз запросив вас на прогулянку містом, і ви б не хотіли псувати настрій..."
 legation_cities_british_events.18.a: "Ця людина — геній!"
 legation_cities_british_events.18.b: "Це очевидна брехня."

 legation_cities_british_events.19.t: "Японська комісія завершує роботу"
 legation_cities_british_events.19.d: "Японці знайшли цікаві докази того, що британська корона намагається повернути право голосу в раді. Наші слідчі вважають, що зустріч із губернатором Смітом допоможе з'ясувати всі деталі змови. Чи дозволимо ми японцям діяти?"
 legation_cities_british_events.19.a: "Відправити японців розібратися зі Смітом."
 legation_cities_british_events.19.b: "Вони просто переслідують власні інтереси."

 legation_cities_british_events.20.t: "Конфронтація з губернатором Смітом"
 legation_cities_british_events.20.d: "Наші агенти повернулися від губернатора Сміта з приголомшливими новинами: британці дійсно намагаються повернути Гонконг короні та відновити право голосу в раді. Це докорінно змінило б статус-кво, чого Сміт хотів би уникнути. Він запевнив слідчих, що готовий саботувати британські плани за умови виплати йому солідної суми."
 legation_cities_british_events.20.a: "Дякуємо за ваш час, пане."

 legation_cities_british_events.25.t: "Демократизація Австралазії"
 legation_cities_british_events.25.d: "Австралазійська конфедерація дванадцять років перебувала під авторитарною рукою генерал-губернатора Бірдвуда. Проте тепер корона дозволила провести нові вибори. Це додало британцям підтримки в містах-концесіях."
 legation_cities_british_events.25.a: "Стабільність корисна для бізнесу."

 legation_cities_british_events.26.t: "Австралазія потрапляє до рук радикалів"
 legation_cities_british_events.26.d: "Канберра організовувала британців у нашому регіоні з метою повернути Гонконг. Тепер, коли Австралазія охоплена радикалізмом і більше не може їх захистити, багато хто відмовився від ідеї повернення під крило корони."
 legation_cities_british_events.26.a: "Це має сповільнити їхній прогрес."

 legation_cities_british_events.27.t: "Королівський візит до Гонконгу"
 legation_cities_british_events.27.d: "Сьогодні до Гонконгу прибув корабель «Сассекс» із королівськими пасажирами — принцом Альбертом Віндзорським та його юною донькою, принцесою Єлизаветою. Комісар [LEC.GetLeader] та посли зустріли їх на пристані. Після коротких формальностей принц поспішив до готелю «Пенісула», пославшись на морську хворобу доньки. Очікується, що він проведе низку зустрічей із британськими посадовцями та бізнесменами. Зважаючи на нелюбов принца до публічності, ці візити навряд чи будуть афішуватися."
 legation_cities_british_events.27.a: "Ласкаво просимо до міст-концесій, ваша королівська високосте."

 legation_cities_british_events.28.t: "Наше місце в Раді концесій"
 legation_cities_british_events.28.d: "Наше членство в Раді концесій від імені Гонконгу тепер передано."
 legation_cities_british_events.28.a: "Хай буде так."

 legation_cities_british_events.29.t: "Гонконг та Рада концесій"
 legation_cities_british_events.29.d: "Гонконг — це британська частина [LEC.GetNameDef], і тепер на нас покладено обов'язок опікуватися колонією та її представництвом у раді."
 legation_cities_british_events.29.a: "Ми зробимо все, що зможемо."

 legation_cities_british_events.30.t: "Прибуття британських волонтерів"
 legation_cities_british_events.30.d: "Сьогодні тисяча волонтерів з усієї британської Азії прибула до Гонконгу. Багато з них були офіцерами в Австралазії, Індії та Малаї, тож вони отримали офіцерські чини і в місцевих силах оборони. Це призвело до сплеску британського патріотизму в місті."
 legation_cities_british_events.30.a: "Більше людей нам не завадить."

 legation_cities_british_events.31.t: "Повернення Гонконгу до імперії"
 legation_cities_british_events.31.d: "Зараз, коли в містах-концесіях панує розбрат, ми маємо шанс повернути Гонконг імперії. Проте дехто стверджує, що цей крок може ізолювати нас дипломатично, оскільки багато націй не визнають наш уряд легітимним. Чи маємо ми відправити флот?"
 legation_cities_british_events.31.a: "Гонконг повернеться додому!"
 legation_cities_british_events.31.b: "Це ізолює нас на міжнародній арені."

 legation_cities_british_events.32.t: "Британці розгортають війська в Гонконгу!"
 legation_cities_british_events.32.d: "Британці зібрали всі сили для операції з повторної окупації Гонконгу. Сьогодні флотилія Королівського флоту увійшла в гавань Вікторія, вимагаючи від губернатора зустрічі в готелі «Пенісула» для обговорення «відновлення порядку». Війська ще не висаджувалися, тож це ще не повноцінне вторгнення. Ситуація критична. Ми можемо відмовитися від переговорів і наказати губернатору триматися до прибуття підкріплень."
 legation_cities_british_events.32.a: "Принаймні виведіть волонтерський корпус."
 legation_cities_british_events.32.b: "Сподіваємося, наш тиск на Сміта принесе плоди..."

 legation_cities_british_events.33.t: "Гонконг повернуто!"
 legation_cities_british_events.33.d.peace: "Через п'ятнадцять років ми нарешті повернули «перлину Сходу»! Наші війська прибули до Цім-Ша-Цуй, де їх зустрів губернатор, що погодився на відновлення нашої влади. Ще одна частинка світу знову пофарбована в червоний!"
 legation_cities_british_events.33.d.war: "Через п'ятнадцять років ми повернули «перлину Сходу»! Наші війська висадилися в Цім-Ша-Цуй. На жаль, міста-концесії вирішили атакувати нас, аби повернути порт. Проте ми все одно святкуємо повернення Гонконгу до імперії!"
 legation_cities_british_events.33.a: "Боже, бережи короля!"

 legation_cities_british_events.34.t: "Кінець заворушень у Гонконгу"
 legation_cities_british_events.34.d: "Хоча протягом останніх кількох місяців у Гонконгу панував неспокій, поліція та залога повідомляють, що мешканці врешті прийняли повернення влади імперії. Дехто навіть записується на службу до Королівського флоту!"
 legation_cities_british_events.34.a: "Очевидно, у Гонконгу живуть розсудливі люди."

 legation_cities_british_events.35.t: "Успіх Сміта"
 legation_cities_british_events.35.d: "Губернатор Сміт успішно втихомирив британських лоялістів у своїй адміністрації. Вони повідомили британським представникам, надісланим для окупації міста, що не потребують їхніх послуг. Наша угода з губернатором Смітом принесла щедрі плоди."
 legation_cities_british_events.35.a: "Гідна людина."

 legation_cities_british_events.36.t: "Сміт зрадив нас!"
 legation_cities_british_events.36.d: "Схоже, губернатор Сміт забрав наші гроші та порушив обіцянки! Він із розпростертими обіймами прийняв повернення британської корони, а ми з нашими розрізненими силами нічого не можемо вдіяти."
 legation_cities_british_events.36.a: "Покидьок."

 legation_cities_british_events.37.t: "Губернатор Сміт зраджує нас"
 legation_cities_british_events.37.d: "Коли наші війська прибули до Гонконгу, їх зустрів губернатор Сміт, який приватно повідомив нашим офіцерам, що ні в якому разі не допустить повернення британців. Ходять чутки, що верховний комісар просто перекупив його лояльність."
 legation_cities_british_events.37.a: "Скасувати окупацію."

 legation_cities_british_events.40.t: "Британське право голосу в містах-концесіях"
 legation_cities_british_events.40.d: "Коли Раду концесій було створено у 1928 році, британцям надали лише статус спостерігачів, оскільки Німеччина та Японія відмовилися визнавати уряд в Оттаві як «відповідальний британський уряд». Тепер, коли ми накопичили значний вплив, ми можемо переконати раду в нашій правоті. Ми схилимо австрійського посла, як незацікавлену третю сторону, винести пропозицію про відновлення наших прав."
 legation_cities_british_events.40.a: "Запитаємо Шанхай про наші права."

 legation_cities_british_events.41.t: "Відновлення права голосу Британії"
 legation_cities_british_events.41.d: "У 1928 році Велика Британія мала б отримати місце в раді як держава з найбільшою кількістю концесій. Проте через позицію Німеччини та Японії британці залишилися спостерігачами. Тепер британське лобі тисне на нас, вимагаючи справедливості. Сьогодні австрійський посол порушив це питання. Ми маємо вибір: винести це на голосування або схвалити запит одноосібно."
 legation_cities_british_events.41.a: "Рада має проголосувати за це."
 legation_cities_british_events.41.b: "Проведемо це як процедурне питання."

 legation_cities_british_events.42.t: "Рада концесій голосує за відновлення права голосу Британії"
 legation_cities_british_events.42.d: "У 1928 році Сполучене Королівство отримало лише статус спостерігача через невизнання легітимності уряду в Оттаві Німеччиною та Японією. Однак зараз британський вплив у містах достатній, аби рада переглянула це рішення. Починається голосування..."

 legation_cities_british_events.43.t: "Рада концесій голосує за відновлення нашого права голосу"
 legation_cities_british_events.43.d: "Наш посол у Шанхаї повідомляє, що рада планує розглянути питання про повернення нам права голосу, якого нас позбавили у 1928 році. Посол вважає, що цього разу ми маємо високі шанси на успіх, попри попередню невдачу росіян."
 legation_cities_british_events.43.a: "Сподіваємося, він має рацію."

 legation_cities_british_events.44.t: "Результати голосування щодо прав Британії"
 legation_cities_british_events.44.d: "Рада концесій проголосувала щодо відновлення права голосу Британії. Результат..."
 legation_cities_british_events.44.a: "Успіх!"
 legation_cities_british_events.44.b: "Поразка."

 legation_cities_british_events.45.t: "Міста-концесії в односторонньому порядку повертають права Британії"
 legation_cities_british_events.45.d: "Сьогодні верховний комісар без жодного голосування прийняв пропозицію австрійського посла про відновлення повноцінного членства Британії в раді. Схоже, британський вплив став занадто вагомим, аби його ігнорувати. Британці знову в грі."
 legation_cities_british_events.45.a: "І з нами навіть не порадилися?"

 legation_cities_british_events.46.t: "Рада повертає нам право голосу"
 legation_cities_british_events.46.d: "Міста-концесії виникли лише через неспроможність Британії утримати свої володіння після розпаду імперії. Коли ми запросили німців до Гонконгу в 1925-му, ми не очікували такої втрати впливу. Нас навіть позбавили права голосу в раді. Але сьогодні помилку виправлено: наш посол у Шанхаї офіційно отримав право голосу. Ми знову маємо слово в Китаї."
 legation_cities_british_events.46.a: "Тричі слава імперії!"

 legation_cities_british_events.47.t: "Рада проголосувала проти наших прав"
 legation_cities_british_events.47.d: "Рада відхилила пропозицію австрійського посла. Нам доведеться чекати на кращу нагоду. Багато хто радить облишити спроби з радою і зосередитися на силовому поверненні Гонконгу."
 legation_cities_british_events.47.a: "Будьте ви прокляті!"

 legation_cities_british_events.50.t: "Міста-концесії просять про захист"
 legation_cities_british_events.50.d: "Попри мережу міжнародних гарантій, міста-концесії відчувають загрозу. Вони звернулися до британської корони з проханням про захист, обіцяючи стати надійним оплотом нашого альянсу на Далекому Сході. У парламенті, однак, побоюються, що це зробить нас мішенню для японців."
 legation_cities_british_events.50.a: "Ласкаво просимо до Антанти."
 legation_cities_british_events.50.b: "Це занадто ризиковано."

 legation_cities_british_events.51.t: "[ENT.GetNameDefCap] погоджується"
 legation_cities_british_events.51.d: "Британська корона прийняла нашу пропозицію про союз. Вони вже відправляють офіцерів та частину Королівського флоту нам на допомогу."
 legation_cities_british_events.51.a: "Чудово!"

 legation_cities_british_events.52.t: "[ENT.GetNameDefCap] відмовляє"
 legation_cities_british_events.52.d: "Британці відмовилися від тісніших зв'язків. Нам доведеться і надалі покладатися на хиткі міжнародні гарантії."
 legation_cities_british_events.52.a: "Шкода."

 legation_cities_british_events.53.t: "Британські війська в Гонконгу"
 legation_cities_british_events.53.d: "Поки триває наша війна з мандатом, [FROM.GetAdjective] скористалися шансом повернути колишню колонію. Морська піхота вже зайняла райони Ваньчай та Норт-Пойнт і готується до кидка на Коулун. Адміністрація Центрального округу визнала владу корони. Це послабило наших ворогів у Шанхаї, але означає, що цей порт не дістанеться нам."
 legation_cities_british_events.53.a: "Прокляті підступні британці!"

 legation_cities_british_events.54.t: "Марк Ейчісон Янг призначений послом у Шанхаї"
 legation_cities_british_events.54.d: "Характерна риса британської імперії — перекидати адміністраторів з одного кінця світу в інший. Сьогодні губернатор Барбадосу Марк Ейчісон Янг отримав нове призначення: він стане послом у Раді концесій та повноважним міністром у Шанхаї."
 legation_cities_british_events.54.a: "Успіхів у Китаї, пане Янг."

 legation_cities_british_events.55.t: "Марк Ейчісон Янг призначений губернатором Гонконгу"
 legation_cities_british_events.55.d: "Сьогодні Марк Ейчісон Янг був призначений новим губернатором Гонконгу, замінивши Нормана Сміта, який відтепер обійме посаду посла в Шанхаї."
 legation_cities_british_events.55.a: "Прощавайте, пане Янг."

 legation_cities_japanese_feud_events.1.t: "Гангстерська сутичка в Тяньцзіні"
 legation_cities_japanese_feud_events.1.d: "Галасливі вулиці Тяньцзіня переважно залишалися осторонь хаосу в Китаї. Але сьогодні мешканці відчули смак війни на власному порозі. Це не було звичайне пограбування: чотири групи чоловіків у костюмах влаштували перестрілку на людному перехресті біля дипломатичного кварталу. Використовуючи паніку, вони зникли в натовпі. Двоє вбитих на місці не дали жодних зачіпок поліції щодо мотивів чи організаторів. Хоча це ганьба для департаменту, шеф наказав посилити патрулювання. На щастя, випадкові перехожі не постраждали."
 legation_cities_japanese_feud_events.1.a: "Спіймати цих пройдисвітів!"

 legation_cities_japanese_feud_events.2.t: "Ескалація відомчих суперечок"
 legation_cities_japanese_feud_events.2.d: "Лише за кілька днів Тяньцзінь знову здригнувся від пострілів, цього разу прямо в дипломатичному кварталі. Поліція встигла втрутитися до того, як ситуація стала трагічною. Те, що вони з'ясували, приголомшує. Під час допиту один із затриманих найманців «розколовся»: вони діяли від імені японського посольства. Але все набагато складніше. Одна група працювала на військово-морського аташе, інша — на колоніальне відомство, а третя — на міністерство закордонних справ Японії. Ми знали про тертя між японськими відомствами, але вони ще ніколи не доходили до такої публічної ворожнечі."
 legation_cities_japanese_feud_events.2.a: "Втрутитися!"
 legation_cities_japanese_feud_events.2.b: "Нехай саме вщухне."

 legation_cities_japanese_feud_events.3.t: "Як втрутитися?"
 legation_cities_japanese_feud_events.3.d: "Офіцери поліції розділилися на два табори. Одні вимагають офіційного втручання через публічні канали, наполягаючи на дотриманні правил. Інші вважають, що справу треба владнати непублічно, адже тиск лише змусить японські фракції діяти ще впертіше. Зрештою, було прийнято рішення..."
 legation_cities_japanese_feud_events.3.a: "Спробувати офіційне посередництво."
 legation_cities_japanese_feud_events.3.b: "Вирішити справу за лаштунками."

 legation_cities_japanese_feud_events.4.t: "Японія ігнорує наше розслідування"
 legation_cities_japanese_feud_events.4.d: "Доволі розчаровуючим та принизливим виявилося те, що наші спроби офіційно втрутитися через державні канали були повністю проігноровані японцями, які навідріз відмовилися співпрацювати. Результатом стали лише напружені відносини між таборами, чим ніхто не задоволений. Схоже, продовження такого підходу не дасть жодних результатів.\n\nПісля цього фіаско більшість готова неохоче закрити питання. Проте невелика, але гучна група наполягає: якщо японці так наполегливо щось приховують, то на це є вагома причина, і закликає до таємного розслідування."
 legation_cities_japanese_feud_events.4.a: "Закрити справу."
 legation_cities_japanese_feud_events.4.b: "Провести таємне розслідування."

 legation_cities_japanese_feud_events.5.t: "Найм слідчого"
 legation_cities_japanese_feud_events.5.d: "Оскільки ми вирішили розслідувати справу, потрібно обрати того, хто виконає цю роботу. Нам не можна припуститися чергової помилки. Перший варіант — найняти Хуана Цзіньжуна, китайського детектива зі зв'язками у підпіллі, який вже працював із радою. Відсутність у нього політичних упереджень щодо японців робить його очевидним вибором, проте його зв'язки з криміналом можуть виявитися палицею про два кінці.\n\nЗ огляду на це дехто пропонує звернутися до американських або німецьких слідчих бюро. Вони мають бездоганну репутацію та діють професійно, проте їхня спеціалізація — це економічні злочини, тож вони можуть бути менш ефективними у справах тріад. Також слід враховувати можливу політичну заангажованість. У нас є лише один шанс дійти до істини."
 legation_cities_japanese_feud_events.5.a: "Хуан Цзіньжун дійде до суті!"
 legation_cities_japanese_feud_events.5.b: "Найняти найкращого американського детектива в Шанхаї!"
 legation_cities_japanese_feud_events.5.c: "Німці принаймні ретельні. Найміть їх!"

 legation_cities_japanese_feud_events.6.t: "Розслідування зайшло в глухий кут"
 legation_cities_japanese_feud_events.6.d: "На наше велике розчарування, Хуан Цзіньжун поки що не знайшов жодних зачіпок. Після тривалого мовчання він повідомив, що натрапляє лише на тупики. Він наполягає, що слід охолов, ймовірно, через велику увагу після останньої перестрілки та прилюдного приниження японців нашим тиском. Хоча успішне завершення справи виглядає малоймовірним, це принаймні означає, що подальшої ескалації не буде. Тим не менш, розслідування триває."
 legation_cities_japanese_feud_events.6.a: "Тут щось виглядає підозріло..."

 legation_cities_japanese_feud_events.7.t: "Хуан Цзіньжун викликає підозри"
 legation_cities_japanese_feud_events.7.d: "Невдовзі після звіту Хуана комісар поліції Тяньцзіня забив на сполох: «рябий» Хуан Цзіньжун сам може бути причетний до справи через зв'язки з «Зеленою бандою». Підозри виникли, коли він почав навмисно опускати деталі, про які поліція Тяньцзіня вже знала. Тепер слідство розвернулося проти самого слідчого.\n\nХоча все пішло не за планом, ми принаймні знайшли злочинця і почали згортати діяльність тріад, пов'язаних із цією справою. Розслідування спрямувало гнів влади проти китайських кримінальних інтересів, що змусило японців тимчасово припинити вуличні розбірки."
 legation_cities_japanese_feud_events.7.a: "В наші дні просто неможливо знайти хороших помічників."

 legation_cities_japanese_feud_events.8.t: "Розкрито фінансові злочини"
 legation_cities_japanese_feud_events.8.d: "Американське розслідування швидко дало результати. Зосередившись на фінансових транзакціях та економічних інтересах японських фракцій, бюро заявляє про близький прорив. Очевидно, бізнес-структури, пов'язані з японцями, не дуже ретельно замітали сліди."
 legation_cities_japanese_feud_events.8.a: "Нарешті хороші новини!"

 legation_cities_japanese_feud_events.9.t: "Лотар Айзентреґер причетний до справи"
 legation_cities_japanese_feud_events.9.d: "Несподівано розслідування виявило те, чого ми не очікували. Лотар Айзентреґер, важлива німецька постать у мандаті, виявився причетним до справи. Він мав зв'язки з японським бізнесом, що фінансував конфлікти. Тепер правоохоронці взялися за нього та його незаконну фінансову діяльність. Як бонус — тиск на бізнес-зв'язки змусив японські фракції вирішувати свої суперечки за лаштунками, а не на вулицях."
 legation_cities_japanese_feud_events.9.a: "Ось і кінець цій історії!"

 legation_cities_japanese_feud_events.10.t: "Розслідування китайських ринків"
 legation_cities_japanese_feud_events.10.d: "Німецьке бюро, яке ми найняли, зосередилося на фінансових злочинах на ширших китайських ринках, вважаючи, що саме там найлегше знайти сліди сумнівних операцій. Їхні оцінки виявилися вірними, і зараз вони опрацьовують численні зачіпки. Результати мають бути вже скоро."
 legation_cities_japanese_feud_events.10.a: "Краще, ніж нічого."

 legation_cities_japanese_feud_events.11.t: "Викрито зв'язки з Чжецзяном"
 legation_cities_japanese_feud_events.11.d: "Німецьке розслідування вивело нас за межі міст-концесій до провінцій Чжецзян та Фуцзянь, вотчини гоміньданівських бандитів. Схоже, японці фінансували банди, що були проксі-силами Гоміньдану, аби ті усували конкурентів всередині самої японської структури. За рекомендацією слідчих ми посилили заходи безпеки в Шаньтоу та Нінбо, після чого японська активність затихла."
 legation_cities_japanese_feud_events.11.a: "Німці знову звинуватили соціалістів, яка несподіванка..."

 legation_cities_japanese_feud_events.12.t: "Неофіційне посередництво"
 legation_cities_japanese_feud_events.12.d: "Стриманість іноді є кращим варіантом, навіть якщо вона не зовсім відповідає протоколу. Тепер ми маємо обрати посередника. Хоча Китайське агентство підконтрольне японському консульству, воно є очевидним вибором для прямого зв'язку. Проте дехто стверджує, що так ми будемо грати за японськими правилами. Інший варіант — використати тріади. Через них ми зможемо чинити прямий тиск на японців, адже вони покладалися на кримінал у своїх внутрішніх чварах."
 legation_cities_japanese_feud_events.12.a: "Діяти через Китайське агентство."
 legation_cities_japanese_feud_events.12.b: "Використати тріади як посередників."

 legation_cities_japanese_feud_events.13.t: "Контакт із тріадами"
 legation_cities_japanese_feud_events.13.d: "Зв'язок із тріадами не позбавлений ризиків. На основі інформації від поліції ми маємо дві кандидатури: Ду Юешень або Чжан Сяолінь. Ду стоїть нижче в ієрархії і контролює шанхайські квартали червоних ліхтарів; подейкують, частина найманців підкоряється йому. Чжан, з іншого боку, є найбільшим кримінальним босом мандату. Все, що пов'язане з японцями, ймовірно, проходило через його руки."
 legation_cities_japanese_feud_events.13.a: "Звернутися до Ду Юешеня, він причетний до цього."
 legation_cities_japanese_feud_events.13.b: "Всі карти у Чжана Сяоліня, зв'яжіться з ним."

 legation_cities_japanese_feud_events.14.t: "Тріади зраджують нас!"
 legation_cities_japanese_feud_events.14.d: "Спроба домовитися з тріадами обернулася катастрофою! Вони здали нас японцям і тепер шантажують. Сказати, що це обмежує нашу свободу дій — це нічого не сказати..."
 legation_cities_japanese_feud_events.14.a: "Скільки вони хочуть за мовчання?!"

 legation_cities_japanese_feud_events.15.t: "Ескалація насильства"
 legation_cities_japanese_feud_events.15.d: "Ми сподівалися, що насильство вщухне, але наша бездіяльність дозволила сторонам продовжувати боротьбу. Вчора стався черговий інцидент, а сьогодні спалили резиденцію співробітника японського колоніального відомства. Поліція Тяньцзіня вимагає додаткових ресурсів, аби впоратися з хвилею насильства."
 legation_cities_japanese_feud_events.15.a: "Надіслати додаткові сили поліції з Шанхая!"

 legation_cities_japanese_feud_events.16.t: "Банди як інструмент війни"
 legation_cities_japanese_feud_events.16.d: "Стає очевидним, що японські військові фракції наймають тріади для боротьби одна з одною. Сутички сягнули апогею. Прибуття поліції з інших міст лише трохи заспокоїло ситуацію. Проте слідчі вважають, що справжня причина спаду насильства в тому, що одна з фракцій близька до перемоги."
 legation_cities_japanese_feud_events.16.a: "Хто ж це буде?"

 legation_cities_japanese_feud_events.17.t: "Темні справи Чжана Сяоліня"
 legation_cities_japanese_feud_events.17.d: "Останніми днями бої в містах-концесіях затихли. З десятками загиблих та численними арештами боротьба за владу між японськими фракціями завершилася. Хто став переможцем, з’ясується найближчими тижнями. Важливо інше: тепер, коли внутрішні перепони зникли, японці почнуть діяти набагато активніше."
 legation_cities_japanese_feud_events.17.a: "Йому слід було зупинитися раніше..."

 legation_cities_japanese_feud_events.18.t: "Японці діють рішучіше"
 legation_cities_japanese_feud_events.18.d: "Міжусобні бої в мандаті припинилися. Боротьба японських відомств завершена перемогою одного з них. Тепер, позбувшись внутрішніх обмежень, Японія готова до активних кроків у регіоні."
 legation_cities_japanese_feud_events.18.a: "Це, мабуть, погано для нас."

 legation_cities_japanese_feud_events.19.t: "Японці владнали свої розбіжності"
 legation_cities_japanese_feud_events.19.d: "Через Китайське агентство ми допомогли японцям вирішити їхні відомчі суперечки. Не секрет, що армія, флот і МЗС мали серйозні розбіжності, але через складні переговори конфлікт вдалося владнати. Хоча дехто незадоволений тим, що японський вплив тепер зростатиме без внутрішніх гальм, більшість просто рада, що трагедії вдалося уникнути."
 legation_cities_japanese_feud_events.19.a: "Відсутність боїв — це добре для всіх, чи не так?"

 legation_cities_american_events.2.t: "Г'юї Лонга обрано президентом США"
 legation_cities_american_events.2.d: "Майбутнє міст-концесій сильно залежить від американської сили. Після обрання Г'юї Лонга тридцять другим президентом США довіра до мандату впала. Ізоляціоніст Лонг навряд чи залучатиме військову міць для захисту концесій від майбутніх загроз."
 legation_cities_american_events.2.a: "Сподіваємося, вона нам не знадобиться."

 legation_cities_american_events.3.t: "Флойда Олсона обрано президентом США"
 legation_cities_american_events.3.d: "Вибори 1936 року принесли дивний результат: перемогу прогресиста Флойда Олсона від коаліції національної єдності. Республіканці та демократи об'єдналися, аби зупинити радикальну загрозу. Оскільки Олсон зосереджений на внутрішній стабільності, інвестори вірять, що США залишаться стабілізуючою силою на роки вперед."
 legation_cities_american_events.3.a: "Краще б вони не помилялися..."

 legation_cities_american_events.4.t: "Джона Ненса Гарнера обрано президентом США"
 legation_cities_american_events.4.d: "Обрання демократа Джона Ненса Гарнера президентом США підняло довіру до міст-концесій. Консервативний техасець, імовірно, підтримуватиме мандат як необхідний інструмент забезпечення миру на Далекому Сході."
 legation_cities_american_events.4.a: "Наші перспективи виглядають добре."

 legation_cities_american_events.5.t: "Альфа Лендона обрано президентом США"
 legation_cities_american_events.5.d: "З перемогою республіканця Альфа Лендона довіра до міст-концесій злетіла. Пробізнесовий Лендон вбачає в мандаті ключову ланку американської дипломатії та комерції в Азії."
 legation_cities_american_events.5.a: "Людина за моїм серцем!"

 legation_cities_american_events.7.t: "Дії президента Лонга дестабілізують міста"
 legation_cities_american_events.7.d: "Новообраний президент Лонг розпочав масштабні реформи для радикальної трансформації Америки. Верховний суд уже блокує багато його указів, але це його не зупиняє. Ці кроки непокоять фінансистів у містах-концесіях."
 legation_cities_american_events.7.a: "Зберігаймо спокій"

 legation_cities_american_events.8.t: "Генерал Макартур бере владу в США"
 legation_cities_american_events.8.d: "Шокуючі новини з США: начальник штабу генерал Дуглас Макартур перебрав повний контроль над урядом у відповідь на «неналежні дії» президента. Це підірвало віру в Америку в Шанхаї. Дехто навіть робить ставки на те, що в США скоро почнеться громадянська війна."
 legation_cities_american_events.8.a: "Це не закінчиться добром."

 legation_cities_american_events.9.t: "Громадянські заворушення в США"
 legation_cities_american_events.9.both: "Схоже, новий президент [USA.GetLeader] не зміг втихомирити політичний хаос. Соціалісти та прихильники Лонга повстали на півночі та півдні відповідно. Президент запевняє світ, що демократія жива, але впевненості мало."
 legation_cities_american_events.9.long: "Президент [USA.GetLeader] приборкав соціалістів на півночі, але це розлютило правих радикалів. Г'юї Лонг підняв повстання на півдні, заявляючи про намір відновити «справжні американські цінності». Довіра до Америки сильно похитнулася."
 legation_cities_american_events.9.reed: "Президент приборкав рух Лонга на півдні, але це викликало бунт лівих профспілок на півночі. Багато хто в Шанхаї передбачав такий кривавий поворот подій."
 legation_cities_american_events.9.a: "Скоро ми можемо залишитися на самоті."

 legation_cities_american_events.10.t: "Масові заворушення в США призводять до неспокою в містах"
 legation_cities_american_events.10.d: "Захоплення влади Макартуром спровокувало кризу. Лонг та соціалісти повстали проти нього. Багато демократів втекли на захід під прапори [ACC.GetNameDef]. Жителі міст-концесій втратили будь-яку надію на допомогу з боку Америки, і довіра до підконтрольної США ради впала ще нижче."
 legation_cities_american_events.10.a: "Прокляті радикали!"

 legation_cities_american_events.11.t: "Початок Другої американської громадянської війни"
 legation_cities_american_events.11.d: "Як багато хто і очікував, Сполучені Штати знову поринули у громадянську війну. Це створило вакуум влади на Далекому Сході. Оскільки Америка була головним прихильником статус-кво, природа міст-концесій неминуче зміниться. Рада має вирішити, як бути з американським правом голосу і яку Америку визнавати. Це початок тривожних часів для мандату."
 legation_cities_american_events.11.a: "Ми зробимо все можливе, що б не сталося."

 legation_cities_american_events.12.t: "Офіційна реакція на американську громадянську війну"
 legation_cities_american_events.12.d: "Оскільки Америка більше не здатна захищати свої концесії, і ми навіть не знаємо, хто представляє справжню Америку, постає питання про зміну юридичного статусу американців у містах-концесіях."
 legation_cities_american_events.12.a: "Голосування не потрібне, з Америкою все буде добре."
 legation_cities_american_events.12.b: "Нам слід розглянути можливість зміни їхнього статусу."

 legation_cities_american_events.13.t: "Політичне майбутнє міст-концесій"
 legation_cities_american_events.13.d: "Єдиною зміною керівництва за коротку історію Ради концесій була заміна Стірлінга Фессендена його наступником Нельсоном Джонсоном. Тоді, у період розквіту міст у 1932 році, ніхто не сумнівався у необхідності американської присутності. Але тепер, коли в США вирує громадянська війна, американські морпіхи покидають Шанхай, а Китай охоплений хаосом, усе змінилося.\n\nПісля застосування статті 14 верховний комісар Джонсон вирішив тимчасово піти у відставку, аби гарантувати чесне голосування. Рада одноголосно обрала Ервіна фон Цаха, делегата від Австро-Угорщини, тимчасовим головою, і почалися політичні ігри. Німецька та японська делегації, отримуючи постійні вказівки від своїх урядів захопити посаду, наполягали, що ані США, ані їхні опоненти не здатні захистити інтереси консульських держав, і лише їхня нація може зберегти мир.\n\nПан Джонсон виглядав вкрай виснаженим. Голосом Америки в залі став Патрік Герлі, нинішній заступник комісара. Він стверджував, що США вийдуть із війни ще сильнішими і обов'язково прийдуть Шанхаю на допомогу. Ця думка викликала майже загальне глузування, а Петро Тідеманн, представник Росії, пробурмотів сусідові, що «американці назавжди списані з рахунків в Азії».\n\nРаптом британський посол піднявся для промови. Він красномовно говорив про американський конфлікт, змусивши Джонсона вперше за сесію втомлено посміхнутися. Виконувач обов'язків адміністратора Сміт також вправно відбив критику японців та німців. Хто краще підійде на роль голови ради, запитав він, ніж член без права голосу? Це викликало тихе занепокоєння німецької та японської делегацій. Після вечері посол фон Цах оголосив початок голосування. Зрештою, рада вирішила, що..."
 legation_cities_american_events.13.a: "Американці все ще здатні керувати!"
 legation_cities_american_events.13.b: "Японці — заради кращої Азії!"
 legation_cities_american_events.13.c: "Тільки німці можуть гарантувати стабільність!"
 legation_cities_american_events.13.e: "Британці — природні наступники американців."

 legation_cities_american_events.14.t: "Американці зберігають домінування в Раді концесій"
 legation_cities_american_events.14.d: "Після початку Другої американської громадянської війни міста-концесії опинилися у вакуумі влади. Рада мала обрати нового верховного комісара, і вибір пав на чинного американського голову, [LEC.GetLeader]. Це сигналізує про відданість політиці «відкритих дверей», проте залишається невідомим, як далеко зайдуть міста заради збереження нейтралітету."
 legation_cities_american_events.14.a: "Відповідальний уряд вистояв, принаймні в Шанхаї."
 legation_cities_american_events.14.b: "Цікаво."

 legation_cities_american_events.15.t: "Японський посол стає верховним комісаром у Шанхаї"
 legation_cities_american_events.15.d: "Унаслідок вакууму влади після початку війни в США Рада концесій обрала своїм лідером представника Японії. Відтепер міста-концесії, можливо назавжди, відірвані від ідеї прозахідних «відкритих дверей», і невідомо, чи залишаться вони бодай номінально нейтральними."
 legation_cities_american_events.15.a: "Азія для азіатів!"

 legation_cities_american_events.16.t: "Німецький кандидат стає новим верховним комісаром"
 legation_cities_american_events.16.d: "Рада обрала німецького посла Боденгаймера новим верховним комісаром мандату. Це, ймовірно, означає антияпонський курс міст та можливе зближення з чжилійською клікою."
 legation_cities_american_events.16.a: "Надзвичайно вчасно."

 legation_cities_american_events.17.t: "Британці домінують у Раді концесій"
 legation_cities_american_events.17.d: "Рада обрала несподіваного кандидата — британського посла [LEC.GetLeader]. Важко передбачити дії британців, але більшість очікує, що вони звернуться за захистом до британської корони."
 legation_cities_american_events.17.a: "Гідна людина, цей [LEC.GetLeader]."

 legation_cities_american_events.18.t: "Посол Боденгаймер застосовує статтю 14"
 legation_cities_american_events.18.d: "Оскільки після початку війни в США верховний комісар не вжив жодних заходів, німецький посол застосував статтю 14 договору про концесії. Вона передбачає зміну керівництва, якщо нація комісара нездатна підтримувати мандат. Ми планували зробити це самі, але німці нас випередили."
 legation_cities_american_events.18.a: "Звідки він дізнався про наші плани?"

 legation_cities_american_events.19.t: "Японська делегація застосовує статтю 14"
 legation_cities_american_events.19.d: "Японська делегація в Шанхаї застосувала статтю 14 договору, закликаючи до зміни верховного комісара через нездатність США підтримувати мандат. Брак нашого політичного капіталу дозволив японцям обійти нас."
 legation_cities_american_events.19.a: "Як вони дізналися про наші наміри?"

 legation_cities_american_events.20.t: "Визнання американського уряду"
 legation_cities_american_events.20.d: "Поки США занурюються в анархію, їхній статус у містах під питанням. Визнання однієї з фракцій викличе міжнародний осуд. Наразі ми маємо приймати представників усіх воюючих урядів і чекати, поки в кривавій братовбивчій війні не з'явиться справжній переможець."
 legation_cities_american_events.20.a: "Просте рішення."

 legation_cities_american_events.21.t: "Міста-концесії надають нам статус спостерігача"
 legation_cities_american_events.21.d: "Міста-концесії вирішили надати представникам усіх сторін американської громадянської війни доступ до зали ради лише як спостерігачам. Як і Британія з Росією, ми тепер фактично усунуті від прийняття рішень."
 legation_cities_american_events.21.a: "У цих шанхайців немає хребта!"

 legation_cities_american_events.23.t: "[FROM.GetName] вимагає відновлення права голосу"
 legation_cities_american_events.23.d: "Американський представник вимагає повернути право голосу, оскільки їхні концесії не були конфісковані. Відмова новому об'єднаному уряду США може бути нерозумною, проте, можливо, варто обмежити їхній вплив у Китаї."
 legation_cities_american_events.23.a: "Рада має проголосувати."
 legation_cities_american_events.23.b: "Верховний комісар прийме рішення особисто."
 legation_cities_american_events.23.c: "Америка більше ніколи не буде головною на Сході!"

 legation_cities_american_events.24.t: "Рада концесій голосує за відновлення прав Америки"
 legation_cities_american_events.24.d: "Тепер, коли Америка знову єдина, вона прагне повернути свій світовий вплив і подала запит до ради. Чи варто нам добровільно обмежувати власну владу, повертаючи американцям голос?"

 legation_cities_american_events.25.t: "Рада концесій голосує за відновлення нашого права голосу"
 legation_cities_american_events.25.d: "Рада погодилася розглянути наш запит, і представники великих держав уже почали запеклі дебати з цього приводу."
 legation_cities_american_events.25.a: "Звучить багатообіцяюче."

 legation_cities_american_events.26.t: "Результати голосування щодо прав Америки"
 legation_cities_american_events.26.d: "Результати голосування оголошено. Схоже, пропозиція..."
 legation_cities_american_events.26.a: "Пройшла!"
 legation_cities_american_events.26.b: "Провалилася."

 legation_cities_american_events.27.t: "Рада голосує за відновлення наших прав"
 legation_cities_american_events.27.d: "Держави в раді прислухалися до розуму і повернули нам право голосу. Тепер ми знову можемо впливати на справи Далекого Сходу."
 legation_cities_american_events.27.a: "Чудово!"

 legation_cities_american_events.28.t: "Рада голосує проти відновлення наших прав"
 legation_cities_american_events.28.d: "Рада вирішила не повертати нам право голосу, вважаючи нас неспроможними захистити власні концесії в Китаї. Схоже, ми назавжди залишимося лише спостерігачами."
 legation_cities_american_events.28.a: "Прокляття."

 legation_cities_american_events.29.t: "Рада концесій повертає Америці право голосу"
 legation_cities_american_events.29.d: "У відповідь на американське звернення верховний комісар одноосібно повернув їм право голосу без скликання загального голосування. Америка повертається на політичну арену Азії."
 legation_cities_american_events.29.a: "Ми мали брати участь у цьому рішенні!"

 legation_cities_american_events.30.t: "Рада концесій відновлює наше право голосу"
 legation_cities_american_events.30.d: "Верховний комісар задовольнив наш запит без консультацій з іншими державами. Хоча це розлютило деякі великі держави, поінформовані мешканці святкують."
 legation_cities_american_events.30.a: "Дивовижно!"

 legation_cities_american_events.31.t: "Рада концесій відмовляє у відновленні прав Америки"
 legation_cities_american_events.31.d: "Верховний комісар одноосібно відхилив петицію американців. Він натякнув, що вони надто нестабільні для повернення до великої політики. Статус-кво збережено."
 legation_cities_american_events.31.a: "Порядок понад усе."

 legation_cities_american_events.32.t: "Рада відмовляє у відновленні наших прав"
 legation_cities_american_events.32.d: "Комісар у Шанхаї відхилив наш запит, навіть не порадившись із членами ради. Це обурливо!"
 legation_cities_american_events.32.a: "Ми безсилі в Китаї."

 legation_cities_american_events.33.t: "Посол Джонсон подає у відставку"
 legation_cities_american_events.33.d: "Через війну в США Рада концесій втратила підтримку Вашингтона. Посол Нельсон Джонсон запропонував піти у відставку, аби відновити престиж Америки. Він вважає, що його заступник Патрік Герлі краще впорається з ситуацією, хоча Герлі може стати перешкодою для майбутнього об'єднання міст із Китаєм."
 legation_cities_american_events.33.a: "Замінити Джонсона, він уже відслужив своє."
 legation_cities_american_events.33.b: "Він усе ще може бути корисним."

 legation_cities_american_events.34.t: "Посла Джонсона замінено"
 legation_cities_american_events.34.d: "Уряд США замінив Нельсона Джонсона на Патріка Герлі, який тривалий час був заступником комісара. Схоже, вони вірять, що це зміцнить віру в Америку на Далекому Сході."
 legation_cities_american_events.34.a: "Успіхів, пане Герлі."

 legation_cities_american_events.35.t: "[FROM.GetAdjective] уряд підтверджує повноваження Джонсона"
 legation_cities_american_events.35.d: "Президент [Root.GetLeader] відхилив відставку Нельсона Джонсона. В уряді вважають, що його присутність діє стабілізуюче і він більш схильний до політичних компромісів, ніж Герлі."
 legation_cities_american_events.35.a: "Він впорається."

 legation_cities_american_events.40.t: "Сполучені Штати надсилають війська до Шанхая"
 legation_cities_american_events.40.d: "Через нестабільність після краху Ліги восьми провінцій американці надіслали підкріплення до волонтерських сил у Шанхаї та посилили власний полк морської піхоти. Це підняло популярність США у містах."
 legation_cities_american_events.40.a: "Виглядає як вигідна угода."

 legation_cities_american_events.41.t: "Морська піхота США покидає Шанхай"
 legation_cities_american_events.41.d: "Через початок громадянської війни уряд США відкликав 4-й полк морської піхоти, відомий як «китайські морпіхи». Хоча це шкодить американським інтересам, внутрішні проблеми стали пріоритетними. Чарльз Прайс провів свої війська через Шанхай урочистим парадом, після чого вони зійшли на борт корабля «Президент Гаррісон». Коли останні судна зникли за горизонтом, вулиці повернулися до звичного життя."
 legation_cities_american_events.41.a: "Сподіваюся, вони нам не знадобляться."

 legation_cities_japanese_events.1.t: "Напади в Тяньцзіні"
 legation_cities_japanese_events.1.d: "Через негативні наслідки Чорного понеділка, що призвели до падіння рівня життя місцевих китайців у мандаті, почали формуватися натовпи, які шукають винних у цих негараздах. У Тяньцзіні були побиті, пограбовані, а в деяких випадках і вбиті японські буддисти. Японці розлючені і запропонували надіслати власну залогу для підтримки порядку в місті та запобігання подальшим нападам. Однак це вкрай непопулярно серед інших членів ради. Хоча дозвіл Японії втрутитися зняв би тягар із наших власних обмежених ресурсів, це могло б дати їм додатковий вплив у раді."
 legation_cities_japanese_events.1.a: "Прийняти, ми все одно не впораємося самі."
 legation_cities_japanese_events.1.b: "Відмовити — це наш обов'язок підтримувати безпеку в містах, а не Японії."

 legation_cities_japanese_events.2.t: "Операції в Тяньцзіні закріплені"
 legation_cities_japanese_events.2.d: "Наші війська нарешті встановили повний контроль над нашою концесією в Тяньцзіні, що дає нам потужну базу для консолідації військових операцій у Китаї. Хоча цього недостатньо для проходу до Фентяня, військове верховне командування вже вивчає варіанти дестабілізації міста, аби дати нашим військам законні підстави для повномасштабної окупації."
 legation_cities_japanese_events.2.a: "Все за планом..."
 legation_cities_japanese_events.2.b: "Це зайшло занадто далеко, скасувати подальші плани!"

 legation_cities_japanese_events.3.t: "Теракт у Тяньцзіні!"
 legation_cities_japanese_events.3.d: "Жахливі новини дійшли до Шанхая! У старому місті Тяньцзіня щойно пролунав вибух! Десятки невинних людей загинули, ще більше поранено; пожежні та медичні служби поспішають на допомогу вцілілим. Поліція вже розпочала розслідування і вказала пальцем на місцевих китайців, запевняючи, що це лише черговий акт антиконцесіоністського руху. Самі китайці розлючені тим, що їх звинувачують, і стверджують, що з тіні діють темні сили."
 legation_cities_japanese_events.3.a: "Що ж, це було швидке розслідування."

 legation_cities_japanese_events.4.t: "Заворушення в Тяньцзіні!"
 legation_cities_japanese_events.4.d: "Після теракту в Тяньцзіні японські сили проявили велике завзяття у придушенні антиконцесіоністських сил, часто перевершуючи офіційних слідчих у жорстокості, що розлютило і без того обурене населення. Напруга нарешті досягла критичної точки: місто охопили масові заворушення. Японська делегація в Шанхаї попередила, що оскільки ситуація продовжує виходити з-під контролю, імперія не матиме іншого вибору, окрім як вжити «превентивних заходів» там, де ми не справляємося. Тим часом влада Тяньцзіня почала діяти самостійно, обіцяючи певну подобу реформ. Хоча значна частина ради готова закрити на це очі, інші, особливо Японія, закликали накласти вето, стверджуючи, що це прямо суперечить мандату ради."
 legation_cities_japanese_events.4.a: "Накласти вето, ми не хочемо гнівати раду."
 legation_cities_japanese_events.4.b: "Звести реформи до мінімуму..."

 legation_cities_japanese_events.5.t: "Теракт у Тяньцзіні зірвано!"
 legation_cities_japanese_events.5.d: "Рано-вранці вибуховий пристрій не спрацював належним чином, і тяньцзіньська поліція змогла знешкодити його до того, як бомба завдала реальної шкоди. Розшук терориста вже розпочався, хоча доказів мало. Хуана Цзіньжуна закликали розслідувати спробу вибуху, проте німецька делегація запропонувала власну слідчу групу, посилаючись на сумнівні методи Хуана."
 legation_cities_japanese_events.5.a: "Нехай розслідують німці."
 legation_cities_japanese_events.5.b: "Дозволити Цзіньжуну діяти."

 legation_cities_japanese_events.6.t: "Виявлено вантаж зброї!"
 legation_cities_japanese_events.6.d: "Під час рутинної митної перевірки судна, що пришвартувалося в Шанхаї, було виявлено величезний сховок зброї. Весь екіпаж заарештовано, судно офіційно конфісковано. Ведеться офіційне розслідування."
 legation_cities_japanese_events.6.a: "У Шанхаї ніколи не буває нудно!"

 legation_cities_japanese_events.7.t: "Японські рушниці на російському кораблі"
 legation_cities_japanese_events.7.d: "Слідство зібрало всі докази. Саме судно російське, зареєстроване на судноплавну компанію у Владивостоці, але рушниці японські — переважно застарілі «Арісаки». Екіпаж не дав корисних зачіпок, тож доведеться шукати джерело: або перевіряти компанію у Владивостоці, або просити японців про допомогу."
 legation_cities_japanese_events.7.a: "Перевірити судноплавну компанію."
 legation_cities_japanese_events.7.b: "Звернутися до японців за допомогою."

 legation_cities_japanese_events.8.t: "Спекотний день у Владивостоці"
 legation_cities_japanese_events.8.d: "Наші агенти в російському порту Владивосток вийшли на цікавий слід. Згідно з маніфестами судноплавної компанії, зброя продавалася «Китайському агентству», а Японія використовувала російський маршрут, щоб відвести підозри та «відмити» поставки. Тепер ми можемо почати офіційне розслідування діяльності «Китайського агентства» в мандаті."
 legation_cities_japanese_events.8.a: "Щось дивне затівається..."

 legation_cities_japanese_events.9.t: "Розслідування зайшло в глухий кут"
 legation_cities_japanese_events.9.d: "Японці зовсім не співпрацюють із нашими детективами, або навідріз відмовляючись допомагати, або даючи розмиті чи безглузді відповіді. Схоже, від них допомоги не буде, тож доведеться шукати інші шляхи... «Зелена банда» — очевидний вибір, якщо їхні лідери ще не за ґратами."
 legation_cities_japanese_events.9.a: "Хлопці із «Зеленої банди» не здаються такими вже поганими..."

 legation_cities_japanese_events.10.t: "Японські інтриги в Китаї"
 legation_cities_japanese_events.10.d: "Офіційне розслідування «Китайського агентства» нарешті дійшло до суті цих поставок зброї. Схоже, японці озброюють лояльних колабораціоністів, готуючись до повномасштабного вторгнення та окупації Китаю. Тепер, коли таємне стало явним, нам доведеться обрати сторону: або запропонувати японцям угоду, або спробувати придушити їхню контрабанду."
 legation_cities_japanese_events.10.a: "Укладемо з ними угоду."
 legation_cities_japanese_events.10.b: "Почати придушення."

 legation_cities_japanese_events.11.t: "Пропозиція угоди"
 legation_cities_japanese_events.11.d: "У брудній задній кімнаті однієї з шанхайських вуличок представники «Китайського агентства» зустрілися з делегатами Ради концесій. Агентство знає, що ми на їхньому сліду, тож настав час тиснути. Ми можемо закрити очі на їхні прогріхи за умови, що вони..."
 legation_cities_japanese_events.11.a: "... нададуть нам послуги у майбутньому."
 legation_cities_japanese_events.11.b: "... віддадуть нам усе, що мають на Ду Юешеня."

 legation_cities_japanese_events.12.t: "Початок придушення"
 legation_cities_japanese_events.12.d: "Маючи повні докази порушень «Китайського агентства», настав час нагадати японцям, що мандат — не просто пішак у їхній грі за Китай. Хуан Цзіньжун — очевидний кандидат для керівництва облавами, але його кримінальні зв'язки можуть скомпрометувати статус ради. Торгова палата пропонує себе як більш «моральнy» альтернативу, але багато комісарів сумніваються в їхніх здібностях."
 legation_cities_japanese_events.12.a: "Хуан Цзіньжун очолить операцію."
 legation_cities_japanese_events.12.b: "Торгова палата — більш прийнятний вибір."

 legation_cities_japanese_events.13.t: "Придушення вдалося!"
 legation_cities_japanese_events.13.d: "Чудові новини! Операція проти «Китайського агентства» пройшла надзвичайно успішно, попри спроби японців перешкоджати нам. Організація знешкоджена, а її діяльність обмежена лише легальними сферами. Ми прибрали одну з найбільших скалок у нашому боці. Хоча японці лютують, зараз вони нічого не можуть вдіяти."
 legation_cities_japanese_events.13.a: "Стабільність повертається до Шанхая!"

 legation_cities_japanese_events.14.t: "Придушення провалилося!"
 legation_cities_japanese_events.14.d: "Жахливі новини! Операція проти «Китайського агентства» пішла шкереберть. Організація змогла сховатися в глибокому підпіллі міста та замаскувати свої незаконні операції. У короткостроковій перспективі це мало на що вплине, але згодом Японія зможе перегрупуватися та посилити свою активність."
 legation_cities_japanese_events.14.a: "Що ж, це недобре..."

 legation_cities_japanese_events.15.t: "Допомога від «Зеленої банди»"
 legation_cities_japanese_events.15.d: "Шкода, що доводиться просити допомоги у звичайних гангстерів, але оскільки японці не захотіли співпрацювати, ми звернулися до нетрадиційних методів. В обмін на певні поступки «Зелена банда» погодилася провести розслідування і дійшла висновку, що японці через «Китайське агентство» переправляють зброю своїм контактам у глибині Китаю, використовуючи міста-концесії як пункт контрабанди. Хоча ці докази хиткі, ми використаємо їх як привід для більш... офіційного розслідування."
 legation_cities_japanese_events.15.a: "Це може виявитися дуже цікавим..."

 legation_cities_japanese_events.18.t: "Шанхай каже «так»!"
 legation_cities_japanese_events.18.d: "Чудові новини з Шанхая: мандат погодився дати нам «зелене світло» на подальші операції в Тяньцзіні. Схоже, їхні економічні негаразди стали занадто важкими для самостійної підтримки безпеки. Це нам на руку: тепер ми можемо розмістити більше військ у Тяньцзіні, готуючи ґрунт для остаточного захоплення."
 legation_cities_japanese_events.18.a: "Доміно починає падати..."

 legation_cities_japanese_events.19.t: "Японські війська в Тяньцзіні"
 legation_cities_japanese_events.19.d: "Схоже, економічна криза боляче вдарила по містах-концесіях, і вони вирішили передати більшість операцій із забезпечення безпеки японцям, аби втримати економіку на плаву. Хоча ми мало що можемо зробити, у раді здійнявся галас через зміну балансу сил та заклики до Японії не зловживати своїм становищем."
 legation_cities_japanese_events.19.a: "Щонайменше, це тривожно."

 legation_cities_japanese_events.20.t: "Шанхай відмовляє!"
 legation_cities_japanese_events.20.d: "Жахливі новини з Шанхая! Міжнародна рада відмовилася дати нам дозвіл на подальше розширення військових операцій. Це сильний удар по наших планах щодо Тяньцзіня. Тепер доведеться чекати, поки «Китайське агентство» організує нові напади, перш ніж ми знову висунемо свої вимоги."
 legation_cities_japanese_events.20.a: "Прокляття!"

 legation_cities_japanese_events.21.t: "Теракт у Тяньцзіні!"
 legation_cities_japanese_events.21.d: "Сьогодні в портовому місті Тяньцзінь вибухнув пристрій, убивши десятки цивільних. Поліція стверджує, що це справа рук антиконцесіоністів, але китайці впевнені, що діють «темні сили». Дехто пов'язує це з нашим нещодавнім втручанням у справи міста. Військові, звісно, заперечують будь-яку причетність."
 legation_cities_japanese_events.21.a: "Це не ми!"

 legation_cities_japanese_events.22.t: "Японія вимагає розміщення залоги"
 legation_cities_japanese_events.22.d: "Члени японської делегації звернулися до мандату з проханням дозволити початок операцій безпеки в Тяньцзіні. Стверджуючи, що місцева поліція нездатна стримати хвилю нападів, вони вважають, що лише їхні власні війська можуть гарантувати безпеку громадян."
 legation_cities_japanese_events.22.a: "Вони мають рацію..."
 legation_cities_japanese_events.22.b: "Ким вони нас вважають — Японськими містами?"

 legation_cities_japanese_events.23.t: "Хуан Цзіньжун повертається"
 legation_cities_japanese_events.23.d: "Хуан Цзіньжун прийшов із чудовою звісткою: бомбіста спіймано. Це звичайний місцевий волоцюга, але під час допиту він зізнався, що замовником був не він, а бунтівний японський офіцер. Хоча японці віддали офіцера під трибунал і намагаються дистанціюватися, цей інцидент став для них політичною ганьбою."
 legation_cities_japanese_events.23.a: "Ура!"

 legation_cities_japanese_events.24.t: "Повернення німців"
 legation_cities_japanese_events.24.d: "Німецьке розслідування не принесло результатів. Спіймали лише кількох звичних дрібних злочинців, жоден з яких не мав розуму для планування такого нападу. Їх відпустили, зачіпок немає. Німці визнали, що їхні «джерела» підвели, і обіцяють виправитися наступного разу."
 legation_cities_japanese_events.24.a: "Прокляття!"

 legation_cities_japanese_events.25.t: "Вторгнення в Тяньцзінь?"
 legation_cities_japanese_events.25.d: "Рада концесій збанкрутувала, що поклало край міжнародному мандату. Поки Шанхай занурюється у хаос, віддалені міста залишилися незахищеними. У Тяньцзіні бунтівники переважно придушені, поліція повертає контроль за допомогою наших військ та тріад. Часу обмаль: Пекін скоро дізнається про новини і точно спробує захопити місто. У нас є єдина можливість закріпити Тяньцзінь за собою до того, як вони мобілізуються — чи скористаємося ми нею?"
 legation_cities_japanese_events.25.a: "Відправити війська!"
 legation_cities_japanese_events.25.b: "Нехай Китай забирає його."

 legation_cities_japanese_events.26.t: "Японське вторгнення в Тяньцзінь"
 legation_cities_japanese_events.26.d.default: "Японія вдерлася в Тяньцзінь за повної підтримки свого флоту. Вони стверджують, що лише допомагають нам захистити місто від невідомих бандитів, але цей крок явно агресивний і виходить за межі звичних дій Японії в мандаті."
 legation_cities_japanese_events.26.d.bankrupt: "Японія вдерлася в Тяньцзінь. Через нещодавнє банкрутство в містах-концесіях панує хаос, і ми нічого не могли вдіяти, щоб уникнути цього результату."
 legation_cities_japanese_events.26.a: "Ми не можемо сподіватися на опір."
 legation_cities_japanese_events.26.b: "Жахливо!"

 legation_cities_japanese_events.27.t: "Тяньцзінь успішно захоплено"
 legation_cities_japanese_events.27.d.peace: "Тяньцзінь у наших руках! Наші війська легко увійшли до другого міста мандату і вже займають його."
 legation_cities_japanese_events.27.d.war: "Несподівано міста-концесії відповіли на наше вторгнення вороже. Хоча ми окупували Тяньцзінь, тепер ми перебуваємо у стані війни з мандатом."
 legation_cities_japanese_events.27.a: "Все за планом."

 legation_cities_japanese_events.28.t: "Управління Тяньцзінем"
 legation_cities_japanese_events.28.d: "Хоча ми визнали суверенітет мандату в Тяньцзіні, фактично ми можемо робити з містом що завгодно. Дехто пропонує передати його нашим союзникам у Фентяні, аби прискорити їхню війну з центральним урядом, інші ж хочуть залишити місто собі."
 legation_cities_japanese_events.28.a: "Поки що залишимо його собі."
 legation_cities_japanese_events.28.b: "Передати законному китайському уряду."

 legation_cities_japanese_events.29.t: "Японія передає нам Тяньцзінь"
 legation_cities_japanese_events.29.d: "Японці нещодавно окупували Тяньцзінь і вирішували його долю. На щастя для нас, вони постановили повернути управління містом законному китайському уряду. Наші війська вже увійшли в місто. Це великий день для всіх китайців!"
 legation_cities_japanese_events.29.a: "Ще один крок до возз'єднання Китаю!"

 legation_cities_japanese_events.30.t: "Окупація Тяньцзіня"
 legation_cities_japanese_events.30.d: "Прояпонські сили захопили контроль над Радою концесій і тепер поширюють свій вплив. Рада не лише визнала нас, а й запросила наші війська до Тяньцзіня для «захисту міста» від загрози нелегітимного китайського уряду. Хоча ми фактично керуємо більшою частиною міста, прибутки Тяньцзіня все ще йдуть до Шанхая."
 legation_cities_japanese_events.30.a: "Все одно, це колосальний успіх!"
 legation_cities_japanese_events.30.b: "У такому разі воно того не варте."

 legation_cities_japanese_events.31.t: "[FNG.GetNameDefCap] окупує Тяньцзінь"
 legation_cities_japanese_events.31.d: "Фентянський уряд за допомогою японців та Ради концесій окупував Тяньцзінь, відкривши ще один фронт для своїх військ у майбутній війні. Це ще більше згуртувало наш народ для вигнання імперських поплічників, але поки що ми мало що можемо вдіяти."
 legation_cities_japanese_events.31.a: "Жахливо!"

 legation_cities_japanese_events.32.t: "Склади зброї в містах-концесіях"
 legation_cities_japanese_events.32.d: "Наші друзі в Шанхаї запропонували хитрий план: ми забезпечимо наших агентів зброєю, а коли почнеться війна, вони таємно переправлять її нашим військам. Це значно полегшить постачання."
 legation_cities_japanese_events.32.a: "Звучить як гарний план."

 legation_cities_japanese_events.33.t: "Міста-концесії постачають наші війська"
 legation_cities_japanese_events.33.d: "Прояпонська, але формально нейтральна рада в Шанхаї отримала таємне завдання від наших союзників: передавати нашим наземним силам зброю через нейтральні зони. Вони саме це і зробили."
 legation_cities_japanese_events.33.a: "Гарні новини."

 legation_cities_japanese_events.34.t: "Фентянь погоджується"
 legation_cities_japanese_events.34.d: "[FNG.GetNameDefCap] прийняв нашу пропозицію вільного проходу через Тяньцзінь, погодившись на нашу вимогу продовжувати віддавати прибутки від промисловості мандату та захисні тарифи."
 legation_cities_japanese_events.34.a: "Співпраця вигідна всім."

 legation_cities_japanese_events.35.t: "Фентянь відмовляє"
 legation_cities_japanese_events.35.d: "[FNG.GetNameDefCap] відхилив пропозицію вільного проходу, не бажаючи приймати наші умови щодо прибутків міста. Тяньцзінь поки що залишається частиною занепадаючого мандату."
 legation_cities_japanese_events.35.a: "Ми все одно зможемо послужити імперії краще за них."

 legation_cities_japanese_events.36.t: "Переворот [FNG.GetNameDefCap] у Тяньцзіні"
 legation_cities_japanese_events.36.d: "Після майже двох років окупації фентянський уряд більше не вважає за потрібне дотримуватися умов нашої угоди. Вони припинили всі відправки до Шанхая і встановили власні тарифи на товари в Тяньцзіні."
 legation_cities_japanese_events.36.a: "Як прикро."

 legation_cities_japanese_events.37.t: "Контрабанда зброї в Шанхай"
 legation_cities_japanese_events.37.d: "Японські «Арісаки» знайшли шлях до Шанхая і вже роздаються прояпонським колабораціоністам у мандаті та далеко за його межами. Звісно, офіційно тут нічого не відбувається..."
 legation_cities_japanese_events.37.a: "Зброя приходить і йде щодня. Не варто стежити за кожним стволом."

 legation_cities_fuzhou_events.1.t: "Діяльність тріад у Фучжоу"
 legation_cities_fuzhou_events.1.d: "Один із лідерів «Зеленої банди» Чжан Сяолінь почав відкривати крамниці та придушувати місцеву злочинність у Фучжоу. Це чи не перша його спроба самостійної операції за межами Шанхая. Який наказ він віддасть своїм людям?"
 legation_cities_fuzhou_events.1.a: "Люди Сяоліня смертоносні."
 legation_cities_fuzhou_events.1.b: "Люди Сяоліня розширюють організацію тріад."
 legation_cities_fuzhou_events.1.c: "Сяолінь любить прибуток, хоч би звідки він брався."

 legation_cities_fuzhou_events.2.t: "Бійка в доках"
 legation_cities_fuzhou_events.2.d: "У порту Фучжоу під час контрабандної операції спалахнуло насильство між людьми Сяоліня та місцевою бандою, яка намагалася стримати його вплив. Бойовики Сяоліня відкрили вогонь, убивши кількох людей. Хоча вони на крок наблизилися до контролю над верфями, їхня репутація постраждала."
 legation_cities_fuzhou_events.2.a: "Знову стрілянина, чудово."

 legation_cities_fuzhou_events.3.t: "Місцеве виробництво героїну"
 legation_cities_fuzhou_events.3.d: "Чжан Сяолінь організував виробництво героїну безпосередньо у Фучжоу. Тепер йому не потрібно везти товар із Шанхая, що робить його операції значно безпечнішими."
 legation_cities_fuzhou_events.3.a: "Слід притиснути імпорт із Шанхая."
 legation_cities_fuzhou_events.3.b: "Треба зосередитися на припиненні місцевої переробки."

 legation_cities_fuzhou_events.4.t: "У місті відкривається новий храм"
 legation_cities_fuzhou_events.4.d: "Чжан Сяолінь, впливовий член «Зеленої банди», люб'язно став спонсором нового храму у Фучжоу. Проте з'явилися повідомлення, що цей храм використовується більше для контрабанди наркотиків, ніж для релігійних обрядів."
 legation_cities_fuzhou_events.4.a: "Яке марнотратство нерухомості."

 legation_cities_fuzhou_events.5.t: "«Зелена банда» бере під контроль судноплавство"
 legation_cities_fuzhou_events.5.d: "«Зелена банда» захопила більшу частину судноплавства у Фучжоу, особливо контрабанду наркотиків. Їм нарешті вдалося витіснити дрібніші місцеві тріади, які раніше були скалкою в оці Чжана Сяоліня, нападаючи на його вантажі."
 legation_cities_fuzhou_events.5.a: "Краще б вони не чіпали легальні перевезення!"

 legation_cities_fuzhou_events.6.t: "Поширення наркотиків"
 legation_cities_fuzhou_events.6.d: "Наркотики стають дедалі поширенішими у Фучжоу, а поліція не в змозі зупинити їхній обіг. Найпопулярнішими залишаються опіум та героїн. Багато нових видів наркотиків виробляються прямо у Фучжоу, хоча Шанхай залишається головним центром їх створення."
 legation_cities_fuzhou_events.6.a: "Де поліція, коли вона так потрібна?"

 legation_cities_fuzhou_events.7.t: "Нова база влади Чжана Сяоліня"
 legation_cities_fuzhou_events.7.d: "Чжан Сяолінь зробив Фучжоу своєю новою базою для контрабандних операцій, що дало йому та «Зеленій банді» значну перевагу над місцевими тріадами. Він уже використовує цей плацдарм для розширення мережі в інших частинах Китаю. В уряді точаться суперечки: дехто бачить у ньому корисного союзника, інші ж вважають, що його суперник Ду Юешень був би ціннішим партнером. Дехто пропонує просто винищити його банду у Фучжоу, поки він не підірвав мир остаточно."
 legation_cities_fuzhou_events.7.a: "Звернутися до Ду Юешеня."
 legation_cities_fuzhou_events.7.b: "Спробувати викорінити його банду."
 legation_cities_fuzhou_events.7.c: "Працювати з Сяолінем."

 legation_cities_hotung_events.1.t: "Дивні справи у Товаристві Вермільйон"
 legation_cities_hotung_events.1.d: "Товариство Вермільйон — це об'єднання різних клубів, неформальних груп та таємних організацій, що складаються з багатих і впливових людей мандату, переважно китайського або змішаного походження. Націоналістичні погляди товариства — секрет Полішинеля. Нещодавно аудитори виявили численні порушення у фінансуванні товариства, і сліди ведуть до Гонконгу. Поки неясно, чи це звичайне ухилення від податків, чи масштабна змова, ми маємо провести розслідування."
 legation_cities_hotung_events.1.a: "Побачимо, куди це приведе..."
 legation_cities_hotung_events.1.b: "О, я нічого не знаю про ухилення від податків."

 legation_cities_hotung_events.2.t: "Зв'язок із Хотуном"
 legation_cities_hotung_events.2.d: "Наше розслідування принесло плоди: паперовий слід веде до сера Роберта Хотуна з Гонконгу. Хотун — один із найбагатших і найшанованіших бізнесменів мандату, який значно посилив свій вплив після часткового витіснення британців. Він — відомий китайський націоналіст, проте, іронічно, є одним із найбільших прихильників міст-концесій, не бачачи суперечності між патріотизмом та безпекою, яку надають міста. Схоже, старий зневірився у ситуації в Китаї і почав відчайдушно фінансувати націоналістичні організації: від Гоміньдану до фентянського уряду та федералістів. Хоча фінансування цих груп не є незаконним, ухилення від податків — так, і це дає нам шанс перекрити грошові потоки ворогам мандату."
 legation_cities_hotung_events.2.a: "Сер Роберт напевно зрозуміє."

 legation_cities_hotung_events.3.t: "Потрібно поставити кілька запитань"
 legation_cities_hotung_events.3.d: "Початкове розслідування зв'язків сера Роберта з Гоміньданом пройшло не надто вдало. Слідчі виявили лише дрібних поплічників, які нічого не знають про внутрішню кухню. Ба більше, Гоміньдан, схоже, помітив стеження і пішов у тінь. Нам потрібна допомога. Оперативники Китайського агентства надзвичайно ефективні, але можуть переслідувати власні цілі. З іншого боку, Ду Юешень відомий своїми симпатіями до Гоміньдану і міг би вивести нас на їхні осередки в обмін на послугу..."
 legation_cities_hotung_events.3.a: "Що ж, вони майстри своєї справи."
 legation_cities_hotung_events.3.b: "Кращий з найгірших варіантів, я гадаю..."

 legation_cities_hotung_events.4.t: "Японці беруться за справу!"
 legation_cities_hotung_events.4.d: "Після тривалих переговорів ми досягли згоди з японцями. В обмін на передачу розслідування Китайському агентству ми закриємо очі на деякі їхні... незаконні операції. Можливо, це не зовсім етично, зате дозволить нам дешево розкрити цю таємницю."
 legation_cities_hotung_events.4.a: "Все заради спільного блага, чи не так?"

 legation_cities_hotung_events.5.t: "Осередок Гоміньдану в Шанхаї"
 legation_cities_hotung_events.5.d: "Японці надали цікаві результати: вони викрили осередок Гоміньдану, що діяв прямо в Шанхаї. Ми завжди це підозрювали, але нарешті отримали підтвердження та дані про їхні методи. Хоча більшості агентів вдалося втекти, це все одно обнадійливі новини."
 legation_cities_hotung_events.5.a: "Тільки б усе не зіпсувати."

 legation_cities_hotung_events.6.t: "Співпраця Ду Юешеня"
 legation_cities_hotung_events.6.d: "Хоча симпатії Ду Юешеня до Гоміньдану були секретом Полішинеля, завдяки допомозі Китайського агентства ми нарешті змогли довести його причетність до постачання зброї та підробки документів. Це удар і по Гоміньдану, і по операціях самого Ду."
 legation_cities_hotung_events.6.a: "Зашморг затягується..."

 legation_cities_hotung_events.7.t: "Гоміньдан розгромлено!"
 legation_cities_hotung_events.7.d: "Чудові новини! Наші союзники не підвели: нам вдалося перекрити фінансову артерію Гоміньдану в містах. Це завдало важкого удару по Товариству Вермільйон та зупинило підривну діяльність у самому серці мандату."
 legation_cities_hotung_events.7.a: "Ура!"

 legation_cities_hotung_events.8.t: "Глухий кут"
 legation_cities_hotung_events.8.d: "Схоже, Китайське агентство виявилося не таким винахідливим, як ми сподівалися. Під час операції в Шанхаї агенти Гоміньдану змогли втекти, знищивши всі важливі документи. Це посилило позиції Товариства Вермільйон, а в Токіо вже почали шукати винних серед провалених розвідників."
 legation_cities_hotung_events.8.a: "Прокляття!"

 legation_cities_hotung_events.9.t: "У лігво дракона"
 legation_cities_hotung_events.9.d: "Ду Юешень симпатизує правому крилу Гоміньдану, але терпіти не може Ван Цзінвея та його соціалістичні ідеї. Будучи звичайним злочинцем, він не гребує брудною роботою за правильну ціну. Ду готовий допомогти нам саботувати зв'язки з Гоміньданом, але натомість він хоче, щоб ми влаштували «нещасний випадок» у шанхайському поліцейському архіві."
 legation_cities_hotung_events.9.a: "Що ж, якщо у нас немає вибору..."

 legation_cities_hotung_events.10.t: "Пожежа в шанхайському відділку поліції!"
 legation_cities_hotung_events.10.d: "Жахливі новини з Шанхая! У поліцейському архіві спалахнула масштабна пожежа, яка знищила безліч кримінальних справ. Пожежники відчайдушно боролися за кожну папку, але секція «D» вигоріла вщент. Цінні досьє на Ду Юешеня втрачені для історії, що відкидає наше розслідування далеко назад."
 legation_cities_hotung_events.10.a: "Чи справді це був нещасний випадок?"

 legation_cities_hotung_events.11.t: "Книга імен"
 legation_cities_hotung_events.11.d: "Здається, у цієї трагедії є позитивний фінал. Під час розбору завалів знайшли маленьку чорну книжку з іменами агентів Гоміньдану, адресами явочних квартир та сховищ зброї. Маючи такий скарб, поліція швидко покінчить з підпіллям."
 legation_cities_hotung_events.11.a: "Яка знахідка!"

 legation_cities_hotung_events.12.t: "Розслідування фентянського сліду"
 legation_cities_hotung_events.12.d: "Цікаво, але частина грошей Хотуна осідає на рахунках високопосадовців Фентяня. Схоже, те, що Чжан Цзуолінь утримує останній бастіон сіньхайського порядку, привабило Хотуна. Нам слід діяти обережно: у Токіо навряд чи зрадіють нашому втручанню у справи Шеньяна."
 legation_cities_hotung_events.12.a: "Звернімося до друзів на Заході..."
 legation_cities_hotung_events.12.b: "Розповімо Японії про те, що відбувається."

 legation_cities_hotung_events.13.t: "Зустріч із західними представниками"
 legation_cities_hotung_events.13.d: "В одному з розкішних клубів Шанхая зустрілися представники американської торгової палати, німецького директорату та британського клубу. Після довгих суперечок вони погодилися створити спільну слідчу групу, аби розібратися з фінансуванням Фентяня Хотуном. Через високий статус учасників японські шпигуни напевно скоро про все дізнаються..."
 legation_cities_hotung_events.13.a: "Це вікно саме відчинилося?"

 legation_cities_hotung_events.14.t: "Звіт із Шанхая"
 legation_cities_hotung_events.14.d: "Наші оперативники повідомили про таємну зустріч західних сил у Шанхаї щодо пожертв Товариства Вермільйон Фентяню. Цивільний уряд у Токіо хоче проігнорувати це, аби Фентянь і далі залежав від нас, але військові вимагають негайно накласти вето на розслідування заради стабільності Чжан Цзуоліня."
 legation_cities_hotung_events.14.a: "Зрештою, Фентянь незалежний..."
 legation_cities_hotung_events.14.b: "Накласти вето! Лише ми відповідаємо за справи Фентяня."

 legation_cities_hotung_events.15.t: "Щось пішло не так"
 legation_cities_hotung_events.15.d: "Розслідування незаконних внесків Фентяню зайшло у глухий кут. Свідки раптово почали все «забувати», а вчора ввечері група озброєних китайців увірвалася до офісу слідства, відкрила вогонь з автоматів і підпалила будівлю. Доказів не знайдено, але всі підозрюють уряд Фентяня."
 legation_cities_hotung_events.15.a: "Хай йому грець!"

 legation_cities_hotung_events.16.t: "Японія накладає вето на розслідування"
 legation_cities_hotung_events.16.d_west: "Сьогодні представники Китайського агентства передали ноту від Кацуо Окадзакі: розслідування припиняється за наказом японського уряду. Вони скористалися правом вето. На жаль, ми нічого не можемо вдіяти."
 legation_cities_hotung_events.16.d_jap: "З Токіо надійшов наказ негайно припинити розслідування. Всі файли про причетність Роберта Хотуна до справ Фентяня мають бути знищені. Слідчим мандату заборонено втручатися у справи Шеньяна."
 legation_cities_hotung_events.16.a: "Відправити справу в архів."

 legation_cities_hotung_events.17.t: "Інтриги в Лянґуані"
 legation_cities_hotung_events.17.d_feds: "Розслідування кантонського сліду виявилося дуже успішним. Через підкуп місцевих чиновників ми з'ясували, що сер Роберт глибоко залучений у діяльність Чень Цзюнміна та федералістського руху. Тепер нам треба копати глибше: або в самому Гонконгу, або через зв'язки німців у AOG."
 legation_cities_hotung_events.17.d_lkmt: "Ми з'ясували, що сер Роберт фінансує Чень Міншу та лівий Гоміньдан у Лянґуані. Потрібно продовжувати розслідування у Гонконгу або через німецькі канали в AOG."
 legation_cities_hotung_events.17.d_rkmt: "Сліди ведуть до Лі Цзунженя та правого Гоміньдану. Потрібно вивчити цей зв'язок детальніше через Гонконг або за допомогою німецького директорату."
 legation_cities_hotung_events.17.a: "Вирушаємо у саме серце темряви."
 legation_cities_hotung_events.17.b: "Що ж, Гуанчжоу зовсім поруч..."

 legation_cities_hotung_events.18.t: "Обід у Гонконзькому клубі"
 legation_cities_hotung_events.18.d: "Попри формальне усунення від справ мандату, британці зберігають величезний вплив через свій клуб у Гонконгу. Вони зацікавилися нашою справою проти Чень Цзюнміна і готові поділитися своїми даними. Кілька хабарів під час дружньої вечері — і вся інформація буде нашою..."
 legation_cities_hotung_events.18.a: "Я візьму добре просмажений стейк."

 legation_cities_hotung_events.19.t: "Послуга від AOG"
 legation_cities_hotung_events.19.d: "AOG — це мережа німецьких концесій у Китаї, яку часто називають німецькими «містами-концесіями». Їхня база в Гуанчжоу дозволяє їм пильно стежити за революціонерами. В обмін на політичну підтримку німецького директорату вони охоче поділяться інформацією."
 legation_cities_hotung_events.19.a: "Приємно мати з вами справу!"

 legation_cities_hotung_events.20.t: "Лянґуанський зв'язок розірвано"
 legation_cities_hotung_events.20.d: "Наші зусилля принесли плоди: ми завдали нищівного удару по Товариству Вермільйон, відрізавши їхніх союзників від фінансування. Членів товариства вже починають звинувачувати у фінансових злочинах."
 legation_cities_hotung_events.20.a: "Вони кинули виклик закону, і закон переміг."

 legation_cities_hotung_events.21.t: "Чень Цзюнмін прибуває до Гонконгу"
 legation_cities_hotung_events.21.d: "Лідер федералістів Чень Цзюнмін був змушений тікати з Гуандуна і прибув до Гонконгу. Він став близьким соратником Товариства Вермільйон і оселився у сера Роберта Хотуна. Хоча його присутність дратує британський клуб, навряд чи він зараз здатен на серйозний заколот."
 legation_cities_hotung_events.21.a: "Як іронічно."

 legation_cities_hotung_events.22.t: "Чень Цзюнмін помирає у вигнанні"
 legation_cities_hotung_events.22.d: "Сьогодні надійшла новина, що лідер китайських федералістів помер у Гонконгу від тифу. Товариство Вермільйон у жалобі — без свого засновника залишки федералістського руху остаточно розпалися."
 legation_cities_hotung_events.22.a: "Спочивай з миром."

 legation_cities_hotung_events.23.t: "Долари мандату в Шеньяні"
 legation_cities_hotung_events.23.d: "Наші агенти в Шанхаї повідомляють, що філантроп Роберт Хотун таємно фінансує уряд Фентяня. Військові вважають, що це нам на руку, але в цивільному уряді побоюються, що це зробить Чжана надто незалежним від Японії."
 legation_cities_hotung_events.23.a: "Скажіть Шанхаю не пхати носа в наші справи."
 legation_cities_hotung_events.23.b: "Це може бути корисним, дайте їм «зелене світло»."

 legation_cities_hotung_events.24.t: "Розслідування продовжується"
 legation_cities_hotung_events.24.d_west: "Попри страхи, японці, здається, не знають про допомогу Фентяню і дозволяють нам діяти. Проте в місті можуть бути шпигуни Чжана, тож треба поспішати. Кажуть, у Хуана Цзіньжуна є документи, які прискорять справу, але він хоче за них грошей..."
 legation_cities_hotung_events.24.d_jap: "Токіо дозволив нам продовжувати розслідування, попри ризик зустрічі зі шпигунами Фентяня. Хуан Цзіньжун пропонує свою допомогу за певну ціну..."
 legation_cities_hotung_events.24.a: "Ми впораємося самі, дякуємо."
 legation_cities_hotung_events.24.b: "Скільки він хоче?"

 legation_cities_hotung_events.25.t: "Шанхай розслідує фонд Хотуна"
 legation_cities_hotung_events.25.d: "Фентянь залучає багато «благодійних внесків», зокрема від сера Роберта Хотуна. Міста-концесії почали операцію проти фінансових махінацій, аби перекрити цей канал. Ми можемо підкупити потрібних людей у Шанхаї, аби вони саботували слідство, але це коштуватиме дорого."
 legation_cities_hotung_events.25.a: "Зробити патріотичні внески патріотичним громадянам."
 legation_cities_hotung_events.25.b: "У нас немає зайвих коштів!"

 legation_cities_hotung_events.26.t: "Кошти Фентяня конфісковано"
 legation_cities_hotung_events.26.d: "Слідчі затримали в порту судно, завантажене золотом і сріблом, що прямувало до Фентяня. Гранд-маршал скоро відчує брак коштів."
 legation_cities_hotung_events.26.a: "І що нам тепер робити з усім цим золотом..."

 legation_cities_hotung_events.27.t: "Симпатики федералістів у Гонконгу"
 legation_cities_hotung_events.27.d: "Після поразки республіканців у Лянґуані багато прихильників Чень Цзюнміна втекли до Гонконгу, куди тепер течуть гроші Товариства Вермільйон. Ці елементи планують теракти проти мандату, але за допомогою британців ми можемо їх знешкодити."
 legation_cities_hotung_events.27.a: "Зателефонуйте до Гонконгського клубу."

 legation_cities_hotung_events.28.t: "Облава на федералістів"
 legation_cities_hotung_events.28.d: "Сьогодні вранці пройшли масові обшуки в будинках симпатиків федералістів. Багатьох заарештовано за переховування втікачів та контрабанду зброї. Товариство Вермільйон зазнало сильного удару."
 legation_cities_hotung_events.28.a: "Чудові новини!"

 legation_cities_hotung_events.29.t: "Захід сонця над Гонконгом"
 legation_cities_hotung_events.29.d: "Маючи безпрецедентні докази проти Хотуна, офіцери волонтерського корпусу хочуть створити орган для контролю фінансів у мандаті. Проте Хотун запросив усіх офіцерів до свого маєтку і пообіцяв «благодійний внесок» на користь мандату в обмін на безкарність."
 legation_cities_hotung_events.29.a: "Ми пройшли такий довгий шлях не заради хабаря."
 legation_cities_hotung_events.29.b: "Що ж... зараз важкі часи..."

 legation_cities_hotung_events.30.t: "Фінансування Товариства Вермільйон перекрито"
 legation_cities_hotung_events.30.d: "Агенти в Шанхаї повідомляють, що мандат почав масштабні репресії проти наших фінансових операцій. Наші контакти змушені переховуватися. Доведеться шукати інші способи отримання грошей."
 legation_cities_hotung_events.30.a: "Прокляті імперіалісти!"

 legation_cities_news_events.1.t: "Крах міст-концесій"
 legation_cities_news_events.1.d: "ШАНХАЙ. Надійшли тривожні новини про повний розпад влади Ради концесій. Кілька необачних фінансових рішень призвели до банкрутства мандату. Японія, Німеччина та Британія вже ввели війська для захисту своїх територій від китайських сил. Шанхайська муніципальна рада намагається втримати місто, але вулиці вже стали полем бою між іноземними державами."
 legation_cities_news_events.1.a: "Китай розпадається ще сильніше."

 legation_cities_news_events.2.t: "Японію виключено з Ради концесій"
 legation_cities_news_events.2.d: "ШАНХАЙ. Рада оголосила про виключення [JAP.GetNameDef] та конфіскацію її територій. Комісар [LEC.GetLeader] заявив, що Японська імперія діяла на шкоду азійському миру. Офіційної відповіді Токіо ще немає, але очікується, що вона буде вкрай агресивною."
 legation_cities_news_events.2.a: "Вони знали, до чого це призведе."

 legation_cities_news_events.3.t: "Німеччину виключено з Ради концесій"
 legation_cities_news_events.3.d: "ШАНХАЙ. Рада прийняла рішення виключити [GER.GetNameDef] та конфіскувати німецькі концесії. Це сталось після різкого падіння німецького впливу в Китаї. Німці назвали це порушенням Пекінського договору, тож можлива атака Кайзерліхмаріне."
 legation_cities_news_events.3.a: "Далекий Схід дестабілізується далі."

### Decisions ###
 LEC_china_peace: "Запропонувати мирний договір"
 LEC_china_peace_desc: "Ця війна затягнулася, і вона явно на нашу користь. Нам слід вимагати миру."
 LEC_war: "Війна за концесії"

 LEC_votes_category: "Рада концесій"
 LEC_votes_category_desc: "Рада концесій — це орган, що складається з представників провідних держав, які мають інтереси в Китаї. Пропозиції тут висуваються представником і повинні набрати просту більшість голосів для прийняття. Голоси «утримався» не враховуються жодною зі сторін, окрім випадків рівності голосів, де вони зараховуються як додатковий голос «проти».\n\nКраїни, які на даний момент мають право голосу в Раді концесій:\n[LEC_voter1][LEC_voter2][LEC_voter3][LEC_voter4][LEC_voter5][LEC_voter6][LEC_voter7][LEC_voter8]\n\nПоточна пропозиція на розгляді: [LEC_current_motion]\n\nГолосів «за»: §G[?global.legations_yes_votes]§!\nУтрималося: §Y[?global.legations_abstain_votes]§!\nГолосів «проти»: §R[?global.legations_no_votes]§!"

 LEC_vote_timer: "Пропозиція на розгляді"
 LEC_vote_timer_desc: "Якщо ми можемо голосувати, але не повідомимо про свої наміри нашому представнику в Шанхаї, він буде змушений утриматися. Це може зашкодити нашим інтересам."
 LEC_restore_russian_vote: "Відновити право голосу [RUS.GetNameDef]"
 LEC_restore_russian_vote_desc: "Російське право голосу було заморожене після їхньої військової авантюри в Маньчжурії у 1928 році і зберігалося в такому стані через наполягання Німеччини та Японії. Тепер, коли ці події в минулому, їхні законні права можуть бути відновлені."
 LEC_conscription_army_motion: "Винести пропозицію про призов"
 LEC_legation_navy_motion: "Винести пропозицію про флот концесій"
 LEC_DAB_bailout_motion: "Винести пропозицію про порятунок DAB"
