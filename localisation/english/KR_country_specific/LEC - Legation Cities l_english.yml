### Intro Screen ###
 LEC_country_intro_background: "GFX_LEC_intro"
 LEC_country_intro_header: "$legation_cities_events.1.t$"
 LEC_country_intro_content: "$legation_cities_events.1.d$"
 LEC_guide: "§MЗахідне знаряддя§! ($paternal_autocrat_coloured$)\n£white_dot Після початку американської громадянської війни Німеччина має бути членом ради, підтримка партії §PСхіднокитайський директорат§! повинна перевищувати 18%, а під час виборів верховного комісара слід обрати німців.\n\n§MВорота на Схід§! (§nНаціонал-популізм§!)\n£white_dot Японія має бути членом ради, підтримка партії §nКитайське агентство§! повинна перевищувати 18%, а під час виборів верховного комісара слід обрати японців.\n\n§MАмериканське правління§! ($market_liberal_coloured$)\n£white_dot Оберіть американців на посаду верховного комісара (цей варіант доступний завжди).\n\n§MБританське правління§! ($social_conservative_coloured$)\n£white_dot Ігноруйте британські вимоги щодо шанхай-центризму.\n£white_dot Перед прийняттям рішення про призначення нового комісаріату має з'явитися івент про призначення британцями нового консула в Шанхаї або нового губернатора в Гонконгу, інакше варіант призначення британців не з'явиться.\n£white_dot Якщо попередня умова виконана, підтримка партії §cГонконзький клуб§! має перевищувати 18%; тоді оберіть британців на посаду верховного комісара.\n\n§MКрах§! — §MНімецька маріонетка§! / §MЯпонська маріонетка§! ($authoritarian_democrat_coloured$)\n£white_dot Дочекайтеся, поки валютні резерви впадуть до мінімального рівня, і дайте завершитися місії «Невблаганне банкрутство». Це призведе до краху міст і нашого потрапляння в німецьку або японську сферу впливу залежно від того, хто вийде переможцем у сутичках у Шанхаї."

