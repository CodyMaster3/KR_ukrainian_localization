 LEC_british_commander: "Британський офіцер"
 LEC_british_commander_desc: "Ця людина є членом §cГонконзького клубу§!, і її служба мандату зумовлена насамперед обставинами. Його буде відсторонено від служби, якщо до влади прийде §Rантибританська адміністрація§! або якщо Гонконг буде відокремлений від мандату."

 LEC_german_commander: "Німецький офіцер"
 LEC_german_commander_desc: "Ця людина входить до складу сил безпеки §PСхіднокитайського директорату§! і тимчасово надана мандату. Його буде відсторонено від служби, якщо до влади прийде §Rантинімецька адміністрація§!."

 LEC_japanese_commander: "Японський офіцер"
 LEC_japanese_commander_desc: "Ця людина входить до складу сил безпеки §nКитайського агентства§! і тимчасово надана мандату. Його буде відсторонено від служби, якщо до влади прийде §Rантияпонська адміністрація§!."

 LEC_international_commander: "Офіцер міжнародних волонтерів"
 LEC_international_commander_desc: "Ця людина є частиною §CМіжнародного волонтерського корпусу§! і перебуває під безпосереднім наглядом мандату. Його не буде усунуто зі служби, за винятком особливих обставин."

