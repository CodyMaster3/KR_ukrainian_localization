 LEC_black_monday: "Чорний понеділок на сході"

 LEC_vladisostok_smuggling: "Вільна торгівля у Владивостоці"
 LEC_vladisostok_smuggling_desc: "Наша угода про вільну торгівля з центром у Владивостоці дає нам конкурентну перевагу на всьому Далекому Сході, оскільки ресурси Владивостока ефективно передаються до Тяньцзіня, а звідти розповсюджуються регіоном."

 LEC_shanghai_plan: "Шанхайський план"
 LEC_shanghai_plan_desc: "Зосередившись на розвитку Шанхая, ми забезпечимо собі стабільну базу для подальшого зростання."

 LEC_cities_plan: "План «Низка перлин»"
 LEC_cities_plan_desc: "Розвиваючи малі міста, ми гарантуємо, що навіть у разі зупинки торгівлі в Шанхаї решта концесій продовжуватиме процвітати."

 LEC_welfare: "Французькі відкати"
 LEC_welfare_desc: "Пропонуючи французьким емігрантам китайське громадянство через офіси Міжнародного мандату, ми прив'язуємо їх та їхні підприємства до себе. Природно, вони висловлюють свою вдячність будь-яким зручним для нас способом."

 LEC_railway_dividend: "Залізничні дивіденди"
 LEC_railway_land_tax: "Залізниці та земельний податок"

 LEC_shanghai_yuan: "Шанхайський юань"
 LEC_shanghai_yuan_desc: "Використання китайського юаня як стандартної валюти концесій полегшує виробництво та торгівлю з внутрішніми регіонами, але ускладнює ведення справ із західними партнерами."

 LEC_legation_dollar: "Долар концесій"
 LEC_legation_dollar_desc: "Використання американського долара як стандартної валюти полегшує взаємодію з іноземцями як усередині уряду, так і за його межами."

 LEC_volunteer_force: "Сили оборони Міст-концесій"
 LEC_volunteer_force_desc: "Міжнародний волонтерський корпус формується з емігрантів та іноземних добровольців, готових захищати Міста-концесії (в теорії). Вони фінансуються Радою концесій, а їхні обов'язки полягають переважно в охороні територій на китайському узбережжі. Рада також має у своєму розпорядженні численні автономні групи вигнанців, багато з яких готові воювати за консульські інтереси по всьому Китаю."

 LEC_volunteer_force_expanded: "Розширений волонтерський корпус"
 LEC_volunteer_force_expanded_desc: "Міжнародний волонтерський корпус було розширено за рахунок залучення більшої кількості добровольців. Вони забезпечують безпеку територій та торгових шляхів, виступаючи надійним інструментом впливу Ради концесій."

 LEC_volunteer_force_natives: "Сили оборони Концесій"
 LEC_volunteer_force_natives_desc: "Міжнародний волонтерський корпус тепер формується як з іноземних емігрантів, так і з місцевих китайських добровольців. Це дозволяє збільшити чисельність армії та покращити її взаємодію з місцевим населенням."

 LEC_volunteer_force_glorious: "Пишність та урочистість"
 LEC_volunteer_force_glorious_desc: "Міжнародний волонтерський корпус став символом престижу міст-концесій. Добре екіпіровані та навчені підрозділи демонструють міць міжнародної спільноти на китайському узбережжі."

 LEC_volunteer_force_mechanised: "Сили оборони Концесій"
 LEC_volunteer_force_mechanised_desc: "Завдяки інвестиціям та технічній допомозі наші сили оборони отримали сучасну техніку, що значно підвищує їхню мобільність та вогневу міць у захисті територій."

 LEC_naval_research: "Сучасні кораблі"
 LEC_naval_research_desc: "Унікальний статус Міжнародного флоту дозволяє йому використовувати найновіші розробки під час будівництва нових кораблів."

 LEC_german_aid_idea: "Німецька військова співпраця"
 LEC_german_aid_idea_desc: "Нам доведеться захищатися з усіх боків у майбутній боротьби проти японської та китайської загроз, але співпраця з Кайзерліхмаріне дає нам надію на перемогу."

 LEC_TMKKD_idea: "Тайсі мондай кайкецу кокумін домей"
 LEC_TMKKD_idea_desc: "Японські військові зусилля просуватимуться через нас — їхні передові бази в Китаї. TMKKD вербуватиме місцевих колабораціоністів для надання критично важливих розвідувальних даних, тоді як ми забезпечуватимемо Японію ресурсами."

 LEC_FNG_tianjin: "Окупація Тяньцзіня"
 LEC_FNG_tianjin_desc: "Хоча наші війська зараз окупували Тяньцзінь, значна частина прибутку з міста все ще тече до Шанхая, оскільки концесії зберігають де-юре контроль над містом."

 LEC_supply_lines_idea: "Японські лінії постачання"
 LEC_supply_lines_idea_desc: "На японські товари може бути накладено ембарго, але їхній нейтральний союзник тут, у Шанхаї, дістане їм усе необхідне. Плюс, ми можемо трохи заробити на цьому..."

 LEC_GER_open_door: "Плоди відкритих дверей"
 LEC_GER_open_door_desc: "Хоча міста-концесії забезпечують переваги вільної торгівлі, основна частина нашого прибутку в Китаї походить від інвестицій в AOG. Як незаконна, так і легальна торгівля забезпечують нашій країні стабільний дохід."

 LEC_USA_open_door: "Плоди відкритих дверей"
 LEC_USA_open_door_desc: "Поточна структура міст-концесій найбільш вигідна для нас, оскільки ми ведемо бізнес та дипломатію в Китаї через Шанхай, не витрачаючи сили на пряме управління. Поки японці та німці змагаються за домінування, ми будемо просто багатіти!"

 LEC_generic_open_door: "Плоди відкритих дверей"
 LEC_generic_open_door_desc: "Хоча ми не маємо конкурентних переваг Америки, вільна торгівля з Китаєм через міста-концесії забезпечує наших громадян додатковими товарами."

 LEC_better_open_door: "Плоди відкритих дверей"
 LEC_better_open_door_desc: "Завдяки посиленому акценту міст-концесій на вільній торгівлі для всіх сторін, усі зацікавлені держави отримують значні вигоди."

 LEC_legation_cities_open_door: "Відкриті двері"
 LEC_legation_cities_open_door_desc: "Зі встановленням курсу на вільну торгівлю наші ринки та громадяни отримують вигоду від статусу посередника."

 LEC_legit_neutrality: "Нейтралітет Концесій"

 LEC_money_launderette: "Комісія з протидії відмиванню коштів"
 LEC_money_launderette_desc: "Після завершення розслідування діяльності товариства Вермільйон було створено КПВК для розслідування та переслідування всіх злочинів, пов'язаних із фінансовим шахрайством."

 LEC_money_severed: "Фінансування Товариства Вермільйон припинено"
 LEC_japanese_shanghai: "Шанхай під японцями"
 LEC_japanese_shanghai1: "Шанхай під японцями"
 LEC_japanese_luxury: "Розкішний Шанхай"
 LEC_cooperative_triads: "Кооперативні тріади"
 LEC_german_shanghai: "Шанхай під німцями"
 LEC_german_chinese_shanghai: "Китайсько-німецька співпраця"
 LEC_german_shanghai1: "Шанхай під німцями"
 LEC_kaiserliche_sailing: "Морське планування Німеччини та Шанхая"
 LEC_german_shanghai2: "Шанхай під німцями"

### Parties ###
 LEC_totalist_party: "БДІ"
 LEC_totalist_party_long: "Бюро розслідувань і статистики (БДІ)\n§LІдеологічний анклав Дай Лі в Шанхаї домінує в розвідувальних операціях Гоміньдану і формує неформальну течію всередині партії. Де б не виявляли саботаж чи синдикалістські заворушення, агенти БДІ або Цзюньтуна напевно знаходяться десь неподалік.§!\n"
 LEC_syndicalist_party: "КСП"
 LEC_syndicalist_party_long: "Китайська синдикалістська партія\n§LМала і здебільшого неважлива в масштабах усього Китаю партія. Хоча вона здатна підтримувати незначну присутність у Шанхаї та інших містах мандату, її вплив залишається мінімальним.§!\n"
 LEC_radical_socialist_party: "Г-АКР"
 LEC_radical_socialist_party_long: "Асоціація колег з реорганізації Гоміньдану\n§LФракція АКР Гоміньдану формує основну ідеологічну течію партії та утримує деякі осередки в містах-концесіях. На щастя, вони є не більшою проблемою для місцевої поліції, ніж дрібна неприємність.§!\n"
 LEC_social_democrat_party: "Г-ТДК"
 LEC_social_democrat_party_long: "Тимчасовий дієвий комітет Гоміньдану\n§LФракція ТДК Гоміньдану представляє альтернативний та більш «ліберальний» елемент партії.§!\n"
 LEC_social_liberal_party: "Товариство Вермільйон"
 LEC_social_liberal_party_long: "Товариство Вермільйон\n§LВелика, широка група бізнесменів та впливових діячів, які зазвичай характеризують себе як особи «китайського походження», що включає «євразійців» або чоловіків змішаної раси. Вони формують клуби та групи інтересів на різних рівнях суспільства, але переважно складаються з заможних класів. Те, що товариство орієнтоване на націоналістів, є секретом Полішинеля; ще до його заснування його члени фінансували революцію в Китаї щонайменше з 1911 року. «Керівництво» товариством у мандаті номінально належить Роберту Хо Шай Лаю, хоча відкрито визнається, що справжньою силою за цією групою є його батько, сер Роберт Хотун.§!\n"
 LEC_social_conservative_party: "Гонконзький клуб"
 LEC_social_conservative_party_long: "Гонконзький клуб\n§LСпочатку обідній клуб та засіб зв'язку для британської бізнес-спільноти в Гонконгу, Гонконзький клуб став опорою для британців у концесіях і тепер має філії в усіх містах-концесіях. Членство відкрите лише для білих підданих британської корони, хоча виняток робиться для тих небагатьох, хто народився в Гонконгу, де англомовна ділова спільнота залишається домінуючою.§!\n"
 LEC_market_liberal_party: "AmCham Shanghai"
 LEC_market_liberal_party_long: "Американська торгова палата в міжнародному мандаті\n§LКомерційне крило американського впливу в містах-концесіях. Головна місія палати — тримати порти відкритими, а товарообіг стабільним, щоб підтримувати бізнес одного з останніх хороших торгових партнерів США.§!\n"
 LEC_paternal_autocrat_party: "Ostchina Direktorium"
 LEC_paternal_autocrat_party_long: "Східнокитайський директорат\n§LІнструмент комерційного домінування Німеччини в Китаї. СД тримає мертвою хваткою AOG, а також відповідає за ведення переговорів з Радою концесій щодо вигідних умов для німецьких інвестицій.§!\n"
 LEC_authoritarian_democrat_party: "ШМР"
 LEC_authoritarian_democrat_party_long: "Шанхайська муніципальна рада\n§LШанхайська муніципальна рада є органом управління найважливішого міста серед концесій. Хоча вона не може здійснювати політичну владу незалежно, вона залишається важливим гравцем на місцевому рівні.§!\n"
 LEC_national_populist_party: "Китайське агентство"
 LEC_national_populist_party_long: "Сіна Токубецу Хонбу\n§LЯпонське «Спеціальне агентство в Китаї» офіційно є силою політичної безпеки під контролем японського консульства як частина міністерства закордонних справ, але насправді воно представляє не лише їх, а й вплив військового міністерства. Це робить його вкрай роздробленою організацією, яку важко класифікувати; повний масштаб її операцій може назавжди залишитися невідомим.§!\n"

