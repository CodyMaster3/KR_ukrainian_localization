 LEC_belgium_motion: "Винести пропозицію про виключення [BEL.GetName] з ради"
 LEC_leader_motion: "Визначити наступного верховного комісара"
 LEC_budget_motion: "Винести пропозицію про обговорення бюджету на наступний рік"
 LEC_bankruptcy_warning: "Невблаганне банкрутство"

 LEC_influence_category: "Впливи у Містах-концесіях"
 LEC_influence_category_desc: "У містах-концесіях панує жорстка конкуренція, і багато фракцій борються за владу. Нам слід діяти обережно.\n\n§RКитайський вплив§!: [?LEC.party_popularity@social_liberal|%0]\n§YБританський вплив§!: [?LEC.party_popularity@social_conservative|%0]\n§CАмериканський вплив§!: [?LEC.party_popularity@market_liberal|%0]\n§gНімецький вплив§!: [?LEC.party_popularity@paternal_autocrat|%0]\n§LЯпонський вплив§!: [?LEC.party_popularity@national_populist|%0]"

 LEC_influence_category_domestic: "$LEC_influence_category$"
 LEC_influence_category_domestic_desc: "$LEC_influence_category_desc$"

 LEC_return_jap_guns: "Поставити японцям зброю"
 LEC_return_jap_guns_desc: "Японці надсилали нам зброю в минулому. Тепер, коли вони її потребують, ми повинні передати її їхнім військам на передовій та допомогти з постачанням."
 LEC_join_entente: "Запросити британський захист"
 LEC_join_entente_desc: "Очевидно, що мережа міжнародних гарантій, яка колись захищала нас, більше не може цього робити. Нам потрібен ближчий союзник, і британці — наш найкращий шанс на безпеку."
 LEC_join_reichspakt: "Приєднатися до Райхспакту"
 LEC_join_reichspakt_desc: "Очевидно, що мережа міжнародних гарантій більше не діє. Нам потрібен сильний покровитель, і німці — наш найкращий вибір для захисту від японців."
 LEC_join_cps: "Приєднатися до Сфери спільного процвітання"
 LEC_join_cps_desc: "Ми повинні об'єднатися з нашими японськими братами, аби визволити Китай та Азію в цілому!"

 LEC_join_fengtian: "Возз'єднатися з [FNG.GetNameDef]"

 LEC_investigate_du_yuesheng: "Почати розслідування діяльності Ду Юешена"
 LEC_arrest_du_yuesheng: "Заарештувати Ду Юешена"
 LEC_convict_du_yuesheng: "Засудити Ду Юешена"
 LEC_convict_du_yuesheng_desc: "Засудити Ду Юешена буде важко через величезну кількість його прихильників у містах та по всьому Китаю."
 LEC_investigate_zhang_xiaolin: "Почати розслідування діяльності Чжан Сяоліня"
 LEC_prosecute_zhang_xiaolin: "Заарештувати Чжан Сяоліня"
 LEC_convict_zhang_xiaolin: "Засудити Чжан Сяоліня"
 LEC_investigate_huang_jinrong: "Почати розслідування методів Хуан Цзіньжуна"
 LEC_prosecute_huang_jinrong: "Заарештувати Хуан Цзіньжуна"
 LEC_convict_huang_jinrong: "Засудити Хуан Цзіньжуна"
 LEC_prosectue_solomon_adler: "Переслідувати Соломона Адлера"
 LEC_prosectue_solomon_adler_desc: "Переслідування Адлера зменшить американський вплив у містах."
 LEC_prosectue_lothar_eisentrager: "Переслідувати Лотара Айзентреґера"
 LEC_prosectue_lothar_eisentrager_desc: "Переслідування Айзентреґера зменшить німецький вплив у Шанхаї."
 LEC_investigate_british_business: "Почати розслідування британської діяльності в Гонконгу"
 LEC_investigate_british_business_desc: "Схоже, британська корона веде таємні маневри в Гонконгу. Ми повинні переконатися, що вони не намагаються підірвати владу міст-концесій."
 LEC_curtail_british_business: "Обмежити британську діяльність у Гонконгу"
 LEC_curtail_british_business_desc: "Британці явно намагаються відібрати у нас Гонконг або, принаймні, пролізти до Ради концесій. Ми не можемо цього допустити і повинні вжити рішучих заходів у Гонконгу."

 LEC_AST_reach_out_hong_kong: "Звернутися до гонконзьких бізнесменів"
 LEC_AST_reach_out_hong_kong_desc: "Гонконг колись був перлиною британської Азії, рівною Сінгапуру чи Калькутті. Хоча Гонконг відокремлений від імперії з 1925 року, мешканці все ще відчувають зв’язок із нами. Нам слід відновити активні відносини з ними."
 LEC_AST_send_volunteers: "Відправити волонтерський батальйон до Гонконгу"
 LEC_AST_send_volunteers_desc: "Відправка кадрів до сил оборони концесій у Гонконгу допоможе захистити місто та посилить наш вплив там."
 LEC_AST_royal_visit: "Королівський візит до Гонконгу"
 LEC_AST_royal_visit_desc: "Візит принца Альберта та його доньки до Гонконгу неодмінно підвищить підтримку Британської імперії."
 LEC_AST_appoint_new_governor: "Призначити нового королівського губернатора"
 LEC_AST_appoint_new_governor_desc: "Ми не призначали нового губернатора Гонконгу з 1925 року. Слід розглянути це як метод розширення нашого впливу в Китаї."
 LEC_AST_retake_hong_kong: "Запросити Гонконг під захист корони"
 LEC_AST_retake_hong_kong_desc: "Міста-концесії зараз достатньо вразливі, щоб ми могли здійснити свій маневр і повернути Гонконг під владу британської корони."
 LEC_AST_request_voting: "Запросити повернення нашого права голосу в раді"
 LEC_AST_request_voting_desc: "Тепер, коли ми маємо вплив у містах, ми можемо спонукати раду розглянути питання про відновлення нашого права голосу, яке належить нам за наші китайські концесії."

 LEC_USA_send_volunteers: "Відправити більше військ до міст-концесій"
 LEC_USA_send_volunteers_desc: "Крах Ліги зробив міста-концесії, а отже і наші інтереси в Китаї, вразливими. Нам слід посилити залогу."
 LEC_claim_american_rights: "Запросити американське право голосу"
 LEC_claim_american_rights_desc: "Тепер, коли існує лише одна Америка, ми повинні вимагати відновлення нашого права голосу в Раді концесій."

 LEC_GER_exclude_belgium: "Вимагати виключення [BEL.GetName] з Ради концесій"
 LEC_GER_exclude_belgium_desc: "[BEL.GetName] вийшла з нашої сфери впливу і більше не є корисною як член ради. Ми повинні попросити раду виключити її."
 LEC_GER_send_volunteers: "Відправити більше військ до міст-концесій"
 LEC_GER_send_volunteers_desc: "Крах Ліги зробив міста-концесії вразливими. Нам слід посилити німецьку присутність там."

 LEC_JAP_stage_attack: "Спровокувати нестабільність у Тяньцзіні"
 LEC_JAP_stage_attack_desc: "Світ охоплений Чорним понеділком, що боляче вдарило по мандату; китайське населення міст страждає. Напруга сягає точки кипіння. Давши «зелене світло» нашим оперативникам у Китайському агентстві, ми отримаємо привід закріпитися в Тяньцзіні."
 LEC_JAP_send_guns: "Відправити зброю нашим союзникам"
 LEC_JAP_send_guns_desc: "Оскільки в Китаї з'являються колабораціоністи, настав час озброїти їх для боротьби за нашу справу. Концесії — ідеальний шлях для контрабанди зброї..."
 LEC_JAP_enforce_police: "Посилити поліцейське командування"
 LEC_JAP_army_guns: "Екіпірувати залогу"
 LEC_JAP_army_men: "Посилити залогу"
 LEC_JAP_destabilise_tianjin: "Дестабілізувати Тяньцзінь"
 LEC_JAP_destabilise_tianjin_desc: "Закріпившись у Тяньцзіні, ми можемо почати дестабілізацію міста, що дасть нашій армії привід для втручання."
 LEC_JAP_take_tianjin: "Захопити Тяньцзінь!"
 LEC_JAP_take_tianjin_desc: "Тепер, коли міста-концесії вразливі, а ми достатньо сильні, ми можемо забрати Тяньцзінь собі!"

 LEC_kmt_konnection: "Розслідувати зв'язок із Гоміньданом"
 LEC_kmt_konnection_desc: "Гоміньдан — найочевидніший об'єкт для розслідування, оскільки Хотун був одним із найбільших спонсорів доктора Суня."
 LEC_fengtian_investigation: "Розслідувати фентянський зв'язок"
 LEC_liangguang_investigation: "Розслідувати зв'язок із Лянґуаном"
 LEC_hotung_deal: "Завершення розслідування"

