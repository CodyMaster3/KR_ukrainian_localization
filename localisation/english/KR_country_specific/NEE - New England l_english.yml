 new_england_events.123.a: "Цей план занадто ризикований, ми не можемо цього дозволити"
 new_england_events.123.b: "[APG.GetNameDefCap] — кращий варіант"
 new_england_events.123.c: "[ACC.GetNameDefCap] — кращий варіант"
 new_england_events.123.e: "Федеральний уряд — кращий варіант"
 new_england_events.123.f: "Погодитися на умови Нової Англії"

