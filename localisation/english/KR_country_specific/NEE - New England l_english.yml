### Parties ###
 NEE_totalist_party: "ЛППС"
 NEE_totalist_party_long: "Ліга Просвіти профспілок\n§LОстання і найдовговічніша з кількох синдикалістських робітничих організацій, заснованих Вільямом З. Фостером, Ліга Просвіти Профспілок була заснована в 1920 році із залишків Синдикалістської ліги Північної Америки Фостера та Міжнародної ліги Просвіти Профспілок. Виступаючи проти політики участі в виборах Соціалістичної партії та стратегії подвійного об'єднання Робітників світу (IWW), ЛППС натомість дотримується антиполітичного ультрасиндикалістського підходу «буріння зсередини» Американської федерації праці, стратегії, яка мала певний успіх, особливо в Чикаго, де Чиказька федерація праці на чолі з Джоном Фіцпатріком тісно співпрацює з Фостером. Тим часом ідеологічно ЛППС дещо відійшла від основного соціалізму в Сполучених Штатах, просуваючи форму «Патріотичного синдикалізму», яка запозичує ідеї Сореля, що виникають по той бік Атлантики.§!"
 NEE_syndicalist_party: "Соціалісти"
 NEE_syndicalist_party_long: "Соціалістична партія Америки - фракція промислових профспілок\n§LЗаснована в 1901 році, Соціалістична партія Америки швидко набрала обертів як провідна соціалістична політична сила у Сполучених Штатах. Спочатку залучаючи підтримку робітників, фермерів, іммігрантів та соціальних реформаторів, серед інших, вона незабаром зіткнулася з кризою, оскільки революційна хвиля кінця 1910-х років спровокувала велику фракційну боротьбу всередині партії, між поміркованими «Регулярними» та «Радикалами», які підтримували революційні дії.\n\nХоча радикали зрештою перемогли, успіх Британської революції змусив їх приєднатися до Робітничо-Фермерської партії, рішення, яке дозволило їм досягти стрімких виборчих успіхів на виборах 1932 та 1934 років, отримавши контроль над кількома урядами штатів Середнього Заходу. Саме це проникнення в Робітничо-Фермерську партію дозволило СПА перетворитися на грізну політичну силу, здатну розпалити громадянську війну. Таким чином, партія тепер суворо заборонена на території Нової Англії, а організатори заарештовуються (або гірше) навіть за найменшої підозри.§!"
 NEE_radical_socialist_party: "Прогресисти"
 NEE_radical_socialist_party_long: "Соціалістична партія Америки - Прогресивна фракція\n§LЗаснована в 1901 році, Соціалістична партія Америки швидко набрала обертів як провідна соціалістична політична сила у Сполучених Штатах. Спочатку залучаючи підтримку робітників, фермерів, іммігрантів та соціальних реформаторів, серед інших, вона незабаром зіткнулася з кризою, оскільки революційна хвиля кінця 1910-х років спровокувала велику фракційну боротьбу всередині партії, між поміркованими «Регулярними» та «Радикалами», які підтримували революційні дії.\n\nХоча радикали зрештою перемогли, успіх Британської революції змусив їх приєднатися до Робітничо-Фермерської партії, рішення, яке дозволило їм досягти стрімких виборчих успіхів на виборах 1932 та 1934 років, отримавши контроль над кількома урядами штатів Середнього Заходу. Саме це проникнення в Робітничо-Фермерську партію дозволило СПА перетворитися на грізну політичну силу, здатну розпалити громадянську війну. Таким чином, партія тепер суворо заборонена на території Нової Англії, а організатори заарештовуються (або гірше) навіть за найменшої підозри.§!"
 NEE_social_democrat_party: "Робітничо-фермерська партія"
 NEE_social_democrat_party_long: "Робітничо-фермерська партія\n§LЗ крахом старої Робітничо-Фермерської партії та раптовим виходом СПА з легальної політики, решта лояльних політиків Робітничо-Фермерської партії прагнули реорганізувати свою політичну партію без втручання соціалістів. І без того маргінальна в Новій Англії, Робітничо-Фермерська партія зазнала нищівного удару з початком Громадянської війни та окупації, і тому стала ще більшим несуттєвим фактором у політиці Нової Англії, ніж була раніше.§!"
 NEE_social_liberal_party: "Демократи"
 NEE_social_liberal_party_long: "Демократична партія - Ліберальна фракція\n§LНайстаріша безперервно діюча політична партія у світі, Демократична партія була заснована понад 100 років тому в 1828 році Ендрю Джексоном і Мартіном ван Бюреном. Спочатку аграрна популістська партія, що підтримувала принципи Джефферсона, вона перетворилася спочатку на (загалом) прорабовласницьку партію, потім на аграрну та південну опозицію республіканцям, а потім на західну, південну та дедалі більш міську партію з ліберальними схильностями.\n\nУ Новій Англії ліберальне крило Демократів було переважаючою течією в партії з моменту відродження її впливу у 20-му столітті. Її, як правило, підтримують міські католицькі виборці «етнічного» походження, а також ліберали, які виступають проти Робітничо-Фермерської партії, і вона підтримує помірне втручання уряду для підтримки економіки, а також більшу участь на світовій арені.§!"
 NEE_market_liberal_party: "Республіканці"
 NEE_market_liberal_party_long: "Республіканська партія\n§LЗаснована в 1854 році як широка партія, що виступала проти «Влади рабства», Республіканська партія загалом розглядалася як «природна керівна партія» Сполучених Штатів з кінця Американської громадянської війни. Представляючи промислові інтереси, які стали домінувати в країні після поразки «Влади рабства», а також північно-східних протестантів старого походження та більш заможних західних фермерів, Республіканська коаліція донедавна загалом зберігала довгостроковий контроль над політикою США.\n\nКолись Республіканська партія утримувала Нову Англію, але тепер вона стикається з жорсткою конкуренцією з боку Демократів, особливо в міських, католицьких районах. Як природна партія білих протестантів, республіканці Нової Англії загалом можуть бути класифіковані як помірковані або консервативні на національному рівні, з меншою кількістю прогресистів у типово консервативному північному сході.§!"
 NEE_social_conservative_party: "Демократи"
 NEE_social_conservative_party_long: "Демократична партія - Консервативна фракція\n§LНайстаріша безперервно діюча політична партія у світі, Демократична партія була заснована понад 100 років тому в 1828 році Ендрю Джексоном і Мартіном ван Бюреном. Спочатку аграрна популістська партія, що підтримувала принципи Джефферсона, вона перетворилася спочатку на (загалом) прорабовласницьку партію, потім на аграрну та південну опозицію республіканцям, а потім на західну, південну та дедалі більш міську партію з ліберальними схильностями.\n\nКонсервативне крило Демократів, яке зазвичай асоціюється з півднем, домінує в цьому регіоні з кінця реконструкції. Це природна керівна партія в більшій частині півдня, де висунення рівнозначне обранню. Розділені між аграрними реакціонерами та більш реформаторськими поміркованими консерваторами, вони загалом виступають проти реформи громадянських прав та картелізації економіки, підтримуючи малий бізнес та землевласників.§!"
 NEE_authoritarian_democrat_party: "Юніоністи"
 NEE_authoritarian_democrat_party_long: "Партія Союзу - Реакційна фракція\n§LНайновіша велика партія в політиці США, партія Союзу була нещодавно сформована насамперед як засіб для висування Г'юї Лонга на пост Президента, коли стало зрозуміло, що він не зможе отримати демократичну номінацію. Будучи широким альянсом, що складається з демократів, реакціонерів та антисиндикалістських прогресистів, вони об'єднані лише спільною опозицією до адміністрації Сміта, і принаймні тимчасовою єдністю навколо Лонга як свого лідера.\n\nХоча традиційно база підтримки Лонга була в південних сільськогосподарських штатах, реакційні та популістські південні лідери-демократи, такі як Юджин Талмідж та Теодор Білбо, згуртувалися навколо Лонга через свою опозицію до Сміта. Ці південні демократи об'єднані насамперед своєю вірою у перевагу білої раси та зневагою до особливого різновиду лібералізму Сміта. Однак їхня єдність навколо Лонга явно умовна і навряд чи триватиме, якщо справа дійде до серйозного протистояння.§!"
 NEE_paternal_autocrat_party: "$USA_paternal_autocrat_party_postwar$"
 NEE_paternal_autocrat_party_long: "$USA_paternal_autocrat_party_postwar_long$"
 NEE_national_populist_party: "Популісти"
 NEE_national_populist_party_long: "Партія Союзу - Популістська фракція\n§LНайновіша велика партія в політиці США, партія Союзу була нещодавно сформована насамперед як засіб для висування Г'юї Лонга на пост Президента, коли стало зрозуміло, що він не зможе отримати демократичну номінацію. Будучи широким альянсом, що складається з демократів, реакціонерів та антисиндикалістських прогресистів, вони об'єднані лише спільною опозицією до адміністрації Сміта, і принаймні тимчасовою єдністю навколо Лонга як свого лідера.\n\nОсновна особиста база підтримки Лонга протягом більшої частини його кар'єри в національній політиці була в західних сільськогосподарських штатах, де панують його прогресивні, але децентралістські економічні ідеї. Лонг об'єднався із західними сенаторами, такими як Бертон Вілер, які вийшли, щоб підтримати його платформу «Поділися нашим багатством». Саме ця західна фракція нової партії Лонга є найбільш лояльною до нього особисто і, ймовірно, буде підтримувати його незважаючи ні на що.§!"

