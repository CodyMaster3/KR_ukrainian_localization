 new_england_events.125.t: "[ENT.GetName] переглядає зобов'язання щодо Америки"
 new_england_events.125.d.noone: "Після переговорів між представниками [NEE.Capital.GetCapitalVictoryPointName] та [ENT.Capital.GetCapitalVictoryPointName], уряд [ENT.GetNameDef] оголосив про зміну нашої політики щодо другої американської громадянської війни. Досі ми уникали спрямування наших ресурсів на підтримку будь-кого з претендентів на владу в Сполучених Штатах Америки. Переконавшись у перевагах лояльної об'єднаної Америки, що підтримує інтереси Антанти, [ENT.GetNameDef] погодився розпочати підтримку [NEE.GetNameDef] як претендента на роль спадкоємця Америки. Вони попросили нас готуватися до війни на континенті, оскільки на кону стоїть майбутнє демократії!"
 new_england_events.125.d.APG: "Після переговорів між представниками [NEE.Capital.GetCapitalVictoryPointName] та [ENT.Capital.GetCapitalVictoryPointName], уряд [ENT.GetNameDef] оголосив про зміну нашої політики щодо другої американської громадянської війни. Хоча зараз ми спрямовуємо наші ресурси на підтримку [APG.GetNameDef], сили Антанти отримали запит на вихід із регіону. Зміна курсу на повну підтримку [NEE.GetNameDef], схоже, уже вирішена. Протягом двох тижнів офіційна підтримка [APG.GetNameDef] припиниться і натомість буде спрямована на [NEE.GetNameDef]."
 new_england_events.125.d.ACC: "Після переговорів між представниками [NEE.Capital.GetCapitalVictoryPointName] та [ENT.Capital.GetCapitalVictoryPointName], уряд [ENT.GetNameDef] оголосив про зміну нашої політики щодо другої американської громадянської війни. Хоча зараз ми спрямовуємо наші ресурси на підтримку [ACC.GetNameDef], сили Антанти отримали запит на вихід із регіону. Зміна курсу на повну підтримку [NEE.GetNameDef], схоже, уже вирішена. Протягом двох тижнів офіційна підтримка [ACC.GetNameDef] припиниться і натомість буде спрямована на [NEE.GetNameDef]."
 new_england_events.125.d.USA: "Після переговорів між представниками [NEE.Capital.GetCapitalVictoryPointName] та [ENT.Capital.GetCapitalVictoryPointName], уряд [ENT.GetNameDef] оголосив про зміну нашої політики щодо другої американської громадянської війни. Хоча зараз ми спрямовуємо наші ресурси на підтримку [USA.GetNameDef], сили Антанти отримали запит на вихід із регіону. Зміна курсу на повну підтримку [NEE.GetNameDef], схоже, уже вирішена. Протягом двох тижнів офіційна підтримка [USA.GetNameDef] припиниться і натомість буде спрямована на [NEE.GetNameDef]."
 new_england_events.125.a: "Сподіваюся, це правильне рішення"

 new_england_events.126.t: "[ENT.GetName] переглядає зобов'язання щодо Америки"
 new_england_events.126.d: "Зрадники з Антанти щойно повідомили нам, що припиняють свою підтримку. Ширяться чутки про переговори між [ENT.GetNameDef] та [NEE.GetNameDef], які переконали уряд у [ENT.Capital.GetCapitalVictoryPointName] спрямувати ресурси Антанти на свою користь. Цього дня Антанта показала своє справжнє обличчя. Їхнім угодам не можна довіряти! Будь-яке оголошення війни одному з американських претендентів, з якими ми боремося, рівносильне оголошенню війни проти нас!"
 new_england_events.126.a: "Зрадники!"

 new_england_events.127.t: "Усі за Нову Англію"
 new_england_events.127.d: "Після закінчення двотижневого терміну всі сили Антанти на континенті мають бути спрямовані на допомогу спільному наступу на Сталевий пояс із боку Верхньої Канади та Нової Англії. Швидкий і рішучий удар задля захоплення промислового центру нації — це перший крок до перемоги. Поки вогонь війни вже нищить заводи боєприпасів на північному сході, знадобляться додаткові ресурси та промислова міць, щоб повністю відвоювати решту континенту у тих, хто чинитиме нам опір."
 new_england_events.127.a: "Разом ми відвоюємо Америку!"

 new_england_events.128.t: "Загроза втручання [NEE.GetAdjective]"
 new_england_events.128.d: "Налякані перспективою появи синдикалістської Америки на своєму порозі, канадці та американці на північному сході — разом зі своїми британськими господарями — готуються до втручання. Ми не можемо цьому запобігти, але дехто вважає, що це можна відстрочити. Якщо ми таємно сконтактуємо та профінансуємо робітничі рухи в Новій Англії, щоб вони розпочали страйки з очевидним синдикалістським підтекстом, американці можуть занадто занепокоїтися, щоб діяти, доки страйки не будуть придушені. Це дасть нам щонайбільше кілька місяців, якщо ми продовжуватимемо. А інакше? Ми повинні готуватися до вторгнення з півночі найближчим часом."
 new_england_events.128.a: "Нехай буде так."

 NEE_delay_new_england_intervention: "Відстрочити втручання Нової Англії"
 NEE_delay_new_england_intervention_desc: "Ми не можемо запобігти втручанню уряду Нової Англії у громадянську війну... але ми можемо їх затримати. Якщо ми спонсоруємо загальнонаціональні страйки з чітким синдикалістським слідом, вони будуть зайняті внутрішніми справами і занадто налякані, щоб діяти. Однак ми зможемо зробити це лише обмежену кількість разів, перш ніж вони зрозуміють, звідки надходять кошти."

 new_england_events.129.t.first: "Початок загальнонаціонального страйку"
 new_england_events.129.t.later: "Загальнонаціональний страйк триває"
 new_england_events.129.d.first: "Лідери робітничих рухів по всій країні закликали до страйків — достатньо потужних, щоб паралізувати економіку Нової Англії та спричинити безлад по всій державі. Дехто в нашому уряді припускає, що страйки відбуваються в надто підозрілий час... це має бути спроба [WCA.GetNameDef] розпалити революцію, перш ніж ми зможемо почати діяти. Попри наміри, усі згодні, що страйки мають бути припинені, перш ніж ми зможемо думати про втручання на півдні."
 new_england_events.129.d.later: "Після короткої паузи страйки по всій країні відновилися — з посиленими закликами до Нової Англії припинити переслідування синдикалізму. Промови, написані лідерами робітників, за даними ФБР, цілком могли бути підготовлені урядом [WCA.GetAdjective]. Кажуть, скоро з'являться докази, але доки джерело фінансування страйків не виявлено, нам доведеться боротися зі страйкарями та придушити цей роздратовуючий чинник."
 new_england_events.129.a: "Як прикро."

 new_england_events.132.t: "[ENT.GetName] приймає наш запит"
 new_england_events.132.d.ACC: "Сьогодні ми отримали чудові новини від наших [ENT.GetAdjective] друзів із [ENT.Capital.GetCapitalVictoryPointName]. Наші зусилля з розбудови національної легітимності як справжніх спадкоємців Сполучених Штатів та боротьба з економічною кризою не залишилися непоміченими. Попри попередню підтримку [ACC.GetNameDef] Антантою, їхні шанси на перемогу викликають серйозні сумніви через постійні поразки. Альянс Антанти підтвердив свої відносини з нами та офіційно оголосив про підтримку нашої справи. Визнаючи нас справжньою Америкою, Антанта розпочне двотижневе виведення сил із [ACC.GetNameDef], щоб повністю спрямувати свої промислові та військові зусилля на допомогу нам у визволенні Америки. Разом із канадцями та їхніми союзниками по всьому світу ми готові відвоювати нашу улюблену країну у революціонерів та радикалів, які її відібрали!"
 new_england_events.132.d.APG: "Сьогодні ми отримали чудові новини від наших [ENT.GetAdjective] друзів із [ENT.Capital.GetCapitalVictoryPointName]. Наші зусилля з розбудови національної легітимності як справжніх спадкоємців Сполучених Штатів та боротьба з економічною кризою не залишилися непоміченими. Попри попередню підтримку [APG.GetNameDef] Антантою, їхні шанси на перемогу викликають серйозні сумніви через постійні поразки. Альянс Антанти підтвердив свої відносини з нами та офіційно оголосив про підтримку нашої справи. Визнаючи нас справжньою Америкою, Антанта розпочне двотижневе виведення сил із [APG.GetNameDef], щоб повністю спрямувати свої промислові та військові зусилля на допомогу нам у визволенні Америки. Разом із канадцями та їхніми союзниками по всьому світу ми готові відвоювати нашу улюблену країну у революціонерів та радикалів, які її відібрали!"
 new_england_events.132.d.USA: "Сьогодні ми отримали чудові новини від наших [ENT.GetAdjective] друзів із [ENT.Capital.GetCapitalVictoryPointName]. Наші зусилля з розбудови національної легітимності як справжніх спадкоємців Сполучених Штатів та боротьба з економічною кризою не залишилися непоміченими. Попри попередню підтримку [USA.GetNameDef] Антантою, їхні шанси на перемогу викликають серйозні сумніви через постійні поразки. Альянс Антанти підтвердив свої відносини з нами та офіційно оголосив про підтримку нашої справи. Визнаючи нас справжньою Америкою, Антанта розпочне двотижневе виведення сил із [USA.GetNameDef], щоб повністю спрямувати свої промислові та військові зусилля на допомогу нам у визволенні Америки. Разом із канадцями та їхніми союзниками по всьому світу ми готові відвоювати нашу улюблену країну у революціонерів та радикалів, які її відібрали!"
 new_england_events.132.d.noone: "Сьогодні ми отримали чудові новини від наших [ENT.GetAdjective] друзів із [ENT.Capital.GetCapitalVictoryPointName]. Наші зусилля з розбудови національної легітимності як справжніх спадкоємців Сполучених Штатів та боротьба з економічною кризою не залишилися непоміченими. Попри попередню відмову Антанти підтримати будь-яку сторону, шанси ворога на перемогу викликають сумніви, поки різні сили закріплюють свої здобутки. Альянс Антанти підтвердив свої відносини з нами та офіційно оголосив про підтримку нашої справи. Визнаючи нас справжньою Америкою, Антанта тепер повністю спрямує свої промислові та військові зусилля на допомогу нам у визволенні Америки. Разом із канадцями та їхніми союзниками по всьому світу ми готові відвоювати нашу улюблену країну у революціонерів та радикалів, які її відібрали!"
 new_england_events.132.a: "V — означає перемога!"

 new_england_events.133.t: "[ENT.GetName] відхиляє наш запит"
 new_england_events.133.d.ACC: "На жаль для нас, уряд [ENT.GetAdjective] не був переконаний нашими спробами заявити про свою легітимність як справжніх спадкоємців Сполучених Штатів. Посилаючись на свою відданість справі [ACC.GetNameDef], канадці, на жаль, відхилили наше прохання про підтримку. Нам доведеться перечекати і почекати, поки ми не матимемо сильнішого промислового та військового потенціалу, перш ніж знову намагатися залучити їх на свій бік. Давайте приділимо більше часу зміцненню нашої легітимності та збройних сил, щоб показати канадцям, що ми справді єдині, хто здатний відновити справжню американську демократію в Сполучених Штатах."
 new_england_events.133.d.APG: "На жаль для нас, уряд [ENT.GetAdjective] не був переконаний нашими спробами заявити про свою легітимність як справжніх спадкоємців Сполучених Штатів. Посилаючись на свою відданість справі [APG.GetNameDef], канадці, на жаль, відхилили наше прохання про підтримку. Нам доведеться перечекати і почекати, поки ми не матимемо сильнішого промислового та військового потенціалу, перш ніж знову намагатися залучити їх на свій бік. Давайте приділимо більше часу зміцненню нашої легітимності та збройних сил, щоб показати канадцям, що ми справді єдині, хто здатний відновити справжню американську демократію в Сполучених Штатах."
 new_england_events.133.d.USA: "На жаль для нас, уряд [ENT.GetAdjective] не був переконаний нашими спробами заявити про свою легітимність як справжніх спадкоємців Сполучених Штатів. Посилаючись на свою відданість справі [USA.GetNameDef], канадці, на жаль, відхилили наше прохання про підтримку. Нам доведеться перечекати і почекати, поки ми не матимемо сильнішого промислового та військового потенціалу, перш ніж знову намагатися залучити їх на свій бік. Давайте приділимо більше часу зміцненню нашої легітимності та збройних сил, щоб показати канадцям, що ми справді єдині, хто здатний відновити справжню американську демократію в Сполучених Штатах."
 new_england_events.133.d.noone: "На жаль для нас, уряд [ENT.GetAdjective] не був переконаний нашими спробами заявити про свою легітимність як справжніх спадкоємців Сполучених Штатів. Посилаючись на своє зобов’язання зосередити зусилля на трансатлантичному вторгненні, канадці, на жаль, відхилили наше прохання про підтримку. Нам доведеться перечекати і почекати, поки ми не матимемо сильнішого промислового та військового потенціалу, перш ніж знову намагатися залучити їх на свій бік. Давайте приділимо більше часу зміцненню нашої легітимності та збройних сил, щоб показати канадцям, що ми справді єдині, хто здатний відновити справжню американську демократію в Сполучених Штатах."
 new_england_events.133.a: "Яка прикрість."

#NEE-ACC
 new_england_events.134.t: "Надіслати депешу до [ACC.GetNameDef]?"
 new_england_events.134.d: "Колись визнана успішним експериментом демократії, американська нація вдруге у своїй історії розпалася у жорстокій та руйнівній громадянській війні. Попри нейтралітет міжнародної спільноти до подій у Сполучених Штатах, канадська армія перетнула американський кордон у перші ж дні війни. Для багатьох жителів Нової Англії канадське втручання в ті хаотичні часи дало надію, що північний сусід Америки прагне захистити демократію у Новому Світі.\n\nОднак, схоже, це вже не так. Можливо, у відчайдушній спробі зібрати людей для омріяного повернення британських вигнанців, запровадження канадським урядом загальної мобілізації розлютило квебекців, що призвело до масових протестів і заворушень по всій країні. Крок, який не став несподіванкою для таких демагогів, як Макартур — запровадження канадським урядом Акту про воєнні заходи — поставив на коліна перед авторитаризмом ту державу, яку багато хто вважав останньою стабільною демократією Північної Америки. Оскільки відданість Канади демократії стала сумнівною, президент [NEE.GetLeader] проконсультувався зі своїм кабінетом щодо потенційного альянсу між Тимчасовим урядом Нової Англії та [ACC.GetNameDef]. Якщо канадці не бажають захищати демократію в Новому Світі, то, можливо, єдиний демократичний фронт проти соціалізму та авторитаризму гарантує збереження свободи."
 new_england_events.134.a: "Так, надішліть повідомлення в Сакраменто!"
 new_england_events.134.b: "Ми ще не готові."

 NEE_sent_cable_ACC: "Надіслати телеграму [ACC.GetNameDef]"

 new_england_events.135.t: "[NEE.GetNameDefCap] пропонує відкрити другий фронт"
 new_england_events.135.d: "Попри спільну відданість американській демократії обох фракцій на протилежних кінцях континенту, зв'язок між [ACC.GetNameDef] та Новою Англією був слабким. Проте в Сакраменто було отримано депешу з Бостона щодо можливості спільних і рішучих зусиль для визволення Америки від терору соціалізму та авторитаризму.\n\nЗахищений присутністю канадської армії та Антанти, тимчасовий уряд Нової Англії залишався нейтральним, поки вирувала громадянська війна. З падінням Канади в авторитаризм ми більше не можемо розраховувати на те, що Антанта допоможе нам у відновленні американської демократії. Наші людські ресурси дорогоцінні, а наша здатність вести війну ніколи не зрівняється з промисловими потужностями Сталевого поясу. Альянс між Тимчасовим урядом та [ACC.GetNameDef] дає нам шанс повернути нашу країну у радикалів, які її вкрали. Звісно, розмір Нової Англії та її збройні сили можуть стати тягарем у майбутніх битвах. Ми можемо відхилити їхню пропозицію і оголосити себе єдиним законним бастіоном свободи."
 new_england_events.135.a: "Разом ми зможемо відкинути темряву!"
 new_england_events.135.b: "Нам не потрібні ваші пацифісти"

 NEE_will_enter_war_30_days: "Через §Y30 днів§! §G[NEE.GetNameWithFlag]§! вступить у §Rдругу американську громадянську війну§! на нашому боці!"

 NEE_enter_civil_war: "Дзвони Свободи лунають знову!"
 NEE_enter_civil_war_desc: "Після успішних переговорів між демократіями, що вціліли, тимчасовий уряд Нової Англії та [ACC.GetNameDef] сформували альянс для захисту майбутнього американської демократії! З такими, як Рід, Лонґ та тиранічний Макартур, слід покінчити, поки американський експеримент не стерли в порох!"

 NEE_ACC_declined_alliance: "[ACC.GetNameDefCap] не бажає вступати в союз із Новою Англією"

 new_england_events.136.t: "[ACC.GetNameDefCap] відхиляє наш союз"
 new_england_events.136.d: "З великим очікуванням ми нарешті отримали відповідь із Сакраменто. На жаль, [ACC.GetNameDef] відхилили нашу пропозицію союзу, заявивши, що мають намір об'єднати країну самостійно, і відкинули наші претензії на легітимність. Нам доведеться готувати націю до майбутньої бурі, адже, схоже, тепер ми в цьому одні."
 new_england_events.136.a: "Прикро."

 new_england_events.137.t: "[ACC.GetNameDefCap] приймає наш союз"
 new_england_events.137.d: "З великим очікуванням ми нарешті отримали відповідь із Сакраменто. У депеші президент [ACC.GetLeader] запевнив свого колегу з Нової Англії, що [ACC.GetNameDef] повністю віддана військовому союзу між Атлантичним та Тихоокеанським узбережжями для гарантування існування демократії в Північній Америці. Хоча зв'язок між двома фракціями буде важким, оскільки перед ними лежить величезний американський континент, Сакраменто та Бостон, безперечно, зберуть свої сили та ресурси для майбутньої бурі. Полум'я свободи не згасло, ні, тепер воно горить сильніше, ніж будь-коли. Ми більше не одні в цій боротьбі, разом до перемоги!"
 new_england_events.137.a: "Свобода від океану до океану!"
 new_england_events.137.tt: "\n§gЧерез 30 днів ми вступимо у війну на боці [ACC.GetNameDef]§!"

 new_england_events.138.t: "Формалізація союзу"
 new_england_events.138.d: "Сьогодні спільне військове та військово-морське керівництво [ACC.GetNameDef] та Тимчасового уряду Нової Англії зустрілося в Бостоні, щоб формалізувати союз між демократичними фракціями. Нова Англія була нейтральною у великій війні, що охопила решту нації, і багато хто вважав [ACC.GetNameDef] останнім бастіоном американської демократії. Однак падіння Канади в авторитаризм розірвало зв'язки між Новою Англією та Канадою.\n\nСлухачі радіо вздовж Східного та Західного узбережжя з очікуванням слухали новини про формування під назвою [THIS.GetFactionName] — єдиного демократичного американського фронту проти тиранічних демагогів Лонґа, Макартура та Ріда. Місяці мілітаризації, економічного полегшення та підготовки розбудили сплячого гіганта Нової Англії. Битва за свободу розпочалася."
 new_england_events.138.a: "Дзвін Свободи лунає на сполох!"

 new_england_events.139.t: "[NEE.GetNameDefCap] вступає у боротьбу"
 new_england_events.139.d: "Після успішних переговорів між Сакраменто та Бостоном, [ACC.GetNameDef] та уряд Нової Англії створили офіційний військовий союз. Нова Англія приєднається як п'ята фракція у найбільш руйнівній війні, що будь-коли відвідувала Північну Америку, офіційно об'єднавшись зі своїм сестринським урядом на протилежному узбережжі континенту. Міжнародні спостерігачі за конфліктом в Америці починають припускати, чи покладе цей подвійний альянс край конфлікту. У публічній декларації президент [NEE.GetLeader] та президент [ACC.GetLeader] оголосили світу, що їхній союз є законним наступником цінностей, традицій та спадщини колишнього уряду Сполучених Штатів."
 new_england_events.139.a: "Ми стоїмо разом із західним узбережжям!"
 new_england_events.139.b: "Ми стоїмо разом зі східним узбережжям!"
 new_england_events.139.c: "Ми розчавимо їх!"

### Flavour Events ###

# Coconut Fire
 new_england_events.150.t: "Пожежа в «Коконат-Гроув» забрала 492 життя!"
 new_england_events.150.d: "Розташований на П'ємонт-стріт, 17, у районі Бей-Вілледж у Бостоні, нічний клуб «Коконат-Гроув» був добре відомий серед бостонців як популярне місце відпочинку знаменитостей, солдатів та політиків, таких як Моріс Тобін. Ходили чутки, що заклад має зв'язки з мафією. Інтер'єр клубу був оформлений у стилі «тропічного раю» Південних морів з колонами у вигляді пальм.\n\nУвечері 28 листопада о 22:15 молодий солдат викрутив лампочку в залі, щоб усамітнитися зі своєю супутницею. Молодий офіціант намагався замінити її, але в темряві запалив сірник. Свідки повідомили, що невдовзі після цього полум'я спалахнуло на пальмовому листі під стелею. Вогонь поширювався миттєво, заповнюючи приміщення токсичним димом. Головний вхід був обладнаний єдиними револьверними дверима, які стали марними під час панічної тисняви. До прибуття пожежників 492 людини загинули. Власник клубу Барні Веланскі був засуджений за ненавмисне вбивство через нехтування правилами безпеки. Мер Бостона Моріс Тобін опинився під вогнем критики через свої зв'язки з Веланскі."
 new_england_events.150.a: "Жахлива трагедія!"

 # Суперечка за кордон VT-NH
 new_england_events.151.t: "Давню суперечку врегульовано"
 new_england_events.151.d: "Сьогодні картографи Геологічної служби зраділи: тривалий прикордонний конфлікт між Вермонтом і Нью-Гемпширом нарешті вичерпано. Нове рішення фіксує кордон між двома штатами протягом 200 миль уздовж річки Коннектикут. Юрисдикція Нью-Гемпшира тепер починається з оригінальної лінії відливу на західному березі річки. Протягом майже 150 років штати сперечалися за цю лінію, збираючи податки з одних і тих самих власників нерухомості та дискутуючи щодо контролю над мостами та електростанціями. Офіційні особи зазначають, що більшість змін у минулому відбувалися через зміну русла річок, тому тепер Геологічна служба шукатиме інші подібні ділянки, щоб уникнути конфліктів у майбутньому."
 new_england_events.151.a: "Можливо, це кінець?"

 # Візит принца Токуґави
 new_england_events.152.t: "Принц із Країни вранішнього сонця"
 new_england_events.152.d: "Незвичайного гостя помітили в резиденції Джозефа Ґрю, колишнього посла в Японії. Ним виявився принц Токуґава Іесато, перший голова клану Токуґава після реставрації Мейдзі. Незважаючи на напружені відносини між Японією та США, Іесато та Ґрю довгий час залишалися близькими друзями. Принц прибув до Нової Англії з візитом доброї волі, нагадуючи про японський подарунок — вишневі дерева у 1912 році.\n\nХоча офіційно візит був приватним, ширяться чутки, що вони обговорювали ситуацію в Тихому океані. Довгий час США та Японія змагалися за панування в цьому регіоні, але тепер, коли Америка розколота громадянською війною, японці залишилися практично без конкурентів. Навіть якщо сам Іесато прагне миру, японська нація має амбіції в Азії, які вона тепер зможе реалізувати без огляду на промислового гіганта Америки. Тільки час покаже, чи пануватиме мир в Азії."
 new_england_events.152.a: "За мир і процвітання у Східній Азії!"

 # Референдум про війну
 new_england_events.153.t: "Референдум про війну відхилено в Палаті представників"
 new_england_events.153.d: "Адміністрація Конгресу Нової Англії зіткнулася з несподіваною пропозицією: законопроєктом про проведення національного референдуму перед тим, як Конгрес зможе оголосити війну. Це дало б пересічним громадянам право прямого голосу щодо участі країни в іноземних конфліктах. Багато ірландсько-американських делегатів підтримали законопроєкт, сподіваючись, що це допоможе Новій Англії уникнути допомоги колишній Британській імперії, пам'ять про конфлікти з якою ще свіжа.\n\nПроте конгресмен Джеймс Фарлі згуртував своїх колег, щоб заблокувати ініціативу. Фарлі переконаний, що місце Америки — у світових справах, а не в ізоляції. Цікаво, що серед підписантів петиції виявили ім'я Вільяма П. Коннері-молодшого, який на момент подання документа вже помер. Питання про законність підпису померлого члена Палати залишилося відкритим, але сам законопроєкт було остаточно відхилено."
 new_england_events.153.a: "Такі питання має контролювати уряд."

 # Нещасний випадок із вантажівкою
 new_england_events.154.t: "Сміттєвоз скалічив трьох людей"
 new_england_events.154.d: "Сьогодні стався жахливий нещасний випадок: троє солдатів були збиті вантажівкою для збору брухту. Постраждалі — Аарон Рівенович, Томас Луццо та Майкл Маліто, біженці з Нью-Йорка, які вступили до армії тимчасового уряду. Інцидент стався, коли вони поверталися з Порт-Онтаріо, важливої військової бази та табору для біженців.\n\nУсі троє отримали важкі поранення, у Луццо зафіксовано перелом руки. Водія вантажівки затримали за звинуваченням у нападі третього ступеня та неналежному завантаженні машини. Влада штату Нью-Йорк пообіцяла посилити стандарти транспортування відходів, щоб подібне не повторилося."
 new_england_events.154.a: "Не зовсім чиста поїздка."

# Kennedy Recalled
 new_england_events.155.t: "Посла Кеннеді відкликано"
 new_england_events.155.d: "Сьогодні у зовнішньополітичних відомствах відбулися зміни: Джозеф П. Кеннеді-старший, посол при канадському уряді, був офіційно відкликаний і замінений Джоном Вайнантом.\n\nВідкликання відбулося після того, як пан Кеннеді дав розлоге та плутане інтерв'ю журналісту Луї М. Лайонсу з «Boston Globe» щодо зобов'язань Нової Англії перед Антантою. У своїй промові колишній посол однозначно і неодноразово заявляв про своє переконання, що війна за визволення батьківщини британців не має нічого спільного з порятунком демократії від хвилі синдикалізму.\n\n«Усе питання в тому, що ми робитимемо наступні шість місяців. Єдина причина допомагати Канаді — це дати нам час... поки вона там б'ється, ми маємо час на підготовку. Справа не в тому, що вона бореться за демократію. Це нісенітниця. Вона бореться за відновлення монархії над підданими, які її відкинули. Я знаю про європейську ситуацію більше, ніж будь-хто інший, і мій обов'язок — донести це до країни».\n\nСлова пана Кеннеді викликали лише обурення у президента Нової Англії та канадського уряду. Президент замінив Кеннеді Джоном Вайнантом, колишнім губернатором Нью-Гемпшира. У своїй першій офіційній заяві на посаді посла в домініоні Канада Вайнант заявив, що «ми, народ Нової Англії, сповнені рішучості діяти, щоб забезпечити повну перемогу над соціалістичною агресією». Знаменуючи період зміцнення американсько-канадських зв'язків, Вайнант підкреслив, що між канадцями та американцями існує «зв'язок спільної симпатії та розуміння, спільної мети та відданості, який житиме ще довго після падіння синдикалістської тиранії»."
 new_england_events.155.a: "Вайнант впорається краще!"

 # Боротьба за валютні повноваження
 new_england_events.156.t: "Боротьба проти повноважень [NEE.GetLeader] щодо валюти"
 new_england_events.156.d: "Поки тимчасовий уряд Нової Англії намагається відбудувати економіку після років Великої депресії, питання повноважень президента щодо валюти неодноразово піднімалося в дебатах у Конгресі. Міністр торгівлі Чарльз В. Тобі та віцепрезидент Г. Стайлз Бріджес підготували спільну резолюцію про скасування права президента [NEE.GetLeader] випускати до 3 000 000 доларів додаткової паперової валюти. Вони заявили, що ця прихована влада може загрожувати дрібним інвесторам, власникам страховок, найманим працівникам та особам із фіксованим доходом. Крім того, резолюція планує стримати інфляцію шляхом введення суворіших обмежень на те, хто і скільки грошей може друкувати одночасно."
 new_england_events.156.a: "До більш стриманого бюджету!"

 # Гопкінс під вогнем
 new_england_events.157.t: "Гопкінс під вогнем критики"
 new_england_events.157.d: "З лікарняного ліжка в окружній лікарні Норт-Каунті, де він одужує після інфекції горла, міністр торгівлі Гаррі Л. Гопкінс знову відповів «категоричне ні» на звинувачення в тому, що він належить до Соціалістичної партії Америки. Останніми днями Гопкінс опинився під вогнем критики в Конгресі через впровадження програм допомоги WPA — деякі конгресмени називають його синдикалістом в овечій шкірі.\n\nУ промові в Палаті представників демократ Джон Дж. Коннор заявив, що «голова одного з наших великих департаментів є зареєстрованим соціалістом». Коли Коннора запитали, чи має він на увазі Гопкінса, той лише знизав плечима. Цей інцидент ілюструє параною серед конгресменів щодо так званої «червоної загрози». Фіскальні консерватори з острахом дивляться на зростаючу роль уряду в економіці та вбачають у соціалізмі головного ворога нації. По всій Новій Англії в приватних розмовах це масове божевілля називають «червоною панікою», а дехто навіть жартує, що «краще бути мертвим, ніж червоним»."
 new_england_events.157.a: "Невже люди Ріда дісталися високих кабінетів?"

 # WPA Гопкінса
 new_england_events.158.t: "Управління громадських робіт під керівництвом Гопкінса"
 new_england_events.158.d: "У відповідь на тривалі економічні труднощі Великої депресії міністр торгівлі Гаррі Л. Гопкінс оголосив про додаткове підвищення заробітної плати для працівників за угодами Управління громадських робіт (WPA) у сільських районах Вермонту, Нью-Гемпшира та Мену. Програма встановлює нову ставку в розмірі 3,90 долара на місяць для понад 82 000 працівників.\n\nГопкінс стверджує, що в сільських районах Нової Англії заробіток становить лише 45% від середнього по країні, а з цим підвищенням він сягне 53%. Це створює враження певної недоплати на Півночі за лінією WPA. Проте опозиційні конгресмени вважають законодавство Гопкінса занадто радикальним втручанням у ринок. Щоб розвіяти сумніви, Гопкінс допоміг організувати Громадську мобілізацію для людських потреб — організацію, що займається розподілом витрат на допомогу між місцевими, штатними та федеральними урядами."
 new_england_events.158.a: "Справедлива зарплата!"

 # Водний шлях Святого Лаврентія

 new_england_events.159.t: "Пакт про глибоководний шлях Святого Лаврентія"
 new_england_events.159.d: "Сьогодні на короткій конференції в районі річки Святого Лаврентія у Канаді зустрілися канадські та американські інженери для обговорення двоетапного плану розвитку енергетики. Президент [NEE.GetLeader] зустрівся з прем'єр-міністром Канади, щоб обговорити промисловий проєкт, накреслений Об'єднаною радою інженерів ще у 1926 році.\n\nПроєкт передбачає будівництво дамби на острові Барнгарт з однією електростанцією біля Массени, штат Нью-Йорк, на американській стороні, та іншою — у Корнуоллі на канадській стороні. Хоча плани вже готові, невідомо, коли саме почнеться будівництво. Успішне завершення зустрічі та дружня атмосфера, однак, зміцнили відносини між двома країнами, і немає сумнівів, що майбутнє принесе ще тіснішу співпрацю."
 new_england_events.159.a: "Ворота у майбутнє!"

 # Вайнант стоїть на своєму
 new_england_events.160.t: "Боротьба посла Вайнанта за демократію"
 new_england_events.160.d: "На конференції в Монреалі Джон Вайнант, видатний посол США в Канаді, виступив із промовою, у якій вихваляв цілі Антанти. Британські домініони та їхні союзники разом борються проти системи, що є збоченням соціальної справедливості. Соціалісти, які зараз контролюють Велику Британію, зайшли занадто далеко у гонитві за благородним ідеалом. Прагнучи підняти робітничий клас, вони зруйнували природний лад суспільства і перевернули світ догори дриґом.\n\nДивлячись у майбутнє, він сказав, що коли війна закінчиться і зброю буде складено, він сподівається, що народи не лише Британії, а й усього світу відбудують демократію в досконалішому вигляді, ніж будь-коли раніше."
 new_england_events.160.a: "За демократію!"

 # Летам нагороджена
 new_england_events.161.t: "Місіс Летам удостоєна честі від [GBR.GetLeader]"
 new_england_events.161.d: "На урочистій церемонії в Лондоні король [GBR.GetLeader] нагородив місіс Летам медаллю Командора ордена Британської імперії за її роботу в товаристві іноземної допомоги «Пакунки для Британії». Це перший випадок в історії, коли небританський підданий отримав таку честь.\n\nВ інтерв'ю місіс Летам зазначила: «Уся Англія невимовно вдячна за допомогу, надіслану Сполученими Штатами. Шлях до перемоги над соціалізмом вибудовується вашою щедрістю». З наближенням першої зими після падіння Союзу Британії на острові виникне величезна потреба у теплому одязі для постраждалого населення."
 new_england_events.161.a: "Разом ми це подолаємо!"

 # Перегляд SSA Снеллом

 new_england_events.162.t: "Перегляд Акта про соціальне забезпечення"
 new_england_events.162.d: "У межах масштабного перегляду Акта про соціальне забезпечення міністр торгівлі Бертран Снелл фактично скасував низку положень, наданих попередньою редакцією закону. Снелл запевнив, що це «усуне непотрібні резервні фонди», але водночас пообіцяв, що зміни відбудуться «без послаблення виплат за Актом».\n\nЗапроваджений як частина «другого квадратного курсу», Акт про соціальне забезпечення передбачав прямі виплати літнім людям, які потерпали від Великої депресії. Пізніше програму розширили, включивши страхування на випадок безробіття та національну програму охорони здоров'я. Проте зараз, коли депресія стала далеким спогадом, згортання частини програм викликало обурення громадян, які все ще залежать від системи. За словами Снелла, поправка покликана запобігти «марнотратним розбратам між роботодавцями, працівниками та профспілками» і допомогти бізнесу створювати робочі місця з упевненістю у майбутньому."
 new_england_events.162.a: "До більш відповідального врядування!"

# National Church Association Incorporated
 new_england_events.163.t: "Засновано Національну церковну асоціацію"
 new_england_events.163.d: "Американський підприємець, економіст і теоретик бізнесу — міністр торгівлі Роджер Бебсон — сприяв створенню своєї так званої «Національної церковної асоціації», волонтерської мережі, де люди будь-якої віри матимуть місце для молитви.\n\nПредставник десятого покоління жителів Нової Англії, Бебсон ретельно дослідив своїх предків, виявивши, що походить із роду фермерів, купців та капітанів далекого плавання. Вірячи в спадковість рис, Бебсон сподівається наслідувати життя своїх пращурів у словах і діях. Після навчання в Массачусетському технологічному інституті та роботи над дорожніми проєктами він присвятив себе кар'єрі інвестиційного банкіра. Його кар'єра розширилася до економічного консультування — він став блискучим фінансовим прогнозистом, який першим передбачив німецький економічний колапс у «чорний понеділок».\n\nПереживши діагноз туберкульозу, Бебсон приписує своє одужання непохитній вірі. З 1936 по 1938 рік він служив національним церковним модератором конгрегаціоналістських християнських церков. На цій посаді він використовував статистику, щоб показати слабку відвідуваність церков, побоюючись, що це призведе до занепаду моралі в суспільстві. Його заклики до морального курсу зустріли опір, що призвело до розчарування.\n\nПроте Бебсон відмовляється здаватися. Тепер, як міністр торгівлі, він розробив курс на відкриття дверей церков щодня і щогодини. Церкви Бебсона будуть відкриті для людей усіх віросповідань, щоб кожен мав простір для поклоніння Всевишньому. Відкриття першого такого закладу у Веллслі, штат Массачусетс, стане першим із багатьох кроків до свободи віросповідання для всіх американців."
 new_england_events.163.a: "Нехай уся Америка об'єднається у вірі!"

 # Помірна програма сухого закону
 new_england_events.164.t: "Помірна програма сухого закону"
 new_england_events.164.d: "Увійшовши у світ політики, Бебсон та його прихильники почали наполягати на створенні морально консервативного суспільства. Сам Бебсон давно належить до Партії заборони і висловлює палке бажання повернути Америку до її «морального минулого».\n\nЧлени його партії вірять у заборону азартних ігор, алкоголю, наркотиків, порнографії та інших непристойних видань. Партія також висловила бажання прийняти закони про збереження природних ресурсів, скорочення боргу та оподаткування, а також допомогу фермерам. Як новий міністр торгівлі, Бебсон використав свою платформу, щоб засудити «занепад морального ладу» Америки та закликати людей повернутися до церков.\n\nХоча повна заборона вад найближчим часом навряд чи стане реальністю, партія Бебсона здобула перемогу завдяки новому законодавству, що обіцяє допомогу дрібним сільським фермерам. Вони отримають державні стимули та зниження податків. Бебсон визнав, що розмір його партії не дозволяє їй конкурувати з демократами та республіканцями, але висловив сподівання, що народ Америки помітить його рух."
 new_england_events.164.a: "Третє велике пробудження?"

 # Смерть посла Моффата
 new_england_events.165.t: "Смерть посла Моффата"
 new_england_events.165.d: "Сьогодні, 25 січня 1943 року, сумний день: пішов із життя посол у Канаді Джей П'єрпонт Моффат. Лише через два з половиною тижні після свого 47-річчя посол помер від ускладнень після операції.\n\nНароджений 7 січня 1896 року в Раї, штат Нью-Йорк, Моффат був прямим нащадком знаменитого Джона Джея, першого голови Верховного суду та учасника переговорів щодо Паризького договору. Професійний дипломат, Моффат служив секретарем послів США в Нідерландах, Польщі та Японії. У 1927 році він одружився з Лілою Кебот Ґрю, донькою американського дипломата Джозефа К. Ґрю.\n\nЗ 1940 року Моффат обіймав посаду посла в Канаді, згладжуючи розбіжності між американським та канадським урядами. У некролозі «New York Times» зазначає, що «навіть під час війни втрата надійної публічної людини в розквіті сил є прикрою подією». На його похороні в соборі Крайст-Черч були присутні прем'єр-міністр Канади та інші офіційні особи. Президент [NEE.GetLeader] висловив співчуття родині Моффат і оголосив про призначення Рея Атертона наступним послом."
 new_england_events.165.a: "Трагічна втрата."

 # Митна поправка Ноубла
 new_england_events.166.t: "Едвард Ноубл пропонує митну поправку"
 new_england_events.166.d: "За ініціативи міністра торгівлі Едварда Ноубла було висунуто Акт про взаємні тарифи [GetYear] року, який надає президенту право вести переговори з іноземними державами про зниження тарифів в обмін на аналогічні зниження в США до 50%.\n\nПідписаний президентом [NEE.GetLeader], закон дозволить вести двосторонні торговельні переговори, приносячи лібералізацію в американську торговельну політику. З часів першої громадянської війни тарифи в США були рекордно високими як відповідь на Велику депресію та протекціонізм. Акт про взаємні тарифи має на меті зруйнувати ці бар'єри та заохотити торгівлю.\n\nРаніше Конгрес діяв односторонньо, і на членів Конгресу чинився величезний тиск з боку лобістів. Тепер Акт про взаємні тарифи пов'язує зниження американських мит із іноземними поступками, даючи Конгресу можливість затверджувати тарифи простою більшістю голосів. Оскільки президент отримав право домовлятися про умови, ми, безперечно, побачимо більш ліберальну політику найближчим часом."
 new_england_events.166.a: "Торгівля приносить процвітання!"

 # Шосе Вілбура Кросса
 new_england_events.167.t: "Шосе Вілбура Кросса"
 new_england_events.167.d: "Досягнуто стрімкого прогресу в будівництві «Шосе Вілбура Кросса» — чотирисмугової магістралі, що з'єднує шосе Меррітт через річку Гусатонік на межі Мілфорда та Стемфорда. Названий на честь колишнього губернатора Коннектикуту та тимчасового президента Нової Англії Вілбура Кросса, проєкт покликаний розширити інфраструктуру штату та зменшити затори. Цей амбітний задум включає найдовший автомобільний тунель у всій Новій Англії.\n\nПерша ділянка шосе, що є продовженням траси Меррітт, була відкрита на День праці минулого року. Оскільки будівництво починає з'єднувати штат Коннектикут («штат мускатного горіха») та штат Массачусетс («штат затоки»), інженери сподіваються на активне використання магістралі автомобілістами. Відкриття маршруту вже демонструє стабільне зростання кількості машин, що дозволяє сподіватися на безпечний швидкісний рух у майбутньому."
 new_england_events.167.a: "На честь губернатора Кросса!"

 # Даллес проти Інтернаціоналу
 new_england_events.168.t: "Держсекретар Даллес виступає проти Третього Інтернаціоналу"
 new_england_events.168.d: "Виконувач обов'язків державного секретаря [NEE.GetNameDef] Джон Фостер Даллес щойно виголосив полум'яну промову. Він засудив тоталітарні режими за океаном, які тримають народи Європи в кайданах. Їхнє суспільство є глибоко матеріалістичним, атеїстичним і далеким від концепції морального закону. Замість цього вони стверджують, що закони — це лише засіб, за допомогою якого влада здійснює свою волю. Дані Богом невід'ємні права для них є чужим поняттям.\n\nХоча для пролетаріату в заморських країнах було зроблено дещо корисне, це стало можливим лише через примус, тероризм і ліквідацію тих, чия совість змушувала їх чинити опір. Хоча кінцеві цілі соціалістичних держав Європи та Америки можуть здаватися схожими, методи їх досягнення кардинально різняться.\n\nТоталітарні режими в Європі не є урядами миру та визволення, як би вони не намагалися переконати світ своєю пропагандою. Ми повинні залишатися пильними, щоб іноземні агенти не змогли посіяти зерна класової війни серед вільних громадян Заходу."
 new_england_events.168.a: "Ми не можемо дозволити їм перемогти!"

 # Даллес проти самозаспокоєння
 new_england_events.169.t: "Боротьба Нової Англії проти самозаспокоєння"
 new_england_events.169.d: "Америка ніколи не повинна дозволити опозиційним силам змусити себе захищати статус-кво, заявив Джон Даллес на зборах у Скенектаді, штат Нью-Йорк. Сила західного лібералізму та демократії полягає в здатності приносити мирні зміни на благо суспільства. [NEE.GetNameDefCap] не може дозволити собі чіплятися за минуле лише тому, що старі рішення колись були надійними. Інновації та ризики завжди були рушіями світового розвитку.\n\nЗа останні 150 років політичні інститути вільних західних суспільств принесли такі колосальні соціальні та економічні стрибки, в які люди минулого навряд чи могли б повірити. Якщо нація [NEE.GetAdjective] стане самозаспокоєною, вона втратить довіру тих, хто бачить недосконалості моделі та прагне відкрити нові інноваційні шляхи для створення кращого світу, де їхні мрії зможуть здійснитися."
 new_england_events.169.a: "Нехай горнило ніколи не згасне!"

 # Департамент невійськової оборони
 new_england_events.170.t: "Сформовано Департамент невійськової оборони"
 new_england_events.170.d: "Сьогодні було оголошено про створення нового відомства [NEE.GetNameDef]. Цьому федеральному департаменту буде доручено забезпечувати захист нації від іноземних держав, які бажають дестабілізувати [NEE.GetNameDef] зсередини. Поки військова міць країни зростає, не можна недооцінювати важливість психологічної війни. Оскільки сучасна зброя стає все руйнівнішою, необхідним стає хірургічно точний «скальпель». Немає потреби спалювати весь будинок, щоб впіймати одну мишу, якщо кіт може зробити це без зайвого шуму. Департамент невійськової оборони також уповноважений транслювати точну інформацію про події на світовій арені."
 new_england_events.170.a: "Пильне око над власним подвір'ям."

# Weeks Highway Act
 new_england_events.171.t: "Вікс забезпечує фінансування дорожнього акта [GetYear] року"
 new_england_events.171.d: "Міністру торгівлі Сінклеру Віксу президент [NEE.GetLeader] доручив забезпечити фінансування Федерального акта про автомагістралі та оборону. Жахи другої американської громадянської війни виявили жахливий стан трансконтинентального сполучення. Хоча було зроблено певні покращення для постачання армій, час перетину Сполучених Штатів підрозділом залишається майже таким самим, як у 1919 році. Оскільки більшість проектів реконструкції завершуються, Вікс зміг отримати схвалення Конгресу на введення федерального податку на бензин для розширення системи міжштатних автомагістралей. Акт передбачає тринадцятирічну програму будівництва 41 000 миль сучасних доріг для цивільного та військового використання, субсидованих урядом до 90%."
 new_england_events.171.a: "Сподіваюся, це скоротить мій шлях на роботу!"

 # Користь британських позик
 new_england_events.172.t: "Наголошено на користі британських позик"
 new_england_events.172.d: "Міністр торгівлі [NEE.GetNameDef] виступив сьогодні на захист позики, наданої Великій Британії. Така позика допоможе відновити світову торгівлю, яка постраждала через крах британського, американського та німецького ринків у попередні десятиліття. Коли країни перейшли до політики економії, глобальна співпраця різко пішла на спад. Крім того, конфлікт Другої світової війни змусив фракції намагатися монополізувати ринки ресурсів лише для себе. Ця позика у 3,75 мільярда доларів допоможе покращити світову торгівлю, оскільки дозволить продавати товари у Британії за готівку, яку можна буде використати для купівлі товарів."
 new_england_events.172.a: "Ми повинні прагнути бути добрими сусідами."

 # Гарріман обіцяє допомогу
 new_england_events.173.t: "Гарріман обіцяє допомогу Британії"
 new_england_events.173.d: "Міста Великої Британії залишилися в руїнах після завершення Другого Вельткріґу. Лондон, Манчестер і Ліверпуль були понівечені та розбиті. Боротьба проти синдикалістської загрози була переможною, але ціна виявилася болісною. Американська преса щодня транслює сцени жахливого становища британців: сім'ї, затиснуті в бомбосховищах, та нескінченні пожежі.\n\nАмериканський посол у Канаді В. Аверелл Гарріман оголосив сьогодні, що американське посольство планує приділити «максимальну увагу» негайній допомозі Сполученому Королівству. На своїй першій конференції як посла він підтвердив повну відданість США відновленню Великої Британії: «Американський народ глибоко співчуває британцям, які так багато витерпіли. Ми задіємо заводи для виробництва обладнання, необхідного Сполученому Королівству. Таким чином ми допоможемо нашим людям перейти від військового до мирного виробництва»."
 new_england_events.173.a: "Разом до процвітання!"

 # Атертон закликає до єдності
 new_england_events.174.t: "Атертон закликає до єдності"
 new_england_events.174.d: "Сьогодні посол у Канаді Рей Атертон заявив у прес-релізі в Оттаві, що «післявоєнний світ повинен досягти інтернаціоналізму або зануритися в хаос темних віків, яких ми ще не знали». На противагу закликам до ізоляції, риторика Атертона закликає вільні нації світу працювати разом.\n\nУ своїй заяві він зазначив, що інтернаціоналізм виражатиметься в економіці та політиці, але обидві вони є «дітьми освіти». Стверджуючи, що освіта є єдиним засобом подолання спокуси соціалізму, він сказав: «якщо злі ідеї та гріхи соціалізму житимуть далі, якщо вони проникнуть у наше власне суспільство, якщо ми допустимо радикалізм і терор, то синдикалістська філософія врешті-решт переможе»."
 new_england_events.174.a: "Разом ми сильніші!"

 # Контроверсійний план Морґентау
 new_england_events.175.t: "Морґентау представляє суперечливий план роззброєння"
 new_england_events.175.d.puppetger: "Завершення Вельткріґу проти Третього Інтернаціоналу не принесло миру в Європу; натомість [NEE.GetNameDef] опинилася у стані війни з Німецькою імперією. У своїй третій великій війні німецький Кайзеррайх нарешті втратив своє місце під сонцем, і почалася американська окупація Німеччини.\n\nМіністр Генрі Морґентау оголосив свій «План Морґентау», щоб гарантувати, що Німеччина ніколи більше не зможе вести війну. Його програма роззброєння має на меті скалічити Німеччину на покоління. Рур — серце німецької індустрії — має бути позбавлений усіх заводів. Морґентау не приховує бажання перетворити Німеччину на аграрну країну, що викликало суперечки серед американського керівництва. Деякі експерти вважають, що план призведе до голоду мільйонів німців. Події минулого Вельткріґу показали, що переможені нації плекають лише образу, а багато хто остерігається гніву втомленого німецького населення. Доля Німеччини залишається предметом дебатів."
 new_england_events.175.d.notpuppetger: "Завершення Вельткріґу проти Третього Інтернаціоналу не принесло миру в Європу; натомість [NEE.GetName] опинилася у стані війни з Німецькою імперією. Тепер, разом зі своїми союзниками, [NEE.GetNameDef] планує допомогти в окупації та стабілізації Німеччини.\n\nМіністр Генрі Морґентау оголосив свій «План Морґентау», щоб гарантувати, що Німеччина ніколи більше не зможе вести війну. Він прагне повністю демонтувати індустріальний потенціал Руру. Однак виникли серйозні суперечки щодо гуманітарних наслідків плану. Події минулого століття показали, що надмірна жорстокість породжує лише жагу до помсти. Союзники Америки виснажені роками війни, і, незважаючи на аргументи Морґентау, план фактично був відкладений. Хоча умови окупації ще не визначені, вони, ймовірно, будуть менш суворими, ніж пропонував Морґентау."
 new_england_events.175.a: "Німцям не можна довіряти!"
 new_england_events.175.b: "Як він міг таке сказати!"

 # Кабінет мудреців
 new_england_events.176.t: "Сформовано Кабінет мудреців"
 new_england_events.176.d: "Зі зміною політичного порядку президент [NEE.GetLeader] створив унікальний позаідеологічний та позапартійний кабінет для вирішення світових проблем. Двоє з нових членів — Дін Ачесон та В. Аверелл Гарріман — знайомі ще з часів навчання в Єлі. До них приєднався Чарльз Е. Болен, досвідчений дипломат, який працював із синдикалістським режимом Франції.\n\nГрупа була сформована через брак досвіду президента у зовнішній політиці. Члени кабінету прагнуть прагматичного американського інтернаціоналізму та уникають ідеологічного фанатизму. Повідомляється, що президент високо цінує їхні поради, особливо щодо стримування синдикалізму від отруєння решти вільних націй світу. Можна припустити, що наступні президенти також користуватимуться послугами цих «мудреців» зовнішньої дипломатії."
 new_england_events.176.a: "Тепер до справжньої роботи!"

 # Авіакатастрофа Штайнгардта
 new_england_events.177.t: "Посол Штайнгардт та ще четверо людей загинули в авіакатастрофі в Канаді"
 new_england_events.177.d: "Трагічні новини надійшли сьогодні: посол Лоуренс А. Штайнгардт загинув в авіакатастрофі поблизу Рамзейвіля. Літак C-47, що прямував до Нью-Йорка, загорівся невдовзі після вильоту з аеропорту Роккліфф. Свідки бачили густий дим перед тим, як літак вибухнув. Лише одному американському військовослужбовцю вдалося врятуватися з парашутом. Наразі інцидент розслідується Королівськими ПС Канади та групою слідчих із [NEE.Capital.GetCapitalVictoryPointName].\n\nШтайнгардт виріс у Нью-Йорку, був членом Республіканської партії та близьким другом президента Болдуіна. Після повернення додому через громадянську війну він запропонував свої послуги Тимчасовому уряду. До свого останнього призначення в Канаді він служив послом США в [RUS.GetName]."
 new_england_events.177.a: "Memento Mori"

 # Мости Борн та Сагамор
 new_england_events.178.t: "З'єднання Кейп-Код з континентом"
 new_england_events.178.d: "З моменту завершення будівництва каналу Кейп-Код під час першого Вельткріґу сонні рибальські громади півострова Кейп-Код були офіційно відрізані від материкової частини Массачусетсу. Однак завдяки новим інфраструктурним проєктам громади півострова знову з'єднані з рештою штату. Спекулянти вже починають скуповувати нерухомість уздовж узбережжя, готуючись до обіцяного повоєнного туристичного буму. Для місцевих жителів високі металеві силуети мостів Борн та Сагамор є провісниками нової ери, яка принесе великі зміни цим тихим берегам."
 new_england_events.178.a: "Наступний крок — міст до Нантакета!"

 # Похоронний дзвін для клану Мену
 new_england_events.179.t: "Похоронний дзвін для клану Мену"
 new_england_events.179.d: "Найпівнічніший штат Мен довгий час вважався краєм поміркованості та спокою. Проте в останні роки хвиля імміграції з французької Канади порушила цей спокій. Зі зростанням католицької громади протестантська більшість почала звертатися до лідера Ку-клукс-клану Ф. Юджина Фарнсворта, чия мережа впливу загрожувала поглинути Республіканську партію штату.\n\nНапруженість сягнула піку в 1926 році, коли фракція республіканців, прихильних до клану, на чолі з губернатором Оуеном Брюстером зазнала поразки від старої гвардії партії, яка об'єдналася з демократами. Після цієї поразки клан Мену зазнав юридичних та фінансових невдач, що призвело до його краху. Хоча сам клан майже зник, його спадщина залишається в особі деяких шерифів та адміністраторів. Офіційно ж від організації залишилися лише «Жінки клану», які фінансують місцеві осередки через благодійні розпродажі випічки."
 new_england_events.179.a: "Я утримаюся від «кланової запіканки», дякую..."

# Frances Perkins #CB
 new_england_events.180.t: "Міністр торгівлі критикує умови на Півдні"
 new_england_events.180.d: "Жорстоко спустошена жахами сучасної війни, значна частина Півдня лежить у руїнах після завершення громадянської війни. Сільськогосподарський Південь потребує значно масштабнішої відбудови порівняно з рештою країни, оскільки тисячі людей залишилися без даху над головою та засобів до існування після своєї другої поразки в новітній історії.\n\nМіністр торгівлі Френсіс Перкінс закликала до впровадження вищих стандартів праці в новому суспільному ладі Півдня. До неї приєднався захисник соціальної справедливості Френсіс Дж. Гаас, прихильник системи професійних трудових груп, подібної до тієї, що була встановлена на американських залізницях — де керівництво та робітники є механізмом здорового суспільного порядку. Під час панельної дискусії у Вірджинії вони обговорили працю, сімейне життя та промисловість у повоєнному регіоні.\n\nПеркінс, зокрема, наголосила, що довійськові трудові норми були «неадекватними». Вона заявила, що незалежно від проблем виживання, нація повинна присвятити частину ресурсів плануванню повоєнного періоду. Також вона зазначила, що необхідно значно розширити державну «відповідальність» у сферах охорони здоров'я, харчування та житлового будівництва."
 new_england_events.180.a: "Південь не можна залишати напризволяще!"

 # Створення Національного лижного патруля
 new_england_events.181.t: "Створення Національного лижного патруля"
 new_england_events.181.d: "Трагедії на лижних трасах змінили світогляд аматора та страхового агента Чарльза Мінота Доула у 1936 році, що спонукало його очолити національну організацію, присвячену безпеці та порятунку. Під час поїздки до Вермонту Доул зламав щиколотку, і його врятував лише випадок. Через два місяці його друг Френк Едсон загинув після падіння на трасі, що справило незабутнє враження на Доула.\n\nПрезидент Національної лижної асоціації Роджер Ленґлі попросив Доула очолити дослідження нещасних випадків і організувати патрулі для перегонів 1938 року. Успіх цього проєкту переконав Ленґлі доручити Доулу створення тимчасового патруля на національному рівні. Доул надихався швейцарським досвідом, але, на відміну від швейцарців, американські патрульні не брали плату за порятунок. Його «Національний лижний патруль» діє під девізом «Служба та безпека». Організація є повністю добровільною, тому Доул створив програму нагород за навички лідерства, першої допомоги, альпінізму та протилавинної підготовки."
 new_england_events.181.a: "Ми дбаємо один про одного!"

 # Ачесон відмовляється скорочувати допомогу
 new_england_events.182.t: "Держсекретар Ачесон відмовляється скорочувати допомогу"
 new_england_events.182.d: "Підтверджуючи відданість Антанті, державний секретар Дін Ачесон оголосив сьогодні, що попри заклики до економії, [NEE.GetName] продовжуватиме підтримувати Францію та Британію. Поки американська допомога тече до понівеченої війною Європи, ізоляціоністи вимагають припинити ці зусилля, стверджуючи, що європейці нібито «ледачі» та лише покладаються на підтримку США.\n\nАчесон заперечив критикам, вказавши на зростання виробництва у Франції та Британії ще до війни. Він застеріг, що якщо [NEE.GetNameDef] відмовиться допомогти урядам Західної Європи відновити порядок, їхні громадяни можуть знову піддатися спокусливим закликам синдикалізму та соціалізму. Для Ачесона продовження поставок допомоги є відображенням непохитної відданості Америки глобальній демократії та свободі."
 new_england_events.182.a: "Їм потрібна наша допомога!"

 # Веллс закликає до смерті ізоляціонізму
 new_england_events.183.t: "Веллс закликає покінчити з ізоляціонізмом"
 new_england_events.183.d: "Історія Сполучених Штатів довела марність ізоляціоністської позиції. Хоча цей тренд допоміг уникнути загибелі молоді на полях Фландрії під час європейської сутички, глобальні інтереси Америки були зруйновані. Крах Французької республіки та розпад Британської імперії разом із обвалом фондових ринків стали найтемнішою годиною США. Коли німці витіснили американців із європейського ринку, а союзники пали під ударами соціалістів, США закрилися в собі, намагаючись перечекати бурю. Цей відхід призвів до того, що вогонь другої громадянської війни врешті-решт поглинув країну.\n\nУ промові для «New York Times» державний секретар Самнер Веллс заявив: «Ізоляція у її колишньому вигляді мертва». Якщо Америка хоче бачити процвітання у світі, вона не може досягти цього, залишаючись у межах своїх кордонів. Америка повинна активно шукати союзників і розширювати свою сферу впливу. Безпека майбутнього досягається діями, а не словами. Тільки тоді світ пізнає силу демократії, яка десятиліттями в'янула перед обличчям авторитаризму та соціалізму."
 new_england_events.183.a: "Бути ізольованим — значить бути сліпим."

 # Законопроєкт про питання в переписі
 new_england_events.184.t: "Перепис вимагатиме відомостей про минулі зв'язки з радикалами"
 new_england_events.184.d: "Департамент юстиції подав пропозицію на розгляд президенту [NEE.GetLeader]. Згідно з нею, результати майбутнього перепису будуть негайно доступні ФБР, морській розвідці та розвідувальному управлінню Військового департаменту. Дані про попередню приналежність до радикальних груп, таких як рух «Розділимо наше багатство» або Соціалістична партія Америки, стануть відомі спецслужбам. Прихильники ідеї стверджують, що це дозволить швидко виявляти потенційних паліїв заворушень. Проте відомий політик Чарльз Тобі назвав цю ініціативу спробою «перетворити перепис 1940 року на найповніший поліцейський список в історії світу». Доля проєкту тепер у руках президента."
 new_england_events.184.a: "Схвалити пропозицію."
 new_england_events.184.b: "Такий законопроєкт не є американським!"

 # Нова столиця Америки
 new_england_events.185.t: "Нова столиця Америки?"
 new_england_events.185.d: "Колись велична столиця перетворилася на руїни під час громадянської війни. Вдруге в історії могутні авеню та монументи міста стали лише тінню свого минулого. Жорстокі вуличні бої перетворили кожну будівлю на фортецю — сумна доля для серця американської демократії.\n\nЗ відновленням порядку та світовим визнанням возз'єднаних Сполучених Штатів Америки постало питання про столицю. Незважаючи на руйнування, Вашингтон залишається потужним кандидатом, адже повернення президента до Білого дому легітимізує уряд Нової Англії як спадкоємця США. З іншого боку, Бостон — колиска Американської революції та тимчасова столиця в найтемніші часи — також має вагомі аргументи. Зрештою, існує пропозиція перенести столицю на захід, у центр країни. Сент-Луїс давно є мостом між Сходом і Заходом і міг би ідеально підійти для такої великої нації."
 new_england_events.185.a: "Вашингтон, округ Колумбія"
 new_england_events.185.b: "Бостон"
 new_england_events.185.c: "Сент-Луїс."

 # Елеонора Рузвельт
 new_england_events.186.t: "Підприємства Вал-Кілл ледь тримаються"
 new_england_events.186.d: "Протягом останніх кількох місяців багато теперішніх і колишніх робітників уздовж річки Гудзон об'єднали свої заробітки, щоб колективно врятувати компанію. Попри злидні Великої депресії, ці люди зобов'язані успіхом четвірці жінок, які заснували підприємство.\n\nСпираючись на свій досвід у жіночій Лізі профспілок, вдова покійного Франкліна Рузвельта, Анна «Елеонора» Рузвельт, створила невелику фабрику для забезпечення додаткового доходу місцевим фермерським сім'ям. Колеги з Демократичної партії допомогли фінансувати проєкт у маєтку Рузвельтів. «Вал-Кілл Індастріз» створювали меблі та тканини за методами XVIII століття.\n\nЧерез підірване здоров'я Ненсі Кук та наслідки депресії Елеонора прийняла важке рішення закрити фабрику. Проте робітники, прагнучи віддячити за доброту, надіслали листи посадовцям округу Датчесс із проханням про фінансування бізнесу в межах проєктів «другого квадратного курсу»."
 new_england_events.186.a: "Справжній американський дух."

# OWI Established
 new_england_events.187.t: "Створення Управління військової інформації"
 new_england_events.187.d.ent: "Сьогодні президент [NEE.GetLeader] оголосив про створення Управління військової інформації (OWI), очолюваного популярним радіокоментатором Елмером Девісом. Відомство відповідатиме за координацію закордонних та внутрішніх комунікацій, публікацій та трансляцій.\n\nСтворене за наказом президента, OWI прагне координувати радіо, кіно та пресу так, щоб вони відображали погляди [NEE.GetLeader]. Щоб кіноіндустрія належним чином зображувала цілі американських воєнних зусиль, OWI надало кожній студії детальну інструкцію про те, як використовувати кіно для навчання країни та союзників правді про демократію. Зокрема, наголошується на необхідності представляти афроамериканців як рівноправних партнерів в американській демократії, демонструючи толерантність нації. Інструкції OWI вимагають акцентувати увагу на тоталітарній природі диктатур, що повалили демократії Британії та Франції.\n\nПоряд із викриттям ворогів, OWI доручило зображувати союзників Америки як героїчні нації, щоб протистояти негативним стереотипам. Новини, що раніше показували французьких вигнанців як колоніальну державу, тепер мають змальовувати їхню місію як справедливу та доблесну. OWI сподівається, що американці побачать у своїх союзниках єдиний вільний світ, що відчайдушно бореться проти жахів синдикалізму."
 new_england_events.187.d.amer: "Сьогодні президент [NEE.GetLeader] оголосив про створення Управління військової інформації (OWI), очолюваного популярним радіокоментатором Елмером Девісом. Відомство відповідатиме за координацію закордонних та внутрішніх комунікацій, публікацій та трансляцій.\n\nСтворене за наказом президента, OWI прагне координувати радіо, кіно та пресу так, щоб вони відображали погляди [NEE.GetLeader]. Щоб кіноіндустрія належним чином зображувала цілі американських воєнних зусиль, OWI надало кожній студії детальну інструкцію про те, як використовувати кіно для навчання країни правді про демократію. Зокрема, наголошується на необхідності представляти афроамериканців як рівноправних партнерів в американській демократії, демонструючи толерантність нації. Останні дані показують, що залучення афроамериканців до промислового виробництва та армії Нової Англії зросло на 15% порівняно з довійськовим періодом, що підкріплює цю медіакампанію.\n\nПоряд із викриттям світових лиходіїв, OWI також доручило кінотеатрам висвітлювати спільні воєнні зусилля Тимчасового уряду Нової Англії та [ACC.GetNameDef]. Транслюються інтерв'ю з солдатами, пілотами та лідерами, які борються за свободу. OWI сподівається, що через такі образи національної єдності народ швидше відновиться після років громадянської війни."
 new_england_events.187.a: "До кращого світу!"

 # Кампанія військових облігацій
 new_england_events.188.t: "Битва облігацій"
 new_england_events.188.d: "За підтримки кінозірок з усієї країни Генрі Морґентау офіційно розпочав п'яту кампанію військової позики. Після спільної заяви Орсона Веллса та президента [NEE.GetLeader] збір коштів розпочато! Американці слухали заклики знаменитостей про важливість купівлі облігацій особисто, з екранів та через радіо. Участь голлівудських речників дозволяє краще координувати місцеві заходи, об'єднуючи країну в патріотичному пориві.\n\nПісля оголошення Національна асоціація продавців візуальної освіти вручила трофеї дистриб'юторам, які допомагали поширювати фільми на підтримку позики. Американці, незалежно від раси, кольору шкіри та віросповідання, зібралися, щоб підтримати дядька Сема. Хоча облігації випускалися і під час Великої депресії, ці військові облігації серії «E» мають на меті побити всі попередні рекорди — свідчення глибокої єдності американців від океану до океану."
 new_england_events.188.a: "Дядькові Сему потрібна ТВОЯ підтримка!"

 # Розслідування в Голлівуді
 new_england_events.189.t: "Розслідування в Голлівуді"
 new_england_events.189.d: "Сьогодні в Лос-Анджелесі відбулися слухання Комітету Палати представників з розслідування антиамериканської діяльності (HUAC). Хоча спочатку засідання були закритими, з'явилися новини про так званий «чорний список Голлівуду».\n\nКомітет зустрівся з видатними антисиндикалістами, включаючи членів Кіноальянсу за збереження американських ідеалів (MPA) — організації впливових консерваторів кіноіндустрії. Члени MPA, такі як Джон Вейн, стверджували, що радикали впроваджують пропаганду на екрани, щоб спровокувати насильство профспілок та збирати гроші для синдикалістів у всьому світі. Комітет висловив занепокоєння щодо «кожного в кіноіндустрії, хто може бути використаний як агент іноземної держави». Популярний актор Рональд Рейган, президент Гільдії кіноакторів, засвідчив, що невелика група в його профспілці використовує «синдикалістську» тактику для впливу на політику.\n\nПоки повістки заповнюють поштові скриньки сценаристів та акторів, страх цензури згуртував ліберальний фронт Голлівуду. У відповідь група лібералів сформувала Комітет за Першу поправку, стверджуючи, що розслідування порушують Білль про права. Проте, поки параноя в Конгресі зростає, зірки Голлівуду все частіше опиняються під наглядом уряду, якому вони допомагали захищатися лише кілька місяців тому."
 new_england_events.189.a: "Синдикалісти всюди?"

 # Голлівудська десятка
 new_england_events.190.t: "Голлівудська десятка"
 new_england_events.190.d: "Керівники кіностудій зустрілися в готелі «Waldorf Astoria» в Нью-Йорку. Вони оприлюднили заяву, що засуджує дії «Голлівудської десятки», яка відмовилася свідчити перед HUAC. У заяві йдеться, що ці десять осіб завдали шкоди своїм роботодавцям і галузі в цілому. Зі всіма десятьма розірвали контракти, а студії пообіцяли ніколи свідомо не наймати синдикалістів.\n\nДо десятки увійшли Алва Бессі, Герберт Біберман, Лестер Коул, Едвард Дмитрик, Рінг Ларднер-молодший, Джон Говард Лоусон, Альберт Мальц, Семюел Орніц, Адріан Скотт та Далтон Трамбо. Офіційно занесені до чорного списку, вони намагалися апелювати до Верховного суду, але марно. За неповагу до Конгресу їх оштрафували на 1000 доларів кожного і засудили до тюремного ув'язнення терміном від шести місяців до року.\n\nКонгресмен Гамільтон Фіш III та режисер Майрон Фаган підтвердили, що HUAC продовжуватиме ретельно перевіряти медіаіндустрію на ознаки синдикалістського проникнення. Федеральні агенти вже патрулюють знімальні майданчики в Лос-Анджелесі. Більшість студій заявили про підтримку американської демократії та обіцяли звільняти персонал, що симпатизує радикальним режимам."
 new_england_events.190.a: "Наші кінотеатри повинні бути вільними від такої пропаганди!"
# Learned Hand
 new_england_events.191.t: "Обрання Головного судді"
 new_england_events.191.d: "Оскільки судова система перебуває в повному занепаді, правознавці звернулися до адміністрації [NEE.GetLeader.GetSurname] з пропозицією призначити новий Верховний суд, щоб почати розбудову федеральної судової системи Нової Англії. Їхній вибір був одностайним — колишній федеральний суддя Лернед Генд.\n\nБіллінґс Лернед Генд народився в 1872 році і виріс у північній частині штату Нью-Йорк. Він сформував майже кожну галузь права, включаючи контрактне, деліктне, авторське право і, особливо, право на свободу слова. Хоча його прогресивні погляди очевидні, це не завадило йому бути справедливим і блискучим юристом.\n\nДеякі вчені підтримують суддю Генда через його прихильність до революційного законодавства: Уніфікованого торгового кодексу (UCC). Поки Велика депресія нівечила США, правознавці вірили, що зможуть стимулювати економіку, впорядкувавши правила комерційних контрактів. UCC встановив би універсальні принципи, які штати могли б прийняти, роблячи право передбачуваним. Це зменшило б витрати компаній і зміцнило б одужання нації. Суддя Генд є палким прихильником такого кодексу, тому бізнес-кола також підтримують його кандидатуру."
 new_england_events.191.a: "Чудовий вибір!"

 NEE_unity_cabinet_tooltip: "Ви увійдете в коаліцію з §YДемократичною партією§!, але політична влада від них буде лише в §Rполовину§! меншою, ніж якби вони були при владі одноосібно."

 new_england_events.200.t: "Тимчасовий президент [GetYear] року"
 new_england_events.200.d: "Початок другої американської громадянської війни відділив Нову Англію від решти нації. За відсутності відповідального центрального уряду штати організували голосування за тимчасового президента, який керуватиме до виборчого циклу 1940 року.\n\nРеспубліканська партія висунула Льюїса Барроуза, губернатора штату Мен. Разом із ним балотується Стайлз Бріджес. Вони обіцяють співпрацювати з демократами задля соціальної допомоги, але залишаються противниками надмірної профспілкової діяльності.\n\nВід Демократичної партії виступає Девід Волш, сенатор від Массачусетсу. Оскільки він скептично ставиться до великих державних проєктів, партія обрала йому в напарники Теодора Ґріна з Род-Айленда — палкого прихильника активного втручання уряду, який уже готує реформи зарплат та оренди.\n\nНарешті, помірковані з обох партій висунули Джозефа Мартіна-молодшого з Джозефом Елі. Це перший випадок спільного списку суперників з 1796 року. Вони обіцяють «золоту середину», де обидві партії матимуть рівний вплив на національну політику."
 new_england_events.200.a: "Республіканці здобувають перемогу."
 new_england_events.200.b: "Зараз потрібен компромісний кабінет!"
 new_england_events.200.c: "Демократи виграють голосування."

 new_england_events.201.t: "Альянс між робітниками та демократами"
 new_england_events.201.d: "З наближенням виборів 1940 року демократи прагнуть відібрати крісло у Барроуза. Задля цього вони звернулися до Прогресивної партії та її зв'язків із робітничим рухом. Вони планують позиціонувати себе як союзники бідного робітника. Якщо Перкінс та її прихильники зберуть достатньо голосів прогресистів, вона отримає посаду міністра торгівлі в демократичному кабінеті."
 new_england_events.201.a: "За народ!"

 new_england_events.202.t: "Альянс між Партією заборони та республіканцями"
 new_england_events.202.d: "Напередодні виборів 1940 року республіканці планують повернути собі владу. Щоб отримати перевагу над демократами, вони звернулися до Партії заборони. Республіканці сподіваються залучити їхні голоси, запропонувавши Роджеру Бебсону посаду в кабінеті у разі своєї перемоги."
 new_england_events.202.a: "За більш моральну Америку!"

 new_england_events.209.t: "Конгрес знову в розпалі роботи"
 new_england_events.209.d: "Після виборів 1940 року уряд [NEE.GetName] вирішив знову скликати колишній Конгрес Сполучених Штатів у столиці [NEE.Capital.GetCapitalVictoryPointName]. Це перша сесія Конгресу з моменту національної катастрофи. Конгрес 1940 року має на меті відновити віру американців у законодавчу гілку влади. Тепер, коли радикали зникли з залів засідань, партійна система повернулася до довійськового стану — суперництва республіканців та демократів. Необхідно тримати баланс між двома силами, щоб американська політична машина працювала стабільно."
 new_england_events.209.d.1944: "Після нещодавніх виборів склад Конгресу оновився. У довгоочікуваному скликанні 1944 року лідери та представники з'їжджаються до [NEE.Capital.GetCapitalVictoryPointName]. Серед головних тем — реформи праці, освіти та національні будівництва. Республіканці прагнуть регулювати робітничий рух, щоб той не піддався спокусі соціалізму, тоді як демократи наполягають на посиленні втручання держави в економіку та поверненні WPA. Дім, розділений у собі, не встоїть, тому ефективний Конгрес мусить балансувати між цими політиками."
 new_england_events.209.a: "До єдності!"

 new_england_events.210.t: "Боротьба з депресією"
 new_england_events.210.d.barrows: "На відміну від решти країни, що перейшла на військове виробництво, Велика депресія продовжує виснажувати Нову Англію. Новий міністр торгівлі Гаррі Гопкінс представив президенту Барроузу проєкт «другого квадратного курсу». Спираючись на досвід Рузвельта, план передбачає інтервенціоністську роль держави в економіці. Барроуз, як фіскальний консерватор, ставиться до цього скептично, але розуміє, що стабільність нації важливіша, і пообіцяв не блокувати законопроєкт."
 new_england_events.210.d.comp: "Віцепрезидент Джозеф Елі спільно з Теодором Ґріном подали запит президенту Мартіну-молодшому. Елі пропонує програму громадських робіт, засновану на позиках, щоб вирішити проблему безробіття. Хоча президент має сумніви щодо цього «другого квадратного курсу», в дусі компромісу він погодився не перешкоджати Конгресу."
 new_england_events.210.d.walsh: "На столі президента лежить тека з написом «другий квадратний курс». План представлений віцепрезидентом Теодором Ґріном. Він намагається переконати президента Волша підтримати активну роль уряду. Волш роками критикував амбітних демократів, які прагнуть роздути державний апарат, але Ґрін стверджує, що розширений уряд краще захистить людей у ці скрутні часи."
 new_england_events.210.a: "Нам потрібен єдиний законодавчий орган!"

 new_england_events.211.t: "Поштова кампанія"
 new_england_events.211.d: "Губернатори та представники штатів закликали громадян писати до президентського офісу в Бостоні. Більшість із них належить до табору демократів, які прагнуть розширення ресурсів. Представник Джордж Бредшоу Келлі провів серію виступів про «велику поштову кампанію». Кожен громадянин має бути почутий! Люди повинні вимагати від [NEE.GetLeader] рішучих кроків проти депресії, навіть ціною збільшення державних витрат."
 new_england_events.211.a: "Нехай наші голоси будуть почуті!"

 new_england_events.212.t: "[NEE.GetLeader] погоджується на другий квадратний курс"
 new_england_events.212.d: "Десятиліттями Велика депресія нищила промисловість Півночі. Черги за безкоштовним супом стали нормою. Через нейтралітет у громадянській війні Нова Англія почала відставати від сусідів, чия промисловість ожила завдяки замовленням на зброю. Президент [NEE.GetLeader] оголосив, що вільний ринок не в змозі подолати кризу самотужки. Уряд візьме на себе активну роль. За допомогою державних програм Конгрес планує залучити людей на заводи, готуючи країну до вирішальної битви."
 new_england_events.212.a: "До світлого майбутнього!"

 new_england_events.159.t: "Житловий акт [GetYear] року"
 new_england_events.213.d: "Працюючи в Міністерстві внутрішніх справ, молодий Роберт Вівер домігся від уряду заходів щодо зниження вартості життя. За підтримки [NEE.GetLeader] він розробив Житлову програму США для фінансової підтримки місцевих житлових департаментів. Вівер особливо сподівається, що це допоможе його афроамериканським братам і сестрам, які першими втрачали роботу на фермах та заводах і зараз ледь зводять кінці з кінцями."
 new_england_events.213.a: "Дамо дах над головою кожному!"

 new_england_events.214.t: "Управління електрифікації сільської місцевості"
 new_england_events.214.d: "Великі міста [NEE.GetNameDef] мають електрику, чого не скажеш про сільський Північний Схід. До війни лише 11% США мали доступ до мереж. Приватні компанії не поспішали будувати лінії у віддалені райони через високу вартість. Акт про електрифікацію сільської місцевості [GetYear] року вирішує цю проблему: надаються пільгові кредити терміном до 25 років на будівництво електростанцій та ліній передач."
 new_england_events.214.a: "Світло в кожну домівку!"

 new_england_events.215.t: "Відкриття національного парку Акадія"
 new_england_events.215.d: "Після року інтенсивної праці хлопці з Ігл-Лейк закінчили створення перших туристичних стежок у новому парку в штаті Мен. Юнаки з CCC (Цивільного корпусу збереження природи) створили справжню красу в регіоні Акадія, розчистивши ліси та встановивши величезні гранітні блоки вздовж маршрутів."
 new_england_events.215.a: "Ви бачили тамтешній краєвид?"

 new_england_events.216.t: "Дебати про реформу армії"
 new_england_events.216.d: "Громадянська війна змушує всі сторони мілітаризуватися. Підрозділи Національної гвардії на південному кордоні можуть бути недостатніми для оборони [NEE.GetNameDef]. У Генштабі сформувалися два табори.\n\nМеррітт Едсон пропонує посилену підготовку спецпідрозділів. Мале ядро професійних, мобільних солдатів стане мечем і щитом Америки, поки Нацгвардія та канадці триматимуть загальну лінію оборони.\n\nДжордж Кенні натомість виступає за масовий призов. Покладатися на Оттаву — означає залежати від її волі. Маючи велике населення, Нова Англія має потенціал для великої армії, яка зможе захистити себе самостійно."
 new_england_events.216.a: "Сила Америки — в її спецпризначенцях"
 new_england_events.216.b: "Американська армія має бути значно розширена"

 new_england_events.217.t: "Конгрес обговорює дитячу працю"
 new_england_events.217.d: "Промислова революція призвела до того, що діти часто працюють на текстильних фабриках Нової Англії через свій малий зріст. Але ця практика викликає обурення. Робота небезпечна і призводить до нещасних випадків. Синдикалісти закликають заборонити дитячу працю і запровадити обов'язкову освіту. Конгрес розділився: одні кажуть, що праця дітей допомагає бідним сім'ям та індустрії конкурентувати на континенті, інші вважають це нелюдським і пропонують інвестувати в майбутнє вчених та дослідників через школи."
 new_england_events.217.a: "Нехай продовжують працювати"
 new_england_events.217.b: "Обмежити їхні години під час навчального дня"

 new_england_events.218.t: "Конгрес обговорює впровадження реформи зарплат"
 new_england_events.218.d: "Зростання синдикалізму стало наслідком гніту індустріальних баронів. Конгрес прагне вберегти людей від радикалізму через новий закон про трудові стандарти. Пропонується 8-годинний робочий день, 40-годинний тиждень та підвищена оплата понаднормових. Критики називають це «синдикалізмом в овечій шкурі», побоюючись посилення профспілок. Прихильники ж вірять, що це гарантує лояльність робітників."
 new_england_events.218.a: "Справедлива оплата за день праці!"
 new_england_events.218.b: "Відхилити цей синдикалізм!"

 new_england_events.219.t: "Неприємний скандал"
 new_england_events.219.d: "«СКАНДАЛ» — кричать заголовки всіх газет. Репортери оточили резиденцію Волша після виборчого інциденту. Попри успіхи у боротьбі з депресією, Волш вирішив балотуватися на третій термін, що є безпрецедентним порушенням американської традиції, встановленої ще Вашингтоном. Навіть у його партії виникла опозиція. Але кампанія провалилася ще до початку: під час рейду шпигунів OSS у чоловічому борделі було виявлено не лише синдикалістів, а й самого Девіда Волша. Його репутація знищена. Демократи поспіхом замінили його на Джозефа П. Кеннеді."
 new_england_events.219.a: "Час для величі?"

 new_england_events.220.t: "Ще один скандал"
 new_england_events.220.d: "Здавалося, заміна Волша на Кеннеді врятує демократів. Але новий скандал сколихнув партію. Свідки повідомляють, що Джозеф Кеннеді був у змові з колишнім мером Бостона Джеймсом Керлі. Схоже, Кеннеді підкупив Керлі задля політичних послуг та забезпечення місця в Конгресі для свого сина. Після ганьби Кеннеді демократи виставили Моріса Тобіна, але республіканці тепер мають величезну перевагу на виборах 1944 року."
 new_england_events.220.a: "Сподіваюся, Тобін врятує демократів."

 NEE_Fair_Labour_idea: "Політика справедливих трудових стандартів"

 new_england_events.230.t: "Загальноамериканська оренда"
 new_england_events.230.d: "Поки на півдні вирує пожежа війни, наш обов'язок — допомогти сусідові. Ми можемо запропонувати наші військові заводи тим, хто бореться на нашому боці. Хоча нам самим потрібна зброя, ми мусимо зробити все, щоб наш союзник не впав!"
 new_england_events.230.a: "Віддати 1 завод союзникам"
 new_england_events.230.b: "Віддати 2 заводи союзникам"
 new_england_events.230.c: "Віддати 3 заводи союзникам"
 new_england_events.230.e: "Зараз ми не можемо нічого виділити"

 new_england_events.231.t: "[FROM.GetName] починає оренду обладнання для нас"
 new_england_events.231.d: "З підписанням Акта про загальноамериканську оренду в [NEE.GetName], їхній уряд розпочав програму допомоги. Частина їхніх потужностей тепер працює на нас. Наразі вони надсилають нам [?NEE_sent_mil] військових заводів!"
 new_england_events.231.a: "Допомога ніколи не буває зайвою!"

### Reconstruction Events ###
 NEE_trial_of_american_politicians_tooltip: "§CРозпочнуться судові процеси над політиками, які підтримували заколотників та зрадників§!\n"
 NEE_trial_of_american_generals_tooltip: "§CРозпочнуться судові процеси над керівництвом збройних сил, що підтримувало заколотників та зрадників§!\n"

# Political Trials
 new_england_events.250.t: "Суд над [WCA.GetNameDef]"
 new_england_events.250.d: "Преса та зацікавлені спостерігачі зібралися сьогодні в [NEE.Capital.GetCapitalVictoryPointName], щоб стати свідками суду над колишніми членами [WCA.GetNameDef]. Флінн, Томас, Фостер і Браудер... ці імена лунали в залах суду знову і знову, і кожен вердикт проголошував або «Державна зрада», або «Винен». [WCA.GetLeader], колишній перший і єдиний президент [WCA.GetNameDef], також був викликаний, хоча його адвокати палко доводили, що він наразі не в змозі захищати себе через поганий стан здоров'я. Рід, стверджували вони, намагався захистити простий робітничий клас Америки. Дійсно, це було потужним гаслом для захисників колишньої WCA — мовляв, SPA лише боролася за права робітників, сподіваючись полегшити роки економічної депресії. І все ж, чим можна пояснити незліченні акти безглуздого насильства, скоєні «Червоною гвардією», які змусили біженців кидати домівки та родини заради притулку в Новій Англії? Поки одні пристрасно благають про амністію або м'які вироки для членів колишньої WCA, інші вважають, що ці люди були зрадниками під час найгіршої кризи в нашій історії. Остаточне рішення за присяжними."
 new_england_events.250.a: "Прощення — це чеснота."
 new_england_events.250.b: "Але ми не будемо її виявляти."

 new_england_events.251.t: "Суд над [APG.GetNameDef]"
 new_england_events.251.d: "Суд над [APG.GetNameDef] всерйоз розпочався сьогодні в [NEE.Capital.GetCapitalVictoryPointName]; багато спостерігачів хотіли побачити, чи буде Південь покараний вдруге. Г'юї Лонґа не було, він втік із країни в останні дні громадянської війни, і замість нього на лаві підсудних опинилися розрізнені члени його партії, зокрема Чарльз Коґлін, Чарльз Ліндберґ та Джордж Мозлі. Хоча їхні адвокати палко доводили, що ці люди воювали за збереження справжньої американської демократії та захищали її від радикалізму й соціалізму, дії Г'юї Лонґа та його поплічників призвели лише до подальшого розпаду нашої нації. Їхній лідер був не більше ніж демагогом, а багато хто в їхніх лавах поширює расистську риторику, якій не місце в нашій країні. Крім того, ці люди воювали за нечисту форму демократії, і є безліч свідчень очевидців про те, як «Мінітмени» організовували суди Лінча. Поки одні просять про амністію, інші вважають, що ці люди зрадили націю в найтяжчу годину. Остаточне рішення за присяжними."
 new_england_events.251.a: "Прощення — це чеснота."
 new_england_events.251.b: "Але ми не будемо її виявляти."

 new_england_events.252.t: "Суд над [ACC.GetNameDef]"
 new_england_events.252.d: "Суд над колишньою [ACC.GetName], що проходив у [NEE.Capital.GetCapitalVictoryPointName], розпочався сьогодні на тлі значних суперечок. Багато хто стверджував, що [ACC.GetNameDef] воювала за справжню американську демократію, поки нація розвалювалася. Адвокати Мерріама, Джеллатлі та Джонсона вже просять присяжних зрозуміти, що лідери [ACC.GetNameDef] щиро сподівалися зберегти американську демократію і лише захищали Конституцію. Такі аргументи, безумовно, мають вагу, але не можна заперечувати, що [ACC.GetNameDef] воювала проти нас, і кров жителів Нової Англії була пролита в боях проти них. Безумовно, вони повинні бути покарані за свій бунт і відмову визнати нас останньою гаванню американської демократії. Їхня участь у війні була зрадою, яку не можна так легко ігнорувати. Остаточне рішення за присяжними."
 new_england_events.252.a: "Прощення — це чеснота."
 new_england_events.252.b: "Але ми не будемо її виявляти."

 new_england_events.253.t: "Суд над федеральним урядом"
 new_england_events.253.d.dem: "Сьогодні в [NEE.Capital.GetCapitalVictoryPointName] розпочався суд над колишніми Сполученими Штатами Америки, що викликало великий інтерес у спостерігачів. На лаві підсудних опинився навіть колишній президент [USA.GetLeader]. Обвинувачення заявило, що бездіяльність колишнього президента та передача влади демагогам, таким як Макартур, призвели до національної кризи, що штовхнула країну до другої громадянської війни. До списку їхніх злочинів було додано нездатність подолати економічні проблеми, які залишили мільйонів американців без роботи. Хоча прокурор вимагає суворих покарань, дехто стверджує, що вони намагалися зробити все можливе в майже неможливій ситуації. Вони благають про амністію заради майбутнього примирення та прощення колишнього режиму. Остаточне рішення за присяжними."
 new_england_events.253.d.mac: "Сьогодні в [NEE.Capital.GetCapitalVictoryPointName] нарешті розпочався довгоочікуваний суд над Дугласом Макартуром та його військовою хунтою. Обвинувачення одразу перейшло до фактів: не було жодних сумнівів — зіткнувшись із національною кризою, Макартур здійснив переворот, який кинув виклик самій природі американської демократії. Хоча він та його оточення претендували на роль справжніх наступників США, прокурор довів, що це була лише військова хунта, яка викинула ідеї Конституції у вікно. Самого Макартура ніде не було видно, він втік у вигнання після поразки своєї Федеральної армії. Його представники стверджували, що виснажений генерал хотів лише піти на спокій. Вони заявляли, що нація йшла радикальним шляхом до анархії, а Макартур просто намагався навести лад. Хоча багато хто називає його дії тиранічними, є й ті, хто вірить, що він хотів лише покласти край радикалізму. Долю його військової кліки буде вирішено пізніше, а остаточне рішення щодо його спадщини за присяжними."
 new_england_events.253.a: "Прощення — це чеснота"
 new_england_events.253.b: "Але ми не будемо її виявляти"

# General Trials
 new_england_events.254.t: "Суд над Федеральною армією"
 new_england_events.254.d: "Після завершення суду над федеральним урядом розпочався військовий трибунал щодо долі колишніх військових США. Обвинувачення вказало, що військові колишнього федерального уряду свідомо піддавали небезпеці цивільне населення, і що багато життів було втрачено через дії Федеральної армії. Крім того, прокурори зазначили, що вирок має поширюватися і на колишній військово-морський флот США — більшість із цих людей чекають роки за ґратами. Проте адвокати захищали генералів та адміралів, стверджуючи, що вони лише виконували свій конституційний обов'язок і більшість просто слідувала наказам. Палкий захист колишнього генерала Ейзенхауера виголосив наш власний генерал Марк Кларк. Він доводив, що Ейзенхауер був щиро відданий ідеям Америки і воював за федеральний уряд лише через вірність Конституції. Прихильники амністії стверджують, що їхній досвід буде корисним для відбудови. Проте обвинувачення вказало на давню дружбу Кларка та Ейзенхауера з часів Вест-Пойнта, натякаючи на упередженість. Остаточне рішення за присяжними."
 new_england_events.254.a: "Дозволити їм повернутися до збройних сил"
 new_england_events.254.b: "Ми не можемо дозволити зрадникам служити"

 new_england_events.255.t: "Суд над збройними силами [APG.GetNameDef]"
 new_england_events.255.d: "Після завершення суду над [APG.GetNameDef] розпочався трибунал щодо їхніх колишніх військових. Обвинувачення наголосило, що генерали [APG.GetNameDef] були зрадниками, які прагнули демонтувати американську демократію. Прокурори також нагадали про звірства, вчинені солдатами [APG.GetNameDef], і вимагають суворих термінів для генералів та адміралів. Хоча амністія для Паттона неможлива з огляду на його керівництво силами [APG.GetNameDef], деякі офіцери, як-от генерал Роберт М. Денфорд та адмірал Джон Маккейн-старший, висловили глибоке каяття. Прихильники амністії вказують на їхню відданість американським цінностям свободи та готовність воювати проти синдикалізму. Ці люди готові знову служити Америці, і, можливо, їхній досвід потрібен для розбудови армії та флоту [NEE.GetName]. Остаточне рішення за присяжними."
 new_england_events.255.a: "Дозволити їм повернутися до збройних сил"
 new_england_events.255.b: "Ми не можемо дозволити зрадникам служити"

 new_england_events.256.t: "Суд над збройними силами [ACC.GetNameDef]"
 new_england_events.256.d: "Військовий трибунал щодо колишніх військових [ACC.GetNameDef] розпочався одразу після цивільного суду. Лояльність цих генералів та адміралів не піддавалася сумніву, оскільки [ACC.GetNameDef] повстала у відповідь на переворот Макартура. Їхня відданість ідеалам Америки була очевидною, проте обвинувачення вказало, що вони виступали проти легітимності Нової Англії під час війни, і що було пролито чимало крові для підкорення західних штатів. Хоча прокуратура має намір вимагати вироків або примусової відставки для деяких лідерів, генерали на кшталт Маршалла та Німіца висловили жаль через те, що опинилися на іншому боці. Їхні адвокати просять про амністію, посилаючись на їхню відданість справі Конституції перед обличчям автократії. Їхні навички були б надзвичайно цінними для відновлення збройних сил [NEE.GetName]. Остаточне рішення за присяжними."
 new_england_events.256.a: "Дозволити їм повернутися до збройних сил"
 new_england_events.256.b: "Ми не можемо дозволити зрадникам служити"

# Generic Reconstruction #
 new_england_events.257.t: "Виконавчий указ 7037"
 new_england_events.257.d: "Визнаючи необхідність встановлення систем розподілу електроенергії для обслуговування сільських районів [NEE.GetNameDef], сьогодні вранці президент [NEE.GetLeader] підписав Виконавчий указ 7037. Також відомий як Акт про електрифікацію сіл [GetYear] року, цей закон спрямований на надання федеральних позик для аграрних регіонів країни. Подібно до Акта про гомстеди, який колись давав звичайній людині «рівний шанс», президент висловив бажання, щоб нащадки гомстедерів мали доступ до електрики, яка вже стала нормою у більшості міст. Хоча дехто сумнівається в технічній можливості провести світло у віддалені райони, кооперативи вже перейшли на мережу 7200 вольт для полегшення переходу. Акт також має політичне значення: уряд прагне відновити стосунки з населенням, поки шрами війни ще не загоїлися."
 new_england_events.257.a: "Світло в кожну домівку!"

 new_england_events.258.t: "Протести на Півдні"
 new_england_events.258.d: "Закони проти сегрегації, прийняті Конгресом, зустріли шалений опір з боку прихильників роздільного проживання, особливо на Півдні. Підбурювані такими особами, як місіс Дж. Е. Ендрюс із «Жіночої національної асоціації за збереження білої раси», вони звинувачують уряд та NAACP у руйнуванні «чистої білої раси» та стверджують, що білі жінки опинилися під загрозою. Гучні гасла та листівки перетворилися на відкриті протести, а афроамериканці повідомляють про постійні злочини проти них. Попри зусилля федерального уряду скасувати виборчі податки та «дідусеві застереження», що обмежують голосування на Півдні, місцеві законодавці обіцяють народу, що закони Джима Кроу будуть збережені.\n\nЦі протести також підтримуються залишками лонґістського режиму в Луїзіані, як-от Леандером Пересом, який прямо відмовився приймати заходи уряду, називаючи їх справою «саквояжників, скалаваґів та NAACP для інтеграції шкіл». Одним із найгучніших голосів сегрегації є Теодор Більбо, колишній лонґістський сенатор та відкритий член Ку-клукс-клану. Його суперечлива праця «Ваш вибір: розділення або змішування» знайшла відгук серед радикалів. Риторика про «самооборону» та лінчування призвела до насильства, яке багато хто порівнює з «Червоним літом» 1936 року."
 new_england_events.258.a: "Ми повинні відправити Національну гвардію?"
 new_england_events.258.b: "У нас зараз є важливіші пріоритети!"

 new_england_events.259.t: "Президент [NEE.GetLeader] федералізує Національну гвардію"
 new_england_events.259.d: "Досить. Заявивши, що опір новим законам прирівнюється до державної зради, президент [NEE.GetLeader] федералізував Національну гвардію, оголосивши безкомпромісний курс щодо противників інтеграції. Підрозділи гвардії швидко розійшлися великими містами Півдня, заарештовуючи підбурювачів, таких як Більбо, Перес та Ендрюс. Федеральні правоохоронні органи провели жорстке придушення заворушень, арештувавши багатьох членів груп, пов'язаних із верховенством білої раси, включно з Ку-клукс-кланом. Коли лідери опинилися за ґратами, а організації були розбиті, опір нарешті вщух. Назвавши сегрегацію «могутньою отрутою, що отруює розуми багатьох американців», президент офіційно оголосив, що школи мають бути спільними, а роздільним закладам прийшов кінець.\n\nNAACP та іноземна преса високо оцінили дії президента. Поки федеральні війська відновлюють порядок, багато хто визнає, що боротьба з расовою ненавистю ще не закінчена — поодинокі акти насильства все ще трапляються. Хоча війна проти расизму не завершена, цю битву дійсно було виграно."
 new_england_events.259.a: "Нарешті один крок у правильному напрямку."

 new_england_events.260.t: "Ескалація заворушень"
 new_england_events.260.d: "Бездіяльність президента [NEE.GetLeader] лише розпалила громадянські заворушення на півдні. Місцева поліція явно підтримує білих протестувальників, але чорношкірі демонстранти та їхні білі союзники почали давати відсіч. У таких містах, як Атланта та Джексон, останніми днями панує насильство, мародерство та безлад. Південь палає у вогні расової ненависті, а іноземні репортери приголомшені хаосом у країні, яка називає себе «землею вільних».\n\nНарешті президент вирішив вжити надзвичайних заходів. Запровадивши на Півдні воєнний стан, федеральні війська сьогодні вранці увійшли в південні столиці. Деякі радикальні залишки лонґістів чинили збройний опір, але вони не мали шансів проти регулярної армії. Проте шкоди вже було завдано: безліч будівель та будинків зруйновано. Повільність президента засудили не лише NAACP, а й світові ЗМІ. Хоча президент наполягає, що закони проти сегрегації будуть дотримані будь-якою ціною, напруженість на Півдні свідчить, що примирення між расами не буде легким."
 new_england_events.260.a: "До цього мало дійти."

 new_england_events.261.t: "Майбутнє [NEE.GetNameDef]"
 new_england_events.261.d.monroe: "Нарешті, після років жорстокої війни, американська нація знову здатна заявити про себе у світі. Тимчасовий уряд та [ACC.GetNameDef] відповіли на заклик до свободи в найтемнішу годину, поклавши край анархії. Боротьба за американську демократію завершена, але Новий Світ ще не вільний від загрози революції. Падіння Канади в авторитаризм зробило США єдиним факелом свободи в Америці. Це накладає велику відповідальність: звільнити західну півкулю від тоталітарних режимів. Щоб країни Нового Світу не потрапили під вплив Берліна чи Парижа, [NEE.GetNameDef] має стати їхнім опікуном. Ми будемо розвивати демократичні країни та звільняти пригноблені народи. Маючи оновлену міць, ми можемо гордо сказати світу: Захід належить нам!"
 new_england_events.261.d.pacific: "Нарешті, після років війни, Америка знову готова заявити про себе. Тимчасовий уряд та [ACC.GetNameDef] покінчили з радикалізмом. Тепер ми звернемо погляд на Тихий океан та Далекий Схід, де роки колонізації виснажили народи. У Південно-Східній Азії німці намагаються втримати імперію, поки Японія жадібно дивиться на Китай. У момент нашої слабкості японці нахабно захопили наші тихоокеанські володіння. Час покласти край їхньому імперіалізму. Ми зосередимося на розбудові зв'язків з демократіями Тихого океану та станемо його захисником. Тихий океан стане нашим морем, а ми принесемо факел свободи на Схід."
 new_england_events.261.d.alone: "Нарешті, після років війни, американська нація знову здатна заявити про себе. Тимчасовий уряд Нової Англії залишився єдиним переможцем і єдиним факелом свободи в Новому Світі. Настав час визначити наші пріоритети. Новий Світ завжди був сферою Америки, і ми відбудуємо нашу присутність тут. Європа більше не втручатиметься в справи Американського континенту. Водночас ми не можемо ігнорувати заклики про допомогу з Азії. Тихий океан — наш обов'язок, і ми маємо захистити його від войовничих держав. Ми не забули боягузливий вчинок Японської імперії. Нехай знають, що скоро ми повернемося."
 new_england_events.261.d.ent: "Нарешті Америка знову здатна заявити про себе у світі. У найтемніші часи вільні нації прийшли їй на допомогу, і тепер Америка може повернути цей борг Антанті. Шрами війни гояться, порядок відновлено. Возз'єднання під червоно-біло-блакитним прапором стало можливим лише завдяки союзникам. Солдати Канади, Франції та домініонів воювали пліч-о-пліч із нами за американську свободу. Завдяки їхньому втручанню демократія вижила в Новому Світі. Американський народ готовий воювати знову. Ми оголошуємо світові, що Америка відновлює свій пакт з Антантою і віднині зобов'язується захищати свободу в усьому світі!"
 new_england_events.261.a: "На Тихий океан!"
 new_england_events.261.b: "Відновимо доктрину Монро!"
 new_england_events.261.c: "Старий лад повертається!"

# Syndicalist + Longist Unrest Event Chains #
 reconstruction_help_tt: "Завершення цього фокуса допоможе нам загоїти шрами громадянської війни!"
# Steel Belt Homes
 new_england_events.267.t: "Будинки Сталевого поясу"
 new_england_events.267.d: "Великі міста Середнього Заходу, як-от Детройт та Чикаго, колись символи американської індустріалізації, лежать у руїнах. Оскільки опір синдикалістів ставав дедалі фанатичнішим, будівлі перетворювалися на бункери, а залізниці нищилися. Насильство нарешті вщухло, і настав час відбудови. Щоб зцілити націю, ми будемо проводити політику прощення. Настав час об'єднатися як американцям, а не ворогам. Ми організуємо будівництво нових осель, спрямувавши ресурси на створення нового і кращого Середнього Заходу."
 new_england_events.267.a: "Кожен заслуговує на дах над головою"

# Sun Belt Homes
 new_england_events.268.t: "Будинки Сонячного поясу"
 new_england_events.268.d: "Південь був вдруге спустошений у новітній історії. Регіон, який і так не був сильно індустріалізований, залишився майже без нічого після відступу лонґістів. Опір був фанатичним, а лідери на кшталт Паттона закликали до тотальної війни. Такі міста, як Новий Орлеан та Маямі, є лише тінню свого минулого, серед населення панує бідність та безпритульність. Настав час об'єднатися як американцям. Ми допоможемо організувати будівництво нових домівок, щоб відбудувати Новий Південь!"
 new_england_events.268.a: "Кожен заслуговує на дах над головою"

# New Freedman's Bureau
 new_england_events.269.t: "Бюро у справах біженців, безземельних та сиріт"
 new_england_events.269.d: "У 1865 році за ініціативи тодішнього президента Авраама Лінкольна під час першої американської громадянської війни було створено Бюро у справах біженців, звільнених та покинутих земель (відоме як «Бюро Фрідмена») для допомоги у відбудові Півдня. Хоча велись дискусії щодо успішності цього законодавства, Бюро фактично припинило існування у 1872 році.\n\nЗ завершенням другої американської громадянської війни Конгрес вирішив відновити Бюро, зберігаючи гуманітарний дух попередника, але сподіваючись уникнути його помилок. Організація отримала офіційну назву «Бюро у справах біженців, безземельних та сиріт», а очолив її уродженець Нової Англії архієпископ Бостона Річард Кушинг. Член NAACP, відомий своєю невичерпною енергією та прагненням до реформ, Кушинг відзначається надзвичайною харизмою, яка об'єднує єврейську, католицьку та протестантську громади Бостона. Крім економічної та медичної допомоги постраждалим від жорстокості війни, нове Бюро планує надавати землю, освіту та можливості тим, хто втратив усе. Бюро також допомагатиме величезному потоку біженців, які втекли до Канади та Нової Англії. Кушинг оголосив про плани перепрофілювання колишніх лонгістських та синдикалістських будівель під школи та клініки. Протягнувши руку милосердя колишнім бунтівним штатам, Бюро сподівається, що з часом рани війни нарешті загояться."
 new_england_events.269.a: "Милосердя до всіх"

# Union Leaders like Labor Standards Act
 new_england_events.270.t: "Бурхливе схвалення лідерів профспілок"
 new_england_events.270.d: "Скрутне становище американського робітника залишається проблемою нації. Хоча уряд з великою недовірою ставиться до тоталітарних поглядів революціонерів, профспілки та робітники все ще вимагають реформ. Завдяки прийнятому Конгресом Акту про трудові стандарти лідери місцевих профспілок привітали наші зусилля щодо збереження частини реформ, за які вони боролися. Хоча це не радикальні зміни, обіцяні лідерами [WCA.GetNameDef], наші зусилля принесли плоди: профспілки побачили уряд у новому світлі. З часом працьовитість американського народу повернеться, а екстремістські погляди Ріда та його прибічників будуть остаточно забуті."
 new_england_events.270.a: "Сподіваюся, цього достатньо"

# Veterans unbanned from former jobs
 new_england_events.271.t: "Помилування солдатів-повстанців"
 new_england_events.271.d: "З завершенням громадянської війни багато колишніх солдатів виявили свої робочі місця зруйнованими. Пошук роботи в урядових програмах з відновлення Півдня був неможливим через їхню службу в арміях [APG.GetNameDef]. Сьогодні такі бар'єри було знято, щоб дати Півдню можливість процвітати."
 new_england_events.271.a: "Вони просто билися не під тим прапором"

# Amnesty Act
 new_england_events.272.t: "Акт про амністію [GetYear] року"
 new_england_events.272.d: "У дусі примирення Конгрес офіційно прийняв Акт про амністію [GetYear] року. Оскільки Південь і Північ відбудовуються крок за кроком, цей Акт дозволить офіційно помилувати всіх солдатів, які служили в бунтівних фракціях під час війни. Як і його попередник 1872 року, новий закон скасовує обмеження на роботу в місцевих органах влади чи політиці для колишніх повстанців, дозволяючи країні знову об'єднатися. Президент [FROM.GetLeader] офіційно підписав законопроєкт сьогодні і доручив прокурорам припинити переслідування. Хоча вищі лідери [WCA.GetNameDef] та [APG.GetNameDef] все ще постануть перед судом, більшість їхніх підлеглих отримали президентське помилування. Від Тихого до Атлантичного океану американський колос починає підніматися після падіння в хаос. Травми війни не зникнуть швидко, а шлях відбудови буде важким. Проте президент запевнив націю, що це випробування зробило Сполучені Штати лише сильнішими."
 new_england_events.272.a: "Ми всі — американці!"

# WW2 Factory Riot
 new_england_events.273.t: "Протест на заводі перетворюється на жорстокий бунт"
 new_england_events.273.d: "Завод Dodge у Чикаго свого часу був найбільшою будівлею у світі. Спроєктований «архітектором Детройта» Альбертом Каном, під час громадянської війни він став осередком радикалізму, виробляючи зброю та техніку для зусиль WCA. Після війни завод перейшов до рук уряду, а робітники залишилися на місцях. Звикнувши до надзвичайно ліберальних умов часів революції, вони почали висловлювати невдоволення, коли побачили скасування політик WCA та заміну менеджерів. Те, що починалося як протест, перетворилося на смертельний страйк. Власники викликали поліцію, але кількість страйкарів лише зростала. Невдовзі сутички стали жорстокими: страйкарі захопили інструменти та саморобну зброю, забарикадувавшись на гігантському заводі. Губернатор Іллінойсу вирішив використати Національну гвардію. Гвардійці мали труднощі зі штурмом через розгалужену мережу тунелів, де ховалися агітатори. Під час прориву солдати зіткнулися з відчайдушним опором, але перед переважаючою вогневою міццю страйкарі не встояли; організатори були масово заарештовані."
 new_england_events.273.a: "Добре, що ми придушили це в зародку."

# Harsh Urban Martial Law
 new_england_events.274.t: "Розширення воєнного стану в містах"
 new_england_events.274.d: "Кровопролиття на заводі Dodge не залишилося без відповіді. Розгнівана втратою 97 бійців, Національна гвардія розпочала жорстке придушення робітників по всьому «Сталевому поясу». Бунт у Чикаго спровокував подібні спалахи боротьби за права робітників в інших місцях, які були швидко придушені. У містах регіону введено сувору комендантську годину та фактичний воєнний стан з нічними патрулями. Хоча дії силовиків викликали суперечки у ЗМІ, президент виправдав втручання, заявивши, що гвардія лише запобігає майбутнім провокаціям радикалів та реакціонерів. Поки «Сталевий пояс» палає, решта Америки задається питанням: скільки ще крові має пролитися, перш ніж мир буде відновлено."
 new_england_events.274.a: "Побиття триватимуть, доки настрій не покращиться."

# National Guard intervenes on Southern Protests
 new_england_events.275.t: "Національна гвардія втручається у протести на Півдні"
 new_england_events.275.d: "Повсюдний расизм є майже нормою на Глибокому Півдні, де десятиліття «Чорних кодексів» та законів Джима Кроу заважали афроамериканцям просуватися в суспільстві. Попри зусилля Відбудови, опір інтеграції лише посилився.\n\nПоки Конгрес приймає федеральні закони про скасування сегрегації, ці дії викликають лише лють у жителів Півдня. Сьогодні білі натовпи зібралися в таких містах, як Бірмінгем та Монтгомері, проголошуючи: «Сегрегація зараз, сегрегація завтра, сегрегація назавжди». Велика кількість кланівців у білих мантіях була помічена під час залякування чорношкірих родин. Національній гвардії було наказано захистити афроамериканців, чиє життя під загрозою. Організатори протестів заарештовані, хоча очевидно, що напруженість не вщухає."
 new_england_events.275.a: "Ненависть расизму не має меж."

# National Guard intervenes to save Bombingham
 new_england_events.276.t: "«Бомбінгем» під федеральним захистом"
 new_england_events.276.d: "Країна охоплена страхом через новини з Бірмінгема, штат Алабама — «магічного міста» Півдня, яке тепер асоціюється з хвилею безпрецедентного терору.\n\nКоли почалася десегрегація, Ку-клукс-клан вдався до насильства. Чорношкірих закликали купувати будинки в колись «білих» районах, а Клан здійснював нічні рейди, обстрілюючи та підриваючи ці домівки. Через постійні вибухи Центр-стріт у Бірмінгемі мешканці іронічно назвали «Динамітним пагорбом». Місцева поліція підозріло запізнювалася на виклики, що дозволяло терору тривати безкарно. У результаті до міста було введено Національну гвардію для охорони чорношкірих кварталів. Попри терор, деякі родини відмовляються виїжджати, вірячи, що їхня стійкість прискорить кінець сегрегації."
 new_england_events.276.a: "Бомба на кожному розі."

# Press Leaks Ironclad Oath
 new_england_events.277.t: "Преса розкрила скандальний законопроєкт про присягу"
 new_england_events.277.d: "По всій країні спалахнув скандал через витік законопроєкту про «залізну присягу» (Ironclad Oath). Пропонований закон висуває жорсткі умови для відбудови: право голосу отримують лише ті, хто ніколи не зі зброєю в руках не виступав проти Союзу і не допомагав ворожим фракціям. Таким чином, закон позбавив би виборчих прав тисячі американців, навіть цивільних. Витік спровокував хвилю обурення та протести по всій країні."
 new_england_events.277.a: "Як вони могли таке написати?"

# Posse Comitatus Repealed
 new_england_events.278.t: "Скасування закону Posse Comitatus"
 new_england_events.278.d: "Триваюча дестабілізація нації викликає велике занепокоєння серед населення. Жорстокі страйки на Півночі та теракти на Півдні стали нормою, оскільки лонгістські та синдикалістські терористи продовжують свою війну попри офіційну капітуляцію. Через заворушення Конгрес офіційно скасував закон Posse Comitatus 1878 року.\n\nЦей закон обмежував повноваження федерального уряду у використанні армії для внутрішньої політики. Скасувавши його, Конгрес заявив, що тероризм залишків повстанців має бути розчавлений за будь-яку ціну. Тепер федеральний уряд може використовувати армію, авіацію та флот для наведення порядку. Поки танки прямують до Чикаго та Бірмінгема, цивільні висловлюють занепокоєння через встановлення повного воєнного стану."
 new_england_events.278.a: "Ось так помирає свобода..."

# Final WV Holdout cleared
 new_england_events.279.t: "Останній оплот в Аппалачах зачищено"
 new_england_events.279.d: "Після скасування Posse Comitatus армія зосередилася на осередку синдикалістського опору в Західній Вірджинії. Райони вугільних шахт стали гаванями для соціалістичних партизанів, які накопичили зброю та боєприпаси.\n\nТуманні Аппалачі виявилися раєм для захисників. Шахтарі знали кожну стежку та тунель, завдаючи несподіваних ударів по Національній гвардії. Генерали Трепнелл та Гіккі спланували скоординовану атаку з використанням артилерії та авіації. Попри інтенсивні обстріли, синдикалісти чинили запеклий опір, знаючи місцевість. Майже 157 федеральних солдатів загинули в цій операції. Проте через тиждень боїв, виснажені втратами та браком припасів, останні партизани склали зброю."
 new_england_events.279.a: "Нехай це будуть останні з них!"

# Final Swamp Holdout cleared
 new_england_events.280.t: "Болота в Новому Орлеані зачищено"
 new_england_events.280.d: "Тижнями Клан та залишки [APG.GetNameDef] переховувалися в болотистих заплавах Луїзіани серед алігаторів. Ці фанатики Лонґа продовжували стверджувати, що б'ються за «справжню Америку», і їхній опір став занадто серйозним для поліції.\n\nАрмія отримала повний дозвіл на зачистку. Під керівництвом Гамільтона Гоуза було розпочато операцію «Евкаліпт» — скоординований удар мобільних підрозділів у густі болота. Гоуз вірив, що найкращий спосіб зламати лонгістів — це постійні швидкі рейди для деморалізації. За підтримки верфей Нової Англії були задіяні швидкі патрульні катери (PT boats). Після тижня боїв останні кланівці та лонгісти оголосили про безумовну капітуляцію, поклавши край організованому збройному опору."
 new_england_events.280.a: "Забирайтеся з мого болота!"

# Restoration of Home Rule
 new_england_events.281.t: "Відновлення місцевого самоврядування"
 new_england_events.281.d: "Після тижнів інтенсивного воєнного стану та придушення заколотів опір повстанців впав до історичного мінімуму. Протести вщухли, а теракти припинилися. Головні сили залишків бунтівників розбиті, їхні лідери у кайданах. Оскільки нація починає зцілюватися, війська поступово виводяться. Блокпости демонтуються, комендантська година скасовується. З поверненням влади на місця Америка знову стає на ноги — готова до будь-яких викликів."
 new_england_events.281.a: "Повернення до повноцінної роботи"

 NEE_focusing_Pacific: "Ми вирішили зосередитися на Тихому океані"
 NEE_focusing_Western_Hemisphere: "Ми вирішили зосередитися на Західній півкулі"
 NEE_focusing_Entente: "Ми допомагаємо відбудовувати Антанту"

# Securing the Northern Border #
 new_england_events.300.t: "Оґденсбурзька угода"
 new_england_events.300.d: "Сьогодні вранці посол [NEE.GetNameDef] подав запит до нашого відомства в Оттаві. Уряд [NEE.GetName] вимагає повернення всіх американських територій, зайнятих Антантою у 1937 році, а також виведення всіх іноземних військ. Хоча вони висловлюють вдячність за захист, Америка знову єдина і більше не потребує присутності Антанти на своїй землі. Американські дипломати запропонували пакт про ненапад, наголошуючи на важливості наших відносин.\n\nХоча Канада могла б і надалі використовувати ці території, американці чітко дали зрозуміти, що не приймуть подальшу окупацію. Відмова, найімовірніше, призведе до війни з південним сусідом — війни, яку ми навряд чи можемо собі дозволити."
 new_england_events.300.a: "Гаразд, нехай виведення військ розпочнеться"
 new_england_events.300.b: "Америка в хаосі. Зберігати окупацію до кінця війни"
 new_england_events.300.c: "Американці не в тому становищі, щоб висувати вимоги"

 new_england_events.301.t: "Канада повертає Пуерто-Рико американцям"
 new_england_events.301.d: "Сьогодні вранці губернатор отримав повідомлення від Міністерства закордонних справ про те, що наше управління островом Пуерто-Рико добігло кінця. Під час хаосу та пожежі другої американської громадянської війни сили Антанти окупували колишню американську територію Пуерто-Рико. З огляду на близькість островів, вони перебували під нашою адміністрацією, проте завершення великого американського конфлікту змусило уряд [NEE.GetName] заявити, що територія має бути повернута до [NEE.Capital.GetCapitalVictoryPointName]. Без зайвого галасу ми оголосимо острову про припинення окупації та вшануємо прибуття американців церемонією підняття прапора."
 new_england_events.301.a: "Для нас було честю охороняти острів."

 new_england_events.302.t: "Канада повертає Пуерто-Рико американцям"
 new_england_events.302.d: "Сьогодні вранці канадський уряд оголосив нам, що острівна територія Пуерто-Рико буде негайно повернута американцям після завершення їхньої громадянської війни. Альянс Антанти окупував острів через хаос конфлікту. Після дипломатичних домовленостей між [CAN.GetNameDef] та [NEE.GetNameDef] американці чітко дали зрозуміти, що Пуерто-Рико має бути негайно повернуто Сполученим Штатам. Канадський уряд погодився, і Антанта вже почала виведення сил з нашого острова."
 new_england_events.302.a: "Наша окупація була короткою, але почесною. (Грати за Канаду)"
 new_england_events.302.b: "Ми знову заявляємо про себе. (Грати за [NEE.GetNameDef])"
 new_england_events.302.c: "І з нами не порадилися? Ми ніколи не підкоримося!"

 new_england_events.303.t: "Канада повертає Панамський канал американцям"
 new_england_events.303.d: "Після переговорів за підсумками другої американської громадянської війни американці наголосили на важливості повернення Панамського каналу. Окупований урядом Антанти під час хаосу війни, американський уряд звернувся з проханням вивести війська з Панами. Дотримуючись умов угоди, уряд [CAN.GetAdjective] повністю погодився на цей запит, і незабаром американські кольори знову замайорять над каналом."
 new_england_events.303.a: "Дуже добре, ми приймаємо рішення Оттави."
 new_england_events.303.b: "Ми ніколи не підкоримося!"

 new_england_events.304.t: "Результати конференції в Баффало"
 new_england_events.304.d.return: "Представники [CAN.GetNameDef] погодилися на умови, запропоновані нашими досвідченими дипломатами. Процес виведення військ розпочався, і території, захоплені урядом Антанти, незабаром будуть повернуті до наших рук. Обидві нації погодилися на взаємний пакт про ненапад; це декларація світові про те, що канадський та американський уряди забезпечать повернення миру, порядку та демократії в Новий Світ!"
 new_england_events.304.d.partial: "Попри нашу наполегливість за столом переговорів, представники [CAN.GetNameDef] висунули зустрічну пропозицію. Посилаючись на відчайдушну потребу Канади та Антанти в ресурсах для відвоювання рідних островів, канадці попросили дозволити їм утримувати захоплені території до кінця конфлікту. Хоча ми щиро співчуваємо їхній справі, їхня тривала окупація викликає занепокоєння. Чи дозволимо ми цю тимчасову оренду американської території, чи займемо більш агресивну позицію?"
 new_england_events.304.d.total: "Обурення. Жодне інше слово не опише реакцію наших представників після того, як вони зі скандалом залишили конференцію в Баффало. Зухвалі представники [CAN.GetNameDef] відхилили нашу пропозицію щодо повернення американських територій в обмін на мир уздовж 49-ї паралелі. Імперіалістичні амбіції Британської імперії, що загрожують свободі Нового Світу, не знають меж, і зрозуміло, що всі переговори провалилися. У нас немає іншого вибору, окрім як повернути території силою зброї!"
 new_england_events.304.a: "Антанті потрібна вся можлива допомога."
 new_england_events.304.b: "Агресивна позиція щодо [CAN.GetNameDef]!"
 new_england_events.304.c: "Давайте відступимо."
 new_england_events.304.e: "За процвітаюче майбутнє!"

 new_england_events.305.t: "[NEE.GetNameDefCap] погрожує війною за американські території"
 new_england_events.305.d: "Посланці з конференції в Баффало терміново повідомили Міністерство закордонних справ в Оттаві про загрозу війни. Здається, відносини перебувають на межі розриву, а всі переговори провалилися. Їхні поспішні голоси на іншому кінці лінії свідчать про те, що американці не кидають порожніх погроз. Канада опинилася в скрутному становищі, і війна з [NEE.GetNameDef] може виявитися не на нашу користь."
 new_england_events.305.a: "Ми не можемо собі цього дозволити. Відступити і погодитися на їхні умови."
 new_england_events.305.b: "Це блеф. Ми відкинемо янкі назад, як робили це раніше."

 new_england_events.306.t: "Відповідь [CAN.GetAdjective]"
 new_england_events.306.d.peace: "Сьогодні по всій країні відчулося полегшення, оскільки канадський уряд вирішив передати території, захоплені на початку другої американської громадянської війни. Визнаючи нашу військову та економічну міць, канадський уряд підкреслив, що не бажає нічого іншого, окрім відновлення миру та демократії в Америці. Хоча їхня початкова реакція могла бути войовничою, це стало значною дипломатичною перемогою нашої країни."
 new_england_events.306.d.war: "Перед загрозою вторгнення зухвалий канадський уряд все одно відмовився повернути захоплені території. Хоча ми не хочемо втягувати нашу націю у війну, у нас немає іншого вибору, окрім як втілити погрозу, висловлену наприкінці конференції в Баффало. З нашою відродженою військовою та економічною міццю ми завдамо Британській імперії останнього нищівного удару і покладемо край їхній так званій «імперії»."
 new_england_events.306.a: "Зітхання без полегшення, мир у наш час."
 new_england_events.306.b: "Слава, слава, алілуя! До зброї, Америко!"

 NEE_liberate_America_idea: "Визволення Америки"

 new_england_events.307.t: "Канада повертає Гаваї американцям"
 new_england_events.307.d: "Пожежа та хаос другої американської громадянської війни охопили материкову частину Сполучених Штатів, залишивши нас напризволяще. Попри коротке повернення нашої незалежності, сьогодні вранці Міністерство закордонних справ в Оттаві повідомило нас, що їхній захист над нашими островами припинився з відновленням єдиної Америки. Хоча дехто готовий прийняти повернення статусу американської території, дехто прагне незалежних Гаваїв, вільних від правління в [NEE.Capital.GetCapitalVictoryPointName]."
 new_england_events.307.a: "Гаваї вдячно повернуться до Союзу. (Грати за Канаду)"
 new_england_events.307.b: "Гаваї вдячно повернуться до Союзу. (Грати за [NEE.GetNameDef])"

 new_england_events.308.t: "Угоди Санта-Фе"
 new_england_events.308.d.start: "Враховуючи нестабільність, спричинену мексиканською революцією та другою американською громадянською війною, наші відносини з американцями останніми роками були напруженими. Однак тепер, коли [FROM.GetNameDef] знову звертає погляд назовні, нас нещодавно запросили до Санта-Фе, щоб обговорити майбутнє мексикано-американських відносин. Проте замість обіцянок взаємної безпеки ми зустріли лише зухвалі вимоги.\n\n"
 new_england_events.308.d.end: "Крім того, вони вимагають негайного відновлення «незаконно захоплених» прав на американську нафту, а також повної демобілізації наших збройних сил в обмін на їхній «захист». Можна з упевненістю сказати, що прийняття цих вимог перетворить нас на звичайну американську маріонетку — але водночас їх відхилення може призвести до війни проти переважаючого ворога."
 new_england_events.308.d.mex_ti: "$new_england_events.308.d.start$Не бажаючи терпіти кордон із [ROOT.GetFactionName], американці вимагають від нас не лише переглянути наш глобальний курс, а й замінити наш уряд на той, що ближчий до їхнього уявлення про «справжню демократію». $new_england_events.308.d.end$"
 new_england_events.308.d.mex_soc: "$new_england_events.308.d.start$Не бажаючи терпіти кордон із «радикально антидемократичною» державою, американці вимагають, щоб ми замінили наш уряд на той, що ближчий до їхнього уявлення про «справжню демократію». $new_england_events.308.d.end$"
 new_england_events.308.d.mex_auth: "$new_england_events.308.d.start$Не бажаючи терпіти кордон із «диктаторською та автократичною» державою, американці вимагають, щоб ми замінили наш уряд на той, що ближчий до їхнього уявлення про «справжню демократію». $new_england_events.308.d.end$"
 new_england_events.308.d.mex_dem: "Враховуючи нестабільність, спричинену мексиканською революцією та другою американською громадянською війною, наші відносини з американцями останніми роками були напруженими. Однак тепер, коли [FROM.GetNameDef] знову звертає погляд назовні, нас нещодавно запросили до Санта-Фе, щоб обговорити майбутнє мексикано-американських відносин.\n\nВ обмін на відновлення «незаконно захоплених» прав на американську нафту нам запропонували взаємний пакт про ненапад, а також перспективу подальшої співпраці між нашими двома націями у майбутньому. Як нам відповісти на цю пропозицію?"
 new_england_events.308.a: "Американці погрожують нам! Негайно повідомте в [INT.Capital.GetCapitalVictoryPointName]!"
 new_england_events.308.b: "Ми приймемо ці умови."
 new_england_events.308.c: "За кого вони нас мають? Ми ніколи не схилимося перед ними!"

# Default terms are as follows, MEX must leave TI if they are in it. If MEX is not Soc Dem, they must switch governments to Soc Dem. American Companies must also get their oil rights back that got nationalised at the onset of the American civil war. Then MEX has two options, join the Organisation of American states, or demobilise their armed forces with a restriction on conscription. If they demobilise, MEX gets an NEE guarantee in exchange for a NAP to NEE
# Social Democrats must give oil rights back and will be offered a mutual NAP until the OAS is formed

 new_england_events.309.t: "Наші північноамериканські союзники під загрозою!"
 new_england_events.309.d: "Сьогодні з мексиканського посольства надійшли тривожні новини: посол отримав термінову депешу з Мехіко про те, що [NEE.GetNameDef] висунула мексиканській нації принизливий ультиматум. Прокляті капіталісти з [NEE.GetNameDef] вимагають відновлення своїх прав на нафту, придушення мексиканського соціалізму та відмови від союзу з нами. Поки «яструби» вимагають негайно відправити спорядження та людей для захисту Мексики від капіталістичного імперіалізму, дехто припускає, що війна з американцями може виснажити наші і без того обмежені ресурси."
 new_england_events.309.a: "Інтернаціонал підтримує всіх. Мексика не залишиться наодинці!"
 new_england_events.309.b: "Наші ресурси обмежені, повідомте Мексиці, що вони самі по собі."

 new_england_events.310.t: "Відповідь від [INT.GetName]"
 new_england_events.310.d.mex_support: "Наші заклики про допомогу були почуті! Попри войовничу позицію капіталістичних свиней, Інтернаціонал пообіцяв, що не стоятиме осторонь, поки нашій нації загрожують. Робітники світу сильніші разом, a las barricadas!"
 new_england_events.310.d.mex_alone: "Сумні новини з Парижа: Інтернаціонал повідомив, що ми залишилися самі. Якими б не були причини, допомоги від Парижа чи Лондона не буде, якщо ми відхилимо американські умови. Поки песимісти просять нас погодитися, щоб уникнути важкої війни, радикали стверджують, що нашої сили та рішучості достатньо, щоб відкинути імперіалістів назад за кордон!"
 new_england_events.310.a: "У нас немає іншого вибору, окрім як погодитися."
 new_england_events.310.b: "Viva Mexico! Ми відхилимо їхні безпідставні погрози!"

 NEE_MEX_declines_terms_tt: "§RВідхилення американських умов, ймовірно, спровокує війну між нашими націями!§!"

 new_england_events.311.t: "Відповідь Мексики на угоди Санта-Фе"
 new_england_events.311.d.mex_accept: "Після днів переговорів, компромісів та затримок мексиканський уряд повідомив нам, що приймає всі умови угод Санта-Фе. Це значна дипломатична перемога: тепер на південному кордоні немає радикального впливу, і ми відновили тісні зв'язки з мексиканською нацією. Наразі між нашими країнами панує мир, а в Мексиці відновлено демократію."
 new_england_events.311.d.mex_deny: "Попри наші найкращі наміри, мексиканські делегати повідомили, що не приймуть наші вимоги. Вони продовжують дотримуватися антидемократичних традицій і відмовляються повертати наше майно. Оскільки ми матимемо радикального сусіда, що прагне лише нашого розвалу, прихильники жорсткої лінії просять Конгрес офіційно оголосити війну. Проте помірковані закликають відступити, оскільки країна може не витримати війни зараз."
 new_england_events.311.a: "За зміцнення зв'язків! Salud!"
 new_england_events.311.b: "Ми не потерпимо цієї загрози. Готуйте війська!"
 new_england_events.311.c: "Ми не в тому стані, щоб вести війну."

 new_england_events.312.t: "[NEE.GetName] вимагає повернення Панамського каналу"
 new_england_events.312.d.ispuppet: "Сьогодні вранці посол [NEE.GetNameDef] звернувся від імені своєї нації з вимогою повернути Панамський канал. Хоча канал перебував в американській сфері впливу, вони втратили контроль над ним під час хаотичної громадянської війни. Відновивши сили, американці знову прагнуть повернути цю життєво важливу територію, що з'єднує Тихий та Атлантичний океани. Повідоммо [THIS.overlord.GetName], яким буде найкраще рішення."
 new_england_events.312.d.isindependent: "Сьогодні вранці посол [NEE.GetNameDef] звернувся від імені своєї нації з вимогою повернути Панамський канал. Хоча канал перебував в американській сфері впливу, вони втратили контроль над ним під час хаотичної громадянської війни. Відновивши сили, американці знову прагнуть повернути цю територію. Чи варто нам утримувати канал, ризикуючи конфліктом, чи повернути його мирно?"
 new_england_events.312.a: "Запитаймо [THIS.overlord.GetName] про їхнє рішення."
 new_england_events.312.b: "Повернути канал."
 new_england_events.312.c: "Залишити канал собі!"

 new_england_events.313.t: "[NEE.GetName] вимагає повернення Панамського каналу"
 new_england_events.313.d: "Ми отримали звістку з Панами про те, що [NEE.GetNameDef] вимагає офіційного повернення Панамського каналу. Хоча канал був побудований під наглядом США і належав їм, громадянська війна дозволила Панамі захопити контроль. Тепер, коли Америка знову зміцніла, дехто в нашому уряді наполягає на поверненні контролю [NEE.GetNameDef], хоча ми завжди можемо відмовити."
 new_england_events.313.a: "Передати канал"
 new_england_events.313.b: "Залишити канал собі"

 new_england_events.314.t: "Відповідь від [THIS.overlord.GetName]"
 new_england_events.314.d1: "Здається, вражений американською міццю, уряд [THIS.overlord.GetName] хоче, щоб ми почали мирну передачу каналу назад [NEE.GetNameDef]. Хоча багато панамців обурені цим рішенням, ми не в тому стані, щоб висувати вимоги. Скоро над каналом замайорять зірки й смуги, поклавши край нашій короткій окупації."
 new_england_events.314.d2: "Наші занепокоєння почули! Попри американські аргументи, [THIS.overlord.GetName] повідомив нашому керівництву, що не бажає повернення каналу американцям. Це значна дипломатична перемога, але вона, найімовірніше, розлютить [NEE.GetNameDef]."
 new_england_events.314.a: "Канал буде повернуто американцям."
 new_england_events.314.b: "Не цього разу, янкі."

 new_england_events.315.t: "Повідомлення з посольства [685.owner.GetAdjective]"
 new_england_events.315.d1: "Те, що колись належало нам, повернулося. Лихо, що охопило країну, змусило нас здаватися слабкими, і за нашої відсутності [685.owner.GetName] захопили Панамський канал, який ми збудували. Однак сьогодні посол передав ноту, в якій вказано, що уряд Панами готовий мирно розлучитися з каналом. Це величезна моральна та дипломатична перемога [NEE.GetNameDef]."
 new_england_events.315.d2: "Зухвалим жестом посол [685.owner.GetAdjective] сьогодні вранці передав ноту про те, що їхній уряд відмовляється повертати канал — попри нашу військову та морську міць. Схоже, якщо нація [685.owner.GetName] не слухає розуму, вона почує силу американської армії. Перемога буде швидкою, і канал знову буде нашим."
 new_england_events.315.a: "Крок за кроком ми відновлюємо свою силу."
 new_england_events.315.b: "Що ж, вони обрали... невдало."

 declined_to_join_OAS: "Відмовилися приєднатися до Організації американських держав"

 new_england_events.316.t: "[NEE.GetNameDefCap] запрошує нас до Організації американських держав"
 new_england_events.316.d: "[NEE.GetNameDefCap] офіційно запросила нас приєднатися до Організації американських держав. Оскільки колос Нового Світу зумів відбудуватися після найкривавішого конфлікту в історії континенту, американці кличуть нас до коаліції однодумців — демократичних націй Західної півкулі. Організація Американських Держав зосередиться на торгівлі та тісних зв'язках із [NEE.Capital.GetCapitalVictoryPointName], тоді як міць [NEE.GetName] гарантуватиме нашу незалежність."
 new_england_events.316.a: "За вільний та демократичний Новий Світ!"
 new_england_events.316.b: "Ми ввічливо відмовляємося."

 new_england_events.317.t: "[FROM.GetName] відповідає на наше запрошення"
 new_england_events.317.d1: "Сьогодні вранці посол [FROM.GetName] передав ноту про готовність своєї країни приєднатися до Організації американських держав. Разом ми забезпечимо зміцнення торговельних зв'язків та захистимо Західну півкулю завдяки колективній безпеці."
 new_england_events.317.d2: "Сьогодні вранці посол [FROM.GetName] передав ноту про те, що їхня нація не бажає приєднуватися до Організації американських держав. Заявивши, що вони не потребують захисту [NEE.GetNameDef] і можуть впоратися самі, вони підкреслили, що вдячні за пропозицію, але змушені її відхилити."
 new_england_events.317.a: "Ласкаво просимо!"
 new_england_events.317.b: "Шкода."

 new_england_events.318.t: "[NEE.GetNameDefCap] вимагає, щоб ми покинули наш альянс"
 new_england_events.318.d: "Протягом століття так звана «доктрина Монро» диктувала нашу зовнішню політику, проти нашої волі утримуючи нас в американській сфері впливу. Крах Америки під час війни змусив нас шукати захисту та економічних зв'язків у [THIS.faction_leader.GetName]. Однак, відновивши сили, [NEE.GetName] знову заявляє права на опіку над Західною півкулею. Вони вимагають, щоб ми покинули наш альянс і приєдналися до них. Ми повинні негайно повідомити [THIS.faction_leader.GetName] про ці вимоги. Ми не потерпимо такої зухвалої агресії!"
 new_england_events.318.a: "Американці погрожують нам!"

 new_england_events.319.t: "[NEE.GetNameDefCap] вимагає, щоб [FROM.GetNameDef] покинув наш альянс"
 new_england_events.319.d: "Ми отримали звістку з американського посольства: [NEE.GetNameDef] вимагає, щоб [FROM.GetNameDef] розірвав союз із нами та перейшов до американської сфери впливу. Стверджуючи, що вони є законним наступником США, [NEE.GetNameDef] заявляє про відновлення «доктрини Монро» та недопустимість європейського впливу в Америці. Вони наполягають на тому, щоб ми припинили підтримку [FROM.GetNameDef] і дозволили [NEE.GetName] надати їм захист та допомогу."
 new_england_events.319.a: "Америка не буде нашою сферою. Ми відступимо."
 new_england_events.319.b: "[NEE.GetNameDefCap] не в тому стані, щоб висувати нам вимоги."

 NEE_OAS_decisions: "Організація американських держав"
 NEE_OAS_decisions_desc: "Реакціонери та революціонери продовжуватимуть прибувати з Європи до Нового Світу. Якщо Америка має бути маяком демократії, вона повинна відновити захист націй Західної півкулі, багато з яких вразливі до іноземної дестабілізації. Щоб захистити цю півкулю, [NEE.GetNameDef] має відбудувати доктрину Монро для вільного світу 20-го століття."
