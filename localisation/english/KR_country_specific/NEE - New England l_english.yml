 NEE_united_states_congress: "Конгрес Нової Англії"
 NEE_united_states_congress_sic_desc: "§YЗасновано:§! §L4 березня 1789 року в Нью-Йорку, штат Нью-Йорк, Сполучені Штати Америки§!\n§YДовідка:§! §LКонгрес наділений повноваженнями писати закони, приймати бюджет та оголошувати війну. Положення про подолання вето, що вимагає згоди двох третин обох палат, дозволяє контролювати президентське право вето.§!"

 NEE_wilbur_cross: "Вілбур Луcius Кросс"
 NEE_wilbur_cross_leader_desc: "§YНародився:§! §L10 квітня 1862 року в Менсфілді, Коннектикут, Сполучені Штати Америки§!\n§YДовідка:§! §LКросс відомий на американській літературній арені завдяки своїм талановитим працям з аналізу англійської літератури. З академічного середовища Кросс перейшов у політику, вигравши вибори на посаду губернатора штату Коннектикут. З початком громадянської війни Кросс опинився у хисткому становищі після канадської окупації Нової Англії. Будучи одним із багатьох американців, які просили канадський уряд про втручання, готовність Кросса вітати прихід Антанти в Америку змусила декого підозрювати, що він є не більше ніж маріонеткою колишньої Британської імперії. Хоча на папері він є лідером тимчасового уряду під керівництвом Оттави, він також виконує обов'язки тимчасового керівника Нової Англії, доки не буде обрано відповідного президента.§!"

 NEE_david_walsh: "Девід І. Волш"
 NEE_david_walsh_leader_desc: "§YНародився:§! §L11 листопада 1872 року в Лемінстері, Массачусетс, Сполучені Штати Америки§!\n§YДовідка:§! §LДевід Ігнатіус Волш у юності відвідував місцеві державні школи, після чого навчався на юридичному факультеті Бостонського університету і був прийнятий до колегії адвокатів. Прийшовши в політику як демократ у традиційно республіканському окрузі, Волш пропонував посилити відповідальність уряду за благодійну діяльність і допомогу психічно хворим, а також виступав за цензуру расистського фільму «Народження нації». Справді, Волш є непохитним противником расизму, що пронизує американське суспільство; на Національному з'їзді Демократичної партії 1924 року він засудив Ку-клукс-клан. Як прихильник сучасних трудових стандартів, Волш знайшов потужну підтримку серед робітничого класу Нової Англії.\n\nВідомий своїм політичним популізмом і нібито розкішним способом життя, Волш успішно працював на посаді першого сенатора-католика ірландського походження від штату Массачусетс. Коли вибухнула велика громадянська війна, Волш швидко очолив Демократичну партію в Новій Англії. Будучи помітним прихильником ізоляціонізму під час Вельткріґу, Волш викликав роздратування у своїх канадських сусідів через свої антиімперіалістичні погляди. Хоча канадсько-американські зв'язки міцні як ніколи, антиінтервенціоністська позиція Волша, безперечно, призведе до конфлікту між двома країнами.\n\nРазом із президентом Волшем працює не хто інший, як колишній сенатор від Род-Айленда Теодор Грін. Активний член Демократичної партії, незважаючи на похилий вік, Грін виступає проти ізоляціонізму Волша, натомість вважаючи, що шлях Америки полягає в допомозі решті вільного світу.§!"

 NEE_charles_hurley: "Чарльз Ф. Герлі"
 NEE_charles_hurley_leader_desc: "§YНародився:§! §L24 листопада 1893 року в Кембриджі, Массачусетс, Сполучені Штати Америки§!\n§YДовідка:§! §LРанні роки Чарльза Френсіса Герлі були затьмарені трагедією — він втратив обох батьків у юному віці. Його виховувала економка сім'ї, колишня окружна прокурорка США, після чого він навчався в Бостонському коледжі та став продавцем спортивних товарів. Потім Герлі розпочав кар'єру в місцевій політиці, перш ніж три терміни поспіль обіймати посаду казначея штату Массачусетс від Демократичної партії. Успіх на політичній арені переконав його у більших амбіціях, і він успішно балотувався в губернатори на виборах 1936 року. Поки нація занурювалася в хаос, цей ірландсько-американський губернатор прагнув вирішити напруженість між протестантами «янкі» та ірландськими католиками. Після руйнівного урагану в Новій Англії 1938 року Герлі керував зусиллями з надання допомоги та відбудови Бостона.\n\nТепер новообраний 33-й президент Сполучених Штатів опинився у набагато важливішій ролі захисника американської демократії перед лицем радикалів та реакціонерів. Разом із Герлі працює його колега-демократ Пітер Джеррі, заможний сенатор від штату Род-Айленд. У юності наставником і вчителем Джеррі був не хто інший, як канадський політик Вільям Лайон Маккензі Кінг.§!"

 NEE_maurice_tobin: "Моріс Дж. Тобін"
 NEE_maurice_tobin_leader_desc: "§YНародився:§! §L22 травня 1901 року в Бостоні, Массачусетс, Сполучені Штати Америки§!\n§YДовідка:§! §LКатолицьке та ірландське походження Моріса Джозефа Тобіна зробило його надзвичайно популярним серед ірландського населення Бостона. Після закінчення Бостонського університету він недовго працював у компаніях Conway Leather та New England Telephone, поки не пішов у політику як протеже шанованого демократа Джеймса Керлі. У віці всього 25 років Тобін був обраний до Палати представників штату Массачусетс, де працював у 1925-1929 роках. Будучи фіскально консервативною людиною, Тобін згодом став мером Бостона, керуючи містом без санкціонування масштабних державних проектів. Його кар'єру на посаді мера сколихнула пожежа в нічному клубі «Коконат-Гроув», але скандал не завадив амбітному Тобіну балотуватися в президенти. Енергійний та активний член Демократичної партії, Тобін був обраний 34-м президентом, забезпечивши демократам ще чотири роки в Білому домі. Нація чекає на дії нового президента, особливо представники робітничого руху, оскільки Тобін був постійним прихильником профспілок та соціально-ліберальної політики.\n\nРазом із Тобіном працює Джеймс Фарлі, нью-йоркський ірландець-католик і член Мальтійського ордену. Запеклий борець за громадянські права, особливо для афроамериканців, Фарлі оголосив, що контролюватиме відбудову поштової служби країни та значно покращить її можливості в галузі авіапошти. Ці двоє чоловіків заприсяглися остаточно возз'єднати та відбудувати Америку під керівництвом Демократичної партії.§!"

 NEE_william_harriman: "В. Аверелл Гарріман"
 NEE_william_harriman_leader_desc: "§YНародився:§! §L15 листопада 1891 року в Нью-Йорку, штат Нью-Йорк, Сполучені Штати Америки§!\n§YДовідка:§! §LАверелл Гарріман, народжений як «Вільям» Гарріман, виховувався в багатстві, оскільки його батько був залізничним бароном Е. Г. Гарріманом. Під час навчання в школі Гротон та Єльському університеті Гарріман зав'язав контакти, що призвели до створення великої фірми «Brown Brothers Harriman & Co.». Протягом 1930-х років власність Гаррімана зросла і включала залізницю Union Pacific, суднобудівну корпорацію Merchant та корпорацію Polaroid. Величезні статки Гаррімана зробили його ворогом в очах синдикалістів у роки, що передували громадянській війні. Під час хаосу Гарріман втік на північ до Тимчасового уряду Нової Англії, де приєднався до Комітету канадсько-американських відносин і допомагав координувати спільні воєнні зусилля Нової Англії та Канади. На цій посаді Гарріман здобув досвід, необхідний для того, щоб стати послом США в Канаді, сприяючи тісним відносинам між двома країнами.\n\nОтримавши номінацію від Демократичної партії та здобувши перемогу на виборах 1948 року, Гарріман став 35-м президентом Сполучених Штатів Америки. Перед новим президентом стоїть багато роботи, оскільки починають з'являтися ознаки повного відновлення, а роки реконструкції нарешті добігають кінця. Разом із Гарріманом працюватиме колишній конгресмен від штату Массачусетс Джон В. Маккормак. Прихильник «другого квадратного курсу» за часів тимчасового уряду, Маккормак публічно заявив про свою підтримку гарантованих прав та заробітної плати робітничого класу.§!"

 NEE_chester_bowles: "Честер Боулз"
 NEE_chester_bowles_leader_desc: "§YНародився:§! §L5 квітня 1901 року в Спрінґфілді, Массачусетс, Сполучені Штати Америки§!\n§YДовідка:§! §LЧестер Блісс Боулз походив з республіканської родини, яка ненавиділа і боялася великого уряду. Однак політичні погляди Боулза сформувалися під впливом його тітки Рут Стендіш Болдуін, соціалістки та подруги Нормана Томаса. Після закінчення Єльського університету Боулз став керівником у сфері реклами, хоча був змушений тікати з Нью-Йорка через початок громадянської війни. Спочатку він виступав проти втручання Канади в американську політику і приєднався до комітету «Америка перш за все», хоча висловив підтримку Новій Англії після того, як тимчасовий уряд вступив у війну. Після громадянської війни Боулз очолив Управління економічної стабілізації, використовуючи свій досвід в економіці для відбудови понівеченої війною економіки країни. У 1948 році він став губернатором Коннектикуту, перемігши Джеймса К. Шеннона, скасував сегрегацію в підрозділах Національної гвардії та прийняв акти щодо покращення психічного здоров'я та житлових умов.\n\nТепер, ставши 36-м президентом Сполучених Штатів після перемоги на виборах 1952 року, Боулз планує очолити нову Америку, готову допомагати розвиватися слабшим народам світу. Усвідомлюючи, що відновлену промислову та військову міць Америки краще використовувати для служіння світу, Боулз наполягатиме на активнішій участі США у світових справах заради підтримання миру. Разом із Боулзом працюватиме Пол Девер, губернатор Массачусетсу та колишній лейтенант-командер часів громадянської війни. Наймолодший в історії генеральний прокурор Массачусетсу, Девер на посаді губернатора провів реформи у сфері психічного здоров'я та докладав зусиль для протидії внутрішньому синдикалізму.§!"

 NEE_joseph_martin_jr: "Джозеф Вільям Мартін-молодший"
 NEE_joseph_martin_jr_leader_desc: "§YНародився:§! §L3 листопада 1884 року в Норт-Аттлборо, Массачусетс, Сполучені Штати Америки§!\n§YДовідка:§! §LДжозеф Мартін-молодший походив з ірландської родини з Нової Англії, у юності грав у бейсбол і працював редактором газети. Як так званий «співчутливий консерватор», Мартін підтримує використання консервативних методів і концепцій для значного покращення добробуту суспільства.\n\nПройшовши шлях від місцевої, а потім і штатної політики Массачусетсу, Мартін отримав місце в Конгресі як представник Республіканської партії. Коли нація занурилася в хаос і поспіхом був обраний новий тимчасовий президент, Мартін був обраний від об'єднаної коаліційної партії демократів і республіканців.\n\nЙого віце-президентом є колишній губернатор-демократ Массачусетсу та консервативний демократ Джозеф Б. Елі. Здобувши славу серед жителів Нової Англії завдяки своїм діям під час Великої депресії, Елі був обраний компромісним комітетом через його роль у боротьбі з безробіттям та бідністю. Хоча напруженість між Демократичною та Республіканською партіями все ще існує, дім, розділений сам у собі, не зможе встояти в найтемнішу годину Америки.§!"

 NEE_lewis_barrows: "Льюїс О. Барроуз"
 NEE_lewis_barrows_leader_desc: "§YНародився:§! §L7 червня 1893 року в Ньюпорті, штат Мен, Сполучені Штати Америки§!\n§YДовідка:§! §LЛьюїс Орін Барроуз навчався в місцевих школах навколо Ньюпорта, після чого закінчив Університет Мену за спеціальністю фармація. Його політична кар'єра почалася з місцевих посад у Ньюпорті, наприклад, казначея, а згодом він став членом комітету штату від Республіканської партії. Коли у 1936 році нація занурилася в хаос, штат Мен залишився майже не зачепленим насильством, і Барроуз на посаді державного секретаря штату Мен подбав про те, щоб штат залишався вільним від радикалізму під його керівництвом.\n\nЗ початком другої громадянської війни Барроуз разом з іншими видатними політиками та губернаторами Нової Англії був серед тих, хто звернувся до Канади за захистом. Представляючи залишки Республіканської партії, Барроуз був висунутий на посаду тимчасового президента в надії на майбутнє відновлення американської демократії. Разом із президентом Барроузом працює віце-президент Генрі Стайлз Бріджес, колишній губернатор Нью-Гемпшира. Викладач і бізнесмен, Стайлз Бріджес був наймолодшим губернатором штату того часу і тепер прагне приєднатися до адміністрації Барроуза.§!"

 NEE_john_winant: "Джон Г. Вайнант"
 NEE_john_winant_leader_desc: "§YНародився:§! §L23 лютого 1889 року в Нью-Йорку, штат Нью-Йорк, Сполучені Штати Америки§!\n§YДовідка:§! §LНароджений в Іст-Сайді, Джон Гілберт Вайнант походив із заможної родини і навчався в Принстонському університеті, хоча його оцінки були відносно низькими. Після короткої служби в армії Вайнант пішов у політику штату, будучи обраним до Сенату Нью-Гемпшира. Після успішної кар'єри в Сенаті Вайнант став губернатором Нью-Гемпшира від Республіканської партії у 1925-1927, а потім у 1931-1935 роках. Він здобув славу в межах штату завдяки своїм діям під час десятирічної економічної депресії, що охопила Америку. Беручи активну участь у політиці «квадратного курсу», яка допомогла покласти край депресії в Новій Англії, Вайнант був легко обраний своєю партією, щоб вести Нову Англію вперед у її найважчі дні. Після губернаторства Вайнант обійняв впливову посаду посла США в Канаді, де відіграв роль у численних взаємодіях між тимчасовим урядом та канадською державою. 33-й президент Сполучених Штатів стоїть перед розбитою нацією, але прагне возз'єднати її та знову посісти місце гегемона Нового Світу.\n\nРазом із Вайнантом працює Фредерік Гейл, юрист із Мену та сенатор із Гарвардського університету. Багаторічний республіканець і голова Комітету з канадських відносин, Гейл публічно висловлював запеклі антикланівські погляди і не боявся засуджувати Ку-клукс-клан.§!"

 NEE_raymond_baldwin: "Реймонд Е. Болдуін"
 NEE_raymond_baldwin_leader_desc: "§YНародився:§! §L31 серпня 1893 року в Раї, штат Нью-Йорк, Сполучені Штати Америки§!\n§YДовідка:§! §LРеймонд Ерл Болдуін переїхав до Коннектикуту в юному віці, де провів студентські роки в Єльському університеті. Болдуін працював прокурором у міському суді Стратфорда, зрештою ставши суддею цього суду у 1931 році. Коли країна розвалилася, губернатор Коннектикуту Болдуін був серед тих, хто просив канадський уряд втрутитися через громадянську війну. Щоб гарантувати безпеку жителів Нової Англії, Болдуін керував складною мережею цивільної оборони та служб штату в тилу, що підвищило його популярність у Республіканській партії. Перед ним стоїть складне завдання, поки нація оговтується від жахів великої війни — лише час покаже, чи призведе керівництво Болдуіна до процвітання та миру в майбутньому.\n\nРазом із Болдуіном працює нью-йоркець Ірвінґ Айвз, людина, чия родина походить від перших поселенців Нової Англії. Багато разів переобраний до Асамблеї штату Нью-Йорк, Айвз публічно висловлював бажання покласти край дискримінації на робочому місці за ознаками раси, віросповідання та кольору шкіри. Разом вони заприсяглися остаточно возз'єднати та відбудувати Америку під керівництвом Республіканської партії.§!"

 NEE_george_aiken: "Джордж Айкен"
 NEE_george_aiken_leader_desc: "§YНародився:§! §L20 серпня 1892 року в Даммерстоні, Вермонт, Сполучені Штати Америки§!\n§YДовідка:§! §LДжордж Девід Айкен рано виявив інтерес до сільського господарства — пристрасть, яку він пронесе крізь усю свою кар'єру губернатора Вермонту. Республіканець, він невдало балотувався до Палати представників Вермонту в 1922 році, але успішно пройшов у 1930 та 1932 роках. Він обійняв посаду віце-губернатора у 1934 році та став губернатором у 1936 році, саме тоді, коли нація занурилася в хаос. Як губернатор Вермонту під час громадянської війни, Айкен допомагав організовувати робочі проекти, щоб полегшити економічний тиск, спричинений роками великої депресії. Прихильник проектів витрат для сільської Америки, Айкен з великою любов'ю ставиться до природної краси свого рідного штату, хоча ці погляди ставили його в опозицію до республіканців «старої гвардії». Завдяки своєму досвіду в сільському господарстві він позиціонував себе як захисник фермерів та простих людей — з такою позицією та популярністю він прийняв номінацію від республіканців на виборчу кампанію 1948 року.\n\nСтавши 35-м президентом Сполучених Штатів, Айкен стоїть перед нацією, яка нарешті оговтується після років економічного лиха та нестабільності. Разом із Айкеном працює Роберт Бредфорд, республіканський віце-губернатор Бостона, людина з давньої традиційної родини Нової Англії. Під час роботи на посаді віце-губернатора Бредфорд наголошував на фіскальному консерватизмі, але соціально-ліберальних цінностях, що проявилося в його проектах, таких як житло та догляд за ветеранами громадянської війни.§!"

 NEE_thomas_dewey: "Томас Е. Дьюї"
 NEE_thomas_dewey_leader_desc: "§YНародився:§! §L24 березня 1902 року в Овоссо, Мічиган, Сполучені Штати Америки§!\n§YДовідка:§! §LТомас Едмунд Дьюї навчався в Мічиганському університеті, де короткий час думав про кар'єру співака. Після того, як хвороба горла переконала його в ризикованості такої роботи, Дьюї натомість зайнявся правом, що привело його до Нью-Йорка. Спочатку працюючи федеральним прокурором, Дьюї потрапив у заголовки газет у 1930-х роках, переслідуючи гангстера Ваксі Гордона. Маючи чудову пам'ять, Дьюї використовував деталі злочинів та прослуховування телефонних розмов, щоб знищити злочинні організації. Однак, на жаль для Дьюї, велика громадянська війна змусила його втекти з Нью-Йорка на північ до Нової Англії, де він працював губернатором у 1942, 1946 та 1950 роках. Вважаючись чесним та ефективним губернатором, Дьюї заборонив расову дискримінацію при працевлаштуванні та збільшив державну допомогу на освіту і зарплати держслужбовцям. Його повоєнний «Фонд реконструкції» допоміг Нью-Йорку відновитися після років жорстокої громадянської війни, яка вщент спустошила мегаполіс, і з такою славою він отримав номінацію від республіканців у 1952 році.\n\nЗдобувши перемогу на виборах 1952 року, Дьюї тепер є 36-м президентом Сполучених Штатів і очолює могутню Америку, для якої роки громадянської війни та нестабільності залишилися далеко позаду. Разом із ним працює онук легендарного американського нафтового барона Джона Рокфеллера — Нельсон Рокфеллер. Відомий колекціонер мистецтва, бізнесмен і політик, Рокфеллер відзначається своїми ліберальними та прогресивними поглядами, незважаючи на республіканське походження.§!"

 NEE_leslie_groves_jr: "Леслі Гровс-молодший"
 NEE_leslie_groves_jr_high_command_desc: "§YНародився:§! §L17 серпня 1896 року в Олбані, штат Нью-Йорк, Сполучені Штати Америки§!\n§YДовідка:§! §LЛеслі Річард Гровс-молодший народився в сім'ї з багатою військовою історією: його батько служив під час іспано-американської війни, на Філіппінах та під час Боксерського повстання. В останні роки навчання в середній школі Гровс почав відвідувати курси в Університеті Вашингтона, сподіваючись отримати призначення до Військової академії США. Його бажання здійснилося, коли сам президент Вудро Вільсон дозволив йому претендувати на вакантне місце, але його оцінки виявилися недостатньо високими для зарахування. Натомість Гровс вступив до Массачусетського технологічного інституту (MIT), готуючись до повторного іспиту у Вест-Пойнті. У 1916 році він склав іспит і був прийнятий. У 1919 році він відвідав європейські поля битв з навчальною метою, а у 1920 році закінчив навчання у званні другого лейтенанта Корпусу інженерів, чому посприяв його досвід у MIT. Він служив у 4-му інженерному корпусі в Кемп-Льюїсі, а згодом був переведений до Форт-Вордена, де познайомився зі своєю майбутньою дружиною Грейс Вільсон. Наприкінці 1922 року його направили на Гаваї до 3-го інженерного корпусу в казармах Шофілд, де він отримав подяку за допомогу в будівництві стежки від Кахуку до Пупукеа. Він отримував численні призначення: командував ротою D 1-го інженерного батальйону, допомагав під час повені в Новій Англії 1927 року, був направлений до Нікарагуа у 1929 році для проведення досліджень щодо будівництва Нікарагуанського каналу та наглядав за водопостачанням країни після землетрусу 1931 року. Саме після повернення до розколотих Сполучених Штатів він отримав свої останні підвищення, досягнувши звання фельдмаршала в Новій Англії, головним чином через гостру нестачу здібних штабних офіцерів у регіоні.\n\n§YПримітки: Блискучий інженер; він уважно стежить за розвитком технологій ядерного поділу, підтримуючи регулярні контакти з Отто Ганом та Лізою Майтнер.§!"

 NEE_merritt_edson: "Меррітт А. Едсон"
 NEE_merritt_edson_army_chief_desc: "§YНародився:§! §L25 квітня 1897 року в Ратленді, штат Вермонт, Сполучені Штати Америки§!\n§YДовідка:§! §LМеррітт Остін Едсон вступив до Університету Вермонту у 1915 році, а в червні 1916 року приєднався до Першого піхотного полку Національної гвардії Вермонту, у складі якого був направлений до Ігл-Пасс, штат Техас, для служби на мексиканському кордоні. Він повернувся до Вермонту у вересні, але невдовзі після повернення до університету записався в резерв морської піхоти. У жовтні 1917 року він отримав звання другого лейтенанта морської піхоти, а в червні 1920 року — першого лейтенанта. Пізніше він вступив до військово-морської авіабази Пенсакола і у 1922 році отримав «золоті крила» морського авіатора. Згодом він служив на Гуамі, де пройшов підготовку в умовах напівтропічного середовища, а після повернення до США у 1925 році закінчив розширений курс авіаційної тактики в Келлі-Філд, Техас. Пізніше його відправили до Нікарагуа для боротьби з силами сандиністів, звідки він повернувся наприкінці 1929 року. Відтоді він став тренером і капіталом стрілецьких команд морської піхоти, зумівши виграти турніри 1935 та 1936 років, попри перерви через зростаючі соціальні заворушення. У лютому 1936 року він нарешті отримав звання майора і був призначений до Філадельфії. Після розпаду Союзу та початку громадянської війни Меррітту ледь вдалося дістатися Нової Англії до того, як армії перекрили кордон. Його досвід і слава забезпечили йому дострокове підвищення до звання бригадного генерала.\n\n§YПримітки: Апатичний до політики.§!"

 NEE_mark_clark: "Марк В. Кларк"
 NEE_mark_clark_army_chief_desc: "§YНародився:§! §L1 травня 1896 року в Сакетс-Гарборі, штат Нью-Йорк, Сполучені Штати Америки§!\n§YДовідка:§! §LМарк Вейн Кларк народився у сім'ї з видатною військовою історією. Його дідом був Джордж Роджерс Кларк, генерал часів Американської революції, а сам він є двоюрідним братом генерала армії Джорджа Маршалла. Він вступив до Військової академії США у Вест-Пойнті у віці 17 років, у 1913 році, але, на жаль, втратив час у кар'єрі через постійні хвороби. Під час перебування у Вест-Пойнті він зустрів і заприятелював із Двайтом Ейзенхауером. Кларк закінчив навчання у квітні 1917 року разом із Меттью Ріджвеєм та Дж. Лоутоном Коллінзом у званні другого лейтенанта. Як і його дід, він обрав службу в піхоті, отримавши призначення до 11-го піхотного полку. Згодом він обіймав різні штабні та навчальні посади, отримавши звання першого лейтенанта у 1921 році, капітана у 1925 році та майора у 1933 році після призначення інструктором Національної гвардії армії штату Індіана. Він служив заступником командувача району Цивільного корпусу збереження природи в Омасі, штат Небраска, одночасно навчаючись у Командно-штабному коледжі армії США, де знову зустрів старих однокласників, зокрема Меттью Ріджвея, а також познайомився з Волтером Беделлом Смітом та Джеффрі Кізом, з якими мав дружні стосунки. Коли внутрішня ситуація погіршилася, Кларк перебував у відпустці в Нью-Йорку, і після початку бойових дій він переїхав до Нової Англії у пошуках безпеки. Через нестачу здібних кадрів Кларка було поспіхом підвищено до бригадного генерала, і тепер він має очолити створення нової армії.\n\n§YПримітки: Хоча його лояльність не викликає сумнівів, дружба з генералами, які тепер стали ворогами, викликає побоювання, що генерал Кларк не зможе виконати свій обов'язок, коли прийде час відкрито протистояти їм на полі бою.§!"

 NEE_george_kenney: "Джордж Кенні"
 NEE_george_kenney_army_chief_desc: "§YНародився:§! §L6 серпня 1889 року в Ярмуті, Нова Шотландія, Домініон Канада§!\n§YДовідка:§! §LДжордж Черчілль Кенні вступив до Массачусетського технологічного інституту у 1907 році, де вивчав цивільне будівництво. Він не закінчив навчання, оскільки батько покинув родину, і Джордж був змушений працювати, щоб утримувати сім'ю. Пізніше він записався курсантом-пілотом до авіаційної секції Корпусу зв'язку США. 5 листопада 1917 року він отримав звання першого лейтенанта, але наступне підвищення здобув лише у 1921 році після проходження курсу в інженерній школі авіаційної служби в Дейтоні, Огайо. Він став інспектором авіаційної служби компанії Curtiss Aeroplane and Motor Company. У 1926 році Кенні став студентом Тактичної школи авіаційного корпусу в Ленґлі-Філд, Вірджинія, де дедалі більше цікавився комбінованим використанням авіації та армії для координації смертоносних атак. У вересні 1932 року Кенні вступив до Військового коледжу армії у Вашингтоні, де приєднався до одного з кількох комітетів, що вивчали битви Вельткріґу; там він став експертом з Другої битви на Мазурських озерах і почав працювати над тим, що згодом стало відомим як план «Оранж». У березні 1935 року він отримав звання підполковника і був призначений до піхотної школи у Форт-Беннінґу, Джорджія. Однак, бачивши підготовку до громадянської війни на лонґістському Півдні, Кенні був упевнений у неминучості бойових дій, тому підготував план втечі з групою лоялістів і вирушив на північ одразу після початку конфлікту. Попри всі перешкоди, літак дістався Нової Англії неушкодженим, і Кенні приєднався до Генерального штабу Нової Англії, щоб усіма силами допомагати в обороні.§!"

 NEE_willard_gordon_wyman: "Віллард Ґордон Вайман"
 NEE_willard_gordon_wyman_commander_desc: "§YНародився:§! §L21 березня 1898 року в Авґусті, штат Мен, Сполучені Штати Америки§!\n§YДовідка:§! §LВіллард Ґордон Вайман вступив до Військової академії США у 1917 році, отримав звання другого лейтенанта у береговій артилерії, а згодом перевівся до кавалерії армії США. У 1921 році він став інструктором піхоти та кавалерії, а у період з 1928 по 1932 роки здобув цінний досвід, працюючи аташе в Китаї. Після повернення отримав звання капітана. Нестача кваліфікованих кадрів змусила командування достроково надати Вайману звання бригадного генерала, але він продемонстрував готовність вчитися, попри те, що опинився у такому складному становищі.§!"

 NEE_lemuel_shepherd_jr: "Лемюел С. Шеперд-молодший"
 NEE_lemuel_shepherd_jr_commander_desc: "§YНародився:§! §L10 лютого 1896 року в Норфолку, штат Вірджинія, Сполучені Штати Америки§!\n§YДовідка:§! §LЛемюел Корнік «Лем» Шеперд-молодший закінчив Військовий інститут Вірджинії у 1917 році і одразу після цього вступив до морської піхоти у званні другого лейтенанта. Він поступово піднімався службовими сходами до звання капітана у 1922 році, коли був призначений до роти морської піхоти, що допомагала на виставці до сторіччя Бразилії, а згодом був переведений до загону морської піхоти на лінкорі USS New York. У 1927 році його відправили до Тяньцзіня для служби в 3-й бригаді морської піхоти, що охороняла американське представництво в місті. Лемюел повернувся до Америки у 1929 році та закінчив курс польових офіцерів у 1932 році. Його направили на Гаїті для служби в Garde d'Haïti як командира округу та департаменту, де він отримав звання майора. У 1934 році Шеперд був відряджений до казарм морської піхоти у Вашингтоні на посаду виконавчого офіцера та реєстратора Інституту корпусу морської піхоти, а на початку 1936 року отримав звання підполковника. Після підвищення він був призначений до Військово-морського коледжу в Ньюпорті, Род-Айленд. Коли країна поринула в громадянську війну, а Канада зайняла Нову Англію, Шеперд запропонував свої послуги уряду Нової Англії, отримавши звання бригадного генерала та призначення до корпусу морської піхоти Нової Англії, де його досвід став неоціненним для невеликого штабу регіону.§!"

 NEE_cornelius_edward_ryan: "Корнеліус Едвард Раян"
 NEE_cornelius_edward_ryan_high_command_desc: "§YНародився:§! §L12 травня 1896 року в Бостоні, Массачусетс, Сполучені Штати Америки§!\n§YДовідка:§! §LПісля школи Корнеліус Е. Раян навчався в університеті Коннектикуту, де активно грав у футбольній та баскетбольній командах, а також досяг звання першого сержанта в Корпусі підготовки офіцерів запасу. Звідти Раян розпочав військову кар'єру, вступивши на курси офіцерів ротної ланки у вересні 1922 року. Виявляючи палкий інтерес до сучасних військових технологій, Раян вивчав танки в Centre D' Etude des Chars de Combat у Комуні Франції. Коли вибухнула громадянська війна, Раян вирішив залишитися у рідному штаті Массачусетс, сподіваючись допомогти уряду Нової Англії заявити про свою легітимність посеред хаосу. У своїх дослідженнях європейських методів ведення війни Раян перебуває під сильним впливом концепції «вертикального охоплення» і вважає, що Нова Англія повинна інвестувати в повітряно-десантну підготовку. З дозволу верховного командування Раян розпочав організацію та пошук добровольців для створення перших повітряно-десантних сил Нової Англії.§!"

 NEE_ernest_harmon: "Ернест Н. Гармон"
 NEE_ernest_harmon_high_command_desc: "§YНародився:§! §L26 лютого 1894 року в Ловеллі, Массачусетс, Сполучені Штати Америки§!\n§YДовідка:§! §LТрагічно осиротівши у віці десяти років, Ернест Нейсон Гармон виховувався родичами в Ньюбері, штат Вермонт, і провів більшу частину свого юнацтва в селі Вест-Ньюбері. Він навчався в Університеті Норвіч протягом року, перш ніж у 1913 році отримав призначення до Військової академії США у Вест-Пойнті. Активний в академічному житті — займався верховою їздою, хокеєм, футболом та боксом — Гармон під час навчання у Вест-Пойнті також зблизився з іншим випускником, Марком В. Кларком. У 1921 році він був призначений до Вест-Пойнта інструктором з креслення, а до його додаткових обов'язків входило тренування футбольної команди та першої команди Вест-Пойнта з лакросу. Він служив у 6-му кавалерійському полку в Джорджії та чотири роки працював професором військових наук і комендантом кадетів у Норвічі. У 1933 році він закінчив Командно-штабний коледж армії США, а в 1934 році став випускником Воєнного коледжу армії США. Коли навесні 1937 року вибухнула громадянська війна, Гармон вирішив залишитися зі своїм близьким другом Марком В. Кларком і приєднався до Тимчасового уряду Нової Англії. Його лідерський досвід та зразкова освіта матимуть вирішальне значення для підготовки відносно недосвідчених збройних сил Нової Англії.§!"

 NEE_allan_rockwell_mccann: "Аллан Роквелл Маккенн"
 NEE_allan_rockwell_mccann_high_command_desc: "§YНародився:§! §L20 вересня 1896 року в Норт-Адамсі, Массачусетс, Сполучені Штати Америки§!\n§YДовідка:§! §LАллан Роквелл Маккенн закінчив Військово-морську академію США в березні 1917 року. Він отримав призначення на лінкор USS Kansas, де служив до вересня 1919 року. Після проходження інструктажу з підводних човнів на борту USS Fulton на базі підводних човнів у Нью-Лондоні, він приєднався до USS K-6 у січні 1920 року, командуючи цим човном з травня по вересень того ж року, а згодом командував підводними човнами USS N-4 та USS L-3 до червня 1922 року. Він перевівся на USS R-21 у Коко-Соло, де командував човном до його виведення з експлуатації в червні 1924 року. У липні 1924 року, повернувшись на базу підводних човнів у Нью-Лондоні, він протягом року працював інструктором з дизельної інженерії на судні USS Chewink. Потім він був переведений на посаду головного інженера та офіцера з ремонту цієї бази. У 1925 році він отримав додаткове призначення технічним радником Перуанської військово-морської комісії в компанії Electric Boat, а після звільнення в 1926 році командував підводним човном USS S-30 до 1929 року. Потім він два роки служив у відділі проектування, а пізніше у відділі технічного обслуговування Бюро будівництва та ремонту (нині Бюро кораблів) у департаменті військово-морського флоту у Вашингтоні. З серпня 1931 по червень 1934 року він командував підводним човном USS Bonita. На початку 1937 року він обійняв посаду командира 2-ї дивізії підводних човнів підводного флоту і перебував на цій посаді, коли було проголошено уряд Нової Англії. Після приєднання до Нової Англії він отримав звання контр-адмірала.§!"

 NEE_edward_ellsberg: "Едвард Еллсберґ"
 NEE_edward_ellsberg_admiral_desc: "§YНародився:§! §L21 листопада 1891 року в Нью-Гейвені, Коннектикут, Сполучені Штати Америки§!\n§YДовідка:§! §LЕдвард «командер Еллсберґ» був одним із небагатьох євреїв, прийнятих до Військово-морської академії США, яку він закінчив зі ступенем бакалавра наук у 1914 році, а пізніше здобув ступінь магістра наук у Массачусетському технологічному інституті у 1920 році. Еллсберґ був прийнятий на службу у флот у 1914 році та перебував на активній службі до 1926 року. Він став експертом з підводних рятувальних робіт. У 1926 році він підняв підводний човен флоту S-51. За цей успіх актом Конгресу він був підвищений до звання командера та нагороджений медаллю «За видатні заслуги» від військово-морського міністерства, відтоді він став широко відомий як «командер Еллсберґ». Еллсберґ описав підняття S-51 у своїй книзі 1929 року «На дні». Після завершення активної служби Еллсберґ працював у компанії Tide Water Oil і почав писати книги про свої пригоди та історичні події. У 1927 році Еллсберґ зголосився на активну службу, щоб врятувати вцілілих, заблокованих на затонулому підводному човні S-4. Рятувальні операції провалилися, і Еллсберґ повернувся додому на початку січня 1928 року, продовживши роботу в Tide Water Oil. Одразу після проголошення Нової Англії Еллсберґ повернувся на флот і був підвищений до звання контр-адмірала.§!"

 NEE_thomas_hart: "Томас К. Гарт"
 NEE_thomas_hart_navy_chief_desc: "§YНародився:§! §L12 червня 1877 року в Девівсоні, Мічиган, Сполучені Штати Америки§!\n§YДовідка:§! §LВипускник Військово-морської академії США в Аннаполісі 1897 року, Томас Чарльз Гарт розпочав свою видатну військово-морську кар'єру приблизно через рік під час іспано-американської війни. Будучи офіцером на борту лінкора USS Massachusetts під час блокади Сантьяго-де-Куба, Гарт отримав подяку за мужність під час командування паровим катером у затоці Кабаньяс під час пошуку місць для висадки. Попри сильний вогонь берегових батарей, Гарт успішно виконав завдання і не зазнав втрат, незважаючи на численні влучання. Його вміле керування кораблем забезпечило йому місце на USS Vixen, де він на все життя затоваришував з тодішнім лейтенантом Александером Шарпом-молодшим та енсіном Артуром Макартуром III (покійним старшим братом Дугласа Макартура).\n\nПісля служби на шлюпі Гарт викладав артилерійську справу в Аннаполісі. Його зв'язки в інституті включали шлюб із донькою тодішнього суперинтенданта контр-адмірала Браунсона. Він також отримав кваліфікацію для командування підводними човнами, ставши начальником штабу командувача підводними силами Атлантичного флоту. Хоча Сполучені Штати, на щастя, не брали участі у Вельткріґу, Гарт під час свого терміну був сповнений рішучості вивчати німецькі підводні човни. Після перебування на посаді суперинтенданта Військово-морської академії США у 1931–1934 роках Гарт був призначений до Генеральної ради ВМС США. З початком громадянської війни Гарт приєднався до уряду Нової Англії разом з іншими членами Атлантичного флоту в надії зберегти демократію. Під час громадянської війни Гарт продовжує лобіювати створення сучасного підводного флоту США, який, на його думку, найкраще дозволить Новій Англії переривати іноземні поставки допомоги ворогу.§!"

 NEE_harold_stark: "Гарольд Р. Старк"
 NEE_harold_stark_navy_chief_desc: "§YНародився:§! §L12 листопада 1880 року у Вілкс-Барре, Пенсільванія, Сполучені Штати Америки§!\n§YДовідка:§! §LГарольд Рейнсфорд «Бетті» Старк вступив до військово-морської академії США у 1899 році та закінчив її у складі випуску 1903 року. Ще першокурсником він отримав прізвисько «Бетті». З 1907 по 1909 рік Старк служив на лінкорі USS Minnesota до та під час навколосвітнього плавання «Великого білого флоту». Згодом Старк довго служив на міноносцях та есмінцях, зокрема командував флотилією торпедних катерів Азіатського флоту у 1917 році, коли він служив у штабі командувача Азіатським флотом з листопада 1917 по січень 1919 року. Після Вельткріґу Старк був старшим офіцером на лінкорах North Dakota та West Virginia, навчався у Воєнному коледжі ВМС, командував судном боєприпасів USS Nitro та обіймав посади у морській артилерії. Протягом кінця 1920-х і до середини 1930-х років у званні капітана Старк послідовно був начальником штабу командувача есмінцями бойового флоту, помічником міністра військово-морського флоту та командиром USS West Virginia. З 1934 по 1936 рік, отримавши звання контр-адмірала, Старк служив начальником Бюро артилерії.\n\n§YПримітки: Старк підтримує ідею військового союзу з Канадою.§!"

