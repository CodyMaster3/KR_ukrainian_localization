 NEE_clarence_lionel_adcock_high_command_desc: "§YНародився:§! §L23 жовтня 1895 року у Волтгемі, штат Массачусетс, Сполучені Штати Америки§!"

 NEE_charles_evans_hughes_sr: "Чарльз Еванс Г'юз-старший"
 NEE_charles_evans_hughes_sr_advisor_desc: "§YНародився:§! §L11 квітня 1862 року в Гленс-Фоллс, штат Нью-Йорк, Сполучені Штати Америки§!\n§YДовідка:§! §LБатько Чарльза Г'юза-старшого емігрував з Уельсу до США у 1855 році та оселився в Нью-Йорку. Його син вступив до Університету Медісона у 1876 році та завершив юридичну освіту у 1884 році. Г'юз став губернатором Нью-Йорка у 1906 році за підтримки колишнього президента Теодора Рузвельта. Він був призначений асоційованим суддею Верховного суду в 1916 році після успішного терміну на посаді прогресивного губернатора, а в 1920 році обіймав посаду державного секретаря, допомагаючи вести переговори з Японією щодо захисту їхніх володінь на Філіппінах.§!"
 NEE_dean_acheson: "Дін Ачесон"
 NEE_dean_acheson_advisor_desc: "§YНародився:§! §L11 квітня 1893 року в Міддлтауні, Коннектикут, Сполучені Штати Америки§!\n§YДовідка:§! §LДін Ачесон народився в Коннектикуті у 1893 році та навчався в Єльському університеті. Він також був студентом Гарварду, де навчався у відомого юриста Фелікса Франкфуртера. Пізніше він став клерком судді Верховного суду Луї Брендейса та підтримував Демократичну партію під час адміністрації Ела Сміта. Ачесон є автором кількох політичних пропозицій щодо відмови долара США від золотого стандарту та більш агресивної підтримки Антанти проти німецької гегемонії.§!"
 NEE_francis_biddle: "Френсіс Біддл"
 NEE_francis_biddle_advisor_desc: "§YНародився:§! §L9 травня 1886 року в Парижі, Сена, Французька Республіка§!\n§YДовідка:§! §LФренсіс Біддл народився в Парижі та пізніше отримав американське громадянство. Він є родичем кількох історичних губернаторів США, включаючи президента Джеймса Медісона. Юридична кар'єра Біддла поєднувалася з політичним наставництвом президента Теодора Рузвельта. Він намагався просунути низку заходів для покращення відносин уряду з профспілками, сподіваючись, що це вбереже американців від відкритого синдикалістського повстання.§!"
 NEE_frances_perkins: "Френсіс Перкінс"
 NEE_frances_perkins_leader_desc: "§YНародилася:§! §L10 квітня 1880 року в Бостоні, Массачусетс, Сполучені Штати Америки§!\n§YДовідка:§! §LФренсіс Перкінс народилася в Бостоні та вивчала хімію в коледжі Маунт-Голіок. Під час навчання вона відвідала хімічний завод і звернула увагу на жахливі умови праці робітників. Згодом вона вивчала економіку в кількох коледжах, дедалі більше переймаючись проблемами пролетаріату. Її діяльність, спрямована на покращення умов праці, значною мірою допомогла вберегти більшу частину штату Нью-Йорк від синдикалістського контролю під час кризи 1936 року. Перкінс виступає за те, щоб уряд виконував свої обіцянки перед робітниками, запровадив мінімальну заробітну плату та програму страхування на випадок безробіття.§!"
 NEE_henry_morgenthau_jr: "Генрі Морґентау-молодший"
 NEE_henry_morgenthau_jr_advisor_desc: "§YНародився:§! §L11 травня 1891 року в Нью-Йорку, штат Нью-Йорк, Сполучені Штати Америки§!\n§YДовідка:§! §LГенрі Морґентау-молодший походить із видатної єврейської родини Мангеттена. Він навчався в коледжі Ліги плюща, незважаючи на квоти на вступ для єврейських студентів. Вивчаючи сільське господарство, Морґентау приєднався до Федеральної фермерської ради та разом з економістами намагався розробити політику для максимально ефективного зниження інфляції.§!"
 NEE_john_foster_dulles: "Джон Фостер Даллес"
 NEE_john_foster_dulles_advisor_desc: "§YНародився:§! §L25 лютого 1888 року у Вашингтоні, округ Колумбія, Сполучені Штати Америки§!\n§YДовідка:§! §LДжон Даллес народився у Вашингтоні та вивчав право в Університеті Джорджа Вашингтона. У 1917 році він був найнятий державним секретарем для розслідування діяльності можливих пронімецьких політиків у Нікарагуа. Даллес був членом Асоціації Ліги вільних націй разом з Елеонорою Рузвельт; метою групи було поширення інформації про світові справи. Він виступає за більш пряму пропаганду проти європейського синдикалізму.§!"
 NEE_roger_babson: "Роджер Бебсон"
 NEE_roger_babson_leader_desc: "§YНародився:§! §L6 липня 1875 року в Глостері, Массачусетс, Сполучені Штати Америки§!\n§YДовідка:§! §LРоджер Бебсон народився в Массачусетсі та навчався в MIT. У 1904 році він заснував статистичну організацію, насамперед для кількісної оцінки економічної активності та пропаганди наукового менеджменту, але також займався дослідженнями антигравітаційних технологій. Крім того, Бебсон бере участь у діяльності консервативної Партії заборони.§!"
 NEE_sinclair_weeks: "Сінклер Вікс"
 NEE_sinclair_weeks_advisor_desc: "§YНародився:§! §L15 червня 1893 року в Ньютоні, Массачусетс, Сполучені Штати Америки§!\n§YДовідка:§! §LСінклер Вікс служив у Національній гвардії США відразу після мексиканської революції. На посаді мера Ньютона він доклав значних зусиль для посилення позицій Республіканської партії на Північному Сході.§!"
 NEE_web_du_bois: "В. Е. Б. Дюбойс"
 NEE_web_du_bois_advisor_desc: "§YНародився:§! §L23 лютого 1868 року в Грейт-Баррінгтоні, Массачусетс, Сполучені Штати Америки§!\n§YДовідка:§! §LВ. Е. Б. Дюбойс — міжнародний посол афроамериканців і один із головних засновників NAACP. Дюбойс конфліктував із Букером Т. Вашингтоном, іншим видатним лідером руху за громадянські права афроамериканців, щодо напрямку боротьби. Для просування політики десегрегації та криміналізації лінчування Дюбойс використовує розгалужену мережу зв'язків — від панафриканістів до японського уряду, Німецької імперії та Комуни Франції.§!"
 NEE_allen_dulles: "Аллен Даллес"
 NEE_allen_dulles_advisor_desc: "§YНародився:§! §L7 квітня 1893 року у Вотертауні, штат Нью-Йорк, Сполучені Штати Америки§!\n§YДовідка:§! §LАллен Даллес — брат відомого теоретика права Джона Даллеса. На початку своєї дипломатичної кар'єри він намагався попередити уряд США про поширення антисемітської пропаганди в Російській та Османській імперіях. У 1920-х роках Даллес обіймав посаду директора Ради з міжнародних відносин і намагався застерегти американський уряд від наступу диктатур у Німеччині, Румунії, Британії та Японії.§!"
 NEE_george_mead: "Джордж Дж. Мід"
 NEE_george_mead_advisor_desc: "§YНародився:§! §L27 грудня 1891 року в Еверетті, Массачусетс, Сполучені Штати Америки§!\n§YДовідка:§! §LДжордж Мід народився в Массачусетсі та навчався в MIT. Спочатку він працював у компанії Crane-Simplex, проектуючи автомобілі, але в 1920-х роках перейшов до авіаконструкторства, допомагаючи створювати літаки, здатні літати швидше без перегріву двигуна. Boeing та Pratt & Whitney Aircraft покладаються на розробки Міда.§!"
 NEE_learned_hand: "Б. Лернед Генд"
 NEE_learned_hand_advisor_desc: "§YНародився:§! §L27 січня 1872 року в Олбані, штат Нью-Йорк, Сполучені Штати Америки§!\n§YДовідка:§! §LЛернед Генд народився в Нью-Йорку і прослужив федеральним суддею майже 20 років до початку війни, будучи зокрема членом Апеляційного суду 2-го округу. Його прогресивні рішення щодо свободи слова, контрактного, деліктного та авторського права здобули йому повагу з боку лівих, а підтримка Уніфікованого торгового кодексу забезпечила прихильність правих. Він став консенсусною кандидатурою для нового Верховного суду в Новій Англії.§!"

 NEE_joseph_kennedy_sr: "Джозеф Кеннеді-старший"
 NEE_joseph_kennedy_sr_advisor_desc: "§YНародився:§! §L6 вересня 1888 року в Бостоні, Массачусетс, Сполучені Штати Америки§!\n§YДовідка:§! §LДжозеф Кеннеді-старший — син політика зі штату Массачусетс і онук ірландського іммігранта. Він став президентом банку у 25 років і мільйонером у 30. Він був суднобудівником, кіномагнатом і великим спонсором Демократичної партії. Він рано відійшов від справ у 1929 році, накопичивши достатньо капіталу для створення трастового фонду на мільйон доларів. Потім, як голова Комісії з цінних паперів і бірж, Кеннеді оголосив поза законом саме ті спекулятивні практики, які зробили його багатим. Він переконаний, що Британія приречена на остаточне завоювання Німеччиною, і вважає, що єдина надія Америки полягає в ізоляціонізмі.§!"
 NEE_jay_pierrepont_moffat: "Джей П'єрпонт Моффат"
 NEE_jay_pierrepont_moffat_advisor_desc: "§YНародився:§! §L7 січня 1896 року в Раї, штат Нью-Йорк, Сполучені Штати Америки§!"
 NEE_ray_atherton: "Рей Атертон"
 NEE_ray_atherton_advisor_desc: "§YНародився:§! §L28 березня 1883 року в Бруклайні, Массачусетс, Сполучені Штати Америки§!"
 NEE_charles_bohlen: "Чарльз Е. Болен"
 NEE_charles_bohlen_advisor_desc: "§YНародився:§! §L30 серпня 1904 року в Клейтоні, штат Нью-Йорк, Сполучені Штати Америки§!"
 NEE_laurence_steinhardt: "Лоуренс Штайнгардт"
 NEE_laurence_steinhardt_advisor_desc: "§YНародився:§! §L6 жовтня 1892 року в Нью-Йорку, штат Нью-Йорк, Сполучені Штати Америки§!"
 NEE_charles_yost: "Чарльз Йост"
 NEE_charles_yost_advisor_desc: "§YНародився:§! §L6 листопада 1907 року у Вотертауні, штат Нью-Йорк, Сполучені Штати Америки§!"

