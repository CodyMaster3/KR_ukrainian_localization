 NEE_vannevar_bush: "Веннівер Буш"
 NEE_vannevar_bush_scientist_desc: "§YНародився:§! §L11 березня 1890 року в Еверетті, Массачусетс, Сполучені Штати Америки§!"
 NEE_william_francis_gibbs: "Вільям Френсіс Ґіббс"
