 NEE_Underground_Railroad_Smuggling_dc: "Підземна залізниця"
 NEE_Underground_Railroad_Smuggling_dc_desc: "Поки решта Америки поринула в темряву Другої Американської громадянської війни, народ Нової Англії був врятований від цього жаху своєчасним втручанням збройних сил Канади. Однак канадці не змогли врятувати всіх в Америці, хто бажав уникнути втягнення у війну, в яку вони не вірили. Багато членів сімей були відрізані від своїх близьких і опинилися в пастці за лінією фронту.\n\nНезважаючи на небезпеку, багато хто намагається подолати величезні відстані, щоб дістатися безпеки §G[NEE.GetNameWithFlag]§!, острова миру у вируючому океані хаосу громадянської війни. Якби ми організували та скоординували співпрацю з групами прихованого опору по всій території Сполучених Штатів, можливо, ми могли б побачити, як більше людей (і зброї) знаходять свій шлях до нас!\n§P-----------------------------------§!\nПісля завершення фокусу §YРозширити Підземну залізницю§! ми зможемо розширити мережу Підземної залізниці від Великих озер до Мексиканської затоки!"
