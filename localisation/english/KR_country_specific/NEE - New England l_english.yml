### Ideas ###
 NEE_Arsenal_of_Democracy_idea: "Арсенал демократії"
 NEE_Arsenal_of_Democracy_idea_desc: "Крах Сполучених Штатів у громадянській війні, безсумнівно, поставив ідею американської демократії в стан невизначеності. З нашими промисловими секторами, що працюють на повну потужність, і нашим виробництвом озброєння, більшим, ніж будь-коли раніше; наш обов'язок перед демократичними націями світу полягає в тому, що наша економіка може і буде — Арсеналом демократії. У війні та в мирі ми застосовуватимемо ту саму терміновість, патріотизм і самопожертву у нашій відданості свободі націй світу."

 NEE_Special_Forces: "Сили спеціального призначення Республіки"
 NEE_Special_Forces_desc: "Введені глибоко за лінію фронту, сили спеціального призначення Нової Англії мають багато спільного зі своїми предками-рейнджерами колоніальної доби з Американської революції. Загартовані в найсуворіших умовах тренувань і піддані найвимогливішому фізичному режиму, сили спеціального призначення можуть завдати удару по ворогу там, де він найменше цього очікує, перерізаючи його комунікації та здатні вести легку та нетрадиційну війну. Як наслідок, відбір до сил спеціального призначення є дуже суворим, щоб забезпечити лише найкращих, яких пропонує Нова Англія."

 NEE_MOEF: "Конвойні сили середнього океану"
 NEE_MOEF_desc: "Як доведено досвідом британців у Першій світовій війні, підводна війна може бути згубною для нагальних потреб торговельних та постачальних конвоїв у воєнний час. Щоб підвищити ефективність наших конвойних ескортів, ми створимо та організуємо нові формування наших есмінців, оснастивши їх також новими технологіями, такими як радар та сучасна протичовнова зброя."
 NEE_MOEF_NB: "Скоординований військово-морський обстріл"
 NEE_MOFF_NB_desc: "Завдяки наявності портативних радіостанцій та складних мереж ретрансляції, передові спостерігачі тепер можуть передавати інформацію про цілі та надавати майже миттєві точні звіти лінкорам біля берега. Крім того, літаки-спостерігачі також можуть надавати військовим кораблям точну інформацію під час підготовки до десантних операцій."

 NEE_marine_corps: "Морська піхота Нової Англії"
 NEE_marine_corps_desc: "Натхненна канадськими командос і морськими піхотинцями, морська піхота Нової Англії організована в інноваційні легкі піхотні вогневі групи з трьох осіб і добре обізнана в десантних вторгненнях та асиметричній війні. Справжні наступники Континентальної морської піхоти часів Американської революції, морські піхотинці Нової Англії проходять егалітарну та етичну індоктринацію у своїх тренуваннях, щоб сформувати ідеального морського піхотинця-стрільця. Як данина їхній великій спадщині від Залів Монтесуми до берегів Тріполі, морські піхотинці Нової Англії є одними з найелітніших полків Нової Англії — завжди присутні та завжди вірні."

 NEE_reluctant_populace: "Неохоче населення"
 NEE_reluctant_populace_desc: "Категорично виступаючи проти втручання або приєднання до фракцій після національної кризи, у Тимчасовому уряді чоловіки та жінки неохоче беруться до зброї. Оголосивши нейтралітет після національної кризи навесні 1937 року, народ Нової Англії залишається відданим запобіганню кровопролиттю, яке кинуло націю в хаос. Якщо ситуація не зміниться і патріотичний запал народу Нової Англії не буде розпалений, уряд не втягне свій народ у велику війну."

 NEE_Great_Depression: "Велика депресія"
 NEE_Great_Depression_desc: "На відміну від решти нації, яка перейшла до мобілізації воєнного часу, економіка Нової Англії залишалася гірко стагнаційною внаслідок Великої депресії. Протягом усього існування Тимчасового уряду черги безробітних чоловіків продовжують заповнювати вулиці, і тисячі жителів Нової Англії залишаються або банкрутами, або бездомними через тривалу економічну кризу. Хоча народ Нової Англії довіряє своєму уряду проведення значних економічних реформ, поки це не буде зроблено, економіка Тимчасового уряду лише продовжуватиме мучитися в гірких стражданнях."

 NEE_highway_act_idea: "Національний закон про міжштатні та оборонні шосе"
 NEE_highway_act_idea_desc: "У нещодавно підписаному президентом [NEE.GetLeader] масштабному законопроєкті Національний закон про міжштатні та оборонні шосе має на меті покращити та модернізувати нашу державну інфраструктуру, щоб вона була найкращою у світі. З дозволом на будівництво 41 000 миль міжштатних шосе на суму майже 25 мільярдів доларів, наш амбітний робочий проєкт матиме на меті з'єднати американську націю більше, ніж будь-коли раніше."
 NEE_canadian_backing: "Канадська підтримка"
 NEE_canadian_backing_desc: "З недавнім початком війни на американському континенті та нашою відносно мізерною присутністю, наші шанси на відновлення справжньої американської демократії виглядають досить похмурими. Канадський уряд, рішуче налаштований відновити порядок та запобігти успіху радикального американського уряду, оголосив про своє рішення постачати Тимчасовому уряду зброю та промислову допомогу для підготовки Нової Англії до визволення колишніх Сполучених Штатів. Тим не менш, люди на американському Північному Заході залишаються обережними, оскільки, безумовно, є ті, хто не вважає, що Нова Англія готова витримати майбутню бурю."

 special_forces_focus: "Фокус на силах спеціального призначення"
