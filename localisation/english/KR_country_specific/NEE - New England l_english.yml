# Legacy #
 NEE_limited_recognation1: "Обмежене визнання"
 NEE_limited_recognation1_desc: "Тимчасовий уряд був сформований у перші місяці Другої Американської громадянської війни, коли північно-східні штати колишніх Сполучених Штатів звернулися до канадського уряду з проханням про офіційне втручання. Хоча канадський уряд був успішним у захисті кордонів Нової Англії від потрапляння в руки воюючих фракцій, Тимчасовий уряд майже не визнається міжнародною спільнотою, і мало хто переконаний, що Тимчасовий уряд справді є останнім бастіоном американської демократії."

