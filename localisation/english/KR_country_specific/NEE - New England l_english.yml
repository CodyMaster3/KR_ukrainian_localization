# FROM.FROM is the country that is targeted by the decision
# FROM is the faction leader of FROM.FROM for new_england_events.320

 new_england_events.320.t1: "[FROM.GetNameDefCap] виходить із [FROM.FROM.GetNameDef]"
 new_england_events.320.t2: "[FROM.GetNameDefCap] відмовляється виходити із [FROM.FROM.GetNameDef]"
 new_england_events.320.d1: "Сьогодні вранці посол [FROM.GetName] повідомив нашому Державному департаменту про їхній намір вийти з [FROM.FROM.GetNameDef]. З їхнім виходом уряд [FROM.FROM.GetAdjective] більше не перебуває під впливом Європи, і тепер його можна переконати приєднатися до Організації Американських Держав. Разом ми знову створимо вільний і демократичний Новий Світ!"
 new_england_events.320.d2: "Сьогодні вранці посол [FROM.GetName] повідомив нашому Державному департаменту про їхній намір залишитися в альянсі з [FROM.FROM.GetName]. Якщо ми хочемо бачити вільну та демократичну Західну півкулю під проводом [NEE.GetNameDef], це втручання з боку [FROM.GetNameDef], безумовно, призведе до напруженості між нашими країнами. Якщо не розглядати військову силу, нам доведеться шукати інших союзників в Америці для відбудови нашої сфери."
 new_england_events.320.a: "Знову в справі!"
 new_england_events.320.b: "Поки що заплющимо на це очі."
 new_england_events.320.c: "Це неприпустимо. Ми їх визволимо."

 new_england_events.321.t: "[THIS.faction_leader.GetName] покинув нас!"
 new_england_events.321.d: "Тривожні новини від [THIS.faction_leader.GetNameDef]: їхній посол сьогодні повідомив нам, що вони більше не підтримуватимуть нас. Посилаючись на відроджену міць Америки та відновлення доктрини Монро, вони виведуть свої війська з наших кордонів — фактично, Європа нас покинула."
 new_england_events.321.a: "Нічого собі союзник!"

 new_england_events.322.t: "[NEE.GetNameDefCap] відступає!"
 new_england_events.322.d1: "Зрештою, схоже, що дипломатія, такт і переговори перемогли. Американці не будуть і надалі тиснути на нас, і зрозуміло, що вони також не застосовуватимуть силу, щоб вимагати нашого вступу до їхньої фракції. Менше з тим, наше тяжіння до [THIS.faction_leader.GetNameDef], безумовно, внесло напруженість у відносини між нашою країною та [NEE.GetNameDef]."
 new_england_events.322.d2: "Попри наші наміри вести переговори та вислухати [NEE.GetNameDef], наші заклики до миру не були почуті. Ми отримали звістку про те, що американського посла в нашій країні було відкликано і що війна між американською нацією та нами справді неминуча. Проте наш союзник у [THIS.faction_leader.GetNameDef] пообіцяв захистити нас і гарантувати нашу незалежність. З нашим альянсом, міцнішим ніж будь-коли, ми захистимо нашу свободу від американських загарбників!"
 new_england_events.322.a: "Сильніші разом!"

 new_england_events.323.t: "[FROM.GetName] йде війною!"
 new_england_events.323.d1: "Називаючи нашу відмову покинути союзників у Західній півкулі «посяганням на мир і безпеку Нового Світу», сьогодні вранці американський посол оголосив нашому уряду, що його відкликають назад до країни і що між нашою нацією та [FROM.GetNameDef] тепер існує стан війни. Здається, американським амбіціям у Новому Світі немає меж, і вони вдалися до війни, щоб вигнати нас!"
 new_england_events.323.d2: "Попри заклики до миру за столом переговорів, схоже, що [FROM.GetNameDef] розцінює наш союз із [THIS.faction_leader.GetNameDef] як загрозу, з якою необхідно розібратися. Нашому уряду повідомили, що американський уряд офіційно розірвав дипломатичні відносини з [THIS.faction_leader.GetNameDef] і що незабаром ми приєднаємося до [THIS.faction_leader.GetNameDef] у війні з американською нацією."
 new_england_events.323.a: "Палії війни!"

 NEE_Invite_Research: "Договір про взаємну оборону з [FROM.GetNameDef]"

 new_england_events.324.t: "Панамериканський договір про взаємну оборону"
 new_england_events.324.d: "У межах зміцнення наших зв'язків з [NEE.GetNameDef] вони запросили нас підписати «Панамериканський договір про взаємну оборону». Це має на меті покращити можливості нашої країни та гарантувати нам доступ до новітніх американських технологій і зброї для посилення нашої держави. Ми зможемо відправляти вчених і дослідників до [NEE.GetNameDef] для участі у спільних наукових проєктах, щоб допомогти розвитку власних потужностей."
 new_england_events.324.a: "Чудова домовленість!"

 NEE_American_Officers: "Підготовка офіцерів США в [FROM.GetNameDef]"
 NEE_American_Officers_idea: "Американські офіцери"

 new_england_events.325.t: "[NEE.GetNameDefCap] пропонує надіслати американських військових радників"
 new_england_events.325.d: "Армія [NEE.GetName], мабуть, одна з найсучасніших у світі, і її міць, безперечно, викликає захоплення. Як член Організації Американських Держав, [NEE.GetNameDef] звернулася до нашої нації з пропозицією надіслати американських військових радників та офіцерів для підготовки наших військ. Вони навчать нас новітнім військовим доктринам і допоможуть з військовим вишколом під час спільних навчань. Звісно, ми завжди можемо ввічливо відмовитися від їхньої допомоги та натомість розвивати армію власними силами."
 new_england_events.325.a: "Ми приймемо їхню допомогу."
 new_england_events.325.b: "Скажіть американцям: дякуємо, але ні."

 new_england_events.326.t: "[FROM.GetNameDefCap] відповідає на нашу пропозицію щодо військових радників"
 new_england_events.326.d1: "Нашу пропозицію надіслати американських військових радників та офіцерів до [FROM.GetNameDef] було прийнято. Наші найдосвідченіші офіцери вже прямують до [FROM.GetNameDef], і незабаром ми очікуємо, що їхні збройні сили будуть приведені у відповідність до наших стандартів. Це не лише сприятиме добросусідським відносинам між нашими країнами, а й послужить зміцненню колективної безпеки в Західній півкулі."
 new_england_events.326.d2: "На жаль, наша пропозиція надіслати американських військових радників та офіцерів до [FROM.GetNameDef] була ввічливо відхилена. Ми продовжуватимемо працювати разом, щоб гарантувати безпеку та порядок у Західній півкулі; [FROM.GetNameDef] підкреслила, що воліла б розвивати власну незалежну армію."
 new_england_events.326.a: "Чудово!"
 new_england_events.326.b: "Що ж, нехай буде так."

 NEE_Invite_non_soc_CEN: "Запропонувати [CEN.GetNameDef] умови вступу до ОАД"

 new_england_events.327.t: "Запрошення від [NEE.GetNameDef]"
 new_england_events.327.d1: "Після колапсу США мало хто очікував, що демократія виживе в Західній півкулі. Реакціонери та революціонери намагалися підірвати демократичний лад, але в Центральній Америці Федерація допомогла зберегти його, попри нестабільність. У відповідь на наші зусилля [NEE.GetNameDef] звернулася до нашої нації з пропозицією приєднатися до Організації Американських Держав. Однак, з огляду на природу колективної безпеки в ОАД, американці попросили нас розділитися на наші початкові держави-засновниці."
 new_england_events.327.d2: "Американський крах призвів до руйнування доктрини Монро, яка тримала країни Латинської Америки разом. У той період нестабільності Центральноамериканська Республіка об'єднала регіон, щоб не дати йому потрапити до рук радикалів. Відновивши сили, [NEE.GetNameDef] запропонувала нашій нації місце у своєму альянсі. Однак вони попросили нас розділити нашу республіку на початкові складові країни під керівництвом проамериканських демократичних урядів."
 new_england_events.327.a: "Ми згодні на ці умови!"
 new_england_events.327.b: "Це не що інше, як янкійський імперіалізм."

 new_england_events.328.t: "[FROM.GetName] відповідає на наше запрошення"
 new_england_events.328.d1: "Ми отримали звістку, що нації [FROM.GetName] прийняли наше запрошення приєднатися до Організації Американських Держав. Хоча тепер вони розділяться на держави довоєнного періоду, вони, безперечно, цінуватимуть той факт, що тепер перебувають під захистом та опікою [NEE.GetNameDef]. Незабаром старі кордони будуть відновлені, і ми гарантуємо, що демократія залишиться в Центральній Америці. Разом ми будемо прагнути до тісніших економічних зв'язків та колективної безпеки."
 new_england_events.328.d2: "Прикрі новини від [FROM.GetName] сьогодні: їхній уряд повідомив Державному департаменту, що вони не зацікавлені у вступі до Організації Американських Держав. Стверджуючи, що їм краще бути єдиною центральноамериканською державою, ніж окремими націями, вони ввічливо відхилили наше запрошення."
 new_england_events.328.a: "Ласкаво просимо!"
 new_england_events.328.b: "Їхня втрата."

 NEE_Investments_idea: "Американські інвестиції"

 new_england_events.329.t: "Зв'язки з Волл-стріт"
 new_england_events.329.d: "У межах зміцнення економічних зв'язків з [NEE.GetNameDef] дедалі більше американських інвесторів приходять у нашу країну, маючи намір розвивати тут американський бізнес. Якщо ми приймемо цих інвесторів, ми безумовно отримаємо вигоду від зв'язку з американською економічною сферою, хоча дехто занепокоєний, що це зробить нас економічно залежними від [NEE.GetNameDef]. Попри те, що ці побоювання обґрунтовані, відмова американським інвесторам, найімовірніше, призведе до напруженості, оскільки [NEE.GetNameDef] не буде задоволена нашим рішення."
 new_england_events.329.a: "Приходьте та інвестуйте!"
 new_england_events.329.b: "Ми не будемо прив'язані до янкі!"

 new_england_events.330.t1: "[FROM.GetNameDefCap] приймає наших інвесторів"
 new_england_events.330.t2: "[FROM.GetNameDefCap] виганяє наших інвесторів"
 new_england_events.330.d1: "Наше бажання інвестувати в [FROM.GetNameDef] скоро стане реальністю! Уряд [FROM.GetNameDef] з великою вдячністю відповів на наші інвестиційні плани, і наразі американські інвестори та бізнесмени вже прямують до їхніх країн, щоб допомогти їх розвитку. Наш економічний блок стає міцнішим; слава нашому другу в [FROM.GetNameDef]!"
 new_england_events.330.d2: "Що ж, це було справді... несподівано. Попри нашу щедру пропозицію, [FROM.GetNameDef] відмовилася від інвесторів для розвитку своєї економіки. Їм безумовно буде важко в довгостроковій перспективі без нашого економічного керівництва та захисту."
 new_england_events.330.a: "До процвітаючого завтра!"
 new_england_events.330.b: "Роби або не роби, спроб не існує."

 nee_investing_country_pos_tt: "§gМожливо, за умови достатніх тривалих інвестицій у [FROM.GetNameDef], їхній народ побачить переваги демократії!§!"
 nee_investing_country_neg_tt: "§gМожливо, після достатньої кількості спроб інвестування в [FROM.GetNameDef], їхній народ повстане на підтримку демократії проти авторитаризму!§!"

 new_england_events.331.t: "Демократичні заворушення на вулицях!"
 new_england_events.331.d1: "Сьогодні зі столиці надійшли драматичні новини: бунти та протести почали захоплювати вулиці. Побачивши значне покращення свого життя завдяки припливу багатства від американських інвесторів ліберальної нації, люди почали збиратися та вимагати переходу до демократичного уряду. Те, що починалося як прості мирні протести, переросло у насильство, оскільки наша поліція не в змозі впоратися з дедалі більшими заворушеннями. Хоча армію ще не закликали, поранення та мародерство стають дедалі частішими. Ми сподівалися уникнути рішучих дій, але американські ЗМІ не сприяють спокою, а багато країн засуджують дії нашої поліції та закликають нас дозволити вибори. Помірковані та ліберали в нашому уряді благають розпочати переговори з протестувальниками. Проте консервативні військові виступають за запровадження воєнного стану для повного придушення демонстрацій."
 new_england_events.331.d2: "Наші спроби зберегти економічну незалежність шляхом відмови американським інвесторам зустріли опір. Напруженість із [NEE.GetNameDef] невпинно зростає, і здається, що наш народ стає дедалі незадоволенішим американською присутністю в країні. Останніми днями почастішали відкриті напади на американські підприємства, на що [NEE.GetNameDef] оголосила нашу країну «відсталим кублом автократії та некомпетентності», пообіцявши захистити своїх громадян. Тон їхньої заяви чіткий — [NEE.GetNameDef] незабаром спробує захистити свої бізнес-інтереси, навіть силою зброї."
 new_england_events.331.a: "Переговори будуть короткими."
 new_england_events.331.b: "Придушити цих протестувальників!"
 new_england_events.331.c: "Напевно, вони не підуть на війну через це! Правда ж?"

 new_england_events.332.t: "Придушення демократичних протестів у [FROM.GetNameDef]!"
 new_england_events.332.d1: "Ми отримали звістку від посла в [FROM.GetNameDef], що продемократичні бунти та протести посилилися останніми днями. Заворушення спричинені ліберальним впливом наших інвесторів, які значно покращили якість життя місцевих. Хоча демонстрації спочатку були мирними, вони стали жорстокими через агресивну реакцію уряду. Нарешті, після тижнів заворушень, уряд [FROM.GetName] оголосив про жорстку лінію та запровадження воєнного стану. Це також призвело до конфіскації американських інвестицій, оскільки економічні зв'язки з [FROM.GetNameDef] були названі причиною сплеску невдоволення. Американські бізнесмени були змушені тікати з країни, а наше посольство також готується до евакуації."
 new_england_events.332.d2: "[FROM.GetNameDefCap] неодноразово перешкоджала американським інтересам у своїй країні. Через наші спроби поширити економічний вплив у [FROM.GetNameDef], американські інвестори та громадяни за кордоном часто стикаються з переслідуваннями та висилкою. Урядові програми налаштували населення проти нас, заохочуючи громадян «захищати свою країну» від наших «підступних рук» будь-якими засобами. Після витоку в пресі інформації про те, що один із наших бізнесменів назвав цю націю «відсталим кублом автократії та некомпетентності», по всій країні спалахнули антиамериканські бунти. Ті, хто зміг, втекли до американського посольства, де вони благають нас втрутитися військовим шляхом, щоб захистити їх і повернути контроль над галузями, захопленими [FROM.GetNameDef]!"
 new_england_events.332.a: "Коли слова не допомагають, велика ломака — найкраща відповідь."
 new_england_events.332.b: "Зараз ми нічого не можемо вдіяти"

 new_england_events.333.t: "Демократичні протести в [FROM.GetNameDef]"
 new_england_events.333.d: "Відколи ми налагодили торговельні відносини між нашою країною та [FROM.GetNameDef], ми спостерігаємо значне покращення життя тамтешніх людей. Схоже, наш вищий рівень життя та ліберальна політика зміцнили продемократичний табір у цій нації. Те, що починалося як мирні протести, перетворилося на масштабні демонстрації та бунти проти недемократичного уряду [FROM.GetNameDef]. Попри зростаюче невдоволення, такт переміг: уряд [FROM.GetNameDef] підкорився бажанню народу. Вони вирішили перейти до демократичного правління, і, вітаючи новий режим, також попросили приєднатися до Організації Американських Держав. Починається нова ера в наших відносинах!"
 new_england_events.333.a: "Звісно, ми їм раді!"

 NEE_Dollar_Diplomacy_dec: "Спрямувати інвесторів до [FROM.GetNameDef]"
 NEE_American_Aid_dec: "Заохотити інвестиції в [FROM.GetNameDef]"

 new_england_events.334.t: "[NEE.GetNameDefCap] інвестує в [THIS.GetNameDef]"
 new_england_events.334.d: "Ми отримали звістку, що американські інвестори та бізнесмени зацікавлені та готові вкладати гроші в нашу країну для покращення рівня життя. У міру того, як дедалі більше товарів та підприємств прибуває з [NEE.GetNameDef], ми спостерігаємо зростання добробуту нашої нації. Тепер не рідкість побачити наших людей в американських джинсах або з американською побутовою технікою. Менше з тим, постійно зростає побоювання, що з кожним днем ми стаємо дедалі залежнішими від економічної підтримки [NEE.GetNameDef]."
 new_england_events.334.a: "Levi Strauss — найкращий американський денім з 1853 року!"

 NEE_American_Hemisphere_dec: "Висунути ультиматум [FROM.GetNameDef]"

 new_england_events.335.t: "Американці надсилають ультиматум"
 new_england_events.335.d: "Сьогодні з американського посольства надійшли вкрай обурливі новини. Оголосивши Західну півкулю такою, що перебуває під «американським захистом», вони заявили, що згідно з «відновленою доктриною Монро» соціалізму немає місця в Новому Світі. Оскільки їхня нація сильно постраждала в битві з [WCA.GetNameDef] під час другої американської громадянської війни, їхньою офіційною зовнішньою політикою стало остаточне викорінення соціалізму. Вони звернулися до нашого уряду з простою вимогою — розпустити чинний соціалістичний уряд і замінити його таким, що відповідає інтересам [NEE.Capital.GetCapitalVictoryPointName]. Якщо ми не погодимося, вони без вагань застосують силу, щоб «переконати» нас."
 new_england_events.335.a: "Ми приймаємо їхні умови."
 new_england_events.335.b: "З моєї точки зору, американці — це зло!"

 new_england_events.336.t1: "[FROM.GetNameDefCap] приймає наш ультиматум"
 new_england_events.336.t2: "[FROM.GetNameDefCap] розриває наш ультиматум"
 new_england_events.336.d1: "Вражений нашою могутньою економічною та військовою потугою, соціалістичний уряд [FROM.GetNameDef] вирішив відступити. Пообіцявши розпустити свій уряд і встановити демократичний, вони також стануть на наш бік. Вкотре доктрина Монро забезпечила мир і порядок у Західній півкулі. Незабаром прокляті «червоні» стануть не більше ніж забутим нічним жахіттям."
 new_england_events.336.d2: "Попри нашу щедру пропозицію зберегти мир, революційний уряд [FROM.GetNameDef], схоже, відмовився слухати розум. Назвавши наш режим «імперіалістичним», вони вислали наше посольство, і незабаром наші громадяни там опиняться під загрозою. Щоб повністю вигнати соціалістичну загрозу з нашої півкулі та захистити наших громадян, нам доведеться вдатися до повномасштабного військового втручання для відновлення демократії в [FROM.GetNameDef]."
 new_england_events.336.a: "Вони обрали мудро."
 new_england_events.336.b: "Вони обрали невдало."

 new_england_events.337.t: "Вашингтонські угоди"
 new_england_events.337.d: "[NEE.GetNameDefCap] сьогодні звернулася до нас із пропозицією про взаєморозуміння. Їхній посол у [BRA.Capital.GetCapitalVictoryPointName] запропонував нашому уряду підписати пакт про ненапад та договір про рівний військовий доступ для боротьби з соціалізмом та радикалізмом у Західній півкулі. Це також передбачатиме прибуття американських військових радників для кращої підготовки наших військ. Щоб зробити угоду привабливішою, вони також запропонували надіслати нам техніків та радників для допомоги Національній металургійній компанії у видобутку ресурсів у [496.GetName]. Крім того, вони запропонували спільну дослідницьку програму, за якою бразильські вчені навчатимуться в американських університетах. Чи приймемо ми їхню пропозицію?"
 new_england_events.337.a: "Ми приймаємо угоду!"
 new_england_events.337.b: "Нам не потрібні американці..."

 new_england_events.338.t1: "[BRA.GetNameDefCap] приймає нашу пропозицію"
 new_england_events.338.t2: "[BRA.GetNameDefCap] відхиляє нашу пропозицію"
 new_england_events.338.d1: "Наш посол у [BRA.Capital.GetCapitalVictoryPointName] повідомив Державному департаменту, що бразильський уряд бажає підписати договір. Посилаючись на готовність своєї нації допомогти Америці зберегти мир у Західній півкулі, вони погодилися на всі умови. Починається нова ера в бразильсько-американських відносинах!"
 new_england_events.338.d2: "Наш посол у [BRA.Capital.GetCapitalVictoryPointName] повідомив Державному департаменту, що бразильський уряд не підписуватиме Вашингтонські угоди. Вони ввічливо відхилили нашу пропозицію, посилаючись на рішення залишатися нейтральними та власну підозрілість до нашої нації."
 new_england_events.338.a: "Вітаємо наших нових союзників!"
 new_england_events.338.b: "Прикро."

 new_england_events.345.t: "Прибуття американських відбудовчих бригад"
 new_england_events.345.dgbr: "Лондон, Манчестер, Бірмінгем... величні міста Англії перетворилися на руїни. Попри тріумфальне повернення вигнанців усупереч усьому, більша частина англійської промислової бази зруйнована нищівною сучасною війною. Багато людей залишилися без даху над головою, а нація намагається відбудуватися. І все ж, надія є. Наш надійний союзник, американці, запропонували надіслати досвідчені відбудовчі бригади, які самі відновлювали свою країну з руїн після громадянської війни. Це допоможе британському народу отримати необхідну робочу силу та навички для реконструкції рідних островів."
 new_england_events.345.dnfa: "Попри наші мужні зусилля з повернення додому з тривалого вигнання, значна частина Франції лежить у руїнах — її землі та поля сплюндровані жахами конфлікту. Сільська місцевість повністю зруйнована, а багато міст перетворилися на згарища. Громадяни метрополії потерпають від злиднів, поки дедалі більше вигнанців прибуває з Алжиру до Франції, яка виглядає зовсім не так, як тоді, коли вони її залишали. Для допомоги у відбудові французької нації наші шляхетні союзники, американці, надішлють досвідчені відбудовчі бригади, що зарекомендували себе під час відновлення власної країни. Це забезпечить французів кваліфікованими кадрами для реконструкції материкової Франції."
 new_england_events.345.draj: "Розділені на три ворогуючі фракції, ми вели криваву війну за возз'єднання Індії. Тепер, коли субконтинент знову об'єднаний під керівництвом Раджу, більша частина країни в руїнах, а бідність невпинно зростає. Архаїчна кастова система теж не сприяє стабільності. Менше з тим, наш турботливий союзник [NEE.GetNameDef] пообіцяв нам свою повну підтримку. Вони надішлють досвідчені будівельні бригади, які довели свою цінність у відбудові власної країни. Це значно допоможе народам Індії з необхідними ресурсами та досвідом для відновлення індійського субконтиненту."
 new_england_events.345.a: "Дуже вдячні!"

 new_england_events.346.t: "[NEE.GetAdjective] інвестори прибувають до [RAJ.GetNameDef]"
 new_england_events.346.d: "Громадянська війна в Індії страшно спустошила субконтинент, проте разом із цим руйнуванням приходить і можливість для одужання. Наші зв'язки з Антантою не були забуті. Уряд [NEE.GetAdjective] заохотив інвесторів та бізнесменів приносити американські гроші до Індії. Завдяки промисловій потужності американської нації, американське обладнання та капітал течуть до Індії, щоб допомогти їй перетворитися на справді могутню індустріальну державу."
 new_england_events.346.a: "За процвітаючі відносини!"

 new_england_events.347.t: "[FROM.GetAdjective] банкіри пропонують щедрі позики"
 new_england_events.347.d: "Через великі труднощі та кровопролиття ми досягли того, що спостерігачі тривалий час вважали неможливим, і тріумфально повернулися на рідні острови. Однак тепер наша економіка в занепаді — роки соціалістичного правління залишили свій слід на нашій колись великій нації. На щастя, ми не мусимо нести тягар відбудови наодинці, адже наші союзники в [FROM.GetNameDef], бажаючи бачити відроджене Сполучене Королівство, запропонували підтримку. Зокрема, кілька [FROM.GetAdjective] банків виявили готовність надати позики за розумними ставками, допомагаючи британському народу в його скрутну годину."
 new_england_events.347.a: "За сильну Британію!"

 new_england_events.348.t: "Старий борг повернуто"
 new_england_events.348.d: "У тому ж дусі, в якому ми підтримали американську революцію проти британців півтора століття тому, наші союзники в [FROM.Capital.GetCapitalVictoryPointName] тепер бажають допомогти нам у боротьбі проти проклятих комунарів. Сподіваючись, що одного дня ми повністю звільнимося від залишків соціалістичного правління над метрополією, [FROM.GetNameDef] надіслала нам велику кількість грошей та обладнання — ресурсів, вкрай необхідних для відбудови. Цим уряд [FROM.GetAdjective] сподівається повернути борг 1776 року, відкриваючи еру рівного братерства між [FROM.GetNameDef] та [ROOT.GetNameDef]."
 new_england_events.348.a: "За сильну Францію!"

 new_england_events.349.t: "Допомога [NEE.GetAdjective] прибуває"
 new_england_events.349.d: "Після кровопролиття другої італійської громадянської війни наша нація важко справляється з відбудовою. Такі міста, як Мілан та Флоренція, перетворені на руїни, а сільська місцевість понівечена жахами війни. Наше скрутне становище привернуло увагу [NEE.GetNameDef], оскільки там є численна італо-американська громада, яка прагне нам допомогти. Уряд [NEE.GetAdjective] схвалив відправку досвідчених будівельників, які самі відбудовували свою країну, а також виділив кошти для одужання після років соціалістичного врядування."
 new_england_events.349.a: "Grazie!"

 #_idea:
 NEE_anti_communard: "Хліб і троянди"

 new_england_events.350.t: "Допомога [NEE.GetAdjective] прибуває"
 new_england_events.350.d: "Велика громадянська війна за повернення нашої нації спустошила наші поля та села. Поки ми боремося за очищення нашого уряду від синдикалістського бруду, нам знадобиться вся можлива допомога. Менше з тим, наші незмінні американські союзники надіслали нам запаси їжі, ліки та інструменти, щоб допомогти нам знайти шлях до серця місцевого населення. Ми маємо представляти себе не як завойовників та визволителів, а як співвітчизників, що розуміють біду своєї нації. Роздаючи ці «хліб і троянди», ми повільно, але впевнено відбудуємо саму тканину нашої нації, яка зараз розірвана по ідеологічних швах."
 new_england_events.350.a: "З часом наша нація зцілиться."

 ITO_member_dynamic_modifier: "Член Міжнародної торгової організації"

 nee_ito_tt: "Додає модифікатор: §YЧлен Міжнародної торгової організації§!, який дає ($MODIFIER_POLITICAL_POWER_GAIN$: §G+0.05§!, $MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+5.00%§!).\n\nЗа кожну додаткову країну, що приєднається до організації, цей модифікатор збільшуватиметься на ($MODIFIER_POLITICAL_POWER_GAIN$: §G+0.01§!, $MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+1.00%§!)"
 nee_ITO_member_tooltip: "§LЗа кожну націю, що вступає до Організації, цей модифікатор буде збільшуватися.§!\n\n"
 NEE_auto_invite_random_to_ITO: "( [NEE.GetFlag] §YВипадкова країна у [NEE.GetFactionName]§!): $EFFECT_COUNTRY_EVENT$"

 new_england_events.351.t: "[NEE.GetNameDefCap] запрошує нас до Міжнародної торгової організації"
 new_england_events.351.d: "Ми отримали звістку, що [NEE.GetNameDef] запросила нас приєднатися до «Міжнародної торгової організації». Заявляючи, що світові більше не потрібні війни та насильство, [NEE.GetNameDef] стверджує, що ця спільнота не лише зміцнить економічні зв'язки, а й посилить відносини між усіма демократичними націями світу. Американці проголосили, що цей торговий блок слугуватиме засобом взаємної підтримки на шляху до економічного процвітання, водночас забезпечуючи світ миру, порядку та стабільності. Чи приймемо ми їхнє запрошення?"
 new_england_events.351.a: "Ми бажаємо приєднатися!"
 new_england_events.351.b: "Ми бажаємо йти власним шляхом."

 new_england_events.352.t1: "[FROM.GetNameDefCap] погоджується вступити до Міжнародної торгової організації"
 new_england_events.352.t2: "[FROM.GetNameDefCap] відмовляється вступати до Міжнародної торгової організації"
 new_england_events.352.d1: "Роль Америки полягає не лише у межах її власної півкулі — вона має вести за собою народи всього світу як взірець. Наш посол у [FROM.GetNameDef] повідомив Державному департаменту, що їхній уряд готовий приєднатися до Міжнародної торгової організації. Разом ми забезпечимо свободу світової торгівлі, і наші нації процвітатимуть без воєн та насилля!"
 new_england_events.352.d2: "Попри наші найкращі наміри, наш посол у [From.GetNameDef] повідомив Державному департаменту, що їхня нація не бажає приєднуватися до Міжнародної торгової організації. Посилаючись на те, що вони воліли б переслідувати власні економічні цілі замість вступу до нашої спільноти, та бажаючи дистанціюватися від нас, вони ввічливо відхилили наше запрошення."
 new_england_events.352.a: "Об'єднана торгівля переможе!"
 new_england_events.352.b: "Що ж, нехай буде так."

 new_england_events.353.t: "[FROM.GetNameDefCap] перебирає лідерство в Антанті"
 new_england_events.353.d: "Для зовнішнього світу Сполучені Штати здавалися безнадійним невдахою з початком другої американської громадянської війни, що розколола націю на ворогуючі фракції. Проте, всупереч усьому, [FROM.GetNameDef] здобула повну перемогу. Допомігши Антанті у скрутну годину та визволивши Європу від синдикалістів, [FROM.GetNameDef] завдяки своїй колосальній економічній та військовій потужності замінила [old_leader.GetNameDef] на посаді лідера Антанти. Сьогодні вранці офіційні особи [FROM.GetAdjective] зустрілися з військовим керівництвом [old_leader.GetAdjective] для офіційної передачі повноважень у [NEE.Capital.GetCapitalVictoryPointName]. Під час цієї урочистої церемонії під звуки волинок президент [FROM.GetLeader] подякував [old_leader.GetNameDef] за їхню службу справі вільного світу та відзначив жертви, на які пішли обидві нації задля відновлення демократії. Світ змінюється, і здається, що вітри долі тепер дмуть не зі Старого Світу, а з Нового."
 new_england_events.353.a: "Це буде ера [FROM.GetAdjective] століття!"

# NEE considers inviting neutral IRE
 new_england_events.354.t: "Запрошення на Смарагдовий острів?"
 new_england_events.354.d1: "Оскільки ми перебрали на себе лідерство в Антанті, перед нами відкрилося кілька можливостей, які були недоступні нашим попередникам. Одна з найочевидніших — це відносини нашого альянсу з нашим найближчим європейським сусідом, невеликим островом Ірландія.\n\nІрландці вели війну за незалежність проти британців після Вельткріґу, і вона була успішною не в останню чергу завдяки величезній кількості пожертвувань та матеріальної підтримки від тисяч ірландоамериканців, переважно з Нової Англії. Серед більшої частини їхнього населення все ще зберігаються антибританські настрої та підозрілість, але, можливо, тепер, коли біля керма Антанти стоїмо ми, а не британці, вони будуть більше схильні приєднатися до нас? Культурні та сімейні зв'язки між нашими країнами численні, а їхня невелика економіка, безперечно, виграє від членства в IEDC.\n\nЗвісно, деякі більш радикальні члени старого британського істеблішменту нарікають на нібито юридичну сумнівність приєднання Північної Ірландії до Республіки, посилаючись на різні тлумачення договорів, тож такий альянс підтвердив би подальше існування регіону як частини Республіки. Ймовірність протесту з боку британців — це вже інша справа, але таку можливість не варто відкидати."
 new_england_events.354.d2: "Оскільки ми перебрали на себе лідерство в Антанті, перед нами відкрилося кілька можливостей, які були недоступні нашим попередникам. Одна з найочевидніших — це відносини нашого альянсу з нашим найближчим європейським сусідом, невеликим островом Ірландія.\n\nІрландці вели війну за незалежність проти британців після Вельткріґу, і вона була успішною не в останню чергу завдяки величезній кількості пожертвувань та матеріальної підтримки від тисяч ірландоамериканців, переважно з Нової Англії. Серед більшої частини їхнього населення все ще зберігаються антибританські настрої та підозрілість, але, можливо, тепер, коли біля керма Антанти стоїмо ми, а не британці, вони будуть більше схильні приєднатися до нас? Культурні та сімейні зв'язків між нашими країнами численні, а їхня невелика економіка, безперечно, виграє від членства в IEDC."
 new_england_events.354.a: "Їхнє місце поруч із нами."
 new_england_events.354.b: "Не будемо накликати гнів британців."

 new_england_events.355.t: "[NEE.GetNameDefCap] запрошує нас до Антанти"
 new_england_events.355.d: "Американський посол в Ірландії представив президенту несподівану пропозицію.\n\nБачачи, що Сполучені Штати очолили стару Антанту, президент [NEE.GetLeader] назвав тривалу огиду Ірландії до радикалізму та спільні демократичні цінності достатньою підставою для того, щоб запропонувати нам офіційний вступ до їхнього військового альянсу. Такий крок також принесе нам вигоду від членства в IEDC, що безумовно підтримає нашу порівняно невелику економіку.\n\nЦі дипломатичні кроки з боку Сполучених Штатів, безсумнівно, зумовлені тією роллю, яку Нова Англія відіграла у їхній нещодавній громадянській війні. Цей регіон є домівкою для сотень тисяч представників нашої діаспори та був життєво важливим джерелом підтримки під час нашої війни за незалежність. Тепер, коли британці відійшли на другий план у власному альянсі, можливо, ми зможемо стояти поруч із ними та американцями як рівні, а не як піддані?"
 new_england_events.355.a: "Ми в ділі!"
 new_england_events.355.b: "Збереження нейтралітету — безпечніший варіант."

 new_england_events.356.t1: "[IRE.GetNameDefCap] приєднується до Антанти"
 new_england_events.356.t2: "[IRE.GetNameDefCap] відхиляє нашу пропозицію"
 new_england_events.356.d1: "У [NEE.Capital.GetCapitalVictoryPointName] відбулася урочиста церемонія, під час якої президент [IRE.GetLeader] від імені Ірландії підписав необхідні документи та договори, що офіційно закріплюють місце його нації у складі Антанти.\n\nУ промові, виголошеній під час заходу, [NEE.GetLeader] навів Ірландію як приклад ще однієї країни, здатної співпрацювати з колишніми супротивниками заради спільного блага, справедливості та свободи. Він також наголосив на значущості цієї події для мільйонів американців ірландського походження. [IRE.GetLeader] подякував йому за слова та визнав зусилля Америки, зокрема ірландської діаспори, у попередній боротьбі Ірландії за свободу, підтвердивши спільну мету — разом дивитися у майбутнє, не тримаючись за минуле.\n\nВеличезні натовпи людей, більшість з яких мали принаймні один елемент одягу зеленого кольору, заповнили вулиці після оголошення новини; звуки гулянь та ірландської музики не вщухали до пізньої ночі."
 new_england_events.356.d2: "Ми отримали відповідь від ірландського посла, який повідомив, що Ірландія, на жаль, відхилила нашу пропозицію.\n\nВін зазначає, що його уряд вважає, що Ірландії буде краще залишатися нейтральною, аби не бути втягнутою в конфлікти, в яких його країні не місце.\n\nПроте він підтверджує, що Ірландія цінує нинішні відносини зі Сполученими Штатами та тісні зв'язки у спільній історії наших народів. Він підкреслив, що підтримання цих відносин буде найбільш ефективним через зміцнення наявних зв'язків, а не створення хитких нових союзів."
 new_england_events.356.a: "Éirinn go brách!"
 new_england_events.356.b: "Що ж, дуже шкода."

## SFA ##
# Invite
 new_england_events.365.t: "[NEE.GetNameDefCap] запрошує [THIS.GetNameDef] до Сан-Франциських угод"
 new_england_events.365.d: "Американське посольство передало нашому уряду ноту, в якій заявляє про намір своєї нації залучити нас до Сан-Франциських угод. Це запланована організація під проводом США, що опікуватиметься питаннями грамотності та науки в Тихоокеанському регіоні та сприятиме зміцненню дружніх зв'язків між нашими країнами. Проте дехто задається питанням, чи є якась вигода від приєднання до угоди під проводом янкі. Вступ до організації наближає нас до [NEE.GetNameDef], а це шлях, який не всі в нашій країні бажають обирати."
 new_england_events.365.a: "Ми бажаємо приєднатися."
 new_england_events.365.b: "Поки що не зацікавлені"
 new_england_events.365.c: "Ніколи не будемо зацікавлені"

 new_england_events.366.t1: "[FROM.GetNameDefCap] бажає приєднатися до Сан-Франциських угод"
 new_england_events.366.t2: "[FROM.GetNameDefCap] відмовляється від вступу до Сан-Франциських угод"
 new_england_events.366.d1: "Наші дипломатичні зусилля виявилися цілком успішними! Нація [FROM.GetAdjective] оголосила, що цілком готова приєднатися до нашої організації. Ми допоможемо в розробці їхніх власних наукових програм та сприятимемо просуванню американських цінностей і грамотності на їхніх землях. Разом ми прагнутимемо зміцнити зв'язки між нашою нацією та Тихим океаном."
 new_england_events.366.d2: "На жаль, [FROM.GetNameDef] ввічливо відхилила наше запрошення приєднатися до Сан-Франциських угод. Проте вони наголосили, що ще не закрили це питання остаточно і, можливо, переглянуть своє рішення та захочуть взяти участь у майбутньому. Шкода, але ми раді, що вони потенційно готові звернутися до нас іншим разом."
 new_england_events.366.d3: "На жаль, [FROM.GetNameDef] відхилила наше запрошення приєднатися до Сан-Франциських угод. Якою б не була причина, їхній уряд повідомив нашому посольству, що вони не бажають брати участь у нашій взаємовигідній угоді. Справжня прикрість, але врешті-решт це їхня втрата, що вони відставатимуть у дослідженнях та знаннях — наші ресурси краще витратити деінде."
 new_england_events.366.a: "Тост за наших нових друзів!"
 new_england_events.366.b: "Можливо, вони змінять свою думку"
 new_england_events.366.c: "Розчаровує"

 # Investing
 new_england_events.367.t: "[NEE.GetNameDefCap] бажає інвестувати в [THIS.GetNameDef]"
 new_england_events.367.d: "Наша нація значно відстала в плані індустріалізації та модернізації порівняно із західним світом. Уряд [NEE.GetNameDefCap] запропонував допомогти в індустріалізації нашої країни, надіславши інвестиції та кошти для сприяння розвитку нашої молодіжної економіки. Однак натомість вони вимагають відкриття вигідних торговельних каналів між нашими країнами. Поки дехто наполягає на прийнятті рішення для прискорення власної промислової експансії, інші занепокоєні тим, що така угода наблизить нас до американської економічної сфери."
 new_england_events.367.a: "Бізнес процвітає!"
 new_england_events.367.b: "Поки що не зацікавлені"
 new_england_events.367.c: "Ніколи не будемо зацікавлені"

 new_england_events.368.t1: "[FROM.GetNameDefCap] приймає угоду"
 new_england_events.368.t2: "[FROM.GetNameDefCap] відхиляє нашу інвестиційну пропозицію"
 new_england_events.368.d1: "Ми отримали звістку від [FROM.GetNameDef], що їхній уряд повністю приймає всі наші умови. Хоча ми витрачатимемо ресурси на розвиток їхньої нації до сучасних стандартів, вони погодилися на тісніші економічні зв'язки з нашою країною. Це дипломатичний успіх, який гарантує нам доступ до надійних торговельних партнерів в Азійсько-Тихоокеанському регіоні."
 new_england_events.368.d2: "Ми отримали звістку від [FROM.GetNameDef], що їхній уряд наразі не готовий домовлятися про наші умови. Якою б не була причина, вони натякнули, що, можливо, будуть готові переглянути нашу угоду в майбутньому. Хоча прикро, що нам відмовили, ми зможемо звернутися до них ще раз згодом."
 new_england_events.368.d3: "Ми отримали звістку від [FROM.GetNameDef], що їхній уряд не бажає погоджуватися на умови та пропозицію, які ми їм надали. Якою б не була причина, їхній уряд підкреслив свою неохоту змінювати позицію з цього питання. Дуже шкода, що вони не визнають нашу промислову міць та нашу щедрість у пропозиції допомогти розвитку їхньої відсталої нації."
 new_england_events.368.a: "Американські товари — найкращі у світі!"
 new_england_events.368.b: "Можливо, вони змінять свою думку"
 new_england_events.368.c: "Прикро."

 # Medical Aid
 new_england_events.369.t: "[NEE.GetNameDefCap] бажає надіслати гуманітарну допомогу [THIS.GetNameDef]"
 new_england_events.369.d: "Роки внутрішнього та зовнішнього хаосу залишили наш народ голодним і позбавленим надії. Значно відстаючи від західної медицини та технологій, наша нація продовжуватиме страждати, якщо умови життя наших людей не будуть значно покращені. Ми отримали звістку, що уряд [NEE.GetNameDef] запропонував надіслати гуманітарний пакунок Червоного Хреста з неймовірним обсягом медичної допомоги — від радників до вакцин. Хоча ці переваги, безсумнівно, пішли б на користь нашій країні, нам слід остерігатися зростаючого американського впливу в Тихому океані. Хоча прийняття американської допомоги полегшило б страждання нашого народу, ми завжди можемо ввічливо відмовитися."
 new_england_events.369.a: "Дякуємо!"
 new_england_events.369.b: "Ми впораємося самі"

 new_england_events.370.t1: "[FROM.GetNameDefCap] приймає нашу допомогу"
 new_england_events.370.t2: "[FROM.GetNameDefCap] відхиляє нашу допомогу"
 new_england_events.370.d1: "Допомагаючи націям Тихого океану, ми робимо їх менш схильними потрапити до рук імперіалістів чи революціонерів. Ми отримали чудові новини з американського посольства в [FROM.Capital.GetCapitalVictoryPointName]. Їхній посол повідомив наш уряд, що вони готові прийняти нашу щедру пропозицію медичної допомоги. Наші лікарі, радники та запаси, необхідні для відновлення їхньої країни, вже в дорозі. Разом ми допоможемо збудувати міцніший новий світ!"
 new_england_events.370.d2: "Хоча ми прагнемо служити всьому Азійсько-Тихоокеанському регіону, щоб значно покращити життя знедолених народів, які страждають від років воєн і безладу, ми отримали звістку з американського посольства в [FROM.Capital.GetCapitalVictoryPointName], що вони не бажають приймати нашу щедру пропозицію. Якою б не була причина, наші ресурси очевидно можна витратити деінде. Це прикра втрата для них, але ми завжди знайдемо нації, готові прийняти руку допомоги, коли вона просто перед ними."
 new_england_events.370.a: "Кожен заслуговує на справедливий шанс"
 new_england_events.370.b: "Їхня втрата"

 # Guarantees
 new_england_events.371.t: "[NEE.GetNameDefCap] гарантує нашу незалежність!"
 new_england_events.371.d: "Наша країна опинилася під загрозою з боку зовнішніх агресорів або іноземних агітаторів, які прагнуть дестабілізувати наш уряд і принести лише нещастя нашому народу. Оскільки німецький світовий порядок, побудований у вогні Вельткріґу, дедалі більше піддається викликам і занепадає, нам потрібно шукати керівництва в іншому місці. Ми отримали новину, що [NEE.GetNameDef] офіційно заявила світові, що ми тепер перебуваємо під їхнім захистом. Маючи військово-морську та військову міць колосального індустріального гіганта Нового Світу, ми тепер маємо потужного союзника, який підтримає нас у разі загрози. Під проводом і захистом Америки у нас більше не буде приводів для занепокоєння."
 new_england_events.371.a: "Ура!"

 # SFA Influence
 new_england_events.372.t: "[NEE.GetNameDefCap] бажає посилити вплив на [THIS.GetNameDef]"
 new_england_events.372.d: "Протягом років наша економіка залишається відсталою порівняно з рештою західного світу. Роки колоніального правління та домінування призвели до того, що наша нація відстала від стандартів індустріальної доби. Американське посольство повідомило нашому уряду, що американські інвестори готові перенести свій бізнес до нашої країни. За допомогою однієї з найбільш індустріалізованих націй світу ми, безумовно, зможемо розвиватися швидше. Хоча вони заявляють, що це жест доброї волі, немає сумнівів, що їхній вплив у нашій країні зростатиме, що довше вони залишатимуться. Крім того, ми завжди можемо ввічливо відмовити їм зараз, але залишити можливість прийняти або відхилити пропозицію згодом."
 new_england_events.372.a: "Я згоден"
 new_england_events.372.b: "Поки що не зацікавлені"
 new_england_events.372.c: "Ніколи не будемо зацікавлені"

 new_england_events.373.t1: "[FROM.GetNameDefCap] приймає угоду"
 new_england_events.373.t2: "[FROM.GetNameDefCap] бажає залишитися вільною від нашого впливу"
 new_england_events.373.d1: "Сьогоднішня дипломатична перемога нашої нації: [FROM.GetNameDef] прийняла нашу угоду. Визнаючи економічну та промислову міць нашої країни, вони погодилися на всі наші умови для сприяння їхньому розвитку. Наші інвестори та бізнес уже прямують до їхніх країн, прагнучи взяти участь у цьому новому періоді взаємних доброзичливих відносин. Під американським керівництвом нації світу, що розвиваються, отримають нашу повну співпрацю та допомогу. За наших нових друзів у Тихому океані!"
 new_england_events.373.d2: "На жаль, наш посол у [FROM.Capital.GetCapitalVictoryPointName] отримав повідомлення від їхнього уряду, що їхня країна наразі не бажає приймати нашу угоду. Якими б не були їхні причини, поки що відповідь — «ні». Хоча це невдача і це розчаровує, вони також повідомили нам, що готові до подальших переговорів у майбутньому. Можливо, зараз не найкращий час для них, і ми обов'язково розглянемо можливість звернутися до них згодом."
 new_england_events.373.d3: "На жаль, ми отримали звістку від нашого посла в [FROM.Capital.GetCapitalVictoryPointName], що їхня нація взагалі не хоче мати справ з нашою країною. Якими б не були причини, вони категорично відхилили наші вимоги та не виявляють бажання вести переговори. Ми небагато втратимо від цього, але вони постраждають від того, що не прийняли нашу вдячність та допомогу."
 new_england_events.373.a: "Чудово!"
 new_england_events.373.b: "Можливо, вони змінять свою думку."
 new_england_events.373.c: "Розчарування."

# PT 109 resuce
 new_england_events.374.t: "Тихоокеанська історія"
 new_england_events.374.dgea: "Через свій перископ підводний човен U-99, що діяв від імені Східноазійського флоту Німеччини під час розвідувальної місії поблизу Німецького Самоа, помітив незвичне видовище. На березі безлюдного острова перебувала група чоловіків та каное. Не звертаючись до штабу та порушуючи протокол, капітан-лейтенант Отто Кречмер негайно організував групу для розслідування. Висадившись на острів, вони виявили, що це були американські моряки з торпедного катера PT-109, знищеного під час атаки японців. Переконавшись, що американський екіпаж нагодований і одягнений, Кречмер негайно зв'язався з керівництвом, щоб забезпечити їхнє повернення додому.\n\nКомандиром PT-109 був не хто інший, як красень-син відомого конгресмена з Нової Англії Джозефа П. Кеннеді. Лейтенант Джон Ф. Кеннеді отримав наказ вивести PT-109 для розвідки японських військово-морських переміщень. Однак темної безмісячної ночі їхній корабель був застигнутий зненацька і протаранений японським есмінцем, який буквально розрізав судно навпіл. Втративши двох членів екіпажу, Кеннеді наказав своїм людям битися або здатися. Відважні моряки вирішили битися до кінця і пропливли 3,5 милі від уламків корабля, щоб знайти порятунок. Лейтенант плив попри травмовану спину, тягнучи за собою важко обпаленого матроса, затиснувши лямку його рятувального жилета в зубах. Кеннеді здійснював й інші багатогодинні запливи, намагаючись подати сигнал катерам, що проходили повз, або знайти припаси. Зрештою вони дісталися сусіднього острова, де знайшли кокоси, але не було прісної води. Кеннеді з товаришем пропливли ще годину і знайшли каное з водою та їжею. Через два дні їх виявив екіпаж U-99.\n\nЛейтенант Кеннеді повернувся додому героєм, хоча не припиняє дякувати Отто Кречмеру за гостинність. Він нагороджений «Пурпуровим серцем» та «Срібною зіркою». Бачачи його природну харизму, багато хто задається питанням, чи не продовжить він політичну кар'єру свого батька."
 new_england_events.374.dnogea: "Фантастична історія виживання та мужності американського духу надійшла з полів Тихоокеанської війни, приголомшивши націю. Місцеві берегові спостерігачі поблизу Соломонових островів виявили виснажений екіпаж, який вважався зниклим безвісти. Після оповіщення бази на Рендові американських моряків було доставлено в безпечне місце.\n\nПід час несподіваного японського наступу на Самоа екіпажі торпедних катерів були відправлені на розвідку. Цим підрозділом командував лейтенант Джон Фіцджеральд Кеннеді, син відомого політика з Нової Англії. Темної ночі їхній катер PT-109 був протаранений японським есмінцем і розрізаний навпіл. Лейтенант Кеннеді, попри травму спини, врятував обпаленого матроса, пропливши три з половиною милі і тримаючи ремінь його жилета в зубах. Протягом кількох днів моряки боролися за виживання на безлюдних островах, харчуючись кокосами, поки Кеннеді шукав воду та допомогу. Зрештою вони знайшли каное з припасами, а згодом були врятовані флотом.\n\nЛейтенант Кеннеді повернувся додому справжнім героєм, нагородженим «Пурпуровим серцем» та «Срібною зіркою». Тепло відгукуючись про своїх людей перед пресою і виявляючи неабияку скромність, він зачарував багатьох своєю харизмою. Дехто зазначає, що, можливо, він піде шляхом свого батька у велику політику."
 new_england_events.374.a: "На щастя, ці хлопці вижили!"

# Return of Guam
 new_england_events.376.t: "[NEE.GetNameDefCap] вимагає повернення острова [638.GetName]"
 new_england_events.376.d: "Втрачений Америкою після початку другої громадянської війни, острів [638.GetName] зрештою потрапив під наш контроль. Тепер, коли їхня країна відбудована і її погляд звернений на Тихий океан, [NEE.GetName] вимагає повернути свою колонію. Хоча Ґуам демонструє нашу силу в регіоні, цей маленький острів навряд чи вартий того, щоб розпочинати конфлікт з американцями."
 new_england_events.376.a: "Острів по праву належить нам!"
 new_england_events.376.b: "Повернути [638.GetName] під контроль [NEE.GetName]"

 new_england_events.377.t: "[FROM.GetNameDefCap] відмовляється повернути [638.GetName]"
 new_england_events.377.d: "Делегація [FROM.GetAdjective] зневажила нас! Вони стверджують, що наша слабкість під час громадянської війни, яка дозволила острову вийти з-під нашого контролю, є доказом того, що ми не здатні керувати Тихим океаном. Острів залишиться під їхнім контролем у найближчому майбутньому. Ця образа ставить наше становище в Тихоокеанському регіоні під загрозу, якщо ми не вживемо заходів."
 new_england_events.377.a: "Це неприпустимо!"

 new_england_events.378.t: "[FROM.GetNameDefCap] повертає [638.GetName]"
 new_england_events.378.d: "У Сан-Франциську успішно завершилися переговори між нами та делегацією [FROM.GetNameDef]. Вони погодилися повернути острів [638.GetName] під наш контроль. На острові відбулася фінальна церемонія: прапор [FROM.GetName] було спущено і замінено на гордий прапор [NEE.GetNameDef]!"
 new_england_events.378.a: "Ласкаво просимо додому!"

# JFK Senate
 new_england_events.379.t: "Повернення впливу Кеннеді"
 new_england_events.379.d: "Попри ганьбу Джозефа П. Кеннеді після бурхливих виборів 1944 року та скандал, що сколихнув Демократичну партію в Новій Англії, схоже, що на політичну арену вийшов інший Кеннеді — можливо, у спробі відбілити ім'я родини.\n\nДжон Фіцджеральд Кеннеді, національний герой війни після тяжких випробувань у Тихому океані, оголосив про свій намір балотуватися до Палати представників від свого рідного штату Массачусетс. Популярний молодий чоловік, широко відомий своєю теплою харизмою та воєнними нагородами — спостерігачі та опитування вказують на те, що Кеннеді неодмінно виграє ці вибори. Хоча прізвище Кеннеді все ще заплямоване скандалом, можливо, цей молодий солдат-католик знову змусить його засяяти!"
 new_england_events.379.a: "Ми будемо стежити за вашими успіхами!"

# Philippines
 new_england_events.380.t: "[FROM.GetNameDefCap] вимагає возз'єднання"
 new_england_events.380.d.in_faction: "Коли хмари диму над континентальною Америкою розсіялися, а гуркіт пострілів стих, багато [PHI.GetAdjective] політиків задалися питанням: якою буде політика [FROM.GetName] щодо [PHI.GetNameDef]. Сьогодні [FROM.GetLeader], лідер [FROM.GetNameDef], виступив із радіозверненням до всієї Америки, підбиваючи підсумки кривавої громадянської війни та вимагаючи від [PHI.GetNameDef] покинути альянс із [ROOT.GetFactionName] і повернутися до складу республіки як рівноправний партнер, а не територія. Водночас невелика група делегатів прибула до Маніли в очікуванні відповіді."
 new_england_events.380.d.default: "Коли хмари диму над континентальною Америкою розсіялися, а гуркіт пострілів стих, багато [PHI.GetAdjective] політиків задалися питанням, чи не настав час повернутися в американську сферу впливу. Сьогодні [FROM.GetLeader], лідер [FROM.GetNameDef], виступив із радіозверненням до всієї Америки, підбиваючи підсумки кривавої громадянської війни та закликаючи [PHI.GetNameDef] повернутися до складу республіки як рівноправний партнер, а не територія. Водночас невелика група делегатів прибула до Маніли в очікуванні відповіді."
 new_england_events.380.a: "Повідомити [THIS.faction_leader.GetNameDef], що ми хочемо возз'єднання."
 new_england_events.380.b: "Попросити [THIS.faction_leader.GetNameDef] втрутитися."
 new_england_events.380.c: "У нас немає вибору."
 new_england_events.380.d: "Категорично ні!"

 new_england_events.381.t: "[PHI.GetNameDefCap] бажає повернутися до складу [america.GetNameDef]"
 new_england_events.381.d: "Після нещодавнього радіозвернення [america.GetLeader] з вимогою возз'єднання [FROM.GetNameDef] із [america.GetNameDef], [FROM.GetLeader] повідомив [ROOT.GetLeader], що Філіппіни мають намір повернутися під захист континентальних Сполучених Штатів. Проте він також бажає отримати нашу згоду, перш ніж контактувати з делегатами, які щойно прибули до Маніли.\n\nДозвіл на їхнє повернення дозволить нам налагодити якщо не дружні, то цілком робочі стосунки з [america.GetNameDef], але ми також втратимо критично важливий плацдарм для протидії японській агресії в Тихому океані."
 new_england_events.381.a: "У жодному разі не заперечуємо."
 new_england_events.381.b: "Категорично ні!"

 new_england_events.382.t: "[FROM.GetNameDefCap] схвалює возз'єднання з Америкою"
 new_england_events.382.d: "[FROM.GetNameDefCap] вислухав аргументи нашого дипломата в [FROM.Capital.GetCapitalVictoryPointName], який представив наші доводи за повернення до континентальної Америки. Після нетривалих роздумів він знову викликав наших представників і, на загальний подив і полегшення, погодився дозволити нам повернутися. [FROM.GetNameDefCap] бажає нашій країні всього найкращого."
 new_england_events.382.a: "Чудово!"

 new_england_events.383.t: "[PHI.GetNameDefCap] повертається до складу Америки"
 new_england_events.383.d: "Сьогодні невеликий гарнізон американських військ висадився в порту Маніли та пройшов маршем до центру міста. Опівдні над палацом Малаканьян разом із філіппінським прапором було піднято прапор [america.GetNameDef]. Потім [PHI.GetLeader] виступив із промовою, закликавши філіппінців святкувати відновлення зв'язків між Філіппінами та континентальною Америкою."
 new_england_events.383.a: "Чудово!"

 new_england_events.384.t: "[FROM.GetNameDefCap] відхиляє возз'єднання з Америкою"
 new_england_events.384.d: "Після консультацій зі своїми радниками [FROM.GetLeader] відхилив наш запит про возз'єднання з континентальною Америкою, назвавши головною причиною політичну нестабільність. Як одне з багатьох американських володінь, контроль над якими було втрачено під час громадянської війни, повернення [PHI.GetNameDef] до складу Америки безперечно додало б легітимності господареві Білого дому. Проте лідер Філіппін побоюється, що архіпелаг розглядатимуть лише як політичний інструмент, позбавлений справжньої рівності в уряді.\n\nХоча ми можемо поважати це рішення, значна частина філіппінського населення воліла б бути під єдиним американським дахом. Ми могли б таємно повідомити американських делегатів та організувати возз'єднання за спиною [FROM.GetLeader], перш ніж той встигне зреагувати."
 new_england_events.384.a: "Кинути їм виклик!"
 new_england_events.384.b: "Ми повинні поважати це рішення."

 new_england_events.385.t: "[PHI.GetNameDefCap] кидає нам виклик!"
 new_england_events.385.d: "Попри те, що ми вказували на можливість використання Філіппін лише як політичного інструменту для переможця громадянської війни, наші інформатори передали повідомлення: [PHI.GetLeader] вирішив організувати возз'єднання таємно. Ці звіти видаються достовірними. У нас є вибір: використати всі засоби, щоб залишити їх у нашій сфері впливу, включно з війною проти їхніх покровителів, або просто дозволити тихоокеанським островам повернутися до континентальної Америки."
 new_england_events.385.a: "Як вони сміють!"
 new_england_events.385.b: "Філіппіни не варті війни."

 new_england_events.386.t: "[FROM.FROM.GetNameDefCap] погрожує нам"
 new_england_events.386.d: "До [ROOT.Capital.GetCapitalVictoryPointName] надійшла гнівна телеграма з вимогою припинити процес повернення Філіппін до континентальної Америки під загрозою війни з [FROM.FROM.GetNameDef]. Очевидно, вони недооцінили настрої філіппінців, але прагнуть зберегти свій хоч і малий, але вплив на острови. Ми можемо стояти на своєму і відмовити, що потенційно розпалить ще одну жорстоку війну відразу після завершення громадянської, або відступити і залишити Філіппіни їм."
 new_england_events.386.a: "Тоді нехай буде війна."
 new_england_events.386.b: "Це не варте пролиття крові."

 new_england_events.387.t: "[PHI.GetNameDefCap] просить про втручання"
 new_england_events.387.d: "[PHI.GetLeader] надіслав нам зашифроване повідомлення, інформуючи про офіційні вимоги [america.GetName] повернути Філіппіни до їхньої сфери впливу. У вимогах натякають на можливість військових дій для забезпечення повернення. Таким чином, [PHI.GetLeader] попросив нас надати військову підтримку та підтримати їхнє прагнення до незалежності від Америки."
 new_england_events.387.a: "Ми захищаємо наших союзників!"
 new_england_events.387.b: "Вони самі по собі."

 new_england_events.388.t: "[FROM.GetNameDefCap] втручається"
 new_england_events.388.d: "Маніла надала відповідь. Вони відхилили пропозицію про возз'єднання, але коли наші делегати натякнули на застосування зброї, [PHI.GetLeader] відповів, що альянс [PHI.GetFactionName], до якого приєдналися Філіппіни, підтримає їх у разі нападу. Делегатські групи були поспіхом відправлені назад до Америки. У нас залишилося два варіанти: воювати за Перлину Орієнту або відступити."
 new_england_events.388.a: "Тоді нехай буде війна."
 new_england_events.388.b: "Філіппіни не варті війни."

 new_england_events.389.t: "[FROM.GetNameDefCap] відмовляється втручатися"
 new_england_events.389.d: "Ми отримали відповідь від [FROM.GetLeader], який повідомив, що вони не підтримають нас у разі американського вторгнення. Наша армія невелика і точно не зможе протистояти могутності американської індустрії. Проте ми все ще маємо шанс і не можемо здатися без бою. Яким буде наш наступний крок?"
 new_england_events.389.a: "Тепер у нас немає вибору..."
 new_england_events.389.b: "Ми не віддамо свою незалежність!"

 new_england_events.390.t: "Філіппіни відхиляють нашу пропозицію відновити зв'язки"
 new_england_events.390.d: "Щойно нашим делегатам у Манілі повідомили, що [PHI.GetNameDef] не повернеться до складу Америки. Проте [FROM.GetLeader] не роз'яснив причин відмови та поспіхом випровадив нашу делегацію, не залишивши простору для подальших переговорів. Зайве казати, що єдині варіанти, які нам залишилися — це оголошення війни [FROM.GetNameDef] або відступ."
 new_england_events.390.a: "Тоді нехай буде війна."
 new_england_events.390.b: "Філіппіни не варті війни."

 new_england_events.391.t: "[FROM.GetNameDefCap] вимагає повернення Філіппін"
 new_england_events.391.d.puppet_same_faction: "Філіппіни створили незалежний уряд під час американської громадянської війни та увійшли в оборонний альянс, щоб не допустити пожежі війни на береги тихоокеанського архіпелагу. Сьогодні ми отримали повідомлення від [FROM.GetNameDef] про бажання мирно відновити зв'язки з Філіппінами. Острови ніколи не належали нам, і їх повернення під контроль США вбереже нас від війни, але водночас ми маємо поважати свій альянс. Що нам робити?"
 new_england_events.391.d.puppet: "Філіппіни створили незалежний уряд під час американської громадянської війни під нашим захистом. Сьогодні ми отримали повідомлення від [FROM.GetNameDef] про бажання мирно відновити зв'язки з Філіппінами. Острови ніколи не належали нам, і їх повернення вбереже нас від конфлікту, але ми маємо захищати свій протекторат. Що нам робити?"
 new_england_events.391.d.annexed_same_faction: "Ми анексували Філіппіни під час американської громадянської війни, а тепер Америка вимагає їхнього повернення як своїх колишніх територій. Стратегічна важливість Філіппін як плацдарму для впливу в Тихому океані робить це рішення важким, проте загроза війни з [america.GetNameDef] цілком реальна. Як нам вчинити?"
 new_england_events.391.d.annexed: "Ми анексували Філіппіни під час американської громадянської війни, а тепер Америка вимагає їхнього повернення. Стратегічна важливість архіпелагу робить рішення складним, але потенційна війна з [america.GetNameDef] — це неабияка загроза. Як нам вчинити?"
 new_england_events.391.a: "Повернути американські землі."
 new_england_events.391.b: "Ні, ми залишимо їх собі."
 new_england_events.391.c: "Філіппіни не варті війни."
 new_england_events.391.d: "Філіппіни належать нам."

 new_england_events.392.t: "[FROM.GetNameDefCap] повертає Філіппіни"
 new_england_events.392.d: "Ми отримали чудові новини. [FROM.GetNameDefCap] повідомила нам, що не хоче ставити під загрозу крихкий мир між нами, і погодилася на мирне возз'єднання Філіппін з Америкою."
 new_england_events.392.a: "Чудово."

 new_england_events.393.t: "Зрада [FROM.GetNameDefCap]"
 new_england_events.393.d: "Ми отримали звістку про надзвичайну зраду! [FROM.GetNameDef] відмовилася обіцяти нам військову допомогу у разі вторгнення. Без підтримки такої сили нас швидко розчавить американська індустрія, проте ми можемо спробувати оборонятися самі стільки, скільки зможемо."
 new_england_events.393.a: "Це обурливо!"
 new_england_events.393.b: "Філіппіни не варті такої боротьби"

 new_england_events.394.t: "[FROM.GetNameDefCap] виходить із [Root.GetFactionName]"
 new_england_events.394.d: "Маніла, дізнавшись, що ми не підтримаємо їх у разі американського вторгнення, оголосила про вихід із [Root.GetFactionName] та намір гордо стояти наодинці проти загарбників. Вони звинуватили нас у боягузливому самозбереженні та брутально вислали наших дипломатів. Попри зусилля переконати їх залишитися, їхня лють зрозуміла, і нам залишається лише поважати це рішення."
 new_england_events.394.a: "Це могло пройти і краще..."

 new_england_events.395.t: "[FROM.GetNameDefCap] відмовляється повертати Філіппіни"
 new_england_events.395.d: "Переговори зайшли в глухий кут. Наші делегати з розчаруванням повідомили в [ROOT.Capital.GetCapitalVictoryPointName], що [FROM.GetNameDef] не дозволить Філіппінам повернутися до нас. Їх випровадили з країни та відправили назад до США. Тепер у нас два шляхи: оголосити війну, щоб змусити повернути архіпелаг, або відступити і чекати іншої нагоди."
 new_england_events.395.a: "Тоді нехай буде війна."
 new_england_events.395.b: "Ми не можемо з ними воювати."

 new_england_events.396.t: "[FROM.GetNameDefCap] вимагає відновлення демократії"
 new_england_events.396.d: "Хоча американці були задоволені поверненням Філіппін до своєї сфери впливу, їм мало просто володіти островом. Вони також бажають відновлення демократії на архіпелазі. Це може поставити під загрозу наше благополуччя через нашу роль у поваленні попереднього демократичного уряду. Але, можливо, якщо ми підемо на поступки добровільно, американці будуть поблажливими..."
 new_england_events.396.a: "Ми підемо у відставку."
 new_england_events.396.b: "Вони з'їхали з глузду?"

 new_england_events.397.t: "[FROM.GetNameDefCap] відмовляється відновлювати демократію"
 new_england_events.397.d: "Оскільки переговори зайшли в глухий кут, наші делегати з великим розчаруванням повідомили в [ROOT.Capital.GetCapitalVictoryPointName], що [FROM.GetNameDef] не дозволить відновити демократичне правління на Філіппінах. Наших представників було вислано назад до континентальних Сполучених Штатів. У нас залишилося два варіанти: оголосити війну для силового відновлення демократії або відступити до кращих часів."
 new_england_events.397.a: "Хай буде війна."
 new_england_events.397.b: "Ми не можемо з ними воювати."

## NEE/ACC Interactions ##
# Seattle Lowdenville
 new_england_events.400.t: "Відновлення порядку в Сіетлі"
 new_england_events.400.d: "Під час розпалу Великої депресії неспроможність політики колишнього президента Лоудена пом'якшити економічну кризу призвела до появи «Лоуденвіллів» у Сіетлі, штат Вашингтон. Ці пустки з нетрів, де мешкали безпритульні, відображали відсутність соціального захисту в країні. Після перемоги демократії у другій американській громадянській війні президент [NEE.GetLeader] та його оточення, включаючи генерала Лемюела Шеперда, прибули до Сіетла, щоб оцінити масштаби руйнувань та закликати до національної єдності.\n\nНа початку 1900-х Сіетл став прихистком для соціалістичного руху. Вашингтон мав понад 62 000 членів Соціалістичної партії Америки. Коли спалахнула війна і [ACC.GetNameDef] відокремилися, соціалістичні демагоги, як-от Анна Луїза Стронґ, очолили зрадницьку Комуну Сіетла в повстанні проти Союзу. Днями на вулицях панували анархія та хаос. Війська конституціоналістів під командуванням генерала Александера Вандеґріфта взяли місто в облогу, і після тижня запеклих вуличних боїв останні синдикалісти здалися. Організатори заколоту були засуджені до ув'язнення.\n\nХоча повстання було придушено ще на початку війни, сліди битв усе ще помітні. Президент [NEE.GetLeader] виголосив коротку промову, подякувавши Сіетлу за вірність американській демократії та стійкість у жахливих умовах. Генерали Вандеґріфт та Шеперд також були присутні; колишні побратими з морської піхоти про щось приватно спілкувалися. Нація, яка, здавалося, розвалилася, знову звелася на ноги."
 new_england_events.400.a: "Ваша лояльність назавжди залишиться цінністю!"
 new_england_events.400.b: "Дякуємо за добрі слова!"

 new_england_events.401.t: "Президент [ACC.GetLeader] звертається до Нової Англії"
 new_england_events.401.d: "Цілий тиждень у Массачусетсі бостонці святкували з парадами, багатьма барбекю, феєрверками та зустрічами. Національна криза нарешті закінчилася. Радикали та революціонери, що загрожували розірвати Америку, були переможені. У найтемнішу годину [ACC.GetNameDef] та Нова Англія билися пліч-о-пліч не просто як американці, а як брати по зброї.\n\nУ радіозверненні до Тимчасового уряду президент [ACC.GetLeader] високо оцінив владу Бостона за швидке економічне відновлення. Він відзначив далекоглядність Нової Англії у розбудові промисловості перед вступом у конфлікт. Понад усе він подякував чоловікам та жінкам, які допомагали створювати зброю, що згодом була відправлена до [ACC.GetNameDef]. Промова президента була зустрінута схваленням у газетах по всьому регіону. Пожежа, що загрожувала знищити душу нації, була загашена там, де ця нація народилася. За іронією долі, жителі Нової Англії знову розпочали боротьбу за свободу."
 new_england_events.401.a: "Нам було приємно допомогти!"
 new_england_events.401.b: "Ваша допомога не буде забута!"

 new_england_events.402.t: "Об'єднання збройних сил"
 new_england_events.402.d: "Пліч-о-пліч юнаки Нової Англії та [ACC.GetNameDef] воювали і вмирали разом. У битвах під Чикаго, Новим Орлеаном та Денвером хлопці з Род-Айленда та Каліфорнії відповіли на національний заклик врятувати Америку. У Сан-Франциську відбулася спільна церемонія об'єднання армій обидвох сторін. [ACC.GetNameDef] представляв генерал Джордж Маршалл, а Тимчасовий уряд — генерал Марк Кларк. Друзі, розділені війною, знову змогли обійняти один одного. Вони більше не були католицьким ополченням чи добровольцями нісей — тепер вони солдати Збройних сил Сполучених Штатів.\n\nПрезидент [NEE.GetLeader] похвалив [ACC.GetNameDef] за їхній ранній вступ у війну. Відмовившись визнати «федеральний уряд» Макартура, вони вступили в бій, щоб врятувати демократію від військової хунти. Поки Нова Англія відбудовувалася в ізоляції, [ACC.GetNameDef] воювала наодинці. Як і наші предки проти короля Георга, вони взялися за зброю всупереч обставинам — і перемогли. Відбудова буде важкою, але обидва уряди зобов'язалися зустрітися в Сент-Луїсі для офіційного возз'єднання США."
 new_england_events.402.a: "Пліч-о-пліч із нашими братами по зброї!"
 new_england_events.402.b: "Пліч-о-пліч із нашими братами по зброї!"

 new_england_events.403.t: "Відданість демократії"
 new_england_events.403.d: "Після довгих очікувань президент [ACC.GetLeader] нарешті прибув до Бостона. Під час події, яку транслювали на всю країну, він виголосив промову перед ратушею на Скул-стріт. Тимчасовий уряд Нової Англії був поспіхом сформований навесні 1937 року за допомоги Канади та Антанти. Коли тисячі людей тікали від насильства, що поглинуло країну, Нова Англія була бастіоном свободи. Жителі регіону бачили в Антанті головного суперника радикалізму, а в канадському уряді — носія факела свободи в Західній півкулі.\n\nПроте канадський уряд згодом піддався авторитаризму та залізній волі англійського короля. Вони відкинули щит свободи і стали такими ж автократичними, як і та сама революція, що вигнала британців у вигнання. Через це [ACC.GetLeader] заявив, що Америка має перед ними несплачений борг. Він завершив промову, проголосивши, що уряди [ACC.GetNameDef] та Нової Англії почнуть відбудову демократії по всій країні від океану до океану."
 new_england_events.403.a: "Нехай факел ніколи не згасне!"
 new_england_events.403.b: "Нехай факел ніколи не згасне!"

 new_england_events.404.t: "Конференція в Сент-Луїсі"
 new_england_events.404.d.neeleader: "Після об'єднання армій Нової Англії та [ACC.GetNameDef], обидві сторони прибули до Сент-Луїса на обіцяну зустріч. Місто великого стратегічного значення було сильно пошкоджене під час війни, проте президенти [NEE.GetLeader] та [ACC.GetLeader] вважали, що його розташування в самому центрі країни стане символом примирення. Конгресмени з обох узбереж зібралися в ратуші Сент-Луїса, щоб обговорити возз'єднання. У телетрансляції на весь світ два президенти підписали договір, що офіційно підтвердив відновлення Сполучених Штатів Америки.\n\nПід сонячним світлом, що пробивалося крізь вікна в мансардах, уряди Нової Англії та [ACC.GetNameDef] підписали звернення до всієї нації, закликаючи втомлений народ до миру та єдності у відбудові. Було проголошено, що всі американці — це єдиний народ, незалежно від політичних поглядів, кольору шкіри чи статків. Майбутнє — за спільними цінностями американської демократії. Кошмар скінчився. Від океану до океану факел леді Свободи запалав знову.\n\nНа завершення конференції президент [ACC.GetLeader] виголосив промову, вихваляючи дії [NEE.GetLeader] у доведенні війни до переможного кінця. Він оголосив, що йде у відставку, щоб передати повноту виконавчої влади [NEE.GetLeader] — президенту відновленої Америки!"
 new_england_events.404.d.accleader: "Після об'єднання армій Нової Англії та [ACC.GetNameDef], обидві сторони прибули до Сент-Луїса на обіцяну зустріч. Місто великого стратегічного значення було сильно пошкоджене під час війни, проте президенти [NEE.GetLeader] та [ACC.GetLeader] вважали, що його розташування в самому центрі країни стане символом примирення. Конгресмени з обох узбереж зібралися в ратуші Сент-Луїса, щоб обговорити возз'єднання. У телетрансляції на весь світ два президенти підписали договір, що офіційно підтвердив відновлення Сполучених Штатів Америки.\n\nПід сонячним світлом, що пробивалося крізь вікна в мансардах, уряди Нової Англії та [ACC.GetNameDef] підписали звернення до всієї нації, закликаючи втомлений народ до миру та єдності у відбудові. Було проголошено, що всі американці — це єдиний народ, незалежно від політичних поглядів, кольору шкіри чи статків. Майбутнє — за спільними цінностями американської демократії. Кошмар скінчився. Від океану до океану факел леді Свободи запалав знову.\n\nНа завершення конференції президент [NEE.GetLeader] виголосив промову, вихваляючи дії [ACC.GetLeader] у доведенні війни до переможного кінця. Він оголосив, що йде у відставку, щоб передати повноту виконавчої влади [ACC.GetLeader] — президенту відновленої Америки!"
 new_england_events.404.a: "Ми всі — один народ!"
 new_england_events.404.b: "Ми всі — один народ!"

 new_england_events.410.t: "Президентські вибори 1940 року"
 new_england_events.410.d.normal: "[ROOT.GetLeader] керував нацією з моменту початку війни, коли [ACC.GetNameDef] відокремилися від тиранії Макартура. Під час найбільшої загрози американській демократії її народ стояв непохитно на стороні засновних принципів. З наближенням виборів обидві провідні партії почали активну кампанію.\n\nВід Демократичної партії балотується Калберт Олсон з Юти. Син суфражистки, Олсон пішов у політику в юному віці. Хоча зазвичай затятий атеїст на кшталт Олсона зустрів би осуд серед американців, жахи війни залишили шрами навіть у найвідданіших вірян, які намагаються знайти відповідь на питання, як могли статися події останніх трьох років.\n\nЙого опонентом від Республіканської партії є Квентін Рузвельт із Нью-Йорка. Прогресивний республіканець, він знайшов підтримку серед широкого кола виборців. Рузвельт оголосив про намір провести значні реформи через політику «справедливого курсу», маючи на меті відновити довіру до економіки та федерального уряду. Син колишнього президента Теодора Рузвельта, «молодий Лось» сподівається використати пам'ять про більш надійний період історії, щоб привести «Велику стару партію» до перемоги."
 new_england_events.410.d.socdem: "[ROOT.GetLeader] керував нацією з моменту початку війни, коли [ACC.GetNameDef] відокремилися від тиранії Макартура. Під час найбільшої загрози американській демократії її народ стояв непохитно на стороні засновних принципів. З наближенням виборів обидві провідні партії почали активну кампанію.\n\nВід Демократичної партії балотується Калберт Олсон з Юти. Син суфражистки, Олсон пішов у політику в юному віці. Хоча зазвичай затятий атеїст на кшталт Олсона зустрів би осуд серед американців, жахи війни залишили шрами навіть у найвідданіших вірян.\n\nЙого опонентом від Республіканської партії є Квентін Рузвельт із Нью-Йорка. Прогресивний республіканець, він обіцяє реформи через політику «справедливого курсу». Син Теодора Рузвельта сподівається на перемогу «Великої старої партії».\n\nБагатьох на дільницях дивує Фермерсько-лейбористська партія. Оскільки Соціалістична партія та Г'юї Лонґ зруйнували двопартійну монополію, фермери та лейбористи змогли заповнити вакуум. Фермер з Айови Генрі Воллес має неабияку підтримку серед селянства. Він пообіцяв, що під час його терміну не буде накладено вето на такі закони, як білль Макнарі-Гогена про допомогу фермерам."
 new_england_events.410.a: "Олсон та демократи здобувають впевнену перемогу!"
 new_england_events.410.b: "Рузвельт та республіканці забезпечують собі голоси!"
 new_england_events.410.c: "Воллес перемагає з великим відривом!"

 #Olson vs Langlie
 new_england_events.412.t: "Президентські вибори 1944 року"
 new_england_events.412.d.ACC: "Вкотре по всій [THIS.GetNameDef] на кожному розі можна побачити плакати, що рекламують президентські вибори [GetYear] року. Експерти стверджують, що ці перегони будуть надзвичайно напруженими.\n\nХоча дехто неохоче підтримав відкритого атеїста Олсона у 1940 році, його дії на посаді підірвали довіру вірян. Його вето на законопроєкти про безкоштовний проїзд для учнів релігійних приватних шкіл та дозвіл католицьким школярам відвідувати катехизацію під час навчального дня налаштували багатьох проти нього. Менше з тим, його невтомна праця над реформуванням пенітенціарної системи має певну підтримку серед громадськості.\n\nРеспубліканська партія також висунула кандидата від Вашингтона для протистояння Олсону. Колишній мер Сіетла, а нині губернатор штату Вашингтон Артур Б. Ленґлі має репутацію борця за чисту владу, його підтримують консерватори та помірковані реформатори. Під час громадянської війни Ленґлі намагався, хоч і невдало, домогтися прийняття закону, який надав би йому безпрецедентні надзвичайні повноваження — це питання досі викликає дискусії навколо його адміністрації.\n\nВже другий виборчий цикл поспіль Фермерсько-лейбористська партія веде запеклу боротьбу за вихід на загальнонаціональний рівень. Дехто навіть вірить, що вони здатні перемогти на виборах [GetYear] року! Філіп Ла Фолетт із Вісконсину набув значної популярності завдяки новинам про прогресивне законодавство та політику, яку він втілив у своєму рідному штаті."
 new_england_events.412.d.default: "Вкотре по всій [THIS.GetNameDef] на кожному розі можна побачити плакати, що рекламують президентські вибори [GetYear] року. Експерти стверджують, що ці перегони будуть надзвичайно напруженими.\n\nХоча дехто неохоче підтримав відкритого атеїста Олсона у 1940 році, його дії на посаді підірвали довіру вірян. Його вето на законопроєкти про безкоштовний проїзд для учнів релігійних приватних шкіл та дозвіл католицьким школярам відвідувати катехизацію під час навчального дня налаштували багатьох проти нього. Менше з тим, його невтомна праця над реформуванням пенітенціарної системи має певну підтримку серед громадськості.\n\nРеспубліканська партія також висунула кандидата від Вашингтона для протистояння Олсону. Колишній мер Сіетла, а нині губернатор штату Вашингтон Артур Б. Ленґлі має репутацію борця за чисту владу, його підтримують консерватори та помірковані реформатори. Під час громадянської війни Ленґлі намагався, хоч і невдало, домогтися прийняття закону, який надав би йому безпрецедентні надзвичайні повноваження — це питання досі викликає дискусії навколо його адміністрації."
 new_england_events.412.a: "Олсон забезпечує собі ще чотири роки!"
 new_england_events.412.b: "Ленґлі виривається вперед!"
 new_england_events.412.c: "Ла Фолетт лідирує в опитуваннях!"

 new_england_events.413.t: "Президентські вибори 1944 року"
 new_england_events.413.d.ACC_wallace: "Політичні машини запрацювали на повну потужність по всій [THIS.GetNameDef]. Виборчий сезон змусив багатьох представників усього політичного спектра включитися в шалену боротьбу, щоб забезпечити обрання свого кандидата.\n\nКандидат від демократів Шерідан Дауні — повна протилежність усьому, проти чого боровся його попередник Калберт Олсон. Будучи прихильником великих нафтових баронів, він прагнув закріпити за ними можливість контролю штату над величезними запасами нафти Каліфорнії. Хоча Дауні значно консервативніший за багатьох у Демократичній партії, він відіграв ключову роль у кампанії EPIC на початку 30-х років, завоювавши прихильність частини лівого електорату.\n\nРеспубліканський кандидат Ерл Воррен популярний серед обох провідних партій істеблішменту. На губернаторських виборах 1942 року Воррен висувався одночасно від республіканців та демократів, балотуючись без партійного ярлика. Його позапартійна позиція ледь не дозволила йому перемогти на праймеріз обох партій, а на загальних виборах він легко здобув 57% голосів.\n\nСподіваючись на другий термін, чинний президент від Фермерсько-лейбористської партії Генрі Воллес невтомно веде кампанію, щоб зберегти свій антисистемний рух. Під час свого президентства Воллес активно працював із Міністерством сільського господарства над створенням «завжди нормального зерносховища», за допомогою якого уряд закуповує надлишки продукції для регулювання цін на користь фермерів."
 new_england_events.413.d.ACC_mcnary: "Політичні машини запрацювали на повну потужність по всій [THIS.GetNameDef]. Виборчий сезон змусив багатьох представників усього політичного спектра включитися в шалену боротьбу, щоб забезпечити обрання свого кандидата.\n\nКандидат від демократів Шерідан Дауні — повна протилежність усьому, проти чого боровся його попередник Калберт Олсон. Будучи прихильником великих нафтових баронів, він прагнув закріпити за ними можливість контролю штату над величезними запасами нафти Каліфорнії. Хоча Дауні значно консервативніший за багатьох у Демократичній партії, він відіграв ключову роль у кампанії EPIC на початку 30-х років, завоювавши прихильність частини лівого електорату.\n\nРеспубліканський кандидат Ерл Воррен популярний серед обох провідних партій істеблішменту. На губернаторських виборах 1942 року Воррен висувався одночасно від республіканців та демократів, балотуючись без партійного ярлика. Його позапартійна позиція ледь не дозволила йому перемогти на праймеріз обох партій, а на загальних виборах він легко здобув 57% голосів.\n\nВже другий виборчий цикл поспіль Фермерсько-лейбористська партія веде запеклу боротьбу за загальнонаціональне визнання. Дехто навіть вірить, що вони здатні перемогти на виборах [GetYear] року! Філіп Ла Фолетт із Вісконсину набув значної популярності завдяки прогресивній політиці, яку він впровадив у своєму рідному штаті."
 new_england_events.413.d.NEE: "Політичні машини запрацювали на повну потужність по всій [THIS.GetNameDef]. Виборчий сезон змусив багатьох представників усього політичного спектра включитися в шалену боротьбу, щоб забезпечити обрання свого кандидата.\n\nКандидат від демократів Шерідан Дауні — повна протилежність усьому, проти чого боровся його попередник Калберт Олсон. Будучи прихильником великих нафтових баронів, він прагнув закріпити за ними можливість контролю штату над величезними запасами нафти Каліфорнії. Хоча Дауні значно консервативніший за багатьох у Демократичній партії, він відіграв ключову роль у кампанії EPIC на початку 30-х років, завоювавши прихильність частини лівого електорату.\n\nРеспубліканський кандидат Ерл Воррен популярний серед обох провідних партій істеблішменту. На губернаторських виборах 1942 року Воррен висувався одночасно від республіканців та демократів, балотуючись без партійного ярлика. Його позапартійна позиція ледь не дозволила йому перемогти на праймеріз обох партій, а на загальних виборах він легко здобув 57% голосів."
 new_england_events.413.a: "Виборці голосують за Дауні!"
 new_england_events.413.b: "Воррен виграє вибори!"
 new_england_events.413.c: "Воллес здобуває перемогу!"
 new_england_events.413.e: "Ла Фолетт лідирує в опитуваннях!"

 new_england_events.415.t: "Президентські вибори 1948 року"
 new_england_events.415.d.ACC: "З наближенням листопада країна була заповнена політичними кампаніями на кожному розі, на кожній трибуні та в газетах. Попередні підрахунки пророкують запеклу боротьбу між кандидатами.\n\nВід Демократичної партії чинний президент Шерідан Дауні балотується на другий термін. Під час свого перебування на посаді Дауні зміг забезпечити прийняття законів про пенсійну програму «Шинка та яйця» та додаткові пільги для ветеранів. Такі ініціативи принесли чинному президенту значну підтримку, навіть якщо викликали роздратування у частини республіканців.\n\nПроти Дауні від Республіканської партії виступає Ерл Воррен із Каліфорнії. Не дозволивши поразці 1944 року зламати його дух, колишній юрист готовий вкотре помірятися силами на виборчих дільницях. У разі обрання Воррен пообіцяв розширити свої зусилля з боротьби зі злочинністю на всю країну. «Кожен американець має право відчувати себе в безпеці у власному домі», — заявив Воррен на пресконференції минулого тижня.\n\nРоль «спойлера» для двох партій відіграє кандидат від Прогресивної партії Глен Тейлор. Артист і політик з Айдахо, Тейлор здобув підтримку прихильників десегрегації. Одним із відомих інцидентів, що приніс йому національну славу, став його арешт у Бірмінгемі, штат Алабама, на початку цього року. Комісар поліції Юджин «Булл» Коннор заарештував Тейлора за спробу скористатися дверима, зарезервованими лише для афроамериканців, замість дверей «тільки для білих». Ця новина облетіла всю країну, і під величезним тиском Коннор був змушений звільнити Тейлора."
 new_england_events.415.d.NEE: "З наближенням листопада країна була заповнена політичними кампаніями на кожному розі, на кожній трибуні та в газетах. Попередні підрахунки пророкують запеклу боротьбу між кандидатами.\n\nВід Демократичної партії чинний президент Шерідан Дауні балотується на другий термін. Під час свого перебування на посаді Дауні зміг забезпечити прийняття законів про пенсійну програму «Шинка та яйця» та додаткові пільги для ветеранів. Такі ініціативи принесли чинному президенту значну підтримку, навіть якщо викликали роздратування у частини республіканців.\n\nПроти Дауні від Республіканської партії виступає Ерл Воррен із Каліфорнії. Не дозволивши поразці 1944 року зламати його дух, колишній юрист готовий вкотре помірятися силами на виборчих дільницях. У разі обрання Воррен пообіцяв розширити свої зусилля з боротьби зі злочинністю на всю країну. «Кожен американець має право відчувати себе в безпеці у власному домі», — заявив Воррен на пресконференції минулого тижня."
 new_england_events.415.a: "Дауні вщент розбиває конкурентів!"
 new_england_events.415.b: "Воррен здобуває велику перемогу!"
 new_england_events.415.c: "Тейлор очолить націю!"

 new_england_events.416.t: "Президентські вибори 1948 року"
 new_england_events.416.d.ACC_olson: "З наближенням листопада країна була заповнена політичними кампаніями на кожному розі, на кожній трибуні та в газетах. Попередні підрахунки пророкують запеклу боротьбу між кандидатами.\n\nВідслуживши свої традиційні два терміни, Калберт Олсон вирішив продовжити президентську традицію, встановлену Джорджем Вашингтоном, і піти у відставку, передавши естафету колезі-демократу. Його обранцем став Кларенс Мартін. Уродженець території Вашингтон, Мартін ішов політичними стопами батька з 1928 року. Відомий як «народний губернатор», Мартін запекло боровся за одночасне скорочення державних витрат і захист своїх виборців від найгірших наслідків депресії.\n\nПроти Мартіна від Республіканської партії виступає Ерл Воррен із Каліфорнії. Колишній юрист готовий спробувати свої сили на національних виборах. У разі обрання Воррен пообіцяв розширити боротьби зі злочинністю на всю країну. «Кожен американець має право відчувати себе в безпеці у власному домі!» — заявив Воррен минулого тижня.\n\nРоль «спойлера» відіграє кандидат від Прогресивної партії Глен Тейлор. Артист і політик з Айдахо, Тейлор здобув підтримку десегрегаціоністів. На той час у Бірмінгемі, де відбувся його гучний арешт, афроамериканці становили близько 40,7% населення (згідно з переписом 1940 року), і жорсткі дії комісара «Булла» Коннора лише підігріли національну дискусію про громадянські права."
 new_england_events.416.d.NEE_olson: "З наближенням листопада країна була заповнена політичними кампаніями на кожному розі, на кожній трибуні та в газетах. Попередні підрахунки пророкують запеклу боротьбу між кандидатами.\n\nВідслуживши традиційні два терміни, Калберт Олсон вирішив піти у відставку в 1948 році. Його наступником у партії став Кларенс Мартін. Відомий як «народний губернатор», Мартін боровся за скорочення державних витрат, намагаючись вберегти населення від наслідків депресії.\n\nЙого опонентом від республіканців є Ерл Воррен із Каліфорнії. Колишній юрист готовий вийти на національну арену. Воррен пообіцяв зробити боротьбу зі злочинністю пріоритетом усієї країни. «Кожен американець має право відчувати себе в безпеці у власному домі!» — наголосив він на нещодавній пресконференції."
 new_england_events.416.d.ACC_warren: "З наближенням листопада країна поринула у вир політичної боротьби. Попередні підрахунки вказують на мінімальний розрив між кандидатами.\n\nВід Республіканської партії Ерл Воррен балотується на другий термін. Під час свого президентства він запровадив загальнонаціональний податок на бензин для фінансування сучасної системи автомагістралей. Проте Воррену не вдалося подолати опір медичних та бізнес-кіл щодо впровадження системи загального медичного страхування.\n\nПроти Воррена від демократів виступає Кларенс Мартін. Відомий як «народний губернатор», Мартін прагнув подолати депресію через створення робочих місць, а не просто виплати. «Дай людині рибу, і вона буде ситою один день; навчи людину рибалити, і вона буде ситою все життя» — таким був його девіз.\n\nРоль «спойлера» відіграє Глен Тейлор від Прогресивної партії. Поглинувши залишки Фермерсько-лейбористської партії та лівих сил, партія змістила акцент на питання громадянських прав. Глен Тейлор став національною знаменитістю після того, як Юджин «Булл» Коннор заарештував його в Бірмінгемі за використання входу для чорношкірих."
 new_england_events.416.d.NEE_warren: "З наближенням листопада країна поринула у вир політичної боротьби. Попередні підрахунки вказують на мінімальний розрив між кандидатами.\n\nВід Республіканської партії Ерл Воррен балотується на другий термін. Під час свого президентства він запровадив загальнонаціональний податок на бензин для фінансування сучасної системи автомагістралей. Проте Воррену не вдалося подолати опір медичних та бізнес-кіл щодо впровадження системи загального медичного страхування.\n\nПроти Воррена від демократів виступає Кларенс Мартін. Відомий як «народний губернатор», Мартін прагнув подолати депресію через створення робочих місць, а не просто виплати. «Дай людині рибу, і вона буде ситою один день; навчи людину рибалити, і вона буде ситою все життя»."
 new_england_events.416.a: "Мартін перемагає на виборах!"
 new_england_events.416.b: "Воррен здобуває велику перемогу!"
 new_england_events.416.c: "Тейлор очолить націю!"

 new_england_events.417.t: "Президентські вибори 1948 року"
 new_england_events.417.d.ACC_wallace: "З наближенням листопада країна була заповнена політичними кампаніями на кожному розі, на кожній трибуні та в газетах. Попередні підрахунки пророкують запеклу боротьбу між кандидатами.\n\nОскільки Генрі Воллес завершує свій другий термін, він вирішив піти у відставку згідно з традиціями Джорджа Вашингтона. Від Прогресивної партії балотується Глен Тейлор, артист і політик з Айдахо. Один відомий інцидент, що приніс Тейлору національну славу — його арешт у Бірмінгемі, штат Алабама, на початку цього року. Комісар поліції Юджин «Булл» Коннор заарештував Тейлора за спробу скористатися дверима, зарезервованими лише для афроамериканців. Під величезним тиском громадськості Коннор був змушений звільнити Тейлора.\n\nРеспубліканська партія висунула кандидата від Вашингтона. Колишній мер Сіетла, а нині губернатор штату Вашингтон Артур Б. Ленґлі має репутацію борця за чисту владу. Під час громадянської війни Ленґлі намагався домогтися прийняття закону про безпрецедентні надзвичайні повноваження, що досі залишається предметом дискусій.\n\nПроти Ленґлі від демократів виступає Кларенс Мартін. Відомий як «народний губернатор», Мартін запекло боровся за скорочення державних витрат, одночасно допомагаючи виборцям пережити депресію. Його стратегія — забезпечувати людей роботою, а не подачками. «Дай людині рибу, і вона буде ситою один день; навчи людину рибалити, і вона буде ситою все життя»."
 new_england_events.417.d.ACC_la_follette: "З наближенням листопада країна поринула у вир передвиборчих перегонів. Попередні дані обіцяють мінімальний розрив між лідерами.\n\nСподіваючись на другий термін, прогресивний політик Філіп Ла Фолетт активно подорожує країною для підтримки своєї кампанії. Протягом свого терміну Ла Фолетт розширив систему соціального забезпечення на таку кількість американців, про яку раніше не можна було й мріяти. Крім того, він та його союзники близькі до підписання закону про національне медичне страхування, якщо зможуть зберегти більшість у парламенті.\n\nРеспубліканці виставили проти Фермерсько-лейбористської партії та демократів Артура Б. Ленґлі з Вашингтона. Губернатор Ленґлі відомий своєю прихильністю до прозорого врядування. Під час війни він намагався отримати надзвичайні повноваження, що викликало хвилю критики, яка не вщухає й досі.\n\nДемократичну партію представляє Кларенс Мартін. «Народний губернатор» прославився вмінням поєднувати фіскальну ощадливість із гуманітарною допомогою. Він вірить у створення робочих місць як головний інструмент подолання депресії."
 new_england_events.417.d.ACC_langlie: "З наближенням листопада країна поринула у політичну боротьбу. Прогнози вказують на запекле суперництво.\n\nСподіваючись на другий термін, Артур Б. Ленґлі від Республіканської партії активно їздить країною з агітацією. Протягом свого терміну Ленґлі постійно конфліктував із Конгресом, розділеним між республіканцями та демократами. Хоча прогресивні демократи не змогли подолати консервативну більшість, Ленґлі також не спромігся прийняти багато значущих законів.\n\nЙого опонентом від демократів є Кларенс Мартін. «Народний губернатор» Мартін боровся за скорочення витрат, намагаючись вберегти людей від наслідків депресії. Він вважає, що найкраща допомога — це працевлаштування, а не державні виплати.\n\nРоль «спойлера» відіграє кандидат від Прогресивної партії Глен Тейлор. Тейлор здобув підтримку десегрегаціоністів після свого гучного арешту в Бірмінгемі за використання дверей для афроамериканців."
 new_england_events.417.d.NEE_langlie: "З наближенням листопада країна поринула у вир політичної агітації. Прогнози обіцяють напружений фінал.\n\nАртур Б. Ленґлі від республіканців прагне переобратися на другий термін. Протягом перших чотирьох років він перебував у постійному протистоянні з розділеним Конгресом, що завадило втіленню багатьох його ініціатив.\n\nЙого суперником від демократів є Кларенс Мартін. Відомий своєю ощадливістю та увагою до потреб простих людей, Мартін обіцяє подолати залишки депресії через масштабні програми працевлаштування. Він впевнений, що нація повинна навчитися «рибалити» самостійно, щоб забезпечити собі стабільне майбутнє."
 new_england_events.417.a: "Мартін перемагає на виборах!"
 new_england_events.417.b: "Ленґлі набирає найбільше голосів!"
 new_england_events.417.c: "Тейлор очолить націю!"
 new_england_events.417.d: "Ла Фолетт забезпечує собі ще чотири роки!"

 new_england_events.419.t: "Президентські вибори 1952 року"
 new_england_events.419.d.ACC: "Америка вступає у нове десятиліття, і передвиборчі гасла знову стали невід'ємною частиною життя, поки кандидати від демократів та республіканців прагнуть увійти в історію.\n\nВід Демократичної партії балотується Кларенс Мартін, прагнучи переобратися на другий термін. Під час свого губернаторства у Вашингтоні він успішно провів штат крізь найгірші часи депресії, залишаючись фіскально мудрим та дбайливим до людей. Цієї ж лінії президент Мартін дотримувався і в Білому домі. Не піддаючись на соціалістичні обіцянки, він не дозволив радикалам перешкоджати своїй політиці.\n\nРеспубліканці натомість обрали агресивну тактику. Їхній кандидат, ветеран і сенатор Гаррі Кейн, неодноразово атакував Мартіна за «слабкість щодо радикалів» та надання зайвої свободи соціалістам, лонґістам та макартуритам. Його палка риторика іноді викликала суперечки, але Кейн заявив, що слухає лише власну совість та інстинкти. Чи надихне такий підхід виборців — покажуть результати...\n\nТим часом Глен Тейлор від Прогресивної партії продовжує нарощувати підтримку серед прихильників десегрегації. Після інциденту в Бірмінгемі у 1948 році він став надзвичайно популярним серед афроамериканців і очікує на рекордну явку цієї групи виборців."
 new_england_events.419.d.NEE: "В РОБОТІ"
 new_england_events.419.a: "Мартін виграє ще чотири роки!"
 new_england_events.419.b: "Перемога Кейна та республіканців!"
 new_england_events.419.c: "Тейлор очолить націю!"

 new_england_events.420.t: "Президентські вибори 1952 року"
 new_england_events.420.d.ACC: "Америка заглядає у нове десятиліття. Восьмирічний термін президента Дауні добігає кінця, і країна знову занурюється у вир агітації. Цю кампанію називають «Битвою солдатів Вашингтона», оскільки обидва кандидати — ветерани з однойменного штату, проте з діаметрально протилежними поглядами.\n\nДемократичним номінантом став Воррен Маґнусон, сенатор і ветеран війни, який свого часу втік від перевороту Макартура на кораблі та очолив боротьбу за скасування Акта про виключення китайців. Його кампанія базується на перетворенні досягнень Дауні на більш прогресивну політику соціальних реформ без шкоди для економіки.\n\nРеспубліканець Гаррі Кейн веде більш войовничу кампанію, звинувачуючи опонента та чинного президента у м'якості до радикалів. Кейн відомий своїми гострими консервативними заявами та цькуванням лівих сил. Чи згуртує це незадоволених виборців навколо нього, чи лише об'єднає опозицію проти нього — Америці належить дізнатися зовсім скоро...\n\nКандидат від Прогресивної партії Глен Тейлор продовжує залучати голоси прихильників рівноправ'я. Його популярність серед афроамериканських кіл після арешту в Бірмінгемі дає йому надію на значну підтримку, що може змінити хід виборів."
 new_england_events.420.d.NEE: "Америка готується до нового десятиліття. Термін президента Дауні закінчується, і нація знову обирає свій шлях. Обидва головні претенденти — ветерани зі штату Вашингтон, що додає перегонам особливого забарвлення.\n\nВоррен Маґнусон від демократів обіцяє продовжити курс на прогресивні реформи, спираючись на свій досвід у Сенаті та боротьбу за громадянські права. Він сподівається втримати виборців Дауні, обіцяючи стабільність та соціальний розвиток.\n\nЙого суперник-республіканець Гаррі Кейн обрав шлях конфронтації. Він відкрито називає політику демократів небезпечною, стверджуючи, що вони дозволяють ворогам Америки підривати країну зсередини. Кейн не боїться суперечок і робить ставку на радикально-консервативний електорат."
 new_england_events.420.a: "Маґнусон забезпечує перемогу!"
 new_england_events.420.b: "Перемога за Кейном та республіканцями!"
 new_england_events.420.c: "Тейлор очолить націю!"

 new_england_events.421.t: "Президентські вибори 1952 року"
 new_england_events.421.d.ACC_la_follette: "Америка на порозі нового десятиліття. Партії істеблішменту прагнуть повернути собі Білий дім після правління несистемних політиків.\n\nФіліп Ла Фолетт, завершуючи свій другий термін, підтримав кандидата від Прогресивної партії Глена Тейлора. Тейлор, відомий своєю боротьбою проти сегрегації та арештом у Бірмінгемі, розраховує на велику підтримку афроамериканського населення.\n\nДемократи виставили Воррена Маґнусона. Його програма значною мірою базується на ідеях його напарника, Генрі «Скупа» Джексона, який відданий питанням екології та прав людини. Демократи сподіваються повернути свій класичний електорат.\n\nРеспубліканців представляє Вільям Ноуленд, ветеран війни та один із найгучніших антисиндикалістських голосів у Сенаті. На тлі нової хвилі «червоної паніки» Ноуленд обіцяє залізною рукою придушити будь-які осередки лівого дисидентства."
 new_england_events.421.d.ACC_taylor: "Глен Тейлор балотується на другий термін. Під час свого президентства йому вдалося просунути важливі закони про громадянські права. Зокрема, практика «расових ковенантів» при забудові територій була визнана неконституційною. Тейлор обіцяє, що це лише початок виправлення історичної несправедливості в Америці.\n\nЙого опоненти — демократ Воррен Маґнусон, який обіцяє прогресивний розвиток разом із Генрі Джексоном, та республіканець Вільям Ноуленд. Ноуленд робить ставку на жорстку боротьбу з радикалізмом та безпеку нації, що особливо актуально в часи нової ідеологічної напруженості."
 new_england_events.421.d.ACC_warren: "Америка обирає лідера для нового десятиліття. Демократ Воррен Маґнусон обіцяє прогресивний порядок денний, спираючись на підтримку Генрі «Скупа» Джексона. Республіканець Вільям Ноуленд виступає за безкомпромісну боротьбу з «червоною загрозою».\n\nГлен Тейлор від Прогресивної партії знову виступає у ролі «спойлера», спираючись на свою величезну популярність серед афроамериканців після подій у Бірмінгемі. Показники расового складу Бірмінгема (понад 40% чорношкірого населення на 1948 рік) роблять його заклик до рівності критично важливим фактором цих виборів."
 new_england_events.421.d.NEE_warren: "Нове десятиліття приносить нові виклики. Воррен Маґнусон від Демократичної партії пропонує шлях прогресивних реформ та захисту прав людини. Його підтримують ті, хто прагне соціального розвитку.\n\nВільям Ноуленд від республіканців веде кампанію під гаслом захисту від внутрішніх ворогів. Син впливового видавця, він використовує всі свої зв'язки, щоб переконати виборців у необхідності жорстких заходів проти дисидентів-синдикалістів. Країна завмерла в очікуванні результатів."
 new_england_events.421.d.ACC_langlie: "Кандидати від демократів та республіканців готуються повернути президентство. Воррен Маґнусон обіцяє прогресивні зміни, тоді як Вільям Ноуленд фокусується на антисиндикалістській боротьбі.\n\nГлен Тейлор від прогресистів залишається потужною силою, здатною відібрати голоси у фаворитів. Його боротьба з «Буллом» Коннором у Бірмінгемі стала символом опору сегрегації, що забезпечило йому відданість значної частини виборців, які прагнуть справжньої рівності."
 new_england_events.421.d.NEE_langlie: "Демократ Воррен Маґнусон та республіканець Вільям Ноуленд змагаються за найвищу посаду в країні. Маґнусон разом із Генрі Джексоном пропонує шлях ліберального прогресу. Ноуленд, спираючись на свій воєнний досвід та статус одного з головних критиків соціалізму в Сенаті, обіцяє нації стабільність та захист від радикальних ідей."
 new_england_events.421.a: "Маґнусон здобуває перемогу!"
 new_england_events.421.b: "Ноуленд перемагає на виборах!"
 new_england_events.421.c: "Тейлор очолить націю!"

## Character Events ##

# PP Gift Event
 new_england_events.451.t: "[NEE_Ambassador_name_cap] виступає перед урядом [CAN.GetAdjective]"
 new_england_events.451.d: "Сьогодні в канадській столиці Оттаві [NEE_Ambassador_name] та делегація військових і урядовців прибули від імені уряду [NEE.GetNameDef]. Натовп зібрався в очікуванні довгоочікуваної промови американської дипломатичної місії перед прикрашеним у стилі бозар посольством на Веллінгтон-стріт, 100. Хоча раніше ця будівля слугувала американською легацією, події на континенті дозволили їй трансформуватися у повноцінне посольство.\n\n[NEE_Ambassador_name_cap] почав свою промову з подяки канадському народу за захист та відданість демократії в Новому Світі. Він чітко дав зрозуміти: якщо Сполучені Штати будуть возз'єднані та відновлені до довоєнної міці, вони докладуть усіх зусиль, щоб повернути борг Америки канадцям. Промова була схвально зустрінута всіма присутніми, а згодом повідомили, що сам британський король особисто відвідав амбасадора. Канадські та новоанглійські газети тепло відгукнулися про цю місію доброї волі, відзначаючи зближення обох націй у спільній мрії про вільний світ без синдикалізму."
 new_england_events.451.a: "Дякуємо, Канадо!"

 new_england_events.452.t: "[NEE_Ambassador_name_cap] звертається до народу [CAN.GetAdjective]"
 new_england_events.452.d: "Сьогодні відбулася безпрецедентна подія: [NEE_Ambassador_name] був запрошений виступити в канадському парламенті. Поки президент [NEE.GetNameDef] залишився вдома для вирішення внутрішніх справ, на засіданні були присутні британський король, його вигнанці та канадський прем'єр-міністр.\n\nВиступаючи від імені уряду [NEE.GetName], [NEE_Ambassador_name] тепло відгукнувся про постійну підтримку та визнання канадським урядом американської демократії на Північному Сході. Він зазначив, що зміна світового ладу дає старим світовим державам шанс нарешті повернутися додому. Хоча Америці знадобиться час, щоб загоїти рани громадянської війни, міць відновлених Сполучених Штатів радо підтримає цілі та амбіції Антанти. У відповідь прем'єр-міністр Канади запевнив амбасадора, що вільний світ Антанти стоятиме за урядом Нової Англії в найтемнішу годину Америки. Він підтвердив подальше визнання [NEE.GetNameDef] як легітимної демократичної влади."
 new_england_events.452.a: "Наші народи єдині!"

 new_england_events.453.t: "[NEE_Ambassador_name_cap] виступає перед військовими [CAN.GetAdjective]"
 new_england_events.453.d: "На знак доброї волі та дружби [NEE_Ambassador_name] відвідав Королівську канадську армію на базі Піктон в Онтаріо. Його бачили у супроводі канадських командувачів, таких як генерал Ґай Сіммондс, а також у глибокій розмові з генералами вигнанців, зокрема з Бернардом Монтґомері.\n\nПроте кульмінацією візиту стало його звернення до солдатів. [NEE_Ambassador_name_cap] особисто подякував воїнам Канади, вихваляючи їхню мужню відданість справі відновлення демократії в Європі та бажаючи успіху в майбутньому поверненні додому. Він наголосив, що роль канадських військових в інтервенції 1937 року була вирішальною для захисту жителів Нової Англії від хаосу, який знищив американську державу. На завершення він запевнив, що якщо настане день, коли Канаді знадобиться допомога, американські солдати будуть готові ризикувати життям заради свободи канадського та британського народів. Візит був тепло сприйнятий як вищим керівництвом, так і рядовими бійцями."
 new_england_events.453.a: "Разом до перемоги!"

 new_england_events.454.t: "[NEE_Ambassador_name_cap] відвідує Ford Motor Company of Canada"
 new_england_events.454.d: "Заснована в 1904 році в Вокервіллі, Онтаріо, компанія Ford Motor Company of Canada є відомою дочірньою структурою американської корпорації. Для зміцнення ділових зв'язків [NEE_Ambassador_name] відвідав завод у Вокервіллі. У супроводі власника Ford Canada американський посол пройшов крізь гамірні складальні лінії та поспілкувався з робітниками. У короткій промові він похвалив їхню ефективність і зазначив, що після Сполучених Штатів працелюбність канадського робітника не має рівних. Не дивно, що Канада змогла оговтатися від років депресії та перетворитися на промислового гіганта. Робітники зустріли амбасадора бурхливими аплодисментами, а на знак подяки керівництво Ford Canada пообіцяло відправити 80 вантажівок канадського військового зразка (CMP) як жест доброї волі."
 new_england_events.454.a: "За неперевершену індустрію!"

 new_england_events.455.t: "[NEE_Ambassador_name_cap] відвідує Victory Aircraft of Canada"
 new_england_events.455.d: "Внаслідок британської революції та розпаду імперії авіаційна компанія Avro перебралася до Канади. Уряд створив державну корпорацію Victory Aircraft Limited, яка отримала ліцензію на виробництво бомбардувальників Avro. Щоб посилити повітряні сили [NEE.GetNameDef], [NEE_Ambassador_name] сьогодні відвідав завод для підписання контракту на дванадцять бомбардувальників.\n\nПрезидент компанії Дж. П. Бікелл провів для посла екскурсію цехами, давши йому можливість познайомитися з працьовитими канадськими складальниками. Амбасадор навіть піднявся на борт літаків, де на власні очі переконався в міцності канадської інженерної думки. Візит завершився в кабінеті Бікелла, де чоловіки викурили по сигарі перед офіційною передачею літаків для військово-повітряних сил Нової Англії."
 new_england_events.455.a: "Дальня авіація принесе перемогу!"

 new_england_events.456.t: "[NEE_Ambassador_name_cap] відвідує National Steel Car of Canada"
 new_england_events.456.d: "Для посилення повітряних сил [NEE.GetNameDef] [NEE_Ambassador_name] сьогодні відвідав завод National Steel Car з метою підписання контракту на двадцять чотири сучасні винищувачі. Президент компанії провів посла величезними складальними лініями, де той зміг поспілкуватися з канадськими робітниками. Амбасадор навіть мав можливість оглянути винищувач Venom, переконавшись у надійності канадської техніки. Тур завершився спільною бесідою в офісі керівництва, після чого було підписано папери на передачу літаків повітряним силам Нової Англії. Ця співпраця є свідченням глибокої інтеграції оборонних галузей наших країн."
 new_england_events.456.a: "З чистим небом нас ніщо не зупинить!"

 new_england_events.457.t: "[NEE_Ambassador_name_cap] координує будівництво нового заводу"
 new_england_events.457.d: "Сьогодні [NEE_Ambassador_name] відвідав К. Д. Гау, видатного канадського бізнесмена, інженера та політика, у його домі. Гау завжди з симпатією ставився до [NEE.GetNameDef], адже сам народився в Массачусетсі та навчався в MIT. Чоловіки обговорили шляхи зміцнення ділових зв'язків між націями. Гау запропонував ділянку землі поблизу Порт-Артура, Онтаріо, як місце для будівництва спільного канадсько-американського заводу. На підприємстві працюватимуть робітники з обох країн, що покращить ситуацію із зайнятістю та принесе прибуток обом державам. Повідомляється, що вони довго розмовляли про ситуацію в Америці та роль Канади в інтервенції, піднявши тост за нову еру північноамериканської дружби."
 new_england_events.457.a: "За плідне партнерство!"

 new_england_events.458.t: "[NEE_Ambassador_name_cap] запрошує промислових експертів з [CAN.GetNameDef]"
 new_england_events.458.d: "Завдяки рішучим діям уряду проти Великої депресії наша економіка нарешті демонструє ознаки одужання. Довгі черги за безкоштовним супом відходять у минуле, а рівень безробіття впав до історичного мінімуму. Щоб закріпити успіх, уряд запропонував запросити промислових експертів від нашого канадського союзника, таких як Артур Пурвіс та Макс Ейткен (лорд Бівербрук). Канадська економіка, тісно пов'язана з американською, пережила важкі часи після «чорного понеділка», але зараз впевнено відновлюється завдяки державним проєктам та зусиллям IEDC. Запросивши канадських спеціалістів, ми зможемо запозичити їхній досвід та прискорити власний економічний зліт."
 new_england_events.458.a: "Наша промислова міць не матиме рівних!"

 NEE_industrialist_aid_idea: "Промислова допомога"
 NEE_industrialist_aid_idea_desc: "Допомога союзників не буде марною! Наші друзі по Антанті надали нам цінну промислову підтримку, щоб допомогти економіці Нової Англії зростати та остаточно подолати роки застою."

 new_england_events.459.t: "[NEE_Ambassador_name_cap] організовує промову на підтримку [NEE.GetAdjective]"
 new_england_events.459.d: "Змінюючи тактику для залучення міжнародної аудиторії, [NEE_Ambassador_name] організував виступ на конференції членів Антанти в Монреалі. Ця промова має на меті не лише підбадьорити американських цивільних і солдатів, затиснутих у лещатах жорстокої війни, а й донести голос Нової Англії до представників Райхспакту, які також були присутні в залі. У трансляції амбасадор заявив, що «американський народ у своїй праведній силі здобуде абсолютну перемогу». Він наголосив на впевненості у силах Нової Англії та Антанти у справі визволення не лише Америки, а й Старого Світу від «червоної загрози». Час розколу минув — Нова Англія готова повернути собі Сполучені Штати!"
 new_england_events.459.a: "Ми відновимо Америку!"

 new_england_events.460.t: "[NEE_Ambassador_name_cap] заручається підтримкою кінної поліції"
 new_england_events.460.d: "Королівська канадська кінна поліція (RCMP) є символом закону та порядку в Канаді. Ця організація відповідає за федеральне правопорядку та контррозвідку, маючи величезний досвід у боротьбі з небезпечними угрупованнями. Останніми роками RCMP активно протидіяла синдикалістським шпигунам, які намагалися перетнути кордон. Завдяки їхньому неперевершеному досвіду у придушенні заворушень та страйків, уряд [ROOT.NEE.GetNameDef] звернувся до Канади з проханням про допомогу в забезпеченні порядку на звільнених територіях під час національного визволення. У промові перед офіцерами [NEE_Ambassador_name] високо оцінив їхню дисципліну в охороні кордону в часи американської кризи. Комісар RCMP запевнив посла, що Нова Англія отримає всіх необхідних людей та спорядження."
 new_england_events.460.a: "Ваша допомога надзвичайно цінна"

# Replacing Winant as Ambassador
 new_england_events.461.t: "Зміна варти"
 new_england_events.461.d.rep: "Попередній посол Джон Вайнант оголосив про намір піти у відставку з посади посла в Канаді. Йому на зміну приходить перспективний кандидат Джей Моффат. Шанований дипломат із престижної династії посланців, Моффат здається гідним наступником Джона Вайнанта.\n\nМи можемо зробити Моффата довіреною особою президента, або ж, якщо ця посада втратила свою колишню значущість, перерозподілити ресурси на інші потреби."
 new_england_events.461.d.dem: "Попередній посол Джон Вайнант оголосив про намір піти у відставку з посади посла в Канаді. Його місце має посісти перспективний кандидат Вільям Гарріман. Завдяки своїм якостям Гарріман виглядає цілком гідним наступником Вайнанта.\n\nМи можемо зробити Гаррімана прямим радником президента, або ж, якщо посада більше не є критично важливою, спрямувати ресурси в інше русло."
 new_england_events.461.a: "Моффат — наша людина!"
 new_england_events.461.b: "Гарріман — наша людина!"
 new_england_events.461.c: "Понизити статус посади"

 new_england_events.462.t: "Зміна варти"
 new_england_events.462.d: "Гарріман вирушає на президентські вибори, тому подає у відставку з посади посла. На своє місце він пропонує давнього союзника та близького друга Чарльза Болена — позапартійного кандидата, який має влаштувати обидві сторони. Як альтернативу, статус посади можна понизити, щоб зосередити зусилля на інших напрямках."
 new_england_events.462.a: "Затвердити призначення"
 new_england_events.462.b: "Понизити статус посади"

 new_england_events.503.t: "Таємний агент розкриває місцезнаходження конспіративної квартири"
 new_england_events.503.d: "Прикрі новини від нашої групи, що діє у штаті [UR_state.GetName]. Один із «біженців», якому ми надали допомогу, виявився співробітником Департаменту спеціальних служб [UR_state.Controller.GetNameDef]. Він кілька днів вдавав свого, збираючи інформацію, після чого зник уночі. Поки наші люди намагалися знайти зниклого, група потрапила в засідку під час скоординованого рейду, очолюваного зрадником. Уникнути полону вдалося лише парі розвідників, які й передали це повідомлення. Вони дали сигнал, що спробують дістатися Нової Англії самостійно, без допомоги «Підпільної залізниці»."
 new_england_events.503.a: "Ми їх не покинемо!"

 new_england_events.504.t: "Групу контрабандистів затримано"
 new_england_events.504.d: "Ми втратили зв'язок із групою, що проходила через [UR_state.GetName]. У їхньому останньому звіті згадувалося про можливий патруль неподалік. Оскільки переміщення військ територією [UR_state.GetName] — звична справа, наші люди не надали загрозі належного значення. Це було помилкою: помічений підрозділ мав завдання виявляти повстанські групи, що допомагають «ворогу». Невелика розвідувальна група вистежила наших людей і доправила їх до спецоб'єкта, де на них чекає суд за шпигунство."
 new_england_events.504.a: "Ми не можемо врятувати всіх..."

 new_england_events.505.t: "Помічено паралельну групу"
 new_england_events.505.d: "Наші люди в штаті [UR_state.GetName] встановили контакт із групою втікачів, які намагаються дістатися безпечної Канади. Вони подорожують самі, не маючи ні зв'язків, ні припасів. Ми могли б взяти їх із собою до Нової Англії, проте велика кількість людей у групі може привернути зайву увагу ворожих патрулів. З іншого боку, навряд чи вони дійдуть до кордону самотужки..."
 new_england_events.505.a: "Запропонувати їм допомогу."
 new_england_events.505.b: "Успіхів на шляху до Канади!"

 new_england_events.506.t: "Тайник зі зброєю розграбовано"
 new_england_events.506.d: "По дорозі до Нової Англії наша група в штаті [UR_state.GetName] випадково збилася з маршруту. Ця прикрість обернулася удачею: люди натрапили на покинутий склад постачання [UR_state.Controller.GetNameDef]. Не виявивши свіжих слідів шин чи присутності ворога, наші бійці швидко захопили зброю та продовжили рух до кордону."
 new_england_events.506.a: "Ми знайдемо цьому гідне застосування!"

 new_england_events.601.t: "Президентські вибори [GetYear] року"
 new_england_events.601.d: "В країну повертається відчуття нормальності: цього року вибори проходять у встановлений термін, без хаосу, що супроводжував народження нашої нації під канадським протекторатом. Обидві партії невтомно ведуть агітацію, намагаючись схилити народ [NEE.GetNameDef] на бік своїх кандидатів.\n\nУ республіканському таборі преса постійно згадує, як президент Барроуз та його кабінет вивели Америку з кризи. Протягом десятиліття країна потерпала від депресії, але Барроуз привів нас до процвітання! Він обіцяє, що другий термін присвятить балансуванню бюджету та розвитку інфраструктури в сільських регіонах.\n\nДемократи натомість закликають до посилення ролі держави. Чарльз Герлі та його напарник Пітер Геррі подорожують країною, спілкуючись із тими, кому допомогли проєкти «Квадратного курсу», як-от Цивільний корпус збереження природи. Вони обіцяють продовжити фінансування програм допомоги та WPA.\n\nПісля бурхливої активності на дільницях надійшли перші результати..."
 new_england_events.601.a: "Герлі та демократи виграють голосування!"
 new_england_events.601.b: "Барроуз б'є рекорди популярності!"

 new_england_events.602.t: "Президентські вибори [GetYear] року"
 new_england_events.602.d: "До країни повертається звичний ритм життя: вибори проходять вчасно, без потрясінь перших днів існування держави. Партії активно змагаються за голоси виборців [NEE.GetNameDef].\n\nВід демократів балотуються президент Девід Волш та віце-президент Теодор Ґрін. Вони зосередили кампанію на успіхах «Другого квадратного курсу». Натовпи робітників та фермерів вітають тих, хто надав їм реальну допомогу. На відміну від старого істеблішменту, Волш та Ґрін не чекали, поки ринок «вилікує себе сам», а втрутилися в ситуацію напряму.\n\nРеспубліканці згуртувалися навколо колишнього губернатора Нью-Гемпшира Джона Вайнанта. Попри партійну приналежність, він брав активну участь у реалізації соціальних програм уряду Волша. Як колишній вчитель, Вайнант обіцяє збільшити витрати на освіту заради майбутнього американської молоді.\n\nВиборчі дільниці зачинилися, і ось результати..."
 new_england_events.602.a: "Дати Волшу ще чотири роки!"
 new_england_events.602.b: "Вайнант та республіканці здобувають перемогу!"

 new_england_events.603.t: "Президентські вибори [GetYear] року"
 new_england_events.603.d.martin_jr: "Вибори цього року проходять у спокійній атмосфері. Після стабілізації ситуації компромісним кабінетом партії вирішили повернутися до класичної двопартійної системи. Обидва табори активно борються за прихильність [NEE.GetNameDef].\n\nРеспубліканська партія робить ставку на банкірів та бізнесменів. Кандидат Джон Вайнант обіцяє закони для захисту власників підприємств від стихійних страйків. Його напарник, сенатор Фредерік Гейл, закликає до зміцнення зв'язків із Канадою, без якої ми б не уникнули жахів громадянської війни.\n\nДемократи просувають Чарльза Герлі. Його досвід допомоги постраждалим від Великого урагану 1938 року став візитівкою кампанії. Герлі обіцяє обмежити використання поліції проти страйкарів та підвищити мінімальну зарплату для жінок і дітей, сподіваючись зробити демократів справжньою народною партією.\n\nПідрахунок голосів завершено..."
 new_england_events.603.d.fallback: "Результати виборів обробляються."
 new_england_events.603.a: "Герлі та демократи святкують перемогу!"
 new_england_events.603.b: "Вайнант та республіканці беруть гору!"

 new_england_events.605.t: "Президентські вибори [GetYear] року"
 new_england_events.605.d: "По всій [NEE.GetNameDef] знову майорять агітаційні плакати. Партії доклали максимум зусиль, щоб саме їхній кандидат посів президентське крісло.\n\nДемократична партія висунула чинного президента Чарльза Герлі. Завдяки успішному альянсу з прогресистами та профспілками, Герлі вирішив залишити їх у своєму кабінеті. Він запевнив Френсіс Перкінс, що її орієнтована на робітників економічна політика продовжуватиме приносити користь народу.\n\nОпонентом Герлі став республіканець Реймонд Болдвін із Коннектикуту. Разом із ним балотується Ірвінг Айвз, який зміг залучити частину традиційного електорату демократів. Айвз обіцяє прийняти закон Айвза-Квінна, що заборонить дискримінацію при працевлаштуванні за расовою, релігійною чи національною ознакою на рівні штату.\n\nЧас дізнатися ім'я переможця..."
 new_england_events.605.a: "Герлі продовжує впевнено вести нас вперед!"
 new_england_events.605.b: "Перемога списку Болдвіна-Айвза!"

 new_england_events.606.t: "Президентські вибори [GetYear] року"
 new_england_events.606.d.barrows: "Вкотре по всій [NEE.GetNameDef] можна побачити безліч політичних плакатів, що закликають виборців підтримати свого кандидата. Обидві партії доклали величезних зусиль, щоб саме їхній представник посів президентське крісло цього року.\n\nПрезидент Барроуз, термін якого добігає кінця, оголосив про намір піти у відставку згідно з традиціями своїх попередників. Його правління запам'ятається великими зусиллями з виведення Америки зі стану заціпеніння під час Великої депресії. Республіканським кандидатом замість нього став Реймонд Болдвін, губернатор Коннектикуту. Як і Барроуз, Болдвін є прихильником збалансованого бюджету та палким противником корупції.\n\nЙого суперником на виборах став мер із Массачусетсу Моріс Тобін. Профспілки підтримали Тобіна за його боротьбу за законодавство, що запобігає расовій дискримінації при наймі на роботу. Тобін закликав до додаткових виплат з безробіття та планує дистанціюватися від свого політичного наставника Джеймса Керлі після нещодавнього скандалу, що зруйнував президентські амбіції Кеннеді-старшого.\n\nВиборчі дільниці зачинилися, і ось надійшли результати..."
 new_england_events.606.d.walsh: "По всій [NEE.GetNameDef] знову розгорнулася масштабна агітація. Обидві партії борються за кожен голос, щоб отримати президентство цього року.\n\nЦей виборчий сезон був нещадним до Демократичної партії. Спочатку репутацію Волша заплямував скандал із борделем та розголос щодо його ймовірної гомосексуальності. Після цього Волш поступився амбіціями на користь Джозефа Кеннеді-старшого, але й цей план провалився через арешт Джеймса Керлі за хабарництво. Демократи поспіхом висунули Моріса Тобіна, але через витрати на «відмивання» іміджу багато хто пророкує перемогу республіканцям.\n\nНа відміну від хаосу в лавах демократів, Республіканська партія видається оазою спокою. Хоча демократи зробили диво, вивівши країну з депресії, Реймонд Болдвін та Ірвінг Айвз виглядають дедалі привабливіше. Робота Айвза у трудовому комітеті залучила на його бік багатьох розчарованих демократів, тоді як консервативна політика Болдвіна зміцнює підтримку традиційного республіканського електорату.\n\nЧас дізнатися ім'я переможця..."
 new_england_events.606.d.winant: "Агітаційні плакати знову заполонили вулиці [NEE.GetNameDef]. Кожна партія прагне забезпечити собі перемогу в цих президентських перегонах.\n\nХоча Вайнант енергійно взявся за кермо влади, термін на посаді неабияк виснажив його. Колись активний друг канадського короля та Вінстона Черчилля, тепер Вайнант обрав спокійніший стан. Він вирішив не балотуватися на другий термін, висунувши замість себе Реймонда Болдвіна. Болдвін веде кампанію за кращий захист ветеранів та створення комітетів для переведення заводів на цивільне виробництво замість військового.\n\nПроти нього від демократів виступає список Моріса Тобіна та Джеймса Фарлі. Фарлі, якого називають героєм «Квадратного курсу», збирає натовпи прихильників. Його досвід у формуванні соціальних програм для бідних під час депресії став ключовим елементом кампанії. Тобін та Фарлі обіцяють продовжити успішні проєкти допомоги кінця 30-х років.\n\nПідрахунок голосів завершено..."
 new_england_events.606.d.fallback: "Результати виборів обробляються."
 new_england_events.606.a: "Тобін та Фарлі оголошені переможцями!"
 new_england_events.606.b: "Список Болдвіна-Айвза здобуває велику перемогу!"

 new_england_events.608.t: "Президентські вибори [GetYear] року"
 new_england_events.608.d: "Два політичні гіганти [NEE.GetNameDef] знову ожили для виборів президента! Обидві партії задіяли пресу та радіо, щоб закликати народ проголосувати у листопаді.\n\nЧинний президент Моріс Тобін активно їздить країною, збираючи підтримку. Основою його аудиторії є робітники профспілок, вдячні за закони про справедливу працю та рівні можливості працевлаштування.\n\nЇм протистоять Джордж Ейкен та Роберт Бредфорд від республіканців. Ейкен обіцяє піти стопами Теодора Рузвельта та розбити великі монополії, що душать бізнес. Його напарник Роберт Бредфорд виступає за допомогу ветеранам через дешеве житло та боротьбу з алкоголізмом. Багато хто пам'ятає його минулорічну програму «мовчазний гість», яка закликала американців допомогти тим, хто втратив усе у Другому Вельткріґу.\n\nВиборчі дільниці зачинилися..."
 new_england_events.608.a: "Ще чотири роки для Тобіна та Фарлі!"
 new_england_events.608.b: "Список Ейкена та Бредфорда виривається вперед!"

 new_england_events.609.t: "Президентські вибори [GetYear] року"
 new_england_events.609.d: "Політичне життя [NEE.GetNameDef] вирує в очікуванні президентських виборів! Кандидати змагаються за кожну шпальту в газетах та кожну хвилину ефірного часу.\n\nВід республіканців Реймонд Болдвін прагне переобратися на другий термін. Він не надто популярний серед отримувачів допомоги, бо прагне скоротити державне втручання, що залишилося від епохи «Квадратного курсу». Болдвін стверджує: Америка має стояти на власних ногах! Його гасло «Поставимо Америку на ноги!» знайшло відгук у тих, хто цінує збалансований бюджет.\n\nПроти нього балотуються колишній посол Вільям Гарріман та конгресмен Джон В. Маккормак. На відміну від Болдвіна, Гарріман прагне підтримати тих, хто опинився у скруті. Він вважає скорочення соціальних програм «капіталістичним злочином» проти людей, які найбільше потребують допомоги.\n\nОсь результати голосування..."
 new_england_events.609.a: "Гарріман та Маккормак вщент розбивають конкурентів!"
 new_england_events.609.b: "Другий термін для Болдвіна та Айвза!"

 new_england_events.610.t: "Президентські вибори [GetYear] року"
 new_england_events.610.d.hurley: "Виборчий сезон у самому розпалі! По всій країні [NEE.GetNameDef] партії закликають громадян зробити свій вибір цього листопада.\n\nТермін президента Герлі добігає кінця, і він вирішив піти у відставку згідно з традицією. Своїм наступником Герлі обрав колишнього посла Вільяма Гаррімана. Як прихильник робітничого руху, Герлі також підтримав Джона В. Маккормака — одного з авторів «Квадратного курсу». Вони обіцяють державну медицину та збільшення стипендій на освіту.\n\nРеспубліканський табір виставив сенатора з Вермонту Джорджа Ейкена. Хоча він республіканець, Ейкен свого часу підтримав «Квадратний курс» у своєму штаті та закликав партію повернутися до ідеалів Лінкольна. Його пріоритет — завершення електрифікації сіл на Північному Сході. Кожен заслуговує на доступ до сучасності.\n\nНастав час підбивати підсумки..."
 new_england_events.610.d.fallback: "Результати виборів обробляються."
 new_england_events.610.a: "Гарріман та Маккормак здобувають перемогу!"
 new_england_events.610.b: "Список Ейкена та Бредфорда бере гору!"

 new_england_events.612.t: "Президентські вибори [GetYear] року"
 new_england_events.612.d: "З початком нового десятиліття обидві партії прагнуть залишити слід в історії. Руйнування Другого Вельткріґу в минулому, настав час розбудови. Гасла кампаній чути на кожному кроці!\n\nКампанія Джорджа Ейкена та Роберта Бредфорда стає дедалі популярнішою завдяки їхній соціальній політиці. Їхній ліберальний республіканізм відштовхнув частину консерваторів, але залучив багатьох поміркованих виборців. Бредфорд виступає за масштабні витрати на систему національних автомагістралей, щоб з'єднати всі куточки країни.\n\nВід демократів проти переобрання Ейкена виступають Честер Боулс та Пол Девер. Вони також підтримують розвиток інфраструктури. Девер планує розширити пенсійне страхування та покращити освіту для людей з інвалідністю. Боулс натомість пропонує звернути погляд за кордон і допомагати економічному розвитку країн, що розвиваються.\n\nСвіт завмер в очікуванні результатів..."
 new_england_events.612.a: "Список Боулса та Девера перемагає!"
 new_england_events.612.b: "Ейкен та Бредфорд отримують ще чотири роки!"

 new_england_events.613.t: "Президентські вибори [GetYear] року"
 new_england_events.613.d: "Нове десятиліття приносить нові амбіції. Обидві партії [NEE.GetNameDef] готові до боротьби за президентське крісло!\n\nЧинний президент Вільям Гарріман прагне переобратися на другий термін. Він сподівається, що його широка соціальна політика вдома забезпечить йому прихильність народу. Крім того, Гарріман будує кампанію на зміцненні союзів. Він вірить: щоб залишатися лідером, Америка має підтримувати своїх друзів у світі.\n\nРеспубліканці висунули Томаса Дьюї та Нельсона Рокфеллера. Обидва — помірковані республіканці, які загрожують відібрати голоси у демократів. Їхня виважена політика подобається багатьом. Дьюї називає Америку маяком для світу, що прагне відбудови. Як колись вона була «арсеналом демократії», тепер вона має стати її «будівельником».\n\nГодинник цокає, результати вже відомі..."
 new_england_events.613.a: "Другий термін для Гаррімана та Маккормака!"
 new_england_events.613.b: "Дьюї — людина справи!"

 new_england_events.614.t: "Президентські вибори [GetYear] року"
 new_england_events.614.d.tobin: "Нове десятиліття, нові обличчя в американській політиці. Гасла кандидатів лунають на кожній вулиці [NEE.GetNameDef]!\n\nПісля двох термінів Моріс Тобін погодився піти у відставку за порадою Джеймса Фарлі. Демократична партія висунула Честера Боулса. Він — завзятий інтернаціоналіст, який вважає, що Америка має активно допомагати країнам, що розвиваються, економічно, аби утвердити свій авторитет у світі.\n\nЙого суперники-республіканці — Томас Дьюї та Нельсон Рокфеллер. Вони зміщують партію до більш ліберальної політики. Рокфеллер особливо зацікавлений у союзі з Латинською Америкою. Він запропонував створити IBEC (Міжнародну базову економічну корпорацію) для допомоги фермерам та промисловості сусідніх країн.\n\nЯким буде вердикт виборців?.."
 new_england_events.614.d.baldwin: "Нове десятиліття кличе до нових звершень. Політична боротьба в самому розпалі по всій [NEE.GetNameDef]!\n\nПрезидент Реймонд Болдвін вирішив не балотуватися на виборах [GetYear] року. Хоча він успішно збалансував бюджет, це не зробило його народним улюбленцем. Республіканці обрали Томаса Дьюї, губернатора Нью-Йорка. Він підтримував проєкти «Квадратного курсу» і обіцяє зберегти соціальні програми.\n\nЙого опонент-демократ Честер Боулс робить ставку на зовнішню політику. Він стверджує, що іноземні інвестиції — найкращий спосіб залучити світ на свій бік. «Несправедливо, коли мільйони голодують, поки ми маємо надлишок», — каже Боулс.\n\nРезультати виборів такі..."
 new_england_events.614.d.fallback: "Результати виборів обробляються."
 new_england_events.614.a: "Список Боулса та Девера здобуває перемогу!"
