### Intro guide ###
 NEE_guide: "§MЗовнішня політика§!\n §MСтарий порядок§!\n£white_dot Виграйте громадянську війну та завершіть фокус §Y$NEE_End_Reconstruction$§!, перебуваючи в Антанті.\n£white_dot Ми допоможемо Антанті відвоювати їхні основні території і згодом візьмемо лідерство в альянсі.\n\nНаступні два варіанти вимагатимуть від нас вийти з Антанти. Для цього нам потрібно, щоб Канада відхилила наше прохання про самоврядування з фокусу §Y$NEE_Second_Declaration_of_Independence$§!, наступне збільшить наші шанси на це:\n\n£white_dot Мати меншу армію, ніж у них.\n£white_dot Мати низьку легітимність.\n£white_dot Щоб Канада вирішила підтримати іншу американську фракцію, а не нас.\n£white_dot Щоб §aТорі§! були правлячою партією Канади.\n\nЦе розблокує рішення про оголошення незалежності від Канади та вихід з Антанти.\n\n§MАмерика повертається на світову арену§!\n£white_dot Оберіть зосередитися на Західній півкулі після завершення фокусу §Y$NEE_End_Reconstruction$§!.\n£white_dot Ми створимо власний альянс і відродимо Доктрину Монро, впливаючи на нації до демократії.\n\n§MПоворот до Тихого океану§!\n£white_dot Оберіть зосередитися на Східній півкулі після завершення фокусу §Y$NEE_End_Reconstruction$§!.\n£white_dot Ми розширимо наш вплив на азіатські нації.\n\n§CПримітка§!: Якщо ми перемогли за допомогою Американської конституційної коаліції, один із двох варіантів буде обрано залежно від того, хто має більшу легітимність. Наступне вплине на розрахунки:\n\n£white_dot Якщо Бора, Лендон або Олсон були обрані на виборах 1936 року.\n£white_dot Поточна кількість легітимності Нової Англії.\n£white_dot Володіння будь-яким із наступних: Меріленд, Новий Орлеан, Іллінойс, Міссурі та Колорадо.\n£white_dot Розмір нашої армії.\n\nЯкщо АКК має вищу легітимність, ніж ми, ми перейдемо до їхньої ідеології, матимемо їхнього поточного президента та розблокуємо опцію §MПоворот до Тихого океану§!.\nЯкщо ми маємо вищу легітимність, ми розблокуємо опцію §MАмерика повертається на світову арену§!.\n\n§MПосібник з виборів§!\n§MВибори в Новій Англії§!\n\n§MПровінційні вибори 1937 року§!\n£white_dot §mРеспубліканці§!: Льюїс О. Барроу переможе на виборах.\n£white_dot §mРеспубліканці§! (Компромісний варіант): Джозеф Вільям Мартін-молодший буде обраний як компромісний кандидат.\n£white_dot §lДемократи§!: Девід І. Волш переможе на виборах.\n\n§MВибори 1940 року§!\n£white_dot Наявність Барроу призведе до його протистояння з Чарльзом Херлі з §lДемократів§!.\n£white_dot Наявність Джозефа Мартіна призведе до протистояння Чарльза Херлі з §lДемократів§! проти Джона Вінанта з §mРеспубліканців§!.\n£white_dot Наявність Волша призведе до його протистояння з Джоном Вінантом з §mРеспубліканців§!.\n\n§MВибори 1944 року§!\n£white_dot Наявність Херлі призведе до його протистояння з Раймондом Болдвіном з §mРеспубліканців§!.\n£white_dot Наявність Барроу, Вінанта або Волша призведе до протистояння Раймонда Болдвіна з §mРеспубліканців§! проти Моріса Тобіна з §lДемократів§!.\n\n§MВибори 1948 року§!\n£white_dot Наявність Херлі призведе до протистояння Джорджа Ейкена з §mРеспубліканців§! проти Вільяма Гаррімана з §lДемократів§!.\n£white_dot Наявність Болдвіна призведе до його протистояння з Вільямом Гарріманом з §lДемократів§!.\n£white_dot Наявність Тобіна призведе до його протистояння з Джорджем Ейкеном з §mРеспубліканців§!.\n\n§MВибори 1952 року§!\n£white_dot Наявність Ейкена призведе до його протистояння з Честером Боулсом з §lДемократів§!.\n£white_dot Наявність Гаррімана призведе до його протистояння з Томасом Дьюї з §mРеспубліканців§!.\n£white_dot Наявність Болдвіна або Тобіна призведе до протистояння Томаса Дьюї з §mРеспубліканців§! проти Честера Боулса з §lДемократів§!.\n\n§MВибори після компромісу зі Сходом§!\n Щоб отримати наступні вибори, нам потрібно виграти громадянську війну за допомогою АКК і щоб вони мали вищу легітимність, ніж ми.\n\n§MВибори 1940 року§!\n£white_dot Ми зможемо переобрати Квентіна Рузвельта або обрати Калберта Олсона з §lДемократичної партії§!.\n\n§MВибори 1944 року§!\n£white_dot Наявність Олсона призведе до його протистояння з Артуром Ленглі з §mРеспубліканської партії§!.\n£white_dot Наявність Рузвельта призведе до протистояння Шерідана Дауні з §cДемократичної партії§! проти Ерла Воррена з §mРеспубліканської партії§!.\n£white_dot Наявність Генрі Воллеса з §SРобітничо-Фермерської партії§! призведе до протистояння Шерідана Дауні з §cДемократичної партії§! проти Ерла Воррена з §mРеспубліканської партії§!.\n\n§MВибори 1948 року§!\n£white_dot Наявність Олсона або Воррена призведе до протистояння останнього проти Кларенса Мартіна з §lДемократичної партії§!.\n£white_dot Наявність Дауні призведе до його протистояння з Ерлом Ворреном з §mРеспубліканської партії§!.\n£white_dot Наявність Філіпа Ла Фоллета з §SРобітничо-Фермерської партії§! призведе до протистояння Кларенса Мартіна з §lДемократичної партії§! проти Артура Ленглі з §mРеспубліканської партії§!.\n£white_dot Наявність Воллеса або Ленглі призведе до протистояння останнього проти Кларенса Мартіна з §lДемократичної партії§!.\n\n§MВибори 1952 року§!\n£white_dot Наявність Мартіна призведе до його протистояння з Гаррі Кейном з §mРеспубліканської партії§!.\n£white_dot Наявність Дауні призведе до протистояння Воррена Магнусона з §lДемократичної партії§! проти Гаррі Кейна з §mРеспубліканської партії§!.\n£white_dot Наявність Глена Тейлора з §SРобітничо-Фермерської партії§!, Ла Фоллета, Ленглі або Ерла Воррена призведе до протистояння Воррена Магнусона з §lДемократичної партії§! проти Вільяма Ноуленда з §mРеспубліканської партії§!."

### Decisions ###
#Entente Allies
 NEE_entente_allies: "Підтримка Антанти"
 NEE_entente_allies_desc: "Наші зв'язки з Канадою означають, що ми є членом Антанти — хочемо ми цього чи ні. Однак британці мають великий досвід і технології, які ми можемо використати зі значною перевагою, хоча чим більше ми це робимо, тим більше ми втрачаємо легітимність як окремий і самостійний уряд."

 NEE_weapon_procurement: "Контракт на [ENT.GetAdjective] зброю"
 NEE_weapon_procurement_desc: "Наші заводи можуть виробляти лише стільки, і оскільки ми прагнемо нарощувати наші військові зусилля, наші виробничі лінії виявляються дедалі більш напруженими. Ми звернемося до наших союзників в Антанті за контрактами на зброю, щоб полегшити зусилля на внутрішньому фронті."
 NEE_construction_contracts: "Контракт на [ENT.GetAdjective] будівельні бригади"
 NEE_construction_contracts_desc: "Через те, що чоловіки на фронті, а жінки зайняті на робочих місцях, у Новій Англії не вистачає робочої сили для розвитку нових галузей промисловості, інфраструктури, верфей та авіабаз. Ми звернемося до наших союзників по Антанті за додатковою робочою силою та допомогою, щоб розвинути нашу базу влади."
 NEE_relief_efforts: "Запит на допомогу з гуманітарною допомогою"
 NEE_relief_efforts_desc: "Оскільки друга громадянська війна затягується, наші громадяни починають помічати напругу сучасної тотальної війни. Дефіцит продовольства стає все більш поширеним явищем, а частини країни все ще перебувають у бідності через тривалу депресію. Ми звернемося до наших канадських союзників на півночі за постачанням гуманітарної допомоги, щоб допомогти полегшити страждання в нашій нації."
 NEE_joint_army_training: "Спільні армійські навчання"
 NEE_joint_army_training_desc: "Починаючи перетворювати наше колишнє ополчення на ефективну бойову силу, ми можемо використати наші зв'язки з Антантою для організації спільних військових навчань. Разом із керівництвом канадських та французьких генералів ми зможемо модернізувати та зміцнити наші існуючі збройні сили до боєздатної армії."
 NEE_joint_navy_training: "Спільні військово-морські навчання"
 NEE_joint_navy_training_desc: "Наші військово-морські сили мізерні порівняно з силами наших ворогів і колишніх Сполучених Штатів, і хоча ми можемо похвалитися вражаючою військово-морською традицією, багато наших нових новобранців все ще не готові до майбутніх битв. Ми можемо використати наші зв'язки з Антантою для організації спільних військово-морських навчань, де наші люди зможуть навчитися у досвідчених ветеранів колишнього Королівського флоту."
 NEE_joint_air_training: "Спільні повітряні навчання"
 NEE_joint_air_training_desc: "Хоча Нова Англія має потужну авіаційну промисловість, багато наших пілотів є недосвідченими новобранцями. Хоча вони завзяті, якщо вони не будуть належним чином навчені та під наглядом, вони не будуть ефективними в небі. За допомогою наших союзників по Антанті ми організуємо спільні повітряні навчання між нашими військово-повітряними силами та досвідченими пілотами Антанти. Разом ми збережемо небо вільним!"
 NEE_declare_independence_from_CAN: "Друга декларація Незалежності"
 NEE_declare_independence_from_CAN_desc: "Ми не хотіли, щоб до цього дійшло, але, здається, ми мусимо: щоб Нова Англія була вільною, ми повинні оголосити про свою незалежність від [CAN.GetNameDef] та їхнього альянсу. Якщо вони мають намір боротися з нами щодо цього рішення, то ми повинні бути готові зустріти їх у бою."
 NEE_declare_independence_from_auth_CAN: "Свобода від тіні тиранії"
 NEE_declare_independence_from_auth_CAN_desc: "Ми не хотіли, щоб до цього дійшло, але, здається, ми мусимо: щоб Нова Англія була вільною, ми повинні оголосити про свою незалежність від [CAN.GetNameDef] та їхнього альянсу. Якщо вони мають намір боротися з нами щодо цього рішення, то ми повинні бути готові зустріти їх у бою."

 NEE_Infantry_Contract: "Контракти на піхотну зброю"
 NEE_Construction_Contract: "Контракти на будівництво"
 NEE_relief_efforts_idea: "Гуманітарна допомога"

 if_CAN_accepts_lose_15_legitimacy: "Якщо [CAN.GetNameDef] прийме контракт, це зменшить нашу §Yлегітимність§! на §R15§!"
 if_CAN_accepts_lose_20_legitimacy: "Якщо [CAN.GetNameDef] прийме запит, це зменшить нашу §Yлегітимність§! на §R20§!"

 new_england_events.441.t: "[NEE.GetNameDefCap] просить про контракти на зброю"
 new_england_events.441.d: "Уряд [NEE.GetName] офіційно звернувся до нас із проханням підтримати їхню збройову промисловість, надавши їм контракти на зброю. Оточені реакціонерами та революціонерами, підтримка наших американських союзників може бути найкращим курсом дій, якщо ми хочемо бачити демократичного та вільного американського сусіда. Наша промисловість зросла достатньо з часів Великої депресії до такої міри, що ми можемо перенаправити виробництво для підтримки янкі. Хоча пропозиція підтримується багатьма нашими союзниками по Антанті, є також занепокоєння, що кожна гвинтівка, яку ми виробляємо, має підтримувати наші власні майбутні військові походи. Звичайно, вони обійдуться і без нашої підтримки?"
 new_england_events.441.a: "Звичайно!"
 new_england_events.441.b: "На жаль, ми не можемо нічого пожертвувати."

 new_england_events.442.t.accept: "Антанта схвалює контракт на зброю"
 new_england_events.442.t.decline: "Антанта відхилила контракт на зброю"
 new_england_events.442.d.accept: "Чудові новини від наших союзників по Антанті! Вони прийняли наше прохання про контракти на зброю та погодилися перенаправити своє виробництво зброї на допомогу нашій зростаючій збройовій промисловості. Робітники на внутрішньому фронті зітхнуть з полегшенням, коли перші партії франко-канадської зброї досягнуть наших берегів. Новоанглійський солдат знайде свою нову зброю виготовленою з найвищою якістю та майстерністю — це свідчення нашої спільної відданості з Антантою відновленню законного порядку у світі."
 new_england_events.442.d.decline: "Невтішні новини від наших союзників по Антанті. На жаль, Антанта відхилила наше прохання про контракти на зброю, посилаючись на те, що їхні виробничі лінії вже напружені і що їм знадобиться кожна гвинтівка для власних військ. Хоча це засмучує, нашої промислової могутності має бути достатньо, щоб розвивати власну збройову промисловість. Американська якість та майстерність, зрештою, найкращі у світі."
 new_england_events.442.a: "Ми вдячні."
 new_england_events.442.b: "Ми зробимо це самі!"

 new_england_events.443.t: "[NEE.GetNameDefCap] просить про контракти на будівництво"
 new_england_events.443.d: "Уряд [NEE.GetName] офіційно звернувся до нас із проханням підтримати їхній розвиток будівельними контрактами. З відновленням економіки після Великої депресії та підготовкою чоловіків до військового конфлікту, робоча сила Нової Англії виявляється дедалі більш напруженою. Вони звернулися до нас за допомогою, сподіваючись, можливо, використати велику кількість робочої сили, наявну у французьких колоніях та Домініонах. Однак нашим пріоритетом завжди було повернення додому насамперед, і є проблема в тому, що, можливо, наші ресурси краще витратити на підготовку до повернення. Може бути мудро ввічливо відхилити їхнє прохання на користь готовності до відвоювання наших рідних земель."
 new_england_events.443.a: "Звичайно!"
 new_england_events.443.b: "На жаль, ми не можемо."

 new_england_events.444.t.accept: "Антанта схвалює контракти на будівництво"
 new_england_events.444.t.decline: "Антанта відхилила контракти на будівництво"
 new_england_events.444.d.accept: "Чудові новини від наших союзників по Антанті! Вони прийняли наше прохання про контракти на будівництво, охоче нагадуючи нам, що сподіваються, що з їхньою допомогою ми зможемо зміцнити наш бастіон свободи та демократії. Це, безсумнівно, зменшить дефіцит робочої сили на внутрішньому фронті та допоможе розвинути нашу економіку, оскільки вона починає відновлюватися після жахливої депресії, яка мучила Нову Англію надто довго. Ми зобов'язані їм величезним боргом, який, хоча ми не можемо сплатити зараз, ми обов'язково сплатимо пізніше."
 new_england_events.444.d.decline: "Невтішні новини від наших союзників по Антанті. Вони відхилили наше прохання про контракти на будівництво, посилаючись на те, що їм знадобиться кожен будівельник та інженер вдома, щоб підтримати їхні зусилля з відновлення контролю над своїми батьківщинами. Хоча це деморалізує, не забуваймо, що ми змогли разом пройти через найпохмуріші дні Депресії. Давайте мобілізуємо чоловіків та жінок нашої країни, щоб працювати завзятіше, ніж будь-коли раніше, щоб допомогти нам підготуватися до того, що має відбутися. Разом ми зможемо це зробити!"
 new_england_events.444.a: "Ми цінуємо допомогу!"
 new_england_events.444.b: "Ми зробимо це самі!"

 new_england_events.445.t: "Спільні армійські навчання"
 new_england_events.445.d: "З ініціативи [NEE.GetNameDef] загони наших збройних сил зібралися для спільних тренувань та навчання один у одного у Форті Ітана Аллена у Вермонті. Названий на честь діяча Американської революційної війни Ітана Аллена, форт був домом для таких підрозділів, як 10-й кавалерійський полк та 1-й ескадрон 3-го кавалерійського полку — нинішніми мешканцями форту є Національна гвардія Вермонту.\n\nГенерал Леслі Гроувз виступив із вступною промовою, щоб розпочати спільні тренування міжнародної коаліції збройних сил, включаючи солдатів з Французької Африки та Австралії. Обіцяючи допомогти цілям Антанти щодо повернення додому після років вигнання, а також звільнення Америки від громадянської війни, яка її спіткала, промова Гроувза була зустрінута бурхливими оплесками серед присутніх. Цікаві репортери та глядачі спостерігали та спілкувалися з військовими союзних сил, оскільки солдати змагалися один з одним та проти один одного, незалежно від нації та кольору. Військовий штаб Антанти та [NEE.GetNameDef] дійшов висновку, що спільні тренування були успішними, і розробляються плани щодо наступної події."
 new_england_events.445.a: "Разом до перемоги"

 new_england_events.446.t: "Спільні військово-морські навчання"
 new_england_events.446.d: "З ініціативи [NEE.GetNameDef] ескадрильї наших військово-морських сил зібралися для спільних тренувань та навчання один у одного. Канадський уряд запропонував провести спільні військово-морські навчання біля узбережжя Нової Шотландії, нейтральної морської зони, близької як до [NEE.GetNameDef], так і до Канади.\n\nРізні нації Антанти відправили свої кораблі та найкращих моряків для участі у спільних військово-морських навчаннях. Від імені військово-морських сил Уряду [NEE.GetNameDef] адмірал Томас Кінкейд та ескадра найкращих моряків [NEE.GetNameDef] були відправлені для участі у заході. Хоча військово-морський флот [NEE.GetNameDef] є відносно недосвідченим, навчання виявилися неймовірно корисними, оскільки новоанглійські моряки змогли практикувати сигнали, зв'язок та нові військово-морські стратегії. Для недосвідченого військово-морського флоту [NEE.GetNameDef] навчання зміцнили рішучість та дисципліну молодого американського флоту.\n\nАдмірал Кінкейд поділився своїми статтями про важливість мати більше гармат замість більших гармат та своїми думками про військово-морську авіацію. Навчання також допомогли підготувати їхніх моряків до неминучого повернення додому для канадського, австралійського та французького військово-морських флотів. Нації, які брали участь у спільних військово-морських навчаннях, вважають цей досвід досить корисним, і за заохоченням канадського уряду розробляються плани подальшої співпраці на морі."
 new_england_events.446.a: "Разом до перемоги"

 new_england_events.447.t: "Спільні повітряні навчання"
 new_england_events.447.d: "З ініціативи [NEE.GetNameDef] ескадрильї наших військово-повітряних сил зібралися для спільних тренувань та навчання один у одного. [CAN.GetNameDefCap] буде приймаючою нацією, пропонуючи прийняти різні країни альянсу Антанти на базах Канадських Збройних Сил Упландс (CFB Uplands) в Онтаріо, Канада. Обрані за їхню ідеальну погоду, промислові об'єкти, широкі відкриті простори та близькість до Нової Англії, канадські об'єкти забезпечать пілотам Антанти найкращі можливі симуляції для повітряного бою.\n\nНову Англію представлятиме генерал Джордж Кенні. Хоча американські новобранці є відносно недосвідченими порівняно з їхніми союзними колегами, вони продемонстрували великий ентузіазм у тренуваннях до цього часу. Американські конструкції літаків, особливо від Bell та Consolidated, були передані інженерам та радникам Антанти, які поділилися своїми конструкціями з американцями. З почуттям загального задоволення серед повітряного штабу різних націй Антанти, Антанта сподівається координувати більшу співпрацю в наступні роки щодо розвитку повітряної доктрини та конструкцій літаків."
 new_england_events.447.a: "Разом до перемоги"

 new_england_events.448.t: "[NEE.GetNameDefCap] просить про допомогу з гуманітарною допомогою"
 new_england_events.448.d: "Попри їхні найкращі зусилля в рамках Другого Нового Курсу, наслідки Великої депресії продовжують відчуватися по всій Новій Англії. Хоча їхні заводи нарешті знову починають виробляти продукцію, а рівень зайнятості починає зростати, багато їхніх людей все ще страждають від труднощів громадянської війни, особливо тисячі біженців, які перетнули кордон до Нової Англії. Дефіцит продовольства та нормування продовжують напружувати і без того виснажене населення, і мине деякий час, перш ніж буде досягнуто повного економічного відновлення. Їхній уряд звернувся до нас із проханням про допомогу з гуманітарною допомогою, і з нашими ресурсами ми повинні бути здатні простягнути руку допомоги нашому американському союзнику. Однак, з неминучим поверненням Антанти додому, можливо, наші ресурси краще використовувати для допомоги нашому власному народу. Хоча американський народ, безсумнівно, буде вдячний за допомогу, ми завжди можемо ввічливо відхилити їхнє прохання."
 new_england_events.448.a: "Звичайно, ми їм допоможемо!"
 new_england_events.448.b: "На жаль, ми не можемо."

 new_england_events.449.t.accept: "Антанта надсилає гуманітарну допомогу"
 new_england_events.449.t.decline: "Антанта відхилила наш запит про допомогу"
 new_england_events.449.d.accept: "Чудові новини від наших союзників по Антанті! Визнаючи наші економічні та соціальні труднощі, вони люб'язно пообіцяли гуманітарну допомогу Тимчасовому уряду. Це, безсумнівно, допоможе поступовому економічному відновленню та поверне американців до повної зайнятості. Ми маємо перед ними борг, який нам одного дня доведеться повернути, але наразі ми можемо бути впевнені, що найгірші дні Депресії стануть далеким спогадом."
 new_england_events.449.d.decline: "Невтішні новини від наших союзників по Антанті. Вони відхилили наше прохання про допомогу з гуманітарною допомогою, посилаючись на те, що їхні ресурси краще використовувати на їхньому внутрішньому фронті, особливо коли вони готуються повернути свої батьківщини. Хоча це деморалізує, ми продовжуватимемо долати залишкові наслідки Депресії. Давайте мобілізуємо чоловіків та жінок нашої країни, щоб працювати завзятіше, ніж будь-коли раніше, щоб допомогти нам підготуватися до того, що має відбутися. Разом ми зможемо це зробити!"
 new_england_events.449.a: "Дякую за допомогу!"
 new_england_events.449.b: "Нам доведеться робити це самим."

#Reclaiming America
 NEE_reclaiming_america: "Відвоювання Америки"
 NEE_reclaiming_america_desc: "Світло старої північної церкви залишається готовим знову запалати в найтемнішу годину Америки, оскільки інші частини нашої прекрасної нації розірвали себе на частини. З моменту канадської інтервенції, яка створила наш тимчасовий уряд, ми сподівалися, що демократія переможе у громадянській війні. Якщо це не так, то ми повинні загартувати себе, щоб нести факел свободи, як останній залишок демократичної Америки.\n\nПоточна легітимність: §G[?NEE.NEE_legitimacy]§!\n§P-----------------------------------§!\nПісля завершення фокусу §Y$NEE_Behind_Enemy_Lines$§! будуть розблоковані наступні можливості у заявлених штатах, які межують з нашою повністю контрольованою територією:\n\n£GFX_manpower_texticon  Виявити дружні контакти: §gВибір цієї опції відновить мережу союзників нашої справи. Як тільки цільовий штат буде захищений, вони допоможуть полегшити передачу влади.§!\n§CДодати лояльність§!: §G+10%§!\n§P---------------§!\n£GFX_territory_icon  Проникнути, імпровізувати, саботувати: §gВибір цієї опції дозволить контрабандою переправити зброю до цільового штату, щоб досягти бійців опору. Потрібно кілька днів §W(5)§!, щоб опір був готовий до боротьби.§!\n§P---------------§!\n£GFX_pol_violence  Розпочати повстання: §gВибір цієї опції розгорне два партизанські підрозділи бійців опору, щоб допомогти звільнити Сполучені Штати. Якщо було обрано фокус §Y$NEE_Flying_For_Freedom$§!, наші хоробрі пілоти зможуть доставити краще спорядження та контрабандою переправити більш досвідчених сержантів для керівництва підрозділами опору.§!\n§LШаблон опору§!:  8 £GFX_nato_unit_infantry_icon_small  з £GFX_unit_artillery_icon_small , £GFX_unit_recon_icon_small , та £GFX_unit_logistics_company_icon_small."

 NEE_request_ENT_backing: "Запит на підтримку [ENT.GetNameWithFlag]"
 NEE_request_ENT_backing_desc: "§gЦі переговори, швидше за все, будуть успішними, якщо у нас є вагомі підстави для обґрунтування нашої справи перед [ENT.GetName]. Це відображається у наявності великої армії та високій легітимності§!"

 NEE_claim_usa_territory: "Заявити про звання демократичної Америки"
 NEE_claim_usa_territory_desc: "Коли канадці втрутилися навесні 1937 року, багато хто бачив нас лише як маріонетку у відчайдушних спробах Антанти повернутися додому. Однак із падінням останніх бастіонів демократії в Сполучених Штатах — ми тепер виявляємося єдиним варіантом для порятунку демократії в Америці! Якщо ми не станемо на захист демократичних ідеалів, за які ми боролися у війні за незалежність, ніхто цього не зробить. Ті, хто сумнівається в нас, можуть подивитися на нашу оновлену економічну силу та зростаючий потенціал наших збройних сил. Настав час оголосити американському континенту, що ми звільнимо нашу націю від тих, хто занурив її в хаос!"
 NEE_claim_usa_territory_harsh: "Заявити про звання вільної Америки"
 NEE_claim_usa_territory_harsh_desc: "Коли канадці втрутилися навесні 1937 року, багато хто бачив нас лише як маріонетку у відчайдушних спробах Антанти повернутися додому. Однак, завдяки патріотичним чоловікам та жінкам, які відмовилися відмовитися від американської демократії, — ми тепер справді кваліфіковані, щоб претендувати на звання вільної Америки. Ті, хто сумнівається в нас, можуть подивитися на нашу оновлену економічну силу та зростаючий потенціал наших збройних сил. Настав час оголосити американському континенту, що ми звільнимо нашу націю від тих, хто занурив її в хаос!"
 NEE_liberate_states: "Визволити штати"
 NEE_liberate_states_desc: "Хоча ми, можливо, відсиджувалися на початку війни, ми робили це через необхідність і час. Наша економіка нарешті оговталася від найгірших днів Депресії до такої міри, що наші заводи тепер готові перейти до військового виробництва. Уряд значно стабілізувався, а наші збройні сили розширилися до такої міри, що відвоювання континенту є цілком можливим. Оскільки інші сторони виснажені роками громадянської війни, ми тепер можемо сміливо йти вперед, щоб відвоювати нашу націю від тиранії, як наші предки до нас!"

 #Sway Public Opinion
 NEE_Sway_Public_Opinion: "Встановлення легітимності"
 NEE_Sway_Public_Opinion_desc: "Ми є урядом, який був створений іноземною державою, і тому багато хто прагне ігнорувати наше право на існування або називати нас зрадниками за те, що ми не втручаємося у громадянську війну, що лютує в решті нації. Ми повинні боротися з думкою, що ми служимо британським інтересам, а не американським громадянам, і це передбачає зміну ставлення вдома. Нездатність зробити це означає можливе розпущення нашого уряду після закінчення громадянської війни — або гірше.\n\nПоточна легітимність: §G[?NEE.NEE_legitimacy]§!"

 NEE_national_propaganda_campaign: "Організувати пропагандистську кампанію"
 NEE_national_propaganda_campaign_desc: "Бігборди, радіореклама, газетні оголошення та багато іншого — усе це буде нав'язано людям в надії донести наше повідомлення."

 NEE_presidential_goodwill_tour: "Провести президентський тур доброї волі"
 NEE_presidential_goodwill_tour_desc: "Навіть коли наше міністерство пропаганди працює цілодобово, людина на вулиці залишається непереконаною, що фактична влада здійснюється в Бостоні, і бачить у «президенті» не більше, ніж канадську маріонетку, яка охоче виконує всі накази Оттави. Проводячи тур президента та обраного кабінету по Новій Англії, ми сподіваємося ще більше переконати людей, що їхній справжній президент і лідер — це саме [NEE.GetLeader]."

 NEE_bribe_foreign_press: "«Мотивувати» іноземну пресу"
 NEE_bribe_foreign_press_desc: "Журналісти з усіх куточків світу продовжують мати цю дратівливу звичку повідомляти новини в нашій країні як справи «новоанглійського» штату, причому соціалістично налаштовані газети навіть заходять так далеко, що називають нас Канадською провінцією Нова Англія. Це більше не буде терпітися, оскільки ми не дозволимо з собою жартувати, і незабаром вони визнають, що єдина справжня американська нація — це наша. Однак наразі нам доведеться задовольнитися тим, що ми підкинемо трохи грошей найбільшим порушникам спокою та ввічливо попросимо їх називати нас Сполученими Штатами Америки."

 NEE_foreign_representation: "Збільшити іноземне представництво в R&D"
 NEE_foreign_representation_desc: "Війна, можливо, вирує сильніше, ніж будь-коли раніше, але американські вчені все ще працюють у лабораторіях та інженерних установах університетів Ліги Плюща. Давайте дамо зрозуміти, що [Root.GetNameDef] має можливості для інновацій та самостійного існування серед світових лідерів."

#Liberty Ship Project
 NEE_Liberty_Ship_Program: "Програма суден «Ліберті»"
 NEE_Liberty_Ship_Program_desc: "З неминучою війною на європейському континенті та амбіціями Антанти здійснити найбільшу військово-морську операцію в історії людства, верфі Нової Англії працюють понаднормово, щоб задовольнити зростаючі потреби альянсу. Щоб ще більше збільшити наш випуск, урядом була створена централізована схема будівництва для керівництва подальшим розширенням цих верфей."

 NEE_Todd_Bath_Shipyard: "Суднобудівна корпорація «Тодд-Бат Айрон»"
 NEE_Todd_Bath_Shipyard_desc: "В рамках інтенсивної програми екстреного суднобудування країни верф Суднобудівної корпорації «Тодд-Бат Айрон» має на меті задовольнити високі вимоги американського флоту. Завдяки тисячам працевлаштованих жінок, верф забезпечила значний рівень продуктивності та зайнятості в портовому місті Саут-Портленд, штат Мен. Це також перша верф, на якій будують кораблі нижче рівня моря."
 NEE_South_Portland_Shipyard: "Саут-Портлендська суднобудівна корпорація"
 NEE_South_Portland_Shipyard_desc: "Як і її аналог, верф «Тодд-Бат Айрон», західна верф у Саут-Портленді була перейменована на Саут-Портлендську суднобудівну корпорацію. Тут кораблі будуватимуться з використанням нової технології «зварних», а не клепаних корпусів — таким чином надаючи нашим кораблям перевагу у відкритому морі!"
 NEE_Walsh_Kaiser_Shipyard: "Компанія «Волш-Кайзер»"
 NEE_Walsh_Kaiser_Shipyard_desc: "Розташована в Кренстоні та Провіденсі на Род-Айленді, компанія «Волш і Кайзер» була профінансована Морською комісією в рамках інтенсивної програми суднобудування в країні. Місцевих крамарів, домогосподарок, клерків та молодь, які щойно закінчили школу, заохочували допомагати у розвитку та будівництві верфі, щоб наш флот і надалі залишався першокласним."

 ### GUI ###
 NEE_GUI_Contacts: "§YВиявити дружні контакти§!"
 NEE_GUI_Contacts_desc: "§gВстановлюючи контакти серед місцевих груп опору, ми можемо допомогти підняти потрібних людей, щоб полегшити передачу влади. З невеликою пропагандою та потрібними людьми на нашому боці, регіон має перейти під контроль легше.§!\n\n[!NEE_Contacts_button_click_enabled]"

 NEE_GUI_Infiltration: "§YПроникнути, імпровізувати, саботувати§!"
 NEE_GUI_Infiltration_desc: "§gВстановлюючи контакт із місцевими групами опору та забезпечуючи їх необхідною зброєю та досвідом для успішної організації партизанських ударів, ми створимо мережу осередків опору, лояльних до нас і здатних завдати важкої шкоди нашим ворогам.§!\n\n[!NEE_Infiltration_button_click_enabled]"

 NEE_GUI_Uprising: "§YРозпочати повстання!§!"
 NEE_GUI_Uprising_desc: "§gНастав день розплати, і осередки, які ми так ретельно розвивали, тепер готові завдати своїх ударів по центральному уряду. За свободу!§!\n\n[!NEE_Launch_Uprising_button_click_enabled]"

 NEE_state_contacted: "Місцеві контакти вже встановлені"
 NEE_state_infiltrated: "Штат уже інфільтровано"
 NEE_state_infil_timer: "Наразі встановлюються контакти в регіоні"
 NEE_rebel_spawned: "Повстання вже розпочато"

 infiltration_tooltip: "Переглянути неінфільтровані території"

 ### FOCUS TREE ###
 NEE_Townhall_Democracy: "Демократія міської ратуші"
 NEE_Townhall_Democracy_desc: "Демократія найкраще працює на місцевому рівні. Ми повинні забезпечити, щоб навіть у цей час хаосу люди все ще могли брати участь у демократії та відчувати, що їхній голос почутий тимчасовим урядом."

 NEE_Public_Opinion_Support: "Хитання суспільної думки"
 NEE_Public_Opinion_Support_desc: "Через фільми, пісні, мистецтво та всі традиційні засоби пропаганди ми встановимо довіру до здатності тимчасового уряду керувати та діяти в найкращих інтересах наших американських громадян."

 NEE_Reassure_Financial_Institutions: "Запевнити фінансові установи"
 NEE_Reassure_Financial_Institutions_desc: "Багато міжнародних фірм налякані втратою своїх інвестицій в Америці. Ми повинні запевнити їх, що принаймні Нова Англія є безпечним місцем для ведення бізнесу та отримання прибутку."

# Great Depression #
 NEE_Second_Square_Deal: "Другий квадратний курс"
 NEE_Second_Square_Deal_desc: "Поки наші співвітчизники-американці на півдні відродили свою економіку через вогонь другої Американської громадянської війни, наш нейтралітет продовжує залишати нас перед обличчям триваючих наслідків Великої депресії, яка спустошувала нашу країну понад десять років."

 NEE_Maine_Steelworks: "Сталеливарні заводи Мену"
 NEE_Maine_Steelworks_desc: "Мен сповнений цінних покладів корисних копалин. Ми повинні забезпечити їх доступність для видобутку через розробку нових технологій видобутку ресурсів."

 NEE_LMRA: "Закон про відносини між працею та управлінням"
 NEE_LMRA_desc: "Профспілки виявилися загрозою для американського суспільства. [WCA.GetNameDefCap] на півдні занурили країну в хаос, нацьковуючи брата на брата вдруге за 70 років. Необхідно прийняти законодавство, щоб тримати їх під контролем."

 NEE_NLRA: "Національний закон про трудові відносини"
 NEE_NLRA_desc: "Якщо ми не хочемо бачити повстань робітників по всій Новій Англії, ми повинні захистити їхню здатність організовуватися на захист своїх прав від недобросовісної ділової практики. Сенатор Роберт Вагнер із Нью-Йорка розробив цей акт для просування через Конгрес."

 NEE_Federal_Housing_Act: "Федеральний закон про житло"
 NEE_Federal_Housing_Act_desc: "По всій Новій Англії незліченні тисячі людей, які живуть у бідності, є бездомними та знедоленими. Країна процвітання та майбутнього не виправдовує своєї назви!"

 NEE_Reduce_Great_Depression_tt: "Це зменшить наслідки національного духу §YВелика депресія§!"

 NEE_WFW: "Соціальне забезпечення за роботу"
 NEE_WFW_desc: "Безкоштовна роздача просто зробить населення лінивим. Зробити це означало б позбавити американців їхнього прагнення до успіху, коли вони можуть сидіти склавши руки та просто отримувати державні чеки."

 NEE_SSA: "Закон про соціальне забезпечення [GetYear]"
 NEE_SSA_desc: "Сполучені Штати — єдина сучасна індустріальна країна, яка не надає своїм людям системи соціального захисту. Літні американці іноді залишаються на самоті у скрутні часи, коли їхні сім'ї вже намагаються забезпечити себе, не турбуючись про те, щоб прогодувати ще й бабусю."
 NEE_SSA_idea: "Закон про соціальне забезпечення"

 NEE_WPA: "Адміністрація прогресу робіт"
 NEE_WPA_desc: "Оскільки значна частина нашого населення безробітна через економічну кризу, ми маємо в своєму розпорядженні величезне джерело невикористаної потенційної робочої сили. Адміністрація прогресу робіт створить робочі місця для будівництва інфраструктури та громадських споруд по всій Новій Англії, щоб повернути наших людей до роботи."

 NEE_RFC: "Реконструктивна фінансова корпорація"
 NEE_RFC_desc: "Тривала Велика депресія похитнула довіру інвесторів до ринку. Багато приватного капіталу стримується багатими, які не бажають викидати свою важку працю в ці неспокійні часи. Ми повинні прагнути заохочувати приватні інвестиції, щоб допомогти доповнити федеральні витрати."

 NEE_CCC: "Сформувати Громадянський корпус охорони природи"
 NEE_CCC_desc: "Через велику кількість молодих чоловіків, які не мають роботи, сім'ї намагаються звести кінці з кінцями. Громадянський корпус охорони природи забезпечить придатних молодих чоловіків харчуванням, житлом та роботою, щоб допомогти забезпечити себе та свої сім'ї!"

 NEE_Rural_Electrification: "Електрифікація сільської місцевості"
 NEE_Rural_Electrification_desc: "Аж 90% сільської Америки залишилося без доступу до електроенергії наприкінці Адміністрації Сміта. Особливо постраждали північні штати Вермонт і Нью-Гемпшир. Ми повинні забезпечити, щоб усі громадяни мали до неї доступ."

# Great Depression Decisions #
 NEE_Great_Depression_decisions: "Боротьба з Великою депресією"
 NEE_Great_Depression_decisions_desc: "На відміну від наших південних сусідів, які були виведені з найгіршого періоду депресії з початком другої Американської громадянської війни, що перевела їх на військову економіку, ми все ще відчуваємо наслідки довгого десятиліття. Сотні тисяч людей все ще залишаються без роботи і роблять усе можливе, щоб звести кінці з кінцями за допомогою тих мізерних заощаджень, які їм вдалося зібрати. Нашим головним пріоритетом має бути допомога нашому народу!\n§!§P---------------\n§gХоча наслідки модифікатора §YВелика депресія§! автоматично повільно зменшуватимуться, прийняття кожного з цих £decision_icon_small §Hрішень§! або завершення £GFX_pol_power  §Hфокусів§! з гілки §nДругий квадратний курс§! допоможе швидше позбутися модифікатора.§!"

 NEE_Bangor_Airport: "Розширення аеропорту Бангор"
 NEE_Bangor_Airport_desc: "Будучи найсхіднішим штатом у союзі, Мен є чудовим місцем для початку будівництва великого аеродрому. Оскільки в Канаді триває підготовка до повернення додому, Північна Атлантика може стати регіоном інтенсивного руху, що перевозить усілякі товари, людей та матеріали через океан."

 NEE_RI_Infra: "Інфраструктура Род-Айленда"
 NEE_RI_Infra_desc: "Використовуючи державні кошти, місцеві чиновники під керівництвом видатного губернатора/віцепрезидента (якщо Волша) Теодора Френсіса Ґріна висунули плани модернізації штату. Буде побудовано багато миль шосе для кращого сполучення регіону, а також державні школи для навчання наступного покоління кваліфікованих робітників."

 NEE_Rochester_Syracuse_Railroad: "Модернізувати залізницю Рочестер — Сіракузи"
 NEE_Rochester_Syracuse_Railroad_desc: "Коли наш країну вразила Велика депресія, потік товарів нашими залізницями застопорився до жалюгідно низького рівня. Оскільки залізничників почали звільняти, ділянки Нью-Йоркської центральної залізниці занепали, чого не можна допустити під час нашого підйому з цього сну."

 NEE_Lackawanna_Steel_Works: "Сталеливарний завод Лаккаванна"
 NEE_Lackawanna_Steel_Works_desc: "Стара сталеливарна компанія Лаккаванна була найбільшою незалежною сталеливарною компанією у світі на початку двадцятого століття. Однак профспілковий рух і важкі часи останніх кількох десятиліть були поганими для компанії. Після їхнього банкрутства Bethlehem Steel придбала завод, але намагалася знайти гроші, необхідні для модернізації заводу належним обладнанням нинішньої епохи."

 NEE_Bourne_And_Sagamore_Bridge: "Міст Бурн і Сагамор"
 NEE_Bourne_And_Sagamore_Bridge_desc: "Запропонований міст у Сагаморі, штат Массачусетс, планується для з'єднання Кейп-Коду з материковою частиною Массачусетсу. Дизайн мосту базується на мосту Джона Ґрінліфа Віттієра, який з'єднує Ньюберіпорт з Еймсбері, штат Массачусетс. Покращення інфраструктури штату допоможе прискорити подорожі та забезпечити робочі місця для багатьох безробітних американців."

 NEE_Expand_the_Boston_and_Albany_Railroad: "Розширити залізницю Бостон — Олбані"
 NEE_Expand_the_Boston_and_Albany_Railroad_desc: "На момент свого будівництва залізниця Бостон — Олбані була найдовшою та найдорожчою залізницею, побудованою в Сполучених Штатах, що з'єднувала дві точки. Зі зростанням пікового обсягу пасажирських перевезень, а також необхідністю транспортувати війська та обладнання на фронт, ми візьмемося за амбітний проєкт розширення залізниці для наших потреб."

 NEE_Merritt_Parkway: "Завершити Парквей Меррітт"
 NEE_Merritt_Parkway_desc: "Амбітний парковий маршрут, призначений для з'єднання з Бостонською поштовою дорогою в Мілфорді, завершення Парквею Меррітт забезпечить нам можливість безпечно та ефективно справлятися з більшим обсягом автомобільного руху."

 NEE_Connecticut_Arms: "Фінансувати збройову промисловість Коннектикуту"
 NEE_Connecticut_Arms_desc: "Історично в штаті Коннектикут довгий час розміщувалася велика кількість виробників зброї, таких як Colt, Stag і Ruger. З додатковою робочою силою, доступною з пулу безробітних робітників, ресурси можуть бути спрямовані на розширення цих історичних збройових виробництв."

 NEE_Loudonville_Reservoir: "Водосховище Лаудонвілл"
 NEE_Loudonville_Reservoir_desc: "Місто Олбані довгий час покладалося на потік річки Гудзон для забезпечення водою свого населення. У разі будь-якої зупинки місто може бути відрізане. Це нове водосховище забезпечить до 10 днів аварійного запасу для міста в будь-який час!"

 NEE_Bear_Brook_Camp: "Табір Бер-Брук"
 NEE_Bear_Brook_Camp_desc: "Використовуючи державні кошти для придбання землі з незначною сільськогосподарською цінністю, це місце слугуватиме домашньою базою для інфраструктурних проєктів по всьому регіону."

 NEE_Bear_Brook_Built: "Табір Бер-Брук побудовано в Нью-Гемпширі"

 NEE_New_Hampshire_Forests: "Розчистити ліси Нью-Гемпшира"
 NEE_New_Hampshire_Forests_desc: "Оскільки понад 81% штату вкрито лісами, у штаті не так багато місця для проникнення перспективної промисловості. Використовуючи робочу силу Громадянського корпусу охорони природи, невеликі ділянки лісу можуть бути вибірково вирубані, щоб звільнити місце для розміщення промисловості."

 NEE_Moore_Dam: "Побудувати греблю Мур"
 NEE_Moore_Dam_desc: "Проєкти греблі Мур на кордоні між Вермонтом і Нью-Гемпширом на верхній річці Коннектикут дозволять генерувати величезну кількість енергії для населення сільського Північного Сходу, яке значною мірою не має доступу до електроенергії."

 NEE_Maine_Fire_Trails: "Протипожежні смуги Мену"
 NEE_Maine_Fire_Trails_desc: "Будучи найбільш густо залісненим штатом, Мен дуже схильний до того, що великі пожежі швидко виходять з-під контролю. Громадянський корпус охорони природи може бути направлений на роботу зі створення сільських доріг, які слугуватимуть подвійній меті: стримуванню лісових пожеж на обмежених територіях, а також розширенню дорожньої мережі по всьому штату."

## Armed Forces ##
# Special Forces #
 NEE_Reorganise_National_Guard: "Реорганізувати Нацгвардію"
 NEE_Reorganise_National_Guard_desc: "У шаленому безладі, який супроводжував громадянську війну, порядок було відновлено завдяки допомозі нашої незмінної Національної гвардії. Хоча Національна гвардія — це більше, ніж просто недисципліноване ополчення, вона опустилася нижче світових стандартів піхоти. Ми реорганізуємо та навчимо Національну гвардію відповідно до сучасних стандартів."

 This_will_lock_conscription_tt: "§RЦе обмежить Нову Англію максимально допустимим рівнем призову§! §YОбмежений призов§!"

 NEE_Maine_Maritime_School: "Морська школа Мену"
 NEE_Maine_Maritime_School_desc: "З моменту заснування нашої нації ми завжди покладалися на морських піхотинців для розгортання по всьому світу, елітну бойову силу, здатну воювати на суші та на морі. Близькість Нової Англії до моря дає нам можливість проводити подальші тренування з висадки на сушу. Щоб продовжити нашу морську традицію, ми розширимо Морську школу Мену, включивши до неї підготовку для морських піхотинців, щоб ми могли виховати наступне покоління «шкіряних ший»."

 NEE_Modern_Green_Mountain_Boys: "Сучасні хлопці зеленої гори"
 NEE_Modern_Green_Mountain_Boys_desc: "Починаючи з «Хлопців зеленої гори» Ітана Аллена часів Американської революції, пагорби Вермонту та Нью-Гемпшира завжди мали сильну військову традицію. Ця елітна піхота була відома жахом, який вона вселяла у ворожі лави, тому ми повинні прагнути наслідувати наших предків у нашій методології в боротьбі проти тиранії."

 NEE_Continental_Rangers: "Континентальні рейнджери"
 NEE_Continental_Rangers_desc: "З часів Війни Короля Філіпа американські народи використовували своє розуміння місцевості Нової Англії для боротьби зі своїми ворогами. Наш військовий штаб рекомендував нам створити невеликі бойові загони з добірних елітних сил, здатних завдати масового удару по ворожій території, не вступаючи у відкритий бій. Названі «Континентальними рейнджерами», як і рейнджери Нової Англії до них, вони вселять страх у серця своїх ворогів!"

 NEE_Mechanized_Marines: "Механізовані морські піхотинці"
 NEE_Mechanized_Marines_desc: "Починаючи з цивільного рятувального транспортного засобу, розробленого Дональдом Рублінгом, гусеничний сухопутний транспортний засіб (LVT) був прийнятий Корпусом морської піхоти для логістичних операцій з корабля на берег. Хоча його початкове призначення, можливо, було для перевезення вантажів, морські піхотинці визнали потенціал LVT для використання як штурмового транспортного засобу, забезпечуючи морським піхотинцям броню та підтримку, необхідні для штурму пляжів."

 NEE_Airborne_Experiments: "Повітряні експерименти"
 NEE_Airborne_Experiments_desc: "Наш військовий штаб зацікавився доктриною вертикального охоплення, розробленою в інших країнах. Це ідея швидкого розгортання військ з повітря, які можуть атакувати тил і фланги ворога, даючи нам шанс оточити наших ворогів. Хоча парашутисти залишаються відносно новою, небезпечною та неперевіреною стратегією, ми незабаром проведемо наші перші повітряні експерименти, щоб застосувати цю доктрину на полі бою."

 NEE_Form_MOEF: "Сформувати Конвойні сили середнього океану"
 NEE_Form_MOEF_desc: "З довгими лініями постачання через величезні простори океану, наші транспорти залишаються вразливими для ворожих зусиль з перехоплення. Конвойні сили середнього океану будуть створені для організації патрулів та вивчення нових методів захисту наших конвоїв, коли вони пливуть потенційно небезпечними водами."

 NEE_Naval_Bombardment: "Координувати військово-морський обстріл"
 NEE_Naval_Bombardment_desc: "Щоб дати нашим морським піхотинцям найкращі шанси зійти з пляжу, будь-які укріплення, на які вони натраплять, в ідеалі повинні бути тліючими руїнами, спустошеними морським обстрілом перед спробами висадки. Завдяки вдосконаленню точності зброї та технології виявлення, наші судна перетворять будь-які берегові укріплення на пил!"

 NEE_Fleming_Transport: "Контракти на транспорт Флемінга"
 NEE_Fleming_Transport_desc: "Оскільки Корпус морської піхоти природно розширюється, зростає і кількість десантних кораблів, необхідних для його оперативних можливостей. Не маючи багатьох місцевих проєктів, ми звернемося до нашого північного сусіда за проєктами для вдосконалення LVT та дозволу нам здійснювати військово-морські вторгнення, які забезпечують безпеку наших морських піхотинців під час їхньої висадки на пляжі."

 NEE_Mobile_Mountain_Arty: "Мобільна гірська артилерія"
 NEE_Mobile_Mountain_Arty_desc: "Місцевість Нової Англії ускладнює використання традиційної буксируваної артилерії, а розгортання такої артилерії є повільним і важким. Щоб прискорити пересування артилерії, наш військовий штаб запропонував нам прийняти 75-мм гаубицю M1A1, яку можна розібрати на частини для перенесення в'ючними тваринами. Це забезпечує швидке розгортання нашої артилерії по пересіченій місцевості, надаючи нашій піхоті необхідну безпосередню підтримку."

 NEE_Ensure_Clear_Skies: "Забезпечити чисте небо"
 NEE_Ensure_Clear_Skies_desc: "Оскільки значна частина промислової потужності Сполучених Штатів знаходиться під ворожим контролем на півдні та заході, нам доведеться підготувати більш надійні засоби захисту від будь-якого вторгнення ворожої авіації. Оскільки війна приходить до Нової Англії, ми повинні бути впевнені, що наші військові та цивільні залишатимуться в безпеці, щоб наше небо знову було чистим."

 NEE_Airbase_Construction: "Авіабаза армії Сіракузи"
 NEE_Airbase_Construction_desc: "Нашим військовим знадобиться спеціальна авіабаза, щоб наші літаки та пілоти були підготовлені, перш ніж їх відправлять захищати наше небо. Ми розбудуємо порожню ділянку площею 3500 парселів на північ від міста Сіракузи на авіабазу армії, де новобранці зможуть пройти базову підготовку, будуть випробовуватися літаки та зміцнюватися наші оборонні споруди."

 NEE_Bell_Contracts: "Контракти з Bell"
 NEE_Bell_Contracts_desc: "Корпорація Bell Aircraft у Баффало висловила зацікавленість у допомозі нам у нашій боротьбі. Будучи однією з найбільших авіаційних галузей у Новій Англії, підписання контрактів з Bell значно принесе користь їхньому розвитку літаків. Наш уряд організує контракти з Bell, щоб забезпечити оснащення наших військово-повітряних сил найновішими літаками Bell, щоб допомогти нам домінувати в небі."

# Shared Tree #
 NEE_Entrenchement_Tactics: "Тактика окопування та передислокації"
 NEE_Entrenchement_Tactics_desc: "Америка — географічно різноманітна країна, деякі райони якої важко забезпечувати та захищати. Ми повинні забезпечити наші дивізії належними логістичними можливостями та їхньою здатністю швидко встановлювати оборону в будь-якій точці нашої великої нації."

 NEE_Underground_Railroad: "Розширити підпільну залізницю"
 NEE_Underground_Railroad_desc: "Мало хто задоволений урядом на півдні. Як і наші діди в епоху рабства, ми допоможемо тим, кого переслідують південні зрадники, прийти на північ, до свободи."

 NEE_Behind_Enemy_Lines: "У тилу ворога"
 NEE_Behind_Enemy_Lines_desc: "Як і Джон Браун, ми відправимо патріотів на південь, щоб поширювати звістку про наближення визволення. Вони надихатимуть на повстання та налаштовуватимуть людей проти тиранів, які ними керують. Коли прийде час, вони допоможуть повалити фальшивий уряд!"

 NEE_Synthetic_Oil: "Боротьба з дефіцитом нафти"
 NEE_Synthetic_Oil_desc: "Жахлива ситуація з паливом в Антанті змушує нас постійно шукати надійне вирішення цієї проблеми. Дослідники з усієї Британської імперії, а тепер і з Ліги Плюща, наполегливо працюють, щоб Нова Англія не впала лише через дефіцит."

 NEE_Tank_Destroyers: "Доктрина винищувачів танків"
 NEE_Tank_Destroyers_desc: "Наш військовий штаб усвідомив важливість танків у сучасному конфлікті та важливість протитанкових заходів. Молодші офіцери військового штабу наполягали на модифікації існуючих моделей танків на швидші та маневреніші типи, зберігаючи при цьому сильні пробивні здібності, щоб швидко іммобілізувати та дезорганізувати ворожі танки."

 NEE_Tank_Destroyers_idea: "Доктрина винищувачів танків"

 NEE_Main_Battle_Tanks: "Основні бойові танки"
 NEE_Main_Battle_Tanks_desc: "Наші військові інтенсивно вивчали танкові традиції в Комуні Франції та Німецькій імперії та різні школи танкової доктрини. У той час як деякі танки розроблені для підтримки піхоти, інші призначені для використання у власних формуваннях. Прихильники танків у наших військових запропонували нам прийняти танки, які поєднують підтримку піхоти, а також діють самостійно."

 NEE_Main_Battle_Tanks_idea: "Арсенал Шенектаді"

 NEE_M7_Designs: "Проєкти M7"
 NEE_M7_Designs_desc: "Наші армійські спостерігачі відзначили, що нам потрібна самохідна артилерійська установка з достатньою вогневою міццю для підтримки броньованих операцій. Встановивши 105-мм гаубицю на шасі легкого танка, ми матимемо неперевершену мобільну артилерійську підтримку, що дасть нам вогневу міць і швидкість, необхідні для підтримки наших танків."

 NEE_M10_Designs: "Проєкти M10"
 NEE_M10_Designs_desc: "Наші військові усвідомили, що протитанкова зброя ефективна проти швидких мобільних танкових формувань, які здійснюють концентровану атаку. Щоб протистояти цьому, деякі наші військові запропонували прийняти 3-дюймову гармату на шасі середнього броньованого транспортного засобу. Винищувач танків M10, що наголошує на швидкості та вогневій міці, а не на броні, дозволить нам діяти агресивно та використовувати тактику засідки, щоб перетворити ворожі танки на руїни."

 NEE_Modern_Tank_Development: "Місцевий розвиток танків"
 NEE_Modern_Tank_Development_desc: "Сполучені Штати завжди нехтували розвитком танків. Наші спостерігачі помітили сильні сторони як у важкоброньованих піхотних танках, так і в легших, швидших, крейсерських танках наших британських союзників. Проте, дехто вимагає, щоб ми звернули увагу на гібридний дизайн, намагаючись взяти найкраще з обох проєктів."

 NEE_A15_Ram: "Співпраця з A15 «Рем»"
 NEE_A15_Ram_desc: "Інженери та вчені Британської імперії довгий час експериментували з новими способами механізованої війни, і спільна програма розробки танків усією Імперією об’єднала свої сили для розробки так званого танка A15 «Рем». Нам бракує знань про розробку танків, але вони надали нам можливість приєднатися до них у проєктуванні та створенні цього нового транспортного засобу."

 NEE_Schenectady_Industrial_Area: "Промислова зона Шенектаді"
 NEE_Schenectady_Industrial_Area_desc: "Шенектаді, розташований за шістнадцять миль на північний захід від Олбані, є однією з найбільших електричних майстерень у Сполучених Штатах. Хоча тут є заводи American Locomotive Company, Шенектаді також є домом для електротехнічної промисловості, де можна виготовляти радіостанції та радари. Оскільки наша нація розпалює свою промисловість для майбутніх битв, ми згуртуємо охочих чоловіків і жінок для роботи на заводах, щоб забезпечити нашим хлопцям у полі інструменти, необхідні для перемоги."

 NEE_Redevelop_Upstate: "Перепланувати північну частину штату Нью-Йорк"
 NEE_Redevelop_Upstate_desc: "Оскільки велика кількість робітників починає прямувати до промислових центрів, таких як Шенектаді, починає відчуватися тягар нашої вже виснаженої інфраструктури та систем громадського транспорту. Нам доведеться докласти великих зусиль для реорганізації інфраструктури регіону, щоб підвищити ефективність нашої військової машини та забезпечити швидке потрапляння наших робітників і військ туди, де вони потрібні."

 NEE_Radar_and_Sonar_Development: "Розробки радара та сонара"
 NEE_Radar_and_Sonar_Development_desc: "Досягнення в радіо та підводних сигналах призвели до прийняття та розробки радара та сонара відповідно. За допомогою цих нових інструментів ми можемо виявляти ворожі літаки до того, як вони будуть над нами, і сканувати моря на наявність ворогів, прихованих далеко під хвилями. Військові та флот рекомендували нам розширити Військово-морський підводний військовий центр у Нью-Лондоні, щоб збільшити наше застосування та розробити ці нові пристрої, щоб бути на крок попереду наших ворогів."

 NEE_Portsmouth_Dockyard: "Розширити верф Портсмута"
 NEE_Portsmouth_Dockyard_desc: "Заснована в 1800 році президентом Джоном Адамсом, Портсмутська верф завжди мала велику суднобудівну традицію. Тут були побудовані одні з перших і найкращих кораблів колишнього флоту Сполучених Штатів, що є свідченням давніх морських традицій Нової Англії. З огляду на конфлікт, ми розширимо верф, щоб розмістити сучасні військові кораблі та збільшити кількість робочих місць для цивільних, що дозволить нам реалізувати наш справжній військово-морський потенціал."

 NEE_Signals_Department: "Відділ зв'язку"
 NEE_Signals_Department_desc: "Оскільки війська стають все більш механізованими, а бойові дії зосереджуються на операціях загонів, нам доведеться значно покращити наш зв’язок. Війни більше не ведуться лініями та окопами, а підрозділи, що швидко рухаються, повинні підтримувати постійний зв’язок один з одним, щоб ефективно координувати дії. Окрім розширення відділу зв’язку та надання радіостанцій якомога більшій кількості загонів, ми також приймемо для солдатів кольорові димові гранати M18."

 NEE_Schenectady_Research_Workshop: "Дослідницька майстерня Шенектаді"
 NEE_Schenectady_Research_Workshop_desc: "Найбільша електронна майстерня у світі, Дослідницька майстерня Шенектаді, буде розширена для збільшення наших дослідницьких можливостей, щоб випередити наших ворогів. Наша інженерна майстерність буде посилена подальшим розвитком дослідницьких відділів. Ми використаємо історичну роль Нової Англії в американській академії, запрошуючи дослідників, професорів та вчених Ліги Плюща використовувати свої академічні здібності для військових зусиль."

 NEE_General_Electric_Propulsion: "Пропульсивна установка General Electric"
 NEE_General_Electric_Propulsion_desc: "За допомогою компанії General Electric нам надали можливість збільшити швидкість наших кораблів. Вони запропонували надати своє ефективне дослідження турбоелектричного приводу для вдосконалення наших суден. Оскільки наше дослідження ефективних гребних систем стає все більш досконалим, ми можемо розраховувати на їхню допомогу у встановленні цих турбінних гвинтів на наші надводні судна."

# Kenney Tree #
 NEE_Expand_Armed_Forces: "План мобілізації Кенні"
 NEE_Expand_Armed_Forces_desc: "Через дещо радикальну та суперечливу позицію, враховуючи той факт, що більшість вищого командування має військово-морську освіту, генерал Джордж Кенні вважає, що найкращий план Нової Англії для перемоги в наступальних операціях — це розпочати швидкий процес переозброєння, залучивши жінок на заводи, звільнивши чоловіків для служби на передовій. Його план також закликає до координації високоінтенсивної авіаційної підтримки, щоб допомогти прорвати лінії ворога."

 NEE_Lowel_Munition_Factory: "Лоуеллська фабрика боєприпасів"
 NEE_Lowel_Munition_Factory_desc: "Щоб допомогти нашим виробникам зброї та забезпечити постійне постачання боєприпасів для наших військ на фронті, розроблено плани щодо фінансування створення нового заводу боєприпасів у місті Лоуелл, штат Массачусетс, яке сильно постраждало від Великої депресії, залишивши 40% населення без роботи. Знову наближається війна, і люди матимуть роботу, допомагаючи нам відновити нашу промислову міць."

 NEE_New_England_Dockyards: "Верфі Нової Англії"
 NEE_New_England_Dockyards_desc: "Як і «стара» Англія, наше майбутнє лежить на великій синяві перед нами — Нова Англія є домом для традиційної, але яскравої військово-морської традиції. Ми повинні розширити наші суднобудівні потужності, розвідавши землю вздовж узбережжя для будівництва нових об'єктів для таких компаній, як Electric Boat, щоб допомогти виробляти судна для нашого флоту. У нас є два об'єкти, що становлять інтерес, у Ґротоні, штат Коннектикут, і Гінгемі, штат Массачусетс."

 NEE_Women_In_Factories: "Жінки на заводи"
 NEE_Women_In_Factories_desc: "Оскільки все більше придатних молодих чоловіків залучаються до наших зростаючих збройних сил, кількість робітників на наших промислових підприємствах також почала зменшуватися. Щоб протидіяти цьому, ми повинні почати розглядати можливість їхньої заміни нашим великим невикористаним резервом робочої сили молодих жінок."

 NEE_Arsenal_of_Democracy: "Арсенал демократії"
 NEE_Arsenal_of_Democracy_desc: "Протягом багатьох років ми пишалися нашою здатністю дистанціюватися від справ Європи, знаючи, що ми в безпеці завдяки широким просторам Тихого та Атлантичного океанів. Однак, з початком тотальної війни на нашому власному континенті, ми змушені переоцінити наше становище у світі. Повністю мобілізувавши народ і країну [NEE.GetNameDef], ми можемо впевнено заявити, що ми справді є арсеналом демократії для націй вільного світу."

 NEE_Norwich_University: "Норвіцький університет"
 NEE_Norwich_University_desc: "Норвіцький університет у Вермонті є найстарішим військовим коледжем у Сполучених Штатах і місцем народження Корпусу підготовки офіцерів запасу (ROTC). Оскільки ми зараз опинилися втягнутими у війну, ми розширимо університет, щоб розмістити більше студентів і забезпечити оновлення його навчальної програми, щоб наші офіцери були добре навчені та відповідали рівню решти світу."

 NEE_Modernize_West_Point: "Модернізувати навчальну програму Вест-Пойнта"
 NEE_Modernize_West_Point_desc: "Востаннє офіційно брав участь у бойових діях з часів Іспансько-американської війни, військова навчальна програма у Вест-Пойнті дещо відстала. Хоча спостерігачі вивчали Вельткріґ у Європі, багато тактик та доктрин, що практикуються, все ще дещо застарілі. Ми докладемо зусиль для модернізації шкільної програми, щоб забезпечити, щоб єдина військова офіцерська школа США, що залишилася, залишалася на вершині свого класу."

 NEE_Encourage_Attack_Aviation: "Розвивати штурмову авіацію"
 NEE_Encourage_Attack_Aviation_desc: "Спираючись на досвід Джорджа Кенні, який спостерігав за повітряним боєм наприкінці Вельткріґу, він вважає, що ключ до успіху в наступній війні полягатиме в авіації, яка буде готова завдати удару по цілях, які зазвичай сповільнюють наступ армії."

 NEE_Victory_Through_Airpower: "Перемога через повітряну міць"
 NEE_Victory_Through_Airpower_desc: "Наступна війна буде виграна з неба. Хоча технології не було під час більшої частини Вельткріґу, спостерігачі у Франції наприкінці конфлікту побачили потенціал. Зі швидким прогресом у повітряних технологіях, великі бомбардувальники, здатні до подорожей на великі відстані, тепер можуть виконувати місії глибоко у вороже серце, щоб пошкодити або знищити військові об'єкти чи заводи, що виробляють військове обладнання для ворога!"

 NEE_Consolidated_Contracts: "Контракти з Consolidated"
 NEE_Consolidated_Contracts_desc: "У наших зусиллях зміцнити вогневу міць з неба та покращити існуючі моделі у військово-повітряних силах Нової Англії, ми укладемо контракти з Consolidated. Відома в довоєнні роки своїми літаючими човнами, Consolidated висловила зацікавленість у співпраці з нашим урядом, щоб забезпечити нашу допомогу в розробці їхніх нових бомбардувальників. З цими новими бомбардувальниками ми зможемо запропонувати підтримку нашим військам та атакувати стратегічні потреби ворога з повітря."

 NEE_Infantry_Support_Breakthroughs: "Прориви в підтримці піхоти"
 NEE_Infantry_Support_Breakthroughs_desc: "Вельткріґ переконливо довів, що відправлення масових хвиль піхоти в м'ясорубку не виграє битв, тим більше війну. Вони повинні мати добре продуманий набір допоміжних підрозділів, щоб воювати, використовуючи тактику комбінованої зброї, щоб ефективно розгромити ворога."

 NEE_Fleet_Air_Arm: "Спадщина рейнджера"
 NEE_Fleet_Air_Arm_desc: "Хоча дехто вважає, що вогнева міць дредноутів вирішує долю хвиль, наше військово-морське командування вважає, що розгортання військово-морської авіації в боях виграє битви. Оскільки ми контролюємо велику Бостонську військово-морську верф, місце народження USS Ranger, ми зможемо реалізувати нашу традицію будівництва кораблів за допомогою цієї великої верфі. З можливостями та робочою силою верфі ми побудуємо нову лінію авіаносців, як-от «Леді Лекс», щоб допомогти нам домінувати на хвилях."

# American Civil War #
 NEE_Southern_Fire: "Південний вогонь"
 NEE_Southern_Fire_desc: "Поки інші питання відволікали нашу увагу одразу після створення Республіки Нова Англія на початку другої Американської громадянської війни, ситуація вдома стабілізувалася. Ми більше не можемо ігнорувати шалене пекло, яке поглинає решту Америки. Народ повинен готуватися до боротьби, що насувається."

 NEE_GD_low_enough_tt: "Наслідки §YВеликої депресії§! починають згасати."
 NEE_GD_low_enough_2_tt: "Наслідки §YВеликої депресії§! продовжують згасати."

 NEE_no_reluctant_populace_tt: "Небажання брати участь у громадянській війні вщухло"

 NEE_War_Production_Board: "Рада з військового виробництва"
 NEE_War_Production_Board_desc: "Щоб бути готовими до конфлікту, ми повинні сформувати раду промисловців, щоб організувати належне перетворення цивільного виробництва на товари військового часу. Армія потребує гвинтівок та боєприпасів для боротьби. А не тостерів!"

 NEE_Streamline_Garand_Production: "Оптимізувати виробництво гвинтівок"
 NEE_Streamline_Garand_Production_desc: "Оскільки гвинтівка з маркуванням M1 перебуває на різних випробуваннях протягом багатьох років, експерти запропонували змінити конструкцію ствола, газового циліндра та вузла переднього прицілу, щоб зробити Гаранд ще більш надійною та смертоносною зброєю."

 NEE_Forge_of_Democracy: "Кузня демократії"
 NEE_Forge_of_Democracy_desc: "Нова Англія була домом для одних із найстаріших заводів, які були засновані в Сполучених Штатах під час промислової революції. Спрінґфілдська збройова палата відіграла вирішальну роль у першій громадянській війні, випереджаючи виробництво Конфедерації майже у 32 до 1. Хоча важливі арсенали, такі як Харперс-Феррі та арсенал Рок-Айленд, знаходяться в руках ворога, найстаріша кузня американської зброї все ще яскраво горить!"

 NEE_All_American_Lease_Act: "Загальноамериканський закон про позику"
 NEE_All_American_Lease_Act_desc: "[NEE_AALA_desc]"

 NEE_AALA_USA_desc: "Оскільки вогонь війни охоплює Америку, ми несемо відповідальність перед тими, хто в [USA.GetName]. Хоча полум'я може виглядати далеким від нашого кордону, воно активно облизує фарбу їхнього будинку. Тримати наш пожежний рукав для себе було б егоїстично і поставило б їх під загрозу. Тому ми також повинні бути щедрими з нашими надлишковими військовими матеріалами, які не потрібні на внутрішньому фронті."
 NEE_AALA_ACC_desc: "Оскільки вогонь війни охоплює Америку, ми несемо відповідальність перед тими, хто в [ACC.GetName]. Хоча полум'я може виглядати далеким від нашого кордону, воно активно облизує фарбу їхнього будинку. Тримати наш пожежний рукав для себе було б егоїстично і поставило б їх під загрозу. Тому ми також повинні бути щедрими з нашими надлишковими військовими матеріалами, які не потрібні на внутрішньому фронті."
 NEE_AALA_APG_desc: "Оскільки вогонь війни охоплює Америку, ми несемо відповідальність перед тими, хто в [APG.GetName]. Хоча полум'я може виглядати далеким від нашого кордону, воно активно облизує фарбу їхнього будинку. Тримати наш пожежний рукав для себе було б егоїстично і поставило б їх під загрозу. Тому ми також повинні бути щедрими з нашими надлишковими військовими матеріалами, які не потрібні на внутрішньому фронті."
 #Just a backup description:
 NEE_AALA_generic_desc: "Оскільки вогонь війни охоплює Америку, ми несемо відповідальність перед тими, кого ми підтримуємо. Хоча полум'я може виглядати далеким від нашого кордону, воно активно облизує фарбу їхнього будинку. Тримати наш пожежний рукав для себе було б егоїстично і поставило б їх під загрозу. Тому ми також повинні бути щедрими з нашими надлишковими військовими матеріалами, які не потрібні на внутрішньому фронті."

 NEE_AALA_cat: "Загальноамериканська програма ленд-лізу"
 NEE_AALA_cat_desc: "Через те, що друга Американська громадянська війна вирує, безпека демократії в регіоні знаходиться під загрозою. Нездатність співпрацювати та перемогти різні протиборчі фракції може принести §Rостанній цвях у труну американської демократії§!! Щоб запобігти цьому, президент Нової Англії підписав закон «§CЗагальноамериканський закон про позику§!», який дозволяє [NEE.GetName] надсилати військові матеріали воюючим сторонам в Америці, які борються за захист демократії.\n\nОскільки [NEE.GetName] збирає £GFX_mil_factory  §Gвійськові заводи§!, вони можуть почати відправляти свою продукцію за кордон тим, хто стоїть на захисті демократії у громадянській війні. Кожного разу, коли ми виділяємо фабрику на §CЗагальноамериканську програму позики§!, ми §Rзменшуємо§! кількість обладнання, яке ми можемо виробляти та зберігати локально. Однак, завдяки тісному контакту між нашими виробниками та нашим союзником у громадянській війні, ми поступово отримуватимемо знання про те, як §Gпокращити§! наші доктрини та обладнання, щоб боротися ефективніше."

 NEE_Resource_Allocation: "Управління розподілом ресурсів"
 NEE_Resource_Allocation_desc: "Відрізані від великих частин багатих американських земель, зараз, як ніколи раніше, ми повинні прагнути використовувати все, що маємо, на повну силу! По всій країні будуть розпочаті кампанії з переробки відходів для збору необхідних матеріалів для наших виробників."

 NEE_Limited_Emergency: "Статут обмеженого надзвичайного стану"
 NEE_Limited_Emergency_desc: "Ситуація на нашому південному кордоні розвивається не зовсім на нашу користь. Коли наші брати та сестри зіткнулися на полі бою, їхні уряди викликають все більше і більше дивізій для боротьби. Наша обмежена сила блідне в порівнянні."

 NEE_Selective_Training_Act: "Закон про вибіркове навчання"
 NEE_Selective_Training_Act_desc: "Хоча ми цінуємо всіх, хто зголосився служити Сполученим Штатам, прогнози на наступну війну величезні. Щоб повністю заповнити необхідні дивізії, ми повинні організувати призов обмеженого конскрипції для наших працездатних молодих чоловіків."

 NEE_Reassess_American_Involvement: "Переоцінити американську участь"
 NEE_Reassess_American_Involvement_desc: "[NEE_Reassess_Support_desc]"

 NEE_RS_USA_desc: "Оскільки наші союзники в [USA.GetName] почали хитатися, дехто в уряді бачить у цьому можливість для Нової Англії ствердити свій статус справжньої держави-наступниці Америки. Однак нам потрібно буде переконати уряд у [CAN.Capital.GetCapitalVictoryPointName], що ресурси Антанти краще використовувати для нашої армії, а не для [USA.GetName]."
 NEE_RS_ACC_desc: "Оскільки наші союзники в [ACC.GetName] почали хитатися, дехто в уряді бачить у цьому можливість для Нової Англії ствердити свій статус справжньої держави-наступниці Америки. Однак нам потрібно буде переконати уряд у [CAN.Capital.GetCapitalVictoryPointName], що ресурси Антанти краще використовувати для нашої армії, а не для [ACC.GetName]."
 NEE_RS_APG_desc: "Оскільки наші союзники в [APG.GetName] почали хитатися, дехто в уряді бачить у цьому можливість для Нової Англії ствердити свій статус справжньої держави-наступниці Америки. Однак нам потрібно буде переконати уряд у [CAN.Capital.GetCapitalVictoryPointName], що ресурси Антанти краще використовувати для нашої армії, а не для [APG.GetName]."
 NEE_RS_generic_desc: "Оскільки наші союзники в Америці почали хитатися, дехто в уряді бачить у цьому можливість для Нової Англії ствердити свій статус справжньої держави-наступниці Америки. Однак нам потрібно буде переконати уряд у [CAN.Capital.GetCapitalVictoryPointName], що ресурси Антанти краще використовувати для нашої армії, а не для наших союзників."
 NEE_RS_alone_desc: "Ми мудро утримувалися від початкового спалаху бойових дій навесні 1937 року. Це дозволило нашому народу наростити силу без постійного виснаження війною. Проте тепер ми навряд чи можемо стояти осторонь, поки Америка падає перед тими, хто знищить її ідентичність. Ми повинні готуватися до того, щоб самим взяти участь!"

 NEE_War_Bonds: "Військові облігації"
 NEE_War_Bonds_desc: "Пропаганда є вирішальним ресурсом у часи війни. Наш народ спочатку утримувався від війни, сподіваючись зберегти свій нейтралітет та уникнути кровопролиття громадянської війни. Нещадна кампанія повинна бути розпочата, щоб вселити патріотизм та енергію в свідомість нашого народу, щоб кожен відігравав свою роль у військових зусиллях."

 NEE_Flying_For_Freedom: "Літуни свободи"
 NEE_Flying_For_Freedom_desc: "За допомогою повітряних куль, бомбардувальників і навіть звичайного винищувача, ініціатива «Літуни свободи» була доручена літати глибоко над ворожою територією, щоб вести не фізичну, а психологічну війну, сподіваючись активізувати опір у решті Америки."

 NEE_Operation_Pointblank: "Операція «Точка впритул»"
 NEE_Operation_Pointblank_desc: "Досвід, отриманий у результаті спостереження за другою Американською громадянською війною, показав нам силу дальніх бомбардувальників. Ретельно сплановані наступальні дії бомбардувальників мають можливість завдати серйозної шкоди серцевині ворога. Старші планувальники вже почали розробляти плани нападу на кілька ключових міст Сталевого поясу на випадок початку бойових дій з [395.Owner.GetNameDef]."

 NEE_Expand_NEEF: "Новоанглійський експедиційний корпус"
 NEE_Expand_NEEF_desc: "[NEE_NEEF_desc]"

 NEE_NEEF_USA_desc: "Оскільки ми продовжуємо підтримувати обрану нами сторону у другій Американській громадянській війні, деякі військові яструби закликають до збільшення Новоанглійського експедиційного корпусу, який бореться на полях Америки за [USA.GetName]. З більшою кількістю солдатів на землі експедиційний корпус буде більш здатним проводити незалежні операції, не покладаючись на місцеву підтримку від [USA.GetName]."
 NEE_NEEF_ACC_desc: "Оскільки ми продовжуємо підтримувати обрану нами сторону у другій Американській громадянській війні, деякі військові яструби закликають до збільшення Новоанглійського експедиційного корпусу, який бореться на полях Америки за [ACC.GetName]. З більшою кількістю солдатів на землі експедиційний корпус буде більш здатним проводити незалежні операції, не покладаючись на місцеву підтримку від [ACC.GetName]."
 NEE_NEEF_APG_desc: "Оскільки ми продовжуємо підтримувати обрану нами сторону у другій Американській громадянській війні, деякі військові яструби закликають до збільшення Новоанглійського експедиційного корпусу, який бореться на полях Америки за [APG.GetName]. З більшою кількістю солдатів на землі експедиційний корпус буде більш здатним проводити незалежні операції, не покладаючись на місцеву підтримку від [APG.GetName]."
 NEE_NEEF_generic_desc: "Оскільки ми продовжуємо підтримувати обрану нами сторону у другій Американській громадянській війні, деякі військові яструби закликають до збільшення Новоанглійського експедиційного корпусу, який бореться на полях Америки як добровольці. З більшою кількістю солдатів на землі експедиційний корпус буде більш здатним проводити незалежні операції, не покладаючись на місцеву підтримку від нашого союзника."

 NEE_Expand_NEEF_tt: "Завершення цього фокусу дозволить нам надіслати §Yдобровольців§! нашому американському союзнику"

 NEE_Joint_American_Research: "Спільні американські дослідження"
 NEE_Joint_American_Research_desc: "[NEE_JAR_desc]"

 NEE_JAR_USA_desc: "Вельткріґ показав світові, як великомасштабна війна має потенціал для прискорення наукових досліджень. Щоб краще підготувати себе та наших союзників у [USA.GetName] до поточної війни в Америці, Нова Англія ініціює новий проєкт, щоб розмістити вчених з обох сторін для обміну технологічними проривами."
 NEE_JAR_ACC_desc: "Вельткріґ показав світові, як великомасштабна війна має потенціал для прискорення наукових досліджень. Щоб краще підготувати себе та наших союзників у [ACC.GetName] до поточної війни в Америці, Нова Англія ініціює новий проєкт, щоб розмістити вчених з обох сторін для обміну технологічними проривами."
 NEE_JAR_APG_desc: "Вельткріґ показав світові, як великомасштабна війна має потенціал для прискорення наукових досліджень. Щоб краще підготувати себе та наших союзників у [APG.GetName] до поточної війни в Америці, Нова Англія ініціює новий проєкт, щоб розмістити вчених з обох сторін для обміну технологічними проривами."
 NEE_JAR_generic_desc: "Вельткріґ показав світові, як великомасштабна війна має потенціал для прискорення наукових досліджень. Щоб краще підготувати себе та наших союзників в Америці до поточної війни в Америці, Нова Англія ініціює новий проєкт, щоб розмістити вчених з обох сторін для обміну технологічними проривами."

 NEE_Americas_Darkest_Hour: "Найтемніша година Америки"
 NEE_Americas_Darkest_Hour_desc: "Оскільки решта Сполучених Штатів охоплена війною, Новій Англії вдалося стати безпечною гаванню у штормі хаосу. Ми повинні запевнити тих, хто знаходиться в наших кордонах, що тимчасовий уряд — їхня єдина надія на свободу та безпеку."

 NEE_Remember_Lexington_and_Concord: "Пам'ятати Лексінгтон і Конкорд"
 NEE_Remember_Lexington_and_Concord_desc: "Тут, у нашому куточку Сполучених Штатів, пролунали перші постріли, які відгукнулися по всьому світу ще в 1775 році. Наші предки були готові взятися за зброю, щоб захистити свої права від перевищення повноважень британського уряду по той бік Атлантики. Так само повинні вчинити і ми під час тривожних часів, які нависають над нашим обрієм. Незабаром може настати нагода, коли уряд, що вижив у громадянській війні у Вашингтоні, повернеться на Північ не з позицією примирення, а з позицією ворожості."

 NEE_Propaganda_Campaigns: "Пропагандистські кампанії"
 NEE_Propaganda_Campaigns_desc: "По американському континенту ширяють небезпечні ідеї, такі як ідеї синдикалістських революціонерів та автократів, які бажають підірвати нашу демократію. У ці відчайдушні часи американці виявляться сприйнятливими до хибних ідей і уявлень; і лише ми можемо направити їх до істини. Ми докладемо зусиль, щоб показати, що американці знають, що ми є легітимним урядом, який обіцяє дотримуватися обіцянок, даних Конституцією."

 NEE_Victory_Gardens: "Сади перемоги"
 NEE_Victory_Gardens_desc: "Без хлібного кошика Великих рівнин наша нація зіткнеться з труднощами, щоб прогодувати як цивільне населення, так і військових. Ми заохочуватимемо цивільний фронт до вирощування овочів у власних садах, щоб знизити ціну на овочі, необхідні для годування наших хлопців. З більшою кількістю «безм’ясних понеділків» наші громадяни із задоволенням споживатимуть плоди праці, а наші військові оцінять гроші, які можна витратити на інші потреби для підтримки військових зусиль."

 NEE_Second_Declaration_of_Independence: "Друга декларація незалежності"
 NEE_Second_Declaration_of_Independence_desc: "Тимчасовий уряд Нової Англії був створений Канадою, це правда, але тепер ми достатньо сформовані, щоб стати на власні ноги. Якщо тільки причина втручання Канади не така, як вони припускали, і вони мають більш підступні наміри...?"

 NEE_The_Ladys_Promise: "Дотриматися обіцянки Леді"
 NEE_The_Ladys_Promise_desc: "Америка завжди була притулком для втомлених, бідних, скупчених мас, які прагнуть вільно дихати від гніту, нав'язаного їм іноземними правителями за кордоном. Хоча Леді та її світильник можуть бути за лінією фронту ворога, ми можемо підтримувати її вогонь і продовжувати доводити світові, що хоча Америка, можливо, спіткнулася, її двері не зачинені!"

 NEE_Joint_Effort_Programs: "Програми спільних зусиль"
 NEE_Joint_Effort_Programs_desc: "Готуючись до майбутньої бурі, необхідно розширити військовий та промисловий потенціал нашої нації. Ми будемо шукати навчальні вправи для сухопутних, військово-морських та повітряних сил Нової Англії та спільний проєкт індустріалізації з нашими союзниками по Антанті. Ці спільні програми співпраці зміцнять нас і прагнутимуть покращити наші зв'язки з нашими північними канадськими сусідами."

# WW2 - Naval Tree
 NEE_Steal_Higgins_Blueprints: "Викрасти креслення Гіґґінса"
 NEE_Steal_Higgins_Blueprints_desc: "Майбутнє десантних вторгнень буде зосереджено на більшій координації між військово-морськими та сухопутними силами для успішного захоплення укріплених плацдармів. Щоб забезпечити успішне потрапляння наших військ на пляжі, ми вдосконалимо наші існуючі десантні кораблі. Це гарантує, що вони будуть достатньо міцними, щоб витримувати пробиття кулями та працювати на такій місцевості, як болота, дозволяючи нашим людям безпечно висаджуватися на берег."

 NEE_Liberty_Ships: "Проєкт верфей суден «Ліберті»"
 NEE_Liberty_Ships_desc: "З неминучою війною в Європі та амбіціями Антанти здійснити найбільшу військово-морську операцію в історії людства, верфі Нової Англії працюють понаднормово, щоб задовольнити зростаючі потреби альянсу. Щоб ще більше збільшити наш випуск, урядом була створена централізована схема будівництва для керівництва подальшим розширенням цих верфей."

 NEE_Electric_Boat_Contracts: "Контракти з Electric Boat"
 NEE_Electric_Boat_Contracts_desc: "Заснована в 1899 році Ісааком Райсом, компанія Electric Boat допомогла ввести в експлуатацію перші підводні човни ВМС США. Оскільки військово-морська війна сьогодні стає дедалі важливішою, ми підпишемо контракти з компанією, щоб забезпечити наявність у нас найсучасніших підводних човнів для переслідування ворога з-під хвиль."

 NEE_Prefab_Ports: "Проєкти збірних портів"
 NEE_Prefab_Ports_desc: "Забезпечення належної лінії постачання на плацдарм є життєво важливим для успіху наших військ у будь-якій висадці, в якій вони беруть участь. Іноді нам може знадобитися застосувати значну силу проти захисників пляжу, що залишає порт у непридатному стані для висадки припасів. Наші інженери повинні бути здатні швидко працювати, щоб або відремонтувати існуючу інфраструктуру, або завезти збірні частини для будівництва нового порту для наших людей."

 NEE_Improved_Supply_Lines: "Покращені лінії постачання"
 NEE_Improved_Supply_Lines_desc: "Оскільки наші морські та сухопутні сили діють більш скоординовано, ми повинні підтримувати суворий стиль організації, щоб забезпечити добре постачання наших військ. Ми зробимо кроки для покращення наших ліній постачання, щоб забезпечити надходження пайків та боєприпасів до наших людей на полі бою."

 NEE_Yank_Can_Council: "Спільне командування Янкі-Канада"
 NEE_Yank_Can_Council_desc: "Без жодного значного досвіду у війні з часів Іспансько-американської війни, наш командний штаб, на жаль, відстає, коли справа доходить до затяжної тотальної війни, як це було у Вельткріґу. За допомогою вигнанців та Канади ми сформуємо спільну багатонаціональну раду для планування того, як ефективно вести війну. Хоча дехто може розглядати це як наше падіння до ніг канадців, ми повинні звернути увагу на переваги постійної співпраці між нашими двома націями!"

 NEE_Gato_Subs: "Підводні човни класу «Ґато»"
 NEE_Gato_Subs_desc: "Багато наших ворогів покладаються на довгі судноплавні лінії для імпорту життєво важливих військових матеріалів для підтримки своєї економіки. Завдяки сучасному дизайну та належній тактиці, зграї підводних човнів можуть бути використані для повільного задушення можливостей ворогів виробляти зброю вдома. Якщо ми зможемо контролювати їхній доступ до світових ресурсів, ми матимемо вирішальну перевагу в конфлікті!"

 NEE_Bell_Heavy_Fighters: "Програма винищувачів P39"
 NEE_Bell_Heavy_Fighters_desc: "Bell Aircraft звернулася до наших Військово-повітряних сил із своїм новим проєктом літака: P-39. Літак незвичайний тим, що його двигун встановлений у центральній частині фюзеляжу та оснащений триколісним шасі. Літак також підходить лише для середніх та нижніх висот. Попри ці особливості, випробування пройшли добре, і наше командування прагне прийняти P39 на озброєння, щоб збільшити нашу повітряну міць."

 NEE_Consolidated_Naval_Bombers: "Морські бомбардувальники Consolidated PBY «Ліберейтор»"
 NEE_Consolidated_Naval_Bombers_desc: "Оскільки нашим Військово-повітряним силам бракує гідролітаків, здатних конкурувати з нашими суперниками, Військово-повітряні сили звернулися до Consolidated з проханням побудувати патрульний літаючий човен зі збільшеним радіусом дії та міцнішими крилами, ніж старі моделі. Здатний виконувати протичовнові операції, супровід конвоїв, повітряно-морське рятування та перевезення вантажів — літак добре показав себе у випробуваннях. Деякі варіанти були пофарбовані в чорний колір для нічних операцій, що дало їм прізвисько «Чорні коти»."

 NEE_Fletcher_Destroyers: "Есмінці класу «Флетчер»"
 NEE_Fletcher_Destroyers_desc: "Названий на честь адмірала Френка Фрайдея Флетчера, цей новий клас есмінців зможе протистояти будь-яким іноземним проєктам, які ворог може кинути проти нас. Завдяки значному збільшенню вогневої міці, міцності корпусу та протиповітряних можливостей, клас «Флетчер» стане порятунком для нашого флоту. Здатний виконувати широкий спектр ролей, ми прогнозуємо, що він стане безцінним у війні."

 NEE_Damage_Control: "Контроль пошкоджень"
 NEE_Damage_Control_desc: "Як довго ви можете триматися на плаву? Запобігайте необхідності дізнатися, вивчаючи всі найновіші заходи безпеки, які встановлюються на кораблях флоту Нової Англії. Були докладені великі зусилля для створення та навчання наших моряків найкращому способу реагування на надзвичайні ситуації в бою та уникнення втрати корабля через пожежу, залишену без уваги."

 NEE_Modular_Design: "Модульний дизайн корабля"
 NEE_Modular_Design_desc: "Зі зростанням нашого військово-морського виробництва зростає кількість закликів до проєктування наших суден більш модульним способом. Це допомогло б прискорити виробництво на верфях, дозволяючи робітникам спеціалізуватися на певній деталі, яку вони виготовляють для кількох кораблів. Додаткова перевага полягає в тому, що коли нове та більш досконале озброєння стане більш доступним, нам буде легше оснащувати наші кораблі сучасним обладнанням!"

 NEE_Anti_Submarine_Warfare: "Підводна війна"
 NEE_Anti_Submarine_Warfare_desc: "Оскільки наші морські та сухопутні сили діють більш скоординовано, ми повинні підтримувати суворий стиль організації, щоб забезпечити добре постачання наших військ. Ми зробимо кроки для покращення наших ліній постачання, щоб забезпечити надходження пайків та боєприпасів до наших людей на полі бою."

 NEE_Scouting_Cruisers: "Крейсери-розвідники"
 NEE_Scouting_Cruisers_desc: "Деякі теоретики, які вивчали британські проєкти, наполягають на тому, що літаки є майбутнім у морському бою. Їхня підвищена маневреність і швидкість дають їм можливість ефективно вести розвідку перед флотом, щоб знайти ворожі судна, які можуть лежати в засідці, щоб зненацька захопити конвой. Намагаючись включити цей дизайн, клас легких крейсерів «Бруклін» був побудований з урахуванням цього фактора, включаючи кілька катапульт для запуску літаків, щоб допомогти сканувати моря!"

 NEE_Dockyards_of_Democracy: "Верфі демократії"
 NEE_Dockyards_of_Democracy_desc: "Америка довгий час мала горду військово-морську традицію, успадковану від наших колишніх колоніальних володарів, Сполученого Королівства. З нашими кордонами, значною мірою захищеними до середини 19-го століття, ми звернулися до великої синяви як до нашого домену. На нашому піку крила Орла могли простягатися на понад десять тисяч миль від кінця до кінця! Хоча спалах другої Американської громадянської війни розірвав наш великий флот на шматки, ми не повинні забувати про нашу спадщину та прагнути відновити те, що було втрачено."

# Reconstruction #
 NEE_Remember_Appomattox: "Пам'ятати Аппоматтокс"
 NEE_Remember_Appomattox_desc: "Вдруге за останнє століття Америка пройшла через горнило громадянської війни. Брат воював проти брата, а батько проти сина. Жоден куточок Америки не залишився недоторканим у тій чи іншій формі в цьому конфлікті. Так само, як Ґрант дозволив конфедератам повернутися до своїх ферм, ми також закликали ворожих солдатів повернутися до своїх домівок, щоб почати зцілення."

 NEE_Appomattox: "Пом'якшена політика"

 NEE_Confiscate_The_Rifles: "Конфіскувати гвинтівки"
 NEE_Confiscate_The_Rifles_desc: "Хоча дехто може обурюватися цим наказом і посилатися на 2-гу поправку, ці самі гвинтівки вбивали синів і дочок сусідів у смертоносному конфлікті. Багато з цієї зброї можуть стати інструментом партизанів, які боротимуться проти нас у найближчі місяці чи роки."

 NEE_Confiscate: "Жорстка політика"

 NEE_Unheard_Voice: "Голос для нечуваних"
 NEE_Unheard_Voice_desc: "Ще до того, як жахи другої Американської громадянської війни сколихнули націю, багато хто відчував, що їхній голос не був почутий урядом. Підозри та недовіра допомогли розпалити насильство, яке розгорнулося в 1937 році. Ми спонсоруємо ініціативу, щоб заохотити американців надсилати листи урядовцям, щоб їхні занепокоєння могли бути оприлюднені."

 NEE_Labour_Standards_Act: "Закон про трудові стандарти [GetYear]"
 NEE_Labour_Standards_Act_desc: "Хоча радикальна риторика, яку пропагували Рід та його послідовники, допомогла розірвати нашу націю на частини, не можна заперечувати той факт, що наша нація гостро потребує трудової реформи. Допомагаючи відбудувати американську націю, ми зустрінемося з поміркованими профспілковими лідерами, ближчими до правого крила, придушеними під час існування [WCA.GetNameDef]. Ми будемо шукати їхньої співпраці, приймаючи законодавство на підтримку американського робітника."

 NEE_Labour_Standards_Act_idea: "Закон про трудові стандарти"

 NEE_Expand_Educational_Opportunities: "Розширити можливості освіти"
 NEE_Expand_Educational_Opportunities_desc: "У новій Америці кожен матиме доступ до справедливої та рівної освіти. Вища освіта більше не буде привілеєм лише для еліти та заможних. Для тих, хто не може дозволити собі ціни університетів та коледжів, будуть запропоновані стипендії та плата за навчання студентам, які вирішать служити в наших військових силах — відплата за їхню службу та патріотизм перед американською нацією."

 NEE_Expand_Educational_Opportunities_idea: "Розширені можливості освіти"

 NEE_Fight_Against_Jim_Crow: "Боротьба проти законів Джима Кроу"
 NEE_Fight_Against_Jim_Crow_desc: "Ми, можливо, боролися та перемогли за об'єднану Америку, але боротьба нашої нації навряд чи закінчена. Тиск з боку груп, таких як Братство портьє спальних вагонів на чолі з А. Філіпом Рендольфом, змусив Конгрес активно боротися з расовими упередженнями Джима Кроу. Вони наполягали на офіційному законодавстві про скасування податку на виборчі дільниці та пункту про діда, що перешкоджає голосуванню афроамериканців."

 NEE_Executive_Order_9808: "Виконавчий наказ 9808"
 NEE_Executive_Order_9808_desc: "Виконавчий наказ 9808, створений [NEE.GetLeader], офіційно створить комітет для вивчення стану громадянських прав у Сполучених Штатах, звітування про їхні висновки та подання рекомендацій щодо того, як уряд може покращити умови в Сполучених Штатах."

 NEE_American_Reconstruction_Act: "Американський акт про реконструкцію"
 NEE_American_Reconstruction_Act_desc: "Друга Американська громадянська війна спустошила країну. Повний масштаб військових дій далеко перевищив очікування багатьох громадян. По всій країні заводи були розбомблені, саботовані або демонтовані, оскільки різні воюючі сторони поступалися землею. «Американський акт про реконструкцію» сформує нову урядову агенцію для відбудови нації."

 NEE_Reconstruction: "Американський акт про реконструкцію"

 NEE_Reverse_Over_Militarisation: "Скасувати надмірну мілітаризацію"
 NEE_Reverse_Over_Militarisation_desc: "Коли вибухнула війна, багато заводів по всій країні поспішили переключити виробництво на випуск військових матеріалів для військових зусиль. З припиненням бойових дій у країні настав час допомогти власникам заводів перейти назад до цивільної продукції. Ці заводи краще підходять для допомоги у відбудові країни, ніж для виробництва гвинтівок та артилерійських знарядь."

 NEE_Connect_The_Nation: "З'єднати націю"
 NEE_Connect_The_Nation_desc: "Через збитки, завдані війною, значна частина інфраструктури по всій Америці перебуває в руїнах. Дороги, які спочатку були не в найкращому стані через тривалу депресію, тепер часто всіяні не лише випадковими вибоїнами. Щоб допомогти у відбудові охопленої війною Америки, ми направимо додаткове фінансування на відновлення інфраструктури."

 NEE_St_Louis_War_Memorial: "Військовий меморіал Сент-Луїса"
 NEE_St_Louis_War_Memorial_desc: "Незліченні натовпи американців загинули у вогні другої Американської громадянської війни з усіх боків. Ніде це не є настільки очевидним, як у місті Сент-Луїс у центрі країни. Спалах війни призвів до запеклих боїв на вулицях міста, оскільки кожна фракція намагалася захопити контроль над регіоном. Розташований на західному березі Міссісіпі, буде споруджено пам'ятник на згадку про всіх полеглих."

 NEE_War_Devastation_Relief_Agency: "Агенція з надання допомоги постраждалим від війни"
 NEE_War_Devastation_Relief_Agency_desc: "Жах другої Американської громадянської війни не пощадив жодного американського громадянина. Майже кожен втратив брата чи сестру в жахливому конфлікті. Багато сімей втратили своїх годувальників у війні і тепер розмірковують, як вони будуть забезпечувати себе. Потрібна нова агенція для організації допомоги тим, хто постраждав від війни."

 NEE_Southern_Excavation_Scheme: "Південна схема видобутку"
 NEE_Southern_Excavation_Scheme_desc: "Намагаючись відновити промислову базу американської нації, ми звернемося на південь до штатів «Сонячного поясу», оскільки вони мають багато невикористаних природних ресурсів. З подальшим впровадженням кондиціонування повітря, більше американців вважатимуть «Сонячний пояс» гостинним. Виробники не лише знайдуть місце з меншою присутністю профспілок, але й оцінять теплий сонячний клімат, оскільки вони перенесуть американську промисловість на Південний Схід та Південний Захід."

 NEE_Electrify_The_Nation: "Електрифікувати націю"
 NEE_Electrify_The_Nation_desc: "Електрична мережа нації повністю демонтована та пошкоджена після пекла громадянської війни. Через прийняття актів, таких як Виконавчий наказ 7037 президента [NEE.GetLeader], кожен дім у країні незабаром матиме світло та енергію від Сан-Франциско до Нью-Йорка. Ми не лише виправимо ситуацію з електропостачанням у містах, але й розширимо електрифікацію нашої країни до сільської місцевості."

 NEE_Rebuild_The_Steel_Belt: "Відбудувати Сталевий пояс"
 NEE_Rebuild_The_Steel_Belt_desc: "Коли синдикалісти були відкинуті назад, робітники відчайдушно боролися серед промислового Сталевого поясу за кожен завод. Багато великих заводів тепер лежать у руїнах від конфлікту. Як один із найбільш багатих на ресурси та добре сполучених регіонів країни, ми повинні прагнути відбудувати те, що було втрачено. Це також, ймовірно, зробить нас прихильними до залишків [WCA.GetNameDef]."

 NEE_End_Reconstruction: "Завершити реконструкцію"
 NEE_End_Reconstruction_desc: "Останні два десятиліття не були добрими для Америки. Тим не менш, Америка знову стоїть високо. Зі постійно зростаючою економікою та покращенням соціальних умов вдома, Америка знову готова взяти участь на світовій арені."

 NEE_End_Reconstruction_Available: "Усі штати, що належать нам на §CМатериковій Америці§!, є основними територіями [NEE.GetNameWithFlag]"
 NEE_End_Reconstruction_Available_2: "Усі повстанські сили примирені/умиротворені"

 NEE_Fate_of_the_Political_Parties: "Доля політичних партій"
 NEE_Fate_of_the_Political_Parties_desc: "З нашою перемогою у громадянській війні ми повинні вирішити, як ставитися до протиборчих політичних партій. Багато хто швидко вказує пальцем або на Соціалістичну партію Америки, або на партію «Америка перш за все» як на головних призвідників конфлікту. Дозвіл їм балотуватися на місцевому рівні може бути достатньою поступкою для прихильників жорсткої лінії. Однак заборона цих партій може викликати протести проти того, як «демократична» нація може обмежувати політичні партії нації."

 NEE_Fate_of_the_General_Staff: "Суди над Генеральним штабом"
 NEE_Fate_of-the_General_Staff_desc: "Герой війни Марк Кларк з генерального штабу попросив про зустріч з [NEE.GetLeader]. Він бажає офіційно оформити слухання для розгляду справ ворожих офіцерів повстанських фракцій. Він стверджує, що багато офіцерів були на неправильному боці через географічну відданість. Так само, як Лі не міг воювати проти свого рідного штату Вірджинія, так і багато з цих офіцерів. Тепер, коли Америка знову є цілою, деяких можна повернути до армії та флоту."

 NEE_Maintain_Martial_Law: "Зберегти воєнний стан"
 NEE_Maintain_Martial_Law_desc: "Незважаючи на завершення війни, серед населення все ще залишаються елементи розбрату та незгоди. У сільських районах Півдня лоялісти Лонґістської справи постійно переслідують наші сили, тоді як на Середньому Заході синдикалістські повстанці продовжують свої акти терору, незважаючи на провал їхньої революції. У ці неспокійні часи нам доведеться підтримувати воєнний стан, щоб забезпечити безпеку наших громадян."

 NEE_Repeal_The_Posse_Comitatus_Act: "Скасувати Закон про Posse Comitatus"
 NEE_Repeal_The_Posse_Comitatus_Act_desc: "Оскільки нація оговтується від шрамів конфлікту, який розірвав нашу країну, внутрішні дисиденти та терористи продовжують кидати виклик нашому уряду. Оскільки місцеві правоохоронні органи дедалі більше не здатні справлятися з заворушеннями, нам доведеться застосувати Закон про повстання та скасувати Закон про Posse Comitatus, щоб придушити громадянські заворушення, які мучать нашу націю."

 NEE_Crack_Down_Syndicalist: "Придушити синдикалістську агітацію"
 NEE_Crack_Down_Syndicalist_desc: "Хоча [WCA.GetNameDef] офіційно припинив своє існування, Червона Загроза все ще існує в містах Сталевого поясу та лісах Мічигану. Хоча ці партизани не становлять значної загрози для легітимності нашого уряду, наші громадяни все ще почуваються небезпечно, оскільки ці групи повстанців здійснюють рейди та вибухи. Ми придушимо їх, щоб покінчити з цими так званими революціонерами, які тероризують наш народ та країну."

 NEE_Fight_The_Klan: "Боротьба з ККК"
 NEE_Fight_The_Klan_desc: "Незважаючи на поразку [APG.GetNameDef], у південних штатах все ще існують численні повстанські партизанські групи, які відмовляються визнавати владу нашого уряду. Дисидентські групи, такі як Ку-клукс-клан, полюють на афроамериканців і використовують тактику терору для поширення свого послання расової ненависті. Цього не може існувати в нашому демократичному суспільстві, і якщо ми справді хочемо представляти та захищати американський народ, ми розчавимо їх."

# Global America #

 NEE_American_Imperialism: "Америка повертається на світову арену"
 NEE_American_Imperialism_desc: "[NEE.GetNameDefCap] вийшла переможцем із випробувань останнього десятиліття. Коли економічні негаразди розірвали країну на частини у суперечливій громадянській війні, народ [NEE.GetNameDef] вистояв і знову повстав, як фенікс із попелу! Вкотре [NEE.GetNameDef] може навести лад на своєму задньому дворі."

 NEE_Sword_And_Shield: "Доктрина «Меч і Щит»"
 NEE_Sword_And_Shield_desc: "Королівський флот захищав Британські острови та Ірландію від вторгнення ворожих сухопутних держав. Могутні наполеонівські армії залишилися без шляху нападу на британців. Так само ми докладемо зусиль, щоб створити власну сучасну стіну зі сталі, яка діє як наш меч і щит, щоб жодна ворожа держава не досягла наших берегів."

 NEE_Secure_The_Borders: "Захистити кордони"
 NEE_Secure_The_Borders_desc: "Наша нація має пряме сполучення лише з двома націями. Це найслабші місця в обороні [NEE.GetNameDef] від ворожих загарбників. Необхідно досягти домовленостей з нашими сусідами в [CAN.GetNameDef] та [MEX.GetNameDef], щоб гарантувати безпеку Америки!"

 NEE_Reclaim_The_Canal: "Повернути Панамський канал"
 NEE_Reclaim_The_Canal_desc: "Панамський канал є вирішальним ключем до організації нашого флоту та проєкції сили. Без контролю над перешийком кораблі змушені здійснювати довгу та небезпечну подорож через Магелланову протоку або ризикувати Північно-арктичним проходом. Це також одна з найкращих вершин американської інженерії!"

 NEE_Revive_The_Monroe_Doctrine: "Відродити доктрину Монро"
 NEE_Revive_The_Monroe_Doctrine_desc: "Громадянська війна призвела до руйнування Доктрини Монро. Багато мишей вибігли погратися, поки пильні очі Америки були звернені всередину. Тепер, коли ми оговталися, ми можемо знову прагнути застосувати цю доктрину."

 NEE_Revive_The_Monroe_Doctrine_tt: "Цей фокус розблокує £GFX_decision_icon_small §Yрішення§! вимагати від націй у §CЗахідній півкулі§! покинути свою £GFX_pol_idea  §CЄвропейську§! фракцію"

 NEE_Organisation_of_American_States: "ОАД"
 NEE_Organisation_of_American_States_desc: "Організація американських держав буде об'єднанням нейтральних країн по всій Західній півкулі. Де [NEE.GetNameDef] є одночасно захисником і провідником до зростання кожного члена."

 NEE_Reciprocal_Defence: "Міжамериканська взаємна оборона"
 NEE_Reciprocal_Defence_desc: "[NEE.GetNameDefCap] була благословлена як маяк навчання та інновацій. Прориви, як-от лампочка та конвеєр, до потужних винаходів, як-от літак, що має військове застосування, привабили вчених та винахідників до наших берегів, щоб розширити світові знання. Тепер ми повинні запропонувати наші знання тим, хто знаходиться в нашій сфері, для спільного блага народів Західної півкулі."

 NEE_Reciprocal_Defence_tt: "Цей фокус розблокує £GFX_decision_icon_small §Yрішення§! запросити нації в нашій сфері до £GFX_research_icon  §CМіжамериканського оборонного коледжу§!"

 NEE_American_Officer_Training: "Американська підготовка офіцерів"
 NEE_American_Officer_Training_desc: "Хоча друга Американська громадянська війна була руйнівною, уроки, засвоєні генеральним штабом, значно розширили можливості нашого офіцерського корпусу. Ми можемо почати пропонувати програми націям у нашій сфері для навчання їхніх офіцерів урокам, винесеним із другої Американської громадянської війни, щоб краще захищати свої країни."

 NEE_American_Officer_Training_tt: "Цей фокус розблокує £GFX_decision_icon_small §Yрішення§! запропонувати націям у нашій сфері доступ до £GFX_manpower_texticon  §CАмериканської підготовки офіцерів§!"

 NEE_Dollar_Diplomacy: "Доларова дипломатія"
 NEE_Dollar_Diplomacy_desc: "Оскільки економіка продовжує відновлюватися після спустошення Великої депресії та другої Американської громадянської війни, наші промисловці почали збирати ресурси, необхідні для відновлення закордонних підприємств. Завдяки силі долара, можливо, ми зможемо зламати міцні лещата диктаторів, які поневолюють народи Західної півкулі."

 NEE_Dollar_Diplomacy_tt: "Цей фокус розблокує £GFX_decision_icon_small §Yрішення§! впливати на £GFX_crypto_defense  §aавторитарні§! нації у §CЗахідній півкулі§!"

 NEE_American_Recovery_and_Aid: "Американська програма відновлення та допомоги"
 NEE_American_Recovery_and_Aid_desc: "Американська програма відновлення та допомоги, прийнята Конгресом, стала популярною завдяки тому, що [NEE.GetLeader] часто виступав на радіо, закликаючи громадян писати своїм представникам, наполягаючи на прийнятті цього законодавчого акту. Американська програма відновлення та допомоги дозволяє уряду інвестувати великі суми грошей та ресурсів для розвитку націй у Західній півкулі."

 NEE_American_Recovery_and_Aid_tt: "Цей фокус розблокує £GFX_decision_icon_small §Yрішення§! інвестувати у зростання £GFX_prod_eff_cap  §Gекономіки§! націй у нашій сфері"

 NEE_The_American_Hemisphere: "Американська півкуля"
 NEE_The_American_Hemisphere_desc: "Остаточний висновок, який слід зробити з Доктрини Монро, полягає в тому, що президент Монро заявляв про відповідальність за добробут усієї Західної півкулі. На нас у теперішній час лягає обов’язок забезпечити, щоб вона була вільною від паразитів, які пожирають свій народ. Тиранам та соціалістам не можна дозволити гнобити народи Америк!"

 NEE_The_American_Hemisphere_tt: "Цей фокус розблокує £GFX_decision_icon_small §Yрішення§! висунути ультиматум з вимогою зміни режиму §Rсоціалістичним§! націям у §CЗахідній півкулі§!"

 NEE_The_Old_Order: "Старий порядок"
 NEE_The_Old_Order_desc: "Після майже двох десятиліть вигнання Антанта нарешті повернулася додому. Загроза синдикалізму була розгромлена, і знову старі французький та британський уряди повернулися на свої законні батьківщини. Світло Лондона та Парижа знову засяє, і темрява минулого зникне. Розпочнеться новий світовий порядок, який передбачає повернення старого світу."

 NEE_American_Reconstruction_Crews: "Американські відновлювальні бригади"
 NEE_American_Reconstruction_Crews_desc: "Велика частина Європи спустошена великими війнами — це прикрий наслідок визволення. Завдяки силі відновленої американської промисловості та нашому власному досвіду у відбудові, ми відправимо відновлювальні бригади до наших європейських союзників, щоб допомогти у відбудові їхніх націй. Грандіозні європейські столиці та міста будуть відбудовані в найкоротші терміни завдяки силі американської винахідливості та майстерності!"

 NEE_Invest_In_Raj: "Інвестувати в [RAJ.GetNameDef]"
 NEE_Invest_In_Raj_desc: "Цілком спустошена тристоронньою громадянською війною на Індійському субконтиненті, економіка Домініону Індії лежить у руїнах. Щоб зміцнити наші зв'язки з Антантою та пожинати плоди доступу до іноземних ринків, ми заохочуватимемо американських інвесторів та підприємства приносити американські товари та інвестиції в Індію. Нашим новим партнерам у Раджі!"

 NEE_British_Reconstruction: "Британські позики на реконструкцію"
 NEE_British_Reconstruction_desc: "Британська нація сильно постраждала через свою громадянську війну — синдикалісти фанатично боролися в останні дні війни. Щодня ми отримуємо похмурі повідомлення про шалений безлад, бездомність та бідність, які спіткали Британські острови з моменту повернення вигнанців. Щоб допомогти нашим хоробрим англійським союзникам, ми надамо позики для підтримки їхньої обтяжливої, але необхідної реконструкції. Згодом Британські острови будуть відбудовані, ставши величнішими, ніж будь-коли!"

 NEE_French_Reconstruction: "Перший союзник"
 NEE_French_Reconstruction_desc: "У 1778 році французька нація допомогла нашій молодій революції проти британців, зв'язки нашої країни з Францією ніколи не будуть забуті, і їхні жертви ніколи не будуть забуті. Тепер, коли французька нація оговтується від власної жахливої громадянської війни та років синдикалістського правління, ми повинні відплатити їм послугою. Ми організуємо відправку великої суми грошей та обладнання через Атлантику, щоб допомогти нашому першому союзнику в його відчайдушний час."

 NEE_Italian_Reconstruction: "Загоїти італійські шрами"
 NEE_Italian_Reconstruction_desc: "Багато італійських американців, які проживають у Новій Англії, співчувають тяжкому становищу своїх родичів та друзів на їхній батьківщині, Італії, яка важко відновлюється після другої громадянської війни за новітню історію. Щоб допомогти їхній реконструкції, ми надішлемо добре навчені ремонтні бригади, а також партії продовольства та обладнання для допомоги у відбудові їхніх зруйнованих міст та містечок."

 NEE_Bread_And_Roses: "Хліб і троянди"
 NEE_Bread_And_Roses_desc: "Хоча ми відзначаємо Антанту за їхній незламний патріотизм та рішучість у відвоюванні своїх країн від загрози синдикалізму, здається, що не всі їхні громадяни вважають їх такими. Щоб допомогти їхній реконструкції та допомогти французам та британцям знову заслужити цю довіру, ми запропонуємо постачання та партії продовольства їхнім відповідним націям, щоб загоїти шрами війни."

 NEE_Form_ITO: "Створити Міжнародну торговельну організацію"
 NEE_Form_ITO_desc: "Щоб створити більш доступну та мирну торговельну мережу з демократичним світом, ми наполягатимемо на створенні міжнародного торговельного блоку для об'єднання всіх вільних націй. Очолювана силою жвавої та відновленої американської промисловості та економіки, наша торговельна організація об'єднає кожен континент разом та забезпечить, що всі братимуть участь у вільній торгівлі. Тільки разом ми можемо зробити світ упорядкованим, вільним та мирним."

 NEE_Bring_In_Commonwealth: "Залучити Співдружність"
 NEE_Bring_In_Commonwealth_desc: "З нашим міцно встановленим торговельним блоком, ми повинні шукати членів, які прагнуть приєднатися до нас у глобальній вільній торгівлі. Давайте розглянемо нації Співдружності як потенційних нових членів нашої організації. Міжнародна торговельна організація об'єднає земну кулю!"

 NEE_Bring_In_Commonwealth_tt: "Це розблокує £GFX_decision_icon_small §Yрішення§! запросити §CНації Співдружності§! приєднатися до £GFX_capital  §GМіжнародної торговельної організації§!!"

 NEE_Allies_Not_Forgotten: "Союзники не забуті"
 NEE_Allies_Not_Forgotten_desc: "Ми ніколи не забудемо матеріальну та економічну допомогу, надану нам в наші найтемніші дні Альянсом Антанти. Тепер, коли наша сила повністю відновлена, ми повернемо цей борг нашим союзникам, офіційно запросивши їх до Міжнародної торговельної організації."

 NEE_Allies_Not_Forgotten_tt: "Це розблокує £GFX_decision_icon_small §Yрішення§! запросити §CЧленів Антанти§! приєднатися до £GFX_capital  §GМіжнародної торговельної організації§!!"

 NEE_Reach_Periphery: "Звернутися до периферійних країн"
 NEE_Reach_Periphery_desc: "Міжнародна торговельна організація має на меті об'єднати всі вільні та демократичні нації світу, навіть ті, які не залучені до фракцій. Ми офіційно запросимо країни, які обрали шлях нейтралітету, до нашого торговельного блоку. Разом ми процвітатимемо!"

 NEE_Reach_Periphery_tt: "Цей фокус розблокує £GFX_decision_icon_small §Yрішення§! запросити §CНейтральні нації§! приєднатися до £GFX_capital  §GМіжнародної торговельної організації§!!"

 NEE_Take_Leadership_of_ENT: "Взяти на себе лідерство в Антанті"
 NEE_Take_Leadership_of_ENT_desc: "[NEE.GetName] досягла значного відновлення після руйнування Другої Американської громадянської війни та довела, що є більш ніж здатною військовою та економічною потугою. З нашою оновленою військовою міццю та благословенням від канадського та британського урядів, ми візьмемо на себе лідерство в Антанті, щоб захистити демократію від тиранії та гноблення. Це буде початок нового століття, не Європи, а початок американської ери."

 NEE_Turn_To_The_Pacific: "Поворот до Тихого океану"
 NEE_Turn_To_The_Pacific_desc: "З нашим контролем над континентальною частиною Сполучених Штатів, настав час відновити довоєнну роль Америки у забезпеченні того, щоб контроль над Тихим океаном не потрапив до рук войовничих націй. Завдяки допомозі нашого відновленого флоту, ми охоронятимемо могутні моря і дамо Азії знати, що ми повернулися і стали сильнішими, ніж раніше."

 NEE_The_Gate_Between_The_Oceans: "Ворота між океанами"
 NEE_The_Gate_Between_The_Oceans_desc: "У 1914 році наш великий будівельний проєкт був нарешті завершений, з'єднавши великі Атлантичний та Тихий океани та забезпечивши американське домінування на хвилях. Через наслідки Громадянської війни ми не змогли зберегти контроль над цим важливим проходом. Щоб зміцнити нашу безпеку та відновити нашу морську торгівлю, ми прагнутимемо повернути Панамський канал в американські руки."

 NEE_Form_The_San_Francisco_Accord: "Сформувати угоду Сан-Франциско"
 NEE_Form_The_San_Francisco_Accord_desc: "Щоб заохотити більшу співпрацю між націями Тихого океану під керівництвом [NEE.GetNameDef], ми сформуємо пакт про спільні дослідження, що базується в Сан-Франциско. Ми запросимо нації Південно-Східної Азії приєднатися до нашої співпраці, щоб разом ми стали сильнішими через обмін дослідженнями та забезпечили продовження демократичних ідей по всьому Тихому океану."

 unlock_SFA_decisions: "Це розблокує £GFX_decision_icon_small §Yрішення§! запросити §CАзіатські нації§! приєднатися до £GFX_research_icon  §GУгоди Сан-Франциско§! економічної сфери!"

 NEE_American_Industrial_Aid: "Американська промислова допомога"
 NEE_American_Industrial_Aid_desc: "Могутність промисловості Америки має бути спільною з рештою світу. Оскільки значна частина Азії все ще відстає з точки зору індустріалізації порівняно з нашою країною, ми надішлемо радників та фінансові інвестиції, щоб допомогти у постійному зростанні та розвитку азіатських націй. Це не лише допоможе їхньому виробництву, але й заохотить їхню довіру до демократії."

 unlock_SFA_investment_decisions: "Це розблокує £GFX_decision_icon_small §Yрішення§! інвестувати в §CНації Угоди§!!"

 NEE_Joint_Relief_Commission: "Спільна комісія з надання допомоги"
 NEE_Joint_Relief_Commission_desc: "Значна частина Азії спустошена роками колоніалізму, військових лідерів, голоду та відвертої громадянської війни. Американський народ не може стояти осторонь і спостерігати, як ці люди мучаться. Американський Червоний Хрест допоможе організувати Спільну комісію з надання допомоги, щоб забезпечити, що американська медична та гуманітарна допомога допомагає страждаючим народам Тихоокеанських націй."

 unlock_SFA_humanitarian_decisions: "Це розблокує £GFX_decision_icon_small §Yрішення§! надіслати £GFX_population_texticon  §Gгуманітарну допомогу§! до §CАзіатських націй§!"

 NEE_Protect_East_Asian_Interests: "Захистити інтереси Східної Азії"
 NEE_Protect_East_Asian_Interests_desc: "Нації та народи Азії стануть жертвою шаленого та нестримного імперіалізму без підтримки [NEE.GetNameDef] як охоронця Тихого океану. Щоб забезпечити, що Азія залишається демократичною та вільною, ми запропонуємо нашу повну підтримку у захисті цих націй від завжди жадібних рук імперіалістичних та войовничих націй."

 unlock_guarantee_decisions: "Це розблокує £GFX_decision_icon_small §Yрішення§! надіслати £GFX_counter_intelligence  §Gгарантії§! §CДемократичним азіатським націям§!"

 NEE_Expand_American_Influence: "Розширити американський вплив"
 NEE_Expand_American_Influence_desc: "За відсутності нашої країни у справах Азії через спалах громадянської війни, Імперії Японії та Німеччини скористалися нашою слабкістю, щоб проникнути та експлуатувати слабші азіатські нації. Тепер, коли ми повернулися, ми шукатимемо нації, які борються, щоб протистояти їхньому впливу, сподіваючись відновити наш вплив та владу у великому Тихоокеанському регіоні."

 unlock_influence_decisions: "Це розблокує £GFX_decision_icon_small §Yрішення§! £GFX_pol_idea  §Gвпливати§! на нейтральні нації в §CАзії§!"

 NEE_Rebuild_Asiatic_Fleet_Presence: "Відновити присутність азіатського флоту"
 NEE_Rebuild_Asiatic_Fleet_Presence_desc: "До громадянської війни Азіатський флот, заснований у 1902 році, залишався улюбленцем ВМС Сполучених Штатів, допомагаючи забезпечити безпеку та захист американських інтересів у китайських морях та за їх межами. Якщо ми маємо намір захищати свободу на азіатських морях, нам потрібно буде мати потужний військово-морський флот у нашому розпорядженні для захисту та оборони демократії в Азії."

 NEE_Mobile_Airfields: "Мобільні аеродроми"
 NEE_Mobile_Airfields_desc: "Епоха важкоброньованих дредноутів та їхньої неймовірної вогневої міці давно позаду. Вони не можуть відтворити проєкцію сили, яку можуть забезпечити авіаносці, даючи морським бомбардувальникам можливість завдавати ударів по суднах на відстані миль. Прихильники цієї нової форми підтримки військово-морської авіації, як-от Річмонд К. Тернер із Військово-морського коледжу, наполягали на тому, щоб наш флот збільшив інтеграцію авіаносців у наші флоти та військово-морську доктрину."

 NEE_Expand_The_Seabees: "Розширити Seabees"
 NEE_Expand_The_Seabees_desc: "Оскільки ми починаємо відновлювати нашу присутність у Тихому океані, логістика присутності по всьому світу є справді гнітючою. Щоб проєктувати американську владу далі, ми залучимо кваліфіковану робочу силу Америки для організації будівництва на передовій. Ми почнемо рекламувати подальше залучення та обізнаність про програму, щоб отримати допомогу добровольців по всій країні."

 NEE_Auxiliary_Floating_Drydocks: "Допоміжні плавучі доки"
 NEE_Auxiliary_Floating_Drydocks_desc: "Здатні занурюватися під воду, плавучі доки, підтримувані баластними понтонними резервуарами, можуть бути розміщені під кораблями, які потребують ремонту нижче ватерлінії. Оскільки наша військово-морська армада зростає, нам доведеться побудувати додаткові плавучі доки, щоб забезпечити, що наші кораблі матимуть скорочений час подорожі для ремонтних робіт, а також можливості для безперервного ремонту."

 NEE_The_Pacific_Territories: "Тихоокеанські території"
 NEE_The_Pacific_Territories_desc: "Наші території в Тихому океані покинули Союз під час великої громадянської війни, позбавивши нас доступу та об'єктів у великому морі. З завершенням війни та відновленням нашої сили, ми запропонуємо їм повернутися до Союзу, щоб відновити нашу сферу впливу на островах Раю."

 NEE_The_Pearl_Of_The_Orient: "Перлина Сходу"
 NEE_The_Pearl_Of_The_Orient_desc: "Наша давня віра в те, що цивілізація та демократія прийдуть на Філіппінські острови, нарешті принесла плоди. З міцним демократичним союзником у Південно-Китайському морі, філіппінсько-американські зв'язки лише зростуть, щоб сформувати оплот проти реакційного імперіалізму та соціалістичної агітації!"

 NEE_Pacific_Campaign_Planning: "Планування Тихоокеанської кампанії"
 NEE_Pacific_Campaign_Planning_desc: "Війна на Тихому океані передбачатиме, що ворог утримує ланцюг укріплених островів, і захоплення їх усіх в одній кампанії було б дорогою та виснажливою кампанією. Багато хто на флоті та у військових виступає за кампанію «стрибка жаби», яка включатиме захоплення стратегічних островів по всьому Тихому океану, щоб відрізати основні ворожі сили від постачання, а також дати нам розсудливість та зберегти наші ресурси."

 NEE_Secure_American_Pacific_Supremacy: "Забезпечити американську перевагу в Тихому океані"
 NEE_Secure_American_Pacific_Supremacy_desc: "Мілітаристи та імперіалісти показали своє справжнє обличчя, коли захопили наші острови під час громадянської війни та кинули виклик нашій цілісності у підтримці миру на Тихому океані. Поки в Тихому океані існує нестримний авторитаризм та соціалістична агітація, вони загрожуватимуть незалежності всіх народів Тихоокеанського регіону. Як лідер вільного світу, наш обов'язок — звільнити їх від кайданів їхніх деспотичних лідерів"

# ITO decisions
 NEE_ITO_decisions: "Міжнародна торговельна організація"
 NEE_ITO_decisions_desc: "Часи меркантилізму та протекціонізму давно минули. Оновлена промислова та військова міць Америки означає, що ми виступаємо світовим охоронцем демократії та свободи. Після ратифікації Конгресом було сформовано Міжнародну торговельну організацію (MTO), щоб об'єднати світ на засадах вільної торгівлі та співпраці. MTO планує вести переговори про зниження або скасування шкідливих імпортних тарифів чи інших торговельних бар'єрів, керувати та контролювати дотримання узгоджених торговельних договорів, вирішувати суперечки між країнами-членами ITO, сприяти процвітанню країн, що розвиваються, та проводити економічні дослідження. Засновницькі принципи MTO відображають її відданість вільній міжнародній торгівлі, внесок у світовий розвиток та прозорість. Відкриття національних ринків для міжнародної торгівлі, за винятком обґрунтованих випадків або з належною гнучкістю, сприятиме сталому розвитку, зменшить рівень бідності, підвищить добробут людей у всьому світі та сприятиме миру і стабільності."

 NEE_enable_automatic_ITO_invite: "Автоматично запрошувати членів фракції до MTO"
 NEE_ITO_Commonwealth: "Запросити [FROM.GetNameDef] до MTO"
 NEE_ITO_Entente_no_com: "Запросити [FROM.GetNameDef] до MTO"
 NEE_ITO_Peripheries_dec: "Запросити [FROM.GetNameDef] до MTO"

 nee_inviting_ito: "Запрошення іншої нації до Міжнародної торговельної організації"
 as_long_as_we_have_more_than_30_PP: "Поки ми маємо більше ніж §G30§! £pol_power  §Yполітичної влади§!:\n--"
 if_we_have_more_than_30_PP: "Автоматичні запрошення припиняться, якщо після завершення цього процесу ми матимемо менше ніж §G30§! £pol_power  §Yполітичної влади§!:\n--\n§gНаразі [?NEE.political_power|0]/30§!"

# SFA decisions

 NEE_SFA_decisions: "Угода Сан-Франциско"
 NEE_SFA_decisions_desc: "Тихий океан — це найбільше море у світі, дім для багатьох народів і націй та безмежних природних ресурсів. Поки світ охоплює полум'я, великому океану знадобиться захисник, щоб гарантувати збереження демократії та незалежність вільних народів Азії. Коли наша нація відбудована, а промисловість повертається до повної потужності, ми прагнутимемо розширити свій вплив і побудувати нові зв'язки з азіатсько-тихоокеанськими країнами, щоб гарантувати їхню відданість демократії та свободі. Під американським лідерством Тихий океан стане бастіоном волі — вільним від агресії іноземних держав, які прагнуть дестабілізувати регіон."
 NEE_SFA_Invite_dec: "Запросити [FROM.GetNameDef] до Угоди"
 NEE_SFA_Invest_dec: "Інвестувати в [FROM.GetNameDef]"
 NEE_SFA_Med_Aid_dec: "Надіслати гуманітарну допомогу в [FROM.GetNameDef]"
 NEE_SFA_Guarantees_dec: "Гарантувати незалежність [FROM.GetNameDef]"
 NEE_SFA_Entice_Neutral_dec: "Прагнути вплинути на [FROM.GetNameDef]"
 NEE_SFA_Assure_Supremacy_dec: "Продемонструвати перевагу над [FROM.GetNameDef]"
 NEE_SFA_Return_Guam: "Поновити наші претензії на Гуам"

 NEE_The_American_Ocean_tt: "Цей фокус розблокує £GFX_decision_icon_small §Yрішення§! для забезпечення американської переваги над §Rворожими§! націями в §cПівденно-Східній Азії§!"

 nee_inviting_sfa: "Запрошення іншої країни до Сан-Франциської угоди"
 nee_investing_sfa: "Інвестування в іншу країну"
 nee_sending_med_aid: "Надання медичної допомоги іншій країні"
 nee_sending_guarantee: "Гарантування незалежності іншої країни"
 nee_enticing_country: "Схиляння іншої країни до прийняття американського впливу"

# Congress Decisions #

 NEE_Congress_decisions: "Конгрес"
 NEE_Congress_decisions_desc: "З відновленням американської демократії полум'я свободи знову запалало в залах Конгресу. Проте, щоб підтримувати стабільність Конгресу та забезпечити віру наших громадян у законодавчу гілку влади, ми повинні бути впевнені, що обидві політичні партії відчувають рівність свого голосу в національній політиці. Надання переваги програмам однієї партії над іншою зменшить кількість £pol_power §Yполітичної влади§!, яку ми отримуємо щодня. Багато з того, що має бути досягнуто Конгресом, буде спрямовано на відбудову та пожвавлення американської промисловості та суспільства після величезних спустошень і втрат, спричинених громадянською війною. Оскільки політична напруженість все ще залишається високою, а розбіжності між делегатами — значними, слід прислухатися до слів великого колишнього президента Лінкольна: «Дім, розділений навпіл, не встоїть».\n\nПрийнято політик §mРеспубліканців§!: [?NEE.NEE_rep_count|R0]\nПрийнято політик §lДемократів§!: [?NEE.NEE_dem_count|C0]"

 NEE_congress_coalition_end: "Проведення цієї політики призведе до розриву відносин між партіями"
 NEE_Democrat_cabinet_tooltip: "§lДемократична партія§! надаватиме §Y20%§! від політичної влади, яку вона давала б, перебуваючи при владі"
 NEE_Republican_cabinet_tooltip: "§mРеспубліканська партія§! надаватиме §Y20%§! від політичної влади, яку вона давала б, перебуваючи при владі"

 NEE_generic_research_grant: "Грант на дослідження [GetYear] року"
 NEE_generic_research_grant_desc: "Щоб зберегти нашу перевагу, ми повинні виділити фінансування на наші дослідження та розробки!"
 NEE_generic_mineral_requistion: "Програма реквізиції мінералів [GetYear] року"
 NEE_generic_mineral_requistion_desc: "Америка є домом для величезної кількості ресурсів. Зі збільшенням фінансування багатства землі можуть стати нашими!"
 NEE_generic_reign_in_party: "Об'єднати партію"
 NEE_generic_reign_in_party_desc: "Дім, розділений навпіл, не встоїть! Щоб забезпечити продовження ефективного правління, партія повинна згуртуватися і діяти як єдине ціле!"

 # DEM #
 NEE_distribute_relief_funds: "§lРозподілити кошти на надання допомоги§!"
 NEE_distribute_relief_funds_desc: "Велика частина країни все ще перебуває в бідності, незважаючи на триваючі зусилля з реконструкції. За підтримки федерального уряду цей акт забезпечить раунд пакетів стимулювання, розроблених для допомоги американським сім'ям, що борються за виживання в ці важкі часи."
 NEE_regulate_industrial_business: "§lРегулювати промисловий бізнес§!"
 NEE_regulate_industrial_business_desc: "Оскільки наша промисловість починає пожвавлюватися, ми повинні забезпечити дотримання нашими заводами єдиних стандартів і норм. Цей акт запровадить федеральні правила роботи фабрик, щоб забезпечити постійну ефективність американської промислової машини."
 NEE_no_private_factory_police: "§lОбмежити приватну заводську поліцію§!"
 NEE_no_private_factory_police_desc: "Можливість власників заводів контролювати власну приватну поліцію є вкрай антидемократичною, і таку практику слід викорінити в нашій країні. Цей акт буде спрямований на скасування приватної заводської поліції, даючи робітникам можливість вільно працювати, не зазнаючи утисків з боку приватних головорізів."
 NEE_expand_state_college: "§lРозширити фінансування державних коледжів§!"
 NEE_expand_state_college_desc: "Великий відсоток студентів і викладачів нації пішов на фронт під час Американської громадянської війни, що сильно зашкодило нашому освітньому сектору. Тепер, коли ми оговтуємося від великого лиха, ми почнемо покращувати фінансування американських коледжів, гарантуючи, що американська вища освіта буде визнана однією з найкращих у світі."
 NEE_factory_regulation_idea: "Регулювання заводів"
 NEE_expand_public_transit: "§lРозширити громадський транспорт§!"
 NEE_expand_public_transit_desc: "Оскільки більша частина інфраструктури країни була розірвана на шматки під час громадянської війни, громадський транспорт є лише тінню свого довоєнного стану. Цей акт сприятиме вдосконаленню та розвитку громадського транспорту по всій країні, надаючи американцям можливість здійснювати поїздки, необхідні їм для роботи чи відпочинку."
 NEE_continue_wpa: "§lПродовжити WPA§!"
 NEE_continued_wpa_idea: "Триваючі проєкти WPA"
 NEE_continue_wpa_desc: "Під час Великої депресії Адміністрація робочого прогресу відіграла важливу роль у своїй амбітній програмі зайнятості та інфраструктури, яка забезпечила американців робочими місцями. Тепер, коли ветерани повертаються додому, а нація починає відновлюватися в цілому, ми відновимо програми WPA, щоб забезпечити американських громадян роботою, одночасно розвиваючи нашу власну інфраструктуру!"

 NEE_fair_employment_practices: "§lСправедлива практика працевлаштування§!"
 NEE_fair_employment_practices_desc: "Усі американські громадяни повинні мати рівні можливості для пошуку роботи. В економіці, заснованій на конкуренції, такій як у Сполучених Штатах, деякі підприємства використовували несправедливу практику працевлаштування для дискримінації потенційних кандидатів. Згідно з цим новим законом, ми гарантуємо кожному американцю рівні шанси на пошук роботи незалежно від віросповідання чи кольору шкіри."
 NEE_support_labour_unions: "§lПідтримати профспілки робітників§!"
 NEE_support_labour_unions_desc: "Право на об'єднання в профспілку, хоча і не схвалюється консерваторами, є правом кожного американця. Цей акт захистить і зміцнить членів профспілок, надаючи їм право організовуватися та брати участь у захищеній діяльності для покращення умов праці."
 NEE_encouraged_unions_idea: "Заохочуване членство в профспілках"
 NEE_tax_reform: "§lВпровадити податкову реформу§!"
 NEE_tax_reform_desc: "З метою досягнення більшої економічної рівності, новий Податковий акт підвищить федеральний прибутковий податок на високі рівні доходів. Хоча це може викликати опозицію з боку більш заможних верств населення, прихильники цього акту сподіваються збільшити щорічний дохід нації."
 NEE_small_scale_projects: "§lМаломасштабні робочі проєкти§!"
 NEE_small_scale_project_desc: "Для підвищення рівня зайнятості та продуктивності країни цей акт створить маломасштабні робочі проєкти на місцевому рівні для розвитку більш сільських районів країни. Прихильники цього акту сподіваються, що розвиток аграрної сторони країни принесе нам підтримку простої людини та покращить якість її життя."
 NEE_fight_domestic_socialism: "§lБоротися з внутрішнім соціалізмом§!"
 NEE_fight_domestic_socialism_desc: "Синдикалістські агенти та агітатори ховаються в тіні скрізь, і поки вони існують, вони становлять загрозу для американського суспільства. Цей новий акт криміналізує тих, хто заявляє про лояльність або намір приєднатися до профспілок і груп синдикалістського спрямування, щоб допомогти покласти край червоній загрозі."
 NEE_infrastructure_projects_1944: "§lЗагальнонаціональні інфраструктурні проєкти§!"
 NEE_infrastructure_projects_1944_desc: "Поки нація прямує до повного післявоєнного відновлення, все ще залишається багато американців, які шукають роботу. Прийняття цього акту не лише забезпечить зростання зайнятості, але й дозволить нам розвивати нашу національну інфраструктуру, тим самим ще більше об'єднуючи нашу націю."

# REP #
 NEE_school_funding: "§mПокращити державне фінансування шкіл§!"
 NEE_school_funding_desc: "Внаслідок громадянської війни та воєн за кордоном тисячі американських дітей залишилися без вчителів, а школи виявилися просто недостатньо ефективними через брак ресурсів. Цей новий акт збільшить державне фінансування шкільного навчання, забезпечивши нове покоління американських студентів, готових навчатися у здібних інструкторів."
 NEE_state_funded_schools_idea: "Державне шкільне навчання"
 NEE_state_funded_schools_desc: "Внаслідок громадянської війни та воєн за кордоном тисячі американських дітей залишилися без вчителів, а школи виявилися просто недостатньо ефективними через брак ресурсів. Цей новий акт збільшить державне фінансування шкільного навчання, забезпечивши нове покоління американських студентів, готових навчатися у здібних інструкторів."
 NEE_old_age_benefits: "§mВідновити виплати допомоги по старості§!"
 NEE_old_age_benefits_desc: "Під час економічної кризи часів Великої депресії становище літніх людей стало серйозною проблемою, оскільки існувало мало пільг, які б їх захищали. Посилаючись на успіхи програм допомоги під час Депресії, цей акт допоможе відновити виплати для літніх людей країни."
 NEE_develop_rural_regions: "§mРозвивати сільські регіони§!"
 NEE_develop_rural_regions_desc: "Значна частина Півдня та Середнього Заходу залишалася переважно сільською ще до громадянської війни. З метою підвищення продуктивності в сільськогосподарському секторі цей акт надасть кредити та ресурси, необхідні для розвитку наших сільських територій."
 NEE_infrastructure_projects: "§mІнфраструктурні проєкти§!"
 NEE_infrastructure_projects_desc: "Оскільки нація починає тривалий процес відбудови та примирення, ми також можемо використати цей час для розвитку інфраструктури Америки. Старі ґрунтові дороги незабаром будуть замінені мощеними дорогами, і ми розширимо та розбудуємо шосе, щоб покращити американську інфраструктуру. Американські дороги та магістралі стануть заздрістю для всіх народів!"
 NEE_anti_strike_legislation: "§mПридушити страйки§!"
 NEE_anti_strike_legislation_desc: "Хоча війна проти синдикалізму в Америці, можливо, і була виграна, все ще існують радикали, які використовуватимуть такі небезпечні методи, як страйки, щоб дестабілізувати нашу економіку та нашу націю. Щоб забезпечити швидке післявоєнне відновлення, ми гарантуємо, що страйки не вийдуть з-під контролю, прийнявши законодавство, яке дозволить нам їх придушувати."
 NEE_bank_commission: "§mРеорганізувати банківські комісії§!"
 NEE_bank_commission_idea: "Реорганізовані банківські комісії"
 NEE_bank_commission_desc: "У рамках нашої триваючої банківської реформи цей акт розширить повноваження федерального резерву на раду, розташовану в столиці нашої нації. Цей акт не лише реорганізує керівництво федерального резерву, але й уточнить та кодифікує відносини резерву з федеральним урядом."

 NEE_regulate_labour_strikes: "§mРегулювати трудові страйки§!"
 NEE_regulated_strikes_idea: "Регульовані страйки"
 NEE_regulated_labour_strikes_desc: "Хоча ми підтримуємо право американських робітників на страйк, ми також повинні бути обережними, щоб вони не стали небезпечною загрозою для суспільства та порядку. Цей акт встановить федеральний ліміт на кількість страйкарів, щоб запобігти радикалізації американських робітників."
 NEE_veteran_housing: "§mКомпенсація ветеранам§!"
 NEE_veteran_housing_desc: "Ми винні ветеранам громадянської війни величезний борг; багато хто з них добровільно пішов на службу через свій патріотичний запал. Поки наші ветерани намагаються повернутися до цивільного життя, ми повинні докласти зусиль, щоб полегшити їхні труднощі. Прийняття цього акту забезпечить житлом та державною пенсією тих, хто служив нашій країні."
 NEE_alcohol_protection_act: "§mАкт про захист від алкоголю§!"
 NEE_alcohol_protection_act_desc: "Коли ветерани повертаються додому з боїв за кордоном, багато хто звертається до алкоголю як до засобу втечі, проте це може призвести до розпаду сім'ї, якщо вони почнуть цінувати пляшку більше за своїх близьких. Цей новий акт допоможе підтримати такі програми, як «Анонімні Алкоголіки», щоб створити умови, сприятливі для зцілення цих людей."
 NEE_improve_roadways: "§mПокращити дорожнє полотно§!"
 NEE_improve_roadways_desc: "Значна частина національних доріг лежить у руїнах через наслідки громадянської війни. Хоча ми прагнемо відбудувати наші дороги до довоєнних стандартів, це законодавство дозволить нам розвивати та модернізувати національну та місцеву інфраструктуру."
 NEE_swords_to_plowshares: "§mПовернутися до мирного часу§!"
 NEE-swords_to_plowshares_desc: "Оскільки військові зусилля на внутрішньому фронті згортаються, давайте вживемо заходів для забезпечення плавного переходу назад до цивільної економіки. Цей акт подбає про те, щоб військові заводи почали конвертувати своє виробництво на цивільні товари."

 NEE_unite_legislature: "Об'єднати законодавчий орган"
 NEE_unite_legislature_tt: "Це знизить вартість рішень §YПартійної конференції§! на £GFX_pol_power §G5§! !"

 NEE_taking_congress_decision: "Наразі обговорюється пропозиція в £GFX_pol_power Конгресі"

### Setting up New England ###
 new_england_events.1.t: "Утворення Нової Англії"
 new_england_events.1.d.usa: "Поки хаос продовжує охоплювати країну, а нація розпалася на стані громадянської війни, штати американського Північного Сходу опинилися в пастці між фракціями великої війни, що насувається. Відчайдушно прагнучи нейтралітету, здається, вони прийняли рішення залишитися неприєднаними у другій великій громадянській війні в Америці, попросивши канадський уряд увійти в Нову Англію з військовою силою.\n\nУ кричущому порушенні територіальних кордонів Америки кульгавий британський Лев уже втретє вмарширував до Сполучених Штатів. Хоча фракції громадянської війни виступають проти будь-яких форм примирення, за винятком беззастережної капітуляції, усі вони поділяють спільне почуття невіри та обурення. Поки канадські солдати патрулюють кордон між Новою Англією та колишніми Сполученими Штатами, великі групи американських біженців намагаються перетнути кордон із тим невеликим майном, яке вони мають. Багато хто в країні відмахнувся від північно-східного штату як від канадської маріонетки, але це може бути не так. Згідно з офіційною заявою Вілбура Кросса, призначеного президентом Тимчасового уряду Нової Англії, так званий тимчасовий уряд планує провести свої офіційні та законні президентські вибори найближчими днями — що, можливо, означає претензії та легітимність Нової Англії як наступника колишніх Сполучених Штатів."
 new_england_events.1.d.wca: "Поки хаос продовжує охоплювати країну, а нація розпалася на стані громадянської війни, штати американського Північного Сходу опинилися в пастці між фракціями великої війни, що насувається. Відчайдушно прагнучи нейтралітету, здається, вони прийняли рішення залишитися неприєднаними у другій великій громадянській війні в Америці, попросивши канадський уряд увійти в Нову Англію з військовою силою.\n\nУ кричущому порушенні територіальних кордонів Америки кульгавий британський Лев уже втретє вмарширував до Сполучених Штатів. Хоча фракції громадянської війни виступають проти будь-яких форм примирення, за винятком беззастережної капітуляції, усі вони поділяють спільне почуття невіри та обурення. Поки канадські солдати патрулюють кордон між Новою Англією та колишніми Сполученими Штатами, великі групи американських біженців намагаються перетнути кордон із тим невеликим майном, яке вони мають. Багато хто в країні відмахнувся від північно-східного штату як від канадської маріонетки, але це може бути не так. Згідно з офіційною заявою Вілбура Кросса, призначеного президентом Тимчасового уряду Нової Англії, так званий тимчасовий уряд планує провести свої офіційні та законні президентські вибори найближчими днями — що, можливо, означає претензії та легітимність Нової Англії як наступника колишніх Сполучених Штатів."
 new_england_events.1.d.ACC: "Поки хаос продовжує охоплювати країну, а нація розпалася на стані громадянської війни, штати американського Північного Сходу опинилися в пастці між фракціями великої війни, що насувається. Відчайдушно прагнучи нейтралітету, здається, вони прийняли рішення залишитися неприєднаними у другій великій громадянській війні в Америці, попросивши канадський уряд увійти в Нову Англію з військовою силою.\n\nУ кричущому порушенні територіальних кордонів Америки кульгавий британський Лев уже втретє вмарширував до Сполучених Штатів. Хоча фракції громадянської війни виступають проти будь-яких форм примирення, за винятком беззастережної капітуляції, усі вони поділяють спільне почуття невіри та обурення. Поки канадські солдати патрулюють кордон між Новою Англією та колишніми Сполученими Штатами, великі групи американських біженців намагаються перетнути кордон із тим невеликим майном, яке вони мають. Багато хто в країні відмахнувся від північно-східного штату як від канадської маріонетки, але це може бути не так. Згідно з офіційною заявою Вілбура Кросса, призначеного президентом Тимчасового уряду Нової Англії, так званий тимчасовий уряд планує провести свої офіційні та законні президентські вибори найближчими днями — що, можливо, означає претензії та легітимність Нової Англії як наступника колишніх Сполучених Штатів."
 new_england_events.1.d.APG: "Поки хаос продовжує охоплювати країну, а нація розпалася на стані громадянської війни, штати американського Північного Сходу опинилися в пастці між фракціями великої війни, що насувається. Відчайдушно прагнучи нейтралітету, здається, вони прийняли рішення залишитися неприєднаними у другій великій громадянській війні в Америці, попросивши канадський уряд увійти в Нову Англію з військовою силою.\n\nУ кричущому порушенні територіальних кордонів Америки кульгавий британський Лев уже втретє вмарширував до Сполучених Штатів. Хоча фракції громадянської війни виступають проти будь-яких форм примирення, за винятком беззастережної капітуляції, усі вони поділяють спільне почуття невіри та обурення. Поки канадські солдати патрулюють кордон між Новою Англії та колишніми Сполученими Штатами, великі групи американських біженців намагаються перетнути кордон із тим невеликим майном, яке вони мають. Багато хто в країні відмахнувся від північно-східного штату як від канадської маріонетки, але це може бути не так. Згідно з офіційною заявою Вілбура Кросса, призначеного президентом Тимчасового уряду Нової Англії, так званий тимчасовий уряд планує провести свої офіційні та законні президентські вибори найближчими днями — що, можливо, означає претензії та легітимність Нової Англії як наступника колишніх Сполучених Штатів."
 new_england_events.1.a: "Дуже добре."
 new_england_events.1.b: "Грати за Нову Англію"

 new_england_events.2.t: "Канада входить у Нову Англію"
 new_england_events.2.d: "Регіон Нової Англії охоплений насильством синдикалістських ополчень до такої міри, що губернатори регіону — стурбовані перспективою бути захопленими [WCA.GetNameDef] і не бажаючи чекати, поки федеральний уряд відновить порядок — попросили, щоб [CAN.GetNameDef] втрутилася своїми силами. Канадський уряд надіслав нам повідомлення про свої наміри та наголосив, що вони лише бажають захистити життя невинних і обговорять це питання з американським урядом далі, щойно буде відновлено мир. Хоча дехто в [Root.GetAdjective] кабінеті вважає, що канадці порушили наш суверенітет, зараз ми мало що можемо з цим вдіяти."
 new_england_events.2.a: "Ми розберемося з цим пізніше"

 new_england_events.3.t: "Терор у Новій Англії"
 new_england_events.3.d: "Нова Англія була обложена насильством синдикалістських ополчень, і губернатори в регіоні налякані тим, що федеральний уряд не зможе запобігти швидкому захопленню всього регіону. Очевидно, вони зайшли так далеко, що офіційно попросили про втручання [CAN.GetNameDef], але канадський уряд відмовився втручатися... принаймні поки що. Як результат, групи ополчення в Бостоні швидко мобілізуються, намагаючись організувати належну оборону території."
 new_england_events.3.a: "Ми допоможемо настільки, наскільки зможемо"

 new_england_events.5.t: "Питання Нової Англії"
 new_england_events.5.d: "Тепер, коли ми втрутилися в Нову Англію, низка канадських міністрів зустрілася з лідерами цих штатів щодо того, як найкраще підтримувати порядок. Штати запропонували створити тимчасовий уряд для регіону, який би — принаймні спочатку — перебував під нашим контролем і був введений до альянсу Антанти. Деякі члени уряду, однак, припустили, що було б краще, якби ми просто окупували територію та керували нею самі. Американці, кажуть вони, іноді можуть мати сумнівну лояльність — вдячні чи ні, їхні цілі можуть не збігатися з нашими."
 new_england_events.5.a: "Створити тимчасовий уряд."
 new_england_events.5.b: "Грати за Нову Англію"
 new_england_events.5.c: "Продовжити військову окупацію."

 new_england_events.6.t: "Тимчасовий уряд Нової Англії"
 new_england_events.6.d: "Завдяки нашим союзникам у Канаді ми створили тимчасовий уряд у Бостоні, готуючись до визволення решти нашої країни. На жаль, не так багато людей як у штатах Нової Англії, так і поза ними вірять, що ми — справжня і законна Америка, і ми повинні виправити цю проблему."
 new_england_events.6.a: "Не наступай на мене!"

## Focus Tree Events ###
 new_england_events.12.t: "Нова Англія вимагає самоврядування"
 new_england_events.12.d: "Тимчасовий уряд Нової Англії, тепер, коли він розбудував свою армію та структуру, висунув вимогу про надання йому права на самоврядування. Деякі члени канадського уряду приголомшені тоном цієї вимоги, вважаючи, що саме канадський уряд дозволив жителям Нової Англії уникнути хаосу, який панує в решті Америки. Проте інші вказують на те, що якщо Канада не має амбіцій керувати американцями як колоніальними підданими, то немає жодних причин не дати Новій Англії те, чого вона прагне."
 new_england_events.12.a: "Надати їм самоврядування."
 new_england_events.12.b: "Ні, вони занадто цінні."

 new_england_events.13.t: "Канада погоджується"
 new_england_events.13.d: "Канадці готові відмовитися від будь-якого контролю над нашим державним апаратом і висловили готовність співпрацювати з нами як з рівноправними партнерами в Антанти."
 new_england_events.13.a: "Ми вдячні."

 new_england_events.14.t: "Канада відмовляє"
 new_england_events.14.d: "Ймовірно, вирішивши, що ми є занадто цінним активом у їхньому прагненні відвоювати рідні острови, або, можливо, таємно зазіхаючи на територію Нової Англії як на власну, канадський уряд відмовився надати Новій Англії право на самоврядування. Ми залишаємося, принаймні в осяжному майбутньому, їхніми підданими... що стало серйозним ударом по легітимності нашого уряду."
 new_england_events.14.a: "Це справжнє зухвальство!"

 new_england_events.15.t: "[From.GetNameDefCap] оголошує незалежність"
 new_england_events.15.d: "Виявляючи невдоволення ще відтоді, як ми відмовили їм у самоврядуванні, уряд Нової Англії нарешті оголосив про свою незалежність, повністю покинувши наш альянс."
 new_england_events.15.a: "Нехай буде так."
 new_england_events.15.b: "Ні, цього не можна допустити!"

### Flavour Events ###

# Resource Stockpiling
 new_england_events.16.t: "Акт про накопичення стратегічних та критичних матеріалів [GetYear] року"
 new_england_events.16.d: "Готуючись до війни, необхідно використати всі корисні та стратегічні ресурси для допомоги у військових зусиллях. Ворог володіє набагато більшою промисловою базою, ніж ми, і без необхідних кроків Нова Англія не зможе виробляти озброєння та матеріали, необхідні для перемоги в сучасній тотальній війні.\n\nТому сьогодні Конгрес прийняв Акт про накопичення стратегічних та критичних матеріалів [GetYear] року. Цей акт є федеральним законом, який встановить запаси стратегічних матеріалів для спільної оборони Нової Англії, промислових потреб та військових зобов'язань. Підписаний президентом [NEE.GetLeader], закон подбає про те, щоб велика кількість стратегічних матеріалів — від могутніх млинів та заводів до задніх дворів звичайних домогосподарств — була зібрана та використана для служіння Новій Англії в найтемнішу годину Америки."
 new_england_events.16.a: "Кожен може зробити свій внесок!"

# Basilica
 new_england_events.17.t: "Базиліка Святих Петра і Павла"
 new_england_events.17.d: "Віра та релігія довгий час були наріжними ідеями в Новій Англії. Хоча дехто сумнівався, чи залишиться це так, коли нація поринула в хаос із початком другої громадянської війни — схоже, що навіть у часи кризи віра Нової Англії залишається такою ж міцною, як і раніше! Після років будівництва друга за величиною церква в Новій Англії була нарешті освячена на велику радість і задоволення франко-канадського населення Льюїстона.\n\nУ середині XIX століття Льюїстон пережив наплив франко-канадців, які приїхали працювати на місцевих текстильних фабриках. Ці католицькі мігранти прагнули мати місце для молитви, і певний час парафіяни молилися в підвалі церкви Святого Йосипа. Через велику кількість франкомовних парафіян щотижневу месу в 1870 році перенесли до нави церкви Святого Івана. Але кількість вірян просто переросла наву, і тому почалося будівництво нової церкви, наріжний камінь якої було закладено в 1872 році. У 1881 році отці-домініканці з Лілля (Франція) та Квебеку взяли на себе управління церквою, і до 1889 року парафія стала відома як Сен-П'єр-е-Сен-Поль де Льюїстон, штат Мен. До 1905 року кількість парафіян досягла 10 000, а розділення парафії у 1907 та 1923 роках призвело до подальших затримок проєкту. Серйозна робота над об'єктом відновилася в 1933 році, попри триваючу Велику депресію, і нарешті була завершена в липні 1936 року.\n\nТепер церква була остаточно освячена діоцезом Портленда. Два органи церкви, виготовлені канадською компанією Casavant Frères з Квебеку, також були освячені цього року. Завершення будівництва церкви не лише підтверджує традиційні цінності побожності та релігійної свободи Нової Англії, але й відображає зростаючі зв'язки франко-канадців зі своєю новою батьківщиною."
 new_england_events.17.a: "Чекаємо на вас цієї неділі!"

 # Сидячі страйки
 new_england_events.18.t: "Верховний суд відхиляє трудову справу"
 new_england_events.18.d: "Право на свободу слова завжди було опорою американської демократії. Хоча початок 1930-х років характеризувався численними страйками та протестами, уряд майже не придушував ці акти непокори, якщо вони не ставали насильницькими. Одним із методів, які використовували страйкарі, був «сидячий страйк» — форма громадянської непокори, за якої працівники захоплювали свої робочі місця, «сідаючи» за свої робочі станції.\n\nПроте у знаковій справі Верховний суд Нової Англії постановив, що учасники сидячих страйків можуть бути звільнені, скасувавши рішення Національної ради з трудових відносин (NLRB), яка заявляла, що страйкарі мають бути поновлені на посадах. На заводі General Electric у Шенектаді робітники намагалися створити профспілку. Компанія підіслала шпигуна в профспілку, коли та почала вимагати перегляду контракту. Постійна відмова компанії йти на компроміс призвела до того, що розчарована профспілка організувала сидячий страйк, зупинивши частину заводу. Після кількох спроб поліції, викликаній для виселення страйкарів, нарешті вдалося це зробити. NLRB наказала компанії поновити звільнених, стверджуючи, що дії компанії перед страйком були незаконними. Справа була передана головному судді Чарльзу Евансу Х'юзу, який постановив, що сидячі страйки є «вагомою причиною» для звільнення, а NLRB не має повноважень змушувати компанію знову наймати страйкарів. Хоча прямо не вказано, що сидячі страйки є незаконними, рішення суду та його формулювання означають, що такий вид протесту в Новій Англії фактично приборкано."
 new_england_events.18.a: "Нищівний удар по боротьбі робітників"

 # Зал слави бейсболу
 new_england_events.19.t: "Монумент героям бейсболу"
 new_england_events.19.d: "Хоча від старої Америки залишилося небагато через велике лихо, що розірвало націю, від Мангеттена до Сан-Франциско одне залишається незмінним для всіх американців — любов і поціновування бейсболу. Беручи свій початок наприкінці першої громадянської війни, бейсбол залишається давньою американською традицією, популярність якої різко зросла в перші двадцять років XX століття.\n\nПопри гул військових літаків у небі, бейсбол досі є популярною розвагою для людей різного віку по всій країні, особливо в Новій Англії. Філантроп і бізнесмен Стівен Карлтон Кларк є великим фанатом спорту і прагне вшанувати тих, хто продемонстрував видатні досягнення. Уродженець Куперстауна в Нью-Йорку, Кларк з болем спостерігав, як місто бореться з Великою депресією, і прагнув збільшити доходи міста шляхом оновлення його культурних установ. Зал слави був задуманий як майбутній пантеон усіх героїв бейсболу, старих і нових; останніми до нього були включені представники класу 1936 року: Тай Кобб, Бейб Рут, Хонус Вагнер, Крісті Метьюсон і Волтер Джонсон. Музей щойно відкрився, а вболівальники вже вимагають включення своїх кумирів — доказ незмінної любові Америки до улюбленого спорту, навіть коли майбутнє нації залишається невизначеним."
 new_england_events.19.a: "Починаємо гру!"

 # Трагедія на залізниці
 new_england_events.20.t: "Трагедія на залізниці Нью-Йорк Сентрал"
 new_england_events.20.d: "Потужний вибух привернув увагу цікавих перехожих із Літтл-Фолс, які натрапили на уламки потяга, що зійшов з рейок. Свідок, якому вдалося вижити, повідомив, що причиною аварії став крутий поворот під назвою Ґалф-Керв. Машиніст, 65-річний Джессі Г. Ерл, вибився з графіка через погоду та несправний двигун. Сподіваючись надолужити час, він вів потяг на занадто великій швидкості для безпечного проходження повороту. Така спроба скоротити час зрештою коштувала життя 30 пасажирам і йому самому, всього за місяць до запланованого виходу на пенсію."
 new_england_events.20.a: "Наші залізниці мають бути безпечнішими!"

 # Землетрус
 new_england_events.21.t: "Землетрус у Нью-Гемпширі"
 new_england_events.21.d: "24 грудня жителі Оссіпі прокинулися від тремтіння землі — зсувалися навіть кухонні плити. Землетруси не є поширеним явищем у Нью-Гемпширі, хоча в його історії протягом XVII століття було два сильні поштовхи.\n\nЦей землетрус став наступним після попереднього, що стався 20 грудня; обидва мали магнітуду 5,5 та максимальну інтенсивність за шкалою Меркаллі VII (дуже сильний). Поштовхам бракувало руйнівності та масштабу сумнозвісного землетрусу 1906 року в Сан-Франциско, але наслідки все одно довелося усувати. Надходили повідомлення про тріщини в трубах, стінах і меблях, а також про обсипану штукатурку поблизу епіцентру. Землетрус пошкодив колодязі, зробивши воду коричневою, призвів до зміщення пам'ятників на кладовищах, а один старий будинок зсунувся майже на 12 дюймів. Групи реагування були негайно відправлені для оцінки збитків, які, на щастя, виявилися незначними."
 new_england_events.21.a: "Мати-природа бере своє."

 # USO
 new_england_events.22.t: "Сформовано Об'єднані організації обслуговування"
 new_england_events.22.d: "Моральний дух завжди був важливим фактором у мистецтві війни. Не секрет, що Нова Англія — це «Давид», який бореться проти кількох голіафів: нам бракує промисловості та людських ресурсів інших фракцій громадянської війни. Через низький бойовий дух в армії президент Асоціації молодих християнок Мері Шотвелл Інгрем переконала президента [NEE.GetLeader] профінансувати створення служби морального відпочинку для військовослужбовців Нової Англії.\n\nЗа схвалення президента кілька некомерційних організацій об'єдналися у USO (United Service Organisation). Церкви, амбари, залізничні вагони, музеї та навіть зруби стали розважальними центрами для солдатів. Там вони могли відпочити, потанцювати, подивитися фільми та, звісно, пригоститися безкоштовною кавою та пончиками. USO відома тим, що організовує концерти поблизу лінії фронту, даючи втомленим бійцям надію в розпал відчайдушної війни. Знамениті голлівудські біженці, як-от Бетт Девіс і Спенсер Трейсі, приєдналися до виступів перед солдатами в окопах. USO також залучила тисячі жінок-волонтерок, які дарували втомленим солдатам години затишку, нагадуючи їм про коханих та сестер, яких вони залишили вдома заради боротьби за американську свободу."
 new_england_events.22.a: "Ми воюємо за правильну Америку!"

 # Капітан Америка

 new_england_events.23.t: "Комікси про Капітана Америку з'являються на полицях!"
 new_england_events.23.d: "У хаосі облоги Нью-Йорка мультиплікатори Джо Саймон і Джек Кірбі втекли до рідного міста Джо — Рочестера, штат Нью-Йорк, сподіваючись урятуватися від синдикалістського терору. Прагнучи надихнути молодих читачів іти на службу, Саймон і Кірбі випустили комікс «Капітан Америка», який швидко став надзвичайно популярним.\n\nБагато новобранців знайшли відгук у походженні Капітана: звичайний Стів Роджерс, який, попри свою кволу статуру, знову і знову намагався записатися до армії для боротьби з радикалами, що загрожують Америці. За порадою вченого Роджерс приймає суперсироватку, яка кардинально посилює його фізичні здібності, перетворюючи його на ідеал людської форми. Як «Капітан Америка», Роджерс та його напарник Бакі Барнс борються з ворогами Америки, такими як синдикаліст Червоний Череп, а також демагогами Макартуром і Г'юї Лонґом, які зображені як палії війни. Хоча дехто скаржився на надмірну політизованість, Саймон визнав, що персонаж був свідомим політичним творінням. Капітан Америка став символом того, що уряд Нової Англії представляє справжню Америку. Зі своїм щитом із вібраніуму, прикрашеним зірками та смугами, «Кеп» нагадує юним читачам, що навіть тендітний хлопчик із Брукліна може стати найвидатнішим солдатом Америки."
 new_england_events.23.a: "Просто хлопець із Брукліна"

 # Деніел Берд
 new_england_events.24.t: "Смерть Деніела Берда"
 new_england_events.24.d: "11 червня 1941 року пішов із життя Деніел Картер Берд — засновник організації «Сини Деніела Буна», яка згодом об'єдналася з Бойскаутами Америки.\nБерд народився в Цинциннаті у 1850 році в родині митців. Змалку він досліджував ліси, роблячи замальовки природи. Ставши ілюстратором Марка Твена, Берд зрештою очолив журнал Recreation. У 1910 році він став одним із перших національних комісарів скаутів, надихаючи покоління молоді протягом тридцяти років. Будучи єдиним володарем золотого значка Орла, він працював із кадетськими академіями, виховуючи молодь у період гострої класової напруги. Старий скаут завершив свій шлях у віці 91 року в Сафферні, штат Нью-Йорк. Як рідкісний виняток у заходах безпеки, уряд дозволив кільком юним скаутам із Чикаго — осередку американського синдикалізму — взяти участь у почесній варті. Вони приєднаються до похоронної процесії у Монсі, щоб вшанувати лідера молоді, який понад усе хотів бачити американське юнацтво патріотичним, самостійним та мужнім."
 new_england_events.24.a: "Memento Mori."

# RCAF Crash
 new_england_events.25.t: "Літак RCAF впав у озеро на півночі Вермонту"
 new_england_events.25.d: "Цей серпневий вечір у Ньюпорті здавався звичайною літньою ніччю. Над головами пролетів одномоторний навчальний літак Королівських ВПС Канади — нічого незвичайного, враховуючи зв'язки та близькість Нової Англії та Канади. Раптом літак почав неконтрольовано спірально падати, занурившись носом у озеро на західному березі. Стурбовані громадяни поспішили до уламків, але марно: єдиний пілот загинув у результаті того, що виглядало як нещасний випадок.\n\nПілотом був Віллі Макнайт, 23-річний ас RCAF. Народжений в Едмонтоні, Віллі був відомий своєю бунтарською вдачею; ще в школі він доводив вчителям, що, попри атлетизм, він майстер створювати проблеми. Його зухвалість збереглася і в університеті, коли Макнайт записався до RCAF, щоб узяти участь у відвоюванні рідних островів Антантою. Його літак у бою мав характерне зображення скелета з косою під кабіною — memento mori для опонентів, а можливо, іронічний жарт над ворогами-синдикалістами. Проте, попри дивовижний рекорд Макнайта у 17 перемог, схоже, доля не була прихильною до молодого пілота."
 new_england_events.25.a: "Яка трагедія."

 # Залізнична аварія Лаккаванна
 new_england_events.26.t: "Залізнична катастрофа Лаккаванна"
 new_england_events.26.d: "Теплого серпневого вечора пасажирський потяг залізниці Делавер — Лаккаванна — Вестерн сполученням Нью-Йорк — Баффало потрапив у важку аварію, зіткнувшись із вантажним потягом. Перевозячи 500 пасажирів із Гобокена, потяг вийшов із Бінгемтона із запізненням на 30 хвилин. Вантажний потяг мав відійти на бічну колію, щоб пропустити пасажирський, але помилково повернувся на магістраль під час маневрування, ігноруючи сигнал зупинки. О 17:22 пасажирський потяг зачепив двигун вантажного і зійшов з рейок.\n\nБагато людей опинилися в пастці у вагоні, деяким вдалося врятуватися, розбивши вікна. Майже всі з 29 загиблих померли від опіків парою з котла вантажного двигуна, яка заповнила вагон. Завдяки швидкій реакції місцевого шерифа рятувальники, пожежники та медики оперативно прибули на місце. Багато пасажирів були військовослужбовцями, тому вони сформували невеликий загін поліції, щоб тримати глядачів на відстані до прибуття підкріплення. Офіційне розслідування визнало інцидент нещасним випадком, хоча залізниці довелося встановити додаткові запобіжні пристрої."
 new_england_events.26.a: "Абсолютна трагедія!"

 # Граната BEANO
 new_england_events.27.t: "Граната BEANO"
 new_england_events.27.d: "Поки більшість наших солдатів звикли до традиційних гранат MK II, наш військовий штаб отримав цікаву пропозицію від корпорації Eastman Kodak із Рочестера. Граната BEANO «T-13» — це сферична граната за вагою та розміром як звичайний бейсбольний м'яч. У Kodak стверджують, що завдяки такій формі вона ідеальна для наших бійців: адже будь-який молодий американець вміє влучно кидати м'яч на велику відстань.\n\nT-13 вагою 12 унцій оснащена ударним детонатором, що активується у польоті. Її планували кидати саме як бейсбольний м'яч. Однак початкові випробування виявилися катастрофічними: раптових нещасних випадків було більше, ніж успіхів. Наше вище командування не вражене; схоже, T-13 не пройде відбір."
 new_england_events.27.a: "Це не ті гранати, які ми шукаємо."

 # Ксерографія (Kodak/Xerox)
 new_england_events.28.t: "Прорив у ксерографії"
 new_england_events.28.d: "Захоплююча розробка в галузі друку: чоловік на ім'я Честер Карлсон звернувся до численних підприємств зі своїм патентом на техніку сухого фотокопіювання, яку він назвав «ксерографією». Його історія — це справжнє втілення американської мрії.\n\nНароджений у штаті Вашингтон у 1906 році, Карлсон у юності працював на різних роботах через скрутне фінансове становище сім'ї. Він завжди цікавився винахідництвом, надихаючись успіхом Томаса Едісона. Карлсон навчався в Каліфорнійському технологічному інституті, де заліз у борги через вартість навчання. У розпал Великої депресії він залишився без роботи.\n\nУ 1936 році Карлсон почав вивчати право в Нью-Йорку посеред хаосу, що охопив націю. Проводячи ночі в публічній бібліотеці, він втомився переписувати юридичні книги вручну, бо не мав грошей на їх купівлю. Це підштовхнуло його до створення копіювального апарата. Після незліченних експериментів у крихітній квартирі, 22 жовтня 1938 року він та австрійський емігрант Отто Корней досягли прориву, зробивши першу у світі ксерографічну копію. Сигнальний корпус армії вже виявив зацікавленість у сухих копіях, що виробляються швидше за традиційні фотографічні методи."
 new_england_events.28.a: "Але чи купить це армія?"

 # Town Line
 new_england_events.29.t: "Таун-Лайн повертається до союзу"
 new_england_events.29.d: "Маленьке поселення Таун-Лайн в окрузі Ері, штат Нью-Йорк, тривалий час стверджувало, що відокремилося від Сполучених Штатів. Тепер, під час конфлікту в Новій Англії, Таун-Лайн офіційно оголосило про своє повернення до складу Нової Англії на знак єдності та підтримки військових зусиль.\n\nЦя історія почалася під час першої громадянської війни. У 1861 році жителі на неформальних зборах проголосували за вихід із США, ймовірно, щоб уникнути військового призову. Проте, оскільки Таун-Лайн не був офіційним муніципалітетом, ані Конфедерація, ані Союз не визнали це відокремлення. Тепер мешканці вирішили проголосувати ще раз, і цього разу 90 голосами проти 23 Таун-Лайн скасував своє рішення 1861 року."
 new_england_events.29.a: "Нарешті час настав."

 # Доктор Сьюз
 new_england_events.30.t: "І подумати тільки, що я бачив на вулиці Малберрі"
 new_england_events.30.d: "Нова книга незабаром може опинитися в руках школярів Нової Англії. Відкинута майже 20 видавцями, книга «І подумати тільки, що я бачив на вулиці Малберрі» нарешті побачила світ у видавництві Vanguard Press. Це ритмічна дитяча історія, наповнена фантазією дитини та яскравими ілюстраціями.\n\nАвтор під псевдонімом «Доктор Сьюз» — це Теодор Ґейзель, 33-річний житель Нової Англії німецького походження. Ґейзель навчався в Дартмутському коледжі та Оксфордському університеті. У 1936 році, після подорожі Європою, ритмічний звук двигунів корабля надихнув його на створення віршованої схеми книги. Втікши з Нью-Йорка як один із багатьох біженців, Ґейзель повернувся до рідної Нової Англії. За його словами, він мало не спалив рукопис після чергової відмови, поки випадкова зустріч із однокласником не призвела до публікації книги, яка вже отримує схвальні відгуки."
 new_england_events.30.a: "Дітям сподобається!"

 # Фільм "Відважні капітани"
 new_england_events.31.t: "Відважні капітани"
 new_england_events.31.d: "Посеред напруженості громадянської війни кінокомпанія Нової Англії випустила касовий хіт «Відважні капітани». Знятий у Новій Англії за мотивами роману Редьярда Кіплінга, фільм розповідає емоційну історію морського братерства у підступних водах.\n\nГоловний герой, Гарві Чейн, — розпещений син магната, який під час подорожі випадає за борт і рятується португальсько-американським моряком Мануелем Фіделло (у виконанні Спенсера Трейсі). На борту шхуни Гарві розуміє, що його багатство нічого не варте, і поступово дорослішає під наглядом Мануеля, який стає для хлопця наче батьком. У фіналі Мануель гине в крижаному морі, а Гарві повертається до батька іншою людиною. Критики хвалять фільм за відображення духу Нової Англії та нагадування про стійкість, необхідну для подолання будь-яких труднощів."
 new_england_events.31.a: "Хтось, дайте мені серветку..."

 # Бетт Девіс
 new_england_events.32.t: "Бетт Девіс"
 new_england_events.32.d: "Уродженка Нової Англії та дедалі помітніша постать на екранах — це не хто інший, як Бетт Девіс. Народившись у Лоуеллі, Массачусетс, «Бетті» розпочала свою кар'єру на Бродвеї, а потім у Голлівуді. Описана як вродлива і чарівна, Девіс стала зіркою завдяки ролям у таких фільмах, як «Людина, що грала бога». Втікши з охопленої війною країни, вона повернулася додому, де відіграла значну роль у розвитку місцевої кіноіндустрії.\n\nДевіс здобула величезну популярність серед військовослужбовців, продавши військових облігацій на 2 мільйони доларів за два дні. Вона також наполягала на створенні «Голлівудської їдальні» для солдатів, де актори могли б розважати втомлені війська. Хоча в кіно вона часто обирає ролі антагоністок, війна змусила її частіше з'являтися в образах, що допомагають відволікти глядачів від суворої реальності."
 new_england_events.32.a: "Вона зробила це нелегким шляхом."

 # Страйк Remington Rand
 new_england_events.33.t: "Завершення страйку Remington Rand"
 new_england_events.33.d: "З травня 1936 року профспілки міст Тонаванда, Іліон та Сіракузи страйкують проти компанії Remington Rand. Натхненні синдикалістськими рухами, робітники розлютилися через чутки про продаж фірми компанії, яка не визнає профспілку. Протести стали насильницькими: робітники створювали саморобні бомби та кидали в поліцію залізні кулі. Вже була пролита кров, декого зі страйкарів застрелила поліція.\n\nКомпромісу не видно, і очевидним вибором здається відправка Національної гвардії для придушення бунту. Проте дехто наголошує, що це лише підігріє напруженість, якою скористаються синдикалісти на нашому кордоні. Замість цього пропонують спробувати переговори, щоб заслужити довіру робітників."
 new_england_events.33.a: "Викликати Національну гвардію"
 new_england_events.33.b: "Ми можемо бути розсудливими."

 #Crack Down:
 new_england_events.34.t: "Наслідки страйку Remington Rand"
 new_england_events.34.d: "Поява перших загонів Національної гвардії налякала страйкарів. Протестувальники, які ставали дедалі сміливішими протягом останніх тижнів, почали вигукувати не лише образи, а й кидати предмети в гвардійців. Ніхто не знає, хто зробив перший постріл, але страйкарі та гвардійці були втягнуті в хаотичний вир насильства та люті, що призвело до численних поранень.\n\nНа прохання губернатора штату до Тонаванди, Іліона та Сіракуз прибуло підкріплення Національної гвардії. Опинившись у значній меншості, страйкарі почали розходитися, але гвардійці взялися за масові арешти, заковуючи лідерів протесту в кайдани. Дії Національної гвардії виявилися напрочуд ефективними. Зіткнувшись із військовою силою, робітники погодилися припинити страйк, проте до президента [NEE.GetLeader] виникли серйозні запитання. Страйкарі, безсумнівно, використають цей акт як привід для пошуку підтримки у синдикалістських елементів у Чикаго. Преса та штат Нью-Йорк розкритикували губернатора за репресії, стверджуючи, що використання Національної гвардії було провісником тиранії."
 new_england_events.34.a: "У нас не було вибору."

 # Успішні переговори Remington Rand
 new_england_events.35.t: "Страйкарі замирені"
 new_england_events.35.d: "Після виснажливих і напружених переговорів, під час яких обидві сторони принаймні раз погрожували піти, страйкарі заводу Remington Rand погодилися на умови, запропоновані компанією. Робітники були вгамовані, а компанія Ренда офіційно визнала їхнє право на створення профспілок. Багато хто зі страйкарів, заарештованих під час протестів, був поновлений на роботі.\n\nХоча багато хто в країні вітає це як перемогу робітничого класу, цей успіх стурбував частину суспільства. Якщо робітники й надалі радикалізуватимуться та організовуватимуть смертоносні страйки, що паралізують і без того виснажену економіку, невідомо, як скоро Нова Англія впаде під натиском синдикалістської загрози. Поки заводи відкриваються, а страйкарі повертаються до роботи, багато хто в уряді задається питанням, чи буде Нова Англія в безпеці від хвилі революції."
 new_england_events.35.a: "Слова вирішують проблеми."

 # Взуттєвий страйк
 new_england_events.36.t: "Взуттєвий страйк"
 new_england_events.36.d: "Можливо, натхненні громадянською війною, що розірвала нашу націю, робітники взуттєвої промисловості в містах Льюїстон та Оберн розпочали страйк. Протестувальники, багато з яких мають франко-канадське походження, вимагали підвищення заробітної плати, покращення умов праці, скорочення робочого тижня та представництва профспілок. Кількість учасників зросла до тисяч. Невдовзі після початку страйків виробники запропонували 10% підвищення зарплати, але ці пропозиції були швидко відхилені.\n\nОскільки протести стають дедалі жорстокішими і страйкарі не збираються відступати, президент [NEE.GetLeader] попросив губернатора штату Мен розібратися з цією ситуацією. Губернатор може викликати Національну гвардію, що призведе до сутичок і відкритого насильства, але напевно втихомирить протести. Альтернативно, він може піти на переговори, хоча це означатиме серйозну втрату репутації для уряду Нової Англії."
 new_england_events.36.a: "Жодних переговорів!"
 new_england_events.36.b: "Перо сильніше за меч."

 # Придушення взуттєвого страйку
 new_england_events.37.t: "Розправа над учасниками взуттєвого страйку"
 new_england_events.37.d: "За згодою губернатора для боротьби з непокірними страйкарями була викликана Національна гвардія. Робітники та організатори профспілок, чисельністю в кілька тисяч, спробували пройти маршем солідарності через Південний міст у Льюїстоні. Багато протестувальників були жінками, готовими відстоювати свої права.\n\nНаціональна гвардія та поліція негайно розпочали сутички, і страйкарі швидко почали тікати. Газета Lewiston Evening Journal назвала цю подію просто «Червоною середою» через жорстокість інциденту. Організатори страйку, такі як Пауерс Хепґуд, були негайно заарештовані та засуджені до коротких термінів, а гвардійці кілька ночей патрулювали Льюїстон та Оберн. Хоча президент привітав губернатора за ініціативу в приборканні заворушень, невдоволення серед населення, особливо серед франко-канадців Мену, лише зросло у відповідь на жорсткі заходи."
 new_england_events.37.a: "Ми дали їм шанс."

 # Переговори взуттєвого страйку
 new_england_events.38.t: "Переговори зі страйкарями"
 new_england_events.38.d: "Дослухавшись до порад своїх радників, губернатор погодився розпочати переговори. У той час як страйкарі були непохитні у своїх вимогах щодо зарплат та умов, губернатор наполягав, щоб профспілки перебували під наглядом текстильних компаній. Зрештою страйкарі погодилися на контроль з боку компаній в обмін на виконання решти вимог. Преса сприйняла це як необхідне полегшення у ці непевні часи.\n\nПроте готовність губернатора йти на поступки викликала сумніви в його здатності керувати штатом Мен. Багато хто вбачає в синдикалізмі постійну загрозу, і задоволення вимог робітників може лише заохотити радикальні ідеї. Демократи Мену розкритикували м'яку позицію губернатора, назвавши її «капітуляцією перед синдикалізмом»."
 new_england_events.38.a: "Успіх!"

 # Ураган 1938

 new_england_events.40.t: "Великий ураган 1938 року"
 new_england_events.40.d: "Те, що спочатку вважалося незначною загрозою, ураган «Янкі Кліппер» досяг Лонґ-Айленда 21 вересня і вже за кілька годин перетворився на найпотужніший ураган, що проходив через Нову Англію з часів Великого колоніального урагану 1635 року.\n\nРухаючись на північ через Коннектикут, Род-Айленд і Вермонт, шторм забрав життя майже 700 людей. На момент завершення стихії понад 57 000 будинків були зруйновані або пошкоджені, а дорожні мережі по всьому регіону лежали в руїнах. За попередніми оцінками, знадобляться місяці або навіть роки, щоб знову відкрити їх для руху."
 new_england_events.40.a: "Боже, врятуй нас усіх."

### Underground Railroad ###
 new_england_events.50.t: "Підпільна залізниця"
 new_england_events.50.d: "Заснована у XVIII столітті, перша підпільна залізниця слугувала мережею секретних маршрутів, метою яких було таємне переправлення афроамериканських рабів із Тринадцяти колоній до Канади, де рабство вже було скасовано.\n\nТепер, коли американська громадянська війна руйнує домогосподарства по всій Америці, а ідеологічна боротьба призводить до примусового вигнання або навіть масових вбивств американців, наш уряд знову розпалив вогонь старої «Залізниці». За допомогою місцевих жителів по обидва боки кордону ми відновили цю мережу з надією на безпечне транспортування біженців до нашої маленької нації."
 new_england_events.50.a: "Але наші можливості не безмежні..."

#WCA
 new_england_events.51.t: "Міграційна криза на озері Ері"
 new_england_events.51.d: "Війна вирує лише кілька тижнів, а протиборчі сили вже ведуть запеклі бої навколо Великих озер. Поки товариш стріляє в товариша, а лінія фронту зміщується в обох напрямках, не можна забувати про величезні втрати серед цивільного населення.\n\nЦі люди, часто опиняючись у самому центрі битви, гинучи під час бомбардувань або від рук фанатиків з обох сторін, масово тікають від бойових дій до нашої країни. Оскільки сухопутний шлях із кожним днем стає дедалі небезпечнішим, на озері Ері помічають величезну кількість хитких човнів, що у відчайдушній спробі намагаються дістатися нашого мирного притулку. Стан цих плотів часто настільки жахливий, що багато хто навіть не встигає перетнути кордон, не кажучи вже про те, щоб потрапити в наші безпечні руки. Допомогові організації, такі як «Об'єднана Америка» та Червоний Хрест, з'їхалися до узбережжя озера, щоб допомогти тим, хто вижив у цій небезпечній подорожі, яку часто здійснюють під покровом ночі. Тепер вони просять уряд надати їм більше засобів для порятунку тих, хто переправляється, та для пошуку вцілілих на нашому боці озера.\n\nПроте прагматики в армії побачили в цій «Великій міграції» можливість переправити зброю та спорядження з WCA до наших рук. Вони пропонують відправити таємних агентів до Детройта та Клівленда, які потім переправлятимуть вантажі на плотах біженців до наших патрульних катерів."
 new_england_events.51.a: "Дозволити секретним оперативникам створити базу на острові Пілі."
 new_england_events.51.b: "Ми не можемо наражати на небезпеку життя невинних своїми схемами!"

 new_england_events.52.t: "Успішна операція з контрабанди на озері Ері"
 new_england_events.52.d: "Заховані під лляними простирадлами та між одягом біженців, наші таємні оперативники на іншому боці озера Ері змогли успішно переправити стрілецьку зброю, боєприпаси та медикаменти. Навіть важче спорядження, таке як артилерійські снаряди та розібрані міномети, було перевезено зусиллями нашого американського народу, що було нічим іншим, як героїзмом. Поки що «синди» нічого не підозрюють, але здається цілком природним, що одного разу наше везіння закінчиться..."
 new_england_events.52.a: "Шматок за шматком ми розбираємо цей труп"

 new_england_events.53.t: "Контрабандистів затримано!"
 new_england_events.53.d: "Наша вдача не могла тривати вічно, і вчорашній день став черговим доказом цього. Хоча на човнах контрабандистів не було нічого незвичайного, незначне відхилення в розкладі портового патруля Клівленда застало наших оперативників у розпал злочину. Неможливо було пояснити, чому на немаркованому судні опинилися десятки ящиків із набоями та карабіни; невдовзі човен повернули на берег, а наших агентів кинули за ґрати."
 new_england_events.53.a: "Змінити курс маршрутів, ми не можемо зупинити операцію!"
 new_england_events.53.b: "Це занадто ризиковано, нам слід зосередитися на програмі допомоги біженцям."

 new_england_events.54.t: "Доберман «Джек»"
 new_england_events.54.d: "Поки людина повертається до своєї звичної рутини вбивства сусідів, світ тварин також не залишається осторонь насильства. Однак у Коннектикуті з'явилася щаслива історія, де молодий доберман, за іронією долі названий Джеком, зміг зупинити агентів ополчення, які намагалися підірвати бомбу в Гартфорді.\n\nПес проходив підготовку разом із Національною гвардією Коннектикуту, коли його патруль помітив агентів, які негайно спробували втекти. З мужністю справжнього американця маленький пес одразу погнався за ними і повалив одного з двох чоловіків, що призвело до його захоплення. Цим чоловіком пізніше виявився не хто інший, як Пол Решфорд — ціль, яку давно шукав поліцейський департамент Гартфорда за його причетність до заворушень лише кілька місяців тому і який, схоже, створив цілу мережу оперативників у Коннектикуті.\n\nХоча його захоплення аж ніяк не означає кінець соціалістичної загрози в штаті, «Джек» завдав сильного удару по їхньому керівництву."
 new_england_events.54.a: "Ми висловлюємо подяку цьому доброму хлопчику!"

 new_england_events.55.t: "Біженці з [WCA.GetNameDef]"
 new_england_events.55.d: "Жахи війни продовжують лютувати в [WCA.GetNameDef], і велика міграційна хвиля з їхньої території на нашу, здається, не має кінця. Як і минулого місяця, «Підпільна залізниця» знову призвела до успішного переправлення тисяч цих воєнних біженців до нашої «Тихої гавані»."
 new_england_events.55.a: "Будемо молитися, щоб насильство скоро закінчилося."

#APG
 new_england_events.56.t: "Біженці з [APG.GetNameDef]"
 new_england_events.56.d: "Хоча подорож сповнена небезпек, а бандити та злочинці підстерігають на стежках від далекого Півдня аж до самого Коннектикуту, тисячі людей все одно вирушають у дорогу, сподіваючись знайти мир і захист у нашій країні."
 new_england_events.56.a: "Ласкаво просимо до Нової Англії!"

 new_england_events.59.t: "Призначення поета-лауреата Нової Англії"
 new_england_events.59.d: "Питання про посаду поета-лауреата обговорювалося в політичних колах штатів уже кілька років. Потрібна була людина, яка б представляла сотні митців проти навали кіно та популярної музики як видів мистецтва. Конгрес Нової Англії вирішив заснувати цей титул разом із переосвяченням Бостонського Атенеуму як тимчасової Бібліотеки Конгресу. Головним кандидатом згідно з опитуванням Конгресу є Роберт Фрост, чия творчість демонструє виразну майстерність модерністської поезії Нової Англії. Однак громадські опитування показали прихильність до автора «бульварного чтива» Г. П. Лавкрафта. Лавкрафт написав у газетах, що прийме цю нагороду, але не з'явиться публічно на церемонії. Бібліотека Конгресу опинилася в скрутному становищі."
 new_england_events.59.a: "Роберт Фрост, майстер модернізму."
 new_england_events.59.b: "Г. П. Лавкрафт, майстер жахів."

 new_england_events.60.t: "Втручання заради Джона Вінанта"
 new_england_events.60.d: "Приватне життя президента Вінанта не є темою для газетних пліток, але після сьогоднішнього дня це стало публічною проблемою. Сьогодні ввечері охоронці президента Вінанта знайшли в його спальні заряджений пістолет і після паніки встановили, що замаху не планувалося. Президент Вінант зізнався своїм наближеним, що його таємний роман із Сарою Черчилль закінчився, і він у розпачі через можливі політичні наслідки нестриманості з донькою впливового канадського політика. На щастя, Вінстона Черчилля делікатно повідомили, і він особисто пробачив президента Вінанта. Вінант вирішив узяти кілька днів перерви, щоб відновити душевні сили."
 new_england_events.60.a: "Йому просто потрібно кілька вихідних."

 new_england_events.62.t: "Пожежу в Коконат-Гроув пов'язують із Тобіном"
 new_england_events.62.d: "Розташований на П'ємонт-стріт, 17, у бостонському районі Бей-Вілледж, за кілька кварталів на південь від Бостонського громадського саду, нічний клуб «Коконат-Гроув» добре відомий бостонцям як популярне місце відпочинку знаменитостей. Його відвідували солдати, зірки кіно та навіть такі політики, як Моріс Тобін; також ходили чутки про зв'язки клубу з мафією. Спочатку будівля була гаражем і складом, але в клубі панувала атмосфера «південних морів» з колонами у вигляді пальм.\n\nОднак о 22:15 вечора 28 листопада молодий солдат викрутив лампочку в залі, щоб усамітнитися зі своєю супутницею. Викликали молодого офіціанта, щоб той замінив лампочку; не знайшовши її в темряві, він запалив сірник. Свідки повідомляли, що невдовзі після цього полум'я вирвалося з пальмового листя під стелею. Попри зусилля персоналу, вогонь миттєво поширився клубом. Головним входом були єдині двері-вертушка, які заклинило під час паніки. На момент прибуття пожежників загинуло 492 людини. Найжахливішим було те, що деякі тіла знаходили з напоями в руках — вогонь і токсичний дим наздогнали їх занадто швидко.\n\nВласника клубу Барні Веланскі засудили за ненавмисне вбивство через нехтування правилами безпеки. Веланскі хизувався своїми стосунками з мером Морісом Тобіном. Слідчі також виявили, що клуб не мав ліцензій на алкоголь та їжу, а ремонт робили неліцензовані підрядники. У місті навіть лунають заклики до відставки Тобіна через цю жахливу трагедію."
 new_england_events.62.a: "Ганьба для міста."

 new_england_events.64.t: "Канадці подають заявки до Вест-Пойнта"
 new_england_events.64.d: "Прибув набір курсантів [GetYear] року, і їхня кількість значно нижча за очікувану. Оскільки сенатори все ще мають рекомендувати перспективних юнаків, кількість нових кадетів впала зі 100 лише до 14. Було запропоновано дозволити канадським політикам рекомендувати своїх молодих людей до Вест-Пойнта. Ми гостро потребуємо нових офіцерів, але водночас ця давня традиція гарантує, що інституція не буде використана іноземними державами, а тим паче Короною."
 new_england_events.64.a: "Категорично ні!"
 new_england_events.64.b: "Нам справді потрібні люди."

# Niagara Bridge Collapse - Possible Expansion
 new_england_events.65.t: "Історичний міст обвалився на Ніагарському водоспаді"
 new_england_events.65.d: "Тисячі глядачів зібралися сьогодні разом, щоб побачити остаточне падіння «Медового мосту». Сильні пориви вітру з боку озера Ері спрямували величезну кількість льоду через водоспад. Майже 100 футів льоду обрушилися на опори мосту, що зрештою призвело до руйнування конструкції. Навіть укріплення висотою 24 фути, додані у 1899 році після того, як крижаний затор уже загрожував мосту, не змогли запобігти обвалу. На щастя, низька температура відлякала більшість відвідувачів водоспаду, тому ніхто не постраждав.\n\nПівнічно-східні штати зараз переживають одну з найсуворіших хвиль холодів цієї зими. Вітри з мінусовою температурою та сильна хуртовина прийшли на південь із Канади, принісши до Нової Англії рекордні морози за останні два роки. У деяких частинах країни термометри показують 24 градуси нижче нуля. Для багатьох жителів Нової Англії холоди та снігові ковдри є ознаками тривожних і непевних часів, поки в країні вирує громадянська війна."
 new_england_events.65.a: "Наступного разу ми побудуємо опори вище."

 # Шоколадне печиво
 new_england_events.66.t: "Свіже з печі"
 new_england_events.66.d: "Заснований у 1930 році, Toll House став досить популярним закладом у Новій Англії. Зокрема, господиня готелю прославилася на всю країну своїми смачними рецептами, включаючи те, що вона описує як «печиво з шоколадною крихтою». Улюблене місце для молоді, літніх людей і навіть політиків на кшталт Джозефа Кеннеді-старшого, Рут Грейвс Вейкфілд уособлює образ матері Нової Англії у своїй пристрасті та відданості випічці.\n\nРут народилася в Істоні, Массачусетс, і працювала вчителькою домоводства та дієтологом у лікарні. У 1930 році Рут та її чоловік Кеннет Дональд Вейкфілд купили туристичний будиночок у Вітмені. Це було місце, де пасажири традиційно платили мито (toll), міняли коней та їли домашню їжу. Рут готувала всі страви в готелі, здобувши армію шанувальників. Але саме її печиво принесло їй національну славу.\n\nВейкфілд стверджує, що вона спеціально додала подрібнені шматочки напівсолодкої шоколадної плитки Nestle у тісто. Хоча репортери помилково заявляли, що це сталося випадково, Рут наполягає, що навмисно прагнула створити печиво зі смачними шматочками шоколаду. Печиво дійшло до солдатів, дислокованих у Массачусетсі, багато з яких писали листи своїм родинам із проханням надіслати його на фронт. Нація була у захваті, а Вейкфілд погодилася передати Nestle права на назву печива Toll House за один долар і довічний запас шоколаду."
 new_england_events.66.a: "Як смачно!"

 # Міст Тисячі островів
 new_england_events.67.t: "Вшанування мосту Тисячі островів"
 new_england_events.67.d: "Індустріальне диво довжиною 8,5 миль (13,7 км), що сполучає кордони Нової Англії та Канади, нарешті добудовано, з'єднавши штат Нью-Йорк з Онтаріо. Цього дня президент [NEE.GetLeader] офіційно присвятив міст Новій Англії, заявивши, що він знаменує період тривалої дружби та братерства між американцями та їхніми північними сусідами. Завдяки його благословенню міст незабаром відкриється на радість канадським та американським глядачам.\n\nМіст був дітищем докторів Девіда Стейнмана та Голтена Робінсона, біженців із Нью-Йорка. Темпи будівництва були неймовірно швидкими — проєкт завершили на десять тижнів раніше графіка, всього за шістнадцять місяців. Дизайн прольотів вписується в регіональну топографію, створюючи гарні мости з художньою витонченістю, а кольори підібрані під навколишнє середовище. Після промови президента перші цивільні та військові автомобілі почали рух через міст — перші з багатьох, оскільки міст служить непорушним фізичним зв'язком між канадським та американським народами."
 new_england_events.67.a: "Ура!"

 # Комітет "Америка перш за все"
 new_england_events.68.t: "У Новій Англії сформовано комітет «Америка перш за все»"
 new_england_events.68.d: "У кампусі Єльського університету в Нью-Гейвені, Коннектикут, виникла нова впливова група. Натхненний відомим авіатором Чарльзом Ліндбергом та священником Чарльзом Когліном, комітет «Америка перш за все» складається з осіб, занепокоєних тим, що тісні відносини Нової Англії з [CAN.GetNameDef] можуть втягнути американців у далеку європейську війну, поки сама Америка палає у руїнах. Навіть відомий політик Девід Волш із Демократичної партії був помічений на мітингах комітету.\n\nКомітет «Америка перш за все» окреслив чіткі пункти, такі як розбудова неприступної оборони Америки та збереження демократії шляхом невтручання у війни Європи. Поки криза поглиблюється, багато хто вдячний Канаді за захист, але багато хто також остерігається зростаючої присутності Канади в американських справах. Тимчасовий уряд Нової Англії існує лише завдяки канадському втручанню, тому знадобиться час, щоб легітимізувати його як справжнього наступника США. Ізоляціоністи чи ні, ніхто в Новій Англії не хоче повернення британців у Бостон, і поки канадці запевняють, що ми в безпеці, лише час покаже, чи є ця окупація тимчасовою."
 new_england_events.68.a: "У них є слушні аргументи..."
 new_england_events.68.b: "Спробувати придушити організацію!"

# Dark Victory
 new_england_events.69.t: "Хіт кіноіндустрії"
 new_england_events.69.d: "Миттєвий хіт прокату, про який говорять критики по всій країні; багато хто стверджує, що «Перемогти темряву» претендуватиме на премію «Оскар». Численні статті вихваляють гру актриси Бетт Девіс, називаючи її виконання гідним нагороди. Фільм є промовистою та драматичною картиною життя вищого суспільства Нової Англії, і він з'явився саме тоді, коли суспільна напруженість досягла апогею. Зокрема, теми смертності та зірковий акторський склад стали запорукою успіху стрічки в кінотеатрах.\n\nЗа сюжетом, дія якого розгортається в Нью-Йорку, Джудіт «Джуді» Трахерн (у виконанні Бетт Девіс) — молода й безтурботна гедоністична світська левиця з Лонґ-Айленда та спадкоємниця, пристрасно захоплена дорогими речами та шкідливими звичками. Попри активний спосіб життя, вона починає страждати від головного болю та погіршення зору. Після кількох інцидентів вона звертається до лікаря за порадою своєї подруги. Вона зустрічає доктора Фредеріка Стіла (у виконанні ірландця Джорджа Брента), який неохоче погоджується допомогти антагоністичній Джуді. Після огляду Стіл розуміє, що в неї злоякісна пухлина мозку, яку неможливо видалити, і Джуді помре протягом року, перед цим повністю осліпнувши. Щоб дати їй надію, Стіл бреше Джуді, дозволяючи їй жити щасливо. З часом між Стілом і Джуді виникають романтичні стосунки, але зрештою Джуді випадково дізнається правду. Після короткої кризи Джуді вирішує піти з життя з гідністю і повертається до Стіла, після чого вони переїжджають до Вермонту. Фільм завершується фіналом, який змушує глядачів плакати: Стіл вирушає презентувати потенційні ліки, поки Джуді остаточно сліпне. Останній діалог між ними отримав високу оцінку жителів Нової Англії за його заспокійливий тон у часи національної кризи. Спокійна та стримана наприкінці, на відміну від своєї поведінки на початку фільму, Джуді нерухомо лежить у ліжку, поки екран гасне."
 new_england_events.69.a: "«Це перемога, тому що ми не боїмося»"

### Freedom Fliers ###
 new_england_events.70.t: "Вибір нашої пропаганди"
 new_england_events.70.d: "Ініціатива «Літуни свободи» була активована нашим урядом, але все ще тривають дискусії щодо змісту повідомлень, які ми скидаємо. Правильне послання може посіяти хаос у тилу ворога, але помилкове — лише зміцнить їхню рішучість.\n\nПитання про те, чи варто націлюватися на цивільне населення, чи безпосередньо на збройні сили, також залишається темою для дебатів. Дехто стверджує, що ворожий тил буде більш сприйнятливим до наших ідей, проте прямий вплив на їхні війська може дати швидший результат."
 new_england_events.70.a: "Спробувати зірвати їхні плани нападу за допомогою дезінформації."
 new_england_events.70.b: "Обманом змусити їхні війська залишити прогалини в обороні."
 new_england_events.70.c: "Посіяти невпевненість у їхньому тилу."
 new_england_events.70.e: "Спробувати деморалізувати їхні війська."

 # Історія Боба Роджерса
 new_england_events.71.t: "Повість про рядового Боба «Шибайголову» Роджерса"
 new_england_events.71.d: "Рядовий Боб завжди був відомим ім'ям у корпусі «Літунів свободи», але саме його нещодавні героїчні дії над ворожою територією принесли йому прізвисько «Шибайголова».\n\nВідправлений разом із 5 іншими членами своєї ескадрильї, він та його побратими були застигнуті зненацька зенітною установкою. Погана розвідка з нашого боку призвела до катастрофи: вся група літаків була розірвана на шматки, і лише рядовий Боб та один із його товаришів вижили після падіння. Опинившись глибоко в тилу ворога, двоє чоловіків взяли на себе проведення серії партизанських акцій, досягнувши значного успіху в перешкоджанні ворожому постачанню.\n\nЇхній успіх тривав недовго: спроба завербувати симпатиків серед цивільних виявилася пасткою. Напарник Боба загинув, а сам Боб втратив праве вухо. Тепер один, без набоїв, він пройшов весь шлях на північ до озера Ері, завжди залишаючись на крок попереду агентів, що його переслідували. Минулого тижня Боб нарешті повернувся до Нью-Йорка на хиткому судні разом із 50 біженцями. Цій хоробрій людині знадобилося 50 днів, щоб прокласти шлях додому, залишивши за собою слід саботажу. Хоча командири надали йому відпустку, Боб уже записався на наступний виліт, заявляючи, що зробив би це знову заради своєї улюбленої нації."
 new_england_events.71.a: "Американська нація дякує своєму синові за службу!"

 # Тимчасові лише за назвою
 new_england_events.72.t: "Тимчасові лише за назвою!"
 new_england_events.72.d: "На превеликий жаль нинішнього уряду, пресі вдалося підняти справжню бурю. Заяви про нелегітимність претензій [ACW_WAR_TAG.GetNameDef] на національну владу набули нового життя. Видатні політики, як-от Теодор Грін, наполягають на розширенні флоту та армії, попри ізоляціоністську позицію Нової Англії. У публічних промовах Грін часто попереджав про небезпеку, яка чекає на Тимчасовий уряд, якщо він не почне діяти. Без належного посилення народ Нової Англії може опинитися під чоботом [ACW_WAR_TAG.GetAdjective] чи іншої фракції.\n\nОстанні заголовки газет ставлять уряд у скрутне становище. Якщо [ACW_WAR_TAG.GetNameDef] не є законним наступником Сполучених Штатів, то єдиний спосіб довести наш авторитет у цьому питанні — це самим стати законним наступником. Політична стрілка відхилилася від ізоляції, і оскільки Тимчасовий уряд вступає у війну проти [ACW_WAR_TAG.GetNameDef], на нас тиснуть, щоб ми заявили про свої претензії як повноправний учасник Другої американської громадянської війни!"
 new_england_events.72.a: "Якщо ми мусимо..."

 # Саботаж у Бедфорді
 new_england_events.73.t: "Саботаж на армійському аеродромі Бедфорда"
 new_england_events.73.d: "Під покровом темряви та за підтримки зсередини іноземним оперативникам вдалося завдати величезної шкоди винищувачам, дислокованим у Бедфорді. Десятки літаків втрачено або пошкоджено, а ангари постраждали від серії вибухів. Нам досі не вдалося їх зупинити, і навіть немає відповіді на питання, до якої фракції належали диверсанти."
 new_england_events.73.a: "Ми що, осліпли? Розгорнути гарнізон!"

 # Перший десант

 new_england_events.74.t: "Перша висадка десанту"
 new_england_events.74.d: "Після місяців ретельного планування сьогодні вранці армія провела свій перший повітряно-десантний експеримент. Хоча це не перший випадок стрибків з парашутом в Америці, раніше вони проводилися лише для скидання кулеметних розрахунків, а не для повноцінних операцій. Після двотижневої програми суворої фізичної підготовки жеребкування визначило черговість стрибків першого експериментального взводу з десяти добровольців. Злетівши з авіабази Сірак'юс, першим стрибок здійснив уродженець Массачусетсу підполковник Корнеліус Е. Раян. Усі десять добровольців успішно приземлилися, швидко дісталися точки збору та виконали завдання. Експеримент визнано повним успіхом."
 new_england_events.74.a: "Тоді почнемо планувати нові висадки."

 # Формування дивізій ВДВ
 new_england_events.75.t: "Формування перших повітряно-десантних дивізій"
 new_england_events.75.d: "Успіх першого тесту переконав армію, що десантні підрозділи мають бути розширені до повноцінних дивізій. Попри високі стандарти підготовки та смертельний ризик, армія санкціонувала потроєння платні десантникам, щоб залучити більше добровольців. Так був сформований 509-й парашутно-десантний полк, а згодом — п'ять батальйонів. Хоча ці підрозділи ще не перевірені в бою, ідея вертикального охоплення, безсумнівно, допоможе в розвитку нашої військової доктрини."
 new_england_events.75.a: "На стіну дах не поставиш."

 # Операція "Пойнтбланк"
 new_england_events.76.t: "Операція «Пойнтбланк» б'є по Сталевому поясу"
 new_england_events.76.d.nee: "З продовженням війни ескалація конфлікту переходить у повітря. У рішучій спробі зламати оборону [395.controller.GetAdjective] у Сталевому поясі та захопити небо над Чикаго, ПС армії розпочали операцію «Пойнтбланк». Ми переходимо від «точкових» денних бомбардувань до активного знищення авіації [395.controller.GetAdjective]. Бомбардувальники Нової Англії отримали наказ атакувати авіаційні заводи, щоб підірвати воєнні зусилля ворога та деморалізувати їхніх цивільних. Ми сподіваємося виманити ворожі винищувачі в бій і виснажити їх у війні на виживаня."
 new_england_events.76.d.defender: "Хоча сирени повітряної тривоги стали частим явищем, уряд Нової Англії нещодавно посилив бомбардування. Вони ескалували денні нальоти на нашу авіаційну промисловість, намагаючись підірвати нашу міць у повітрі. Хоча це тимчасова невдача, наші аси зроблять усе, щоб жодна бомба більше не впала. Ми зосередимося на захисті індустрії, щоб згодом завдати удару у відповідь!"
 new_england_events.76.a: "Чудова робота!"
 new_england_events.76.b: "Ми ще помстимося!"

 NEE_paratroopers_spawn: "П'ять повітряно-десантних дивізій з'являться в штаті Нью-Йорк"

 # Контракти на гвинтівки

 new_england_events.77.t: "Державні контракти на гвинтівки"
 new_england_events.77.d: "Оскільки Тимчасовий уряд Нової Англії опинився на порозі війни, постало питання: з якою компанією укласти контракт на озброєння? Щоб відвоювати решту нації, піхотинці Нової Англії мають бути оснащені найсучаснішими гвинтівками — старі запилені рушниці Національної гвардії не підійдуть. У дебатах постійно лунають два імені: Спрінґфілдська збройова палата та Winchester Repeating Arms Company.\n\nСпрінґфілдська палата, схвалена самим Джорджем Вашинґтоном у 1777 році, є очевидним кандидатом. Вибір на її користь має символічне значення, адже Нова Англія вважає себе останнім бастіоном американської демократії. Окрім легендарної M1903, вони пропонують нову зброю розробки Джона Гаранда — напівавтоматичну гвинтівку «M1 калібру .30», яка показала блискучі результати на тестах.\n\nКомпанія «Вінчестер», заснована в 1866 році, відома своєю моделлю 1873 року — «рушницею, що завоювала Захід». Попри важкі часи Великої депресії, компанія повернулася до ладу завдяки стратегії виробництва лише найякіснішої зброї. Якщо «Вінчестер» отримає контракт, наші солдати матимуть у руках надзвичайно надійні та міцні гвинтівки ручної роботи."
 new_england_events.77.a: "Виробничі лінії Спрінґфілда приведуть нас до перемоги! (Спрінґфілдська збройова палата)"
 new_england_events.77.b: "Майстерність Вінчестера — це все, що нам потрібно! (Winchester Repeating Arms)"

# NEE Marine Training
 new_england_events.78.t: "Відновлення семитижневого навчання"
 new_england_events.78.d: "Через катастрофічні події другої Американської громадянської війни, що вирує на нашому південному кордоні, режим підготовки наших військ було скорочено вдвічі — до 4 тижнів, щоб пристосуватися до обмеженої кількості наявних інструкторів. Така зміна допомогла швидше проводити людей через програму, але мала свою ціну. Порівняння результатів довоєнного випуску з поспішно набраними «37-ками» демонструє величезну різницю. Індивідуальна влучність стрільби впала на цілих 31% протягом періоду поспішного навчання.\n\nВідповідно, навчальний план курсу підготовки морської піхоти, що тимчасово базується в Нью-Лондоні, штат Коннектикут, було відновлено до повної семитижневої тривалості. Додаткова спеціалізація та тренування мають проводитися до того, як новобранці будуть розподілені по своїх частинах. Хоча це завадить швидкій мобілізації військ, наші сили повинні бути в ідеальній формі, щоб належним чином захистити колиску Американської революції!"
 new_england_events.78.a: "Наші люди повинні бути максимально вправними!"

# Mountain Training
 new_england_events.79.t: "Сформовано 10-ту легку піхотну дивізію"
 new_england_events.79.d1: "Натхненний гірською піхотою Австрії та Італії часів Вельткріґу, уродженець Массачусетсу та ентузіаст лижного спорту Чарльз Мінот Доул звернувся до верховного командування армії з проханням створити підрозділи для ведення бою в суворих умовах. Оскільки Нова Англія все частіше втягується в конфлікт, Доул наполягав на створенні спеціалізованої гірської дивізії, здатної діяти на пересіченій місцевості та за суворої погоди. Хоча дехто у військовому командуванні спочатку був налаштований скептично, Доул припустив, що, можливо, краще зробити «солдатів із лижників, аніж лижників із солдатів».\n\nЗавдяки лобістським зусиллям Доула армія розпочала кампанію з набору солдатів до 10-ї легкої піхотної дивізії. Сформована у Форт-Драмі на півночі Нью-Йорка, 10-та легка піхотна була визначена як підрозділ для ведення війни в горах. Розташовані у морозних горах Адірондак, бійці 10-ї пройшли сувору підготовку до гірської та арктичної війни. Їм також доручено розвідувати та наносити на карти гірські стежки, оскільки нація охоплена страхом інфільтрації та саботажу. Через мінусову температуру протягом майже пів року небезпечні умови сформували узи братерства серед цієї згуртованої та дисциплінованої групи."
 new_england_events.79.d2: "Натхненний гірською піхотою Австрії та Італії часів Вельткріґу, уродженець Массачусетсу та ентузіаст лижного спорту Чарльз Мінот Доул звернувся до верховного командування армії з проханням створити підрозділи для ведення бою в суворих умовах. Доул також є засновником Національного лижного патруля, створеного у 1938 році.\n\nЗавдяки лобістським зусиллям Доула Національний лижний патруль був призначений верховним командуванням для набору та перевірки солдатів для 10-ї легкої піхотної дивізії. Хоча дехто у військовому командуванні спочатку був налаштований скептично, Доул припустив, що краще зробити «солдатів із лижників, аніж лижників із солдатів». Сформована у Форт-Драмі, 10-та легка піхотна дивізія призначена для прориву ворожої оборони на підступній місцевості. Перебуваючи у морозних горах Адірондак, бійці пройшли сувору підготовку до арктичної війни. У випадках авіакатастроф на землі Нової Англії 10-та дивізія та Національний лижний патруль діють як групи швидкого реагування — рятувальники, здатні пробиватися крізь найгірші зими Нової Англії. Небезпечні умови сформували міцні узи братерства серед цієї дисциплінованої групи."
 new_england_events.79.a: "Найсуворіші умови — ніщо для наших людей!"

 new_england_events.80.t: "Повстання янкі"
 new_england_events.80.d: "Хоча нашим наміром при окупації Нової Англії був захист місцевих жителів від жахів американської громадянської війни, схоже, багато хто з них сприйняв це інакше. Кілька лідерів у Бостоні публічно звинуватили Канаду в бажанні повернути цю територію під британське правління та витиснути з регіону все, що можливо, задля повернення до рідних островів. Вони стверджують, що їм було б краще об'єднатися зі своїми американськими братами та сестрами. Напруження в регіоні досягло точки, коли нам, можливо, доведеться переглянути наш план щодо самоврядування Нової Англії... або зіткнутися з тривалим періодом повстань."
 new_england_events.80.a: "Це ні до чого не призведе."
 new_england_events.80.b: "Тху, нехай буде так — створюйте тимчасовий уряд."

 new_england_events.85.t: "Повстання янкі закінчено"
 new_england_events.85.d: "Знадобилося багато місяців, але, схоже, так зване «повстання янкі» у Новій Англії закінчено. Лідери опору або захоплені, або втекли, а місцеві органи влади, що залишилися, схоже, готові співпрацювати з канадським урядом — імовірно, під враженням від фотографій руйнувань у решті Америки, що рясніють на сторінках їхніх газет. Більше проблем у цьому регіоні бути не повинно."
 new_england_events.85.a: "Нарешті!"

# WCA - Send Infiltrators
 new_england_events.86.t: "Саботаж на Північному Сході?"
 new_england_events.86.d: "Тепер, коли Пенсільванія під нашим контролем, ми можемо звернути увагу на капіталістичних боягузів у [NEE.GetNameDef]. Після нещодавнього розриву їхніх відносин із реакційним канадським урядом їхнє становище стало набагато менш стабільним. Хоча з часом ми розберемося з ними, щоб об'єднати американський континент під червоним прапором соціалізму, зараз нам слід зосередитися на створенні хаосу та розладу на нашому спільному кордоні. Перші розвідувальні звіти наших розвідників та партизанів поблизу кордону з Новою Англією вказують на те, що в патрулюванні [NEE.GetAdjective] існують прогалини, які дозволять нам переправляти зброю та секретних агентів до таких міст, як Баффало та Рочестер. Чи варто нам схвалити цю операцію?"
 new_england_events.86.a: "Безумовно"
 new_england_events.86.b: "Ми б не хотіли знову штовхнути їх в обійми канадців"

# NEE - Intel received about WCA agents
 new_england_events.87.t: "Припинення незаконного перетину кордону"
 new_england_events.87.d: "Окрім поодиноких образ та синдикалістських листівок, що перекидаються «червоними» через кордон, на спільному рубежі між нашим урядом та [WCA.GetNameDef] залишалося відносно тихо. По обидва боки кордону люди дивляться один на одного з взаємною ворожістю та жалем, знаючи, що друзі, сім'ї, сестри та брати розділені через громадянську війну.\n\nОднак сьогодні вночі наші солдати на кордоні були нетипово розбуджені тривогою, піднятою одним із наших патрулів. Батальйон 1-ї Національної гвардії Нью-Йорка помітив групу шпигунів із [WCA.GetNameDef], які намагалися просуватися вздовж річки Дженесі. Зав'язалася коротка сутичка, в результаті якої з обох сторін з'явилися вбиті та поранені, перш ніж частина рейдової групи змогла втекти назад через кордон. Сутичка не була цілком безрезультатною: нам вдалося захопити кількох полонених. Схоже, вони були лише однією з багатьох груп, які зараз працюють над інфільтрацією та підривною діяльністю в західній частині Нью-Йорка. Під час допиту один із молодих «синді» випадково видав прогалини в наших патрулях, які вони використовували для проникнення на нашу територію."
 new_england_events.87.a: "Посилити наші патрулі"
 new_england_events.87.b: "Навряд чи багатьом вдалося пройти"

# (NEE/WCA) - Buffalo Revolt
 new_england_events.88.t: "Повстання на Великих озерах"
 new_england_events.88.d.prepared: "Сьогодні вранці президентський офіс був засипаний новинами про соціалістичне повстання в містах Баффало та Рочестер у західному Нью-Йорку. Протягом кількох тижнів наші військові та розвідка спостерігали за переміщеннями «червоних» через кордон. Проте нам вдалося випередити махінації ОСА, і наша готовність проявилася в нашій реакції.\n\nПісля новин про спроби синдикалістських партизанів захопити контроль над місцевими арсеналами та адміністративними центрами, Національна гвардія Нью-Йорка була швидко розгорнута для придушення заворушень. В очікуванні заколоту наші армійські резерви тренувалися та готувалися до неминучого. «Червоні» виявилися безнадійно слабшими, оскільки підрозділи Національної гвардії придушили озброєних повстанців своєю вогневою міццю. Ті зрадники, які здалися, були негайно затримані, щоб вони більше не становили загрози. Завдяки завчасній підготовці ми також змогли безпечно евакувати багатьох цивільних із небезпечної зони. Кордон був значно зміцнений, і ми вживемо подальших заходів, щоб наступного разу «червоні» не були такими зухвалими!"
 new_england_events.88.d.lax: "Сьогодні вранці президентський офіс був засипаний новинами про повстання синдикату в містах Баффало та Рочестер у західному Нью-Йорку. Протягом кількох тижнів ми спостерігали рух уздовж кордону з [WCA.GetNameDef], але наше верховне командування просто відкидало будь-яку думку про велике повстання. Проте те, чого ми боялися, справді сталося.\n\nПригнічена та непідготовлена, реакція Національної гвардії виявилася недостатньою, і вони були змушені відступити. Армія була змушена відправити оперативні сили підкріплення, щоб деблокувати райони повстання, але на той час шкоди вже було завдано. Хоча нам вдалося придушити повстання, частини Рочестера та Баффало лежать у руїнах, а місцева інфраструктура розірвана на шматки в ході боїв. Це, безумовно, був жорсткий урок, і ми повинні подбати, щоб це не повторилося!"
 new_england_events.88.d.wca: "Ми отримали чудові новини від наших агентів, що діють у [NEE.GetNameDef]. Наші хоробрі товариші успішно проникли в саме серце капіталістичних реакціонерів і досягли великого успіху! Шпигуни та партизани допомогли переправити зброю нашим зв'язковим у містах Баффало та Рочестер, що залишилося цілком непоміченим для патрулів [NEE.GetAdjective].\n\nЗнадобилися тижні терпіння та витримки, щоб встановити грізну присутність у західному Нью-Йорку, але це було того варте. Хоча більшість наших сил зрештою була витіснена військовими Нової Англії, нам вдалося дестабілізувати реакційний режим [NEE.GetNameDef]. Скоро ланцюги на американському Північному Сході будуть розірвані, і народ Нової Англії нарешті стане вільним!"
 new_england_events.88.a: "Ми повинні гарантувати, що це не повторитися!"
 new_england_events.88.b: "За подальший успіх у поширенні революції!"

 new_england_events.90.t: "Повернення до складу Америки"
 new_england_events.90.d.forced: "Сьогодні прибули офіційні особи з [From.GetNameDef], щоб розпочати переговори про мирне воз'єднання між нашим урядом та їхнім. Однак у Бостоні було мало часу для обговорення цього питання, оскільки майже миттєво країною прокотилася публічна кампанія з вимогою негайно розпустити уряд. Громадськість вважає, що Нова Англія не є справжньою країною, і її уряд не має достатньої легітимності, щоб відхилити запит [From.GetAdjective]."
 new_england_events.90.d.choice: "Сьогодні прибули офіційні особи з [From.GetNameDef], щоб розпочати переговори про мирне воз'єднання між нашим урядом та їхнім, тепер, коли громадянська війна закінчилася і переможець визначений. Багато хто вважає, що основна мета тимчасового уряду Нової Англії — уникнення хаосу громадянської війни — була досягнута, і ми повинні знову стати частиною Америки. Проте є й інші, хто вважає, що Нова Англія здобула власну легітимність. Ми маємо своє місце в британській сфері, і чи справді ми хочемо бути частиною [From.GetNameDef]? Чи справді вони є тією Америкою, яку ми пам'ятаємо?"
 new_england_events.90.a: "Здається, у нас немає іншого вибору, окрім як погодитися..."
 new_england_events.90.b: "Ми повинні повернутися до складу Америки."
 new_england_events.90.c: "Ні, це не в наших інтересах."

 new_england_events.91.t: "Запит від [From.GetNameDefCap]"
 new_england_events.91.d: "Посол від [From.GetNameDef] зустрівся з посадовцями [Root.GetAdjective] і представив їхній план: вони бажають мирно воз'єднатися з [requester.GetNameDef] негайно. Тепер, коли громадянська війна закінчена, вони вважають, що мета тимчасового уряду Нової Англії — а саме уникнення хаосу та руйнувань — також вичерпана. Америка, кажуть вони, повинна знову бути єдиною. В уряді спостерігається неоднозначна реакція, хоча більшість погоджується, що [requester.GetNameDef] не сидітиме склавши руки, якщо ми відмовимо."
 new_england_events.91.a: "Тоді ми бажаємо їм успіху."
 new_england_events.91.b: "Ми згодні, якщо [requester.GetNameDef] приєднається до Антанти."
 new_england_events.91.c: "Ні, ми не можемо цього дозволити."

 new_england_events.92.t: "[From.GetNameDefCap] погоджується"
 new_england_events.92.d: "Уряд [From.GetAdjective] погодився, що мета тимчасового уряду вичерпана. Вони не претендують на регіон Нової Англії і не бажають конфлікту з [requester.GetNameDef], а також не мають наміру висувати жодних вимог щодо повернення Нової Англії. Сили [From.GetAdjective] почали негайно залишати цей район."
 new_england_events.92.a: "Чудові новини!"

 new_england_events.93.t: "Воз'єднання з Новою Англією"
 new_england_events.93.d: "Офіційні особи з Нової Англії негайно передали повідомлення: вони з радістю об'єднаються з [Root.GetNameDef] прямо зараз. Мета їхнього тимчасового уряду — уникнення хаосу громадянської війни — тепер вичерпана, і вони з нетерпінням чекають, коли Америка знову стане єдиною."
 new_england_events.93.a: "Чудово!"

 new_england_events.94.t: "Канадське занепокоєння"
 new_england_events.94.d: "Хоча уряд Нової Англії не є канадською маріонеткою, було б помилкою стверджувати, що він не був частиною британської сфери — якою вона є — і що він має велике значення для ширшої канадської сфери інтересів. Канадський уряд готовий дозволити Новій Англії воз'єднатися з [requester.GetNameDef], оскільки причина втручання Канади в регіон зникла разом із війною, але вони просять, щоб [requester.GetNameDef] приєднався до альянсу Антанти. Це компенсувало б втрату Нової Англії, а також було б способом віддячити [CAN.GetNameDef] за порятунок життів американців."
 new_england_events.94.a: "Подивимося, до чого це призведе..."
 new_england_events.94.b: "Ми згодні з цим запитом."
 new_england_events.94.c: "Ні, вони не мають права висувати таку вимогу."

 new_england_events.95.t: "[requester.GetNameDefCap] погоджується"
 new_england_events.95.d: "Офіційні особи з [requester.GetNameDef] повернулися зі згодою — вони приєднаються до Антанти в обмін на мирне воз'єднання з Новою Англією та як спосіб віддячити [Root.GetNameDef] за захист стількох американських життів під час громадянської війни."
 new_england_events.95.a: "Досить люб'язно з їхнього боку!"

 new_england_events.96.t: "[requester.GetNameDefCap] відмовляється"
 new_england_events.96.d: "Офіційні особи з [requester.GetNameDef] повернулися до Канади з категоричною відмовою — вони не торгуватимуться за повернення Нової Англії, зокрема тому, що [CAN.GetNameDef] взагалі не мала права втручатися у громадянську війну. Офіційні особи кажуть, що Канада взяла під контроль Нову Англію, щоб захистити себе від радикальних сил, і нічого більше. Тепер, коли ця загроза зникла, Америка повинна знову стати єдиною."
 new_england_events.96.a: "Хотілося б, щоб «мама з татом» перестали сваритися..."
 new_england_events.96.b: "Дуже добре, нехай ідуть."
 new_england_events.96.c: "Тоді ми відмовляємо."

 new_england_events.97.t: "[From.GetNameDefCap] відмовляє"
 new_england_events.97.d.forced: "Канадський уряд повернувся до Нової Англії з категоричною відмовою — ми не можемо повернутися до складу Америки. Здається, їхні обіцянки щодо самоврядування та запевнення, що втручання було задля нашої безпеки, були просто оманою. Оскільки Новій Англії бракує легітимності, щоб діяти як щось інше, крім канадської маріонетки, вона розпалася у спазмі внутрішньої боротьби та люті проти канадців."
 new_england_events.97.d.choice: "Канадський уряд повернувся до Нової Англії з категоричною відмовою — ми не можемо повернутися до складу Америки. Здається, їхні обіцянки щодо самоврядування та запевнення, що втручання було задля нашої безпеки, були просто оманою: вони втрутилися, щоб захистити британські інтереси, і нічого більше. Тепер уряд Нової Англії повинен сам вирішити, де його інтереси, і, можливо, спровокувати війну в будь-якому випадку."
 new_england_events.97.a: "Нехай буде так!"
 new_england_events.97.b: "Ми все одно приєднаємося до [requester.GetNameDef]!"
 new_england_events.97.c: "Ми залишаємося з [From.GetNameDef]"

 new_england_events.98.t: "Нова Англія розпадається"
 new_england_events.98.d: "Через нашу відмову дозволити Новій Англії воз'єднатися з [requester.GetNameDef], їхній уряд повністю розпався через внутрішній конфлікт і відчуття відсутності справжньої легітимності. Регіон знову перебуває під нашим контролем, і це цілком може втягнути нас у війну з [requester.GetNameDef]."
 new_england_events.98.a: "Нехай буде так!"

 new_england_events.99.t: "[war_country.GetNameDefCap] відмовляє"
 new_england_events.99.d.exists: "З причин, які не зовсім зрозумілі, уряд Нової Англії вирішив, що в його інтересах залишатися частиною британської сфери. Багато хто в нашому уряді розлючений і задається питанням, чи відчувають громадяни Нової Англії те саме, що й їхній уряд... чи, можливо, краще сказати — британці?"
 new_england_events.99.d.notexists: "Хоча здавалося, що жителі Нової Англії були більш ніж готові мирно приєднатися до нас, канадське втручання викрило їхній тимчасовий уряд як те, чим він був: маріонеткою, підвладною волі британської корони. Через їхню відмову дозволити Новій Англії самій обирати свою долю, уряд Нової Англії розпався і був знову поглинутий [CAN.GetNameDef]."
 new_england_events.99.a: "Тоді це війна!"
 new_england_events.99.b: "Ми розберемося з цим пізніше."
 new_england_events.100.t: "Зрада Нової Англії"

 new_england_events.100.d: "Хоча наш уряд відмовив Новій Англії у праві на воз'єднання з [requester.GetNameDef], схоже, вони зрештою все одно вирішили це зробити. Наші сили в регіоні відступили, коли увійшли американські війська, і, здається, ми нічого не можемо вдіяти — хіба що ми вирішимо загострити ситуацію і перетворити це на війну."
 new_england_events.100.a: "Тоді це війна!"
 new_england_events.100.b: "Нехай забирають."

 new_england_events.102.t: "Вогні війни"
 new_england_events.102.d: "Те, чого ми сподівалися уникнути у 1937 році, нарешті охопило націю! Нова Англія виявилася втягнутою у конфлікт. Відповідно, багато наших підприємств переходять на військове виробництво, щоб забезпечити наші війська на полі бою. Оскільки потреби армії стрімко зростають через конфлікт, будь-які залишкові ефекти Великої депресії швидко зникають. Безробітні чоловіки та навіть деякі жінки мобілізуються до збройних сил або на заводи, замінюючи тих, хто пішов на фронт. Разом ми мусимо вистояти у цій бурі!"
 new_england_events.102.a: "Під прапори!"

 new_england_events.103.t: "Вогні війни"
 new_england_events.103.d: "Те, чого ми сподівалися уникнути у 1937 році, нарешті охопило націю! Нова Англія виявилася втягнутою у конфлікт. Відповідно, багато наших підприємств переходять на військове виробництво, щоб забезпечити наші війська на полі бою. Потреби армії почали стрімко зростати через конфлікт. Безробітні чоловіки та навіть деякі жінки мобілізуються до збройних сил або на заводи, замінюючи тих, хто пішов на фронт. Разом ми мусимо вистояти у цій бурі!"
 new_england_events.103.a: "Під прапори!"

 new_england_events.104.t: "Приготування до війни"
 new_england_events.104.d: "Коли вибухнула велика громадянська війна, уряд Нової Англії виявився розколотим щодо участі в ній. Через популярність ізоляціоністських груп багато жителів Нової Англії сподівалися перечекати війну, що загрожувала поглинути Новий Світ. Поки тривала Велика депресія, економіка Нової Англії перебувала у скруті, і лише після «другого квадратного курсу» президента [NEE.GetLeader] вона почала демонструвати ознаки відновлення та зростання.\n\nТепер, коли економіка на шляху до повного одужання, заводи, що колись виготовляли взуття та автомобілі, тепер виробляють військові вантажівки та уніформу, оскільки загроза війни наближається щодня. Багато хто в Новій Англії почав бачити цей конфлікт таким, яким він є насправді — битвою за справжню Америку, і Нова Англія не може стояти осторонь. Настав час відвоювати країну у тих, хто ввергнув її в хаос. У школах щодня проводяться навчання з цивільної оборони, а молоді люди юрмляться у призовних центрах, прагнучи служити своїй країні у скрутну годину. Шанси не на користь Нової Англії — більшість інших фракцій мають набагато більші людські та промислові ресурси. Проте історія завжди сприяла сміливим, і не варто недооцінювати промислову міць американського Північного Сходу. Наші заводи випускатимуть дедалі більше продукції, а літаки в небі гарантуватимуть безпеку. Як і наші предки у 1776 році, ми не злякаємося труднощів, адже дерево свободи не впаде під натиском реакціонерів та революціонерів, що прагнуть його осквернити!"
 new_england_events.104.a: "Ми не можемо залишити Америку в темряві!"

 new_england_events.123.t: "Перегляд зобов'язань щодо Америки"
 new_england_events.123.d.noone: "Сьогодні посланець із [NEE.Capital.GetCapitalVictoryPointName] прибув до [ENT.Capital.GetCapitalVictoryPointName], щоб обговорити триваючу громадянську війну на нашому південному кордоні. [393.Owner.GetNameDefCap] є серйозною загрозою для обох наших націй. Їхні укріплення розташовані прямо на наших кордонах і є ідеальними плацдармами для атаки на нас у разі їхньої перемоги. Якщо таку атаку не відбити швидко, це зрештою поставить під загрозу будь-яку спробу відвоювати рідні острови. Короні довелося б зникнути.\n\nОднак вони не збираються чекати на такий результат. Військові лідери Нової Англії розробили амбітні плани удару в саме серце зарази, щоб придушити проблему в зародку. Хоча Антанта переважно дотримувалася нейтралітету в американських справах, настав час діяти. Було накреслено загальні риси попередньої кампанії бомбардувань, відомої як операція «Пойнтбланк», що має розпочатися з вибухом війни. Такий удар мав би на меті паралізувати кілька великих промислових центрів поблизу наших кордонів. Посланець попросив нас підтримати цей план і почати згуртовувати Антанту для визволення Америки."
 new_england_events.123.d.APG: "Сьогодні посланець із [NEE.Capital.GetCapitalVictoryPointName] прибув до [ENT.Capital.GetCapitalVictoryPointName], щоб обговорити триваючу громадянську війну на нашому південному кордоні. [393.Owner.GetNameDefCap] є серйозною загрозою для обох наших націй. Їхні укріплення розташовані прямо на наших кордонах і є ідеальними плацдармами для атаки на нас у разі їхньої перемоги. Якщо таку атаку не відбити швидко, це зрештою поставить під загрозу будь-яку спробу відвоювати рідні острови. Короні довелося б зникнути.\n\nОднак вони не збираються чекати на такий результат. Генерали Нової Англії розробили амбітні плани удару в саме серце зарази, щоб придушити проблему в зародку. Досі підтримка Антанти у громадянській війні була спрямована на [APG.GetNameDef]. Оскільки вони розташовані на півдні, посланець із [NEE.GetNameDef] натякнув, що їхні війська не зможуть ефективно захистити життєво важливі промислові центри та плацдарми східної Канади. Навпаки, [NEE.GetNameDef] набагато ближче і краще підходить для співпраці, якщо знадобиться повномасштабне втручання. Посланець попросив нас розглянути можливість відкликання ресурсів у [APG.GetNameDef] і спрямування їх на повномасштабне вторгнення під керівництвом [NEE.GetNameDef]."
