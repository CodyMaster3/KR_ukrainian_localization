### Ideas ###
 NEP_royal_army_name:0 "Королівська армія Непалу"
 NEP_republican_army_name:0 "Республіканська армія Непалу"
 NEP_royal_army:0 "[NEP_loc_army_name]"
 NEP_royal_army_desc:0 "[NEP_loc_army_name] є однією з небагатьох речей у Непалі, що викликає гордість у всього політичного спектра. Ще з часів англо-непальської війни непальські війська були всесвітньо відомими, а протягом понад століття непальські загони «гуркхів» вважалися найелітнішими підрозділами під британським командуванням.\n\nПісля британської та індійської революцій багато непальських ветеранів цих конфліктів повернулися додому, принісши із собою знання та досвід, необхідні для піднесення власної армії Непалу на велику висоту, що дозволило нації мати значно більший вплив, ніж дозволяють її розміри."
 NEP_an_economy_of_corruption_and_stagnation:0 "Економіка корупції та застою"
 NEP_an_economy_of_corruption_and_stagnation_desc:0 "Через поєднання корумпованої системи, вибудуваної майже виключно для збагачення династії Рана, та загальної політики протидії індустріалізації задля ослаблення політичної сили селянства, Непал залишається неймовірно бідним і відсталим, попри великий потенціал для економічного зростання.\n\nХоча в останні два десятиліття робилися спроби нарешті вивести Непал хоча б на рівень XIX століття, хаос 20-х років остаточно поховав ці надії. Індустріалізація Непалу, ймовірно, вимагатиме великих політичних змін та зовнішньої допомоги, але вона життєво необхідна, щоб нація не канула в небуття."
 NEP_the_padma_shumsher_plan:0 "План Падми Шумшера"
 NEP_the_padma_shumsher_plan_desc:0 "Хоча інші члени династії Рана вважають його надто радикальним і глибоко непопулярним, цей досить стриманий план індустріалізації Падми Шумшера був нав'язаний Непалу його покровителями з Індійського Домініону, які зажадали непальської індустріалізації заради національної безпеки.\n\nХоча навряд чи це зробить Непал промисловим гігантом, план Падми, ймовірно, допоможе розбудувати сучасну економіку і дозволить країні допомагати своїм індійським союзникам."
 NEP_realm_of_the_ranas:0 "Царство Рана"
 NEP_realm_of_the_ranas_desc:0 "З моменту військового перевороту проти королеви-регентші Радж'ї Лакшмі та її чоловіка короля Раджендри, династія Рана правила Непалом залізною рукою, придушуючи будь-які спроби опозиції ще до того, як вони могли стати загрозою.\n\nНепал під владою Рана діє як справжній сьогунат у Гімалаях — порівняння, яке непальське керівництво цілком усвідомлює. Невдала революція лише зміцнила їхню владу над Непалом, розбивши всі сподівання ворогів династії на те, що їхнє правління закінчиться так само, як у Токуґави."
 NEP_realm_of_the_ranas_0_desc:0 "З моменту військового перевороту проти королеви-регентші Радж'ї Лакшмі та її чоловіка короля Раджендри, династія Рана правила Непалом залізною рукою, придушуючи будь-які спроби опозиції ще до того, як вони могли стати загрозою.\n\nНепал під владою Рана діє як справжній сьогунат у Гімалаях — порівняння, яке непальське керівництво цілком усвідомлює, хоча більшість вірить, що вони зможуть уникнути долі режиму Токуґави. Проте поступове зростання опозиції, підтримуваної індійцями, починає сіяти сумніви щодо цього оптимізму..."
 NEP_pnp_finished:0 "Довгий шлях до сучасності"
 NEP_pnp_finished_dec:0 "Хоча інші члени династії Рана вважають його надто радикальним, план індустріалізації Падми Шумшера був втілений за підтримки Індійського Домініону. Це дозволило почати розбудову сучасної економіки Непалу, зміцнюючи національну безпеку та обороноздатність наших союзників."
 NEP_bnia_finished:0 "Нова непальська економіка"
 NEP_bnia_finished_dec:0 "Завдяки великим зусиллям Непалу вдалося подолати застій років правління Рана і побудувати економіку, яка є цілком прийнятною для сучасності. Сподіваємося, що це лише початок, і попереду на нас чекають десятиліття економічного зростання."
 NEP_state_initiatives:0 "Державні ініціативи"
 NEP_state_initiatives_desc:0 "Через фактичну повну відсутність місцевого капіталу, здатного самостійно запустити індустріалізацію, уряд вважав за доцільне дати поштовх непальській промисловості через державне фінансування та створення державних підприємств."

 NEP_unchallenged_autocracy:0 "Незаперечна автократія"
 NEP_unchallenged_autocracy_desc:0 "Поразка «Мукті Сена» майже напевно знищила будь-які шанси на повалення Рана принаймні на найближчі кілька десятиліть, оскільки ціле покоління революціонерів загинуло або опинилося у вигнанні. Тепер ніщо не стоїть на заваді їхньому абсолютному правлінню."
 NEP_national_restoration:0 "Національна реставрація"
 NEP_national_restoration_desc:0 "Спроба революції в Непалі призвела до падіння абсолютного правління Рана, але замість радикальних цілей, на які сподівалися підтримувані Калькуттою революціонери, відбулося відновлення королівської влади. Король тепер сподівається вберегти непальську націю від конфліктів і залікувати її глибокі рани під своїм керівництвом."
 NEP_our_ruler_glorious_idea:0 "Наш славний правитель"
 NEP_our_ruler_glorious_idea_desc:0 "Хоча влада здійснюється через національний уряд, що складається з представників усього політичного спектра, реальна сила в Непалі знову зосереджена в руках короля. Це кардинальна зміна порівняно з його колишнім безправним становищем, яка, як сподіваються, допоможе нації подолати наслідки тиранії Рана."
 NEP_constitution_of_the_revolution:0 "Конституція революції"
 NEP_constitution_of_the_revolution_desc:0 "Тепер, коли народ повністю контролює непальську націю, триває повільна розробка першої конституції країни, яка впроваджується через тимчасові закони. Сподіваємося, що до кінця десятиліття повноцінна версія конституції нарешті буде прийнята, і Непал завершить перехід до сучасної та вільної системи."
 NEP_the_peoples_kingdom:0 "Народне королівство"
 NEP_the_peoples_kingdom_desc:0 "Завдяки силі та рішучості «Мукті Сена» та великій підтримці короля Трібхувана, Непал скинув тиранічне правління династії Рана. Вперше в історії Непалу нацією правлять не еліти, а простий народ."
 NEP_rule_of_the_mukti_sena:0 "Правління Мукті Сена"
 NEP_rule_of_the_mukti_sena_desc:0 "За підтримки Калькутти соціалістична Робітнича партія Сватантра перебрала повну владу в Непалі, використовуючи військову силу та революційну риторику для легітимізації свого становища. Хоча LSP не здатна повноцінно втілити цілі соціалізму в доіндустріальній країні, вона сподівається, що за підтримки світового соціалістичного руху Непал теж вийде на цей шлях."
 NEP_first_citizen_of_nepal:0 "Перший громадянин Непалу"
 NEP_first_citizen_of_nepal_desc:0 "Хоча офіційно Непал є республікою, масштабна підтримка монархії та особиста популярність Трібхувана після його участі в революції зробили повне скасування цього інституту неможливим. Як компроміс, колишньому королю було надано суто церемоніальну посаду Радж'я Прамукха, тобто державного лідера, щоб заспокоїти численних монархістів країни."

 NEP_surviving_the_indian_nightmare:0 "Виживання в індійському кошмарі"
 NEP_surviving_the_indian_nightmare_desc:0 "В Індії знову спалахнула війна, і на кону стоїть майбутнє не лише субконтиненту; результат майже напевно визначить і долю Непалу. Перед непальським керівництвом стоїть важке завдання провести націю крізь цю кризу, сподіваючись вийти з неї вільними та цілими."

 NEP_crushing_the_conspirators:0 "Розгром змовників"
 NEP_crushing_the_conspirators_desc:0 "За допомогою [RAJ.GetNameDef] прем'єр-міністр Джуддха Рана розпочав заходи з придушення будь-якої змови проти непальської держави, сподіваючись швидко розправитися із запланованим повстанням."
 NEP_covert_support_for_the_mukti_sena:0 "Таємна підтримка Мукті Сена"
 NEP_covert_support_for_the_mukti_sena_desc:0 "Хоча прем'єр-міністр офіційно почав придушувати опозицію, король у міру своїх обмежених можливостей почав таємно допомагати повстанцям, сподіваючись покласти край тиранії Рана."

 udyog_parishad:0 "Удьоґ Парішад"
 udyog_parishad_desc:0 "«Удьоґ Парішад», або просто «Промислова рада», була заснована в 1935 році прем'єр-міністром Джуддхою Шумшером Раною для сприяння повільній індустріалізації Непалу виключно на користь його династії. Рада координує державні витрати та інвестиції у промисловість, зосереджуючись на створенні невеликих державних підприємств у найбільш прибуткових секторах."
 nepal_government_railway:0 "Урядова залізниця Непалу"
 nepal_government_railway_desc:0 "Плани створення першої залізниці Непалу були розроблені ще на початку 20-х років з метою з'єднати Непал з Індією, аби Рана могли вивозити деревину задля власної вигоди. Ці плани були згорнуті після початку війни в Індії, але тепер проєкт відновлено. Уряд Непалу планує розбудовувати мережу залізниць по всій країні під власним контролем."
 biratnagar_mills:0 "Біратнаґарські заводи"
 biratnagar_mills_desc:0 "Текстиль є однією з найцінніших галузей, доступних Непалу. У Біратнаґарі були засновані перші заводи країни для виробництва тканин із бавовни та джуту, щоб задовольнити потреби заможних непальців та іноземних покупців."

 ### Focuses ###

 NEP_rooting_out_the_traitors:0 "Викорінення зрадників"
 NEP_rooting_out_the_traitors_desc:0 "Майже століття династія Рана стоїть біля керма Непалу. Хоча прем'єр-міністр Джуддха Шумшер Рана не є королем за титулом, він — лідер цієї країни. Виступити проти нього означає виступити проти держави; змовлятися проти нього означає змовлятися проти Непалу."
 NEP_intelligence_cooperation_with_the_lib:0 "Співпраця з розвідкою LIB"
 NEP_intelligence_cooperation_with_the_lib_desc:0 "Лахорське бюро розслідувань (LIB), розвідувальна служба Домініону Індія, є однією з найкращих у своєму роді на Сході. Можна сміливо стверджувати, що британське правління в Індії давно б зникло, якби не їхні чудові спецслужби, які завжди придушували повстання в зародку. З їхньою допомогою ми легко зможемо вчинити так само з нашим власним заколотом."
 NEP_bribing_the_weakest_links:0 "Підкуп слабких ланок"
 NEP_bribing_the_weakest_links_desc:0 "Хоча багато хто з бунтівників заможніший за пересічного непальця, у їхніх лавах все ще залишається незліченна кількість тих, хто готовий на все за скромну суму. Запропонувавши достатню винагороду за доноси на спільників, ми швидко змусимо їх зрадити один одного і видати нам усі свої таємниці."
 NEP_infiltrating_the_praja_parishad:0 "Проникнення в Праджа Парішад"
 NEP_infiltrating_the_praja_parishad_desc:0 "Якщо навчені в Калькутті соціалісти з «Мукті Сена» є дуже закритими і в їхні лави важко проникнути, то численна «Парішад» завжди готова приймати нових членів з мінімальною перевіркою, зосередившись лише на зростанні руху. Тому нам буде дуже просто заслати туди людей під виглядом новобранців, щоб розвалити їх зсередини."
 NEP_the_fate_of_all_rebels:0 "Доля всіх заколотників"
 NEP_the_fate_of_all_rebels_desc:0 "Хоча спочатку ми планували залишити лідера повстанців Дашратха Чанда Тхакурі живим для катувань і використання як козиря в переговорах, публічна демонстрація того, що чекає на ворогів прем'єр-міністра, буде кориснішою. Готуймо зашморг кату і посіймо страх у серцях зрадників."
 NEP_countering_bharatiya_influence:0 "Протидіяти впливу Бхаратії"
 NEP_countering_bharatiya_influence_desc:0 "Без постійної підтримки з боку союзників у Республіці ці повстанці були б лише легкою перешкодою, а не реальною загрозою. Нашим пріоритетом має бути перекриття якомога більшої кількості каналів їхньої підтримки — як тільки вени буде перерізано, рух почне вмирати сам по собі."
 NEP_isolating_the_king:0 "Ізоляція короля"
 NEP_isolating_the_king_desc:0 "Попри відсутність реальної влади, король все ще має велику повагу в непальському суспільстві, і ні для кого не секрет, що він ненавидить владу прем'єр-міністра. Він легко може стати символом підтримки для наших ворогів, тому, доки заколот не придушено, ми мусимо обмежити його доступ до зовнішнього світу. Ми не можемо ризикувати поширенням небезпечних ідей."
 NEP_the_darjeeling_conspiracy:0 "Підтримка змови в Дарджилінгу"
 NEP_the_darjeeling_conspiracy_desc:0 "Майже століття корумповані автократи з династії Рана тримають політику Непалу мертвою хваткою, пригнічуючи народ, узурпуючи владу королів і тримаючи країну у відсталості. Якщо народ Непалу хоче мати майбутнє, правлінню тиранів Рана має настати кінець."
 NEP_establishing_contacts_within_the_army:0 "Встановлення контактів в армії"
 NEP_establishing_contacts_within_the_army_desc:0 "Хоча армія підкоряється прем'єр-міністру, як і решта уряду, непальське військо не є безнадійним. Багато хто зневажає владу Рана або зберігає вірність полоненому королю Трібхувану. Налагодивши зв'язок із цими далекоглядними патріотами в армії, ми зможемо підготувати ґрунт для падіння тиранії."
 NEP_cooperating_with_exiled_ranas:0 "Співпраця з вигнаними Рана"
 NEP_cooperating_with_exiled_ranas_desc:0 "Хоча династія Рана принесла Непалу руїну, не кожен член родини бажає нам зла. Ми можемо отримати перевагу, заручившись підтримкою тих, кого відштовхнули або вигнали їхні владні родичі."
 NEP_strengthen_ties_with_calcutta:0 "Зміцнення зв'язків із Калькуттою"
 NEP_strengthen_ties_with_calcutta_desc:0 "Наші товариші в Калькутті глибоко співчувають нашій справі, і їхня підтримка може стати вирішальною для Армії визволення. Якщо ми хочемо змусити Рана піти, ми мусимо поглибити наші зв'язки з Народною Республікою."
 NEP_appeal_to_hindu_unity:0 "Заклик до індуїстської єдності"
 NEP_appeal_to_hindu_unity_desc:0 "Відтоді як великий король Прітхві Нараян Шах проголосив Непал «Асал Хіндустан» — Справжньою Індією — на знак виклику ісламським імператорам Моголам, країна зберігає репутацію останнього вільного бастіону індуїзму. В Індії є багато тих, хто вірить, що свобода Непалу є життєво важливою для захисту віри від іноземного впливу. Їхня підтримка буде дуже доречною."
 NEP_preparing_border_infiltration_efforts:0 "Підготовка проникнення через кордон"
 NEP_preparing_border_infiltration_efforts_desc:0 "Ми мусимо посіяти зерна перемоги, щоб у вирішальний момент бути повністю готовими завдати смертельного удару гнобителям Рана. З цією метою ми таємно переміщуємо прихильників і союзників через кордон, збираючи розвіддані та готуючи активи для використання у потрібний час."
 NEP_training_with_the_republican_army:0 "Навчання з Республіканською армією"
 NEP_training_with_the_republican_army_desc:0 "Династію Рана не повалити кількома гнівними памфлетами — їх треба усунути силою. Пріоритетом «Мукті Сена» має бути спільна підготовка армії з нашими індійськими союзниками та підготовка до неминучої війни за визволення Непалу."
 NEP_sowing_the_seeds_for_democracy:0 "Посів зерен демократії"
 NEP_sowing_the_seeds_for_democracy_desc:0 "Хоча Рана навряд чи підуть самі, ми не повинні забувати, що захоплення влади силою та вбивство політичних лідерів — це саме те, як вони створили свій режим. Нашим пріоритетом має бути підготовка до побудови вільного Непалу після повалення прем'єра, інакше ми легко повернемося до тиранії."
 NEP_limit_the_spread_of_propaganda:0 "Обмеження поширення пропаганди"
 NEP_limit_the_spread_of_propaganda_desc:0 "Здається, не минає й дня, щоб у Катманду не розповсюджували газети з Лахора чи Калькутти. Ці очевидні спроби вплинути на Непал не можна терпіти, і ми мусимо придушувати їх за будь-якої нагоди."
 NEP_request_restraint_by_all_factions:0 "Заклик до стриманості всіх фракцій"
 NEP_request_restraint_by_all_factions_desc:0 "Хоча нинішня ситуація далеко не ідеальна, все стане набагато гірше, якщо «Мукті Сена» ескалує революцію або Рана посилять репресії. Ми не можемо дозволити нації потонути в крові, тому мусимо закликати до стриманості, навіть якщо нас не чують."
 NEP_defending_our_sovereignty:0 "Захист нашого суверенітету"
 NEP_defending_our_sovereignty_desc:0 "Ганебно, що за Непал борються так, ніби це просто іграшка великих держав, а не горда нація. Ніхто не вирішуватиме політику Непалу, крім самого Непалу. Ми мусимо припинити всі зовнішні спроби впливу, якщо не хочемо стати простою маріонеткою."
 NEP_put_faith_in_his_majesty:0 "Віра в Його Величність"
 NEP_put_faith_in_his_majesty_desc:0 "Якщо в цей бурхливий час у Непалі й залишився маяк стабільності, то це Його Величність король Трібхуван Шах. Навіть якщо націю охопить хаос, ми мусимо вірити, що керівництво короля приведе нас до світлого майбутнього."

 NEP_acquiring_indian_surplus:0 "Придбання індійських надлишків"
 NEP_acquiring_indian_surplus_desc:0 "Конфлікт за Індію призвів до появи значних запасів надлишкового військового спорядження, і нам життєво важливо придбати його якомога більше. Те, що для інших є надлишком, для Непалу може стати різницею між поразкою та виживанням."
 NEP_guarding_the_prime_minister:0 "Охорона прем'єр-міністра"
 NEP_guarding_the_prime_minister_desc:0 "Оскільки майбутнє нашої країни залежить від безпеки її лідера, його захист є першочерговим завданням для армії. Для цього ми створимо елітний підрозділ, здатний не лише безпосередньо захищати вождя, а й боронити кордони та, за необхідності, завдавати ударів по ворожій території."
 NEP_protecting_kathmandu:0 "Захист Катманду"
 NEP_protecting_kathmandu_desc:0 "Якщо станеться найгірше, життєво важливо захистити столицю та долину Катманду від іноземного вторгнення. Ця оборона має складатися не лише з природних бар'єрів, а й з міцних штучних укріплень, побудованих з урахуванням методів сучасної війни."
 NEP_preparing_for_tibetan_aggression:0 "Підготовка до тибетської агресії"
 NEP_preparing_for_tibetan_aggression_desc:0 "Попри минулі спроби прояснити ситуацію, наш кордон із Тибетом залишається нечітко визначеним і вразливим у кількох ключових місцях. Хоча напад із півночі зараз видається малоймовірним, уряд має бути готовим до того, що сусід захоче силоміць провести демаркацію."
 NEP_when_the_ganga_runs_red:0 "Коли Ґанґа почервоніє"
 NEP_when_the_ganga_runs_red_desc:0 "З відновленням війни на півдні майбутнє Непалу стало ще більш непевним. Незалежно від того, чи вступимо ми у боротьбу за Індію безпосередньо, чи підтримаємо фаворита здалеку, ми маємо відігравати активну роль у визначенні того, хто домінуватиме на субконтиненті."
 NEP_built_around_an_elite_core:0 "Побудова навколо елітного ядра"
 NEP_built_around_an_elite_core_desc:0 "Майбутнє непальської армії залежить від розвитку елітних традицій, які зробили наших солдатів відомими на весь світ. Замість того, щоб ламати те, що довело свою ефективність, ми зосередимося на тому, щоб усе військо відповідало репутації своїх найкращих частин."
 NEP_favouring_flexibility:0 "Ставка на гнучкість"
 NEP_favouring_flexibility_desc:0 "Хоча наші солдати могутні духом, ми мусимо визнати, що навряд чи переможемо великі держави у звичайній битві. На щастя, не всі битви мають бути конвенційними. Ми маємо навчити наших воїнів діяти в будь-якій ситуації, що дасть нам перевагу над непідготовленим ворогом."
 NEP_capitalising_on_breakthroughs:0 "Використання проривів"
 NEP_capitalising_on_breakthroughs_desc:0 "Завдяки елітності наших бійців прорив ворожих ліній цілком можливий, але ці здобутки марні, якщо ми не вміємо їх використовувати. Солдати мають бути навчені швидко діяти проти дезорганізованих сил, навіть в умовах відсутності зв'язку з основними логістичними мережами."
 NEP_kafar_hunu_bhanda_marnu_ramro:0 "Kafar Hunu Bhanda Marnu Ramro"
 NEP_kafar_hunu_bhanda_marnu_ramro_desc:0 "«Kafar Hunu Bhanda Marnu Ramro», або «Краще померти, ніж жити боягузом» — девіз, з яким живуть і вмирають наші солдати. Там, де інші тікають у страху, наші люди стоять непохитно, здобуваючи перемоги, недосяжні для боязких. Саме це відрізняє непальські війська від усіх інших."
 NEP_invest_in_mountaineering_equipment:0 "Інвестиції в гірське спорядження"
 NEP_invest_in_mountaineering_equipment_desc:0 "Хоча багато наших людей звикли до життя в горах, навіть найкращий альпініст буде неефективним без належного спорядження. Життєво важливо забезпечити армію найкращим обладнанням, адже не можна очікувати, що вони долатимуть гірські хребти лише голіруч, покладаючись на одну мужність."
 NEP_specialise_the_doctrines:0 "Спеціалізація доктрин"
 NEP_specialise_the_doctrines_desc:0 "Непальські солдати навряд чи штурмуватимуть пляжі Дорсета чи продиратимуться крізь ліси Юкатана, тому немає сенсу тренувати їх для ситуацій, в які вони ніколи не потраплять. Натомість ми маємо готувати їх до боїв на пагорбах і в горах нашого регіону, а решту залишити союзникам."
 NEP_modernising_the_royal_army:0 "Модернізація [NEP_loc_army_name]"
 NEP_modernising_the_royal_army_desc:0 "Попри грізну репутацію солдатів, наша армія в цілому жахливо відстала у структурі, озброєнні та доктрині. Щоб створити військо, яке використовує сильні сторони Непалу, ми маємо спочатку навчити його протистояти сучасним викликам і противникам на полі бою."
 NEP_the_guns_of_a_modern_age:0 "Гармати сучасної доби"
 NEP_the_guns_of_a_modern_age_desc:0 "Артилерія давно відіграє незамінну роль у війні, проте навіть сьогодні важко знайти достатньо непальських солдатів, знайомих із цією технікою, щоб сформувати батальйон. Якщо ми хочемо модернізувати армію, придбання артилерії та навчання персоналу мають бути пріоритетом."
 NEP_expand_the_labour_corp:0 "Розширення робочого корпусу"
 NEP_expand_the_labour_corp_desc:0 "Хоча в непальській армії є солдати, яких можна назвати інженерами чи саперами, їх соромно порівнювати з інженерними ротами великих держав. Проте ці люди можуть стати фундаментом для нового розширеного Робочого корпусу, який одного дня наздожене світові стандарти."
 NEP_copying_indian_tactics:0 "Копіювання індійської тактики"
 NEP_copying_indian_tactics_desc:0 "Індійська революція навчила багатьох, як ведеться війна з сучасним обладнанням в умовах регіону. Замість того, щоб розробляти власні теорії, значно простіше запозичити досвід індійських армій, які вже виконали всю важку роботу за нас."
 NEP_utilise_contemporary_planning_methods:0 "Використання сучасних методів планування"
 NEP_utilise_contemporary_planning_methods_desc:0 "Сучасна війна настільки багатогранна, що традиційні методи планування застаріли. Ми не можемо перемогти тактикою часів, коли найбільшим об'єктом у небі над полем бою був голодний стерв'ятник. Потрібно модернізувати методи, орієнтуючись на знання наших індійських сусідів."
 NEP_capitalise_on_volunteer_eagerness:0 "Використання запалу добровольців"
 NEP_capitalise_on_volunteer_eagerness_desc:0 "Якщо в чомусь Непал і не має дефіциту, то це в людях, готових взяти гвинтівку і піти на фронт. У 1914 і 1925 роках тисячі непальців без вагань вирушали воювати за британських союзників. Цей ентузіазм ми маємо використати для розширення армії."
 NEP_implementation_of_conscription:0 "Запровадження призову"
 NEP_implementation_of_conscription_desc:0 "Попри велику кількість добровольців, ситуація в регіоні погіршується, і їх може бути недостатньо для оборони нації. Ми маємо запровадити систему загального військового призову, щоб гарантувати національну безпеку."
 NEP_invest_in_nakhu_rifle_workshops:0 "Інвестиції в збройові майстерні Накху"
 NEP_invest_in_nakhu_rifle_workshops_desc:0 "Непал ніколи не славився виробництвом вогнепальної зброї, але покійний Ґехендра Шумшер Рана намагався налагодити випуск гвинтівок у Накху. Покинуте обладнання цих цехів — краще, ніж нічого. Воно стане нашою відправною точкою для відродження власного виробництва."
 NEP_training_from_foreign_advisors:0 "Навчання від іноземних радників"
 NEP_training_from_foreign_advisors_desc:0 "Питання призначення на офіцерську посаду в непальській армії часто зводилося до того, наскільки близьким родичем прем'єра ви є. Через це країні бракує професійного офіцерського класу. Щоб змінити це, ми мусимо запросити іноземних експертів для навчання наших людей."
 NEP_inviting_air_instructors:0 "Запрошення авіаінструкторів"
 NEP_inviting_air_instructors_desc:0 "Хоча багатії в Непалі чули про літаки, лише одиниці бачили їх на власні очі. Створення військово-повітряних сил — надскладне завдання, яке повністю залежатиме від іноземних пілотів та інженерів. Можливо, з їхньою допомогою ми колись піднімемо в небо власні літаки."

 NEP_protection_of_nepalese_independence:0 "Захистити нашу незалежність"
 NEP_protection_of_nepalese_independence_desc:0 "Замість того, щоб просто бути підкореним могутнішим сусідом, Непал непохитно протистояв іноземному контролю, водночас успішно уникнувши тиранії Рана. Проте таку свободу не слід сприймати як належне, і ми маємо гарантувати, що ніколи більше не опинимося в положенні підкорених."
 NEP_resolving_the_bhutan_conflict:0 "Вирішення конфлікту з Бутаном"
 NEP_resolving_the_bhutan_conflict_desc:0 "За винятком тих кількох десятиліть, коли британці перешкоджали їм у цьому, більша частина історії Бутану складалася з жорстоких набігів на сусідів, особливо на колишнє Королівство Сіккім. Внаслідок індійської революції ми встановили контроль над Сіккімом, що розлютило бутанців, які відтоді здійснюють на нас набіги. Настав час помститися за ці напади і, можливо, визволити непальську меншину, яку Бутан так жорстоко пригнічує."
 NEP_integration_of_the_frontiers:0 "Інтеграція прикордоння"
 NEP_integration_of_the_frontiers_desc:0 "Прикордонні регіони Уттаранчал і Дарджилінг охоронялися непальськими військами для британців від самого початку повстання в Індії. Оскільки ми маємо намір повністю відірватися від будь-якого іноземного контролю, було б розсудливо просто зберегти контроль над цими регіонами. Зрештою, ці землі колись були непальськими, їх просто вкрали у нас під час британських завоювань, а тому ми маємо повне право володіти ними."
 NEP_punishing_tibetan_insolence:0 "Покарання тибетського зухвальства"
 NEP_punishing_tibetan_insolence_desc:0 "Тибетці довгий час були зухвалим народом, часто поводячись так, ніби вони кращі за нас, висуваючи безглузді вимоги та пригнічуючи наш народ. Кілька років тому їхнє жорстоке вбивство непальських громадян ледь не призвело до війни між нами, якій завадили лише побоювання втручання Калькутти чи Пекіна. Тепер, коли обидва ці фактори менше нас турбують, нарешті настав час поставити тибетців на місце."
 NEP_reaffirm_the_friendship_treaty:0 "Підтвердження договору про дружбу"
 NEP_reaffirm_the_friendship_treaty_desc:0 "Оскільки підтримка Домініону є життєво важливою для нашого виживання, а наша нація знову міцно повернулася до британської сфери впливу, ми маємо перепідписати договір про дружбу, який мали з Британією, але тепер із нашими друзями в [RAJ.Capital.GetCapitalVictoryPointName]. Цей договір був вперше підписаний ще до того, як індійці здобули свою нинішню незалежність, а тому важливо визнати його спадкоємність із Домініоном окремо від британців, хоча б як символічний жест наших міцних зв'язків."
 NEP_uphold_gurkha_commitments:0 "Дотримання зобов'язань щодо гуркхів"
 NEP_uphold_gurkha_commitments_desc:0 "Непальські війська, що діяли в британських батальйонах гуркхів, були основою виживання британського правління під час індійської революції, і вони, ймовірно, залишатимуться такими, доки існує Домініон. Щоб віддячити за їхню підтримку в придушенні нашої власної революції, ми маємо забезпечити подальше відправлення людей на допомогу нашим індійським друзям і придбати спорядження, необхідне для їхньої підготовки до майбутніх завдань."
 NEP_technological_exchange_with_raj:0 "Технологічний обмін з Домініоном"
 NEP_technological_exchange_with_raj_desc:0 "Наш союз із Домініоном представляє чудову можливість для обміну знаннями між нашими двома націями: іноземні промислові експерти та сучасні технологічні прориви тепер у нас під рукою. Таку можливість, незважаючи на наше небажання повністю індустріалізувати країну, не слід ігнорувати, а тому ми маємо прагнути якнайшвидше скористатися нею."
 NEP_under_the_wings_of_the_republic:0 "[NEP_HND_or_PRF]"
 NEP_under_the_wings_of_the_republic_HND:0 "Під крилом Республіки"
 NEP_under_the_wings_of_the_republic_PRF:0 "Пошук порозуміння з Федерацією"
 NEP_under_the_wings_of_the_republic_desc:0 "Без підтримки індійців «Мукті Сена», найімовірніше, була б розчавлена, а Непал вічно страждав би під гнітом Рана. Ми ніколи не забудемо той великий дар свободи, який надали нам індійці, і маємо публічно визнати ту життєво важливу роль, яку вони відіграли, щоб висловити нашу вдячність."
 NEP_seek_indian_economic_aid:0 "Пошук індійської економічної допомоги"
 NEP_seek_indian_economic_aid_desc:0 "Індустріалізація Непалу не буде легким завданням, а спроби впоратися з цим виключно власними силами навряд чи принесуть швидкі чи ефективні результати. На щастя, наші нові друзі на півдні мають настільки потужну промисловість, щоб допомогти нам, навіть незважаючи на руйнування громадянської війни. З їхньою допомогою Непал, можливо, одного дня зможе назвати себе справді сучасною нацією."
 NEP_acquire_blueprints_from_ishapore:0 "Отримання креслень з Ішапура"
 NEP_acquire_blueprints_from_ishapore_desc:0 "Заснований британцями і значно розширений після захоплення [HND.GetNameDef], Ішапур є, потенційно, одним із найбільш продуктивних збройових заводів у всій Азії, а тому має потужності для виробництва величезної кількості вогнепальної зброї. Якщо ми хочемо виробляти гвинтівки, що більше відповідають XX століттю, ніж модифіковані «Мартіні-Генрі», які досі використовує більшість наших військ, немає кращого місця для отримання креслень, ніж Ішапур."
 NEP_renegotiate_defence_obligations:0 "Перегляд оборонних зобов'язань"
 NEP_renegotiate_defence_obligations_desc:0 "Оскільки громадянська війна в Індії закінчилася, а наш союзник вийшов переможцем проти своїх варварських суперників, нинішній рівень індійської військової присутності в Непалі більше не потрібен, а тому ми вільні домагатися більшої незалежності від їхнього впливу. Сподіваємося, що наші союзники погодяться з цією думкою і дозволять нам знову діяти як вільна нація."

 NEP_the_padma_shumsher_economic_plan:0 "Економічний план Падми Шумшера"
 NEP_the_padma_shumsher_economic_plan_desc:0 "Незважаючи на спротив ідеї з боку прем'єр-міністра, а також багатьох впливових членів династії, Домініон зажадав, щоб ми розпочали індустріалізацію заради безпеки обох наших націй. Вони підтримали ідеї високопоставленого члена династії Падми Шумшера Рани, чиї радикальні погляди налаштували проти нього більшу частину уряду, але, ймовірно, допоможуть досягти того, чого вимагає від нас Домініон."
 NEP_implementing_the_company_act:0 "Впровадження Закону про компанії"
 NEP_implementing_the_company_act_desc:0 "Малоймовірно, що непальська промисловість запрацює сама собою без втручання уряду, оскільки небагато людей у країні, чиє прізвище не закінчується на «Рана», мають для цього можливості. Тому уряд має дати поштовх промисловому розвитку, і ми маємо розпочати створення кількох державних підприємств у текстильній галузі та інших доступних ринках."
 NEP_importing_displaced_indian_workers:0 "Залучення переміщених індійських робітників"
 NEP_importing_displaced_indian_workers_desc:0 "Роки конфлікту в Індії залишили багатьох людей без даху над головою та в розпачі, що робить їх ідеальною групою працівників для наших галузей промисловості, що розвиваються. Багато хто з них уже має досвід роботи на заводах, а наймаючи їх, ми також зможемо уникнути зайвого посилення впливу пересічного громадянина Непалу."
 NEP_ensure_defence_of_the_regime:0 "Забезпечення захисту режиму"
 NEP_ensure_defence_of_the_regime_desc:0 "Незважаючи на всі наші зусилля, цілком імовірно, що в майбутньому ми можемо зіткнутися з повторенням нещодавнього повстання, і невідомо, чи зможемо ми надалі покладатися на інші країни у виробництві зброї, необхідної для придушення заколоту. Тому ми маємо відродити минулі зусилля з виробництва зброї на місцях, навіть якщо вона буде дещо поступатися тій, яку можна придбати в іншому місці."
 NEP_place_limits_on_tax_skimming:0 "Обмеження податкових махінацій"
 NEP_place_limits_on_tax_skimming_desc:0 "Незважаючи на запеклий опір членів своєї династії, Падма Шумшер заявив про бажання зменшити кількість грошей, що вимиваються з держави для фінансування численних примх Рана. З огляду на його підтримку Домініоном, ми мало що можемо зробити, щоб зупинити таку тиранію."
 NEP_cotton_and_jute_mills_in_biratnagar:0 "Бавовняні та джутові фабрики в Біратнаґарі"
 NEP_cotton_and_jute_mills_in_biratnagar_desc:0 "Місто Біратнаґар, розташоване на рівнинах Тераї, є ідеальним місцем для перших великих промислових проєктів країни. Нам слід прагнути створити тут великі джутові та бавовняні фабрики, оскільки близькість до індійського кордону означає, що продукцію цих заводів, таку як шпагат, джутові мішки та одяг, можна легко експортувати нашому заможному сусідові."
 NEP_expanding_the_industrial_council:0 "Розширення Промислової ради"
 NEP_expanding_the_industrial_council_desc:0 "«Удьоґ Парішад», або Промислова рада, є однією з небагатьох попередніх спроб Джуддхи Рани втілити ідею індустріалізації. Вона була створена як спосіб спрямування фінансування на будь-які зусилля з індустріалізації, насамперед з метою розширення таких галузей, як лісозаготівля, від якої члени його родини отримують значні прибутки. Тепер вона слугуватиме ідеальним фундаментом для подальшого зростання інших ключових галузей національної економіки."
 NEP_furthering_thoshe_mining_efforts:0 "Поглиблення гірничих робіт у Тхоше"
 NEP_furthering_thoshe_mining_efforts_desc:0 "Шахта Тхоше в Рамечхапі є однією з найбільших залізних копалень у країні, хоча видобуток значно уповільнився останніми роками. Проте доступ до місцевого заліза для виробництва сталі, ймовірно, буде надзвичайно важливим для індустріалізації, а тому ми маємо забезпечити не лише відновлення цих гірничих робіт, а й наглядати за їхнім значним розширенням."

 NEP_bringing_nepal_into_the_industrial_age:0 "Виведення Непалу в індустріальну епоху"
 NEP_bringing_nepal_into_the_industrial_age_desc:0 "Непал як нація давно мав потенціал стати промисловою державою, але в результаті безгосподарності Рана він опинився на століття позаду своїх сусідів. Головним пріоритетом уряду після стабілізації має бути зміна курсу та остаточне виведення Непалу на шлях індустріалізації та економічного зростання."
 NEP_beginning_the_five_year_plan:0 "Запуск п'ятирічного плану"
 NEP_beginning_the_five_year_plan_desc:0 "Концепція багаторічних економічних планів стала досить поширеною останніми роками як спосіб подолання економічної відсталості. Ці ідеї є звичними по той бік кордону в Індії і поступово почали приживатися серед членів уряду в Катманду. Після того, як їхні аргументи перемогли, Непал тепер готовий розпочати власний п'ятирічний план, до кінця якого має бути досягнута індустріалізація."
 NEP_inviting_indian_investors:0 "Залучення індійських інвесторів"
 NEP_inviting_indian_investors_desc:0 "Непальська економіка навряд чи зможе зростати виключно сама по собі, і від неї не варто цього очікувати. Багато хто в Індії ледь не пускає слину від думки про те, щоб зробити собі ім'я через інвестування в промисловість Непалу, що розвивається, і ми маємо скористатися таким ентузіазмом для стимулювання нашого зростання."
 NEP_utilising_our_natural_beauty:0 "Використання нашої природної краси"
 NEP_utilising_our_natural_beauty_desc:0 "Незважаючи на перешкоди, спричинені індійською революцією, Непал почав здобувати певну популярність серед іноземців завдяки своїй природній красі. Існує незліченна кількість багатих чоловіків і жінок, які платитимуть цілі статки за можливість піднятися на наші гори та познайомитися з нашою культурою, і немає жодних причин відмовляти таким відвідувачам у можливості надати нам своє багатство."
 NEP_growing_the_pashmina_industry:0 "Розвиток індустрії пашміни"
 NEP_growing_the_pashmina_industry_desc:0 "Хоча вовна кашемірових кіз так тісно асоціюється з Кашміром, що навіть названа на честь цього регіону, вироби з пашміни, виготовлені з неї, часто виробляються і в Непалі. Протягом років непальську пашміну носили навіть у далекому гламурному Нью-Йорку в Америці, і незважаючи на їхню громадянську війну, там і в усьому світі все ще існує високий попит на ці предмети розкоші; попит, який ми маємо прагнути задовольнити якомога більше."
 NEP_towards_a_national_highway_network:0 "Створення національної мережі автошляхів"
 NEP_towards_a_national_highway_network_desc:0 "Хоча проєкт Поштового шосе, розпочатий родиною Рана, безумовно, є фантастичною відправною точкою, ми маємо мріяти масштабніше і прагнути з'єднати всю націю великою мережею автострад. Хоча навряд чи це буде завершено найближчим часом, навіть базові розробки, ймовірно, принесуть значні короткострокові вигоди для нації."
 NEP_adopting_modern_irrigation_methods:0 "Впровадження сучасних методів іригації"
 NEP_adopting_modern_irrigation_methods_desc:0 "Зрошення є життєво важливим для росту сільськогосподарських культур, і хоча решта світу почала відходити від часів, коли нестача дощу могла паралізувати країну, багато регіонів Непалу все ще перебувають під загрозою голоду, спричиненого посухою. Ми маємо прагнути вдосконалити наші іригаційні мережі в надії, що одного дня жодна людина в Непалі не зможе сказати вам, яка на смак варена трава."
 NEP_ramp_up_national_exports:0 "Нарощування національного експорту"
 NEP_ramp_up_national_exports_desc:0 "Майбутнє економіки Непалу має стати таким, де ми отримуватимемо значну вигоду від експорту товарів: від необроблених металів до вишуканого одягу та лісоматеріалів. Ми маємо максимально наростити виробництво у всіх галузях промисловості, водночас шукаючи нові ринки збуту, і з часом це принесе користь усій нації."

 NEP_paving_the_postal_highway:0 "Брукування Поштового шосе"
 NEP_paving_the_postal_highway_desc:0 "Проєкт Поштового шосе був ініційований на початку десятиліття з метою створення безперервної дороги вздовж усього південного кордону країни, орієнтованої, як випливає з назви, на поштову доставку. Значна частина цього проєкту все ще залишається незавершеною, і подальший розвиток магістралі має стати національним пріоритетом тепер, коли уряд став набагато стабільнішим."
 NEP_revive_the_government_railway_plan:0 "Відродження плану урядової залізниці"
 NEP_revive_the_government_railway_plan_desc:0 "Плани будівництва першої залізниці в Непалі, яка мала з'єднати місцеву лісозаготівельну промисловість поблизу кордону з покупцями в Індії, були повністю зірвані індійською революцією. Оскільки ситуація як в Індії, так і в Непалі зараз достатньо стабільна, ці плани слід відродити як фундамент залізничного транспорту країни."
 NEP_connecting_to_the_frontier:0 "З'єднання з прикордонням"
 NEP_connecting_to_the_frontier_desc:0 "Хоча непальські війська контролюють багато прикордонних регіонів, вони діють досить автономно від столиці через те, як важко дістатися до них із Катманду. З огляду на наші нещодавні кроки у розбудові залізничної інфраструктури, було б розсудливо спробувати побудувати залізниці, що з'єднують столицю з кордонами, аби посилити наш вплив."
 NEP_bringing_in_foreign_experts:0 "Залучення іноземних експертів"
 NEP_bringing_in_foreign_experts_desc:0 "Технологічний розвиток життєво необхідний для зростання економіки, проте в Непалі бракує фахівців, здатних очолити такий рух. Тому ми маємо запросити людей з усього світу, готових працювати за пристойну державну зарплатню, аби вони спрямували наш розвиток у майбутнє."
 NEP_constructing_the_sundarijal_station:0 "Будівництво станції Сундариджал"
 NEP_constructing_the_sundarijal_station_desc:0 "Вже кілька років існують плани будівництва гідроелектростанції біля витоку річки Баґматі в Сундариджалі. Невелика гребля в цьому місці ідеально підійде для забезпечення Катманду електроенергією, і завдяки нещодавньому зростанню промислових потужностей ми нарешті в змозі побудувати таку станцію."

 NEP_regency_of_the_ranas:0 "Регентство Рана"
 NEP_regency_of_the_ranas_desc:0 "Незважаючи на тиск ворогів ззовні та зрадників зсередини, уряд Рана вистояв. Соціалістичний натовп «Мукті Сена» розбитий і тікає назад до своїх господарів у Калькутті разом із королем-зрадником. Підійшовши так близько до прірви, цілком природно, що керівна рука прем'єр-міністра має стиснутися ще міцніше, аби запобігти повторенню цієї катастрофи."
 NEP_replacing_the_rebellious_ruler:0 "Заміна бунтівного правителя"
 NEP_replacing_the_rebellious_ruler_desc:0 "Оскільки невдячний король Трібхуван втік із країни разом із більшою частиною своєї родини, регент опинився перед дилемою служіння при номінально вакантному престолі. Задля забезпечення стабільності королівства та спадкоємності уряду Рана ми мусимо швидко знайти кандидата з законними правами, який також розумітиме, хто насправді тримає владу."
 NEP_purge_the_army_of_royalists:0 "Очищення армії від роялістів"
 NEP_purge_the_army_of_royalists_desc:0 "Хоча нам вдалося відбити загрозу королівської реставрації, значна частина армії залишається відданою переможеному королю та королівському дому. Оскільки ми не можемо повністю ліквідувати монархію, ми маємо гарантувати, що армія не стане бастіоном для дурнів, які сподіваються повторити приклад колишнього короля Трібхувана."
 NEP_furthering_control_of_village_courts:0 "Посилення контролю над сільськими судами"
 NEP_furthering_control_of_village_courts_desc:0 "У Непалі значна частина повсякденного врядування здійснюється місцевими органами, чиї інтереси та турботи мають локальний характер. Посиливши наш вплив у цих органах, ми зможемо гарантувати, що прагнення та потреби уряду будуть по-справжньому відчутні в усій країні та відомі кожному."
 NEP_ramp_up_revenue_extraction:0 "Нарощування вилучення доходів"
 NEP_ramp_up_revenue_extraction_desc:0 "Очевидно, що ми були занадто добрі до пересічних громадян, оскільки вони багатіють, поки держава намагається знайти кошти на власне існування. Ми маємо виправити цю несправедливість, підвищуючи податки всюди, де це можливо, і земельний податок малґуджарі є ідеальним кандидатом для такого підвищення. Хоча селяни, звісно, заперечуватимуть, ми ніколи не зважали на їхню думку в таких питаннях і не збираємося починати зараз."
 NEP_developing_a_moral_education_system:0 "Розробка системи морального виховання"
 NEP_developing_a_moral_education_system_desc:0 "Якщо розгромлена загроза «Мукті Сена» і довела щось, то це те, що значна частина Непалу лякаюче відкрита до проповідей негідників, заражених абсурдними іноземними ідеологіями. Задля майбутнього нації наступне покоління має вирости з належним розумінням свого місця у світі та мудрості своїх лідерів."
 NEP_harness_gorkha_nationalist_rhetoric:0 "Використання ґоркхської націоналістичної риторики"
 NEP_harness_gorkha_nationalist_rhetoric_desc:0 "Серед деяких молодших членів династії поступово зростає переконання, що для довгострокового збереження влади Рана нам потрібно переконати пересічного непальця, що ми працюємо в його інтересах. Тому було запропоновано спробувати кооптувати націоналістичний рух, що зростає тут і за кордоном, представляючи Рана як палких прихильників ґоркхського націоналізму проти іноземного панування."
 NEP_empowerment_of_the_council_of_ministers:0 "Розширення повноважень Ради міністрів"
 NEP_empowerment_of_the_council_of_ministers_desc:0 "Із заміною короля виконавча влада тепер під нашим повним контролем: прем'єр-міністр та його кабінет керують державним кораблем без жодного опору. Щоб закріпити цю зміну, Раді міністрів слід надати більше свободи у формуванні майбутнього курсу нації."
 NEP_remove_vestiges_of_royal_authority:0 "Усунення залишків королівської влади"
 NEP_remove_vestiges_of_royal_authority_desc:0 "Хоча король Самрадж'я розуміє своє становище, немає гарантій, що майбутні монархи не прийматимуть нерозумних та поспішних рішень. Аби захистити гідність королівського дому, ми маємо чітко дати зрозуміти: номінальні повноваження, якими колись володіли королі в Непалі, тепер належать прем'єр-міністру та його лояльному уряду. Ця нація підкоряється Рана, і ніщо цього не змінить."
 NEP_reorganise_decaying_ministries:0 "Реорганізація занепалих міністерств"
 NEP_reorganise_decaying_ministries_desc:0 "Хоча ми вже очистили державні інституції Непалу від ворогів, в уряді залишається багато марнотратства та безплідних зусиль, які можна усунути. Крім того, ми можемо використати цю нагоду, щоб винагородити тих, хто залишився вірним, і покарати тих, хто вирішив нічого не робити в нашу скрутну годину, навіть якщо вони ніколи не виступали проти нас."
 NEP_establish_a_controlled_legislature:0 "Створення підконтрольного законодавчого органу"
 NEP_establish_a_controlled_legislature_desc:0 "Наоочно продемонструвавши свою владу над державою, милостивий прем'єр-міністр готовий дарувати своїм підданим дар представництва: найздібніші та найлояльніші люди з усієї країни будуть відібрані для допомоги нашим мудрим правителям у керуванні. Справді, Рана — найщедріші з правителів."
 NEP_absolute_power_of_the_prime_minister:0 "Абсолютна влада прем'єр-міністра"
 NEP_absolute_power_of_the_prime_minister_desc:0 "Кораблю потрібен один капітан, а нації — один лідер. Служити державі означає діяти з абсолютною покорою волі прем'єр-міністра. Рана правили в такий спосіб майже століття і правитимуть так ще сто років, тепер не маючи потреби маскувати чи розмивати свою владу поступками слабким та негідним. Рана — це Непал, і заперечувати це означає заперечувати реальність."

 NEP_our_ruler_glorious:0 "Наш славний правитель"
 NEP_our_ruler_glorious_desc:0 "Століттю узурпації покладено край рукою нашого славного короля Трібхувана! Перетворивши спроби Домініону та Республіки зробити Непал зброєю один проти одного на потужний інструмент завоювання підтримки як елементів «Мукті Сена», так і уряду Рана, король знову опинився в авангарді політики Непалу."
 NEP_his_majestys_loyal_government:0 "Лояльний уряд Його Величності"
 NEP_his_majestys_loyal_government_desc:0 "З реставрацією короля Непал тепер став справді незалежним: він не під залізним кулаком корумпованого тирана Рана, що схиляється перед британцями, і не під владою радикальних соціалістів, зобов'язаних уряду в Калькутті, а по-справжньому самостійна країна. Ми маємо діяти швидко, аби скористатися цією ситуацією та встановити уряд, відданий королю та його задумам."
 NEP_restoring_power_to_the_sovereign:0 "Повернення влади суверену"
 NEP_restoring_power_to_the_sovereign_desc:0 "Під владою Рана король став лише символом, за допомогою якого вони утримували контроль над країною. Маючи уряд, нарешті відданий монарху, ми відбудуємо реальні повноваження суверена Непалу в управлінні державою."
 NEP_compromise_with_the_ranas:0 "Компроміс із Рана"
 NEP_compromise_with_the_ranas_desc:0 "Хоча роки правління Рана були прикрими, окремі представники династії залишаються здібними та впливовими постатями, ігнорувати яких було б нерозумно. Перед обличчям соціалістичної загрози буде неважко піти на необхідні поступки, аби залучити залишки старого ладу до нашої служби."
 NEP_empowering_local_councils:0 "Розширення повноважень місцевих рад"
 NEP_empowering_local_councils_desc:0 "Король — лише одна людина, і можливості уряду в такій країні, як наша, не безмежні. Надання місцевим радам повноважень вирішувати власні проблеми дозволить королю та його уряду більше зосередитися на національних пріоритетах, водночас створюючи відчуття чуйного до потреб людей врядування."
 NEP_a_state_that_serves_its_people:0 "Держава, що служить своєму народу"
 NEP_a_state_that_serves_its_people_desc:0 "Занадто довго держава керувалася так, ніби її мета — забезпечити вигоду кільком впливовим постатям на погибель усім іншим. Тепер, отримавши повноту влади, король Трібхуван у своїй великій мудрості розуміє, що обов'язок держави та її правителів — дбати про добробут свого народу, і невтомно працює в цьому дусі."
 NEP_ensure_royal_control_of_the_army:0 "Забезпечення королівського контролю над армією"
 NEP_ensure_royal_control_of_the_army_desc:0 "Тепер, коли період символічного правління закінчився, вкрай важливо, аби король відновив пряму королівську владу над збройними силами. За жодних обставин майбутньому узурпатору не може бути дозволено використовувати сили, призначені для захисту королівства, для його знищення."
 NEP_forming_an_elected_assembly:0 "Формування виборної асамблеї"
 NEP_forming_an_elected_assembly_desc:0 "Найважливішим пріоритетом у стабілізації Непалу є надання народу права голосу. Тільки працюючи з народом та його законними представниками, ми зможемо вивести Непал із тиранії безгосподарності Рана."
 NEP_royally_appointed_bharadari_sabha:0 "Призначена королем Бхарадарі Сабха"
 NEP_royally_appointed_bharadari_sabha_desc:0 "Хоча ми пішли на значні поступки народному врядуванню, в інтересах королівства необхідно тримати під контролем будь-яку обрану народом асамблею, аби запобігти спалахам правління натовпу. Для цього ми створимо призначувану верхню палату законодавчого органу, укомплектовану людьми, обраними королем за їхню компетентність та мудрість."
 NEP_prioritise_the_need_for_education:0 "Пріоритет потреб освіти"
 NEP_prioritise_the_need_for_education_desc:0 "Аби Непал мав світле майбутнє, його народ повинен бути готовим до викликів сучасного світу. Основою підготовки такого населення є освіта, що забезпечить людей знаннями та навичками, які служитимуть їм і Непалу протягом багатьох років."
 NEP_under_the_courageous_sovereign:0 "Під проводом мужнього суверена"
 NEP_under_the_courageous_sovereign_desc:0 "Поки інші намагалися захопити владу, звертаючись до чужинців, тільки король мав мужність виявити ініціативу, а не ставати на коліна перед тими, хто бачить у Непалі лише засіб для досягнення власних цілей. Реставрація заклала підвалини для вступу Непалу в епоху процвітання та безпеки на власних умовах."

 NEP_the_unshackling_of_nepal:0 "Визволення Непалу"
 NEP_the_unshackling_of_nepal_desc:0 "Нарешті тиранів Рана повалено, «Мукті Сена» захопила столицю, і нація може нарешті дивитися вперед, а не в минуле. Вперше за багато років майбутнє Непалу виглядає світлим, адже країну очолює не одна людина, а сам народ."
 NEP_formation_of_the_interim_government:0 "Формування тимчасового уряду"
 NEP_formation_of_the_interim_government_desc:0 "Успіх нашої революції належить монархії так само як і соціалістам, а народ все ще стоїть за свого короля перед обличчям непевного майбутнього. Оскільки дехто вперто ігнорує цю реальність, «Парішад» має взяти на себе провідну роль разом із королем у переході Непалу до демократії."
 NEP_a_democratic_maha_sabha:0 "Демократична Мага Сабга"
 NEP_a_democratic_maha_sabha_desc:0 "Дотримуючись двопалатної моделі інших демократичних країн, Непал створить верхню палату законодавчого органу, що обиратиметься народом. Ця верхня палата забезпечить контроль над повноваженнями нижньої палати та працюватиме разом із нею та королем над управлінням нацією."
 NEP_honour_the_legacy_of_the_martyrs:0 "Вшанування спадщини мучеників"
 NEP_honour_the_legacy_of_the_martyrs_desc:0 "Усі, хто загинув у прагненні до світлого майбутнього, усі, хто бився і поліг у битві за край тиранії Рана, усі, хто помер за Непал, будуть вшановані за свій героїзм та самопожертву, щоб майбутні покоління брали з них приклад."
 NEP_uplift_nepal_into_the_20th_century:0 "Піднесення Непалу у XX століття"
 NEP_uplift_nepal_into_the_20th_century_desc:0 "Майбутнє Непалу залежить від курсу, встановленого «Праджа Парішад». Приєднавшись до сучасного світу, створюючи добробут та шануючи релігію, ми зробимо Непал однією з передових країн світу, а гордість народу за свою країну відлунюватиме в усіх напрямках протягом тисяч років."

 NEP_loyalty_to_the_liberators:0 "Вірність визволителям"
 NEP_loyalty_to_the_liberators_desc:0 "Революція в Непалі була б неможливою без підтримки наших друзів у Калькутті. У нашу найтемнішу годину, коли холодна хватка Рана здавалася незмінним фактом життя, вони прихистили та підтримали «Мукті Сена» і виплекали свободу Непалу. Хоча «Парішад», безумовно, прихильніша до короля, ніж соціалісти, очевидно, що майбутнє Катманду — за Калькуттою."
 NEP_the_monarchy_problem:0 "Проблема монархії"
 NEP_the_monarchy_problem_desc:0 "Вирішуючи питання монархії, ми опиняємося між нашими принципами, нашими союзниками та реаліями коаліції, яка привела нас до влади. Рано чи пізно ми будемо змушені вирішити, чи є королю місце в майбутньому Непалу."
 NEP_dethrone_the_landlords:0 "Скинення землевласників"
 NEP_dethrone_the_landlords_desc:0 "Першочерговим завданням соціалістичної революції в будь-якій переважно сільській країні є відібрання контролю над землею у поміщиків та аристократів. Передача землі тим, хто її обробляє, не лише руйнує базу влади реакційного класу, а й здобуває лояльність та підтримку кісанів, які отримають велику вигоду від скасування влади господарів."
 NEP_research_support_from_india:0 "Дослідницька підтримка з Індії"
 NEP_research_support_from_india_desc:0 "Хоча наші амбіції пов'язані з сучасним світом, наразі Непал жахливо відстає від часу. Для виправлення цього наші власні зусилля мають поєднуватися з повною співпрацею та підтримкою наших союзників у Калькутті. Тільки тоді Непал зможе претендувати на місце в сучасності."
 NEP_glorify_the_kisan:0 "Слава кісанам"
 NEP_glorify_the_kisan_desc:0 "Якщо слава нації і належить комусь, то не окремій особистості, живій чи мертвій, а пригнобленому класу, чиє багатство побудувало палаци аристократів і чия продукція годувала армії принців та королів. Саме кісани є фундаментом та опорою Непалу, і саме для них ми будуватимемо майбутнє країни."
 NEP_the_land_of_red_mountains:0 "Земля червоних гір"
 NEP_the_land_of_red_mountains_desc:0 "Те, що ще зовсім нещодавно здавалося неможливим, сталося. Пережитки феодалізму та реакції пали в горах і долинах Непалу, поступившись місцем блискучим стягам соціалізму та модерну, що майорять високо в небі, фарбуючи землю під собою у яскраво-червоний колір."

 NEP_sweep_away_the_ranas_greed:0 "Геть жадібність Рана"
 NEP_sweep_away_the_ranas_greed_desc:0 "Із встановленням нового уряду настав час покінчити з останніми залишками корупції та кумівства Рана, які вкрали так багато у Непалу. Епоха клептократії, що призвела до зубожіння нації, буде зметена і ніколи не повернеться."
 NEP_developing_panchayat_self_governance:0 "Розвиток панчаятського самоврядування"
 NEP_developing_panchayat_self_governance_desc:0 "У пошуках плану майбутнього Непалу нам пощастило мати одну з найстаріших систем місцевого самоврядування у світі, яка відповідає нашим демократичним принципам. Розвиток та розширення прав цієї системи дозволить нам не лише модернізувати місцеве врядування, а й залучити підтримку та співпрацю надійних місцевих інституцій."
 NEP_establishment_of_the_pradhan_nyayalaya:0 "Створення Прадган Ньяялая"
 NEP_establishment_of_the_pradhan_nyayalaya_desc:0 "Для побудови демократичного майбутнього незалежність судової влади є життєво важливим кроком. Створюючи відповідальний Прадган Ньяялая (Верховний суд), ми гарантуємо, що закон буде поза межами використання як зброї партійними лідерами чи потенційними тиранами."
 NEP_protection_of_the_fundamental_principles:0 "Захист основоположних принципів"
 NEP_protection_of_the_fundamental_principles_desc:0 "Без принципів справедливості та людської гідності, що вели нас за собою, революція, за яку ми боролися проти Рана — це пусте захоплення влади. Тому наш найвищий обов'язок як учасників революції — дотримуватися та захищати ці основоположні принципи від будь-яких нападів і розбудовувати державу, яка захищатиме їх у відповідь."

