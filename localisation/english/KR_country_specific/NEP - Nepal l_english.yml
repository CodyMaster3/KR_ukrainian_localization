 NEP_country_intro_header:0 "Королівство Непал"
 NEP_country_intro_content:0 "Королівство Непал, об'єднане великим Прітхві Нараяном Шахом, довгий час залишалося унікальною державою порівняно зі своїми сусідами. Хоча Непал, як і індійські князівства, був підкорений британцями, йому вдалося зберегти значну автономію. Це стало можливим завдяки загальновідомій відвазі його військ та свідомій політиці ізоляціонізму. Офіційне визнання незалежності Британією відбулося у 1923 році, що зробило Непал другою державою в регіоні, яка досягла такого успіху, і першою, хто зробив це шляхом дипломатії, на відміну від Афганістану.\n\nСистема врядування також вирізняє Непал: хоча на папері королівством править династія Шах, фактична влада вже майже століття належить династії Рана через спадкову диктатуру. Рана керують країною через посаду прем'єр-міністра, тоді як король є лише шанованою номінальною постаттю, яка просто затверджує їхні накази. Хоча правління Рана викликає значне невдоволення як серед населення, так і у самого короля, їхня політика жорстких репресій, економічного застою та непохитної підтримки Британії дозволяла придушувати будь-яку опозицію в зародку.\n\nКоли в Індії спалахнула революція, Непал швидко втягнувся у конфлікт на боці британських союзників. Хоча сам Непал не став полем бою, тисячі гуркхських бійців були відправлені воювати під британським командуванням, а підрозділи прем'єр-міністра захищали прикордонні регіони, де вони залишаються і досі. Поразка у боротьбі з повстанцями та колапс головного союзника поставили Непал у вкрай скрутне становище, оскільки уряд у Калькутті відкрито ворожий до режиму Рана. За підтримки [HND.GetNameDef] почали формуватися опозиційні групи, насамперед «Непал Праджа Парішад», які сподіваються повалити Рана та встановити вільну націю, орієнтовану на Калькутту. Тільки час покаже, чи здійсняться їхні мрії, чи Рана та їхні британські союзники розчавлять ворогів і ще більше зміцнять залізне правління прем'єр-міністра."

 NEP_guide:0 "§MРегентство Рана§! ($paternal_autocrat_coloured$)\n£white_dot Коли закінчиться «Змова в Дарджилінгу», забезпечте перемогу підтримуваного Домініоном уряду, маючи на 25 або більше очок переваги над повстанцями.\n£white_dot Ви почнете як маріонетка, але зможете стати незалежним членом Антанти після фокуса §Y$NEP_renegotiate_defence_obligations$§!.\n\n§MКоролівська реставрація§! ($authoritarian_democrat_coloured$)\n£white_dot Коли закінчиться «Змова в Дарджилінгу», жодна зі сторін не повинна мати переваги в 25 або більше очок.\n£white_dot Завершення фокуса §Y$NEP_protection_of_nepalese_independence$§! дасть можливість приєднатися до Сфери спільного процвітання (якщо ви межуєте з її членом) або до будь-якої фракції, частиною якої стане Княжа Федерація.\n\n§MВизволення Непалу§! ($social_liberal_coloured$ / $radical_socialist_coloured$ / $syndicalist_coloured$ / $totalist_coloured$)\n£white_dot Коли закінчиться «Змова в Дарджилінгу», забезпечте перемогу підтримуваних Бхаратією повстанців, маючи на 25 або більше очок переваги над урядом.\n£white_dot Подальша подія дозволить вам обрати між $social_liberal_coloured$ «Непал Праджа Парішад» або $radical_socialist_coloured$ Робітничою партією Сватантра.\n£white_dot РПС згодом зможе стати $syndicalist_coloured$ або $totalist_coloured$ через рішення, якщо [HND.GetNameDef] обере один із цих шляхів після фокуса §Y$HND_first_united_congress$§!.\n£white_dot РПС почне як маріонетка, але зможе стати незалежним союзником [HND.GetNameDef] через фокус §Y$NEP_renegotiate_defence_obligations$§!, тоді як для «Парішад» завершення фокуса §Y$NEP_under_the_wings_of_the_republic$§! дозволить приєднатися до будь-якої фракції, частиною якої стане Княжа Федерація."

 NEP_KR_gathering_storm_desc:0 "Майже століття Непалом править залізний кулак династії Рана, придушуючи будь-яке інакомислення та перетворюючи монархію на маріонеткову інституцію. Навіть після Індійської революції тверда рука прем'єр-міністрів Рана дозволила країні уникнути долі британських союзників, швидко розправляючись із потенційною опозицією.\n\nОднак із зростанням напруженості в Індії та підготовкою сусідньої Республіки в Калькутті до відновлення війни, здається, що Рана готуються зустріти свою найбільшу загрозу."

