 NEP_conspiracy_ongoing_flag:0 "Змова триває."
 NEP_conspiracy_influence_change_tooltip:0 "Вплив [$COUNTRY$.GetAdjective] [$COUNTRY$.GetFlag] змінюється на [?NEP_conspiracy_influence_change|=Y0] очок."
 NEP_conspiracy_influence_costchange_tooltip:0 "Вартість рішень на $DIRECTION$ впливу [$COUNTRY$.GetAdjective] [$COUNTRY$.GetFlag] змінюється на £pol_power §Y$NUMBER$§! політичної влади."
 NEP_backed_revolution_flag:0 "Ми вирішили підтримати змову проти Рана."
 NEP_backed_ranas_flag:0 "Ми вирішили підтримати прем'єр-міністра проти повстанців."
 NEP_backed_revolution_tt:0 "Ми спробуємо підтримати §lМукті§! §RСену§! у їхній революції з метою усунення Джуддхи Рани та його династії, що відкриє гілку фокусів §Y$NEP_the_darjeeling_conspiracy$§!."
 NEP_backed_ranas_tt:0 "Ми продовжуватимемо підтримувати §Pпрем'єр-міністра§! у його спробах утримати владу, що відкриє гілку фокусів §Y$NEP_rooting_out_the_traitors$§!."
 NEP_conspiracy_start_decisions_tt:0 "Відкриває рішення категорії £GFX_decision_icon_small §Y[NEP_loc_conspiracy_name]§!.\n\n"
 NEP_conspiracy_start_NEP_tt:0 "§gРозпочнеться змова проти правлячої династії Рана, що відкриє відповідну категорію рішень. Приблизно через рік прем'єр-міністр буде або «усунутий» з посади, або змовники будуть остаточно розгромлені, навіть якщо король підтримає їх.§!"
 NEP_conspiracy_start_RAJ_tt:0 "§gУ Непалі розпочалася змова проти правлячої династії Рана, організована нашими ворогами в Калькутті, які прагнуть встановити в королівстві лояльний їм режим. Ми повинні забезпечити розгром цих бунтівників, коли вони зроблять свій хід трохи менш ніж за рік, якщо не хочемо отримати ще одного ворога на сході.§!"
 NEP_conspiracy_start_HND_tt:0 "§gУ Непалі розпочалася змова проти правлячої династії Рана за повної підтримки наших відважних агентів. Повстання має розпочатися трохи менш ніж за рік, і ми повинні забезпечити успіх революції наших союзників, позбавивши Домініон цінного партнера та потенційно отримавши власного.§!"
 NEP_conspiracy_spirit_tt:0 "§YЦей дух буде видалено після завершення змови.§!"
 NEP_conspiracy_ending_soon_nepal_tt:0 "§RЗмовники зроблять свій хід через 30 днів, що так чи інакше остаточно визначить долю Непалу.§!"
 NEP_conspiracy_ending_soon_india_tt:0 "§RПовстанці в Непалі готуються зробити свій хід через 30 днів, що покладе край нашим спробам вплинути на них. Ми не можемо дозволити ворогам перемогти нас.§!"

### Characters ###
 NEP_tribhuvan:0 "Трібхуван"
 NEP_tribhuvan_leader_desc_start:0 "§YНародився:§! §L30 червня 1906 року в Катманду, Королівство Непал§!\n§YБіографія:§! §LПісля смерті свого батька, короля Прітхві, у 1913 році, лише п'ятирічний Трібхуван Бір Бікрам Шах Дев став королем Трібхуваном. Він ріс під регентством королеви-матері Дів'єшварі Лакшмі Деві, а у віці 12 років одружився з Канті Радж'я Лакшмі Деві Шах та її сестрою Ішварі в один день під час двох окремих церемоній.\n\nПопри те, що Трібхуван був головою королівського дому Ґоркха (також відомого як династія Шах), ні він, ні його матір не мали реальної влади, оскільки Рана тримали управління державою мертвою хваткою. Під час Великої війни йому та його матері погрожували й залякували, аби змусити віддати наказ непальським військам вступити у війну на боці Британії та Антанти, що лише поглибило взаємну ворожнечу між двома родинами.§!\n\n"
 NEP_tribhuvan_leader_desc:0 "$NEP_tribhuvan_leader_desc_start$§LСьогодні Трібхуван вже дорослий, і він терпить владу Рана набагато довше, ніж йому б хотілося. Поки «Непал Праджа Парішад» продовжує плести інтриги, Трібхуван відчуває, що час для його власного ходу настане зовсім скоро.§!"
 NEP_tribhuvan_restored_leader_desc:0 "$NEP_tribhuvan_leader_desc_start$§LТепер, коли Рана повалені, Трібхуван готовий нарешті надолужити згаяне за майже століття деспотизму цієї династії. Зосередивши значну владу у власних руках, лише час покаже, як саме Трібхуван вирішить скористатися своїм оновленим мандатом.§!"
 NEP_tribhuvan_democratic_leader_desc:0 "$NEP_tribhuvan_leader_desc_start$§LТепер, коли Рана повалені, Трібхуван готовий нарешті надолужити згаяне за майже століття деспотизму цієї династії. Надаючи свою легітимність уряду, сформованому вільними людьми Непалу, Трібхуван сподівається очолити перехід країни від деспотії XIX століття до сучасної демократичної нації.§!"
 NEP_ram_prasad_rai:0 "Рам Прасад Рай"
 NEP_ram_prasad_rai_leader_desc:0 "§YНародився:§! §L1 березня 1910 року в Бходжпурі, Королівство Непал§!\n§YБіографія:§! §LНародившись у заможній родині в селі Санділунг, мало хто міг подумати, що непомітна поява на світ Рама Прасада Рая матиме колосальні наслідки для майбутнього Непалу. У віці 14 років він вступив до армії Британського Раджу як боєць елітних бригад гуркхів, але зрештою перейшов на бік уряду Калькутти, воюючи у складі індійських повстанських загонів проти британських сил.\n\nПоки Народна Республіка Бхаратія заліковувала рани та святкувала важко здобуту свободу після перемир'я 1927 року, Рам невдовзі уявив, як така революція могла б виглядати на його батьківщині. Протягом більшої частини 20-х та 30-х років він співпрацював із побратимами-революціонерами та невтомно працював над формуванням політичної свідомості непальського селянства.\n\nПісля років зусиль непальська революція нарешті відбулася, і його співвітчизники були звільнені від кайданів деспотичного феодалізму Рана. Тісно пов'язаний з ІНК, він навряд чи відійде далеко від партійної лінії своїх соратників в Індії.§!"

 NEP_subarna_shumsher_rana:0 "Субарна Шумшер Рана"
 NEP_subarna_shumsher_rana_advisor_desc:0 "§YНародився:§! §L1910 року в Катманду, Королівство Непал§!"
 NEP_mahabir_shumsher_rana:0 "Магабір Шумшер Рана"
 NEP_mahabir_shumsher_rana_advisor_desc:0 "§YНародився:§! §Lу Катманду, Королівство Непал§!"
 NEP_matrika_prasad_koirala:0 "Матріка Прасад Коїрала"
 NEP_matrika_prasad_koirala_sic_desc:0 "§YНародився:§! §L1 січня 1912 року в Бенаресі, Об'єднані провінції Аґри та Ауда, Британська Індія§!"
 NEP_tanka_prasad_acharya:0 "Танка Прасад Ачар'я"
 NEP_tanka_prasad_acharya_leader_desc:0 "§YНародився:§! §L31 грудня 1912 року в Навалпарасі, Королівство Непал§!\n§YБіографія:§! §LТанка Прасад Ачар'я народився в родині Тіки Прасада Ачар'ї, окружного податківця. Він підтримував дуже близькі стосунки зі своєю матір'ю і перебував під сильним впливом її моральних настанов та індуїстської віри. Астрологічно він народився між знаками Шукри та Бріхаспаті, чиї «матеріалістичні» та «духовні» впливи змусили багатьох пророкувати, що він колись стане раджою (королем) або джогі (святим).\n\nКоли Танка був ще юним, його батько викрив корупцію одного з підлеглих, проте того виправдали, а Тіку змусили сплатити величезний штраф. Відтоді Танка запекло ненавидів Рана і став одержимим політикою, що призвело до заснування «Непал Праджа Парішад».\n\nВважаючи себе людиною сьогодення, Танка бачить феодальне минуле Непалу як пережиток давнини. Він планує утвердити незалежність Непалу та вивести його в сучасну епоху, навіть якщо це завдання виявиться надзвичайно важким.§!"
 NEP_bishweshwar_prasad_koirala:0 "Бішвешвар Прасад Коїрала"
 NEP_bishweshwar_prasad_koirala_advisor_desc:0 "§YНародився:§! §L8 вересня 1914 року в Бенаресі, Об'єднані провінції Аґри та Ауда, Британська Індія§!"
 NEP_kunwar_inderjit_singh:0 "Кунвар Індерджит Сінґх"
 NEP_kunwar_inderjit_singh_sic_desc:0 "§YНародився:§! §L1906 року в Думракоті, Королівство Непал§!"
 NEP_juddha_shumsher_jang_bahadur_rana:0 "Джуддха Шумшер Рана"
 NEP_juddha_shumsher_jang_bahadur_rana_leader_desc:0 "§YНародився:§! §L19 квітня 1875 року в Катманду, Королівство Непал§!\n§YБіографія:§! §LНебагато представників роду Рана мають настільки «блакитну кров», як могутній Джуддха Рана, що народився в родині чхетрі та раджпутів і водночас є племінником самого засновника династії Рана. Великий Джанг Багадур Рана зробив його полковником ще в немовлячому віці, а генералом він став уже в десять років. Попри хворобу, через яку йому довелося покинути навчання, шлях Джуддхи до влади був стабільним і славним.§!"
 NEP_samrajya_shumsher_jang_bahadur_rana:0 "Самрадж'я Шумшер Джанг Багадур Рана"
 NEP_samrajya_shumsher_jang_bahadur_rana_regnal:0 "Самрадж'я"
 NEP_samrajya_shumsher_jang_bahadur_rana_leader_desc:0 "§YНародився:§! §L1921 року в Катманду, Королівство Непал§!\n§YБіографія:§! §LСамрадж'я посідає унікальне становище, будучи сином представника Рана та представниці Шах. Значну частину дитинства він провів між двох вогнів через зростаючу напруженість у стосунках обох родин, хоча його батько, генерал Кайзер Шумшер, та мати, принцеса Лакшмі Радж'я Лакшмі Дев, докладали зусиль, аби вберегти його від сімейних чвар.\n\nПопри це, Самрадж'я опинився в центрі уваги після кульмінації багаторічного протистояння між Рана та Шахами. Молодий і недосвідчений, він приречений (за задумом) підтримувати традиційне правління Рана над королівським домом Ґоркха. Справді, Рана нарешті вдалося остаточно ототожнити себе з правлячою родиною.§!"
 NEP_kaiser_shumsher_jang_bahadur_rana:0 "Кайзер Шумшер Рана"
 NEP_kaiser_shumsher_jang_bahadur_rana_sic_desc:0 "§YНародився:§! §L8 січня 1892 року в Королівстві Непал§!"
 NEP_giri_prasad_burathoki:0 "Ґірі Прасад Буратхокі"
 NEP_giri_prasad_burathoki_high_command_desc:0 "§YНародився:§! §Lу Королівстві Непал§!"
 NEP_mutilal_gurung:0 "Мутілал Ґурунґ"
 NEP_mutilal_gurung_high_command_desc:0 "§YНародився:§! §L1898 року в Бхарсе, Королівство Непал§!"
