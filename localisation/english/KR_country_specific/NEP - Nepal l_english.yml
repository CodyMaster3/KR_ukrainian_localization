 NEP_follow_the_calcutta_line:0 "Дотримуватися лінії [HND.Capital.GetCapitalVictoryPointName]"
 NEP_follow_the_calcutta_line_desc:0 "Як доіндустріальна держава без власного реального соціалістичного руху, Робітнича партія Сватантра діє швидше як місцеве відділення уряду в [HND.Capital.GetCapitalVictoryPointName], аніж як самостійна сила. З огляду на нещодавні ідеологічні зміни в Індії, було б розважливо забезпечити нашу повну відповідність поточному керівництву Республіки."

 NEP_the_darjeeling_conspiracy_category:0 "[NEP_loc_conspiracy_name]"
 NEP_the_darjeeling_conspiracy_category_desc:0 "[NEP_loc_conspiracy_desc]"
 NEP_the_darjeeling_conspiracy_category_NEP:0 "Змова в Дарджилінгу"
 NEP_the_darjeeling_conspiracy_category_desc_NEP:0 "У Непалі назріває революція: антиранівська опозиція згуртувалася в «Армію визволення» (Мукті Сена), що діє за значної підтримки [HND.GetNameDef] у Калькутті. За допомогою [RAJ.GetNameDef] прем’єр-міністр Джуддха Шумшер Рана сподівається розгромити цих бунтівників і повністю приєднатися до Домініону, щоб помститися Республіці за її втручання.\n\nВажко сказати, що станеться, коли повстанці нарешті зроблять свій хід, але якщо будь-яка зі сторін досягне успіху, Непал опиниться втягнутим у сферу впливу свого благодійника. Якщо ж нікому не вдасться перемогти, у короля може з'явитися можливість відновити порядок і зберегти національний нейтралітет.$NEP_the_darjeeling_conspiracy_category_desc_info$"
 NEP_the_darjeeling_conspiracy_category_HND:0 "Революція в Непалі"
 NEP_the_darjeeling_conspiracy_category_desc_HND:0 "Тепер, коли підготовка до операції «Грім» йде повним ходом, наша підтримка опозиції в Непалі дає нам ідеальну нагоду вирвати одну з небагатьох держав, що все ще дружні до окупантів у Лахорі, ще до початку вторгнення. Ми повинні забезпечити «Мукті Сену» достатньою кількістю союзників, зброї та вишколу, щоб вони перемогли Рана. Щойно Непал буде визволено, решта субконтиненту обов'язково піде слідом.$NEP_the_darjeeling_conspiracy_category_desc_info$"
 NEP_the_darjeeling_conspiracy_category_RAJ:0 "Наші інтереси в Непалі"
 NEP_the_darjeeling_conspiracy_category_desc_RAJ:0 "Бандити, що окупували більшу частину нашої країни, явно не задоволені руйнуванням лише Індії — тепер вони хочуть принести хаос та анархію і в Непал. Наш союзник, вельмишановний прем’єр-міністр Джуддха Шумшер Рана, непохитно стоїть проти цих бунтівників, але без нашої допомоги він ризикує опинитися в сирій землі. Ми не можемо цього допустити: ми мусимо розчавити заколотників і сподіватися, що Непал віддячить нам, коли Калькутта неминуче спробує напасти на нас.$NEP_the_darjeeling_conspiracy_category_desc_info$"
 NEP_the_darjeeling_conspiracy_category_desc_info:0 "\n\n[HND.GetFlag] Сила підтримуваних Бхаратією повстанців: [?NEP.NEP_conspiracy_influence_var_@HND|Y0]\n[RAJ.GetFlag] Сила підтримуваного Домініоном уряду: [?NEP.NEP_conspiracy_influence_var_@RAJ|Y0]\nЯкщо одна зі сторін матиме перевагу в §G25 або більше очок§!, Непал приєднається до неї після завершення місії, інакше він, швидше за все, залишиться нейтральним.\n\nЗа поточного рівня впливу ймовірно, що:\n[NEP_conspiracy_winning_check]"

 NEP_conspiracy_mission:0 "Змова в Дарджилінгу"
 NEP_conspiracy_mission_desc:0 "Коли вони зберуть достатньо сил, «Мукті Сена» виступить проти династії Рана. Так чи інакше, доля Непалу скоро вирішиться."
 NEP_conspiracy_HND_winning_check:0 "§l[HND.GetFlag] Повстанці успішно витіснять Рана.§!"
 NEP_conspiracy_RAJ_winning_check:0 "§P[RAJ.GetFlag] Прем'єр-міністр переможе повстанців.§!"
 NEP_conspiracy_NEP_winning_check:0 "§g[NEP.GetFlag] Армія може втрутитися, щоб запобігти анархії.§!"

 NEP_weaken_HND_influence_decision:0 "[NEP_loc_weaken_HND_influence_name]"
 NEP_weaken_HND_influence_rebels_name:0 "Протидіяти домінуванню Республіки"
 NEP_weaken_HND_influence_ranas_name:0 "Діяти проти повстанців"
 NEP_weaken_HND_influence_decision_desc:0 "[NEP_loc_weaken_HND_influence_desc]"
 NEP_weaken_HND_influence_rebels_desc:0 "Хоча ми покладаємося на Калькутту в боротьбі проти Рана, якщо ми дозволимо їхньому впливу стати надто сильним, ми ризикуємо перетворитися на звичайну маріонетку Бхаратії. Ми повинні наголошувати на своїй незалежності, щоб запобігти такому результату."
 NEP_weaken_HND_influence_ranas_desc:0 "Не можна дозволити повстанцям нарощувати силу. Хоча ми навряд чи знищимо їх лише кількома рейдами, ми повинні завдавати ударів при кожній нагоді, щоб виснажити їх у довгостроковій перспективі."

 NEP_weaken_RAJ_influence_decision:0 "[NEP_loc_weaken_RAJ_influence_name]"
 NEP_weaken_RAJ_influence_rebels_name:0 "Посіяти розбрат у лавах уряду"
 NEP_weaken_RAJ_influence_ranas_name:0 "Зменшити залежність від Домініону"
 NEP_weaken_RAJ_influence_decision_desc:0 "[NEP_loc_weaken_RAJ_influence_desc]"
 NEP_weaken_RAJ_influence_rebels_desc:0 "Династія Рана не є єдиним фронтом, про що свідчать її численні внутрішні суперечки та кількість членів роду в наших лавах, які хочуть покласти край тиранії своєї родини. Кілька влучних слів у потрібні вуха — і ми легко розвалимо їх через міжусобиці."
 NEP_weaken_RAJ_influence_ranas_desc:0 "Хоча ми покладаємося на Лахор у підтримці проти «Мукті Сена», якщо ми дозволимо їхньому впливу стати надто сильним, ми ризикуємо стати звичайною індійською маріонеткою. Ми повинні наголошувати на своїй незалежності."

 NEP_increase_HND_influence_decision:0 "[NEP_loc_increase_HND_influence_name]"
 NEP_increase_HND_influence_HND_name:0 "Підтримка Праджа Парішад"
 NEP_increase_HND_influence_rebels_name:0 "Залучення королівських офіцерів"
 NEP_increase_HND_influence_ranas_name:0 "Скорочення поліцейських заходів"
 NEP_increase_HND_influence_decision_desc:0 "[NEP_loc_increase_HND_influence_desc]"
 NEP_increase_HND_influence_HND_desc:0 "«Непал Праджа Парішад» представляє більш цивільне крило повстання проти Рана і є життєво важливою для залучення тієї частини населення, яка зневажає диктатуру, але побоюється радикалізму. Ми повинні посилити їхню підтримку, якщо хочемо успіху революції."
 NEP_increase_HND_influence_rebels_desc:0 "Хоча зараз вони діють в інтересах Рана, багато офіцерів в армії, які не належать до правлячого роду, зберігають вірність передусім королю. Переконавши їх, що усунення Рана відповідає інтересам монарха, ми схилимо їх на бік революції."
 NEP_increase_HND_influence_ranas_desc:0 "Навіть коли готується повстання, ми не можемо постійно жити в стані страху. Немає сенсу продовжувати щоденні рейди всюди, де підозрюють повстанців; ці витрати краще спрямувати на новий автомобіль для прем’єр-міністра або інші подібні потреби."

 NEP_increase_RAJ_influence_decision:0 "[NEP_loc_increase_RAJ_influence_name]"
 NEP_increase_RAJ_influence_RAJ_name:0 "Надіслати кошти Джуддхі Рані"
 NEP_increase_RAJ_influence_rebels_name:0 "Обмеження групових зустрічей"
 NEP_increase_RAJ_influence_ranas_name:0 "Зміцнення лояльності армії"
 NEP_increase_RAJ_influence_decision_desc:0 "[NEP_loc_increase_RAJ_influence_desc]"
 NEP_increase_RAJ_influence_RAJ_desc:0 "Якщо прем'єр-міністр Непалу має боротися з цими бунтівниками, йому знадобляться кошти на закупівлю зброї, спорядження та найм додаткової охорони та солдатів. Маючи достатній надлишок, ми повинні надати кошти для допомоги в цих справах."
 NEP_increase_RAJ_influence_rebels_desc:0 "Хоча ефективна організація є запорукою успіху, ми ризикуємо бути заарештованими щоразу, коли збираємося для планування. Було б розважливо тимчасово скоротити кількість зустрічей, аби уникнути провалів."
 NEP_increase_RAJ_influence_ranas_desc:0 "Повстанці не переможуть Непал, доки армія на боці прем'єр-міністра. На жаль, багато хто боїться, що в потрібний момент солдати вистрілять йому в спину. Ми не можемо цього допустити і мусимо забезпечити лояльність війська будь-яким способом."

 NEP_india_send_guns_decision:0 "[NEP_india_send_guns_name]"
 NEP_india_send_guns_HND_name:0 "Озброєння Мукті Сена"
 NEP_india_send_guns_RAJ_name:0 "Допомога силам безпеки Непалу"
 NEP_india_send_guns_decision_desc:0 "[NEP_india_send_guns_desc]"
 NEP_india_send_guns_HND_desc:0 "Коли настане час повстання, нашим союзникам знадобиться стільки зброї, скільки вони зможуть винести. Оскільки в самому Непалі способів дістати її небагато, ми маємо забезпечити їх спорядженням самі."
 NEP_india_send_guns_RAJ_desc:0 "Сили безпеки Непалу часто озброєні гірше, ніж звичайний поліцейський у Лахорі, але від них очікують розгрому збройного заколоту. Ми повинні надіслати їм будь-які гвинтівки, які можемо виділити, щоб вони мали шанси проти повстанців, озброєних Калькуттою."

 NEP_india_command_power_decision:0 "[NEP_india_command_power_name]"
 NEP_india_command_power_HND_name:0 "Вишкіл революціонерів РПС"
 NEP_india_command_power_RAJ_name:0 "Розширення операцій LIB у Катманду"
 NEP_india_command_power_decision_desc:0 "[NEP_india_command_power_desc]"
 NEP_india_command_power_HND_desc:0 "Хоча «Парішад» корисна нам, важко уявити, як купка інтелектуалів середнього класу штурмує Катманду. Більш завзяті сили Робітничої партії Сватантра — значно краща ставка, і ми повинні навчити їх перед початком виступу."
 NEP_india_command_power_RAJ_desc:0 "Лахорське бюро розслідувань має одних із найкращих шпигунів у всій Азії; без них Республіка, мабуть, спровокувала б уже зо три десятки повстань лише цього року. Якщо хтось і здатний зупинити бунтівників у Непалі, то це вони, тому нам слід відправити більше агентів до Катманду на допомогу Джуддхі Рані."

 NEP_join_faction_name: "[NEP_loc_join_faction]"
 NEP_join_faction:0 "Приєднатися до [FROM.GetNameDef]"

 NEP_assert_the_mantle_of_asal_hindustan:0 "Прийняти мантію Асал Хіндустану"
 NEP_assert_the_mantle_of_asal_hindustan_desc:0 "Коли великий Прітхві Нараян Шах об'єднав Непал, він проголосив наше королівство Асал Хіндустаном — справжньою Індією, оскільки решта субконтиненту була окупована могольськими загарбниками. Хоча тоді мало хто сприймав цю заяву як щось більше, ніж націоналістичну браваду, сьогодні ми стоїмо як беззаперечні правителі всього Хіндустану. Ми подбаємо про те, щоб світ дізнався про наше право на владу над ним."

 NEP_surviving_the_indian_nightmare_category:0 "Виживання в індійському кошмарі"
 NEP_pilfer_the_depots:0 "Опустошити склади"
 NEP_pilfer_the_depots_desc:0 "Ми відчуваємо гостру потребу в гвинтівках. На щастя, наша армія рідко викидає чи продає старе спорядження, натомість просто відправляє його на зберігання про всяк випадок. Багато з цих одиниць зброї вже несправні або настільки застаріли, що майже не мають практичної цінності, проте ми маємо вишкребти достатньо ресурсів, аби озброїти наші війська."
 NEP_emergency_military_production:0 "Надзвичайне військове виробництво"
 NEP_emergency_military_production_desc:0 "Ту крихту промисловості, що ми маємо, можна перепрофілювати на виробництво уніформи, боєприпасів та іншого спорядження, якого відчайдушно потребує армія. Це обмежить наші можливості у виробництві будь-чого іншого, але зараз ніщо інше не має значення."
 NEP_retreat_to_kathmandu:0 "Відступити до [323.GetCapitalVictoryPointName]"
 NEP_retreat_to_kathmandu_desc:0 "Вороги прорвали лінію фронту і почали окупувати частину Непалу. Відступ до столиці та перехід до глухої оборони — наш найкращий вихід на цьому етапі. Сподіватимемося, що невдалі ворожі атаки на місто дадуть нам можливість для контрнасту."
 NEP_fortify_uttaranchal:0 "Укріпити [814.GetName]"
 NEP_fortify_uttaranchal_desc:0 "Гори та пагорби регіону [814.GetName] самі по собі дають значну оборонну перевагу, проте цього навряд чи вистачить для повного захисту власне Непалу від рішуче налаштованої армії. Нам слід розпочати будівництво укріплень у цьому регіоні, аби тримати бойові дії якомога далі від серця країни."
 NEP_fortify_darjeeling:0 "Укріпити [887.GetName]"
 NEP_fortify_darjeeling_desc:0 "[887.GetName] є життєво важливим логістичним вузлом для наших військ на сході, оскільки це єдиний надійний шлях до [888.GetName] та інших східних регіонів. Ми маємо збудувати додаткові фортифікації, аби гарантувати, що [887.GetName] не впаде."

