l_english:

 nepal_focus: "Фокуси Непалу"

### Events ###

 nepal_events.1.t:0 "Арешт Дашаратха Чанда"
 nepal_events.1.d:0 "Відтоді як режим у Калькутті почав зміцнювати свою владу, він використовував кожну нагоду для фінансування повстання проти непальської держави, намагаючись перетворити її на слухняну маріонетку, а можливо, навіть анексувати в майбутньому. Так звана «Непал Праджа Парішад», або Народна рада, була однією з головних груп, що отримували підтримку від Республіки у своїх спробах розпалити революцію в Непалі. Попри недавнє заснування, їй вдалося зібрати вражаючу кількість прихильників у високих кабінетах.\n\nОднак наразі Калькутті доведеться шукати нову змію, щоб натравити на нас, адже за везінням сьогодні під час рейду проти членів Ради був заарештований другий за рангом керівник організації Дашратх Чанд Тхакурі. Хоча рейд не мав на меті саме його, це приємний сюрприз; якщо вдача буде на нашому боці, ці бунтівники розбіжаться, як безголові кури, у пошуках нового лідера."
 nepal_events.1.a:0 "Ще одним повстанцем менше."

 nepal_events.2.t:0 "Шепіт із палацу"
 nepal_events.2.d:0 "Попри сподівання, що діяльність «Парішад» зійде нанівець після арешту Чанда Тхакурі, звіти тривожно свідчать про те, що група стала активнішою, ніж будь-коли, намагаючись діяти швидко, поки решту їхнього керівництва не спіткала та сама доля. Проте ще більше занепокоєння викликає шепіт із палацу щодо особистого тренера короля, Дхарми Бхакти Матхеми. Матхема давно перебував під підозрою прем'єр-міністра, оскільки колись він був безпосередньо пов'язаний із групами, які зараз керують у Калькутті, хоча проти нього ніколи не було нічого конкретного.\n\nОстанні чутки лише посилили підозри: персонал палацу доповідає, що підслухав крамольні висловлювання, адресовані королю в моменти, які вважалися приватними. Один зі слуг навіть стверджує, що король погодився з цими думками, нібито вважаючи, що з прем'єр-міністром треба щось «робити». Хоча у нас мало доказів, крім пліток слуг, важко не відчувати параної щодо того, яку отруту вливають у вуха королю..."
 nepal_events.2.a:0 "Навіть якщо це правда, король не становить великої загрози."

 nepal_events.3.t:0 "Чутки з Калькутти"
 nepal_events.3.d:0 "На додачу до активності «Парішад» та тривожних пліток із палацу, ми отримали розрізнені повідомлення про події в Калькутті ще гіршого характеру. Розвідка законного індійського уряду в Лахорі торік інформувала нас про плани калькуттського режиму завдати по них ударів, сподіваючись знову розпалити війну на субконтиненті. Тепер вони повідомляють, що ці плани знову активовані, і Непал став частиною цього рівняння.\n\nАгенти стверджують, що в Калькутті відбулася зустріч із непальськими заколотниками, включаючи лідера «Парішад» Танку Прасада Ачар'ю та соціалістичного лідера Рама Прасада Рая. Нібито обговорювався союз для створення єдиного фронту проти династії Рана та запуск революції як першої доміно для повалення британського впливу на субконтиненті. Це найвищий рівень організації революціонерів з початку їхнього повстання, і ми мусимо діяти жорстко, поки ця пухлина не розрослася ще більше."
 nepal_events.3.a:0 "Тривожно."

 nepal_events.4.t:0 "Змова в Дарджилінгу"
 nepal_events.4.d:0 "Схоже, попередні звіти про безрезультатність зустрічі заколотників були занадто оптимістичними. Новини з прикордонного міста Дарджилінг підтвердили наші найгірші побоювання. Було укладено союз між «Парішад» та соціалістичною Робітничою партією Сватантра, які тепер діють під спільною назвою «Мукті Сена», або Армія визволення. Вони відкрито заявили про намір повалити династію Рана будь-якими засобами.\n\nЦі новини викликали хвилю страху в Катманду; всі лояльні члени династії згуртувалися навколо прем'єр-міністра Джуддхи Рани. Король, за порадою прем'єр-міністра, публічно заявив про свою довіру до уряду, намагаючись вгамувати заколот, хоча навряд чи це матиме ефект з огляду на його очевидну нещирість. З повною підтримкою Калькутти «Армія визволення» не зупиниться ні перед чим, щоб покласти край правлінню Рана, і вони мають бути розчавлені — хіба що така революція є бажаною."
 nepal_events.4.a:0 "Рана мають бути повалені."
 nepal_events.4.b:0 "Королівство стоїть за прем'єр-міністром."

 nepal_events.5.t:0 "Змова в Дарджилінгу"
 nepal_events.5.d.RAJ:0 "З чутками про зростаючий мілітаризм режиму на сході не дивно чути, що Калькутта почала відкрито організовувати повстання проти уряду Непалу, однієї з небагатьох дружніх нам держав у регіоні. Непальський уряд на чолі з прем'єр-міністром Джуддхою Раною суттєво допомагав нам у минулому, і тепер вони звернулися до нас за допомогою в придушенні цього заколоту.\n\nЦі повстанці під назвою «Мукті Сена», або Армія визволення, прагнуть витіснити Рана та відновити владу непальського короля. В кращому випадку це зробить Непал нейтральним, а в гіршому — дасть Республіці нового союзника у війні проти нас. Ми не можемо дозволити такого результату і мусимо допомогти друзям у Катманду, сподіваючись на їхню взаємну допомогу, коли Калькутта неминуче атакує нас."
 nepal_events.5.d.HND:0 "Невдовзі після призначення Хака головою, перспективний молодий чоловік із Непалу на ім'я Танка Прасад Ачар'я організував зустріч з урядовцями, шукаючи підтримки для повалення тиранічного режиму Рана. Попри наше несхвалення будь-яких монархів, було вирішено підтримати цю людину, оскільки династія Рана є непохитним союзником британців. Повалення їхньої влади позбавить Лахор гуркхських загонів, на які вони так покладаються.\n\nНещодавно заступник лідера групи Дашратх Чанд Тхакурі був заарештований, і «Парішад» звернулася до Калькутти за додатковою допомогою. Згідно з угодою, організація Ачар'ї уклала союз із соціалістичними непальськими революціонерами в Республіці під прапором «Мукті Сена».\n\nМи відправили «Мукті Сена» назад до Непалу в надії розпалити революцію проти пробританських Рана, з кінцевою метою встановити дружній режим у Катманду. Ми мусимо забезпечити їхній успіх, аби не отримати фронт на півночі, коли настане час остаточно покінчити з британським правлінням."
 nepal_events.5.a:0 "Ми не можемо дозволити Непалу пасти."
 nepal_events.5.b:0 "Непал має бути визволений від тиранії."

 nepal_events.6.t:0 "Чутки про контрабанду"
 nepal_events.6.d:0 "Попри посилену охорону кордону через напруженість із Республікою, наші люди не можуть бути всюди одночасно. За останні кілька днів надійшли звіти про невелику групу, що перетнула кордон у районі Ґандакі, тягнучи за собою рикшу. Дивно, але свідки стверджують, що це не зброя з Калькутти, а якесь обладнання, найімовірніше — друкарський верстат.\n\nПідтвердження того, що це не гвинтівки, заспокоїло армію, але викликало збентеження щодо мети такої операції. Ввезення друкарського верстата не є незаконним, цензура ще не зайшла так далеко. Головна версія — це злодії, що намагаються перепродати складний об'єкт.\n\nПроте той факт, що вони змогли це зробити, означає, що наступного разу це можуть бути вибухівка або автомати. Охорону кордону необхідно посилити, а вартових на цій ділянці чекає сувора догана."
 nepal_events.6.a:0 "Нам потрібно подвоїти прикордонну варту."

 nepal_events.7.t:0 "Розповсюдження крамольних газет у Катманду"
 nepal_events.7.d:0 "Схоже, загадка контрабанди кількатижневої давнини розкрита, і відповідь нам не подобається. Останніми днями в Катманду на кожному кроці можна знайти примірник газети «Джаната Патріка» з Калькутти, сповнену крамольних і зрадницьких заяв про прем'єр-міністра та його родину. Разом із цим брудом поширюються памфлети «Непал Праджа Парішад», де вони беруть відповідальність на себе та погрожують нації:\n\n«Династія Рана! Знайте, що Народна рада Непалу створена з метою визволення непальського народу з ваших жорстоких пазурів, виховання його в чистому знанні, вшанування його раси та релігії, щоб зробити його однією з цивілізованих націй світу».\n\nХоча ці папірці навряд чи матимуть великий вплив, адже більшість грамотних лише збентежені матеріалом, сам факт того, що ми це проґавили — ганебний. Оскільки за верстатом не стежили, ми не знаємо, де він зараз. Прем'єр-міністр вимагає знайти винних за будь-яку ціну."
 nepal_events.7.a:0 "Спалити ці газети та знайти друкарів."
 nepal_events.7.b:0 "Ця купа нісенітниць не варта навіть відповіді."

 nepal_events.8.t:0 "Генерал Буратхокі зустрічається з королем"
 nepal_events.8.d:0 "Останні події в палаці викликали серйозне занепокоєння серед радників прем'єр-міністра: генерал Ґірі Прасад Буратхокі провів незвично багато приватних зустрічей із королем за останні тижні. Попри важливу роль генерала як одного з небагатьох бойових офіцерів Непалу, його подальше розчарування в них та повернення додому часто змушувало людей думати, чи не має він революційних симпатій.\n\nХоча ніхто, крім короля та самого генерала, не знає змісту розмов, існують сильні підозри, що генерал міг бути скомпрометований повстанцями і тепер намагається втягнути короля у змову.\n\nЯкщо ці чутки правдиві, і повстанці мають підтримку ключових генералів, необхідно вжити всіх заходів, щоб зупинити їхній вплив. Було б неможливо діяти проти генерала лише на основі чуток, не погіршивши ситуацію, але неофіційна заборона на подальші зустрічі видається розумним кроком. Ми мусимо пам'ятати, що це лише здогадки, і закриття доступу може викликати зайве тертя."
 nepal_events.8.a:0 "Ми не повинні гостро реагувати на чутки."
 nepal_events.8.b:0 "Заборонити будь-які подібні зустрічі в майбутньому."

 nepal_events.9.t:0 "Хвиля арештів у Покхарі"
 nepal_events.9.d:0 "Нарешті прем'єр-міністр отримав добрі новини: у місті Покхара відбулася хвиля арештів осіб, які намагалися розповсюджувати памфлети «Парішад». До цього часу повстанці діяли переважно навколо Катманду та на сході, тож це була явна спроба розширити заколот на решту країни. На щастя для нас, група незнайомців у чужому місті, що роздає підозрілі папірці — це саме те, що викликає підозру у місцевих. Бунтівників швидко здали владі та заарештували. Тепер, якщо їм пощастить, вони просто просидять у камері до кінця життя, а якщо ні — доки не звільниться кат."
 nepal_events.9.a:0 "Ще одна партія бунтівників нейтралізована."

 nepal_events.10.t:0 "Розширення армійського резервного фонду"
 nepal_events.10.d:0 "Триваюче повстання тримає уряд у стані крайньої напруги, яку можна назвати параноєю. Якщо раніше будь-який бунт придушувався в зародку, то підтримка Індії зробила цей реальною загрозою. Страх перед тим, наскільки глибоко сягає змова, продовжує зростати.\n\nПриватні розмови короля та генерала Буратхокі посіяли зерно сумніву: будь-яка частина непальської держави може бути скомпрометована, особливо армія. А якщо армія під загрозою, зупинити революцію буде неможливо. Щоб розвіяти ці побоювання, було запропоновано вжити проактивних заходів, аби втримати військо на своєму боці або повернути його лояльність.\n\nКілька років тому був створений Армійський резервний фонд як пенсійна схема для солдатів. Ця система вже чудово вплинула на імідж династії Рана у війську, але пропонується розширити її за рахунок прямих внесків із державної скарбниці до фінальних виплат. Це може стати саме тим кроком, що остаточно закріпить вірність солдатів."
 nepal_events.10.a:0 "Виділити додаткові кошти, це окупиться в довгостроковій перспективі."
 nepal_events.10.b:0 "Ці хабарі не варті таких витрат."

 nepal_events.11.t:0 "Напад у Бірґунджі"
 nepal_events.11.d:0 "Схоже, посилення прикордонної варти було недостатнім, оскільки сьогодні загін «Мукті Сена», що прибув із Республіки, здійснив напад на склад зброї в Бірґунджі. Двоє охоронців намагалися зупинити напад, але були застрелені бандитами. Повстанці захопили запас гвинтівок і втекли неушкодженими. Хоча це були переважно застарілі гвинтівки Ґахендра, зняті з озброєння, вони все одно можуть бути використані в майбутніх нападах на нас. Вся ця ситуація є великою ганьбою для уряду."
 nepal_events.11.a:0 "Знайти цих людей негайно!"

 nepal_events.12.t:0 "Попередження спроби масового самогубства"
 nepal_events.12.d:0 "Попри гучні акції «Мукті Сена», не варто забувати, що вони не єдина загроза. Останніми роками група жінок на чолі з аскеткою Йогмаєю Неупане стала скалкою в оці уряду. Спочатку її вважали стерпною опозицією, що вимагала реформ через апеляцію до індуїзму, але вона стала відкрито ворожою до самої держави.\n\nОстанніми місяцями вона стала сміливішою, погрожуючи вчинити самоспалення, щоб спровокувати повстання. Це не були порожні слова: сьогодні вона з послідовниками намагалася здійснити погрозу, але їх зупинила гвардія прем'єр-міністра за мить до розпалювання багаття. Десятки жінок і близько десяти чоловіків були заарештовані. Чоловіків відправили до в'язниці в Дханкуті, а жінок ув'язнили в храмі Радхакрішни.\n\nДоля чоловіків зрозуміла, а от із жінками складніше. Храм не пристосований для тривалого тримання, а тримати жінок під вартою роками — поганий піар. Пропонується відпустити їх за кілька днів під нагляд. Проте немає гарантій, що вони не вигадають щось нове, тому, можливо, краще тримати їх за ґратами якомога довше."
 nepal_events.12.a:0 "Дати їм кілька років ув'язнення, це поставить їх на місце."
 nepal_events.12.b:0 "Відпустити за кілька днів, вони не становлять реальної загрози."

 nepal_events.13.t:0 "Джая Сінґх критикує прем'єр-міністра"
 nepal_events.13.d:0 "Хоча Непал визнає лише одного великого короля, його величність Трібхувана, багато дрібних королівств, об'єднаних колись під прапором Прітхві Нараяна Шаха, досі існують як васали. Сам прем'єр-міністр титулується магараджею Каскі та Ламджунґа. Проте жодне з цих королівств не було таким проблемним, як Баджханґ та його колишній раджа Джая Прітхві Багадур Сінґх.\n\nСінґх постійно вагався між союзником та ворогом держави, ставши відомим прихильником освітньої реформи, через що був вигнаний у вигнання до Індії. Коли там почалася революція, він почав підтримувати військові зусилля, надаючи медичну допомогу пораненим Республіки. Його гуманістичні погляди зробили його помітною постаттю серед політичних поміркованих Калькутти.\n\nДіючи зараз із самої Калькутті, Сінґх виголосив промову із закликом покласти край правлінню Рана. Ця промова, організована урядовцями Республіки, навряд чи вплине на «Мукті Сена» напряму, але виступ такої видатної особи проти нас — це поганий знак. Якщо новини про промову поширяться, це зашкодить репутації, що потребуватиме цензури. Хоча витрати на неї можуть бути невиправданими з огляду на його малий вплив навіть у самому Баджханґу."
 nepal_events.13.a:0 "Природа скоро сама розбереться з цим зухвалим старим."
 nepal_events.13.b:0 "Цензурувати будь-яке поширення цього наклепу в Непалі."

 nepal_events.14.t:0 "Спроба замаху на Бабера Шумшера"
 nepal_events.14.d:0 "Навіть за постійних нападів на державу, мало хто очікував, що «Мукті Сена» опуститься так низько. Сьогодні, коли герой Великої війни Бабер Шумшер Рана повертався додому, у його двері кинули бомбу. Вона не вибухнула, але один із вбивць вихопив пістолет і двічі поцілив у Бабера. Покинувши генерала помирати, нападники намагалися втекти, але були застрелені солдатами, що прибігли на звуки пострілів.\n\nБабер, хоч і важко поранений, вижив. По всьому Катманду розміщено солдатів для захисту членів династії Рана. Розгніваний цим актом варварства, прем'єр-міністр заявив, що уряд не зупиниться ні перед чим, щоб винищити заколотників, і що жодної пощади не буде."
 nepal_events.14.a:0 "Цього разу вони зайшли занадто далеко."

 nepal_events.15.t:0 "Змовники діють"
 nepal_events.15.d:0 "Схоже, спроба замаху на Бабера була лише першим пострілом революції: агенти Домініону доповідають про повільне зосередження навчених у Калькутті військ уздовж кордону.\n\nПо всьому Непалу ширяться чутки про озброєних людей, що швидко пересуваються під покровом ночі. Армія отримала наказ готуватися до найгіршого."
 nepal_events.15.a:0 "Майбутнє Непалу на кону."

 nepal_events.16.t:0 "Пересування змовників у Непалі"
 nepal_events.16.d.RAJ:0 "Наші агенти в Республіці доповідають про скупчення військ на непальському кордоні, що свідчить про підготовку до ворожих дій. Хоча спочатку виникли побоювання щодо можливого вторгнення до нас, відсутність активності на інших ділянках вказує на те, що Калькутта наразі цілить лише в Непал.\n\nЙмовірно, незабаром ці війська разом зі своїми спільниками в самому Непалі розпочнуть заплановану революцію проти династії Рана. Ми вже попередили Джуддху Рану, і тепер залишається лише чекати на їхній хід."
 nepal_events.16.d.HND:0 "Попри наші застереження, союзники з «Мукті Сена» кілька тижнів тому здійснили невдалий замах на одного з ключових членів династії Рана. Відтоді непальський уряд вдався до максимально жорстких репресій, і «Мукті Сена» усвідомила, що вибору не залишилося — час діяти.\n\nТі, хто діяв із наших територій, почали збиратися у критичних точках біля кордону, тоді як підпільники в самому Непалі займають ключові позиції, готуючись нарешті розпочати революцію проти Рана."
 nepal_events.16.a:0 "Ми маємо допомогти нашим союзникам усім, чим зможемо."

 nepal_events.18.t:0 "Непальська революція"
 nepal_events.18.d:0 "Завдавши ударів по всьому Непалу та швидко захопивши Покхару на заході та Хетауду на півдні, «Мукті Сена» очікувала на криваву війну, проте все закінчилося майже без спротиву, за винятком облоги самої столиці. Після декларації короля про усунення Джуддхи Рани з посади прем'єр-міністра та наказу армії скласти зброю, мало хто наважився кинути виклик повстанцям. Лоялісти Рана відступили до столиці під проводом генерала Екраджа Шумшера Рани, сподіваючись на останній бій.\n\nВійська «Мукті Сена» на чолі з Субарною Шумшером Раною та Кунваром Сінґхом взяли столицю в облогу вже за кілька годин після початку повстання. Бої тривали до кінця дня, але перевага повстанців була очевидною. Урядові війська капітулювали на заході сонця. Наступного ранку короля, який прибув на зустріч із лідерами повстання, вітали гучними вигуками. Починаються обговорення формування першого вільного уряду Непалу."
 nepal_events.18.a:0 "Непал нарешті вільний!"

 nepal_events.19.t:0 "Лояльність до Калькутти"
 nepal_events.19.d:0 "Династію Рана повалено, Джуддха Рана втік із країни, і тепер потрібен новий уряд для відновлення порядку. Король призначив лідера «Парішад» Танку Прасада Ачар'ю новим прем'єр-міністром, доручивши йому створення тимчасового уряду. Однак, діючи за вказівкою з Калькутти, LSP заявили, що не підтримають владу, якщо їм не дадуть очолити соціалістичну державу, лояльну до своїх благодійників.\n\nМи можемо спробувати опиратися їхньому впливу, але було б розважливо поступитися та повністю приєднатися до Калькутти заради захисту від Домініону та подальшої нестабільності."
 nepal_events.19.a:0 "Необхідно встановити демократію та зберегти монархію."
 nepal_events.19.b:0 "Жодних компромісів, ми теж оберемо шлях соціалізму."

 nepal_events.20.t.RAJ:0 "Династію Рана повалено в Непалі"
 nepal_events.20.t.HND:0 "Непальська революція перемогла"
 nepal_events.20.d.RAJ:0 "Сьогоднішні новини можна описати лише як катастрофу. В Непалі відбулася революція, що усунула наших друзів із династії Рана та привела до влади радикалів, орієнтованих на Калькутту. Попри перевагу непальської армії, повстанці захопили владу завдяки особистій підтримці короля, який прагнув скинути пута династії Рана, що тримала його рід у заручниках майже століття.\n\nХоча Джуддха Рана та частина його людей втекли до нас через кордон, ми втратили цінного союзика і можемо отримати ворога, якщо Калькутта встановить у Катманду своїх прихильників."
 nepal_events.20.d.HND:0 "Чудові новини з Непалу: «Мукті Сена» захопила Катманду, сили лоялістів здалися, а армія склала зброю за наказом короля. Єдина прикрість — колишньому прем'єр-міністру вдалося втекти до Домініону, хоча з нашими планами він навряд чи довго ховатиметься від правосуддя.\n\nЩе важливіше те, що непальський король скликав лідерів «Парішад» та наших союзників із Робітничої партії Сватантра (LSP) для обговорення нового уряду. Ми в ідеальній позиції, щоб спрямувати ці дискусії на нашу користь."
 nepal_events.20.a:0 "Будь проклята Калькутта і «Парішад» разом із нею."
 nepal_events.20.b:0 "Непал відчув смак свободи, і скоро її відчує вся Індія!"

 nepal_events.21.t:0 "Майбутнє непальського уряду"
 nepal_events.21.d:0 "Після повалення Рана Непалу потрібен новий уряд. Король планує призначити Танку Прасада Ачар'ю прем'єр-міністром для переходу до демократії. Хоча «Парішад» — наші союзники, їхня відсутність відданості справі міжнародного соціалізму означає, що вони спрямують Непал до нейтралітету та капіталізму.\n\nЗа бажання ми можемо натомість встановити одноосібну владу наших союзників із LSP, повністю підпорядкувавши Непал собі та гарантувавши підтримку проти ворогів в Індії та Азії. Такий уряд буде нестабільним, але з огляду на наш вплив, вибір за нами."
 nepal_events.21.a:0 "Дозволити Непалу самому обирати свою долю."
 nepal_events.21.b:0 "Встановити лояльний уряд у Катманду."

 nepal_events.22.t:0 "Хаос у Катманду"
 nepal_events.22.d:0 "Напередодні повстання Танка Прасад Ачар'я просив короля Трібхувана відкрито підтримати революцію, аби уникнути кровопролиття. Побоюючись слабкості повстанців, король відмовив, сподіваючись на кращий момент. Проте «Мукті Сена» все одно розпочала виступ. Країну охопили бої: міста на кшталт Бірґунджа переходили з рук у руки.\n\nНайбільш руйнівні зіткнення відбулися в Катманду, де сили повстанців зійшлися з військами під командуванням самого Джуддхи Рани. Попри перевагу лоялістів, прем'єр-міністр загинув від випадкового пострілу під час зачистки західних околиць. Війська Рана залишилися без лідера і почали втрачати позиції. Обидві сторони закликають короля втрутитися і врятувати націю..."
 nepal_events.22.a:0 "Король має врятувати нас!"

 nepal_events.23.t:0 "Наказ суверена"
 nepal_events.23.d:0 "Кінець конфлікту настав не через нові смерті, а завдяки виходу монарха на вулиці Катманду в супроводі офіцерів, вірних короні. Субарна Шумшер Рана (від «Парішад»), Кунвар Сінґх (від LSP) та Кайзер Шумшер Рана (від уряду) зустрілися з королем для переговорів.\n\nЗрештою було досягнуто компромісу: формування уряду під проводом самого Трібхувана. Прем'єр-міністром призначено поміркованого Матріку Прасада Коїралу, а лоялісти Рана отримали міністерські крісла задля стабільності. Непал офіційно проголосив нейтралітет в індійському конфлікті, розірвавши зв'язки з обома сусідами. LSP обурилися таким рішенням і залишили зустріч, але оскільки «Мукті Сена» в цілому підтримала угоду, ризик нових боїв мінімальний. Непал повертається до миру."
 nepal_events.23.a:0 "Слава Його Величності!"

 nepal_events.24.t:0 "Королівська реставрація в Непалі"
 nepal_events.24.d.RAJ:0 "Важко сказати, що ми відчуваємо щодо новин із Непалу. Революція переросла в жорстокий конфлікт, у якому наш союзник Джуддха Рана загинув при обороні Катманду. Без лідера уряд погодився на посередництво короля для припинення вогню.\n\nХоча прем'єром став лідер «Парішад», король тримає реальну владу, а лоялісти Рана залишилися в кабінеті. Соціалістів усунуто, що є полегшенням, проте Непал розірвав зв'язки і з нами, і з Республікою. Попри втрату союзника, нейтральний Непал краще, ніж ворожий, тож маємо бути вдячні, що все не закінчилося гірше."
 nepal_events.24.d.HND:0 "Новини з Непалу неоднозначні. Революція призвела до смерті прем'єра Рани, але повстанці були майже вибиті зі столиці. Розуміючи, що затяжна війна їм не під силу, вони погодилися на посередництво короля.\n\nХоча абсолютній владі Рана прийшов кінець, у новому уряді залишилися лоялісти старої династії, а соціалістів повністю виключили. Нова влада проголосила повний нейтралітет щодо Індії. Ми не отримали союзника, але досягли мети — вирвали Непал із рук Домініону. Зрештою, це можна вважати перемогою."
 nepal_events.24.a:0 "Нейтралітет принаймні кращий за ворожість..."

 nepal_events.25.t:0 "Невдалий переворот у Катманду"
 nepal_events.25.d:0 "Сподівання «Мукті Сена» посіяти хаос не справдилися — армія чекала на них. На заході спроби захопити Покхару були розбиті Екраджем Шумшером Раною, а на півдні старший син прем'єра швидко ліквідував загрозу Хетауді. Основні сили повстанців намагалися атакувати Катманду, але були вщент розбиті ще на підступах до міста.\n\nЛідери заколоту втекли до Республіки. Разом із ними, на превеликий подив, втік і король, боячись відплати за таємну підтримку бунтівників. Вчинок монарха розцінили як зречення престолу. Оскільки його родина теж втекла, прем'єр-міністр оголосив регентство до обрання нового короля. Джуддха Рана, тепер у ролі регента, пообіцяв винищити залишки повстання, навіть якщо для цього доведеться перетнути кордон."
 nepal_events.25.a:0 "Непал непохитний перед заколотом!"

 nepal_events.26.t:0 "Поразка революції в Непалі"
 nepal_events.26.d.RAJ:0 "Нарешті добрі новини: спроба перевороту в Непалі провалилася. Урядові війська були готові до атак і перебили сотні бунтівників у Покхарі та Хетауді. Фінальний штурм столиці захлинувся ще до входу в місто.\n\nЛідери заколоту разом із королем Трібхуваном втекли до Калькутти. Джуддха Рана став регентом при вакантному престолі, заприсягся знайти зрадників і підтвердив підтримку Домініону в майбутній війні проти Республіки."
 nepal_events.26.d.HND:0 "Новини з Непалу катастрофічні. Попри нашу підтримку, «Мукті Сена» була розбита ще до того, як повстання розгорілося. Урядові сили відбили всі атаки. Керівництво бунтівників та непальський король втекли до нас, рятуючи власні життя.\n\nТим часом непальський прем'єр став регентом, повністю став на бік Лахора і оголосив про намір напасти на нас, щоб схопити лідерів повстання. Схоже, Непал тепер має стати частиною нашого плану вторгнення..."
 nepal_events.26.a:0 "Цього разу щупальця Калькутти не дісталися жертви."
 nepal_events.26.b:0 "Операція «Грім» — наш єдиний шанс визволити Катманду."

 nepal_events.30.t:0 "Доля прикордоння"
 nepal_events.30.d:0 "Під час індійської революції ми ввели війська в кілька прикордонних штатів, щоб захистити їх для британців від рук повстанців. Ми завжди визнавали ці землі індійськими і планували повернути їх після стабілізації ситуації. Тепер, коли ми в союзі з індійським урядом, готовим перебрати владу, ми маємо вирішити питання територій. Якщо приналежність [814.GetName] та [887.GetName] не викликає сумнівів, то королівство Сіккім завжди вважалося окремим, як ми чи Бутан. Можливо, нам вдасться переконати союзників залишити Сіккім під нашою опікою, повернувши дві інші території."
 nepal_events.30.a:0 "Передати всі спірні території індійцям."
 nepal_events.30.b:0 "Повернути Уттаранчал і Дарджилінг, але просити залишити Сіккім."

 nepal_events.31.t:0 "Непал повертає окуповані території"
 nepal_events.31.d.RAJ:0 "Коли Індія знову під нашою владою, на порядку денному постало питання територій під контролем Непалу. Оскільки непальці завжди вважали ці землі індійськими і лише охороняли їх від заколотників, переконати їх повернути контроль було неважко. Непал передав [814.GetName], [887.GetName] та землі королівства Сіккім."
 nepal_events.31.d.HND:0 "Хоча Непал не був нашим ворогом, його війська допомагали Британії утримувати [814.GetName] та [887.GetName], а також скористалися моментом для захоплення Сіккіму. Тепер, коли їхня вірність британцям у минулому, вони погодилися повернути і індійські території, і сам Сіккім. Наші війська вже висуваються на зміну непальцям."
 nepal_events.31.a:0 "Цього слід було очікувати."

 nepal_events.32.t:0 "Статус Сіккіму"
 nepal_events.32.d.RAJ:0 "Після об'єднання Індії Непал почав повернення територій [814.GetName] та [887.GetName]. Проте виникло питання щодо Сіккіму: хоча він був протекторатом Британії, його вважали окремим від Індії, як Бутан чи сам Непал. Непальці стверджують, що їхній контроль над ним є законним наслідком минулих конфліктів. Аргумент сумнівний, але, можливо, простіше погодитись — зрештою, що ми виграємо від прямого контролю над кількома гірськими селами?"
 nepal_events.32.d.HND:0 "Після падіння британського впливу Непал погодився повернути індійські території, але виникла суперечка щодо Сіккіму. Непальці стверджують, що Сіккім — це суверенне королівство, яке по праву належить їм. Попри очевидні хиби в аргументації, можливо, краще піти назустріч, аби не псувати відносини через кілька гірських поселень?"
 nepal_events.32.a:0 "Вони мають повернути все без винятків."
 nepal_events.32.b:0 "Нехай залишають, він не має для нас великої цінності."

 nepal_events.33.t:0 "[FROM.GetNameDefCap] відмовляє у проханні залишити Сіккім"
 nepal_events.33.d:0 "Попри наше законне і мирне прохання, [FROM.GetNameDef] відмовила нам у праві на Сіккім, забравши його разом з іншими територіями."
 nepal_events.33.a:0 "Нам не залишили навіть крихти..."

 nepal_events.34.t:0 "[FROM.GetNameDefCap] погоджується залишити нам Сіккім"
 nepal_events.34.d:0 "[FROM.GetNameDef] явно незадоволена, але вирішила не сперечатися — вона дозволила нам зберегти контроль над Сіккімом, забравши решту територій."
 nepal_events.34.a:0 "Фантастично!"

 nepal_events.100.t:0 "Непал надає додаткові дивізії гуркхів"
 nepal_events.100.d:0 "Гуркхи, які отримали свою назву від самоназви непальців, з яких вони складаються, довгий час були одними з найелітніших військ британської індійської армії і залишалися такими у складі Домініону. Через хаос в Індії та подальшу революцію в Непалі набір нових гуркхів став дуже складним, оскільки вони були потрібні вдома для захисту своєї нації. Проте тепер, коли з повстанням покінчено, і Непал бажає віддячити за послугу, нам надіслали дві дивізії, повністю укомплектовані бійцями, що воювали проти «Мукті Сена», з обіцянкою якнайшвидше повернути обсяги набору до нормального рівня. Ми, звісно, подякували їм за це і сподіваємося, що гуркхи завжди залишатимуться важливою частиною збройних сил."
 nepal_events.100.a:0 "«Краще померти, ніж бути боягузом»."

 nepal_events.101.t:0 "Непал просить більше свободи"
 nepal_events.101.d:0 "Після нашого втручання в непальську революцію країна опинилася під нашим щільним контролем, а індійські війська були постійно дислоковані в Катманду для підтримки порядку та захисту від суперників. Тепер, коли ми є єдиним індійським урядом, а ситуація в Непалі стабілізувалася, непальська влада звернулася з проханням вивести наші війська і дозволити їм знову стати повністю незалежною нацією. Вони, звісно, залишаться нашими непохитними союзниками, але знову матимуть свободу діяти на власний розсуд."
 nepal_events.101.a:0 "Продовжимо як партнери."
 nepal_events.101.b:0 "Ми не можемо ризикувати тим, що може статися без нашого нагляду."

 nepal_events.102.t:0 "Індія погоджується на наше прохання"
 nepal_events.102.d:0 "Ми отримали чудові новини від [FROM.GetNameDef]: вони погодилися вивести війська з нашої країни і дозволили нам повернутися до статусу повністю автономної нації. Сподіваємося, це стане початком плідного і тривалого партнерства між Непалом та Індією."
 nepal_events.102.a:0 "Фантастично!"

 nepal_events.103.t:0 "Індія відхиляє наше прохання"
 nepal_events.103.d:0 "Ми отримали жахливі новини від [FROM.GetNameDef]: вони відмовилися виводити війська, посилаючись на занепокоєння щодо нестабільності в Непалі та ризик того, що без їхнього прямого втручання ворожі сили можуть захопити владу. Схоже, у нас немає іншого вибору..."
 nepal_events.103.a:0 "Як вони сміють?"

 nepal_events.200.t:0 "Коронація короля Самрадж'ї"
 nepal_events.200.d:0 "Зречення короля Трібхувана та самовільне вигнання його родини поставили прем'єр-міністра в скрутне становище: монарх був необхідний для стабільності королівства, але валідних кандидатур на заміну не було. Після довгих роздумів було зроблено суперечливий вибір — новим королем обрали племінника Трібхувана, Самрадж'ю Шумшера Рану. Попри близьку спорідненість із колишнім сувереном, юнак є членом династії Рана — сином Кайзера Рани та сестри Трібхувана. Вважаючи, що кращого варіанту немає, Джуддха Рана затвердив цей вибір кілька днів тому.\n\nСклавши присягу на вірність королівству, новий король Самрадж'я Шумшер Джанг Багадур Рана, титулований як Й.К.В. Шрі Панч Бада Магараджадхіраджа «Самрадж'я», був офіційно коронований сьогодні вранці. Церемонія була скромною, оскільки в умовах недавнього конфлікту зайва пишність вважалася недоречною. Новий король не має ілюзій щодо свого місця і підтвердив повноваження прем'єр-міністра, задовольнившись роллю номінального глави держави."
 nepal_events.200.a:0 "Сподіваємося, цей король буде значно терпимішим."

 nepal_events.300.t:0 "Стримана реакція індійців"
 nepal_events.300.d:0 "Хоча декларація короля про повний нейтралітет у індійських справах була життєво важливою для мирного процесу, вона була неабияким ризиком. Велика зацікавленість Домініону та Республіки у впливі на нашу політику залишала реальну можливість того, що одна зі сторін не прийме такий результат і просто введе війська для встановлення лояльного режиму.\n\nПроте наразі здається, що ставка спрацювала. Хоча обидва індійські уряди обурені, вони, схоже, готові прийняти новий статус-кво, вважаючи прийнятним те, що Непал принаймні не дістався їхнім ворогам. Без прямої загрози вторгнення новий уряд має чудову нагоду зосередитися на подоланні внутрішнього розколу."
 nepal_events.300.a:0 "Ми всі можемо зітхнути з полегшенням."

 nepal_events.301.t:0 "LSP протестує проти мирної угоди"
 nepal_events.301.d:0 "Хоча після мирної угоди LSP одразу визначили як потенційну загрозу, припинення підтримки «Мукті Сена» з боку Калькутти дало надію, що вони просто зникнуть. Соціалісти, вочевидь, не почули про байдужість Республіки: сьогодні в [NEP.Capital.GetCapitalVictoryPointName] відбувся протест за участю понад 200 членів партії під проводом Рама Прасада Рая та Кунвара Індерджита Сінґха.\n\nСінґх виступив із палкою промовою, вимагаючи негайного включення LSP до уряду та арешту Кірана і Могана Рана за смерть цивільних під час повстання. Він завершив виступ погрозою нової збройної революції. Прем'єр-міністр Коїрала наказав розігнати протест; Рай опинився за ґратами, проте Сінґху вдалося втекти — солдати помилково заарештували іншу людину, схожу на нього. Місцеперебування Сінґха невідоме, але арешт інших членів партії має вгамувати заворушення."
 nepal_events.301.a:0 "Вистежити Сінґха, ми не можемо допустити нового заколоту."

 nepal_events.302.t:0 "Напад на війська під Хетаудою"
 nepal_events.302.d:0 "Відтоді як Кунвар Сінґх втік після протесту в Катманду, він не лише уникав полону, а й жодного разу не потрапив на очі розшуковим загонам. Уряд сподівався, що він загинув у дикій місцевості, проте нещодавній напад на війська біля Хетауди має всі ознаки діяльності Сінґха та його прибічників. На невеликий аванпост зненацька напала група озброєних мародерів.\n\nПісля короткої сутички, в якій загинули двоє солдатів, загарбники ненадовго захопили пост, але підкріплення відбило його. Серед загиблих заколотників виявили людей у формі індійської республіканської армії, подібній до тієї, що постачалася «Мукті Сена». Це не є остаточним доказом причетності Сінґха, але це явне свідчення того, що дисиденти з LSP готують повстання."
 nepal_events.302.a:0 "Надіслати більше військ на пошуки Сінґха."
 nepal_events.302.b:0 "Вони явно планують щось масштабніше, тримайте армію в стані готовності."

 nepal_events.303.t:0 "Повстання Ракша Дал"
 nepal_events.303.d.body:0 "Після революції проти Рана солдати «Мукті Сена», які не перейшли до регулярної армії, були реорганізовані в «Ракша Дал» (Сили захисту) для підтримки порядку. Попри усунення від влади, багато колишніх членів LSP потрапили до цих лав, що виявилося помилкою. Прихильники Сінґха та Рая підняли повстання в [NEP.Capital.GetCapitalVictoryPointName], звільнивши Рая та інших протестувальників із в'язниці.\n\n"
 nepal_events.303.d.hunthnd:0 "$nepal_events.303.d.body$Звільнені в'язні захопили палац Сінґха Дурбар, де засідав національний уряд. Сінґх та Рай проголосили республіку, лояльну до Калькутти, сподіваючись на індійське втручання. На їхнє здивування, після дня облоги урядовими військами та лояльними частинами «Ракша Дал», вони не отримали від Республіки навіть відповіді, не кажучи вже про підкріплення. Армія пішла на штурм і швидко розбила заколотників. Сінґху та Раю знову вдалося втекти, але без підтримки Індії вони навряд чи становитимуть серйозну загрозу."
 nepal_events.303.d.huntnohnd:0 "$nepal_events.303.d.body$Звільнені в'язні захопили палац Сінґха Дурбар. Сінґх та Рай проголосили республіку, але оскільки калькуттський режим уже пав, їхня спроба була приречена. Після дня облоги, не бачачи шансів на успіх, бунтівники почали переговори. Проте урядові війська за наказом короля пішли на штурм. Палац було відбито за кілька годин. Сінґху та Раю вдалося втекти, але навряд чи вони зможуть продовжити боротьбу."
 nepal_events.303.d.reinforce:0 "$nepal_events.303.d.body$Звільнені в'язні спробували захопити палац Сінґха Дурбар. Завдяки тому, що після атак у Хетауді до столиці перекинули достатньо військ, повстання закінчилося, майже не почавшись. Палац встояв, а бунтівники були швидко розбиті. Сінґху та Раю знову вдалося втекти, проте загрози вони більше не становлять."
 nepal_events.303.a:0 "Сподіваємося, ми бачимо їх востаннє."

 nepal_events.304.t:0 "Трття всередині «Парішад»"
 nepal_events.304.d:0 "Хоча члени «Парішад» не налаштовані так радикально, як LSP, було б перебільшенням сказати, що всі вони задоволені мирною угодою. Суперечки щодо участі династії Рана в уряді, ролі палацу в політиці та особисті чвари з новим прем'єром почали розколювати колись єдину партію. Найвідданіші прихильники Ачар'ї першими висловили невдоволення тим, що його кандидатуру обійшли на користь Коїрали. Поки що ці дебати точаться за зачиненими дверима, але вони віщують нові неприємності."
 nepal_events.304.a:0 "Зараз не час для міжусобиць."

 nepal_events.305.t:0 "Братські чвари"
 nepal_events.305.d:0 "Прем'єр-міністр завжди вважав свого молодшого брата Бішвешвара Прасада Коїралу найближчим союзником. Проте останнім часом їхні стосунки охололи: Б. П. почав розчаровуватися в ролі короля в управлінні державою. Поширюються теорії, що незадоволені правлінням М. П. Коїрали (особливо через створення верхньої палати, яку призначає виключно монарх) намагаються замінити прем'єра, обіцяючи посаду його братові. Офіційно «Парішад» заперечує будь-який розкол, сподіваючись перечекати бурю..."
 nepal_events.305.a:0 "Хіба невеликі суперечки між братами не є нормою?"

 nepal_events.306.t:0 "Виключення М. П. Коїрали"
 nepal_events.306.d:0 "Розкол у «Парішад» не вдалося загладити. Члени партії на чолі з Ачар'єю та Б. П. Коїралою виключили прем'єр-міністра М. П. Коїралу з лав організації, звинувативши його у зраді ідеалів революції через співпрацю з Рана та небажання повністю демократизувати Непал. Більшість партії підтримала це рішення, але частина союзників залишилася з прем'єром. Моган та Кайзер Рана також висловили йому підтримку. Поки що ні король, ні Коїрала не дають знаків про відставку, тож майбутнє уряду залишається невизначеним."
 nepal_events.306.a:0 "Міжусобиці та революціонери — неминуче поєднання."

 nepal_events.307.t:0 "Розпад «Парішад»"
 nepal_events.307.d:0 "Прем'єр-міністр та його прихильники остаточно порвали з «Парішад» і створили нову партію — «Растрія Праджа» (Національна народна партія). До неї увійшли консервативні члени колишньої організації, які виступають за сильну роль короля та стабільність. Керівництво старої «Парішад» вимагає від Трібхувана відправити Коїралу у відставку, погрожуючи припинити підтримку уряду. Король поки що мовчить, вичікуючи, чи зможе М. П. втриматися при владі."
 nepal_events.307.a:0 "Можливо, настав час переглянути позицію Коїрали."

 nepal_events.308.t:0 "М. П. Коїрала подає у відставку"
 nepal_events.308.d:0 "Попри підтримку нової партії, прем'єр-міністру та королю стало ясно, що Коїрала не може залишатися на посаді. Бажаючи стабільності, М. П. Коїрала подав у відставку. Король знову звернувся до «Парішад», де очевидним кандидатом є Ачар'я, але Рана навідріз відмовляються працювати з цим «радикалом».\n\nОскільки сторони не йдуть на компроміс, оточення Трібхувана запропонувало йому взяти владу в свої руки через надзвичайні повноваження. Планується створити дорадчу раду з членів династії Шах. Рана, ймовірно, погодяться на це заради порядку, але прихильники Ачар'ї будуть обурені. Король стоїть перед важким вибором."
 nepal_events.308.a:0 "Призначити Ачар'ю наступником Коїрали."
 nepal_events.308.b:0 "Король повинен правити одноосібно."

 nepal_events.400.t:0 "Реорганізація прихильників Рана"
 nepal_events.400.d:0 "Хоча багато представників роду Рана втекли з Непалу, коли країну охопила революція, чимало з них вирішили залишитися. Не бажаючи спричиняти подальші чвари, їх досі залишали в спокої, мало очікуючи, що вони становитимуть загрозу після повного усунення від влади. Проте, схоже, їх рано списувати з рахунків: члени династії, що залишилися в Непалі, згуртувалися навколо нової організації на чолі з Моганом Шумшером Раною.\n\nОб'єднавшись із малою ґоркхською націоналістичною групою «Кхукурі Дал», Моган сформував нову політичну партію під назвою «Вір Ґоркха Дал», явно сподіваючись взяти участь у майбутніх виборах і відновити правління своєї династії. Хоча офіційно вони не закликають до прямої реставрації старої системи і ще не вчиняли протиправних дій, багато членів «Кхукурі Дал» мають воєнізований характер. Новий уряд побоюється, що Рана готують власний насильницький переворот. Поки вони не почнуть діяти, уряду залишається лише пильно стежити за ними."
 nepal_events.400.a:0 "Забезпечити постійний нагляд за їхньою діяльністю."

 nepal_events.401.t:0 "Початок розколу"
 nepal_events.401.d:0 "Хоча колись вони були єдині в бажанні звільнити Непал від Рана, питання про те, що робити після революції, завжди вносить розкол у лави переможців. Ще до повстання в «Парішад» часто сперечалися про методи боротьби, і хоча позиція прихильників насильницької революції перемогла, значна фракція залишилася при думці, що Рана слід було усунути шляхом мирних протестів. Ця група, очолювана братами Коїрала — Матрікою та Бішвешваром, тепер почала ще сильніше віддалятися від головного крила партії, що підтримує прем'єр-міністра.\n\nПоки крило Ачар'ї просуває ідею повної конституційної монархії та індустріалізації за зразком калькуттського уряду, фракція Коїрали зайняла тверду опозиційну позицію. Бажаючи натомість капіталістичної системи та стверджуючи, що без керівної руки короля нація ризикує знову впасти в тиранію, вони почали таємно протидіяти багатьом пропозиціям прем'єр-міністра. Хоча ці чвари поки не розривають «Парішад», вони оголюють лінії розлому, які можуть тріснути пізніше."
 nepal_events.401.a:0 "Дріб'язкові чвари навряд чи об'єднають націю."

 nepal_events.402.t:0 "Розпад LSP"
 nepal_events.402.d:0 "Хоча вони відіграли значну роль у революції, соціалісти з Робітничої партії Сватантра (LSP) майже повністю опинилися за бортом нової політичної системи Непалу. Оскільки Калькутта твердо підтримує «Парішад», LSP втратила майже всю іноземну підтримку, а через свої суперечливі ідеї, як-от республіканізм, вони не змогли легально зареєструватися як партія. Радикали обговорювали можливість нової революції, але брак ресурсів зробив це неможливим.\n\nЗрештою від LSP відкололася нова сила — «Сам'юкта Сватантра», або Об'єднана партія незалежності. Вона відкинула найбільш одіозні пункти програми, відмовившись від республіканізму на користь конституційної монархії. Хоча стара LSP назвала їх розкольниками, новій партії вдалося залучити чимало членів, а також деяких радикалів із «Парішад». Ця партія навряд чи скоро прийде до влади, але вона явно представляє майбутнє лівих сил у новому Непалі."
 nepal_events.402.a:0 "Краще розколоті, ніж небезпечні."

 nepal_events.500.t:0 "Проблема монархії"
 nepal_events.500.d:0 "Попри бажання більшої частини нашого керівництва, а особливо союзників у Калькутті, скасувати монархію, уряд сильно залежить від підтримки переконаних монархістів. Навіть якщо ми правимо без їхньої участі, кількість справжніх соціалістів-республіканців у Непалі ледь вистачить, щоб заповнити кімнату, тоді як прихильники короля значно переважають нас чисельно. Відмова від монархії може дестабілізувати режим, хоча за підтримки Калькутти ми, ймовірно, втримаємося.\n\nЯк спробу компромісу було висунуто пропозицію надати Трібхувану титул «Глави держави» (Радж'я Прамукха) — суто церемоніальний статус, що визнає його походження, але зберігає реальну владу за урядом. Це може вгамувати поміркованих монархістів. Проте в уряді небагато хто задоволений цим рішенням, вважаючи, що присутність монарха в будь-якій якості ослабить державу в довгостроковій перспективі, і пропонують покінчити з цим негайно."
 nepal_events.500.a:0 "Дозволити церемоніальну роль для колишнього короля."
 nepal_events.500.b:0 "Його ще не вигнали з країни, і це єдиний привілей, який він матиме."

 nepal_events.1000.t:0 "Вибір шляху ШІ"
 nepal_events.1000.d:0 "Це те, як штучний інтелект обирає шлях у мінігрі «Змова». На це впливають налаштування правил гри. Перші три варіанти не застосовуються, якщо серед учасників є гравець."
 nepal_events.1000.a:0 "Орієнтація на HND"
 nepal_events.1000.b:0 "Нейтралітет"
 nepal_events.1000.c:0 "Орієнтація на RAJ"
 nepal_events.1000.e:0 "Орієнтація на HND (за участю гравця)"
 nepal_events.1000.f:0 "Орієнтація на RAJ (за участю гравця)"

 nepal_events.1001.rana_title:0 "Невдала революція в Непалі"
 nepal_events.1001.royal_title:0 "Королівська реставрація в Непалі"
 nepal_events.1001.revolution_title:0 "Революція проти Рана в Непалі"
 nepal_events.1001.rana_desc:0 "Протягом останнього року в гімалайському королівстві Непал тривало повстання, нібито підтримуване сусідньою [HND.GetName] з метою усунення прем'єр-міністра Джуддхи Рани. Сьогоднішні новини зі столиці [NEP.Capital.GetCapitalVictoryPointName] підтвердили спробу загальнонаціонального виступу: революціонери ненадовго захопили частину територій, але були розбиті урядовими військами.\n\nВатажки заколоту втекли до Республіки разом із королем Непалу, який їх підтримував. Оголошено регентство, а прем'єр-міністр заявив про намір приєднатися до Бомбейського пакту проти Калькутти."
 nepal_events.1001.royal_desc:0 "Протягом останнього року в Непалі тривало повстання проти прем'єр-міністра Джуддхи Рани. Сьогоднішні новини малюють похмуру картину: після вбивства прем'єра країну охопив кривавий конфлікт між урядом і повстанцями, який вдалося зупинити лише завдяки припиненню вогню, узгодженому королем.\n\nУ межах перемир'я король оголосив про створення уряду, до якого увійдуть як противники Рана, так і ключові члени старої династії. Попри індійське втручання, король проголосив повний нейтралітет щодо сусідів, сподіваючись зосередитися на внутрішніх проблемах."
 nepal_events.1001.revolution_desc:0 "Повстання в гімалайському королівстві Непал, що тривало останній рік, нарешті переросло у повноцінну революцію. Тепер країна повністю контролюється повстанцями після серії успішних виступів по всій державі.\n\nКолишній прем'єр-міністр втік до Лахора, а представники альянсу «Мукті Сена» проводять зустрічі з королем у столиці [NEP.Capital.GetCapitalVictoryPointName] для обговорення формування тимчасового уряду. Час покаже, чим закінчаться ці переговори, адже [HND.GetNameDef] вже почала тиснути задля встановлення соціалістичного ладу."
 nepal_events.1001.rana_option:0 "Залізне правління династії Рана триває."
 nepal_events.1001.royal_option:0 "Чи зможе такий компроміс бути довговічним?"
 nepal_events.1001.revolution_option:0 "90 років влади Рана скінчилися за кілька днів."

 nepal_war_events.9.t:0 "Запропонувати мир [438.owner.GetNameDef]?"
 nepal_war_events.9.d:0 "Ми не лише зупинили індійські спроби захопити [323.GetCapitalVictoryPointName], а й взяли під контроль кілька великих індійських міст. Тепер, коли їхні армії розбиті, було б доцільно запропонувати індійцям мир, вимагаючи офіційного визнання нашого контролю над прикордонням та припинення ворожнечі."
 nepal_war_events.9.a:0 "Надіслати їм наші вимоги."
 nepal_war_events.9.b:0 "Ми битимемося до їхньої повної капітуляції!"

 nepal_war_events.10.t:0 "Непал вимагає миру"
 nepal_war_events.10.d.indian:0 "Те, що здавалося простою операцією з підкорення слабкого сусіда, швидко перетворилося на катастрофу. Наші війська не лише не змогли взяти [323.GetCapitalVictoryPointName], а й були відкинуті непальцями, які захопили кілька наших великих міст. Тепер вони вимагають негайного виведення військ та офіційного визнання їхньої влади над спірними прикордонними регіонами."
 nepal_war_events.10.d.factionleader:0 "Вторгнення до Непалу обернулося лихом. Наші союзники в Індії не змогли взяти [323.GetCapitalVictoryPointName], а непальські війська перейшли в контрнаступ, захопивши стратегічні індійські міста. Представники Непалу звернулися до нас із вимогою забезпечити мир на індійському фронті на їхніх умовах, включаючи повне визнання їхнього контролю над прикордонням."
 nepal_war_events.10.a:0 "Так, давайте покінчимо з цим зараз."
 nepal_war_events.10.b:0 "Просто зафіксуємо збитки і накажемо індійцям здатися."
 nepal_war_events.10.c:0 "Ми відмовляємося здаватися, продовжуйте наступ!"

 nepal_war_events.11.t:0 "[From.GetNameDefCap] просить миру з Непалом"
 nepal_war_events.11.d:0 "Наше вторгнення до Непалу закінчилося повним провалом, що розлютило [FROM.GetNameDef]. Бажаючи мінімізувати втрати, вони нав'язали нам мир із Непалом, який вимагає від нас офіційної передачі прикордонних регіонів та негайного виведення всіх військ."
 nepal_war_events.11.a:0 "Неймовірно!"

 nepal_war_events.20.t:0 "Патова ситуація у війні з Непалом"
 nepal_war_events.20.d:0 "Спроба вторгнення до Непалу пішла не за планом: короткий похід перетворився на виснажливу позиційну війну. На цьому етапі варто просто припинити марні втрати і запропонувати їм мир на основі існуючої лінії фронту."
 nepal_war_events.20.a:0 "Так, завершимо це негайно."
 nepal_war_events.20.b:0 "Попросимо [ROOT.FactionLeader.GetNameDef] виступити посередником у переговорах."
 nepal_war_events.20.c:0 "Ні! Ми підкоримо [323.GetCapitalVictoryPointName] або помремо!"

 nepal_war_events.21.t:0 "Індія просить нас стати посередником у мирі з Непалом"
 nepal_war_events.21.d:0 "Вторгнення наших індійських союзників до Непалу зайшло у глухий кут. Замість швидкої перемоги війна перетворилася на затяжний конфлікт. [FROM.GetNameDefCap] просить нас втрутитися і забезпечити мир, за якого обидві сторони визнають існуючу лінію фронту як новий кордон і відведуть війська."
 nepal_war_events.21.a:0 "Тоді закінчимо це зараз."
 nepal_war_events.21.b:0 "Війна не скінчиться, доки [323.GetCapitalVictoryPointName] не підкориться!"

 nepal_war_events.22.t:0 "Мир із [From.GetNameDef]?"
 nepal_war_events.22.d:0 "Хоча ми зазнали значних втрат у боротьбі проти [FROM.GetNameDef], стало ясно, що у них немає реальних шансів підкорити нас. Оскільки війна зайшла у безвихідь, їхні представники прибули до [323.GetCapitalVictoryPointName] для переговорів про мир. Пропонується припинити бойові дії та визнати існуючу лінію фронту кордоном на найближче майбутнє."
 nepal_war_events.22.a:0 "Так, давайте укладемо мир."
 nepal_war_events.22.b:0 "Категорично ні!"

