 USA_arms_shipments_to_the_philippines_desc: "$GEA_arms_shipments_to_the_philippines_desc$"

 PHI_shoring_up_our_own_defences: "Зміцнити власну оборону"
 PHI_shoring_up_our_own_defences_desc: "Швидше за все, наша країна опиниться під облогою так чи інакше. Ми не можемо очікувати, що хижаки залишать нас у спокої, якщо ми беззахисні, тому мусимо підняти рівень оборони проти загрози вторгнення."
 PHI_playing_off_our_competitors: "Грати на суперництві"
 PHI_playing_off_our_competitors_desc: "Ділки з Токіо, Сінгапуру та інших місць прибули до Маніли, приєднавшись до американських залишків, щоб купити вплив у складній філіппінській політичній системі. Але ми добре знаємо свою гру, і, використовуючи їхні суперечливі інтереси, ми вийдемо переможцями."
 PHI_peace_in_the_pacific: "Мир у Тихому океані"
 PHI_peace_in_the_pacific_desc: "Континент стоїть на порозі війни, і наша відстань від материка мало нас захистить. Хоча іноземні голоси наполягають, щоб ми обрали їхній бік, ми не повинні забувати про власні інтереси. Наш народ не має бажання брати участь у їхньому конфлікті, і чим швидше ми нагадаємо про це, тим краще."
 PHI_crackdown_on_foreign_agitators: "Придушити іноземних агітаторів"
 PHI_crackdown_on_foreign_agitators_desc: "Іноземні агенти прибули з-за кордону, щоб зруйнувати наші давні політичні традиції й пожертвувати нашим народом заради своїх інтересів. Ми повинні вигнати цих чужинців і усунути тих, хто прийняв їхні хабарі."
 PHI_negotiate_with_the_americans: "Переговори з американцями"
 PHI_negotiate_with_the_americans_desc: "Хоча уряд США зазнав значних потрясінь, у Філіппінах залишилися американські осередки, які прагнуть зберегти свій політичний, економічний і військовий вплив, здобутий за десятиліття окупації. Хоча для багатьох націоналістів це неприємно, співпраця з ними може бути необхідною, щоб уникнути втягнення у смертельні ігри сусідів."
 PHI_negotiate_with_the_Germans: "Переговори з німцями"
 PHI_negotiate_with_the_Germans_desc: "Німецький вплив у Тихому океані існує з XIX століття, але різко зріс після їхньої перемоги у Вельткрігу та захоплення британських і французьких колоній у Південно-Східній Азії. Оскільки американці більше не можуть посередничати між ними та мстивими японцями, вони можуть стати нашим останнім шансом у протидії японському вторгненню."
 PHI_negotiate_with_the_Japanese: "Переговори з японцями"
 PHI_negotiate_with_the_Japanese_desc: "Японія — зростаюча сила в Тихому океані, яка перемогла німців у боях під час Вельткрігу, хоча й втратила здобутки у мирі. Вони не забули цієї образи й тепер не погодяться на менше. Вони приходять під гаслом паназіатизму, і хоча їхні справжні наміри невідомі, можливо, настав час приєднатися до них."
 PHI_the_geopolitical_ballgame: "Геополітична гра"
 PHI_the_geopolitical_ballgame_desc: "З огляду на постійні зміни в Тихому океані, ми повинні бути гнучкими, щоб вижити. Допомога слабшій стороні для власної вигоди й регулярна зміна партнерів підтримує гру конкурентною та залишає нам простір для маневру."

 PHI_join_faction: "Союз із [FROM.GetNameDef]"
 PHI_join_faction_desc: "Попри всі наші зусилля (а можливо, й завдяки їм), ситуація в Тихому океані змінилася настільки, що наш мирний народ мусить нарешті обрати сторону. Хоча існує значна неохота, зрештою ми повинні ухвалити це складне рішення, щоб захиститися від зовнішніх загроз."

 PHI_enforce_our_claims_on_north_borneo_decision: "Домагатися наших претензій на Північний Борнео"
 PHI_enforce_our_claims_on_north_borneo_decision_desc: "Султанат Сулу отримав північно-східну частину острова Борнео у 1704 році як винагороду за допомогу султану Брунею. У 1878 році султанат Сулу підписав угоду з британцями щодо прав на північно-східну частину острова. Британці стверджують, що це була передача території, але неоднозначність договору (написаного малайською) змусила багатьох на Філіппінах вважати, що йшлося про оренду. Як правонаступники султанату Сулу, Філіппіни наполягають, що ця територія належить їм.\n\nХоча ми можемо наводити різні юридичні аргументи, судові справи та мовні дебати не принесуть міжнародного визнання наших претензій. Лише присутність наших військ на місці та демонстрація нашого панування над регіоном дозволять здобути належний авторитет."

 PHI_appease_the_masses_decision: "Заспокоїти маси"
 PHI_appease_the_masses_decision_desc: "Час для нових Філіппін настав! Гарячими словами й гучними обіцянками ми можемо запалити натовпи, щоб вони вимагали більшого, ніж мають зараз!"

 PHI_suppress_the_rabblerousers: "Придушити незадоволених"
 PHI_suppress_the_rabblerousers_desc: "Швидкі зміни у світовому порядку дозволили різним баламутам вийти з тіні. Хоча це суворо, придушення їхньої діяльності необхідне для прогресу, навіть якщо у довгостроковій перспективі це викличе відгук."

 PHI_embrace_the_spirit_of_change_decision: "Прийняти дух змін"
 PHI_embrace_the_spirit_of_change_decision_desc: "Хода прогресу невпинна. Хоча багато реакціонерів стоять на нашому шляху, правдою є те, що повернення назад немає. Ми поведемо Філіппіни вперед, навіть якщо доведеться потрясти основи нашого суспільства."

 PHI_appeal_to_the_elites_decision: "Звернутися до еліт"
 PHI_appeal_to_the_elites_decision_desc: "Як і в будь-якому суспільстві, щоб досягти чогось доброго, лідери повинні орієнтуватися у складній мережі впливових осіб і зацікавлених сторін, переконуючи їх підтримати поступові, необхідні зміни, що принесуть користь усім."

 PHI_confront_the_caciques_decision: "Протистояти касикам"
 PHI_confront_the_caciques_decision_desc: "Наслідки Чорного понеділка та занепад післявоєнного політичного порядку продовжують відлунювати на Філіппінах. Багато укорінених інтересів не хочуть прийняти цей факт. Ми повинні виступити проти них, попри небезпеку, інакше вся наша нація буде стримана, доки вони не схаменуться."

 PHI_champion_the_traditional_order_decision: "Захищати традиційний порядок"
 PHI_champion_the_traditional_order_decision_desc: "Хоча часи швидко змінюються, основні інститути Філіппін залишаються незмінними. Це може бути непопулярно, але речі є такими, якими вони є з певної причини, і ми не дозволимо людям бути введеними в оману владолюбними баламутами."

 PHI_enforce_the_presidential_vision_decision: "Втілити президентське бачення"
 PHI_enforce_the_presidential_vision_decision_desc: "Президент має мрію про процвітаюче майбутнє Філіппін, і ми повинні зробити її реальністю. Попри нарікання еліт і владолюбних популістів, наш народ зрештою оцінить наше бачення."

 PHI_land_reform_decision: "Земельна реформа в [FROM.GetName]"
 PHI_land_reform_decision_desc: "Боротьба за філіппінське село ще не завершена. Потрібні постійні зусилля для модернізації та вирівнювання умов у сільській місцевості — зусилля, які ми можемо лише сподіватися, що принесуть плоди у довгостроковій перспективі."

