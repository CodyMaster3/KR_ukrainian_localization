#### - Political Tree - ####
 ###  Quezon Tree ###
 PHI_continue_philippinisation: "Продовження філіппінізації"
 PHI_continue_philippinisation_desc: "Окрім незалежності, головною метою націоналістів із самого початку була заміна американців на державних посадах на філіппінців. Закон Джонса 1916 року надав місцевому законодавчому органу повноваження передати більшу частину державної служби в руки філіппінців, але відтоді американський контингент затримався. З наростанням проблем у Сполучених Штатах настав час завершити філіппінізацію раз і назавжди."

 PHI_national_council_for_education: "Національна рада з питань освіти"
 PHI_national_council_for_education_desc: "Хоча система освіти, запроваджена американцями, не позбавлена багатьох недоліків, вона, безсумнівно, була одним із найбільш позитивних результатів їхньої адміністрації. Але з 1902 року час змінився, як і освітні потреби нашого народу. Настав час скликати «Національну раду з питань освіти», до якої увійде призначений експерт для консультування Президента та Департаменту народної освіти щодо необхідних освітніх реформ."

 PHI_eight_hour_labour_law: "Ухвалення Закону про восьмигодинний робочий день"
 PHI_eight_hour_labour_law_desc: "Протягом десятиліть за кампанію за восьмигодинний робочий день боролися робітничі рухи по всьому світу. Це не якийсь криптосиндикалістський рух; більшість передових країн прийняли восьмигодинний робочий день. Настав час Філіппінам приєднатися до лав цих цивілізованих націй і довести філіппінським робітникам, що «Націоналістична партія» є їхнім другом і захисником."

 PHI_social_justice_campaign: "Кампанія за соціальну справедливість"
 PHI_social_justice_campaign_desc: "Що таке «соціальна справедливість»? Це доктрина, виведена з папських енциклік? Це інновація прогресивної правової філософії? Пересічному філіппінцю не потрібно турбуватися такими високими питаннями. Все, що він повинен знати, це: Президент Кесон є захисником загального добробуту, другом бідних і пригноблених і невтомно працює, щоб підняти маси до вищої форми життя."

 PHI_government_survey_board: "Урядова інспекційна рада"
 PHI_government_survey_board_desc: "Керований, як пекло, філіппінцями уряд може бути кращим за керований, як рай, американцями, але, варто визнати, було б добре, якби філіппінський уряд також міг керуватися, як рай. Наші установи, ймовірно, мають деякі недоліки та надмірності, і для їх усунення нам потрібно мати краще уявлення про уряд загалом."

 PHI_optional_religious_instruction: "Факультативне релігійне навчання"
 PHI_optional_religious_instruction_desc: "Філіппіни — переважно католицька країна. Водночас Філіппінська революція була значною мірою повстанням проти іспанських ченців, а Філіппінська конституція встановила відокремлення церкви від держави. Деякі з наших найбільш побожних громадян вимагають релігійного навчання у школах. Тут ми можемо знайти золоту середину: релігійні заняття будуть факультативними і не заважатимуть решті навчального дня."

 PHI_patronise_the_deutsche_klub: "Сприяння Німецькому клубу"
 PHI_patronise_the_deutsche_klub_desc: "Німецька громада в Манілі існує давно. Хоча раніше вона була невеликою, її розмір збільшився разом із присутністю Німеччини на Далекому Сході. Хоча офіційні справи з «Кайзеррайхом» ведуться через «Імперське німецьке консульство», центр німецької громади знаходиться у шикарному «Німецькому клубі» (Deutscher Klub), де можна знайти бізнесменів, пов'язаних із Сінгапуром та Ханоєм. Настав час відвідати клуб."

 PHI_friends_not_forgotten: "Незабуті друзі"
 PHI_friends_not_forgotten_desc: "Можна подумати, що ми, філіппінці, тримаємо образу на Сполучені Штати за їхню окупацію. Хоча ми запекло охороняємо свою незалежність, ми також великодушні. Попри наші розбіжності, ми знайшли багато американських друзів, і наші серця прагнуть до них, оскільки їхня батьківщина охоплена заворушеннями та руйнуванням. Коли настане день, коли їхній національний кошмар закінчиться, ми чекатимемо з простягнутою рукою."

 PHI_visit_from_the_ijn: "Візит з Японії"
 PHI_visit_from_the_ijn_desc: "Філіппіни ще не мають власних військово-морських сил, і якщо військово-морські сили Сполучених Штатів більше не зможуть нас захищати, наша острівна країна стає надзвичайно вразливою. Це одна з причин, чому ми цінуємо нашу дружбу з Японією, оскільки її могутній флот підтримує мир і порядок у Західному Тихому океані. Давайте надішлемо телеграму до Токіо із запрошенням японської ескадри завітати до Манільської затоки; ми влаштуємо їм державний прийом."

 PHI_more_government_less_politics: "«Більше уряду, менше політики»"
 PHI_more_government_less_politics_desc: "В опозиції багато розмов про стан нашої політики, ставлячи під сумнів тривале правління націоналістів. Чи потрібно нам нагадувати їм, що кожне досягнення Острівного уряду відбулося під нашим керівництвом, що Співдружність була консолідована, а незалежність здобута під керівництвом Президента Кесона? Наша адміністрація не вважає за потрібне вдаватися до цих політичних суперечок; ми тут, щоб забезпечити належне управління для філіппінців у всьому світі."

 PHI_nineteenthirtynine_elections: "Філіппінські вибори 1939 року"
 PHI_nineteenthirtynine_elections_desc: "Вперше у своїй історії Філіппіни проведуть президентські вибори як вільна та незалежна республіка. Оскільки Президент Мануель Кесон намагається продовжити давню гегемонію націоналістів над урядом, місцеві націоналістичні боси зроблять усе можливе, щоб залучити голоси. Але опозиція також організована. Єдине питання полягає в тому, чи буде цього достатньо для перемоги?"

 ### Quezon Second Term ###
 PHI_to_the_victors_go_the_spoils: "Переможцям дістаються трофеї"
 PHI_to_the_victors_go_the_spoils_desc: "До цих виборів спостерігачі задавалися питанням, чи не закінчиться нарешті безперервна низка перемог Мануеля Кесона. Здається, що їхні прогнози були лише прийняттям бажаного за дійсне. Президент Кесон знову довів, що є майстром філіппінської політики, а його позиція та спадщина стали надійнішими, ніж будь-коли. Щоправда, він не збирається спочивати на лаврах. Попереду ще багато справ: закони, які треба ухвалити, патронаж, який треба надати, і промови, які треба виголосити."

 PHI_industrial_arbirtration: "Промисловий арбітраж"
 PHI_industrial_arbirtration_desc: "У міру розвитку філіппінської економіки промислові суперечки між зростаючим робітничим класом та їхніми роботодавцями стають дедалі більшою проблемою. Страйки є злом для країни, оскільки вони не лише порушують виробництво, але й є нагодою для синдикалістських агітаторів подальшого проникнення в робітничий рух. Натомість уряд повинен бути хранителем промислового миру; ми створимо промисловий суд із юрисдикцією щодо трудових суперечок."

 PHI_open_more_public_schools: "Відкриття більшої кількості державних шкіл"
 PHI_open_more_public_schools_desc: "Наша освітня система настільки ж модернізована, як і в будь-якій західній країні. Її головний недолік полягає в тому, що її охоплення залишається надто коротким. Велика кількість філіппінців залишається неписьменною, і шкіл досі недостатньо для обслуговування зростаючого населення, особливо в сільській місцевості. Буде побудовано більше початкових шкіл, поки ми не будемо впевнені, що кожне **барріо** в країні охоплено."

 PHI_plebiscite_on_womens_suffrage: "Плебісцит про виборче право для жінок"
 PHI_plebiscite_on_womens_suffrage_desc: "Конституція Філіппін не зайшла так далеко, щоб надати жінкам виборче право, але вона передбачала проведення обов'язкового плебісциту з цього питання. Унікальність полягає в тому, що лише філіппінські жінки голосуватимуть щодо того, чи повинні вони отримати право голосу. Суфражистки лобіюють уряд провести плебісцит, тож настав час діяти; позитивний результат здається гарантованим."

 PHI_expand_the_council_of_state: "Розширення Державної ради"
 PHI_expand_the_council_of_state_desc: "Державна рада була спочатку створена в територіальний період для консультування призначеного американцями генерал-губернатора. Спочатку до неї входили спікер Палати представників, президент Сенату та керівники виконавчих департаментів. Однак держава з того часу зросла, і більше її гілок має бути представлено в раді. Будуть додані начальник штабу армії, секретар президента та керівники важливих державних корпорацій."

 PHI_reserve_officers_training_corps: "Корпус підготовки офіцерів запасу"
 PHI_reserve_officers_training_corps_desc: "Наслідуючи американський зразок, Університет Філіппін створив перший офіційний підрозділ **КПОЗ** (РОТК) країни у 1922 році. Зі зростанням військових та оборонних потреб, попит на офіцерів є вищим, ніж будь-коли. Відтепер усі коледжі та університети, де кількість студентів перевищує сто, будуть зобов'язані створювати власний **КПОЗ**."

 PHI_the_national_dream_fulfilled: "Здійснення національної мрії"
 PHI_the_national_dream_fulfilled_desc: "Після ганебної поразки у війні проти Сполучених Штатів у 1902 році філіппінська нація повільно вийшла зі стану підпорядкування. Це була довга боротьба, так, і не без невдач і компромісів, але сьогодні ми бачимо, що обраний нами курс був виправданий, а плоди нашої праці того варті. Філіппіни знову є нацією: вільною, нескутою, такою, що контролює свою долю."

 PHI_a_modern_philippines: "Сучасні Філіппіни"
 PHI_a_modern_philippines_desc: "Наші колишні господарі вважали нас «примітивними», але саме вони були відповідальними за наш грубий стан. Чи не іспанці закували нас у ланцюги реакції та релігійного обскурантизму? Чи не американці обплутали нас економічною відсталістю? Насправді філіппінці — це прогресивний народ, який завжди прагне взаємодіяти з сучасним світом та переймати найновіші технологічні та соціальні досягнення."

 PHI_hub_of_the_pacific: "Центр Тихого океану"
 PHI_hub_of_the_pacific_desc: "Раніше вісь світової політики оберталася навколо Європи, але це може тривати не завжди. Японія — велика держава, а Китай прокидається від сну. Тихоокеанський регіон відіграє все більшу роль у світовій економіці, а куди тече багатство, туди слідує і влада. Філіппіни, можливо, ніколи не стануть однією з великих націй світу, але завдяки своєму стратегічному розташуванню в центрі Західного Тихого океану, вони можуть стати незамінною нацією."

 PHI_a_proper_diplomatic_service: "Належна дипломатична служба"
 PHI_a_proper_diplomatic_service_desc: "З усіх позбавлень, які принесло американське правління для розвитку нашого уряду, найбільшим було обмеження можливості нашої країни вести власні зовнішні справи. З огляду на те, що наша незалежність настала досить раптово, перед нами стоїть важливе завдання утвердити себе на світовій арені. Наш Департамент закордонних справ зростає, і багато наших найкращих і найталановитіших стають у чергу, щоб служити йому."

 ### Evangelista ###
 PHI_coalition_of_the_oppressed_masses: "Коаліція пригноблених мас"
 PHI_coalition_of_the_oppressed_masses_desc: "Буржуазію повалено. Можна сказати, що маси мають лише туманне уявлення про те, чого вони щойно досягли, але це не повинно применшувати їхні досягнення. Цей акт є достатнім доказом того, що робітники та селяни Філіппін, які смутно наближаються до класової свідомості, вже просунулися достатньо далеко, щоб боротися і перемогти своїх гнобителів. Ми поведемо їх у майбутнє."

 PHI_create_labour_colleges: "Створення робітничих коледжів"
 PHI_create_labour_colleges_desc: "Хоча ми виграємо боротьбу проти капіталізму, є ще одна боротьба, за яку ми маємо взятися: боротьба проти невігластва. Масам потрібно багато чого навчитися, від базового читання та арифметики до технічних та сільськогосподарських знань, а також справжнього розуміння того, що означають соціалізм та синдикалізм. У великих революційних державах Європи вони вирішили це шляхом створення робітничих коледжів для освіти дорослих; ми імпортуємо цю модель."

 PHI_break_up_the_haciendas: "Розділ гасієнд"
 PHI_break_up_the_haciendas_desc: "На Філіппінах, які ще не розвинули великого класу капіталістів, домінували великі землевласники. Вони панували над селянством, утримуючи його у феодальній залежності та борговому рабстві. Більшість селян лише мріяли про лагіднішого, більш поблажливого пана, але ми тут, щоб сказати їм, що вони можуть мріяти про більше. Гасієнди, великі маєтки, будуть негайно експропрійовані без компенсації. Земля належить народу."

 PHI_moulding_the_revolutionary_woman: "Формування революційної жінки"
 PHI_moulding_the_revolutionary_woman_desc: "Рух за права жінок на Філіппінах досі очолювався буржуазними активістками, зосередженими на буржуазних питаннях. Деяке виборче право тут або деяка правова реформа там не послужать визволенню жінок. Жінка Філіппін повинна зрозуміти, що революція скасує капіталістичну сімейну структуру та її гноблення. На практиці це може зайняти багато часу, але це мета, до якої ми завжди прагнемо."

 PHI_dictatorship_of_labour: "Диктатура праці"
 PHI_dictatorship_of_labour_desc: "Роками як наші американські господарі, так і їхні лакеї-націоналісти відмахувалися від гноблення робітників заявами про те, що Філіппіни є демократією і що зміни мають відбуватися через виборчу урну. Але немає цінності в капіталістичній демократії, яка дає робітнику свободу лише вибирати, який чобіт тиснутиме йому на шию. Час демократії минув; лише диктатура робітничого класу може демонтувати капіталістичну систему."

 PHI_cooperation_with_kpmp: "Співпраця з КНСФ"
 PHI_cooperation_with_kpmp_desc: "Національна конфедерація селян Філіппін — це аграрний партнер «Партії робітників». Насправді, без КНСФ, щоб згуртувати селян, не було б жодної революції в такій сільській країні, як Філіппіни. Навіть якщо ми прагнемо індустріалізувати Філіппіни, вони довгий час залишатимуться переважно аграрною країною, і тому співпраця з КНСФ послужить нам добру службу."

 PHI_create_a_peoples_army: "Створення народної армії"
 PHI_create_a_peoples_army_desc: "Професійні військові є інструментом буржуазної держави для пригноблення народу; достатньо поглянути на Філіппінську констебларію, щоб побачити такий приклад. Революція була здійснена робітниками та селянами, які озброювалися та організовувалися, і саме їхній запал здобув перемогу. Існуючі ополчення будуть реорганізовані в «Народну армію», яка стане новим засобом захисту нашої нації."

 PHI_true_independence: "Справжня незалежність"
 PHI_true_independence_desc: "Знову і знову націоналісти обіцяли незалежність від американського імперіалізму. Але коли вона нарешті настала, якою ж брехнею це виявилося. Заклики до суверенітету не мають сенсу перед обличчям капіталістично-імперіалістичної системи, в якій Філіппіни залишилися заплутаними. Лише революція нарешті принесла нам справжню незалежність: незалежність від капіталу, свободу об’єднати руки з усіма революційними робітниками світу."

 PHI_the_internationalist_outlook: "Інтернаціоналістичний світогляд"
 PHI_the_internationalist_outlook_desc: "Після революції ми були зайняті внутрішнім пошуком, намагаючись створити інститути соціалізму на Філіппінах. Ми отримали багато допомоги від інших соціалістичних країн, і тепер ми досягли стадії, коли можемо почати дивитися назовні. Бо міжнародна революція вимагає участі пролетаріату всього світу, і настав час нам зробити свій внесок."

 PHI_the_destruction_of_imperialism: "Знищення імперіалізму"
 PHI_the_destruction_of_imperialism_desc: "Соціалізм для нас забезпечено, але залишається великий виклик. Зростаюча хвиля колонізованих народів світу готова повалити капіталістичний імперіалізм під прапором революційного соціалізму. Філіппіни можуть бути невеликою нацією, але не забувайте: ми вже повставали проти імперіалізму і створили першу республіку в Азії. Наша роль у майбутньому починанні буде славетною."

 ### Recto ###
 PHI_evolution_not_revolution: "Еволюція, а не революція"
 PHI_evolution_not_revolution_desc: "Вперше в історії філіппінської демократії націоналісти були відсторонені від влади шляхом голосування. Президент Ректо обіцяє трансформувати країну та виправити зловживання попереднього уряду. Але це не відмова від минулого; аж ніяк. Ми будуємо на основах, закладених тими, хто був до нас, впевнені в тому, що кращі Філіппіни можуть бути створені. У цій упорядкованій передачі влади філіппінська демократія була освячена."

 PHI_promote_public_welfare: "Сприяння громадському добробуту"
 PHI_promote_public_welfare_desc: "У сучасному суспільстві держава зобов'язана піклуватися про своїх громадян, підвищуючи загальний рівень життя і, таким чином, забезпечуючи соціальний мир і безпеку. Бюро громадського добробуту вже проводить гарну роботу, але є багато можливостей для розширення. Зі зростанням наших податкових надходжень ми можемо відкласти кошти на пенсії за віком, догляд за дітьми та підтримку безробітних."

 PHI_new_medium_of_instruction: "Новий засіб навчання"
 PHI_new_medium_of_instruction_desc: "Конституція визначила англійську та іспанську мови для офіційного використання, але містила положення про початок процесу визначення національної мови. За попередньої адміністрації Інститут національної мови ухвалив, що стандартизована форма **тагальської** мови стане мовою Філіппін. Тепер настає завдання втілити ці слова в реальність. Усе державне шкільне навчання надалі буде проводитися **філіппінською** мовою, таким чином навчаючи нашу молодь нової національної мови."

 PHI_domestic_relations_and_probate_courts: "Суди у справах про сімейні стосунки та спадщину"
 PHI_domestic_relations_and_probate_courts_desc: "Жінки Філіппін, отримавши право голосу, продовжують активно виступати за розширення своїх громадянських прав. Оскільки місце жінки залишається в домі та в сім’ї, захист її прав стосовно її чоловіків та утриманців є її головною турботою. Будуть створені спеціальні суди, що займаються сімейними відносинами, для розгляду цих справ."

 PHI_provincial_autonomy: "Провінційна автономія"
 PHI_provincial_autonomy_desc: "Як Президент, Кесон не бачив проблеми у зосередженні виконавчої влади навколо себе, щоб краще панувати над системою патронажу та ієрархії, що керує філіппінською політикою. Однак зараз зрозуміло, що така надмірно централізована адміністрація є неефективною та нечутливою до потреб пересічних філіппінців. Багато функцій центрального уряду можуть бути передані з Маніли до провінційних адміністрацій, рівномірніше розподіляючи державну службу по країні."

 PHI_protect_press_freedoms: "Захист свободи преси"
 PHI_protect_press_freedoms_desc: "Невід'ємний принцип ліберальної демократії — це свобода слова та преси. Ці свободи закріплені в нашій конституції, але не завжди їх справді дотримуються. Впливові особи використовували закони про наклеп, щоб змусити критиків замовкнути, а уряд придушував те, що він вважав підривним в ім'я державної безпеки. Цим зловживанням не можна дозволити продовжуватися, якщо ми хочемо мати справді вільне суспільство."

 PHI_cement_military_political_divide: "Закріплення військово-політичного розмежування"
 PHI_cement_military_political_divide_desc: "Створення наших власних збройних сил було незамінним для розвитку наших національних оборонних можливостей. Однак ми не повинні дозволити армії, яка стає дедалі більшою та добре фінансованою, почати думати, що вона є незалежним суб'єктом, який може диктувати свої бажання обраному уряду. Наші армійські керівники відповідатимуть цивільним посадовим особам у своїй якості представників народу."

 PHI_break_the_colonial_pattern: "Подолання колоніального зразка"
 PHI_break_the_colonial_pattern_desc: "Колоніальна спадщина важко лежить на Філіппінах. Хоча ми певною мірою забезпечили політичний суверенітет, відбиток колоніалізму все ще відчувається на нашій економіці, нашому суспільстві, нашій системі правління. Колоніальний менталітет все ще тисне на уми людей, але це не триватиме вічно. Поступово ми звільняємося від ланцюгів минулого, стаючи незалежними як за світоглядом, так і за фактом."

 PHI_assert_our_independence: "Затвердження нашої незалежності"
 PHI_assert_our_independence_desc: "Остаточно вийшовши з-під американського панування, ми зобов’язуємося ніколи більше не потрапляти в залежність від іноземного володаря. Ми готові формувати дружні стосунки з іншими націями та налагоджувати співпрацю заради взаємної безпеки. Але Філіппіни не будуть у кишені якоїсь великої держави; лише ми самі визначатимемо нашу долю та місце у світі."

 PHI_the_unconquerable_faith: "Непереможний дух"
 PHI_the_unconquerable_faith_desc: "Філіппінська революція почалася з ідеї, мрії про свободу, справедливість та створення незалежної філіппінської нації. З тих часів філіппінський народ невтомно працював і боровся, щоб втілити ці мрії в життя. У цій боротьбі вони зіткнулися зі зростаючим цинізмом, породженим труднощами створення справедливого та демократичного уряду. Нехай ніхто не сумнівається в реальності нашого досягнення, щоб філіппінці ніколи не втратили свій ідеалізм та віру в націю."

 ### Roxas ###
 PHI_a_steady_hand: "Тверда рука"
 PHI_a_steady_hand_desc: "«Націоналістична партія» була охоронцем філіппінської демократії протягом десятиліть. Вона забезпечила стабільність і безперервність уряду, захищаючи країну від безладу та хаосу. Останніми роками популісти-агітатори намагалися штовхнути націю до анархії, і попередній уряд нерозумно піддався їхнім вимогам. Цього більше не буде; націоналісти знову виступають за розумне, обґрунтоване правління."

 PHI_consolidate_the_university_of_the_philippines: "Консолідація Національного університету"
 PHI_consolidate_the_university_of_the_philippines_desc: "Наш національний університет є гордістю нації, надаючи нашим найкращим і найталановитішим освіту світового рівня, щоб вони були готові стати майбутніми лідерами Філіппін. У міру розширення університету коледжам доводилося займати будівлі, де вони були доступні по всій Манілі. З переїздом усіх коледжів до єдиного, розширеного кампусу, «Університет Філіппін» зможе зростати."

 PHI_security_through_patronage: "Безпека через патронаж"
 PHI_security_through_patronage_desc: "Філіппінське суспільство підтримується взаємними зобов'язаннями між соціальними групами. Якщо нижчі класи служать елітам як орендарі чи робітники, від еліт також очікується певна **noblesse oblige** і надання послуг тим, хто під ними, через подарунки, позики та прощення боргів. Хоча це не кодифіковано законом і деякі вважають це «корупцією», це завжди було способом збереження соціального миру на Філіппінах."

 PHI_model_of_filipino_womanhood: "Зразок філіппінської жіночності"
 PHI_model_of_filipino_womanhood_desc: "Жінки Філіппін мають більші прагнення; це добре. Жінки завжди відігравали ключову роль у суспільстві як охоронці домашньої сфери. Їх слід заохочувати розвивати свою освіту, чесноти та соціальну грацію, бо в цьому вони чинитимуть здоровий і стабілізуючий вплив на філіппінських чоловіків."

 PHI_expel_subversives: "Вигнати підривників"
 PHI_expel_subversives_desc: "Хоча Філіппіни пишаються тим, що є демократичним і ліберальним суспільством, ми не дозволяємо зловживати політичними свободами. Останнім часом руйнівні та антидержавні активісти стають сміливішими у спробах захопити політичну владу. Багато з них — червоні, деякі — релігійні фанатики; це одне і те ж. Ми не дозволимо їм маніпулювати неосвіченими масами. Нехай вони киплять і лютують скільки завгодно, якщо тільки вони роблять це із дверима до Конгресу, зачиненими за ними."

 PHI_greasing_the_wheels: "Змащування коліс"
 PHI_greasing_the_wheels_desc: "У політиці все залежить від того, кого ти знаєш. Чого реформатори не можуть оцінити, так це того, що ніхто ні від чого не відмовляється, не отримавши чогось натомість. Замість того, щоб битися головою об стіну статус-кво, краще навчитися пливти за течією з вигодою для себе. З нашого місця на вершині національної ієрархії, ми можемо надавати послуги в кожній провінції та **барріо** країни."

 PHI_expand_the_constabulary: "Розширення Констебларії"
 PHI_expand_the_constabulary_desc: "Армія може відповідати за національну оборону, але правоохоронна діяльність та підтримання миру й порядку є сферою Філіппінської констебларії. Хоча місцева поліція може мати своє місце, як національна сила, Констебларія є головним інструментом проти загрози безладу з боку селянських і робітничих агітаторів. Її слід розширити, щоб протистояти цій зростаючій загрозі."

 PHI_unification_of_politics: "Об’єднання політики"
 PHI_unification_of_politics_desc: "Дехто може сказати, що конкурентна, багатопартійна демократія є передумовою процвітаючого ліберального суспільства, але чи справді це так? Справа в тому, що «Націоналістична партія» керувала філіппінською політикою з самого її початку, і кожна спроба створити життєздатний опозиційний рух провалилася. Це не слід розглядати як щось погане. За стабільного правління націоналістів усі частини країни працюють разом у гармонії."

 PHI_agreement_of_mutual_benefits: "Угода про взаємну вигоду"
 PHI_agreement_of_mutual_benefits_desc: "Американці запропонували жорстку угоду: хоча вони дали нам деякі речі, вони багато чого взяли натомість. Ми раді, що вийшли з-під їхнього контролю, але це не означає, що ми стали ворожими до США чи будь-якої іншої великої держави. Сьогодні на світовій арені багато гравців, які змагаються за нашу увагу, і ми б добре зробили, уклавши з ними угоду, якщо тільки ми зможемо домовитися про вигідні умови."

 PHI_our_seat_at_the_table: "Наше місце за столом"
 PHI_our_seat_at_the_table_desc: "Важко заслужити повагу. Для довгого часу Філіппінська Республіка розглядалася як вискочка, колонія США, що бореться, яка отримала свою незалежність майже випадково. Потрібно було докласти багато зусиль, щоб змінити це сприйняття, але наша дипломатія та національний прогрес нарешті принесли плоди. Філіппіни тепер повністю прийняті та шановані, маючи власний вплив, який можна використовувати."

 ### Aguinaldo ###
 PHI_the_humble_sons_of_the_people: "Смиренні сини народу"
 PHI_the_humble_sons_of_the_people_desc: "Що для нас зробили політики? Вони грабували та обманювали; роками вони зображували себе захисниками незалежності, будучи вірними лакеями американців. Настав час їх скинути. Ми не політики. Наш рух — це не політична партія, яка прагне увічнити свою владу. Все, що ми робимо, — це самовіддане служіння народу."

 PHI_vocational_and_nationalist_education: "Професійна та націоналістична освіта"
 PHI_vocational_and_nationalist_education_desc: "Школи Філіппін були отруєні західними зразками навчання та навчальних програм, перетворившись на фабрики, де в голови наших дітей вбивали англійську мову. Що потрібно філіппінцям, так це практичні знання, знання для досягнення успіху в торгівлі та знання для розбудови цієї країни. Перш за все, їх потрібно навчити любити і служити нації."

 PHI_improve_working_class_housing: "Покращення житла робітничого класу"
 PHI_improve_working_class_housing_desc: "Пересічний філіппінець живе в поганих умовах, чи то в халупах сільських **барріо**, чи то в зростаючих нетрях Маніли. Тим часом політики живуть у маєтках. Сильний і здоровий народ потребує гарного, гігієнічного житла. Давайте розпочнемо кампанію з будівництва нового, кращого житла для нижчих класів."

 PHI_mothers_of_the_nation: "Матері нації"
 PHI_mothers_of_the_nation_desc: "Філіппінська жінка має славетну історію. Вона повстала проти іспанського гнобителя. Вона чинила опір американському загарбнику. Вона картала свого чоловіка, коли він ухилявся від свого національного обов'язку. Роль філіппінської жінки в національному житті має бути вшанована та культивована. Вони наші сестри та матері майбутнього покоління."

 PHI_cooperation_of_labour_and_capital: "Співпраця праці та капіталу"
 PHI_cooperation_of_labour_and_capital_desc: "Це правда, що економічні еліти цієї країни експлуатували робітничий клас у багатьох відношеннях. Також правда, що синдикалістські агітатори використовували гасло «класова війна», щоб сіяти розбрат та розкол. Постійна війна між працею та капіталом ніколи не принесе процвітання та миру. Вони повинні об'єднатися і навчитися співпрацювати, відкинувши ворожнечу та антагонізм в ім'я національних інтересів."

 PHI_spirit_of_ninety_six: "Дух 96-го"
 PHI_spirit_of_ninety_six_desc: "У 1896 році розпочалася Філіппінська революція. Вона дала нам пантеон національних героїв, чия спадщина надихає нас донині. Але занадто багато старих забули, і занадто багато молодих не знають цієї історії. Ми не можемо дозволити нації втратити свій дух, стати самовдоволеною та декадентською. Ми повинні озирнутися на тих великих патріотів минулого і наслідувати їхній приклад, сміливо прагнучи до майбутнього."

 PHI_spirit_of_national_defense: "Система національної оборони"
 PHI_spirit_of_national_defense_desc: "Недостатньо бажати незалежності; її потрібно підкріпити військовою силою. Ми повинні зробити все можливе, щоб іноземна держава ніколи більше не загрожувала нашому суверенітету. Усі працездатні чоловіки повинні бути готові до військової служби та навчені військовому мистецтву. Країна має бути готова до мобілізації за першої ж нагоди, з планами, готовими до використання нашої робочої сили та матеріальних засобів на повну силу."

 PHI_philippines_unbowed: "Нескорені Філіппіни"
 PHI_philippines_unbowed_desc: "Ще вчора Філіппіни були підлеглою державою: якщо не своїм колишнім американським господарям, то корумпованому та егоїстичному політичному класу, який зрадив національні інтереси. Ті часи минули. Ми відновили свою гідність і покінчили з корупцією партійної політики. Ми побудували уряд, який служить усім філіппінцям, і якому всі філіппінці гордо служать."

 PHI_pan_asian_propaganda: "Пан-азійська пропаганда"
 PHI_pan_asian_propaganda_desc: "Іспанія та Сполучені Штати, можливо, намагалися втиснути Філіппіни в західну форму, але в душі ми завжди були азійською нацією. Від нашого братерства з малайськими народами на півдні до наших китайських та японських громад ми по праву належимо до східного світу. Боротьба всіх азійських націй проти імперіалізму — це наша боротьба, і ми з нетерпінням чекаємо того дня, коли всі постануть разом як єдине ціле."

 PHI_the_glorious_republic: "Славетна Республіка"
 PHI_the_glorious_republic_desc: "Від підпорядкування, від бідності, від апатії, Філіппіни знову є перлиною Сходу. Наша велич сяє через Тихий океан, підбадьорюючи наших друзів та змушуючи тремтіти наших ворогів. Перша Республіка, народжена в Малолосі, повстала з попелу, величніша, ніж ми могли собі уявити. Філіппінський народ може пишатися своєю нацією, якій він служить самовіддано, охоче, ніколи не шкодуючи свого існування для улюбленої батьківщини."

#### - Military Tree - #####
### West Point Tree ###

 PHI_west_point_of_the_east: "Вест-Пойнт Сходу"
 PHI_west_point_of_the_east_desc: "Філіппінська військова академія була змодельована та стилізована за зразком свого видатного американського аналога у Сполучених Штатах. Хоча вона не має такої багатої історії, як її американський аналог, «ФВА» все ж втілюватиме дух Вест-Пойнта, який надихав на успіх та славу на полі бою. З американською допомогою чи без неї, ми побудуємо сучасну армію, здатну захистити нашу батьківщину."

 PHI_philippine_american_officers: "Філіппінські американські офіцери"
 PHI_philippine_american_officers_desc: "Ще до заснування ФВА оборонні сили Філіппінських островів мали філіппінських офіцерів, які пройшли офіційну військову освіту в Сполучених Штатах. З наближенням загрози війни ми повинні звернутися до цих офіцерів, щоб вони навчали та готували наступне покоління філіппінських військових."

 PHI_a_new_service_rifle: "Нова службова гвинтівка"
 PHI_a_new_service_rifle_desc: "Обладнання Філіппінської армії завжди поставлялося зі складів Сполучених Штатів. З відтоком своїх офіцерів, людей і деякої частини матеріальних засобів військові змушені покладатися на озброєння від недоступного постачальника. Ми повинні знайти нового покровителя."

 PHI_the_archipelagic_struggle: "Архіпелагічна боротьба"
 PHI_the_archipelagic_struggle_desc: "Наявність сотень окремих островів була як перевагою, так і прокляттям для філіппінської нації. Багато колоніальних володарів виявили, що умиротворення островів було ускладнене через нашу географію, але це також спричинило нам проблеми, ускладнюючи розгортання наших військових по всій країні. Будуть виділені кошти для модернізації інфраструктури великих островів."

 PHI_from_hooves_to_tires: "Від копит до шин"
 PHI_from_hooves_to_tires_desc: "Участь у Вельткригу революціонізувала війну, оскільки масові атаки кавалерії в Європі були скошені кулеметами на укріплених позиціях. Спостерігаючи за великими конфліктами навколо нас, ми повинні розпочати масову моторизацію наших сил."

 PHI_tangke_de_guerras: "Tangke de Guerras"
 PHI_tangke_de_guerras_desc: "Вельткріг революціонізував війну завдяки широкому використанню танків та інших форм мобільної війни. Хоча ми, можливо, не зможемо зрівнятися з бронетанковими силами великих європейських держав, військові повинні прагнути придбати сили, гідні стандартів сучасних західних армій."

 PHI_king_of_the_battlefield: "Король поля бою"
 PHI_king_of_the_battlefield_desc: "Артилерія довгий час була ключовою частиною війни, але нашим військовим завжди не вистачало коштів для її придбання. З нашим нещодавнім акцентом на військовій модернізації Філіппінська армія повинна звернутися до Конгресу з проханням виділити додаткові кошти для придбання більш сучасної артилерії для Збройних сил Філіппін."

 PHI_tiradores_de_la_muerte: "Tiradores de La Muerte"
 PHI_tiradores_de_la_muerte_desc: "Стрільці Смерті були елітним загоном снайперів поряд із Чорною гвардією, відібраних особисто генералом Антоніо Луною під час Філіппінсько-американської війни. Ми повинні звернутися до їхньої спадщини при створенні наших перших полків спеціальних сил."

 PHI_modernise_the_scout-rangers: "Модернізація скаутів-рейнджерів"
 PHI_modernise_the_scout-rangers_desc: "Філіппінські скаути пишаються своєю здатністю орієнтуватися в джунглях та керувати регулярними армійськими підрозділами. Ми повинні наголосити на цій підготовці для майбутніх скаутів, які будуть прикріплені до Армії."

 PHI_modern_vanguard_of_the_pacific: "Сучасний авангард Тихого океану"
 PHI_modern_vanguard_of_the_pacific_desc: "Нарешті, після місяців наполегливих зусиль ми створили військо, навчене вести сучасну війну. Нехай тирани більше ніколи не затьмарять наші сяючі поля!"

### Shared Tree ###
 PHI_finish_the_nineteen_twenty_defence_act: "Завершення Акту про оборону 1920 року"
 PHI_finish_the_nineteen_twenty_defence_act_desc: "Протягом 1920-х років генерал Лессітер запропонував включити до закону створення місцевої мобільної бази резервів для допомоги в обороні Коррехідора. З благословення начальника штабу Саммералла тоді, включене законодавство дозволило Філіппінським островам створювати військові округи та попередньо сформувати перші підрозділи Філіппінської армії."

 PHI_expand_the_akademiyang_militar_ng_pilipinas: "Розширення «Akademiyang Militar ng Pilipinas»"
 PHI_expand_the_akademiyang_militar_ng_pilipinas_desc: "Однією з проблем, з якими зіткнулися перші підрозділи оборонних сил острова, була нестача офіцерів, які могли б керувати великою кількістю місцевого населення. Оскільки «Закон про оборону» дозволяв створення резервістів і невеликого ядра регулярних кадрів, Департаменту було доручено створити першу на острові академію з підготовки офіцерів для укомплектування плану Саммералла, що передбачав 150 000 резервістів."

 PHI_militarisation_of_the_constabulary: "Мілітаризація Констебларії"
 PHI_militarisation_of_the_constabulary_desc: "«Філіппінська констебларія» є однією з перших гілок з підрозділами, очолюваними місцевими офіцерами. Хоча вона спочатку служила жандармерією для придушення бандитизму та повстань, Констебларія була визнана Департаментом компетентною силою, яка могла служити місцевою військовою поліцією для підтримки порядку."

 PHI_national_defense_act: "Закон про національну оборону від [GetYear]"
 PHI_national_defense_act_desc: "«Закон про національну оборону» від [GetYear] був одним із перших законодавчих актів, ухвалених обраними представниками повністю філіппінського Конгресу. Він передбачав створення самодостатньої місцевої промисловості для виробництва обладнання, що вважається необхідним і життєво важливим для оборони островів."

 PHI_war_plan_orange: "Військовий план «Оранж»"
 PHI_war_plan_orange_desc: "Військовий план «Оранж» був американським військовим планом, зосередженим на подіях, коли США та Японія перебуватимуть у стані війни. Одним із припущень ВПО була участь островів; тепер, коли американці пішли, ми повинні взяти те, що залишилося від Військового плану «Оранж», і переробити його, щоб він відповідав нашій новій ситуації."

 PHI_the_philippine_department: "Філіппінський департамент"
 PHI_the_philippine_department_desc: "Створення наших військових не було повністю незалежним. Обставини нашого статусу Співдружності дозволили нам скористатися американськими офіцерами у Філіппінському департаменті для консультування щодо створення та організації військових."

 PHI_sandtahang_lakas_ng_pilipinas: "Sandatahang Lakas ng Pilipinas"
 PHI_sandtahang_lakas_ng_pilipinas_desc: "Філіппінська революційна армія була розгромлена у 1899 році. З того дня острови перебували під захистом американців. Тепер цей захист втрачено, і країна має захищатися сама, використовуючи те, що має."

 PHI_improve_army_logistics: "Покращення армійської логістики"
 PHI_improve_army_logistics_desc: "Природно, що транспортування військ молодої армії було взято до уваги, враховуючи непостійну якість транспортування між військовими округами. «Акт III NDA» окреслює купівлю та обслуговування транспортування військ, тварин, припасів та води."

 PHI_the_radio_control_division: "Відділ радіоконтролю"
 PHI_the_radio_control_division_desc: "Відділ радіоконтролю було вперше створено у 1931 році. Щоб забезпечити його повну інтеграцію в наші військові сили, ми повинні передати його безпосередньо до Збройних сил Філіппін."

 PHI_americas_arsenal: "Американський арсенал"
 PHI_americas_arsenal_desc: "Хоча Конгрес і деякі представники військового департаменту історично не наважувалися інвестувати в оборону острова, ухвалення «Акту про оборону 1920-х років» гарантувало, що поряд з американською обіцянкою розбудувати інститути нації, він також допоможе їй озброїтися для захисту."

 PHI_a_fledging_military_industry: "Зародження військової промисловості"
 PHI_a_fledging_military_industry_desc: "За допомогою будь-якого обраного нами покровителя, республіка тепер має доступ до необхідного технічного досвіду для створення власної військової промисловості."

 PHI_modernise_our_artillery: "Модернізація нашої артилерії"
 PHI_modernise_our_artillery_desc: "Хоча деякі нагальні проблеми наших піхотних сил, можливо, були вирішені, наша артилерія все ще покладається на дуже старі та малокаліберні гармати. Якщо ми хочемо ефективно захищати країну, ми повинні прагнути придбати новіші та важчі артилерійські знаряддя."

 PHI_increase_military_aid_procurement: "Збільшення закупівель військової допомоги"
 PHI_increase_military_aid_procurement_desc: "За допомогою наших покровителів ми повинні мати можливість агресивно розширити будівництво військових об'єктів на архіпелазі."

 PHI_prepare_for_the_storm: "Готуючись до шторму"
 PHI_prepare_for_the_storm_desc: "Наше стратегічне положення в Тихому океані забезпечує легкий доступ до Південно-Східної Азії, і ми завжди усвідомлювали, що будуть сторони, зацікавлені в проєктуванні влади з наших кордонів. Тепер, коли теоретичне починає все більше походити на реальність, Конгрес дозволив додаткове фінансування для подальшого придбання всіх видів озброєння та обладнання для підготовки до будь-якого конфлікту, який може загрожувати нашим островам."

 PHI_approach_the_foreign_arms_market: "Вихід на іноземний ринок озброєнь"
 PHI_approach_the_foreign_arms_market_desc: "Не секрет, що німці та японці змагаються за вплив у нашій республіці. Помітивши нашу нездатність виробляти власне обладнання, ми отримали пропозиції щодо технічних консультантів, інвестицій та придбання від Берліна."

### Home Defence Tree ###
 PHI_memories_of_eighteen_ninetynine: "Спогади про 1899 рік"
 PHI_memories_of_eighteen_ninetynine_desc: "Після відходу Америки та відсутності чіткого напрямку для нашої армії деякі з наших більш націоналістичних офіцерів виступають за те, щоб ми звернулися до досвіду, який ми отримали під час Філіппінсько-американської війни."

 PHI_our_land_our_ways: "Наша земля, наші шляхи"
 PHI_our_land_our_ways_desc: "Будучи острівною нацією, благословенною десятками джунглевих островів, одним з наших головних захистів від будь-якого потенційного загарбника є перспектива необхідності боротися з ізольованими осередками партизанських підрозділів в асиметричній війні. Ми повинні спрямувати освіту ФВА на фокусування на цьому."

 PHI_standardise_our_rifles: "Стандартизація наших гвинтівок"
 PHI_standardise_our_rifles_desc: "Військове обладнання Армії являє собою еклектичну суміш британських та американських гвинтівок різного віку та ступеня застарілості. Якщо ми хочемо виставити сили, здатні вести партизанську війну проти окупанта, ми повинні забезпечити прийняття нової стандартної гвинтівки для масового виробництва."

 PHI_form_the_sandatahanes: "Створення Sandatahanes"
 PHI_form_the_sandatahanes_desc: "З нашим поновленим акцентом на партизанській війні, ми повинні реорганізувати військові округи громадян (sandatahanes), щоб надати допоміжні підрозділи для захисту їхніх округів та допомоги регулярній армії у її обов’язках."

 PHI_expertise_of_the_scouts: "Досвід Скаутів"
 PHI_expertise_of_the_scouts_desc: "Жодна інша сила у Філіппінських військових не є настільки здатною, як Скаути, орієнтуватися у густій рослинності наших джунглевих островів. Інтеграція полків «Філіппінських скаутів» для підтримки наших дивізій дозволить нам швидше маневрувати в джунглях."

 PHI_jungle_fighter: "Боєць джунглів"
 PHI_jungle_fighter_desc: "Іноземні загарбники вже випробовували нашу землю; спочатку іспанці, а потім американці. Тепер, коли загроза війни постійно висить над нашими улюбленими островами, ми повинні очікувати, що нам доведеться звернутися до джунглів, щоб підтримувати запеклий опір. Бо саме в джунглях ми навчилися, як найкраще боротися і як найкраще перемагати."

 PHI_lessons_from_the_revolution: "Уроки Революції"
 PHI_lessons_from_the_revolution_desc: "Значна частина військової історії островів зосереджена на використанні переваг нашого географічного положення, щоб перетворити роботу окупанта на кошмар. Можливо, вони зможуть перемогти нас у звичайних боях, але за кожним листком джунглів, кожним ізольованим островом, стоїть народ, готовий боротися і померти за республіку."

 PHI_facilitate_domestic_arms_production: "Сприяння внутрішньому виробництву зброї"
 PHI_facilitate_domestic_arms_production_desc: "Якщо ми маємо будувати нашу армію з очікуванням, що переважаюча сила неминуче висадиться на островах, наша військова промисловість повинна бути так само готова розосередитися у невеликих майстернях, захованих у джунглях та на островах. Щоб досягти цієї мети, ми заплануємо евакуацію зброярів по всій країні та підготуємо створення ізольованих майстерень."

 PHI_the_jungle_our_refuge: "Джунглі — наш притулок"
 PHI_the_jungle_our_refuge_desc: "Щоб переконатися, що наша армія готова до асиметричної війни, ми повинні включити тренування в джунглях до базової підготовки для військових в цілому."

 PHI_paglaban_ng_pilipinas: "Paglaban ng Pilipinas"
 PHI_paglaban_ng_pilipinas_desc: "Історія була недоброю до наших островів. Довго пригноблені колонізаторами та імперіалістами, ми боролися за право керувати власними долями з того часу, як Катіпунан розірвав свої **цедули** Іспанській імперії. Завдяки цим реформам ми забезпечимо, щоб будь-які потенційні окупанти заплатили ціну за спробу вирвати нашу землю з наших рук."

### Navy Tree ###
 PHI_expand_the_philippine_navy: "Створення «Офшорного патруля»"
 PHI_expand_the_philippine_navy_desc: "Згідно з «Виконавчим указом № 11», до «Офшорного патруля» має увійти все морське обладнання та персонал, придбані Філіппінським урядом і передані під контроль начальника штабу як у мирний, так і у військовий час. Він матиме обов’язки та повноваження захищати береги та острови нашої улюбленої острівної нації."

 PHI_import_foreign_navy_designs: "Імпорт іноземних військово-морських розробок"
 PHI_import_foreign_navy_designs_desc: "Гонки морських озброєнь на початку 20-го століття наблизили світ до війни у Першій світовій. З огляду на географічний та стратегічний характер Філіппінських островів біля Філіппінського моря та Південно-Китайського моря, нам необхідно звернутися до іноземних військово-морських моделей та радників, щоб покращити наші військово-морські можливості та забезпечити безпеку нашої нації."

 PHI_commence_the_coastal_defence_plan: "Початок плану берегової оборони"
 PHI_commence_the_coastal_defence_plan_desc: "Амбітний «План берегової оборони» від [GetYear] має на меті покращити укріплення на форті Драм (острів Ель-Фрайле), військово-морській базі Лейте-Самар та укріплення на Пуерто-Принцеса. Будуть посилені військово-морські гарматні батареї, окопи та міни, щоб запобігти морським вторгненням на острови."

 PHI_develop_the_island_naval_bases: "Розвиток острівних військово-морських баз"
 PHI_develop_the_island_naval_bases_desc: "На додаток до військово-морських батарей та укріплень, наші військово-морські бази мають бути додатково покращені прожекторами, зенітними батареями та вежами управління вогнем. Ми повинні швидко підготувати ці бази, якщо хочемо протистояти іноземним загарбникам."

 PHI_found_the_marine_corps: "Заснування Корпусу морської піхоти"
 PHI_found_the_marine_corps_desc: "Географічний характер Філіппін гарантує, що операціями найкраще керують солдати, які здатні швидко розгортатися як на суші, так і на морі, що робить Філіппіни ідеальною країною для розвитку активного Корпусу морської піхоти. З їхнім девізом честі, обов'язку та героїзму, ці морські піхотинці стануть справжнім вістрям списа."

 PHI_a_fleet_of_mosquitos: "Флот москітів"
 PHI_a_fleet_of_mosquitos_desc: "Американці залишили після себе багато торпедних катерів і патрульних катерів PT. Ці катери оснащені торпедами, глибинними бомбами та легкими зенітними гарматами. Хоча вони є нетрадиційними за стандартами сучасного флоту; їхній розмір та швидкість роблять їх ідеальними для острівного ландшафту Західного Тихого океану."

 PHI_revitalise_the_cavite_naval_yard: "Відновлення Військово-морської верфі Кавіте"
 PHI_revitalise_the_cavite_naval_yard_desc: "Своє походження «Військово-морська верф Кавіте» бере з іспанського арсеналу, а потім її захопили американці, ставши єдиним об'єктом Військово-морських сил США для ремонту кораблів у західній частині Тихого океану. Тепер, коли американці пішли, ми повинні прагнути відремонтувати та відновити колишню військово-морську верф, щоб виробляти кораблі для підготовки військових дій у відкритому морі."

 PHI_a_new_generation_of_naval_officers: "Нове покоління військово-морських офіцерів"
 PHI_a_new_generation_of_naval_officers_desc: "Протягом історії філіппінці відзначилися на полі бою: від перемоги Лапу-Лапу над Магелланом у битві при Мактані у 1521 році до запеклого опору генерала Антоніо Луни американському імперіалізму. Тепер, коли в нашій республіці починає з'являтися нове покоління військово-морських офіцерів, ми повинні подбати про те, щоб вони очолили наступне покоління."

 PHI_protecting_our_seas_securing_our_future: "Захист наших морів, забезпечення нашого майбутнього"
 PHI_protecting_our_seas_securing_our_future_desc: "Наші зусилля з модернізації колишнього «Офшорного патруля» в справді грізну військово-морську силу принесли плоди. Тепер ми можемо з гордістю проголосити створення нових Філіппінських військово-морських сил для захисту наших морів та забезпечення собі справжнього бачення майбутнього!"

### Air Tree ###
 PHI_found_a_philippine_airforce: "Заснування Корпусу армійської авіації"
 PHI_found_a_philippine_airforce_desc: "Сучасні інновації у військовій доктрині та дослідженнях показали, що 20-те століття стане століттям повітряного бою та переваги. Натхненна зусиллями у Сполучених Штатах, Армія вирішила створити «Корпус армійської авіації», щоб розвинути ентузіазм та інтерес до національної протиповітряної оборони."

 PHI_seek_foreign_expertise: "Пошук іноземного досвіду"
 PHI_seek_foreign_expertise_desc: "Німецька імперія та Імперія Японії володіють одними з найбільш елітних розробок літаків у світі. Поряд з американськими розробками, нам важливо вчитися у найкращих під час розвитку власних повітряних сил."

 PHI_naval_air_integration: "Інтеграція військово-морських сил та авіації"
 PHI_naval_air_integration_desc: "Наслідки інтеграції сухопутних військ та авіації під час Першої світової війни показали потенціал для зв'язування військово-морських сил та повітряних сил у бою. Пікіруючі бомбардувальники військово-морських сил, оснащені торпедами, посилять зв'язки між Флотом та Корпусом авіації та дозволять нам завдавати ударів по ворожих військово-морських силах без присутності великих лінкорів та крейсерів."

 PHI_expand_air_defence_installations: "Розширення установок протиповітряної оборони"
 PHI_expand_air_defence_installations_desc: "У разі вторгнення на Філіппіни ворог, ймовірно, прагнутиме отримати контроль над нашим небом. Ми не можемо цього допустити. На головних островах необхідно встановити нові інновації та технології, такі як станції «РАДАР», а авіабази мають бути відремонтовані, щоб дозволити Корпусу авіації захищати наше небо."

 PHI_create_the_special_forces_regiment: "Створення полку спеціальних сил"
 PHI_create_the_special_forces_regiment_desc: "Європейські та американські військові доктрини інвестували в концепцію парашутистів; солдатів, які стрибають із літаків і використовують парашути для захоплення територій, недоступних іншими видами транспорту. Враховуючи відстань між островами на Філіппінах, програма навчання для створення полку спеціальних сил, присвяченого таким діям, буде життєво важливою для нашої національної оборони."

 PHI_promoting_young_aces: "Просування молодих асів"
 PHI_promoting_young_aces_desc: "Через високу глобальну напруженість очевидно, що нам, ймовірно, доведеться боротися за існування нашої нації у найближчі роки. Отже, передові лави та найкращі випускники мають бути негайно підвищені, щоб стати провідним поколінням філіппінських пілотів та асів."

 PHI_invest_in_a_domestic_aviation_industry: "Інвестування у вітчизняну авіаційну промисловість"
 PHI_invest_in_a_domestic_aviation_industry_desc: "Вітчизняна авіаційна промисловість на Філіппінах невелика для країни в Азії і мізерна порівняно із західними стандартами. З огляду на загрозу конфлікту, яка постійно наближається, ми повинні прагнути модернізувати та розвивати вітчизняну авіаційну промисловість."

 PHI_expand_island_airbases: "Розширення острівних авіабаз"
 PHI_expand_island_airbases_desc: "Щоб розширити оборону островів, особливо для авіації, ми розпочали амбітну програму з ремонту та розвитку нових аеродромів, таких як «Дель Кармен», «Кларк», «Іба», «Дель Монте», «Батаан» та «Ніколс»."

 PHI_create_the_bomber_wing: "Створення бомбардувального крила"
 PHI_create_the_bomber_wing_desc: "Натхнений європейськими доктринами стратегічного знищення та інтеграції сухопутних сил та авіації, «Корпус армійської авіації» дозволив створення програми, присвяченої навчанню пілотів для виконання місій бомбардування, щоб вражати потенційні ворожі наземні чи військово-морські сили з неба."

 PHI_guardians_of_our_precious_skies: "Охоронці нашого дорогоцінного неба"
 PHI_guardians_of_our_precious_skies_desc: "Завдяки значній модернізації та розвитку «Корпус армійської авіації» значно виріс і тепер став Філіппінськими повітряними силами. Як охоронці нашого дорогоцінного неба, вони будуть нашим авангардом у захисті нашого острова згори."

 #### - Econ Tree - #####
  ### Black Monday ###

 PHI_convene_the_national_economic_council: "Скликання Національної економічної ради"
 PHI_convene_the_national_economic_council_desc: "Одне з найперших творінь нового уряду Співдружності, Національна економічна рада, об'єднує державних службовців, промисловців, фінансистів і технократів для консультування Президента з економічних питань. Вони мають досвід для розробки та рекомендації плану дій для подолання кризи, що розгортається."

 PHI_import_relief_rice: "Імпорт допоміжного рису"
 PHI_import_relief_rice_desc: "Для переважної більшості філіппінців, чи зможуть вони дозволити собі достатньо рису для задоволення своїх потреб, є постійною частиною їхнього повсякденного життя. Оскільки наше сільське господарство перейшло до вирощування товарних культур, виробництво основних культур скоротилося, і у важкі часи це призводить до зростання цін. Наш уряд оплатить імпортний рис, щоб утримати ціну на цей основний продукт."

 PHI_halt_immigration: "Призупинення імміграції"
 PHI_halt_immigration_desc: "Китайці давно домінують у комерційному житті цієї країни і мають велику присутність у багатьох міських галузях торгівлі. Ставлення людей до цих іноземних конкурентів уже погане за звичайних обставин, але в умовах депресії воно стає відверто ворожим. На деякий час ми призупинимо будь-яку подальшу імміграцію з материкового Китаю. Народ підтримає уряд, який піклується про своїх."

 PHI_cut_bureaucratic_expenses: "Скорочення бюрократичних витрат"
 PHI_cut_bureaucratic_expenses_desc: "Оскільки наші доходи стрімко падають, нам доведеться десь скоротити наші витрати. Державна служба є головним роботодавцем для освічених філіппінців, які прагнуть кар'єрного зростання, а також була простим способом розподілу патронажу. Однак зараз нам доведеться економити в наших департаментах, скорочуючи непотрібний персонал та знижуючи заробітну плату."

 PHI_revive_the_cedula: "Відновлення цедули"
 PHI_revive_the_cedula_desc: "За старих іспанських часів цедула, податок на проживання, який сплачували всі дорослі тубільці і який фактично був подушним податком, була ненависним символом гноблення. Фактично, «Крик Пугад-Лавіна», коли члени Катіпунану розірвали свої цедули, ознаменував початок революції. Нині ж потреби сучасної держави вимагають більших податкових надходжень. Усі дорослі будуть зобов'язані сплачувати своїм муніципалітетам податок у розмірі п'ятдесяти сентаво, за що вони отримають довідку про проживання."

 PHI_form_the_nepa: "Національна асоціація економічного захисту"
 PHI_form_the_nepa_desc: "Це скандал і обурливо, що значна частина економічного життя Філіппін, від купців до споживчих товарів, залишається в руках іноземців. Національна асоціація економічного захисту була сформована з відомих бізнесменів та громадських лідерів і очолить кампанію із закликом до народу «купувати філіппінське»."

 PHI_key_to_economic_nationalism: "Ключ до економічного націоналізму"
 PHI_key_to_economic_nationalism_desc: "Десятиліттями лідери Філіппін говорили про націоналізм та наші національні прагнення. Ми працювали над незалежністю та розвитком політичних інститутів, але націоналізм — це не лише це. Щоб стати справді незалежною нацією, ми повинні затвердити контроль над нашою внутрішньою торгівлею та комерцією і накопичити власне філіппінське багатство."

 ### Agriculture ###
 PHI_improve_internal_transport: "Покращення внутрішнього транспорту"
 PHI_improve_internal_transport_desc: "У такій сільськогосподарській економіці, що розвивається, як наша, високі транспортні витрати є однією з найбільших перешкод на шляху до економічного розвитку. Є дороги, які потребують покращення, залізниці, які потребують розширення, річки, які потребують поглиблення, та причали, які потребують будівництва. Покращення нашої транспортної мережі, чи то сушею, чи водою, дозволить нашим фермерам швидше та ефективніше доставляти свої товари на ринок."

 PHI_encourage_crop_diversification: "Заохочення диверсифікації культур"
 PHI_encourage_crop_diversification_desc: "Оскільки Філіппіни інтегрувалися у світову економіку, вони стали все більше залежними від обмеженої кількості товарних культур. Це має як переваги, так і недоліки. Монокультури більш чутливі до неврожаю та хвороб, а залежність від одного продукту завдає шкоди фермерам, коли ціни падають. Заохочення диверсифікації культур збагатить наш ґрунт і забезпечить фермерам більш різноманітне джерело доходу."

 PHI_redistribute_large_estates: "Перерозподіл великих маєтків"
 PHI_redistribute_large_estates_desc: "Споконвіку право власності на землю було зосереджено в руках еліти. Американці доклали деяких зусиль, щоб розділити маєтки ченців, але не пішли далі цього. Уряд викупить землю у власників за справедливою ціною, розділить її на ділянки та розподілить безземельним з метою збільшення чисельності дрібних власників."

 PHI_internal_colonisation_of_Mindanao: "Внутрішня колонізація Мінданао"
 PHI_internal_colonisation_of_Mindanao_desc: "Мінданао завжди був прикордонною територією, населеною мусульманами та язичниками-повстанцями, яких іспанці так і не змогли приборкати. Але спадщина американської імперії нарешті втихомирила ці народи, і сучасна філіппінська держава нарешті має владу відкрити цю велику землю. Тисячі громадян з Вісай вже вирушили на Мінданао, щоб претендувати на ділянки землі та перетворити непродуктивну пустелю на майбутній хлібний кошик Філіппін."

 PHI_cap_rents_for_sharecroppers: "Обмеження орендної плати для орендарів-часткоутримувачів"
 PHI_cap_rents_for_sharecroppers_desc: "Селянство завжди було пов'язане із землевласниками через борги, але останніми роками ситуація погіршується. Модернізація сільської економіки поглибила заборгованість орендарів до такої міри, що вони не можуть дозволити собі навіть тижневого запасу рису для своєї родини. Селяни не вимагають багато, і будуть значною мірою задоволені, якщо ми обмежимо, скільки можуть вимагати від них землевласники, і заохотимо прощення боргів у важкі часи."

 PHI_import_farming_machinery: "Імпорт сільськогосподарської техніки"
 PHI_import_farming_machinery_desc: "Колись людині, плугу та карабао було достатньо для ведення фермерського господарства. І цього може бути достатньо для дрібних фермерів, але великі землевласники знають про революцію в сільському господарстві, що відбувається в індустріалізованих країнах: автомобільні трактори, механічні лущилки та інші геніальні пристрої. Якщо філіппінське сільське господарство хоче залишатися конкурентоспроможним у цьому мінливому світі, йому потрібно буде замінити людську силу на машинну."

 PHI_expand_the_sugar_centrals: "Розширення цукрових центрів"
 PHI_expand_the_sugar_centrals_desc: "Цукрова тростина культивується в багатьох маєтках, розкиданих по островах, але рафінування цукру є інтенсивним та дорогим процесом, особливо з новим відцентровим методом. Ось чому зростає тенденція до об'єднання виробників цукру для фінансування великих централізованих цукрових центрів для переробки врожаю. Якщо ми хочемо продовжувати розширювати виробництво нашого експорту номер один, ми повинні заохочувати продовження цієї тенденції."

 PHI_agricultural_and_industrial_bank: "Сільськогосподарський та промисловий банк"
 PHI_agricultural_and_industrial_bank_desc: "Наші фермери добре знають перешкоди, що стоять перед нашим сільськогосподарським сектором, а також знають багато можливих рішень, але не вистачає засобів. Нічого не можна зробити без капіталу, а в такій нерозвиненій, колоніальній економіці, як Філіппіни, капіталу бракує. Уряд заснує Сільськогосподарський та промисловий банк з прямою метою надання позик великим сільськогосподарським підприємствам."

 ### Industry ###
 PHI_domestic_textile_production: "Внутрішнє виробництво текстилю"
 PHI_domestic_textile_production_desc: "На сьогоднішній день текстиль є найважливішим промисловим товаром для пересічного філіппінця. Імпорт дешевих масово вироблених тканин з-за кордону вже давно призвів до фактичного вимирання старої кустарної промисловості ткачів. Однак створення внутрішньої текстильної промисловості є тією легкою промисловістю, яка нам під силу. Буде відкрито державну текстильну фабрику, що зменшить нашу залежність від імпорту для наших потреб в одязі."

 PHI_build_fertilizer_plants: "Будівництво заводів з виробництва добрив"
 PHI_build_fertilizer_plants_desc: "Якщо ми маємо розпочати розвиток хімічної промисловості, має сенс почати з продуктів для сільськогосподарського застосування. Сульфат амонію є найдешевшим і найпростішим у виробництві азотним добривом. Він може бути менш потужним, ніж більшість добрив, але його застосування все одно дасть значні результати для продуктивності наших ферм."

 PHI_encourage_native_retailers: "Заохочення місцевих роздрібних торговців"
 PHI_encourage_native_retailers_desc: "Філіппінська комерція, від великих складів Маніли до маленьких магазинів у кожному **барангаї**, перебуває під домінуванням китайців. Немає жодної причини, чому корінні філіппінці не повинні мати змоги порушити цю монополію та самі стати власниками магазинів. Якщо ми відкриємо кредитні лінії для тих громадян, які зацікавлені у започаткуванні роздрібної торгівлі, вони зможуть легше конкурувати з цими іноземцями."

 PHI_expand_the_electrical_grid: "Розширення електричної мережі"
 PHI_expand_the_electrical_grid_desc: "Манільська електрична компанія була однією з головних рушійних сил модернізації столиці, забезпечуючи електроенергією транспорт, телекомунікації та побутове використання. Якщо очікується, що країна стане справді сучасною, електроенергія повинна охопити якомога більше людей. Електрична мережа вийде за межі Маніли до внутрішніх районів Лусона, а інші будуть побудовані на віддалених островах."

 PHI_protect_small_industries: "Захист малих підприємств"
 PHI_protect_small_industries_desc: "У боротьбі за заміщення імпорту важливі не лише великі підприємства. Сотні малих фабрик та майстерень, які займаються всім: від прядіння бавовни до виготовлення мила та консервування харчових продуктів, також є ключовими для розвитку нашого внутрішнього виробництва. Ми ухвалимо закони для захисту цих малих підприємств, як за продукцію, яку вони надають, так і за можливості працевлаштування."

 PHI_la_union_cement_plant: "Цементний завод Ла-Уніон"
 PHI_la_union_cement_plant_desc: "Будівництво сучасних будівель, доріг та портових споруд ґрунтується на сучасних матеріалах, головним з яких є цемент. Національна компанія розвитку вже досягла успіху у створенні цементного заводу на набережній Себу через свою дочірню компанію, і цю модель можна повторити в інших регіонах. Північний Лусон буде наступною зоною нашого будівельного фокусу."

 PHI_national_trading_corporation: "Національна торгова корпорація"
 PHI_national_trading_corporation_desc: "У міру зростання світової напруженості світова економіка зазнає ударів. Великі силові блоки, під тиском економічної депресії та побоюючись один одного, відгороджуються, і вільний потік товарів обмежується. Для безпеки Філіппін необхідно, щоб уряд міг забезпечити закупівлю та накопичення певних критично важливих товарів та ресурсів. Буде створено державну корпорацію з метою здійснення цього."

 PHI_establish_the_bangko_sentral_ng_pilipinas: "Створення Bangko Sentral ng Pilipinas"
 PHI_establish_the_bangko_sentral_ng_pilipinas_desc: "У 1916 році Філіппінський національний банк був заснований з мажоритарною державною власністю. Хоча спочатку він був визнаний успішним, він майже став неплатоспроможним під час післявоєнного спаду. Але тепер, коли **песо** від’єднано від долара Сполучених Штатів, необхідність стабільності валюти відродила ідею створення справжнього центрального банку. Рада центрального банку вже скликана для підготовки статуту."

 ### Mining ###
 PHI_expand_zamboanga_plantations: "Розширення плантацій Замбоанги"
 PHI_expand_zamboanga_plantations_desc: "Півострів Замбоанга є найбільш розвиненою частиною Мінданао і вже культивує невелику кількість каучукових дерев. Немає жодної причини, чому ми не зможемо розширити виробництво цієї культури, щоб конкурувати з плантаціями в Малаї, особливо коли кліматичні та ґрунтові умови практично однакові. Експерти вважають, що попит на цей критично важливий ресурс неминуче зросте."

 PHI_exploit_zambales_chromium: "Експлуатація хроміту Замбалеса"
 PHI_exploit_zambales_chromium_desc: "Нещодавня розробка гальванічного покриття значно розширила застосування хрому в металургійній промисловості, і на Філіппінах просто так є одні з найбільших нерозвіданих запасів. До цього часу його основним споживачем були Сполучені Штати, але оскільки наша економіка стає менш прив'язаною до Америки, ми зможемо вільно продавати цей ресурс на світовому ринку."

 PHI_small_scale_gold_mining: "Заохочення дрібномасштабного видобутку золота"
 PHI_small_scale_gold_mining_desc: "Видобуток золота здавна був важливою діяльністю на Філіппінах, що сягає доколоніальних часів. У світі, де багато країн все ще дотримуються золотого стандарту, попит на золото ніколи не був таким великим. Більшість нашого золота видобувається дрібними шахтарями, які використовують відносно примітивні технології. Це може бути важка і нездорова робота, але вона забезпечує їм гідний рівень життя, і тому не повинна бути під загрозою."

 PHI_roads_in_the_cordillera: "Дороги в Кордильєрах"
 PHI_roads_in_the_cordillera_desc: "Попри те, що Кордильєри Лусона містять велику кількість багатств у вигляді нерозвіданих корисних копалин та високоякісної тропічної деревини, вони є найбільш нерозвиненою частиною країни, населеною майже неконтактними племенами, які досі сповідують народні релігії. Американці вже почали відкривати цей регіон будівництвом дороги Багіо; ми можемо завершити те, що вони почали."

 PHI_develop_domestic_coalfields: "Розвиток вітчизняних вугільних родовищ"
 PHI_develop_domestic_coalfields_desc: "Жоден мінеральний ресурс не є настільки широко корисним, як вугілля, для виробництва електроенергії, у побутовому опаленні, у транспорті та промисловості. Національна вугільна корпорація працює над тим, щоб Філіппіни стали самодостатніми у забезпеченні своїх потреб. Більші інвестиції у вугільні родовища Сібугей та Компостела наблизять нас до цієї мети."

 PHI_surigao_iron_deposits: "Залізорудні родовища Сурігао"
 PHI_surigao_iron_deposits_desc: "Розвиток власної важкої промисловості є спокусливим, але поки що це має залишатися віддаленою мрією. Звісно, це не означає, що наші запаси заліза повинні простоювати. На Тихому океані є багато ринків, які будуть зацікавлені у придбанні нашого заліза для своєї промисловості, і ми повинні забезпечити, щоб наші гірничодобувні підприємства мали капітал для виробництва за конкурентними цінами."

 PHI_electrify_the_manila_railroad: "Електрифікація залізниці Маніли"
 PHI_electrify_the_manila_railroad_desc: "Залізнична компанія Маніли була одним із найуспішніших підприємств індустріальної епохи. Вона зросла до понад тисячі кілометрів колії, з'єднавши Манілу з Сан-Фернандо на півночі та Легаспі на півдні, значно покращивши перевезення людей та вантажів. Настав час зробити наступний крок та підвищити ефективність шляхом електрифікації існуючих колій."

 PHI_copper_capital_of_the_east: "Мідна столиця Сходу"
 PHI_copper_capital_of_the_east_desc: "Мідь — набагато більш рідкісний метал, ніж багато хто уявляє, але вона незамінна для виробництва електричного дроту та інших важливих товарів. Маючи найбільші підтверджені запаси міді в Тихоокеанському регіоні, ми вже налагодили жваву торгівлю з експорту мідної руди до різних країн. Необхідно збільшити інвестиції в цю галузь, щоб зберегти нашу перевагу."

