### Bookmark ###
 PHI_KR_gathering_storm_desc: "Недовготривала незалежність Першої Філіппінської республіки була жорстоко придушена, коли Паризький договір 1898 року офіційно визнав анексію острівного архіпелагу Сполученими Штатами Америки. Філіппінами почав керувати американський «Острівний уряд», який поступово делегував повноваження філіппінським політикам і готував їх до можливості незалежності. Мануель Кесон та його «Націоналістична партія», попри заклики до негайної незалежності, виявилися прагматичними партнерами американської адміністрації. Але оскільки США мчать до конфлікту, незалежність може настати швидше, ніж очікувалося..."

 ### Intro Screen ###
 PHI_country_intro_background: "GFX_PHI_intro"
 PHI_country_intro_header: "Шлях до незалежності"
 PHI_country_intro_content: "Після століть іспанського панування Філіппіни розпочали відкрите повстання в 1896 році під проводом революційного таємного товариства «Катіпунан». Через рік революціонери проголосили першу республіку сучасної Азії. Успіх тривав недовго, оскільки іспанський контрнаступ змусив революційний уряд тікати. Іспансько-американська війна знищила іспанську владу на Філіппінах, але незабаром стало зрозуміло, що Сполучені Штати також не дозволять існувати незалежній філіппінській державі. Так почалася Філіппінсько-американська війна, яка швидко переросла у партизанську, коли американці розширили свій контроль над країною. До 1902 року війну було офіційно оголошено завершеною після поразки основних націоналістичних сил, і Філіппіни стали територією США.\n\nНаціональна боротьба перейшла з військової сфери в політичну. Філіппінський органічний акт 1902 року передбачав створення виборної асамблеї при Острівному уряді, і перші вибори відбулися в 1907 році. На них переконливо перемогла «Націоналістична партія» Мануеля Кесона та Серхіо Осменьї, яка закликала до «негайної та безумовної незалежності». Самоуправління було додатково посилено законом Джонса 1916 року, який замінив невиборну Філіппінську комісію Сенатом. Після багатьох років лобіювання та кампаній філіппінські представники нарешті змусили Конгрес США ухвалити Закон Тайдінгса-Макдаффі, який перетворив територію на Співдружність Філіппін, встановив повне самоврядування у внутрішніх справах та визначив дату повної незалежності Філіппін на десять років у майбутньому.\n\nПерші президентські вибори впевнено виграли Мануель Кесон і Серхіо Осменья, які стали президентом і віцепрезидентом відповідно. «Націоналістична партія» контролювала законодавчий орган протягом усього свого існування і наразі має непохитну перевагу над політичним життям країни. Основна опозиція, «Демократична партія», намагалася похитнути позиції націоналістів. Оскільки Філіппіни зараз перебувають під президентською системою правління, демократам чи іншому потенційному опозиційному руху доведеться чекати наступних президентських виборів, щоб отримати шанс на владу. Наразі Кесон і націоналісти можуть докладати зусиль для розбудови нації, стримуючи селянські заворушення та зароджуваний синдикалістський рух. Уся ця стабільність, звісно, гарантована постійним контролем Сполучених Штатів над обороною та зовнішньою політикою країни."

 PHI_guide: "§MПеремога Мануеля Кесона на виборах 1939 року§! ($market_liberal_coloured$)\n£white_dot Збережіть баланс сил у межах $PHI_bop_elitist_tensions$ або $PHI_bop_populist_tensions$ до часу проведення Філіппінських виборів 1939 року.\n£white_dot Серхіо Осменья ($market_liberal_coloured$) переможе на наступних президентських виборах 1943 року.\n\n§MПеремога Мануеля Рохаса на виборах 1939 року§! ($authoritarian_democrat_coloured$)\n£white_dot Збережіть баланс сил у межах $PHI_bop_elitist_agitation$ або $PHI_bop_elitist_outage$ до часу проведення Філіппінських виборів 1939 року.\n\n§MПеремога Еміліо Агінальдо на виборах 1939 року§! ($authoritarian_democrat_coloured$)\n£white_dot Збережіть баланс сил у межах $PHI_bop_populist_agitation$ або $PHI_bop_populist_outrage$ до часу проведення Філіппінських виборів 1939 року.\n£white_dot Переконайтеся, що §jJapan§! має найбільший вплив у Боротьбі за Філіппіни до часу проведення Філіппінських виборів 1939 року.\n\n§MПеремога Кларо Ректо на виборах 1939 року§! ($social_liberal_coloured$)\n£white_dot Збережіть баланс сил у межах $PHI_bop_populist_agitation$ або $PHI_bop_populist_outrage$ до часу проведення Філіппінських виборів 1939 року.\n£white_dot Переконайтеся, що §gGermany§! має найбільший вплив у Боротьбі за Філіппіни до часу проведення Філіппінських виборів 1939 року.\n\n§MКрісанто Евангеліста розпочинає Соціалістичну революцію§! ($syndicalist_coloured$)\n£white_dot Збережіть баланс сил у межах $PHI_bop_populist_agitation$ або $PHI_bop_populist_outrage$ до часу проведення Філіппінських виборів 1939 року.\n£white_dot Переконайтеся, що ані §jJapan§!, ані §gGermany§! не має найбільшого впливу в Боротьбі за Філіппіни до часу проведення Філіппінських виборів 1939 року."

