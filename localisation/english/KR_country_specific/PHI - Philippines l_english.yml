 PHI_USA_winner_exists_key: "Кінець Громадянської війни в Америці відновив американські інтереси в Тихому океані. Якщо Америка матиме найбільший вплив на Філіппінах і обидві нації матимуть схожі погляди, будуть укладені взаємні угоди, і ми зможемо приєднатися до їхньої фракції."

 PHI_no_USA_winner_exists_key: "Громадянська війна в Америці підірвала американські інтереси в Тихому океані. Якщо війна закінчиться до виборів 1939 року, є ймовірність, що вони зможуть приєднатися до Боротьби за Філіппіни."

 PHI_election_in_180_days_mission_timer: "Майбутні Філіппінські вибори"
 PHI_election_in_180_days_mission_timer_desc: "Після проголошення Республіки між філіппінським політичним істеблішментом та Президентом Кесоном було досягнуто компромісу. Як і обіцяно, у вересні 1939 року мають відбутися нові президентські вибори зі значними наслідками як для острівної нації, так і для її сусідів."

 PHI_election_in_180_days_dummy_mission_timer: "Майбутні Філіппінські вибори"
 PHI_election_in_180_days_dummy_mission_timer_desc: "Після проголошення Республіки між філіппінським політичним істеблішментом та Президентом Кесоном було досягнуто компромісу. Як і обіцяно, у вересні 1939 року мають відбутися нові президентські вибори зі значними наслідками як для острівної нації, так і для її сусідів."

 GEA_military_coordination_with_the_philippines: "Військова координація з Філіппінами"
 GEA_military_coordination_with_the_philippines_desc: "Тихий океан є пороховою бочкою, де проводяться лінії між німецькими та японськими інтересами. Уряд Філіппін, перш за все, відчайдушно потребує безпеки на тлі краху Сполучених Штатів і постійно зростаючої напруженості в регіоні. Демонстрація нашої здатності захистити острови має вирішальне значення для схиляння їх на наш бік."
 GEA_political_negotiations_with_the_philippines: "Політичні переговори з Філіппінами"
 GEA_political_negotiations_with_the_philippines_desc: "Стара добра дипломатія дуже допомагає у залученні іноземних націй на наш бік. Звісно, ми навряд чи обмежуємося офіційними чи навіть законними політичними каналами — деякі закулісні угоди, вміло розміщений хабар та випадковий шантаж можуть схилити шальки терезів на нашу користь."
 GEA_sabotage_japanese_influence: "Саботаж японського впливу"
 GEA_sabotage_japanese_influence_desc: "Зрештою, іноді правильним курсом дій є відмова від більшої перемоги на користь більш реалістичної. Оскільки вплив нашого суперника постійно випереджає наш, можливо, краще вибрати менше з двох зол і потягнути їх за собою, сподіваючись, що нейтральні Філіппіни для нас кращі, ніж ворожі."
 GEA_encourage_an_open_door_in_the_philippines: "Заохочення відкритих дверей на Філіппінах"
 GEA_encourage_an_open_door_in_the_philippines_desc: "В адміністрації Маніли та серед широкої громадськості існує велике занепокоєння щодо іноземного втручання в їхню новостворену «незалежну» націю. Для нас важливо відкрити двері для іноземного впливу, навіть якщо це означає, що наші суперники можуть отримати перевагу над нами в короткостроковій перспективі."
 GEA_economic_aid_package_to_the_philippines: "Пакет економічної допомоги Філіппінам"
 GEA_economic_aid_package_to_the_philippines_desc: "Філіппінські острови гостро потребують іноземних інвестицій, щоб вивести свій народ із бруду Великої депресії та Чорного понеділка. Пакет екстреної допомоги, хоч і дорогий, принесе їм набагато більше користі, ніж обійдеться нам, і значно зміцнить наш вплив у регіоні."
 GEA_arms_shipments_to_the_philippines: "Постачання зброї"
 GEA_arms_shipments_to_the_philippines_desc: "Філіппінська армія — це надзвичайно молода установа, вперше затверджена у грудні 1935 року і побудована на невеликому ядрі ветеранів Філіппінської констебларії та Філіппінських скаутів. З обмеженою здатністю виробляти власне озброєння та інфраструктурою для підготовки сил, необхідних для захисту їхньої нової республіки, наша допомога у розвитку їхніх військових матиме велике значення для зміцнення нашої дружби та підготовки їх до майбутніх воєн."

