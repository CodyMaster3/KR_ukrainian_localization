########################################

 PHI_join_internationale: "Приєднатися до Інтернаціоналу"
 PHI_join_internationale_desc: "Як революційні товариші, ми повинні об'єднатися проти сил капіталізму та імперіалізму, демонструючи солідарність трудящих проти тих, хто їх гнобить!"

 PHI_fight_for_the_philippines_decision_cat: "Боротьба за Філіппіни"
 PHI_fight_for_the_philippines_decision_tt: "Друга громадянська війна в Америці змусила американців відступити через Тихий океан, зруйнувавши їхній колоніальний вплив на Філіппінах і залишивши вакуум влади в регіоні. Перебуваючи на життєво важливій позиції в Тихому океані, розпочалася гонка за забезпеченням Маніли, в якій німецькі та японські представники метушаться, щоб підкупити політиків, вмовити військових офіцерів та вплинути на громадську думку на користь Пакту та Сфери. Багато філіппінців не хочуть приєднувати свою націю до іноземної сфери, але з наближенням можливої війни доведеться зробити вибір.\n\nСторона, яка матиме найбільший вплив на час проведення §YФіліппінських виборів у вересні 1939 року§!, побачить, що Філіппіни приєднаються до їхньої фракції. В іншому випадку, Філіппіни залишаться неприєднаними.\n\n[PHI_fight_for_philippines_decision_cat_scripted_loc]"

 PHI_pie_chart_title: "Вплив"
