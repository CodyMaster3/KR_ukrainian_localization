#- Section 1: Political Events -#

## Section 1a - Quezon's First Term (1936-1939)
 #Initial Black Monday Chain (000-019)
 philippines_political_events.001.t: "Чорний понеділок вражає Філіппіни"
 philippines_political_events.001.d: "Філіппіни є острівною країною в багатьох сенсах. Під американським правлінням країні лише повільно дозволяли утверджувати свої прагнення, залишаючись прив'язаною до метрополії для забезпечення своєї безпеки та економічного життя. Водночас, постійне правління Націоналістичної партії сприяло атмосфері стабільності. Економіка країни залишається прив'язаною до Сполучених Штатів, головного ринку як експорту, так і імпорту, та кінцевого авторитета її торговельної політики.\n\nНовина про Чорний понеділок не одразу сколихнула Манілу, оскільки економічні зв'язки країни з німецькою сферою є досить скромними. Але коли з'явилася новина про те, що економічна криза поширилася на Сполучені Штати, стало зрозуміло, що це лише питання часу, коли потрясіння відчуються на Філіппінах. З економікою, заснованою на експорті товарних культур, таких як цукор, абака, кокосові продукти та тютюн, Філіппіни тісно пов'язані зі США, і поглиблення депресії там, безсумнівно, призведе до падіння торговельних доходів.\n\nЯк колоніальний суб'єкт, філіппінський уряд може небагато зробити, щоб протистояти кризі. Проте він не є безпорадним. В умовах майже гарантованого падіння експортних надходжень існують способи компенсувати різницю. Скорочення витрат та підвищення певних податків допоможе тримати бюджет під контролем. Водночас, необхідно вжити заходів для того, щоб простий народ не був доведений до бідності та голоду."
 philippines_political_events.001.a: "Ми готові до виклику."

 philippines_political_events.002.t: "Філіппінська політична сцена"
 philippines_political_events.002.d: "Націоналістична партія є домінуючою силою у філіппінській політиці з перших виборів, проведених у 1907 році. Її первісна платформа була простою: негайна незалежність від Сполучених Штатів. Подальша історія виявилася набагато складнішою, оскільки лідери націоналістів часто змінювали позиції щодо умов та термінів незалежності під час переговорів з американською владою. Однак, нарешті, було досягнуто часового графіку для можливої повної незалежності, і націоналісти можуть стверджувати, що вони виконали обіцянку назви своєї партії.\n\nХоча Філіппіни можуть бути ліберальною демократією на папері, їхня політична культура залишає бажати кращого. У країні, де більшість населення відчайдушно бідна і не має значної освіти, у політиці домінують місцеві еліти, відомі як касики. Касики формують альянси через взаємні інтереси та сімейні зв’язки та здійснюють свій вплив через розподіл патронажу. Політичний успіх здобувають ті, хто найкраще грає в цій корумпованій системі, і ніхто не робить цього краще, ніж лідер націоналістів і нинішній Президент Мануель Кесон.\n\nЦе не означає, що філіппінська демократія є тотальною фікцією. Думка мас все ще має значення, і коли їхнє невдоволення досягає точки кипіння, це може похитнути корабель держави. Успіх Кесона походить не лише від його стосунків з елітою країни, але й від його здатності переконати пересічних філіппінців, що він також є захисником простого народу. Під розпливчастим гаслом соціальної справедливості Кесон проводить квазіпопулістську політику. Хоча критики Кесона можуть справедливо стверджувати, що він більше говорить, ніж робить, обмежені соціальні програми його президентства здобули Кесону значну популярність."
 philippines_political_events.002.a: "Чи може Кесон справді правити вічно?"

 philippines_political_events.003.t: "Потенційні претенденти"
 philippines_political_events.003.d: "З балкона палацу Малаканьян Кесон може по праву почуватися впевнено у своєму становищі на вершині Філіппін. Тобто, поки події продовжуватимуться більш-менш за тією ж траєкторією. Кесону зрештою доведеться зіткнутися з новими виборами, і багато що може статися за три роки.\n\nПроте на цей момент незрозуміло, хто міг би протистояти Кесону. Найімовірніші кандидати можуть походити з Партії демократів. Назавжди застрягла в опозиції та намагаючись визначити себе як більше, ніж просто «не-націоналісти», партія незабаром муситиме обрати: або згуртуватися навколо ідеалістичного Кларо М. Ректо, який обіцяє змінити політику на краще, або старого революціонера Еміліо Агінальдо, дедалі голоснішого критика уряду, який може використати свою особисту популярність та націоналістичні повноваження для боротьби за президентство.\n\nВодночас серед філіппінських робітників та селян продовжують зростати синдикалістські настрої. Спрямовані в радикальну Партію робітників, соціалісти черпають натхнення у Третьому Інтернаціоналі та мріють про революцію. Мало ймовірності, що вони коли-небудь виграють президентські вибори, але якщо вони будуть достатньо сильними, вони можуть спробувати дестабілізувати Республіку.\n\nОднак справжня загроза владі Кесона походить не ззовні, а зсередини. Серед націоналістів немає нестачі у високоамбітних діячах, які можуть заявляти про лояльність до Президента, але охоче схоплять корону, якщо їм її запропонують. Успіх та популярність Кесона наразі придушили будь-яких претендентів, але якщо Президент оступиться, він може виявити, що його власна партія повстає проти нього."
 philippines_political_events.003.a: "У політиці все залежить від того, кого ти знаєш."
 philippines_political_events.003.b: "Майбутнє Філіппін залежить від народу."

 philippines_political_events.004.t: "Еліти розгнівані"
 philippines_political_events.004.d: "На Філіппінах відбуваються великі зміни. Гучні заяви президента Кесона про соціальну справедливість були не просто риторикою, а справді провістили прихід адміністрації, яка більше зосереджена на реалізації конкретних реформ для мас. Кесон завжди насолоджувався прихильністю народу, і його особиста популярність ніколи не була вищою. Звіти з провінцій розповідають історії про селянські групи зі зменшенням відвідуваності, оскільки орендарі протиставляють закликам агітаторів відповідь, що Президент це виправить.\nЗадоволення народу — це добре і приємно, але це має свою ціну. Місцеві еліти відчувають, що їхній вплив слабшає, оскільки нижчі класи звертаються до центрального уряду за безпекою та винагородою. Це невдоволення просочується до столиці, оскільки конгресмени-націоналісти тихо незадоволені популістським курсом Кесона. Хоча про це не говорять самому Президенту, ходять чутки про зародження партійного повстання, щоб кинути виклик Кесону на наступних виборах. Також подейкують, що іноземні держави стежать за цими подіями, бачачи в претенденті на місце Кесона можливість розширити свій вплив."
 philippines_political_events.004.a: "Президент вирішує!"
 philippines_political_events.004.b: "Не хвилюйтеся, Кесон не забув своїх найвірніших благодійників."

 philippines_political_events.005.t: "Популісти розгнівані"
 philippines_political_events.005.d: "Не варто очікувати надто багато від демократії на Філіппінах, добре відомої своєю корупцією та клієнтелізмом. Проте дивує, наскільки відверто цинічною була адміністрація Кесона. Люди сміються з розмов про соціальну справедливість, оскільки нижчі класи залишаються загрузлими в бідності. Тим часом державна щедрість стікає до місцевих еліт, які підтримують роботу політичного механізму. Націоналістична партія відмовилася від будь-якого фракціонізму і вірно стоїть за Кесоном.\nМожливо, однак, націоналісти надто впевнені у своєму становищі. Звикнувши керувати без ефективної опозиції, вони можуть не помічати її зростання прямо під носом. Партія демократів під керівництвом Кларо Ректо намагається скористатися невдоволенням з несподіваним успіхом. Водночас старий революціонер Еміліо Агінальдо, популіст, якщо такий коли-небудь існував, роздумує про балотування на пост президента на наступних виборах. Найбільше занепокоєння викликає зростання радикально-синдикалістської Партії робітників, яка мислить не категоріями виборів, а категоріями революції. Також подейкують, що іноземні держави стежать за цими подіями, бачачи в претенденті на місце Кесона можливість розширити свій вплив."
 philippines_political_events.005.a: "Наше становище непохитне!"
 philippines_political_events.005.b: "Можливо, нам варто кинути масам кістку."

 #American Civil War Chain (020-039)
 philippines_political_events.020.t: "Проголошення Республіки"
 philippines_political_events.020.d: "У разючому повороті подій у Сполучених Штатах Америки спалахнула громадянська війна, і їхнє проєктування влади в Тихому океані зникло за одну ніч. Зв'язок із Вашингтоном обірвався, і Американський Верховний комісар повністю розгублений, не знає, що робити. О 9-й годині ранку сьогодні Президент Кесон за підтримки свого кабінету та Філіппінського Конгресу проголосив Другу Філіппінську Республіку перед натовпом, що вітав його у палаці Малаканьян.\n\nПопри все загальне святкування, знадобиться трохи часу, щоб відчути повний ефект цього моменту. Політичне домінування Кесона та Націоналістичної партії було нерозривно пов'язане з боротьбою Філіппін за незалежність, і тепер, коли Сполучені Штати зійшли зі сцени, ландшафт змінився. Найбільш значущою є нещодавня зміна до Конституції, в якій Кесон проштовхнув поправку, що скорочує президентський термін із шести до чотирьох років, але дає йому можливість домагатися ще одного терміну. Це означає, що наступні президентські вибори відбудуться вже у 1939 році, і хто буде опонентом Кесона, ще належить з'ясувати.\n\nНаразі завдання полягає в тому, щоб з'ясувати, що робити з американцями, які залишилися. Хоча вони масово виїжджали з країни протягом останніх кількох місяців, багато хто залишається, включно з американськими солдатами, які охороняють свої військові бази, які, як виявилося, наповнені дуже цінним обладнанням. Без уряду, який би їх підтримував, вони перебувають у владі будь-якого нашого рішення."
 philippines_political_events.020.a: "Ці гвинтівки та джипи — невелика ціна за окупацію."
 philippines_political_events.020.b: "Накажіть їм відійти, але залиште їм їхнє майно."

 #Fight for the Philippines Events (040-059)
 philippines_political_events.040.t: "Боротьба за Філіппіни"
 philippines_political_events.040.d.body: "Ще зовсім недавно Філіппіни були цитаделлю Сполучених Штатів у Західному Тихому океані. Цей статус-кво раптово зник. Після виведення американських військових кораблів та солдатів через спалах Громадянської війни в Америці Філіппіни проголосили себе незалежною республікою. Водночас вони ніколи не перебували у більш хисткому становищі. Сполучені Штати були головним стримуючим фактором для протиборчих задумів Японії та Німеччини в регіоні, і з їхнім відходом суперництво двох держав знову спалахнуло. Філіппіни розташовані на життєво важливому місці між Токіо та Сінгапуром, і їхня вірність готова до завоювання. Вже зараз до Маніли вирушили дипломатичні та економічні місії, сподіваючись завоювати прихильність нової азійської республіки."
 philippines_political_events.040.d.PHI: "$philippines_political_events.040.d.body$\n\nДля Філіппін ця ситуація являє собою як можливість, так і ризик. Приєднання до однієї зі сторін надає переваги, але також заробить ворожнечу її супротивника. Дехто схиляється до Японії, з її баченням Пан-азійської співпраці та кінця західного імперіалізму. Інші вказують на Німеччину, яка все ще є гегемоном світу та охоронцем нинішнього порядку. Ще більше виступають за збереження дистанції як від Японії, так і від Німеччини, хоча за нинішніх обставин це, ймовірно, виявиться складним завданням. Немало тих, хто тихо проклинає виведення американців і сподівається, що США, колоніальний господар хоча й були, колись зможуть відновити свою силу."
 philippines_political_events.040.d.GER: "$philippines_political_events.040.d.body$\n\nФіліппіни ніколи не були в центрі уваги Німеччини. Хоча в країні присутній поважний німецький комерційний бізнес, Кайзеррайх був радий визнати гегемонію Америки над островами і зосередився на збереженні своєї азійської присутності через співпрацю з британськими та голландськими колоніальними чиновниками, одночасно встановлюючи відносини з незалежними азійськими державами, такими як Сіам та Бірма. Тепер, коли на сцені з’явилася нова азійська держава, ми можемо продовжити цю практику з новонезалежним філіппінським урядом. Хоча б для того, щоб Маніла була на нашому боці раніше, ніж у Токіо."
 philippines_political_events.040.d.JAP: "$philippines_political_events.040.d.body$\n\nФіліппіни довгий час були каменем спотикання для Японії. Вони були центром американського впливу та військової сили в регіоні, які Токіо довгий час розглядав як потенційну загрозу зростаючій могутності Японської імперії, а також як огидний прояв західного імперіалізму. З відходом американців, однак, ситуація змінилася. Філіппіни залишаються неприєднаними, але вже є великим японським торговим партнером та приймають значну японську спільноту. Альянс із Філіппінами значно розширить японську владу на південь. Хоча б для того, щоб Маніла була на нашому боці раніше, ніж у Берліна."
 philippines_political_events.040.d.USA: "$philippines_political_events.040.d.body$\n\nВихід з Філіппін став сумним днем для Сполучених Штатів. Попри те, що стосунки між двома країнами були стосунками господаря і суб'єкта, між багатьма американцями та філіппінцями існувала справжня дружба. Коли американські сили залишали країну, філіппінські лідери часто (приватно) повідомляли їм, що Філіппіни будуть відкриті для переорієнтації зі Сполученими Штатами, щойно нинішні громадянські заворушення закінчаться. Коли найгірше у війні позаду, відкривається можливість відновити нашу владу в Західному Тихому океані. Але Німеччина та Японія змагалися за вплив у Манілі, поки нас не було, і нам потрібно наздогнати — швидко."
 #These options are for the Philippines
 philippines_political_events.040.a: "Сприяти німцям."
 philippines_political_events.040.b: "Сприяти японцям."
 philippines_political_events.040.c: "Зберігати позицію нейтралітету."
 #These options are for the other tags
 philippines_political_events.040.e: "Посилити німецьке консульство в Манілі."
 philippines_political_events.040.f: "Посилити японське консульство в Манілі."
 philippines_political_events.040.g: "Повідомте їм, що американці повернулися!"
 philippines_political_events.040.h: "Зараз це не варте нашої уваги."

 philippines_political_events.045.t: "Німці залишають Манілу"
 philippines_political_events.045.d.GEA_invaded: "У раптовому повороті подій, німецьке посольство в Манілі стрімко скорочувало свій штат протягом останніх кількох тижнів. Сьогодні посол нарешті розкрив причину: Німеччина та Філіппіни тепер перебувають у стані війни. Незалежно від причини, німецькі надії на забезпечення вірності Філіппін через дипломатію повністю розвіялися — тепер Маніла буде захоплена лише силою. Для Філіппін залишається незрозумілим, чи сформується консенсус щодо того, що робити далі."
 philippines_political_events.045.d.GEA_dead: "У раптовому повороті подій Сінгапур упав — що фактично дискредитувало німецькі зусилля вплинути на Філіппіни. Німецьке посольство в Манілі вже почало скорочувати свій штат, відмовившись від надій на забезпечення Філіппін через дипломатію. На даний момент здається, що німці борються за власне виживання у Східній Азії, і їхня важко здобута імперія висить на волосині."
 philippines_political_events.045.a: "Вони більше не будуть нас турбувати."
 philippines_political_events.045.b: "Ми повернемося... колись."

 philippines_political_events.046.t: "Японці залишають Манілу"
 philippines_political_events.046.d.JAP_invaded: "У раптовому повороті подій, японське посольство в Манілі стрімко скорочувало свій штат протягом останніх кількох тижнів. Сьогодні посол нарешті розкрив причину: Японія та Філіппіни тепер перебувають у стані війни. Незалежно від причини, японські надії на забезпечення вірності Філіппін через дипломатію повністю розвіялися — тепер Маніла буде захоплена лише силою. Для Філіппін залишається незрозумілим, чи сформується консенсус щодо того, що робити далі."
 philippines_political_events.046.d.JAP_dead: "У раптовому повороті подій Тайвань упав — що фактично дискредитувало японські зусилля вплинути на Філіппіни. Японське посольство в Манілі вже почало скорочувати свій штат, відмовившись від надій на забезпечення Філіппін через дипломатію. На даний момент здається, що японці борються за власне виживання в Тихому океані, і їхня важко здобута імперія висить на волосині."
 philippines_political_events.046.a: "Вони більше не будуть нас турбувати."

 #Economic support events
 philippines_political_events.050.t: "Німці пропонують економічну допомогу"
 philippines_political_events.050.d: "Велика депресія та крах Сполучених Штатів у громадянську війну кинули філіппінську економіку у штопор. Поки молода нація працює над переоснащенням своєї економіки, відходячи від колоніальних коренів і долаючи власне економічне нездужання, місцева німецька влада у Східній Азії запропонувала руку допомоги. Вони готові субсидувати місцевих німецьких та орієнтованих на Німеччину бізнесменів у розвитку підприємств на Філіппінах, сприяючи зростанню та, нібито, створюючи процвітання для обох сторін. Як ці трофеї будуть розподілені — інше питання — приховані нитки, залучені до цього, є предметом занепокоєння навіть для найбільш прихильного до бізнесу державного діяча."
 philippines_political_events.050.a: "Ми приймемо всю допомогу, яку зможемо отримати!"
 philippines_political_events.050.b: "Ні, дякую."

 philippines_political_events.051.t: "Американці пропонують економічну допомогу"
 philippines_political_events.051.d: "Велика депресія та крах Сполучених Штатів у громадянську війну кинули філіппінську економіку у штопор. Поки молода нація працює над переоснащенням своєї економіки, відходячи від колоніальних коренів і долаючи власне економічне нездужання, відновлені американські інтереси запропонували руку допомоги. Вони готові субсидувати місцевих американських та орієнтованих на Америку бізнесменів у розвитку підприємств на Філіппінах, сприяючи зростанню та, нібито, створюючи процвітання для обох сторін. Як ці трофеї будуть розподілені — інше питання — приховані нитки, залучені до цього, є предметом занепокоєння навіть для найбільш прихильного до бізнесу державного діяча."
 philippines_political_events.051.a: "Ми приймемо всю допомогу, яку зможемо отримати!"
 philippines_political_events.051.b: "Ні, дякую."

 philippines_political_events.052.t: "Японці пропонують економічну допомогу"
 philippines_political_events.052.d: "Велика депресія та крах Сполучених Штатів у громадянську війну кинули філіппінську економіку у штопор. Поки молода нація працює над переоснащенням своєї економіки, відходячи від колоніальних коренів і долаючи власне економічне нездужання, японський уряд запропонував руку допомоги. Вони готові субсидувати місцевих японських та орієнтованих на Японію бізнесменів у розвитку підприємств на Філіппінах, сприяючи зростанню та, нібито, створюючи процвітання для обох сторін. Як ці трофеї будуть розподілені — інше питання — приховані нитки, залучені до цього, є предметом занепокоєння навіть для найбільш прихильного до бізнесу державного діяча."
 philippines_political_events.052.a: "Ми приймемо всю допомогу, яку зможемо отримати!"
 philippines_political_events.052.b: "Ні, дякую."

 philippines_political_events.053.t: "Філіппіни приймають нашу економічну підтримку"
 philippines_political_events.053.d: "Велика депресія та крах Сполучених Штатів у громадянську війну кинули філіппінську економіку у штопор. Поки молода нація працює над переоснащенням своєї економіки, відходячи від колоніальних коренів і долаючи власне економічне нездужання, вони охоче прийняли нашу пропозицію субсидувати бізнес-підприємства в їхній нації, поглиблюючи економічні зв’язки між нами та сприяючи взаємному економічному процвітанню. Не було сказано про приховані нитки в цій операції: про негласний вплив, яким ми тепер керуємо всередині Маніли."
 philippines_political_events.053.a: "Чудові новини!"

 philippines_political_events.054.t: "Філіппіни відмовляються від нашої економічної підтримки"
 philippines_political_events.054.d: "Велика депресія та крах Сполучених Штатів у громадянську війну кинули філіппінську економіку у штопор. Поки молода нація працює над переоснащенням своєї економіки, відходячи від колоніальних коренів і долаючи власне економічне нездужання, вони, проте, відхилили нашу пропозицію субсидувати бізнес-підприємства в їхній нації, що сприяло б взаємному економічному процвітанню та надало б їхньому народу підтримку, якої він так відчайдушно потребує. Хоча ми впевнені, що філіппінський народ пошкодує про підозрілість та недалекоглядність своїх лідерів у майбутньому, наразі нам завдано прикрого удару."
 philippines_political_events.054.a: "Шкода."

#Military aid events
 philippines_military_events.060.t: "Німці пропонують військову допомогу"
 philippines_military_events.060.d: "Філіппінська армія була офіційно створена у грудні 1935 року з ветеранів Філіппінської констебларії та Філіппінських скаутів за допомогою американців. Ці плани так і не були повністю реалізовані до того, як Друга громадянська війна в Америці кинула Філіппіни у невідомі води, і багато хто задається питанням, чи здатна нова Республіка озброїти та підготувати сили, необхідні для захисту островів від іноземного вторгнення.\n\nНімці пропонують взяти на себе роль американських інструкторів, обіцяючи постачання зброї та досвідчених військових радників, необхідних для підготовки цілої дивізії за німецьким зразком. Ця дивізія потім стане моделлю для подальшого розвитку філіппінських військових, значно збільшуючи їхній вплив на розвиток нашої армії. З огляду на обставини, навряд чи ми можемо просити про кращу угоду."
 philippines_military_events.060.a: "Ми люб'язно приймаємо їхню пропозицію."
 philippines_military_events.060.b: "Ми мусимо ввічливо відмовитися."

 philippines_military_events.061.t: "Американці пропонують військову допомогу"
 philippines_military_events.061.d: "Філіппінська армія була офіційно створена у грудні 1935 року з ветеранів Філіппінської констебларії та Філіппінських скаутів за допомогою американців. Ці плани так і не були повністю реалізовані до того, як Друга громадянська війна в Америці кинула Філіппіни у невідомі води, і багато хто задається питанням, чи здатна нова Республіка озброїти та підготувати сили, необхідні для захисту островів від іноземного вторгнення.\n\nАмериканці запропонували завершити те, що вони почали, обіцяючи постачання зброї та досвідчених військових радників, необхідних для підготовки цілої дивізії за американським зразком. Ця дивізія потім стане моделлю для подальшого розвитку філіппінських військових, значно збільшуючи їхній вплив на розвиток нашої армії. З огляду на обставини, навряд чи ми можемо просити про кращу угоду."
 philippines_military_events.061.a: "Ми люб'язно приймаємо їхню пропозицію."
 philippines_military_events.061.b: "Ми мусимо відмовитися"

 philippines_military_events.062.t: "Японці пропонують військову допомогу"
 philippines_military_events.062.d: "Філіппінська армія була офіційно створена у грудні 1935 року з ветеранів Філіппінської констебларії та Філіппінських скаутів за допомогою американців. Ці плани так і не були повністю реалізовані до того, як Друга громадянська війна в Америці кинула Філіппіни у невідомі води, і багато хто задається питанням, чи здатна нова Республіка озброїти та підготувати сили, необхідні для захисту островів від іноземного вторгнення.\n\nЯпонці запропонували стати покровителем цієї молодої сили, обіцяючи постачання зброї та досвідчених військових радників, необхідних для підготовки цілої дивізії за японським зразком. Ця дивізія потім стане моделлю для подальшого розвитку філіппінських військових, значно збільшуючи їхній вплив на розвиток нашої армії. З огляду на обставини, навряд чи ми можемо просити про кращу угоду."
 philippines_military_events.062.a: "Ми люб'язно приймаємо їхню пропозицію."
 philippines_military_events.062.b: "Ми мусимо ввічливо відмовитися."

 philippines_military_events.063.t: "Філіппіни приймають нашу військову допомогу"
 philippines_military_events.063.d: "Філіппінська армія була офіційно створена у грудні 1935 року з ветеранів Філіппінської констебларії та Філіппінських скаутів за допомогою американців. Ці плани так і не були повністю реалізовані до того, як Друга громадянська війна в Америці кинула Філіппіни у невідомі води, і багато хто задається питанням, чи здатна нова Республіка озброїти та підготувати сили, необхідні для захисту островів від іноземного вторгнення. Наша пропозиція постачати їхні сили людьми та матеріалами, необхідними для підготовки модельної дивізії за [ROOT.GetAdjective] зразком, була люб'язно прийнята. Якщо все піде за планом, уроки, отримані цією дивізією, будуть використані для подальшого розвитку філіппінських військових, значно збільшуючи наш вплив на розвиток їхньої армії та готуючи їх як союзника для майбутнього конфлікту."
 philippines_military_events.063.a: "Все згідно з планом."

 philippines_military_events.064.t: "Філіппіни відмовляються від нашої військової допомоги"
 philippines_military_events.064.d: "Філіппінська армія була офіційно створена у грудні 1935 року з ветеранів Філіппінської констебларії та Філіппінських скаутів за допомогою американців. Ці плани так і не були повністю реалізовані до того, як Друга громадянська війна в Америці кинула Філіппіни у невідомі води, і багато хто задається питанням, чи здатна нова Республіка озброїти та підготувати сили, необхідні для захисту островів від іноземного вторгнення. Попри це, філіппінський уряд уперто відмовився від нашої пропозиції постачати їхні сили людьми та матеріалами, побоюючись нашого зростаючого впливу на їхні збройні сили. Це залишить їхні береги небезпечно вразливими для вторгнення."
 philippines_military_events.064.a: "З часом вони усвідомлять свою помилку"

 philippines_military_events.065.t: "Модельна дивізія завершує підготовку"
 philippines_military_events.065.d: "Завдяки військовим радникам та матеріалам від [FROM.GetNameDef] була сформована, оснащена та навчена модельна дивізія. Створена відповідно до останньої [FROM.GetAdjective] військової доктрини, ця Модельна дивізія є надихаючим видовищем. Наступними кроками, звичайно, буде імітація цього зразка іншими підрозділами нашої молодої армії, і ми надішлемо щойно підготовлених офіцерів та молодших командирів з цієї дивізії до інших, щоб прискорити їхню підготовку. Загалом, це велика перемога [FROM.GetAdjective]-філіппінської співпраці!"
 philippines_military_events.065.a: "Сучасна дивізія для сучасної війни!"
 philippines_military_events.065.b: "Нам не потрібна нова дивізія, але обладнання буде корисним."
 PHI_create_locked_division: "§YЦей шаблон буде заблоковано і його не можна буде змінити до завершення $PHI_fight_for_the_philippines_decision_cat$§!"

 #Neutrality Alignment (070-089)
 philippines_political_events.070.t: "Філіппіни закріплюють свій нейтралітет"
 philippines_political_events.070.d: "Зрештою, Філіппінам вдалося відбити іноземні спроби тиску на них щодо приєднання до альянсу. Як і більшість речей у міжнародних відносинах, це також має деякі недоліки. Широка громадськість неохоче бере участь у будь-яких іноземних військових авантюрах, і Філіппіни, ймовірно, прагнутимуть окопатися і спробувати залишитися нейтральними серед моря війни. Звичайно, мир завжди кращий за війну, і наш нейтралітет має додаткову перевагу політичної гнучкості — якщо війна все ж дійде до наших берегів або ситуація інакше підніме широку громадськість на війну, ми все ж можемо приєднатися до фракції."
 philippines_political_events.070.a: "Наразі ми залишаємо наші варіанти відкритими і сподіваємося на краще."

 philippines_political_events.071.t: "Філіппіни закріплюють свій нейтралітет"
 philippines_political_events.071.d: "Здобувши незалежність від Сполучених Штатів, молода Філіппінська Республіка була об'єктом залицянь з усіх боків, оскільки напруженість у Тихому океані зростає. Відкинувши пропозиції Токіо та місцевої німецької влади в Сінгапурі, Президент [PHI.GetLeader] оголосив про нейтралітет своєї нації в будь-якому збройному конфлікті.\n\nЦе, ймовірно, буде не так просто. Маніла знаходиться в стратегічному місці, і хоча вони неявно погрожували приєднатися до альянсу проти будь-якого загарбника, спокуса силою забезпечити їхню вірність залишається сильною. Як ця нація, що опинилася посередині протистояння між двома силами, буде долати ці бурхливі води, ще належить побачити."
 philippines_political_events.071.a: "Невже вони справді думають, що можуть вижити самотужки?"

 philippines_political_events.072.t: "[FROM.Capital.GetCapitalVictoryPointName] змушує нас до нейтралітету"
 philippines_political_events.072.d: "Хоча [FROM.GetNameDef] мав явну перевагу в політичному впливі на Філіппіни і стан двосторонніх відносин рухався до закріплення альянсу, [FROM.GetAdjective] уряд вирішив натомість використати цей вплив, щоб змусити нас до нейтралітету. Можливо, це тому, що вони не хотіли перенапружуватися, можливо, це через їхню власну мінливу політику, можливо (ми боїмося) це тому, що вони мають негативні наміри щодо нас у майбутньому. У будь-якому разі, ми купили мир на деякий час."
 philippines_political_events.072.a: "Нехай буде так."

 #Reichspakt Alignment (090-109)
 philippines_political_events.090.t: "Наш тріумф у Манілі"
 philippines_political_events.090.d: "Завдяки німецькому тиску та обіцянкам, філіппінський уряд вирішив приєднатися до нас у майбутніх конфліктах у Східній Азії. Двосторонні відносини між нами схилялися до альянсу, причому більшість основної роботи була виконана місцевою німецькою владою в Сінгапурі. Здається логічним, що ми повинні стояти разом проти японської загрози, хоча, можливо, було б краще просто схилити їх до формального нейтралітету, відмовляючи нашим суперникам у перевазі."
 philippines_political_events.090.a: "Ці угоди пов'яжуть їх з нами."
 philippines_political_events.090.b: "Нейтральні Філіппіни найкраще служать нашим інтересам."

 philippines_political_events.091.t: "Філіппіни приєднуються до Райхспакту"
 philippines_political_events.091.d: "Завдяки німецькому тиску та обіцянкам, філіппінський уряд вирішив приєднатися до них у майбутніх конфліктах у Східній Азії. Двосторонні відносини між нами схилялися до альянсу, і здається логічним, що ми повинні стояти разом проти японської загрози. Ми можемо лише сподіватися, що їхній флот буде достатнім, щоб захистити як наші, так і їхні береги, оскільки нова нація робить небезпечний поворот."
 philippines_political_events.091.a: "Берлін — наш єдиний шанс проти японської загрози."

 philippines_political_events.092.t: "Філіппіни приєднуються до Райхспакту"
 philippines_political_events.092.d: "Здобувши незалежність від Сполучених Штатів, молода Філіппінська Республіка була об'єктом залицянь з усіх боків, оскільки напруженість у Тихому океані зростає. Відкинувши пропозиції Токіо, Президент [PHI.GetLeader], щойно здобув перемогу на виборах, оголосив про свій намір підписати низку обов'язкових військових угод з Берліном.\n\nЦя угода про безпеку, укладена місцевою німецькою владою в Сінгапурі, є величезною перемогою для [GEA.GetLeader], забезпечуючи Ост-Азійський флот життєво важливими базами в Тихому океані. Але чи принесе це мир на острови, чи вторгнення, ще належить з'ясувати."
 philippines_political_events.092.a: "Ситуація схиляється на користь Сінгапуру."

 philippines_political_events.093.t: "Наш тріумф у Манілі"
 philippines_political_events.093.d: "[ROOT.GetLeader] та його штаб отримали сьогодні телеграму з Берліна, яка визнає наші невтомні зусилля щодо підготовки ґрунту для альянсу з Філіппінами. Хоча більшість заслуг у цій великій дипломатичній перемозі, ймовірно, монополізує Міністерство закордонних справ, ми можемо пишатися нашим керуванням ситуацією — що дало нашій нації значну перевагу на театрі бойових дій завдяки нашій ініціативі."
 philippines_political_events.093.a: "Ми добре виконали свій обов'язок."

 #Sphere Alignment (110-129)
 philippines_political_events.110.t: "Наш тріумф у Манілі"
 philippines_political_events.110.d: "Завдяки японському тиску та обіцянкам, філіппінський уряд вирішив приєднатися до нас у майбутніх конфліктах у Східній Азії. Двосторонні відносини між нами схилялися до альянсу, це є важко здобутим результатом інтенсивного дипломатичного лобіювання. Здається логічним, що ми повинні стояти разом проти німецької загрози, хоча, можливо, було б краще просто схилити їх до формального нейтралітету, відмовляючи нашим суперникам у перевазі."
 philippines_political_events.110.a: "Ці угоди пов'яжуть їх з нами."
 philippines_political_events.110.b: "Нейтральні Філіппіни найкраще служать нашим інтересам."

 philippines_political_events.111.t: "Філіппіни приєднуються до Сфери"
 philippines_political_events.111.d: "Завдяки японському тиску та обіцянкам, філіппінський уряд вирішив приєднатися до них у майбутніх конфліктах у Східній Азії. Двосторонні відносини між нами схилялися до альянсу, і здається логічним, що ми повинні стояти разом проти Західної загрози. Ми можемо лише сподіватися, що їхній флот буде достатнім, щоб захистити як наші, так і їхні береги, оскільки нова нація робить небезпечний поворот."
 philippines_political_events.011.a: "Токіо принесе мир та процвітання Азії."

 philippines_political_events.112.t: "Філіппіни приєднуються до Сфери"
 philippines_political_events.112.d: "Здобувши незалежність від Сполучених Штатів, молода Філіппінська Республіка була об'єктом залицянь з усіх боків, оскільки напруженість у Тихому океані зростає. Відкинувши пропозиції місцевої німецької влади в Сінгапурі, Президент [PHI.GetLeader], щойно здобув перемогу на виборах, оголосив про свій намір підписати низку обов'язкових військових угод з Токіо.\n\nЦя угода про безпеку є величезною перемогою для [JAP.GetLeader], забезпечуючи Імператорський флот Японії життєво важливими базами в Тихому океані поблизу Голландської Ост-Індії. Але чи принесе це мир на острови, чи вторгнення, ще належить з'ясувати."
 philippines_political_events.112.a: "Ситуація схиляється на користь Токіо."

 #American Alignment (130-149)
 philippines_political_events.130.t: "Наш тріумф у Манілі"
 philippines_political_events.130.d: "Завдяки американському тиску та обіцянкам, філіппінський уряд вирішив приєднатися до нас у майбутніх конфліктах у Східній Азії. Двосторонні відносини між нами схилялися до альянсу, це є важко здобутим результатом інтенсивного дипломатичного лобіювання. Здається логічним, що ми повинні стояти разом проти іноземних загроз, хоча, можливо, було б краще просто схилити їх до формального нейтралітету, відмовляючи нашим суперникам у перевазі."
 philippines_political_events.130.a: "Ці угоди пов'яжуть їх з нами."
 philippines_political_events.130.b: "Нейтральні Філіппіни найкраще служать нашим інтересам."

 philippines_political_events.131.t: "Філіппіни переорієнтовуються на Америку"
 philippines_political_events.131.d: "На превеликий подив багатьох, американцям вдалося не лише своєчасно завершити свою громадянську війну, але й відновити свій вплив у Тихому океані. Філіппіни, під тиском і, можливо, враховуючи старі зв'язки між ними, погодилися підписати договір про взаємну оборону в надії протидіяти німецьким та японським загрозам. Президент, в сьогоднішньому оголошенні, заявив про нашу готовність залишатися відкритими для можливого вступу до подальших альянсів."
 philippines_political_events.131.a: "Вашингтон повертається як наш захисник."

 philippines_political_events.132.t: "Філіппіни переорієнтовуються на Америку"
 philippines_political_events.132.d: "Здобувши незалежність від Сполучених Штатів, молода Філіппінська Республіка була об'єктом залицянь з усіх боків, оскільки напруженість у Тихому океані зростає. Мало хто міг подумати, що американці, розділені громадянською війною, коли-небудь зможуть відновити вплив у Манілі. Проте, зрештою, Президент [PHI.GetLeader] та філіппінський уряд вирішили вибрати знайоме зло, погодившись на договори про взаємну оборону та відновивши відносини на високому рівні між Філіппінами та Америкою.\n\nЦя угода про безпеку спрямована на захист островів від німецького та японського посягань, але повернення до статус-кво 1920-х років немає. Чи зможе цей договір справді захистити Філіппіни від війни, ще належить побачити."
 philippines_political_events.132.a: "Нове партнерство? Чи повернення до рабства?"

 # 1939 Elections Events (150-199)
 philippines_political_events.150.t: "Початок виборчої кампанії 1939 року"
 philippines_political_events.150.d: "Це рік президентських виборів; у вересні виборці Філіппін вирушать на виборчі дільниці, щоб визначити, хто стане наступним лідером країни. Один кандидат вже кинув свою капелюх на ринг: чинний президент Мануель Кесон. Це не дивно, оскільки Кесон кілька років тому спеціально домагався ухвалення конституційної поправки, щоб змінити його єдиний шестирічний термін на потенційно два чотирирічні терміни. Як лідер Націоналістичної партії та найвпливовіша людина в країні, Кесон вважає, що він все ще може легко прийти до переобрання.\n\nУ цих національних виборах за принципом відносної більшості може бути лише один життєздатний претендент, якщо опозиція хоче мати хоч якийсь шанс на успіх. Партія демократів, здається, готова висунути Кларо М. Ректо, якщо відчує, що поле вільне. Однак Ректо може відступити, якщо виявиться, що старий революціонер Еміліо Агінальдо оголосить свою власну кандидатуру, як вказують багато його довірених осіб. Ходять навіть чутки, що частини Націоналістичної партії, незадоволені Кесоном, готові розділити партію та підтримати Мануеля Рохаса, хоча поки що нічого з цього не вийшло. Синдикалістська Партія робітників вже оголосила, що бойкотуватиме вибори та планує великі антиурядові демонстрації, коли наблизиться дата."
 philippines_political_events.150.a: "Порядок та експертиза принесуть результати!"
 philippines_political_events.050.b: "Прогрес та братерство піднімуть маси!"
 philippines_political_events.150.c: "Як єдина нація ми захистимо нашу незалежність."

 philippines_political_events.151.t: "Наближення виборів 1939 року"
 philippines_political_events.151.d: "Це рік президентських виборів; у вересні виборці Філіппін вирушать на виборчі дільниці, щоб визначити, хто стане наступним лідером країни. Один кандидат вже кинув свою капелюх на ринг: чинний президент Мануель Кесон. І Німеччина, і Японія намагалися культивувати тісні стосунки з Президентом, але хоча він не ігнорував жодну сторону, все ще неясно, до кого він насправді схиляється. Можливо, саме тому німецькі та японські зусилля проникли глибше в саму Націоналістичну партію, де вони можуть знайти більш охочого до співпраці. \n\nУ цих національних виборах за принципом відносної більшості може бути лише один життєздатний претендент, якщо опозиція хоче мати хоч якийсь шанс на успіх. Потенційний кандидат від Партії демократів Кларо М. Ректо був помічений з німецькими бізнесменами, які, як вважають, фінансують партію. Тим часом потенційний претендент на пост президента Еміліо Агінальдо щойно повернувся з поїздки до Японії; мало сумнівів у тому, де лежать його друзі. Синдикалістська Партія робітників засудила вплив іноземних капіталістів на національні вибори та планує великі антиурядові демонстрації, коли наблизиться дата."
 philippines_political_events.151.a: "Ми повинні посилити наші зусилля!"
 philippines_political_events.151.b: "Прийнято до уваги."

## Section 1b - Quezon's Second Term (1939-1943+)
 philippines_political_events.200.t: "Президент Кесон упевнено переобраний"
 philippines_political_events.200.d: "Результати відомі: Мануель Кесон забезпечив собі переобрання на посаду Президента Філіппінської Республіки. Протягом місяців люди задавалися питанням, чи не закінчиться нарешті десятирічна серія безперервних політичних перемог Кесона, і, здається, вони були нерозумними, коли так вважали. Кесон знову довів, що є політичним майстром, легко осідлавши хвилі громадської думки, водночас зберігаючи недоторканим вкорінений політичний істеблішмент. Сьогодні Кесон знову виголосив свою присягу з балкона палацу Малаканьян під вигуки натовпу внизу."
 philippines_political_events.200.a: "Вітаємо Президента Кесона!"

 philippines_political_events.201.t: "Президентські вибори 1943 року"
 philippines_political_events.201.d: "Цей день мав настати. Хоча Кесон, можливо, і хотів залишатися президентом (і, подейкують, запитував членів Верховного суду, чи може він це зробити), обмеження терміну та погіршення здоров'я нарешті змусили його залишити президентство. Його місце зайняв віцепрезидент Серхіо Осменья як кандидат від Націоналістичної партії. Осменья довго залишався в тіні Кесона, будучи рівною мірою і другом, і суперником, але нарешті він отримав шанс взяти кермо влади сам. Легко перемігши на виборах над символічною опозицією, перемога Осменьї закріплює постійне домінування Націоналістичної партії у філіппінській політиці."
 philippines_political_events.201.a: "Вітаємо Президента Осменью!"

 ## Section 1c - Roxas' Presidency (1939-1943+)
 philippines_political_events.300.t: "Рохас та еліти відновлюють контроль"
 philippines_political_events.300.d: "Кесон викопав собі могилу. Захопившись своїм власним образом батька мас, він знехтував зміцненням своєї позиції в Націоналістичній партії. Як наслідок, велика частина партії підняла бунт і висунула Мануеля Рохаса на пост президента. Касики активізувалися, використовуючи весь свій вплив, щоб умовляти, купувати та залякувати народ, аби той голосував проти Кесона. Коли результати нарешті надійшли, стало зрозуміло, що їхні зусилля окупилися: Рохас переміг.\n\nСьогодні Рохас виголосив свою присягу з балкона палацу Малаканьян під вигуки натовпу внизу. У своїй першій промові на посаді президента він оголосив про новий курс, який виправить помилки останніх років і поверне Націоналістичну партію до її коренів як гаранта розумного, стабільного правління. Він натякнув, що з потенційними революціонерами та незадоволеними будуть жорстоко розбиратися. У своїх заключних словах Рохас також висловив готовність Філіппін співпрацювати з іноземними партнерами."
 philippines_political_events.300.a: "Вітаємо Президента Рохаса!"

 ## Section 1d - Aguinaldo's Presidency (1939-1943+)
 philippines_political_events.400.t: "Агінальдо підриває Істеблішмент"
 philippines_political_events.400.d: "Кесон викопав собі могилу. Занадто заспокоївшись у своєму становищі на вершині влади, він не помітив невдоволення, яке назрівало внизу. Як наслідок, народ нарешті повстав проти націоналістів і згуртувався навколо великого героя Еміліо Агінальдо. Касики активізувалися, використовуючи весь свій вплив, щоб спробувати умовляти, купувати та залякувати народ голосувати за Кесона, але цього було недостатньо. Коли результати нарешті надійшли, стало зрозуміло, що сталося неможливе: Агінальдо переміг.\n\nСьогодні Агінальдо виголосив свою присягу з балкона палацу Малаканьян під вигуки натовпу внизу. У своїй першій промові на посаді президента він оголосив про відродження духу, який керував країною у війні за незалежність. Ера корумпованої та роз'єднувальної політики наближалася до кінця, оскільки весь народ згуртувався навколо справи нації. У своїх заключних словах Агінальдо оголосив про свій намір змусити Філіппіни працювати з Японією «за славетне азійське майбутнє»."
 philippines_political_events.400.a: "Вітаємо Президента Агінальдо!"

 ## Section 1e - Recto's Presidency (1939-1943+)
 philippines_political_events.500.t: "Ректо гуртує популістські сили"
 philippines_political_events.500.d: "Кесон викопав собі могилу. Занадто заспокоївшись у своєму становищі на вершині влади, він не помітив невдоволення, яке назрівало внизу. Як наслідок, народ нарешті повстав проти націоналістів і віддав свою підтримку кандидату від Партії демократів Кларо Ректо. Касики активізувалися, використовуючи весь свій вплив, щоб спробувати умовляти, купувати та залякувати народ голосувати за Кесона, але демократи випередили їх. Коли результати нарешті надійшли, стало зрозуміло, що сталося неможливе: Ректо переміг.\n\nСьогодні Ректо виголосив свою присягу з балкона палацу Малаканьян під вигуки натовпу внизу. У своїй першій промові на посаді президента він привітав Філіппіни з першою в історії мирною передачею влади іншій політичній партії. Він підкреслив намір своєї адміністрації боротися з корупцією, захищати громадянські свободи і, перш за все, служити народу. У своїх заключних словах Ректо похвалив Німеччину як «захисника прав та інтересів малих націй»."
 philippines_political_events.500.a: "Вітаємо Президента Ректо!"

 ## Section 1f - Evangelista's Presidency (1939-1943+)
 philippines_political_events.600.t: "Евангеліста очолює соціалістичну революцію"
 philippines_political_events.600.d: "Вибори стали загибеллю Кесона. Хоча його популярність була на дні, повністю втративши довіру народу, він уперто намагався утриматися при владі. Оскільки опозиція сварилася і не могла об'єднатися навколо кандидата, здавалося, що демократичний процес зазнає невдачі. Партія робітників зростала в Манілі, проголошуючи, що капіталістичний режим наближається до кінця. Коли на Лусоні спалахнуло селянське повстання, констебларія розсіялася, і незабаром озброєні селяни рушили до столиці. Коли місто було паралізовано загальним страйком, боягузливі політики втекли, і над Інтрамуросом було піднято червоний прапор.\n\nЗ балкона палацу Малаканьян лідер Партії робітників Крісанто Евангеліста проголосив народження Соціалістичної Республіки Філіппін. Він оголосив, що вже сформовано тимчасову виконавчу владу на чолі з ним самим, яка розпочне завдання зі створення справжнього робітничо-селянського уряду. Внизу натовпи філіппінців із робітничого класу вітали та співали «Інтернаціонал» хором десятками мов"
 philippines_political_events.600.a: "Пролетарі Філіппін, єднайтеся!"

#- Section 2: Economic Events -#
#- Section 3: Military Events -#

 philippines_military_events.001.t: "Закупівля армійського спорядження"
 philippines_military_events.001.d: "Наша армія швидко зростає, а традиційний покровитель відступає, і ланцюг постачання ледве встигає. Це нелегке завдання, адже основні розробки та виробництво зброї зосереджені в руках взаємно недовірливих великих держав, які загрожують знову занурити світ у війну. Після звернення до різних постачальників ми отримали кілька перспективних пропозицій технічної допомоги для модернізації нашої армії — від удосконалення гвинтівок і артилерії до розширення системи забезпечення.\n\nДехто у верховному командуванні пропонує значно амбітніший план — забезпечити довгострокову безпеку країни шляхом створення масштабної системи закупівель, що інтегрує кількох постачальників, центри обслуговування й ремонту, а іноді й нові підприємства з нуля. Це буде дорого, але свобода теж має свою ціну."
 philippines_military_events.001.a: "Закупити німецьке допоміжне спорядження."
 philippines_military_events.001.b: "Придбати японське піхотне спорядження."
 philippines_military_events.001.c: "Купити американську артилерію."
 philippines_military_events.001.e: "Ми створимо мережу озброєнь із нуля!"

 philippines_military_events.020.t: "Імпорт морських проєктів"
 philippines_military_events.020.d: "Для острівної держави контроль над навколишніми водами життєво важливий для безпеки — особливо коли великі держави, що змагаються за вплив у регіоні, вже мають величезну перевагу у створенні флотів. Та навіть невеликий флот кращий за його відсутність, і нашій молодій флотилії потрібен поштовх. Ми отримали пропозиції від різних постачальників, які прагнуть впливу на розвиток нашого флоту. Морська війна швидко змінюється, і впровадження нових технологій є ключем до вирівнювання шансів.\n\nБільш амбітний план від провідних діячів нашого флоту та союзу верфей передбачає значні інвестиції уряду для запуску власного суднобудування. Це потребуватиме не лише коштів, відкладених на імпорт іноземних проєктів, а й додаткових ресурсів із державної скарбниці."
 philippines_military_events.020.a: "Будувати німецькі підводні човни."
 philippines_military_events.020.b: "Придбати проєкти японських торпедоносців."
 philippines_military_events.020.c: "Купити плани американських есмінців."
 philippines_military_events.020.e: "Ми повинні створювати власні кораблі!"

 philippines_military_events.040.t: "Пошук авіаційної експертизи"
 philippines_military_events.040.d: "Війна в небі — це швидко розвиваючийся фронт військових технологій, і ми не можемо дозволити собі відставати. Контроль над небом і можливість обрушувати кулі, бомби та торпеди на ворога може стати вирішальним чинником між перемогою та поразкою. Іноземні постачальники щедро пропонують допомогу у впровадженні нових авіаційних технологій, але ми не повинні забувати й про основи. Нове покоління філіппінських героїв, яких називають «лицарями нового часу», готове зайняти своє місце у захисті небес."
 philippines_military_events.040.a: "Купити німецькі пікірувальники."
 philippines_military_events.040.b: "Придбати японські винищувачі «Зеро»."
 philippines_military_events.040.c: "Покладатися на американську підготовку пілотів."
 philippines_military_events.040.e: "Ми повинні знайти власну долю в небі!"

