### Political Ideas ###
 PHI_political_spirit_1_idea: "Вкорінені касики"
 PHI_political_spirit_1_idea_desc: "Хоча Співдружність Філіппін на папері є перехідною ліберальною демократією, на практиці її політична культура домінує місцевими нотаблями, відомими як «касики». Місцеві еліти створюють заплутані мережі альянсів, пов'язаних родинними зв'язками, взаємними інтересами та політичним патронажем. Попри ендемічну корупцію та непрозорість системи для неосвічених і збіднілих нижчих класів, настрої мас все ще мають вплив. Додатково ускладнює рівняння спадщина американського імперіалізму та те, як вона взаємодіє з «Націоналістичною партією»."

 PHI_political_spirit_2_idea: "Вкорінені касики"
 PHI_political_spirit_2_idea_desc: "Мануель Кесон був обраний першим президентом Співдружності Філіппін у 1935 році, скориставшись як своїми потужними зв'язками з елітами, так і створивши собі образ захисника простих людей. Він виявився досить успішним у затвердженні своєї волі як лідера, і його наступники, ймовірно, будуть наслідувати його. \n\n$PHI_political_spirit_1_idea_desc$"

 PHI_political_spirit_3_idea: "Вкорінені касики"
 PHI_political_spirit_3_idea_desc: "З роками, і коли незалежність Філіппін стає все більш і більш реальною, Філіппіни здаються готовими накреслити свій власний шлях. \n\n$PHI_political_spirit_2_idea_desc$"

 PHI_political_spirit_quezon_1_idea: "Президентство Кесона"
 PHI_political_spirit_quezon_1_idea_desc: "Успішна кампанія Мануеля Кесона з переобрання у 1939 році підтвердила його імідж реформатора. Консолідуючи свою владу на Філіппінах, він продовжує просувати свій порядок денний, щоб модернізувати Філіппіни та підготувати їх до прийдешнього конфлікту в Азії."

 PHI_political_spirit_quezon_2_idea: "Тріумф Кесона"
 PHI_political_spirit_quezon_2_idea_desc: "Як переможець у боротьбі за владу на Філіппінах, який керував нацією у часи війни на Тихому океані, Мануель Кесон зміцнив свою спадщину у молодій республіці, формуючи її на свій образ. \n\n$PHI_political_spirit_quezon_1_idea_desc$"

 PHI_political_spirit_roxas_1_idea: "Президентство Рохаса"
 PHI_political_spirit_roxas_1_idea_desc: "Обрання Мануеля Рохаса на пост президента у 1939 році підтвердило силу «Націоналістичної партії» як захисників незалежності Філіппін і продемонструвало, що партія (та її еліти) є чимось більшим, ніж тодішній президент Кесон. Націоналістичний істеблішмент продовжуватиме керувати та захищати Філіппіни, підтримуючи порядок і мир у нації."

 PHI_political_spirit_roxas_2_idea: "Тріумф Рохаса"
 PHI_political_spirit_roxas_2_idea_desc: "Як переможець у боротьбі за владу на Філіппінах, який керував нацією у часи війни на Тихому океані, Мануель Рохас зміцнив свою спадщину у молодій республіці, формуючи її на свій образ. \n\n$PHI_political_spirit_roxas_1_idea_desc$"

 PHI_political_spirit_aguinaldo_1_idea: "Президентство Агінальдо"
 PHI_political_spirit_aguinaldo_1_idea_desc: "Нарешті Еміліо Агінальдо повернувся до влади. Перший і єдиний президент Першої Республіки, схоже, він став другим президентом Другої Республіки Філіппін. Маючи в руках владу мас, він тепер веде націю до нового майбутнього, вивільняючи могутність народу, щоб побудувати Філіппіни, які мали б існувати ще у 1899 році."

 PHI_political_spirit_aguinaldo_2_idea: "Тріумф Агінальдо"
 PHI_political_spirit_aguinaldo_2_idea_desc: "Як переможець у боротьбі за владу на Філіппінах, який керував нацією у часи війни на Тихому океані, Еміліо Агінальдо зміцнив свою спадщину у молодій республіці, формуючи її на свій образ. \n\n$PHI_political_spirit_aguinaldo_1_idea_desc$"

 PHI_political_spirit_evangelista_1_idea: "Президентство Евангелісти"
 PHI_political_spirit_evangelista_1_idea_desc: "Попри все, Крісанто Евангеліста очолив широку коаліцію соціалістів, пролетарів, аграріїв, партизанів та інших народних сил, щоб повалити старі еліти, знищивши старий лад. Цей альянс раніше пригноблених прагне побудувати нові Філіппіни для всіх людей і досягти незалежності від імперіалізму та капіталізму."

 PHI_political_spirit_evangelista_2_idea: "Тріумф Евангелісти"
 PHI_political_spirit_evangelista_2_idea_desc: "Як переможець у боротьбі за владу на Філіппінах, який керував нацією у часи війни на Тихому океані, Крісанто Евангеліста зміцнив свою спадщину у молодій республіці, формуючи її на свій образ. \n\n$PHI_political_spirit_evangelista_1_idea_desc$"

 PHI_political_spirit_recto_1_idea: "Президентство Ректо"
 PHI_political_spirit_recto_1_idea_desc: "Мало хто думав, що це можливо, і ще менше вірили, що це можна зробити так швидко, але Кларо Ректо привів політичну опозицію до перемоги на виборах, витіснивши націоналістів уперше в історії Філіппін. Тепер він заявляє про широкий мандат на реформування Філіппін та припинення корупції, і навіть якщо він зазнає невдачі у своїй більш масштабній програмі, очевидно, що його перемога похитнула закостенілі основи старого ладу."

 PHI_political_spirit_recto_2_idea: "Тріумф Ректо"
 PHI_political_spirit_recto_2_idea_desc: "$PHI_political_spirit_recto_1_idea_desc$\n\nЯк переможець у боротьбі за владу на Філіппінах, який керував нацією у часи війни на Тихому океані, Кларо Ректо зміцнив свою спадщину у молодій республіці, формуючи її на свій образ."

 PHI_workers_rights_idea: "Права робітників"
 PHI_workers_rights_idea_desc: "Президент Кесон пообіцяв підтримувати мир у молодому філіппінському промисловому секторі, сприяючи зростанню та обмежуючи робітничий радикалізм, водночас захищаючи права робітничого класу."

 PHI_workers_revolution_idea: "Робітнича революція"
 PHI_workers_revolution_idea_desc: "Робітники довго були пригноблені на Філіппінах, як іноземними імперіалістами, так і внутрішніми реакціонерами. Новий уряд приніс справжню демократію на Філіппіни, очолену пролетаріатом."

 PHI_promote_welfare_idea: "Сприяння добробуту"
 PHI_promote_welfare_idea_desc: "Головний обов'язок держави — піклуватися про народ, і в наш час це передбачає державні програми для підтримки вразливих верств населення та сприяння вищому рівню життя людей."

 PHI_security_through_patronage_idea: "Безпека через патронаж"
 PHI_security_through_patronage_idea_desc: "Філіппінське суспільство тримається на неписаному, але загальнозрозумілому соціальному кодексі, який пов'язує еліту та маси. Обидві групи повинні існувати в гармонії та служити одна одній, інакше ми розірвемо самі себе зсередини та будемо розірвані зовнішніми силами."

 PHI_cooperation_of_labour_and_capital_idea: "Співпраця праці та капіталу"
 PHI_cooperation_of_labour_and_capital_idea_desc: "Робітничий клас і капіталістична еліта завжди ворогували, що посилювалося капіталістичною експлуатацією та соціалістичними закликами до класової війни. Але нація не може жити без обох, і їхня ворожнеча була б фатальною для нашої молодої Республіки. Натомість, уряд має навчити ці дві сили жити в гармонії та працювати разом для загального блага."

 PHI_improve_working_class_housing_idea: "Житло для робітничого класу"
 PHI_improve_working_class_housing_idea_desc: "Ганьба, що бідні люди змушені жити в тісних, переповнених та антисанітарних халупах, чи то в містах, чи то в селах. Нам потрібно зорганізувати житлову програму для нашого народу."

 PHI_expel_subversives_idea: "Вигнати підривників"
 PHI_expel_subversives_idea_desc: "Підтримувані іноземцями підривні елементи намагалися проникнути в нашу націю, використовуючи наше вільне суспільство, щоб викликати хаос і сіяти розбрат. Чи то шляхом введення мас в оману через радикальну агітацію, чи то через фальшиві релігії, ці агенти заворушень не приносять користі країні. Їх потрібно придушити для покращення та порядку в нашій країні."

 PHI_women_suffrage_idea: "Виборче право для жінок"
 PHI_women_suffrage_idea_desc: "Жінки не отримали права голосу у Конституції Філіппін, розробленій у 1935 році, але вона включала положення про обов'язковий плебісцит з цього питання (голосувати могли лише жінки) у майбутньому. Оскільки плебісцит відбувся і був переважною більшістю схвалений, схоже, що на філіппінській політичній сцені настає новий день."

 PHI_womens_revolution_idea: "Жіноча революція"
 PHI_womens_revolution_idea_desc: "Визволення жінок виходить за межі простого права голосу, воно також має включати їхню свободу від гнітючих сімейних структур та капіталістичної економічної системи. Цьому баченню знадобляться багато років для реалізації, але воно має мати потужний старт."

 PHI_mothers_of_the_nation_idea: "Матері нації"
 PHI_mothers_of_the_nation_idea_desc: "Філіппінська жінка завжди посідала почесне місце в історії Філіппін. Вона спонукала своїх чоловіків, братів і синів виконувати свій патріотичний обов’язок, і навіть сама брала до рук гвинтівку, коли вони падали чи відступали в боротьбі проти загарбників. Ми ніколи не забудемо їхній внесок у нашу державність!"

 PHI_domestic_relations_and_probate_courts_idea: "Громадянські права для жінок"
 PHI_domestic_relations_and_probate_courts_idea_desc: "Проведення плебісциту, який надав жінкам право голосу, було початком, але справжні зміни для середньостатистичної філіппінської жінки також мають включати громадянський захист від домашнього насильства та збалансоване правосуддя у судах у справах про спадщину."

 PHI_model_of_filipino_womanhood_idea: "Філіппінська жіночність"
 PHI_model_of_filipino_womanhood_idea_desc: "Справжня філіппінська жінка є охоронцем домашньої сфери і, відповідно, майбутнього філіппінської нації. Завдяки своїй освіті, чеснотам і грації, вони чинять позитивний вплив на своїх чоловіків, братів і синів."

 PHI_break_up_the_haciendas_idea: "Розділ гасієнд"
 PHI_break_up_the_haciendas_idea_desc: "Поки пролетаріат у Європі страждає під гнітом своїх буржуазних володарів, на Філіппінах переважно сільський простий люд страждає під ярмом поміщицької знаті. Перемога селянських повстанців призвела до експропріації гасієнд (великих маєтків) землевласників, що викликало потужну хвилю змін у сільській місцевості."

 JAP_PHI_friendship_idea: "Договір про японо-філіппінську дружбу"
 JAP_PHI_friendship_idea_desc: "У пошуках пан-азійського визволення від західних держав Філіппіни приєдналися до «Сфери спільного процвітання». Після перемоги альянсу на Азіатсько-Тихоокеанському театрі воєнних дій молода республіка пожинає плоди."

 GER_PHI_friendship_idea: "Договір про німецько-філіппінську дружбу"
 GER_PHI_friendship_idea_desc: "У пошуках стабільності та захисту від японського імперіалізму Філіппіни приєдналися до «Райхспакту». Після перемоги альянсу на Азіатсько-Тихоокеанському театрі воєнних дій молода республіка пожинає плоди."

 USA_PHI_friendship_idea: "Договір про американсько-філіппінську дружбу"
 USA_PHI_friendship_idea_desc: "Сподіваючись відвернути іноземний вплив та захистити баланс, Філіппіни повернулися під американське крило. Після їхньої перемоги на Азіатсько-Тихоокеанському театрі воєнних дій молода республіка пожинає плоди."

 CHI_PHI_friendship_idea: "Договір про китайсько-філіппінську дружбу"
 CHI_PHI_friendship_idea_desc: "У пошуках азійського шляху до соціалізму Філіппіни приєдналися до китайців. Після їхньої перемоги на Азіатсько-Тихоокеанському театрі воєнних дій молода республіка пожинає плоди."

 INT_PHI_friendship_idea: "Договір про філіппінську співпрацю з Інтернаціоналом"
 INT_PHI_friendship_idea_desc: "У пошуках глобальних союзників у світовій революції Філіппіни приєдналися до «Третього Інтернаціоналу». Після їхньої перемоги на Азіатсько-Тихоокеанському театрі воєнних дій молода республіка пожинає плоди."

 HND_PHI_friendship_idea: "Договір про індійсько-філіппінську дружбу"
 HND_PHI_friendship_idea_desc: "У пошуках партнерів у своєму прагненні до національного визволення Південної Азії Філіппіни приєдналися до індійців. Після їхньої перемоги на Азіатсько-Тихоокеанському театрі воєнних дій молода республіка пожинає плоди."

 PHI_standing_our_grand_idea: "Стоячи на своєму"
 PHI_standing_our_grand_idea_desc: "Попри тиск з усіх боків, Філіппіни, всупереч очікуванням, зрештою не потрапили до німецької, японської чи американської сфери. Натомість, нинішній філіппінський уряд прийняв власну позицію (можливо, за допомогою інших неприєднаних держав), намагаючись протистояти світові. Наскільки вони незалежні насправді, можна сперечатися, але їхній дух незаперечний."

 PHI_pacific_vanguard: "Розширена філіппінська дипломатія"
 PHI_pacific_vanguard_desc: "Хоча найгірше з конфлікту в Азіатсько-Тихоокеанському регіоні вже позаду, національна безпека Філіппін вдома не може бути гарантована без готовності до участі за кордоном. Чи то через дипломатію, чи то через допомогу союзникам за кордоном, ми будемо стримувати зовнішні загрози."

 PHI_pacific_socialist_vanguard: "Тихоокеанський соціалістичний авангард"
 PHI_pacific_socialist_vanguard_desc: "Хоча ми досягли миру та свободи для Філіппін, світова революція триває за кордоном. Якщо пригноблені народи по всьому світу хочуть уникнути розгрому один за одним, ми всі повинні бути готові співпрацювати в боротьбі проти реакційних систем. Наші революційні армії повинні бути готові боротися за визволення всіх народів у Тихому океані."

 PHI_the_unconquerable_faith_idea: "Непереможний дух"
 PHI_the_unconquerable_faith_idea_desc: "Філіппінська революція почалася як маленька, але могутня мрія про свободу, справедливість та незалежність нашого народу від іноземних гнобителів. Тепер, коли ми пережили ще одне покоління потрясінь, єдиний спосіб захистити наступне покоління — це взяти активну участь за кордоном."

 PHI_the_glorious_republic_idea: "Наша національна слава"
 PHI_the_glorious_republic_idea_desc: "У жорстокому світі, де сильні поглинають слабких, важливо демонструвати не лише силу, але й славу. Виживання Філіппін у цій жорстокій війні за Тихий океан показало світові, що Філіппіни — це більше, ніж просто американська колонія, це перлина сама по собі. І хоробрий народ Філіппін продовжить боротися за захист своєї слави."

 PHI_our_seat_at_the_table_idea: "Завоювання нашого місця"
 PHI_our_seat_at_the_table_idea_desc: "Як новоспечена незалежна Республіка, вкинута в нестабільний і жорстокий світ без захисника, Філіппіни намагалися, щоб їх сприймали серйозно. Але завдяки нашій доблесті та хитрості ми боролися за те, щоб стояти на рівних серед націй світу, поки Тихий океан охопив безлад. І ми продовжуватимемо демонструвати нашу відданість захисту нашого дому, чи то тут, чи то за кордоном."

### Economic Ideas ###
 PHI_black_monday_1: "Вплив «Чорного понеділка»"
 PHI_black_monday_1_desc: "«Чорний понеділок» кинув нашу і без того ослаблену економіку в руйнівний штопор, дестабілізувавши нашу націю та зупинивши нашу кульгаву економіку. Щоб її відродити, доведеться ухвалювати неприємні рішення з потенційно жахливими наслідками для майбутнього."

 PHI_black_monday_2: "Відлуння «Чорного понеділка»"
 PHI_black_monday_2_desc: "Реалізовано перший раунд заходів реагування на надзвичайну ситуацію «Чорного понеділка», що принесло певне полегшення ситуації. Слабкий пульс національної економіки відновлено, хоча значна частина нації все ще оговтується від економічної руйнації."

 PHI_black_monday_3: "Стабілізація «Чорного понеділка»"
 PHI_black_monday_3_desc: "Після чергової серії заходів з надання допомоги «Чорний понеділок» здебільшого стабілізовано. Проте економічний спад продовжує завдавати шкоди найбільш уразливим верствам населення, навіть якщо негайне відновлення виявилося швидшим, ніж раніше побоювалися, завдяки відносній ізоляції Філіппін від німецької економічної сфери та наявній травмі від «Великої депресії»."

 PHI_agriculture_1_idea: "Нерівність у сільській місцевості"
 PHI_agriculture_1_idea_desc: "Спадщина іспанського та американського колоніалізму залишила Філіппіни з вкрай нерівноправним сільськогосподарським сектором. Товарні культури є життєво важливою частиною філіппінської економіки, але американська економічна політика тісно пов'язала Філіппіни зі Сполученими Штатами. Короткий сплеск сільськогосподарської модернізації та зростання в 1920-х роках різко зупинився з «Великою депресією».\n\nНапруженість між землевласниками та їхніми орендарями неодноразово переростала у насильство протягом останніх кількох років, спричинивши піднесення різноманітних радикальних груп лівого та правого спрямування. Американська влада та влада Співдружності спробували різні реформи для вирішення цих проблем, останнім з яких був Закон Кесона про частку рису для орендарів 1933 року. Однак ці зусилля були зупинені легко використовуваними лазівками, опором знаті, гнівом селян та нездатністю уряду догодити жодній зі сторін."

 PHI_industry_1_idea: "Зупинена індустріалізація"
 PHI_industry_1_idea_desc: "Обмежений промисловий ріст Філіппін зазнав серйозної невдачі під час «Великої депресії», що загальмувало їхній міський розвиток. Іноземні інвестиції вичерпалися, багато хто продовжує залишатися без роботи, а філіппінські фінансові установи продовжують намагатися знайти тверду основу під ногами. Оскільки більша частина економіки зосереджена навколо сільських секторів, було важко зібрати достатню політичну волю, щоб виштовхнути філіппінську промисловість із колії."

 PHI_mining_1_idea: "Занепад видобутку ресурсів"
 PHI_mining_1_idea_desc: "Хоча основна частина філіппінського експорту зосереджена на рисі та інших культурах, Філіппіни також є домом для значних покладів корисних копалин та інших природних ресурсів. Однак, оскільки «Велика депресія» зменшила попит на сировину в Сполучених Штатах, гірничодобувна та лісозаготівельна промисловість знизила свою продуктивність. У поєднанні з невеликою кількістю ресурсів, виділених на розвиток інфраструктури, філіппінська економіка намагається не відставати від своїх конкурентів."

 PHI_form_the_nepa_idea: "Національна асоціація економічного захисту"
 PHI_form_the_nepa_idea_desc: "«Національна асоціація економічного захисту» — це альянс патріотичних бізнесменів та громадських лідерів, присвячений заохоченню філіппінців купувати продукцію вітчизняного виробництва в надії змінити торговельний дефіцит."

 PHI_agriculture_populist_plan: "Перерозподіл землі"
 PHI_agriculture_populist_plan_desc: "З метою відновлення боротьби із соціальною нерівністю уряд Філіппін наполягає на агресивному регулюванні угод між орендарями та землевласниками, а в деяких випадках навіть на експропріації. Він також заохочує заселення державних земель у надії створити новий клас дрібних фермерів-йоменів. Запроваджено протекціоністські тарифи, щоб допомогти захистити філіппінських фермерів від недружньої іноземної конкуренції, оскільки Філіппіни прагнуть самодостатності.\n\n$PHI_agriculture_1_idea_desc$"

 PHI_agriculture_elite_plan: "Сільськогосподарська модернізація"
 PHI_agriculture_elite_plan_desc: "З метою відновлення процвітання уряд Філіппін зосередився на субсидуванні вдосконалення сільськогосподарських методів та технологій, що підвищує ефективність та продуктивність для створення конкурентоспроможної експортної економіки. У довгостроковій перспективі це створить такий необхідний достаток, який дозволить Філіппінам розвиватися в позитивному напрямку.\n\n$PHI_agriculture_1_idea_desc$"

 PHI_industry_populist_plan: "Захист місцевої промисловості"
 PHI_industry_populist_plan_desc: "Намагаючись роздути іскри вітчизняної промисловості, уряд Філіппін запровадив низку протекціоністських, а іноді й автаркічних політик, щоб розпочати заміщення імпорту промисловими товарами вітчизняного виробництва. Завдяки вищим тарифам, збільшеним субсидіям та закликам до патріотичних закупівель, Філіппіни сподіваються створити власну виробничу базу.\n\n$PHI_industry_1_idea_desc$"

 PHI_industry_elite_plan: "Міжнародні промислові інвестиції"
 PHI_industry_elite_plan_desc: "Намагаючись дати поштовх філіппінській індустріалізації, уряд Філіппін почав активно залучати іноземні інвестиції, зменшуючи торговельні бар'єри та регулювання, включно зі створенням спеціальних зон, спрямованих на заохочення економічного зростання. Вони прагнуть надалі пов'язати філіппінську економіку із зовнішнім світом, приносячи сучасність та процвітання.\n\n$PHI_industry_1_idea_desc$"

 PHI_mining_populist_plan: "Пріоритетність видобутку ресурсів"
 PHI_mining_populist_plan_desc: "Уряд Філіппін подвоїв зусилля щодо видобутку ресурсів, відкриваючи нові шахти та нові ліси в глибині сільської місцевості для експлуатації. Це дозволило збільшити зайнятість і допомогло змінити торговельний дефіцит, хоча надлишок продукції, що надходить на ринок, завдав шкоди прибуткам компаній.\n\n$PHI_mining_1_idea_desc$"

 PHI_mining_elite_plan: "Розвиток національної інфраструктури"
 PHI_mining_elite_plan_desc: "Уряд Філіппін прагнув залучити безробітних робітників до ремонту та розширення внутрішньої інфраструктури, що є дорогим і часом експлуатаційним заходом. Покращення транспортних мереж підвищило ефективність переміщення філіппінських товарів до порту для експорту, на користь наявних власників та об'єктів.\n\n$PHI_mining_1_idea_desc$"

 PHI_foreign_industrial_support_idea: "Іноземна промислова підтримка"
 PHI_foreign_industrial_support_idea_desc: "У своєму прагненні відновити економіку Філіппіни вирішили заручитися підтримкою іноземних ділових кіл, у багатьох випадках за явної підтримки іноземних держав. Хоча це виявилося корисним для економічного зростання, багато хто задається питанням, чи варта втрата суверенітету цього в довгостроковій перспективі."

### Military Ideas ###
 PHI_army_1: "Новонароджена армія"
 PHI_army_intro: "Після знищення Філіппінської революційної армії під час Філіппінсько-американської війни американська влада уникала дозволу на створення постійної філіппінської армії. Найближчим еквівалентом була Філіппінська констебларія, жандармерія, призначена для придушення місцевих повстань, і Філіппінські скаути, до складу яких входили філіппінці, що працювали на армію США. Лише «Закон про національну оборону» 1935 року офіційно створив Збройні сили Філіппін, і таким чином 21 грудня, лише через місяць після заснування Співдружності, народилася армія Філіппін разом із Радою національної оборони."
 PHI_army_1_desc: "Поки Сполучені Штати зберігають свою владу над Філіппінами, острови захищені від іноземних загроз, але що станеться, якщо їх відвернуть? \n\n$PHI_army_intro$"

 PHI_army_2: "Проблеми росту армії"
 PHI_army_2_desc: "Розширення цієї нової Філіппінської армії виявилося досить складним, попри амбітний план філіппінських та американських планувальників. Армія та її резерви збільшилися у розмірах, швидко випереджаючи наявну інфраструктуру для їх підготовки. Довелося будувати нові навчальні табори, а інструкторів залучати з Констебларії та Скаутів. \n\n$PHI_army_intro$"

 PHI_army_3a: "Армія за американським зразком"
 PHI_army_3a_desc: "Філіппінська армія продовжує розвиватися за тими самими напрямками, визначеними американськими військовими планувальниками у 1935 році. На чолі з багатьма військовими офіцерами, які пройшли підготовку у Вест-Пойнті, акцент робиться на військовому професіоналізмі. Ця програма почалася з реорганізації Філіппінської констебларії в Дивізію констебларії, створивши ядро, з якого буде працювати нова армія. \n\n$PHI_army_intro$"

 PHI_army_4a: "Армія за американським зразком"
 PHI_army_4a_desc: "З підготовленим ядром Філіппінської армії пріоритетом стало розширення програм підготовки піхоти та створення резервів, щоб довести Філіппінську армію до повної чисельності. Крім того, у фортах поблизу Маніли почали пропонувати артилерійську та спеціалізовану підготовку. \n\n$PHI_army_3a_desc$"

 PHI_army_5a: "Філіппінська армія"
 PHI_army_5a_desc: "Філіппінська армія нарешті досягла зрілості. Хоча вона була спланована за американським зразком, її побудували героїчні зусилля філіппінців. Завдяки сучасним, добре навченим і добре оснащеним дивізіям, що оточують елітне ядро, Філіппіни здатні вести будь-який конфлікт як поблизу, так і здалеку. Ця армія тепер здатна вирішувати виклики, що стоять перед нацією, і брати ініціативу проти будь-якого ворога! \n\n$PHI_army_4a_desc$"

 PHI_army_3b: "Спадщина революційної армії"
 PHI_army_3b_desc: "Дещо відхиляючись від планів, розроблених американцями в 1935 році, які в очах уряду продовжували розглядати Філіппінську армію як допоміжні сили, Генеральний штаб Філіппін наказав армії взяти уроки зі старої Філіппінської революційної армії та її тривалого опору у Філіппінсько-американській війні. Замість стилю війни, невідповідного для наших умов і залежного від остаточного прибуття американських підкріплень, Філіппінська армія має бути побудована для самостійного протистояння. Незважаючи ні на що. \n\n$PHI_army_intro$"

 PHI_army_4b: "Спадщина революційної армії"
 PHI_army_4b_desc: "Щоб полегшити цей процес, було швидко навчено велику кількість резервів і розміщено по всій країні місцеві осередки для партизанської боротьби. Були видані нові накази щодо озброєння та гранти на плани військового виробництва. Перш за все, народ має бути готовий взяти на себе тягар захисту нації. \n\n$PHI_army_3b_desc$"

 PHI_army_5b: "Філіппінська армія"
 PHI_army_5b_desc: "Філіппіни можуть бути вразливими для вторгнення з усіх боків із моря, але Філіппінська армія готова до цього завдання. Завдяки розосередженому та напівавтономному масиву підрозділів, здатних використовувати переваги місцевості, вони можуть стримувати та громити загарбників до того, як буде створено плацдарм. І якщо станеться немислиме, існують плани на випадок надзвичайних ситуацій, щоб забезпечити продовження боротьби окремих підрозділів. Піднесена «Духом 1899 року», Філіппінська армія збереже Філіппіни вільними! \n\n$PHI_army_4b_desc$"

 PHI_from_hooves_to_tires_idea: "Від копит до шин"
 PHI_from_hooves_to_tires_idea_desc: "Мобільність завжди була життєво важливою у війні, а масове виробництво легкових і вантажних автомобілів відкрило нові можливості як для постачання наших військ, так і для їхнього транспортування в ключові точки бою."

 PHI_domestic_rifle_production_idea: "Внутрішнє виробництво гвинтівок"
 PHI_domestic_rifle_production_idea_desc: "Філіппіни традиційно купували зброю за кордоном, проте, оскільки світ стає розділеним та ворожим, покладатися виключно на іноземний імпорт більше не можна. Ми повинні принаймні працювати над розширенням наших можливостей виробництва гвинтівок та боєприпасів усередині країни."

 PHI_prepare_for_the_storm_idea: "Готуючись до шторму"
 PHI_prepare_for_the_storm_idea_desc: "Оскільки війна на Тихому океані здається неминучою, а філіппінські військові явно не підготовлені, уряд Філіппін надав Раді національної оборони повну свободу дій, щоб швидко привести армію в бойову готовність. Деякі кажуть, що ця програма прискореної мілітаризації є запізнілою та надто малою, але, безумовно, щось краще, ніж нічого."

 PHI_lessons_from_the_revolution_idea: "Революційні уроки"
 PHI_lessons_from_the_revolution_idea_desc: "Філіппінська революція та Філіппінсько-американська війна продемонстрували, що, хоча наші противники завжди перевершують нас за озброєнням, завзятість і мужність наших бійців можуть змусити наших ворогів сісти за стіл переговорів, а іноді навіть повалити імперії."

 PHI_air_industry_idea: "Зростаюча авіаційна промисловість"
 PHI_air_industry_idea_desc: "Філіппінська авіаційна промисловість невелика, але завдяки рішучості нашого народу та значному державному фінансуванню нам вдалося придбати постійний потік літаків для захисту нашого неба."

 PHI_guardians_of_our_precious_skies_idea: "Філіппінські повітряні сили"
 PHI_guardians_of_our_precious_skies_idea_desc: "Виконавчим указом Президента Корпус армійської авіації Філіппін було підвищено до рівня Філіппінських повітряних сил. Хоробрим пілотам і невтомному наземному персоналу цієї нової та рівноправної гілки Збройних сил Філіппін доручено охороняти небо над Філіппінами. Нехай вони ширяють довго!"

 PHI_expand_naval_production_idea: "Розширення військово-морського виробництва"
 PHI_expand_naval_production_idea_desc: "Філіппінам довгий час бракувало власних військово-морських сил, найближчим до них був «Офшорний патруль» з філіппінським екіпажем, гілка Військово-морських сил Сполучених Штатів. З нашою незалежністю ми більше не можемо покладатися на інших у захисті наших берегів, особливо як острівний архіпелаг. Це буде дорого, але необхідно швидко створити флот з нуля, якщо ми хочемо захистити наші домівки від вторгнення."

 PHI_navy_spirit_idea: "Філіппінські військово-морські сили"
 PHI_navy_spirit_idea_desc: "На знак визнання того, як далеко ми зайшли, Президент офіційно оголосив про перейменування Філіппінського військово-морського патруля на Філіппінські військово-морські сили. Наші хоробрі моряки готові захищати береги та патрулювати хвилі проти всього, що загрожує нашому народу."

 PHI_foreign_military_mission: "Іноземна військова місія"
 PHI_foreign_military_mission_desc: "Філіппінська армія — це абсолютно нова установа, вперше затверджена в грудні 1935 року, яка ґрунтується на невеликому ядрі ветеранів Філіппінської констебларії та Філіппінських скаутів. Щоб полегшити швидке розширення, необхідне для захисту нової Республіки, Філіппіни прийняли іноземних радників з більш зрілих армій, щоб допомогти з переходом."

### Concerns and MIOs ###

 #Industrial Concerns
 PHI_national_development_company: "НАРКО"
 PHI_national_development_company_desc: "Національна компанія розвитку була заснована у 1919 році як Компанія національного сприяння — одна з найперших компаній Філіппін. Ця державна корпорація завдяки нещодавньому законодавству отримала свою нинішню назву та розширений мандат на інвестування державного капіталу, розвиток природних ресурсів та будівництво нових галузей промисловості. Її портфелі охоплюють судноплавство, авіацію, сталь, мідну електроніку, текстиль, цукор та багато іншого."

 PHI_philippine_national_bank: "ФНБ"
 PHI_philippine_national_bank_desc: "Філіппінський національний банк був заснований у 1916 році як державний банк, присвячений наданню фінансових позик на підтримку економічного розвитку. Обслуговуючи як промисловий, так і сільськогосподарський сектор, він ледь не збанкрутував у 1920-х роках через хронічне неефективне управління, що спричинило фінансову кризу 1921 року. Володіючи особливим правом випускати обігові банкноти, ФНБ був де-факто центральним банком та казначейством Філіппін. Хоча нині створено справжній центральний банк «Bangko Sentral ng Pilipinas», вплив ФНБ зберігається."

 PHI_manila_railroad_company: "МЗК"
 PHI_manila_railroad_company_desc: "Заснована в 1887 році та зареєстрована в 1892 році, Залізнична компанія Маніли має довгу та легендарну історію, що передує Філіппінській революції. Під час Великої війни Острівний уряд придбав британську «Manila Railway Company Limited» та американську «Manila Railroad Company of New Jersey», реорганізувавши їх в одну державну «Manila Railway Company». Зусилля з модернізації включали оновлення залізничних вагонів, електрифікацію залізниць, проєктування нових станцій і навіть виробництво власних локомотивів."

 PHI_national_power_corporation: "НКЕ"
 PHI_national_power_corporation_desc: "Національна корпорація енергетики була нещодавно заснована, коли уряд націоналізував гідроелектроенергетичну промисловість, включно з усією енергією, виробленою з озер, струмків та джерел. Їй було доручено електрифікувати Філіппіни, особливо в сільській місцевості."

 PHI_benguet_consolidated_mining_company: "БКГК"
 PHI_benguet_consolidated_mining_company_desc: "Бенгетська консолідована гірничодобувна компанія була заснована трьома американськими солдатами в 1903 році, що робить її найстарішою гірничодобувною компанією в країні. Вона експлуатує золоті копальні в однойменній провінції Бенгет, а також у провінції Камарінес-Норте, і контролює родовища хроміту та міді в інших частинах країни. Також ведуться розмови про розширення компанії на лісове господарство та вантажоперевезення за допомогою уряду."

 PHI_standard_oil: "Stanvac"
 PHI_standard_oil_desc: "У 1933 році «Стандард Ойл оф Нью-Йорк» та «Джерсі Стандард» об'єднали свої далекосхідні інтереси в одне спільне підприємство, відоме як «Standard Vacuum Oil Company» . Працюючи в десятках країн, філіппінська філія прагнула виграти вигідні державні тендери на створення нових нафтопереробних заводів на Філіппінах."

 PHI_mitsui: "Міцуї"
 PHI_mitsui_desc: "«Міцуї» — один із перших та найбільших компаній в Японії. Компанія починала як торгова компанія та банк, перш ніж стати мегаконгломератом, що має інтереси в промисловості, важкій хімічній промисловості, суднобудуванні, виробництві сталі та вугілля, а також страхуванні. Вона також відома як надійний партнер японських імперських інтересів, особливо зацікавлений у розвитку гірничодобувних та плавильних підприємств у Південно-Східній Азії."

 #Material Designers
 PHI_squires_bingham_co: "Squires Bingham"
 PHI_squires_bingham_co_desc: "«Squires Bingham & Co» розпочалася як друкарня в Манілі, яка потім розширилася до продажу іноземних мотоциклів та спортивних товарів. Це включало продаж мисливських гвинтівок та боєприпасів, і вона зайняла вигідну позицію (за допомогою деяких заповзятливих інвесторів), щоб почати виготовляти гвинтівки для задоволення раптового державного попиту на вогнепальну зброю вітчизняного виробництва."

 PHI_yutivo_corporation: "Yutivo"
 PHI_yutivo_corporation_desc: "Ця корпорація була заснована у 1887 році та збирала імпортовані автомобілі від різних міжнародних виробників, включаючи «Chevrolet», «Opel», «Holden», «Vauxhall», «Buick» та «Isuzu». Прагнення уряду до місцевого виробництва автомобілів дозволило «Yutivo» розширитися до оборонної підрядної фірми завдяки щедрим субсидіям."

 PHI_krupp_ost_asien_artillery: "Krupp"
 PHI_krupp_ost_asien_artillery_desc: "Це німецька компанія, заснована як сталеливарний завод у 1811 році. Її вихід у світ військового виробництва розпочався з першого виробництва сталевих гармат для російської, турецької та прусської армій, а після об'єднання Німеччини її розмір стрімко зріс. Сьогодні вона відома виробництвом кораблів, підводних човнів, танків та артилерії. Зі зростанням німецького впливу у Східній Азії після Вельткригу «Krupp» послідував за імперією в Тихий океан."

 PHI_ford_motor_company: "Ford"
 PHI_ford_motor_company_desc: "Компанія «Ford Motor Company» була заснована у 1903 році її тезкою Генрі Фордом. Модель «Т» була вперше зібрана на місці, на Філіппінах, у 1913 році, а в 1929 році як місцеве дочірнє підприємство було засновано «Pilipinas Ford Car Works, Inc». Як один із найбільш домінуючих американських виробників автомобілів, її охоплення поширюється аж до Маніли."

 #Armour Designers
 PHI_government_arsenal: "Урядовий арсенал"
 PHI_government_arsenal_desc: "Це державне оборонне агентство, якому доручено виробляти та закуповувати зброю для військових та поліції. Через відсутність інших варіантів, уряд Філіппін змушений покладатися на арсенал, щоб хоч якось придбати більш сучасне обладнання, таке як бронетехніка та танки."

 PHI_krupp_ost_asien_tanks: "Krupp"
 PHI_krupp_ost_asien_tanks_desc: "$PHI_krupp_ost_asien_artillery_desc$"

 #Air Designers
 PHI_NIST: "НДІНТ"
 PHI_NIST_desc: "Національний дослідний інститут науки і техніки — це невелике конструкторське бюро літаків, розташоване в Манілі, яке прагне започаткувати виробництво філіппінських літаків із використанням місцевих матеріалів, таких як дерево. Хоча він не надто успішний, вигідні державні субсидії дозволили йому залишатися претендентом на військові контракти."

 PHI_nakajima: "Nakajima"
 PHI_nakajima_desc: "Ця авіабудівна компанія була заснована у 1918 році військово-морським інженером Накадзімою Чікухеєм, який через рік викупив частку свого співзасновника. Тісна та рання співпраця з Імператорською армією Японії дозволила їй розширитися до кількох заводів по всій Японії та зробила її провідним конструктором і виробником військових літаків."

 PHI_focke_wulf_ost_asien: "Focke Wulf"
 PHI_focke_wulf_ost_asien_desc: "Ця компанія була створена у 1923 році. Виробляючи як цивільні, так і військові літаки, вони є великим німецьким аерокосмічним конструктором."

 #Naval Designers
 PHI_NSSC: "НСКСС"
 PHI_NSSC_desc: "Національна корпорація суднобудування та сталі була заснована указом Президента як державний проєкт. Це один із найбільших сталеливарних заводів на Філіппінах, і, попри державну підтримку, дехто сумнівається, чи справді він здатен виробляти кораблі для флоту."

 PHI_electric_boat: "Electric Boat"
 PHI_electric_boat_desc: "Айзек Райс заснував цю компанію у 1899 році. Сеціалізуютьсяя на будівництві підводних човнів. Через рік USS «Holland» став першим підводним човном, побудованим ними для Військово-морських сил Сполучених Штатів. Було розроблено та виготовлено кілька наступних моделей. Electric Boat Company залишається одним із двох основних виробників підводних човнів у США."

 PHI_sasebo_naval_arsenal: "Сасебо"
 PHI_sasebo_naval_arsenal_desc: "Військово-морський арсенал Сасебо є однією з чотирьох основних військово-морських верфей, що належать Імператорським військово-морським силам Японії. Заснований у 1886 році як військово-морська база, незабаром він був розширений, щоб включити ремонтний об'єкт, сухий док, а потім і верф. «Велика війна» призвела до модернізації та розширення його об'єктів, і зараз це провідний суднобудівник для Імператорських військово-морських сил Японії."

