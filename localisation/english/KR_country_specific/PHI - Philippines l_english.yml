 USA_encourage_philippine_neutrality: "Заохочувати нейтралітет Філіппін"
 USA_encourage_philippine_neutrality_desc: "Реальність така, що наш контроль над Філіппінами зламано, можливо, безповоротно. Замість того щоб боротися з неминучим, важливо гарантувати, що Філіппіни не дрейфуватимуть у табори воюючих Японії чи Німеччини. Можливо, пізніше, у кращі часи, ми зможемо відновити дружбу."
 USA_economic_aid_package_to_the_philippines: "Пакет економічної допомоги Філіппінам"
 USA_economic_aid_package_to_the_philippines_desc: "$GEA_economic_aid_package_to_the_philippines_desc$"
