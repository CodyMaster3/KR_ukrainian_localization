 PHI_totalist_party: "ПРФ" # Робітнича організація Філіппін або Партія Робітників Філіппін
 PHI_totalist_party_long: "$PHI_syndicalist_party_long$"

 PHI_syndicalist_party: "ПРФ"
 PHI_syndicalist_party_long: "Партія робітників Філіппін\n§L«Партія робітників» є провідним органом філіппінських ультралівих. Заснована у 1924 році як засіб для просування робітничих кандидатів на муніципальних виборах, вона була швидко захоплена ультралівими активістами, які використовували її як групу тиску, щоб підштовхнути Філіппінський робітничий конгрес до більш радикальної позиції. ПРФ ідеологічно є синдикалістською партією та філією Третього Інтернаціоналу; її основна підтримка зосереджена серед манільського робітничого класу. Однак, вона сформувала тісні зв'язки з великими селянськими групами на острові Лусон, що є необхідністю в країні, де більшість населення досі сільське.§!\n"

 PHI_radical_socialist_party: "ПРФ"
 PHI_radical_socialist_party_long: "$PHI_syndicalist_party_long$"

 PHI_social_democrat_party: "РП"
 PHI_social_democrat_party_long: "Республіканська партія\n§L«Республіканська партія» була заснована письменником, журналістом та робітничим активістом Ісабело де лос Реєсом у 1905 році. Відображаючи прогресивні та своєрідні переконання де лос Реєса, вона була головним чином засобом для його власних виборчих зусиль. Зрештою, де лос Реєс передав керівництво «Республіканцями» своєму близькому другу Грегоріо Агліпаю, першому єпископу Філіппінської незалежної церкви. Фактично вона припинила своє існування після президентських виборів 1935 року.§!\n"

 PHI_social_liberal_party: "ДП"
 PHI_social_liberal_party_long: "Демократична партія\n§L«Демократична партія» була створена у 1917 році після злиття «Національної прогресивної партії» та «Національної демократичної партії», які на той час були двома головними опонентами «Націоналістичної партії». Фактично, «Демократи» були майже повністю визначені своєю опозицією до «Націоналістів». Коли «Націоналісти» розкололися між собою, «Демократи» змогли скористатися цим поділом; але коли «Націоналісти» знову об’єдналися, «Демократи» знову опинилися за бортом. Після багатьох років боротьби за альтернативне бачення філіппінської політики партія рухається у більш прогресивному напрямку під керівництвом блискучого Кларо М. Ректо, який позиціонує «Демократів» як захисників чистого уряду та громадянських свобод.§!\n"

 PHI_market_liberal_party: "НП"
 PHI_market_liberal_party_long: "Націоналістична партія\n§L«Націоналістична партія» була заснована у 1907 році молодими політиками, які виступали за незалежність від Сполучених Штатів. Завдяки цій простій програмі вони здобули нищівну перемогу на перших законодавчих виборах і відтоді нею керували. Контролюючи політику на національному, провінційному та місцевому рівнях, «Націоналісти» побудували вражаючу машину, засновану на сімейних династіях, клієнтелізмі та корупції. Лідер партії Мануель Кесон побудував свою кар'єру на майстерності цієї брудної політичної гри, але це не означає, що його дії є повністю цинічними. Кесон та «Націоналісти» щиро прагнуть національного розвитку, намагаючись зберегти стабільність та традиційну філіппінську ієрархію.§!\n"

 PHI_social_conservative_party: "НП"
 PHI_social_conservative_party_long: "$PHI_market_liberal_party_long$"

 PHI_authoritarian_democrat_party_roxas: "НП"
 PHI_authoritarian_democrat_party_roxas_long: "Націоналістична партія\n§L«Націоналістична партія» була заснована у 1907 році молодими політиками, які виступали за незалежність від Сполучених Штатів. Завдяки цій простій програмі вони здобули нищівну перемогу на перших законодавчих виборах і відтоді нею керували. Контролюючи політику на національному, провінційному та місцевому рівнях, «Націоналісти» побудували вражаючу машину, засновану на сімейних династіях, клієнтелізмі та корупції. Лідер партії Мануель Кесон побудував свою кар'єру на майстерності цієї брудної політичної гри, але це не означає, що його дії є повністю цинічними. Кесон та «Націоналісти» щиро прагнуть національного розвитку, намагаючись зберегти стабільність та традиційну філіппінську ієрархію.§!\n"

 PHI_authoritarian_democrat_party: "ППС"
 PHI_authoritarian_democrat_party_long: "Партія пангільського соціаліста\n§L«Партія пангільського соціаліста» є нещодавнім явищем. Вона є не більш ніж засобом для потенційного кандидата у президенти Еміліо Агінальдо, який оголошує її не партією, а «рухом». Підтримка, яку вона має, надходить головним чином від літніх ветеранів Війни за незалежність та Філіппінсько-американської війни, які бачать в Агінальдо свого лідера. Таким чином, репутація ППС є синонімом репутації Агінальдо, який, попри це, є популярною фігурою серед простих людей.§!\n"

 PHI_paternal_autocrat_party: "ФК"
 PHI_paternal_autocrat_party_long: "Філіппінська констебларія\n§L«Філіппінська констебларія» була створена американцями, які потребували допоміжного тубільного підрозділу для підтримки правопорядку на островах під час своєї завойовницької війни. Основними завданнями Констебларії були розгром останніх повстанців та придушення Повстання Моро; відтоді вона перетворилася на щось на кшталт національної жандармерії, слугуючи правоохоронним органом та компонентом національної оборони поряд з молодою армією. Констебларія має дурну славу серед простих людей через свою жорстокість у придушенні потенційних загроз державі, чи то протестуючих селян, чи то релігійних рухів.§!\n"

 PHI_national_populist_party: "ПС"
 PHI_national_populist_party_long: "Партія сакдалістів\n§L«Партія сакдалістів» була заснована у 1933 році незадоволеним колишнім націоналістом Беніньо Рамосом. Рамос працював клерком у Сенаті і був близький до Кесона, але розірвав стосунки з партією після участі в несанкціонованому страйку. Потім він заснував газету «Сакдал» (тагальською означає «звинувачувати»), яка стала антинаціоналістичною писаниною, нещадно атакуючи уряд за провини як реальні, так і уявні. Рух сакдалістів поширився по всьому Лусону, здобуваючи підтримку завдяки своєму популізму, крайньому націоналізму та антиамериканізму.§!\n"

########################################
#####- Section 03: Characters - ########
########################################

###- Country Leaders -###

 PHI_crisanto_evangelista: "Крісанто Евангеліста"
 PHI_crisanto_evangelista_leader_desc: "§YНародився:§! §L1 листопада 1888 року в Мейкауаяні, провінція Булакан, Філіппіни§!\n§YБіографія:§! §LКрісанто Евангеліста, виходець із селянської родини, став учнем друкаря у зростаючому місті Манілі. Він приєднався до однієї з перших профспілок країни, «Unión de Impresores de Filipinas» (Союз друкарів Філіппін), зрештою ставши її генеральним секретарем. Хоча Евангеліста спочатку був націоналістом, він все більше потрапляв під вплив марксистських ідей і приєднався до «Партії робітників», де очолив рух за її перетворення на справді революційну соціалістичну партію. Відтоді «Партія робітників» підштовхнула «Congreso Obrero de Filipinas» (Робітничий конгрес Філіппін) до синдикалізму. Евангеліста заслужив похвалу Третього Інтернаціоналу, який визнає його верховним лідером філіппінського синдикалізму.§!"

 PHI_juan_feleo: "Хуан Фелео"
 PHI_juan_feleo_leader_desc: "§YНародився:§! §L1 травня 1896 року в Санта-Росі, провінція Нуева-Есіха, Генерал-капітанство Філіппін§!\n§YБіографія:§! §LХуан Фелео, син дрібного землевласника, який втрачав статки, став шкільним учителем, але швидко знайшов своє покликання у захисті бідних орендарів, яким загрожувало виселення. Коли в центральному Лусоні почали виникати селянські організації, «Націоналістична партія» спонсорувала створення «Kalipunang Pambansa ng Magbubukid sa Pilipinas» (Національна конфедерація селян Філіппін). Фелео став віцепрезидентом НКСФ і скерував групу в більш войовничому напрямку, протистоячи політичному істеблішменту. Його успіх і популярність, включаючи кілька ув'язнень, принесли йому місце серед керівництва «Партії робітників» як голови селянського відділу.§!"

 PHI_gregorio_aglipay: "Грегоріо Агліпай"
 PHI_gregorio_aglipay_leader_desc: "§YНародився:§! §L5 травня 1860 року в Батаку, провінція Ілокос-Норте, Генерал-капітанство Філіппін§!\n§YБіографія:§! §LХоча більшість членів філіппінського духовенства не підтримували повстання проти іспанської корони, отець Грегоріо Агліпай був винятком. Перейшовши на бік революційної справи, Агліпай став капеланом тимчасового уряду і був єдиним священнослужителем, який відвідав Конгрес Малолоса, за що був відлучений від церкви архієпископом Маніли. Після війни письменник Ісабело де лос Реєс переконав Агліпая приєднатися до його руху за незалежну націоналістичну церкву. «Філіппінська незалежна церква» була заснована в 1902 році, а Грегоріо Агліпай став її першим Верховним єпископом. Пізніше він змінив де лос Реєса на посаді лідера прогресивної «Республіканської партії».§!"

 PHI_claro_recto: "Кларо Ректо"
 PHI_claro_recto_leader_desc: "§YНародився:§! §L8 лютого 1890 року в Тіаонгу, провінція Тайабас, Генерал-капітанство Філіппін§!\n§YБіографія:§! §LКларо Ректо, виходець із освіченої родини вищого середнього класу, був блискучим студентом, який розпочав дуже успішну юридичну кар'єру. Почавши як юридичний радник Сенату, він переміг на виборах до Палати представників від другого округу Батангаса. Через кілька років Ректо став лідером фракції меншості демократів у Палаті, що дало йому місце в місії незалежності до Сполучених Штатів. Хоча він часто намагався повернутися до юридичної практики та викладання, Ректо завжди повертався у світ політики. Він найбільш відомий як основний автор Філіппінської конституції.§!"

 PHI_manuel_luis_quezon: "Мануель Кесон"
 PHI_manuel_luis_quezon_leader_desc: "§YНародився:§! §L19 серпня 1878 року в Балері, провінція Нуева-Есіха, Генерал-капітанство Філіппін§!\n§YБіографія:§! §LІсторія філіппінської політики з часів американського правління може бути історією однієї людини: Мануеля Кесона. Призупинивши навчання на юридичному факультеті, щоб приєднатися до Республіканської армії під час Філіппінсько-американської війни, Кесон був обраний губернатором своєї рідної провінції у віці 28 років. Наступного року він був обраний до Перших філіппінських законодавчих зборів і став лідером більшості. Разом зі спікером Палати Серхіо Осменьєю він заснував Націоналістичну партію, яка відтоді вигравала кожні вибори. Кесон та Осменья мали мінливі стосунки, і їхні послідовні сварки та примирення домінували в політичному житті. Але Кесон взяв гору, і саме під його егідою була остаточно забезпечена встановлена ​​дата незалежності від Сполучених Штатів. За це Кесон легко виграв вибори, ставши першим президентом Філіппінської Співдружності.§!"

 PHI_manuel_roxas: "Мануель Рохас"
 PHI_manuel_roxas_leader_desc: "§YНародився:§! §L1 січня 1892 року в Капісі, провінція Капіс, Генерал-капітанство Філіппін§!\n§YБіографія:§! §LПоходячи з великої землевласницької родини «гасієндадо», Мануель Рохас пішов шляхом більшості молодих філіппінців вищого класу того часу і вступив до юридичної школи. Пройшовши шлях від губернатора Капіса до Палати представників, Рохас став спікером Палати та увійшов до першого ряду керівництва націоналістів. Разом із Кесоном та Осменьєю він лобіював незалежність у Сполучених Штатах у мінливому процесі, де націоналістичні амбіції поєднувалися з політичною доцільністю та особистим суперництвом. Тим не менш, Рохас зберіг своє місце серед трійки лідерів і став міністром фінансів Кесона.§!"

 PHI_emilio_aguinaldo: "Еміліо Агінальдо"
 PHI_emilio_aguinaldo_leader_desc: "§YНародився:§! §L22 березня 1869 року в Кавіте-ель-В’єхо, провінція Кавіте, Генерал-капітанство Філіппін§!\n§YБіографія:§! §LЕміліо Агінальдо народився в заможній родині; його батько служив муніципальним губернатором іспанської адміністрації, і Агінальдо пішов його стопами. Тим не менш, він приєднався до революційного таємного товариства «Катіпунан» і став лідером повстанців Кавіте. Після кількох перемог над іспанцями була проголошена Перша Філіппінська Республіка, президентом якої став Агінальдо. Однак іспанська контратака змусила Агінальдо емігрувати, повернувшись лише під час Іспано-американської війни. Революціонери та американці незабаром посварилися, і в результаті конфлікту сили Агінальдо були розгромлені. Після здачі американцям Агінальдо відійшов від політики, але залишався активним у ветеранських організаціях і є живим символом революції.§!"

 PHI_paulino_santos: "Пауліно Сантос"
 PHI_paulino_santos_leader_desc: "§YНародився:§! §L22 червня 1890 року в Камілінгу, провінція Тарлак, Генерал-капітанство Філіппін§!\n§YБіографія:§! §LПісля досягнення 18-річчя Пауліно Сантос вступив на службу до Філіппінської констебларії; після чотирьох років служби він вступив до Офіцерської школи констебларії, яку закінчив з відзнакою. Лейтенант Сантос брав участь у двох кампаніях проти Моро, де відзначився своїм лідерством і відвагою. Коли настав час формування справжньої Армії Співдружності, Сантос був одним із офіцерів Констебларії, відібраних для переведення. Таким чином він отримав звання бригадного генерала. Швидко просуваючись по службі, він також довів, що є надзвичайно здібним адміністратором, і уряд також розглядає його кандидатуру для великих цивільних проєктів.§!"

 PHI_benigno_ramos: "Беніньо Рамос"
 PHI_benigno_ramos_leader_desc: "§YНародився:§! §L10 лютого 1892 року в Булакані, провінція Булакан, Генерал-капітанство Філіппін§!\n§YБіографія:§! §LЯк і багато хто з представників зростаючого середнього класу, Беніньо Рамос працював учителем, перш ніж переїхати до Маніли з метою вступити на державну службу. Спочатку він досяг успіху, піднявшись до посади співробітника Сенату і навіть налагодивши стосунки з Кесоном. Але після того, як Рамос приєднався до страйку вчителів, Кесон зажадав його відставки, змусивши Рамоса з гіркотою вийти з Націоналістичної партії. Він заснував газету «Сакдал», яка жорстоко критикувала Кесона та політичну еліту. Популістський стиль Рамоса приніс йому прихильність, і зрештою він сформував рух сакдалістів.§!"

###- Second in Commands -###
 PHI_guillermo_capadocia: "Гільєрмо Кападосія"
 PHI_guillermo_capadocia_sic_desc: "§YНародився:§! §L1909 року, в провінції Негрос Орієнталь, Територія Філіппіни, Сполучені Штати Америки§!\n§YБіографія:§! §LНародившись у бідній робітничій родині, Кападосія працював кухарем та офіціантом, перш ніж стати профспілковим діячем у 1920-х роках. Попри відсутність формальної освіти, він відомий як високограмотна людина та експерт із соціалістичної літератури. Будучи членом Центрального комітету та генеральним секретарем «Партії робітників», він є надзвичайно помітним соціалістом та профспілковим організатором.§!"

 PHI_norberto_nabong: "Норберто Набонг"
 PHI_norberto_nabong_sic_desc: "§YНародився:§! §Lу Генерал-капітанстві Філіппін§!\n§YБіографія:§! §LНорберто Набонг, електрик за освітою, став міським радником у Манілі як член опозиційної до Кесона «Партії робітників». Грегоріо Агліпай обрав його кандидатом у віцепрезиденти під час виборів 1935 року, ймовірно, сподіваючись розширити переважно сільську базу підтримки «Республіканської партії», включивши до неї міських робітників.§!"

 PHI_vicente_sotto: "Вісенте Сотто"
 PHI_vicente_sotto_sic_desc: "§YНародився:§! §L18 квітня 1877 року в місті Себу, провінція Себу, Генерал-капітанство Філіппін§!\n§YБіографія:§! §LЗдобувши освіту в Університеті Сан-Карлос, у 1899 році він опублікував «Justicia» — першу газету в Себу, видану громадянином Філіппін, де він виступав за незалежність. Після цензури американського губернатора, він продовжив тиждень по тому, опублікувавши «El Nacional», що призвело до його ув'язнення. Не злякавшись, він продовжував публікувати навіть після звільнення, також зробивши великий внесок у культуру Себуано завдяки своїм п'єсам, одну з яких він присвятив: «Моїй Вітчизні, щоб ти пам'ятала про славну Революцію, яка викупила тебе з рабства. Тобі присвячую цю скромну п'єсу». \n\nСотто вперше прийшов у політику в 1902 році як член міської ради Себу. Пізніше він вивчав право в Юридичному коледжі Маніли, склав іспит на адвоката в 1907 році, а також виграв вибори на посаду мера, попри судову тяганину щодо викрадення та вигнання в Гонконгу. Він повернувся на Філіппіни в 1914 році, балотувавшись до Філіппінської Палати представників у 1922 році. Будучи соратником «Демократичної партії», він також є молодшим братом сенатора Філемона Сотто та членом «Філіппінської незалежної церкви» і соратником Грегоріо Агліпая.§!"

 PHI_sergio_osmena: "Серхіо Осменья"
 PHI_sergio_osmena_leader_desc: "§YНародився:§! §L9 вересня 1878 року в місті Себу, провінція Себу, Генерал-капітанство Філіппін§!\n§YБіографія:§! §LНароджений позашлюбною дитиною Дона Антоніо Сансона, видатного китайського підприємця-метиса та землевласника, він узяв ім'я матері й був прийнятий багатою китайсько-філіппінською родиною Осменья. Навчаючись у Коледжі Сан-Хуан де Летран, він познайомився з Мануелем Кесоном, своїм майбутнім союзником та суперником. Вивчаючи право, він піднявся по службі, ставши обраним губернатором Себу в 1906 році.\n\nЧерез рік він балотувався на місце в новоствореній Філіппінській Асамблеї та став її першим спікером. Він став співзасновником «Націоналістичної партії» разом із Кесоном, конфліктуючи з американською владою. Тим не менш, його обрали до Сенату, де він став тимчасовим президентом. Пара розкололася через законопроєкт Гейра-Гоуса-Каттінга: Осменья підтримав законопроєкт, тоді як Кесон відхилив його через кілька положень про військові бази. Це спричинило розкол у «Націоналістичній партії», причому крило Кесона здобуло перевагу на виборах 1934 року. У 1935 році обидва крила примирилися й балотувалися єдиним списком, при цьому Кесон став першим президентом Співдружності, а Осменья обійняв посаду віцепрезидента.§!"

 PHI_elpidio_quirino: "Ельпідіо Кіріно"
 PHI_elpidio_quirino_sic_desc: "§YНародився:§! §L16 листопада 1890 року у Вігані, провінція Ілокос-Сур, Генерал-капітанство Філіппін§!\n§YБіографія:§! §LНародившись у провінційній в'язниці Вігана в сім'ї китайського походження (метисів), Кіріно займався адвокатською діяльністю, перш ніж його обрали до Філіппінської Палати представників у 1922 році. Потім його обрали сенатором у 1925 році, де він обіймав посаду виконувача обов'язків лідера більшості з 1932 по 1933 рік, коли внутрішньопартійне напруження зросло під час дебатів щодо законопроєкту Гейра-Гоуса-Каттінга, і як Беніньо Акіно-старший, так і Серхіо Осменья поїхали до Сполучених Штатів, щоб лобіювати його прийняття. Коли двопалатний Конгрес був скасований у 1935 році, він втратив своє місце, але, як кажуть, прагне повернутися в «Націоналістичну партію».§!"

 PHI_raymundo_melliza: "Раймундо Мелліса"
 PHI_raymundo_melliza_sic_desc: "§YНародився:§! §L15 березня 1854 року в місті Ілоїло, провінція Ілоїло, Генерал-капітанство Філіппін§!\n§YБіографія:§! §LНавчаючись в Університеті Санто-Томас, Раймундо Мелліса шукав подальшої освіти в Іспанії наприкінці 1870-х років. Він повернувся на Філіппіни в 1880 році, працюючи суддею, перш ніж взяти участь у Філіппінській революції. Недовго будучи президентом недовговічної федеративної держави Вісаяс на острові Панай, він виконував обов’язки революційного генерала, а пізніше — губернатора Ілоїло під час американської окупації з 1904 по 1906 рік. Невдовзі після цього він відійшов від політики, але через десятиліття повернувся, приєднавшись до Еміліо Агінальдо як кандидат у віцепрезиденти на філіппінських виборах 1935 року. Хоча він не досяг успіху у своїй кандидатурі, він залишається політично активним у русі Агінальдо.§!"

 PHI_basilio_jose_valdes: "Базіліо Вальдес"
 PHI_basilio_jose_valdes_sic_desc: "§YНародився:§! §L10 липня 1892 року в місті Маніла, провінція Маніла, Генерал-капітанство Філіппін§!\n§YБіографія:§! §LБатько Вальдеса був лікарем і колишнім однокласником філіппінського героя Хосе Рісаля, але після смерті його матері, коли йому було п'ять років, його родина переїжджала з міста в місто. Навчаючись у школах в Іспанії, на Філіппінах та в Гонконзі, він став лікарем. Після нетривалого перебування на посаді студентського лідера та викладача він пішов добровольцем у Велику війну як медичний волонтер до Французької армії. \n\nПовернувшись додому після війни, він керував клінікою в Манілі, перш ніж його попросили приєднатися до Філіппінської констебларії, щоб переглянути їхні медичні послуги в 1922 році. Протягом чотирьох років він був головним хірургом, ставши медичним інспектором до 1934 року, коли він став бригадним генералом і начальником Констебларії. До 1936 року його було обрано на посаду заступника начальника штабу Філіппінської армії під керівництвом Пауліно Сантоса.§!"

 PHI_celerino_tiongco: "Селеріно Тіонгко"
 PHI_celerino_tiongco_sic_desc: "§YНародився:§! §Lу Генерал-капітанстві Філіппін§!\n§YБіографія:§! §LВідносно невідома фігура, Тіонгко, як кажуть, родом із Санта-Роси, Лагуна. Поки Беніньо Рамос був відсутній, проводячи кампанію в Сполучених Штатах проти прийняття законопроєкту Гейра-Гоуса-Каттінга, Тіонгко став виконувачем обов’язків менеджера газети «Сакдал», демонструючи свою помітність як лідера руху сакдалістів. Розчарування через неефективний тур призвели до перетворення руху сакдалістів на більш формальну партію, і Тіонгко брав участь в організації численних регіональних осередків і в кампанії під час виборів 1934 року. Проте Травневе повстання 1935 року завдало удару по руху сакдалістів, змусивши його керівництво перейти в підпілля.§!"

###- Commanders -###

 #Non-Socialists
 PHI_vicente_lim: "Вісенте Лім"
 PHI_vicente_lim_army_chief_desc: "§YНародився:§! §L24 лютого 1888 року в Каламбі, провінція Лагуна, Генерал-капітанство Філіппін§!\n§YБіографія:§! §LВісенте Лім, третій із чотирьох дітей, походив із китайського роду: його батько був повнокровним санглеєм, а мати — метискою де санглей (китайська метиска). Його батьки дружили з родиною Хосе Рісаля, національного героя Філіппін. Коли йому було 14 років, Вісенте сформував групу дітей, які виступали кур'єрами для сил генерала Мігеля Мальвара в Каламбі. Після закінчення Філіппінсько-американської війни Вісенте став учителем, і завдяки його спортивній формі та навичкам у математиці йому порадили подати документи до Військової академії Сполучених Штатів у Вест-Пойнті. Там він став першим філіппінцем, який вступив до цієї школи. Попри сильну расову упередженість, Вісенте був єдиним іноземним курсантом, який закінчив випуск 1914 року. Після закінчення навчання він отримав посаду у Філіппінських скаутах, де протягом останніх кількох років почав навчати офіцерів у Філіппінській констебларії. Завдяки своєму досвіду навчання в Сполучених Штатах, він залишається одним із найбільш кваліфікованих військових офіцерів на острові.§!"

 PHI_carlos_p_romulo: "Карлос П. Ромуло"
 PHI_carlos_p_romulo_commander_desc: "§YНародився:§! §L14 січня 1898 року в Інтрамуросі, провінція Маніла, Генерал-капітанство Філіппін§!\n§YБіографія:§! §LКарлос Ромуло народився в сім'ї батьків-пангасінанців, які воювали проти Сполучених Штатів під час Філіппінсько-американської війни. Потім його батько перейшов на роботу в уряд США на Філіппінах, піднявшись по службі до міського радника, мера і, зрештою, губернатора провінції Тарлак. Карлос почав свою освіту в Центральній початковій школі Камілінга, а потім став професором англійської мови в Університеті Філіппін. Потім він отримав посаду секретаря президента Сенату Філіппін Мануеля Кесона. Він пішов за своєю пристрастю до літературного світу, ставши видавцем і редактором «Філіппінського вісника» і став одним із засновників «Бойскаутів Філіппін».§!"

 PHI_ruperto_kangleon: "Руперто Канглеон"
 PHI_ruperto_kangleon_commander_desc: "§YНародився:§! §L27 березня 1890 року в Макрохоні, провінція Лейте, Генерал-капітанство Філіппін§!\n§YБіографія:§! §LРуперто Канглеон навчався до шостого класу в Лейте, а потім закінчив початкову освіту в Сурігао, бо відмовився підкорятися тому, що він вважав надмірною та гнітючою поведінкою керівництва школи. Потім він поїхав до Себу, де відзначився як різнобічний зірковий спортсмен і був відправлений за кордон у складі олімпійської команди Філіппін 1912 року. Після закінчення навчання він поїхав до Маніли й вступив до Університету Філіппін, але його привабило військове життя. Він записався і був прийнятий до Школи Філіппінської констебларії, де став видатним офіцером у кампаніях із умиротворення проти злочинних елементів.§!"

 PHI_jesus_vargas: "Хесус Варгас"
 PHI_jesus_vargas_high_command_desc: "§YНародився:§! §L22 березня 1905 року в провінції Маніла, Філіппіни, Сполучені Штати Америки§!\n§YБіографія:§! §LХесус Міранда Варгас закінчив бакалаврат наук у Філіппінській академії констебларії у 1929 році. Потім він поїхав до Сполучених Штатів, щоб навчатися в артилерійській школі, а потім став ад’ютантом президента Філіппін та командувача.§!"

 PHI_mateo_capinpin: "Матео Капінпін"
 PHI_mateo_capinpin_high_command_desc: "§YНародився:§! §L22 квітня 1887 року в Моронгу, провінція Рісаль, Генерал-капітанство Філіппін§!\n§YБіографія:§! §LМатео Капінпін здобував початкову та середню освіту у Вищій школі Лагуни. Після закінчення навчання він приєднався до Філіппінських скаутів, де у віці 24 років став наймолодшим старшим сержантом. Він піднявся по службі та отримав офіцерське звання, прийнявши командування 45-м піхотним полком. Подальше навчання привело його до Школи піхоти армії Сполучених Штатів у Форт-Беннінгу, Джорджія, у 1920 році. У 1936 році Капінпін залишив Філіппінських скаутів, щоб приєднатися до новоствореної Філіппінської армії.§!"

 #Socialists
 PHI_luis_taruc: "Луїс Тарук"
 PHI_luis_taruc_army_chief_desc: "§YНародився:§! §L21 червня 1913 року в Санта-Моніці, Сан-Луїс, провінція Пампанга, Територія Філіппіни, Сполучені Штати Америки§!\n§YБіографія:§! §LЛуїс Тарук народився в бідності в селянській родині. У віці восьми років Луїс навчався в державній школі в Сан-Мігелі, Булакан. У п'ятнадцять років він відвідував середню школу в місті Тарлак. Потім він два роки навчався в Університеті Маніли, вивчаючи медицину та право, але через витрати не зміг дозволити собі навчання. Потім він повернувся до Батасана, де відкрив кравецьку майстерню зі своїм братом. У юності його надихали історії про «Катіпунерос», які боролися за незалежність і свободу проти Іспанії, і незабаром деякі люди в його селі та провінції почали бачити в ньому втілення видатного лідера «Катіпунана» Феліпе Сальвадора. Він також потрапив під вплив і приєднався до марксистського руху Педро Абада Сантоса і став штатним організатором «Соціалістичної партії Філіппін» разом із Сантосом. Будучи вже помітним бойовим лідером, він був призначений головнокомандувачем і головою військового комітету революційного уряду.§!"

 PHI_casto_alejandrino: "Касто Алехандріно"
 PHI_casto_alejandrino_high_command_desc: "§YНародився:§! §L18 листопада 1911 року в Араяті, провінція Пампанга, Територія Філіппіни, Сполучені Штати Америки§!\n§YБіографія:§! §LСім'я Алехандріно включала відомого революційного генерала та сенатора Філіппін Хосе Алехандріно. Завдяки спадку в 68 акрів землі в Араяті, Алехандріно почав співчувати робітникам, яких він успадкував, і поклявся звільнити їх від ланцюгів. Будучи активним представником селянської групи «Ліга бідних робітників» та «Соціалістичної партії Філіппін», Алехандріно залишається одним із провідних профспілкових організаторів на Філіппінах і є заступником командувача військового комітету революційного уряду.§!"

 PHI_vivencio_cuyugan: "Вівенсіо Куюган"
 PHI_vivencio_cuyugan_high_command_desc: "§YНародився:§! §L13 січня 1895 року в Сан-Фернандо, провінція Пампанга, Генерал-капітанство Філіппін§!\n§YБіографія:§! §LВівенсіо Куюган розпочав свою кар’єру в Сполучених Штатах, де навчався і забезпечував себе завдяки професійному боксу. Повернувшись додому після навчання у Штатах, він був призначений муніципальним віцепрезидентом Сан-Фернандо в 1927 році та був обраний першим мером-соціалістом Філіппін і першим муніципальним мером. Разом із Педро Абадом Сантосом він став співзасновником «Соціалістичної партії Філіппін». Він також допомагав організовувати та командувати силами соціалістичного ополчення.§!"

 PHI_bernardo_poblete: "Бернардо Поблете"
 PHI_bernardo_poblete_commander_desc: "§YНародився:§! §L1896 року в Міналіні, провінція Пампанга, Генерал-капітанство Філіппін§!\n§YБіографія:§! §LБернардо Поблете народився в родині нижчого класу і служив у Філіппінських скаутах з 1907 по 1911 рік, де знайшов роботу в армії США. Залишивши «Скаут», він повернувся до цивільного життя як фермер і приєднався до «Aguman Ding Talapagobra» («Ліга бідних робітників»), де брав участь у діяльності, пов'язаній з АМТ та «Соціалістичною партією». Його постійна участь призвела до його просування по службі, попри його не надто досконале розуміння соціалізму. З початком повстання Поблете заснував «Банальний полк» і очолив його в битві. Його дружина та діти приєдналися і продовжують служити під його командуванням, а його син Томас є його довіреним заступником.§!"

 #Admirals
 PHI_enrique_jurado: "Енріке Хурадо"
 PHI_enrique_jurado_high_command_desc: "Народився: 15 липня 1911 року в провінції Лусена, Філіппіни, Сполучені Штати Америки. Біографія: Народившись у місті Лусена, що швидко індустріалізувалося, Енріке Хурадо переїхав до Меріленда, щоб навчатися у Військово-морській академії Сполучених Штатів у 1934 році. Протягом першого курсу він займався футболом, а потім боротьбою, отримавши відзнаки літермена протягом останніх трьох років. Повернувшись на батьківщину, він став одним із небагатьох військово-морських офіцерів Філіппін, виявляючи інтерес до артилерії та торпедних катерів."

 PHI_pelagio_cruz: "Пелагіо Крус"
 PHI_pelagio_cruz_high_command_desc: "Народився: 16 червня 1912 року в Баліуагу, провінція Булакан, Філіппіни, Сполучені Штати Америки. Біографія: Пелагіо Крус, який виріс у Барріо Пулонг Габат біля Болота Кандаба, але ніколи не забував свого рідного міста Баліуаг, закінчив Академію Філіппінської констебларії як найкращий у класі та отримав звання 3-го лейтенанта Піхотної гаубичної роти у Гарнізоні Гігалангін біля Маніли. Маючи інтерес до військової авіації, Пелагіо пройшов підготовку військового пілота в Льотній школі армійських повітряних сил на Полі Заблан і згодом став інструктором польотів."

 PHI_jose_andrada: "Хосе Андрада"
 PHI_jose_andrada_navy_chief_desc: "Народився: 3 лютого 1906 року в провінції Капіс, Філіппіни, Сполучені Штати Америки. Біографія: Хосе Андрада розпочав свою кар'єру з курсу в Інженерному коледжі Університету Філіппін, перш ніж навчатися у Військово-морській академії Сполучених Штатів в Аннаполісі, Меріленд. Після закінчення навчання у 1930 році як лише четвертий філіппінець, який зробив це на той час, Андрада (який отримав звання лейтенанта) був призначений президентом Мануелем Кесоном головою «Офшорного патруля». За час свого перебування на посаді Андрада започаткував програму волонтерської служби, залучаючи випускників Аннаполіса до нової військово-морської установи."

 PHI_jose_francisco: "Хосе Франсіско"
 PHI_jose_francisco_navy_chief_desc: "Народився: Філіппіни, Сполучені Штати Америки. Біографія: Здобувши освіту у Військово-морській академії Сполучених Штатів в Аннаполісі, Хосе Франсіско повернувся на Філіппіни як військово-морський офіцер, що подає надії, прийнявши призначення до новоствореного «Офшорного патруля»."

 PHI_ramon_alcaraz: "Рамон Алкарас"
 PHI_ramon_alcaraz_admiral_desc: "Народився: 31 серпня 1915 року в Кінгуа, провінція Булакан, Філіппіни, Сполучені Штати Америки. Біографія: Рамон Алкарас, старший із двох синів у великій родині, вступив до Академії Філіппінської констебларії у Таборі вчителів у Багіо, яку закінчив зі ступенем бакалавра наук. Потім він приєднався до новоствореної Школи підготовки «Офшорного патруля», щоб розпочати кар'єру військово-морського офіцера."

###- Political Advisors -###
 PHI_benigno_aquino: "Беніньо Акіно"
 PHI_benigno_aquino_advisor_desc: "§YНародився:§! §L3 вересня 1894 року, Тарлак, провінція Тарлак, Генерал-капітанство Філіппін§!\n§YБіографія:§! §LСин революційного генерала Сервільяно Акіно. Навчався в університеті Санто-Томас, склав іспит на адвоката у 1914 році. У 1919 році обраний до Палати представників, у 1928 — до Сенату. Брав участь у місії за незалежність Філіппін, розглядався на посаду міністра сільського господарства й торгівлі.§!"

 PHI_jose_abad_santos: "Хосе Абад Сантос"
 PHI_jose_abad_santos_advisor_desc: "§YНародився:§! §L19 лютого 1886 року, Сан-Фернандо, провінція Пампанга, Генерал-капітанство Філіппін§!\n§YБіографія:§! §LПоходив із заможної родини, здобув освіту у США, склав іспит на адвоката у 1911 році. На відміну від брата Педро, соціаліста, працював у Бюро юстиції, потім юристом у державних компаніях. Піднявся до керівних посад у Міністерстві юстиції, був секретарем юстиції, а згодом призначений до Верховного суду.§!"

 PHI_antonio_de_las_alas: "Антоніо де лас Алас"
 PHI_antonio_de_las_alas_advisor_desc: "§YНародився:§! §L14 жовтня 1898 року, Тааль, провінція Батангас, Генерал-капітанство Філіппін§!\n§YБіографія:§! §LОтримав юридичну освіту в Єлі. У 1922 році — в.о. міністра внутрішніх справ, потім депутат від Батангасу. У 1933 році призначений міністром громадських робіт і комунікацій, розглядався на посаду міністра фінансів. Має широкі зв’язки у бізнесових колах.§!"

 PHI_vicente_madrigal: "Вісенте Мадрігаль"
 PHI_vicente_madrigal_advisor_desc: "§YНародився:§! §L5 квітня 1880 року, Лігао, провінція Албай, Генерал-капітанство Філіппін§!\n§YБіографія:§! §LПоходив із бідної іспанської родини. Мріяв про власний флот, заснував пароплавну компанію, яка згодом стала прибутковою. Був однокурсником Кесона й Осменьї. Завдяки зв’язкам із президентом Кесоном двічі очолював Торгову палату, придбав цементні та інші підприємства. Його бізнес-імперія охоплює цукор, пальмову олію та вугілля.§!"

 PHI_camilo_osias: "Каміло Осіяс"
 PHI_camilo_osias_advisor_desc: "§YНародився:§! §L28 березня 1889 року, Балаоан, провінція Ла-Уніон, Генерал-капітанство Філіппін§!\n§YБіографія:§! §LНавчався у США як урядовий стипендіат, закінчив університет Чикаго. У 1915 році став першим філіппінським суперінтендантом шкіл. Згодом — сенатор, учасник Конституційного конвенту 1934 року. Відомий діяч у сфері освіти.§!"

 PHI_jose_laurel: "Хосе Лаурель"
 PHI_jose_laurel_advisor_desc: "§YНародився:§! §L9 березня 1891 року, Танауан, провінція Батангас, Генерал-капітанство Філіппін§!\n§YБіографія:§! §LПоходив із родини революціонера, мав китайське коріння. Навчався у Колегіо Сан-Хуан де Летран, потім у США та Великій Британії. Був виправданий у справі про замах на вбивство. Кар’єру почав у Бюро лісів, працював у Міністерстві внутрішніх справ, у 1925 році обраний сенатором. Учасник Конституційного конвенту 1934 року, один із «Семи мудреців», призначений до Верховного суду.§!"

 PHI_miguel_cuaderno: "Мігель Куадерно"
 PHI_miguel_cuaderno_advisor_desc: "§YНародився:§! §L12 грудня 1890 року, Маніла, Генерал-капітанство Філіппін§!\n§YБіографія:§! §LЮрист, склав іспит у 1919 році. Вивчав банківську справу у США та Британії. Учасник Конституційного конвенту 1934 року, один із «Семи мудреців». Член Національного банку, розглядався на економічні посади.§!"

 PHI_jose_yulo: "Хосе Юло"
 PHI_jose_yulo_advisor_desc: "§YНародився:§! §L24 вересня 1894 року, Баґо, провінція Негрос-Оксиденталь, Генерал-капітанство Філіппін§!\n§YБіографія:§! §LЮрист, закінчив університет Філіппін, склав іспит у 1913 році. Став відомим корпоративним адвокатом. У 1935 році призначений міністром юстиції президентом Кесоном.§!"

 PHI_pedro_abad_santos: "Педро Абад Сантос"
 PHI_pedro_abad_santos_advisor_desc: "§YНародився:§! §L31 січня 1876 року, Сан-Фернандо, провінція Пампанга, Генерал-капітанство Філіппін§!\n§YБіографія:§! §LПоходив із заможної родини, навчався на лікаря, самостійно вивчив право. Брав участь у революції та війні з американцями, уникнув ув’язнення завдяки родині. У 1916 році став депутатом, у 1922 — учасник місії за незалежність. Програв вибори губернатора у 1926 році. Дружив із Крісанто Еванхеліста, вивчав марксизм у Парижі, співзасновник «Партидо Обреро», наставник Луїса Тарука.§!"

 PHI_vicente_lava: "Вісенте Лава"
 PHI_vicente_lava_advisor_desc: "§YНародився:§! §L24 грудня 1894 року, Булакан, провінція Булакан, Генерал-капітанство Філіппін§!\n§YБіографія:§! §LХімік, навчався у Філіппінах, потім у США, здобув докторський ступінь у Колумбійському університеті. Працював над використанням кокосів для виробництва палива, досліджував вітаміни. У 1934 році повернувся, приєднався до «Партидо Обреро». Планує патентувати свої технології. Його брат Хосе також член партії.§!"

 PHI_jose_lava: "Хосе Лава"
 PHI_jose_lava_advisor_desc: "§YНародився:§! §L1912 рік, Булакан, провінція Булакан, Філіппіни, США§!\n§YБіографія:§! §LПоходив із заможної родини землевласників. Вивчав бухгалтерію в Бізнес-школі університету Філіппін, потім право в Юридичному коледжі того ж університету. Приєднався до старшого брата Вісенте Лави як член «Партидо Обреро» одразу після випуску, швидко піднявся в партійному секретаріаті разом із молодшим братом Хесусом Лавою.§!"

 PHI_primitivo_arrogante: "Примітиво Арроганте"
 PHI_primitivo_arrogante_advisor_desc: "§YНародився:§! §Lна території Філіппін, США§!\n§YБіографія:§! §LПримітиво Арроганте був обраний як пенсіонадо (студент, чиє навчання фінансує уряд) для навчання в соціалістичній Європі у 1935 році. Його швидко відібрав Крісанто Еванхеліста серед відомих соціалістичних профспілкових діячів. Проєкт фінансувався французьким урядом за посередництва американських соціалістів. Під час повстання він був призначений партією керівником відділу освіти й розвідки, займався поширенням пропаганди та координацією підпільних операцій партизан.§!"

###- High Command -###
 PHI_jesus_a_villamor: "Хесус Вільямор"
 PHI_jesus_a_villamor_air_chief_desc: "§YНародився:§! §L7 листопада 1914 року, Банґуед, Абра, Територія Філіппін, США§!\n§YБіографія:§! §LСин відомого судді Верховного суду Ігнасіо Вільямора. Отримав привілейовану освіту в коледжі Де Ла Саль у Манілі, де вивчав комерцію. Дитячим другом був Роберто Лім, син генерала Вісенте Ліма. Вже у 14–15 років цікавився авіацією, хоча родина хотіла, щоб він став юристом. Після смерті батька мати дозволила йому навчатися льотній справі. Освоїв літак Cox-Klemin у Philippine Air Taxi Corp, але не склав іспит у Бюро аеронавтики. Завдяки підтримці ветерана Берта Голла поїхав до авіаційної школи в Далласі, де здобув ліцензію транспортного пілота. Повернувшись, став одним із перших офіцерів авіації Філіппін.§!"

 PHI_basilio_fernando: "Басиліо Фернандо"
 PHI_basilio_fernando_air_chief_desc: "§YНародився:§! §L14 червня 1895 року, Сан-Матео, провінція Рісаль, Генерал-капітанство Філіппін§!\n§YБіографія:§! §LРозпочав кар’єру в Філіппінській констебулярії. Став одним із 33 молодих офіцерів, відібраних для навчання в авіаційній школі Curtiss у Паранакве. Служив у Philippine Air Service, перевозив пасажирів і пошту між Манілою, Ілоіло, Себу та Замбоангою. У 1935 році став першим командувачем авіакорпусу.§!"

 PHI_felix_pestana: "Фелікс Пестана"
 PHI_felix_pestana_high_command_desc: "§YНародився:§! §Lна території Філіппін, США§!\n§YБіографія:§! §LСтудент юридичного факультету університету Філіппін. Вирішив ризикнути й вступив до льотної школи на тлі зростання напруженості в Тихому океані. За кілька місяців успішного навчання був призначений інструктором на полі Манікіс у таборі Тініо.§!"

###- Theorists -###
 PHI_philippine_military_academy: "ФВА" # Філіппінська військова академія
 PHI_philippine_military_academy_theorist_desc: "§YЗаснована:§! §L25 жовтня 1898 року, Малолос, провінція Булакан, Філіппіни, США§!\n§LМужність, Чесність і Вірність. Наступниця Академії констебулярії, що бере початок із 1905 року. Тоді була створена академія для підготовки кадетів до служби офіцерами Філіппінської констебулярії, щоб захищати територію Філіппін за відсутності американських військ. З огляду на потрясіння, спричинені громадянською війною у США, уряд Філіппін офіційно схвалив створення армії Філіппін, і тепер академія готує нове покоління офіцерів. Модельована за прикладом Військової академії США, її гімн «PMA, Oh Hail to Thee» лунає в залах, виховуючи майбутніх військових керівників Тихоокеанського регіону.§!"

