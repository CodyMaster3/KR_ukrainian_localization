### Characters ###
 PRF_osman_ali_khan_emperor: "Осман Алі Хан I"
 PRF_osman_ali_khan_leader_desc: "§YНародився:§! §L6 квітня 1886 року в Пурані Гавелі, Гайдарабад, Штат Гайдарабад, Індія§!\n§YПередісторія:§! §LОсман Алі Хан, Нізам Гайдарабаду, формально відомий під своїм королівським ім'ям Асаф Джах VII, колись був лише підданим могутньої Британської імперії. Він об'єднав південні князівства в хаосі після розпуску Британського Раджу, оголосивши незалежність «Всеіндійської Федерації», щоб боротися проти повстанців, які базувалися в Калькутті. Однак у міру розвитку Федерації виникли труднощі щодо самої природи уряду нації. Тепер Осман Алі Хан повинен вивести Федерацію зі смертельної хватки її численних обтяжень у більш стабільне майбутнє.§!"
 PRF_osman_ali_khan_emperor_leader_desc: "§YНародився:§! §L6 квітня 1886 року в Пурані Гавелі, Гайдарабад, Штат Гайдарабад, Індія§!\n§YПередісторія:§! §LОсман Алі Хан, імператор Індії, колись був лише підданим могутньої Британської імперії. Він об'єднав південні князівства в хаосі після розпуску Британського Раджу, оголосивши незалежність «Всеіндійської Федерації», щоб боротися проти повстанців, які базувалися в Калькутті. Успішно централізувавши своє королівство та довівши народам індійського субконтиненту, що лише він гідний керувати ними, тепер він є правителем молодої, але могутньої імперії.§!"
