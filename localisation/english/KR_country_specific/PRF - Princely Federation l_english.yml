 PRF_guide: "§MПроголосити Кайсар-і-Гінд§! / §MБатько Федерації§! ($paternal_autocrat_coloured$)\n£white_dot Досягніть, щоб Баланс сил був на рівні §MЧастковий контроль Нізама§!, §MЗначний контроль Нізама§! або §MПовне домінування Нізама§! до січня 1937 року.\n£white_dot Після об'єднання Індії ви зможете проголосити Індійську федеративну імперію з Османом як Кайсар-і-Гінд.\n\n§MФедеральні вибори§! ($authoritarian_democrat_coloured$ / $market_liberal_coloured$)\n£white_dot Досягніть, щоб Баланс сил був на рівні §MСпірне домінування§! до січня 1937 року.\n£white_dot На національних виборах призначте Мадапаті Рао, щоб до влади прийшла §mАндхра Махасабха§!, або призначте Рамасвамі Айєра, щоб очолити §aНаціональний уряд§! та стримати радикалів.\n\n§MПравління принців§! ($authoritarian_democrat_coloured$)\n£white_dot Досягніть, щоб Баланс сил був на рівні §MЧастковий контроль принців§!, §MЗначний контроль принців§! або §MПовне домінування принців§! до січня 1937 року."

 ### Events ###
 princely_federation_events.1.t: "Неспокійна річниця"
 princely_federation_events.1.d: "З наближенням завершення зимової перерви та вступом Федерації у свій десятий рік члени великої Ради Принців знову вирушили до Гайдарабаду на майбутню сесію. Хоча ці сесії ніколи не були особливо сердечними, особливо останніми роками, почали поширюватися чутки про те, що може статися цього разу; це пов'язано зі зростанням невдоволення між Нізамом, лідером Ради, та її чотирма іншими членами. Хоча ці принци, яких у просторіччі стали називати «Великою Четвіркою», не погоджуються з усіх питань, вони стали майже однорідним утворенням у своїй опозиції до авторитаризму Османа.\n\nСуть їхніх проблем з ним починається з особливого статусу, наданого Осману в рамках засновницької конституції Федерації, завдяки якому йому було надано можливість застосовувати особливі повноваження, спочатку призначені лише для надзвичайних ситуацій. Проте щороку з моменту заснування Федерації використання Нізамом цих повноважень ставало все частішим, причому навіть деякі буденні пропозиції ветувалися під їхнім приводом, здавалося б, через найнікчемніші причини.\n\nЯк одна з останніх дій перед зимовою перервою, Нізам наклав вето на пропозицію, яку підтримали всі чотири інші принци, щодо фінансування розширення Бомбейського університету, здавалося б, виключно через незначну сварку з одним із викладачів, що призвело до спалаху гнівної суперечки. Оскільки плітки про цю суперечку швидко поширюються серед громадськості, і шепіт про таємні зустрічі між «Великою Четвіркою» після цього, не дивно, що люди очікують, що найближчими днями відбудеться щось значне."
 princely_federation_events.1.a: "Важко сказати, чи переживе Федерація ще одне десятиліття, якщо це триватиме..."

 princely_federation_events.2.t: "Скликання Ради"
 princely_federation_events.2.d: "Оскільки зимова перерва закінчилася, і члени Ради безпечно прибули до Гайдарабаду, перші кілька днів цієї сесії були напрочуд спокійними, незважаючи на сильну напругу в повітрі.\n\nХоча питання, які обговорювалися протягом цих перших кількох днів, навряд чи були суперечливими, Нізам ще не скористався можливістю накласти вето на будь-яке з них, і дискусії загалом просуваються впевненими темпами. По всьому Гайдарабаду, здається, багато хто почав ігнорувати чутки попередніх тижнів, хоча, можливо, ще зарано говорити..."
 princely_federation_events.2.a: "Пристойний початок, я вважаю."

 princely_federation_events.3.t: "Пропозиція про національного дівана"
 princely_federation_events.3.d: "Досить недивно, що гармонія в Раді тривала недовго, і нарешті виникла нова велика суперечка між «Великою Четвіркою» та Нізамом. Майже одразу після того, як Нізам вирішив накласти вето на пропозицію щодо розширення залізниці в Калікуті, через ціну, раптово була представлена нова пропозиція. Здається, під час перерви було витрачено час на розробку плану, очолюваного Махараджею Чітірою Тіруналом з Траванкору, для вирішення проблеми зловживання Нізамом зарезервованими повноваженнями. Згідно з цією пропозицією, багато поточних повноважень Османа були б передані національному дівану, який обирався б з-поміж членів Ради шляхом виборів, проведених Палатою Принців — інституцією, успадкованою від колишньої британської адміністрації, членами якої є менші принци федерації.\n\nТе, що відбулося далі, було, мабуть, ще менш дивовижним поворотом подій: Нізам одразу ж витлумачив цю пропозицію як прямий напад на його особу, що призвело не лише до його негайного вето на пропозицію, але й до подальшого кроку — використання своїх повноважень для тимчасового перенесення засідань Ради до кінця сесії. Не давши часу для початку суперечки, Осман негайно покинув будівлю. Згідно з поточними чутками, перенесення Османом засідань ще більше обурило «Велику Четвірку», і навіть Парамасіван Суббараян, спостерігач з Мадрасу, нібито приватно висловив свою підтримку членам, попри незгоду з більшою частиною їхньої пропозиції. Що б не сталося далі, зрозуміло, що ця криза — лише початок, і що Рада не проіснує ще одного року без якихось радикальних змін."
 princely_federation_events.3.a: "Виживання ще одного року, не кажучи вже про десятиліття, починає здаватися щедрим припущенням."

 princely_federation_events.4.t: "Наслідки Чорного понеділка вражають Федерацію"
 princely_federation_events.4.d: "Попри хаос, що охопив увесь світ у результаті німецького краху, багато хто у Федерації все ще був упевнений, що він не дістанеться Індії, причому ці люди, можливо, навмисно ігнорували це, сподіваючись, що нова криза настане лише через кілька днів після попередньої. На жаль для нації, ці надії виявилися марними, і Федерація також піддалася вторинним поштовхам, значною мірою через німецькі економічні інтереси як в Індії, так і в їхній ширшій азіатській сфері.\n\nОднак, що багато хто вважає срібною підкладкою, здається, що криза в Раді поки що була відкладена на другий план, оскільки Нізам зробив надзвичайний крок, скасувавши перенесення засідань Ради, намагаючись пережити бурю. Хоча «Велика Четвірка», очевидно, не відкинула своєї ненависті до Османа за кілька днів, вони принаймні погодилися відкласти свої розбіжності та почали повертатися до Гайдарабаду для поновлення сесії."
 princely_federation_events.4.a: "Немає нічого кращого за добру кризу, щоб згуртувати людей."

 princely_federation_events.5.t: "Страйк на Бомбейських фабриках"
 princely_federation_events.5.d: "Хоча всі сильно постраждали від наслідків Чорного понеділка, мало хто постраждав сильніше, ніж бідні фабричні робітники в промисловому центрі нації, Бомбеї. Як вираження свого гніву на систему, робітники на кількох фабриках у Ґіранґаоні взяли участь у страйку, який незабаром загострився, коли багато з цих страйкарів були заарештовані після звернення власників фабрик до поліції. Незабаром після цього тисячі людей вийшли на вулиці Бомбея на знак протесту, відбулися сутички між поліцією та протестувальниками, що призвело до численних травм та значних збитків місцевому майну. Після цього було заарештовано ще більше протестувальників, найвідомішим з яких був Бгалчандра Трімбак Ранадіве, відомий соціалістичний агітатор, майже напевно підтримуваний Калькуттою.\n\nХоча ці заворушення, здавалося б, наразі придушені, є побоювання, що будь-яка маленька іскра в настроях Бомбея все ще може легко призвести до нової хвилі насильства. Однак із арештом Ранадіве з'явилася можливість спробувати дещо приборкати робітників. Поклавши провину на шпигунів Калькутти та помилувавши тих, хто був просто введений ними в оману, ситуація може почати охолоджуватися, а уряд отримає таку необхідну прихильність."
 princely_federation_events.5.a: "Помилувати страйкарів, покарання понесуть лише шпигуни Калькутти."
 princely_federation_events.5.b: "Цим вандалам пощастило, що їх лише заарештували!"

 princely_federation_events.6.t: "Андхра Махасабха змітає Мадрас"
 princely_federation_events.6.d: "Навіть попри численні кризи, які спіткали націю, автономний регіон Мадрас не дозволив цьому зупинити проведення виборів, і їхні результати почали надходити протягом останніх кількох днів, надаючи результати, якими мало хто був шокований на цей момент. Партія Справедливості, яка керувала Мадрасом з перших виборів у регіоні в 1920 році, була знищена перед обличчям зростання Андхра Махасабхи, яка тепер є найбільшою партією в Законодавчій Раді.\n\nБлижче до кінця попереднього десятиліття сама Махасабха навряд чи могла вважатися політичною партією, будучи переважно сформованою як група тиску для мови телугу. Однак під керівництвом Мадапаті Ханумантхи Рао вони почали спроби реформуватися у повноцінну партію, щоб взяти участь у виборах 1929 та 1933 років. Хоча спочатку вони мали значні успіхи в північних телугумовних частинах Мадрасу, вони зрештою мали невеликий успіх деінде, особливо серед переважно тамільського півдня.\n\nЗ 1933 року настрої в Мадрасі різко змінилися, значною мірою через відчутну стагнацію Мадрасу під правлінням Партії Справедливості та їхню погану локалізовану реакцію на кризу Чорного понеділка, але, що важливіше, через набагато більш гучну опозицію Махасабхи проти заміни тамільської мови будь-якою «північною» мовою. Зараз загальноприйнято вважати, що Сураварам Пратапа Редді, голова партії в Мадрасі, буде призначений Першим міністром провінційним президентом, тоді як Парамасіван Суббараян знову буде перепризначений нейтральним спостерігачем штату в Раді Принців."
 princely_federation_events.6.a: "Мадрас вступає в нову еру, сподіваємося, на краще."

 princely_federation_events.7.t: "Дебати щодо соляного податку"
 princely_federation_events.7.d: "Хоча поки що в Раді була здебільшого загальна згода щодо політики подолання економічної кризи, було б важко зрештою не дійти до питання, щодо якого Нізам і «Велика Четвірка» зіткнулися б лобами, і сьогоднішнім питанням стало питання соляного податку. Сіль давно оподатковувалася в Індії, але за британського правління це оподаткування досягло надмірних рівнів, причому багато хто називає його подвоєння в 1923 році однією з головних спонукальних сил для революції, що вибухнула незабаром після цього. Коли Федерація вперше виникла, Нізам і «Велика Четвірка» колективно погодилися скасувати підвищення 1923 року, але навіть після цього соляний податок залишається одним із головних джерел федеральних доходів до сьогодні.\n\nОднак через триваючу економічну кризу навіть поточний рівень соляного податку поступово став розглядатися як майже такий же здирницький, як і за британців, що, здається, особливо погіршилося соціалістичними агітаторами з півночі кордону, де такого податку більше не існує. Для «Великої Четвірки» зниження податку здається очевидним рішенням, навіть якщо це може призвести до значного зменшення доходу Федерації.\n\nТака пропозиція зустріла рішучу опозицію з боку Нізама, людини, чия горезвісно скнара натура часто не дозволила б йому заплатити навіть три анни за порцію морозива, якщо б він вважав, що воно недостатньо високої якості. Однак прийняття цієї пропозиції не вважається абсолютно неможливим, оскільки відомо, що Нізама часто можна переконати відповідним моральним аргументом, і лише час покаже, чи будуть принци успішними з таким підходом."
 princely_federation_events.7.a: "Люди не можуть продовжувати страждати, знизити податок."
 princely_federation_events.7.b: "Ми не можемо дозволити собі піддаватися жадібності селян."

 princely_federation_events.8.t: "Запропоновано Штат Махараштра"
 princely_federation_events.8.d: "Хоча Південна Індія, можливо, тепер вільна від британського правління, вона ще не повністю звільнилася від адміністративних шрамів, які таке правління залишило на ній, і багато територій все ще перебувають у незручному внутрішньому підвішеному стані. У той час як колишнє Президентство Мадрас, можливо, мирно приєдналося до Федерації як штат-член, те саме не стосувалося Президентства Бомбей, відсутність сильної ради якого призвела до того, що його швидко розібрали місцеві принци. На півдні президентства Колхапур особливо скористався можливістю значно збільшити себе, ще більше зміцнюючи свій статус у Раді. Усе це закінчилося тим, що Нізам видав прокламацію, що всі землі на північ від Пуне будуть управлятися Гайдарабадом, доки не буде досягнуто належної угоди щодо їхнього поділу, через сутички між принцами за цю землю.\n\nНезважаючи на деякі офіційні корективи, внесені в наступні роки, найбільш помітним з яких є передача Насіка та прилеглої території Бароді, щоб служити новою столицею, поки сама Барода залишалася під соціалістичною окупацією, ситуація залишалася здебільшого незмінною з часів революції. Однак, намагаючись виправити ситуацію, ідея, яка давно витала в Палаті Принців, нарешті дійшла до Ради. Згідно з цією пропозицією, решта земель у Бомбеї будуть об'єднані з тими, що все ще належать Бароді, у штат Махараштра на чолі з Саяджірао Ґаеквадом, причому Барода буде передана іншому члену династії, якщо вона коли-небудь буде відновлена.\n\nХоча ця пропозиція, очевидно, є популярною і розглядається як справедлива компенсація для члена Ради, Осман залишається неохочим відмовлятися від контролю над територією, особливо над самим містом Бомбей. Хоча він схильний залишити його собі, Нізам також розглядав можливість прийняття альтернативної пропозиції, запропонованої Акбаром Гайдарі, розділити решту регіону між усіма місцевими принцами, при цьому Бомбей залишиться під прямим контролем Османа. Оскільки територія знаходиться під контролем Нізама, вибір щодо її майбутнього повністю залежить від нього."
 princely_federation_events.8.a: "Це справедливо, що Ґаеквад має отримати компенсацію."
 princely_federation_events.8.b: "Бомбей буде розділений між місцевими принцами."
 princely_federation_events.8.c: "Ця земля належить Нізаму по праву, посилити контроль!"

 princely_federation_events.9.t: "Заснування Деканської футбольної федерації"
 princely_federation_events.9.d: "Вже близько пів століття в Індії регулярно грають у футбол — це одна з небагатьох речей, імпортованих з Британії, яка все ще високо цінується у Федерації, і підтримка її зростання, мабуть, є єдиною спільною політикою, яку ви знайдете між Федерацією та Калькуттським режимом. Хоча історично спорт був найбільш популярним у Бенгалії, його популярність у Кочині та Траванкорі не можна ігнорувати, і після розколу Індії він досить швидко поширився по решті Федерації, причому команда тепер навіть спонсорується Махараджею Вадіяром у Майсурі.\n\nЧерез зростаючу популярність футболу у Федерації та зростаючу кількість команд, протягом останніх кількох років велися розмови про злиття Майсурської та Мадраської футбольних асоціацій в єдиний орган, відповідальний за управління спортом для всієї країни, і станом на минулий тиждень здається, що ці переговори нарешті принесли плоди. Найближчими місяцями має відбутися формування «Деканської футбольної федерації», причому очікується, що організація базуватиметься в Бангалорі. Вже робляться спроби організувати лігу для всієї Федерації, причому як «Ферґюсон Клуб», так і «Мадрас Спортінґ Клуб» погодилися приєднатися до такого заходу. Хоча ситуація може залишатися напруженою як удома, так і на кордоні, такі досягнення у світі спорту принаймні мають допомогти пересічній людині легше пережити це."
 princely_federation_events.9.a: "Немає нічого кращого за стару добру гру, щоб відволіктися від проблем."

 princely_federation_events.10.t: "Призначення нового Голови Верховного Суду"
 princely_federation_events.10.d: "Оскільки нація повільно виходить із попелу Чорного понеділка, Рада тепер повністю повернулася до належних неекстрених сесій, хоча, як і очікувалося, засідання все ще напружені. Сьогоднішня суперечка є досить типовою, якщо не брати до уваги того, що Нізам, здається, вперше стримується від зловживання своїми повноваженнями. Попередній Голова Верховного Суду, Пажаманері Айєр, оголосив про свою відставку кілька місяців тому через похилий вік. Призначення нового Голови Верховного Суду загалом має вирішуватися Радою, яка протягом останніх кількох місяців була досить відволічена. Тепер, коли це питання нарешті розглядається, «Велика Четвірка» та Нізам залишаються категорично розділеними щодо того, хто має стати його наступником.\n\nОбраним кандидатом «Великої Четвірки» є Срінівас Варадачаріар, відомий суддя з Мадрасу та протеже Пажаманері. Варадачаріар розглядається як природний наступник на цій посаді, а його нейтралітет щодо поточної федеральної політики розглядається як головний позитивний момент його обрання. Нізам, з іншого боку, віддає перевагу Аламу Алі Хану з протилежних причин: Алі Хан походить із самого Гайдарабаду, і його родина мала зв'язки як з Османом, так і з його батьком, що робить ймовірним, що він стане на бік Нізама у ключових питаннях. Проте Алі Хан не є суто непотистичним вибором, маючи власний вагомий послужний список, і решта Ради все ще може вирішити підтримати його кандидатуру, якщо Осман відмовиться поступатися; хоча, оскільки малоймовірно, що він накладе вето на Варадачаріара, принци можуть просто стояти на своєму і проголосувати за нього."
 princely_federation_events.10.a: "Посада дістанеться Варадачаріару."
 princely_federation_events.10.b: "Нізам вірить, що Алі Хан буде правити більш справедливо."

 princely_federation_events.11.t: "Срібний ювілей"
 princely_federation_events.11.d: "Сьогодні відзначається Срібний ювілей Нізама, двадцять п'ята річниця його сходження на трон після, на жаль, ранньої смерті його батька. Хоча, звичайно, були проведені святкування, щоб відзначити цю велику подію, особливо з огляду на те, що жителям самого Гайдарабаду було надано вихідний день для святкування, Осман оголосив про ще більший святковий дурбар, який має відбутися в лютому.\n\nОголошення Нізама було загалом добре сприйняте навіть попри останні події, хоча дехто помітив, здавалося б, підозрілий підтекст щодо його заяв про «великі зміни», які збігатимуться з цією подією, однак багато хто просто відкинув це як необґрунтовані припущення."
 princely_federation_events.11.a: "Гарний дурбар — це завжди фантастичний час."

 princely_federation_events.12.t: "Маджліс-е-Іттехадул Муслімін засуджує Раду"
 princely_federation_events.12.d: "З моменту свого заснування в перші дні Федерації, Маджліс-е-Іттехадул Муслімін була одним із найгучніших голосів на підтримку правління Нізама над нацією, розриваючи стосунки з багатьма, щоб підтримати його постійне використання вето та інших подібних повноважень. Однак сьогодні вони пішли на крок далі, ніж будь-коли раніше, коли їхній лідер Мухаммад Багадур Хан відкрито закликав до скасування Ради Принців та висловив підтримку прямому правлінню Нізама над Федерацією. Він чітко заявив про свою віру в те, що Рада не робила нічого, крім стримування Індії, заявивши, що саме Нізам врятував південь від руйнування соціалістичними бандитами, які йшли на нього. Хан також стверджував, що Федерація має бути додатково реформована для захисту інтересів мусульман, і що закони Федерації мають бути змодельовані за лініями шаріату, хоча й запевнив, що індуси будуть звільнені від певних аспектів.\n\nХоча Нізам, за чутками, приватно підтримує заяви Хана, він швидко зіткнувся з величезним тиском, щоб публічно дистанціюватися від цих радикальних заяв, не лише з боку «Великої Четвірки», але й багатьох його близьких радників. Вони чітко дали йому зрозуміти, що навіть якщо він вважає Хана правим, було б нерозумно принаймні не заспокоїти інших принців публічною заявою. Проте вони можуть лише сподіватися, що Нізам прислухається до їхніх аргументів у цьому питанні."
 princely_federation_events.12.a: "Такий розкольницький радикалізм не можна підтримувати."
 princely_federation_events.12.b: "Ви знаєте, він має рацію?"

 princely_federation_events.13.t: "Прагнення реформувати Палату Принців"
 princely_federation_events.13.d: "Спочатку заснована британцями, щоб дозволити почути голоси індійських принців, Палата Принців залишилася досить незмінною у своїй продовженій формі у Федерації, за винятком того, що слова тепер йдуть до Ради, а не до віце-короля. Хоча час від часу пропозиції прокладають собі шлях від Палати до Ради, офіційно представлені одним із членів Ради, Палата досі залишалася не більше ніж форумом для висловлення скарг. Сьогоднішня пропозиція, спонсорована Раджарамом III, має на меті змінити це, надавши Палаті дорадчу роль у законотворчому процесі. У рамках цього, пропозиції спочатку подаватимуться до Палати для розгляду, перш ніж вони взагалі потраплять до Ради, при цьому принци Палати надаватимуть відгуки та вимагатимуть змін, де це необхідно. Потім пропозиція повертатиметься члену Ради, після чого він міг би вирішити переглянути її далі та повторно подати до Палати, або подати її безпосередньо до Ради.\n\nЯк і очікувалося, Нізам досить чітко заявив про свою опозицію до цієї ідеї, і, незважаючи на свою стриманість останніми місяцями, він принаймні натякнув, що може просто накласти вето на пропозицію, як він це робив багато разів до цього. Поки що єдине, що зупинило його від дій, — це порада його довіреного радника Акбара Гайдарі, який натомість запропонував Осману підтримати пропозицію, стверджуючи, що вона зрештою дає мало влади Палаті, але з його підтримкою він міг би легко подати це як великий подарунок принцам. Такий подарунок, звичайно, значно покращив би становище Нізама серед менших членів Федерації, що може виявитися корисним, якщо йому знадобляться союзники проти «Великої Четвірки», тоді як накладення вето може натомість підштовхнути людей до них. Чи вирішить Осман прислухатися до цієї поради, залишається лише здогадуватися."
 princely_federation_events.13.a: "Нехай знають, що Нізам надав їм ці привілеї."
 princely_federation_events.13.b: "Ці зарозумілі заміндари попросять наступними палаци самого Нізама!"

 princely_federation_events.14.t: "Прокламація про допуск до храмів"
 princely_federation_events.14.d: "Хоча каста пронизує всі аспекти індуїстського життя у Федерації, те, як закон взаємодіє з нею, завжди було питанням, переданим на вирішення кожному штату по-своєму. У Королівстві Траванкор, під правлінням Старшої Махарані та Регента Сету Лакшмі Баї, це проявилося як сильна опозиція з боку уряду, коли йшлося про будь-який правовий захист для далитів, і жорстке застосування табу на морські подорожі. Однак правління Баї як регента було дуже суперечливим, через її авторитаризм та її початкове спірне призначення британцями, і коли Чітіра Тірунал досяг повноліття, він негайно взявся скасовувати багато її політик.\n\nТому не дивно, що сьогодні Махараджа видав нову прокламацію, яку широкій громадськості оприлюднив його Діван Четпут Паттабгіраман Рамасвамі Айєр. У цій прокламації молодий Махараджа заявив, що «жодному з його індуїстських підданих не буде відмовлено у мирі та комфорті індуїстської віри через його народження, касту чи громаду», і, відповідно, жодному з його підданих ніколи не буде відмовлено у праві входити до храмів чи поклонятися в них у межах Траванкору. Хоча ця прокламація вже викликала суперечки серед деяких еліт нації, особливо з Раджею сусіднього Кочина, вона загалом була дуже добре сприйнята, і інші штати тепер починають розглядати, чи варто їм також зробити подібний крок.\n\nУ Гайдарабаді ж реакція Османа була дещо іншою, Нізам мало дбає про деталі того, як індуси бажають поліцейськи один одного. Натомість його погляд привернув Айєр, чоловік, якого багато хто вважав владою за троном після сходження Махараджі на посаду. Попри труднощі в решті Федерації, Траванкор під керівництвом Айєра непропорційно процвітав, і хоча Осман раніше знав про цього чоловіка, тепер його думки не можуть не замислюватися, чи є Айєр тим рішенням, яке йому потрібне."
 princely_federation_events.14.a: "Нізаму міг би стати в нагоді такий чоловік, як цей Айєр..."

 princely_federation_events.15.t: "Зустріч з Айєром"
 princely_federation_events.15.d: "Не в змозі викинути думку з голови, Нізам нещодавно надіслав Айєру приватний запит, вимагаючи зустрічі з ним у Гайдарабаді. Після прибуття Айєра, Осман одразу почав викладати деталі свого конфлікту з «Великою Четвіркою», з якими Айєр уже був досконало ознайомлений. Прийшовши підготовленим, за кілька хвилин після того, як Нізам попросив його про допомогу у вирішенні конфлікту, Айєр почав представляти свій власний план. Чітко давши зрозуміти, що «Велика Четвірка» ніколи не відступить, доки влада Нізама залишається безконтрольною, Айєр натомість припустив, що існують способи встановити контроль над Нізамом, не розширюючи при цьому повноваження решти Ради. Для цього його план пропонує, що замість того, щоб член Ради служив національним Діваном, має бути створена обрана національна асамблея, з якої Осман призначатиме Дівана для виконання більшості щоденних операцій Федерації.\n\nАйєр також чітко дав зрозуміти, що хоча цей план, звичайно, обмежить владу Нізама, він ще більше обмежить владу його суперників, оскільки Осман все ще зберігатиме повноваження щодо того, кого він вирішить призначити Діваном, а також можливість накладати вето на закони, прийняті асамблеєю. Хоча Нізам спочатку не був переконаний цією ідеєю, його вуха почали напружуватися на це пояснення. Його думка ще більше зміцнилася, коли Айєр пояснив, що він точно знає зі своїх стосунків з Вармою, що «Велика Четвірка» буде заспокоєна таким сценарієм, оскільки він, на їхню думку, і обмежить Нізама, і зміцнить їхню власну позицію, оскільки вони почали приватно хвилюватися, як довго Федерація може проіснувати без демократизації. Хоча він не пішов так далеко, щоб негайно погодитися на ідею в тому вигляді, в якому вона була представлена, зрозуміло, що Нізам був переконаний аргументами Айєра, і що він, безумовно, матиме цей план на увазі, якщо прийде час."
 princely_federation_events.15.a: "Пропозицію Айєра, безумовно, варто розглянути."
 princely_federation_events.15.b: "Такий план навряд чи здається потрібним, але його слід мати на увазі."

 princely_federation_events.16.t: "Разві та Разакари"
 princely_federation_events.16.d: "Попри те, що точні деталі зустрічі Нізама з Айєром не були повідомлені жодній душі, окрім двох присутніх чоловіків, не знадобилося багато часу, щоб дехто правильно здогадався, що Нізам шукає допомоги для вирішення кризи в Раді. Одним із тих, кому це вдалося, є Касім Разві, генерал Федеральної армії, а також лідер воєнізованих формувань Разакарів, радикальної групи, пов'язаної з Маджліс-е-Іттехадул Муслімін, які ведуть своє походження від оборонних ополчень, сформованих під час революції. Використовуючи своє становище в армії, він зміг швидко організувати зустріч із Нізамом під виглядом офіційних справ, і саме тут він також почав представляти свій план щодо того, як вирішити конфлікт із «Великою Четвіркою».\n\nНа відміну від тактовного та тонкого підходу, підтримуваного Айєром, Разві знову повторив заклики Багадура Хана розпустити Раду Принців, і щоб Осман затвердив своє правління над Федерацією. Його аргументи наголошували на його вірі в те, що це право Нізама як великого мусульманського правителя бути єдиним лідером Федерації. На його думку, постійна співпраця з індуїстськими принцами Ради зробить Федерацію надто слабкою, щоб відбити вторгнення Республіки, яка передасть весь Гайдарабад «індуїстському наброду».\n\nХоча Нізам залишився непереконаним у життєздатності цього плану, Разві пообіцяв, що якщо буде віддано наказ, він та його Разакари негайно почнуть діяти, щоб захистити Нізама, і що, хоча Хан ще не схвалив жодних дій, коли прийде час, він також підтримає Османа."
 princely_federation_events.16.a: "Якщо прийде час, Нізам знає, кого покликати."
 princely_federation_events.16.b: "Спілкування з радикалами навряд чи здається розумним..."

 princely_federation_events.17.t: "Чутки в Гайдарабаді"
 princely_federation_events.17.d: "Протягом наступних кількох тижнів має розпочатися великий Дурбар Срібного Ювілею Нізама, затьмарений великим фоном приватної змови Нізама проти Ради.\n\nХоча ніхто, крім Османа, не знає, що він замишляє, здається, що інші повільно почали здогадуватися про його інтриги, і попри те, що широка публіка нічого не підозрює, ті, хто бере участь у плануванні цього дурбару, потихеньку почали очікувати, що він пройде не так, як планувалося..."
 princely_federation_events.17.a: "Здається, конфлікт може нарешті досягти своєї кульмінації."

 princely_federation_events.18.t: "Ювілейний переворот" # Princes
 princely_federation_events.18.d: "Маючи намір розпочати Дурбар гучним оголошенням, наказавши Разакарам захопити «Велику Четвірку» та розпочати його демонтаж Ради, Осман був досить здивований, коли озброєні люди, які увірвалися до його кабінету, націлили зброю на нього, а не на принців, що його супроводжували. Дізнавшись про план Османа, війська, вірні «Великій Четвірці», заарештували Разві та його лоялістів майже одразу після того, як Нізам віддав їм наказ. Потім вони почали свій марш до палацу Кінг Коті, повертаючи події до сьогодення.\n\nНавіть не давши Осману можливості заговорити, Саяджірао Ґаеквад чітко дав зрозуміти, що вони викрили Нізама в його змові, і що вони не терпітимуть його спроби самоперевороту. Повідомивши Осману про арешт Разві та неправдиво заявивши, що вони мають подальшу підтримку від своїх союзників у Домініоні, а також від Німецької імперії, якщо він відмовиться підкоритися, вони почали викладати, що саме станеться далі.\n\nНезабаром Осман був змушений підписати переглянуту версію пропозиції про національного дівана, повністю позбавивши Османа всіх його повноважень у Федерації, хоча все ще бажаючи надати йому символічну поступку його церемоніальної керівної ролі, щоб підтримувати національну стабільність. Потім йому повідомили, що замість оголошення про розпуск Ради на Дурбарі, його великим оголошенням буде впровадження цього закону та негайна підготовка до виборів відповідно до нього."
 princely_federation_events.18.a: "Так закінчуються амбіції Османа..."

 princely_federation_events.19.t: "Ювілейний переворот" # Nizam
 princely_federation_events.19.d: "Нарешті отримавши можливість раз і назавжди позбутися неспокійних принців, Нізам минулої ночі віддав наказ Разві захопити «Велику Четвірку», які прямували до Гайдарабаду для участі в майбутньому Дурбарі. Привезений до Османа вранці під озброєною охороною, Нізам просто виклав їм, що він розпустить Раду, і що всі четверо з них виступлять з ним на підтримку, коли він оголосить про це на майбутньому дурбарі. Така смілива заява викликала негайні гнівні вибухи з боку принців, хоча швидкий удар Разакара в живіт Варми швидко поставив їх на місце.\n\nВимагаючи знати, що з ними станеться, навіть якщо вони підкоряться погрозам Османа, їм повідомили, що він не бажає, щоб їм було завдано подальшої шкоди, і що їм просто буде дозволено продовжувати керувати власними штатами у Федерації, доки вони підкорятимуться лідерству Османа. Давши зрозуміти, що Разакари будуть розміщені в їхніх штатах, щоб забезпечити дотримання цих «розумних» вимог, «Велика Четвірка» незабаром зрозуміла, що у них не залишилося іншого вибору, окрім як підкоритися."
 princely_federation_events.19.a: "Федерація більше не буде стримувана цими дратівливими принцами!"

 princely_federation_events.20.t: "Гамбіт Нізама"
 princely_federation_events.20.d: "Оскільки багато хто, особливо «Велика Четвірка», нервували через чутки про змову Нізама, їхнє запрошення зустрітися з Османом у Гайдарабаді перед початком дурбару викликало у них занепокоєння щодо того, що це спричинить. На їхній подив, прибувши разом до кабінету Османа, їх зустріли не лише Нізам, але й представники Андхра Махасабхи, Партії Справедливості, і навіть сам Айєр. Зібравши всіх цих людей, Айєру махнув Нізам, щоб він почав викладати плани щодо демократично обраного національного Дівана, як заміну концепції, спочатку запропонованої «Великою Четвіркою». Шок від такої заяви одразу приголомшив усіх гостей, і ніхто з присутніх не знав, як насправді реагувати як на саму ідею, так і на концепцію того, що Нізам готовий так охоче відмовитися від будь-якої своєї влади.\n\nПопросивши перерву, щоб приватно обміркувати свої думки, «Велика Четвірка» скористалася цією можливістю, щоб обговорити представлену ідею між собою. Хоча спочатку вони вважали, що це не що інше, як дешевий трюк Османа, участь Айєра свідчила їм про те, що це справді може бути правдою, і хоча така пропозиція не надасть того рівня влади, на який вони спочатку націлювалися, її прийняття все одно вирішило б більшість їхніх нагальних занепокоєнь щодо зловживань Османа. Зрештою погодившись прийняти пропозицію, зустріч незабаром поновилася, і почувши про їхню згоду, Нізам прямо оголосив їм про свій намір проголосити цю зміну як частину дурбару та призначити вибори через кілька тижнів. Хоча всі, крім Айєра, залишили зустріч із тривожним відчуттям, що цей компроміс був надто хорошим, щоб бути правдою, вони принаймні були впевнені, що наразі конфлікт вирішено без насильства."
 princely_federation_events.20.a: "Хороший компроміс залишає кожному місце для змови."

 princely_federation_events.21.t: "Прокламація Дурбару"
 princely_federation_events.21.d.princes: "Після першого довгого дня святкування натовпи великого дурбару були направлені зібратися перед великою сценою, яка була зібрана в центрі Гайдарабаду. Незабаром Нізам, фланкований по обидва боки членами «Великої Четвірки», вийшов до мікрофона, встановленого на сцені. Саме тут він оголосив, що переглянута версія пропозиції про національного дівана була прийнята та підписана ним, і вона набуде чинності негайно після оголошення в цій промові, а повний текст закону буде опублікований якомога швидше.\n\nДалі він оголосив, що через шість тижнів серед членів Палати Принців будуть проведені вибори, щоб вирішити, хто стане першим Національним Діваном, заявивши, що як Вадіяр, так і Варма висунули свої кандидатури на цю посаду. Його брак ентузіазму та натягнута манера виступу були швидко помічені, і хоча багато хто просто відмахнувся від цього як від одиничного інциденту, швидкий відхід Османа зі сцени після завершення промови змусив багатьох задуматися, що насправді сталося за зачиненими дверима, що змусило його передумати."
 princely_federation_events.21.d.osman: "Після першого довгого дня святкування натовпи великого дурбару були направлені зібратися перед великою сценою, яка була зібрана в центрі Гайдарабаду. Незабаром Нізам, фланкований по обидва боки членами «Великої Четвірки», вийшов до мікрофона, встановленого на сцені. Саме тут він оголосив, що після довгих роздумів Рада Принців буде розпущена негайно, і що принаймні на деякий час Нізам керуватиме сам за допомогою довірених радників.\n\nШоковані зітхання натовпу були швидко заглушені вигуками, які, здавалося, походили від великої групи чоловіків, розпорошених серед натовпу, з якими «Велика Четвірка» близько познайомилася кілька днів тому. Залишаючи сцену під гучні крики «Я Осман» і хвалу Аллаху, Нізам залишався впевненим, що його нове правління тепер надійно закріплено настільки довго, наскільки Федерація проіснує."
 princely_federation_events.21.d.dem: "Після першого довгого дня святкування натовпи великого дурбару були направлені зібратися перед великою сценою, яка була зібрана в центрі Гайдарабаду. Незабаром Нізам, фланкований по обидва боки членами «Великої Четвірки», вийшов до мікрофона, встановленого на сцені. Саме тут він оголосив, що після зустрічі з Радою та найбільшими політичними партіями Федерації було досягнуто згоди про створення національного законодавчого органу, заснованого на тому, що існує в Мадрасі, з якого буде обрано національного Дівана, щоб він служив головою уряду Федерації.\n\nКоли натовп одразу вибухнув гучними вигуками, була досить довга пауза, перш ніж Осман зміг продовжити свою промову. Через деякий час він зміг оголосити, що перші вибори відбудуться через шість тижнів, розподіл місць буде опубліковано протягом наступних днів, і вже надано основним партіям Федерації. Потім п'ятеро чоловіків зійшли зі сцени під чергову хвилю оплесків від зібраних мас."
 princely_federation_events.21.a: "Нехай розпочнеться правління принців!"
 princely_federation_events.21.b: "Федерація нарешті скине свої кайдани."
 princely_federation_events.21.c: "Нація вступає в сучасну епоху."

 princely_federation_events.22.t: "Обрання національного дівана"
 princely_federation_events.22.d: "Оскільки шеститижневий період агітації закінчився, і Махараджі Траванкору та Майсуру використали стільки послуг, скільки змогли, настав час для принців Палати голосувати за першого Національного Дівана нації.\n\nНа цьому етапі важко сказати, хто переможе, оскільки, хоча імідж Варми як великого реформатора та модернізатора приніс йому багато прихильників, його молодий вік у поєднанні з побоюваннями, що він просто виконуватиме волю свого власного Дівана, надав підтримку старшому Вадіяру. Тільки остаточний підрахунок зможе відповісти на це палке питання."
 princely_federation_events.22.a: "Молодий Махараджа Траванкору здобуває перемогу"
 princely_federation_events.22.b: "Мудрий Вадіяр перемагає своїх побратимів-принців"

 princely_federation_events.23.t: "Перші федеральні вибори"
 princely_federation_events.23.d: "Оскільки шеститижневий період агітації закінчився, результати виборів повільно почали надходити з усієї Федерації. Хоча вони ще не остаточні, наразі результати показують, що більшість місць виграла Махасабха, хоча багато решти місць виграли незалежні кандидати та менші партії, а також невелике відродження суперників Махасабхи з Партії Справедливості. Хоча ці результати загалом відповідають очікуванням, що це означає для вибору Дівана, наразі не зрозуміло.\n\nЛідер Махасабхи Мадапаті Ханумантха Рао здається очевидним кандидатом, оскільки його партія справді виграла найбільше місць, хоча їхня відсутність більшості та їхні радикальні пропозиції змусили Нізама вагатися надавати їм владу. Натомість Нізам, здається, почав розглядати призначення Айєра на цю посаду, оскільки Айєр пішов у відставку з посади Дівана Траванкору, щоб представляти Королівство на національному рівні. Якщо Айєр буде призначений, очікується, що він очолить позапартійний національний уряд, що складається з кількох партій, включаючи Махасабху, сподіваючись стримати найбільш радикальні ідеї. Проте така дія може бути розцінена як чергове перевищення повноважень Нізамом, і для нього може бути найпростішим дозволити радикалам вигоріти, маючи справу з реаліями політики, як тільки Рао буде призначений."
 princely_federation_events.23.a: "Справедливо призначити Рао Діваном."
 princely_federation_events.23.b: "Айєр буде призначений, щоб тримати цих радикалів під контролем."

 princely_federation_events.24.t: "Надходить допомога від Домініону"
 princely_federation_events.24.d: "Навіть коли криза в Раді вже в минулому, важливо не забувати про справжнього ворога на півночі. Оскільки розвідка Домініону починає вважати, що вторгнення до нас обох може розпочатися протягом наступних кількох місяців, вони виявили слабкі місця в обладнанні, яке використовують наші збройні сили.\n\nХоча вони не можуть повністю вирішити цю проблему, вони надіслали велику кількість зброї, щоб допомогти нам підготуватися до того, що здається неминучим протистоянням, раніше, ніж хотілося б будь-кому."
 princely_federation_events.24.a: "Здається, година скоро настане..."

 princely_federation_events.50.t: "Смерть Крішни Раджі Вадіяра IV"
 princely_federation_events.50.d: "Один із наймогутніших (і найбагатших) індуїстських правителів нації, Крішна Раджа Вадіяр IV, помер пізно ввечері в своєму королівському палаці в Майсурі.\n\nЙого наступником як правителя Штату Майсур став його племінник, огрядний і артистичний Джая Чамараджендра."
 princely_federation_events.50.a: "Весь [Root.GetNameDef] сумує за його смертю!"

 princely_federation_events.51.t: "Смерть Саяджірао Ґаеквада III з Бароди"
 princely_federation_events.51.d: "Владний і рішучий правитель, Саяджірао Ґаеквад, помер сьогодні вранці у своєму палаці в Бароді. Оплакуваний багатьма, Саяджірао був незалежним правителем, який мало поважав британців або їхній Радж.\n\nЙого наступником став його онук і відомий марнотратник Пратап Сінґх Ґаеквад, який, як відомо, поділяє націоналістичні настрої свого діда."
 princely_federation_events.51.a: "Щасливої дороги."

 princely_federation_events.52.t: "Смерть Раджарама III"
 princely_federation_events.52.d: "Представник штату Колхапур сьогодні вранці повідомив нації про смерть їхнього великого Махараджі, Раджарама III, у віці лише 43 років. Член «Великої Четвірки» та один із ключових засновників Федерації, його спадщина – це спадщина на віки, людина, яку поважали навіть його вороги.\n\nОскільки Махараджа мав лише доньку і не мав близьких дорослих родичів, його племінник Шахаджі, нинішній Махараджа Девас-старшого, був призначений його спадкоємцем. Зрікшись престолу Девасу на користь свого сина, він тепер сходить на трон Колхапуру як Шахаджі II."
 princely_federation_events.52.a: "Така молода смерть для великої людини."

 princely_federation_events.150.t: "Вирішення питання з офіцерами ворога"
 princely_federation_events.150.d: "Хоча багато офіцерів, які воювали за наших ворогів, робили це через ідеологічні переконання або особисту відданість, серед них все ще є багато тих, хто робив це просто через обставини. Багато колишніх офіцерів Калькутти, включаючи, головним чином, Кодандера Каріаппу, разом із небагатьма тубільцями в лавах Лахора, запропонували приєднатися до наших збройних сил і принести свій досвід в обмін на помилування.\n\nТака пропозиція, звичайно, приваблива, оскільки завжди є потреба в хороших досвідчених людях, але помилування цих людей, особливо тих, хто служив соціалістам, навряд чи є популярним кроком, і тому тепер необхідно прийняти важке рішення щодо їхньої долі."
 princely_federation_events.150.a: "Прийняти їх до лав, їх можна спокутувати службою."
 princely_federation_events.150.b: "Впустити тих із Лахора, але ув'язнити поплічників Калькутти."
 princely_federation_events.150.c: "Ці люди невиправні, замкнути їх назавжди!"

 princely_federation_events.151.t: "Доля лоялістських князівств"
 princely_federation_events.151.d.default: "Коли Осман згуртував південних принців навколо Національного уряду, не вся місцева королівська родина Індії повстала, щоб підтримати його. Велика частина північних князівств вирішила приєднатися до британських залишків і охоче приєдналася до їхнього невдалого Домініону. Хоча легко визнати, що вони просто дбали про власну шкуру, важко розглядати їхню постійну вірність під час останнього етапу війни як щось інше, ніж зраду.\n\nПроте принци відіграли неймовірно важливу роль у підтримці порядку в регіоні, і їхнє повне усунення було б занадто поспішним, хоча вимагати їхнього зречення на користь більш терпимих наступників, безумовно, є варіантом. Крім того, хоча це може бути важкою пігулкою для проковтування, можливо, було б більш розсудливим інтегрувати їх як є в нинішню адміністрацію, додавши їх як членів Федерації та членів Палати. За бажанням, це могло б навіть дозволити Харі Сінґху з Кашміру місце в Раді, посаду, на яку він заслуговував би як могутній і престижний правитель, і це, ймовірно, значно сприяло б переконанню цих лоялістів повністю співпрацювати з Федерацією."
 princely_federation_events.151.d.osman: "Коли Осман згуртував південних принців навколо Національного уряду, не вся місцева королівська родина Індії повстала, щоб підтримати його. Велика частина північних князівств вирішила приєднатися до британських залишків і охоче приєдналася до їхнього невдалого Домініону. Хоча легко визнати, що вони просто дбали про власну шкуру, важко розглядати їхню постійну вірність під час останнього етапу війни як щось інше, ніж зраду.\n\nТому було запропоновано зробити з них приклад, оголосивши їхні землі конфіскованими та захопивши їх як для Османа, так і для федерального уряду, адже чи не є доктрина вилучення частиною британського правління, якого вони так прагнуть? Однак такий захід навряд чи отримає будь-яку підтримку, якої уряд відчайдушно потребуватиме, якщо не бажає побачити друге повстання, і тому може бути більш розсудливим залишити їх як є, оскільки вони вже були так ретельно нейтралізовані своєю останньою поразкою."
 princely_federation_events.151.a: "Вимагати зречення найбільш пробританських принців, їм не можна довіряти."
 princely_federation_events.151.b: "Вони будуть повністю інтегровані, але Сінґх не приєднається до Ради."
 princely_federation_events.151.c: "Повністю інтегрувати їх і дозволити Кашміру місце в Раді."
 princely_federation_events.151.e: "Дозволити їм зберегти свої позиції, вони не становлять для нас загрози."
 princely_federation_events.151.f: "Якщо вони так сильно хочуть британського правління, показати їм нову доктрину вилучення!"

 princely_federation_events.250.t: "Призначення дівана для [PRF.GetNameDef]"
 princely_federation_events.250.d: "Хоча правління Османа над нацією може бути всеосяжним, навіть він може визнати, що одній людині неможливо керувати буквально кожним аспектом управління такою великою країною, як Індія. Звичайно, у нього є радники, але гостро потрібна належна права рука, щоб забезпечити, щоб його воля просочувалася вниз по лавах до тих, хто врешті-решт її виконуватиме. З цією метою він переглянув потенційних кандидатів і звів свій остаточний вибір до двох чоловіків.\n\nПерший — Акбар Гайдарі, один із найближчих радників [PRF_GetOsmanTitle] і людина, яку Осман уже розглядав призначити Діваном лише для самого Гайдарабаду. Другий — Мірза Ісмаїл, кандидат, який має набагато слабші зв'язки з [PRF_GetOsmanTitle], ніж Гайдарі, але той, хто неодноразово доводив свою майстерність, служивши більшості основних штатів нації в той чи інший час. Обидва чоловіки є однаково хорошими кандидатами, і [PRF_GetOsmanTitle] може легко вибрати будь-кого з них, як тільки він прийме рішення."
 princely_federation_events.250.a: "Акбар Гайдарі, Садар-і-Азам Гайдарабаду, очолить уряд."
 princely_federation_events.250.b: "Мірза Ісмаїл забезпечить виконання волі Османа."

 princely_federation_events.251.t: "Нова людина на Павиному троні"
 princely_federation_events.251.d: "Ніхто ніколи не називав Нізама «скромною людиною», окрім, можливо, самого чоловіка, але тепер його велике бажання пишноти, можливо, досягло висот, які мало хто міг раніше уявити. Ще до того, як Делі було повернуто Федеральною Армією, велике бажання Османа узурпувати імперський титул у британців було настільки обговорюваним, що це навряд чи можна було вважати відкритим секретом, натомість це було просто загальновідомим фактом. Через кілька днів після капітуляції Домініону він уже замовив провести складну коронацію в Делі, після чого незабаром була видана прокламація, яка оголосила про створення нової імперії.\n\nЦеремонії розпочалися з того, що Османа провезли через Делі. Вулиці великого міста були вщерть заповнені великими натовпами, що складалися з усіх, від найзавзятіших прихильників Нізама до тих, хто прийшов просто заради їжі, і навіть найбільших критиків Османа, які бажали повідомити про його зарозумілість. Його місцем призначення була велика сцена, встановлена перед Червоним Фортом, через пошкодження, завдані самій будівлі, що зробило її непридатною для церемонії. На цій платформі сиділа, можливо, найграндіозніша з екстравагантностей, відтворення Павиного Трону Моголів, де Осман мав сидіти, щоб бути коронованим як новий імператор.\n\nСама коронація була проведена досить швидко, через побоювання, що поспішно зібрана сцена не зможе довго витримати всю вагу, і за кілька хвилин Осман зійшов на іншу платформу, щоб виголосити промову, маючи на меті ще більше зміцнити свій імідж визволителя Індії. Невдовзі після цього він повернувся до своєї карети, поїхавши назад тим же шляхом, повертаючись додому не як Нізам, а як великий Кайсар-і-Гінд."
 princely_federation_events.251.a: "Я Осман!"
 princely_federation_events.251.b: "Знаєте, це, мабуть, трохи занадто претензійно..."

 princely_federation_events.252.t: "Прокламація [ROOT.Capital.GetCapitalVictoryPointName]"
 princely_federation_events.252.d: "Возз'єднання Індії та роль Османа в ньому — це те, про що він, ймовірно, ніколи нікому не дозволить забути. Хоча багато хто очікував, що Нізам скористається славою, щоб узурпувати імперський титул у британців, сьогодні він відкинув ці припущення великою прокламацією в [ROOT.Capital.GetCapitalVictoryPointName]. Звертаючись до великого натовпу, наповненого як місцевими жителями міста, так і тими з усієї Федерації, хто здійснив подорож до [ROOT.Capital.GetCapitalVictoryPointName], щоб послухати його, Осман оголосив про свою відданість відновленню величі нації.\n\nЗгадуючи свою життєво важливу роль у заснуванні Федерації та майже міфологізовану Битву при Ґодаварі, він чітко дав зрозуміти, що від самого початку ніхто не був так відданий Федерації, як він. Відкидаючи будь-які претензії на трон, він вирішив знову зміцнити свій імідж як великого «Батька Федерації», заявивши далі, що його єдині два бажання в житті — це служити індійському народу та служити Аллаху, і що прийняття імперського титулу не послужить жодному з них.\n\nТака промова була добре сприйнята, особливо тими, хто вірив, що консолідація влади Османа означатиме смерть Федерації. Однак багато хто швидко помітив, що промова не дала жодних запевнень у тому, що Осман не керуватиме так, ніби він був імператором, без згадки про будь-які плани замінити чи реформувати Раду Принців, а також припинити його «тимчасове» неконтрольоване правління над нацією. Для цих людей, хоча Осман, можливо, наразі відкинув титул, залишається зрозумілим, що Федерація — це все ще не що інше, як володіння Нізама, яким він керує виключно на свій розсуд."
 princely_federation_events.252.a: "Нізам знову врятував націю!"

 princely_federation_events.275.t: "Тріумф Разакарів"
 princely_federation_events.275.d: "Сцени в [ROOT.Capital.GetCapitalVictoryPointName] сьогодні вранці можна описати багатьма словами, але жодне з них не підходить більше, ніж просто «хаос». Очевидно, підбадьорені надмірною залежністю Нізама від них, Разакари захопили контроль над столицею, при цьому Діван і всі, хто був до нього близький, були заарештовані. Згідно з промовою Разві, виправданням для цієї дії є нібито державна зрада, причому він заявив, що Діван планував скинути Османа та відновити розпущену Раду Принців до повної влади, і що вони не можуть допустити такої капітуляції.\n\nЩо стосується самого Османа, новина про цей переворот вперше дійшла до нього, коли він прокинувся від того, що озброєні Разакари увірвалися в його спальню, а через годину прибув сам Разві, щоб пояснити ситуацію. Після достатньої кількості суперечок і достатнього «переконання» від Разакарів, було досягнуто угоди, яка проголосила Разві новим Діваном, надавши йому безконтрольні повноваження викорінювати будь-яку подальшу нібито державну зраду по всій нації. Заворушення охопили націю, і більшість її народів, особливо індуси, бояться, яке нове пекло було на них випущено."
 princely_federation_events.275.a: "Нам слід було застрелити Разві, коли ми мали шанс..."

 princely_federation_events.300.t: "Андхра Махасабха оголошує Всеіндійську платформу"
 princely_federation_events.300.d: "Попри возз'єднання нації, багато північних територій все ще залишаються фактично ізольованими від решти Федерації, особливо в політичній сфері, де колишня правляча партія Індійський Національний Конгрес була повністю заборонена, а більша частина її керівництва тепер мертва або ув'язнена. Така ситуація не може тривати, особливо оскільки повернені території повільно інтегруються до Національної Асамблеї, і тому в рамках зусиль з охоплення Андхра Махасабха оголосила нову велику Всеіндійську платформу.\n\nУ рамках цієї платформи відтепер партія вирішила перейменувати себе на Всеіндійську Махасабху, що відображає її остаточне перетворення з місцевої групи тиску на сучасне обличчя індійської політики. Незабаром будуть відкриті нові офіси Махасабхи на північних територіях, причому офіс вже з'явився в самій Калькутті. Крім того, і досить суперечливо, багато більш поміркованих членів ІНК та тих, хто співпрацював з Калькуттським режимом, були прийняті до партії з розкритими обіймами. Хоча така дія швидко породила образливі назви, що описують партію як Комітет Відродження Конгресу, люди загалом прийняли їхні дії, вважаючи, що ця дія необхідна для того, щоб справді представляти всіх індійців на національному рівні."
 princely_federation_events.300.a: "Новий Конгрес для нової епохи?"

 princely_federation_events.301.t: "Згасаючий факел і нове полум'я"
 princely_federation_events.301.d: "Попри своє невелике відродження під час перших федеральних виборів, кілька тижнів тому Партія Справедливості підтвердила своїм членам, що не прагнутиме розширювати діяльність за межі початкових земель Федерації і, ймовірно, натомість надасть пріоритет консолідації своєї залишкової бази влади в Мадрасі, а не змагатиметься за місця в інших місцях. Це майже підтвердило, що Партія Справедливості ніколи більше не стане суперником Махасабхи, звільнивши місце для нової опозиції, і сьогодні ця опозиція нарешті була розкрита.\n\nНа конференції, що відбулася в Лакнау, група видатних політиків не лише з колишніх земель Республіки, але й з Домініону, оголосила про створення «Бхаратійського демократичного альянсу». Ця нова партія була переважно сформована залишками Партії Націоналістів Конгресу, організації, до якої перейшли багато антисоціалістичних членів ІНК, коли керівництво почало відкрито приймати цю мерзенну ідеологію заходу та її пропагандистів у Парижі та Лондоні.\n\nОчолюваний засновником ПНК Маданом Моханом Малавією, БДА швидко побачив охоплення підтримкою на великих територіях Індії, особливо в частинах Пенджабу та Сінду. Попри те, що це переважно консервативна партія, вона побачила чимало перебіжчиків з залишкової Ліберальної Партії, з якими є багато спільного в питаннях індуїзму та підтримки середніх класів. Хоча вони ще не виграли жодного місця, через те, що на півночі ще не проводилися вибори, здається дуже ймовірним, що цій партії судилося стати головним суперником Махасабхи в осяжному майбутньому."
 princely_federation_events.301.a: "Сильна опозиція завжди здорова"

 princely_federation_events.302.t: "Вибори на звільнених землях"
 princely_federation_events.302.d: "Минуло приблизно рік відтоді, як нація нарешті возз'єдналася, і були зроблені великі кроки для належного повторного поглинання всіх повернених земель, незалежно від того, наскільки вони були зіпсовані роками під їхніми гнітючими режимами. Саме завдяки цим зусиллям нарешті вдалося провести вибори на повернених землях, нарешті дозволивши їм мати представництво поряд з раніше обраними посадовими особами з колишнього ядра Федерації.\n\nРезультати, які надійшли наразі, дали зрозуміти, що нинішнє управління, ймовірно, не буде порушено, оскільки Всеіндійська Махасабха продовжує добре працювати по всіх напрямках, хоча вона знову отримала лише відносну більшість місць, а не розширила свою позицію до повної більшості. Як і очікувалося, БДА також досить добре проявив себе, хоча, можливо, не на тих монументальних висотах, на які багато хто очікував, оскільки багато місць, на які вони вирішили претендувати, натомість були виграні незалежними кандидатами.\n\nОднак досить помітними були результати з Бенгалії, де, здається, вплив соціалізму ще не був належним чином викорінений. Дві партії, обидві претендуючи на наступництво від ІНК, виграли тривожну кількість місць у регіоні, і хоча вони висловили свою вірність Федерації, мало хто довіряє їхнім словам. Загалом, однак, вибори пройшли без особливих проблем, що, можливо, свідчить про те, що найгірші роки Індії тепер міцно позаду."
 princely_federation_events.302.a: "Забезпечити належний моніторинг цих нових радикалів, просто для безпеки"

 princely_federation_events.303.t: "Чоловік із Мадрасу"
 princely_federation_events.303.d: "Включення Мадрасу до Федерації, поряд із особливим статусом, який йому було надано через його республіканську природу, завжди було суперечливим вибором. У рамках компромісу, який взагалі дозволив цьому статися, Мадрасу не було надано рівного місця в Раді, яке природно передбачали його розмір і влада, натомість місцевому уряду було дозволено лише надіслати спостерігача для захисту інтересів штату, але не голосувати на його користь. Однак сьогодні це нарешті змінилося, оскільки Рада нарешті погодилася підвищити Мадрас до повноправного членства, надавши йому рівні права з усіма, крім Османа.\n\nДівану довелося використати чимало послуг, щоб забезпечити цю радикальну зміну статусу-кво, причому «Велика Четвірка» була особливо неохоча розглядати розширення прав і можливостей того, хто не є одним із них, хоча достатніми обіцянками їх зрештою переконали. Нізам, з іншого боку, був переконаний досить легко, оскільки для нього подальше руйнування традиційного блоку влади «Великої Четвірки» могло лише покращити ситуацію для нього, хоча він не мав ілюзій, що обраний представник, ймовірно, не погодиться з ним у більшості питань.\n\nЩо стосується людини, обраної першим повноправним представником Мадрасу в Раді, не повинно бути несподіванкою, що їхній місцевий уряд знову рекомендував Суббараяна. Прослуживши на попередній посаді вже досить багато років, особливо під час кризи в Раді, і вважаючись нейтральним кандидатом, який навряд чи буде втягнутий у партійну політику, його повторне призначення було практично рутинним. Тепер, як повноправний член, саме через нього голоси простих людей нарешті матимуть місце у великій Раді королівства, дозволяючи нації зробити ще один крок до сучасності."
 princely_federation_events.303.a: "Сподіваємося, Суббараян зможе тримати обидві сторони під контролем."

 princely_federation_events.304.t: "Проблема Андхра-Прадеш"
 princely_federation_events.304.d: "З того часу, як Всеіндійська Махасабха була просто Андхра Махасабха, об'єднання народу телугу в один штат у межах федерації було, мабуть, їхньою головною метою. Навіть зараз при владі, такої мети важко досягти, оскільки батьківщина телугу наразі розділена між Мадрасом та особистим володінням Нізама. Нещодавній крок щодо підвищення статусу Мадрасу до повноправного члена Ради, однак, заручився їхньою підтримкою в цьому питанні, з їхньою попередньою згодою передати Андхру, щоб вона стала частиною майбутнього штату телугу. Однак, як і з багатьма речами, остаточна перешкода знову зводиться до переконання Нізама.\n\nХоча Нізам, можливо, втратив значну частину своїх повноважень на користь Дівана, як глава держави одного з членів Федерації, він все ще зберігає повну владу над своїм штатом, і немає іншого вибору, окрім як отримати його схвалення для будь-яких змін у ньому. Однією з потенційних ідей, щоб обійти це, було б анексувати Андхру до Гайдарабаду, при цьому території телугу в Гайдарабаді стануть автономією з телугу як офіційною мовою. Однак таке розширення Гайдарабаду майже напевно буде заблоковано іншими членами Ради, через яких воно все одно повинно буде пройти.\n\nЯк спроба компромісу, був представлений інший план об'єднати Андхру з Гайдарабадом, водночас відокремивши Берар та інші не телугумовні частини Гайдарабаду як новий штат, очолюваний його сином Моаззамом Джахом або іншим родичем Нізама. Цей план, здається, має набагато міцніші підстави, оскільки приватні дискусії з іншими членами Ради підтвердили, що вони не будуть проти цього, навіть якщо декому ідея загалом не подобається. Однак остаточне рішення, звичайно, залежить від Нізама, і доки план не буде представлений йому, неможливо знати, чи погодиться він віддати землю таким чином."
 princely_federation_events.304.a: "Після деяких роздумів, Осман погоджується на пропозицію."
 princely_federation_events.304.b: "Нізам відмовляється піддаватися такій екстремальній вимозі."

 princely_federation_events.305.t: "«Я твій раб, господарю, я схиляюся до твоїх ніг»"
 princely_federation_events.305.d: "Протягом багатьох років повне скасування системи примусової праці веттічакірі було однією з основних цілей Всеіндійської Махасабхи, поступаючись лише їхній палкій адвокації мови телугу. Така практика була присутня в Південній Індії протягом століть, здійснювалася дора, які служили заміндарам і принцам, причому правління тих, хто підтримував систему веттічакірі, було горезвісно жорстоким. Хоча більш прогресивно налаштовані принци, і навіть ті, хто на консервативній стороні, досі були переконані в необхідності скасування цієї практики, бачачи економічні переваги від відмови від такої феодальної системи, Нізам є чим завгодно, але не «прогресивно налаштованим». Вкрай малоймовірно, що він коли-небудь погодиться повністю заборонити цю практику на своїх землях, навіть якщо федеральний уряд спробує боротися з нею.\n\nОдним із шляхів, який розглядали Рао та уряд, щоб обійти це, є заборона цієї практики на федеральному рівні, але дозвіл конкретно Нізаму на виняток, за умови, що він забезпечить обмеження найгірших ексцесів системи в повній мірі своїх можливостей. Хоча це не є поступкою, на яку Всеіндійська Махасабха готова піти легко, це може бути необхідним компромісом для викорінення цієї практики в довгостроковій перспективі. Проте, чи захоче Нізам піти навіть на це, все ще залишається невідомим."
 princely_federation_events.305.a: "Дора будуть взяті під контроль, не більше."
 princely_federation_events.305.b: "Як сміє Рао висувати таку абсурдну вимогу!"

