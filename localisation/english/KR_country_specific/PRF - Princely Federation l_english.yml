 ### Bookmark ###
 PRF_KR_gathering_storm_desc: "Коли повстання прокотилося Індією, воно вселило великий страх у багатьох принців нації, які вважали, що повстанці виженуть їх, як вони вигнали британців. Вважаючи Радж повністю зруйнованим, вони оголосили про власну незалежність як «Всеіндійська Федерація» під керівництвом Османа Алі Хана, у просторіччі відома як Князівська Федерація. Попри початкові невдачі, Федерація проіснувала до припинення вогню у 1927 році та незабаром після цього уклала оборонний пакт із новим Домініоном. Однак виживання Федерації все ще залишається нестабільним, оскільки опозиція проти авторитарного правління Османа зростає з кожним днем."

