### Ideas ###
 #Starting Ideas
 PRF_disorder_in_council: "Безлад у Раді"
 PRF_disorder_in_council_desc: "Спочатку створена під час Індійської революції, Рада Принців замислювалася як спосіб для головних правителів півдня Індії колективно керувати новою незалежною нацією. Проте з роками унікальне привілейоване становище, яке займає Нізам у Раді, повільно веде націю до того, що нею керуватиме виключно Осман. Таку ситуацію інші члени Ради відмовилися терпіти, і лише час покаже, чи проіснує Рада ще довго."

 #Economic Ideas
 PRF_black_monday: "Відлуння Чорного понеділка"
 PRF_black_monday_desc: "Хоча збільшення залежності від німецьких ринків було необхідністю для виживання у постімперському світі, крах Чорного понеділка завдав великої шкоди індійській економіці, як і більшій частині світу."
 PRF_federal_railways: "Федеральна залізнична компанія"
 PRF_federal_railways_desc: "Історично залізниці в Індії були розділені між широким колом власників, від іноземного капіталу до самого Османа Алі Хана. Прагнучи вдосконалити цю систему, ці розрізнені залізниці були передані під управління одній центральній Федеральній компанії."
 PRF_growth_of_indigenous_business_idea: "Зростання місцевого бізнесу"
 PRF_growth_of_indigenous_business_idea_desc: "На думку провідних бізнесменів [PRF.GetNameDef], якщо нація хоче вижити в сучасну епоху, вона має сприяти зростанню компаній, що належать місцевим жителям, а не так сильно прив'язувати себе до імпорту, як це було історично. З цією метою уряд [PRF.GetNameDef] значно інвестував у місцеві компанії, сподіваючись побудувати самодостатню економіку."

 #Armed Forces Ideas
 PRF_new_federal_army_idea: "Нова федеральна фрмія"
 PRF_new_federal_army_idea_desc: "Першу федеральну армію [PRF.GetName] навряд чи можна було назвати професійною силою, оскільки її поспішно зібрали разом у хаотичні роки Індійської революції. Щоб усунути недоліки, спричинені цим, уряд [PRF_GetCountryTitle] розпочав масштабні реформи для її повної реорганізації у силу, здатну перемогти будь-якого ворога індійського народу."

 PRF_the_first_federal_navy: "Перший федеральний флот"
 PRF_the_first_federal_navy_desc: "Хоча [PRF.GetNameDef] завжди мала кілька кораблів у своєму розпорядженні, це навряд чи можна було назвати флотом, це було скоріше те, що вдалося врятувати після краху Британії. Однак така ситуація не могла тривати довго, особливо коли [PRF_GetCountryTitle] починає розправляти крила, і тому її уряд почав фінансувати створення належного військово-морського флоту для служіння нації."
 PRF_divert_funding_to_the_navy_idea: "Перенаправлення коштів на флот"
 PRF_divert_funding_to_the_navy_idea_desc: "Прагнучи значно збільшити свій військово-морський потенціал, [PRF.GetNameDef] вирішила скоротити фінансування менш важливих проєктів, а заощаджені кошти перенаправити на флот країни."

 PRF_deccan_air_school_idea: "Авіаційна школа Декану"
 PRF_deccan_air_school_idea_desc: "Авіаційна школа Декану є провідною школою пілотів Гайдарабаду. Завдяки державним інвестиціям ми матимемо найкращих пілотів на субконтиненті."

 #Osman Ideas
 PRF_father_of_the_federation_idea: "Батько Федерації"
 PRF_father_of_the_federation_idea_desc: "Хоча Осман тепер може бути єдиним правителем Індійської Федерації, Нізам уникає будь-якого символічного підвищення статусу, натомість вирішуючи зміцнити свій імідж як засновника Федерації. Попри те, що на практиці він має повноваження, подібні до національного монарха, Нізам поставив собі за мету зобразити себе просто як «першого серед рівних», чиє доброзичливе правління приведе Індію до величі."
 PRF_rule_by_firman_idea: "Правління фірманом"
 PRF_rule_by_firman_idea_desc: "Коли Осман був лише Нізамом Гайдарабаду, мало що відбувалося в його володіннях без прямого указу (фірману) від нього, що схвалював це. Тепер, як могутній імператор субконтиненту, таке управління було поширене на всю індійську націю; очікується, що місцеві міністри та ради якнайшвидше виконуватимуть його волю, висловлену через фірман."
 PRF_one_nation_under_osman_idea: "Одна нація під Османом"
 PRF_one_nation_under_osman_idea_desc: "Хоча Осман і є мусульманином, він чітко дав зрозуміти, що не має наміру керувати нацією як завойовник, нав'язуючи свої переконання іншим і ставлячи в невигідне становище представників інших віросповідань. Хоча не всі в нації переконані такими обіцянками, його велика чистка Разакарів значно допомогла заспокоїти людей щодо його намірів."
 PRF_right_of_conquest_idea: "Право завоювання"
 PRF_right_of_conquest_idea_desc: "Як висловився лідер Разакарів Касім Разві, право Османа керувати Індією походить виключно від його завоювання її народів, і переможеним не слід надавати жодних поступок. Оскільки Осман надає Разакарам необмежену владу, щоб забезпечити беззаперечність свого правління, ті серед «переможених», хто бажає протистояти такому пануванню, швидко стають об'єктами насильства з боку Разакарів."
 PRF_fight_against_famine: "Боротьба проти голоду"
 PRF_fight_against_famine_desc: "Протягом тисячоліть голод був однією з найбільших загроз для індійського народу, вбиваючи більше, ніж будь-який завойовник. Завдяки значним досягненням останніх десятиліть у світі штучних азотних добрив, викорінення голоду не за горами, і з цією метою Осман вирішив масово фінансувати ці зусилля, щоб це велике зло ніколи більше не загрожувало народу Індії."
 PRF_royal_sadaqah_idea: "Королівська садака"
 PRF_royal_sadaqah_idea_desc: "Авторитетне правління Османа не є тим, що індійський народ так легко готовий прийняти, але бути найбагатшою людиною у світі має свої переваги, навіть якщо витрата однієї рупії завдає йому болю. Щоб допомогти Осману зберегти підтримку якомога більшої кількості своїх підданих, він наростив свої особисті витрати на багато великих проєктів по всій території заради блага простих людей нації, звичайно ж, називаючи ці проєкти своїм іменем, щоб нагадати людям про їхнього великого благодійника."
 PRF_the_charitable_miser: "Милосердний скнара"
 PRF_the_charitable_miser_desc: "$PRF_royal_sadaqah_idea_desc$"

 #Princes Ideas
 PRF_image_of_rajarshi_idea: "Образ Раджарші"
 PRF_image_of_rajarshi_idea_desc: "Раджарші, або королівські мудреці, — індуси серед правлячих каст, які справді виявляють чисту відданість і турботу про свій народ, завжди обираючи збагачення нації, а не себе. Хоча вони прямо себе так не називають, керівництво Ради Принців почало неофіційно заохочувати просування образу кожного з них як Раджарші, які благородно ведуть націю вперед і віддають усе, що мають, на користь нижчих каст, над якими вони по праву керують."
 PRF_new_supreme_council_idea: "Верховна рада Індії"
 PRF_new_supreme_council_idea_desc: "За часів Ост-Індійської компанії Верховна рада Бенгалії діяла як найвища влада Індії, до складу якої входили чотири основні члени, а п'яту посаду займав генерал-губернатор як ефективний голова Ради, хоча, що примітно, він не мав права вето на рішення. Тепер, понад століття потому, знову виникла подібна система, якою керують, однак, тепер місцеві правителі субконтиненту, а не колоніальні лідери. Саме через цю нову «Верховну Раду» виражається справжня воля індійського народу; принаймні так стверджують ті, хто її очолює."
 PRF_royal_patronage_fund_idea: "Фонд королівського патронажу"
 PRF_royal_patronage_fund_idea_desc: "Це правильно, щоб багаті повертали суспільству, і оскільки принци Федерації тепер діють дуже злагоджено, було створено колективний фонд, який дозволяє кожному принцу робити пожертви на спільну мету. Потім ці кошти витрачаються на інфраструктуру та розвиток по всій країні, причому заслуги приписуються колективно кожному принцу, гарантуючи, що кожен індієць визнає життєво важливу роль, яку відіграє кожен принц у піднесенні нації, а не просто виділяючи найбагатших серед них."
 PRF_wall_street_of_asia: "Азіатська Волл-Стріт"
 PRF_wall_street_of_asia_desc: "Місто Мадрас довгий час було важливим фінансовим центром Індії, і тепер, завдяки потужному урядовому поштовху, щоб представити його як «азіатську Волл-Стріт», у місто почав надходити значний обсяг іноземного бізнесу, що приносить значні економічні вигоди та зв'язки для нації."

 #Dem and Iyer Ideas
 PRF_cultivation_of_the_administration: "Формування адміністрації"
 PRF_cultivation_of_the_administration_desc: "Оскільки влада розділена між Радою Принців, Національною асамблеєю і навіть партіями всередині Асамблеї, формування ефективної та дієвої адміністрації є, здавалося б, неможливим завданням. Проте, якщо хтось і може успішно це зробити, то це діван Рамасвамі Айєр, людина, яка поки що була надзвичайно успішною у вирішенні такого виклику."
 PRF_revitalising_the_council: "Відродження Ради"
 PRF_revitalising_the_council_desc: "Хоча історично Рада Принців зберігала право голосу виключно за своїми королівськими членами, представник Мадрасу завжди мав місце спостерігача в Раді. Тепер, намагаючись відродити Раду та наблизити націю до сучасності, Мадрас був підвищений до повноправного статусу в Раді, нарешті надавши більше представництва простим людям нації."
 PRF_building_a_mass_movement: "Побудова масового руху"
 PRF_building_a_mass_movement_desc: "Андхра Махасабха, можливо, була не більш ніж регіональною групою тиску лише кілька років тому, але тепер, як партія, що керує нацією, нова Махасабха зробила великі кроки, щоб включити тих, хто походить з усієї Індії, гарантуючи, що вона справді представляє маси нації."
 PRF_the_new_federation_dem: "Нова Федерація"
 PRF_the_new_federation_dem_desc: "Індійська демократія, можливо, не така розвинена, як в інших великих націях світу, але під керівництвом Всеіндійської Махасабхи Федерація зробила великі кроки до створення справді демократичної системи, яка представляє всіх людей нації; це далеко від контрольованої князями держави минулих років."
 PRF_the_new_federation_iyer: "Нова Федерація"
 PRF_the_new_federation_iyer_desc: "Індійська демократія, можливо, не така розвинена, як в інших великих націях світу, але під керівництвом Айєра Федерація зробила великі кроки до прийняття сучасності та піднесення тих, хто по всій країні. Хоча влада дівана, можливо, зростає до некомфортно великих розмірів для деяких людей, більшість залишається впевненою, що Айєр має на увазі найкращі наміри для народів Індії."
 PRF_the_sovereign_statesman_idea: "Суверенний державний діяч"
 PRF_the_sovereign_statesman_idea_desc: "Попри те, що Рада Принців зберігає значну владу та повноваження на папері, діван нації Ч. П. Рамасвамі Айєр через свої реформи забезпечив, щоб справжнім правителем нації був сам Айєр, причому ні Рада, ні Асамблея не можуть оскаржити його позицію. Хоча влада Айєра тепер може бути фактично абсолютною, він залишається непохитним у своїй меті впровадження свого бачення в нації, а не просто власного збагачення, вірячи, що лише він може по-справжньому модернізувати націю та повести Індію вперед як нову велику державу."
 PRF_defending_the_downtrodden: "Захист пригноблених"
 PRF_defending_the_downtrodden_desc: "Майже стільки ж часу, скільки існують люди в Індії, серед них завжди була пригноблена група, незалежно від того, чи це даліти, жінки, етнічні чи релігійні меншини. Таке гноблення розглядається як пережиток минулого урядом Федерації, який поставив собі за місію забезпечити захист і піднесення цих пригноблених груп, щоб вони могли відігравати рівноправну роль у суспільстві."

 #Modifiers
 PRF_madras_autonomy_modifier: "Автономія Мадрасу"
 PRF_madras_autonomy_modifier_desc: "Після домовленостей, досягнутих між новоствореною Всеіндійською Федерацією та Законодавчою радою Мадрасу під час Індійської революції, колишнє британське президентство приєдналося до Федерації як окремий член. Відповідно до цих домовленостей, Мадрас продовжує функціонувати майже так само, як і під час британського правління, перебуваючи в незвичайному для Федерації становищі, функціонуючи як демократично обрана республіка, а не керуючись абсолютною чи виконавчою монархією, як його сусідні штати.\n\nКрім того, згідно з угодами, питання, що стосуються самого Мадрасу, були майже повністю передані його Законодавчій Раді, а представник, обраний її членами, засідає в Раді Принців, нібито для забезпечення того, щоб Мадрас мав право голосу щодо національних законів, які можуть стосуватися і його."

 PRF_southern_autonomy_modifier: "Південна автономія"
 PRF_southern_autonomy_modifier_desc: "У рамках угоди про возз'єднання між Домініоном та Федерацією півдню нації була надана велика автономія для управління власними справами, при цьому визнаючи уряд у [RAJ.Capital.GetCapitalVictoryPointName]."

 #Decisions

 PRF_industrialising_the_nation_category: "Індустріалізація нації"

 PRF_begin_the_rajasthan_canal: "Розпочати будівництво Раджастханського каналу"
 PRF_begin_the_rajasthan_canal_desc: "Регіон Раджастхан давно потребував належної іригаційної системи, і Діван схвалив цікаву пропозицію головного інженера Біканеру, Канвара Саїна. Згідно з цією пропозицією, роботи розпочнуться із забору води з греблі Харіке, що живиться багатьма великими гімалайськими річками, і спрямування її каналом для постачання більшої частини західного Раджастхану. Хоча повне завершення, ймовірно, займе десятиліття, це, безумовно, проєкт, у який варто інвестувати, і навіть короткострокові переваги можуть бути плідними."
 PRF_malwa_canal_network: "Мережа каналів Малви"
 PRF_malwa_canal_network_desc: "Регіон Малва, схильний до посухи в центральній Індії, давно потребує більшої кількості каналів, і, на щастя, річка Нармада, що протікає через цю територію, ідеально підходить для цієї мети. Незабаром розпочнуться роботи над мережею каналів уздовж річки та від інших менших прилеглих водойм, щоб допомогти запобігти найгіршим наслідкам будь-якої посухи."
 PRF_expand_doab_irrigation_channels: "Розширити іригаційні канали Доабу"
 PRF_expand_doab_irrigation_channels_desc: "Верхній Доаб у північній Індії є одним із найважливіших регіонів для виробництва продовольства в усій нації, виробляючи не лише більшу частину національної пшениці, а й конкуруючи з Бенгалією у виробництві рису. Допомога фермерам у регіоні шляхом масового розширення іригаційних каналів майже напевно підніме продуктивність регіону на ще більшу висоту."

 PRF_dig_in_digboi: "Буріння в Діґбої"
 PRF_dig_in_digboi_desc: "Діґбой, як свідчить легенда, отримав свою назву, коли канадський інженер В. Л. Лейк сказав своїм робітникам «Dig boy dig!» («Копай, хлопче, копай!»), побачивши перші ознаки нафти. Попри те, що нафту вперше знайшли майже століття тому, свердловина, здається, ледь розроблялася, і тому ми повинні докласти великих зусиль для виправлення цієї помилки, щоб ще більше заробити на цьому чорному золоті."
 PRF_orissa_bauxite_extraction: "Видобуток бокситів в Оріссі"
 PRF_orissa_bauxite_extraction_desc: "Орісса є домом для одних із найбагатших запасів бокситів в усій Азії, але мало що було зроблено для збору та переробки цього дедалі ціннішого матеріалу. Однак немає кращого часу, ніж зараз, щоб розпочати роботу, і тому розширення нашої гірничодобувної інфраструктури в регіоні має стати пріоритетом."
 PRF_hematite_in_bailadila: "Гематит у Байладілі"
 PRF_hematite_in_bailadila_desc: "Дві речі здаються неминучими в житті: перша — це смерть, а друга — постійна потреба людини у більшій кількості заліза. Гірський хребет Байладіла є домом для досить високоякісної гематитової руди, що має допомогти задовольнити цей великий попит."
 PRF_bridging_the_teesta: "Будівництво мостів через Тісту"
 PRF_bridging_the_teesta_desc: "Регіони Дарджилінґ та Сіккім мають багато роз'єднаних громад, відокремлених одна від одної могутніми ущелинами, утвореними річкою Тіста. Хоча історично були плани належним чином побудувати мости через річку, вони відійшли на другий план через революцію та її наслідки. Однак зараз здається ідеальна можливість відновити ці плани."
 PRF_rebuilding_the_dufferin_bridge: "Відбудова мосту Дафферін"
 PRF_rebuilding_the_dufferin_bridge_desc: "Міст Дафферін через Ганг був колись одним із найбільших мостів в Індії, але був здебільшого зруйнований під час битви за Варанасі. Важливість мосту для місцевого міста означає, що ми не можемо просто дозволити йому залишатися зруйнованим, і тому слід докласти великих зусиль, щоб він повернувся до повної працездатності."
 PRF_paving_baluchistan: "Прокладання доріг у Белуджистані"
 PRF_paving_baluchistan_desc: "Прикордонні райони Белуджистану, можливо, є лише глушиною, на думку більшості, але вони все ще є важливою частиною нації, яку слід підняти на вищий рівень разом з рештою країни. З цією метою ми повинні прагнути побудувати належну сучасну мережу доріг у регіоні, що дозволить легко подорожувати до великих прилеглих міст, таких як Карачі та Кветта, а також пересуватися всередині регіону між Калатом і Кхараном."
 PRF_expand_the_sukkur_barrage: "Розширення греблі Суккур"
 PRF_expand_the_sukkur_barrage_desc: "Гребля Суккур забезпечує зрошення для фермерів у посушливому регіоні Сінд, подаючи воду з Інду в регіони, які інакше отримують її дуже мало. Зміцнення її споруд та розширення пов'язаних каналів забезпечить місцевим фермерам значне полегшення."
 PRF_the_pallivasal_hydro_electric_project: "Гідроелектропроєкт Паллівасал"
 PRF_the_pallivasal_hydro_electric_project_desc: "Гідроелектропроєкт Паллівасал збільшить виробництво електроенергії в штаті Траванкор, а також надасть нові можливості для зрошення в регіоні. Прийнявши та просуваючи цю установку, регіон побачить значно посилений розвиток."
 PRF_subsidise_the_chakhao_plantations: "Субсидування плантацій Чакхао"
 PRF_subsidise_the_chakhao_plantations_desc: "Чакхао, також відомий як маніпурський чорний рис, — це високопоживна рисова рослина, що вирощується в регіоні Маніпур. Його яскраво-фіолетове забарвлення додатково робить його екзотичною їжею для імпортерів за кордоном. Щедрий комплекс субсидій має забезпечити регіону велике процвітання."
 PRF_uplift_delhi_to_modern_standards: "Піднесення Делі до сучасних стандартів"
 PRF_uplift_delhi_to_modern_standards_desc: "Місце колишнього Делійського султанату, колишня столиця Британського Раджу і, мабуть, найбільш бажане місто для будь-якого завойовника, який бажає отримати контроль над величезним Індійським континентом. Проте соціалістичне правління абсолютно не пішло місту на користь. Багато вулиць переповнені, індійці набиті, як сардини, у погано побудовані квартири, а нетрі виникають одні за одними. Завдяки ретельним громадським роботам Делі нарешті займе своє місце як місто століття."
 PRF_invest_in_jubbulpore_armaments: "Інвестиції у збройову промисловість Джаббалпура"
 PRF_invest_in_jubbulpore_armaments_desc: "Місто Джаббалпур має значну збройову промисловість, яка зазнала великих збитків під час громадянської війни. Спрямувавши деякий капітал у цей сектор, ми будемо винагороджені міцнішою збройовою промисловістю, ніж мали раніше."
 PRF_karachi_shipyard_project: "Проєкт верфі Карачі"
 PRF_karachi_shipyard_project_desc: "Порт Карачі мав досить неспокійну історію останнім часом, переживши страйк під час початкових відлунь Чорного понеділка та докладаючи зусиль для задоволення попиту як єдиний великий порт колишнього Домініону. Комплекс удосконалень та оновлень усуне будь-які проблеми, які можуть виникнути в майбутньому щодо потужності, і ще більше покращить нашу вітчизняну суднобудівну промисловість."
 PRF_fund_kashmiri_carpet_exports: "Фінансування експорту кашмірських килимів"
 PRF_fund_kashmiri_carpet_exports_desc: "Кашмірські килими цінуються світовою елітою та заможними людьми за їхню витончену красу та виняткову якість майстерності. Ми профінансуємо рекламну кампанію та субсидуватимемо місцевих ткачів килимів, щоб наша велика нація отримувала прибуток від цього розкішного експорту."

 PRF_issue_executive_firman: "Видати виконавчий Фірман"
 PRF_issue_executive_firman_desc: "Хоча більшість законів проходить через Раду, Нізам все ще зберігає повноваження обходити їх, коли це необхідно, і видача фірману, який допоможе забезпечити розвиток подій на його користь, безперечно є ситуацією, яка, на його думку, виправдовує це."
 PRF_rely_on_the_razakars: "Покластися на Разакарів"
 PRF_rely_on_the_razakars_desc: "Разакари, можливо, небезпечні жорстокі головорізи, але вони є небезпечними жорстокими головорізами Нізама, і вони гарантують, що тим, хто погано говорить про нього публічно, нагадають, чому такі дії зазвичай робляться за зачиненими дверима."
 PRF_buying_good_will: "Купити прихильників"
 PRF_buying_good_will_desc: "Обов'язок тих, хто має багатство і владу, полягає в тому, щоб забезпечити належний догляд за їхніми меншими, і «Велика Четвірка» безумовно не чужа наданню такої турботи. Очікується, що ті, про кого піклуються, будуть набагато більш схильні підтримувати цілі своїх благодійників."
 PRF_combatting_the_nizams_propaganda: "Боротьба з пропагандою Нізама"
 PRF_combatting_the_nizams_propaganda_desc: "Як так званий «Батько Федерації», Нізам доклав значних зусиль для побудови національної легенди навколо себе, починаючи від простих, буденних чуток про його добрі справи, до заяв про те, що він сам очолив наступ, щоб не дати соціалістам перетнути Ґодаварі. За невеликих зусиль такі надзвичайні твердження можна легко розвінчати як відверту брехню, якою вони є."
 PRF_concessions_to_the_assemblies: "Поступки Асамблеям"
 PRF_concessions_to_the_assemblies_desc: "Хоча більшість законопроєктів, які проходять через Раду, розробляються радниками членів або спочатку розробляються в Палаті, в певних випадках дорадчі асамблеї в кожному штаті-члені можуть подавати свої власні законопроєкти через свого відповідного принца. Якщо необхідно, дозвіл на деякі додаткові законопроєкти від асамблей може посилити вплив цих асамблей на процес законотворчості, допомагаючи збалансувати ситуацію в Раді."

### Focuses ###

 #Economic focuses
 PRF_the_berar_road: "Дорога Берару"
 PRF_the_berar_road_desc: "З кожним днем ​​стає зрозуміліше, що війна незабаром повернеться до Індії, тому необхідно негайно розпочати підготовку до цієї події. У разі нападу з півночі Берар майже напевно стане найбільш активною частиною фронту, будучи найменш захищеною ділянкою кордону, і тому ми повинні гарантувати належну мережу постачання між Гайдарабадом та Берарським фронтом, якщо ми хочемо мати хоч якусь надію утримати цю територію."
 PRF_merging_the_railways: "Об'єднання залізниць"
 PRF_merging_the_railways_desc: "Попри життєво важливу роль, яку відіграють залізниці нації, досі немає центрального органу, який би наглядав за ними всіма. Натомість контроль розділений між приватними компаніями, іноземними власниками та багатьма принцами. Щоб належним чином упорядкувати цей безлад, було б розумно об'єднати ці розрізнені компанії, працюючи через існуючу адміністрацію Державної гарантованої залізниці Нізама."
 PRF_hyderabad_madras_express: "Експрес Гайдарабад-Мадрас"
 PRF_hyderabad_madras_express_desc: "Мадрас є третім за важливістю містом у Південній Індії, поступаючись лише Бомбею та самому Гайдарабаду, але зв'язки між серцем [PRF_GetCountryTitle] та Мадрасом надто довго залишалися вкрай недостатніми. Зараз ідеальний час, щоб нарешті вирішити цю проблему та створити належну пряму лінію між двома містами."
 PRF_bombay_to_bangalore: "Бомбей – Бангалор"
 PRF_bombay_to_bangalore_desc: "Бангалор є важливим центром, що з'єднує далекий південь із рештою нації, причому більшість сировини, виробленої в цих районах, спрямовується через нього, щоб дістатися промислового центру Бомбея. Розширення залізничної інфраструктури між двома містами має значно сприяти будь-якому майбутньому промисловому розширенню."
 PRF_importing_european_models: "Імпорт європейських моделей"
 PRF_importing_european_models_desc: "Ми не можемо легко дозволити собі виділити значну кількість нашої важкої промисловості на виробництво сучасних дизельних та електричних поїздів повністю з нуля, але їх придбання було б великою перевагою для нації. Щоб виправити це, ми повинні подбати про імпорт значної кількості моделей з Європи, а також придбати важковиготовлені запчастини, з яких ми зможемо легше зібрати власні поїзди."
 PRF_finish_the_nizam_sagar_dam: "Завершити греблю Нізам Саґар"
 PRF_finish_the_nizam_sagar_dam_desc: "Хоча гребля Нізам Саґар була розпочата багато років тому, проєкт так і не був повністю завершений внаслідок Революції. Оскільки гребля вже майже завершена, було б нерозумно просто не виділити необхідні ресурси, щоб остаточно довести її до кінця, особливо з огляду на великі переваги, пов'язані з електропостачанням та зрошенням, яких ми дуже потребуємо."
 PRF_shroff_development_plan: "План розвитку Шроффа"
 PRF_shroff_development_plan_desc: "У відповідь на кризу Чорного понеділка група економістів та промисловців на чолі з Ардеширом Шроффом розробила план розвитку, щоб забезпечити швидке відновлення після цього тимчасового економічного шоку. Сам план виступає за посилення втручання на користь індійського бізнесу, імпорт нових варіантів сільськогосподарських культур для забезпечення кращих врожаїв та посилення участі місцевих компаній у експлуатації наших численних невикористаних ресурсів."
 PRF_hope_wheat_trials: "Випробування пшениці «Надія»"
 PRF_hope_wheat_trials_desc: "Страх того, що нас відділяє один поганий сезон від великого голоду, і кількість часу, який потрібно присвятити землеробству, щоб просто прогодувати націю, є двома найбільшими проблемами, що стоять на шляху потенційного зростання [PRF_GetCountryTitle], особливо на заході, який залежить від пшениці. Намагаючись вирішити обидві ці проблеми, ми погодилися випробувати нові сорти сільськогосподарських культур, що походять з Америки, які, як кажуть, стійкі до поширених хвороб, таких як іржа, водночас значно збільшуючи врожайність."
 PRF_andhra_irrigation_schemes: "Схеми зрошення Андхри"
 PRF_andhra_irrigation_schemes_desc: "Регіон Андхра є одним із найважливіших районів виробництва рису на всьому субконтиненті, і ми ще навіть близько не досягли меж потенційної врожайності, яку ми можемо отримати. Завдяки достатнім інвестиціям у покращення іригаційної інфраструктури в регіоні ми можемо розширити придатні для обробітку землі, а також дозволити подальше виробництво рису протягом сезону рабі."
 PRF_prioritise_indigenous_business: "Пріоритет місцевому бізнесу"
 PRF_prioritise_indigenous_business_desc: "У повністю вільній системі багато місцевих індійських підприємств просто не зможуть конкурувати зі своїми набагато міцніше заснованими іноземними конкурентами. Щоб уникнути того, щоб нацією знову керував іноземний бізнес, ми повинні гарантувати економічний захист, щоб наші власні підприємства могли процвітати достатньо довго, щоб конкурувати з цими іноземними важковаговиками."
 PRF_favouring_a_private_approach: "Сприяння приватному підходу"
 PRF_favouring_a_private_approach_desc: "Хоча ми можемо гарантувати захист індійським підприємствам, ми не можемо ризикувати просто відмовитися від основ капіталізму, щоб не стати другою Калькуттою. Тому важливо, щоб, де це можливо, ми віддавали перевагу та розвивали приватний бізнес, замість того, щоб вдаватися до посилення націоналізації, як дехто закликав."
 PRF_increased_federal_intervention: "Посилене федеральне втручання"
 PRF_increased_federal_intervention_desc: "Існують певні сфери економіки, де незалежно від того, наскільки наполегливо намагаються приватні підприємства, вони ніколи не будуть ефективнішими за уряд у наданні важливих послуг. Тому ми повинні рухатися до націоналізації, де це необхідно, у цих ключових сферах, щоб забезпечити максимально ефективне використання національних ресурсів."
 PRF_exploiting_the_chandradrona_deposits: "Експлуатація родовищ Чандрадрона"
 PRF_exploiting_the_chandradrona_deposits_desc: "Гірський хребет Чандрадрона є багатим і здебільшого невикористаним джерелом залізної руди, чого нація гостро потребує. Належна експлуатація цих родовищ та розширення сталеливарних потужностей для їхнього розміщення має бути одним із наших найважливіших економічних пріоритетів."
 PRF_strengthen_madrasi_heavy_industry: "Зміцнення важкої промисловості Мадрасу"
 PRF_strengthen_madrasi_heavy_industry_desc: "Попри те, що Бомбей є промисловим центром південної Індії, важливість Мадрасу в цій галузі не можна недооцінювати. За достатньої державної підтримки промисловість у всьому регіоні Мадрасу може легко досягти рівня, де вона може конкурувати, і, можливо, навіть обігнати Бомбей, і такий сценарій принесе велику користь нації."

 #Army focuses

 PRF_phasing_out_british_equipment: "Поступове виведення британського обладнання"
 PRF_phasing_out_british_equipment_desc: "Нація не переживе подальших конфліктів, озброєна лише старими гвинтівками з Ішапору та тим, що залишилося від гарнізону Бомбея. Тому життєво важливо, щоб ми почали виробляти власні нові гвинтівки, використовуючи все, що можемо зібрати."
 PRF_developing_the_poona_officers_academy: "Розвиток офіцерської академії Пуни"
 PRF_developing_the_poona_officers_academy_desc: "Індійська нація довгий час відчувала нестачу хороших місцевих офіцерів — це була дуже навмисна політика британців у їхній невдалій спробі запобігти повторенню 1857 року; що, очевидно, так добре для них спрацювало. Щоб виправити цей брак, кілька років тому в Пуні було засновано академію для підготовки більшої кількості офіцерів, і ми повинні допомогти забезпечити максимальний розвиток цієї академії."
 PRF_streamlining_the_command_structure: "Оптимізація структури командування"
 PRF_streamlining_the_command_structure_desc: "Початкова ітерація Федеральної Армії була поспішно сформована в хаотичні дні революції, складаючись із особистих армій князівств, британських перебіжчиків та всіх, хто бажав взяти в руки зброю проти соціалістів. Хоча в останні кілька років спостерігалися повільні зусилля, спрямовані на розплутування цієї безладної суміші підрозділів, ми повинні прискорити ці зусилля, щоб залишатися конкурентоспроможними."
 PRF_the_new_federal_army: "Нова федеральна армія"
 PRF_the_new_federal_army_desc: "Хоча наші зусилля з реформування, можливо, тільки починаються, вперше за нашу коротку історію Федеральна Армія тепер справді гідна такої назви; це вже не просто розрізнена, але сповнена ентузіазму сила солдатів. Будемо сподіватися, що коли прийде час, цього буде достатньо, щоб не лише захистити націю, але й відновити її велич."
 PRF_negotiating_equipment_deliveries: "Переговори щодо постачання обладнання"
 PRF_negotiating_equipment_deliveries_desc: "Завоювання дружби індійської нації, яка не просто слідує наказам британського короля чи нових червоних королів Калькутти в Лондоні, є дуже привабливою перспективою для багатьох великих світових держав. Такий інтерес — це те, що ми можемо легко використати, щоб заповнити багато прогалин, які все ще залишаються в запасах нашої армії."
 PRF_support_the_bangalore_defence_industry: "Підтримка оборонної промисловості Бангалору"
 PRF_support_the_bangalore_defence_industry_desc: "Майже одразу після закінчення революції Махараджа Вадіяр IV розпочав велику кампанію зі створення нової оборонної промисловості у старому Британському Кантоні в Бангалорі. Такі зусилля, безсумнівно, принесуть великі плоди для [PRF_GetCountryTitle], і ми повинні спрямувати федеральне фінансування на допомогу Майсуру в просуванні цих зусиль заради національної безпеки."
 PRF_updating_shivajis_tactics: "Оновлення тактики Шиваджі"
 PRF_updating_shivajis_tactics_desc: "Перша держава Маратха була створена великим Махараджею Шиваджі, який усвідомлював, що для перемоги у війнах не потрібна велика сучасна армія, якщо справді розумієш навколишню землю, правильно використовуючи гнучку іррегулярну армію. Розроблена ним тактика все ще може бути актуальною навіть у сучасну епоху, але, звичайно, значно посилена технологіями нашого часу."
 PRF_prioritising_adaptability: "Пріоритет адаптивності"
 PRF_prioritising_adaptability_desc: "Ми не переможемо наших ворогів, якщо просто очікуватимемо, що кожне поле битви буде на нашу користь. Натомість ми повинні зосередитися на тому, щоб, незалежно від ситуації, наші солдати могли не лише битися на повну силу, але й продовжувати боротьбу, навіть якщо вони опиняться відірваними від наших ліній постачання."
 PRF_learn_from_the_battle_of_ahmadabad: "Вивчити уроки битви за Ахмадабад"
 PRF_learn_from_the_battle_of_ahmadabad_desc: "Ахмадабад був не чим іншим, як катастрофою, в якій багато хоробрих чоловіків були вбиті соціалістичними мародерами у доблесній останній битві в місті. Помилки, допущені тоді, що призвели до такої різанини, не можна повторити, і наступного разу, коли наші солдати будуть битися на вулицях, вони будуть готові."
 PRF_a_new_generation_of_armoured_cars: "Нове покоління бронеавтомобілів"
 PRF_a_new_generation_of_armoured_cars_desc: "Британські обмеження на імпорт означали, що історично багато наших солдатів були змушені використовувати бронеавтомобілі, а не набагато потужніші танки, які вони надавали своїм вірним прислужникам. Однак досвід, який ми отримали, навчив нас не недооцінювати бронеавтомобіль, оскільки він має велике застосування у допоміжних розвідувальних ролях, а за наявності потрібних інструментів його можна виробляти набагато дешевше, ніж будь-який пристойний танк, що ідеально підходить для такої гнучкої армії, як наша."
 PRF_integrating_elephants_into_the_sappers: "Інтеграція слонів у саперні війська"
 PRF_integrating_elephants_into_the_sappers_desc: "Бойові слони, що атакують ворожий стрій, можуть бути лише історичною реліквією, але помилково думати, що слони не можуть відігравати важливу роль у сучасній армії. На місцевості, непридатній для механізованих засобів, слони відмінно зарекомендували себе як частина саперних корпусів, ідеально підходячи для будівництва мостів через важкопрохідну місцевість та перевезення великого обладнання там, де інші варіанти просто не можуть цього зробити."
 PRF_guerrillas_of_the_deccan: "Партизани Декану"
 PRF_guerrillas_of_the_deccan_desc: "Ґанімі Кава є основою, на якій базується багато форм асиметричної війни, основою, яка була вдосконалена у великих горах Декану, які ми називаємо домом. Повернення цього стилю ведення війни знову до Ґатів, і навіть далі, сподіваємося, принесе нам бажані перемоги, як це сталося з Шиваджі."
 PRF_refine_mahadajis_legacy: "Удосконалення спадщини Махададжі"
 PRF_refine_mahadajis_legacy_desc: "Саме за часів Махададжі Сіндії правителі південної Індії вперше усвідомили, що просте покладання на мужність і доблесть не принесе вам нічого, крім витонченої спадщини, про яку розповідатимуть лише ваші підкорені сини. Якщо ми не хочемо зазнати такої долі, армія повинна бути не лише модернізована до європейських стандартів, але, сподіваємось, одного дня навіть перевершити їх!"
 PRF_modernising_ayurveda: "Модернізація аюрведи"
 PRF_modernising_ayurveda_desc: "Хворий солдат може бути прирівняний до мертвого без належного лікування, і протягом століть Аюрведа використовувалася для того, щоб вони знову стали на ноги. У наші дні більш містичні аспекти системи повільно зникли, щоб створити новий, більш науковий підхід, і хоча багато скептиків все ще вважають це не більш ніж псевдонаукою, важко заперечувати, що це повертає наших солдатів на ноги; навіть якщо це просто ефект плацебо."
 PRF_refitting_the_lancers: "Переоснащення уланів"
 PRF_refitting_the_lancers_desc: "Наші численні підрозділи уланів довгий час були гордістю армій усіх південноіндійських штатів, але без постійного вдосконалення ця гордість швидко перетвориться на не більше ніж реліквію. Ці люди повинні бути оснащені найновішими рушницями та артилерією, розробленою відповідно до їхньої великої мобільності, щоб вони могли й надалі бути швидким молотом, який розтрощує наших ворогів."
 PRF_encouraging_native_innovation: "Заохочення місцевих інновацій"
 PRF_encouraging_native_innovation_desc: "«Досить добре» надто довго було девізом багатьох наших квартирмейстерів, оскільки це завжди досить добре, поки ви не зіткнетеся з ворогом, який переважає вас у озброєнні, поки ваша власна зброя розвалюється на частини. Життєво важливо, щоб наші солдати були оснащені новітніми технологіями якомога швидше, розробленими вдома, а не імпортованими з-за кордону через роки після того, як наші вороги вперше отримають їх у свої руки."
 PRF_reforming_the_deccan_invincibles: "Реформування «Незламних Декану»"
 PRF_reforming_the_deccan_invincibles_desc: "«Незламні Декану» колись були великою елітною силою, яка виграла багато битв для Маратхів. У наш час такі досягнення роблять спеціалізовані елітні війська, які, коли це потрібно, є набагато ефективнішими, ніж здається, — ваші морські піхотинці, ваші гірські стрільці та навіть ваші парашутисти. Якщо ми хочемо наслідувати успіхи «Незламних Декану», ми повинні створити власні підрозділи спеціалізованих військ, щоб забезпечити перемогу."
 PRF_strengthening_the_gardi_core: "Зміцнення Ґарді"
 PRF_strengthening_the_gardi_core_desc: "В основі будь-якої армії лежить її піхотне ядро, оскільки надлишок еліти, готової розгромити армію ворога, мало корисний, якщо ваші лінії згинаються до того, як вони отримають шанс. Забезпечення того, щоб навіть найнижчий солдат був екіпірований і готовий боротися так наполегливо, як тільки може, буде найважливішим кроком у створенні армії світового класу для індійської нації."
 PRF_growing_the_iisc: "Розвиток ІІН"
 PRF_growing_the_iisc_desc: "Інститут Тата, або більш офіційно Індійський Інститут Науки (ІІН), є одним із найважливіших дослідницьких центрів у всій Індії, і сприяння його зростанню — це справа, щодо якої навіть найбільш сварливі принци можуть легко дійти згоди. Забезпечення того, щоб [PRF_GetCountryTitle] залишалася в авангарді науки, не лише допоможе у повсякденному житті, але й сприятиме розробці передових технологій для наших військових, що, сподіваємось, дасть велику перевагу."

 #Recovery focuses
 PRF_india_united: "Індія об'єднана!"
 PRF_india_united_desc: "Соціалістичну загрозу вигнано з півночі, і залишковому Раджу нарешті покладено край. Тепер наш обов'язок — відновити колишню славу нації, оговтатися від збитків, які принесла ця руйнівна війна, і повести всю Індію у світле нове майбутнє."

 PRF_reconstructing_the_nation: "Відбудова нації"
 PRF_reconstructing_the_nation_desc: "Індія лежить у руїнах, спустошена двома великими війнами за десятиліття; але її ніколи не буде переможено. Відновлення збитків має бути найвищим пріоритетом уряду, і, сподіваємося, з часом ми зможемо не лише оговтатися від руйнувань, але й одного дня перевершити довоєнні роки."
 PRF_fate_of_the_loyalist_rulers: "Доля правителів-лоялістів"
 PRF_fate_of_the_loyalist_rulers_desc: "Коли Осман оголосив про незалежність, щоб врятувати Індію від соціалізму, багато боягузливих принців на півночі відмовилися згуртуватися навколо нього, надто боячись стати на захист своєї свободи. Ті, кому пощастило уникнути вторгнення під час революції, змогли зберегти своє місце під британцями, і хоча вони, можливо, вирішили підтримати наших ворогів, ми все одно повинні вирішити, чи слід їм дозволити зберегти свої позиції."
 PRF_restoring_the_ousted_princes: "Відновлення вигнаних принців"
 PRF_restoring_the_ousted_princes_desc: "Члени Федерації, можливо, наполегливо боролися проти соціалістичних мародерів, але цього було недостатньо, щоб врятувати їх усіх. Багато їхніх земель було захоплено, і багато хороших людей вбито; навіть великий дім Сіндії був вигнаний зі своїх земель у Гваліорі, відтоді проживаючи в Гайдарабаді. Настав час виправити цю несправедливість і повернути ці землі їхнім законним правителям."
 PRF_federal_reorganisation: "Федеральна реорганізація"
 PRF_federal_reorganisation_desc: "Думати, що ми можемо просто повернути час до доби до революції, відновивши всі князівські землі такими, якими вони були тоді, — це не що інше, як фантазія. Їхні люди були радикалізовані проти них режимом Калькутти, і насильницьке повернення принців просто підготує нас до подальших заворушень у майбутньому. Натомість цими землями слід керувати як федеральними штатами, реорганізовуючи їх у міру необхідності, щоб включити їх до адміністрації."
 PRF_armed_forces_rehabilitation: "Реабілітація збройних сил"
 PRF_armed_forces_rehabilitation_desc: "Зрештою, проста людина рідко бореться за свої ідеологічні переконання, народіть її на кілька миль далі, і вона так само легко воюватиме під іншим прапором. Тому ми повинні надати загальну амністію низькоранговим солдатам наших ворогів, сподіваючись цим завоювати певну прихильність, і обговорити, якою має бути доля їхніх більш відданих офіцерів."
 PRF_reversing_socialist_destruction: "Подолання соціалістичних руйнувань"
 PRF_reversing_socialist_destruction_desc: "Соціалісти півночі сіяли хаос скрізь, куди їм вдавалося поширити свої щупальця, під фальшивими заявами про звільнення індійського народу від гноблення. Щоб належним чином відновити ці збитки, знадобляться роки, можливо, навіть десятиліття, але наразі ми можемо принаймні почати з усунення деяких аспектів їхнього економічного саботажу."
 PRF_protecting_the_farmers: "Захист фермерів"
 PRF_protecting_the_farmers_desc: "Сільське господарство — це основа нації, без якої все розвалилося б, але війна спустошила незліченні поля та ферми від мінометних снарядів і танкових гусениць. Забезпечення того, щоб ці фермери знову стали на ноги та продовжували виробляти достатньо їжі, щоб прогодувати націю та підтримувати розумний експорт, має бути одним із наших найвищих пріоритетів."
 PRF_bridge_and_road_project: "Проєкт мостів і доріг"
 PRF_bridge_and_road_project_desc: "Місто — це не що інше, як ізольований острів, якщо його жителі не можуть легко його залишити, а стан доріг нації на даний момент — це не що інше, як катастрофа. Проте, доклавши достатніх зусиль, ми зможемо знову з'єднати більшу частину нації, сприяючи подальшому зростанню та відновленню."
 PRF_increasing_agricultural_exports: "Збільшення сільськогосподарського експорту"
 PRF_increasing_agricultural_exports_desc: "Без капіталу багато проєктів, необхідних для відновлення нації, — це не більше ніж приємні дрібниці, які коштують менше паперу, на якому вони написані. Навіть попри збитки, сільське господарство залишається нашим найсильнішим експортом, і тому, щоб зібрати гроші, необхідні для покриття цих великих проєктів, ми повинні максимально збільшити наш експорт у цій галузі."
 PRF_urban_restoration_projects: "Проєкти відновлення міст"
 PRF_urban_restoration_projects_desc: "Жодне місце не постраждало сильніше в нещодавньому конфлікті, ніж великі міста країни, навіть поселення, як-от Наґпур, наразі є більшою мірою руїнами та могилами, ніж будинками. Нація не може сподіватися рухатися вперед, доки ці міські центри не будуть належним чином відновлені, і тому це має стати одним із перших великих проєктів, за які ми візьмемося."
 PRF_focus_on_capital_growth: "Зосередитися на зростанні капіталу"
 PRF_focus_on_capital_growth_desc: "Хоча просте відновлення до рівня минулих років значно покращить життя багатьох наших людей, нерозумно вважати, що цього самого буде достатньо для фактичного відновлення нації. Ми повинні посилити нашу попередню підтримку індійських підприємств, покладаючись на них також у допомозі у відновленні, щоб ми могли не лише оговтатися, але й продовжувати процвітати та ставати ще більшими."
 PRF_competitive_industry: "Конкурентоспроможна промисловість"
 PRF_competitive_industry_desc: "Під британським правлінням індійська промисловість була навмисно скалічена, щоб зупинити її справжнє зростання, при цьому наглядачі в Британії повністю усвідомлювали, що індійська промисловість може легко витіснити кожну британську фабрику без цих обмежень. Тепер, коли нас більше нічого не стримує, настав час довести їхні побоювання, і почати шлях до випередження європейського виробництва."
 PRF_tapping_indias_potential: "Використання потенціалу Індії"
 PRF_tapping_indias_potential_desc: "Природне багатство землі протягом століть давало можливість перетворити навіть найбіднішого жебрака на найбагатшого принца, якщо він зможе належним чином контролювати та використовувати природні багатства. Навіть якщо більша частина країни все ще спустошена, великий капітал все ще можна залучити, віддаючи пріоритет видобутку сировини, як-от нафта та залізо, і продаючи її тому, хто запропонує найвищу ціну, особливо відчайдушним націям, охопленим війною, які мають небагато інших варіантів постачальників."
 PRF_using_our_natural_wealth: "Використання наших природних багатств"
 PRF_using_our_natural_wealth_desc: "Хоча розширення багатьох існуючих шахт, кар'єрів та інших подібних об'єктів досі добре слугувало нам для втамування нашої спраги ресурсів, цього недостатньо, оскільки багато з цих місць швидко вичерпаються. Тому ми повинні почати освоювати нові родовища, які мають великий потенціал для видобутку великої кількості ресурсів, якщо їм приділити належний час та увагу. З їхньою допомогою ми зможемо легко доповнити наші потреби та значно збільшити наш експорт."

 #Political focuses
 PRF_greatness_belongs_to_osman: "Велич належить Осману!"
 PRF_greatness_belongs_to_osman_desc: "Коли тиранічних принців повернуто на їхнє належне місце, великий Нізам тепер вільний керувати Індією, як вважає за потрібне. Епоха Османа принесе нову світлу еру для індійського народу!"
 PRF_declare_the_kaisar_i_hind: "Проголосити Кайсар-і-Гінд"
 PRF_declare_the_kaisar_i_hind_desc: "Коли Нізам міцно тримає владу, настав час оголосити про зміни: викрадений британцями титул Кайсар-і-Гінд буде нарешті повернутий, а сам Осман служитиме імператором нації. Вся влада належатиме йому, і народ буде вітати його як великого відновника нації!"
 PRF_father_of_the_federation: "Батько федерації"
 PRF_father_of_the_federation_desc: "Хоча дехто міг припустити, що Нізам мав імперські амбіції, правда полягає в тому, що він мав намір лише централізувати владу уряду у своїх руках на благо всіх. Оскільки принци більше не можуть уповільнювати зростання нації своїми міжусобицями, настав час для Федерації стати великою державою, якою вона завжди мала бути."
 PRF_harness_the_razakars: "Залучити Разакарів"
 PRF_harness_the_razakars_desc: "Хоча з принцами, можливо, покінчено, завжди будуть узурпатори, які бажають, щоб нація знову занурилася в хаос. Тому ми повинні посилити нашу залежність від Разакарів, щоб належним чином вселити страх у будь-яких потенційних загроз і придушити в зародку тих, хто недостатньо розумний, щоб боятися."
 PRF_ensure_muslim_supremacy: "Забезпечити мусульманську перевагу"
 PRF_ensure_muslim_supremacy_desc: "Як стверджує лідер Разакарів Касім Разві, мусульманське правління над Індією виправдане виключно правом завоювання, оскільки кращого виправдання не потрібно. Жодних поступок переможеним не буде зроблено, і тому ми забезпечимо, щоб усі ключові посади займали мусульмани, як вони того заслуговують."
 PRF_dissolve_the_razakars: "Розпустити Разакарів"
 PRF_dissolve_the_razakars_desc: "Жорстоким головорізам Касіма Разві не можна довіряти, і вони вже пережили свою корисність. Настав час забезпечити їхній належний розпуск, а з самим Разві швидко покінчити."
 PRF_protector_of_all_faiths: "Захисник усіх віросповідань"
 PRF_protector_of_all_faiths_desc: "Спроба керувати всіма численними народами Індії, а не керувати разом з ними, призведе лише до катастрофічних наслідків. Тому ми повинні забезпечити рівний правовий захист та просування для всіх індійців, незалежно від того, чи є вони індусами, мусульманами, християнами, буддистами чи будь-ким іншим; і ми також забезпечимо, щоб вони знали, що ці переваги походять виключно від великої доброзичливості самого Османа."
 PRF_appoint_a_national_diwan: "Призначити національного дівана"
 PRF_appoint_a_national_diwan_desc: "Хоча Осман може бути найвищою владою в країні, влада безглузда, якщо немає кому забезпечити виконання його волі. Тому національний діван буде призначений безпосередньо Османом і діятиме як головний виконавець наказів Османа."
 PRF_establish_the_national_executive_council: "Створити Національну виконавчу раду"
 PRF_establish_the_national_executive_council_desc: "Як правитель Гайдарабаду, Осман вирішив створити Виконавчу раду, щоб радити йому у важливих питаннях і допомагати забезпечити найбільш ефективне виконання його волі. Тепер, коли вся Індія діє під його владою, логічно, що подібна рада має бути створена на національному рівні, що складається з тих, хто справді продемонстрував свою лояльність і корисність."
 PRF_assert_authority_over_the_realm: "Затвердити владу над королівством"
 PRF_assert_authority_over_the_realm_desc: "Хоча автономія Мадрасу існує трохи більше десяти років, вона вже стала застарілим пережитком минулої епохи. Настав час розпустити цю непотрібну автономію та повністю затвердити владу Османа над усім королівством, а не продовжувати дозволяти їхньому збоченому демократичному уряду гнобитися."
 PRF_royal_sadaqah: "Королівська садака"
 PRF_royal_sadaqah_desc: "Як хороший мусульманин, і особливо як найбагатша людина у світі, обов'язок Османа — забезпечувати своїх підданих; подорожніх, обтяжених боргами, і особливо найбідніших серед них. Саме завдяки Осману про всіх цих людей належним чином подбають, і вони обов'язково асоціюватимуть його ім'я з доброзичливістю."
 PRF_expand_the_main_experimental_farm: "Розширити «Головну експериментальну ферму»"
 PRF_expand_the_main_experimental_farm_desc: "Протягом тисячоліть голод був однією з найбільших загроз для індійського народу, вбиваючи більше, ніж будь-який завойовник. Завдяки значним досягненням останніх десятиліть у світі штучних азотних добрив, викорінення голоду не за горами, і з цією метою ми повинні розширити існуючу Головну експериментальну ферму до великого сільськогосподарського університету; сподіваючись забезпечити Індії провідну роль у розвитку сільського господарства, щоб очолити цю боротьбу з голодом."
 PRF_begin_agricultural_reforms: "Розпочати сільськогосподарські реформи"
 PRF_begin_agricultural_reforms_desc: "Протягом століть у сільському господарстві не було значного технологічного прогресу, якщо говорити про середнього селянина, за винятком, можливо, сівалки. Однак, оскільки механізоване сільськогосподарське обладнання стає дешевшим і простішим у виробництві, ми перебуваємо на порозі великої нової технологічної революції у сільському господарстві, і за достатньої підтримки ми можемо почати шлях до масової механізації індійського сільського господарства."
 PRF_enshrine_compulsory_primary_education: "Закріпити обов'язкову початкову освіту"
 PRF_enshrine_compulsory_primary_education_desc: "Щоб Індія еволюціонувала з колоніальної глибинки, якою вона була за Британії, у сучасну велику державу, ми не можемо продовжувати бути суспільством, у якому переважна більшість населення повністю неписьменна. Тому життєво важливо, щоб ми зробили початкову освіту обов'язковою для всіх індійців і значно розширили державне фінансування освіти, щоб гарантувати, що якомога більше дітей отримають належну освіту, готові справді робити свій внесок у суспільство."

 PRF_reign_of_the_princes: "Правління принців"
 PRF_reign_of_the_princes_desc: "Коли амбіції Османа були повністю придушені, настав час «Великій Четвірці» реалізувати свої власні амбіції. Майбутнє індійської нації нарешті вирішуватимуть її власні місцеві правителі, ті, хто, очевидно, найбільше підходить для правління."
 PRF_the_image_of_the_rajarshi: "Образ Раджарші"
 PRF_the_image_of_the_rajarshi_desc: "Раджарші, або Королівські Мудреці, — це ті серед правлячих каст індусів, які справді виявляють чисту відданість і турботу про свій народ, завжди обираючи збагачення нації, а не себе. Хоча, звичайно, вони не називають себе так безпосередньо, було б дуже корисно заохочувати громадськість розглядати керівництво Ради як таких Раджарші, які благородно ведуть націю вперед і віддають усе, що мають, на користь нижчих каст, над якими вони по праву керують."
 PRF_royal_patronage_fund: "Фонд королівського патронажу"
 PRF_royal_patronage_fund_desc: "Це правильно, щоб багаті повертали суспільству, і оскільки принци Федерації тепер діють дуже злагоджено, має сенс створити колективний фонд, який дозволить кожному принцу робити пожертви на спільну мету. Ці кошти будуть витрачені на інфраструктуру та розвиток по всій країні, причому заслуги будуть колективно приписані кожному принцу, гарантуючи, що кожен індієць визнає життєво важливу роль, яку відіграє кожен принц у піднесенні нації."
 PRF_a_path_for_every_village: "Шлях для кожного села"
 PRF_a_path_for_every_village_desc: "Багато невеликих сіл по всій країні майже повністю ізольовані від зовнішнього світу, а ті нечисленні зв'язки, які вони мають, часто є не більш ніж ґрунтовими стежками та дорогами, що руйнуються, прокладеними століття тому. Ідеальним використанням нового Фонду буде належне підключення цих сіл до сучасних дорожніх мереж, що, сподіваємося, значно сприятиме їхньому майбутньому розвитку."
 PRF_redistribute_the_presidencies: "Перерозподіл президентств"
 PRF_redistribute_the_presidencies_desc: "Колишні президентства Британської імперії є не чим іншим, як землями, вкраденими в їхніх законних правителів іноземними загарбниками. Тепер, коли вони були повернуті, перед нами постає питання, що з ними робити. З цією метою було запропоновано розділити їх між принцами, які стали на бік Федерації, а також лояльними міноритарними заміндарами та високопоставленими солдатами, які були життєво важливими для нашої перемоги."
 PRF_undermine_the_special_status: "Підрив особливого статусу"
 PRF_undermine_the_special_status_desc: "Виступ проти Мадрасу зрештою принесе невелику вигоду за ту кількість нестабільності, яку він спричинить. Натомість було б набагато ефективніше повільно послаблювати їхню автономію, доки ми фактично повністю не підірвемо її, і тоді вони не матимуть жодної влади, щоб зупинити нас."
 PRF_control_the_opposition: "Контроль над опозицією"
 PRF_control_the_opposition_desc: "Партія мправедливості, можливо, зазнала краху перед обличчям Андхра Махасабхи, але це лише робить їх ще більш корисними для наших цілей. Через державну підтримку неофіційними каналами Партія Справедливості може легко пережити велике відродження в Мадрасі, і в обмін на таке відродження вони, безсумнівно, будуть прийнятні для інтересів своїх благодійників."
 PRF_partition_the_madras_autonomy: "Поділ автономії Мадрасу"
 PRF_partition_the_madras_autonomy_desc: "Дозвіл на створення автономії Мадрасу був помилкою, яку слід негайно виправити, тепер, коли Федерація має можливість це зробити. З цією метою сам Мадрас буде повністю скасований, а його землі будуть розділені між сусідніми принцами, яким вони більш справедливо належать."
 PRF_madras_financial_zone: "Мадраська фінансова зона"
 PRF_madras_financial_zone_desc: "Хоча автономія Мадрасу, можливо, зникла, а його землі розділені, питання про те, що робити з власне містом Мадрас, тепер стоїть перед нами через його величезну цінність. Тому було запропоновано, щоб замість того, щоб просто передати його будь-якому з принців, місто стало спеціальним адміністративним округом зі зниженою податковою ставкою порівняно з рештою нації, спрямованим на залучення якомога більшого іноземного капіталу, щоб перетворити його на азіатську Волл-Стріт."
 PRF_house_of_princely_representatives: "Палата князівських представників"
 PRF_house_of_princely_representatives_desc: "Палата Принців, можливо, надає голос нижчим членам нашої великої федерації, але цього недостатньо, щоб забезпечити їм активну роль в управлінні нацією. Тому її буде реорганізовано в належну Палату Представників, де законодавство спочатку розроблятиметься та голосуватиметься, перш ніж буде подано Діваном на затвердження Раді."
 PRF_the_new_supreme_council: "Нова Верховна Рада"
 PRF_the_new_supreme_council_desc: "За часів Ост-Індійської компанії Верховна Рада Бенгалії діяла як найвища влада Індії, до складу якої входили чотири члени, а п'яту посаду займав генерал-губернатор як голова Ради, хоча, що примітно, він не мав права вето на рішення. Тепер, понад століття потому, знову виникла подібна система, якою керують тепер місцеві правителі, а не колоніальні лідери, і через неї тепер буде виражатися справжня воля індійського народу."

 PRF_iyers_national_government: "Національний уряд Айєра"
 PRF_iyers_national_government_desc: "Хоча Айєр, можливо, і був призначений Нізамом для управління позапартійним кабінетом, за допомогою основних партій Федерації, Нізам помиляється, якщо вважає, що він просто діятиме як продовження його правління. Незабаром єдиною людиною в країні, яка справді матиме всі карти, буде Діван, і ні Нізам, ні Рада навіть не зрозуміють, що сталося."
 PRF_extend_the_temple_entry_proclamation: "Розширити прокламацію про допуск до храмів"
 PRF_extend_the_temple_entry_proclamation_desc: "Попри опозицію деяких зарозумілих еліт, які заперечують проти будь-якого рівня прогресу, незалежно від масштабу, прокламація Варми про допуск до храмів є однією з найпопулярніших речей, які будь-хто з Ради зробив за останні роки. Оскільки Рада повністю підтримує це, а Нізам навряд чи може заперечувати, її слід поширити на федеральний рівень, що дасть уряду таку необхідну підтримку популярності."
 PRF_finalise_kongunadu_dam_projects: "Завершити проєкти гребель Конгунаду"
 PRF_finalise_kongunadu_dam_projects_desc: "До революції в Південній Індії було розпочато багато великих гідроелектричних проєктів, зокрема гребля Крішна Раджа Сагара вздовж Кавері. Революція та грошові проблеми, що послідували за нею, призвели до того, що ці проєкти були занедбані, але тепер, коли ми перебуваємо в набагато кращому становищі, було б нескладно завершити їх, забезпечивши зрошення фермерам регіону та значну кількість електроенергії для зростаючих міських центрів у Майсурі."
 PRF_the_canal_campaign: "Канальна кампанія"
 PRF_the_canal_campaign_desc: "Індія наповнена водоймами, починаючи від найменшого гірського струмка і закінчуючи могутньою Ґанґою, але великі частини країни все одно страждають від посухи. Таку проблему можна легко вирішити за допомогою великої серії громадських робіт, спрямованих на створення каналів та іригаційних мереж по всій країні, що має значно допомогти фермерам нації."
 PRF_establish_the_fact_plant: "Створити завод ФАКТ"
 PRF_establish_the_fact_plant_desc: "Fertilisers and Chemicals Travancore (Добрива та Хімікати Траванкору), або як багато хто, залучений до планування, просто почав називати його «ФАКТ», буде великою фабрикою, побудованою в штаті Траванкор, за підтримки самого Варми. Завдяки цій фабриці ми зможемо виробляти велику кількість сульфату амонію та інших сучасних добрив, що, сподіваємось, значно збільшить виробництво сільськогосподарських культур і захистить нас від неврожаїв та голоду."
 PRF_sponsoring_education_institutions: "Спонсорування освітніх закладів"
 PRF_sponsoring_education_institutions_desc: "Навіть після революції багато великих університетів залишаються повністю функціональними по всій країні, хоча багатьом бракує необхідного фінансування для подальшого розширення або навіть просто виправлення фізичних збитків від років боїв. Збільшення державного фінансування цих установ для усунення цих недоліків значно окупиться в довгостроковій перспективі, адже знання є однією з найпотужніших речей, які ми можемо мати."
 PRF_cementing_the_diwanship: "Закріплення діванства"
 PRF_cementing_the_diwanship_desc: "Призначення Айєра Діваном замість кандидата від Махасабхи можна описати багатьма словами, але «безспірне» точно не одне з них. Завоювати не лише їх, але й багато менших партій, включаючи Партію Справедливості Мадрасу чи Юніоністів Пенджабу, безумовно, буде важким завданням; для цього потрібно буде скористатися багатьма послугами та особистими стосунками. Якщо таке завдання справді можливе, немає кращої людини для його виконання, ніж Айєр."
 PRF_reforming_the_electorates: "Реформування виборчих округів"
 PRF_reforming_the_electorates_desc: "Поспішно створену виборчу систему у Федерації навряд чи можна назвати ідеальною, оскільки система Мадрасу, яку вона успадкувала, зберігає багато недоліків, розроблених британцями, щоб принести користь їм та їхнім прихильникам. Необхідно докласти великих зусиль для реформування цієї системи, гарантуючи, що голоси всіх у нації будуть почуті, а не просто заглушені найголоснішими серед них."
 PRF_subverting_the_council: "Підрив Ради"
 PRF_subverting_the_council_desc: "Ідея існування «Великої Четвірки» вкорінена у протистоянні Осману, і коли його тиранія тепер ще більше стримана, їхній зовнішній вигляд єдності може бути легко розбитий. За допомогою правильних слів, приватних розмов та таємних угод, завоювання достатньої кількості членів Ради для виконання будь-якої роботи буде простим завданням."
 PRF_princely_patronage: "Князівський патронаж"
 PRF_princely_patronage_desc: "Люди рідко діють проти своїх інтересів, навіть найбільш оманливий із принців часто змінить свою думку, якщо справи почнуть йти на його користь. Додавши достатньо «мастила», навіть могутнього Нізама можна змусити робити все, що забажає, і, будучи так добре знайомим з кожною людиною в Раді, Айєр знаходиться в ідеальному положенні, щоб використовувати цю слабкість."
 PRF_reshaping_the_governorships: "Переформатування губернаторств"
 PRF_reshaping_the_governorships_desc: "Як пережиток британського правління, хоча й корисний, менші принци Федерації опинилися згрупованими в адміністративні одиниці, щоб легше справлятися з їхніми потребами. Однак ці губернаторства все ще жорстко змодельовані відповідно до британської адміністрації, але з достатнім передбаченням їх можна легко переформатувати, щоб вони працювали набагато сильніше на користь Федерального уряду."
 PRF_the_sovereign_statesman: "Суверенний державний діяч"
 PRF_the_sovereign_statesman_desc: "Хоча і Нізам, і «Велика Четвірка» вважають, що виграли у конфлікті проти іншого, єдиною людиною, яку справді можна вважати переможцем, є не хто інший, як Айєр, результат, запланований із самого початку. Нізам може думати, що має корисну маріонетку, а принци можуть думати, що вони все ще віддають накази, але зрештою єдиним сувереном Федерації є їхній «сумлінний» Діван."

 PRF_the_spirit_of_andhrodyamam: "Дух Андхрод'ямам"
 PRF_the_spirit_of_andhrodyamam_desc: "Голос індійського народу нарешті почутий, і він волав до свободи та волі. Вони обрали Махасабху, щоб виконати свою волю, і Діван Рао боротиметься так завзято, як тільки зможе, щоб зробити це."
 PRF_elevate_the_status_of_madras: "Підвищити статус Мадрасу"
 PRF_elevate_the_status_of_madras_desc: "Відсутність представництва Мадрасу в раді, попри його великий розмір і значення, є не чим іншим, як пародією. Залучивши достатньо послуг і правильних слів, Раду, сподіваємось, можна переконати підвищити Мадрас до повноправного членства, нарешті виправивши цю несправедливість."
 PRF_absorb_congress_remnants: "Поглинути залишки конгресу"
 PRF_absorb_congress_remnants_desc: "Індійський національний конгрес не був справді соціалістичною організацією, він просто був захоплений вітром революції та введений в оману деякими зі своїх найгучніших членів. Все ще є незліченна кількість людей, які поділяють його цінності незалежної та вільної Індії, нації, яка може підтримувати себе, а не покладатися на інших, і цим людям буде надано новий дім як частині Махасабхи."
 PRF_linguistical_reorganisation: "Лінгвістична реорганізація"
 PRF_linguistical_reorganisation_desc: "Хоча ми всі індійці, ми не можемо забувати, що ми все ще телугу, бенгальці, таміли та багато іншого. Губернаторства та федеральні штати, що залишилися в нації, повинні відображати ці внутрішні відмінності, а не зафарбовувати їх, як це робили британці, щоб вони могли процвітати як рівноправні аспекти індійської культури, а не придушуватися гегемонією гінді."
 PRF_restrict_the_vettichakiri: "Обмежити веттічакірі"
 PRF_restrict_the_vettichakiri_desc: "Система примусової праці веттічакірі є одним із найбільш варварських пережитків минулої епохи, що залишилися в нації, а дора, які її застосовують, не кращі за найгірших злочинців злочинного світу. Її повне скасування має бути здійснено якомога швидше, навіть якщо доведеться піти на компроміси з її практиками в короткостроковій перспективі."
 PRF_prioritise_rural_growth: "Пріоритет сільському зростанню"
 PRF_prioritise_rural_growth_desc: "Сільські частини нації — це справді її серце та душа, оскільки ніхто не є більш справжнім індійцем, ніж скромний фермер, який забезпечує себе та свою родину. Однак ці люди все ще є одними з найбільш вразливих у нації, їх легко залишити позаду, поки великі міські райони рухаються вперед із великими досягненнями. Ми повинні забезпечити, щоб цього не сталося, і щоб наше сільське населення отримувало стільки ж користі, скільки й міське."
 PRF_protecting_the_rights_of_dalits: "Захист прав далитів"
 PRF_protecting_the_rights_of_dalits_desc: "Варварством є вважати, що через свою касту людина не може навіть ходити по дорозі з іншими людьми або навіть носити взуття в присутності своїх так званих кращих. Ми повинні запровадити широкий спектр захисту для цих далитів, адівасі та всіх інших пригноблених класів для боротьби з цією дискримінацією."
 PRF_subsidise_indian_business: "Субсидування індійського бізнесу"
 PRF_subsidise_indian_business_desc: "Навіть за попередньої державної підтримки, бізнес нині об'єднаної нації все ще відстає від своїх сучасників по всьому світу. Цього не можна допустити, і слід надати подальші субсидії, щоб забезпечити їхнє остаточне сходження на вершину світу."
 PRF_strengthen_the_industrial_centres: "Зміцнення промислових центрів"
 PRF_strengthen_the_industrial_centres_desc: "Навіть попри збитки, яких вони зазнали під час численних війн, промислові центри нації, як-от Ахмадабад, все ще є нашим найкращим шансом на довгострокове зростання. Відновлення їх не лише до їхньої попередньої висоти, але й піднесення їх ще далі має бути одним із найвищих пріоритетів уряду."
 PRF_fund_local_language_libraries: "Фінансування бібліотек місцевими мовами"
 PRF_fund_local_language_libraries_desc: "Майже всі ті, хто розмовляє англійською або гінді, не можуть уявити собі, що вони можуть зайти до бібліотеки і не зрозуміти жодної книги на полицях. Для мільйонів людей по всій країні це було просто фактом життя, і їх змушували вивчати ці нав'язані мови. Ми більше не будемо цього терпіти і допоможемо фінансувати створення нових бібліотек по всій країні місцевими мовами, щоб кожен міг отримати можливість читати."
 PRF_support_the_navjeevan_mandali: "Підтримка Навдживан Мандалі"
 PRF_support_the_navjeevan_mandali_desc: "Махіла Навдживан Мандалі вже багато років є жіночим крилом Махасабхи, і вона допомогла досягти великих покращень у житті багатьох жінок нації. Їхні зусилля заслуговують високої похвали, і оскільки партія тепер керує урядом, її ключові члени повинні отримати важливу роль на посадах, спрямованих на піднесення індійських жінок."

 PRF_controlling_the_rivers: "Контроль над річками"
 PRF_controlling_the_rivers_desc: "Північні межі Декану захищені від зовнішніх загарбників не лише величними горами, але й могутніми річками, які прорізають собі шлях через націю. Забезпечення контролю над цими річками за допомогою частих військово-морських патрулів є життєво важливим для того, щоб наші вороги не змогли пробратися повз них."
 PRF_strikes_from_the_sky: "Удари з неба"
 PRF_strikes_from_the_sky_desc: "Будівництво належного флоту є одним із найдорожчих починань, яке може розпочати держава, хороший корабель може коштувати державі мільйони лише для того, щоб ввести його в експлуатацію, не кажучи вже про постійні експлуатаційні витрати. Шкода, що простий літак, вироблений за частку вартості, може повністю вивести з ладу навіть найбільший лінкор точним ударом, і ми скористаємося цим, щоб вирівняти шанси."
 PRF_found_the_federal_marine_force: "Заснувати Федеральні морські сили"
 PRF_found_the_federal_marine_force_desc: "Здається майже гарантованим, що одного дня [PRF_GetCountryTitle] знадобляться десантні бойові сили, особливо якщо врахувати багато островів в Індійському океані, які потрапляють до нашої сфери впливу. Ми повинні випередити час і наказати сформувати такі сили за першої ж можливості."
 PRF_fund_mass_dockyard_expansions: "Фінансувати масове розширення верфей"
 PRF_fund_mass_dockyard_expansions_desc: "Сказати, що інфраструктура для будівництва кораблів в Індії жалюгідна, було б надто оптимістично. На всій території [PRF_GetCountryTitle] небагато об'єктів, здатних виробляти щось схоже на військовий корабель, і виправлення цього має бути головним пріоритетом, якщо ми хочемо побудувати власний флот."
 PRF_conquest_of_the_beaches: "Завоювання пляжів"
 PRF_conquest_of_the_beaches_desc: "Висадка на берегову лінію — це досить просте завдання за наявності потрібного обладнання, але чи справді вижити після висадки, а потім ще й скористатися цим? Ось це важка частина. Ми повинні забезпечити належну підготовку наших людей за допомогою іноземних радників, щоб ми не просто кидали їх на смерть, щойно вони ступлять на берег."
 PRF_ambitious_navy: "Фокус амбітного флоту"
 PRF_ambitious_navy_desc: "Нехай критики будуть прокляті, навіть за нашої обмеженої інфраструктури ми побудуємо найвеличніший флот, який коли-небудь бачив світ! Незабаром жодне судно не відпливе ніде в Індійському океані без дозволу Федерального флоту, і будь-хто, хто думає інакше, зустріне повну міць нашого флоту."
 PRF_defend_coast: "Захистити наші води"
 PRF_defend_coast_desc: "Навіть якщо великий флот буде великим джерелом гордості для нації, ми не можемо витрачати мільйони лише для того, щоб підживити своє марнославство, і маємо мислити логічно. Нації набагато краще послужить невелика сила, яка віддасть пріоритет захисту нашої берегової лінії та забезпеченню наших зв'язків із зовнішнім світом проти будь-якого ворожого супротивника."
 PRF_restoring_facilities_from_the_reclaimed_lands: "Відновлення об'єктів на повернених землях"
 PRF_restoring_facilities_from_the_reclaimed_lands_desc: "Оскільки решта Індії тепер повністю під нашим контролем, ми маємо ідеальну можливість для подальшого розширення нашої військово-морської інфраструктури. Багато об'єктів на повернених землях були пошкоджені війною, але все ще наповнені корисними інструментами та обладнанням, які можна легко відновити або перепрофілювати, що дасть нам велику перевагу для подальшого виробництва."
 PRF_commission_a_cruiser_fleet: "Ввести в експлуатацію крейсерський флот"
 PRF_commission_a_cruiser_fleet_desc: "Крейсери знаходяться в щасливій золотій середині для військових кораблів, будучи значними суднами, які присоромлюють низькі есмінці, але коштують далеко не так багато, як основні лінкори чи авіаносці. Замовлення на створення повноцінного флоту цих кораблів, використовуючи сучасні технології виробництва, значно принесе користь Федеральному флоту."
 PRF_divert_funding_to_the_navy: "Перенаправити фінансування на флот"
 PRF_divert_funding_to_the_navy_desc: "Хоча ми можемо не мати бюджету, щоб покрити всі витрати та фінансувати масовий флот, хто сказав, що ми повинні фактично покривати всі витрати? Є багато речей, які отримують федеральне фінансування, які можна просто скоротити на рік чи близько того, і ці кошти можуть бути спрямовані на подальше виробництво лінкорів."
 PRF_regular_fleet_exercises: "Регулярні флотські навчання"
 PRF_regular_fleet_exercises_desc: "Витрачати стільки на великий флот безглуздо, якщо люди за кермом навіть не знають основ експлуатації свого судна. Флот повинен проводити навчання якомога частіше, коли він не використовується, щоб гарантувати, що наші моряки знають кожен дюйм свого корабля, з покараннями для тих, хто відстає від наших стандартів."
 PRF_furthering_destroyer_technology: "Розвиток технології есмінців"
 PRF_furthering_destroyer_technology_desc: "Будь-хто в сучасну епоху, хто знає, як побудувати корабель, може зібрати для вас есмінець, і тому майже кожен підводний човен був розроблений з огляду на це. Якщо ми хочемо захистити наші конвої від цієї підводної загрози, нам знадобляться набагато сучасніші та спеціалізовані судна, здатні впоратися з ними."
 PRF_furthering_maritime_exports: "Сприяння морському експорту"
 PRF_furthering_maritime_exports_desc: "Ми не можемо прикидатися, що морська торгівля не є життєво важливою для майбутнього нації, навіть якщо більша частина населення вважає перетин *кала пані* (кала пані - чорні води, індійська назва океану) табу. Ті, хто бажає вирушити в морські подорожі, повинні бути найняті в наш торговий флот, приносячи стільки імпорту та експорту, скільки ми можемо собі дозволити."
 PRF_improving_our_depth_charges: "Покращення наших глибинних бомб"
 PRF_improving_our_depth_charges_desc: "Підводний човен може бути вразливим, коли він спливає, але ми не можемо гарантувати, що завжди зловимо їх, коли вони це зроблять. Покращення потужності наших глибинних бомб та збільшення їхньої швидкості занурення має допомогти забезпечити більше знищених підводних човнів та безпечніший світ для наших конвоїв."

 PRF_deccan_air_school: "Деканська авіаційна школа"
 PRF_deccan_air_school_desc: "Деканська авіаційна школа була заснована в Гайдарабаді, щоб привести наші військово-повітряні сили до сучасного стану в короткі міжвоєнні роки. Ми повинні продовжувати інвестувати в наших пілотів, інакше ми відставатимемо."
 PRF_develop_air_industry: "Заснувати Деканський аеронавігаційний консорціум"
 PRF_develop_air_industry_desc: "Нам бракує будь-якого власного аеронавігаційного виробництва. Щоб конкурувати з нашими північними суперниками, ми повинні об'єднати бізнес-інтереси в керований консорціум, щоб розпочати виробництво."
 PRF_foreign_instructors: "Іноземні авіаційні інструктори"
 PRF_foreign_instructors_desc: "Хоча у військово-повітряних силах [PRF_GetCountryTitle] є деякі офіцери, навчені за кордоном, нам знадобиться більше іноземних інструкторів у Деканській авіаційній школі, якщо ми хочемо підготувати ціле покоління нових пілотів. Настав час звернутися до Німеччини та Японії за досвідом."
 PRF_air_fields: "Передові авіабази"
 PRF_air_fields_desc: "У неминучому зіткненні за долю Індії буде вирішальним, щоб наші військово-повітряні сили мали бази, достатньо близькі для завдавання ударів по ворогу."
 PRF_air_research_council: "Сформувати Раду з авіаційних досліджень"
 PRF_air_research_council_desc: "Недостатньо просто привести військово-повітряні сили [PRF_GetCountryTitle] до сучасних стандартів. Щоб опанувати субконтинент, нам потрібно буде зібрати раду експертів, щоб просунути наші військово-повітряні сили в майбутнє."
 PRF_joint_officer_exercises: "Спільні навчання офіцерів"
 PRF_joint_officer_exercises_desc: "Багато наших офіцерів наполягають на тому, що військово-повітряні сили відіграватимуть вирішальну допоміжну роль для наших сухопутних військ. Нам слід провести спільні навчання армії та військово-повітряних сил, щоб розпочати розвиток координації."
 PRF_forward_air_defenses: "Створити протиповітряну оборону"
 PRF_forward_air_defenses_desc: "Ми не єдина держава на субконтиненті, яка інвестує у військово-повітряні сили. Щоб підготуватися до небажаної можливості бомбардувань наших великих міст, ми повинні розробити системи протиповітряної оборони."
 PRF_bomber_focus: "Повітряні гармати"
 PRF_bomber_focus_desc: "Щоб взяти в облогу великі міста півночі, нам знадобляться нові повітряні гармати. Нові жахливі бомби вже продемонстрували руйнівний ефект."
 PRF_flying_cavalry: "Летюча Гузурат"
 PRF_flying_cavalry_desc: "Елітна кавалерія Гузурат армії Маратха колись вселяла жах по всьому субконтиненту. Наші пілоти відновлять їхню спадщину."
 PRF_princes_of_the_air: "Принци неба"
 PRF_princes_of_the_air_desc: "У міру розвитку наших військово-повітряних сил багато пілотів показали себе на голову вище за інших. Сміливі подвиги, небезпечні ситуації, ці принци неба зарекомендували себе як вирішальні для наших військових зусиль. Ми повинні заохочувати та інвестувати в їхній розвиток."
 PRF_aeronautics_council: "Деканський аеронавігаційний консорціум"
 PRF_aeronautics_council_desc: "Деканський аеронавігаційний консорціум — це об'єднання аеронавігаційних підприємств, створене для сприяння будівництву Федеральних військово-повітряних сил."
 PRF_princes_of_the_air_idea: "Принци неба"
 PRF_princes_of_the_air_idea_desc: "Завдяки елітному керівництву [PRF.GetNameDef] розвинула освітній, виробничий та дослідницький потенціал Федеральних військово-повітряних сил. Нові принци неба пануватимуть у небі всього субконтиненту."

 PRF_our_own_sphere: "Наша власна сфера"
 PRF_our_own_sphere_desc: "Індія звільнила себе з-під чобота як Британії, так і соціалізму, то навіщо їй шукати новий чобіт, під який можна залізти? Настав час натомість створити наш власний союз, гідний такої нації, як наша, якій судилося велич!"
 PRF_join_the_world_stage: "Приєднатися до світової арени"
 PRF_join_the_world_stage_desc: "Хоча ми можемо мати амбіції одного дня очолити власну велику сферу, ми повинні визнати реальність того, що ізоляція від великих держав решти світу була б не чим іншим, як саботажем, замаскованим під браваду. Натомість ми повинні приєднатися до однієї з великих фракцій світу, яка допомогла нам об'єднати субконтинент, принаймні до тих пір, поки ми не зможемо діяти самостійно в далекому майбутньому."
 PRF_bhutan: "Вирішити питання з Бутаном"
 PRF_bhutan_desc: "З нашим контролем над Індійським субконтинентом, який тепер є надійним, настав час подивитися на наш північний кордон. У Китаї піднімаються нові великі держави, і ми повинні забезпечити свій контроль над Бутанським королівством як буферною державою в Гімалаях. Вони діятимуть як щит проти китайських вторгнень, хочуть вони того чи ні."
 PRF_nepal_claims: "Вирішити питання з Непалом"
 PRF_nepal_claims_desc: "Непал розширився на індійські низовини в хаосі після Вельткрігу. Настав час відновити наше панування над цими територіями."
 PRF_claim_ceylon: "Претендувати на Цейлон"
 PRF_claim_ceylon_desc: "За правом, Цейлон, Мальдіви та інші острови Індійського океану є частиною законної території нашої нації. Їхньому колоніалізму має настати кінець."
 PRF_incorporate_burma: "Інкорпорувати Бірму"
 PRF_incorporate_burma_desc: "Тепер, коли колоніальна та соціалістична загроза придушена, ми можемо дивитися за межі наших поточних кордонів із думкою про майбутнє. Хоча Бірма відрізняється від решти Індії історією та культурою, вона також перебувала під британським правлінням і лежить у нашій природній сфері впливу. Настав час інкорпорувати її до нашого королівства, що розширюється."
 PRF_claim_goa: "Претендувати на Ґоа"
 PRF_claim_goa_desc: "Анклав Ґоа — не що інше, як більмо на оці нашої гордої нації. Це по праву наша територія, і її потрібно повернути."
 PRF_claim_pondicherry: "Претендувати на Пондішері"
 PRF_claim_pondicherry_desc: "Анклав Пондішері — не що інше, як більмо на оці нашої гордої нації. Це по праву наша територія, і його потрібно повернути."
 PRF_incorporate_siam: "Бірманські території в Сіамі"
 PRF_incorporate_siam_desc: "Сіамське королівство було однією з найбільш опортуністичних «держав-стерв'ятників», які скористалися розладом після кончини Раджу. Коли молода бірманська нація була сильно притиснута соціалістичними повстаннями в Ассамі та Бенгалії, уряд Сіаму просто окупував кілька округів та префектур, включаючи місто Моулмейн, згадане у відомому вірші Кіплінга. Ці землі мають бути повернуті!"
 PRF_tibet: "$HND_liberating_the_frontier_tracts$"
 PRF_tibet_desc: "$HND_liberating_the_frontier_tracts_desc$"
 PRF_aksai_chin: "$HND_restoring_the_unity_of_kashmir$"
 PRF_aksai_chin_desc: "$HND_restoring_the_unity_of_kashmir_desc$"

