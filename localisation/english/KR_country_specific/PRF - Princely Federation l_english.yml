 princely_federation_events.348.t: "Шепіт про зраду"
 princely_federation_events.348.d: "Сказати, що Нізам на даний момент непопулярний у Федерації, це як сказати, що росіяни були дещо збентежені Брест-Литовським миром. Його постійні вето на ключові урядові політики, уряду, підтриманого та обраного більшістю виборців нації, призвели до того, що його ретельно розрекламований імідж рятівника нації розмивається швидше, ніж земля навколо Тісти.\n\nВнаслідок цієї зростаючої непопулярності соціалістичні залишки реорганізувалися навколо залишкової Комуністичної партії Індії, створивши значну силу, спрямовану на повалення Нізама та впровадження реформ, які він витратив стільки часу на блокування. Хоча зазвичай ця група не мала б великого впливу, і була б просто розгромлена разом з іншими дисидентами, почали поширюватися чутки про співпрацю між Всеіндійською Махасабхою (AIM) та цими повстанцями через їхнє спільне обурення проти Нізама.\n\nЧерез побоювання, що сам Рао може незабаром приєднатися до цього потенційного повстання, Разві та його Разакари запропонували спробувати заарештувати Рао та ліквідувати цих соціалістів, щойно буде віддано наказ. Чи бажає Нізам заходити так далеко, залишається невідомим..."
 princely_federation_events.348.a: "Рао ніколи не можна було довіряти, накажіть його заарештувати!"
 princely_federation_events.348.b: "Вжиття заходів лише посилить ситуацію, не втручайтеся."

 princely_federation_events.349.t: "Деканське повстання"
 princely_federation_events.349.d: "Хоча Рао, можливо, приватно висловлював своє обурення з приводу перевищення повноважень Нізамом, доки йому не просочилася новина про наказ про його арешт, він навіть не починав розглядати повстання. Однак дії Нізама майже одразу кинули його прямо в обійми повстанців, а взаємні контакти між Всеіндійською Махасабхою (AIM) та Комуністичною Партією Індії (CPI) швидко спровокували повстання за підтримки уряду. Через теперішню жахливу популярність Османа мало хто бажав прийти йому на допомогу, і більша частина армії стала на бік уряду проти нього. Самі Разакари були швидко розгромлені, хоча про самого Разві досі немає відомостей.\n\nБачачи неминуче, Нізам та його родина, як повідомляється, втекли літаком, хоча ніхто, здається, ще не знає і не погоджується, куди саме. Тим часом усередині країни Рао та його нові союзники швидко скористалися цим моментом, щоб проголосити республіку, при цьому Рао був приведений до присяги як президент, а лідер КПІ П. Крішна Піллаї — як новий Діван. Сама Рада Принців також була розпущена, хоча переговори між Принцами та урядом дозволили подальше існування їхніх штатів як федеративних складових, хоча з дещо меншими повноваженнями, ніж раніше.\n\nХоча ситуація, здавалося б, швидко стабілізувалася з падінням Нізама, мало хто може насправді сказати, яке майбутнє чекає на нову республіку, і багато принців все ще побоюються, що їхні дні полічені, якщо комуністи отримають достатній вплив. А поки що більшість людей просто щасливі позбутися тирана, а не відволікатися на майбутні турботи."
 princely_federation_events.349.a: "Тиранії Османа покладено край!"

 princely_federation_events.350.t: "Остаточне знищення Раджу"
 princely_federation_events.350.d: "Згідно з великою прокламацією, виданою Радою та скріпленою печаткою Нізама, як це тепер прийнято, кожна територія, що залишилася у Федерації, звичайно, за винятком Мадрасу, тепер знову перебуває в руках індійського правителя. Незалежно від того, чи це округи, звільнені від соціалістів, чи провінції, поглинені від Домініону, тепер вони були належним чином розділені та передані їхнім законним власникам. Навіть у Делі великий Дім Бабура був відновлений на троні, як визнання ролі дому Моголів у початковій війні за незалежність, яка, на жаль, призвела до їхнього вигнання Британією.\n\nРада майже одразу вирішила відзначати цей день як державне свято, вшановуючи те, що вони називають «остаточним знищенням Британського Раджу». Вперше за століття нація нарешті стала справді вільною від зовнішнього панування, і нарешті вона може стати великою державою, якою їй завжди було судилося бути."
 princely_federation_events.350.a: "Повернення до природного порядку речей."

 princely_federation_events.351.t: "Розділ Мадрасу"
 princely_federation_events.351.d: "Союз із Мадрасом завжди був суперечливим, і багато хто бажав, щоб цей невдалий пережиток британського правління був знищений і замінений, а не прийнятий так, ніби він був рівним. Однак це завжди розглядалося як необхідне зло, доки соціалісти становили активну загрозу, подібно до альянсу, який був укладений з Британським Домініоном. Як і альянс із Домініоном був відкинутий, щойно соціалісти були розгромлені, так само має бути відкинутий і альянс з їхнім тамільським нащадком.\n\nЦього ранку Рада видала нову прокламацію, щоб нарешті розв'язати цей невирішений вузол. Стверджуючи, що їхні дії необхідні для завершення незалежності нації від Британії, Рада наказала розпустити автономію Мадрасу, а його землі мають бути розділені між принцами. Єдиним винятком із цього розділу наразі є саме місто Мадрас, щодо якого ще не прийнято рішення про те, хто його отримає. Протести в Мадрасі проти цієї дії були швидко придушені федеральними військами, і хоча уряд Мадрасу рішуче заперечував проти цієї дії, ніхто ще не наважився перетворити свої слова на дії."
 princely_federation_events.351.a: "Помилку нарешті виправлено."

 princely_federation_events.352.t: "Перша сесія Палати Принців"
 princely_federation_events.352.d: "Після прийняття акта Ради, скріпленого печаткою Османа, як це тепер норма, те, що колись було Палатою Принців, тепер було повністю реформовано у належну законодавчу асамблею. Нова Палата Принців була сьогодні урочисто відкрита самим Діваном, а Осман сидів осторонь, поки це відбувалося. Будучи першою сесією, все, звичайно, почалося досить важко, оскільки багато принців все ще намагалися зрозуміти, що саме означатиме для них нова ситуація. Проте, навіть якщо вони ще не до кінця це розуміли, загальний настрій у Палаті був досить позитивним, і багато старших членів були раді нарешті стати частиною індійської нації, яка справді поважає їхню роль, на відміну від минулих днів британського правління."
 princely_federation_events.352.a: "Слухаємо, слухаємо!"

 princely_federation_events.170.t: "Князівська Індія бажає приєднатися до [Root.GetFactionName]"
 princely_federation_events.170.d.japan: "Національний уряд у Гайдарабаді нещодавно об'єднав держави-наступниці субконтиненту. Новий індійський уряд висловив бажання приєднатися до нашого альянсу та допомогти подальшому пробудженню народів Азії.\n\nЯка думка Імператорського кабінету?"
 princely_federation_events.170.d.germany: "Національний уряд у Гайдарабаді нещодавно об'єднав держави-наступниці субконтиненту. Новий індійський уряд висловив бажання приєднатися до Системи Райхспакту та продовжувати боротьбу з синдикалізмом в Азії.\n\nОднак очікується, що індійці вимагатимуть поступок щодо наших колоній на субконтиненті."
 princely_federation_events.170.d.russia: "Національний уряд у Гайдарабаді нещодавно об'єднав держави-наступниці субконтиненту. Новий індійський уряд висловив бажання приєднатися до нашого альянсу, щоб сприяти подальшій стабільності та національній гармонії по всій Євразії.\n\nЗ таким альянсом сипай та козак, безсумнівно, домінуватимуть на континенті!"
 princely_federation_events.170.a: "Звичайно, ми вітаємо їхній союз!"
 princely_federation_events.170.b: "Ні, я так не думаю."

 princely_federation_events.171.t: "Князівська Індія приєднується до [From.GetFactionName]"
 princely_federation_events.171.d.japan: "[FROM.GetNameDefCap] прийняв нашу пропозицію забезпечити Азію для місцевих націй та дозволив нам приєднатися до [From.GetFactionName]!"
 princely_federation_events.171.d.germany: "Німці раді бачити, що ми приєднуємося до спільної справи знищення злих синдикалістів. Тепер ми є частиною [From.GetFactionName]!"
 princely_federation_events.171.d.russia: "Росіяни прийняли нашу пропозицію! Сьогодні народився новий глобальний альянс, який визначить долю світу!"
 princely_federation_events.171.a: "Чудово!"

