### Інтеграція контенту Аньціна
 QIE_integrating_province: "Інтеграція провінції"

 QIE_anqing_cooperation0: "Співпраця з Аньціном"
 QIE_anqing_cooperation1: "$QIE_anqing_cooperation0$"
 QIE_anqing_cooperation2: "$QIE_anqing_cooperation0$"
 QIE_anqing_cooperation3: "$QIE_anqing_cooperation0$"
 QIE_anqing_cooperation4: "$QIE_anqing_cooperation0$"
 QIE_anqing_cooperation5: "$QIE_anqing_cooperation0$"
 QIE_anqing_cooperation6: "$QIE_anqing_cooperation0$"
 QIE_anqing_cooperation0_desc: "Відповідно до ідеалу єдиного Китаю, ми тісно співпрацюємо з Аньцінською клікою на півдні. Завдяки цій взаємодії ми отримуємо чимало переваг, як-от глибша фінансова інтеграція, взаємна торгівля та надійний союзник, що слугує буфером на наших кордонах. Можливо, нарешті розкол між північними та південними чжилійцями буде подолано назавжди?\n(Цей модифікатор прив'язаний до популярності ринково-ліберальної партії в Аньцінській кліці)"
 QIE_anqing_cooperation1_desc: "$QIE_anqing_cooperation0_desc$"
 QIE_anqing_cooperation2_desc: "$QIE_anqing_cooperation0_desc$"
 QIE_anqing_cooperation3_desc: "$QIE_anqing_cooperation0_desc$"
 QIE_anqing_cooperation4_desc: "$QIE_anqing_cooperation0_desc$"
 QIE_anqing_cooperation5_desc: "$QIE_anqing_cooperation0_desc$"
 QIE_anqing_cooperation6_desc: "$QIE_anqing_cooperation0_desc$"

 QIE_anqing_training: "Вишкіл аньцінської армії"
 QIE_anqing_training_desc: "Аньцінська армія нещодавно брала участь у бойових діях і має чималий досвід, яким може поділитися. Водночас передові методи командування, тактика та сучасне спорядження центральної армії стануть у пригоді Аньціну. Допомога у тренуванні їхніх військ сприяє інтеграції та військовій співпраці, хоча це й дещо відволікає ресурси від наших власних зусиль."

 QIE_anqing_loans: "Позики Аньціну"
 QIE_anqing_loans_desc: "Використовуючи банківські зв'язки Ван Кеміня, ми домовилися про масштабні інвестиції та кредити для нової ліги на півдні. На жаль, підтримання цієї угоди вимагає значних ресурсів, проте Чень Тяоюань безмежно вдячний за це президенту та маршалам."

 QIE_anqing_reconstruction_aid: "Допомога у відбудові Аньціна"
 QIE_anqing_reconstruction_aid_desc: "Аньцін серйозно постраждав під час війни ліги. Ми прийшли їм на допомогу і надаємо додаткову підтримку у відновленні зруйнованих регіонів."

 QIE_projects_decisions_category: "Внутрішні проєкти"
 QIE_canal_dikes_anqing: "Канали та дамби"
 QIE_canal_dikes_anqing_desc: "Будівництво каналів та дамб у регіонах Чжилі, Кайфен та Беньбу (останній під контролем Нанкіна) дозволить нам посилити вплив на південну частину країни через торговельні потоки. Одночасно ми модернізуємо інфраструктуру та іригацію в сільській місцевості, що забезпечить нам підтримку селянства."

 QIE_develop_wuchang: "Розвиток Учана"
 QIE_develop_wuchang_desc: "У межах спільних зусиль із клікою Аньцін ми маємо можливість інвестувати безпосередньо в район Учан-Аньцін на прохання губернатора Сяо Яонаня. Зміцнення нашого другого індустріального центру в глибині країни забезпечить не лише економічне зростання, а й стратегічну глибину."

 QIE_anqing_diplomacy_decisions_category: "Дипломатія з Аньціном"
 QIE_anqing_diplomacy_decisions_category_desc: "Кліка Аньцін завдячує нам своєю перемогою над Нанкіном. Успадкувавши роль «південних чжилійців», вони пов'язані з нами не лише кулуарними угодами, а й політично. Вони визнають наш національний уряд і підтримують ідею якнайшвидшого об'єднання Китаю. Ми маємо втілити цю мрію в життя.\n\n§gПоточний §Yвплив Цін§!:§! [?ANQ.party_popularity@market_liberal|%1H] §Y(Популярність ринкових лібералів в Аньціні)§!"

 QIE_anq_visit_nanjing: "Візит Пуї на Південь"
 QIE_anq_visit_nanjing_desc: "Тепер, коли Чень Тяоюань закріпився в Нанкіні, а ми маємо значний вплив на його уряд, настав час нагадати йому, хто смикає за мотузки. Відправмо імператора та маршала Ван Чженбіня з дипломатичним візитом. Це підніме популярність Пуї серед південців, а маршал Ван слугуватиме гарантією нашої волі."

 QIE_anq_wu_and_chen_decision: "Подолання розколу між Північчю та Півднем"
 QIE_anq_wu_and_chen_decision_desc: "Відтоді як у 1920-х роках піднялася південна чжилійська кліка Сунь Чуаньфана, відносини між Північчю та Півднем були напруженими. Це мікрокосм загальнокитайського розколу. Проте Чень Тяоюань був поставлений нами, і це шанс остаточно залагодити старі чвари. Відправивши президента Цао та маршала У до Нанкіна, ми продемонструємо щирість наших намірів."

 QIE_anq_organise_intellectual_meeting: "Організувати зустріч інтелектуалів"
 QIE_anq_organise_intellectual_meeting_desc: "Пекінська рада зв'язку пропонує провести великий з'їзд націоналістичної інтелігенції в Нанкіні. Це покаже народу, що об'єднання вже близько, а ми — справжні друзі інтелектуалів. Крім того, це змусить інших воєначальників, що вагаються, відчути терміновість змін. Чень Тяоюань має бути особливо чутливим до таких настроїв."

 QIE_anq_counter_message: "Поширити контрповідомлення"
 QIE_anq_counter_message_desc: "Підступний Чень Тяоюань намагається підірвати наш авторитет, поширюючи брехню! Це відчайдушна спроба втримати владу: він почав переконувати людей, що автономія мілітаристів важливіша за національну єдність. Дурень не розуміє серйозності ситуації. Президент Цао вже наказав підготувати відповідь та закрити видавництва Ченя."

 QIE_anq_send_delegation: "Офіційні переговори з Аньціном"
 QIE_anq_send_delegation_desc: "Добре знаючи силу громадської думки, чжилійська кліка прийшла до влади на хвилі народної підтримки. Оскільки довіра до південного режиму падає, час нагадати про вдячність маршалу Ченю. Міністр Ґао Лінвей пропонує провести велику конференцію в Нанкіні для обговорення майбутніх відносин."

 QIE_reach_out_to_anqing_before: "Звернутися до [ANQ.GetNameWithFlag]"
 QIE_reach_out_to_anqing_before_desc: "Аньцін пам'ятає нашу допомогу у війні проти Нанкіна. Перед загрозою війни з Японією радники маршала У пропонують офіційно запросити їх до нашого військового альянсу. Скріпивши союз паперами, ми назавжди пов'яжемо їхню долю з нашою, і вони це чудово розуміють."

 QIE_reach_out_to_anqing_during: "Звернутися до [ANQ.GetNameWithFlag]"
 QIE_reach_out_to_anqing_during_desc: "Гармати гримлять, і наша держава знову входить у траншеї! Наші люди гинуть на фронті, поки маршал Чень байдикує в Нанкіні. Час дипломатичних ігор минув — ця битва вирішує долю всього Китаю. Ми маємо негайно вимагати від них військової допомоги."

 QIE_reach_out_to_anqing_after: "Звернутися до [ANQ.GetNameWithFlag]"
 QIE_reach_out_to_anqing_after_desc: "Яка несподіванка! Нефритовий маршал та президент Цао перемогли у війні без допомоги маршала Ченя. Тепер цей щур має скоритися. Оскільки ми є беззаперечною центральною владою, вотчина Ченя має стати частиною єдиного Китаю. Ми відправляємо делегацію, яка «порадить» йому зробити останній крок у нашу сферу."

 QIE_reach_out_to_anqing_after_again: "«Звернутися» до [ANQ.GetNameWithFlag]"
 QIE_reach_out_to_anqing_after_again_desc: "Цей дурний маршал знову відмовив нам. Він не розуміє, що ми не просимо. Цього разу відмова не приймається. Наші війська вже збираються на кордоні — можливо, це зробить Ченя більш поступливим? Він знає, що буде далі."

 QIE_war_goal_anqing_for_refusal_faction: "Роздавити «дурня»"
 QIE_war_goal_anqing_for_refusal_faction_desc: "Здавалося б, воєначальники мали б зрозуміти ситуацію після стількох телеграм. Але маршал Чень відхилив усі наші пропозиції. Президент Цао більше не буде грати в «доброго дідуся». Маршал У отримав повну свободу дій, аби назавжди загасити полум'я Аньціна."

 QIE_anqing_attempt_training_again: "Відновити переговори про вишкіл"
 QIE_anqing_attempt_training_again_desc: "Чень формально відхилив наші пропозиції щодо підготовки військ, боючись надмірної інтеграції. Проте комісія з армійської співпраці радить президенту спробувати ще раз. Сподіваємось, він переглянув свої пріоритети."

 QIE_anq_contact_anticoncessions_leaders: "Зв'язатися з лідерами антиконцесіоністів"
 QIE_anq_contact_anticoncessions_leaders_desc: "Антиконцесіоністи мають велику вагу в новій лізі та безпосередньо в Аньціні. Якщо ми хочемо заручитися підтримкою народу, президент Цао має зустрітися з лідерами Антиконцесійної ліги. Щира розмова про вільний Китай може змінити все."

 QIE_integrate_anqing_before: "Об'єднання з Аньціном"
 QIE_integrate_anqing_before_desc: "Наші режими зміцніли, економічна та військова інтеграція йде повним ходом. Радники президента Цао та маршала У вважають, що настав час офіційно вимагати від Чень Тяоюаня підпорядкування центральній владі, аби вороги не розчавили нас поодинці."

 QIE_integrate_anqing_after: "Об'єднання з Аньціном"
 QIE_integrate_anqing_after_desc: "Тепер, коли вся опозиція центральному уряду розбита, у маршала Ченя немає виправдань для відмови. Ми офіційно вимагаємо повної інтеграції до складу держави."

 QIE_integrate_anqing_after_again: "Об'єднання з Аньціном"
 QIE_integrate_anqing_after_again_desc: "Час знімати рукавички та готувати кинджали. Якщо маршал ліги думає, що може плювати нам в обличчя, він помиляється. Президент Цао дає йому останній шанс: ми надсилаємо фінальну вимогу, поки солдати готуються до бою."

 QIE_anqing_works_wuchang_tt: "§YПочнуться роботи з розвитку зони Аньцін-Учан§!"
 QIE_counter_message_decision_tt: "Розблоковує £decision_icon_small §Hрішення§! про поширення контрповідомлення!"
 QIE_anqing_influence_mt_two_tt: "£anq_qieinfluence §YВплив Цін§! має бути вищим за §C20%§!."
 QIE_anqing_influence_mt_four_tt: "£anq_qieinfluence §YВплив Цін§! має бути вищим за §C30%§!."
 QIE_anqing_influence_mt_five_tt: "£anq_qieinfluence §YВплив Цін§! має бути вищим за §C35%§!."
 QIE_anqing_influence_mt_seven_tt: "£anq_qieinfluence §YВплив Цін§! має бути вищим за §C42%§!."
 QIE_anqing_influence_mt_ten_tt: "£anq_qieinfluence §YВплив Цін§! має бути вищим за §C50%§!."
 QIE_anqing_influence_lt_eight_tt: "£anq_qieinfluence §YВплив Цін§! становить менше §C42%§!."
 QIE_war_goal_anqing_after_war_tt: "§RМи зможемо оголосити їм війну після завершення поточного конфлікту!§!"
 QIE_war_goal_anqing_if_low_influence_tt: "§RЯкщо наш вплив низький, ми зможемо оголосити війну. Інакше — ми можемо запитати знову.§!"
 QIE_training_idea_when_remove_tt: "Цей дух буде видалено, коли співпраця та вишкіл завершаться."
 QIE_unlocks_try_army_cooperation_again_tt: "Розблоковує £decision_icon_small §Hрішення§! про відновлення переговорів щодо військової співпраці з Аньціном."
 QIE_anqing_cant_ask_again_tt: "§RЦе направить запит Аньціну про вступ до нашої фракції. Хоча це логічний крок, у разі відмови вони навряд чи погодяться на це знову найближчим часом!§!"
 QIE_anqing_ask_integration_warning_tt: "§RЦе направить запит Аньціну про інтеграцію. Якщо вони відмовлять зараз, переконати їх знову буде вкрай важко!§!"

 qing_foreign_policy_events.57.t: "Розвиток Учан-Аньціна"
 qing_foreign_policy_events.57.d: "Завдяки зміцненню відносин між центральним урядом та східними провінціями маршала ліги Ченя, міністерство фінансів отримало пропозицію підтримати проєкт розвитку регіону Учан-Аньцін. \n\nОскільки цей регіон є внутрішньою частиною обох наших утворень і має величезний потенціал для майбутнього промислового зростання, це природний вибір для спільного плану. Після того як попередні проєкти співпраці Півночі та Півдня зосереджувалися переважно на осі Пекін-Нанкін, нарешті з'явився прогрес у розвитку бідніших територій.\n\nЦе починання має особисту підтримку губернатора Сяо Яонаня та маршала ліги Ченя, які, безперечно, розраховують на щедрі відкати."
 qing_foreign_policy_events.57.a: "Нехай Ван натисне на важелі та змусить Ченя інвестувати більше."
 qing_foreign_policy_events.57.b: "Інвестуємо самостійно."

 qing_foreign_policy_events.58.t: "Нові офіси для пекінської ради зв'язку"
 qing_foreign_policy_events.58.d: "Кліка Аньцін за нашої підтримки здобула перемогу. Ми заснували пекінську раду зв'язку як наше офіційне представництво в новій столиці ліги — Нанкіні. Укомплектована бюрократами фракції Цзіньбао Цао Куня, рада працюватиме над майбутнім об'єднанням ліги Чень Тяоюаня з центральним урядом.\n\nКрім того, вони служать нашими «очима» на політичному полі бою півдня. Проте, як і належить чванливим чиновникам, вони вже почали скаржитися кабінету на відсутність розкішного офісу, наполягаючи на необхідності «демонструвати славу короля Баодіна та його нефритового маршала» мешканцям ліги."
 qing_foreign_policy_events.58.a: "Ви, мабуть, жартуєте."
 qing_foreign_policy_events.58.b: "Гаразд, виділіть кошти."

 qing_foreign_policy_events.60.t: "Аньцін відмовляється від особливих умов"
 qing_foreign_policy_events.60.d: "Пекінська рада зв'язку докладає зусиль, аби полегшити чжилійським підприємствам ведення бізнесу на півдні. Проте шрами, залишені кошмаром Сунь Чуаньфана, глибокі та вічні. Навіть після реформ Ченя ліга залишається бюрократичним пеклом, тож наші спроби заповнити ринки північними товарами стикаються з труднощами.\n\nКоли рада попросила маршала Ченя надати центральному уряду повноваження в управлінні внутрішньою бюрократією ліги, він відповів відмовою, назвавши це «неприйнятним на даний момент». Яке зухвальство для дрібного мілітариста — відмовляти президенту та його маршалам? Нехай президент Цао дасть йому зрозуміти: він не просив, він вимагав."
 qing_foreign_policy_events.60.a: "Нахабна людина, надіслати телеграму."

 qing_foreign_policy_events.61.t: "Аньцін все ще відмовляється"
 qing_foreign_policy_events.61.d: "Неймовірно, але зухвалість Чень Тяоюаня не має меж. Здається, «дурний» генерал знову вирішив піти ва-банк, відхиливши наші вимоги щодо посилення державного нагляду. Поки маршал Ван Чженбінь та генерал Цай Ченсюнь вимагають негайного наступу, президент Цао та нефритовий маршал обрали інший шлях відплати.\n\nЧерез раду зв'язку та наші зв'язки в ділових колах ми ініціювали блокаду компаній із територій ліги. Ми діяли обережно, аби не зашкодити власній економіці, але успішно затягнули зашморг на шиї Ченя. Це підірве його управління і стане вічним нагадуванням про справжні можливості короля Баодіна."
 qing_foreign_policy_events.61.a: "За маскою доброзичливого дідуся ховається підступний геній."

 qing_foreign_policy_events.62.t: "Імператор Пуї отримує теплий прийом у Нанкіні"
 qing_foreign_policy_events.62.d: "Використовуваний переважно для церемоніальних зустрічей, імператор за дорученням президента вирушив до південної столиці — Нанкіна. Ця поїздка замислювалася як медійна акція, що демонструє єдність уряду та його союзників. Поки Пуї мав лише посміхатися та махати рукою, справжнім мозком дипломатичної місії був маршал Ван.\n\nМаршал та імператор отримали надзвичайно теплий прийом; мешканці провінцій Аньхой та Чжецзян вітали їх квітами та вигуками. Кажуть, Пуї був настільки в захваті, що навіть запитав Ченя про можливість реставрації зруйнованого мінського палацу в місті. Хоча цього не було в сценарії, це додало події легітимності, а Чень запевнив, що негайно візьметься за відновлення."
 qing_foreign_policy_events.62.a: "Можливо, він не такий вже й поганий."

 qing_foreign_policy_events.63.t: "Пуї шокований протестами в Нанкіні"
 qing_foreign_policy_events.63.d: "Імператор прибув до Нанкіна для зустрічі з маршалом Ченєм, аби продемонструвати підтримку «доброго врядування». Проте, коли він та маршал Ван Чженбінь вийшли з транспорту, вони зіткнулися з жорстокою реальністю. Вулиці були заповнені протестувальниками з люттю на обличчях. \n\nДля маршала Вана, який намагався заспокоїти тремтячого імператора, було очевидно: або Чень не контролює ситуацію у власній столиці, або йому просто байдуже. Обидва сценарії є скандальними. Пекінська рада зв'язку отримала наказ від президента Цао забезпечити, аби Чень заплатив за це приниження."
 qing_foreign_policy_events.63.a: "Жахлива поведінка цього неотеси!"

 qing_foreign_policy_events.64.t: "Чень погоджується з інтелектуалами"
 qing_foreign_policy_events.64.d: "Зустріч інтелігенції, організована в Нанкіні пекінською радою зв'язку, мала великий успіх! Інтелектуали обох міст під егідою чжилійців обговорили питання антиконцесіоністського руху. Подія пройшла настільки вдало, що сам маршал Чень Тяоюань оголосив, що повністю поділяє їхні погляди та зробить усе можливе для прискорення вигнання іноземців. Сподіваємось, він не бреше."
 qing_foreign_policy_events.64.a: "Справжній вчений-маршал!"

 qing_foreign_policy_events.65.t: "Чень наголошує на своїй автономії"
 qing_foreign_policy_events.65.d: "Нещодавно в Нанкіні відбулася зустріч відомих китайських інтелектуалів. Після запеклих дискусій усі дійшли єдиного висновку: Китай має негайно об'єднатися. Однак Чень Тяоюань виступив проти такої терміновості. Замість цього він заявив, що місцева автономія важливіша за уніфікацію. Його слова фактично означають відмову визнавати Пекін єдиним національним урядом! Помічники президента Цао вже готують відповідь, а маршал У, як кажуть, розлючений цією зрадою."
 qing_foreign_policy_events.65.a: "«Бай, підготуй для мене послання, добре?»"

 qing_foreign_policy_events.66.t: "Чжилійці просять про допомогу"
 qing_foreign_policy_events.66.d: "Напруженість на півночі зростає; сутички в Шаньхайґуані свідчать про те, що фентянська кліка розпочинає війну за «національне відвоювання». Боючись удару в тил із півдня, ми отримали низку телеграм від президента Цао та кабінету міністрів із вимогою виступити на їхньому боці.\n\nВони допомогли нам перемогти у війні ліги, але чи варто вмирати за Цао Куня та У Пейфу? Частина штабу вважає, що краще залишитися осторонь — так ми збережемо свою владу, незалежно від того, хто переможе: Фентянь чи Пекін."
 qing_foreign_policy_events.66.a: "Підготувати відповідь маршалу У! Ми б'ємося на вашому боці!"
 qing_foreign_policy_events.66.b: "Це не варте навіть відповіді."

 qing_foreign_policy_events.67.t: "Чжилійці в біді?"
 qing_foreign_policy_events.67.d: "Центральний уряд опинився під ударом зовнішніх сил. Поки маршал У командує військами на фронті, президент Цао та маршал Ван Чженбінь наполягають на негайному втручанні маршала Ченя. \n\nСитуація критична, і вони вже не просять, а вимагають нашої допомоги. Чи повинні ми втягувати лігу в тотальну війну заради пекінських лідерів? Можливо, нейтралітет дозволить нам вижити при будь-якому господарі Пекіна."
 qing_foreign_policy_events.67.a: "Підготувати відповідь маршалу У! Ми б'ємося на вашому боці!"
 qing_foreign_policy_events.67.b: "Це не варте навіть відповіді."

 qing_foreign_policy_events.68.t: "Чжилійці висувають вимоги"
 qing_foreign_policy_events.68.d: "Здається, наші дії нарешті мають наслідки. Ми ігнорували телеграми, відсилали пекінських клерків та відмовлялися від зустрічей із лідерами центру. Тепер, здобувши перемогу в черговому конфлікті, нефритовий маршал та король Баодіна знову міцно тримають владу над нацією.\n\nЗ Пекіна надійшло суворе послання, диктоване особисто маршалом У. Він вимагає від нашого уряду негайно розпочати переговори про повне підпорядкування центральній владі. Окрилені перемогою, вони без вагань знищать нас у разі відмови. Наші прикордонники вже повідомляють про скупчення військ маршала Вана. Годинник цокає..."
 qing_foreign_policy_events.68.a: "Тікати нікуди, чи не так?"
 qing_foreign_policy_events.68.b: "І це тепер? Це не варте навіть відповіді."

 qing_foreign_policy_events.69.t: "Чень відмовляється від альянсу"
 qing_foreign_policy_events.69.d1: "Цей клятий дурень Чень Тяоюань відхилив нашу офіційну пропозицію про союз між північною та південною чжилійськими кліками. Знову південь вислизає від нас, уникаючи допомоги попри все, що ми для них зробили. Маршали У та Ван розлючені, але президент Цао закликає до терпіння. Можливо, скоро настане момент, коли Чень змінить свою думку. Інакше — військове втручання стане неминучим."
 qing_foreign_policy_events.69.d2: "Чень Тяоюань знову відмовив нам у союзі. Поки триває війна, ми можемо лише вивергати прокляття, але після нашої перемоги правила гри зміняться. Ченю краще готувати аргументи, якщо він хоче й надалі правити в Нанкіні."
 qing_foreign_policy_events.69.d3: "Який же він дурень. Відмовити нам один раз — сором нам. Відмовити вдруге, коли ми на піку могутності? Він — лише сходинка на шляху до об'єднання. Наші війська збираються, рада зв'язку тікає до Уханя; обом сторонам зрозуміло, що війна на порозі. Війна, яку ми не можемо програти."
 qing_foreign_policy_events.69.a: "Він за це заплатить."

 qing_foreign_policy_events.70.t: "Співпраця по каналах Аньціна"
 qing_foreign_policy_events.70.d: "Пекінська рада зв'язку знову довела свою корисність. Амбітний Чень завершив будівництво величезного Субейського каналу. Тепер ми можемо залучити фахівців ліги для роботи над аналогічними інфраструктурними проєктами в провінції Чжилі та Кайфені. Роботи можуть розпочатися, щойно президент дасть згоду."
 qing_foreign_policy_events.70.a: "Фантастична можливість!"

 qing_foreign_policy_events.71.t: "Армійська співпраця з Аньціном"
 qing_foreign_policy_events.71.d: "Після формального вступу Аньціна до нашої сфери впливу, кабінет розробив план інтеграції армій Півночі та Півдня. Це включає спільні навчання та обмін досвідом. Створено комісію з армійської співпраці.\n\nТепер нам належить вирішити: чи варто витрачати ресурси на покращення південних армій, які все ще використовують застарілу зброю та тактику? Для них вигода очевидна — посилення обороноздатності. Для нас — отримання беззаперечного впливу на їхнє військо та адміністрацію."
 qing_foreign_policy_events.71.a: "Звісно, ми допоможемо!"
 qing_foreign_policy_events.71.b: "Нехай справляються самі."

 qing_foreign_policy_events.72.t: "Аньцін відмовляється від подальшої армійської співпраці"
 qing_foreign_policy_events.72.d: "Досить дивно, але уряд маршала Ченя відхилив нашу пропозицію щодо військової співпраці. Можливо, він тримає нас за дурнів або має власні таємні плани. Офіційне повідомлення було вкрай лаконічним. Проте оптимісти в уряді сподіваються, що Чень зрозуміє: без цієї співпраці неможливо збудувати міцну оборону проти спільних ворогів. Ми вже готуємо нову пропозицію."
 qing_foreign_policy_events.72.a: "Що ж, тримайте свої секрети при собі."

 qing_foreign_policy_events.73.t: "Армійська співпраця завершена"
 qing_foreign_policy_events.73.d: "Співпраця між нашими маршалами та офіцерами ліги виявилася успішною! Наші солдати стали взірцем для наслідування. Моральний дух та організація південної армії значно зросли, а маршал У особисто впровадив реформи у їхню військову ієрархію. Маршали Ван та У доповіли президенту Цао, що повністю задоволені результатами."
 qing_foreign_policy_events.73.a: "Вибачте, вони використовували мечі? Мечі? Мечі."

 qing_foreign_policy_events.74.t: "Аньцін відмовляється від конференції з національного об'єднання"
 qing_foreign_policy_events.74.d: "Маршал Чень повідомив пекінську асамблею, що не братиме участі в національній конференції для обговорення майбутнього країни. Це обурливий крок, який межує з державною зрадою. Хоча це не зовсім несподівано, враховуючи репутацію Ченя як людини, що ставить власні інтереси понад усе. Наші стосунки з ним остаточно зіпсовані; тепер ми можемо лише намагатися втримати лігу в нашій сфері силоміць."
 qing_foreign_policy_events.74.a: "Що він задумав?"

 qing_foreign_policy_events.75.t: "Завершення конференції з національного об'єднання"
 qing_foreign_policy_events.75.d1: "Конференція з лігою південних чжилійців стала тріумфом! Маршал Чень поводився вкрай шанобливо і майже повністю визнав нашу владу. Він погодився на подальшу інтеграцію та повернення виборів на свої території. Цей момент увійде в історію як початок остаточного злиття Півночі та Півдня."
 qing_foreign_policy_events.75.d2: "Конференція мала помірний успіх. Маршал Чень прийняв більшість наших вимог, погодився на інтеграцію та вибори, але зупинився за крок до повного допуску центральної влади на свої землі. Хоча це декого розчарувало, це найкраще, чого ми могли очікувати від такої непередбачуваної людини."
 qing_foreign_policy_events.75.d3: "Конференція обернулася політичною катастрофою! Делегація ліги категорично відмовилася від подальших переговорів про інтеграцію. Кабінет приголомшений — ми були так близько до того, щоб залучити Ченя на свій бік."
 qing_foreign_policy_events.75.a: "Хай живе китайська нація!"
 qing_foreign_policy_events.75.b: "Що ми взагалі зробили не так?"

 qing_foreign_policy_events.76.t: "Далу іньхан та ліга"
 qing_foreign_policy_events.76.d: "«Далу іньхан» (Континентальний банк) — один із найбільших банків півночі. Завдяки зв'язкам міністра Ван Кеміня він почав активно інвестувати в провінції ліги. Ми можемо використати цю можливість для посилення нашого впливу, призначаючи на проєкти пекінських клерків. \n\nМи можемо запропонувати додаткові кредити, що виснажить наші ресурси, але викличе вдячність, або дозволити лізі виплачувати борги на пільгових умовах. Звісно, ми завжди можемо просто зосередитися на інших справах, припинивши ігри з ненадійним маршалом ліги."
 qing_foreign_policy_events.76.a: "Зателефонуйте міністру Вану, підключіть інші банки."
 qing_foreign_policy_events.76.b: "Давайте підтримаємо «Далу іньхан»."
 qing_foreign_policy_events.76.c: "Що він зробив, аби заслужити нашу любов?"

 qing_foreign_policy_events.77.t: "Ліга відповідає на нашу пропозицію"
 qing_foreign_policy_events.77.d1: "Чень Тяоюань потрапив прямо в наші руки. Він із радістю прийняв пропозицію про позику і погодився на подальшу інтеграцію — це перевершило наші найсміливіші сподівання! Завдяки кулуарним домовленостям об'єднаний Китай стає реальністю."
 qing_foreign_policy_events.77.d2: "Ліга грубо відхилила нашу надзвичайно щедру пропозицію, назвавши кредити «хижацькими». Чень знову перешкоджає нашим зусиллям. Очевидно, його власна влада для нього важливіша за добробут нації."
 qing_foreign_policy_events.77.a: "Навіть краще, ніж ми сподівалися!"
 qing_foreign_policy_events.77.b: "Ви спалюєте мости, маршале Чень."

 qing_foreign_policy_events.78.t: "Маршал У зустрічається з антиконцесіоністами ліги"
 qing_foreign_policy_events.78.d: "Аби заручитися підтримкою в лізі без участі Ченя, маршал У та президент Цао зустрілися з лідерами Антиконцесійної ліги. Ця організація розділена на республіканське крило, близьке до «Вермільйонового товариства», та монархічне крило, яке вважає об'єднання пріоритетом. \n\nМаршал У відверто зізнався їм: чжилійці теж є переконаними республіканцями. Співпраця з монархією — це лише засіб досягнення мети, шлях до серця як республіканської більшості, так і монархічної меншості. Маршал Ван додав, що реставрація 1928 року була потрібна лише для отримання німецької допомоги. Делегати були зворушені щирістю маршалів та визнали їхній авторитет."
 qing_foreign_policy_events.78.a: "За зачиненими дверима відкриваються таємниці."

 qing_foreign_policy_events.79.t: "Допомога у відбудові ліги"
 qing_foreign_policy_events.79.d: "Погодившись на спільну відбудову, ліга дозволила пекінським інженерам та бізнесменам керувати операціями. Ми відновлюємо міста та села, роблячи східні провінції сильнішими. Деякі міністри пропонують вивести цю допомогу на національний рівень. \n\nОднак міністр Ґао Лінвей закликає до обережності: це може виснажити наші власні ресурси. Він вважає, що поточні зусилля — це максимум того, що ми можемо собі дозволити зараз."
 qing_foreign_policy_events.79.a: "Ми зобов'язані допомогти нашим співвітчизникам!"
 qing_foreign_policy_events.79.b: "Ґао правий, ресурси слід використовувати ощадливо."

 qing_foreign_policy_events.80.t: "Пекін вимагає інтеграції!"
 qing_foreign_policy_events.80.d: "Центральний уряд надіслав до Нанкіна список вимог, які фактично скасовують нашу автономію та підпорядковують нас пекінським законам. Це сміливий крок до стабільності та захисту від імперіалізму Японії та Заходу. Для втомленого війною народу це надія на краще майбутнє.\n\nПроте це означає втрату домінування кліки Аньцін. Чень має вирішити: чи варті переваги національної єдності втрати особистої влади? Будь-яке рішення змінить політичний ландшафт Китаю."
 qing_foreign_policy_events.80.a: "Я хочу, щоб мене пам'ятали як національного героя!"
 qing_foreign_policy_events.80.b: "Відмовити, наша автономія священна!"

 qing_foreign_policy_events.81.t: "Східний Китай об'єднано!"
 qing_foreign_policy_events.81.d: "Маршал Чень Тяоюань офіційно прийняв наш запит на інтеграцію. Його вітають як героя, що поклав край епосі роздробленості. Президент пообіцяв, що процес буде максимально плавним, а Чень та його штаб збережуть свої посади в центральній армії. Цей жест стане прикладом для інших регіональних лідерів."
 qing_foreign_policy_events.81.a: "Запросіть великого маршала Ченя до мого кабінету!"

 qing_foreign_policy_events.82.t: "Чень Тяоюань відмовляється!"
 qing_foreign_policy_events.82.d: "Маршал Чень офіційно відхилив наш запит. Це удар по зусиллях з об'єднання країни. Маршал Ван та генерал Цай вимагають військової відповіді. Президент натомість знову наголосив на важливості єдності перед обличчям японської загрози. Але без підтримки Ченя нація залишається вразливою."
 qing_foreign_policy_events.82.a: "Залишитися осторонь у боротьбі за виживання нації?"

 qing_foreign_policy_events.83.t: "Пекін вимагає інтеграції!"
 qing_foreign_policy_events.83.d: "Центральний уряд знову посилив тиск на Нанкін, вимагаючи повної інтеграції. Після перемоги над Японією Пекін не терпітиме автономії мілітаристів. Це шанс на процвітання, але ціною самостійності Аньціна. Чи переважать вигоди об'єднання втрату локального впливу?"
 qing_foreign_policy_events.83.a: "Я хочу, щоб мене пам'ятали як національного героя!"
 qing_foreign_policy_events.83.b: "Відмовити, наша автономія священна!"

 qing_foreign_policy_events.84.t: "Чень Тяоюань відмовляється!"
 qing_foreign_policy_events.84.d: "Чень знову відповів відмовою. Президент намагається переконати його, наголошуючи на патріотизмі та пропонуючи прощення за попередні образи. Проте терпіння півночі добігає кінця..."
 qing_foreign_policy_events.84.a: "Ченю, ти помилково приймаєш нашу стриманість за слабкість."

 qing_foreign_policy_events.85.t: "Чень Тяоюань знову відмовив!"
 qing_foreign_policy_events.85.d: "Друга відмова Ченя змусила нас діяти. Маршали У Пейфу та Ван Чженбінь оголосили про початок військової операції з «відновлення національної єдності». Чень офіційно оголошений зрадником нації. Президент пообіцяв швидко нейтралізувати загрозу, давши чіткий сигнал усім іншим мілітаристам: ера роздробленості закінчилася."
 qing_foreign_policy_events.85.a: "Дурна людина, що обрала дурну смерть."

### Opinion Modifiers ###
 QIE_helped_during_LEP_war: "Підтримка під час розпаду ліги"

###- Війна на Центральних рівнинах -###

 QIE_fear_fengtian: "§RФентянь помітить, якщо кордон не буде добре захищений.§!"

 QIE_eyes_on_the_border: "Очі на кордоні"
 QIE_eyes_on_the_border_desc: "Поки на кордоні з Шаньсі спалахує відкрита війна, наші суперники в Шеньяні жадібно дивляться на Імперське місто. Якщо ми не зможемо втримати кордон, вони неодмінно кинуть виклик нашому хиткому пануванню."

 QIE_fangs_on_the_border: "Ікла на кордоні"
 QIE_fangs_on_the_border_desc: "На фентянському кордоні спалахують сутички між цивільними та біженцями, що тікають від репресій. Фентянські військові пости почали реагувати на ці заворушення. Без наших військ на місці вони побачать слабкість нашої оборони та завдадуть удару."

 QIE_SHX_intervention: "Війна на Центральних рівнинах"

 QIE_SHX_intervention_tooltip: "Поки ми намагаємося закріпити позиції на заході, у нас буде §Rобмежений час§!, аби досягти успіху в боротьбі з Фен Юйсяном, перш ніж його позиції стануть занадто міцними."

###- Модифікатори -###
### Рівень Пекінської комісії ###
 QIE_german_influence_dynamic_modifier: "Рівень впливу Пекінської комісії"
 QIE_german_influence_dynamic_modifier_desc: "Пекінська комісія — головний інструмент Німеччини для контролю над територіями Пекіна. Вона укомплектована бюрократами, колоніальними офіцерами та представниками корпорацій Krupp, Siemens та інших. Вони є прямим підрозділом Ост-Азійської адміністрації в Китаї.\n\nОкрім дипломатії, вони безпосередньо впливають на законотворчість асамблеї через фінансування Ліги процвітання — лобістської групи, що просуває німецькі промислові методи та вільну торгівлю. Вони є головними прибічниками німецько-китайських «особливих відносин»."

### Динамічні модифікатори штатів ###
 QIE_hubei_generals_dynamic_modifier: "Хубейські генерали"
 QIE_hubei_generals_dynamic_modifier_desc: "Організований Ха Ханьчжаном, «Корпус хубейських генералів» контролює економіку Уханя та інші сектори. Співпраця з губернатором Сяо Яонанем та командувачем Ду Сіцзюнем зміцнює контроль чжилійців у Хубеї, хоча фактично це легітимізація промислового картелю."

 QIE_beiyang_patronage_dynamic_modifier: "Бейянський патронаж"
 QIE_beiyang_patronage_dynamic_modifier_desc: "Завдяки нашим зв'язкам серед пекінської еліти та по всьому світу ми перетворимо [QIE.Capital.GetCapitalVictoryPointName] на культурну столицю світу! Справжнє відродження китайської культури через мистецтво, політику та праці найвидатніших умів!"

### Вплив Іґуаньдао ###
 QIE_yiguandao_influence_dynamic_modifier: "Рівень впливу Іґуаньдао\n§gПісля допомоги Чжан Тяньжаня у поваленні чжилійського режиму, ця езотерична релігія почала проникати в усі сфери державного управління. Хоча вони надають корисні бонуси, надмірні поступки їм можуть зробити їхній вплив небезпечним.\n\n(Цей модифікатор прив'язаний до популярності партії націонал-популістів.)§!\n\nОновлюється кожні 24 години"

