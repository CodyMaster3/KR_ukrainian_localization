###- Opening Events -###

 qing_domestic_events.4.t: "Звіт Міністерства внутрішніх справ"
 qing_domestic_events.4.d: "Міністерство внутрішніх справ під керівництвом Ґао Лінвея очолило ініціативу президента Цао зі збору провінційних податкових зобов'язань, які довгий час ігнорувалися регіонами. Вважалося, що це просте завдання не створить проблем, адже губернатори присягали на вірність Пекіну. \n\nОднак міністр Ґао повідомив, що хоча більшість регіонів погодилася прийняти податківців, ми отримали рішучу відмову від губернатора Яна в Сіньцзяні, маршала ліги Сунь Чуаньфана, губернатора [SHD.GetLeader] та, що найбільш дивно, від «південного блоку» губернаторів: Чжао Хенці, Лу Юйґуана та Тана Цзіяо. Бай Цзяньву, речник «нефритового маршала», повідомив, що південці сформували блок «офіційної непокори», вимагаючи справжнього повернення до китайської демократії, вільної від диктату мілітаристів."
 qing_domestic_events.4.a: "Що вони задумали?!"

 qing_domestic_events.5.t: "Відлуння Чорного понеділка"
 qing_domestic_events.5.d: "Китайська економіка, тісно переплетена з німецькою потугою з 1927 року, стала мимовільним заручником криз «Міттельойропи». Зі світовим економічним спадом Східна Азія не залишилася осторонь. Це стало іскрою для деградації порядку в лізі Сунь Чуаньфана та погіршення ситуації в центральному уряді. \n\nВтеча німецьких інвесторів та зростання державних витрат свідчать: важкі часи для уряду лише починаються. Попри запевнення фракції Цзіньбао, лоянська фракція маршала У перейшла у дипломатичний наступ, впевнена у своїй антиконцесіоністській позиції."
 qing_domestic_events.5.a: "Ознака майбутніх подій?"

 qing_focus_events.1.t: "Китайський Новий рік: рік щура"
 qing_focus_events.1.d: "Президент Цао Кунь зібрав асамблею для щорічної промови. У довгій і дещо розлогій доповіді він окреслив національну політику на цей Рік щура. \n\nУникаючи будь-яких згадок про імператорський двір чи монархію (аби не дратувати критиків), президент наголосив на необхідності відновлення слави китайської нації, приборкання губернаторів та досягнення рівного статусу з іноземцями. План Цао включає субсидії для легкої промисловості, податкові пільги для фермерів, що вирощують їжу замість опіуму, та посилення централізації."
 qing_focus_events.1.a: "Промова зустрінута ввічливими оплесками."

 qing_focus_events.2.t: "Надзвичайна нарада чжилійців"
 qing_focus_events.2.d: "Через крах влади в Лізі восьми провінцій (Південному Чжилі), «нефритовий маршал» скликав термінову нараду в Лояні. Присутні як його штаб, так і представники фракції Цзіньбао. Поки дехто закликає до негайної інтервенції, У Пейфу та Чжан Ціхуан радять бути обережними. \n\nКомандування розкололося: фракція Цзіньбао прагне зберегти стару структуру ліги та її концесіоністський режим, тоді як лоянці маршала У схиляються до підтримки повстання Чень Тяоюаня. Вони сподіваються, що це стане початком звільнення від іноземних імперіалістів, попри ризик нестабільності."
 qing_focus_events.2.a: "Нам треба бути обережними..."

 qing_domestic_events.18.t: "Німецькі гірничі компанії розширюють діяльність у східній Шаньсі"
 qing_domestic_events.18.d: "Регіон Шаньсі завжди був джерелом вугілля та металів. Після четвертої чжилійсько-фентянської війни ми отримали прямий контроль над вузькою смугою землі, що належала кліці Янь Сішаня. \n\nТепер надійшли новини, що німецькі компанії, які викупили там шахти, планують розширити видобуток, причому частина об'єктів заходить на територію під контролем Яня. Це неодмінно спричинить проблеми для «зразкового губернатора», оскільки селяни відчувають себе пограбованими іноземцями."
 qing_domestic_events.18.a: "Бажаємо їм успіху в бізнесі."

###- Ланцюжок подій маньчжурського перевороту -###
 qing_coup_events.1.t: "Шепіт невдоволення"
 qing_coup_events.1.d: "Рішення чжилійців не втручатися в розпад південної ліги викликало шквал обурення. За зачиненими дверима інтелектуальні кола Пекіна плекають античжилійські настрої. \n\nВідроджена китайська синдикалістська партія підбурює робітників до страйків, а прихильники товариства «Зусилля» дискредитують уряд у пресі. Сформувалася хитка коаліція: маньчжурські дворяни з партії Цзунше, ультранаціоналісти з партії «Молодий Китай», реформатори з ТРАК та деякі незадоволені генерали чжилійців, як-от Сін Шилянь. Вони почали таємно обговорювати повалення республіки та відновлення реальної влади імператора."
 qing_coup_events.1.a: "Треба за цим наглядати..."

 qing_coup_events.2.t: "Таємна зустріч"
 qing_coup_events.2.d: "У підвалі сумнівного пекінського бару зібралася дивна група людей. Замість звичних радикалів тут — змовники, віддані ідеї повалення «нефритового маршала» та короля Баодіна. \n\nТут присутні: Айсін Ґьоро Пуцзє (брат імператора), генерал Айсін Ґьоро Сіця, бізнесмен та ідеолог сільської освіти Джеймс «Джиммі» Єн, представник «молодої гвардії» ТРАК У Сяньцзи та офіцер Сін Шилянь. Розуміючи, що їхніх сил недостатньо, вони вирішили звернутися по допомогу до одного з сусідніх мілітаристів. \n\nВибір стоїть між Шаньдуном та Шаньсі. Після довгих суперечок вони обирають..."
 qing_coup_events.2.a: "Янь Сішаня в Шаньсі."
 qing_coup_events.2.b: "[SHD.GetLeader] в Шаньдуні."
 qing_coup_events.2.c: "Нам немає до кого звернутися..."

 qing_coup_events.3.t: "Запит до губернатора Яня"
 qing_coup_events.3.d: "Сьогодні вранці від кур'єра в імперському вбранні надійшов незвичайний лист. Група маньчжурських принців та реформаторів просить допомоги Янь Сішаня у поваленні маршала У Пейфу та реставрації імператора Пуї! \n\nЯнь Сішань за десятиліття правління бачив чимало таких змов, і багато з них провалилися саме в Пекіні. Підтримка цієї авантюри — величезний ризик, що зруйнує крихкий мир із центром. Але іноді сміливість — єдиний шлях до виживання. Губернатор вирішує принаймні вислухати їх."
 qing_coup_events.3.a: "Нам потрібно більше доказів, що це спрацює."
 qing_coup_events.3.b: "Відмовити. Це занадто ризиковано."

 qing_coup_events.4.t: "Запит до губернатора Цюя"
 qing_coup_events.4.d: "Змовники з Пекіна звернулися по допомогу до губернатора Цюй Їнґуана. Пропозиція зухвала: допомогти повалити чжилійську кліку. \n\nЦюй прагне стабільності та морального врядування, і цей крок може закріпити його владу в Шаньдуні та вивести на національний рівень. З іншого боку, він — ветеран-республіканець, що проливав кров під час Сіньхайської революції. Чи погодиться він підтримати монархістів задля великої гри?"
 qing_coup_events.4.a: "Повалити цих чжилійських псів!"
 qing_coup_events.4.b: "Звернутися до мене з таким? Заарештувати його!"

 qing_coup_events.5.t: "Запит до шановного вчителя Чжана"
 qing_coup_events.5.d: "Маньчжурські змовники просять допомоги у Чжан Тяньжаня, лідера культу Іґуаньдао. Їхній план — повалити У Пейфу та відновити владу династії Цін. Якою буде наша відповідь?"
 qing_coup_events.5.a: "Звісно! За славу Цін!"
 qing_coup_events.5.b: "Відмовити. Це занадто ризиковано."

 qing_coup_events.6.t: "Відповідь губернатора Яня"
 qing_coup_events.6.d: "Янь Сішань відповів у своїй манері — ввічливо, але хитро. Він натякнув, що вже має високе становище в системі У Пейфу, і йому немає сенсу ризикувати, якщо він не отримає повноти влади в разі успіху. \n\nВін вимагає доказів, що переворот — це не просто мрія розбещених аристократів. Губернатор мінливий і розрахунковий; те, що ми скажемо далі, визначить його остаточне рішення."
 qing_coup_events.6.a: "Зіграти на його амбіціях, назвавши його майбутнім «господарем Китаю»."
 qing_coup_events.6.b: "Зіграти на його страху перед нестабільністю, наголосивши на небезпеці чжилійців."

 qing_coup_events.7.t: "Змовники обіцяють владу"
 qing_coup_events.7.d: "У Пекіні зачитали відповідь Яня. Маньчжурські змовники, нібито підтримані самим імператором, розсипалися в похвалах, називаючи його героїчним лідером, здатним вигнати іноземців та поширити досвід «зразкової провінції» на весь Китай. Йому пропонують роль імперського комісара та головнокомандувача."
 qing_coup_events.7.a: "Це була приємна мрія, але не більше."
 qing_coup_events.7.b: "Коли нація кличе, ми станемо під її стяг!"

 qing_coup_events.8.t: "Змовники обіцяють стабільність"
 qing_coup_events.8.d: "Лист із Пекіна змалював картину нації в небезпеці через пияцтво Цао Куня та інтриги У Пейфу. Лист сповнений конфуціанських тем: країні потрібна мудра рука «зразкового губернатора» Янь Сішаня, аби врятувати імперію від анархії."
 qing_coup_events.8.a: "Цей план — лише пусті балачки розпещених принців."
 qing_coup_events.8.b: "Цим принцам потрібна мудра рука, що вестиме їх."

 qing_coup_events.9.t: "Наш запит відхилено!"
 qing_coup_events.9.d_yan: "Губернатор Янь сухо відмовив нам і обірвав усі контакти. Схоже, він не вірить у наш успіх і вважає нас мрійниками. Гірше того, У Пейфу дізнався про змову від одного з розчарованих учасників. Губернатор дав зрозуміти, що не переховуватиме нас. Наша змова розвалюється!"
 qing_coup_events.9.d_qu: "Наша відчайдушна спроба провалилася. Губернатор Цюй не лише відмовив, а й заарештував нашого посланця. Схоже, республіканські переконання для нього дорожчі за владу в Пекіні. Змова викрита, і ми залишені на поталу долі!"
 qing_coup_events.9.d_zhang: "Шановний вчитель Чжан відмовив нам! (Це трапляється лише в мережевій грі, якщо ваш друг вирішив вам нашкодити)."
 qing_coup_events.9.a: "Прокляття! Ми згаяли наш єдиний шанс!"

 qing_coup_events.10.t: "Янь приймає нашу пропозицію"
 qing_coup_events.10.d: "Янь Сішань оголосив про підтримку нашої справи. Хоча його послання смиренне, очевидно, що він готується замінити собою У Пейфу на чолі нації. \n\nВін залучить сили Фен Юйсяна як тимчасовий засіб. Його армія збирається на заході, готова вдарити через Хуанхе. Жереб кинуто: або ми позбудемося зрадників-чжилійців, або загинемо від їхніх рук."
 qing_coup_events.10.a: "Сподіваймося, це спрацює!"

 qing_coup_events.11.t: "Цюй приймає пропозицію"
 qing_coup_events.11.d: "Губернатор Цюй Їнґуан погодився підтримати переворот. Він планує використати свій статус «сірого кардинала», аби посісти місце президента Цао. \n\nЗаручившись підтримкою сільських мас через Іґуаньдао, Цюй готується стати вирішальною фігурою в новому китайському порядку. Його війська вже на кордоні. Або ми визволимо Пекін, або нас чекає велике кровопролиття."
 qing_coup_events.11.a: "Можливо, це шанс для повернення кліки Аньхой?"

 qing_coup_events.12.t: "Чжан приймає пропозицію"
 qing_coup_events.12.d: "Шановний вчитель Чжан погодився допомогти змовникам. Він розгорне свої загони, якщо чжилійців не вдасться знищити одразу. Проте він напевно зажадає поступок, щойно Пуї повернеться на трон."
 qing_coup_events.12.a: "Чудово!"

 qing_coup_events.13.t: "Змову викрито!"
 qing_coup_events.13.d: "Маршалу У та президенту Цао доповіли про дивну змову маньчжурських принців, інтелектуалів ТРАК та генерала Сін Шиляня. Здається, один із іноземних спонсорів зрадив союзників і розповів усе кабінету в Пекіні. \n\nВійськова поліція влаштувала облави. Пуї, який, здається, ні про що не здогадувався, заарештований! Президент Цао оголосив про введення нової конституції та затримання членів Цзунше. У Пейфу ввів воєнний стан до формування нового кабінету. Династія Цін знову повалена, Бейянська Республіка повернулася."
 qing_coup_events.13.a: "Чжунхуа Міньґо ваньсуй!"

 qing_coup_events.14.t: "Доля зрадників"
 qing_coup_events.14.d: "Маньчжурську аристократію усунуто, але залишається питання покарання офіцерів, що підтримали переворот. Маньчжурських дворян неодмінно чекає вигнання. \n\nАле що робити з офіцерами-чжилійцями? Система зв'язків «ґуаньсі» дуже міцна: чи варто кидати за грати тих, з ким ми разом проливали кров? Втрата їхніх знань може послабити наш штаб."
 qing_coup_events.14.a: "Подобається нам це чи ні, вони все ще наші товариші."
 qing_coup_events.14.b: "Навіть деякі зв'язки можна розірвати."

 qing_coup_events.15.t: "Наслідки"
 qing_coup_events.15.d: "Змовників покарано, і тепер час будувати стабільний уряд. Сформовано новий кабінет: Бай Цзяньву став прем'єр-міністром, Янь Хуейцін — міністром закордонних справ, а маршал Ван Чженбінь зберіг посаду військового міністра. \n\nЦао та У планують створити комітет із розробки конституції, запросивши найкращі уми республіки. Чи протримається цей кабінет довше за попередні?"
 qing_coup_events.15.a: "Нам потрібно створити легітимний уряд!"

 qing_coup_events.16.t: "Зловісні рухи військ"
 qing_coup_events.16.d_yan: "З провінції Шаньсі повідомляють про незвичні пересування військ. Схоже, вони готуються до дій на кордоні. Далі на захід активізувався Фен Юйсян та його Ґоміньцзюнь. Здається, ці привиди минулого знову намагаються повернути втрачені землі, скориставшись колапсом наших союзників на півдні."
 qing_coup_events.16.d_qu: "З Шаньдуна повідомляють про скупчення великих сил біля переправ. Культи Іґуаньдао та Ґуйїдао мобілізують послідовників. Хоча Цюй Їнґуан клянеться у вірності, ми пам'ятаємо, що кліка Аньхой ніколи не помирала остаточно. Маршал Ван наполягає, що це підготовка до удару по Пекіну."
 qing_coup_events.16.d_zhang: "Великі натовпи ополченців Іґуаньдао збираються на кордоні з Шаньдуном. Вчитель Чжан Тяньжань точно не є другом чжилійців, і напад з його боку цілком імовірний."
 qing_coup_events.16.a: "Що тут відбувається? Відправити більше шпигунів для розслідування."
 qing_coup_events.16.b: "Хіба ви не бачите, що країна і так розривається на шматки!"

 qing_coup_events.17.t: "Підступні інтриги!"
 qing_coup_events.17.d_yan: "Інформатори викрили небезпечну змову Янь Сішаня та маньчжурських принців! Вони хочуть встановити диктатуру під прикриттям Пуї. Ми маємо негайно нанести удар по зрадниках у Шаньсі, інакше будь-яка слабкість спровокує нових ворогів. Марш на Тайюань!"
 qing_coup_events.17.d_qu: "Викрито змову Цюй Їнґуана та залишків кліки Аньхой! Вони планують реставрацію імперської влади. Ми повинні очистити наш штаб від «п'ятої колони» і вдарити по Шаньдуну першими. Вперед! Через Хуанхе!"
 qing_coup_events.17.d_zhang: "Викрито змову Чжан Тяньжаня з метою відновлення реальної влади Пуї! Ми маємо розібратися з цим негайно!"
 qing_coup_events.17.a: "Заарештувати змовників і готуватися до вторгнення в Шаньдун!"
 qing_coup_events.17.b: "Заарештувати змовників і готуватися до вторгнення в Шаньсі!"

 qing_coup_events.18.t: "Таємничі події"
 qing_coup_events.18.d: "На столи Пекіна та Лояна лягли звіти про поширення античжилійських памфлетів серед військ та народу. На запитання про походження матеріалів контррозвідка не має відповіді. \n\nЩе тривожніше те, що командир Сін Шилянь та низка інших офіцерів перестали виходити на зв'язок. Через перебої з радіо та телефоном у віддалених частинах країни, Цао та У відчувають: це іскри майбутнього перевороту."
 qing_coup_events.18.a: "Що тут коїться?"

 qing_coup_events.19.t: "Виклик до Пекіна"
 qing_coup_events.19.d: "Посеред хаосу прийшла термінова телеграма, підписана самим імператором. Президент Цао та маршал У викликані до Забороненого міста для обговорення критичного стану країни. \n\nХоча імператор має конституційне право викликати президента, такого ще ніколи не траплялося. У Пейфу та Цао Кунь підозрюють пастку, але обов'язок змушує їх з'явитися перед «Його Імперською Величністю» наприкінці тижня."
 qing_coup_events.19.a: "Ми і не з такого виплутувалися, чи не так, Цао?"

 qing_coup_events.20.t: "Президент, маршал та імператор"
 qing_coup_events.20.d: "Цао та У зустрілися перед входом до Забороного міста, розробивши план на випадок пастки. Вірні охоронці слідуватимуть за ними до самої зали, а потім займуть позиції навпроти імператорської гвардії. \n\nУ повітрі панує тривога. Маршал і президент перезирнулися востаннє, тримаючи козирі в рукавах, і рушили назустріч долі."
 qing_coup_events.20.a: "І вони входять до зали..."

 qing_coup_events.21.t: "Молот і ковадло"
 qing_coup_events.21.d: "Двері палацу Небесної чистоти відчинилися. На Драконовому троні — імператор Сюаньтун. Поруч — Чжен Сяосюй та принци Цзайтао і Пуцзє, які вимагають від гостей вклонитися. \n\nРаптом двері збоку розчиняються, і до зали вривається десяток озброєних гвардійців! Вони намагаються затримати Цао та У. Пуї, наляканий, тікає, а охоронці чжилійців кидаються всередину. Зав'язується запекла перестрілка серед стародавніх колон. Кулі трощать артефакти, але лише одна сторона вийде звідси живою."
 qing_coup_events.21.a: "У та Цао вбиті! Переворот вдався!"
 qing_coup_events.21.b: "Королівські гвардійці лежать мертвими на підлозі!"

 qing_coup_events.22.t: "Імператор заявляє про себе"
 qing_coup_events.22.d: "Пуї нервово повертається до зали, дивлячись на тіла маршала та президента. Пуцзє та вірні гвардійці з пістолетами-кулеметами оточують його. «Брате, час для промови». Пуї вагається: «Я не впевнений, що зможу». \n\nДо зали вривається генерал Сіця: «Мій лорде! Місто під контролем! Але маршал Ван Чженбінь та інші генерали втекли до Лояна і готують наступ!» Пуцзє кладе руку на плече імператора: «Тепер ти — імператор. Дій як належить!» Пуї збирається з духом: «Я, імператор Сюаньтун, оголошую кожного чжилійця, що не присягне мені до завтрашнього полудня, зрадником Великої Цін!»"
 qing_coup_events.22.a: "Смерть зрадникам!"

 qing_coup_events.23.t: "Виконання зобов'язань"
 qing_coup_events.23.d: "До [ROOT.GetLeader] дійшли приголомшливі новини: переворот у Пекіні вдався! Колись непереможні У Пейфу та Цао Кунь мертві. Чжилійці в хаосі, хоча маршал Ван Чженбінь намагається організувати опір у Лояні. \n\nМаньчжурські генерали та змовники почали мобілізацію, аби добити залишки кліки. Час виконати наш обов'язок перед імператором і назавжди стерти підступних чжилійців із мапи Китаю."
 qing_coup_events.23.a: "Знищити зрадників!"

 qing_coup_events.24.t: "Контрпереворот"
 qing_coup_events.24.d: "Цао та У дивом вижили. Охоронці маршала У зачистили палац і витягли переляканого Пуї до тронної зали. У виставив імператора перед собою як щит: «Ваша змова провалилася, зрадники. Крок уперед — і Син Неба помре». \n\nЗмовники змушені здатися. «Цао, бери гвардію і мчи до асамблеї!» — командує маршал. — «Час покінчити з імперією. Китай знову буде республікою». \n\nПоки Цао оголошує про повалення Цін, розвідка знаходить документи: сусідні мілітаристи теж були в долі! Чжилійці готуються до тотальної війни проти зрадників."
 qing_coup_events.24.a: "Смерть зрадникам!"

###- Anti-Concessionist -###

 qing_focus_events.3.t: "Новий старт"
 qing_focus_events.3.d: "Осідлавши хвилю патріотизму після нашої рішучої підтримки антиконцесіоністського руху Чень Тяоюаня, ми зробили перший сміливий крок до звільнення китайської нації від настирливих іноземних імперіалістів. Цей рух отримав колосальну підтримку в Ґуандуні, Шаньдуні, Юньнані та, очевидно, на територіях ліги. Провідні бейянські політики, як-от Юань Найкуань та спікер асамблеї Бянь Шоуцзін, запропонували президенту провести нові вибори, аби закріпити ці народні настрої.\n\nПорадившись із маршалом У, президент оголосив національні вибори на всіх територіях під номінальним контролем центрального уряду. Теоретично, всі грамотні чоловіки мають право голосу, але через втручання місцевих еліт, мілітаристів та революціонерів, реальні результати надійдуть лише з Центральних рівнин. Хоча багато хто називає асамблею безсилою ширмою в руках диктаторів, ми покажемо світу справжню, квітучу китайську демократію!"
 qing_focus_events.3.a: "Купаймося в променях слави!"

 qing_domestic_events.13.t: "Вирішальний удар"
 qing_domestic_events.13.d: "Хоча вибори були дещо поспішними, китайці масово прийшли на дільниці. Поки кандидати від Ліги процвітання, Товариства реформ, партії «Молодий Китай» та Цзунше запекло билися за кожне крісло, секретарі та розвідка Цао Куня за лаштунками делікатно прораховували баланс перемог та поразок.\n\nЗавдяки передвиборчим «випадковостям», підкупу чи таємній підтримці, кандидати від Цзунше та ТРАК здобули тактичні перемоги. Ліга процвітання, навпаки, занепала через антиконцесіоністський курс уряду. Кампанія Товариства гармонії була спокійною та впевненою — наші дії говорили самі за себе. Хоча явка була очікувано низькою, великі міста надали рекордну кількість голосів від інтелігенції, яка раніше підтримувала опозицію. Ґамбіт маршала У виявився вдалим: втративши німецьку підтримку, ми здобули обожнювання народу та політичну легітимність. Сонце знову світить над Серединною державою!"
 qing_domestic_events.13.a: "Почесне коло 1922 року!"

 qing_domestic_events.20.t: "Вихід із ради концесій!"
 qing_domestic_events.20.d: "Наша боротьба проти концесій викликала бурхливу реакцію імперіалістів. Вони фактично розірвали дипломатичні зв'язки та забарикадувалися у своїх посольствах. Оскільки спроби Цао домовитися не дали плодів, а народні протести загрожують вийти з-під контролю, маршал У та його лоянська фракція наполягли на повному виході зі статусу спостерігача в раді концесій.\n\nАби показати Заходу, що китайці більше не є їхніми рабами, кабінет вніс пропозицію про відставку до асамблеї, де вона отримала підтримку більшості політичних сил. Дипломатичний корпус офіційно передав акт про вихід раді в Шанхаї. Ми більше не будемо звітувати перед іноземною наволоччю, що визискує нашу країну!"
 qing_domestic_events.20.a: "Китай для китайців!"

 qing_domestic_events.21.t: "[QIE.GetName] покидає раду концесій!"
 qing_domestic_events.21.d: "Тривожні новини дійшли до ради концесій! Наші службовці, що стежили за ситуацією в глибині Китаю, усвідомлювали небезпеку. Протести проти «іноземних імперіалістів» переросли у насильство біля німецьких та інших іноземних посольств. \n\nДелегація [QIE.GetName] офіційно подала у відставку, назвавши раду «інструментом імперіалізму». Хоча вони були лише спостерігачами, це поганий знак для цілісності наших майбутніх ділових починань у регіоні."
 qing_domestic_events.21.a: "Невже вони не знають свого місця?"

 qing_foreign_policy_events.86.t: "У Пейфу та Цао Кунь зрадили нас!"
 qing_foreign_policy_events.86.d: "Поки імперія Сунь Чуаньфана розвалювалася, кайзер та його уряд сподівалися, що наші союзники в Пекіні збережуть колишній курс. Маючи лобі в асамблеї у вигляді Ліги процвітання та дружні стосунки президента Цао з німецькими офіційними особами, ми не бачили причин для розриву «особливих відносин» заради забаганок безграмотних мас. \n\nПроте «нефритовий маршал» та «король Баодіна» обрали шлях антиконцесіонізму. Це призвело до пред'явлення неприйнятних вимог Пекінській комісії: німцям наказали покинути столицю. Зіткнувшись із масовими заворушеннями біля своїх офісів, більшість співробітників втекли до німецької концесії в сусідньому Тяньцзіні."
 qing_foreign_policy_events.86.a: "Ці нестерпні чжилійці!"

 qing_flavour_events.15.t: "[ANQ.GetLeader] підтверджує наше лідерство"
 qing_flavour_events.15.d: "Губернатор Аньціна Чень Тяоюань у радіозверненні офіційно підтримав керівництво У Пейфу та Цао Куня. Хоча раніше він називав ідею реставрації імператора Пуї анахронізмом, тепер він з ентузіазмом схвалює наш антиконцесіоністський курс. Він завершив промову словами: «Аполітичний символ може бути корисним для сучасної держави. Під стерном У Пейфу та Цао Куня ми виженемо іноземну наволоч, що забруднила нашу землю, і повернемо їй велич!» \n\nІнтелігенція в Пекіні прихильно сприйняла цю промову. Проте за зачиненими дверима Чень нагадав лідерам чжилійців про умови їхніх угод — це тонка погроза проти будь-яких дій, що можуть зашкодити його автономії."
 qing_flavour_events.15.a: "Від «Усміхненого тигра» до «Дурня»."

 qing_flavour_events.16.t: "Чень Тяоюань — зразковий губернатор"
 qing_flavour_events.16.d: "Новий маршал ліги Чень Тяоюань, губернатор Аньціна та Нанкіна, розпочав поступову консолідацію влади на територіях, захоплених під час війни ліги. Він проводить чистку, виганяючи бюрократів Нанкінської кліки та симпатиків Гоміньдану. \n\nДеякі чжилійські генерали вимагали негайної інтеграції його земель до складу центрального уряду, але Цао відхилив це як надто ризикований крок. Здається, автономія Ченя нам на руку: він оголосив про масштабний проєкт промислових, правових та політичних реформ. З відходом німців відкрилися нові стабільні ринки, вільні від корупції Сунь Чуаньфана."
 qing_flavour_events.16.a: "Чудово!"

 qing_flavour_events.17.t: "Чень Тяоюань прагне подолати розкол між Північчю та Півднем"
 qing_flavour_events.17.d: "З 1927 року північна та південна частини чжилійської кліки — Пекін проти Нанкіна — віддалялися одна від одної. Раніше це була особиста ворожнеча між У Пейфу та його колишнім протеже Сунь Чуаньфаном. \n\nПроте новий маршал ліги, Чень Тяоюань, розпочив докладати зусиль для зближення. Хоча консерватори на кшталт президента Цао дивляться на це з підозрою, для уряду це ковток свіжого повітря: нам більше не треба чекати удару в спину з південного сходу. Поки лоянська фракція відкрита до злиття, молодші офіцери та члени Цзіньбао все ще тримають образу на аньцінську бюрократію. Мережі патронажу залишаться різними, але на мапі країна стає єдиною."
 qing_flavour_events.17.a: "Яка приємна людина цей Чень Тяоюань."

 qing_flavour_events.18.t: "Чень Тяоюань пропонує спільні військові навчання"
 qing_flavour_events.18.d: "У межах поступової інтеграції адміністрацій та армій, маршал Чень запропонував У Пейфу та Ван Чженбіню провести спільні маневри поблизу міста Аньцін. Оскільки його війська загартувалися у боях проти Нанкіна, а наші солдати мають кращу техніку та стратегічну підготовку, обидві сторони отримають вигоду. Очікується, що маршали невдовзі зустрінуться для обговорення деталей."
 qing_flavour_events.18.a: "Аби лише У та Ван знову не почали сперечатися."

 qing_flavour_events.19.t: "Розподіл трофеїв"
 qing_flavour_events.19.d: "Коли ми оголосили про націоналізацію іноземних заводів, кабінет боявся санкцій чи блокади. Проте через Чорний понеділок іноземцям зараз не до нас, і програма пройшла майже без перешкод. \n\nТепер пекінські бізнесмени, дворяни з партії Цзунше та ділки з Кліки політичних наук ведуть справжні війни за право власності на колишні німецькі, американські та британські підприємства. Нам належить вирішити, кому віддати ці контракти. Віддати їх Товариству гармонії означало б звинувачення у кумівстві, тож є варіанти замиритися з монархістами або кинути кістку Political Science."
 qing_flavour_events.19.a: "Звісно, нашим делегатам із Гармонії!"
 qing_flavour_events.19.b: "Краще не давати маньчжурам надто багато влади."
 qing_flavour_events.19.c: "Підтримаємо Кліку політичних наук."

 qing_flavour_events.21.t: "Імператор та чжилійці: два стовпи незалежності Китаю"
 qing_flavour_events.21.d: "Підтримка антиконцесіоністського руху породила нову хвилю патріотичної риторики серед інтелігенції Пекіна. Особливої популярності набув трактат «Імператор та чжилійці: два стовпи незалежності Китаю», де У, Цао та Ван постають як захисники нації, а імператор — як символ модернізації. Чжан Цзуолінь та його фентянський уряд натомість тавруються як «японські паразити». \n\nМаршал У лише посміхається, читаючи це. Якби вони знали правду про кулуарні ігри та ризиковані ставки Бейяна... Поки він змушений дотримуватися імперських ритуалів, але з кожним кроком до об'єднання країни наближається день, коли він зможе позбутися маньчжурів назавжди."
 qing_flavour_events.21.a: "Оксамитова рукавичка на залізному кулаці."

 qing_flavour_events.22.t: "Подолання розриву поколінь у війську"
 qing_flavour_events.22.d: "На відміну від революційного та молодого Півдня, офіцерський корпус Півночі складається переважно з людей старої закалки. Наші генерали народилися ще до 1911 року, а дехто навіть пам'ятає війну з Японією 1895-го. Для них головне — традиції та конфуціанські принципи вірності патрону. \n\nМолодші ж офіцери виросли в епоху мілітаристів та революційного духу Тунменхою. Серед них популярна партія «Молодий Китай» або помірковані ідеї Кліки політичних наук. Завдяки реформам мереж «ґуаньсі» та залученню свіжої крові, молодь починає підтримувати уряд, хоча й з оглядкою на власні політичні інтереси. Старі генерали також стають лояльнішими до режиму після розмов із молодшими підлеглими."
 qing_flavour_events.22.a: "Сучасна китайська військова родина!"

 qing_flavour_events.23.t: "Титули для короля Баодіна та нефритового маршала"
 qing_flavour_events.23.d: "Імператор висловив щиру вдячність титанам китайської політики за стабілізацію нації. Замість заплутаної старої системи він запровадив нові титули за західним (переважно німецьким) зразком. \n\nНайвищий ранг «герцога» (Ґун) отримали У Пейфу та Цао Кунь — тепер вони герцоги Ці та Вей відповідно. Хоча для У, як республіканця в душі, це порожній звук, він та Цао прийняли титули у пишній церемонії, присягнувши захищати монарха. Інші нагороди отримали маршал Ван Чженбінь (маркіз), Ґао Лінвей (віконт) та Юань Найкуань (граф)."
 qing_flavour_events.23.a: "Хай живуть герцоги Ці та Вей!"

 qing_flavour_events.24.t: "Президент та імператор"
 qing_flavour_events.24.d: "Аби продемонструвати єдність влади, кабінет організував публічний захід — «неформальний» ланч у Забороненому місті. Пуї запросив У Пейфу та Цао Куня обговорити питання модернізації армії та реформи бюрократії. Після обіду вони разом із братом імператора, Пуцзє, вирушили на кінну прогулянку. \n\nКамери зафіксували кожен момент, навіть коли маршал У допоміг президенту Цао втриматися в сідлі. Кадри вже крутять у кінотеатрах Уханя та Пекіна, демонструючи світові новий, модернізований образ династії Цін."
 qing_flavour_events.24.a: "Сподіваюся, ланч був смачним."

 qing_domestic_events.100.t: "Останній виступ справжнього лідера"
 qing_domestic_events.100.d: "Чутки про відставку старіючого президента Цао Куня нарешті підтвердилися. У залі асамблеї, в оточенні У Пейфу та Бая Цзяньву, він офіційно оголосив про свій відхід від справ після двох десятиліть керування нацією. Асамблея зустріла промову щирими оплесками всіх партій. \n\nНаступником Цао став його помічник та інтелектуал Бай Цзяньву. Бай відомий своїми зв'язками з Ху Ші та прогресивними колами, що символізує нову еру цивільного правління. Цао ж йде на спочинок, аби присвятити час каліграфії та доброчинності. Його вплив на Китай назавжди закарбується в історії."
 qing_domestic_events.100.a: "Тричі «ура» президенту Цао!"

###- Проконцесіоністи -###
 qing_domestic_events.14.t: "Зустріч із роялістами"
 qing_domestic_events.14.d: "Рішення про військову допомогу Лізі восьми провінцій викликало демарш опозиції — майже всі депутати, крім Гармонії та Ліги процвітання, покинули залу. Президент Цао розпочав серію зустрічей із керівництвом партії Цзунше, аби відновити їхню лояльність. \n\nВін використав страх маньчжурської знаті перед Японією та Фентянем, переконавши їх, що німецька підтримка необхідна для захисту їхніх домівок. Молоді члени партії погодилися повернутися до асамблеї лише після обіцянки виплати щедрих «дворянських пенсій» на «збереження імперської культури». У світі пекінської політики все купується за золото."
 qing_domestic_events.14.a: "«Чому це завжди закінчується підкупом?»"

 qing_domestic_events.15.t: "Зустріч із ПМК"
 qing_domestic_events.15.d: "Партія «Молодий Китай» (ПМК) відреагувала на пронімецьку політику Цао найагресивніше, назвавши її капітуляцією перед імперіалізмом. Цзен Ці та Лі Хуань першими вивели своїх депутатів із зали. \n\nВикористовуючи свої зв'язки в інтелектуальних колах, президент зміг посадити ультранаціоналістів за стіл переговорів. Завдяки своїй хитрості він уклав угоду: ПМК повертається до роботи в обмін на збільшення бюджету Баодінської академії та послаблення цензури в пресі. Найважчий етап кризи подолано."
 qing_domestic_events.15.a: "Сподіваймося, це їх вгамує."

 qing_domestic_events.16.t: "Зустріч із ТРАК"
 qing_domestic_events.16.d: "Товариство реформ (ТРАК) було останнім, хто покинув залу. Ця коаліція складається з конституціоналістів Сюй Ціня та Руху сільської реконструкції Лян Шуміна. Цао обрав тактику розділення: спочатку він переконав конституціоналістів, що німецькі гроші допоможуть модернізації. \n\nПотім він зустрівся з ідеологом Джеймсом Єном. «Джиммі» та президент швидко знайшли спільну мову. Компроміс був знайдений: уряд розпочне поступову націоналізацію промисловості та обмеження влади поміщиків-ґентрі в селах."
 qing_domestic_events.16.a: "«Який чудовий хлопець цей Джиммі!»"

 qing_domestic_events.17.t: "Новий день в асамблеї"
 qing_domestic_events.17.d: "Після тижнів напружених переговорів порядок в асамблеї відновлено. Майже всі партії (крім кількох непохитних незалежних) підтвердили свою підтримку. Демократичне серце Пекіна знову б'ється. Президент, маршал У та маршал Ван відсвяткували стабілізацію за склянкою алкоголю. Тепер на черзі головна мета: національне об'єднання."
 qing_domestic_events.17.a: "Попереду багато роботи."

 qing_domestic_events.19.t: "Прощання з королем Баодіна"
 qing_domestic_events.19.d: "Президент Цао Кунь офіційно оголосив про свою відставку. Асамблея зустріла це бурхливими оплесками. Оскільки уряд проводив пронімецьку політику, новим президентом було обрано Лю Менґена — людину з фракції Цзіньбао, відданого генерала та близького друга родини Цао. Його призначення знаменує нову еру реформованого лідерства, що має повну підтримку Товариства гармонії. Цао йде на спочинок, але його спадщина житиме."
 qing_domestic_events.19.a: "Прощавай, китайський Бісмарку!"

 qing_focus_events.25.t: "Наші майбутні відносини з Німеччиною"
 qing_focus_events.25.d: "Цао Кунь та У Пейфу стали національними героями, що об'єднали Китай. Тепер, коли війна за виживання нації виграна, постає питання: як бути з Німеччиною? Дипломатичний корпус розглядає можливість укладання повноцінного договору про захист. Проте дехто в оточенні «нефритового маршала» наполягає на тому, аби зосередитися на внутрішній відбудові та припинити оглядку на Берлін."
 qing_focus_events.25.a: "Запросити гарантії незалежності."
 qing_focus_events.25.b: "Зосередитися на відбудові Китаю."

 qing_focus_events.27.t: "Запит із Пекіна"
 qing_focus_events.27.d: "Китайська делегація на чолі з Веллінгтоном Ку прибула до Берліна. Вони пропонують закріпити статус «особливих відносин» та надати Китаю офіційні гарантії незалежності. Для Німеччини це шанс отримати вірного союзника на Сході, який допоміг розгромити Японію. Проте Райхстаг побоюється втягуватися в зобов'язання на іншому кінці світу."
 qing_focus_events.27.a: "Підписати гарантії."
 qing_focus_events.27.b: "Відмовити. Вони — лише тягар."

 qing_focus_events.31.t: "Німецькі залізничні інженери"
 qing_focus_events.31.d: "Хоча залізниці Китаю ростуть, нам катастрофічно не вистачає власних фахівців. Німецькі технології — це ключ до модернізації, проте партія «Молодий Китай» боїться, що це призведе до повної залежності від Берліна. Кабінет має вирішити: яку роль відіграватимуть іноземні радники у розбудові наших транспортних артерій?"
 qing_focus_events.31.a: "Надати їм контракти на масштабні інфраструктурні проєкти."
 qing_focus_events.31.b: "Залучити їх лише до будівництва основних магістралей."
 qing_focus_events.31.c: "Залишити їх лише консультантами при китайському керівництві."

 qing_flavour_events.1.t: "Облава на нелегальний бордель!"
 qing_flavour_events.1.d: "Поліція Пекіна накрила притон на околиці міста. Серед вилученого — опіум, коноплі та навіть кокаїн. Але справжнім сюрпризом став один із клієнтів — білий чоловік із німецької дипломатичної місії. «Ви ще почуєте про це від посольства!» — кричав він. \n\nАрешт такого зухвальця дав би уряду важіль тиску на німців, але міг би коштувати політичних проблем президенту. З іншого боку, відпустити його — означало б зганьбити власну честь. Перед Zhang Beijiao стоїть вибір: велика політика чи справедливість для нації?"
 qing_flavour_events.1.a: "«Кайдани на цього негідника!»"
 qing_flavour_events.1.b: "Я.. нічого не бачив."

 qing_flavour_events.2.t: "Скандал у Пекіні!"
 qing_flavour_events.2.d: "Тривожні телеграми надійшли до офісу Наглядової ради Ост-Азійської адміністрації! Повідомляється, що посеред ночі під час рутинного поліцейського рейду в Пекіні начальник відділу моралі поліції Пекіна Чжан Бейцзяо затримав одного з наших! Ганс Шредер, перспективний молодий дипломат Пекінської комісії, був спійманий із повіями у підпільному борделі.\n\nАрешт набув широкого розголосу, і китайські маси вже знову мітингують проти свавілля іноземців на їхній землі, вимагаючи відплати. Судячи з переговорів із нашими людьми в представництвах, китайський уряд відмовляється визнавати дипломатичний імунітет Ганса, стверджуючи, що він не виконував офіційних обов'язків у той час.\n\nВикористовуючи це як привід для спротиву реформам, що підтримуються Німеччиною, наша група в асамблеї — Ліга процвітання — втратила частину депутатів, які перейшли до Кліки політичних наук. Хоча в масштабах світу це лише дрібний скандал, він вдарив по нас сильніше, ніж ми готові визнати."
 qing_flavour_events.2.a: "Бордель? Серйозно?"

 qing_flavour_events.3.t: "Корупція в поліції Пекіна?"
 qing_flavour_events.3.d: "Коли капітан Чжан Бейцзяо прийняв стратегічне рішення відпустити Ганса Шредера, молодого німецького дипломата, знайденого в нелегальному борделі, ми сподівалися, що на цьому все закінчиться. Проте один із його підлеглих, обурений відсутністю покарання, розповів про це підпільній пресі Пекіна. Ці памфлетистські видання часто публікують гостру критику уряду Товариства гармонії через алегоричні вірші та історичні аналогії, аби оминути цензуру.\n\nЦього разу вони розгорнули повномасштабну атаку на «корупцію» поліції Пекіна та порівняли ситуацію з убивством Лінь Вейсі британськими моряками у 1839 році — іскрою, що запалила першу опіумну війну. Намагаючись перенаправити гнів, Цао доручив апарату спрямувати народне невдоволення виключно на німців, знімаючи з уряду відповідальність.\n\nІ все ж, це заплямувало репутацію нашого і без того крихкого врядування. Дехто в асамблеї навіть вимагає від кабінету офіційно винести догану Берліну."
 qing_flavour_events.3.a: "Національне приниження заради вищого блага?"

 qing_flavour_events.4.t: "Німець у Пекіні спійманий у східному борделі!"
 qing_flavour_events.4.d: "Таблоїди по всій країні гудуть від історії з Пекіна. Ганс Шредер, молодий аташе німецького консульства, був затриманий поліцією під час рейду на нелегальний бордель, де також торгували німецькими наркотиками. Ба більше, шеф поліції вирішив відпустити Шредера без жодного попередження, ймовірно, боячись політичних наслідків. Місто паралізоване антинімецькими бунтами, а багато членів СДПН та партії Центру ставлять під сумнів доцільність нашої участі в справах Китаю.\n\nКарло Мірендорф і Курт Шумахер, лідери СДПН, разом із Конрадом Аденауером виступили в Райхстазі з різкою промовою у відповідь на скандал. Вони критикували не лише кабінет [GER.GetSecondInCommand] за втручання в китайську політику, а й саму суть присутності Німеччини, яка шкодить китайському народу.\n\nСтверджуючи, що це лише колоніальна авантюра заради прибутків, а не модернізація суспільства, політики зібрали навколо себе грізний блок у Райхстазі, маючи на меті змусити уряд піти з Китаю якомога швидше."
 qing_flavour_events.4.a: "Огидно!"

 qing_flavour_events.5.t: "Медійне мовчання"
 qing_flavour_events.5.d: "Коли кабінет дізнався про потенційний дипломатичний інцидент через спробу арешту німецького дипломата в пекінському борделі, президент Цао наказав своїм людям у МЗС пильно стежити за будь-якою реакцією Берліна.\n\nВодночас він доручив розвідці під керівництвом Лю Менґена та Ван Юйцзя цілодобово працювати над тим, аби історія не просочилася до найбільш агресивних таблоїдів, які б залюбки розкритикували уряд. Схоже, ці надзвичайні зусилля принесли плоди.\n\nУникнувши важкого конфлікту з нашими німецькими союзниками, рішення відпустити молодого німця пройшло без ускладнень. Хлопця перевели до Тяньцзіня, а офіцеру Чжан Бейцзяо виписали премію за «швидке політичне мислення». Проте залишається гнітюче почуття сорому через те, що ми змушені так принижуватися перед іноземцями на власній землі."
 qing_flavour_events.5.a: "Шкода, завдана духу нації, непоправна."

 qing_flavour_events.25.t: "Відкриття німецьких потогонних цехів"
 qing_flavour_events.25.d: "Завдяки збереженню наших «особливих відносин» із Німецькою імперією, у великі міста хлинув потік капіталу — німецький бізнес сподівається заробити статки після Чорного понеділка. Бум будівництва заводів приніс користь економіці, дозволивши вільну торгівлю між дедалі більш рівноправними партнерами.\n\nПроте іноземці ніколи не бувають задоволені, постійно шукаючи способи обійти правила заради найменшого прибутку. Застосовуючи сумнівні методи, деякі з них почали відверто зловживати дешевою робочою силою Китаю. \n\nСьогодні вранці кабінет зібрався, щоб розібратися з невеликим скандалом: з'ясувалося, що одна німецька фабрика змушувала працівників гарувати по 20 годин на добу за копійки. Гірше того, власники домовилися з місцевою поліцією про арешти та залякування будь-кого, хто поскаржиться. Через це місцевий уряд виглядає лише як маріонетка іноземців."
 qing_flavour_events.25.a: "Абсолютно огидно! Негайно викличте делегацію!"

 qing_flavour_events.26.t: "Німецькі залізниці отримують схвалення"
 qing_flavour_events.26.d: "Спочатку розширення впливу німецьких бізнесменів на нашу інфраструктуру викликало запеклі дебати в асамблеї. Однак через кілька місяців співпраці між німецькими та китайськими інженерами залізнична система помітно покращилася, і народ уже висловлює щиру подяку за зручне сполучення між містами.\n\nНадзвичайно заплутані стандарти колій було уніфіковано в межах провінцій, а корумпованих власників станцій, які дерли три шкури за квитки, затримали або звільнили. Не враховуючи очевидні військові переваги сучасної мережі, які тішать маршалів Вана та У, реформа залізниць завойовує прихильність і цивільного населення.\n\nОсобливо відзначають роботу над нашою ділянкою магістралі Гуанчжоу-Пекін — північно-південного гіганта, що пролягає від столиці до Чженчжоу, Уханя, Чанші та Гуанчжоу. Це справжнє диво інженерії!"
 qing_flavour_events.26.a: "Що там казали про потяги, які курсують за розкладом?"

 qing_flavour_events.27.t: "Імпортні радіостанції схвалені військами"
 qing_flavour_events.27.d: "Військова допомога — це найважливіший аспект наших відносин із Німеччиною. Сусвітня наддержава, збудована на крові та сталі, має найсучасніше озброєння на планеті. Паралельно з цим, досягнення в цивільних технологіях стають справжнім джекпотом для будь-якого союзника кайзера.\n\nХоча дехто в міністерстві фінансів жахався від вартості імпорту кількох сотень новітніх радіостанцій Siemens, маршалі У та Ван доповіли про їхню вражаючу ефективність. Під час нещодавньої операції проти бандитів на півночі підрозділи центрального уряду змогли чітко координувати дії завдяки радіозв'язку. Теоретики на кшталт Цзяна Байлі в захваті від перспективи створення справді сучасної армії."
 qing_flavour_events.27.a: "Скоро ми ні в чому не поступатимемося Заходу!"

###- Republic -###
 qing_focus_events.4.t: "Велика нарада"
 qing_focus_events.4.d: "З дискредитованим імперським двором покінчено, і китайський народ знову проголосив себе повноправним господарем власної долі! Більше нами не правитимуть тирани, що століттями гнобили нас. Подібно до святкувань після Сіньхаю та відсічі монархістам у 1917 році, люди вийшли на вулиці Пекіна, згуртувавшись навколо «нефритового маршала» та президента Цао Куня. Справжні герої республіканської історії Китаю!\n\nПісля замаху на їхні життя У та Цао знову взяли на себе місію вести націю крізь часи смути. У палаці зібралася строката група провідних чжилійців та міністрів. Поруч із президентом Цао засіли Ґао Лінвей, Юань Найкуань, Бянь Шоуцзін, Ван Кемінь та маршал Ван Чженбінь — еліта фракції Цзіньбао. Навпроти них, підтримуючи маршала У, розташувалися Бай Цзяньву, Ван Чжентін, Чжан Ціхуан, Цзян Байлі, Ван Чунхуей та — що найбільш несподівано — ліберал Ху Ші.\n\nЗалучивши провідного інтелектуала товариства «Зусилля» та голову «кабінету добрих людей», У дає чіткий сигнал: він має намір реформувати республіку на тих же засадах, що намагався впровадити у 1920-х роках. Суперечки були запеклими, особливо між Ван Чженбінем та маршалом У. Врешті було висунуто два плани: фракція Цао пропонує повернути конституцію 1923 року без монархічних атрибутів, тоді як інтелектуальне крило на чолі з Ху Ші та Ван Чунхуеєм наполягає на розробці абсолютно нової конституції, яка виправить усі вади минулих китайських республік."
 qing_focus_events.4.a: "Повернути стару конституцію Цао Куня."
 qing_focus_events.4.b: "Розробити нову, сучасну конституцію!"

 qing_focus_events.5.t: "Добрі люди та президент"
 qing_focus_events.5.d: "Наріжним каменем конституції минулої китайської республіки була всеосяжна влада президента. Спроби попередніх урядів обмежити її призводили до виснажливої боротьби між президентами та прем'єр-міністрами, як це було у випадку Дуань Ціжуя та Лі Юаньхуна. Таке зосередження влади у руках виконавчої гілки не влаштовує Ван Чунхуея та Ху Ші. Вони прагнуть посилення парламенту та ролі прем'єра, аби президент був не всевладним тираном, а гарантом стабільності з представницькими функціями.\n\nПроте Цао Кунь та Ґао Лінвей наполягають: сильна виконавча влада необхідна для підтримки курсу держави, аби уряд не тонув у дріб'язкових чварах асамблеї та сенату. Вони впевнені, що прогрес можливий лише тоді, коли країною керує сильна рука, що діє в інтересах нації."
 qing_focus_events.5.a: "Мушу визнати, Цао має рацію."
 qing_focus_events.5.b: "Врядування «добрих людей» — понад усе!"

 qing_focus_events.6.t: "Федералізм та централізм"
 qing_focus_events.6.d: "Суперечка, якої варто було очікувати після запрошення Цзяна Байлі та Ху Ші, нарешті паралізувала роботу конституційного комітету. Питання руба: федералізм чи централізм? Цзян та Ху обстоюють ідею, що це шанс для бейянського уряду дослухатися до волі народу та перебудувати республіку на істинно демократичних засадах. Спираючись на свої зв'язки з регіональними лідерами на півдні, вони відмовляються йти на поступки.\n\nМаршал У, не витримавши дискусії, навіть покинув залу, залишивши замість себе Бая Цзяньву. Цао Кунь, як досвідчений прагматик, вислухав їхні заклики, але зауважив, що саме автономія провінцій призвела до хаосу, в якому Китай перебуває зараз: засилля мілітаристів та безсилля центру. Генерал Чжан Ціхуан намагався втрутитися, але Цао продовжив: лише централізована влада в Пекіні запобіжить новій епосі роздробленості. Цзян та Ван Чжентін заперечили — на їхню думку, грамотні провінційні конституції, як у Хунані, навпаки, стануть запобіжником проти військових диктатур. Комітет розколовся, і вирішальне слово за Баєм Цзяньву..."
 qing_focus_events.6.a: "Можливо, федералізм завоює їхні серця."
 qing_focus_events.6.b: "Централізація будь-якою ціною!"

 qing_focus_events.7.t: "П'ять народів у одному союзі!"
 qing_focus_events.7.d: "Після довгих суперечок щодо юридичних тонкощів комітет нарешті узгодив фінальний текст нової конституції. Ця праця найкращих умів уряду містить понад 150 статей. У Пейфу, Цао Кунь та їхні найближчі соратники відсвяткували успіх шампанським. Цао навіть жартував, що вони перевершили все, про що мріяв старий клуб «Аньфу».\n\nПроте для «короля Баодіна» цей тріумф став останньою дією на політичній сцені. Відчуваючи втому, він офіційно оголосив про свою відставку перед поважним зібранням чжилійців та бізнесменів. Він бажає передати стерно нової конституції свіжим силам. Асамблея зустріла його заяву бурхливими оваціями. Поки Цао планує присвятити старість каліграфії та благодійності, маршал У розуміє: старий лис продовжить впливати на справи через свій кабінет фракції Цзіньбао. З підняттям республіканського прапора починається нова глава китайської демократії."
 qing_focus_events.7.a: "Чжунхуа Міньґо ваньваньсуй!"

 qing_focus_events.8.t: "Обрання президента"
 qing_focus_events.8.d: "Після відставки Цао Куня комітет має представити асамблеї кандидатів на посаду президента. Фракція Цзіньбао, керована маршалом Ваном від імені Цао, висунула Веллінгтона Ку (Ґу Вейцзюня) — легендарного дипломата та героя Версальської конференції. Як член аполітичного дипломатичного корпусу, він вважається зручним кандидатом, що забезпечить стабільність і не матиме власних надмірних амбіцій.\n\nЛоянська фракція та реформатори запропонували Ху Ші. Колишній інтелектуал-ідеаліст пройшов довгий шлях і тепер презентує себе як прихильника «прагматизму» та північного федералізму. Він обіцяє боротися з п'ятьма ворогами нації: бідністю, хворобами, невіглаством, корупцією та безладом. Обидва кандидати мають величезний досвід, і тепер доля республіки залежить від голосу «нефритового маршала»."
 qing_focus_events.8.a: "«Гаразд! Ху Ші, це твоя гра»."
 qing_focus_events.8.b: "«Запросіть міністра Ку, будь ласка»."

 qing_focus_events.9.t: "Інавгурація нової республіки"
 qing_focus_events.9.d: "Кандидата обрано, залишилися формальності. Більшість Товариства гармонії підтримає вибір маршала, попри поодинокі голоси незгодних. У залі асамблеї в.о. прем'єр-міністра Бай Цзяньву оголосив про завершення роботи над конституцією та відхід Цао Куня на заслужений спочинок через стан здоров'я. Маршал Ван вимагав тиші, поки Бай продовжував.\n\n«Відтепер ми не боремося з аристократією Цін, а фокусуємося на проблемах народу: боргах, об'єднанні нації та майбутньому. Тільки мудрий та красномовний розум може вести наш корабель у ці часи», — заявив він. Після офіційного оголошення кандидатур асамблея розділилася: незалежні та реформатори підтримали Ху Ші, а більшість Товариства гармонії — Веллінгтона Ку. Зрештою, обраним кандидатом став..."
 qing_focus_events.9.a: "Вітаємо, пане президенте [QIE_president_scripted_loc]!"

 qing_focus_events.10.t: "Борг та легітимність"
 qing_focus_events.10.d: "Астрономічні борги часів занепаду династії Цін перейшли у спадок нашому уряду. Бейянські республіки минулого прославилися своїм жахливим фінансовим управлінням, і тепер ці зобов'язання заважають нам зміцнювати легітимність нової влади. Президенту [QIE.GetLeader] запропонували два варіанти.\n\nПерший — радикальний: оголосити дефолт, ставши на шлях антиконцесіонізму. Це вдарить по нашому кредитному рейтингу, але забезпечить шалену підтримку народу. Другий план від Ван Кеміня та Ґао Лінвея — просити допомоги у Німеччини. Ми зберегли нейтралітет у війні ліги і тепер можемо запропонувати Берліну «оливкову гілку» в обмін на реструктуризацію боргу. Проте маршал У вже дав зрозуміти: він волів би викинути німців геть, тож будь-який крок проти волі маршала матиме серйозні наслідки."
 qing_focus_events.10.a: "Дефолт. Це єдиний вибір."
 qing_focus_events.10.b: "Зустрінемося з німцями та обговоримо нову угоду."

 qing_foreign_policy_events.87.t: "Заворушення в Пекіні!"
 qing_foreign_policy_events.87.d: "Поки імперія маршала Сунь Чуаньфана розвалювалася, кайзер та його уряд сподівалися, що союзники в Пекіні збережуть колишній курс. Маючи лобі в асамблеї та дружні стосунки з президентом, ми не бачили причин для розриву «особливих відносин» заради забаганок безграмотної маси. \n\nПроте уряд [QIE.GetName] обрав шлях антиконцесіонізму, зрадивши наші інтереси. Це призвело до пред'явлення зухвалих вимог Пекінській комісії: німцям наказали покинути місто. Зіткнувшись із масовими протестами біля своїх офісів, більшість наших співробітників втекла до німецької концесії в сусідньому Тяньцзіні. Наш посол залишив лише невелику групу офіцерів для протидії дипломатичному корпусу Пекіна."
 qing_foreign_policy_events.87.a: "Прокляті китайці!"

 qing_flavour_events.13.t: "Нічна гра в карти"
 qing_flavour_events.13.intro: "Над новим президентським палацом у Пекіні опустилася ніч. Президент [QIE.GetLeader] приймав верхівку чжилійців та бейянських політиків. Прибули адмірали Са Чженьбін та У Юйлінь, юрист Ван Чунхуей, дипломат Янь Хуейцін. Потім з'явився «нефритовий маршал» зі своїми соратниками. Останнім прибув експрезидент Цао Кунь, супроводжуючи своїх вірних міністрів: Ґао Лінвея, Ван Кеміня та маршала Вана Чженбіня."
 qing_flavour_events.13.d_hu: "$qing_flavour_events.13.intro$\n\nПочуваючись некомфортно на великих прийомах, президент Ху Ші усамітнився в кабінеті з Цзяном Байлі та Ваном Чунхуеєм. Поки інші гості грали в більярд та обговорювали військові плани, вони вели дружню гру в карти. На запитання Вана, чи вірить Ху, що зможе побороти систему кліки, той відповів: «Це титанічне завдання, але хіба воно нам не під силу?». В іншій кімнаті У та Цао обговорювали самого Ху Ші, розуміючи, що «самотнього ідеаліста» треба тримати під пильним наглядом."
 qing_flavour_events.13.d_koo: "$qing_flavour_events.13.intro$\n\nВеллінгтон Ку був у своїй стихії, розважаючи гостей історіями зі своєї дипломатичної практики. Його дружина, мадам Ку, затьмарила чоловіка, розповідаючи про старі звичаї Чжан Цзуоліня: «Він ніколи не запрошував жінок на свої бенкети. Одного разу на виставі він побачив, що генерал Сунь Чуаньфан поступився мені місцем, і їдко зауважив: 'Ніколи не знав, що ви так вислужуєтеся перед дамами'». Весь вечір мадам Ку була душею компанії, поки її чоловік грав у карти з маршалом У, обговорюючи майбутнє, де він мав стати приємним обличчям уряду мілітаристів."
 qing_flavour_events.13.a: "Звідки росте політична влада?"

 qing_flavour_events.100.t: "Провісник федералізму та самотній ідеаліст"
 qing_flavour_events.100.d: "Після останніх перемог асамблею сколихнула суперечка щодо долі федералістів, з якими ми нещодавно воювали. Президент [ROOT.GetLeader] вступив у відкритий конфлікт із маршалом У через долю цих інтелектуалів. Маршал, маючи старі зв'язки з Чень Цзюнміном, дозволив йому залишитися під домашнім арештом. \n\nПроте президент та генерал Цзян Байлі зажадали повного офіційного помилування для лідерів федералістів. Ця суперечка потрапила в пресу, ставши публічним зіткненням між президентом та його благодійником. Зрештою, маршал У неохоче поступився, погодившись на цей жест доброї волі."
 qing_flavour_events.100.a: "«Аби тільки він не проліз до асамблеї!»"

 qing_flavour_events.101.t: "Благання друга"
 qing_flavour_events.101.d: "Перед наступом на південних федералістів Лоян отримав телеграму від Чжао Хенці, лідера хунанців та особистого друга У Пейфу. Чжао нагадав про роки їхньої співпраці та просив не спалювати поля Хунані у черговій кривавій війні. Він пропонував знайти компроміс, аби брати по зброї не вбивали один одного. На обличчі маршала промайнув жаль, але він відповів гідно: «Вибач, Чжао, але іншого вибору немає»."
 qing_flavour_events.101.a: "«Мені шкода, Чжао, але іншого вибору немає»."

 qing_flavour_events.102.t: "Жаль за старим листуванням"
 qing_flavour_events.102.d: "Для багатьох Бай Цзяньву — це просто тінь маршала У. Але колись він був звичайним студентом із Півночі. В академії він потоваришував із Лі Дачжао, з яким заснував журнал «Яньчжи». Навіть після випуску вони щомісяця листувалися. \n\nПізніше Бай намагався залучити Лі до роботи з маршалом У, аби сформувати демократичний уряд. Проте маршал не зміг домовитися з інтелектуалами щодо федералізму, а жорстке придушення залізничного страйку остаточно відвернуло від нього Лі Дачжао. Їхня дружба обірвалася, коли Цао Кунь підкупом здобув президентство. Бай залишився з У, а Лі пішов до революційного Гоміньдану."
 qing_flavour_events.102.a: "Завжди важко втрачати старого друга..."

 qing_flavour_events.103.t: "Голова та інтелектуал"
 qing_flavour_events.103.d: "«Якщо ми битимемося і програємо, Пекін та Тяньцзінь будуть підкорені. Ми маємо зберегти Північний Китай будь-якою ціною», — читав Ху Ші стару телеграму від Ван Чжаоміна. Газети Шанхая вже сурмлять про «розгром комуністичних бандитів» у Фуцзяні. \n\nХу Ші ніколи не переставав вважати Вана своїм другом, попри його ліві погляди. Їхнє листування тривало навіть тоді, коли Ван був у серці синдикалістського руху. Тепер пил осів: Ван Чжаомін залишиться вигнанцем в історії, а Ху має підготувати промову про остаточну перемогу над Гоміньданом, якої вимагає асамблея."
 qing_flavour_events.103.a: "«Прощавай, Ван Чжаомін»."

 qing_flavour_events.104.t: "Перша леді, світська левиця"
 qing_flavour_events.104.d: "Китайські традиції відводять жінкам скромну роль, але Оей Хуейлань, відома як мадам Ку, ламає ці стереотипи. Вона — душа столичних прийомів, здатна налагодити зв'язки в найвищих колах. \n\nПовернення її чоловіка до влади стало приводом для нових розкішних бенкетів. Мадам не лише збирає підтримку для Веллінгтона, а й ділиться пікантними чутками про імператорський дім. Гості потайки кажуть, що справжнім лідером у цій парі є саме вона."
 qing_flavour_events.104.a: "Улюблена лідерка Китаю!... і президент Ку."

 qing_flavour_events.105.t: "Витончений конфуціанський воїн-вчений"
 qing_flavour_events.105.d: "Для іноземців маршал У — просто черговий автократ. Але за цим стоїть людина глибоких філософських переконань. У Пейфу мріяв стати вченим, але життя змусило його взяти в руки шаблю. Тим не менш, він залишається вченим-воїном, якого навіть революціонери поважали у ранні роки. \n\nІнтелектуали ведуть дискусії: хто такий маршал У? Традиційний мілітарист, що шанує конфуціанство і «ґуаньсі», чи державний діяч, чия ідеологія диктується військовими потребами? Його внесок у створення «кабінету добрих людей» та вірність конституційним ідеалам роблять його постать унікальною в історії Китаю."
 qing_flavour_events.105.a: "Традиційний мілітарист чи революційний державний діяч?"

 qing_flavour_events.106.t: "Проблема національного об'єднання"
 qing_flavour_events.106.d: "Розкол між федералістами та централістами десятиліттями терзає Китай. У Пейфу колись бачив себе в ролі «китайського Гамільтона», прагнучи централізувати владу, аби потім розподілити її серед народу. Суперечки з Ху Ші виникли через питання провінційної автономії. Ху боявся, що У лише відкладає самоврядування, аби зберегти владу зброї. Він не розумів, що У щиро вірить у народовладдя, але панічно боїться роздробленості, яка знову призведе до епохи мілітаристів. Ця позиція залишається головною перешкодою для єднання Китаю."
 qing_flavour_events.106.a: "Помилки минулого продовжують переслідувати нас."

 qing_flavour_events.107.t: "Вади провінційного самоврядування"
 qing_flavour_events.107.d: "У спробах нації схилити «нефритового маршала» на бік федералізму, він виявився непохитною силою. Намагаючись порозумітися з Чень Цзюнміном роки тому, У Пейфу так описав своє ставлення до автономії: «Чого досягло самоврядування в Хунані? Військ усе ще багато, як дерев у лісі; скарбниця порожня; а щодо добробуту — провінція переповнена біженцями. Наслідки створення федерації будуть ще тривожнішими. США прийняли федералізм, аби об'єднати окремі штати, але наше 'творення китайської федерації' лише розділить єдину країну на шматки. Ми просто перетворимо двадцять дві провінції на двадцять дві розрізнені держави».\n\nЦі переконання маршала лишаються незмінними. Хоча Ху Ші називав їх незрілими, а Ван Чунхуей — зневагою до руху, що лише зароджується, найгучніше відповів губернатор Чжао Хенці. У п'ятитисячослівній телеграмі він відчайдушно намагався переконати У, що самоврядування не суперечить єдності, а парламент у Пекіні та провінційні асамблеї лише доповнюватимуть один одного. Зусилля Чжао та товариства «Зусилля» були марними. Через непоступливість Чень Цзюнміна та жорстку відмову У Пейфу, Китай знову був розірваний ідеологічним зіткненням між тими, хто тримає гвинтівки, і тими, хто володіє словом."
 qing_flavour_events.107.a: "Принципові люди, непримиренні позиції."

 qing_flavour_events.108.t: "Конфуціанство в сучасну епоху"
 qing_flavour_events.108.d: "Федералістам було легко закинути У Пейфу прагнення лише утримати та централізувати владу. Проте, як і у випадку з федералістами, непохитність У щодо провінційного самоврядування народилася не з жадоби, а з переконання. Він прагнув створити те саме «добре врядування», якого так потребувала китайська нація.\n\nЗавдяки своєму конфуціанському вихованню, У став своєрідним «інтелектуальним генералом». Він виступає проти опіуму, азартних ігор та проституції, палко любить поезію, каліграфію та китайську філософію. Його ідеологія базується на тому, що конфуціанська етика є фундаментом держави, і вона цілком сумісна з західними політичними принципами. В очах У, «три народні принципи», наприклад, відображають, а не заперечують вчення Конфуція. Зокрема ідея «шанувати васальну вірність та виганяти варварів» тотожна націоналізму.\n\nПри цьому маршал розуміє пріоритет демократії як нової динаміки світових цивілізацій, що потребує нових інститутів, яких Китаю бракувало через тривалий деспотизм його політичної традиції."
 qing_flavour_events.108.a: "Модернізатор чи традиціоналіст?"

 qing_flavour_events.109.t: "Принципи демократії"
 qing_flavour_events.109.d: "«Поділ влади — це принцип демократії, а демократія — це фундамент сучасної політики. Наша країна — республіка; суть республіканізму полягає у поверненні влади народу. Розквіт чи занепад нації має бути справою кожного громадянина».\n\nЗамість того, щоб протистояти змінам, «нефритовий маршал» прагне поєднати західну демократію з конфуціанською моделлю доброчесного правління: «Наука та верховенство права корисні для державотворення, але якщо ми збережемо при цьому конфуціанську мораль, китайська держава не матиме рівних у світі». У Пейфу вірить, що китайська цивілізація тримається на моральному порядку, що робить її трансендентною порівняно з матеріалістичним та занепадницьким Заходом.\n\nДля нього федералізм — це перешкода єдності та шлях до культурної фрагментації. Хоча інтелектуали Пекіна висміюють його за конфуціанство, називаючи його погляди відсталими, «думка У Пейфу» стала невід'ємною частиною ідеологічного середовища «доброго врядування», підкреслюючи складну взаємодію між консервативним та радикальним у створенні сучасної китайської держави."
 qing_flavour_events.109.a: "Думка У Пейфу? Цікаво..."

 qing_flavour_events.110.t: "Брак «зусиль» від товариства «Зусилля»"
 qing_flavour_events.110.d: "Товариство «Зусилля», засноване Ху Ші у 1921 році разом із друзями Цай Юаньпеєм та Дін Веньцзяном, тривалий час було центром інтелектуального життя Пекіна. Спершу це був лише гурток для обговорення політики за чаєм чи грою в маджонг, але згодом вони почали просувати ідеї поступових реформ. Публікація «Нашої політичної заяви» принесла їм величезну популярність і змусила Ху Ші вийти на політичну арену.\n\nПроте історія товариства заплямована впертим інтелектуалізмом. Більшість його членів не бажали ставати політиками бейянського уряду — вони лише критикували чужі плани, не пропонуючи власних альтернатив. Коли маршал У відкинув федералізм, товариство обірвало з ним зв'язки, назвавши його «просто мілітаристом». Зрештою, вони втратили віру в бейянський уряд, але відмовилися співпрацювати з південними федералістами, все ще вважаючи, що порятунок Китаю можливий лише через центральну владу."
 qing_flavour_events.110.a: "Молодий і непохитний Ху Ші став причиною власного краху."

 qing_flavour_events.111.t: "Стати дорослим — значить усвідомити"
 qing_flavour_events.111.d: "Дивно, але співпраця між У Пейфу та інтелектуалами десятирічної давнини все ж дала плоди. «Люди зброї» та «люди літер» пів року вели інтенсивний обмін ідеями щодо конституціоналізму, демократії та національного об'єднання. Цей альянс став можливим завдяки особистій дружбі Лі Дачжао та Бая Цзяньву. Спільна любов до Китайської Республіки та її інститутів об'єднала їх.\n\nТовариство «Зусилля», що ненадовго припинило існування у 1923 році, відродилося під керівництвом змужнілого Ху Ші. Він пройшов шлях від впертого інтелектуала з «вежі зі слонової кістки» до прагматика. Зберігши вплив в асамблеї та дочекавшись відновлення республіки, Ху Ші брав участь у написанні конституції та виборі президента. «Самотній ідеаліст» тепер налаштований на реформізм та лібералізм у межах бейянської системи. З проголошенням нової республіки товариство «Зусилля» спрямувало всі сили на розбудову нової ери врядування «добрих людей»."
 qing_flavour_events.111.a: "Цілком приємна людина, коли не поводиться так зверхньо."

 qing_flavour_events.112.t: "Невтішне повернення"
 qing_flavour_events.112.d: "Минуло багато часу відтоді, як у резиденції Веллінгтона Ку востаннє влаштовували чайні вечірки на кшталт тих, що були за часів «кабінету добрих людей» 1922 року. Тоді в цих залах збиралися світила китайської політики, а їхні дискусії обіцяли світле майбутнє.\n\nЯк же Веллінгтон Ку тужив за тими часами, дивлячись на нинішню гнітючу тишу. Жести гостей були незграбними, загартованими роками цинізму; іскра в їхніх очах згасла під смогом реалполітік та важких десятиліть, що випали на долю Китаю. Новий президент запросив їх, сподіваючись знову зібрати старих товаришів під стягом «доброго врядування», але зрозумів, яка прірва між ними утворилася. Жвавих дискусій більше не було — лише вимушені привітання та поверхневі оцінки дрібних питань, аби остаточно не зіпсувати настрій. «Добрі люди» втомилися і більше не вірили йому.\n\nЛише Ху Ші підійшов до нього перед відходом. Але замість порад він лише висловив кілька коротких застережень. Резиденція Веллінгтона знову занурилася в тишу, а президент повернувся до методичної рутини паперової роботи."
 qing_flavour_events.112.a: "Важко втрачати віру."

###- Manchu -###
 qing_coup_events.25.t: "Переправа через Хуанхе"
 qing_coup_events.25.d: "До Імперського палацу надійшли звіти: наші війська досягли Жовтої річки. Розрізнені залоги чжилійців навколо Пекіна не змогли протистояти арміям під проводом Баодіна, а маньчжурські лоялісти генерала Цзайтао допомагали переслідувати відступаючого ворога, що намагався втекти до Лояна. Багато солдатів просто перейшли на наш бік, адже думка про службу в армії без лідера та чіткої політичної підтримки здавалася їм непривабливою.\n\nНаші сили готові розпочати штурм Лояна — старої фортеці У Пейфу, яку зараз обороняють частини під командуванням маршала Ван Чженбіня та генерала Чжан Ціхуана. Захоплення цього міста стане початком кінця для чжилійської кліки."
 qing_coup_events.25.a: "Хай живе Син Неба!"

 qing_coup_events.26.t: "Перемога в Лояні!"
 qing_coup_events.26.d: "Сьогодні вранці з Лояна надійшла телеграма, що підтверджує успішний штурм стін укріпленого міста. Після багатогодинного зосередженого артилерійського обстрілу вірні війська переправилися через річку на імпровізованих баржах під щільним вогнем. Опинившись на березі, вони швидко захопили плацдарм, що дозволило висадити основні сили та розпочати атаку на чжилійський гарнізон.\n\nБої точилися серед стародавніх гротів та храмів, якими всіяне місто, аж поки наші війська не захопили штаб чжилійців. Більшості офіцерів штабу вдалося втекти, але кілька ключових лідерів, як-от Ван Чженбінь, зникли безвісти — ймовірно, вони загинули серед тисяч інших солдатів у палаючому місті. Залишки чжилійських військ у повному безладі розсіялися по навколишній місцевості."
 qing_coup_events.26.a: "Зі взяттям штабу У їхні дні полічені!"

 qing_coup_events.27.t: "Перемога на Півдні!"
 qing_coup_events.27.d: "Останні кілька тижнів ознаменувалися запеклими боями в південних частинах нашої території, охоплюючи Хубей та Шеньсі. Непохитних прихильників маршала У, президента Цао та маршала Вана вистежують і знищують як скажених псів. Кажуть, цивільна інтелігенція Пекіна шокована нашою жорстокістю, але вибір простий: або ми, або чжилійці.\n\nОсобливо лютими були бої на підступах до Уханя, де останні залишки чжилійського командування готуються до відчайдушного опору. Тепер, коли ізольовані гарнізони знищено, ми можемо зосередитися на захопленні цього міста та остаточному розгромі ворога."
 qing_coup_events.27.a: "Останній опір республіки в Ухані? Іронічно."

 qing_coup_events.28.t: "Перемога в Учані!"
 qing_coup_events.28.d: "Під час фінального загального штурму наші сили, підкріплені рядами перебіжчиків-чжилійців, нарешті взяли Ухань. У жорстоких рукопашних сутичках із чжилійськими військами губернатора Сяо цілі квартали міста зазнали руйнувань. Рештки ворожих сил розбиті, багатьох старших генералів захоплено в полон або вбито, решта втекла до сусідніх провінцій.\n\nЗ цією остаточною перемогою ми можемо зосередитися на відбудові країни, рятуючи її як від наслідків нещодавнього конфлікту, так і від десятиліть розгулу корупції, в якій ми жили за часів нездатної республіки."
 qing_coup_events.28.a: "Нарешті перемога!"

 qing_coup_events.29.t: "Ліга процвітання розпускається!"
 qing_coup_events.29.d: "У результаті потрясінь та вимог асамблеї від імені [ROOT.GetLeader], німці нарешті смикнули за мотузки свого голосу в парламенті — Ліги процвітання. Ця нібито незалежна група банкірів та бізнесменів раптово оголосила про саморозпуск, посилаючись на «ворожу атмосферу», а її провідні члени втекли до іноземних легацій.\n\nХоча німецьке посольство залишається в Пекіні, вони відмовляються відповідати на урядові телеграми, фактично ізолювавшись. Схоже, це позбавляє нас будь-якої майбутньої німецької військової та промислової підтримки. Проте народ переважно схвалює цей крок, вихваляючи новий уряд за позбавлення іноземного впливу.\n\nЧастину електорату Ліги процвітання поглинула Кліка політичних наук. Представляючи інтереси середнього класу та ліберальні ідеали, вони знайшли багато друзів серед колишніх членів ліги. Їхній лідер Хуань Фу вже готує нові нападки на зв'язки чжилійців із німцями."
 qing_coup_events.29.a: "Вони нам не потрібні!"

 qing_coup_events.30.t: "Кров у воді"
 qing_coup_events.30.d: "Коли столиця охоплена насильством проти чжилійців та іноземців, стало очевидно, що навіть саме серце Великої Цін здригається. Стерв'ятники на кордонах уже чистять пір'я і пильно спостерігають, маючи на меті знищити центральний уряд при першій нагоді. Якщо ми втратимо пильність, фентянський уряд та його старий маршал неодмінно накажуть вдарити зі Шеньяна, намагаючись захопити прохід Шаньхайґуань, як вони робили це у минулих війнах.\n\nЗа жодних обставин наші люди на кордоні не повинні здригнутися перед лицем фентянських вилазок, інакше вся провінція Чжилі впаде під їхнім натиском."
 qing_coup_events.30.a: "Всі на кордони, старий маршал не має увійти."

 qing_coup_events.31.t: "Наші союзники надсилають допомогу!"
 qing_coup_events.31.d: "Наш шляхетний союзник надіслав нам значну суму грошей, аби допомогти розгромити залишки зрадників-чжилійців, що переховуються на півдні!"
 qing_coup_events.31.a: "Дякуємо!"

 qing_coup_events.32.t: "Вибори в Цін [GetYear] року"
 qing_coup_events.32.d: "Настав час для давно обіцяних виборів, оскільки хаос тимчасового уряду після перевороту нарешті змінився політичною стабільністю. Хоча у виборах беруть участь кілька партій, єдиним реальним претендентом є [ROOT.GetRulingParty], зважаючи на їхні успіхи в реформуванні політики та відновленні величі нації. Хоча лунають звинувачення в корупції, для Китаю це навряд чи новина. Хіба хтось може заперечити, що [ROOT.GetRulingParty] заслуговує на перемогу?"
 qing_coup_events.32.a: "Селяни знову перемагають!"
 qing_coup_events.32.b: "ПМК все ще дбає про найкращі інтереси Китаю."
 qing_coup_events.32.c: "Аристократія доводить свою спроможність."
 qing_coup_events.32.e: "Погляньмо на результати наших багаторічних приготувань."

 qing_coup_events.33.t: "Останні вибори в Цін?"
 qing_coup_events.33.d: "Очевидно, що [ROOT.GetRulingParty] тріумфально подолала всі перешкоди на шляху до об'єднання та реформування Китаю. Їм потрібні були лише ці останні вибори, аби остаточно закріпити свою владу над відродженою Великою Цін!"
 qing_coup_events.33.a: "Китай потребує твердої руки, перш ніж демократія зможе розквітнути."
 qing_coup_events.33.b: "Тільки партія може вести націю!"
 qing_coup_events.33.c: "Дворяни вестимуть Китай ще багато століть!"
 qing_coup_events.33.e: "ТРАК та Іґуаньдао розбудовують доброчесну імперію!"

 qing_coup_events.34.t: "Новий порядок"
 qing_coup_events.34.d: "Після зміцнення режиму ми більше не є партією, з якою треба шукати компроміси; нам мають підкорятися. Це не залишилося непоміченим і в асамблеї: партійні функціонери поза межами [QIE.GetRulingParty] або були змушені замовкнути, або приєдналися до нової владної системи."
 qing_coup_events.34.a: "ТРАК уже схилила коліно."
 qing_coup_events.34.b: "ПМК виявила мудрість, визнавши наше керівництво."
 qing_coup_events.34.c: "Цзунше знає, що співпраця з нами — єдиний шлях до виживання."
 qing_coup_events.34.e: "Асамблея підкоряється нашій владі, а за нею — і Серединна держава!"

 qing_election_events.1.t: "Вибори струсонули асамблею!"
 qing_election_events.1.d: "Після років підготовки завдяки зусиллям Цюй Їнґуана та Джеймса Єна асамблея наповнюється новообраними членами. Після майже 4 років статусу «недогарка» та десятиліть без справжнього народного мандата, нові депутати займають свої місця в Пекіні. Хоча ТРАК здобула впевнену перемогу, для стабільного переходу до демократії може знадобитися ширша коаліція.\n\nПереможці з ТРАК вважають себе єдиною силою, здатною зберегти демократичні цінності в імперії, і прагнуть згуртувати ряди проти будь-яких авторитарних тенденцій.\n\nПартія Цзунше, тим часом, заявляє, що стане надійною «правою рукою» уряду, виводячи країну на світову арену. Наголошуючи на своїх зв'язках та підтримці вітчизняних промисловців, вони обіцяють порядок та процвітання. \n\nНесподівано велику підтримку отримала і партія «Молодий Китай»: їхні заклики до радикальної модернізації та централізації знайшли відгук у провінціях, втомлених від воєн та мілітаристів."
 qing_election_events.1.a: "ТРАК віддаляється від правих, створюючи конституційний фронт!"
 qing_election_events.1.b: "Сформувати коаліцію з Цзунше заради економічного зростання."

 #YCP or no one was allied prior
 qing_election_events.2.t: "Вибори сколихнули асамблею!"
 qing_election_events.2.d: "Після років приготувань завдяки зусиллям Цюй Їнґуана та Джеймса Єна асамблея наповнюється новообраними членами. Після майже 4 років перебування у статусі «недогарка» та десятиліть без справжнього народного мандата, нові депутати займають свої місця в Пекіні. Хоча ТРАК здобула впевнену перемогу, для стабільного переходу до демократії може знадобитися ширша коаліція.\n\nПереможці з ТРАК вважають себе єдиною силою, здатною зберегти демократичні цінності в імперії, і прагнуть згуртувати ряди проти будь-яких авторитарних тенденцій в уряді.\n\nПартія Цзунше була фактично зметена електоратом, якого не цікавлять інтриги вищих верств суспільства. Оскільки Китай стає на шлях модернізації, знать дедалі більше втрачає вплив у умовах справжньої демократії.\n\nНесподівано велику підтримку отримала і партія «Молодий Китай»: їхні заклики до радикальної модернізації та централізації знайшли відгук у провінціях, втомлених від воєн та роздробленості. Вони прагнуть легітимізувати свій успіх, офіційно приєднавшись до владної коаліції, аби державний апарат відповідав їхнім переконанням."
 qing_election_events.2.a: "ТРАК віддаляється від правих, створюючи конституційний фронт!"
 qing_election_events.2.b: "Укладено угоду з ПМК, що обіцяє посилення централізації великої імперії."

 qing_election_events.3.t: "Вибори в Цін [GetYear] року: нова ера в політиці"
 qing_election_events.3.d: "Конституційна реформа отримала схвалення прогресистів, які вихваляють розширення прав та підвищення ефективності уряду; водночас вона задовольнила маньчжурську знать збереженням авторитету імператора. У селах Янь Янчу та Лян Шумін провели успішні кампанії з ліквідації безграмотності, що покращило доступ до освіти та відновило зв'язки між громадами. Сільські реформи також зменшили навантаження на імперську бюрократію через розвиток місцевої автономії. Іронічно, але стратегія децентралізації лише зміцнила згуртованість імперії.\n\nЦей демократичний ренесанс призвів до того, що вплив Цзунше впав до межі політичної нерелевантності. Стара гвардія консерваторів виявилася відірваною від реальності. Останні чотири роки також дали голос новим силам, найгучніша з яких — партія «Молодий Китай» (ПМК). Вони консервативні в питаннях традицій, але наголошують на необхідності масової мобілізації та класової співпраці, де громадянин є фундаментом суспільства. Їхні осередки з'являються всюди, особливо в містах та університетах. Допуск їх до коаліції може посилити нашу підтримку серед міських мас та військових, хоча ми маємо зважати і на продовження відбудови села як основи нації."
 qing_election_events.3.a: "Імперія залишається вірною поточній стратегії розвитку села."
 qing_election_events.3.b: "Молодь допоможе надихнути та перекувати імперію своїм сміливим баченням!"

 qing_election_events.4.t: "Вибори [GetYear] року — вибір бачення для нового Китаю"
 qing_election_events.4.d: "Останні чотири роки були продуктивними для членів коаліції. Асамблея ухвалила низку реформ під гаслом «Новий Китай» — бачення відродження та зцілення після століття спустошення. Проте тепер владні партії починають розходитися у поглядах.\n\nУ селах зусилля Лян Шуміна з реконструкції дають плоди: нові школи випускають фахівців, які повертаються до своїх громад, значно покращуючи якість життя селян. Економічні кооперативи виявилися успішнішими за державні проєкти минулого. Ба більше, створення сільського ополчення допомогло приборкати бандитизм.\n\nПартія «Молодий Китай» також перехопила ініціативу, поширюючи свою платформу масової мобілізації в містах. Мітинги та студентські спілки просувають «плебісцитарну політику» ПМК по всій країні. Кількість членів партії стрімко зросла серед офіцерів національної армії після впровадження нових патріотичних програм у військовій академії Дунбея.\n\nТепер електорат має вирішити: чи відродиться Китай через традиційні села та містечка під егідою ТРАК, чи ПМК створить новий тип політично мобілізованого громадянина у великих містах та армії?"
 qing_election_events.4.a: "ТРАК відродить китайську націю в її сільському серці."
 qing_election_events.4.b: "Новий китайський громадянин ПМК стане фундаментом відродженої нації."

 qing_election_events.5.t: "Картографування електорату"
 qing_election_events.5.d: "У будь-якій демократичній державі важливість представництва важко переоцінити. Те, звідки саме приходять депутати і які групи населення їх обирають — вкрай важлива деталь. Нам доведеться доручити асамблеї ретельно переглянути межі виборчих округів, аби просуватися далі з нашими реформами."
 qing_election_events.5.a: "Асамблея має детально опрацювати це питання."
 qing_election_events.5.b: "Джерримендеринг — цілком нормальна частина демократичного процесу!"

 qing_election_events.6.t: "Потреби виборчої інфраструктури"
 qing_election_events.6.d: "Механіка функціонуючої демократії — складне завдання для такої величезної країни як Китай. По всій землі людей треба поінформувати про їхні права, параметри виборів, кандидатів та місця голосування. Таке масштабне починання вимагатиме від уряду значних інвестицій часу та грошей, аби перетворити високі ідеали на щось корисне для держави."
 qing_election_events.6.a: "Народ потребує доступу до важелів влади."
 qing_election_events.6.b: "Нашу обмежену скарбницю слід зосередити на військових справах."
 qing_election_events.6.c: "Виборчі дільниці стануть оплотами нашої партії."

 qing_election_events.7.t: "Розширення повноважень місцевих асамблей"
 qing_election_events.7.d: "Наразі місцеві асамблеї служать лише ширмою. Якщо надати їм реальну владу в їхніх юрисдикціях, вони зможуть розвантажити переобтяжену бюрократію в Пекіні.\n\nЯкщо ми забезпечили лояльність сільських громад, можна не боятися, що місцева демократія приведе до влади підривні елементи."
 qing_election_events.7.a: "Оголосити вибори до регіональних органів влади на наших територіях."
 qing_election_events.7.b: "Призначити компетентних кандидатів зі столиці для плавного переходу."

 qing_election_events.8.t: "Результати виборчих реформ"
 qing_election_events.8.d: "Десятиліттями Китай намагався впровадити демократію, але всі спроби тонули у корупції, кривавих заколотах або ставали беззубими інструментами в руках правителів. Після року зосередженої роботи Цюй Їнґуан завершує ревізію демократичного процесу. Тепер він може лише спостерігати: чи стануть його зусилля початком чогось величного, чи черговою марною спробою на службі авторитаризму."
 qing_election_events.8.a: "Праця всього життя ще попереду."
 qing_election_events.8.b: "Яке насіння ми посіяли для нашого народу."

 qing_focus_events.13.t: "Статус імператора"
 qing_focus_events.13.d: "З початком реорганізації держави після падіння мерзенної чжилійської кліки асамблея закликає чіткіше закріпити роль монарха в законодавстві. Більшість при дворі вважає, що статус імператора можна зберегти лише за умови суворого невтручання в державну політику. Проте існує і меншість (зокрема послідовники пізнього Кан Ювея), яка вимагає збереження імперських прерогатив на випадок, якщо асамблея зайде в глухий кут."
 qing_focus_events.13.a: "Нам потрібен правитель, що стоїть над політичними чварами."
 qing_focus_events.13.b: "Асамблея повинна мати керівну руку, якщо виникне потреба."

 qing_focus_events.14.t: "Відбудова структури командування"
 qing_focus_events.14.d: "Після чистки верхівки чжилійців наша армія залишилася без чіткого керівництва. Місія реформування лягла на плечі принців Айсін Ґьоро: дядька імператора Цзайтао та його кузена Цзісіна. Це непросто, адже У Пейфу замінив меритократичну структуру дивізій мережею особистих зв'язків. Вони покликали на допомогу Чжан Їньу, колишнього генерала армії Цзінь Янь Сішаня, який спеціалізувався на вишколі офіцерів та партизанській війні. Також залучено Тун Цзісюя, голову імперської гвардії, людину надійну, хоч і без бойового досвіду."
 qing_focus_events.14.a: "Чудово!"

 qing_focus_events.15.t: "Перестановка в Імперському місті"
 qing_focus_events.15.d: "У столиці вирують політичні інтриги такого рівня, якого Пекін не бачив із 1920 року. У вакуумі влади з'являються нові претенденти.\n\nЦзунше, або партія роялістів, складається з маньчжурської аристократії та членів родини Айсін Ґьоро. Вони — найвідданіші прихильники імператора, нагадуючи фракцію часів реставрації Мейдзі.\n\nПартія «Молодий Китай» (ПМК) — головний «джокер». Вони хочуть докорінно змінити концепцію китайської нації-держави, виступаючи за радикальну перебудову суспільства під керівництвом імперії.\n\nТовариство реформ Китайської імперії (ТРАК) — це союз конституціоналістів Сюй Ціня та Руху сільської реконструкції Лян Шуміна. Вони прагнуть продовжити реформи, розпочаті ще за часів Цисі та Зайфена, фокусуючись на традиційних цінностях та розвитку села."
 qing_focus_events.15.a: "Але хто ж вийде переможцем?"

 qing_focus_events.16.t: "Тримка коаліція"
 qing_focus_events.16.d: "Поки реформатори були єдині в бажанні повалити чжилійців, після перемоги вони опинилися в складній ситуації. Загроза з боку Японії та Фентяня змушує їх працювати разом, аби уникнути знищення. Проте кожна група має власні цілі та бачення розвитку армії. Пуї та його радникам потрібна підтримка кожної сторони, але ця лояльність матиме свою ціну..."
 qing_focus_events.16.a: "Це все одно краще, ніж чжилійці."

 qing_focus_events.17.t: "Товариство жовтого піску"
 qing_focus_events.17.d: "На додачу до сил сільської оборони ТРАК, Товариство жовтого піску — езотерична секта, пов'язана з Іґуаньдао — запропонувало приєднатися до нашої армії. Це люті бійці, вірні нашому антиконцесіоністському курсу, проте дехто боїться, що це дасть Іґуаньдао нову можливість для інфільтрації в державні структури."
 qing_focus_events.17.a: "Запропонувати їм місце в армії."
 qing_focus_events.17.b: "Ні, це занадто ризиковано."

 qing_focus_events.18.t: "Надзвичайний уряд"
 qing_focus_events.18.d.zhang: "Активні бої в Пекіні нарешті вщухли: останні залоги чжилійців склали зброю після численних штурмів імператорської гвардії. Друга маньчжурська реставрація перемогла там, де зазнав невдачі Чжан Сюнь. Проте боротьба далека від завершення. Поки в Пекіні панує позірний спокій, по всій імперії продовжуються хаос і насильство.\n\nУсунення Цао Куня та У Пейфу було головною метою змови, і ми майже не замислювалися, що робити далі. Тепер це нехтування вилилося в адміністративний параліч. Ми зламали військово-бюрократичний хребет чжилійців, але тепер не знаємо, як заповнити порожнечу.\n\nНа щастя, ми не одні. Імператор Сюаньтун скликає закриту асамблею змовників та активістів перевороту. Вона має сформувати уряд національного порятунку або надзвичайний кабінет. Три основні групи — партія «Молодий Китай», Товариство реформ Китайської імперії та роялістська партія Цзунше — мають фундаментальні розбіжності щодо майбутнього. Врешті-решт, асамблея мусить підкоритися тому, у кого в руках зброя. У цьому випадку шановний вчитель Чжан Тяньжань відверто зневажає молодь ПМК, тож інші два претенденти борються за його прихильність, обіцяючи сільські реформи або відродження традицій."
 qing_focus_events.18.d.qu: "Активні бої в Пекіні вщухли, і друга маньчжурська реставрація святкує перемогу. Проте нація охоплена паралічем і розвалом армії. Ми зламали стару систему, але ще не побудували нову.\n\nІмператор скликає змовників для формування надзвичайного кабінету. Три групи — ПМК, ТРАК та Цзунше — змагаються за вплив. У цій ситуації вирішальне слово за Цюй Їнґуаном. Хоча він скептично ставиться до програми «Молодого Китаю», губернатор Шаньдуна наразі не став на бік жодного лобі. Він лише прагне якомога швидше завершити формальності, аби розпочати реформування нашої немічної адміністрації."
 qing_focus_events.18.d.yan: "Бої в Пекіні припинилися, і маньчжурська реставрація перемогла. Проте адміністративний хаос загрожує майбутньому держави. У вакуумі влади, залишеному чжилійцями, імператор скликає змовників для створення уряду національного порятунку.\n\nВирішальний голос у асамблеї належить людині з гвинтівкою — Янь Сішаню. Багато хто очікував, що він підтримає ПМК через схожість їхніх програм модернізації Китаю. Проте «зразковий губернатор» поки що зберігає нейтралітет. Подейкують про запеклу залаштункову боротьбу трьох груп за прихильність Яня, але хто вийде переможцем — поки що невідомо."
 qing_focus_events.18.a: "Віддати перевагу партії Цзунше."
 qing_focus_events.18.b: "Віддати перевагу ПМК."
 qing_focus_events.18.c: "Віддати перевагу ТРАК."

 qing_focus_events.19.t: "Падіння Цзунше"
 qing_focus_events.19.d: "Чи то через невдалі політичні маневри, чи то через повну некомпетентність, партія Цзунше була остаточно усунута від впливу на державні справи. Нас знову і знову перегравали в питаннях адміністративної політики, аж поки наші посади не стали суто номінальними. Цей ганебний кінець означає, що нова партія має взяти на себе опіку над імперією — хоча б для того, аби врятувати її від нерозсудливості аристократичних інтриг."
 qing_focus_events.19.a: "Товариство реформ Китайської імперії візьметься за владу серйозніше."
 qing_focus_events.19.b: "Партія «Молодий Китай» точно буде менш некомпетентною."

 qing_focus_events.20.t: "Підозри в симпатіях до Гоміньдану"
 qing_focus_events.20.d: "Поки на півдні триває кампанія Національно-революційної армії, асамблею в Пекіні охопив страх. Представники ПМК та Цзунше відкрито закликають до розправи над підозрюваними ліваками. Хоча до осередків Гоміньдану тисячі миль, справжньою ціллю цієї люті є ТРАК, а саме — Рух сільської реконструкції. Очевидно, що звинувачення у зв'язках із республіканцями — це лише кинджал, спрямований проти внутрішніх опонентів."
 qing_focus_events.20.a: "Стежити за кожним, хто під підозрою."
 qing_focus_events.20.b: "Ретельно розслідувати діяльність Руху сільської реконструкції."
 qing_focus_events.20.c: "Ретельна чистка убезпечить імперію."

 qing_focus_events.21.t: "Внесок Іґуаньдао"
 qing_focus_events.21.d: "Завдяки шановному вчителю династія Цін відновлює свій авторитет серед народу. Чжан Тяньжань дедалі наполегливіше намагається зблизити двір із культом Іґуаньдао. В обмін на призначення вірян на державні посади, Іґуаньдао обіцяє ще відданішу службу імператору. Поки держава стає залежною від культу, можливо, і культ стане залежним від держави."
 qing_focus_events.21.a: "Робоча сила для наших інфраструктурних проєктів була б украй корисною."
 qing_focus_events.21.b: "Нам слід провести другу коронацію, аби показати народу відданість справі відродження."
 qing_focus_events.21.c: "Перетворити ополчення на постійні іррегулярні сили в складі армії."
 qing_focus_events.21.e: "Народ має спокійно знати, що імператор захистить його."

 qing_focus_events.22.t: "Нова коронація"
 qing_focus_events.22.d: "Серед цінської знаті шириться ідея проведення другої коронації Пуї. Вони стверджують, що реставрація 1927 року під наглядом чжилійців не була «належною», і для дотримання традицій потрібна нова церемонія. Вартість буде приголомшливою, але це може додати нам легітимності та зміцнити підтримку дворянства."
 qing_focus_events.22.a: "Організувати церемонію!"
 qing_focus_events.22.b: "Влаштувати масштабне святкування в столиці!"

 qing_focus_events.23.t: "Династії прибувають"
 qing_focus_events.23.d: "Протягом останніх днів до Пекіна прибули маркіз Розширеної благодаті, герцог Міньшен та інші нащадки старих імператорських династій. Один за одним вони проходять повз імператора, мовчки вклоняючись на знак пошани. Придворний фотограф фіксує кожну таку покору; ці знімки стануть пропагандою, що підтвердить легітимність Пуї та підірве будь-яку підтримку інших шляхетних родин."
 qing_focus_events.23.a: "Чудово!"

 qing_focus_events.24.t: "Наш новий благодійник"
 qing_focus_events.24.d: "Після смерті У Пейфу майбутнє нашого уряду було непевним. Проте тепер мілітарист, який допоміг повалити чжилійців, вирушає до Пекіна, де ми очікуємо розкриття його планів..."
 qing_focus_events.24.a: "Вітаємо губернатора Яня в Пекіні!"
 qing_focus_events.24.b: "Вітаємо губернатора Цюя в Пекіні!"
 qing_focus_events.24.c: "Вітаємо шановного вчителя Чжана в Пекіні!"

 qing_foreign_policy_events.49.t: "Війна в Сіньцзяні"
 qing_foreign_policy_events.49.d: "У Сіньцзяні спалахнула громадянська війна! [KUM.GetLeader] просить нашої допомоги у боротьбі проти [SIK.GetLeader]. Кумульське ханство, останній спадкоємець Монгольської імперії, було вірним підданим Цін із XVII століття. Допомога їм в умиротворенні регіону дозволить нам гарантувати їхню підтримку та зберегти їхню автономію. Вірні васали заслуговують на нагороду. Хан чекає на нас на полі бою!"
 qing_foreign_policy_events.49.a: "Відправити війська!"

 qing_foreign_policy_events.52.t: "Цін готується до кампанії з возз'єднання!"
 qing_foreign_policy_events.52.d: "Відсталі невігласи в Пекіні оголосили, що за кілька місяців розпочнуть «кампанію національного умиротворення»! Це тривожна новина; багато хто боїться, що наші союзники по всьому Китаю будуть знищені. [FNG.GetLeader] оголосив, що допоможе будь-якому губернатору, який присягне нам на вірність після того, як ми розгромимо Цін та захопимо Пекін."
 qing_foreign_policy_events.52.a: "Розіслати телеграми!"

 qing_foreign_policy_events.53.t: "[FNG.GetName] обіцяє наш захист!"
 qing_foreign_policy_events.53.d: "Після проголошення [QIE.GetLeader] кампанії з возз'єднання, [FNG.GetLeader] оголосив, що захистить будь-яких вразливих мілітаристів, якщо вони присягнуть йому на вірність після війни. Ми можемо або прийняти цю угоду, або спробувати вистояти самотужки."
 qing_foreign_policy_events.53.a: "Нам потрібен захист."
 qing_foreign_policy_events.53.b: "Ми самі здолаємо цих монархістів!"

 qing_foreign_policy_events.54.t: "[FNG.GetLeader] обіцяє захист мілітаристам!"
 qing_foreign_policy_events.54.d: "Зрадник [FNG.GetLeader] відповів на наш анонс кампанії власною заявою — він захищатиме будь-яких воєначальників від нашої агресії! Хоча це ускладнює війну, люди вже починають сприймати цей конфлікт не просто як міжусобицю, а як боротьбу проти Японії, і палко підтримують армію."
 qing_foreign_policy_events.54.a: "Ми їх розчавимо!"

 qing_foreign_policy_events.55.t: "Цін готує свою кампанію"
 qing_foreign_policy_events.55.d: "Наші колишні союзники в Пекіні оголосили про початок «кампанії національного умиротворення», ціллю якої стане режим [LEP.GetLeader]. Чи варто нам надіслати йому допомогу, аби стримати атаки клану Айсін Ґьоро?"
 qing_foreign_policy_events.55.a: "Надіслати спорядження."
 qing_foreign_policy_events.55.b: "Вони самі впораються з цими дикунами..."

 qing_foreign_policy_events.56.t: "Сінґапур надсилає допомогу!"
 qing_foreign_policy_events.56.d: "Після проголошення кампанії Цін, [GEA.GetLeader] наказав надіслати нам великі партії зброї без жодних вимог щодо повернення коштів. Схоже, вони дуже бояться відродження династії Цін і збираються використати нас як буфер проти них."
 qing_foreign_policy_events.56.a: "Дякуємо!"

 qing_flavour_events.12.t: "Кліка стратегій воюючих царств"
 qing_flavour_events.12.d: "З піднесенням ПМК з'явилася організація «Кліка Чжаньґо це», заснована інтелектуалами, що навчалися в Німеччині. Вони вірять у етатизм, авторитаризм та філософію надлюдини Ніцше, адаптовану до китайських реалій як суміш конфуціанства та ніцшеанства. Вони бачать сучасну історію Китаю як повторення епохи Воюючих царств — жорстокого часу, де слабких поглинають сильні. Створення могутньої нації для них — пріоритет. Групи цієї школи з'являються в університетах і додають легітимності нашому уряду."
 qing_flavour_events.12.a: "Цікаво."

 qing_flavour_events.20.t: "Піднесення Кан Тунбі"
 qing_flavour_events.20.d: "Хоча реформатор Кан Ювей помер у 1927 році, його донька Кан Тунбі успадкувала його геній та політичний талант. Випускниця Барнард-коледжу в Нью-Йорку, вона повернулася до Китаю, аби боротися за права жінок. Оскільки ТРАК набирає ваги, ідеї Кан про розширення прав жінок стають популярними в інтелектуальних колах, хоча й відштовхують консерваторів. Дехто пропонує призначити її міністром як символ спадкоємності ідей її батька та нашої сучасності."
 qing_flavour_events.20.a: "Призначити її в міністерство!"
 qing_flavour_events.20.b: "Нехай продовжує працювати на місцевому рівні."

###- Military -###
 qing_focus_events.11.t: "Нова кров у старій воді"
 qing_focus_events.11.d: "Як і більшість клік мілітаристів по всьому Китаю, чжилійська кліка, попри зовнішню єдність, внутрішньо розколота. Вона розділена на північну (У Пейфу, Цао Кунь, Ван Чженбінь) та південну (Сунь Чуаньфан, Ці Сєюань, Чень Ї) гілки. Навіть усередині них існують фракції: лоянська група маршала У та фракція Цзіньбао, що об'єднує людей Цао та Вана.\n\nЦі групи побудовані на традиційній системі «ґуаньсі», де посади отримують завдяки особистим зв'язкам. Це створює касту «відторгнутих» — талановитих офіцерів без впливових покровителів, як-от Ян Сень у Сичуані чи Тан Сянмін у Хунані. Прагнучи подолати цей застій перед майбутньою війною, військовий теоретик Цзян Байлі звернувся до маршалів із проханням просунути молодих командирів, що відзначилися у боях. Не бачачи причин для відмови, обидва маршали дали свою згоду."
 qing_focus_events.11.a: "Нове покоління кліки."

 qing_focus_events.12.t: "На межі катастрофи"
 qing_focus_events.12.d_republic: "Сонце, що сходить на Сході, давно стало екзистенційною загрозою для Китаю. Захоплення Тайваню, Даляня, анексія Кореї та спроби загарбати Шаньдун у Юань Шикая — апетит японців лише зростає. Тепер вони націлилися на Дунбей, підтримуючи уряд маршала Чжан Цзуоліня. Аби підготувати армію до неминучого зіткнення, маршал У Пейфу скликав нараду провідних тактиків.\n\nЦзян Байлі представив план створення армії виняткових офіцерів, готових до тотальної війни за національне спасіння. Тан Цзайлі натомість пропонує відновити німецький «план 80 дивізій», аби перетворити цінське військо на «сухопутні сили Сходу» з елітним ядром мобільних з'єднань. Генерали Чжан Ціхуан та Юй Сюечжун підтримали Цзяна, тоді як Ван Чженбінь, діючи від імені президента Цао, став на бік Тана — можливо, просто наперекір маршалу У. Проте останнє слово залишається за «нефритовим маршалом»."
 qing_focus_events.12.d_zhili_monarchy: "Японія залишається головною загрозою нашій нації. Після років агресії та анексій вони тепер «підтримують» Чжан Цзуоліня в Дунбеї, чекаючи нагоди для нового кровопролиття. Маршал У Пейфу зібрав військових теоретиків, аби обрати стратегію захисту. \n\nЦзян Байлі пропонує модель «мілітаристського державо-народу» з акцентом на вишколі офіцерів та патріотизмі. Тан Цзайлі ж наполягає на відновленні німецького «плану 80 дивізій» для створення елітних мобільних частин. Хоча генерали схиляються до плану Цзяна, Ван Чженбінь, представляючи інтереси сірого кардинала Цао Куня, виступив за німецьку модель. Тепер маршал У має прийняти доленосне рішення."
 qing_focus_events.12.a: "Подивимось..."

 qing_flavour_events.9.t: "Ліндберг Сходу"
 qing_flavour_events.9.d: "У Китаї ідея авіації завжди була тісно пов'язана з мрією про модернізацію за західним зразком. Віриться, що через відвагу та доступ до технологій Китай зможе звестися на ноги і змагатися на світовій арені. Авіація — це не лише військова міць, а й символ наукового, «сучасного» погляду на світ.\n\nСунь Тунґан, відомий як «Ліндберг Сходу», та Чжан Хуейчан, «китайський Ліндберг», стали іконами цього прогресу. Чжан почав кар'єру ад'ютантом доктора Суня і став національним героєм після перельотів через усю країну. Сунь Тунґан же є плодом нашої особливої співпраці з Німеччиною: він навчався у німецьких авіашколах і здійснив героїчний переліт із Німеччини до Нанкіна на власному літаку «Національне спасіння». Його приїзд особисто вітав президент Цао, а сам пілот став улюбленцем преси."
 qing_flavour_events.9.a: "Авіація врятує націю!"

###- Економіка -###
 qing_focus_events.32.t: "Тяньцзіньська конференція"
 qing_focus_events.32.d: "Події в Пекіні розвивалися стрімко: місто, що було центром країни, охопили антинімецькі заворушення. Проте новий уряд таємно запропонував Берліну зближення в обмін на визнання втрати впливу. Пекін обіцяє захищати приватні інвестиції та права Німеччини у Ціндао та Вейхайвеї в обмін на економічну допомогу проти Японії та скорочення боргів.\n\nПереговори тривали до глибокої ночі. Зрештою, китайським делегатам вдалося переконати німців погодитися на компроміс щодо величезного боргу, накопиченого Великою Цін за останнє десятиліття. Тепер слово за верховним комісаром у Сінгапурі."
 qing_focus_events.32.a: "Ми врятували своє становище; японці не заберуть у нас Китай."
 qing_focus_events.32.b: "Вони хочуть рівноправного договору? Ні за що."

 qing_focus_events.33.t: "Результати Тяньцзіньської конференції"
 qing_focus_events.33.d: "Останні місяці Пекін вирував від антинімецьких настроїв, але нам вдалося зберегти ключові зв'язки. Наш надзвичайний уряд запропонував Німецькій імперії угоду: вони допомагають нам фінансово та військово проти Японії, а ми гарантуємо безпеку їхніх інвестицій та портів. \n\nНаші делегати змогли переконати німецьких представників піти на поступки щодо державного боргу, уникнувши відкритого дефолту пекінської скарбниці. Наші умови були прийняті."
 qing_focus_events.33.a: "Ми заклали міцний фундамент для майбутньої довіри з Кайзеррайхом."
 qing_focus_events.33.b: "Ми змогли використати народний гнів, аби вибити набагато вигіднішу угоду."

 qing_focus_events.34.t: "Відновлення німецьких інтересів"
 qing_focus_events.34.d.republic: "Поки відносини з Німеччиною стабілізуються, бізнес-еліти прагнуть відновити зв'язки, але тепер на рівних умовах. Ми маємо діяти обережно, аби народ не сприйняв нас як маріонеток Берліна. Зараз є дві пропозиції: повернення радників Люфтштрайткрафте для роботи з нашими ВПС або вигідний контракт із Siemens на виробництво електрообладнання в межах бейянських бюро."
 qing_focus_events.34.d.manchu: "Ділові кола обговорюють відновлення зв'язків між Серединною державою та Райхом на паритетних засадах. Проте політичний клімат надто крихкий — залучення німців може відштовхнути інтелектуалів та молодих підприємців. З огляду на це, ми маємо утриматися від нових економічних угод з Німеччиною, доки це не стане вигідно нам знову."
 qing_focus_events.34.a: "Контроль над небом гарантує перемогу."
 qing_focus_events.34.b: "Підписати контракти з Siemens."
 qing_focus_events.34.c: "Принаймні економічна ситуація для громадян покращується."

 qing_focus_events.35.t: "Привілейований партнер на Сході"
 qing_focus_events.35.d_zhili: "Після років гнітючих боргів режим нарешті стабілізував економіку. Міжнародні кредитори тепер дивляться на Пекін прихильніше. Німецький бізнес пропонує нові угоди, сподіваючись заробити на зростанні китайського ринку. Це підтвердило далекоглядність фракції Цзіньбао Цао Куня, яка зберегла зв'язки з Німеччиною попри протести. Навіть маршал У неохоче визнає, що німецьке спорядження докорінно змінило ситуацію на полях боїв."
 qing_focus_events.35.d_manchu: "Наш уряд стабілізував фінанси, і тепер іноземні партнери знову готові до співпраці. Німецькі компанії за згодою Берліна пропонують інвестиції в нашу економіку, що розвивається. Це стало перемогою для концесіоністів в асамблеї, які наполягали на збереженні зв'язків із Німеччиною. Навіть принц Пуцзє визнає перевагу німецької зброї та техніки."
 qing_focus_events.35.a: "Німецькі досягнення в аеронавтиці дадуть нам перевагу в бою."
 qing_focus_events.35.b: "Тісні зв'язки з Siemens-Schuckert забезпечать нам стрімкий індустріальний злет."

###- Foreign Policy -###
 qing_foreign_policy_events.22.t: "Ці приймає наш запит!"
 qing_foreign_policy_events.22.d: "Згуртувавшись під закликом Північної Чжилійської кліки, маршал ліги Ці відповів на наші телеграми надзвичайно красномовно. Хоча він набагато менш надійний за Сунь Чуаньфана в питаннях єдності чжилійців, він прийняв наше скромне прохання про допомогу. Обіцяючи всю міць ліги, як військову, так і економічну, він відправляє своїх солдатів на північ для боротьби з віроломним [FNG.GetNameDef]."
 qing_foreign_policy_events.22.a: "Розкол між Північчю та Півднем подолано!"

 qing_foreign_policy_events.23.t: "Ці відхиляє наш запит!"
 qing_foreign_policy_events.23.d: "Цей клятий Ці Сєюань відмовився воювати на нашому боці, довівши, що він нічим не кращий, а фактично гірший за Сунь Чуаньфана у ставленні інтересів кліки понад усе. Його заяви про те, що питання «внутрішньої безпеки» важливіші за допомогу центральному уряду, в кабінеті міністрів, а також маршалами У та Ваном сприймаються як цілковита нісенітниця.\n\nПоки маршал Ван ледь не вимагає війни на два фронти, аби упокорити ще й південних чжилійців, президент Цао намагається вгамувати пристрасті. Делегація Ліги процвітання запевняє, що німці в Пекінській комісії вже тиснуть на маршала ліги, аби «заохотити» його до втручання."
 qing_foreign_policy_events.23.a: "Бути гіршим за Суня? Це справді вражає."

 qing_foreign_policy_events.101.t: "Ян Сень тримається!"
 qing_foreign_policy_events.101.d: "Попри всі прогнози, Ян Сень вийшов переможцем у сичуанській боротьбі за владу, спрямувавши провінцію у спокійніші води, хоча вона все ще потерпає від голоду та опіумної кризи. Цю рідкісну добру новину вітають У Пейфу та керівництво чжилійців, сподіваючись, що Ян не забув роки підтримки і знову поверне західну провінцію під стяг Пекіна.\n\nПроте, оскільки його департамент озброєнь розділений між ним та амбітним Лю Цуньхоу, нашому колишньому союзнику доведеться обережно маневрувати на мінному полі лояльностей мілітаристів, аби втримати владу."
 qing_foreign_policy_events.101.a: "Як і очікувалося, звісно..."

 qing_foreign_policy_events.103.t: "Повстання у Фуцзяні!"
 qing_foreign_policy_events.103.d: "Хоча більшість світу вважала, що Гоміньдан було знищено у 1927 році, маршал ліги Сунь весь цей час вів партизанську війну низької інтенсивності з рештками ГМД у районі Фуцзяня. Звіти цензурувалися, тож навіть У Пейфу та Цао Кунь не усвідомлювали справжніх масштабів конфлікту.\n\nЗ нинішнім хаосом у лізі залишки Національно-революційної армії знову заявили про себе, проголосивши нову кампанію національного об'єднання! Вони назвали наш законний уряд нелегітимним, обзиваючи нас «німецькими маріонетками та рабами Берліна». Нам залишається сподіватися, що рештки сил Суня зможуть придушити цих зрадників.\n\nЯкщо ж ні, то захоплення прибуткових територій ліги радикальною революційною партією-державою стане серйозною перешкодою для нашого врядування. Маршал Ван Чженбінь уже готує оборонні заходи на випадок їхнього наступу."
 qing_foreign_policy_events.103.a: "Ми розбили вас одного разу, зробимо це знову."

 qing_foreign_policy_events.104.t: "Хунань виходить зі складу ліги!"
 qing_foreign_policy_events.104.d: "Провінція Хунань потрапила під вплив Сунь Чуаньфана під час хаосу після Північного походу 1927 року. Губернатор Чжао Хенці повернув контроль над регіоном після короткого періоду правління ГМД. Хоча дехто в чжилійському таборі вважає його чужинцем через федералістські симпатії, Чжао є давнім другом маршала У.\n\nПопри це, У подбав про те, аби попередній губернатор Тан Сянмін отримав особисту вотчину в Юеяні, місті на кордоні Чжилі та Хунані. З розпадом ліги Чжао зайняв нейтральну позицію, але вона не може тривати довго. З оголошенням виборів губернатора хмари над його правлінням починають згущуватися."
 qing_foreign_policy_events.104.a: "Будь напоготові, адмірале Тан."

 qing_foreign_policy_events.105.t: "Іґуаньдао захоплює Шаньдун!"
 qing_foreign_policy_events.105.d: "Езотерична міленаристська секта Іґуаньдао, за повідомленнями, захопила владу в провінції Шаньдун, усунувши конкурентів, включаючи Цюй Їнґуана та Чжан Цзунчана. Хоча спершу була пересторога, що секта посіє хаос на наших землях, гору взяв тверезий розсуд: Іґуаньдао — це лише черговий культ смерті, нездатний повалити центральний уряд.\n\nКульт ізольований, і щойно ситуація на півдні стабілізується, ми зможемо атакувати їх, назавжди вичистивши цю заразу з китайської землі. Маршал Ван уже неохоче звернувся до У Пейфу для обговорення планів наступу."
 qing_foreign_policy_events.105.a: "Ви серйозно?"

 qing_foreign_policy_events.106.t: "Чжан Цзунчан захоплює повний контроль над Шаньдуном!"
 qing_foreign_policy_events.106.d: "Посада губернатора Шаньдуна завжди була жаданою. За неї билися кліки Аньхой, Чжилі та Фентянь, але жоден правитель не був таким жахливим, як Чжан Цзунчан. Непередбачуваний, жорстокий і розпусний, Чжан підтримує тісні зв'язки з Чжан Цзуолінем із фентянської кліки.\n\nСкориставшись розпадом ліги та хаосом на півдні, він відкинув усю владу чжилійців у провінції. Сьогодні вранці його прикордонники обстріляли наших податківців, а шпигуни повідомляють, що Цзунчан уже почав масові чистки чжилійських чиновників, перетворюючи провінцію на пекло розпусти.\n\nГірше того, він отримав повну підтримку Чжан Цзуоліня та японців. Маршал Ван уже готує плани, аби раз і назавжди вибити цього божевільного з Шаньдуна."
 qing_foreign_policy_events.106.a: "Будь ти проклятий, «генерале собаче м'ясо»!"

 qing_foreign_policy_events.107.t: "Чжан Цзунчан повалений!"
 qing_foreign_policy_events.107.d: "Сьогодні президент Цао та кабінет отримали офіційні телеграми про те, що Чжан Цзунчан був вигнаний об'єднаними силами Цюй Їнґуана, залишків його військ та місцевої бюрократії. Поміркований реформатор Цюй Їнґуан не є повноправним членом внутрішнього кола чжилійців, але він принаймні не ворожий до нас.\n\nГубернатор Цюй пообіцяв підтримувати авторитет центрального уряду. Мешканці Шаньдуна можуть нарешті зітхнути з полегшенням, не боячись викрадень чи вбивств посіпаками Чжана. Кажуть, старий маршал Чжан Цзуолінь у Шеньяні лютує, втративши не лише провінцію, а й одного зі своїх довірених соратників."
 qing_foreign_policy_events.107.a: "Нарешті хоч якісь добрі новини!"

 qing_foreign_policy_events.108.t: "Громадянська війна в Сичуані!"
 qing_foreign_policy_events.108.d: "Провінція Сичуань, що давно потерпає від міжусобиць та браку продовольства, знову стала ареною боротьби регіональних вождів. Ян Сень, давній гравець у Червоному басейні та союзник У Пейфу, правив провінцією завдяки хиткому альянсу з іншими кліками.\n\nОднак цей баланс порушився: лоялісти Гоміньдану, прихильники федералізму та звичайні авантюристи почали діяти після мобілізації Промислового корпусу Лю Сяна проти адміністрації Яна. Сам Ян поки не просив допомоги у Пекіна, запевняючи, що це лише бандитизм. Багато хто в штабі чжилійців, включаючи маршалів У та Вана, перебуває в стані підвищеної готовності, чекаючи на неминучий заклик про допомогу."
 qing_foreign_policy_events.108.a: "У Ченду немає ніякої війни."

 qing_foreign_policy_events.109.t: "Лянґуан стає вільним!"
 qing_foreign_policy_events.109.d: "Лянґуан, або Два Ґуани — об'єднання провінцій Ґуансі та Ґуандун — довгий час був перлиною півдня та полем бою між амбіціями північних та південних чжилійців. Зараз він розколотий між віцекоролем Лу Юйґуаном (підтримуваним північчю), мером Кантона Чень Ляньбо та губернатором Шень Хун'їном (підтримуваним півднем).\n\nЗ погіршенням зовнішньої ситуації віцекороль Лу Юйґуан оголосив про вихід Лянґуана зі складу Ліги восьми провінцій. Цей крок відображає загальне невдоволення на півдні. Оскільки заява була одразу оскаржена Шенем, очевидно, що Лянґуан чекають власні внутрішні проблеми."
 qing_foreign_policy_events.109.a: "Ось і розкололася перлина дельти річки."

 qing_foreign_policy_events.110.t: "Чжао Хенці перемагає на виборах у Хунані"
 qing_foreign_policy_events.110.d.zhili: "Особистий друг «нефритового маршала», Чжао Хенці, зміг знову забезпечити собі посаду губернатора через легітимні та чесні вибори. Це доводить, що демократія в Китаї можлива, але створює труднощі для центру. Чжао не є відкритим ворогом, але й не є прямим союзником. Він прагне нейтралітету, але якщо федералісти проголосять національний уряд, він неодмінно приєднається до них.\n\nПроте вплив Гоміньдану в провінції все ще відчутний через радикалізацію нижчих класів. Якщо Чжао не втримає ситуацію, наш союзник Тан Сянмін може втрутитися. Або ж, якщо Чжао не знайде підтримки серед інших федералістів, він може повернутися до нас."
 qing_foreign_policy_events.110.d.manchu: "Чжао Хенці, давній друг покійного маршала У, знову став губернатором Хунані через демократичні вибори. Для імператорського двору це жахлива ситуація. Чжао — затятий революціонер-антимонархіст, він не є другом нам чи нашим союзникам. Найімовірніше, він підтримає федералістів, якщо вони створять альтернативний уряд.\n\nПроте в провінції не все гладко: Гоміньдан залишив після себе радикальне підпілля, що прагне скинути Чжао. Він не зможе кинути виклик двору самотужки. Крім того, присутність сил чжилійців у Юеяні під командуванням Тан Сянміна посилюється через потік біженців, що робить ситуацію на кордоні вкрай напруженою."
 qing_foreign_policy_events.110.a: "Делікатна гра, губернаторе Чжао."
 qing_foreign_policy_events.110.b: "Прокляті республіканці!"

 qing_foreign_policy_events.111.t: "Гоміньдан захоплює владу в Хунані!"
 qing_foreign_policy_events.111.d.zhili: "Жахливі новини дійшли до «нефритового маршала»: разом із повстаннями в зоні МіньҐань, Гоміньдан захопив ще більше територій. Попередній губернатор Хунані, Чжао Хенці, наївно повірив, що зможе провести вільні вибори, і поплатився за це. Програвши об'єднаному фронту лівого та правого Гоміньдану, він пішов із політики. Це неприпустимо, адже гоміньданівці затято ненавидять чжилійців і неодмінно захочуть помсти.\n\nПроте ми все ще маємо сили в Хунані: Юань Цзуміна та, що важливіше, командувача Юеянського гарнізону Тана Сянміна. Тан розлючений перемогою Гоміньдану і просить матеріальної допомоги для контрудару. Він обіцяє, що зброя гарантує вірність Хунані чжилійцям. Незалежно від нашої відповіді, Тан Сянмін все одно піде на Чаншу, тож, можливо, нам і не доведеться платити."
 qing_foreign_policy_events.111.d.manchu: "Поки двір і уряд перебувають у сум'ятті, проблеми виникають по всій країні. Після розпаду ліги гоміньданівські генерали Тан Шенчжі та Чен Цянь одночасно вдерлися до Хунані. Чжао Хенці сподівався на демократичні вибори, але його принципи стали його ж поразкою: Гоміньдан здобув посаду губернатора. Гірше того, попри наш переворот у Пекіні, осередки чжилійців усе ще існують. Генерал Тан Сянмін, тісно пов'язаний із колишнім режимом, готує власний переворот проти Гоміньдану. Одне можна сказати точно: Хунань нам не друг."
 qing_foreign_policy_events.111.a: "Тан Сянмін отримає свою зброю."
 qing_foreign_policy_events.111.b: "Ми не можемо йому нічого дати."
 qing_foreign_policy_events.111.a.manchu: "Вічна скалка в нашому оці."

 qing_foreign_policy_events.112.t: "Тан Сянмін захоплює Чаншу!"
 qing_foreign_policy_events.112.d: "З Чанші надходять повідомлення: ґамбіт генерала чжилійців Тана Сянміна вдався. Відбивши провінцію у ворогів, він призначив свого брата, Тана Хуалуна, очільником цивільної адміністрації. Тан Хуалун відомий зв'язками з демократами Лян Цічао та Джеймсом Єном, тож є надія, що він стримуватиме мілітаристський запал брата. Тан уже готує план створення «комісії оборони» для винищення гоміньданівців та синдикалістів. Хунань знову в руках чжилійців."
 qing_foreign_policy_events.112.a: "Цього разу ви себе виправдали!"

 qing_foreign_policy_events.113.t: "Тан Сянмін відбитий"
 qing_foreign_policy_events.113.d: "Спроба Тана Сянміна захопити Чаншу та скинути губернатора [HNN.GetLeader] провалилася. Офіційно Пекін заявляє, що генерал діяв на власний розсуд, але за зачиненими дверима командування лютує. Тан дивом вижив і знову клянеться у вірності чжилійцям, обіцяючи спокутувати провину службою. Тан — здібний генерал і адмірал, але чи варто нам приймати на службу такого невдаху?"
 qing_foreign_policy_events.113.a: "Він спокутує поразку своєю службою."
 qing_foreign_policy_events.113.b: "Він нам не потрібен."

 qing_foreign_policy_events.114.t: "Тан Сянмін прибуває"
 qing_foreign_policy_events.114.d: "Тан Сянмін, який мав наглядати за сумнівним губернатором Чжао Хенці, проґавив момент, коли той зміцнив владу. Чжао відправив війська, аби вибити Тана з Юеяна. Після коротких боїв Тан був змушений евакуюватися і втекти через кордон. Тепер він та його люди прибули до [FROM.Capital.GetCapitalVictoryPointName], аби знову стати під наші стяги. Чи варто приймати того, хто провалив свою єдину місію?"
 qing_foreign_policy_events.114.d.zhao: "Тан Сянмін не зміг стримати Чжао Хенці і був вигнаний з Юеяна після зіткнень із федералістами. Тан прибув до нас, пропонуючи свої мечі. Проте Чжао вже надіслав телеграму, запевняючи у своїй вірності уряду та звинувачуючи Тана в дестабілізації. Оскільки Чжао підтримав нас у скрутну хвилину, ми маємо підстави йому вірити. Що робити з Таном: використати його досвід чи відправити у відставку?"
 qing_foreign_policy_events.114.a: "Тан спокутує провину своєю службою."
 qing_foreign_policy_events.114.b: "Він нам не потрібен."

 qing_foreign_policy_events.115.t: "Лю Сян захоплює Ченду!"
 qing_foreign_policy_events.115.d: "На наше розчарування, лідер Промислового корпусу Лю Сян розбив сили нашого союзника Яна Сеня. Зв'язок із Яном перервався, його доля невідома. До кордонів Хубею прибувають натовпи біженців, приносячи з собою відлуння краху чжилійців у Сичуані. У Ченду Лю Сян святкує перемогу, виганяючи наших ставлеників. Проте він успадкував провінцію, роздерту десятиліттями війн. Наші стратеги впевнені, що ми зможемо розчавити Лю, якщо він кине нам виклик."
 qing_foreign_policy_events.115.a: "Армія з власною провінцією?"

 qing_foreign_policy_events.116.t: "Баодінські армії беруть владу!"
 qing_foreign_policy_events.116.d: "Хоча сили Лю Сяна розпалися, Ян Сень через невдачі на початку війни був змушений дедалі більше покладатися на баодінську групу Ден Сіхоу. Зрештою Яна відсторонили від влади, а більшість його людей дезертирувала. Ян покинув Сичуань, залишивши її в руках тріумвірату Дена та Лю Веньхуея. Вони планують модернізацію, але навряд чи будуть лояльні до центрального уряду."
 qing_foreign_policy_events.116.a: "Переворот у всьому, крім назви..."

 qing_foreign_policy_events.117.t: "Департамент офіцерів усуває Яна!"
 qing_foreign_policy_events.117.d: "У хаосі сичуанської війни перемогу здобув Департамент офіцерів — коаліція залишків Гоміньдану та федералістів під проводом Сюн Кеу. Наш союзник Ян Сень вигнаний, його місцеперебування невідоме. Нова влада проголошує ідеї самоврядування округів та політизації армії, що вороже Пекіну. Якщо вони об'єднаються з іншими повстанцями, на південному заході знову виникне потужний антибейянський блок."
 qing_foreign_policy_events.117.a: "Радикалізм несе лише хаос..."

 qing_foreign_policy_events.118.t: "Чемпіон федералізму в Хунані"
 qing_foreign_policy_events.118.d: "Після відновлення контролю над півднем колишній друг маршала У прибув до Лояна. Завдяки заступництву Чжан Ціхуана, Чжао Хенці уникнув арешту за службу ворогу. З втомленою посмішкою він привітав У Пейфу, висловивши надію, що це було останнє братовбивство. На подив маршала, Чжао запропонував свою допомогу новій республіці. Він вірить, що повалення монархії відкриває шлях до справжніх реформ, і хоче працювати разом із чжилійцями."
 qing_foreign_policy_events.118.a: "«Вітаємо з поверненням до нашої республіки, старий друже»"

 qing_foreign_policy_events.119.t: "Амбіції Тана Сянміна"
 qing_foreign_policy_events.119.d_president: "Адмірал Тан Сянмін взяв під контроль Ґуанчжоу, закріпивши Південь за нами і за собою. Він зажадав нагороди від президента Цао. Було вирішено призначити його генерал-інспектором провінцій Хунань, Ґуандун та Ґуансі. Також він очолив Політичну раду Південно-Західного Китаю. Це допомагає убезпечити наш фланг, але ми маємо стежити, аби Тан не став новим Сунь Чуаньфаном. Поки ж святкуємо: «перлина півдня» знову наша, об'єднання Китаю вже зовсім близько."
 qing_foreign_policy_events.119.d_retired: "Адмірал Тан Сянмін взяв Ґуанчжоу і звернувся за нагородою не до президента, а до відставного Цао Куня в Баодіні. Цао використав свої зв'язки, аби призначити Тана генерал-інспектором південних провінцій. Тан став головою Політичної ради Південно-Західного Китаю. Це вигідно для стабільності, але його амбіції можуть стати проблемою в майбутньому. Тим не менш, завдяки королю Баодіна, «нефритовому маршалу» та генерал-інспектору, об'єднання майже завершене."
 qing_foreign_policy_events.119.a: "Надішліть генерал-інспектору наші вітання!"

 qing_foreign_policy_events.120.t: "Залізна рука в Хунані"
 qing_foreign_policy_events.120.d_intro: "Відтоді як Тан Сянмін став губернатором Хунані, його правління було жорстким. Розчавивши Гоміньдан, адмірал-губернатор зосередив усю владу у своїх руках. Навіть після зникнення загрози він відмовився скасовувати воєнний стан, посилаючись на «тіні ворогів». Це викликало обурення в Пекіні: товариство «Зусилля» та навіть Цзян Байлі засудили «м'ясника Хунані» як дрібного автократа."
 qing_foreign_policy_events.120.d_CERA: "$qing_foreign_policy_events.120.d_intro$\n\nТРАК, зокрема Китайська конституційна партія, засудила Тана Сянміна та його брата Тана Хуалуна. Через це хунанське відділення партії відокремилося від пекінського центру."
 qing_foreign_policy_events.120.d_CCP: "$qing_foreign_policy_events.120.d_intro$\n\nКитайська конституційна партія засудила Тана Сянміна та його старшого брата. У результаті хунанське крило партії оголосило про повний розрив із Пекіном."
 qing_foreign_policy_events.120.a: "«Кому вони вірні? Братерству чи нації?»"

 qing_foreign_policy_events.121.t: "«Червоний адмірал» Хунані?"
 qing_foreign_policy_events.121.d: "Тан Сянмін нарешті скасував воєнний стан і оголосив вибори. Його брат Тан Хуалун привів хунанських конституціоналістів до його коаліції. Результатом стала нищівна перемога: коаліція Тана здобула абсолютну більшість. Конституціоналісти в Пекіні привітали це як повернення до закону, але Ху Ші виступив із різкою критикою. Він назвав ці вибори фарсом, вказавши на грубе втручання «комісії оборони» Тана. Губернатор Тан проігнорував звинувачення, лише подякувавши Цао Куню за підтримку."
 qing_foreign_policy_events.121.a: "«Конституційний лад чи ширма для легітимності?»"

 qing_foreign_policy_events.132.t: "[QIE.GetNameDefCap] йде на нас!"
 qing_foreign_policy_events.132.d: "За даними нашої розвідки в [QIE.Capital.GetCapitalVictoryPointName], уряд [QIE.GetNameDef] планує остаточно нас розгромити. Дотримуючись політики «об'єднання через підкорення», сили центру збираються на наших кордонах. Ця битва вирішить долю нашого виживання."
 qing_foreign_policy_events.132.a: "У нас мало часу на підготовку."

 qing_foreign_policy_events.134.t: "[FROM.GetName] просить про допомогу!"
 qing_foreign_policy_events.134.d: "Надійшли новини: наші союзники в [FROM.GetNameDef] під загрозою атаки [QIE.GetName]! Армії Пекіна мобілізуються для швидкого об'єднання нації. Вони грізний ворог, але разом ми зможемо дати їм відсіч."
 qing_foreign_policy_events.134.a: "Маємо готуватися!"

 qing_foreign_policy_events.145.t: "Кінець Уханського уряду [QIE.GetName]"
 qing_foreign_policy_events.145.d: "Рішення [QIE.GetName] перенести столицю до Уханя не врятувало їх. Країна знову визнає столицею Пекін. Проте об'єднання Учана, Ханькоу та Ханьяна в один мегаполіс уже неможливо скасувати — ці міста за десятиліття зрослися воєдино. Чи варто зберегти цей єдиний адміністративний район, чи краще розділити міста знову?"
 qing_foreign_policy_events.145.a: "Нехай так і буде."
 qing_foreign_policy_events.145.b: "Розділити три міста."

 qing_foreign_policy_events.146.t: "Час повертатися до Пекіна"
 qing_foreign_policy_events.146.d: "Після нашої перемоги час повернути столицю до Пекіна. Об'єднання міст «триграддя» (Уханя) стало фактом історії. Ми маємо вирішити: залишити Ухань єдиною адміністративною одиницею чи розділити його на окремі міста перед початком великої війни."
 qing_foreign_policy_events.146.a: "Нехай так і буде."
 qing_foreign_policy_events.146.b: "Розділити три міста."

 qing_flavour_events.14.t: "Прибув генерал-вигнанець із [QIE.GetNameDefCap]"
 qing_flavour_events.14.d: "Цей офіцер прийшов із охопленого хаосом Пекіна. Його кліка розпалася, і він прибув до нас, прагнучи помсти та слави. Важко сказати, чи він щирий, але в ці часи зрадництва кожен досвідчений командир на вагу золота. Чи варто приймати його на службу?"
 qing_flavour_events.14.a: "Нам потрібна вся можлива допомога."
 qing_flavour_events.14.b: "Ні, він може бути небезпечним."

 qing_foreign_policy_events.150.t: "Чжилійська кліка прагне глибших зв'язків"
 qing_foreign_policy_events.150.d: "Після об'єднання Китаю та перемоги над Японією, Пекінська комісія повідомляє про бажання чжилійців оновити відносини з Берліном. Веллінгтон Ку пропонує економічну угоду: послаблення торговельних бар'єрів та масивні спільні інвестиції в спеціальні економічні зони на узбережжі. Стабільний і об'єднаний Китай може стати надійним арбітром наших інтересів на Сході на рівних умовах."
 qing_foreign_policy_events.150.a: "Звісно, це буде взаємовигідно."
 qing_foreign_policy_events.150.b: "Вони звертаються до нас? Смішно!"

 qing_foreign_policy_events.151.t: "[FROM.GetName] приймає пропозицію"
 qing_foreign_policy_events.151.d: "Німці оцінили вигоду і підтримали нашу угоду. Це більше не «недоговір» із заляканою династією, а союз рівних. Дракон і Орел разом творять новий світовий порядок! Німецькі бізнесмени вже прибувають до наших економічних зон. План Цао Куня з розбудови нації нарешті втілюється в життя."
 qing_foreign_policy_events.151.a: "Все стає на свої місця..."

 qing_foreign_policy_events.152.t: "[FROM.GetName] відмовляє"
 qing_foreign_policy_events.152.d: "Німецький орел знову плюнув нам в обличчя, фактично виставивши наших дипломатів за двері. Всі пропозиції щодо рівноправної співпраці розірвані. Схоже, німці бачать у нас лише пішаків для свого світового порядку. Навіщо тоді була вся ця допомога?"
 qing_foreign_policy_events.152.a: "Допомога? Заради чого все це було?"

 qing_foreign_policy_events.153.t: "Південний флот тікає на північ!"
 qing_foreign_policy_events.153.d: "Колись гордий бейянський флот нині розірваний на частини. Після колапсу ліги доля південної ескадри адмірала У Чженнаня була непевною. Проте вірність флоту виявилася сильнішою за ідеологію: значна частина кораблів прибула до Тяньцзіня. Адмірали Са, Ян та У зустрілися, аби офіційно об'єднати флоти. Це перший крок до відновлення морської могутності Китаю."
 qing_foreign_policy_events.153.a: "Перший крок до подолання розколу."

 qing_foreign_policy_events.154.t: "Люди «усміхненого тигра»"
 qing_foreign_policy_events.154.d: "Ліга восьми провінцій згоріла, а люди Сунь Чуаньфана розсіялися. «Нефритовий маршал» іронізує над невдачами фракції Цзіньбао, але розуміє: наш південно-східний фланг тепер оголений. Проте несподівано до штабу в Лояні прибули важковаговики з оточення Суня — Лю Цзунцзі, Мен Чжаоюе та Сє Хунсюнь. Вони пропонують свої мечі та гвинтівки Північному Чжилі. Маршал Ван у захваті, але вирішальне слово за У Пейфу."
 qing_foreign_policy_events.154.a: "Аби було ясно: тепер ви підкоряєтеся НАМ."
 qing_foreign_policy_events.154.b: "І дозволити гнилі Суня проникнути в наші лави?"

###- Shanxi Mining Chain -###
 qing_foreign_policy_events.24.t: "Виявлено багату жилу!"
 qing_foreign_policy_events.24.d: "Наше нещодавнє зосередження на видобутку копалин у регіоні Шаньсі принесло плоди: виявлено величезні поклади мінеральних багатств. Ми захопили цю спірну територію у губернатора Яня під час останньої війни, і вона вже приносить чималий прибуток. Наші інженери щойно знайшли нову жилу вугілля та залізної руди. Проблема лише в тому, що вона простягається під землею на територію, яку контролює [SHX.GetName]. Хоча ми могли б почати розробку, [SHX.GetAdjective] інженери неодмінно помітять це вторгнення.\n\nПісля розпаду ліги Шаньсі провела масштабну економічну перебудову і поки що вороже ставиться до зовнішніх інвестицій. Це стосується і нашого уряду, який вони демонстративно вважають сторонньою силою. Хоча ми посилили свій вплив у провінції, військова окупація східної Шаньсі залишається болючою темою. Губернатор Янь відомий своїми іграми: він нацьковує [FNG.GetLeader] на нас, намагаючись балансувати між двома вогнями в північному Китаї.\n\nПроте ми — законний уряд країни і маємо право розпоряджатися ресурсами Китаю на свій розсуд, особливо коли йдеться про стратегічну сировину для оборони. Прямий видобуток позбавив би нас бюрократичної тяганини, але дехто побоюється, що ескалація не варта можливих наслідків."
 qing_foreign_policy_events.24.a: "Копайте глибоко і жадібно!"
 qing_foreign_policy_events.24.b: "Напевно, ми зможемо домовитися."

 qing_foreign_policy_events.24001.t: "[QIE.GetName] пропонує спільний гірничий проєкт"
 qing_foreign_policy_events.24001.d: "У прагненні до національної самодостатності [QIE.GetName] виявила величезні поклади копалин, частина яких заходить глибоко на нашу територію. Вони пропонують співпрацю між їхніми інженерами та нашими гірниками, можливо, за підтримки іноземних інвестицій, для видобутку вугілля та заліза в провінції Шаньсі. Ми отримаємо те, що вони називають «справедливою часткою», а чистий прибуток обіцяє бути значним для обох сторін.\n\nПроте ми пам'ятаємо, що армія [QIE.GetName] продовжує окупувати нашу законну територію в східній Шаньсі вже майже десятиліття. Вони або відмовлялися платити, або платили мізер за використання багатств цього регіону — гроші, які мали б бути в провінційній скарбниці. Дехто стверджує, що з принципових міркувань ми маємо відхилити будь-яку угоду з Пекіном, доки окупація не припиниться."
 qing_foreign_policy_events.24001.a: "Ми приймаємо цю пропозицію."
 qing_foreign_policy_events.24001.b: "Ми впораємося з видобутком самі."

 qing_foreign_policy_events.24002.t: "Виявлено багату жилу!"
 qing_foreign_policy_events.24002.d: "Наше зосередження на гірничій справі в Шаньсі дало результати: знайдено великі мінеральні родовища. Це збіглося з лібералізацією торгівлі в Шаньсі, що зменшило фінансову ізоляцію провінції після її поразки в четвертій чжилійсько-фентянській війні. Їхній амбітний «десятирічний план» не лишився непоміченим, хоча незрозуміло, чи він справді спрямований на процвітання, чи є інструментом виклику нашій владі.\n\nМи виявили цінну рудну жилу, що веде вглиб території Шаньсі. Відкрита економічна політика Яня дає надію на взаємовигідний проєкт, який значно збільшить видобуток вугілля та заліза для безпеки всієї китайської нації. Це також посилить наш вплив, але все залежить від згоди примхливого [SHX.GetLeader]."
 qing_foreign_policy_events.24002.a: "Напевно, ми зможемо домовитися."
 qing_foreign_policy_events.24002.b: "Краще залишити все як є."

 qing_foreign_policy_events.25.t: "[QIE.GetAdjectiveCap] шахтарі наближаються до території!"
 qing_foreign_policy_events.25.d: "З нашого спірного кордону з [QIE.GetName] надійшли тривожні новини. Наші інженери виявили [QIE.GetAdjective] тунелі, що заходять на нашу територію; потоки іноземних шахтарів та машин вдираються в наші законні володіння. Їх охороняють війська центральної армії — це тяжка образа, яка знову нагадує нам про землі, вкрадені після катастрофічної четвертої чжилійсько-фентянської війни. Тепер вони не лише незаконно збирають прибутки з окупованої східної Шаньсі, а й намагаються загарбати наші родовища в західних горах задля своїх мерзенних цілей.\n\nЦя зухвалість [QIE.GetAdjective] не припиниться, доки ми не заступимося за себе, хоча виступати проти набагато сильнішого противника завжди ризиковано. Проте якщо ми змовчимо, хто знає, якою буде наступна ескалація? Нашим козирем може стати залучення інших зацікавлених сил у регіоні..."
 qing_foreign_policy_events.25.a: "Подати офіційну скаргу."
 qing_foreign_policy_events.25.b: "Поки що вичекаємо."

 qing_foreign_policy_events.26.t: "[SHX.GetNameDefCap] протестує проти наших гірничих робіт!"
 qing_foreign_policy_events.26.intro: "[SHX.GetLeader] подав офіційний протест до Бюро гірничої промисловості, стверджуючи, що наші шахтарі порушили кордони провінції. Його послання містить довгий список скарг, переважно пов'язаних із нашими діями в східній Шаньсі за останні роки. На підкріплення своїх слів він наказав провінційній армії зібратися на кордоні для військових навчань. Це різко загострило напруженість, і ширяться чутки, що він збирається вигнати наших шахтарів силою."
 qing_foreign_policy_events.26.d.fengtian: "$qing_foreign_policy_events.26.intro$\n\nЗазвичай ми б списали це на звичайне позерство або спробу [SHX.GetLeader] вибити чергову виплату, але він також зазначив, що якщо Пекін не вживе відповідних заходів, він шукатиме «відповідальний уряд для вирішення проблеми». Це майже напевно відкрита погроза укласти союз із [FNG.GetLeader] у Фентяні. Це кидає виклик нашому правлінню на півночі та загрожує поновленням війни. Опинившись між двома вогнями, ми все ще маємо шанси перемогти обох, як у 1920-х, проте це залишить наш південний фланг беззахисним перед подіями на півдні."
 qing_foreign_policy_events.26.d.nofengtian: "$qing_foreign_policy_events.26.intro$\n\nЗагибель Чжан Цзуоліня значно зменшила цю загрозу, проте нам все одно варто бути обережними. Шаньсі має багато гір і мало зручних проходів, не кажучи вже про численні річки, що перетинають місцевість. Вторгнення в провінцію у разі ескалації, ймовірно, закінчиться нашою перемогою, але ціною величезних втрачених можливостей на інших фронтах."
 qing_foreign_policy_events.26.a: "Кому яке діло? Продовжуйте видобуток!"
 qing_foreign_policy_events.26.b: "Відступити, стає занадто ризиковано."

 qing_foreign_policy_events.27.t: "[QIE.GetNameDefCap] ігнорує нас!"
 qing_foreign_policy_events.27.d.nofengtian: "Як і очікувалося, [QIE.GetName] проігнорувала наш запит. Їхні віроломні шахтарі продовжують зазіхати на наші мінеральні багатства, ігноруючи скарги та порушуючи укази нашого губернатора. Оскільки наші вимоги було знехтувано, тепер нам вирішувати, чи варто застосовувати силу. Відправити війська в спірні райони, аби вигнати тих, хто працює без дозволу Тайюаня — крок ризикований, але бездіяльність зробить нас слабкими в очах Китаю."
 qing_foreign_policy_events.27.d.fengtian: "$qing_foreign_policy_events.27.d.nofengtian$\n\nІнший варіант — звернутися за підтримкою до [FNG.GetName]. Очолювана амбітним мілітаристом [FNG.GetLeader], кліка Яня вже співпрацювала з ними у 1928 році з катастрофічними результатами, сподіваючись повалити чжилійців у момент їхньої слабкості. Саме так ми і втратили контроль над східною Шаньсі, тому багато хто не бажає знову зв'язуватися з ними. Проте поодинці ми навряд чи зможемо протистояти центральній армії. Все ж перехід на їхній бік означатиме залежність від їхньої допомоги, і якщо вони нас підведуть, нам доведеться капітулювати."
 qing_foreign_policy_events.27.a: "Ми повністю довіряємо [FNG.GetLeader]."
 qing_foreign_policy_events.27.b: "Йти на ескалацію та блокувати видобуток!"
 qing_foreign_policy_events.27.c: "Відступити, це зайшло занадто далеко..."

 qing_foreign_policy_events.27001.t: "Шаньсі блокує наших інженерів!"
 qing_foreign_policy_events.27001.d: "Зухвало кинувши виклик нашій владі, [SHX.GetLeader] розгорнув війська, аби силою перешкодити видобутку в спірному районі східної Шаньсі. Вони конфіскували цінне обладнання, відмовившись визнавати наші дозволи, заарештували багатьох шахтарів, а інших змусили тікати до наших позицій. Оскільки наші гарнізони намагаються дати відсіч, Шаньсі дедалі більше нагадує зону бойових дій.\n\nЧерез шалену напруженість інвестори налякані та відкликають фінансування. Дороги та залізниці забиті втікачами, а наш персонал відмовляється працювати в таких небезпечних умовах. Здається, наші економічні інвестиції вже втрачено, але це не має пройти дарма.\n\nЗа таких обставин ми можемо звинуватити [SHX.GetLeader] та його поплічників у заколоті, повстанні та низці інших злочинів проти держави. Ордер на арешт можна підготувати миттєво. Якщо він хоче забезпечувати виконання своїх «указів», то ми неодмінно забезпечимо виконання наших."
 qing_foreign_policy_events.27001.a: "Вони заплатять за свою зухвалість."
 qing_foreign_policy_events.27001.b: "Вони довели свою позицію, ми відступимо."

 qing_foreign_policy_events.28.t: "[QIE.GetNonIdeologyNameDefCap] відступає!"
 qing_foreign_policy_events.28.d: "Зіткнувшись із нашою рішучою позицією та боячись ескалації, [QIE.GetNameDef] тихо відступила. Їхні шахтарі та інженера покинули нашу територію, залишивши нас переможцями в цій суперечці. Прихильники Пекіна в Тайюані замовкли, боячись нашої відплати, поки ми утверджуємо свою владу над усією провінцією. Звісно, це палиця з двома кінцями: інвестори, лояльні до Пекіна, та міжнародні конгломерати тепер з острахом дивляться на нашу бунтівну провінцію.\n\nПроте це не має затьмарювати нашої радості. Ми здобули велику перемогу над самовпевненим центральним урядом без жодного пострілу. Ба більше, завдяки вже проробленій роботі шахтарів, ми тепер можемо самі користуватися багатствами Шаньсі як законні власники."
 qing_foreign_policy_events.28.a: "Чудово!"

 qing_foreign_policy_events.29.t: "Шаньсі відступає!"
 qing_foreign_policy_events.29.d: "Перед лицем нашої сили [SHX.GetLeader] наказав своїм людям скласти зброю, а [SHX.GetName] — відмовитися від претензій на видобуток у східній Шаньсі. Це дозволило нашим шахтарям безперешкодно отримати доступ до цінних копалин не лише у спірному районі, а й фактично по всій провінції. Це велика перемога: ми забезпечили стратегічні ресурси для нашої воєнної машини на шляху до об'єднання Китаю. Статус [SHX.GetLeader] як національної постаті підірвано; він принижений і змушений визнати нашу перевагу. Рано чи пізно його доведеться повністю приборкати, але сьогоднішня перемога — це перший крок до повернення Шаньсі в лоно імперії."
 qing_foreign_policy_events.29.a: "Чудово!"

 qing_foreign_policy_events.30.t: "Гірнича криза в Шаньсі!"
 qing_foreign_policy_events.30.d: "Те, що починалося як дрібна сварка за ресурси, швидко переросло у серйозну кризу на кордоні Шаньсі та [QIE.GetName]. Це дає нам і ризик, і можливість втрутитися в конфлікт у північному Китаї. Наприкінці невдалого Північного походу Чжан Цзуолінь уклав таємний пакт між Фентянем та коаліцією союзників, включаючи Янь Сішаня.\n\nСпроба розгромити чжилійців провалилася, і Шаньсі постраждала найбільше: східна частина провінції з її запасами вугілля та заліза була окупована [QIE.GetAdjective] військами з 1928 року. Пекінське керівництво, здається, стало занадто жадібним, що знову загрожує балансу сил на півночі.\n\n[SHX.GetLeader] просить нас втрутитися і гарантувати цілісність його кордонів. Хоча ми не в найкращих стосунках, присутність його армій на заході загрожує контролю чжилійців над Баодіном, Лояном та Сіанем. Географія Шаньсі зручна для оборони, але їм бракує промисловості. Якщо ми дамо їх розтоптати, перемогти [QIE.GetName] буде набагато важче. З іншого боку, втручання ставить під удар нашу репутацію і може бути несвоєчасним."
 qing_foreign_policy_events.30.a: "Час втрутитися!"
 qing_foreign_policy_events.30.b: "Ми не готові."

 qing_foreign_policy_events.31.t: "[FNG.GetNonIdeologyNameDefCap] втручається"
 qing_foreign_policy_events.31.d: "У хвилину розпачу [FNG.GetLeader] прийшов нам на допомогу. У гострому посланні до [QIE.Capital.GetName] він пообіцяв гарантувати наші кордони від зазіхань [QIE.GetAdjective] агентів, стверджуючи, що будь-який законний уряд Китаю має поважати провінційну автономію. Хоча відданість Чжан Цзуоліня федералізму сумнівна, його військова міць — ні. Якщо [QIE.GetName] продовжуватиме порушувати наші кордони, він обіцяє прийти на допомогу, погрожуючи війною на два фронти для вже розтягнутої [QIE.GetAdjective] армії."
 qing_foreign_policy_events.31.a: "Чудово!"

 qing_foreign_policy_events.32.t: "[FNG.GetNonIdeologyNameDefCap] захищає Шаньсі!"
 qing_foreign_policy_events.32.d: "Схоже, [SHX.GetLeader] не жартував щодо звернення до Фентяня — [FNG.GetLeader] щойно оголосив, що захищатиме «провінційну цілісність» Шаньсі від будь-яких «вторгнень заколотників». Це зрада найвищого рівня і ще одна ознака того, що наш національний порядок рухнув.\n\nЙого здатність виконати погрозу, однак, під питанням. Фентянська кліка має безліч власних проблем і не обов'язково прагне великої війни. Невідомо, наскільки японська допомога покращила їхнє становище порівняно з нашим розвитком за останнє десятиліття. Ми вже перемагали об'єднані сили Фентяня та Шаньсі в минулому.\n\nПроте було б нерозумно недооцінювати труднощі війни на два фронти, особливо стежачи за ситуацією на півдні. Відповідь на блеф Фентяня — ризикована гра. Але відступ зараз зробить нас слабкими і спровокує ворогів на нові дії. Нація чекає на наше остаточне рішення."
 qing_foreign_policy_events.32.a: "Відповісти на блеф — ввести війська!"
 qing_foreign_policy_events.32.b: "Це занадто ризиковано. Відступити."

 qing_foreign_policy_events.33.t: "Сутички на кордоні!"
 qing_foreign_policy_events.33.d: "Здається, дурні в Пекіні не дослухалися до голосу розуму! Вони почали вводити свої війська в спірні райони, обстрілюючи наші підрозділи. Вже надходять повідомлення про ізольовані сутички між прикордонниками та [QIE.GetAdjective] військами; війна неминуча. Поки наші люди займають позиції на лінії фронту, ми маємо негайно звернутися до [FNG.GetLeader] по допомогу! Разом ми не лише зупинимо наступ так званої центральної армії, а й, якщо пощастить, покінчимо з [QIE.GetName] раз і назавжди!"
 qing_foreign_policy_events.33.a: "Кликати [FNG.GetLeader] на допомогу!"

 qing_foreign_policy_events.34.t: "Сутички на кордоні Шаньсі та [QIE.GetNonIdeologyName]!"
 qing_foreign_policy_events.34.d: "Схоже, [QIE.GetAdjective] проігнорували наші погрози! Повідомлення з [SHX.Capital.GetName] свідчать, що передові загони [QIE.GetAdjective] увійшли на спірні території та атакували прикордонні залоги. Всупереч очікуванням, [SHX.GetAdjective] армія втримала позиції — принаймні поки що. Забезпечені якісними гвинтівками та артилерією з Тайюаня і спираючись на знання місцевості, вони не побігли одразу, що дає надію на успіх.\n\nЦе може бути шанс, на який ми чекали — можливість помститися за приниження 1928 року! Поки дивізії [QIE.GetAdjective] відволікаються на спробу захопити Тайюань, ми можемо штурмувати Пекін і з'єднатися з [SHX.GetAdjective] силами. Очі нації прикуті до нас."
 qing_foreign_policy_events.34.a: "Виконати зобов'язання. До бою!"
 qing_foreign_policy_events.34.b: "Відступити. Ми ще не готові їх перемогти..."

 qing_foreign_policy_events.35.t: "[FNG.GetNonIdeologyNameDefCap] атакує!"
 qing_foreign_policy_events.35.d: "Наша спроба відповісти на блеф Чжан Цзуоліня провалилася — він почав мобілізацію і офіційно оголосив нам війну! Опинившись в оточенні з двох сторін, ми маємо покладатися на оборону вздовж річки Дай, кращий вишкіл та ресурси, аби виснажити [FNG.GetAdjective] наступ. Тим часом [SHX.GetAdjective] армія навряд чи становитиме велику загрозу сама по собі, хоча довга лінія фронту з ними зв'яже чимало наших дивізій. Якщо ми хочемо повторити перемогу 1928 року, нам доведеться діяти розумно й хоробро. Зараз ми б'ємося за набагато більше, ніж просто шахти — ми б'ємося за долю нації."
 qing_foreign_policy_events.35.a: "Війська до бою!"

 qing_foreign_policy_events.36.t: "[FNG.GetNonIdeologyNameDefCap] відступає!"
 qing_foreign_policy_events.36.d: "Наш план відповісти на блеф [FNG.GetLeader] вдався! Після введення військ ми нічого не почули від його уряду, тож тепер можемо вільно діяти в провінції Шаньсі. Армії [SHX.GetName] в хаосі, оскільки змушені захищатися самотужки. Все ж, маючи за спиною гори та річки, вони чинитимуть опір.\n\nМи беззаперечно виграли битву за східну Шаньсі, але чи варто переслідувати розбиту [SHX.GetAdjective] армію далі на захід? [SHX.GetLeader] запропонував низку економічних та політичних поступок в обмін на мир. Радикальні елементи нашого уряду вимагають знищити зрадника Яня раз і назавжди, але обережні міністри попереджають, що затяжна війна в горах Шаньсі зробить нас вразливими в майбутньому."
 qing_foreign_policy_events.36.a: "Легка здобич!"
 qing_foreign_policy_events.36.b: "Ми дали [SHX.GetNameDef] урок, який вони не забудуть."

 qing_foreign_policy_events.37.t: "[FNG.GetName] відступає!"
 qing_foreign_policy_events.37.d: "Зрадник [FNG.GetLeader] підвів нас! Попри прохання про допомогу, він проігнорував нас перед обличчям агресії [QIE.GetAdjective], залишивши на поталу долі. Не маючи вибору, [SHX.GetLeader] поспіхом підготував низку пропозицій: ми обміняємо частину автономії на мир. Після нашої спроби об'єднатися з Фентянем у нас немає іншого шляху, окрім як сподіватися, що Пекін прийме ці умови."
 qing_foreign_policy_events.37.a: "Прокляття!"

###- Eyes on the Border Event Chain -###
 qing_foreign_policy_events.90.t: "Пекін виглядає слабким"
 qing_foreign_policy_events.90.d: "Оскільки режим у Пекіні зосереджує все більше сил на півдні та заході, він став надто глухим до наших військ, розгорнутих прямо за кордоном у Маньчжурії. Минуло кілька днів, і певні ініціативні підрозділи просунулися через кордон, який колись суворо охоронявся. Не зустрівши майже ніякого опору з боку дезорганізованих і деморалізованих [QIE.GetAdjective] сил, що постраждали від нещодавніх чисток через політичну нестабільність у столиці, авангард швидко осмілів. Польові офіцери, прагнучи слави, рушили вперед без консультацій із керівництвом, і за лічені дні наш прапор тріумфально замайорів над Шаньхайґуанем — критично важливим проходом у Великому китайському мурі.\n\nКоли звістка про наш наступ поширилася, [QIE.GetAdjective] відступ швидко перетворився на втечу. Траншеї та укріплення на раніше добре захищеному кордоні були покинуті без бою. Ми переслідували ворога до річки Дай, поки в Шеньяні не спалахнули регіональні протести, а в нещодавно захопленому Ціньхуандао не розпочалися залізничні страйки. Після цього наші старші офіцери повернули контроль над ситуацією, вирішивши стабілізувати позиції вздовж природного фронту, аніж ризикувати контрударом заради сумнівної переваги."
 qing_foreign_policy_events.90.a: "Ми стали на крок ближче до Пекіна!"

 qing_foreign_policy_events.91.t: "Ми здригнулися в Шаньхайґуані"
 qing_foreign_policy_events.91.d: "Поки війна на заході та півдні не приносить перемоги новому уряду, наш головний суперник на півночі нарешті зробив свій хід. Солдати Фентяня просунулися вперед, не зустрівши опору, оскільки ми були занадто слабкі, щоб протистояти їм. Ми принизливо втратили прохід Шаньхай (Шаньхайґуань), а отже, і символічно важливий Великий китайський мур. Гарнізон на кордоні, недоукомплектований та позбавлений мотивації, занепав духом і втік перед наступом ворога, здавши цінні передові позиції без жодного пострілу.\n\nНам дуже пощастило, що річка Дай виявилася занадто великою перешкодою для Північно-східної армії, щоб вона могла продовжити наше приниження, і наші генерали зуміли відновити порядок на іншому березі. Проте інцидент сильно підірвав моральний дух, і тамтешні командири благають про підкріплення, щоб запобігти повторенню катастрофи. Вони попереджають, що річка Дай зможе стримувати амбіції [FNG.Capital.GetCapitalVictoryPointName] лише певний час, і з якою б загрозою ми не зіткнулися на Центральних рівнинах, вона не зрівняється з небезпекою втрати Пекіна."
 qing_foreign_policy_events.91.a: "Маньчжури не оминули увагою цю іронію."

 qing_foreign_policy_events.92.t: "Міст на річці Дай"
 qing_foreign_policy_events.92.d: "Попри наш звитяжний вхід через прохід Шаньхай (Шаньхайґуань) у Великому мурі та їхню повну втечу до річки Дай, [QIE.GetAdjective] верховне командування не поспішає визнавати свою поразку. Чи то через поганий зв'язок і загальну некомпетентність, чи то через вперте бажання знищити Ґоміньцзюнь на Центральних рівнинах, їхня реакція була неповороткою та неефективною — вони залишили величезні прогалини на березі річки, яка стала природним кордоном.\n\nХоча наше власне командування було задоволене результатом і не хотіло просуватися далі, розвідувальні загони виявилися амбітнішими. Невдовзі вони натрапили на численні слабко захищені (а в деяких випадках і зовсім залишені без нагляду) точки переправи, і плацдарми були швидко захоплені. Це перетворилося на шалені перегони офіцерів, кожен із яких прагнув першим заявити про досягнення Пекіна. Коли люди нарешті дісталися околиць міста, місцева поліція із запізненням відкрила вогонь з укріплених позицій, змусивши їх зупинитися. Побоюючись надмірного розтягнення сил, штаб наказав припинити наступ. Оскільки Пекін тепер знаходиться в зоні прямої видимості з нового фентянського кордону, залишається лише чекати, коли великий маршал накаже захопити його."
 qing_foreign_policy_events.92.a: "Ця поразка — шлях до багатьох перемог."

 qing_foreign_policy_events.93.t: "Пекін у небезпеці!"
 qing_foreign_policy_events.93.d: "Попри катастрофічну втрату проходу Шаньхай (Шаньхайґуань) у Великому мурі та повну втечу наших військ до річки Дай, наше верховне командування, схоже, не поспішає усвідомлювати масштаб поразки. Чи то через проблеми зі зв'язком, чи то через зацикленість на знищенні Ґоміньцзюня на Центральних рівнинах, наша реакція була повільною — ми залишили річку Дай, наш природний рубіж, майже без захисту.\n\nОчевидно, не задовольнившись природним розмежуванням територій, розвідувальні загони Фентяня прозондували місцевість і знайшли кілька слабко охоронюваних переправ. Зустрівши мінімальний опір, вони створили плацдарми, що дозволило відновити бойові дії. Почався хаотичний кидок ворога на Пекін, який знову змусив наших солдатів тікати. На щастя, на самих околицях Пекіна підрозділи місцевої поліції змогли організувати останній рубіж оборони, а артилерійський вогонь фентянців, схоже, помилково накрив їхні власні наступаючі загони. Це дозволило нашим людям перегрупуватися. Хоча ми втратили багато землі в цьому раптовому наступі, столиця все ще тримається. Принаймні поки що."
 qing_foreign_policy_events.93.a: "Якщо ми переможемо ще в одній такій битві, ми остаточно загинемо."

###- Actual Flavour -###
 qing_flavour_events.10.t: "Біженка з Нью-Йорка"
 qing_flavour_events.10.d: "Едіт Кліффорд Вільямс, американська художниця, письменниця та бібліотекарка, тривалий час листувалася з Ху Ші після їхньої зустрічі в Колумбійському університеті Нью-Йорка. Вона справила величезний вплив на розвиток політичної думки Ху, і подейкують (хоча це й не підтверджено), що вони недовго були коханцями.\n\nНа сьогодні вони обмінялися понад 150 листами. Вважається, що саме під впливом Вільямс та авангардного мистецтва Ху Ші почав обстоювати використання байхуа (розмовної мови) як мови літературного самовираження в Китаї.\n\nБудучи чи не єдиною людиною в молоді роки Ху, яка могла заперечити його жорстким політичним і соціальним поглядам, вона, безперечно, посідає особливе місце в його серці. Хоча Ху наполягає, що його численні вірші про кохання були лише літературними вправами, важко не помітити схожість їхнього об'єкта з Едіт.\n\nТепер, коли Америку охопила катастрофа громадянської війни, Вільямс знову написала Ші, просячи притулку та статусу біженки. Ху, природно, погодився. Попри роки відчуження, почуття Ху до Едіт не згасли, і, можливо, часте листування розпалить їх знову в обох?"
 qing_flavour_events.10.a: "Закохані, розлучені й знову зведені долею."

 qing_flavour_events.11.t: "Хоумуу дін"
 qing_flavour_events.11.d: "Археологічні розкопки поблизу Аньяна, провінція Хенань, виявили масивну бронзову жертовну посудину часів династії Шан. Вважається, що це найбільший стародавній бронзовий виріб у світі; його відкриття відсвяткували як визначну перемогу китайської культури та історії.\n\nНапис на посудині, що читається як «Королева У», вчений Чжан Фен інтерпретував як «Симу У». Прямокутний за формою, цей «дін» ширший і має товстіші стінки порівняно з попередніми знахідками. Кожна сторона прикрашена зображеннями істот із мордами тварин та одноногих драконів.\n\nВважається, що це жертовний триніжок Фу Цзін, головної дружини правителя У Діна з династії Шан. Однак через загрозу війни з Японією археологи знову закопали саркофаг, сподіваючись, що після усунення загроз національній цілісності Китаю вони зможуть безпечно виставити його в музеї для подальшого вивчення."
 qing_flavour_events.11.a: "Велика перемога китайської культури!"

 qing_flavour_events.28.t: "Падіння Лояна"
 qing_flavour_events.28.d: "Після тривалої боротьби стародавні стіни Лояна впали під натиском сил [FROM.GetName]. Місто багато років слугувало штаб-квартирою У Пейфу, і лише за кілька годин до падіння останні урядовці, вірні «нефритовому маршалу», евакуювалися на броньованих авто, забравши з собою секретні папери та плани війни. Більшість населення також втекла, знаючи про неминучий штурм, а ті, що залишилися, сховалися, аби перечекати бурю.\n\nТепер місто практично пусте і палає — тінь колишньої величі та символ нашої відчайдушної боротьби за виживання."
 qing_flavour_events.28.a: "Лоян буде відомщений!"

 qing_flavour_events.50.t: "Щоденник «аналітичного центру»"
 qing_flavour_events.50.d: "Бай Цзяньву часто сприймається колегами-інтелектуалами як відщепенець і звичайна тінь «нефритового маршала», зрадник «людей слова». Проте щоденник Бая, написаний його власною рукою, малює образ суперечливої людини, що розривається між вірою в У Пейфу та дружбою з Лі Дачжао чи Ху Ші. Записи, що ведуться з 1915 року, дають чудову можливість зазирнути в думки «малого аналітичного центру У».\n\nНавчання на вченого, вступ до Тунменхою, спостереження за розпадом республіки — ці події молодості сформували його філософію. На відміну від сучасників, Бай пішов на службу до У Пейфу, ставши посередником між маршалом та інтелектуалами товариства «Зусилля» чи синдикалістами Лі Дачжао під час залізничного страйку. Він документував свої зусилля з нещадною самокритикою, жаліючись на брак дисципліни, самотність та втому. Коли У Пейфу тимчасово втратив владу у 1924-му, Бай перестав писати, повернувшись до пера лише під час смерті батьків та двох своїх дітей.\n\nБай зазначає, що інтелектуальна зрілість лише навчила його філософськи приймати постійні невдачі. Вірний слуга У Пейфу має продовжувати працю, адже весь Китай потребує навичок Бая Цзяньву. Зрештою, найбільше він ненавидить не самого себе, а пусті розмови без негайних дій."
 qing_flavour_events.50.a: "Він сам собі найсуворіший критик."

 qing_flavour_events.51.t: "Погляд на теоретика"
 qing_flavour_events.51.d: "Те, що Цзян Байлі є еклектичним мислителем, не дивує нікого, хто його знає. Сліди його інтелектуальних пошуків можна знайти всюди: від навчальної поїздки з Лян Цічао Європою до роздумів про ідеї Цай Е щодо «народної держави» та загальної мобілізації. Проте ніщо не викликає такого гніву «нефритового маршала», як участь Цзяна в написанні провінційної конституції Хунані.\n\nОстання праця генерала під назвою «Японці: погляд іноземця» намагається вивести формулу всеосяжного характеру японської раси. Цзян ділить світ на «північну» (тверезу та релігійну) та «південну» (пристрасну та енергійну) культурні сфери, закінчуючи зловісним попередженням про цивілізаційну боротьбу. Книга стала об'єктом висміювання в багатьох інтелектуальних колах, проте знайшла прихильників серед тих, кого надихнув заклик Цзяна до тотальної боротьби."
 qing_flavour_events.51.a: "Можливо, він має рацію?"

 qing_flavour_events.52.t: "Питання вірності"
 qing_flavour_events.52.d: "Досить дивно бачити маршала Ван Чженбіня на його нинішній посаді, враховуючи, що одним із його головних вчинків була зрада чжилійської кліки під час пекінського перевороту 1924 року. І все ж він тут — третя за впливовістю людина в кліці та військовий лідер фракції Цзіньбао. Глибший аналіз показує, що його зрада десятирічної давнини була продиктована не жадобою, а безмежною вірністю Цао Куню.\n\nПознайомившись із Цао ще в чині підлеглого, Ван швидко став його близьким соратником. Разом з У Пейфу вони сформували тріумвірат, що домінував у Китаї. Проте через короткі зв'язки Вана з монархістами у 1912 році, переконаний республіканець У завжди відчував до нього огиду. Ван воював і проливав кров за чжилійців повсюди: проти армії захисту республіки, проти Чжан Сюня, у Хунані та у війнах проти клік Аньхой та Фентянь.\n\nВін воював наперекір У Пейфу. Після перемоги над Аньхоєм У позбавив війська Вана фінансування. Перед війною з Фентянем Ван намагався домовитися про мир, що У використав як привід для усунення його з нарад, звинувативши у шпигунстві. Навіть коли Ван допоміг Цао стати президентом, особисто викравши печатку у Лі Юаньхуна, У лише посміявся, відсторонивши Вана від командування дивізією."
 qing_flavour_events.52.a: "Єдина людина, якої боявся У Пейфу."

 qing_flavour_events.53.t: "Нащадок Тяньцзіня"
 qing_flavour_events.53.d: "Гірше того, маршал Ван терпів ненависть від решти підлеглих Цао. Номінально будучи губернатором провінції Чжилі, реальну владу він мусив ділити з Цао Жуєм. Втрачаючи військовий вплив і потерпаючи від постійних цькувань У Пейфу, Ван ставав дедалі запеклішим. Він почав співпрацювати з незадоволеними офіцерами Тяньцзіня та Баодіна, а згодом і з Фен Юйсяном, аби усунути У від влади.\n\nВан кілька разів просив Цао про відставку, але той щоразу вмовляв його залишитися. Коли під час другої чжилійсько-фентянської війни У відмовив Вану у коштах на армію, це стало останньою краплею. Союз Вана та Фен Юйсяна приніс плоди: пекінський переворот змусив У Пейфу тікати, а Цао Куня — опинитися під арештом. Саме Ван, зі сльозами на очах, благав свого патрона піти з посади президента, аби врятувати життя.\n\nПісля низки зрад з боку інших генералів Ван опинився у вигнанні в Тяньцзіні. Але після реставрації чжилійської кліки у 1928 році Цао Кунь, бажаючи відновити стару дружбу, запросив Вана назад. Той скептично погодився, прийнявши титул маршала та посаду військового міністра, аби посилити позиції Цао проти впливу У Пейфу."
 qing_flavour_events.53.a: "«Краще померти, ніж жити як свиня чи собака»."

 qing_flavour_events.54.t: "Обід маршалів"
 qing_flavour_events.54.d: "Після розгрому Гоміньдану та Аньціна маршал Ці Сєюань вийшов переможцем у війні за спадщину Сунь Чуаньфана. Він негайно запевнив Пекін у своїй вірності. На відміну від складних стосунків У Пейфу з Сунем, з Ці у маршала не було таких суперечок. У Пейфу прийняв клятву Ці, а президент Цао визнав його владу над лігою, запросивши до Пекіна на зустріч.\n\nПід час приватної вечері Ці Сєюань палко запевняв У Пейфу, що кожна його перемога над зрадником Чень Тяоюанем була здобута в ім'я маршала. Проте У з тривогою помітив, що план Ці щодо відбудови Східного Китаю базується на тісній співпраці з Німецькою імперією. Ці розлого описував проєкти спільних залізниць для видобутку ресурсів, що мали наповнити скарбницю.\n\nХоча Цао та Сунь мирилися з німецьким імперіалізмом заради допомоги, патріотично налаштований У завжди боявся надмірної залежності від Берліна. Чим більше Ці говорив про німців, тим сильніше зростало роздратування У. Ці пропонував те, що не міг стерпіти навіть «усміхнений тигр». Від люті маршал так сильно стиснув щелепи, що ледь не зламав зуба. Ці помітив це і з посмішкою запитав: «У вас зуб болить, маршале-президенте?»"
 qing_flavour_events.54.a: "Новий маршал ліги може стати більшим тягарем, ніж «усміхнений тигр»..."

 qing_flavour_events.55.t: "Осуд Кліки політичних наук"
 qing_flavour_events.55.d: "Невеликий натовп роззяв зібрався біля національної асамблеї, слухаючи палку промову чоловіка з вогнем в очах. Його слова, сповнені націоналістичного палу, лунали вулицями. Хуан Фу, лідер «Кліки політичних наук», — один із небагатьох представників опозиції, кому дозволено діяти в бейянській системі. Відомий зв'язками з Чан Кайші та братами Чень, він вважається істеблішментом зрадником за участь у перевороті 1924 року.\n\n«Знову Товариство гармонії та їхні чжилійські наглядачі довели свою повну неспроможність керувати нацією! Вони тримаються за владу не заради вас, громадян, а заради своїх благодійників у Берліні! Народ вимагає вигнати іноземних імперіалістів, а що робить кабінет? Вони стають на бік гнилої ліги! Тирана Сунь Чуаньфана! Вони заперечували волю народу в 1927-му, придушивши революціонерів у Ґуандуні, які несли мрію доктора Сунь Ятсена!»\n\nХуан Фу продовжує обстоювати справу Гоміньдану на півночі. Хоча йому дозволили повернутися в політику під час лібералізації, він присвятив кар'єру цькуванню чжилійців. Разом із Ху Ші він створює справжній опозиційний блок, перетворюючи спроби Цао Куня зберегти німецькі зв'язки на справжнє пекло."
 qing_flavour_events.55.a: "Проклятий дволикий щур Гоміньдану!"

 qing_flavour_events.56.t: "Гоміньдан у Бейяні"
 qing_flavour_events.56.d: "Коли «маньчжурський переворот» ледь не знищив республіку, багато хто боявся репресій та воєнного стану. Проте чжилійці обрали шлях реформ, відкрито співпрацюючи з Ху Ші та іншими інтелектуалами. В асамблеї панувала згода, за винятком однієї групи.\n\nСумнозвісна Кліка політичних наук народилася з поміркованих членів Гоміньдану, які відмовилися присягати на особисту вірність Сунь Ятсену. Серед її засновників були такі постаті як Чень Дусю та Чень Цзюнмін. У 1920-х вони мали значний вплив, просуваючи ідеї революційного лібералізму. Хуан Фу став центром цієї сили після краху Північного походу.\n\nДля влади Хуан Фу одночасно зрадник, герой і небезпечний лідер. Він майстерно апелює до середнього класу та пригноблених, влаштовуючи уряду політичні шторми. Проте останнім часом його тон дещо пом'якшав. Замість нищівної критики він та його кліка почали стримано підтримувати деякі дії уряду. В кабінеті не знають, як довго це триватиме, але це свідчить, що навіть радикали цінують наш нинішній курс."
 qing_flavour_events.56.a: "Ти дивна людина, Хуан Фу."

 qing_flavour_events.57.t: "Епітафія третього брата"
 qing_flavour_events.57.d: "Вогонь і сталь поглинули колишні володіння «усміхненого тигра»; війна принесла звичні страждання та натовпи біженців. Поки багато хто поспішав створювати благодійні товариства, всіх вразила постать несподіваного мецената.\n\nМаршал Цао Кунь, попри свій поважний вік та кволість, особисто очолив кампанію зі збору коштів для постраждалих. Він пожертвував значну частину своєї платні, отримавши похвали навіть у закордонній пресі. Газети згадують роботу Цао Жуя, молодшого брата маршала і колишнього губернатора, який колись також керував допомогою при катастрофах. Смерть брата важко вразила старого маршала, змусивши його на певний час відійти від справ.\n\nЩо саме змусило Цао Куня, який колись марнотратно купував голоси депутатів, аби стати президентом, тепер кликати до солідарності з нужденними — знає лише він сам."
 qing_flavour_events.57.a: "«Якби він тільки міг бачити мене зараз...»"

 qing_flavour_events.58.t: "Король шахраїв"
 qing_flavour_events.58.d: "Зали бейянського істеблішменту повні безпринципних людей. Кліки Аньхой та Фентянь готові продати країну японцям заради прибутку. Навіть північні чжилійці не є винятком. Цао Жуй, брат президента, був настільки корумпованим, що накопичив статки у двадцять разів більші, ніж у самого Цао Куня. Бянь Шоуцзін, колишній революціонер, також загруз у хабарництві в стінах асамблеї.\n\nАле всі вони тьмяніють перед величчю міністра фінансів Ван Кеміня. Ван — улюбленець міжнародних та місцевих банкірів. Не маючи великих здібностей до управління, він володіє феноменальною пам'яттю, що дозволяє йому без паперів цитувати бухгалтерські книги. Він накопичив величезні статки.\n\nВан незамінний для уряду, бо вміє діставати кредити у іноземних друзів. Водночас він — колючий та ледачий політик, який полюбляє зверхньо повчати молодших колег, як-от Бая Цзяньву. Попри це, під його наглядом економічна ситуація та стан боргів помітно покращилися, що забезпечує йому незмінну підтримку в асамблеї."
 qing_flavour_events.58.a: "У кожного уряду є свій Люцифер."

 qing_flavour_events.59.t: "Грошовий диявол Бейяна"
 qing_flavour_events.59.d: "Цинічне ставлення міністра Вана, його пронімецька позиція та відверта безпринципність викликають лють у лоянської фракції. Особливо відомий інцидент між Ваном та Баєм Цзяньву, правою рукою маршала У. Якось Бай запросив Вана на вечерю в Пекіні.\n\nПід час трапези Ван, користуючись старшинством, повчальним тоном заявив: «Пане Бай, хоч ви і ветеран чжилійців, вам ще треба повчитися у мене, як справлятися з німцями. Німці... з ними важко. Вони можуть вмить змінити позицію і відмовитися від домовленостей. Вони дуже нечесні, будьте пильні».\n\nПісля вечері Ван прошепотів Баю: «Мені скоро сімдесят, я скоро буду в землі. Мені байдуже, чи вважають мене зрадником. Але подивіться на У Пейфу. Хай сам плутається з німцями, але навіщо тягнути молодь, аби їх теж лаяли зрадниками? Це аморально». Ван вилаяв У Пейфу як зрадника не лише нації, а й власних принципів за потурання концесіям. Приголомшений Бай не знайшов що відповісти, а «грошовий диявол» лише підморгнув і, кульгаючи, вийшов із будинку."
 qing_flavour_events.59.a: "«Надто старий, аби перейматися»."

 qing_flavour_events.60.t: "«Один день як вчитель, все життя як батько»"
 qing_flavour_events.60.d: "Ніхто не підходив на роль імперського наставника Сина Неба краще за сера Реджинальда Флемінга Джонстона. Вчитель і учень разом пройшли крізь буремні часи панування мілітаристів; вони листувалися до самої смерті Джонстона. Його уроки прищепили Пуї цікавість до світу, яка робила стіни Забороненого міста ще нестерпнішими.\n\nБагато чого змінилося відтоді, як Фен Юйсян вигнав Пуї з палацу. Тепер імператор Сюаньтун повернув престол, тоді як над батьківщиною вчителя майорять червоні прапори. Джонстон гідно жив у вигнанні в Гонконзі, але Пуї не міг не помітити в ньому втому та цинізм, породжені участю німців у реставрації 1927 року. \n\nВчитель відійшов у інший світ, а учень залишився. Джонстон заповів своєму колишньому вихованцеві зберегти його прах і колись розвіяти його над невеликим озером у Шотландії, коли монархісти в Канаді відвоюють Лондон у синдикалістів."
 qing_flavour_events.60.a: "Прощавайте, містере Джонстон."

 qing_flavour_events.61.t: "Старі хитрощі благословенної ночі"
 qing_flavour_events.61.d: "Пізно вночі у резиденції Ху Ші задзвонив телефон. Господар, заглиблений у роботу, роздратовано підняв слухавку. Але в цьому дзвінку було щось дивне — звук був різким, а металева ручка здавалася крижаною на дотик.\n\n«Добрий вечір, хто це?» — запитав Ху. Співрозмовник коротко хмикнув і відповів. Ху заціпенів. «Спробуйте вгадати ще раз, мій добрий докторе».\n\nХу не знав, що відповісти. Він та імператор Сюаньтун не були чужими людьми, але останні десять років їхні контакти були суто формальними — У Пейфу дозволяв лише вітання на Новий рік. «Ваша Величносте. Я так розумію, ви погодили цей дзвінок із маршалом У?» — «Певною мірою. Чи зможете ви прибути до Забороненого міста завтра?» \n\nХу був приголомшений. Він бачив занадто багато переворотів, аби повірити у раптову зміну настрою У Пейфу. Але його співрозмовник продовжував: «Охорону, можливо, доведеться посилити, але запевняю вас — ми зможемо обговорити все вільно. Зрештою...»"
 qing_flavour_events.61.a: "«Нефритовий маршал тепер поруч із Нефритовим імператором»."

###- News Events -###
 qing_news_events.1.t: "Президент Цао та маршал У підтримують Аньцін"
 qing_news_events.1.d: "Після смерті маршала Сунь Чуаньфана на початку цього року та подальшого краху авторитету Цін мало хто очікував, що «нефритовий маршал» У Пейфу та президент Цао Кунь, реальні правителі в Пекіні, вдадуться до відкритих воєнних дій. Проте сьогодні вранці дует оголосив про офіційну підтримку провінційного уряду Аньхою під керівництвом [ANQ.GetLeader]. У та Цао давно обтяжувалися німецьким наглядом, встановленим у 1927 році, і їхня підтримка губернатора Ченя продемонструвала світу намір позбутися німецького впливу.\nХоча повне розгортання армії Цін малоймовірне через постійну загрозу нападу фентянців із півночі, обмежені контингенти цінських військ уже мобілізуються, аби знищити ворогів губернатора Ченя та новий національний порядок Пекіна."
 qing_news_events.1.a: "Нефритовий маршал переміг!"
 qing_news_events.1.b: "Фігури починають падати..."

 qing_news_events.2.t: "Президент Цао та маршал У підтримують Нанкін"
 qing_news_events.2.d: "Після смерті маршала Сунь Чуаньфана раніше цього року та подальшого краху авторитету Цін над значною частиною Китаю мало хто очікував, що «нефритовий маршал» У Пейфу та президент Цао Кунь, реальні правителі в Пекіні, вдадуться до відкритих воєнних дій. Проте сьогодні вранці дует оголосив про офіційну підтримку провінційного уряду Нанкіна — залишків старої Ліги восьми провінцій.\n\nНімецькі дипломати та стратеги, безперечно, зітхнули з полегшенням, адже військова підтримка чжилійців для нового маршала ліги, [LEP.GetLeader], може стати вирішальним фактором у його війні як проти відродженого Гоміньдану, так і проти провінції Аньхой, яка орієнтується на Фентянь і, відповідно, на Японію."
 qing_news_events.2.a: "Тільки вперед, королю Баодіна!"
 qing_news_events.2.b: "Німецький порядок в Азії ще може встояти."

 qing_news_events.3.t: "Імперський переворот"
 qing_news_events.3.d: "Подробиці неясні, але після ймовірного перевороту в Забороненому місті сьогодні вранці з'явився імператор Пуї у супроводі свого брата Пуцзє.\n\n«Імператор щойно уникнув замаху на своє життя з боку чжилійських щурів!» — гучно заявив принц групі репортерів, поки Пуї стояв нерухомо — чи то безтурботно спокійний, чи то паралізований страхом. «У, Цао та їхні посіпаки отруювали нашу країну останні три десятиліття! Смерть чжилійцям!» Через кілька хвилин було помітно, як бездиханні тіла У та Цао завантажують у віз, без сумніву, для поховання у братській могилі. Мрія сіньхайських революціонерів може бути остаточно розтоптана."
 qing_news_events.3.a: "Хай живе імператор!"
 qing_news_events.3.b: "Черговий переворот у Китаї?"

 qing_news_events.4.t: "Невдалий переворот у Пекіні!"
 qing_news_events.4.d_1: "Подробиці неясні, але після ймовірної спроби перевороту в Забороненому місті сьогодні вранці з'явився маршал У Пейфу з підв'язаною рукою, проте з гордою поставою. Спускаючись сходами, він зупинився на кілька слів із репортерами, що поспішили на місце подій, поки зв'язаного Пуї виводили під охороною солдатів.\n\n«На Цао Куня, демократично обраного лідера Китаю, та на мене вчинили варварський напад бандити імператора, без сумніву, підтримані зовнішніми силами», — почав він, дивлячись прямо в спалахи камер. «Зрозуміло, що ці опозиційні елементи бажали скасувати наш прогрес, і після їхньої сьогоднішньої зради асамблея оголосила їх зрадниками. Китай знову буде республікою, вільною від іноземного панування!»"
 qing_news_events.4.d_2: "У міазмі китайської політики можна забути про делікатний баланс сил, встановлений між чжилійською клікою та маньчжурським двором. Однак, схоже, шальки терезів перекинулися: після ймовірної спроби перевороту в столиці У Пейфу та Цао Кунь героїчно з'явилися перед безстрашним натовпом, давши кілька коментарів зібраним репортерам.\n\nГордо стоячи, «нефритовий маршал» та «король Баодіна» оголосили про повне скасування маньчжурської монархії, відновлення Бейянської Республіки та продовження боротьби за цінності Сіньхаю. Як би там не було, чжилійці знову дивом уникли смерті, і тепер на країну, без сумніву, чекає серйозний конституційний процес."
 qing_news_events.4.a: "Хай живе республіка!"
 qing_news_events.4.b: "Повернення республіки?"

 qing_news_events.5.t: "Маньчжурська «кампанія умиротворення»"
 qing_news_events.5.d: "Після маньчжурського перевороту багато спостерігачів очікували на радикальну зміну імперської політики щодо мілітаристів по всьому Китаю. Сьогодні про цю зміну було оголошено офіційно. Виступаючи перед зібранням військових та політичних офіцерів, двоє високопоставлених маньчжурських генералів — брат імператора Пуцзє та його дядько Цзайтао — оголосили про запуск «національної кампанії умиротворення», покликаної розгромити лівих, республіканців та остаточно викорінити «сморід мілітаризму».\n\nДо штабу [FNG.GetLeader] у Фентяні вже почали надходити панічні телеграми від провінційних губернаторів, а іноземні легації поспіхом готуються до евакуації персоналу з небезпечних зон."
 qing_news_events.5.d.alt: "Після маньчжурського перевороту багато спостерігачів очікували на радикальну зміну імперської політики щодо мілітаристів по всьому Китаю. Сьогодні про цю зміну було оголошено офіційно. Виступаючи перед зібранням військових та політичних офіцерів, двоє високопоставлених маньчжурських генералів — брат імператора Пуцзє та його дядько Цзайтао — оголосили про запуск «національної кампанії умиротворення», покликаної розгромити лівих, республіканців та остаточно викорінити «сморід мілітаризму».\n\nМіж штабами провінційних губернаторів, що залишилися, вже почали літати панічні телеграми, а іноземні легації поспіхом готуються до евакуації персоналу з небезпечних зон."
 qing_news_events.5.a: "Так чи інакше, Китай буде об'єднаний."
 qing_news_events.5.b: "Хіба вони не засвоїли урок минулого разу, коли їх скинули?"

