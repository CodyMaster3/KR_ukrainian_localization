### Опис у меню вибору країни ###
 QIE_KR_gathering_storm_desc: "Велика Цін входить у 1936 рік на межі катастрофи. Відновлений в обмін на німецьку підтримку під час четвертої чжилійсько-фентянської війни 1928 року, імператор Сюаньтун залишається вкрай непопулярним і сприймається багатьма як нелегітимний.\n\nЧжилійська кліка, що розгромила і фентянців, і Гоміньдан, виглядає переможцем у хаосі, який охопив Китай на два десятиліття, але її влада далеко не міцна. Вороги ззовні та зсередини загрожують її гегемонії, і залишається лише здогадуватися, як довго мілітаристи зможуть утримувати стерно влади..."

