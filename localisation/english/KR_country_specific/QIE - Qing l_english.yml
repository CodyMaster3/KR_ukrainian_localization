###- Політичні рішення -###
 QIE_meet_assembly_parties_decisions: "Переговори з асамблеєю"
 QIE_meet_assembly_parties_decisions_desc: "Через наше втручання на боці Ліги восьми провінцій та їхніх німецьких покровителів реформісти, радикали та монархісти покинули асамблею на знак протесту. Нинішня делегація складається лише з Товариства гармонії, Ліги процвітання, кількох незалежних депутатів та Кліки політичних наук. Хоча пересічний китаєць ставиться до справ асамблеї та сенату апатично, інтелектуали цілком здатні скористатися такою делегітимізацією влади.\n\nПрезидент Цао, добре знайомий із наслідками втрати народної підтримки, отримав непросте завдання: переконати кожну окрему партію повернутися до державного управління, інакше народний гнів може постукати прямо в наші двері."

 QIE_placate_manchu: "Переговори з Цзунше"
 QIE_placate_manchu_desc: "Зневажена багатьма маньчжурська знать кинула нам виклик, опортуністично використовуючи заворушення через підтримку ліги, аби змусити президента Цао до переговорів. Хоча ми могли б вижити і без підтримки Цзунше, ці дворяни багаті, впливові та мають доступ до вух імператора. Все це робить їх небезпечним ворогом. Їхній час ще прийде, але не сьогодні."

 QIE_placate_YCP: "Реверанси в бік ПМК"
 QIE_placate_YCP_desc: "Ультранаціоналістична, ультрареспубліканська та вічно радикальна партія «Молодий Китай» настільки рішуче виступає проти іноземних концесій, що дивно, як вони ще не вдалися до насильства. Перш ніж це станеться, президент Цао та кабінет міністрів могли б простягнути ПМК руку допомоги. Зрештою, їхня енергія викликає захоплення."

 QIE_placate_CERA: "Залучення ТРАК до діалогу"
 QIE_placate_CERA_desc: "Реформісти, помірковані ліві та інтелектуали. Не дивно, що Товариство реформ Китайської імперії також покинуло асамблею після заяви президента Цао. Проте, маючи зв'язки в тих самих ділових колах та через контакти Бая Цзяньву з інтелігенцією, ми потенційно можемо повернути Сюй Ціня, Джеймса Єня та Лян Шуміна за стіл переговорів щодо повернення до асамблеї."

###- Економічні рішення -###
 QIE_develop_tangshan_steel_decision: "Стимулювати рудники в [614.GetName]"
 QIE_develop_tangshan_steel_decision_desc: "Під егідою «Таншань залізо і сталь» (TIS), одного з провідних та найсучасніших гірничодобувних підприємств Китаю, видобуток сталі в [614.GetName] демонструє стрімке зростання. TIS, відоме як «батьківщина конвертерів», стало одним із перших вітчизняних підприємств, що успішно впровадили технологію безперервного лиття у великомасштабне промислове виробництво. Завдяки їхнім розробкам ми зможемо значно збільшити національні запаси вугілля, сталі та інших ресурсів."

 QIE_develop_zhili_steel_decision: "Стимулювати рудники в [1060.GetName]"
 QIE_develop_zhili_steel_decision_desc: "Під егідою «Таншань залізо і сталь» (TIS), одного з провідних та найсучасніших гірничодобувних підприємств Китаю, видобуток сталі в [1060.GetName] демонструє стрімке зростання. TIS, відоме як «батьківщина конвертерів», стало одним із перших вітчизняних підприємств, що успішно впровадили технологію безперервного лиття у великомасштабне промислове виробництво. Завдяки їхнім розробкам ми зможемо значно збільшити національні запаси вугілля, сталі та інших ресурсів."

###- Military Decisions -###

 QIE_hire_bandits: "Залучити колишніх соратників"
 QIE_hire_bandits_desc: "[QIE_hire_bandits_desc_scripted_loc]"
 QIE_hire_bandits_desc_manchu: "Протягом нашого шляху до відновлення законного центрального уряду в Пекіні збройні сили династії Цін тривалий час перебували в занепаді. Після Сіньхайської революції та краху спроби реставрації Чжан Сюня ми залишилися без належного військового досвіду та вірних імператору солдатів. Проте, спираючись на спільну віру в Мандат Неба, ми можемо залучити старих союзників, з якими розійшлися раніше. За належного стимулювання вони напевно знову приймуть призначення на службу."
 QIE_hire_bandits_desc_zhili: "Протягом свого розвитку чжилійська кліка поступово перетворилася з простого об'єднання амбітних мілітаристів часів нової армії Юань Шикая на справжніх охоронців Бейянської Республіки. На нашому тернистому шляху ми втратили чимало старих союзників, найпомітнішим з яких був Фен Юйсян. Хоча ми ніколи не зможемо примиритися з Феном та його соціалістичним збродом, інші колишні члени кліки є куди більш прийнятними для нашої справи. За належного стимулювання вони залюбки повернуться до лав армії."

 QIE_hire_russian_cw_veterans: "Найм російських радників"
 QIE_hire_russian_cw_veterans_desc: "[QIE_hire_russian_cw_veterans_desc_scripted_loc]"
 QIE_hire_russian_cw_veterans_desc_manchu: "Оскільки наші відносини з Німеччиною безнадійно розірвані, а інші імперіалісти тримаються осторонь через наш реваншизм, багато хто вважає, що армія центрального уряду залишилася без іноземної допомоги. Проте існує одна сучасна західна держава, яка досі відкрито не виступила проти нас — Росія.\n\nЗвісно, багато хто зневажає російського ведмедя за його минулу колоніальну політику, як-от захоплення Зовнішньої Маньчжурії чи вторгнення в Дунбей після повстання боксерів. Тим не менш, їхні досвідчені та амбітні молоді офіцери здатні стати гідною заміною німцям. Вони володіють усіма необхідними навичками для модернізації нашої армії."
 QIE_hire_russian_cw_veterans_desc_zhili: "Через нашу антиконцесіоністську позицію та розрив із Німеччиною ми потребуємо нової допомоги у військовому розвитку. Росія залишається єдиною великою державою, що не ворогує з нами відкрито. Попри історичні образи за анексію територій на півночі, російські ветерани громадянської війни є чудовими фахівцями. Їхній досвід у сучасній війні допоможе нам підготувати армію до майбутніх викликів."

 QIE_hire_legation_exiles: "Найм британських та американських вигнанців із міст-концесій"
 QIE_hire_legation_exiles_desc: "Революції та заворушення на їхній батьківщині змусили багатьох англо-американських офіцерів та держслужбовців шукати притулку в Шанхаї та Тяньцзіні. Тікаючи від переслідувань чи війни, ці авантюристи готові на все. Багато з них — колишні моряки британського або американського флотів. В обмін на роботу ми зможемо використати їхній досвід для модернізації нашого молодого флоту."

 QIE_hire_flying_tigers: "Найм «Летючих тигрів»"
 QIE_hire_flying_tigers_desc: "Японське вторгнення стає неминучим з огляду на їхні агресивні плани щодо Китаю. Група видатних і патріотичних пілотів із охоплених війною Сполучених Штатів сформувала загін, який вони називають «Летючими тиграми». Три ескадрильї (близько 60 літаків) пропонують свої послуги китайському уряду в обмін на офіційні контракти та працевлаштування в наших новостворених ВПС."

 QIE_hire_mercenaries_decisions: "Реорганізація армії"
 QIE_hire_mercenaries_decisions_desc: "Попри наші успіхи в нескінченних міжусобних війнах, армія [QIE.GetName] відверто програє на тлі справжніх західних чи японських сил. Нашим солдатам не бракує стійкості та волі, вони здатні битися один на один із будь-яким імперіалістом, але їм катастрофічно не вистачає знань про тактику та стратегію сучасної війни. З появою літаків та танків вкрай важливо, аби ті, хто має досвід такого бою, навчили наших бійців. Якщо ми хочемо повернути Китаю його місце у світі, ми маємо бути готові підкріпити свої претензії силою."

 QIE_buy_foreign_guns_decisions: "Закупівля іноземного озброєння"
 QIE_buy_foreign_guns_decisions_desc: "Бути антиконцесіоністом не означає відмовлятися від іноземної зброї, чи не так? Поки наші арсенали цілодобово виготовляють снаряди та гвинтівки, ми шукаємо додаткові шляхи постачання. Не маючи змоги купувати зброю у «Міттельойропи» чи основних членів ради концесій, ми звертаємось до нейтральних партнерів: Швейцарії, Росії або країн Скандинавії. Ринок озброєнь великий, і ми готові інвестувати в нашу обороноздатність."

 QIE_buy_small_arms: "Купити надлишки російської стрілецької зброї"
 QIE_buy_small_arms_desc: "Російський гігант активно модернізує свою армію, готуючись до глобального конфлікту. Це призвело до появи величезних залишків застарілих гвинтівок на їхніх складах. Наші логісти підготували низку контрактів на закупівлю цього надлишкового озброєння за вигідними цінами."

 QIE_retroengineer_small_arms: "Зворотна розробка іноземної стрілецької зброї"
 QIE_retroengineer_small_arms_desc: "Закупивши західне озброєння, ми повинні доручити нашим інженерам вивчити їхні механізми та конструкцію. Гвинтівка генерала Лю стрімко застаріває, тож сучасні пістолети-кулемети та автомати можуть стати вирішальним фактором у майбутніх війнах."

 QIE_buy_support_equipment: "Купити надлишки данських ручних кулеметів"
 QIE_buy_support_equipment_desc: "Данська гвинтівка-кулемет Мадсена зарекомендувала себе як надзвичайно надійний та ефективний засіб підтримки піхоти. Це перший у світі справжній ручний кулемет, що випускався масово. Наше командування особливо зацікавлене в отриманні цієї перевіреної часом зброї."

 QIE_buy_arty: "Купити надлишки швейцарської артилерії"
 QIE_buy_arty_desc: "Швейцарський військово-промисловий комплекс залишається зразковим, хоч і скромним за масштабами. Через вічний нейтралітет країни їхнє обладнання часто потрапляє на міжнародний ринок. Оскільки артилерія — це «король війни» в Китаї, наша армія буде рада отримати сучасні гармати у значній кількості."

 QIE_commission_sicilian_ships: "Замовлення італійських кораблів"
 QIE_commission_sicilian_ships_desc: "Верфі роздроблених італійських держав залишаються одними з найбільших у світі. Оскільки італійці зараз переживають власну «еру мілітаристів», ми можемо домовлятися з кожною фракцією окремо про будівництво сучасних суден. Як адмірал Са Чженьбін робив це раніше, ми знову відбудуємо флот, почавши із замовлень за кордоном."

 QIE_sic_destroyers: "Замовити есмінці"
 QIE_sic_destroyers_desc: "Есмінці є невід'ємною частиною сучасного флоту, виконуючи роль авангарду для конвоїв та великих кораблів. Якщо ми хочемо захищати інтереси Китаю на морі, нам потрібен чисельний екскортний флот для прикриття головних сил."

 QIE_sic_subs: "Замовити підводні човни"
 QIE_sic_subs_desc: "Підводні човни довели свою неймовірну ефективність. Завдяки вдосконаленню технологій занурення вони перетворилися з «пасток для екіпажу» на потужний інструмент тиску. Для утвердження домінування Китаю нам необхідна хоча б невелика частина підводного флоту."

 QIE_sic_cruisers: "Замовити крейсери"
 QIE_sic_cruisers_desc: "Швидші за лінкори і майже такі ж потужні, крейсери ідеально підходять для невеликого бейянського флоту. Вони можуть супроводжувати судна, вести розвідку та діяти як основна вогнева міць там, де немає потреби у важких гарматах."

 QIE_sic_convoys: "Замовити конвої"
 QIE_sic_convoys_desc: "Сучасна торгівля неможлива без торговельного флоту. Оскільки наші конвої здатні долати великі відстані, ми маємо посилити наявний флот, аби забезпечити стабільний потік товарів на батьківщину."

 QIE_buy_german_eqip_decisions: "Закупівля надлишків німецького спорядження"
 QIE_buy_german_eqip_decisions_desc: "Завдяки нашим зв'язкам із німецьким мандатом, у нашому розпорядженні опинився один із найпотужніших арсеналів світу. За умови наявності коштів та готовності допустити німецькі інтереси в нашу країну, ми можемо отримати зброю, якій не буде рівних на китайських полях битв.\n\n§YПоточний німецький вплив:§! [?QIE.party_popularity@market_liberal|%0]"

 QIE_buy_ger_rifles: "Купити німецькі гвинтівки"
 QIE_buy_ger_support: "Купити німецьке допоміжне спорядження"
 QIE_buy_ger_arty: "Купити німецьку артилерію"
 QIE_buy_light_tanks: "Купити німецькі легкі танки"
 QIE_buy_medium_tanks: "Купити німецькі середні танки"
 QIE_buy_motorized: "Купити німецьку моторизовану техніку"
 QIE_buy_ger_fighter: "Купити німецькі винищувачі"
 QIE_buy_ger_cas: "Купити німецькі літаки безпосередньої підтримки"
 QIE_buy_ger_tac: "Купити німецькі тактичні бомбардувальники"
 QIE_german_air_support_idea: "Імпортований досвід Дорньє"
 QIE_ger_destroyers: "Купити німецькі есмінці"
 QIE_ger_destroyers_tooltip: "Невелика ескадра німецьких есмінців прибуде до Тяньцзіня через 50 днів після переоснащення."
 QIE_ger_subs: "Купити німецькі підводні човни"
 QIE_ger_subs_tooltip: "Невелика ескадра застарілих німецьких підводних човнів прибуде до Тяньцзіня через 100 днів після переоснащення."
 QIE_ger_cruisers: "Купити німецькі крейсери"
 QIE_ger_cruisers_tooltip: "Два законсервовані німецькі крейсери прибудуть до Тяньцзіня через 100 днів після ремонту."
 QIE_ger_battleship: "Купити законсервований німецький лінкор"
 QIE_battleship_tooltip: "Законсервований німецький лінкор буде відремонтований та доставлений до Тяньцзіня через 100 днів."
 QIE_ger_convoys: "Купити німецькі конвої"
 QIE_buy_ger_anti_tank: "Купити німецькі протитанкові гармати"
 QIE_buy_ger_anti_air: "Купити німецькі зенітні гармати"

 QIE_tang_zaili_plan_category: "План Тана Цзайлі"
 QIE_jiang_baili_plan_category: "План Цзяна Байлі"
 QIE_jiang_plan_mission: "Впровадження плану Цзяна Байлі"
 QIE_jiang_baili_phase1: "Етап 1 — Будівництво прикордонних укріплень"
 QIE_jiang_baili_phase2: "Етап 2 — Будівництво берегової оборони та муштра солдатів"
 QIE_jiang_baili_phase3: "Етап 3 — Мобілізація військової економіки"
 QIE_tang_plan_mission: "Впровадження плану Тана Цзайлі"
 QIE_tang_zaili_phase_1: "Етап 1 — Інвестиції в сучасне озброєння"
 QIE_tang_zaili_phase_2: "Етап 2 — Формування елітних дивізій"
 QIE_tang_zaili_phase_3: "Етап 3 — Впровадження важкої артилерії"

 QIE_dam_breaching_decisions_category: "Руйнування дамб на річці Хуанхе"
 QIE_dam_breaching_decisions_category_desc: "У зв'язку з просуванням ворожих армій за межі Пекіна до берегів Хуанхе, військовий штаб запропонував ризикований план підриву дамб уздовж річки. Це значно сповільнить загарбників і дозволить нашим солдатам продовжувати оборонну війну. Спираючись на рекомендації німецької військової місії, цей крок може стати вирішальним для національної оборони, проте ціна для населення та економіки без сумніву буде жахливо високою."

 QIE_relocate_civilians_out_of_danger_area: "Евакуювати цивільних із небезпечних зон"
 QIE_relocate_civilians_out_of_danger_area_desc: "Виділивши значні ресурси на моделювання розливу води після підриву дамб, ми можемо визначити, які села під загрозою, і вивезти їхніх мешканців. Хоча в короткостроковій перспективі це рішення непопулярне, воно врятує нас від величезної кількості безглуздих жертв у майбутньому."

 QIE_breach_dams_channel_water_north: "Прорвати дамбу в Чженчжоу — спрямувати воду на північ"
 QIE_breach_dams_channel_water_north_desc: "Вороги вже близько, і саме виживання нації під загрозою! З важким серцем, але після ретельної підготовки, настав час підірвати дамби в Чженчжоу, спрямувавши воду на північ, аби зупинити їхній наступ ще до переправи."

 QIE_breach_dams_channel_water_south: "Прорвати дамбу в Чженчжоу — спрямувати воду на південь"
 QIE_breach_dams_channel_water_south_desc: "Вороги наступають, і нація на межі загибелі! Настав час підірвати дамби в Чженчжоу, спрямувавши воду на південь, аби сповільнити ворога вже після переправи. Так ми сподіваємося знищити їхні дезорганізовані сили, затиснуті між нашими багнетами та розлюченою Хуанхе."

 QIE_rebuild_from_flood_damage_kaifeng: "Відбудова після повені"
 QIE_rebuild_from_flood_damage_kaifeng_desc: "Руйнування дамб на Хуанхе стало національною трагедією для всього Китаю, проте воно було необхідним для збереження суверенітету та культури. Тепер, коли війна закінчилася і почався період національного відродження, настав час повернути життя на ці затоплені землі."

 QIE_rebuild_from_flood_damage_north: "Відбудова після повені"
 QIE_rebuild_from_flood_damage_north_desc: "Усі китайці вважають підрив дамб національним лихом, але цей крок врятував країну від повного знищення. Після завершення війни ми розпочинаємо масштабну реконструкцію, аби реанімувати життя в північних регіонах, що постраждали від води."

 QIE_defensive_preparations_category: "Оборонні приготування"
 QIE_defensive_preparations_category_desc: "Ведучи війну за національне спасіння, центральний уряд має використовувати будь-які методи для збереження своєї цілісності. Альтернативою є лише повне зникнення багатовікової цивілізації від рук загарбників та їхніх поплічників. За порадою наших найкращих теоретиків підготовлено низку оборонних споруд та операцій."

 QIE_huanghe_line: "Створити лінію Хуанхе"
 QIE_huanghe_line_desc: "Хуанхе протягом тисячоліть була серцем Китаю, годуючи безліч цивілізацій до нас. Тепер, перед загрозою знищення, ця річка, що є джерелом життя, має стати щитом нації. Створивши «лінію Хуанхе» вздовж її південних берегів, ми зможемо розбити ворожі сили об річкову перешкоду та здобути остаточну перемогу."

 QIE_withdraw_government_to_wuhan: "Створити надзвичайний уряд в Ухані"
 QIE_withdraw_government_to_wuhan_desc: "Розташування Пекіна зараз є скоріше стратегічним недоліком: стара столиця вкрай вразлива для вторгнення з моря або наступу з півночі. Якщо ми не втримаємо Пекін, ми не маємо права втратити разом із ним і апарат управління державою. Тимчасове перенесення всіх урядових установ до Уханя дозволить нам успішно відступити в набагато захищеніші внутрішні райони."

 QIE_withdraw_arms_factories_to_hubei: "Евакуювати військові заводи до Хубею"
 QIE_withdraw_arms_factories_to_hubei_desc: "Ворог невпинно просувається, тож було б розсудливо перемістити наші збройові заводи вглиб провінції Хубей. Це не лише підсилить місцевого губернатора, а й гарантує уряду збереження промислового потенціалу навіть у разі втрати територій."

 QIE_withdraw_civilian_factories_to_hubei: "Евакуювати цивільні заводи до Хубею"
 QIE_withdraw_civilian_factories_to_hubei_desc: "Враховуючи темпи наступу противника, ми маємо перенести ключові цивільні підприємства та бізнес у внутрішні райони Хубею. Це забезпечить безперервність виробничих ліній та економічну стійкість держави в умовах війни."

 QIE_fortify_southern_approach: "Укріпити південні підступи"
 QIE_fortify_southern_approach_desc: "Ми вже одного разу зазнали критичних втрат, коли мешканці півдня ледь не вибили нас із владних крісел на півночі. Ми добре засвоїли цей урок. Стратеги радять збудувати мережу фортів уздовж кордонів Хубею, Шеньсі та Хенані, аби назавжди зупинити просування будь-яких південних загарбників."

 QIE_sino_german_cooperation: "Угода про китайсько-німецьку співпрацю"
 QIE_sino_german_cooperation_desc: "Використовуючи всі доступні засоби, китайська нація рішуче вистояла в бурі національної боротьби. Ми перемогли у війні, і поки ми відбудовуємо домівки та міста, фракція Цзіньбао розглядає нові перспективи. Тепер, коли країна об'єднана, наші колишні німецькі благодійники можуть бути зацікавлені в розширенні угод із новим, стабільним та дружнім Китаєм. Є лише один спосіб це з'ясувати."

###- Peking Commission -###

 QIE_manage_german_influence: "Управління німецьким впливом"
 QIE_manage_german_influence_desc: "[QIE_manage_german_influence_scripted_loc_desc]"
 QIE_manage_german_influence_manchu_desc: "Після реставрації Сюаньтуна 1928 року та німецької інтервенції 1927-го, німецькі компанії здобули непомірний вплив у нашій країні. Щодня прибувають лобісти, «консультанти» та дипломати, прагнучи заробити на прибуткових китайських ринках.\n\nЗавдяки нашим «особливим відносинам» із Німецькою імперією, її фінансова та наукова підтримка стала невід'ємною частиною модернізації нації. Проте в суспільстві постійно зріє невдоволення. Після повернення монархії до повноти влади Пекінська комісія не знала, як новий уряд поставиться до їхньої присутності, адже коаліція радикалів, реформаторів та монархістів завжди зневажала іноземний вплив.\n\nПроте продовження німецької підтримки через переговори показало, що їхні страхи були марними. Німці отримали те, до чого прагнули ще у 1928 році.\n\n§YПоточний німецький вплив:§! [?QIE.party_popularity@market_liberal|%0]"
 QIE_manage_german_influence_zhili_desc: "Німецькі компанії утримують колосальний вплив у країні з 1928 року. Їхні лобісти та дипломати заполонили ринки. Хоча ця підтримка важлива для модернізації, під поверхнею вирує невдоволення. Чжилійські офіцери фракції §cЛоян§! під проводом «нефритового маршала» запекло виступають проти концесій. Єдиними друзями німців в уряді залишаються представники фракції §aЦзіньбао§! Цао Куня та маріонетки з §mЛіги процвітання§!.\n\nХоча домінування в бюрократії та лобі в асамблеї дають нам переваги, така залежність стає нестерпною. Ми маємо безліч способів як обмежити їхній вплив, так і використати його на свою користь, коли нам знадобиться підтримка.\n\n§YПоточний німецький вплив:§! [?QIE.party_popularity@market_liberal|%0]"

 QIE_bribe_lobbyists: "Підкупити пронімецьких лобістів"
 QIE_bribe_lobbyists_desc: "Формально єдине, що цікавить так звану Лігу процвітання — це гроші. Гроші, гроші і ще раз гроші. Використовуючи наші зв'язки в бізнесі та банківській сфері, ми можемо «задобрити» найбільш піддатливих лобістів подарунками. Це змусить їх замовкнути на кілька місяців, зменшивши вплив Німеччини на нашу політику."

 QIE_encourage_domestic_production: "Стимулювати внутрішнє виробництво"
 QIE_encourage_domestic_production_desc: "Наші відносини з Німеччиною, хоч і обтяжливі, призвели до швидкого розвитку власної промисловості. Ми можемо надати перевагу вітчизняним корпораціям, віддаючи їм вигідні контракти замість німецьких конкурентів. Це тимчасово підірве позиції німців, хоча й дещо знизить загальну ефективність виробництва."

 QIE_encourage_anti_german_boycott: "Стимулювати антинімецький бойкот"
 QIE_encourage_anti_german_boycott_desc: "Навіть найпалкіший прихильник концесій сьогодні може стати їхнім ворогом завтра. Знаючи це і ставлячи китайські інтереси понад усе, наша розвідка може таємно підтримувати антиконцесіоністські рухи. Це зменшить німецький вплив у великих містах, хоча й змусить нас виглядати німецькими маріонетками в очах радикалів."

 QIE_entice_financial_support: "Залучити німецьку фінансову допомогу"
 QIE_entice_financial_support_desc: "Для чого ще потрібні німці, як не для фінансування? Використовуючи контакти в Пекінській комісії та дипломатичному корпусі, ми можемо отримати кошти для стабілізації бюджету. На жаль, це дозволить Німеччині ще глибше запустити кігті в нашу політичну сцену."

 QIE_ger_debt_repayment: "Інвестувати у виплату боргів"
 QIE_ger_debt_repayment_desc: "Хоча ми домовилися з Німецькою імперією про уникнення дефолту, сума боргу все ще величезна. Використовуючи наші зв'язки та репутацію, ми можемо запропонувати план прискореного погашення. Це надовго прив'яже нашу фінансову стабільність до німців в обмін на поступове звільнення від політичного тиску."

###- Рішення маньчжурів -###
 QIE_zhili_manchu_war_idea: "Чжилійсько-маньчжурська громадянська війна"
 QIE_zhili_manchu_war_idea_desc: "Ми контролюємо Пекін, але прибічники чжилійців під проводом маршала Ван Чженбіня продовжують опір! Вони відступили на південь, закріпившись у провінціях Хенань та Хубей. Аби викорінити зусилля маршала Вана та губернаторів Сяо і Лі, ми маємо безжально знищити їх та всіх їхніх прихильників."

 QIE_zhili_manchu_war_decisions_category: "Південна кампанія"
 QIE_zhili_manchu_war_decisions_category_desc: "Ми убезпечили Пекін та північний кордон, але зрадливі чжилійські генерали все ще чинять опір на півдні. Ця кампанія стане бойовим хрещенням для нових армій Цін. За імператора, за Сина Неба!"

 QIE_push_to_yellow_river: "Вихід до Жовтої річки"
 QIE_push_to_yellow_river_desc: "Перший крок нашого відвоювання — відтіснити залишки чжилійців до Хуанхе. Це має бути найлегшим етапом кампанії, проте не варто розслаблятися: штаб «нефритового маршала» в Лояні розташований зовсім поруч."

 QIE_assault_luoyang: "Штурм Лояна"
 QIE_assault_luoyang_desc: "Лоян — це серце операцій чжилійської кліки. Маршал Ван та інші вцілілі генерали відступили сюди, збираючи ополчення. Це найважчий крок: якщо ми виб'ємо їх звідси, їхній опір втратить сенс, а наша справа буде доведена."

 QIE_mop_up_south: "Зачистка ізольованих залог"
 QIE_mop_up_south_desc: "Після падіння Лояна сили чжилійців розсіялися. Ми маємо провести ретельну зачистку територій, знищуючи розрізнені загони. Це забере час, але контроль над Шеньсі та Хубеєм є критично важливим для зміцнення нашої влади."

 QIE_final_push: "Останній ривок"
 QIE_final_push_desc: "Залишки чжилійців готують останній бій в Ухані. У цьому місті десять років тому вони розгромили Гоміньдан, але цього разу їм не пощастить! Ми покінчимо з безглуздим опором губернатора Сяо Яонаня з усією суворістю імперського двору."

# Вплив Іґуаньдао
 QIE_yiguandao_decisions_category: "Вплив Іґуаньдао"
 QIE_yiguandao_decisions_category_desc: "Чжан Тяньжань допоміг нам повалити чжилійську кліку і тепер пропонує підтримку свого релігійного товариства. Вони дають потужні бонуси в обмін на політичний вплив, але ми маємо бути обережними. Мало хто вірить, що Тяньжань діє з чистого альтруїзму...\n\n§YПоточний вплив Іґуаньдао:§! [?QIE.party_popularity@national_populist|%0]"

 QIE_raise_yiguandao_militia: "Сформувати дивізії ополчення Іґуаньдао"
 QIE_raise_yiguandao_militia_desc: "Іґуаньдао має чималі воєнізовані «сили захисту», що охороняють храми та паломницькі шляхи. Чжан Тяньжань може передати частину цих військ під наше командування."

 QIE_refugee_workforce: "Залучити біженців до робочої сили"
 QIE_refugee_workforce_desc: "Території під контролем Іґуаньдао в Шаньдуні кишать безробітними біженцями, які прийняли віру культу заради порятунку. Чжан Тяньжань пропонує рішення: ми забираємо біженців під свою опіку, а він гарантує, що вони працюватимуть на наших заводах для потреб армії."

 QIE_yiguandao_infiltraitors: "Відправити диверсантів Іґуаньдао"
 QIE_yiguandao_infiltraitors_desc: "Серед тисяч біженців легко приховати агентів. Ми можемо замаскувати послідовників Іґуаньдао і відправити їх на ворожі території для саботажу промисловості та збору розвідданих про пересування військ."

 QIE_sponsor_prayer_meeting: "Спонсорувати молитовне зібрання"
 QIE_sponsor_prayer_meeting_desc: "Хоча при дворі мало хто вірить у вчення майстра Чжана, селяни шикуються в черги, аби його послухати. Надавши йому офіційну трибуну для підтримки режиму, ми піднімемо патріотичний дух і надихнемо народ працювати старанніше на благо імперії."

 QIE_arrest_yiguandao_priest: "Видати ордер на арешт проповідника Іґуаньдао"
 QIE_arrest_yiguandao_priest_desc: "Ми можемо обмежити вплив культу, заарештувавши кількох ключових фігур у містах. Міста — це осередки пороку, тож неважко звинуватити священика у... неетичній діяльності. Це похитне позиції Чжана Тяньжаня, хоча й вимагатиме ресурсів на боротьбу з формальними союзниками."

# Виборча реформа Цюя
 QIE_electoral_reforms_category: "Комітет з виборчої реформи"
 QIE_electoral_reforms_category_desc: "Роки служби Цюй Їнґуана в Шаньдуні пробудили в ньому інтерес до місцевого самоврядування. Він успішно впровадив елементи демократії в Шаньдуні, а тепер, ставши одним із архітекторів «маньчжурської реставрації», прагне провести подібні реформи в масштабах усієї країни."

 QIE_electoral_districting: "Перегляд виборчих округів"
 QIE_electoral_districting_desc: "Перший крок до нової асамблеї — це оновлення виборчої карти. Старі бейянські округи були нарізані на користь Товариства гармонії. Це дороговартісна, але необхідна справа."

 QIE_polling_infrastructure: "Інвестування у виборчу інфраструктуру"
 QIE_polling_infrastructure_desc: "Держава абсолютно не готова до обробки мільйонів голосів. Без доступу до дільниць демократія просто помре. Ми маємо інвестувати у фундамент виборчого процесу, якщо справді хочемо реалізувати бачення Цюя."

 QIE_empower_local_assemblies: "Розширення повноважень місцевих асамблей"
 QIE_empower_local_assemblies_desc: "Нинішні асамблеї не мають жодного впливу. Ми маємо це виправити, аби зняти з Пекіна тягар вирішення дрібних місцевих проблем. Проте без глибокої §CСільської лояльності§! ми ніколи не наважимося дозволити їм обирати небезпечні елементи в державний апарат."

###- Рішення чжилійців про об'єднання Китаю -###
 QIE_zhili_reunite_china_decisions_category: "Об'єднання Китаю"
 QIE_zhili_reunite_china_decisions_category_desc: "Північнокитайська рівнина під контролем, тож час планувати об'єднання решти країни. Ми маємо допомогти союзникам перемогти в їхніх конфліктах та знищити радикалів, що виступають проти влади Бейяна. Мечем та пером ми знову станемо єдиними правителями Китаю!"

 QIE_prep_chahar: "Підготувати Чахар проти Монголії"
 QIE_prep_chahar_desc: "Перемога Монголії в Північно-західному конфлікті — це удар по нашому престижу. Їхня антикитайська політика доводить, що ми не здатні захистити своїх громадян. Ми маємо зміцнити кордони, оскільки вони напевно нападуть під час нашої війни з Фентянем."

 QIE_request_LEP_support_during_FNG_war: "Запросити [LEP.GetLeader] приєднатися до війни"
 QIE_request_LEP_support_during_FNG_war_desc: "Попри нашу допомогу під час розпаду ліги, маршал [LEP.GetLeader] поводиться як сфінкс, уникаючи прямих відповідей. Проте він наш боржник, і в цей критичний момент ми маємо переконати його допомогти нам знищити [FNG.GetNameDef]. Якщо він відмовить — що ж, «нефритовий маршал» виплутувався і з гірших халеп."

########################################
########- Section 06: Focuses -#########
########################################

###- Zhili -###
##- Opening Section -##
 QIE_year_of_the_rat: "Рік щура"
 QIE_year_of_the_rat_desc: "Поки нація готується до святкування китайського Нового року 24 січня, голова асамблеї Цао Кунь та У Пейфу почали розробляти промову, присвячену четвертому року боротьби з торговельними боргами. Це найголовніша проблема центрального уряду, і чжилійська кліка сподівається вирішити її, попри тривожні чутки про заворушення в Лізі восьми провінцій."

 QIE_levying_provincial_taxes: "Стягнення провінційних податків"
 QIE_levying_provincial_taxes_desc: "Відтоді як у 1922 році було вигнано клуб «Аньфу» Дуань Ціжуя, надходження податків із провінцій були мізерними. Пекін позбавлений фінансування, яке відповідало б його номінальному контролю. Провінційні губернатори постійно ігнорують свій конституційний обов'язок. Якщо ми хочемо виплатити величезні борги, ми маємо спочатку приборкати провінції."

 QIE_excising_cash_crops: "Обмеження технічних культур"
 QIE_excising_cash_crops_desc: "Опіум — давня ендемічна хвороба великої китайської нації. Провінційні уряди намагалися боротися з ним самотужки, але без успіху. Поруч із виробництвом шовку в Ґуандуні, величезна частина аграрного сектору працює заради наживи, а не задля прогодування народу. Надаючи субсидії правильним фермерам, ми зможемо відродити справжнє землеробство."

 QIE_emergency_meeting_of_the_cabinet: "Надзвичайне засідання кабінету"
 QIE_emergency_meeting_of_the_cabinet_desc: "Коли гнила клептократична структура Сунь Чуаньфана нарешті завалилася, в колишній лізі запанувала повна анархія. Повсюди грабунки та бунти, цивільної влади не існує. Скликавши нараду з військовим міністром маршалом Ван Чженбінем та його штабом, У Пейфу та офіцери почали готувати відповідь на ситуацію."

 QIE_lessons_of_intervention: "Уроки інтервенції"
 QIE_lessons_of_intervention_desc: "Втручання в розпад ліги навчило нас багато чому — як у політичних іграх, так і в методах ведення партизанської, хаотичної війни. Вивчаючи досвід цієї війни, наші штабні офіцери та теоретики зможуть отримати цінні знання про управління арміями, що допоможе нам уникнути катастроф у майбутньому."

##- Антиконцесіоністи -##
 QIE_elections_of_year: "Вибори [GetYear] року"
 QIE_elections_of_year_desc: "Створення Товариства гармонії як альтернативи клубу «Аньфу» забезпечило нам майже тотальне домінування в асамблеї. На тлі зростання популярності після проголошення антиконцесіоністського курсу, президент Цао вирішив провести нові національні вибори, аби закріпити наш успіх."

 QIE_foregoing_the_debts: "Відмова від боргів"
 QIE_foregoing_the_debts_desc: "Прокляті імперіалісти продовжують душити нашу славну націю міжнародними договорами та економічною блокадою. Прив'язуючи нас до своїх економік, вони вимагають виплати контрибуцій, накопичених ще старими династіями. Аби подолати фінансову кризу, ми оголошуємо повномасштабний міжнародний дефолт."

 QIE_nationalise_german_industry: "Націоналізація німецької промисловості"
 QIE_nationalise_german_industry_desc: "Велика кількість компаній повністю або частково належала німецьким фінансовим групам до того, як вони припинили підтримку нашого режиму. За порадою міністрів ми маємо повне юридичне право націоналізувати ці підприємства. Німеччина, підкошена Чорним понеділком, не зможе відповісти нічим, окрім гнівних телеграм."

 QIE_german_designs_chinese_ingenuity: "Німецькі проєкти, китайська винахідливість"
 QIE_german_designs_chinese_ingenuity_desc: "Роки співпраці з німецькими бюрократами та клерками Пекінської комісії дали нашим інженерам неоціненний промисловий досвід. Завдяки обладнанню, залишеному німцями під час їхнього хаотичного відступу до концесій, ми зможемо використати ці активи на благо Китаю, а не Берліна!"

 QIE_anti_concessionist_personality_cult: "Антиконцесіоністський культ особи"
 QIE_anti_concessionist_personality_cult_desc: "Наше втручання на боці антиконцесіоністського руху забезпечило нам підтримку інтелектуалів, які зазвичай налаштовані вороже до уряду. Маршал У та президент Цао — справжні рятівники китайського народу! Сучасні патріотичні герої!"

 QIE_encourage_nationalist_cooperation: "Стимулювати націоналістичну співпрацю"
 QIE_encourage_nationalist_cooperation_desc: "Партія «Молодий Китай» — люди гідні поваги, принаймні в певних аспектах. Вони тривалий час обстоювали ідеї націоналізму та республіканізму. Співпрацюючи з ними після відмови від нашого спільного німецького ворога, ми зможемо збудувати тривалий демократичний альянс!"

 QIE_greasing_the_gears_of_zongshe: "Змащування шестерень Цзунше"
 QIE_greasing_the_gears_of_zongshe_desc: "Партія Цзунше давно звинувачує президента та маршала в усуненні Пуї від справ. Хоча це правда, формально ми залишаємося конституційною монархією. Задобривши дворян щедрими подарунками, ми зможемо засліпити їх жадібністю та забезпечити їхню лояльність."

 QIE_harmonious_balance: "Гармонійний баланс"
 QIE_harmonious_balance_desc: "Товариство гармонії стало шедевром політичної тактики Цао Куня та У Пейфу. Їм вдалося створити широку коаліцію з реформаторів-інтелектуалів, маньчжурських дворян та ультранаціоналістів-республіканців. Попри всі внутрішні суперечності, пересічний громадянин безперечно підтримує наше освічене правління."

##- Концесіоністи -##

 QIE_overtures_to_the_assembly: "Реверанси в бік асамблеї"
 QIE_overtures_to_the_assembly_desc: "Наш суперечливий вибір на користь допомоги лізі та збереження зв'язків із Німеччиною викликав шквал критики в асамблеї. Опозиція, за винятком Ліги процвітання, відмовляється від участі в засіданнях. Тепер Цао має відновити довіру до нашої молодої демократії."

 QIE_negotiating_better_terms: "Переговори про кращі умови"
 QIE_negotiating_better_terms_desc: "Десятиліттями центральний уряд не міг досягти промислового прогресу через тягар міжнародних зобов'язань. Хоча це розлютить наших соратників із ПМК, звернення до Німеччини за фінансовою підтримкою прискорить виплату боргів і дасть поштовх до модернізації."

 QIE_simplify_international_investment_laws: "Спрощення законів про іноземні інвестиції"
 QIE_simplify_international_investment_laws_desc: "Попри зусилля німецьких лобістів, наші закони залишаються візантійським сплетінням бюрократії, обмежень та лазівок. Спростивши їх, ми залучимо додатковий капітал, що сприятиме економічному зростанню та зміцненню армії."

 QIE_partner_with_german_manufacturing_firms: "Партнерство з німецькими виробниками"
 QIE_partner_with_german_manufacturing_firms_desc: "Простягаючи руку справжньої китайсько-німецької співпраці та використовуючи наші «особливі відносини», ми надаватимемо державні замовлення спільним підприємствам. Це зрівняє наші позиції та забезпечить стабільний розвиток промисловості."

 QIE_secure_foreign_expertise: "Залучення іноземного досвіду"
 QIE_secure_foreign_expertise_desc: "Наші фахівці здатні будувати заводи та машини, але їх катастрофічно не вистачає — вони або розпорошені між мілітаристами, або зайняті іншими проєктами. Закупівля високоякісного інструментарію та обладнання, переважно в Німеччині, значно прискорить нашу модернізацію."

 QIE_hire_western_rail_engineers: "Найм західних залізничних інженерів"
 QIE_hire_western_rail_engineers_desc: "Більшість наших залізниць збудована європейцями. Хоча дехто обурюється через подальше використання їхніх послуг, вони — незаперечні майстри своєї справи. Нам варто найняти інженерів із «Міттельойропи» для покращення нашої інфраструктури."

 QIE_import_krupp_steel: "Імпорт сталі Круппа"
 QIE_import_krupp_steel_desc: "Поки наша власна сталеливарна промисловість лише розвивається, німецький гігант «Крупп» продовжує заповнювати прогалини. Зміцнюючи зв'язки з Центральною Європою, ми можемо заснувати «Крупп Китай», створивши величезну промислову мережу між Європою та Азією."

 QIE_securing_advanced_equipment: "Забезпечення сучасним обладнанням"
 QIE_securing_advanced_equipment_desc: "Війна змінилася з появою танків, літаків та радіозв'язку. Наша економіка поки не здатна виробляти таку техніку, але ми її гостро потребуємо. Укладаючи контракти із західними фірмами, ми зможемо імпортувати сучасне обладнання у великих кількостях."

 QIE_modernising_our_chemistry: "Модернізація хімічної промисловості"
 QIE_modernising_our_chemistry_desc: "Через брак гуми та нафти в основних провінціях, наші лідери зацікавилися синтетичними замінниками. Завдяки партнерству з експертами з «Міттельойропи», ми зможемо використати їхній досвід для створення власного виробництва сурогатів."

 QIE_university_exchange_program: "Програма університетського обміну"
 QIE_university_exchange_program_desc: "Найкращий спосіб навчитися чомусь — це пізнати іншу культуру. Відправляючи китайських студентів до європейських університетів, ми забезпечимо повернення фахівців із найновішими знаннями. Також ми сподіваємося, що європейці, навчаючись у нас, краще зрозуміють нашу культуру."

##- Industry/Military Plans/Foreign Policy -##
 QIE_future_of_the_zhili_clique: "Майбутнє Чжилійської кліки"
 QIE_future_of_the_zhili_clique_desc: "Потрясіння останніх місяців показали, що чжилійська кліка повинна реформуватися, якщо хоче вижити у найближчі роки, не кажучи вже про десятиліття. Систему патронажу необхідно змінити та модернізувати, аби дати простір меритократії та викорінити гниль, що просочилася в нашу армію. Інакше ми зникнемо на анналах історії."

 QIE_on_national_defense: "Про національну оборону"
 QIE_on_national_defense_desc: "Легендарний теоретик Цзян Байлі та його «баодінська кліка» прагнуть впровадити нові методи підготовки солдатів, де пріоритетами є самопожертва та фанатична відданість нації. Ці ідеї є більш поміркованими порівняно з його ранніми теоріями завдяки досвіду, здобутому разом із Цай Е під час війни на захист республіки."

 QIE_highlighting_our_goals: "Окреслення наших цілей"
 QIE_highlighting_our_goals_desc: "Натхненний відданістю солдатів Хуґоцзюнь, Цзян Байлі запропонував «нефритовому маршалу» запровадити систему політичних стимулів для війська. Пояснюючи солдатам кінцеву політичну мету наших війн, ми змусимо їх битися з подвоєною завзятістю. Пробудження справжнього китайського воїнського духу вже зовсім поруч."

 QIE_court_hubei_generals: "Залучити хубейських генералів"
 QIE_court_hubei_generals_desc: "«Хубейські генерали» — це неформальне об'єднання провідних промисловців провінції Хубей. Близький друг родини Цзяна Байлі, губернатор Сяо Яонань, люб'язно погодився використати свої ділові зв'язки для будівництва укріплень за планом Цзяна, що також неабияк посилить його власний вплив."

 QIE_symphony_of_military_and_industry: "Симфонія армії та промисловості"
 QIE_symphony_of_military_and_industry_desc: "Теорія генерала Тана Цзайлі зосереджена на вдосконаленні логістичних мереж для забезпечення чжилійської армії. Разом зі своїм «китайським елітгером» він прагне повторити успіх німецького плану «80 дивізій» та німецької імперської армії часів Світової війни. Ставка на мобільну війну та елітні частини має стати ключем до об'єднання країни."

 QIE_expand_baoding_arsenal: "Розширити баодінський арсенал"
 QIE_expand_baoding_arsenal_desc: "Баодінський арсенал, прикріплений до військової академії, розвинений менше, ніж ливарня в Ґунсяні. Проте за достатніх інвестицій ми перетворимо його на одного з головних виробників зброї. Близькість до академії дозволить нам випробовувати нові зразки спорядження на практиці, втілюючи ідею єдності армії та індустрії."

 QIE_a_competitive_army_and_industry: "Конкурентна армія та промисловість"
 QIE_a_competitive_army_and_industry_desc: "Раніше контракти на виробництво зброї видавалися хаотично і були просякнуті корупцією. Проявивши політичну волю, ми можемо очистити цю систему та підняти оборонну промисловість до західних стандартів. Здорова конкуренція між підрядниками зробить китайську зброю відомою на весь світ."

 QIE_the_central_plains_artery: "Артерія Центральних рівнин"
 QIE_the_central_plains_artery_desc: "Залізниці — це життєво важливі магістралі, що визначають хід воєн у Східному Китаї. Вони дозволяють перекидати великі з'єднання та важке озброєння швидше, ніж через суворі внутрішні райони. Пекін-Ханькоуська залізниця, завершена в 1906 році, є критичним об'єктом інфраструктури, і ми маємо забезпечити її розширення та охорону."

 QIE_reorganise_the_kailuan_mining_bureau: "Реорганізувати гірниче бюро Кайлуань"
 QIE_reorganise_the_kailuan_mining_bureau_desc: "Гірниче бюро Кайлуань було засноване у 1878 році як спільне підприємство уряду Цін та британського капіталу. Через безперервні війни епохи мілітаристів воно перебувало в занепаді. Зараз — ідеальний момент, аби відродити цю установу та передати її під повний державний контроль."

 QIE_expanding_our_shanxi_spoils: "Освоєння шансійських трофеїв"
 QIE_expanding_our_shanxi_spoils_desc: "Вугільні родовища східної Шаньсі, відібрані у Янь Сішаня після минулої війни, є одними з найбагатших у Китаї. Ми тривалий час утримувалися від інвестицій у цей регіон, аби не провокувати «зразкового губернатора». Проте тепер, зміцнивши наші зв'язки, ми можемо почати видобуток, діючи обережно."

 QIE_daye_hanyang_development_scheme: "План розвитку Дає-Ханьяна"
 QIE_daye_hanyang_development_scheme_desc: "Коридор Дає-Ханьян навколо Уханя зосереджує основні промислові потужності поза Пекіном, але інфраструктура регіону залишає бажати кращого. Інвестуючи в будівництво нових заводів та цивільну індустрію для підтримки арсеналів, ми модернізуємо економіку регіону та забезпечимо людей роботою."

 QIE_gongxian_arsenal_expansion_office: "Бюро розширення ґунсянського арсеналу"
 QIE_gongxian_arsenal_expansion_office_desc: "Арсенал у Ґунсяні, збудований Юань Шикаєм та Са Чженьбіном у 1915 році, завжди залишався в тіні хан'янської збройової ливарні. Розширивши його потужності, ми розосередимо нашу промислову базу на випадок, якщо один із центрів потрапить до рук ворога."

 QIE_restore_order_in_the_middle_kingdom: "Відновити порядок у Серединній державі"
 QIE_restore_order_in_the_middle_kingdom_desc: "Занадто довго Китай був роздертий амбітними воєначальниками та повстанськими фракціями. Нашою слабкістю скористалися хижаки всіх мастей. Наступним кроком до завершення «століття приниження» має стати край епохи мілітаристів. Ми приборкаємо всіх, хто скористався розпадом ліги задля заколоту."

 QIE_destroy_federalists: "Другий південний похід"
 QIE_destroy_federalists_desc: "Федералістський рух, що тримається на регіональних генералах та наївних інтелектуалах — це лише ширма для подальшого свавілля мілітаристів. Хоча нам доводилося терпіти Сунь Чуаньфана та його ігри в лібералізацію, федералісти підривають національний порядок. Ми нагадаємо їм, що такі ідеї тотожні сепаратизму."

 QIE_cross_the_dai_river: "Перетнути річку Дай"
 QIE_cross_the_dai_river_desc: "Минуло багато років після нашої невдачі у Четвертій чжилійсько-фентянській війні, і загроза з північного сходу лише зросла. Чжан Цзуолінь продав душу і країну Японії. П'ята чжилійсько-фентянська війна — це наш шанс виправити несправедливість і закріпити контроль над північним сходом. Ця можливість може не повторитися!"

 QIE_destroy_kuomintang: "Загасити полум'я партії-держави"
 QIE_destroy_kuomintang_desc: "Гоміньдан, заснований озлобленим Сунь Ятсеном — це привид минулого, виправдання для соціалістичних бандитів та злочинних воєначальників, що грабують країну в циклі революційного насильства. Попри поразку в Північному поході, вони досі існують. Рішучий удар на південь покінчить із цим бастіоном заколотників раз і назавжди."

 QIE_fractured_and_broken_united_yet_again: "Роздроблений та розбитий — знову єдиний"
 QIE_fractured_and_broken_united_yet_again_desc: "Нарешті десятиліття боротьби та страждань закінчилися. Китайська держава склала зброю, об'єднана законним урядом північної столиці. Витримавши тиск, «нефритовий маршал» завдав вирішального удару. З цим остаточним об'єднанням чжилійська кліка утвердилася як законний спадкоємець китайської цивілізації."

 QIE_tying_up_loose_ends: "Завершення справ"
 QIE_tying_up_loose_ends_desc: "Ядро Серединної держави об'єднане, але це ще не весь Китай. Прикордоння, за яке сперечаються тибетці, монголи, уйгури та росіяни, довгий час було поза нашим контролем. Хоча клан Ма опікувався північним заходом, настав час для всього пограниччя схилити коліно."

 QIE_hives_of_rabid_imperialism: "Кубла оскаженілого імперіалізму"
 QIE_hives_of_rabid_imperialism_desc: "Яке огидне видовище — ці концесії. Китайські громадяни стали людьми другого сорту на власній землі. Ці міста — виклик нашій національній гордості. Нав'язані в момент слабкості, вони будуть відібрані в момент сили. Шляхом переговорів чи силою зброї — ми повернемо наші порти!"

##- Республіка -##
 QIE_handling_the_disintegration: "Реакція на розпад"
 QIE_handling_the_disintegration_desc: "Охоплені нерішучістю та суперечками, кабінет міністрів та генштаб відмовилися підтримати будь-яку сторону під час краху ліги. Оскільки антиконцесіоністи та наші колишні європейські союзники продовжують протести, здається, що весь китайський порядок руйнується... Маршал У та президент Цао мають діяти!"

 QIE_let_the_five_banner_flag_fly: "Нехай майорить п'ятибарвний стяг!"
 QIE_let_the_five_banner_flag_fly_desc: "Нарешті мученики Сіньхаю виправдані! Монархи більше не будуть паразитувати на спинах китайців. З відновленням справжньої Бейянської Республіки президент та маршал можуть правити, не розкланюючись перед хлопчиком-імператором. Ми виходимо на справжній шлях китайської республіканської демократії."

 QIE_flying_too_close_to_the_sun: "Політ занадто близько до сонця"
 QIE_flying_too_close_to_the_sun_desc: "Змовники «маньчжурського перевороту» ледь не досягли успіху, якби не рішучість лоялістів. Проте це виявило серйозні діри в нашій безпеці. Те, що вони могли так довго готувати змову, доводить — ми стали некомпетентними на вершині влади. Необхідна серйозна внутрішня чистка та реформи."

 QIE_the_gift_of_the_dynasties: "Спадщина династій"
 QIE_the_gift_of_the_dynasties_desc: "Обтяжена слабкістю монархії, стара Бейянська Республіка була скута немислимими іноземними боргами. З відновленням республіки ми не потрапимо в ту саму пастку. Маючи можливість вести переговори або оголосити дефолт, ми самі вирішуємо свою долю."

 QIE_endeavours_human_face: "Людське обличчя «Зусилля»"
 QIE_endeavours_human_face_desc: "Ху Ші тривалий час був символом лібералізму та демократії в Пекіні. Разом із друзями він створив товариство «Зусилля», ставши його впізнаваним «обличчям». Його численні статті сформували інтелектуальне поле країни, а обрання його президентом створює чудовий прецедент для республіки."

 QIE_government_of_good_people: "Уряд добрих людей"
 QIE_government_of_good_people_desc: "Як і проголошувалося в маніфесті «Зусилля», вони прагнуть створити конституційний, прозорий уряд, присвячений свободі особистості. Завдяки філософії «прагматизму» Ху Ші бореться за ліберальні реформи мирним шляхом, хоча радикали і висміюють його за надмірний ідеалізм."

 QIE_beiyangs_favourite_son: "Улюблений син Бейяна"
 QIE_beiyangs_favourite_son_desc: "Дипломатичний корпус завжди залишався єдиною частиною бейянського уряду, вільною від корупції та кумівства. Тут працюють справжні патріоти, які борються за міжнародне визнання Пекіна. Міністерство закордонних справ стало фундаментом репутації всієї держави."

 QIE_flourish_of_the_diplomatic_corps: "Розквіт дипломатичного корпусу"
 QIE_flourish_of_the_diplomatic_corps_desc: "Маючи таких фахівців як Ґу Вейцзюнь чи Янь Хуейцін, ми володіємо найпотужнішою «сірою еміненцією». Їхня майстерність гарантує нам добрі стосунки з великими державами незалежно від нашої позиції щодо концесій. Це справжній зірковий час міністерства."

 QIE_the_fragrant_one_lacks_judgement_still: "«Запашному» все ще бракує розсудливості"
 QIE_the_fragrant_one_lacks_judgement_still_desc: "Підступна партія Цзунше намагалася обезголовити кліку під час перевороту. Тепер, коли їхня підтримка підірвана, решта делегатів напевно перебіжать до нас. Коаліція ТРАК також є крихкою, тож, залучивши на свій бік малі партії, ми зможемо остаточно її розвалити."

 QIE_government_by_friends: "Уряд друзів"
 QIE_government_by_friends_desc: "Попри перехід до цивільного вбрання бейянських службовців, чжилійська система «ґуаньсі» (зв'язків) процвітає. Всюди видно вплив фракцій Цзіньбао та Лоян. Хоча дехто назве це кумівством, насправді ми — єдина група, здатна керувати республікою."

 QIE_coopting_nationalist_rhetoric: "Перейняття націоналістичної риторики"
 QIE_coopting_nationalist_rhetoric_desc: "Націоналізм та ефективність партії «Молодий Китай» викликають захоплення. Їхнє стрімке зростання на місці, що звільнилося після Гоміньдану, вражає. Використовуючи їхні методи та простягнувши руку співпраці, ми збудуємо нову, єдину республіку разом."

 QIE_nationalising_noble_estates: "Націоналізація маєтків знаті"
 QIE_nationalising_noble_estates_desc: "Після реставрації маньчжурські лоялісти використали свої багатства для захоплення ключових галузей промисловості. Тепер, коли захисний щит монархії розбито, ми конфіскуємо їхні статки. Ми повернемо нації не лише її гідність, а й заводи."

 QIE_shoring_up_financial_centres: "Зміцнення фінансових центрів"
 QIE_shoring_up_financial_centres_desc: "Через хаос після розпаду ліги та спроби перевороту уряд мало приділяв уваги промисловості. Міністр Ван Кемінь радить терміново підтримати банківський сектор, вдихнувши нове життя в Банк Китаю."

 QIE_reaching_out_to_endeavour: "Діалог із «Зусиллям»"
 QIE_reaching_out_to_endeavour_desc: "Попри провал 1922 року, співпраця Бейяна та товариства «Зусилля» все ще можлива. У Пейфу та Ху Ші — принципові люди, і хоча вони розходяться у поглядах на федералізм, обидва прагнуть спільної мети: демократичної Китайської Республіки."

 QIE_xinhais_legacy: "Спадщина Сіньхаю"
 QIE_xinhais_legacy_desc: "Тимчасово зупинені, але не забуті, мрії революціонерів Сіньхаю знову розквітають. Реставрація 1928 року була лише інструментом для отримання допомоги, вона не могла тривати вічно. Нехай під сприятливими хмарами п'ять націй у єдиному союзі здобудуть свободу та відповідальне правління."

###- Zhili Military -###
##- Anti-Concessionist -##
 QIE_domain_of_the_jade_marshal: "Володіння нефритового маршала"
 QIE_domain_of_the_jade_marshal_desc: "Прокляті німці припинили військову допомогу у відповідь на наш праведний похід проти їхнього тиранічного гноблення китайського народу. Неважливо! Адже справжнє покликання чжилійської кліки — це мистецтво війни. Через наш войовничий і патріотичний дух ми мобілізуємо саму душу китайського народу. Імперіалістам залишається лише спостерігати."

 QIE_local_logistics: "Місцева логістика"
 QIE_local_logistics_desc: "Німеччина обіцяла постачати нам вантажівки та інше логістичне обладнання для майбутнього конфлікту з Японією. Проте після відкликання їхньої військової місії нам необхідно розвивати власні методи постачання армії. Розробляючи вітчизняний моторизований транспорт, ми зможемо прокласти лінії постачання значно далі від наших складів."

 QIE_king_of_the_battlefield: "Король поля бою"
 QIE_king_of_the_battlefield_desc: "В Європі чи Америці це можуть вважати безглуздям, але справжньою домінуючою силою в китайському озброєнні є артилерія. Вона є найбільш пріоритетним видом спорядження на нашому полі бою; найуспішніші кампанії завжди будувалися навколо її могутності. Аньґоцзюнь, Хуґоцзюнь, Цзінґоцзюнь — всі вони це знали, знаємо і ми."

 QIE_understanding_our_backyard: "Знання власних теренів"
 QIE_understanding_our_backyard_desc: "Суворий ландшафт Китаю вимагає від будь-якої армії наявності сильного інженерного корпусу. На жаль, аматорський рівень багатьох наших нинішніх військових інженерів заважає їм бути по-справжньому ефективними. Ми маємо реорганізувати наявні підрозділи підтримки та вдихнути нове життя в інженерне відділення Баодіна."

 QIE_placing_faith_in_the_underdogs: "Віра в наступників"
 QIE_placing_faith_in_the_underdogs_desc: "Найбільш вражаючим у пануванні чжилійців над китайською центральною армією є надмірна залежність від особистості У Пейфу та його штабу. Нефритовий маршал не житиме вічно, на чому наголошує військовий міністр маршал Ван. Якщо ми хочемо створити армію, гідну китайської держави, ми повинні диверсифікувати командний склад."

 QIE_emulating_the_jade_marshal: "Наслідування нефритового маршала"
 QIE_emulating_the_jade_marshal_desc: "Раз за разом ми бачили неймовірну стійкість китайського солдата, що б’ється проти переважаючих сил. Найкращим прикладом цього є маршал У Пейфу — беззаперечний воїн-конфуціанець і герой нації. Якщо кожен солдат зможе перейняти його бойовий дух, ми будемо непереможними."

 QIE_rolling_the_dice_on_the_markets: "Гра на ринках озброєнь"
 QIE_rolling_the_dice_on_the_markets_desc: "Наша антиконцесійна позиція не дозволяє нам мати справу з імперіалістами, що роздерли нашу країну на шматки, але у світі є багато держав, які або зазнали схожої долі, або поважають нас, або мають спільних ворогів. Росія, Скандинавія — міжнародний ринок зброї великий і різноманітний. Нам потрібно лише зробити рішучий крок."

 QIE_the_baoding_clique_and_the_third_avenue: "«Баодінська кліка» та третій шлях"
 QIE_the_baoding_clique_and_the_third_avenue_desc: "Нам бракує власних розробок в авіації, а обіцяні німецькі креслення так і не були отримані з очевидних причин. Згуртована навколо праці Цзяна Байлі «Про національну оборону», баодінська кліка прагне втілити стратегічні теорії цього славетного вченого-воїна. Використовуючи цей потенціал, ми розробимо власні літаки для війни у третьому вимірі."

 QIE_expat_air_training_scheme: "Програма підготовки пілотів-емігрантів"
 QIE_expat_air_training_scheme_desc: "Хоча вітчизняна школа авіації лише зароджується, вона розпорошена між різними воєначальниками. Оскільки кожен регіоналіст зачарований потенціалом авіації, з’явилася цікава можливість: відправляючи своїх пілотів за кордон та наймаючи іноземних інструкторів для наших кадетів, ми створимо сучасні та смертоносні китайські ВПС."

 QIE_utilising_european_dockyards: "Використання європейських верфей"
 QIE_utilising_european_dockyards_desc: "Хоча Королівство Італія брало участь у придушенні повстання боксерів, воно також постраждало від власної нерозсудливості. Роздерте на кілька держав, воно все ще має одні з найбільших верфей у світі. Схиляючись до нашого спільного статусу пригноблених нейтральних сторін, ми можемо замовити невеликий початковий флот для посилення наших позицій."

 QIE_reviving_the_beiyang_fleet: "Відродження бейянського флоту"
 QIE_reviving_the_beiyang_fleet_desc: "Бейянський флот перетворився на тінь самого себе. Колись китайські кораблі досягали берегів Америки, а тепер ми не здатні контролювати навіть власні води. Це неприпустимо. Адмірал Са Чженьбін уже робив це раніше, і зробить знову. Дотримуючись його порад щодо швидкого розширення флоту, ми відродимо морський дух Китаю."

 QIE_science_and_modernity_hand_in_hand: "Наука і модерність пліч-о-пліч"
 QIE_science_and_modernity_hand_in_hand_desc: "Баодінська військова академія — одна з найславетніших установ Китаю. В її стінах навчалися всі: революціонери, мілітаристи, бейянські державні діячі та навіть У Пейфу і Цао Кунь. Аби вшанувати цей заклад, ми маємо модернізувати його та збільшити фінансування, як того постійно вимагав Цзян Байлі."

 QIE_the_destitute_and_the_stragglers: "Знедолені та відставні"
 QIE_the_destitute_and_the_stragglers_desc: "Наша антиконцесійна позиція закриває нам шлях до офіційної допомоги від більшості європейських урядів, але окремі незалежні радники — це зовсім інша справа. Хаос останніх двадцяти років породив безліч професіоналів, готових продати свій досвід. Ретельно відбираючи найкращих, ми продовжимо модернізацію армії всупереч волі імперіалістів."

 QIE_reorganise_warlord_divisions: "Реорганізація дивізій мілітаристів"
 QIE_reorganise_warlord_divisions_desc: "Кожен воєначальник має власне ополчення для контролю територій. На жаль, ці війська варіюються від напівпрофесійних частин до натовпів грабіжників. Виділивши ресурси на їх стандартизацію та модернізацію, ми перетворимо їх на цінний актив. Це останній крок на шляху від мілітариста до державного діяча."

 QIE_defend_the_yellow_river: "Захистити Жовту річку!"
 QIE_defend_the_yellow_river_desc: "Хуанхе є критично важливою для нашої стратегії. Якщо загарбники перетнуть її, не залишиться жодного географічного бар’єру, здатного їх стримати. Заради порятунку нації та культури стратеги під егідою Цзяна Байлі запропонували радикальний план: у разі надзвичайної ситуації ми підірвемо дамби на Жовтій річці, щоб зупинити ворога."

##- Проконцесіоністи -##
 QIE_the_eagle_and_the_dragon: "Орел і дракон"
 QIE_the_eagle_and_the_dragon_desc: "Німецька зброя та технології мають свої переваги, попри політичну ціну зближення з Берліном. Через наші «особливі відносини», військову місію та Лігу процвітання ми можемо купувати найсучасніше спорядження. Броня та авіація, яким немає рівних у Китаї, тепер у нас під рукою. Потрібно лише заплатити встановлену ціну."

 QIE_chinese_auftragstaktik: "Китайська тактика доручень"
 QIE_chinese_auftragstaktik_desc: "Німецька армія панує завдяки своїй бойовій ефективності. Запорукою їхніх перемог у Світовій війні стали автономні підрозділи, здатні координувати дії заради єдиної стратегічної мети. Для впровадження цієї мобільної війни нам вкрай необхідні сучасні радіостанції, що вже використовуються по всій «Міттельойропі»."

 QIE_leaning_upon_the_juggernaut: "Опора на гіганта"
 QIE_leaning_upon_the_juggernaut_desc: "Китайські арсенали мають тривалу історію копіювання та модифікації німецьких розробок: від пістолетів Маузера до гвинтівок. Використовуючи контакти у верховному командуванні Німеччини, ми отримаємо доступ до креслень їхньої найсучаснішої зброї та налагодимо її місцеве виробництво."

 QIE_chinese_soldiers_german_weapons: "Китайські солдати, німецька зброя"
 QIE_chinese_soldiers_german_weapons_desc: "Наша оборонна промисловість — це лише розрізнені арсенали в різних провінціях, які часто використовуються місцевими воєначальниками для власних потреб. Поки ми не об’єднали їх, німецькі гвинтівки та спорядження допоможуть заповнити величезну прогалину в озброєнні нашої армії."

 QIE_utilising_our_connections: "Використання зв'язків"
 QIE_utilising_our_connections_desc: "Кайзерліхмаріне є провідною морською силою світу. Оскільки багато наших адміралів, як-от У Юйлінь, навчалися в німецьких школах, ми можемо використати ці зв’язки. Завдяки дипломатичній місії адмірала Са Чженьбіна ми отримаємо сучасні кораблі за значними знижками."

 QIE_license_luftstreitkrafte_airplanes: "Ліцензування літаків Люфтштрайткрафте"
 QIE_license_luftstreitkrafte_airplanes_desc: "Німеччина завжди вагалася щодо продажу своїх новітніх літаків. Проте ми можемо натиснути на головну причину, чому вони взагалі нас підтримують — Японію. Якщо ми маємо стримати «вранішнє сонце» у неминучому зіткненні, нам конче необхідні потужні військово-повітряні сили."

 QIE_the_chinese_armoured_corps: "Китайський бронетанковий корпус"
 QIE_the_chinese_armoured_corps_desc: "Наші молоді офіцери захоплені потенціалом залізних гігантів. Танк — це вістря мобільної війни, здатне оточувати дивізії швидше за піхоту. Більшість китайських командирів можуть лише мріяти про танкові бригади, але наші «особливі відносини» дають нам шанс. Імпортуючи німецьку броню, ми зможемо битися з Японією на рівних."

 QIE_extend_the_80_division_plan: "Продовження плану 80 дивізій"
 QIE_extend_the_80_division_plan_desc: "Техніка — це добре, але китайським арміям потрібні знання, які надавав амбітний «план 80 дивізій». Попри попереднє охолодження відносин, ми вже довели свою «лояльність» і налагодили достатньо зв’язків, аби домовитися про його відновлення. Наш дипломатичний корпус має владнати це питання."

 QIE_the_future_of_the_special_relationsip: "Майбутнє «особливих відносин»"
 QIE_the_future_of_the_special_relationsip_desc: "Після перемоги над Японією та об’єднання нації наші майбутні відносини з Німеччиною залишаються неясними. Асамблея розколота: націоналісти та реформатори вимагають внутрішнього курсу, тоді як «Ліга процвітання» наполягає на міцному союзі Пекіна та Берліна."

###- Manchu -###

 QIE_restoration: "Маньчжурська реставрація"
 QIE_restoration_desc: "У результаті майже неймовірного повороту подій стратегічні прорахунки Цао Куня та У Пейфу знищили їхній власний режим: частина колишніх союзників зрадила їх, об'єднавшись із маньчжурською аристократією. Майбутнє нового ладу, м'яко кажучи, непевне..."

 QIE_purge_zhili: "Убезпечити Північнокитайську рівнину"
 QIE_purge_zhili_desc: "Хоча сили, вірні змовникам, контролюють Пекін та околиці Баодінської військової академії, решта нашої території залишається під владою зрадливих чжилійських мілітаристів. Нам потрібно спершу захистити північний кордон, ліквідувавши тамтешні залоги чжилійців, перш ніж звертати погляд на південь."

 QIE_coup_backer: "Наш новий благодійник"
 QIE_coup_backer_desc: "Переворот, що знищив чжилійську кліку, не був здійснений самотужки. Подобається нам це чи ні, але заради звільнення країни від деспотичних воєначальників нам довелося укласти угоду з місцевими силами. Тепер ми маємо запросити їх до Пекіна і з'ясувати, чого вони хочуть в обмін на свою підтримку."

 QIE_zhang_tianran_backer: "Чжан Тяньжань"
 QIE_zhang_tianran_backer_desc: "Шановний майстер секти Іґуаньдао, Чжан Тяньжань, має колосальний вплив серед своїх послідовників. Його бажана роль у нашому уряді поки що неясна, але здається, що він готовий надати нам підтримку Іґуаньдао в обмін на певні поступки..."

 QIE_qu_yingguang_backer: "Цюй Їнґуан"
 QIE_qu_yingguang_backer_desc: "Губернатор Шаньдуна, Цюй Їнґуан, давно відомий як побожна та шанована людина. Хоча він прагне модернізації монархії, він також наголошує на традиціях та збереженні спадкоємності з нашим минулим."

 QIE_yan_xishan_backer: "Янь Сішань"
 QIE_yan_xishan_backer_desc: "Губернатор Янь Сішань став несподіваним союзником у нашому перевороті. Колишній антимонархіст, він завдяки своєму проникливому політичному розуму усвідомив, що імператор тепер є потужним політичним інструментом. Передусім він прагне працювати з існуючими партіями над модернізацією Китаю та поширенням своєї власної ідеології — туманної філософії, що поєднує традиціоналізм, лібералізм, націоналізм та синдикалізм."

 QIE_yiguandao: "Залучити вплив Іґуаньдао"
 QIE_yiguandao_desc: "Отримавши посаду в уряді, Чжан Тяньжань почав розширювати владу Іґуаньдао в країні. Хоча це зміцнило нашу легітимність серед вірян, не зовсім зрозуміло, кому вони вірні більше — нашому уряду чи вірі Чжана."

 QIE_gather_dynasties: "Зібрати династії"
 QIE_gather_dynasties_desc: "Важливою частиною плану реформ нашого благодійника є збір представників колишніх правлячих династій Китаю для легітимізації правління Пуї. Він уже почав розсилати запрошення, і протягом наступних тижнів члени королівських родин прибудуть до Пекіна."

 QIE_ceremonial_rites: "Відновити церемоніальні обряди"
 QIE_ceremonial_rites_desc: "За часів чжилійського режиму церемоніальні ритуали імператора були здебільшого відсунуті на задній план та ігнорувалися. Придворні чиновники запропонували повернути ці обряди в центр життя імперського уряду, аби прищепити населенню патріотичне піднесення."

 QIE_bolster_legitimacy: "Зміцнити імперський уряд"
 QIE_bolster_legitimacy_desc: "Протягом десятиліття панування чжилійців мало хто вважав імператора чимось більшим, ніж маріонеткою, замкненою в Забороненому місті. Тепер же, за підтримки нової конституційної системи та віри Іґуаньдао, люди починають бачити в імператорі важливу постать, що об'єднує уряд у його боротьбі за відновлення порядку."

 QIE_legitimate_emperor: "Законний імператор"
 QIE_legitimate_emperor_desc: "Наші зусилля увінчалися успіхом. Пуї тепер вважається законним правителем Китаю кожним селянином! Чжан Тяньжань, закріпивши владу в Шаньдуні, оголосив про повну інтеграцію провінції до складу нашої держави."

 QIE_modernize_monarchy: "Модернізувати монархію"
 QIE_modernize_monarchy_desc: "Хоча губернатор Шаньдуна є лоялістом Цін, він розуміє, що роль імператора має змінитися відповідно до сучасних уявлень про управління. Він планує спонукати імператора діяти більше як конституційний монарх західного зразка — аполітична постать, що об'єднує націю та виступає посередником у великих конфліктах."

 QIE_reinforce_confucianism: "Імператор і народ як одне тіло"
 QIE_reinforce_confucianism_desc: "Ще до Учанського повстання наші попередники намагалися піднести Конфуція з проповідника давньої мудрості до нового символу китайської нації. Цей новий державний культ мав вплести Конфуція в національний наратив, де шанований мудрець уособлював би культурну сутність та китайськість загалом. Відновлення державного культу Конфуція в освіті та культурних обрядах допоможе нам створити гармонійну та освічену імперію."

 QIE_revise_the_chinese_tripitaka: "Переглянути китайську Трипітаку"
 QIE_revise_the_chinese_tripitaka_desc: "Китайський буддійський канон тривалий час був предметом суперечок, але під керівництвом майстра Цюя ми створимо переглянуту «Трипітаку» — збірку текстів, що підкреслює консервативні та езотеричні елементи сект «червоних капелюхів», особливо школи Каґ'ю, як політичного наріжного каменя нашого нового уряду. Ми поширюватимемо ці ідеали як серед урядовців, так і серед самого імператора, який виявився прихильним до вчень «червоних капелюхів»."

 QIE_move_industry: "Перенести промисловість углиб країни"
 QIE_move_industry_desc: "Зважаючи на загрозу іноземного вторгнення, наш новий благодійник запропонував використати своїх солдатів для допомоги в перенесенні прибережних заводів углиб країни. У разі ворожої висадки з моря це гарантує нам можливість продовжувати постачання військ."

 QIE_train_civil_servants: "Підготувати державних службовців"
 QIE_train_civil_servants_desc: "Чжилійська бюрократія трималася на кумівстві, фаворитизмі та ендемічній корупції. Це призвело до того, що цивільна адміністрація Китаю перебувала в жахливому стані, а більшість посад обіймали некваліфіковані особи. Губернатор Цюй запропонував впровадити модернізовану версію старих державних іспитів, аби гарантувати, що ці посади обіймуть гідні люди."

 QIE_imperial_academy: "Заснувати академію культурних досліджень"
 QIE_imperial_academy_desc: "Після десятиліть занепаду наша культура почала згасати під тиском ерозії державної влади та західних цінностей. Наш благодійник нарешті вирішив змінити цю тенденцію та об'єднати інтелектуалів навколо престолу, заснувавши новий центр досліджень, покликаний трансформувати іноземні ідеї на більш прийнятні та близькі для майбутнього імперії."

 QIE_lessons_of_model_province: "Уроки «зразкової провінції»"
 QIE_lessons_of_model_province_desc: "Досвід, здобутий Янь Сішанем за десятиліття на посаді губернатора Шаньсі, стане вирішальним дороговказом для Китаю. Досягнення Шаньсі в освіті, сільському господарстві та промисловості здобули міжнародне визнання, попри матеріальну бідність провінції. Маючи в розпорядженні всі ресурси імперії, Янь має намір змінити Китай на краще."

 QIE_chinese_bismarck: "Китайський Бісмарк"
 QIE_chinese_bismarck_desc: "«Три головні обов'язки народу — служити в армії, платити податки та здобувати освіту».\n\nБудучи великим шанувальником прусської системи, Янь після перемоги Німеччини у Світовій війні ще більше утвердився в бажанні прищепити країні військовий дух. Він закликає батьків дарувати дітям іграшкову зброю та формує «товариство крові та заліза». Китай буде об'єднаний, якщо знадобиться — силою."

 QIE_replace_corrupt_govs: "Замінити корумпованих губернаторів"
 QIE_replace_corrupt_govs_desc: "Після успіху перевороту багато хто в асамблеї почав висловлювати огиду до колишніх адміністраторів-чжилійців середньої ланки, яких ми залишили при владі після громадянської війни. Члени владної партії пропонують звільнити всіх цих людей і замінити їх більш кваліфікованими та лояльними кандидатами."

 QIE_nationalize_yan_thot: "Націоналізація думок Янь Сішаня"
 QIE_nationalize_yan_thot_desc: "З моменту свого приходу до влади в Шаньсі, Янь присвятив величезну кількість часу розробці власної ідеології — еклетичної суміші федералізму, конфуціанства, християнства та навіть синдикалізму. Отримавши владу на національному рівні, Янь почав поширювати свої ідеї по всьому Китаю."

 QIE_vigor_modernization: "Енергійна модернізація"
 QIE_vigor_modernization_desc: "Янь Сішань давно був прихильником промислової модернізації, перетворивши відсталу провінцію Шаньсі на невеликий, але потужний центр гірничодобувної промисловості. Тепер, обійнявши високу посаду, він наполягає на застосуванні цього досвіду модернізації в масштабах усієї країни."

 QIE_prepare_for_storm: "Підготуватися до бурі"
 QIE_prepare_for_storm_desc: "Хоча ми спочатку скептично ставилися до їхнього впливу, наш благодійник приніс нам величезну користь за останні кілька місяців. З його допомогою ми тепер більш ніж готові протистояти будь-яким загрозам."

 QIE_form_emergency_govt: "Сформувати надзвичайний уряд"
 QIE_form_emergency_govt_desc: "Тепер, коли ми знищили залишки чжилійської кліки, настав час імператору обрати, яка з трьох партій коаліції керуватиме Китаєм."

 QIE_pick_CERA: "Довіритися ТРАК"
 QIE_pick_CERA_desc: "Товариство реформ Китайської імперії (ТРАК) — потужна партія, що користується лояльністю як сільських мешканців, так і міської інтелігенції. Хоча вони менше зосереджені на промисловості, їхня увага до потреб народних мас робить їх надзвичайно популярними."

 QIE_pick_YCP: "Довіритися ПМК"
 QIE_pick_YCP_desc: "Партія «Молодий Китай» (ПМК) складається з молодих кадетів Баодінської академії та міської інтелігенції, що забезпечує фінансування. Орієнтовані на централізацію та урбанізацію, вони не мають такої широкої підтримки як ТРАК, проте їхня ставка на модернізацію робить їх гарним вибором для швидкого розвитку."

 QIE_pick_MP: "Довіритися Цзунше"
 QIE_pick_MP_desc: "У партії Цзунше, очевидно, домінує маньчжурська знать Пекіна. Хоча це може здатися дивним вибором для владної партії, за останні десять років дворяни використали відносну свободу, надану чжилійцями, аби накопичити промислові статки, інвестуючи в заводи Пекіна, що не належали німцям. Це дало їм значну вагу."

 QIE_rural_reform: "Інституціоналізувати рух сільських реформ"
 QIE_rural_reform_desc: "Хаос епохи мілітаристів спустошив сільський Китай. Рух сільської реконструкції, частина ТРАК, останні кілька років намагався вирішити ці проблеми без державної підтримки. За умови належного фінансування вони зможуть реально змінити ситуацію у відбудові країни."

 QIE_CERA_industry: "Інвестувати в сільську промисловість"
 QIE_CERA_industry_desc: "Зараз нечисленна промисловість Китаю зосереджена в містах, що робить її вразливою до атак та заворушень. ТРАК пропонує розосередити виробництво по селах. Це сприятиме їхньому зростанню та зробить нашу індустрію менш вразливою для іноземного вторгнення."

 QIE_kang_youwei: "Спадщина Кан Ювея"
 QIE_kang_youwei_desc: "Кан Ювей був одним із засновників ТРАК, хоча він помер невдовзі після її створення у 1927 році. Блискучий вчений і реформатор права, Кан пів століття обстоював ідею конституційної монархії з імператором, який справді піклується про свій народ. З поваленням чжилійців ця мрія стала близькою до реальності."

 QIE_rural_infrastructure: "Модернізувати сільську інфраструктуру"
 QIE_rural_infrastructure_desc: "Сільська інфраструктура Китаю перебуває в жахливому стані; дехто називає її найгіршою у світі після Африки. Необхідні цілеспрямовані державні інвестиції в покращення транспортних мереж, якщо ми хочемо вивести селянство зі злиднів."

 QIE_benevolent_emperor: "Великодушний імператор"
 QIE_benevolent_emperor_desc: "Тоді як на Заході імператора Китаю вважають якимось деспотичним воєначальником із середньовіччя, ми знаємо, що він — великодушна і добра душа, що бажає найкращого для своїх підданих. Потрібна потужна пропаганда, аби кожен побачив наше бачення як істину."

 QIE_rural_loyalty: "Забезпечена лояльність села"
 QIE_rural_loyalty_desc: "ТРАК завершила свій великий план сільських реформ і закріпила владу. Навіть у тих частинах Китаю, які ми не контролюємо прямо, люди прагнуть нашого мудрого керівництва! Коли вороги ввійдуть на нашу землю, народ не буде легкою здобиччю — селяни готові віддати життя, захищаючи Китай!"

 QIE_reform_criminal_justice: "Бюро перегляду законодавства"
 QIE_reform_criminal_justice_desc: "Засноване у 1902 році, це бюро проводило масштабні судові реформи, розробивши Кримінальний та Цивільний кодекси Великої Цін, проте ці успіхи були перервані республіканською анархією. Зараз, коли ми відбудовуємо країну, послуги бюро знову необхідні."

 QIE_military_state: "Мілітаризувати державу"
 QIE_military_state_desc: "Хоча чжилійська кліка була військовою організацією, вона залишила армію Цін неефективною та недофінансованою. Аби виправити це, ми розпочали тотальну мілітаризацію нації. Молодіжні тренувальні ліги, модернізована система призову та інші реформи гарантують нашу готовність до зустрічі з будь-яким ворогом."

 QIE_centralize_state: "Централізувати державу"
 QIE_centralize_state_desc: "Два десятиліття міжусобних воєн залишили Китай роздробленим. З нашої нової позиції сили в Пекіні ми маємо розпочати тривалу та важку працю з централізації нації, бо лише тоді народ пізнає справжній мир і процвітання."

 QIE_YCP_arsenals: "Модернізувати арсенали"
 QIE_YCP_arsenals_desc: "Арсенали, що мають забезпечувати нашу воєнну машину, безнадійно застаріли. Необхідні значні інвестиції у виробництво зброї та боєприпасів, якщо ми хочемо мати бодай якийсь шанс на перемогу над нашими ворогами."

 QIE_destroy_leftists: "Знищити ліваків"
 QIE_destroy_leftists_desc: "Хоча на наших територіях справжніх лівих мало, нещодавнє повстання Гоміньдану на півдні викликало «червону паніку» серед еліти. Ми можемо використати це на свою користь, роздмухуючи заяви про «соціалістичне проникнення» для зміцнення режиму та заохочення народної підтримки."

 QIE_emperor_unifier: "Імператор-об'єднувач"
 QIE_emperor_unifier_desc: "Хоча дехто бачить в імператорі анахронізм, він є корисним інструментом — точкою згуртування, навколо якої може об'єднатися роздроблена країна. Пропаганда має донести до кожного китайця — від фермера на Хуанхе до пастуха в степах Сіньцзяна — що всі вони є частиною однієї нації."

 QIE_YCP_modernization: "Модернізувати цивільну промисловість"
 QIE_YCP_modernization_desc: "Ті нечисленні цивільні підприємства, якими раніше не керували німці, виглядають смішно за західними мірками. Після виходу німецького капіталу ми можемо взяти їхні проєкти та застосувати на власних заводах, значно збільшивши обсяги виробництва."

 QIE_cult_of_progress: "Бюро прогресу"
 QIE_cult_of_progress_desc: "Незадоволені порожніми дебатами в асамблеї, члени ПМК взяли на себе створення «Бюро прогресу» для нагляду за реформами в армії та індустрії. Під егідою Янь Сішаня партія сподівається затьмарити асамблею організаціями власного зразка, повністю оминаючи законодавчий нагляд."

 QIE_YCP_modern_warfare: "Потреби сучасної війни"
 QIE_YCP_modern_warfare_desc: "Події останнього десятиліття навчили офіцерів важливості якісної артилерії. Найкраще це розуміє ядро ПМК. Багато хто з них отримав освіту в Німеччині і на власні очі бачив силу сучасного озброєння. Держава не може ні на мить зупиняти свій рух до модернізації."

 QIE_YCP_trappings_of_a_party_state: "Ознаки партії-держави"
 QIE_YCP_trappings_of_a_party_state_desc: "Пліч-о-пліч ПМК та Янь Сішань працюють над створенням нового Китаю, вільного від хронічних хвороб, породжених старою знаттю та мілітаристами. Світ стрімко змінився, і обов'язок партії — засвоїти ці уроки та відповідно сформувати майбутнє країни."

 QIE_chinese_century: "Китайське століття"
 QIE_chinese_century_desc: "Завершивши масштабні реформи, ми виходимо на світову арену як зростаюча держава, готова кинути виклик ворогам і раз і назавжди довести світу, що Китай — справжній господар Сходу."

 QIE_appoint_viceroys: "Генеральна адміністрація зв'язку"
 QIE_appoint_viceroys_desc: "Розвиток телекомунікацій у Китаї розпочався з відкритого листа губернатора Лі Хунчжана у 1879 році. Хоча він прагнув пріоритету для потреб армії, інші реформатори бачили в цьому величезну вигоду для економіки. Реструктуризація телеграфного управління допоможе втілити ці амбіції в життя."

 QIE_new_coronation: "Нова коронація"
 QIE_new_coronation_desc: "Серед знаті Цін виникла ідея повторної коронації Пуї. Хоча це дорого, такий крок продемонструє світу, що ми скинули кайдани мілітаризму і розпочали нову еру відродження."

 QIE_imperial_arsenals: "Збудувати нові імперські арсенали"
 QIE_imperial_arsenals_desc: "Індустріалізація Китаю почалася з військового виробництва. Саме потреба в безпеці змушувала ранніх реформаторів розвивати важку промисловість. Тепер ми маємо надолужити згаяне, аби гарантувати виживання нашої імперії."

 QIE_noble_factories: "Бюро промислових справ"
 QIE_noble_factories_desc: "Після конфіскації німецьких підприємств багато заводів пустують. Ми бачимо в цьому шанс для вітчизняної індустрії. За зразком хан'янського арсеналу та кайпінських копалень ми націоналізуємо та вдосконалимо ці активи."

 QIE_raise_banners: "Скликати стяги"
 QIE_raise_banners_desc: "Хоча систему «восьми стягів» було розпущено, генерали пропонують створити її сучасну версію. Дотримуючись західної структури дивізій, ми додамо спадщину Цін, аби зробити армію справді нашою."

 QIE_imperial_roads: "Дракон та залізний кінь"
 QIE_imperial_roads_desc: "Губернатори Лі Хунчжан та Чжан Чжидун були піонерами інфраструктури. Ми вшануємо їхню спадщину, об'єднавши простори нашої імперії мережею нових доріг та залізниць."

 QIE_mandate_heaven: "Мандат Неба"
 QIE_mandate_heaven_desc: "Хтось скаже, що це застарілий термін, але Мандат Неба — це вираз легітимної волі уряду. Наші вчені оновлять тексти, аби довести кожному, що Пуї — справжній і законний імператор Китаю."

 QIE_manchu_default_debt: "Оголосити дефолт за боргами"
 QIE_manchu_default_debt_desc: "Міжнародні кредитори не зважають на зміну уряду. Величезний зовнішній борг гальмуватиме наше зростання, якщо ми не відмовимося від нього. Це зашкодить нам зараз, але дозволить розвиватися в майбутньому."

 QIE_more_equal_treaties: "Переговори про борг"
 QIE_more_equal_treaties_desc: "Впливові члени Цзунше пропонують альтернативу дефолту. Німецький вплив підупав, але пропозиція переглянути економічні зв'язки може стати для Берліна шансом зберегти бодай якусь вагу в Пекіні."

 QIE_county_reorganization: "Акт про реорганізацію повітів"
 QIE_county_reorganization_desc: "Цей закон докорінно змінить відносини в селах, нав'язуючи волю імператора. Це ризиковано, але ми сподіваємось, що місцева влада перестане бути корумпованою і стане інструментом покращення життя підданих."

 QIE_county_assemblies: "Відновити повітові асамблеї"
 QIE_county_assemblies_desc: "У 1910 році Чжилі експериментувала з самоврядуванням. Ми відродимо ці асамблеї, аби заручитися підтримкою сільських еліт, які допоможуть закріпити наш контроль над регіонами."

 QIE_imperial_consolidation: "Умиротворення нації"
 QIE_imperial_consolidation_desc: "Китаєм правлять кліки мілітаристів, ліваки та республіканці. Цих зрадників має бути знищено! Наші армії об'єднають Китай під стягом імператора."

 QIE_demand_fealty: "Вимагати вірності від мілітаристів"
 QIE_demand_fealty_desc: "Республіканців та ліваків треба нищити, але ідеологічно гнучких воєначальників можна приборкати загрозою нашої армії. Якщо вони не схилять коліно — ми їх розчавимо."

 QIE_destroy_concessions: "Ліквідувати концесії"
 QIE_destroy_concessions_desc: "Міста-концесії — це пляма на суверенітеті Китаю. Торгівля з Заходом припустима, але ці релікти «століття приниження» не мають місця в нашій державі. Поки світ у хаосі, настав час повернути наші міста!"

 QIE_false_republic: "Боротьба з північними зрадниками"
 QIE_false_republic_desc: "Дурні на півночі називають себе «останнім бастіоном» законного уряду, хоча насправді є японськими маріонетками. Поки вони прислужують господарям, ми маємо повернути нашу батьківщину!"

 QIE_we_win: "Дракон повстає з попелу"
 QIE_we_win_desc: "Мало хто вірив, але ми тріумфували! Тепер ми — безперечні господарі Китаю, а імператор готовий вести націю в новий дивовижний світ."

 QIE_rebuild_command_structure: "Реструктуризація імперського генштабу"
 QIE_rebuild_command_structure_desc: "Наш нинішній штаб — це спадок чжилійців, просякнутий кумівством. Лише повне очищення цієї гнилої структури забезпечить ефективність та лояльність командирів."

 QIE_foreigner_against_foreigner: "Шанхайський зв'язок"
 QIE_foreigner_against_foreigner_desc: "У концесіях багато європейських офіцерів залишилися без роботи після краху їхніх імперій. Багато хто з них тримає зло на Німеччину. Їхня служба принесе нам не лише військову вигоду, а й цінні зв'язки всередині легацій."

 QIE_look_to_our_past: "Спадщина нових армій"
 QIE_look_to_our_past_desc: "Створені у 1895 році для захисту, нові армії натомість зрадили імператора. Ми вивчили помилки минулого, зокрема небезпеку надмірної влади місцевих командирів, і збудуємо потужнішу силу."

 QIE_assess_doctrines: "Комісія з реорганізації армії"
 QIE_assess_doctrines_desc: "Комісія, заснована у 1903 році, заклала основи наших сил. Мілітаристи змарнували прогрес своїми чварами, тож ми знову зберемо комісію для перегляду та реформи імперського війська."

 QIE_uneasy_coalition: "Тримка коаліція"
 QIE_uneasy_coalition_desc: "ТРАК дає лояльність селян, ПМК — кадетів Баодіна, а знать — найкращу кавалерію. Ми маємо працювати разом проти японців, але кожна група вимагатиме поступок, якщо не буде при владі."

 QIE_rural_defense_force: "Заснувати сили сільської оборони"
 QIE_rural_defense_force_desc: "Селяни довго страждали від бандитів. ТРАК пропонує озброїти кожне село застарілими гвинтівками. Хоча їхня військова цінність сумнівна, вони зроблять окупацію нашої землі занадто дорогою для ворога."

 QIE_prepare_dikes: "Підготувати дамби"
 QIE_prepare_dikes_desc: "Дамби на Хуанхе — це можливість завдати нищівного удару по японцях. Якщо ми підірвемо їх під час наступу ворога, повінь зупинить їх і дасть нам шанс на успішну оборону."

 QIE_exploit_baoding_contacts: "Використати зв'язки Баодіна"
 QIE_exploit_baoding_contacts_desc: "Баодінська академія має контакти з арсеналами по всьому Китаю, навіть у ворогів. За належного фінансування цих підрядників можна переконати перейти на наш бік разом із їхнім досвідом."

 QIE_reinstate_baojia: "Відновити систему баоцзя"
 QIE_reinstate_baojia_desc: "Система баоцзя, створена ще за династії Сун, допомагає підтримувати порядок, збирати податки та організовувати проєкти. Її сучасна версія дозволить нам ефективніше залучати рекрутів."

 QIE_best_money_can_buy: "Військові підготовчі школи"
 QIE_best_money_can_buy_desc: "Ці школи були створені для швидкого вирішення браку офіцерів для нової армії. Хоча якість навчання різнилася, вони допомагали зменшити витрати на підготовку. Нам варто відродити ці військові зали."

 QIE_imperial_propaganda: "Вшанування моделі громадянина-солдата"
 QIE_imperial_propaganda_desc: "Мілітаристи спаплюжили звання солдата своїми жадібними чварами. Ідеальний солдат — морально стійкий, сильний тілом і гострий розумом. Ми впровадимо цю модель справжньої мужності, аби воїни Великої Цін могли на рівних битися з Японією та Німеччиною."

 QIE_manchu_naval_academy: "Заснувати імперську військово-морську академію"
 QIE_manchu_naval_academy_desc: "Флот Цін зазвичай тренували європейці. Хоча зараз це не першочергове питання, ми маємо виховувати власних кадетів удома, а не за кордоном."

 QIE_manchu_air_warfare: "Вивчення європейської авіаційної тактики"
 QIE_manchu_air_warfare_desc: "Ми не хочемо нічого брати від іноземних дияволів, але їхня майстерність у небі беззаперечна. Ми вивчимо їхню доктрину, аби застосувати її у наших власних ВПС."

 QIE_expand_baoding_rnd: "Заснувати департамент військових досліджень Баодіна"
 QIE_expand_baoding_rnd_desc: "Після реформи армії ми маємо створити установу для відстеження технологічних інновацій. Власний департамент досліджень дозволить нам не відставати від найкращих армій світу."

