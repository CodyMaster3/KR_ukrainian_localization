 QIE_zhang_guotao_leader_desc: "§YНародився:§! §L26 листопада 1897 року в Пінсяні, провінція Цзянсі, Велика Цін§!"

 # Лі Дачжао
 QIE_li_dazhao: "Лі Дачжао"
 QIE_li_dazhao_leader_desc: "§YНародився:§! §L29 жовтня 1889 року в повіті Лаотін, провінція Чжилі, Велика Цін§!\n§YПриналежність:§! §rКСП§!\n§YБіографія:§! §LЗдобувши класичну освіту, Лі став вченим і у 1907 році вступив до Бейянської школи права та політики. Під час навчання брав участь у створенні студентських товариств, заснував низку журналів та газет, де просував революційні ідеї. Разом із однокурсниками він зрештою приєднався до Китайської соціалістичної партії.\n\nПісля репресій проти соціалістів Лі навчався в Японії, вивчаючи англійську та японську мови. Повернувшись до Китаю, він очолив бібліотеку Пекінського університету. Будучи активним учасником «руху за нову культуру» та «руху 4 листопада», Лі почав схилятися до синдикалізму і став співзасновником Китайської синдикалістської партії разом із Чень Дусю.\n\nЗабезпечивши створення єдиного фронту з Гоміньданом, Лі сприяв значному зростанню партії. Після провалу Північного походу він опинився в Шанхаї, очоливши ортодоксальну фракцію Ліги китайських синдикалістів. Вплив Лі Дачжао поширюється на Гоміньдан, Ху Ші, Ґу Мен'ю та багатьох інших інтелектуальних титанів Китаю.§!"

 # Лю Каньюань
 QIE_liu_kanyuan: "Лю Каньюань"
 QIE_liu_kanyuan_leader_desc: "§YНародився:§! §Lгрудень 1893 року в повіті Лілін, провінція Хунань, Велика Цін§!"

 # Айсін Ґьоро Пуї
 QIE_aisin_gioro_puyi: "Айсін Ґьоро Пуї"
 QIE_aisin_gioro_puyi_desc_body: "«Його імператорська величність, син неба, імператор Сюаньтун» — хоча Пуї має безліч титулів, молодий імператор фактично не мав реальної влади з моменту народження у 1906 році. Зійшовши на престол у два роки, він був повалений менш ніж за 4 роки, після чого «хлопчик-імператор» правив лише Забороненим містом.\n\nЗавдяки впливу Реджинальда Джонстона Пуї захопився західною культурою, почав носити європейські костюми та відрізав косу. Після зради Фен Юйсяна у 1924 році його примусово виселили із Забороненого міста, і він втік до японського посольства.\n\nЖивучи в тяньцзіньській концесії, Пуї вів діалог із Чжан Цзуолінем та У Пейфу, марно сподіваючись на відновлення статус-кво. Зрештою, він був втретє повернутий на трон у 1928 році після переговорів Цао Куня з Німецькою імперією."
 QIE_aisin_gioro_puyi_leader_desc: "§YНародився:§! §L7 лютого 1906 року в маєтку принца Чуня, Пекін, Велика Цін§!\n§YБіографія:§! §L$QIE_aisin_gioro_puyi_desc_body$ Населення ставиться до нього з неприязню; Пуї править лише як «гумова печатка», будучи розмінною монетою у грі великих держав.§!\n\n§YПримітки: Пуї вважають жорстоким і зловтішним, що багато хто пов'язує з його важким вихованням при дворі. Проводячи час у Забороненому місті, він захопився тенісом та каліграфією.§!"
 QIE_aisin_gioro_puyi_manchu_leader_desc: "§YНародився:§! §L7 лютого 1906 року в маєтку принца Чуня, Пекін, Велика Цін§!\n§YБіографія:§! §L$QIE_aisin_gioro_puyi_desc_body$\n\nВідновлений при владі після Маньчжурської реставрації, новий уряд Цін обрав курс на модернізацію. Пуї все ще бракує повноти влади, але це частина продуманого плану. Боючись появи тирана, імператор та юристи розробили структуру конституційної монархії, де Пуї має духовну та патріотичну владу, але виконує лише дорадчу роль у законодавстві. Світ сподівається, що Пуї стане прикладом сучасного монарха.§!"

 # У Пейфу
 QIE_wu_peifu: "У Пейфу"
 QIE_wu_peifu_bio: "У Пейфу навчався топографії в Баодінській військовій академії. Під час російсько-японської війни він дослужився до капітана, а згодом приєднався до нової армії під командуванням Цао Куня. У відзначився під час Сіньхайської революції.\n\nПрозваний «найсильнішою людиною в Китаї», У став першим китайцем на обкладинці журналу Time. Його спроба створити «кабінет добрих людей» у 1922 році провалилася через внутрішні чвари. У 1926 році він повернувся на північ, аби розгромити Ґоміньцзюнь. Разом із Чжан Цзуолінем він створив Аньґоцзюнь для протидії Гоміньдану. Зрештою він зіткнувся з фентянською клікою за контроль над Пекіном, перемігши їх у Третій та Четвертій чжилійсько-фентянських війнах.\n\nПопри те, що він спочатку виступав проти реставрації монархії у 1928 році, У адаптувався до нової системи, відтіснивши монархістів і зберігши домінування бейянських генералів.\n\n§YПримітки: Патріотизм та надія на демократичне республіканське майбутнє зробили його людиною з безмежними амбіціями. Він захоплюється постаттю Джорджа Вашингтона, вважаючи себе «батьком-засновником» китайської республіки.§!"
 QIE_wu_peifu_leader_desc: "§YНародився:§! §L22 квітня 1874 року в Пенлаї, провінція Шаньдун, Велика Цін§!\n§YБіографія:§! §L$QIE_wu_peifu_bio$§!"
 QIE_wu_peifu_sic_desc: "§YНародився:§! §L22 квітня 1874 року в Пенлаї, провінція Шаньдун, Велика Цін§!\n§YПриналежність:§! §cЛоян§!\n§YБіографія:§! §L$QIE_wu_peifu_bio$§!"

 # Ху Ші
 QIE_hu_shih: "Ху Ші"
 QIE_hu_shih_bio: "Народився в Шанхаї в родині торговця чаєм. Завдяки стипендії Боксерського відшкодування навчався в Корнелльському університеті, а згодом — у Колумбійському під керівництвом Джона Дьюї. Повернувшись до Китаю професором Пекінського університету, він став ключовою фігурою «руху за нову культуру», просуваючи використання розмовної китайської мови в літературі.\n\nЯк політичний філософ, він відстоював «прагматизм» (експериментальне мислення), сподіваючись застосувати науковий підхід до державного управління. Він уникав вступу до партій, натомість торуючи власний шлях лібералізму, індивідуалізму та конституціоналізму, водночас критикуючи колег, які схилялися до соціалізму.\n\n§YПримітки: Палко незалежний, він готовий кинути виклик будь-якому диктатору в Пекіні.§!"
 QIE_hu_shih_leader_desc: "§YНародився:§! §L17 грудня 1891 року в Чуаньша, провінція Цзянсу, Велика Цін§!\n§YБіографія:§! §L$QIE_hu_shih_bio$§!"
 QIE_hu_shih_advisor_desc: "§YНародився:§! §L17 грудня 1891 року в Чуаньша, провінція Цзянсу, Велика Цін§!\n§YПриналежність:§! §lНезалежний§!\n§YБіографія:§! §L$QIE_hu_shih_bio$§!"

 # Ґу Вейцзюнь (Веллінгтон Ку)
 QIE_wellington_koo: "Ґу Вейцзюнь (Веллінгтон Ку)"
 QIE_wellington_koo_bio: "Ґу Вейцзюнь виріс у заможній родині в Шанхаї і поїхав до США у 1904 році для здобуття західної освіти. У Колумбійському університеті він вивчав політику та дипломатію, досконало оволодівши англійською мовою. \n\nЮань Шикай запросив його на посаду секретаря президентського палацу, де він працював перекладачем. Ставши послом у США, Ґу виступив проти імперських амбіцій Юаня. Він став національним героєм завдяки запеклій боротьбі проти японського впливу в Шаньдуні. За підтримки У Пейфу він став виконувачем обов'язків прем'єр-міністра у 1926 році. Ґу вважається одним із найздібніших політиків Китаю, готовим служити нації на будь-якій посаді."
 QIE_wellington_koo_leader_desc: "§YНародився:§! §L29 січня 1888 року в повіті Цзядін, провінція Цзянсу, Велика Цін§!\n§YБіографія:§! §L$QIE_wellington_koo_bio$§!"
 QIE_wellington_koo_advisor_desc: "§YНародився:§! §L29 січня 1888 року в повіті Цзядін, провінція Цзянсу, Велика Цін§!\n§YПриналежність:§! §LАполітичний§!\n§YБіографія:§! §L$QIE_wellington_koo_bio$§!"

 # У Сяньцзи
 QIE_wu_xianzi: "У Сяньцзи"
 QIE_wu_xianzi_bio: "У Сяньцзи приєднався до монархічної партії Кан Ювея та Лян Цічао у 1904 році. Після заснування республіки він обіймав численні державні посади протягом 15 років. \n\nЯк переконаний прогресист та конституціоналіст, він допоміг заснувати коаліцію ТРАК. У 1927 році він став одним із засновників Китайської конституційної партії. У очолює фракцію «демократичних конституціоналістів», яка виступає за модернізацію політичного устрою Китаю."
 QIE_wu_xianzi_advisor_desc: "§YНародився:§! §L3 червня 1881 року в повіті Наньхай, провінція Ґуандун, Велика Цін§!\n§YПриналежність:§! §cДКП§!\n§YБіографія:§! §L$QIE_wu_xianzi_bio$§!"
 QIE_wu_xianzi_leader_desc: "§YНародився:§! §L3 червня 1881 року в повіті Наньхай, провінція Ґуандун, Велика Цін§!\n§YБіографія:§! §L$QIE_wu_xianzi_bio$§!"

 # Сюй Цінь
 QIE_xu_qin: "Сюй Цінь"
 QIE_xu_qin_bio: "Сюй Цінь був головним автором журналу «Цянсюе» під керівництвом Кан Ювея. Після провалу «ста днів реформ» у 1898 році він пішов у вигнання разом із Каном, засновуючи газети для боротьби з революційними настроями. \n\nУ 1912 році він був обраний до асамблеї і очолив філію Прогресивної партії в Ґуандуні. Під час війни на захист республіки він був головнокомандувачем ґуандунської армії. Будучи запеклим противником мілітаризму, він очолив Конституційну партію після смерті Лян Цічао, ставши прямим спадкоємцем ідей Кана та Ляна."
 QIE_xu_qin_leader_desc: "§YНародився:§! §L1873 рік, повіт Саньшуй, провінція Ґуандун, Велика Цін§!\n§YБіографія:§! §L$QIE_xu_qin_bio$§!"
 QIE_xu_qin_advisor_desc: "§YНародився:§! §L1873 рік, повіт Саньшуй, провінція Ґуандун, Велика Цін§!\n§YПриналежність:§! §cЧКП§!\n§YБіографія:§! §L$QIE_xu_qin_bio$§!"

 #沈钧儒
 QIE_shen_junru: "Шень Цзюньжу"
 QIE_shen_junru_bio: "Славетний чжецзянський конституціоналіст, демократ і федераліст, Шень Цзюньжу є одним із найвидатніших представників демократичної інтелігенції Китаю. У віці 15 років він посів перше місце на іспиті з поезії та прози, згодом захопившись ідеями Кан Ювея та Лян Цічао. Навчався в університеті Хосей в Японії, спостерігаючи за стрімким розвитком країни після реставрації Мейдзі. Повернувся до Китаю в 1908 році для служби в Чжецзяні.\n\nОрганізувавши Конституційне національне товариство, він розчарувався у повільних темпах реформ Цін і підтримав участь Чжецзяна в Сіньхайській революції. Обирався до сенату, був членом Тунменхуея та Гоміньдану. Підтримував боротьбу проти Юань Шикая, брав участь у діяльності Уряду захисту конституції в Кантоні.\n\nУ 1920 році Шень вивчав «Капітал» Маркса, а в 1922 році брав участь у розробці конституції Цао Куня. Подав у відставку через корупційний скандал Цао, намагаючись організувати федералістський проєкт для протидії Сунь Чуаньфану. Після Північного походу викладав право в Шанхаї. Виступаючи проти репресій у 1932 році, він переїхав до Пекіна для активної участі в політиці. Шень став одним із засновників Федерації національного порятунку і після арешту в ході «інциденту семи джентльменів» став справжнім мучеником демократичного конституціоналізму."
 QIE_shen_junru_leader_desc: "§YНародився:§! §L2 січня 1875 року в Сучжоу, провінція Цзянсу, Велика Цін§!\n§YБіографія:§! §L$QIE_shen_junru_bio$§!"
 QIE_shen_junru_advisor_desc: "§YНародився:§! §L2 січня 1875 року в Сучжоу, провінція Цзянсу, Велика Цін§!\n§YПриналежність:§! §SФНП§!\n§YБіографія:§! §L$QIE_shen_junru_bio$§!\n\n§YПримітки: Відомий участю у заснуванні майже всіх ключових демократичних альянсів Китаю.§!"

 # Лі Хуан
 QIE_li_huang: "Лі Хуан"
 QIE_li_huang_sic_desc: "§YНародився:§! §L1895 рік у Ченду, провінція Сичуань, Велика Цін§!\n§YПриналежність:§! §nПМК§!\n§YБіографія:§! §LВивчаючи французьку в шанхайському коледжі «Аврора», Лі познайомився з Цзен Ці та Цзо Шуньшенем. У 1918 році приєднався до Товариства молодого Китаю, де виступив проти захоплення Лі Дачжао соціалізмом, вважаючи націоналізм єдиним вірним рішенням для Китаю. Перед навчанням у Паризькому університеті написав «Прощальне слово побратимам», де різко засудив марксизм та Жовтневий переворот у Росії.\n\nУ 1923 році під Парижем він офіційно провів церемонію заснування партії «Молодий Китай». Лі проголосив за мету «викорінення соціалізму», «боротьбу за незалежність Китайської Республіки» та «повалення мілітаристів». Повернувшись до Китаю в 1924 році, він розпочав кампанію проти синдикалістів та лівого крила Гоміньдану. \n\nПопри прихильність до парламентаризму, Лі та його партія не мають жодних докорів сумління щодо співпраці з мілітаристами чи монархістами, аби лише зміцнити позиції нації.§!\n\n§YПримітки: Попри радикальний ультранаціоналізм своєї партії, Лі Хуан залишається одним із небагатьох інтелектуалів ПМК, які підтримують коректні відносини з іншими силами.§!"

 # Хуан Боцяо
 QIE_huang_boqiao: "Хуан Боцяо"
 QIE_huang_boqiao_bio: "Рано втративши батьків, Хуан переїхав до Шанхая. Навчався в німецькому класі початкової військової школи, згодом у медичній школі Тунцзі. Під час Сіньхайської революції вступив до молодіжного корпусу смертників. Після завершення революції перевівся на інженерний факультет.\n\nСтавши видатним випускником факультету електромашинобудування Тунцзі, він у 1920 році поїхав до Берлінського університету вивчати промисловий менеджмент. У 1922 році отримав ступінь доктора інженерії. Повернувшись до Китаю, працював головним інженером «Китайського залізоробного заводу» та займався розвитком професійної освіти.\n\nЙого знання інфраструктури та тісні зв'язки з німцями дозволили йому стрімко покращити систему національних залізниць Китаю, принаймні на землях під контролем чжилійської кліки."
 QIE_huang_boqiao_leader_desc: "§YНародився:§! §L1890 рік у Тайцані, провінція Цзянсу, Велика Цін§!\n§YБіографія:§! §L$QIE_huang_boqiao_bio$§!"
 QIE_huang_boqiao_advisor_desc: "§YНародився:§! §L1890 рік у Тайцані, провінція Цзянсу, Велика Цін§!\n§YПриналежність:§! §LАполітичний§!\n§YБіографія:§! §L$QIE_huang_boqiao_bio$§!"

 # Хуан Фу
 QIE_huang_fu: "Хуан Фу"
 QIE_huang_fu_bio: "Виходець із бідної родини, Хуан навчався у благодійній школі і був зачарований працями Лян Цічао про військовий дух. Це привело його до Чжецзянської військової академії. У 1905 році він поїхав на навчання до Японії, де приєднався до Тунменхуея і познайомився з Чан Кайші. Разом вони склали клятву крові.\n\nХуан обіймав важливі штабні посади в Шанхаї, але після провалу Другої революції був змушений тікати до Південно-Східної Азії, Європи та Америки. Повернувшись до Китаю, він зблизився з бейянськими політиками і в 1921 році став радником уряду. Обіймав посади в.о. міністра закордонних справ та міністра освіти. Під час Пекінського перевороту 1924 року співпрацював із Фен Юйсяном, ставши на короткий час в.о. прем'єр-міністра. Саме він допоміг вигнати імператорський двір, перетворивши Заборонене місто на музей.\n\nПісля провалу Північного походу Хуан залишився на півночі. З відновленням асамблеї він очолив Кліку політичних наук, виступаючи за ліберальні реформи."
 QIE_huang_fu_leader_desc: "§YНародився:§! §L8 березня 1880 року в повіті Шаньюй, провінція Чжецзян, Велика Цін§!\n§YБіографія:§! §L$QIE_huang_fu_bio$§!\n\n§YПримітки: Через зв'язки з Гоміньданом та роль у Пекінському перевороті, Хуан Фу вважається чи не головним ворогом чжилійців в асамблеї.§!"
 QIE_huang_fu_advisor_desc: "§YНародився:§! §L8 березня 1880 року в повіті Шаньюй, провінція Чжецзян, Велика Цін§!\n§YПриналежність:§! §mКліка політичних наук§!\n§YБіографія:§! §L$QIE_huang_fu_bio$§!"

 # Янь Хуейцін
 QIE_yan_huiqing: "Янь Хуейцін"
 QIE_yan_huiqing_leader_desc: "§YНародився:§! §L2 квітня 1877 року в Шанхаї, провінція Цзянсу, Велика Цін§!\n§YБіографія:§! §LЯнь здобув блискучу освіту в США, де вивчав літературу в університеті Вірджинії. Почав кар'єру як професійний дипломат, працюючи в посольстві Китаю в Америці. Був особистим протеже Юань Шикая.\n\nПрацював дипломатом у Німеччині, був радником на Версальській мирній конференції. У 1921 році тричі ставав в.о. прем'єр-міністра. За дорученням Цао Куня знову очолив уряд у 1924 році, проте ненадовго — через Пекінський переворот. Після повернення У Пейфу до влади Янь короткочасно повернувся до кабінету, але згодом пішов у відставку, присвятивши час роботі у Товаристві Червоного Хреста. \n\nОбраний президентом, Янь втілює дух професіоналізму дипломатичного корпусу. Попри відсутність жорсткої ідеології, він користується великою повагою за свою щирість та досвід.§!\n\n§YПримітки: Янь Хуейцін досконало володіє англійською мовою. Він відомий як активний меценат китайських університетів.§!"
 QIE_yan_huiqing_advisor_desc: "§YНародився:§! §L2 квітня 1877 року в Шанхаї, провінція Цзянсу, Велика Цін§!\n§YПриналежність:§! §LАполітичний§!\n§YБіографія:§! §L$QIE_yan_huiqing_leader_desc$§!"

 #高凌霨
 QIE_gao_lingwei: "Ґао Лінвей"
 QIE_gao_lingwei_advisor_desc: "§YНародився:§! §L12 вересня 1870 року в повіті Тяньцзінь, провінція Чжилі, Велика Цін§!\n§YПриналежність:§! §aЦзіньбао§!\n§YБіографія:§! §LСклавши імператорський іспит у віці 25 років, Ґао став кандидатом на посаду префекта провінції Хубей, де потрапив до кліки Чжан Чжидуна. Він обіймав посади наглядача Хубейської військової академії, керівника монетного двору Хубея, а згодом — головного посланця провінції. У 1910 році він пішов у відставку і повернувся до Тяньцзіня, аби очолити відділ цивільних справ провінції Чжилі. У 1913 році Ґао керував реорганізацією провінційних банків та очолював фінансовий і податковий департаменти Чжилі.\n\nОбраний до конгресу в 1917 році, він став заступником міністра сільського господарства, а за рекомендацією Цао Куня — головним фінансовим директором. Будучи втягнутим у внутрішні інтриги чжилійської кліки, Ґао обіймав посади міністра внутрішніх справ та інші ключові пости в кабінетах Янь Хуейціна та Чжоу Цзиці.\n\nЗамінивши Цао Жуя на посаді губернатора провінції Чжилі, він служив в.о. прем'єр-міністра у 1923 році. Після перевороту Фен Юйсяна втік до Тяньцзіня, повернувшись лише в 1927 році після відновлення контролю чжилійців над Пекіном. Ґао підтримує таємні зв'язки з японцями, Дуань Ціжуєм та Ван Їтаном у Фентяні.§!\n\n§YПримітки: Амбітний, але завжди залежний від волі інших, Ґао старанний і сумлінний у державних справах. Його японські та аньхойські зв'язки викликають підозри.§!"
 QIE_gao_lingwei_leader_desc: "§YНародився:§! §L12 вересня 1870 року в повіті Тяньцзінь, провінція Чжилі, Велика Цін§!\n§YБіографія:§! §L$QIE_gao_lingwei_advisor_desc$ Обраний президентом роздробленої, зраненої та глибоко засмученої країни, Ґао Лінвей нарешті отримав шанс проявити себе як чесний державний діяч. Затьмарений іншими постатями та оточений суперечками, «сквайр із Тяньцзіня» змушений постійно маневрувати у політичному лабіринті.§!"

 # Цзен Ці
 QIE_zeng_qi: "Цзен Ці"
 QIE_zeng_qi_bio: "Походячи з заможної та впливової родини в Сичуані, Цзен Ці писав для таких газет, як «Ченду комерціал дейлі», критикуючи політику Чжао Ерфена. Він допоміг заснувати «Репаблік оф Чайна таймс» і в 1913 році брав участь у Другій революції разом із Сюн Кеву. Під час навчання в шанхайському університеті «Аврора» він познайомився з Лі Хуаном, майбутнім соратником по партії «Молодий Китай». Замість Франції він поїхав на навчання до Японії, де вивчав конституційне та адміністративне право в університеті Чуо.\n\nЦзен став фактичним лідером китайського студентського руху порятунку нації і разом із Лі Дачжао створив Товариство молодого Китаю. У 1923 році під Парижем він заснував партію «Молодий Китай». Повернувшись на батьківщину в 1924 році, він був обраний головою центрального виконавчого комітету ПМК.\n\nЯк голова партії, Цзен визначає її доктрину. Хоча він не є лідером фракції в асамблеї, він набагато ближчий до радикального ультранаціоналізму всередині партії."
 QIE_zeng_qi_leader_desc: "§YНародився:§! §L25 вересня 1892 року в повіті Лунчан, провінція Сичуань, Велика Цін§!\n§YБіографія:§! §L$QIE_zeng_qi_bio$§!"
 QIE_zeng_qi_advisor_desc: "§YНародився:§! §L25 вересня 1892 року в повіті Лунчан, провінція Сичуань, Велика Цін§!\n§YПриналежність:§! §nПМК§!\n§YБіографія:§! §L$QIE_zeng_qi_bio$§!\n\n§YПримітки: У 1927 році Цзен Ці був змушений тікати до Японії через плани вбивства Чан Кайші, проте через внутрішні чвари Гоміньдану генералісимус все одно загинув.§!"

 # Янь Янчу (Джеймс Єнь)
 QIE_james_yen: "Джеймс Єнь (Янь Янчу)"
 QIE_james_yen_advisor_desc: "§YНародився:§! §L26 жовтня 1890 року в місті Бачжун, провінція Сичуань, Велика Цін§!\n§YПриналежність:§! §SТРАК§!\n§YБіографія:§! §LАмбітний і наполегливий змалечку, Янь Янчу працював учителем англійської мови в Ченду, перш ніж виїхати на навчання до Гонконгу у 1912 році. Він відмовився від престижної британської стипендії, бо не бажав змінювати китайське громадянство. У 1916 році вступив до Єльського університету, де вивчав політологію та економіку, а згодом отримав ступінь магістра історії в Прінстоні.\n\nПовернувшись до Китаю в 1920 році, Янь розпочав національний рух за ліквідацію неписьменності. Його експерименти в Чанші мали колосальний успіх, що дозволило йому створити Китайську асоціацію сприяння освіті цивільних. Зосередившись на сільській місцевості, рух Яня успішно викорінював безграмотність скрізь, куди приходив.\n\nПомічений урядом, Джеймс очолив низку освітніх проєктів у 1930-х роках, ставши неформальним членом ТРАК.§!\n\n§YПримітки: Його підхід базується на лікуванні «чотирьох головних хвороб»: невігластва, бідності, слабкості та егоїзму.§!"

 # Айсін Ґьоро Пуґун
 QIE_aisin_gioro_pugong: "Айсін Ґьоро Пуґун"
 QIE_aisin_gioro_pugong_leader_desc: "§YНародився:§! §L19 березня 1904 року в Пекіні, провінція Чжилі, Велика Цін§!"

 # Вень Цзун'яо
 QIE_wen_tsungyao: "Вень Цзун'яо"
 QIE_wen_tsungyao_leader_desc: "§YНародився:§! §L1876 рік, повіт Сіньнін, провінція Ґуандун, Велика Цін§!"

###- Advisors -###
 #曹錕
 QIE_cao_kun: "Цао Кунь"
 QIE_cao_kun_advisor_desc: "§YНародився:§! §L12 грудня 1862 року в повіті Тяньцзінь, провінція Чжилі, Велика Цін§!\n§YПриналежність:§! §aЦзіньбао§!\n§YБіографія:§! §LЦао Кунь, колишній торговець тканиною, закінчив Тяньцзіньську військову академію у 1885 році. Під час Сіньхайської революції воював на боці Юань Шикая. У 1912 році він організував заколот, аби дати Юаню привід не їхати на зустріч із Сунь Ятсеном до Нанкіна.\n\nПісля смерті Фен Ґочжана у 1919 році Цао став неформальним лідером чжилійської кліки. Разом зі своїм протеже У Пейфу він домінував на політичній арені, проте його президентство, здобуте через підкуп, заплямувало його репутацію. Після Пекінського перевороту 1924 року він перебував під домашнім арештом, але згодом повернувся до влади.\n\nУ 1928 році, ведучи переговори з Німеччиною, Цао майстерно маніпулював обставинами, аби здійснити реставрацію Сюаньтуна в обмін на масштабну німецьку допомогу. Президент хворої нації, Цао своєю хитрістю та дипломатичним хистом доповнює військову міць У Пейфу.§!\n\n§YПримітки: Попри образ «добродушного дідуся», Цао Кунь — великодушний, але вкрай підступний політичний оркестрант.§!"

 # Бай Цзяньву
 QIE_bai_jianwu: "Бай Цзяньву"
 QIE_bai_jianwu_advisor_desc: "§YНародився:§! §L1886 рік, повіт Цзяохе, провінція Чжилі, Велика Цін§!\n§YПриналежність:§! §cЛоян§!\n§YБіографія:§! §LПід час навчання в Тяньцзіні Бай став близьким другом Лі Дачжао та приєднався до Тунменхуея. Після розпаду республіки він заснував із Лі газету «Ранковий дзвін», але згодом їхні шляхи розійшлися. У 1922 році його найняв У Пейфу.\n\nСтавши правою рукою «нефритового маршала», Бай вів найскладніші переговори від його імені, зокрема під час страйку залізничників. Його доля назавжди пов'язана з У Пейфу: він служить секретарем і довіреною особою маршала в його протистоянні з фракцією Цао Куня та пекінськими парламентарями.§!\n\n§YПримітки: Щоденник Бая відомий детальним описом життєвих труднощів. У вважає його наступником на посаді прем'єра чи президента. Отримав прізвисько «малий кабінет У».§!"

 # Ван Чунхуей
 QIE_wang_chonghui: "Ван Чунхуей"
 QIE_wang_chonghui_advisor_desc: "§YНародився:§! §L1 грудня 1881 року в Дунґуані, провінція Ґуандун, Велика Цін§!\n§YПриналежність:§! §LАполітичний§!\n§YБіографія:§! §LВан закінчив університет Бейян у 14 років, згодом отримав ступінь доктора цивільного права в Єлі. Він став баристером Вищого суду Англії та Уельсу і членом юридичного товариства в Берліні. У 1907 році приєднався до Тунменхуея, допомагаючи Сунь Ятсену з перекладами.\n\nВін обіймав посаду головного судді в першому бейянському кабінеті Тан Шаої. Разом із Ху Ші розробляв план «уряду добрих людей». Був прем'єр-міністром, але через конфлікт із Цао Кунем його кабінет упав. Працював суддею Постійної палати третейського суду в Гаазі. Зрештою залишився в Пекіні як один із найважливіших законодавців країни.§!\n\n§YПримітки: Одного разу на критику спікера асамблеї У Цзіньляня він відповів цитатою з класики: «Звісно, я прочитав більше книг, ніж ви», на що У назвав його «книжковим пустомелею».§!"

 # Чжан Яньцін
 QIE_zhang_yanqing: "Чжан Яньцін"
 QIE_zhang_yanqing_advisor_desc: "§YНародився:§! §L1898 рік, повіт Наньпі, провінція Чжилі, Велика Цін§!\n§YПриналежність:§! §PМонархіст§!\n§YБіографія:§! §LВиходець із знатної родини епохи Цін, Чжан закінчив японський університет Ґакушюін. Обіймав різні адміністративні посади в Тяньцзіні та провінції Чжилі, працював у міністерстві зв'язку.\n\nПісля реставрації Сюаньтуна став особистим помічником Айсін Ґьоро Сіці. Працював у міністерстві промисловості, а в 1936 році був призначений міністром закордонних справ.§!"

 # Чжан Шаоцзен
 QIE_zhang_shaozeng: "Чжан Шаоцзен"
 QIE_zhang_shaozeng_advisor_desc: "§YНародився:§! §L19 жовтня 1879 року в повіті Дачен, провінція Чжилі, Велика Цін§!\n§YПриналежність:§! §mКліка політичних наук§!\n§YБіографія:§! §LВипускник Військової академії армії Бейян, Чжан був одним із «трьох еліт» китайського випуску Імператорської академії армії Японії. Таємно приєднався до Тунменхуея, брав участь у революції на боці повстанців.\n\nСпівпрацював із Цао Кунем, але виступав проти реставрації Юань Шикая. У 1920 році приєднався до чжилійської кліки. Був прем'єр-міністром і головнокомандувачем армії у 1922 році, щиро намагаючись досягти мирного об'єднання Півночі та Півдня. Після розбіжностей із Цао та У покинув армію, ставши депутатом асамблеї від провінції Чжилі, де є найгучнішим прибічником Кліки політичних наук.§!\n\n§YПримітки: Донька Чжана заміжня за прийомним сином У Пейфу, що часто робить сімейні зібрання вельми напруженими.§!"

 # Ґу Чжунсю
 QIE_gu_zhongxiu: "Ґу Чжунсю"
 QIE_gu_zhongxiu_advisor_desc: "§YНародився:§! §L1874 рік, повіт Дінсянь, провінція Чжилі, Велика Цін§!\n§YПриналежність:§! §mКліка політичних наук§!\n§YБіографія:§! §LҐу вивчав політекономію в університеті Васеда, де зустрів доктора Суня і приєднався до Тунменхуея у 1901 році. Після повернення до Китаю працював у адміністрації Чжилі та Чжецзяна. Заснував Об'єднану республіканську партію, яка пізніше влилася в Гоміньдан.\n\nВін був одним із засновників Товариства вивчення європейських справ — попередника Кліки політичних наук. У 1916 році працював у кабінеті Дуань Ціжуя. На початку 1920-х намагався усунути Сунь Ятсена від влади на півдні, але програв і повернувся до Пекіна. Зараз він є найстарішим і наймудрішим членом Кліки політичних наук в асамблеї.§!\n\n§YПримітки: Ґу має надзвичайно широкі зв'язки — від Чень Цзюнміна та Чень Дусю до Ван Цзінвея та Цай Юаньпея.§!"

 # Бянь Шоуцзін
 QIE_bian_shoujing: "Бянь Шоуцзін"
 QIE_bian_shoujing_advisor_desc: "§YНародився:§! §L1885 рік, повіт Тяньцзінь, провінція Чжилі, Велика Цін§!\n§YПриналежність:§! §aЦзіньбао§!\n§YБіографія:§! §LОбдарований студент, відправлений на навчання до Японії, Бянь приєднався до Тунменхуея з патріотичних міркувань. Ставши спікером провінційної асамблеї Чжилі у 1913 році, він активно боровся за реформи та чинив опір зазіханням французів у Тяньцзіні.\n\nЗгодом він став частиною корупційної системи, затоваришувавши з Цао Кунем та ставши названим братом Цао Жуя. Бянь був головним організатором скандальних виборів Цао Куня, віддаючи перевагу підкупу над чесним голосуванням. У 1928 році він нарешті отримав посаду спікера асамблеї, про яку давно мріяв, ставши ефективним «рупором Цао Куня».§!\n\n§YПримітки: Близький друг і довірена особа Ван Чженбіня, Чу Юпу та Лі Цзінліня з Фентяня.§!"

 # У Цзіньлянь
 QIE_wu_jinglian: "У Цзіньлянь"
 QIE_wu_jinglian_advisor_desc: "§YНародився:§! §L1873 рік, повіт Нін'юань, округ Шенцзін, Велика Цін§!\n§YПриналежність:§! §aЦзіньбао§!\n§YБіографія:§! §LОсвічений імперський вчений, У починав як реформатор, очолюючи дорадче бюро провінції Фентянь. Під час революції він намагався мирно усунути губернатора, але через загрозу вбивства з боку солдатів Чжан Цзуоліня втік до революціонерів.\n\nБув спікером асамблеї, співпрацював із Юань Шикаєм. Згодом допомагав Цао Куню у реалізації його президентських амбіцій, особисто вручивши йому печатку після обрання. Вважаючи, що його ошукали з посадою прем'єра, він викрав печатку асамблеї і втік до Японії. Після поразки Фентяня у Третій чжилійсько-фентянській війні Цао Кунь знову запросив його до влади на знак доброї волі.§!"

 # Пень Юньї
 QIE_peng_yunyi: "Пень Юньї"
 QIE_peng_yunyi_advisor_desc: "§YНародився:§! §L1878 рік, повіт Сянтань, провінція Хунань, Велика Цін§!\n§YПриналежність:§! §aЦзіньбао§!\n§YБіографія:§! §LНавчався в Японії, очолював штаб-квартиру Тунменхуея в Токіо. Брав участь у мирних переговорах між Північчю та Півднем. Разом із Сун Цзяоженем заснував Об'єднану республіканську партію, згодом очолив відділ культури Гоміньдану.\n\nУ 1922 році Цао Кунь несподівано призначив його міністром освіти. Це призначення викликало запеклий опір радикальних студентів Пекінського університету, що переросло у відкрите протистояння. Зараз Пень є одним із небагатьох справжніх революціонерів серед бюрократів Бейяна, хоча колишні соратники-соціалісти його зневажають.§!"

 # Юань Найкуань
 QIE_yuan_naikuan: "Юань Найкуань"
 QIE_yuan_naikuan_advisor_desc: "§YНародився:§! §L1868 рік, повіт Чжен'ян, провінція Хенань, Велика Цін§!\n§YПриналежність:§! §aЦзіньбао§!\n§YБіографія:§! §LЗавдяки родинним зв'язкам із Юань Шикаєм, він зробив стрімку кар'єру в армії та адміністрації. У 1915 році допомагав дядькові у спробі проголошення імперії Хунсянь. Після смерті Юаня він брав участь у монархічному заколоті Чжан Сюня 1917 року, був помилуваний Дуань Ціжуєм.\n\nЗрештою він приєднався до Цао Куня, допомагаючи йому з підкупом депутатів. У кабінеті Ґао Лінвея 1923 року очолював департамент сільського господарства. Після реставрації Сюаньтуна повернувся на цю ж посаду. Він залишається одним із небагатьох членів родини Юань, які зберегли вплив.§!"

 #王克敏
 QIE_wang_kemin: "Ван Кемінь"
 QIE_wang_kemin_advisor_desc: "§YНародився:§! §L4 травня 1876 року в провінції Ґуандун, Велика Цін§!\n§YПриналежність:§! §aЦзіньбао§!\n§YБіографія:§! §LСклавши імператорський іспит у 1903 році, Ван Кемінь вирушив до Японії як радник посольства, виконуючи роль агента Цін для нагляду за радикальними студентами. У 1907 році він повернувся до роботи в міністерствах фінансів та закордонних справ.\n\nПісля Сіньхайської революції Ван поїхав до Франції, де налагодив зв'язки з фінансовими магнатами. Повернувшись до Китаю, він очолив Банк Китаю. Обіймаючи посаду міністра фінансів у 1917 році, Ван здобув репутацію «живої бухгалтерської книги» та «грошового диявола» за свою феноменальну пам'ять та здатність накопичувати статки. Цао Кунь особисто захищав його під час гучних фінансових скандалів.\n\nПісля Пекінського перевороту Ван короткочасно служив у фентянській адміністрації, але у 1928 році перейшов на бік чжилійців. У 1932 році він став мером Тяньцзіня і знову очолив Банк Китаю.§!\n\n§YПримітки: Ван схильний демонструвати зверхність через свій поважний вік. Його манера здаватися безтурботним лише слабко приховує жадобу до влади.§!"

 # Кан Тунбі
 QIE_kang_tongbi: "Кан Тунбі"
 QIE_kang_tongbi_advisor_desc: "§YНародилася:§! §Lлютий 1887 року в повіті Наньхай, провінція Ґуандун, Велика Цін§!\n§YПриналежність:§! §SТРАК§!\n§YБіографія:§! §LДонька відомого реформатора Кан Ювея, Кан Тунбі стала першою випускницею-азіаткою Барнард-коледжу в США. Вона присвятила життя феміністській боротьбі та спадщині свого батька.\n\nБула віцепрезидентом Міжнародної жіночої асоціації та президентом Всекитайського жіночого конгресу. Піонерка руху за реформи серед китайської діаспори, вона сформувала унікальні ідеї, заявляючи, що «жіноча освіта має починатися з розмови про жіночі права». Вона стала першою жінкою-представницею Китаю на Світовій жіночій конференції.§!"

 # Ґо Цзеюнь
 QIE_guo_zeyun: "Ґо Цзеюнь"
 QIE_guo_zeyun_advisor_desc: "§YНародився:§! §L1882 рік у Тайчжоу, провінція Чжецзян, Велика Цін§!\n§YПриналежність:§! §PМонархіст§!\n§YБіографія:§! §LЗ дитинства обдарований у гуманітарних науках, Ґо вивчав право та політику в Пекінському університеті. Після навчання в Японії працював на митниці в Чжецзяні, де відкрив низку шкіл для ліквідації неписьменності в селах.\n\nБув близьким соратником Сюй Шічана під час його президентства. Після відновлення монархії Ґо став непохитним державним службовцем на боці маньчжурської династії, обійнявши посаду «міністра обрядів».§!\n\n§YПримітки: Продуктивний поет і прозаїк, автор понад 25 опублікованих збірок віршів.§!"

 # Пень Шоусінь
 QIE_peng_shouxin: "Пень Шоусінь"
 QIE_peng_shouxin_commander_desc: "§YНародився:§! §L1872 рік у Пінду, провінція Шаньдун, Велика Цін§!\n§YПриналежність:§! §cЛоян§!\n§YБіографія:§! §LВипускник Тяньцзіньської військової академії. З 1916 року служив під командуванням Цао Куня та У Пейфу. Відзначився у Першій чжилійсько-фентянській війні, де відбив кілька наступів противника, за що отримав звання командира 15-ї дивізії.\n\nПід час Другої чжилійсько-фентянської війни командував 1-м чжилійським корпусом. Після зради Фен Юйсяна його підрозділи потрапили в оточення, але Пень зумів втекти до Тяньцзіня завдяки хитрому плану: він прикинувся смертельно хворим старим офіцером низького рангу. Після повернення територій клікою знову приєднався до командування.§!\n\n§YПримітки: Один із найшанованіших і найпринциповіших командирів кліки, отримав прізвисько «Пень-колючка» за свою гордовиту манеру поведінки. Кажуть, навіть Цао Кунь та У Пейфу виявляли до нього повагу і ніколи не затримували виплати його підрозділу.§!"

 # Лей Хайцзун
 QIE_lei_haizong: "Лей Хайцзун"
 QIE_lei_haizong_advisor_desc: "§YНародився:§! §L1902 рік у повіті Юнцін, провінція Чжилі, Велика Цін§!\n§YПриналежність:§! §LАполітичний§!\n§YБіографія:§! §LВидатний історик та філософ. Закінчив університет Цінхуа, згодом отримав ступінь доктора філософії в Чиказькому університеті. Викладав історію в провідних університетах Китаю, включаючи Уханьський та Цінхуа.\n\nЛей Хайцзун критикував сухий текстологічний підхід до історії, стверджуючи, що розуміння минулого полягає не лише в знанні фактів, а й у розумінні духу епохи.§!"

 # Лян Шумін
 QIE_liang_shuming: "Лян Шумін"
 QIE_liang_shuming_sic_desc: "§YНародився:§! §L18 жовтня 1893 року в Пекіні, провінція Чжилі, Велика Цін§!\n§YПриналежність:§! §SСільська реконструкція§!\n§YБіографія:§! §LЛян Шумін походить із родини цінського чиновника і є далеким нащадком Хубілай-хана. Був членом Тунменхуея, працював у міністерстві юстиції, а згодом викладав індійську філософію в Пекінському університеті. Автор праці «Східна і західна культури та їхні філософії».\n\nРазом із Янь Янчу став засновником Асоціації сільської реконструкції. Попри репресії 1932 року, він продовжував відстоювати ідею позапартійної відбудови китайського села як основи нації.§!\n\n§YПримітки: Смерть дружини у 1935 році глибоко вразила його; він присягнув, що ця втрата дасть йому «більше часу для роздумів та роботи».§!"

 # Тан Чжунмін
 QIE_tang_zhongming: "Тан Чжунмін"
 QIE_tang_zhongming_advisor_desc: "§YНародився:§! §L1897 рік у повіті Мен, провінція Хенань, Велика Цін§!\n§YПриналежність:§! §LАполітичний§!\n§YБіографія:§! §LВиходець із бідної селянської родини, Тан був обраний для навчання у Франції в 1916 році. Здобувши освіту інженера-механіка, він працював на французьких заводах з виробництва потягів.\n\nПовернувшись до Китаю в 1926 році, він розробив серію автомобілів на деревному вугіллі. Його винахід мав успіх у 1931 році й отримав державний патент. Заснував власну компанію в Шанхаї і продовжує експериментувати з передовими конструкціями транспортних засобів.§!"

 # Ван Юйцзя
 QIE_wang_yujia: "Ван Юйцзя"
 QIE_wang_yujia_advisor_desc: "§YНародився:§! §L1882 рік у повіті Учан, провінція Хубей, Велика Цін§!\n§YПриналежність:§! §aЦзіньбао§!\n§YБіографія:§! §LВипускник артилерійського відділення японської академії Сікан Ґакко. Служив старшим офіцером штабу Фен Ґочжана. У 1923 році отримав титул генерала Ченвей.\n\nБув відкликаний зі звільнення після початку нових конфліктів із фентянською клікою. Наразі є генерал-майором сил безпеки провінції Чжилі та призначений командувачем військової поліції від імені чжилійської кліки.§!"

 # Лю Чун'ю
 QIE_liu_chongyou: "Лю Чун'ю"
 QIE_liu_chongyou_advisor_desc: "§YНародився:§! §L1877 рік у повіті Хоуґуань, провінція Фуцзянь, Велика Цін§!\n§YПриналежність:§! §SФНП§!\n§YБіографія:§! §LСклав імператорський іспит у 17 років, згодом вивчав право в Японії. Співзасновник Фуцзянської школи права. Працював адвокатом, був юридичним радником Банку Китаю.\n\nВін прославився захистом студентів Пекінського університету під час руху 4 листопада, а також таких діячів, як Чжоу Еньлай. Лю вважає, що «адвокати мають підтримувати справедливість у світі!». Спонсорував соціалістичні гуртки і після розпаду коаліції ТРАК приєднався до Федерації національного порятунку під керівництвом Шень Цзюньжу.§!"

###- Manchu Coup Advisors -###
 #愛新覺羅·載振
 QIE_aisin_gioro_zaizhen: "Айсін Ґьоро Цзайчжень"
 QIE_aisin_gioro_zaizhen_advisor_desc: "§YНародився:§! §L31 березня 1876 року в маєтку принца Ціна, Пекін, провінція Чжилі, Велика Цін§!\n§YПриналежність:§! §PМонархіст§!\n§YБіографія:§! §LЦзайчжень був представником маньчжурської знаті, який у 1902 році відвідав коронацію Едуарда VII та здійснив турне Європою, США та Японією. Брав участь у реформах «нового курсу» династії Цін, очоливши новостворене міністерство торгівлі. Проте через корупційний скандал був змушений піти у відставку.\n\nПісля Сіньхайської революції він переховувався в Шанхаї, а згодом повернувся до Пекіна. У 1917 році успадкував титул принца Ціна. Довгий час тримався осторонь політики, перебуваючи поруч із Пуї в Тяньцзіні. Після реставрації 1928 року він повернувся до двору, використовуючи свої фінансові зв'язки в концесіях для накопичення капіталу імператорської родини, хоча фактично переклав усю роботу на підлеглих.§!"

 # Айсін Ґьоро Сянькуй
 QIE_aisin_gioro_xiankui: "Айсін Ґьоро Сянькуй"
 QIE_aisin_gioro_xiankui_advisor_desc: "§YНародився:§! §L1896 рік, маєток принца Су, Пекін, провінція Чжилі, Велика Цін§!\n§YПриналежність:§! §PМонархіст§!\n§YБіографія:§! §LСин принца Су Шаньці та сьомий брат Йосіко Кавасіми. Свою кар'єру почав як командувач залоги в Ляоніні під ім'ям «Цзінь Бідун», аби не виділятися. Навчався в Японії, але повернувся до Китаю після маньчжурської реставрації. Обіймав посади в енергетичних управліннях, командував залізничними підрозділами та був мером міста, а також брав активну участь у розвитку місцевої кінокультури.§!"

 # Баокан
 QIE_baokang: "Баокан"
 QIE_baokang_advisor_desc: "§YНародився:§! §L1892 рік, повіт Ченде, округ Шенцзін, Велика Цін§!\n§YПриналежність:§! §PМонархіст§!\n§YБіографія:§! §LЕтнічний маньчжур із відомого роду, що мав тісні зв'язки з Чжан Цзуолінем та іншими лідерами фентянської кліки. Це забезпечило йому стрімку кар'єру: він був директором фінансового департаменту Чахару, а згодом став заступником міністра внутрішніх справ. Баокан відомий передусім як куратор оборонних заводів, ставши фактично «головним інтендантом» імперії.§!"

 # Сє Цзєші
 QIE_xie_jieshi: "Сє Цзєші"
 QIE_xie_jieshi_advisor_desc: "§YНародився:§! §L1878 рік, повіт Сіньчжу, провінція Фуцзянь-Тайвань, Велика Цін§!\n§YПриналежність:§! §PМонархіст§!\n§YБіографія:§! §LУродженець Тайваню, Сє Цзєші пережив анексію острова Японією. Працював викладачем та перекладачем для японських посадовців, згодом вивчав право в університеті Мейдзі в Токіо. У 1915 році він відмовився від японського громадянства, аби знову стати підданим Китаю.\n\nБрав участь у спробі реставрації Чжан Сюня у 1917 році, де познайомився з Пуї. Після вигнання імператора у 1924 році Сє залишався вірним «хлопчику-імператору» у вигнанні. З відновленням монархії в 1928 році він супроводжував монарха до Пекіна, де обійняв посаду радника із закордонних справ.§!"

 # Чжен Сяосюй
 QIE_zheng_xiaoxu: "Чжен Сяосюй"
 QIE_zheng_xiaoxu_sic_desc: "§YНародився:§! §L2 травня 1860 року, повіт Мінь, провінція Фуцзянь, Велика Цін§!\n§YПриналежність:§! §PМонархіст§!\n§YБіографія:§! §LЧжен з дитинства вивчав даосизм та літературу, ставши видатним вченим. Працював у посольстві Цін в Японії, пізніше обіймав посади інспектора в Аньхої та Ґуандуні. Був активним прихильником конституційних реформ пізньої Цін. \n\nПісля революції став найближчим радником Пуї, борючись із корупцією внутрішнього двору. Саме він організував перебування імператора в японському посольстві після перевороту 1924 року. Чжен є головним стратегом і теоретиком партії Цзунше. Він мріє про модернізовану монархію, вільну від помилок минулого, які призвели до падіння династії.§!"

