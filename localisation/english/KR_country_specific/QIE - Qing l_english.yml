###- Generals -###

 #蔣百里
 QIE_jiang_baili: "Цзян Байлі"
 QIE_jiang_baili_bio: "Здобувши звання вченого після імператорського іспиту, Цзян у 1899 році вступив до академії Цюші, а згодом поїхав на навчання до Японії. Ставши учнем Лян Цічао, він брав активну участь у студентських революційних рухах. \n\nПісля повернення до Китаю служив у Чжао Ерсюня, а потім вивчав військову справу в Німеччині під керівництвом Гінденбурга. Ставши другим директором Баодінської військової академії, він радикально реформував заклад. Як помічник Лян Цічао, Цзян брав участь у розробці провінційних конституцій Хунані та Чжецзяна. У Пейфу, чиїм начальником штабу став Цзян, звертався до нього з найвищою пошаною — «пане». Разом із Таном Цзайлі він відвідав Німеччину та Італію, де надихнувся планами реформ Ганса фон Секта."
 QIE_jiang_baili_army_chief_desc: "§YНародився:§! §L13 жовтня 1882 року в Хайніні, провінція Чжецзян, Велика Цін§!\n§YПриналежність:§! §cФедераліст§!\n§YБіографія:§! §L$QIE_jiang_baili_bio$§!\n\n§YПримітки: На посаді директора Баодінської академії він намагався застрелитися, аби привернути увагу до проблем фінансування. Вважається одним із найсучасніших військових теоретиків, попри певну непрактичність його ідей. Вільно володіє німецькою, японською та італійською мовами.§!"

 # Тан Цзайлі
 QIE_tang_zaili: "Тан Цзайлі"
 QIE_tang_zaili_army_chief_desc: "§YНародився:§! §L1882 рік у Шанхаї, Шанхайський міжнародний сеттльмент§!\n§YПриналежність:§! §aЦзіньбао§!\n§YБіографія:§! §LОдин із перших кадетів, відправлених на навчання до Японії у 1899 році. Тан повернувся до Китаю і служив у Юань Шикая. Після падіння монархії він став ад'ютантом Юаня в Пекіні. Згодом служив Дуань Ціжую, вивчаючи військовий досвід Балкан та Центральної Європи.\n\nУ 1923 році Цао Кунь призначив його наглядачем за безпекою залізниць, що ввело його в орбіту чжилійської кліки. Тан є палким прихильником німецького військового мистецтва і часто просить Цао Куня реорганізувати центральну армію за німецьким зразком, аби стримати амбіції Японії.§!"

 # Ван Хуайцін
 QIE_wang_huaiqing: "Ван Хуайцін"
 QIE_wang_huaiqing_commander_desc: "§YНародився:§! §L1875 рік у Нінцзіні, провінція Чжилі, Велика Цін§!\n§YПриналежність:§! §aЦзіньбао§!\n§YБіографія:§! §LВипускник Тяньцзіньської академії 1891 року, Ван відзначився під час повстання боксерів. Він жорстоко придушив Луаньчжоуське повстання і підтримав монархічні амбіції Юань Шикая. \n\nЗгодом став довіреною особою Цао Куня, допомагаючи йому під час виборів. Попри свою ефективність як гарнізонного командира, він відомий як сумнівний політичний інтриган.§!\n\n§YПримітки: Солдати прозвали його «туалетним генералом» через звичку всюди возити з собою унітаз, який він часто використовував замість крісла за робочим столом. Вкрай забобонний, іноді відмовляється вступати в бій у «невідповідні» дні.§!"

 # Лі Цзічень
 QIE_li_jichen: "Лі Цзічень"
 QIE_li_jichen_high_command_desc: "§YНародився:§! §L1882 рік у повіті Сянь, провінція Чжилі, Велика Цін§!\n§YПриналежність:§! §cЛоян§!\n§YБіографія:§! §LЛі обіймав посади директора Чахарської військової академії та офіцера штабу в різних провінціях. У 1921 році став генерал-лейтенантом і начальником штабу У Пейфу. \n\nВін залишався вірним «нефритовому маршалу» навіть після падіння чжилійців, допомагаючи йому планувати повернення до влади. Після відвоювання Пекіна був знову призначений губернатором Хенані.§!\n\n§YПримітки: Ключовий член «нефритового круглого столу» У Пейфу, що забезпечує перемоги кліки як на полі бою, так і в політиці.§!"

 # Айсін Ґьоро Цзайтао
 QIE_aisin_gioro_zaitao: "Айсін Ґьоро Цзайтао"
 QIE_aisin_gioro_zaitao_commander_desc: "§YНародився:§! §L23 червня 1887 року в Пекіні, провінція Чжилі, Велика Цін§!\n§YПриналежність:§! §PМонархіст§!\n§YБіографія:§! §LДядько Пуї, молодший брат імператора Ґуансюя. Навчався в кавалерійській школі у Франції, здійснив світове турне у 1910 році. Очолював імператорську гвардію до повалення династії.\n\nОдин із засновників партії Цзунше, він повернувся до командування гвардією у 1928 році після реставрації. Завдяки знайомству із західним світом, Цзайтао набагато відкритіший до реформ, ніж більшість маньчжурської знаті.§!\n\n§YПримітки: Захоплюється верховою їздою та пекінською оперою. Опікується правами етнічних меншин, особливо груп хуей та маньчжурів.§!"

 # Айсін Ґьоро Пуцзє
 QIE_aisin_gioro_pujie: "Айсін Ґьоро Пуцзє"
 QIE_aisin_gioro_pujie_commander_desc: "§YНародився:§! §L16 квітня 1907 року в Пекіні, провінція Чжилі, Велика Цін§!\n§YПриналежність:§! §PМонархіст§!\n§YБіографія:§! §LБрат імператора Пуї. Навчався в Берліні, де отримав прізвисько «Петер». Повернувся до Китаю вражений західною наукою, але збентежений моральним занепадом Європи.\n\nВін зневажає чжилійську кліку, вважаючи, що вони тримають його брата в заручниках. Пуцзє є інтелектуальним центром монархічного табору; він значно рішучіший за Пуї і є справжнім натхненником планів повної реставрації влади династії.§!\n\n§YПримітки: Майстер каліграфії, автор багатьох опублікованих поезій.§!"

 # Айсін Ґьоро Сяньюань
 QIE_aisin_gioro_xianyuan: "Айсін Ґьоро Сяньюань"
 QIE_aisin_gioro_xianyuan_commander_desc: "§YНародився:§! §Lу Пекіні, провінція Чжилі, Велика Цін§!\n§YПриналежність:§! §PМонархіст§!\n§YБіографія:§! §LОдинадцятий син принца Су. Після краху імперії його батько відправив майже всіх своїх дітей на навчання до Японії. Сяньюань закінчив японську військову академію і служив ад'ютантом в японській армії.\n\nПісля реставрації Сюаньтуна він повернувся до Китаю. Хоча він не дуже цікавиться політикою, він є ключовою фігурою прояпонського лобі в монархічному таборі.§!\n\n§YПримітки: Є зведеним братом Сянькуя.§!"

 # Цай Ченсюнь
 QIE_cai_chengxun: "Цай Ченсюнь"
 QIE_cai_chengxun_high_command_desc: "§YНародився:§! §L1871 рік у Тяньцзіні, провінція Чжилі, Велика Цін§!\n§YПриналежність:§! §aЦзіньбао§!\n§YБіографія:§! §LВипускник Бейянської академії 1900 року. У 1916 році приєднався до чжилійської кліки. Служив військовим міністром та губернатором провінції Цзянсі. Його правління в Цзянсі було заплямоване жорстоким придушенням демократичних активістів та непомірними податками.\n\nПісля реставрації 1928 року він повернувся до активної служби, беручи участь у війнах проти фентянської кліки в регіоні Чахар.§!\n\n§YПримітки: Відомий під прізвиськом «Тигр Цай».§!"

 # Ха Ханьчжан
 QIE_ha_hanzhang: "Ха Ханьчжан"
 QIE_ha_hanzhang_commander_desc: "§YНародився:§! §L23 серпня 1879 року в повіті Ханьян, провінція Хубей, Велика Цін§!\n§YПриналежність:§! §LАполітичний§!\n§YБіографія:§! §LЕтнічний хуей, один із небагатьох мусульман у бейянській армії. Навчався в Японії, супроводжував принца Цзайтао у світовому турне. Попри повагу до династії, підтримав Учанське повстання.\n\nБув близьким другом Лі Юаньхуна. Після реставрації 1928 року повернувся до армії, аби організувати нову імператорську гвардію. Зараз він спирається на підтримку імператорського клану, намагаючись відновити кар'єру після того, як його відсунули від справ чжилійці.§!\n\n§YПримітки: Керував будівництвом знаменитих дамб на Янцзи. Допоміг заснувати Китайську асоціацію сприяння ісламу.§!"

 # Сюн Бінці
 QIE_xiong_bingqi: "Сюн Бінці"
 QIE_xiong_bingqi_commander_desc: "§YНародився:§! §L1884 рік у Цзініні, провінція Шаньдун, Велика Цін§!\n§YПриналежність:§! §aЦзіньбао§!\n§YБіографія:§! §LНайбільш довірений підлеглий та радник Цао Куня. Сюн міг би стати купцем, якби в юності його не вилаяли за розбитий чайник, після чого він пішов до армії. \n\nВін відіграв ключову роль у підтасуванні виборів Цао Куня, підкуповуючи делегатів конгресу. Після поразки у Другій чжилійсько-фентянській війні займався бізнесом, але повернувся до штабної роботи, щойно кліка почала відвойовувати позиції.§!\n\n§YПримітки: На посаді губернатора Шаньдуна впроваджував освітні реформи, але виступав категорично проти спільного навчання хлопців і дівчат.§!"

 # Лю Менґен
 QIE_liu_menggeng: "Лю Менґен"
 QIE_liu_menggeng_high_command_desc: "§YНародився:§! §L1881 рік у Фуніні, провінція Чжилі, Велика Цін§!\n§YПриналежність:§! §aЦзіньбао§!\n§YБіографія:§! §LЗ дитинства здобув західну освіту, вільно володіє англійською, французькою, російською та японською мовами. Закінчив Бейянську медичну школу і служив військовим лікарем у штабі Цао Куня.\n\nПоступово став начальником розвідки Цао. Був повноважним представником кліки на переговорах з іншими мілітаристами. З 1931 року обіймає посаду міністра охорони здоров'я в Пекіні, зосередившись на військовій гігієні та таємних операціях кліки Цзіньбао.§!\n\n§YПримітки: Є двоюрідним братом Цао Куня; свого часу вважався його імовірним наступником.§!"

 # Ван Тань
 QIE_wang_tan: "Ван Тань"
 QIE_wang_tan_advisor_desc: "§YНародився:§! §L1886 рік у Шеньяні, префектура Фентянь, Велика Цін§!\n§YПриналежність:§! §aЦзіньбао§!\n§YБіографія:§! §LПрофесійний військовий, випускник артилерійського відділення в Японії. Більшу частину кар'єри провів у штабних та дорадчих структурах, будучи очима та вухами Цао Куня в міністерстві армії. \n\nПід час Пекінського перевороту втік разом із Цао до Нанкіна. Зараз він виконує роль неофіційного дипломата між Пекіном (фракція Цао) та Лояном (фракція У Пейфу), намагаючись узгодити дії розрізнених чжилійських сил.§!\n\n§YПримітки: Хоча його власна військова кар'єра є скромною, статус довіреної особи Цао Куня робить його одним із найвпливовіших людей у країні.§!"

 #王承斌
 QIE_wang_chengbin: "Ван Чженбінь"
 QIE_wang_chengbin_bio: "Ван Чженбінь почав службу в 1907 році, згодом ставши офіцером штабу Цао Куня. Він допомагав придушувати Сіньхайську революцію, але у 1912 році короткочасно приєднався до монархічної партії Цзунше, що поклало початок його ворожнечі з У Пейфу. \n\nВін був ключовою фігурою в Національній визвольній війні та Чжилійсько-аньхойській війні, ставши практично третьою за важливістю людиною в кліці. У 1922 році Ван став губернатором провінції Чжилі, сформувавши фракцію Цзіньбао разом із тяньцзіньською та баодінською групами. Після поразки у Другій чжилійсько-фентянській війні втік до концесій, але був відкликаний Цао Кунем, який дарував йому звання маршала."
 QIE_wang_chengbin_army_chief_desc: "§YНародився:§! §L21 серпня 1874 року в Нін'юані, Велика Цін§!\n§YПриналежність:§! §aЦзіньбао§!\n§YБіографія:§! §L$QIE_wang_chengbin_bio$§!\n\n§YПримітки: Співзасновник тяньцзіньської кліки, що нині є частиною групи Цзіньбао Цао Куня.§!"
 QIE_wang_chengbin_leader_desc: "§YНародився:§! §L21 серпня 1874 року в Нін'юані, Велика Цін§!\n§YБіографія:§! §LТретій архонт, маршал Тяньцзіня. Ван Чженбінь пройшов шлях від офіцера Цао Куня до одного з лідерів півночі. Його конфлікт із «нефритовим маршалом» У Пейфу лише загострився за останнє десятиліття. Після зради Фентяня та смерті свого наставника Цао Куня, Ван став мстивим лідером, готовим на все задля збереження чжилійської кліки. Він — останній згуртувальний центр старого Бейяна.§!"

 # Чжан Ціхуан
 QIE_zhang_qihuang: "Чжан Ціхуан"
 QIE_zhang_qihuang_high_command_desc: "§YНародився:§! §L1887 рік у Юнфу, провінція Ґуансі, Велика Цін§!\n§YПриналежність:§! §cЛоян§!\n§YБіографія:§! §LСин повітового магістрату, Чжан став вченим-цзіньші у 1903 році. Під час війни на захист конституції 1917 року він запекло захищав Хунань від наступу У Пейфу. Зустрівшись із молодим маршалом особисто, вони стали названими братами та найближчими друзями до самої смерті.\n\nЧжан став незамінним радником У Пейфу. Поки маршал командував на полі бою, Чжан Ціхуан був «мозком» операцій. Його вважають геніальним стратегом, без якого перемоги чжилійців були б неможливими.§!"

 # Сяо Яонань
 QIE_xiao_yaonan: "Сяо Яонань"
 QIE_xiao_yaonan_commander_desc: "§YНародився:§! §L1875 рік у Хуанґані, провінція Хубей, Велика Цін§!\n§YПриналежність:§! §aЦзіньбао§!\n§YБіографія:§! §LВиходець із низин, Сяо був учителем, перш ніж стати солдатом. Він увійшов до найближчого оточення Цао Куня і допоміг йому закріпити владу в провінції Чжилі. \n\nСяо став неформальним миротворцем у Хубеї та допомагав Цао Куню з підкупом депутатів під час президентських виборів. Після Третьої та Четвертої чжилійсько-фентянських воєн він організував «хубейських генералів» — впливову групу виробників текстилю.\n\n§YПримітки: Його зв'язки серед промисловців надають йому величезної ваги в Пекіні, оскільки Хубей — одна з небагатьох прибуткових провінцій.§!"

 # Лі Бінчжи
 QIE_li_bingzhi: "Лі Бінчжи"
 QIE_li_bingzhi_commander_desc: "§YНародився:§! §L1887 рік у Чжендіні, провінція Чжилі, Велика Цін§!\n§YПриналежність:§! §cЛоян§!\n§YБіографія:§! §LЛі вивчав військову справу в Баодіні разом з У Пейфу, де вони стали близькими друзями. Під час заколоту Юань Шикая він залишився вірним республіканським ідеалам. У 1924 році під час Пекінського перевороту став на бік У Пейфу, заявляючи, що їхні політичні погляди ідентичні.\n\nНаразі він обіймає посаду губернатора провінції Чахар. Лі відомий своїм ощадливим і доброчинним способом життя — рідкісна риса серед чжилійських генералів. Він палко захоплюється У Пейфу і займається складанням його біографії.§!"

 # Айсін Ґьоро Сіця
 QIE_aisin_gioro_xiqia: "Айсін Ґьоро Сіця"
 QIE_aisin_gioro_xiqia_high_command_desc: "§YНародився:§! §L18 жовтня 1883 року в Шенцзіні, Велика Цін§!\n§YПриналежність:§! §PМонархіст§!\n§YБіографія:§! §LВипускник кавалерійського відділення японської військової академії. Сіця служив у фентянській армії Чжан Цзуоліня, де керував військовою освітою, але завжди мріяв про повернення династії Цін.\n\nПісля реставрації Сюаньтуна у 1928 році він перейшов на бік імперії разом зі своєю переважно маньчжурською армією. Він — один із небагатьох маньчжурських генералів, що безпосередньо командують великими з'єднаннями. Чжилійці дивляться на нього з глибокою підозрою через його монархічний фанатизм.§!"

 # Лю Чженхуа
 QIE_liu_zhenhua: "Лю Чженхуа"
 QIE_liu_zhenhua_commander_desc: "§YНародився:§! §L1883 рік у повіті Ґун, провінція Хенань, Велика Цін§!\n§YПриналежність:§! §mКліка політичних наук§!\n§YБіографія:§! §LКолишній вчений-чиновник, Лю очолив ополчення під час Сіньхайської революції. За часів республіки він маневрував між фракціями, отримавши посаду губернатора Шеньсі. \n\nПід час Пекінського перевороту 1924 року залишився вірним чжилійцям, за що був вигнаний зі своєї провінції. Зараз він командує хенаньським ополченням. Попри те, що колись він був названим братом Фен Юйсяна, тепер вони — закляті вороги.§!"

 # Лі Шучунь
 QIE_li_shuchun: "Лі Шучунь"
 QIE_li_shuchun_high_command_desc: "§YНародився:§! §L1890 рік у повіті Цінюань, провінція Чжилі, Велика Цін§!\n§YПриналежність:§! §aЦзіньбао§!\n§YБіографія:§! §LЛі здобув освіту в німецьких військових класах у Баодіні. Служив у 3-й дивізії Цао Куня. Після короткого періоду служби у Фен Юйсяна він повернувся до лав чжилійців напередодні Північного походу. Він залишається стійким прибічником баодінської фракції Цао Куня.§!"

 # Цінь Дечунь
 QIE_qin_dechun: "Цінь Дечунь"
 QIE_qin_dechun_high_command_desc: "§YНародився:§! §L11 грудня 1893 року в повіті Їшуй, провінція Шаньдун, Велика Цін§!\n§YПриналежність:§! §cЛоян§!\n§YБіографія:§! §LБлискучий випускник Баодінської академії. Після поразки аньхойської кліки його підрозділи були поглинуті силами У Пейфу. Цінь пройшов шлях від штабного офіцера до командира дивізії. Хоча він вважається молодим обличчям у старій чжилійській кліці, Цінь тримається осторонь фракційних чвар, зосередившись на захисті рідного Шаньдуна.§!"

 # Сін Шилянь
 QIE_xing_shilian: "Сін Шилянь"
 QIE_xing_shilian_commander_desc: "§YНародився:§! §L1885 рік у повіті Ченде, округ Шенцзін, Велика Цін§!\n§YПриналежність:§! §L«Аполітичний»§!\n§YБіографія:§! §LМаньчжур із «Чисто-блакитного стяга». Навчався в Японії разом із Янь Юйтіном. Сін сумнозвісно відомий жорстоким придушенням протестів у Шанхаї 1925 року (бійня 30 травня), де загинули десятки студентів. \n\nПісля реставрації 1928 року він приєднався до маньчжурських побратимів у Пекіні. Він готовий служити будь-кому, хто гарантує йому просування по службі, і зараз активно шукає шляхи, як повалити чжилійське домінування в армії.§!"

 # Айсін Ґьоро Цзісін
 QIE_aisin_gioro_jixing: "Айсін Ґьоро Цзісін"
 QIE_aisin_gioro_jixing_commander_desc: "§YНародився:§! §L1879 рік у повіті Ченде, округ Шенцзін, Велика Цін§!\n§YПриналежність:§! §LАполітичний§!\n§YБіографія:§! §LЧлен імператорської родини, випускник артилерійського відділення в Японії. Сіця служив у штабі Чжан Цзуоліня в Маньчжурії, але після реставрації 1928 року перейшов на бік Великої Цін. Він формально підтримує партію Цзунше, але залишається одним із найбільш аполітичних членів клану Айсін Ґьоро.§!"

 # Ду Сіцзюнь
 QIE_du_xijun: "Ду Сіцзюнь"
 QIE_du_xijun_commander_desc: "§YНародився:§! §L1882 рік у повіті Ґучен, провінція Чжилі, Велика Цін§!\n§YПриналежність:§! §cЛоян§!\n§YБіографія:§! §LВипускник японської академії ІДЗАА з відзнакою. Під час Сіньхайської революції він майстерно змусив своїх людей підтримати повстання, звільнивши революціонерів із в'язниць. \n\nПід час Північного походу він командував обороною Уханя, виграючи час для німецького втручання. Зараз Ду разом із Лю Сянтангом виконує роль «очей та вух» У Пейфу всередині кліки Сунь Чуаньфана.§!"

 #郭寄嶠
 QIE_guo_jijiao: "Ґо Цзіцзяо"
 QIE_guo_jijiao_commander_desc: "§YНародився:§! §L15 жовтня 1902 року в повіті Хефей, провінція Аньхой, Велика Цін§!\n§YПриналежність:§! §LАполітичний§!\n§YБіографія:§! §LЧерез брак коштів на навчання у звичайній школі Ґо перевівся до військових закладів Пекіна. Закінчив Баодінську академію за класом артилерії з відзнакою у 1923 році.\n\nПочинав службу у фентянській армії, але після повстання Ґо Сунліна перейшов до Ґоміньцзюню, а згодом — до чжилійської кліки У Пейфу. Хоча він розглядав можливість переходу до Гоміньдану під час Північного походу, він залишився вірним центральному уряду, коли наступ революціонерів захлинувся. Один із наймолодших командирів чжилійців, Ґо прагматично служить будь-якому законному уряду в Пекіні.§!\n\n§YПримітки: Секретар розповідав про його шалений темп роботи: Ґо працює з 8 ранку до 11 вечора, тримаючи в одній руці телефон із доповідями з фронту, а в іншій — ручку для підпису документів.§!"

 # Вей Їсань
 QIE_wei_yisan: "Вей Їсань"
 QIE_wei_yisan_high_command_desc: "§YНародився:§! §L25 лютого 1884 року в повіті Ґаочен, провінція Чжилі, Велика Цін§!\n§YПриналежність:§! §cЛоян§!\n§YБіографія:§! §LВипускник Баодінської академії 1914 року. Служив в армії Дуань Ціжуя, згодом перейшов до фентянської кліки. Брав участь у перших двох чжилійсько-фентянських війнах, запекло воюючи проти своїх майбутніх союзників.\n\nПісля поразки заколоту Ґо Сунліна втік до Ґоміньцзюню Фен Юйсяна. У 1926 році, зрозумівши, що сили Фена приречені, він приєднався до армії У Пейфу. Вей — досвідчений офіцер, але його важко назвати відданим фанатиком чжилійської справи.§!"

 # Чжан Їньу
 QIE_zhang_yinwu: "Чжан Їньу"
 QIE_zhang_yinwu_desc_body: "Хоча він народився в Баодіні, Чжан навчався у військовій школі в Хейлунцзяні, а згодом закінчив піхотне відділення Баодінської академії. Отримав визнання від Янь Сішаня за службу в Шаньсі. Під час Четвертої чжилійсько-фентянської війни його підрозділи стали вістрям атаки, що забезпечило контроль над Пекіном. Після реставрації 1927 року він присвятив себе освіті у рідному місті. Тепер, коли"
 QIE_zhang_yinwu_desc_end: "потребує його навичок, він знову повернувся до армії на запрошення членів ПМК.§!\n\n§YПримітки: Прихильник сільського самоврядування; у своїх школах він поєднує освіту, військову підготовку та сільськогосподарську практику. Член партії «Молодий Китай».§!"
 QIE_zhang_yinwu_high_command_desc: "§YНародився:§! §L1891 рік у Баодіні, провінція Чжилі, Велика Цін§!\n§YПриналежність:§! §nПМК§!\n§YБіографія:§! §L$QIE_zhang_yinwu_desc_body$ відновлений двір Цін $QIE_zhang_yinwu_desc_end$"
 QIE_zhang_yinwu_advisor_desc: "§YНародився:§! §L1891 рік у Баодіні, провінція Чжилі, Велика Цін§!\n§YПриналежність:§! §nПМК§!\n§YБіографія:§! §L$QIE_zhang_yinwu_desc_body$ Чжун’юаньський уряд $QIE_zhang_yinwu_desc_end$"

 # Тун Цзісюй
 QIE_tong_jixu: "Тун Цзісюй"
 QIE_tong_jixu_commander_desc: "§YНародився:§! §L1884 рік у Фучжоу, провінція Фуцзянь, Велика Цін§!\n§YПриналежність:§! §PМонархіст§!\n§YБіографія:§! §LМаньчжур зі «Стяга облямованого жовтого». До революції викладав англійську мову та математику. Після 1911 року працював у генштабі та авіаційній школі, займаючись впровадженням нових технологій. Паралельно заснував перше в Китаї видавництво, що займалося фототипією творів мистецтва.\n\nПуї особисто запросив його до Забороненого міста. Тун супроводжував імператора у вигнанні в Тяньцзіні. Після реставрації 1927 року він став начальником імператорської гвардії.§!\n\n§YПримітки: Пристрасний фотограф та поціновувач старовини. Навіть командуючи охороною монарха, він продовжує керувати своїм видавництвом.§!"

 # Юй Сюечжун
 QIE_yu_xuezhong: "Юй Сюечжун"
 QIE_yu_xuezhong_high_command_desc: "§YНародився:§! §L19 листопада 1890 року в Пенлаї, провінція Шаньдун, Велика Цін§!\n§YПриналежність:§! §LАполітичний§!\n§YБіографія:§! §LЮй провів дитинство в казармах, оскільки його батько був офіцером. Закінчив військову школу з найкращим результатом на курсі. Під час Північного походу він успішно стримував сили Гоміньдану на Янцзи, поки німецьке втручання не призвело до колапсу революціонерів.\n\nВін став провідним воєначальником чжилійців, надійно охороняючи кордони кліки. Попри близькі стосунки з У Пейфу, Юй майже не цікавиться політичними інтригами.§!\n\n§YПримітки: Чжан Цзуолінь вважає батька Юя своїм благодійником, оскільки той свого часу прийняв Чжана до армії.§!"

 ###- Морське командування -###
 # Ян Шучжуан
 QIE_yang_shuzhuang: "Ян Шучжуан"
 QIE_yang_shuzhuang_navy_chief_desc: "§YНародився:§! §L1882 рік у Фучжоу, провінція Фуцзянь, Велика Цін§!\n§YПриналежність:§! §L«Аполітичний»§!\n§YБіографія:§! §LВипускник військово-морської академії Хуанпу. У 1921 році став фактичним лідером фуцзянського флоту, перетворившись на місцевого мілітариста в Сямені. Під час Північного походу флот під його командуванням залишився вірним чжилійцям. Зараз він має колосальний вплив як голова військово-морських сил Ліги восьми провінцій.§!"

 # Ду Сіґуй
 QIE_du_xigui: "Ду Сіґуй"
 QIE_du_xigui_high_command_desc: "§YНародився:§! §L12 листопада 1874 року в Фучжоу, провінція Фуцзянь, Велика Цін§!\n§YПриналежність:§! §cЛоян§!\n§YБіографія:§! §LВипускник Цзяннанської морської академії. У 1911 році підтримав революціонерів, переконавши адмірала Са Чженьбіна скласти повноваження. Згодом став вірним соратником У Пейфу, допомагаючи йому під час походів на Південь. Після повернення чжилійців до Пекіна став головнокомандувачем флоту та деякий час навіть виконував обов'язки президента. Наразі очолює морську академію у Фучжоу.§!\n\n§YПримітки: В юності запекло палив і рідко виходив у море, за що адмірал Са жартома називав його «сухопутним адміралом».§!"

 # У Юйлінь
 QIE_wu_yulin: "У Юйлінь"
 QIE_wu_yulin_high_command_desc: "§YНародився:§! §L1871 рік у повіті Ше, провінція Аньхой, Велика Цін§!\n§YПриналежність:§! §aЦзіньбао§!\n§YБіографія:§! §LНавчався кораблебудуванню в Німеччині. Працював директором суднобудівного інституту Даґу та залізничного бюро. Був міністром зв'язку в Пекіні. \n\nПісля поразки Гоміньдану Цао Кунь особисто повернув його до лав флоту. У Юйлінь є головним голосом розуму в оточенні Цао, виступаючи проти надмірних поступок Німеччині.§!\n\n§YПримітки: Щодня практикує каліграфію та обожнює читати. Наймає найдорожчих вчителів для своїх дітей.§!"

 # Са Чженьбін
 QIE_sa_zhenbing: "Са Чженьбін"
 QIE_sa_zhenbing_navy_chief_desc: "§YНародився:§! §L30 березня 1859 року в Фучжоу, провінція Фуцзянь, Велика Цін§!\n§YПриналежність:§! §LАполітичний§!\n§YБіографія:§! §LНащадок славетного роду мореплавців, Са навчався в Королівській морській академії Британії. Він фактично відродив морську міць Китаю, провівши радикальні реформи в бейянському флоті. Обіймав посади морського міністра та в.о. прем'єр-міністра. \n\nСа Чженьбіна вважають «батьком сучасного китайського флоту». Його поважають усі фракції за чесність та величезні пожертви на благодійність. У 1935 році його було відкликано з відставки для нового відродження флоту.§!"

 ###- Повітряне командування -###
 # Ші Банфань
 QIE_shi_bangfan: "Ші Банфань"
 QIE_shi_bangfan_air_chief_desc: "§YНародився:§! §L12 серпня 1901 року в повіті Цянь, провінція Хунань, Велика Цін§!\n§YПриналежність:§! §LАполітичний§!\n§YБіографія:§! §LКолишній пілот Гоміньдану, який у 1927 році перейшов на бік чжилійців. Прославився своєю хоробрістю у боях проти фентянської та юньнаньської клік. В одному з боїв його винищувач K-47 отримав 68 пробоїн, а самому Ші довелося ампутувати руку. Тепер він працює в штабі, мріючи про створення сильних та об'єднаних ВПС Китаю.§!"

 # Лю Муцюнь
 QIE_liu_muqun: "Лю Муцюнь"
 QIE_liu_muqun_high_command_desc: "§YНародився:§! §L1905 рік у повіті Ша, провінція Фуцзянь, Велика Цін§!\n§YПриналежність:§! §LАполітичний§!\n§YБіографія:§! §LВипускник Баодінської авіаційної школи. Служив пілотом у різних урядових підрозділах. Зараз очолює авіацію провінції Чжилі та авіаційну школу в Ханчжоу. Тримається осторонь політичних чвар між монархією та мілітаристами.§!"

 # Ван Ґуаньї
 QIE_wang_guanyi: "Ван Ґуаньї"
 QIE_wang_guanyi_air_chief_desc: "§YНародився:§! §L1892 рік у повіті Пін'юань, провінція Шаньдун, Велика Цін§!\n§YПриналежність:§! §LАполітичний§!\n§YБіографія:§! §LВан починав службу як піхотний офіцер У Пейфу, але у 1920 році перекваліфікувався на пілота. Завдяки відмінним результатам став інструктором в авіашколі Баодіна. Брав участь у створенні Китайської авіаційної асоціації у 1928 році та перших цивільних авіаліній країни.§!"

 # Жень Юньґе
 QIE_ren_yunge: "Жень Юньґе"
 QIE_ren_yunge_high_command_desc: "§YНародився:§! §Lсічень 1910 року в повіті Веньань, провінція Чжилі, Велика Цін§!\n§YПриналежність:§! §LАполітичний§!\n§YБіографія:§! §LВиходець із селян, Жень був активістом студентського самоврядування до того, як вступити до авіашколи у 1934 році. Наразі він служить офіцером у 2-й бригаді ВПС Бейяна.§!"

 ###- Теоретики -###
 QIE_tianjin_school: "Тяньцзіньська школа"
 QIE_tianjin_school_theorist_desc: "§YБіографія:§! §LПредставлена офіцерами «нефритового круглого столу» У Пейфу. Їхня сила ґрунтується на військовому генії маршала, який здатен виривати перемогу з пащі поразки. Їхня езотерична форма командування забезпечувала домінування чжилійців понад десятиліття.§!"

 QIE_baoding_clique: "Баодінська кліка"
 QIE_baoding_clique_theorist_desc: "§YБіографія:§! §LГрупа молодих офіцерів під лідерством Цзян Байлі. Вони озброєні залізною волею та патріотичними гаслами, виступаючи проти «старої гвардії». Їхня мета — створення сучасної армії за передовими теоріями, зокрема доктриною стратегічних бомбардувань.§!"

 QIE_cradle_of_the_chinese_eliteheer: "Колиска китайського елітгерy"
 QIE_cradle_of_the_chinese_eliteheer_theorist_desc: "§YБіографія:§! §LОфіцери, що здобули освіту в німецьких військових академіях. Вони принесли із собою прусський менталітет та віру в «модернізацію за будь-яку ціну». Вони прагнуть перетворити армію та промисловість на єдиний злагоджений оркестр за німецьким зразком.§!"

 QIE_qianlong_clique: "Кліка Цяньлуна"
 QIE_qianlong_clique_theorist_desc: "§YБіографія:§! §LВиникла після повернення імператора на престол. Натхненна войовничими традиціями маньчжурів, ця група прагне відродити дух великих завоювань епохи Цяньлуна. Вони сподіваються об'єднати народ під прапором патріотизму та монархічної честі.§!"
