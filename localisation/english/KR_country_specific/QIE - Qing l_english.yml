 QIE_the_diplomatic_offensive: "Дипломатичний наступ"
 QIE_the_diplomatic_offensive_desc: "§LБудучи кар'єрним дипломатом упродовж усього життя, Ґу Вейцзюнь уособлює всю міць поважного дипломатичного корпусу. Національний герой і майстер переконання, він неодмінно вселить у китайський народ не лише надію та енергію, а й щирий патріотизм.§!"
 QIE_idealist_against_the_storm: "Ідеаліст проти бурі"
 QIE_idealist_against_the_storm_desc: "§LХу Ші, якого багато хто вважає ключовим голосом ліберального відродження Китаю, — реформатор, оточений бюрократичною апатією. Відомий своїм непохитним ідеалізмом, прагматизмом та принциповістю, президент принесе плюралістичну демократію в Китайську Республіку, навіть якщо її доведеться тягнути туди силоміць.§!"
 QIE_son_of_heaven: "Син неба"
 QIE_son_of_heaven_desc: "§LХоча найбільші критики Пуї називають його лише зручною маріонеткою, після конституційної реставрації він довів, що є справжнім вершителем Мандату Неба.§!"
 QIE_marshal_of_tianjin: "Маршал Тяньцзіня"
 QIE_marshal_of_tianjin_desc: "§LЧоловік, позбавлений свого початкового статусу в кліці, Ван став несподіваним центром згуртування залишків чжилійських структур. Його опір у чжилійсько-маньчжурській війні приніс йому легендарний статус, подібний до статусу нефритового маршала, і єдине, про що він думає — це помста.§!"
 QIE_marshal_of_tianjin_2: "$QIE_marshal_of_tianjin$"
 QIE_the_diplomat: "Дипломат"
 QIE_the_diplomat_desc: "§LЕксперт із дипломатії та ерудований полімат, Янь Хуейцін завдяки своєму блискучому розуму знову опинився на посаді опікуна Китайської Республіки. Маючи намір закріпити цивільне правління, він забезпечить верховенство Бейяна під своїм наглядом.§!"
 QIE_the_diplomat_2: "$QIE_the_diplomat$"
 QIE_squire_of_tianjin: "Сквайр із Тяньцзіня"
 QIE_squire_of_tianjin_desc: "§LБейянський бюрократ до мозку кісток, Ґао Лінвей служив у численних кабінетах, накопичуючи чималий політичний хист. Провідний член тяньцзіньської фракції чжилійців, Ґао використовує зв'язки та кмітливість для впровадження свого «доброго врядування».§!"
 QIE_mediator_of_moderation: "Посередник поміркованості"
 QIE_mediator_of_moderation_desc: "§LНастала нова ера Бейянської Республіки! Ми більше не страждатимемо від несправедливості демагогів та ідеологів! Добре врядування будується на подоланні політичних розбіжностей задля спільного консенсусу.§!"

