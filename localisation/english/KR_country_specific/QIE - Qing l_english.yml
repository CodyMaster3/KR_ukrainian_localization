###- Starting Ideas -###

 QIE_big_debt: "Пригнічувальний національний борг"
 QIE_big_debt_desc: "Боротьба Китаю за розбудову національної економіки призвела до виникнення величезного торговельного боргу Пекінського уряду. Промислове обладнання імпортується за приголомшливою ціною, а те небагато вітчизняних виробництв, що існують, не мають якості та кількості для конкуренції на світовому ринку. Основним експортом Китаю є переважно сільськогосподарська продукція, і навіть технічні культури приносять низькі ціни порівняно з іноземними предметами розкоші, як-от сигарети та радіоприймачі. Цю проблему лише посилює повсюдна інституціоналізована корупція та процвітаюча торгівля опіумом.\n\nЯкщо нація хоче зменшити борги та звільнитися від кайданів іноземців, доведеться або вдатися до радикальних дій, або президенту доведеться затягнути німців за стіл переговорів, аби зміцнити їхню сторону наших «особливих відносин»."

 QIE_court_of_the_jade_marshal: "Двір нефритового маршала"
 QIE_court_of_the_jade_marshal_desc: "У Пейфу, якого вважають найвидатнішим стратегічним і тактичним розумом у всьому Китаї, забезпечив десятиліття відносної стабільності та єдності. Проте всередині «двору нефритового маршала» панує хаос і розлад. Ніколи не запровадивши генерального штабу чи функціональної системи верховного командування, У історично волів делегувати повноваження старшим генералам, ставлячи їм розмиті цілі без чіткої стратегії. Це призвело до серйозного бюрократичного жаху в центральній армії."

 QIE_stalled_80_division_reform_plan: "Призупинений план реформи 80 дивізій"
 QIE_stalled_80_division_reform_plan_desc: "Завдяки співпраці з нашими німецькими благодійниками та союзниками, консультативна група офіцерів із Берліна намагалася реформувати чжилійську армію за образом німецької імперської армії на Сході. Однак корупція, апатія та брак фінансування призвели до того, що програма з амбітними мріями зайшла в глухий кут."

 QIE_legitimacy_of_the_monarchy: "Легітимність монархії: §oзневажена§!"
 QIE_legitimacy_of_the_monarchy_desc: "Монархія Цін, яка нібито представляє продовження понад трьох століть безперервного правління, була остаточно спаплюжена. Для громадян Китаю — бюрократів, робітників чи селян — безліч правителів і деспотів приходили й ішли з обіцянками реформ лише для того, щоб усе повернулося до того, з чого почалося. Під егідою Мандату Неба династія Цін претендує на номінальне керівництво всією де-юре територією Китаю, проте це призвело лише до постійної руїни. Якщо монархія справді бажає завоювати серця людей, вона повинна спочатку врятувати пригноблений простолюд від вічних злиднів і запевнити народ Китаю, що ця ітерація Цін — реформована.\n\nБезумовно, з 1928 року королівський двір зосередився на ретельному створенні образу модернізму серед своїх членів. Імператор Пуї є лише слугою волі народу, попри його постійні заперечення. Справжніми архітекторами програм розбудови нації є чжилійська кліка. Маючи власні проблеми з репутацією, вони принаймні отримують похвали за постійну увагу до суспільних настроїв. Проте через історію, затьмарену суперечками, багато хто не поділяє оптимізму."

 QIE_legitimacy_of_the_monarchy_1: "Легітимність монархії: §rсумнівна§!"
 QIE_legitimacy_of_the_monarchy_1_desc: "$QIE_legitimacy_of_the_monarchy_desc$"

 QIE_legitimacy_of_the_monarchy_2: "Легітимність монархії: §rсуперечлива§!"
 QIE_legitimacy_of_the_monarchy_2_desc: "$QIE_legitimacy_of_the_monarchy_desc$"

 QIE_legitimacy_of_the_monarchy_3: "Легітимність монархії: §Cвизнана§!"
 QIE_legitimacy_of_the_monarchy_3_desc: "$QIE_legitimacy_of_the_monarchy_desc$"

 QIE_legitimacy_of_the_monarchy_cao: "Легітимність монархії: §mмодерність через компроміс§!"
 QIE_legitimacy_of_the_monarchy_cao_desc: "Унікальна система, створена шляхом злиття чжилійської кліки з маньчжурською монархією, вижила, стабілізувалася і процвітає. Під крилом президента Цао та маршала У династія Цін вітала нову еру процвітання та сучасності, зарекомендувавши себе як друг усіх ділових кіл в Азії. Хоча плюралізацією політичної сцени нехтують, економічна ситуація стрімко покращилася. Середній клас, що тільки зароджується, швидко розвивається, міські центри перетворюються на низку перлин, що всіяли Схід, а селянство вітає зростаючі перспективи свого життя. Виправдовуючи «добродушного дідуся» та його обстоювання особливих дипломатичних відносин Китаю із Заходом, це століття справді стане китайським."

 QIE_legitimacy_of_the_monarchy_wu: "Легітимність монархії: §Gгармонійний баланс§!"
 QIE_legitimacy_of_the_monarchy_wu_desc: "Унікальна система, створена шляхом злиття чжилійської кліки з маньчжурською монархією, вижила та зміцнилася. Під опікою президента Цао та маршала У династія Цін отримала сплеск народної підтримки після прийняття націоналістичної діалектики та антиконцесіонізму. Повернувши собі авторитет і легітимність, політична сцена династії вітала появу лояльної опозиції Товариству гармонії, а з об'єднанням нації демократична конституційна китайська монархія стала реальною перспективою для небагатьох сповнених надії людей. Проте нефритовий маршал і король Баодіна, як справжня влада за троном, усе ще плекають республіканські мрії, і майбутній конфлікт може порушити цей гармонійний баланс..."

 QIE_legitimacy_of_the_republic_1: "Легітимність республіки: §8під питанням§!"
 QIE_legitimacy_of_the_republic_1_desc: "Яка іронія долі. Бейянська Республіка, що була проголошена у 1912 році після запеклої боротьби за викорінення монархії, стала лише інструментом у руках диктаторів. Розірвана на шматки мілітаристами, вона була корумпованим знаряддям у руках тієї кліки, що контролювала Пекін. З остаточним вигнанням підступних монархістів із нашої славної Бейянської Республіки дух Сіньхайської революції знову оживає. Проте прості люди та деякі колишні союзники сумніваються в нашій щирості. Багато хто вважає наш проєкт державотворення фальшивкою, оскільки чжилійці відкинули республіку, коли це було зручно. Проте це новий початок із новою конституцією та новим президентом: п'ять народів у одному союзі гордо стоять під сприятливою хмарою."

 QIE_legitimacy_of_the_republic_hu_shih_1: "Легітимність республіки: §lуряд добрих людей§!"
 QIE_legitimacy_of_the_republic_hu_shih_1_desc: "Відомий ліберальний філософ, інтелектуал і плідний письменник Ху Ші був обраний президентом. Його обрання знаменує нову еру ліберального відродження та реформізму в межах китайської республіканської мрії. Багато хто вважає його уряд наступником короткого «кабінету добрих людей» Ван Чунхуея. Маючи намір розбудувати справді демократичну Бейянську Республіку, Ші прагне конституційного, прозорого та відповідального уряду під проводом «добрих людей» Китаю — тобто виняткових членів суспільства або освіченої еліти."

 QIE_legitimacy_of_the_republic_hu_shih_2: "Легітимність республіки: §cфедералізована унітарна держава§!"
 QIE_legitimacy_of_the_republic_hu_shih_2_desc: "З об'єднанням нації унікальне керівництво Ху Ші на чолі республіки дозволило вкорінитися особливій формі врядування. Заснована на принципах як президента Ху, так і нефритового маршала У Пейфу, вона призвела до появи «федеративної унітарної держави». Ці двоє людей, поділяючи віру в демократію, діаметрально розходяться у питанні федералізму. Оскільки Ху є видатним північним федералістом, а У — централістом, демократія уряду є вкрай незвичайною."

 QIE_legitimacy_of_the_republic_koo_1: "Легітимність республіки: §9п'ять народів у одному союзі§!"
 QIE_legitimacy_of_the_republic_koo_1_desc: "Веллінгтон Ку (Ґу Вейцзюнь) — людина, чиє життя тісно переплетене з Бейянською Республікою. Провідний член дипломатичного корпусу, він є одним із найвидатніших націоналістичних бюрократів. Обраний президентом, Ку несе зі собою спадщину старого Бейяна, відроджуючи його політичну сцену. Як типовий дипломат, Ку ставить обов'язок, націю та службу вище за політику, тому ця нова ера бюрократичного та аполітичного врядування має стабілізувати молоду республіку."

 QIE_legitimacy_of_the_republic_koo_2: "Легітимність республіки: §gпід сприятливою хмарою§!"
 QIE_legitimacy_of_the_republic_koo_2_desc: "З об'єднанням нації керівництво Веллінгтона Ку дозволило спадщині Сіньхаю розквітнути ще сильніше, ніж раніше. Для китайського народу настає час нової надії та оптимізму. «Яка яскрава сприятлива хмара! Яке широке сяйво! Світло видовищне з сонцем чи місяцем. Як воно відроджується світанок за світанком!»"

 QIE_gathering_provincial_taxes: "Збір провінційних податків"
 QIE_gathering_provincial_taxes_desc: "Звикнувши проганяти наших податківців на кордоні, різні регіональні губернатори розтовстіли і заспокоїлися на своїх купах «зарезервованих» податкових зобов'язань перед урядом. Вони використовують ці кошти для фінансування власних армій, кидаючи виклик Пекіну. Така зневага до нашої влади неприпустима! Відправивши озброєні полки супроводжувати наших посадовців, ми вилучимо належні нам фінанси так чи інакше."

 QIE_excising_the_filth: "Викорінення бруду"
 QIE_excising_the_filth_desc: "Занадто довго розпусний бруд опіуму проникав у наш культурний світогляд. Навколо нас селяни, солдати, офіцери і навіть деякі політики вживають цю речовину заради розради чи задоволення. Опіумна торгівля продовжує процвітати, особливо в таких регіонах, як Юньнань, Сичуань або Ґуансі. Це створює вкрай небезпечну ситуацію для китайської нації. Спільними зусиллями Пекіна, Ґуандуна, Нанкіна та інших столиць провінцій ми виріжемо цю гниль! Знищимо цей вплив століття приниження раз і назавжди!"

###- Military Ideas -###
 QIE_chaos_in_command: "Хаос у командуванні"
 QIE_chaos_in_command_desc: "Після надзвичайного засідання верховного командування чжилійців на тлі розпаду ліги, штаб охопили цілковите розладнання та манія. Внутрішні чвари між фракціями щодо того, кого підтримати, призвели до повної неспроможності командування навіть адекватно реагувати на поточну ситуацію."

 QIE_unprepared_military: "Непідготовлена армія"
 QIE_unprepared_military_desc: "Через неспроможність вчасно та повною мірою впровадити жоден із планів реформ, чжилійська армія перебуває у стані справжнього розвалу. Солдати та офіцери гарячково намагаються завершити або втілити наполовину готові реформи. На тлі загрози з боку Країни Вранішнього Сонця, наступний конфлікт між китайською та японською сферами впливу безперечно стане війною за національне виживання."

 QIE_jiang_baili_plan_success: "Десять тисяч синів, десять тисяч військ"
 QIE_jiang_baili_plan_success_desc: "«Якщо ви віддасте свою землю та суверенітет, ви станете вічним грішником перед китайською нацією! У цей час ми можемо лише битися за життя всієї нації, щоб здобути остаточну перемогу. У вирішальну мить ми не маємо іншого вибору, окрім як жертвувати собою до переможного кінця і битися до останнього. Немає різниці між сходом, заходом, північчю чи півднем, немає різниці у віці — кожен зобов'язаний захищати країну і битися!»\nДля мучеників Китаю минулого та сьогодення — нехай це стане свідченням ваших жертв."

 QIE_tang_zaili_plan_success: "Гуркіт грому, гуркіт металу"
 QIE_tang_zaili_plan_success_desc: "«Лише нація, що бореться, може нести відповідальність за мир у всьому світі, і така нація повинна організувати свої матеріальні ресурси та людську силу з максимально можливим рівнем ефективності. Бо війна — це не просто воєнні дії, вона залучає всі сили та ресурси держави. Не лише солдати, а й усі громадяни без винятку повинні брати участь. Зі своєю п'ятитисячолітньою історією, величезною територією та колосальним населенням Китай стоїть як гірська вершина серед народів світу. Ми не можемо дозволити йому похитнутися».\nПеред лицем будь-якої опозиції чжилійцям, армії нефритового маршала неодмінно знищать ворожі сили."

 QIE_formation_of_a_militaristic_state_people_level1: "Формування мілітаристського державо-народу"
 QIE_formation_of_a_militaristic_state_people_level1_desc: "Як і проповідував ідеолог Цзян Байлі на основі свого досвіду в Баодіні та під командуванням чжилійців, нова армія центрального уряду прагне наслідувати модель «мілітаристського державо-народу». Вірячи в ідею тотальної війни та виняткову хоробрість лідерів, новий план реформи армії прославляє мілітаризм і цілковиту відданість нації."

 QIE_formation_of_a_militaristic_state_people_level2: "$QIE_formation_of_a_militaristic_state_people_level1$"
 QIE_formation_of_a_militaristic_state_people_level2_desc: "$QIE_formation_of_a_militaristic_state_people_level1_desc$"

 QIE_formation_of_a_militaristic_state_people_level3: "$QIE_formation_of_a_militaristic_state_people_level1$"
 QIE_formation_of_a_militaristic_state_people_level3_desc: "$QIE_formation_of_a_militaristic_state_people_level1_desc$"

 QIE_formation_of_a_militaristic_state_people_level4: "$QIE_formation_of_a_militaristic_state_people_level1$"
 QIE_formation_of_a_militaristic_state_people_level4_desc: "$QIE_formation_of_a_militaristic_state_people_level1_desc$"

 QIE_in_the_footsteps_of_giants_level1: "Стопами велетнів"
 QIE_in_the_footsteps_of_giants_level1_desc: "Щиро вірячи у доброзичливу співпрацю між пекінським урядом та Німецькою імперією, попри всі концесії, центральний уряд обрав стратегію військової реформи, спрямовану на завершення раніше зупиненого «плану 80 дивізій». Це дозволить створити нову елітну силу за європейським зразком."

 QIE_in_the_footsteps_of_giants_level2: "$QIE_in_the_footsteps_of_giants_level1$"
 QIE_in_the_footsteps_of_giants_level2_desc: "$QIE_in_the_footsteps_of_giants_level1_desc$"

 QIE_in_the_footsteps_of_giants_level3: "$QIE_in_the_footsteps_of_giants_level1$"
 QIE_in_the_footsteps_of_giants_level3_desc: "$QIE_in_the_footsteps_of_giants_level1_desc$"

 QIE_in_the_footsteps_of_giants_level4: "$QIE_in_the_footsteps_of_giants_level1$"
 QIE_in_the_footsteps_of_giants_level4_desc: "$QIE_in_the_footsteps_of_giants_level1_desc$"

 QIE_revival_of_the_new_army_level1: "Відродження нової армії"
 QIE_revival_of_the_new_army_level1_desc: "Колись створені як остання спроба реформувати хвору військову структуру Великої Цін, нові армії призвели лише до появи військових диктаторів на кшталт Юань Шикая чи У Пейфу. З відновленням істинного Мандату Неба двір вирішив знову впровадити програму модернізації нової армії з необхідними змінами для забезпечення вірності імператору. З почуттям обов'язку, честі та любові до монархії наші армії нестимуть із собою небесну кару."

 QIE_revival_of_the_new_army_level2: "$QIE_revival_of_the_new_army_level1$"
 QIE_revival_of_the_new_army_level2_desc: "$QIE_revival_of_the_new_army_level1_desc$"

 QIE_revival_of_the_new_army_level3: "$QIE_revival_of_the_new_army_level1$"
 QIE_revival_of_the_new_army_level3_desc: "$QIE_revival_of_the_new_army_level1_desc$"

 QIE_revival_of_the_new_army_level4: "$QIE_revival_of_the_new_army_level1$"
 QIE_revival_of_the_new_army_level4_desc: "$QIE_revival_of_the_new_army_level1_desc$"

 QIE_reorganised_high_command: "Реорганізоване верховне командування"
 QIE_reorganised_high_command_desc: "Завдяки планомірній реформі армій центрального уряду було ліквідовано стару, неефективну структуру повної автономії вищих командирів. Це призвело до створення верховного командування, здатного організовувати масштабні стратегічні операції."

 QIE_chinese_high_command: "Китайське верховне командування"
 QIE_chinese_high_command_desc: "З досягненням зеніту наших реформ, нове верховне командування центрального уряду здатне перехитрити не лише місцевих мілітаристів, а й Японію чи будь-яку іншу іноземну державу. Імперіалісти тремтітимуть перед міццю найкращих і найталановитіших офіцерів Китаю."

 QIE_renovated_baoding_arsenal_idea: "Оновлений баодінський арсенал"
 QIE_renovated_baoding_arsenal_idea_desc: "Цей арсенал хоч і скромний за розмірами, проте критично важливий для майбутнього розвитку нашого офіцерського корпусу. Арсенал академії Баодін створює середовище, де наші блискучі кадети можуть застосовувати теорію на практиці. Отримуючи сучасне обладнання та знання, вони сформують елітний корпус, за допомогою якого Китай утвердить своє місце у світовому порядку."

 QIE_embers_of_a_new_beiyang: "Жарини нового Бейяна"
 QIE_embers_of_a_new_beiyang_desc: "Під керівництвом морського міністра адмірала Са Чженьбіна міністерству вдалося залучити значні кошти для впровадження, мабуть, однієї з найамбітніших програм модернізації в історії. На тлі зростання напруженості у світі він зібрав увесь штаб бейянського флоту для реалізації «шестирічної програми». Адміралтейство сподівається створити флот, що представлятиме не лише уряд, а й усю китайську націю. Хоча навряд чи він зможе одразу кинути виклик флотам Японії, США чи Німеччини, саме лише відродження гордості за бейянський флот має величезне значення для відновлення національного патріотизму."

 QIE_the_beiyang_navy: "Бейянський флот"
 QIE_the_beiyang_navy_desc: "Бейянський флот бере свій початок у 1888 році, коли він був заснований Лі Хунчжаном. Колись він був восьмим за величиною флотом у світі та найбільшим в Азії, проте був знищений під час першої японсько-китайської війни. Флот кілька разів намагалися відновити, але він залишався мізерним через нехтування та домінування мілітаристів у політиці. Тепер, коли центральний уряд потребує захисту від можливого японського вторгнення, бейянський флот знову відроджується під керівництвом адмірала Са Чженьбіна."

 QIE_foreign_advisory_training: "Вишкіл під наглядом іноземних радників"
 QIE_foreign_advisory_training_desc: "Залучивши до служби військових вигнанців із Заходу, які залишилися без роботи у великих містах Китаю, армії центрального уряду проходять період доктринальної модернізації. Разом із цим наші авіаційні та морські штаби проходять інтенсивне навчання для створення справжнього сучасного китайського флоту та військово-повітряних сил."

 QIE_baoding_military_academy: "Баодінська військова академія"
 QIE_baoding_military_academy_desc: "Заснована у 1902 році Юань Шикаєм, Баодінська академія має багату історію, позначену боротьбою революційних настроїв із північною політичною апатією. Академія стала кузнею військових геніїв. Навчальна програма, що базувалася на японських та німецьких методах, робила ставку на чотири дисципліни: тактику, володіння зброєю, фортифікацію та логістику. Виховавши таких лідерів, як Цао Кунь та У Пейфу, академія є серцем військової потужності центрального уряду. Її девіз: «Будь надійним, пунктуальним, старанно вчися, наполегливо практикуйся, люби освіту, будь патріотом»."

 QIE_chinese_soldiers_german_weapons_idea: "Китайські солдати, німецька зброя"
 QIE_chinese_soldiers_german_weapons_idea_desc: "Використовуючи контакти з німецькими промисловцями всередині країни, Ліга процвітання та офіцери «Колиски китайського елітгеру» працюють над спрощенням процедур закупівлі озброєння у провідних оборонних фірм."

 QIE_national_aviation_programme: "Національна авіаційна програма"
 QIE_national_aviation_programme_desc: "Тривалий час Китай намагався наздогнати Захід у сфері повітряної війни, маючи лише кілька застарілих літаків. Оскільки регіональні воєначальники почали створювати власну авіацію, уряд рішуче налаштований не допустити приниження від провінційних губернаторів. Завдяки зв'язкам із авіапромисловістю «Міттельойропи» китайські заводи проходять процес модернізації для потреб літакобудування."

 QIE_80_division_plan: "Відновлення плану 80 дивізій"
 QIE_80_division_plan_desc: "Співпраця між чжилійськими арміями та німецькою військовою місією відновилася, а раніше призупинений «план 80 дивізій» було реанімовано після нових угод маршала Ван Чженбіня з німцями. План передбачає реформування всієї китайської армії у 80 висококваліфікованих, добре оснащених дивізій, організованих за німецьким зразком. Шляхом реорганізації та розформування застарілих частин китайська армія увійде у нове століття могутності."

###- Econ Ideas -###
 QIE_black_monday: "Чорний понеділок"
 QIE_black_monday_desc: "Хоча більшій частині Китаю вдалося уникнути масштабних економічних наслідків Чорного понеділка, тісне переплетення нашої економіки з німецькою завдало помірного удару по виробництву. Поки наша і без того хитка економіка наближається до краху, країною неодмінно покотяться протести, безробіття та страйки. Здається, що сам світовий порядок чжилійців може розлетітися на шматки. Міністерство фінансів під керівництвом Ван Кеміня намагається зупинити кровотечу в економіці, але без узгоджених зусиль усього уряду хвиля кризи лише зростатиме."

 QIE_defaulted_debt: "Дефолт за зовнішнім боргом"
 QIE_defaulted_debt_desc: "Подаючи це як справжній крок проти іноземних імперіалістів, уряд обрав радикальний шлях — повну відмову від виплати міжнародних боргів. Це, безумовно, зміцнило нашу внутрішню легітимність, але вщент зруйнувало віру світових банкірів у здатність китайського центрального уряду платити за рахунками. Кредитний рейтинг знищено, і наслідки цього кроку відлунюватимуть роками, зачіпаючи кожну галузь. Проте це краще, ніж століття приниження, чи не так?"

 QIE_unclogging_the_arteries: "Розчищення артерій"
 QIE_unclogging_the_arteries_desc: "Через занедбаність, руйнування та свавілля місцевих мілітаристів залізнична мережа Китаю перетворилася на лабіринт із різною шириною колій, хаотичним плануванням та корупцією. Повсюдно подорожні стикаються з непослідовними податками та вимаганням грошей. Завдяки зосередженим зусиллям, викоріненню гнилі в мережах та залученню нових службовців та інженерів, ми зможемо модернізувати наші залізниці за західним зразком. З їхньою допомогою чи без неї."

 QIE_daye_hanyang_rapid_development_scheme: "План прискореного розвитку Дає-Ханьяна"
 QIE_daye_hanyang_rapid_development_scheme_desc: "Позбавлені найбільш продуктивних зон, як-от Тяньцзінь, Шанхай чи Гонконг, та маючи під контролем лише примхливу місцеву владу в Кантоні чи Нанкіні, ми давно мріяли про власний «східний Париж» на Центральних рівнінах. Коридор Дає-Ханьян на околицях Уханя, що стрімко розвивається, вже зосереджує основну частину промислового потенціалу уряду поза межами Пекіна і демонструє чудову готовність до розширення."

 QIE_kailuan_mining_bureau_idea: "Гірниче бюро Кайлуань"
 QIE_kailuan_mining_bureau_idea_desc: "На жаль для такої багатої нації, різні китайські уряди часто марнували колосальні поклади багатств прямо у себе під ногами. Географічне положення Китаю благословенне родовищами заліза, вугілля та вольфраму. Маючи намір стабілізувати фінансові угоди та забезпечити уряд необхідними коштами, кабінет вирішив відновити роботу Гірничого бюро Кайлуань для допомоги у видобутку."

###- ForPol Ideas -###
QIE_support_ANQ_idea: "Підтримка кліки Аньцін"
 QIE_support_LEP_idea: "Підтримка Нанкінської кліки"
 QIE_support_KUM_idea: "Підтримка Кумульського ханства"
 QIE_attack_fed_GXC_idea: "Знищити лянґуанських федералістів"
 QIE_attack_fed_HNN_idea: "Знищити хунанських федералістів"
 QIE_attack_fed_SZC_idea: "Знищити сичуанських федералістів"
 QIE_attack_fed_YUN_idea: "Знищити юньнанських федералістів"
 QIE_attack_FNG_idea: "Перетнути річку Дай"
 QIE_attack_kmt_CHI_idea: "Загроза лівого Гоміньдану"
 QIE_attack_kmt_GXC_idea: "Лянґуанська загроза Гоміньдану"
 QIE_attack_kmt_HNN_idea: "Хунанська загроза Гоміньдану"
 QIE_attack_kmt_YUN_idea: "Юньнанська загроза Гоміньдану"

 QIE_hammer_of_heaven: "Молот небес"
 QIE_hammer_of_heaven_desc: "Підступні та мерзенні зрадники з шансійської кліки зазіхнули на життя нефритового маршала та короля Баодіна! Такий злочин не може лишитися безкарним! Армії чжилійців не зупиняться, доки Тайюань не перейде під наш контроль. Нехай провал змови Янь Сішаня стане наочним уроком для кожного, хто виступає проти центрального уряду або підтримує маньчжурів."

 QIE_united_china_idea: "Домінування жителів півночі"
 QIE_united_china_idea_desc: "[QIE_united_china_scripted_loc]"
 QIE_united_china_idea_intro: "Занадто довго Південь намагався вирвати контроль або тримав нас у заручниках своїх революційних ідеалів чи програм. Проте беззаперечно, що центр сили в Китаї — це Пекін. Центральний уряд править із північної столиці з абсолютною перевагою. Якщо ми хочемо приборкати прикордоння, портові міста та інших мілітаристів, ми маємо використати патріотичне піднесення, що принесло нам об'єднання нації!"
 QIE_united_china_idea_desc_republic: "$QIE_united_china_idea_intro$ Чжунхуа Міньґо ваньсуй! Чжунґо ваньсуй ваньваньсуй!"
 QIE_united_china_idea_desc_manchu: "$QIE_united_china_idea_intro$ Хуанді ваньсуй, ваньсуй, ваньваньсуй!"

###- Антиконцесіоністи -###
 QIE_popular_warlord_idea: "Народна підтримка чжилійської кліки"
 QIE_popular_warlord_idea_desc: "Рішення кабінету втрутитися на боці антиконцесіоністського руху та його лідера, губернатора Чень Тяоюаня, викликало неабиякий сплеск народної прихильності. Навіть вічно опозиційна пекінська інтелігенція знову почала писати статті, де президент Цао та маршал У постають у позитивному, майже реформаторському світлі. Поза лаштунками багато хто вірить, що це перший крок до виправлення несправедливості 1928 року або до повної реформи інституту монархії. Здобувши величезну легітимність, чжилійці знову вважаються єдиними відповідальними воєначальниками, здатними захистити спадщину Бейянського уряду."

 QIE_nationalised_german_industry: "Націоналізована німецька промисловість"
 QIE_nationalised_german_industry_desc: "Від'єднання від німецького орла — справа дорога, але зрештою вигідна. Хоча на нас тиснуть катастрофічні санкції підступних імперіалістів, чжилійці теж можуть вести фінансову війну. Націоналізувавши всі німецькі фірми, заводи та арсенали, ми використаємо прибутки для компенсації браку іноземних інвестицій."

 QIE_extol_nationalist_cause: "Звеличення націоналістичної справи"
 QIE_extol_nationalist_cause_desc: "Якщо партія «Молодий Китай» чимось і славиться, то це щирим патріотизмом. Віддані державі та її народу, вони мобілізували всіх гордих та переконаних громадян. Цей чистий рух дає нашому уряду потік героїв, готових пожертвувати собою задля збереження китайської цивілізації."

 QIE_seeing_to_rural_reconstruction: "Турбота про сільську реконструкцію"
 QIE_seeing_to_rural_reconstruction_desc: "Співпрацюючи з непохитними реформаторами з Товариства реформ Китайської імперії, як-от Лян Шумін чи Джеймс «Джиммі» Єн, ми беремося за вирішення найгостріших проблем сільського Китаю. Оскільки народ є фундаментом країни, ми розпочнемо впровадження «чотирьох головних освіт» та «трьох основних методів» Джиммі Єна, аби виховати громадян, здатних підтримувати сучасну китайську державу."

 QIE_iterating_upon_german_designs: "Вдосконалення німецьких розробок"
 QIE_iterating_upon_german_designs_desc: "Одна з наших найгірших репутацій полягає в тому, що після століття приниження Китай нібито не здатен на інновації у сучасній війні. Мовляв, ми можемо лише покладатися на іноземне. Хоча ми багато чого навчилися через зворотну розробку, в нації живе дух винахідництва, прикладом якого є гвинтівка генерала Лю. Вивчаючи наші запаси маузерів та артилерії, ми створимо власні зразки, вільні від підступного німецького впливу."

 QIE_populist_support: "Перша помста імперіалістам!"
 QIE_populist_support_desc: "Рішення уряду анулювати всі кабальні боргові угоди з імперіалістичними державами ради концесій викликало потужну хвилю народної підтримки. Інтелектуали, селяни та навіть деякі мілітаристи надіслали привітання кабінету міністрів. Це справжня ознака нашої легітимності як міжнародно визнаного уряду! Хоча це і не скасовує економічних санкцій, накладених на нас."

###- Проконцесіоністи -###
 QIE_outraged_parties: "Обурені партії"
 QIE_outraged_parties_desc: "Прийнявши рішення допомогти клептократичному гіганту — Лізі восьми провінцій, — опозиція в асамблеї відреагувала категоричною відмовою співпрацювати з Товариством гармонії. Представники партії «Молодий Китай», Товариства реформ та партії Цзунше покинули засідання, фактично паралізувавши легітимність уряду та його здатність ухвалювати закони. Гірше того, вони почали мобілізувати народний протест проти чжилійської кліки."

 QIE_placating_manchu: "Замирення партії Цзунше"
 QIE_placating_manchu_desc: "Маньчжурські дворяни, що мають найбільший вплив у партії Цзунше, завжди думають лише про свої гаманці та маєтки. Уряд був змушений піти на поступки: міністерство фінансів виділило значну частину бюджету на виплату «дворянських пенсій» під приводом збереження «імперської культури». Цао розуміє, що в жорстокому світі пекінської політики все вирішує багатство."

 QIE_placating_CERA: "Замирення ТРАК"
 QIE_placating_CERA_desc: "Ідеалісти-реформатори з Товариства реформ Китайської імперії потребували лише визнання їхніх чеснот та міцного рукостискання. Президент уклав компроміс із конституціоналістами та Рухом сільської реконструкції: уряд виділить ресурси на поступову націоналізацію промисловості, боротьбу з корупцією та обмеження панування дворян-землевласників у селах. Також Рух отримає фінансування для своїх освітніх ініціатив."

 QIE_Sie_Contracts: "Контракти з Siemens-Schuckert"
 QIE_Sie_Contracts_desc: "Кабінет міністрів запропонував всесвітньо відомій електротехнічній компанії Siemens-Schuckert низку вигідних контрактів на виробництво радіообладнання та іншу економічну допомогу. Ми сподіваємось, що збудовані ними заводи та найняті робітники допоможуть зміцнити китайську економіку."

 QIE_german_railroad_engineers_idea: "Залізнична допомога Міттельойропи"
 QIE_german_railroad_engineers_idea_desc: "Ми домовилися з європейськими залізничними магнатами та експертами про масштабний проєкт модернізації наших колій. Хоча це корисно для цивільних потреб, проєкт передусім розроблявся з думкою про військову логістику та посилення впливу центру на далекі регіони."

 QIE_zhili_war_production_idea: "Німецька допомога у військовому виробництві"
 QIE_zhili_war_production_idea_desc: "Використовуючи зв'язки фракції Цзіньбао в Лізі процвітання та Пекінській комісії, ми залучили потік інвестицій та технологій для наших військових заводів. Це призвело до швидкого оновлення спорядження та формування перших китайських бронетанкових бригад. Верховне командування вірить, що ця зброя стане щитом, об який розіб'ється японський наступ."

 QIE_flurry_of_investment: "Шквал інвестицій"
 QIE_flurry_of_investment_desc: "Після офіційного оголошення про послаблення торговельних обмежень, китайський ринок побачив приплив капіталістів — переважно іноземних. Їхня допомога дозволила стабілізувати жахливу економічну ситуацію, проте репутація іноземних імперіалістів створює постійне тертя між урядом та народом."

###- Republic -###

 QIE_big_protests: "Масштабні протести"
 QIE_big_protests_desc: "Через наше офіційне мовчання щодо розпаду ліги, партії як концесіоністського, так і антиконцесіоністського таборів вимагають від кабінету негайних дій. Ліга процвітання та Пекінська комісія, незадоволені неспроможністю уряду гарантувати німецькі інвестиції, почали фінансувати медійні кампанії проти чжилійців.\n\nВодночас антиконцесіоністські настрої були підхоплені інтелектуальними колами Пекіна, аби знову спрямувати народний гнів проти кліки. Схоже, за лаштунками активізувалися таємні сили: серед монархістів ширяться чутки про змову з метою повалення республіканців, які тримають їхнього улюбленого імператора в заручниках у Забороненому місті..."

 QIE_centralized_exec_constitution: "Бейянська конституція"
 QIE_centralized_exec_constitution_desc: "Після тривалих обговорень було підготовлено нову конституцію Бейянської Республіки. Вона базується на конституції Цао Куня 1923 року, але виправляє її недоліки, посилюючи систему стримувань та противаг і розширюючи громадянські свободи. Проте оскільки цей варіант надає перевагу сильній виконавчій владі та централізованій бюрократії, здається, що конфуціанська консервативна республіка, якої прагнув нефритовий маршал, уже зовсім поруч. Але історія Бейяна вчить: шлях до справжньої демократії через спротив знаті та консерваторів ніколи не буває прямим."

 QIE_centralized_leg_constitution: "Бейянська конституція"
 QIE_centralized_leg_constitution_desc: "Цей варіант нової конституції надає перевагу сильному законодавчому органу та централізованій бюрократії. Схоже, справжня парламентська демократія, закладена Тимчасовою республікою 1912 року, знову стає основною формою правління. Проте об'єднання нації та опір консервативних сил асамблеї означають, що втілення мрій мучеників Сіньхаю зіткнеться з чималими перешкодами."

 QIE_autonomous_exec_constitution: "Бейянська конституція"
 QIE_autonomous_exec_constitution_desc: "Нова конституція, що надає перевагу автономній бюрократії та сильній виконавчій владі, є еклектичним поєднанням прагнень федералістів та бейянських централістів. Хоча це не повний федералізм, це значна перемога для прихильників цього руху на півночі, які змусили навіть непохитного нефритового маршала піти на поступки комітету."

 QIE_autonomy_leg_constitution: "Бейянська конституція"
 QIE_autonomy_leg_constitution_desc: "Надаючи перевагу автономній бюрократії та сильному законодавчому органу, цей варіант конституції став найважливішою перемогою федералістського руху в бейянській політиці. На півдні вже вітають Ху Ші як рятівника північного федералізму. Втім, не варто забувати: Бейянська Республіка все ще перебуває під владою мілітаристів, чи то провінційних, чи то з «круглого столу» нефритового маршала."

 QIE_cao_kun_constitution: "Конституція Цао Куня 1923 року"
 QIE_cao_kun_constitution_desc: "Визначний зразок прогресивного законодавства, конституція 1923 року стала спробою формалізувати належне врядування після зловживань Дуань Ціжуя. Вона зосереджує значну виконавчу владу в руках президента, водночас окреслюючи чіткий поділ гілок влади та права громадян. На жаль, її перше впровадження було заплямоване скандалом із підкупом, і її нинішнє повернення є черговою спробою швидко стабілізувати політичну ситуацію."

 QIE_public_safety_bureau: "Пекінське бюро громадської безпеки"
 QIE_public_safety_bureau_desc: "Бюро громадської безпеки (ПБГБ) — це розвідувальне агентство, що виконує роль таємної поліції чжилійців. Під керівництвом Лю Менґена та Ван Юйцзя воно використовує шпигунські мережі Цао Куня, аби гарантувати, що «маньчжурський переворот» більше ніколи не повториться. Контррозвідка та придушення внутрішнього інакомислення є головними завданнями цієї структури."

 QIE_dealing_with_dishonesty: "Боротьба з нечесністю"
 QIE_dealing_with_dishonesty_desc: "Політична корупція є повсякденною реальністю Пекіна. Президент створив низку антикорупційних агентств, сподіваючись викорінити ці зловживання. Хоча це навряд чи похитне домінування місцевої знаті за межами столиці, президент та нефритовий маршал сподіваються, що цей приклад змусить губернаторів діяти. Однак такі заходи викликають шалений опір істеблішменту, який боїться стати наступною ціллю арештів."

 QIE_burgeoning_pluralism: "Зародження плюралізму"
 QIE_burgeoning_pluralism_desc: "Борючись за лібералізацію та знищення заскорузлої бюрократичної еліти, президент Ху розпочав хрестовий похід проти непрозорих політиків. Прагнучи створити уряд «добрих людей», він сприяв зростанню підтримки малих партій, що призвело до серії переходів депутатів із Товариства гармонії. Це створює здорову опозицію, хоча чжилійці все ще міцно тримають владу."

 QIE_revival_of_new_nationalism: "Відродження нового націоналізму"
 QIE_revival_of_new_nationalism_desc: "Після приєднання партії «Молодий Китай» до республіканської коаліції їхня позиція проти монархії Цін отримала широке визнання. Зростання націоналістичної риторики призвело до масового напливу добровольців до армії, флоту та авіації. Керовані патріотизмом, ці герої готові пожертвувати собою заради китайської держави. Справжній мілітаристський державо-народ."

 QIE_mass_nationalisation_of_noble_estates: "Масова націоналізація маєтків знаті"
 QIE_mass_nationalisation_of_noble_estates_desc: "Аби досягти справжнього республіканізму, недостатньо просто усунути імператора. Ми маємо позбавити роялістів їхніх маєтків, підприємств та інших інструментів впливу на населення. Це може здатися жорстоким, але їхні величезні статки дозволять їм жити цілком комфортно, поки китайський селянин продовжує страждати."

 QIE_support_of_the_bankers: "Підтримка банкірів"
 QIE_support_of_the_bankers_desc: "Використовуючи свої зв'язки як одного із засновників Банку Китаю, міністр фінансів Ван Кемінь заручився підтримкою банківських кланів Пекіна, Шанхая, Тяньцзіня та Уханя. Це критично важливо для стабілізації фінансового сектору нашого уряду."

 QIE_reaching_out_to_endeavour_idea: "Діалог із «Зусиллям»"
 QIE_reaching_out_to_endeavour_idea_desc: "Товариство «Зусилля» — це інтелектуальна організація, заснована такими діячами як Цай Юаньпей та Ху Ші. Вони представляють потужний федералістський блок на півночі. Тепер, коли наші зв'язки відновлені в межах конституційного комітету, ми інтегруємо цей аналітичний центр в уряд, хоча вони і вимагають негайної реформи клептократичних інституцій."

###- Маньчжурський шлях -###

 QIE_fractured_empire_manchu: "Роздроблена імперія"
 QIE_fractured_empire_manchu_desc: "Велика Цін теоретично контролює весь Китай, крім Маньчжурії, Тибету та Монголії. Насправді влада імператора ледь сягає за межі басейну Жовтої річки. Хоча тиранічну чжилійську кліку усунуто, в країні панує безлад. Потрібні виважені кроки, аби подолати розколи навіть на тих територіях, що ми утримуємо."

 QIE_qu_yingguang_backer_idea: "Цюй Їнґуан — відновлення доброчесності"
 QIE_qu_yingguang_backer_idea_desc: "Цінський бюрократ, який робить ставку на баланс між традиціоналізмом та модернізацією. Його вплив додасть нашому уряду політичної ваги та легітимності."

 QIE_yan_xishan_backer_idea: "Янь Сішань — модернізація та реформа"
 QIE_yan_xishan_backer_idea_desc: "Мало хто сподівався, що республіканський мілітарист Янь Сішань підтримає нову державу Цін. Проте «зразковий губернатор» вирішив приєднатися до конституційної системи, аби просувати агресивні індустріальні реформи. Найімовірніше, він намагатиметься залишити імператора суто церемоніальною постаттю."

 QIE_zhang_tianran_backer_idea: "Чжан Тяньжань — верховенство Іґуаньдао"
 QIE_zhang_tianran_backer_idea_desc: "Лідер езотеричного культу Іґуаньдао став «духовним радником» уряду. Поки він підтримує модернізацію, багато хто в коаліції побоюється, що його справжні цілі набагато амбітніші за нинішній вплив. Тим не менш, він забезпечує нам підтримку мільйонів своїх послідовників."

 QIE_prepare_for_storm_idea: "Підготовка до бурі"
 QIE_prepare_for_storm_idea_desc: "§RЦей дух буде видалено, коли ми вступимо у війну з Японією.§!"

 QIE_YCP_militarized_state: "Мілітаризована держава"
 QIE_YCP_militarized_state_desc: "Під керівництвом ПМК держава Цін пройшла через стрімку мілітаризацію. Кумівство чжилійців замінено новою структурою західного зразка: молодіжними тренувальними лігами та модернізованою системою призову."

 QIE_nationalized_yan_xishan_thought: "Націоналізація думок Янь Сішаня"
 QIE_nationalized_yan_xishan_thought_desc: "Губернатор Янь Сішань почав поширювати свою політичну філософію по всій країні. Його «Товариство очищення серця» тепер має клуби в кожному куточку імперії, роздаючи памфлети, написані особисто губернатором."

 QIE_Yan_party_state_idea: "Партія-держава Янь Сішаня"
 QIE_Yan_party_state_idea_desc: "Наш благодійник Янь Сішань взяв на себе відповідальність за захист інтересів усього Китаю. Його колись дивна філософія стала основою нашого режиму. Після років співпраці між Янем та лідерами ПМК виник справжній синтез, здатний змінити все."

 QIE_cult_of_progress_idea: "Бюро прогресу"
 QIE_cult_of_progress_idea_desc: "Втомившись від повільних демократичних дебатів, ПМК створила «Бюро прогресу» для негайних політичних дій. Час покаже, чи зможуть вони закріпити свою владу, чи будуть змушені знову домовлятися з анахронічною партією Цзунше та наївним ТРАК."

 QIE_banner_idea: "Сучасна система стягів"
 QIE_banner_idea_desc: "Намагаючись модернізувати армію, партія Цзунше повернула систему стягів старих імператорів Цін. Це історична алегорія, накладена на сучасну організаційну структуру, що додає армії легітимності в очах народу."

 QIE_legitimate_emperor_idea: "Захист імператора"
 QIE_legitimate_emperor_idea_desc: "Чжан Тяньжань успішно підніс постать імператора над дріб'язковою політичною боротьбою. Тепер народ бачить у ньому непохитний оплот китайської ідентичності."

 QIE_rooting_out_corruption: "Викорінення корупції"
 QIE_rooting_out_corruption_desc: "Корупція була ендемічною для Китаю протягом століть. Тепер ми призначаємо вірних людей, які докладуть усіх зусиль для її знищення."

 QIE_rural_reform_idea: "Рух сільських реформ"
 QIE_rural_reform_idea_desc: "Лідери ТРАК перетворили свою благодійну організацію на державний орган, спрямований на посилення цивільної влади в китайських селах."

 QIE_rural_insurgency_idea: "Сільська лояльність"
 QIE_rural_insurgency_idea_desc: "Завдяки успіху реформ мільйони селян перейшли на наш бік, готові померти за імператора."

 QIE_fall_of_zongshe_idea: "Занепад аристократії"
 QIE_fall_of_zongshe_idea_desc: "Через власну некомпетентність та нерозсудливість знать опинилася позбавленою реальної влади. Не дивно, що Велика Цін так низько впала за останнє століття."

 QIE_imperial_propaganda_idea: "Божественна пропаганда"
 QIE_rural_defense_idea: "Сили сільської оборони"
 QIE_Legacy_Kang_Youwei: "Спадщина Кан Ювея"
