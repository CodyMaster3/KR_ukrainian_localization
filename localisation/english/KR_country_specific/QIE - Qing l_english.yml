 QIE_country_intro_background: "GFX_QIE_intro"
 QIE_country_intro_header: "§cВелика Цін§!"
 QIE_country_intro_content: "Міжнародне посередництво в завершенні останньої чжилійсько-фентянської війни у 1928 році поклало край майже чотирирічному періоду хаосу та нестабільності. Це започаткувало найтриваліший період хиткого миру в деяких частинах Китаю з часів §lСіньхайської революції§! 1911 року. Хоча §cУ Пейфу§!, §aЦао Кунь§! та їхня §zпівнічна чжилійська кліка§! погодилися на повернення §cдинастії Цін§!, подальші §mнімецькі концесії§! були відхилені, що призвело до охолодження відносин. §mНімеччина§! продовжує підтримувати §cуряд Цін§!, але переважно з метою забезпечення постійної конкуренції з також підтримуваними ними §mпівденними чжилійцями§! в межах стратегії «розділяй і володарюй», а також у надії на поступове створення китайського бастіону проти §jЯпонії§!.\n\nХоча привид §jяпонського§! панування витає над значною частиною північного та східного Китаю, країна все ж набагато більш роздроблена, ніж хотілося б §cПекіну§!. Влада §cЦін§! оспорюється з усіх боків: від зухвалого §eфентянського уряду§! на північному сході до різноманітних формальних союзників по всій іншій території Китаю — номінальних частин імперії, які отримали майже повну автономію через географію та регіоналістські настрої. У результаті §cЦін§! входить у 1936 рік, будучи обмеженою переважно Північнокитайською рівниною на чолі хиткого національного порядку."

 QIE_country_intro_header_1: "Політична ситуація"
 QIE_country_intro_content_1: "У 1936 році безпорадна асамблея перебуває на межі краху. У цьому органі домінує безліч груп, і хоча вони не мають реальної влади в залі засідань, із силами, що стоять за ними, слід рахуватися. Найпотужнішою з них є §aТовариство гармонії§!, номінально очолюване §aпрезидентом Цао Кунем§!. Завжди присутній і підступний державний діяч, він та його фракція §aЦзіньбао§! чжилійської кліки співпрацюють із фракцією §cЛоян§! §cУ Пейфу§!. Обидва чоловіки заснували товариство як легітимізуючий рух для забезпечення представництва §Pчжилійців§! в асамблеї. Хоча номінально це незалежна політична партія, депутати §aТовариства гармонії§! — це колишні §Pчжилійські офіцери§!, цивільні службовці або їхні ставленики. Після переобрання §aЦао Куня§! мало хто вірить, що ця група є чимось більшим, ніж прикриттям для контролю §Pчжилійців§! над країною.\n\n§mЛіга процвітання§! займає схожу позицію, і хоча вона претендує на статус політичної партії, мало хто бачить у ній щось більше, ніж групу лобіювання §mнімецьких§! інтересів у Пекіні.\n\nЦе залишає три основні партії в опозиції: §cпартію Цзунше§!, що складається з принців §cЦін§! та колишніх королівських поплічників; §nпартію «Молодий Китай»§! — кліку молодих ультранаціоналістів та ідеологів, що орієнтуються на модель партії-держави §RГоміньдану§!; та §SТовариство реформ Китайської імперії§! (ТРАК) — коаліцію двох реформаторських груп, які, хоча й номінально лояльні до імператора, виступають за структурну реорганізацію Китаю з поверненням до традиційної моделі сільської громади та край владі мілітаристських клік.\n\nДо них приєднуються інтелектуали §Sтовариства «Зусилля»§! під керівництвом §SХу Ші§!, які обстоюють ідеї прагматичного лібералізму. Також існують §Sфорум «Демократія та наука»§!, §mкліка політичних наук§! та інші §Lнезалежні§! депутати.\n\nХоча ці групи перебувають в опозиції до §aЦао Куня§! та §aкабінету міністрів§!, він делікатно збалансував їхнє обрання, щоб створити противагу власному товариству гармонії. Противагу, яка насправді безсила, але вони про це не знають."

 QIE_country_intro_header_2: "Реструктуризація нашого боргу"
 QIE_country_intro_content_2: "Останні кілька років §cУ§! та §aЦао§! витратили більшу частину свого політичного капіталу, намагаючись реструктурувати та скоротити величезний борг §cВеликої Цін§!. Хоча теоретично це можливо, план зіткнувся з численними викликами, головним з яких є відсутність підтримки з боку провінційних губернаторів, які не сплачували належні податки з моменту усунення §PДуань Ціжуя§! у 1920 році. Чутки про нестабільність на півдні через клептократичну манію §PСунь Чуаньфана§! ще більше ускладнили ці плани. Очікується, що президент §aЦао Кунь§! виступить в асамблеї з промовою про скорочення державного боргу після святкування Нового року наприкінці цього місяця."

 QIE_guide: "§MМонархія чжилійців§! — §Mпроаньцінський шлях§! / §Mпронанкінський шлях§! ($authoritarian_democrat_coloured$)\n£white_dot Щоб піти проаньцінським шляхом, прийміть запит Чень Тяоюаня про допомогу, коли спалахне війна ліги; це спрямує вас на антиконцесіоністський шлях.\n£white_dot Щоб піти пронанкінським шляхом, відхиліть запит Чень Тяоюаня про допомогу і незабаром прийняти пропозицію Ці Сєюаня; це спрямує вас на пронімецький шлях.\n\n§MМаньчжурська Цін§! — §Mпартія Цзунше§! / §MПМК§! / §MТРАК§! ($paternal_autocrat_coloured$ / $authoritarian_democrat_coloured$ / $social_conservative_coloured$)\n£white_dot Примітка: якщо Цюй Їнґуан або Чжан Тяньжань не при владі в Шаньдуні, ви не зможете обрати їх як спонсорів перевороту. Якщо ви хочете обрати одного з них, обов'язково встановіть ігрове правило Шаньдуна «Остання гра Чжана» на «Цюй при владі» або «Захоплення Іґуаньдао».\n£white_dot Не приймайте запити про допомогу ні від Чень Тяоюаня, ні від Ці Сєюаня під час війни ліги.\n£white_dot Якщо обираєте Цюй Їнґуана спонсором перевороту, надішліть дивізію на допомогу Шаньдуну проти заворушень, коли надійде запит.\n£white_dot У події «Таємна зустріч» оберіть спонсора перевороту на свій розсуд — якщо обираєте Янь Сішаня, зіграйте на його амбіціях.\n£white_dot У події «Зловісні рухи військ» оберіть варіант не розслідувати справу.\n£white_dot Коли гвардія увірветься до зали, зробіть так, аби переворот вдався.\n\n§MМаньчжурська Цін§! — §Mзаконні вибори§! ($social_conservative_coloured$ / $social_democrat_coloured$)\n£white_dot Встановіть ігрове правило Шаньдуна на «Цюй при владі».\n£white_dot Не допомагайте жодній стороні у війні ліги.\n£white_dot Надішліть дивізію на допомогу Шаньдуну.\n£white_dot У події «Таємна зустріч» оберіть спонсором Цюй Їнґуана.\n£white_dot Не розслідуйте рухи військ і дайте перевороту здійснитися.\n£white_dot У події «Надзвичайний уряд» віддайте перевагу ТРАК.\n£white_dot Виконайте фокус «Підготувати державних службовців» та завершіть усі 3 рішення про виборчу реформу до серпня 1940 року.\n£white_dot У події «Картографування електорату» дозвольте асамблеї розібратися з цим.\n£white_dot У події «Потреби виборчої інфраструктури» дайте народу доступ до важелів влади.\n£white_dot Виконайте фокус «Забезпечена лояльність села» перед завершенням рішення «Розширення повноважень місцевих асамблей». У події про асамблеї оберіть проведення виборів у регіональних урядах.\n£white_dot Успішне завершення реформ Цюй Їнґуана збереже демократію та дозволить обрати §Sсоціал-демократів§! у 1944 році.\n\n§MРеспубліка чжилійців§! — §MХу Ші§! / §MВ. К. Веллінгтон Ку§! ($authoritarian_democrat_coloured$)\n£white_dot Початок такий самий, як у маньчжурському перевороті, але:\n£white_dot Або не надсилайте дивізію Цюй Їнґуану, а потім оберіть його спонсором,\n£white_dot Або оберіть Янь Сішаня і зіграйте на його страху перед нестабільністю,\n£white_dot Або оберіть розслідування у події «Зловісні рухи військ»,\n£white_dot Або зробіть так, аби переворот провалився, коли гвардія увірветься до зали."

