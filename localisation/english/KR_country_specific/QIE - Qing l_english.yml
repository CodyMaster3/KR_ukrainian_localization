 QIE_totalist_party: "КСП-Радикали"
 QIE_totalist_party_long: "Китайська синдикалістська партія — радикальна фракція (Чжунго Ґунтуаньдан-цзіцзінь пай)\n§LХоча вони здебільшого обмежені своїми оплотами на китайському узбережжі, як-от Гуанчжоу та Шанхай, значна присутність Китайської синдикалістської партії та їхніх союзників по Лізі китайських синдикалістів спостерігається і на півночі — зокрема в Тяньцзіні.\n\nРадикальне крило осередків КСП на півночі очолює Чжан Ґотао. Разом із побратимами-соціалістами вони зосередилися не лише на радикалізації профспілок у північних містах, а й на підбурюванні селян у сільській місцевості, особливо в горах Дабє, де вони знайшли надійний притулок від політичних утисків чжилійської кліки та їхніх маньчжурських союзників.§!\n"
 QIE_radical_socialist_party: "Гоміньдан"
 QIE_radical_socialist_party_long: "Гоміньдан (Чжунго Ґоміньдан)\n§LКитайська націоналістична партія, хоча формально є широкою революційною платформою, з моменту реорганізації 1924 року перебуває під контролем свого лівого крила. Хоча спочатку революція базувалася в Національному уряді Сунь Ятсена в Гуанчжоу, вона поширилася по всьому Китаю, створюючи таємні осередки у ворожих провінціях мілітаристів.\n\nПісля поразки сил Гоміньдану в Північному поході північні філії партії потрапили під вплив домінуючої Асоціації реорганізованих товаришів (АРТ), яка проповідувала жорстку реорганізацію партії за соціалістичною та централізованою лінією. Очолювані Лю Каньюанем, осередки АРТ на півночі планують повернення Гоміньдану та справжнє визволення Пекіна від влади мілітаристів.§!\n"
 QIE_syndicalist_party: "КСП-Ортодокси"
 QIE_syndicalist_party_long: "Китайська синдикалістська партія — ортодоксальна фракція (Чжунго Ґунтуаньдан-чжентун пай)\n§LКитайська синдикалістська партія, заснована в 1922 році, має потужну присутність у Лізі китайських синдикалістів. Виконавчий комітет північної гілки очолює Лі Дачжао, один із засновників партії.\n\nПопри те, що він переховується у прихильних до нього посольствах Союзу Британії та Комуни Франції, Лі Дачжао фактично є політичним в'язнем. Як прихильник ортодоксальної фракції, Лі постійно наголошує на необхідності співпраці не лише з іншими фракціями ЛКС, а й з Гоміньданом заради створення єдиного фронту для підготовки пролетарської революції.§!\n"
 QIE_social_democrat_party: "ТРАК"
 QIE_social_democrat_party_long: "Товариство реформ Китайської імперії (Бао цзю да цін хуанді хуей)\n§LХоча ТРАК використовує назву реформістської групи часів до Сіньхайської революції, насправді це альянс двох сучасних груп. Перша — це Рух сільської реконструкції під керівництвом Лян Шуміна та випускника Гарварду і Прінстона Дж. К. «Джиммі» Єня. Вони виступають за перебудову Китаю «знизу вгору», де традиційне китайське село є базовим елементом суспільства.\n\nДруга частина коаліції — вільна група інтелектуалів, натхненних працями Кан Ювея, амбітного реформатора пізньої династії Цін, який виступав за конституційну монархію. Після реставрації Пуї його ідеї знову стали популярними. ТРАК прагне покласти край владі мілітаристів та іноземному впливу, повернувшись до традиційного децентралізованого правління.§!\n"
 QIE_social_liberal_party: "Товариство «Зусилля»"
 QIE_social_liberal_party_long: "Товариство «Зусилля» (Нулі ше)\n§LТовариство виникло навколо інтелектуалів, які співпрацювали з газетою «Зусилля». Їхній вихід у політику почався з маніфесту «Наша політична заява» 1923 року, підписаного такими діячами, як Ху Ші, Цай Юаньпей та Лі Дачжао. Вони пропонували створити «уряд добрих людей», аби очистити країну від корупції колишніх бейянських урядів.\n\nЇхня концепція передбачала конституційне, відкрите та прозоре правління, зосереджене на довгостроковому плануванні. Під «добрими людьми» малася на увазі освічена еліта Китаю. Досягнувши піку під час експерименту з «кабінетом добрих людей» у співпраці з У Пейфу, Ху Ші продовжує розвивати свою групу як інтелектуальний центр Пекіна.§!\n"
 QIE_market_liberal_party: "Ліга процвітання"
 QIE_market_liberal_party_long: "Ліга процвітання (Фаньжун ляньмен)\n§LЛіга процвітання — це переважно партія нового класу промисловців та банкірів, які з підозрою ставляться до корупції Товариства гармонії. Німеччина, яка також остерігається амбіцій У Пейфу, зосередилася на перетворенні неформальних клубів еліти на організовану політичну силу. Через Східнокитайський директорат (AOG) німці організовують «виставки прогресу», просуваючи ідеї вільної торгівлі та новітніх технологій.\n\nЛіга процвітання діє як лобістська група, що вимагає послаблення державного регулювання та стимулів для промисловості — формально в інтересах еліти, але насправді для Пекінської комісії. Цю партію також підтримують навчені німцями офіцери молодого флоту Цін, чиє суперництво з підконтрольною чжилійцям армією свідомо роздмухується Німеччиною.§!\n"
 QIE_social_conservative_party: "Партія Цзунше"
 QIE_social_conservative_party_long: "Монархічна партія (Цзунше дан)\n§LТовариство «Мінґуан», як їх стали називати, є одним із найбільш езотеричних продуктів німецького втручання в Китай. Формально залишаючись у лавах монархістів Цзунше, «Мінґуан» прагне справжньої імперської реставрації, беручи за взірець німецьких радикальних правих і відкидаючи прогресизм як загрозу виживанню двору Цін.\n\nСпираючись на підтримку принца Ґуна та теорію «Вандао» (Королівського шляху) Чжен Сяосюя, вони прагнуть повернути велич Східної Азії, де цивілізація поширюється від Янцзи до «варварських земель». Вони виступають за відновлення традиційних цінностей перед лицем стрімкої вестернізації. Хоча вони ще не є головним голосом імперських фракцій, їх підтримують розчаровані монархісти, незадоволені фарсовим характером реставрації Сюаньтуна, де влада досі належить республіканцям та «нефритовому маршалу».§!\n"
 QIE_authoritarian_democrat_party: "Товариство гармонії"
 QIE_authoritarian_democrat_party_long: "Товариство гармонії (Хесє шетуань)\n§LЦе радше парламентська група, ніж конкретна політична партія. Товариство гармонії — це широке об'єднання бюрократів, шляхти, інтелектуалів та кількох відставних командирів чжилійської кліки. Тісно пов'язане з Пекіном, воно слугує цивільним фасадом, створеним Цао Кунем, аби надати владі мілітаристів вигляду цивільного правління.\n\nВважаючись фіктивною групою, що лише штампує рішення автократів, Товариство гармонії керує нацією з моменту закріплення влади чжилійців у Третій чжилійсько-фентянській війні. Перемагаючи на послідовних виборах, воно забезпечує стабільність старого ладу, доки чжилійці утримують силу.§!\n"
 QIE_paternal_autocrat_party: "Чжилійська кліка"
 QIE_paternal_autocrat_party_long: "Північна чжилійська кліка (Бейцзін чжісі)\n§LКліка виникла навколо постаті Фен Ґочжана, який виступав за об'єднання країни шляхом переговорів з Півднем. Після його смерті в 1919 році кліка розділилася між трьома амбітними мілітаристами — Цао Кунем, У Пейфу та Ван Чженбінем. Перемігши фентянську та аньхойську кліки, чжилійці стали домінуючою силою в 1922 році.\n\nПісля тимчасового падіння через зраду Фен Юйсяна у 1924 році, кліка повернула силу в Центральних рівнинах. Сформувавши альянс Аньґоцзюнь із Чжан Цзуолінем та Сунь Чуаньфаном, вони відбили Північний похід Гоміньдану, витіснили фентянців із Пекіна та за підтримки іноземної допомоги здійснили реставрацію Сюаньтуна в 1928 році.\n\nКліка розділена на північну та південну (Сунь Чуаньфана), а всередині — на фракції Цао Куня та У Пейфу. Проте їх єднає одне: прагнення зберегти бейянський лад, з імператорською родиною або без неї.§!\n"
 QIE_national_populist_party: "Партія молодий Китай"
 QIE_national_populist_party_long: "Партія молодий Китай (Чжунго цінняньдан)\n§LПоходить зі студентського «Товариства молодого Китаю», яке розкололося на націоналістичну, соціалістичну та ідеалістичну фракції. Цзен Ці та Лі Хуан, навчаючись у Франції, вели запеклі суперечки з іншими студентами, як-от Чжоу Еньлай та Цай Юаньпей.\n\nЧерез стрімке зростання підтримки синдикалістів, Цзен та Лі заснували власну партію у 1923 році під Парижем. Розвиваючись серед студентських організацій, ПМК виступила проти співпраці Гоміньдану з КСП. У 1924 році вони повернулися до Шанхая, заснувавши низку товариств та газет.\n\nЗблизившись із силами Сунь Чуаньфана, партія перемістилася на північ для участі в Пекінській асамблеї. Вони виступають за повне знищення влади мілітаристів, встановлення сильного центрального уряду та скасування спеціальних привілеїв і екстериторіальності іноземних держав у Китаї.§!\n"

###- Manchu Coup Parties -###
 QIE_yiguandao_coup_party: "Китайське товариство моралі та благодійності"
 QIE_yiguandao_coup_party_long: "$QIE_yiguandao_coup_party_long_tt$\n§LВважається більш «професійним» фасадом релігійного руху Іґуаньдао для легітимізації в очах центрального уряду. Витоки культу сягають Шаньдуна XIX століття. Заснований Ван Цзюеї, рух офіційно отримав назву «Іґуаньдао» (Шлях єдності) у 1905 році.\n\nУ 1925 році лідером став загадковий Чжан Тяньжань. Скориставшись кризою конфуціанства, Іґуаньдао розквітло на тлі зневіри народу, поширюючи віру у вічну шановну матір, тао та суміш буддійської, спасительської та конфуціанської філософій.§!\n"
 QIE_yiguandao_coup_party_long_tt: "Китайське товариство моралі та благодійності (Чжунхуа даоде цишань хуей)"

 QIE_social_conservative_coup_party: "ТРАК"
 QIE_social_conservative_coup_party_long: "$QIE_sociaL_conservative_coup_party_tt$\n§LХоча ТРАК використовує назву реформістської групи часів до Сіньхайської революції, насправді це альянс двох сучасних груп. Перша — це Рух сільської реконструкції під керівництвом Лян Шуміна та випускника Гарварду і Прінстона Дж. К. «Джиммі» Єня. Вони виступають за перебудову Китаю «знизу вгору», де село є базовим елементом суспільства, а не кліки мілітаристів, що панували в Китаї останні пів століття.\n\nДруга частина коаліції — інтелектуали, натхненні працями Кан Ювея, який виступав за конституційну монархію. ТРАК прагне покласти край владі мілітаристів та іноземному впливу. З повним возз'єднанням імперії перед ТРАК постає каскад нових проблем, що вимагають повної реорганізації Великої Цін знизу вгору. Це забере роки, але з належним наглядом навіть найбідніше село одного дня матиме голос у Китаї!§!\n"
 QIE_sociaL_conservative_coup_party_tt: "Товариство реформ Китайської імперії (Бао цзю да цін хуанді хуей)"

 QIE_social_liberal_coup_party: "Форум демократії та науки"
 QIE_social_liberal_coup_party_long: "$QIE_social_liberal_coup_party_tt$\n§LВиник із різних прогресивних академічних груп Пекіна та Шанхая, представляючи викладачів та студентів, розчарованих авторитарним правлінням чжилійців. Вони прагнуть побудувати вільний та стабільний Китай, що несе в собі демократичний та науковий дух «руху 4 листопада».\n\nГолова форуму Чжан Сімань очолив зусилля з об'єднання еклетичних груп наукових марксистів, бейянських технократів, реформаторів освіти та радикальних феміністок у єдину політичну партію. На відміну від партії «Молодий Китай», форум більше орієнтований на академіків, які займаються політикою, а не на професійних політиків-вчених.§!\n"
 QIE_social_liberal_coup_party_tt: "Форум демократії та науки (Міньчжу кесюе цзотань хуей)"

 QIE_social_democrat_coup_party: "ТРАК"
 QIE_social_democrat_coup_party_long: "$QIE_social_conservative_coup_party_long$"
 QIE_social_democrat_coup_party_tt: "Товариство реформ Китайської імперії (Бао цзю да цін хуанді хуей)"

 QIE_authoritarian_democrat_coup_party: "Партія молодий Китай"
 QIE_authoritarian_democrat_coup_party_long: "$QIE_authoritarian_democrat_coup_party_tt$\n§LПоходить зі студентського «Товариства молодого Китаю». Заснована у 1923 році під Парижем Цзен Ці та Лі Хуаном. Вони виступали проти співпраці Гоміньдану з синдикалістами. ПМК повернулася до Шанхая у 1924 році, заснувавши низку товариств.\n\nПісля зближення з силами Сунь Чуаньфана партія перемістилася на північ для участі в Пекінській асамблеї. Вони виступають за ліквідацію влади мілітаристів, встановлення сильного центрального уряду та націоналістичний порядок денний, що фокусується на скасуванні спеціальних привілеїв і екстериторіальності іноземних держав у Китаї.§!\n"
 QIE_authoritarian_democrat_coup_party_tt: "Партія молодий Китай (Чжунго цінняньдан)"

 QIE_ycp_moved_party: "Партія молодий Китай"
 QIE_ycp_moved_party_long: "$QIE_authoritarian_democrat_coup_party_long$"
 QIE_ycp_moved_party_tt: "Партія молодий Китай (Чжунго цінняньдан)"

 QIE_paternal_autocrat_coup_party: "Партія Цзунше"
 QIE_paternal_autocrat_coup_party_long: "$QIE_paternal_autocrat_coup_party_tt$\n§LПартія Цзунше — більш відома як «Монархічна партія» — це група маньчжурських дворян, лоялістів Цін та принців династії Айсін Ґьоро. Опозиційні до чжилійської кліки У Пейфу, вони виступають за повернення повнокровного цінського контролю над усім Китаєм. На відміну від радикалів, вони готові терпіти мілітаристів за умови їхньої повної відданості імператору. Тепер, коли владу закріплено, асамблея стає лише дорадчим органом, яким вона і мала бути, а всі рішення приймаються при імператорському дворі.§!\n"
 QIE_paternal_autocrat_coup_party_tt: "Монархічна партія (Цзунше дан)"

##- Prosperity League Dissolves -###
 QIE_Old_PSC_party: "КНП"
 QIE_Old_PSC_party_long: "$QIE_Old_PSC_party_long_tt$\n§LПоходить від першої ітерації, заснованої у 1913 році членами Тунменхуея, які відкинули вимогу доктора Суня про особисту присягу на вірність після провалу Другої революції проти Юань Шикая. Кліка політичних наук — дивна група серед бейянських парламентарів. Вони створили Товариство вивчення європейських справ у Токіо, яке у 1916 році перетворилося на Товариство політичних наук. Відкидаючи необхідність Північного походу для об'єднання Китаю, вони натомість працювали з південними мілітаристами, аби повалити уряд захисту конституції Сунь Ятсена.\n\nОбравши участь у бейянській виборчій системі та мирні переговори з північними воєначальниками, вони обіймали високі посади в сенаті, асамблеї та кабінеті міністрів. Коли Сунь Ятсен за допомогою Чень Цзюнміна витіснив їхніх союзників із Гуандуна, Стара кліка політичних наук фактично розпалася, повністю підпорядкувавшись бейянському політичному порядку. Спираючись на середній клас, банкірів та інтелектуальну еліту, вони домоглися відродження підтримки після розпаду Ліги процвітання.§!\n"
 QIE_Old_PSC_party_long_tt: "Стара кліка політичних наук (Цзю чженсюе сі)"

 QIE_all_chinese_national_salvation_congress_party: "ФНП"
 QIE_all_chinese_national_salvation_congress_party_long: "$QIE_all_chinese_national_salvation_congress_party_long_tt$\n§LФедерація національного порятунку, номінально очолювана Шень Цзюньжу, — це група лівоналаштованих шанхайських інтелектуалів, що виникла на хвилі антиімперіалістичних заворушень після Шанхайської конференції 1928 року. Невдовзі після заснування вони приєдналися до коаліції Товариства реформ Китайської імперії (ТРАК), аби створити об'єднаний опозиційний блок проти Товариства гармонії через неприязнь до байдужості чжилійців щодо іноземних концесій.\n\nПісля провалу Маньчжурського перевороту та охолодження відносин чжилійців із Німеччиною їхні пріоритети змінилися. З розпуском ТРАК вони виділилися в окрему силу, увібравши більшість лівих в асамблеї. Хоча ФНП віддані боротьбі з корупцією, вони готові миритися з авторитарним урядом, доки той бореться з мілітаризмом. Це означає готовність до співпраці з центральним урядом у певних питаннях, доки той чинить опір імперіалістам, проводить поступову лібералізацію та знищує воєначальників-кліків у Китаї.§!\n"
 QIE_all_chinese_national_salvation_congress_party_long_tt: "Федерація національного порятунку (Цюаньґо ґецзє цзюґо ляньхехуей)"

 QIE_chinese_constitutionalist_party: "ЧКП"
 QIE_chinese_constitutionalist_party_long: "$QIE_chinese_constitutionalist_party_long_tt$\n§LКитайська конституційна партія, очолювана Сюй Цінем, одним із «десяти учнів» Кан Ювея, є однією з найстаріших політичних організацій Китаю. Вона веде свій родовід від конституційних зусиль Кана та Лян Цічао в імперському законодавчому органі Цін. Сучасна ітерація партії вважає себе наступницею як оригінальних монархістів-конституціоналістів, так і їхніх пізніших втілень: Прогресивної партії, Дослідницької кліки та всіх інших політичних ініціатив «ляністів». Об'єднані прагненням до конституціоналізму та функціонуючої китайської демократії, вони виявилися надзвичайно стійкими в китайській політиці.\n\nСформована з ядра антиреволюційних, але прореформаторських політиків, партія опинилася на узбіччі за часів бейянського уряду. Після смерті Ляна Сюй Цінь перебрав роль лідера. Вони прагнуть побудувати моралістичну, конфуціанську, антимілітаристську китайську демократію, яка дотримується конституції як святого письма. Партія залишається послідовною силою проти воєначальників та ідеї «партії-держави».\n\nСама партія розділена на крило «старої гвардії» на чолі з Сюй Цінем та «молоду гвардію» прогресивних реформаторів під проводом Сюй Сяньцзи. Сподіваючись на створення справжньої конституційної Китайської республіки, вони агітують за посилення плюралізму в асамблеї.§!\n"
 QIE_chinese_constitutionalist_party_long_tt: "Китайська конституційна партія (Чжунго сяньчжендан)"

