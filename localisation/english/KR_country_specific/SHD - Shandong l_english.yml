 #馬良
 SHD_ma_liang: "Ма Лян"
 SHD_ma_liang_high_command_desc: "§YНародився:§! §L1878 рік, повіт Цінюань, провінція Чжилі, Велика Цін§!\n§YІсторична довідка:§! §LХуейцзу за походженням, уродженець Хебея, Ма Лян є надзвичайно досвідченою людиною, що побачила світ. Закінчивши Бейянську військову академію, Лян служив командиром батальйону Нової бейянської армії, а згодом, у 1911 році, став командиром п'ятого полку Бейянської армії. Цікаво, що він вивчав боротьбу під керівництвом відомого майстра Пін Цзіньї і, своєю чергою, вимагав, щоб більшість його підлеглих також займалися цим спортом.\n\nУ 1912 році він поступив на службу до Цзінь Юньпена, після чого був переведений на посаду командира 47-ї змішаної бригади в Шаньдуні. У 1916 році його підвищили до командувача залоги Цзінаня, і він став командиром 2-ї дивізії китайської армії, призначеної для участі у Світовій війні. Згодом дивізію реорганізували у Північно-західну армію оборони кордону, хоча вона все ще дислокувалася в Шаньдуні.\n\nМобілізований для участі у чжилійсько-аньхойській війні, Ма Лян був звільнений з посади після поразки Аньхоя. Після виходу у відставку Ма оселився в Цзінані та написав працю «Нові китайські бойові мистецтва». Стривожений стрімким зростанням злочинності, наркоторгівлею та загальним падінням моралі в Шаньдуні, Ма Лян залишив відставку і встановив контакт із Цюй Їнґуаном через свою участь в Асоціації боротьби з наркотиками. Згодом він став одним із засновників «Альянсу доброзичливості» та «Товариства відновлення доброзичливості», ставши правою рукою Цюя у справах боротьби з наркотиками.§!"

 #李景林
 SHD_li_jinglin: "Лі Цзіньлінь"
 SHD_li_jinglin_army_chief_desc: "§YНародився:§! §L1885 рік, Цзаоцян, провінція Чжилі, Велика Цін§!\n§YІсторична довідка:§! §LВперше з’явившись на публічній арені як випускник Баодінської військової школи у 1907 році, Лі Цзіньлінь був одним із сотень молодих офіцерів, затягнутих у вир мілітаристської активності. Першою важливою нагородою Лі стала участь у придушенні Учанського повстання 1911 року. Зв'язок із аньхойським генералом Цюй Тунфеном спрямував Лі в бік клікової політики республіканських років. Як і Цюй Тунфен, вигнаний з Аньхойської кліки за корупцію, Лі опинився без діла і в 1924 році приєднався до Фентянської кліки. Генераліссимус Чжан Цзолінь того ж року перепризначив Лі до Чжан Цзунчана, який воював у Чжилі. Спочатку Лі був вражений здібностями Чжан Цзунчана, попри його погані манери, але це враження зіпсувалося до 1928 року, коли «генерал-м'ясник» закріпився в Шаньдуні. Лі, попри свою корупційну історію, не міг належним чином утримувати свою дивізію на чесно зібрані в Шаньдуні податки. Натхненний проголошенням Сюе Дяня «малим імператором» Ігуаньдао в Шаньдуні, Лі вирішив представити себе як духовно просвітленого. Він публічно почав тренуватися у володінні мечем у стилі Удань і назвав себе «магічним мечем», щоб створити навколо себе ореол таємничості. Зрештою це привернуло увагу Чжан Тяньраня, який зробив Лі кілька пропозицій щодо тренування ополчення «Великих мечів» на Тайшані.§!"

 #張懷芝
 SHD_zhang_huaizhi: "Чжан Хуайчжи"
 SHD_zhang_huaizhi_high_command_desc: "§YНародився:§! §L1862 рік, Дунье, провінція Шаньдун, Велика Цін§!\n§YІсторична довідка:§! §LНародившись у злиднях в епоху приниження, Чжан Хуайчжи починав життя як селянин. Родина Чжан, вбачаючи майбутнє у західному бізнесі на півночі, перевезла Хуайчжи до Тяньцзіня в юному віці. Як учень Тяньцзіньської школи військового спорядження, Чжан Хуайчжи приєднався до Боксерського повстання зі своїм полком і був відзначений за обстріл посольського кварталу. Почуття провини за поразку від західних держав привело зганьбленого Чжана до армії Юань Шикая, чия амбітна мета стати імператором здавалася Чжану більш природною еволюцією, ніж республіканізм. Після смерті Юаня Чжан приєднався до Аньхойської кліки і в 1918 році недовго служив адміністратором у Шаньдуні під керівництвом Чжан Шуяня. Чжан знову підвів свого лідера після поразки його полку в Хунані. Це знову залишило Чжан Хуайчжи без грошей, і єдиними людьми, які його прийняли, стала секта Ігуаньдао. Посилаючись на його вік, досвід та службу проти західного імперіалізму, Чжан Тяньран призначив Чжан Хуайчжи командиром «Червоних списів» Шаньдуна.§!"

 #徐源泉
 SHD_xu_yuanquan: "Сюй Юаньцюань"
 SHD_xu_yuanquan_high_command_desc: "§YНародився:§! §L1886 рік, Хуанчжоу, провінція Хубей, Велика Цін§!\n§YІсторична довідка:§! §LСюй розпочав свою військову кар’єру в Хубейській академії військового спорядження, де досяг успіхів у навчанні. До 1910-х років він закінчив Нанкінську 4-ту армійську школу, де став політично активним. У 1912 році Сюй співпрацював з тимчасовим урядом Нанкіна, згуртовуючи студентів на підтримку революції проти Цін. Сюй використав цю політичну позицію, щоб очолити кавалерійський полк Ґуанфу в 1913 році, ненадовго побувавши і в Сіньцзяні. Сюй був відправлений з батальйоном 6-ї змішаної бригади в Шаньдун, щоб Гоміньдан міг закріпити контроль над провінцією. Сюй не зміг утримати провінцію після прибуття Чжан Цзунчана у 1926 році. Він вирішив зрадити Гоміньдан і здати свою бригаду Чжану, залишаючись при цьому для нього ненадійною фігурою. Сюй зіграв ключову роль у тому, щоб Чжан відчув невпевненість, що зрештою змусило його залишитися в Шаньдуні під час наступу 1928 року. У цей час у Сюя розвинулася залежність від опіуму, і він став співучасником наркоторгівлі в Шаньдуні, що призвело до падіння дисципліни в його лавах.§!"

 #小日向白朗
 SHD_hakuro_kohinata: "Кохіната Хакуро"
 SHD_hakuro_kohinata_high_command_desc: "§YНародився:§! §L1900 рік, Сандзьо, Ніїґата, Японська імперія§!\n§YІсторична довідка:§! §LЗ юних років Кохіната цікавився повідомленнями про далекий Тибет, Китай та Німеччину, які публікував Фукусіма Ясумаса. Цей інтерес привів його до кар’єри спочатку в лавах японської Квантунської армії, де він служив полковником під керівництвом Бандзая Ріхатіро в Маньчжурії. Кохіната дезертирував з Квантунської армії у 1920 році, щоб відвідати таємничу Урґу в Монголії, але під час подорожі був захоплений бандитами. Бандитам сподобався Кохіната, і вони дозволили йому приєднатися до їхньої ватаги конокрадів. Ці крадії навчили Кохінату даосизму, бойовим мистецтвам і подарували йому пістолет Browning із зображенням дракона, який він назвав «Маленьким білим драконом» — це згодом стало популярним прізвиськом самого Кохінати. Коли династія Цін була реставрована, Кохіната почав використовувати псевдонім Шао, приховуючи своє японське походження. Він був схоплений Чжан Цзолінем і спочатку засуджений до смерті, але був помилуваний за умови служби у Чжан Цзунчана у 1928 році. Кохіната приєднався до кліки Чжана і відіграв важливу роль у підтримці мобільних кавалерійських корпусів армії для протидії більш сучасним інноваціям в інших арміях.§!"

 #伊達順之助
 SHD_junnosuke_date: "Дате Дзюнносуке"
 SHD_junnosuke_date_high_command_desc: "§YНародився:§! §L1892 рік, Токіо, Японська імперія§!\n§YІсторична довідка:§! §LДате — наймолодший представник поважного та давнього клану Дате. Справжній клан Дате походив від самураїв провінції Муцу і включав високопоставлених міністрів. Родинні зв'язки врятували йому життя, коли в 1909 році він убив іншого студента з ворожого угруповання. Дате врятував від страти Іваї Сабуро, перший детектив Японії. Перебуваючи у в’язниці, Дате приєднався до релігійного руху Оомото-кьо, який був популярним серед молодих офіцерів того часу. Дате звільнився з в'язниці в 1916 році і вирушив до Маньчжурії. План замаху на Чжан Цзоліня, організований принцом Ямаґатою Арітомо, пішов не так, що змусило Дате присягнути на вірність Чжану. Дате приєднався до армії «генерала-м'ясника» у 1929 році, спочатку для навчання найманців японській кавалерійській тактиці. Будучи тверезомислячим членом кліки Чжана, Дате приносить прапор своєї родини на війну за Китай.§!"

 #孫殿英
 SHD_sun_dianying: "Сунь Дяньїн"
 SHD_sun_dianying_army_chief_desc: "§YНародився:§! §L1888 рік, Юнчен, провінція Хенань, Велика Цін§!\n§YІсторична довідка:§! §LСунь Дяньїн виріс у злиднях, вірячи, що він є нащадком генерал-майора династії Мін Сунь Ченцзуна, і змагаючись із законним нащадком Сунь Юе. З юних років Сунь конфліктував із вчителями, а коли покинув школу, то підпалив її. Потім Сунь став залежним від азартних ігор та опіуму і ще дитиною приєднався до яньшанського бандита Чжан Піна. Сунь також приєднався до «Товариства храмового шляху», народної релігійної групи, і зрештою обійняв там керівну посаду. Він переконав товариство приєднатися до «Сил примирення гори Сун», загону боротьби з бандитизмом, що складався з колишніх бандитів. Після поразки та самогубства Хань Юйкуня у 1925 році Сунь дезертирував із вірними солдатами. Ці солдати увійшли в Бочжоу (Аньхой) і присягнули на вірність Гоміньдану для прикриття. Коли Північний похід провалився у 1927 році, Сунь повів своїх людей до Нінся. Там солдати проявили надзвичайну жорстокість, грабуючи села та надаючи своєму бандитизму релігійного значення. Кліка Ма завдала удару у відповідь, і бандити Суня відступили до Шаньдуна у 1928 році. Сунь Дяньїн був помилуваний Чжан Цзолінем у рамках угоди про приєднання до кліки Чжана.§!"

 #張敬堯
 SHD_zhang_jingyao: "Чжан Цзіняо"
 SHD_zhang_jingyao_high_command_desc: "§YНародився:§! §L1881 рік, Хоцю, провінція Аньхой, Велика Цін§!\n§YІсторична довідка:§! §LЧжан проявляв злочинні схильності з юних років, будучи звинуваченим у вбивстві в Аньхої у віці 15 років. Чжан втік з Аньхоя до Пекіна і потрапив у сферу впливу Юань Шикая. Він тренувався в Баодінському армійському залі в 1911 році і був призначений до 22-го полку 11-ї армії під командуванням Юань Шикая. Чжан подав апеляцію і був переведений до морської дивізії для боротьби з Гоміньданом у 1913 році. Під час цієї кампанії він окупував Лучжоу (Сичуань) у 1915 році. Чжан зрадив Юань Шикая і приєднався до Аньхойської кліки у 1917 році. У 1918 році він отримав посаду губернатора Хунані, але його жорстоке правління як «хунаньського м'ясника» швидко призвело до руху за його вигнання, і 11 червня 1920 року він був усунутий. Потім Цзіняо вирішив займатися махінаціями між Аньхойською клікою, а пізніше Чжан Цзунчаном після піднесення Ліги восьми провінцій. Чжан став командувачем 2-ї армії «генерала-м'ясника» у 1926 році та змінив ім’я на Чан Шіґу, щоб приховати ордер на свій арешт за вбивство. Чжан Цзіняо відомий тим, що вірить у будь-яку теорію змови, яку йому розповідають, і є частиною принаймні половини з них.§!"

 #曲同豐
 SHD_qu_tongfeng: "Цюй Тунфен"
 SHD_qu_tongfeng_army_chief_desc: "§YНародився:§! §L1873 рік, Яньтай, провінція Шаньдун, Велика Цін§!\n§YІсторична довідка:§! §LУ віці 16 років Тунфен приєднався до Бейянського флоту і служив інженером на броненосці «Дінюань», який був дивом сучасності в Північному Китаї. Ставши на бік Юань Шикая, Цюй вступив до Тяньцзіньської військово-морської школи та продовжив освіту у Військовій академії армії Японської імперії, яку закінчив у 1904 році. Цюй повернувся до Китаю і служив інструктором у Вуянській академії військових наук у 1910 році. Спочатку співпрацюючи з республіканцями під час Учанського повстання 1911 року, Цюй змінював різні посади в Республіці, зрештою ненадовго повернувшись до Юаня перед тим, як очолити Шаньдунське управління військових справ у 1916 році. У 1917 році Цюй уклав угоду з Лі Юаньхуном про продаж Японії прав на видобуток алюмінію в Шаньдуні та дозвіл на відвантаження через Яньтай. Аньхойська кліка у 1920 році, ворогуючи з Лі Юаньхуном, скасувала це право і зажадала приїзду Цюя до Нанкіна для суду. Замість того, щоб постати перед судом, Цюй симулював хворобу і відкладав свою поїздку, поки Аньхойська кліка не втратила до нього інтерес у 1925 році. Лист від Сунь Ятсена із закликом до Цюя виступити проти У Пейфу спонукав його до дій. Цей загін вирішив битися проти Чжан Цзунчана після його прибуття до Шаньдуна у 1926 році, був розгромлений, а Цюй пішов у підпілля. Відсутність центральної влади та думка про те, що Сунь Ятсен наказав йому битися, але він зазнав невдачі, сильно гнітили Цюя. Потім він був запрошений до Фентяня Чжан Цзолінем, який запропонував Цюю повернутися в стрій, якщо він приєднається до Бейянського флоту. Цюй, не довіряючи японській присутності в Маньчжурії, відмовився і пішов. Його знову закликали, коли нинішній лідер Шаньдуна попросив його повернутися, мотивуючи це обіцянкою Сунь Чуаньфану битися.§!"

 #靳雲鶚
 SHD_jin_yune: "Цзінь Юнье"
 SHD_jin_yune_high_command_desc: "§YНародився:§! §L1887 рік, провінція Шаньдун, Велика Цін§!\n§YІсторична довідка:§! §LНародившись у бідній селянській родині, Цзінь Юнье є молодшим братом відомого сановника Аньхойської кліки Цзінь Юньпена. Однак, на відміну від старшого Цзіня, Юнье провів більшу частину свого дитинства, працюючи в полі.\n\nУ пошуках кращого життя Цзінь Юнье приєднався до Нової армії Юань Шикая у 1898 році як солдат, а пізніше був підвищений до молодшого офіцера. Його військова кар'єра продовжилася, коли його обрали для навчання в Баодінській прискореній штабній академії, де він став штабним офіцером, що відкрило шлях для його подальшого підвищення. У 1918 році за рекомендацією Цао Куня Цзінь став командиром бригади і таким чином увійшов до Чжилійської кліки. Однак, оскільки У Пейфу підозріло ставився до стосунків Цзіня з його старшим братом, Цзінь Юнье не міг просуватися по службі. Просування Цзінь Юнье було помітно повільнішим, ніж у майже всіх його колег у Чжилійській кліці, попри його внесок у чжилійсько-фентянські війни; це посіяло зерно невдоволення в його серці, яке зросло ще більше, коли Цзінь, якого лише в 1923 році підвищили до командира дивізії (на три роки пізніше інших), був відправлений до Шаньдуна.\n\nТому, коли Чжан Цзунчан закріпився у своїй рідній провінції, Цзінь Юнье не чинив опору, а опосередковано працював із ним, попри те, що він вважався членом Чжилі. Як відносно незалежний командир, байдужий до політики, Цзінь Юнье готовий працювати з ким завгодно, аби зберегти свій статус.§!"

 #褚玉璞
 SHD_chu_yupu: "Чу Юйпу"
 SHD_chu_yupu_commander_desc: "§YНародився:§! §L1887 рік, повіт Веньшан, провінція Шаньдун, Велика Цін§!\n§YІсторична довідка:§! §LПоходячи з родини землевласників, чиї статки сильно занепали з часів покоління його батька, нікого не дивує, що Чу Юйпу, який двічі не зміг вступити до Баодінської військової академії, став одним із найвідоміших бандитів у своїй рідній провінції.\n\nРозчарований невдалим початком військової кар’єри, Чу вирішив стати лулінем (поєднання тріад та бандитів) і заробляв на життя грабунками разом із групою головорізів. Кажуть, що свій початковий бандитський загін він отримав від лідера бандитів, якого врятували під час одного з нальотів Чу на цінську в'язницю. Пізніше, у 1913 році, Чу та його бандити були включені до складу військ Чжан Цзунчана, і надалі вони добре співпрацювали. Чу Юйпу, несподівано розпочавши військову кар’єру, стабільно просувався в лавах Чжана, слідуючи за ним до союзу з Фентянською клікою та беручи участь у незліченних війнах разом із Чжанами. Зрештою Чу був підвищений до командира корпусу та головного квартирмейстера за свої заслуги після того, як Чжан Цзунчан зміцнив владу в Шаньдуні.\n\nТепер, як один із сановників кліки Чжана, Чу є довіреним підлеглим і другом «генерал-м'ясник», і він цілком готовий підтримувати генерала, використовуючи свої «іррегулярні» сили та досвід ведення нетрадиційної війни.§!"

 #陸錦
 SHD_lu_jin: "Лу Цзінь"
 SHD_lu_jin_high_command_desc: "§YНародився:§! §L1879 рік, Тяньцзінь, провінція Чжилі, Велика Цін§!\n§YІсторична довідка:§! §LВступивши до Бейянської військової академії у віці 20 років, Лу Цзінь був одним із багатьох китайських студентів, відправлених вивчати японські військові методи; зрештою він закінчив Військову академію армії Японської імперії та повернувся до Китаю в 1903 році, щоб викладати у Військовій топографічній школі Бейянської академії. Він почав співпрацювати з Чжилійською та Аньхойською кліками Бейянської армії, покладаючись на політичне покровительство для отримання кількох високих посад у провінціях Чжилі та Шаньдун, де він, своєю чергою, розбудовував місцеві зв'язки. Проте Цзінь ніде не залишався надовго, щоб глибоко пустити коріння, і завжди метався між різними військовими кліками. У 1917 році він став палким прихильником спроби маньчжурської реставрації Чжан Сюня і був обсипаний похвалами та архаїчними військовими титулами від решти учасників перевороту. Коли реставрація провалилася, Цзіню все ж вдалося зберегти свою військову кар'єру, але він ще глибше потрапив у тенета фракційних інтриг Чжилійської кліки та став більш залежним від впливу Цао Куня та У Пейфу. Зрештою йому довелося втекти з країни після Пекінського перевороту Фен Юйсяна 1924 року, знайшовши тимчасовий притулок у Японії, перш ніж перегрупуватися з членами Аньхойської кліки. На той час, коли Чжилі повернули владу, Цзінь був відіграною політичною фігурою. Попри його чжилійські та монархічні заслуги, його спроби подати петицію Чжилійській кліці, а також новому відновленому імператору Сюаньтуну про повернення його на посаду в армії зазнали невдачі. Не зумівши просунутися політично серед колишніх членів Аньхойської кліки у Фентяні, Цзінь дрейфував між Пекіном, Тяньцзінем та Шаньдунем, зрештою встановивши контакт із Цюй Їнґуаном.\n\nЦі дві людини зблизилися на грунті спільних монархічних переконань, ненависті до закоренілої корупції в пекінському уряді та спільного походження з провінції Чжецзян. Попри те, що Лу Цзінь народився в Тяньцзіні, його родина походила з Чжецзяна, і це принесло йому повагу Цюй Їнґуана. Зрештою він був завербований як член Шаньдунської асоціації боротьби з наркотиками та «Альянсу доброзичливості» як зручний привід, що дозволяв йому легально допомагати в організації військового крила політичного руху Цюя подалі від пильних очей Чжилійської кліки.§!"

 #吳化文
 SHD_wu_huawen: "У Хуавень"
 SHD_wu_huawen_commander_desc: "§YНародився:§! §L1904 рік, Лайчжоу, провінція Шаньдун, Велика Цін§!\n§YІсторична довідка:§! §LУ Хуавень народився в селянській християнській родині в Шаньдуні, але у віці 7 років супроводжував свого батька до Менчена в провінції Аньхой. Ходять різні історії про те, яке саме життя вів молодий Хуавень. Іноді він вихвалявся походженням із багатої селянської родини та закінченням приватної місіонерської школи, а також стверджував, що ледь виживав як голодний фермерський хлопець. В одній із цих історій він приєднався до армії як амбітний студент-націоналіст, а в іншій — пішов на службу після того, як повінь зруйнувала його дім. Хай там як, підліток Хуавень спочатку служив кухарем та виконував інші дрібні завдання, перш ніж його визнали грамотним і призначили зв'язковим. Після цього його відправили служити в залогу Цзінаня під командуванням тодішнього чжилійського генерала Фен Юйсяна. Хуавень зблизився зі своїм командиром на грунті спільних релігійних переконань, і Фен полюбив хлопця, підтвердивши повноваження Хуавеня та відправивши його до Пекіна для здобуття належної військової освіти у 1923 році. Він дрейфував між різними школами і зрештою закінчив Бейянську військову академію в 1927 році — того ж року, коли його наставник Фен Юйсян був вигнаний із Пекіна Чжилійською клікою. Хуавень швидко відрікся від Фена і вислужився перед Чжилі, отримавши посаду викладача в Хенані, а згодом, у 1930 році, був призначений командиром тієї самої залоги Цзінаня, в якій колись служив. Саме тут він знайшов спільну мову з губернатором Чжан Цзунчаном і потрапив до його сумнозвісної «кліки Чжана». Хуавень швидко просунувся вгору корумпованою ієрархією «генерала-м'ясника» і зрештою розірвав зв'язки з Чжилійською клікою. Відомо, що він викроїв для себе частину території в Цзінані та встановив контакти з іншими політичними силами в провінції на випадок зміни обставин. Його звичка часто переходити на бік різних генералів і розповідати суперечливі історії про своє минуле принесла йому репутацію людини, якій не можна довіряти. Він носить два сумнозвісних прізвиська: перше — «байстрюк трьох батьків» (як і Люй Бу, він служив трьом різним панам), а друге — «генерал-стрибун».§!"

 #李麗久
 SHD_li_lijiu: "Лі Ліцзю"
 SHD_li_lijiu_high_command_desc: "§YНародився:§! §L1897 рік, Нінцзінь, провінція Чжилі, Велика Цін§!\n§YІсторична довідка:§! §LЗмалечку Лі Ліцзю був хворобливим і залежним від інших. За його пізнішими розповідями, практик Ігуаньдао вилікував його за допомогою методів традиційної медицини. Це зцілення привело дорослого Лі в лави вірян. Приблизно в той самий час він почав вивчати бойові мистецтва. У 1925 році він служив тренером із бойових мистецтв у Хенаньській армії. Відтоді він співпрацював з різними мілітаристами. У 1935 році Лі приїхав до Нанкіна і оселився в домі свого вчителя Ду Сіньу. Невдовзі він зацікавився сектою Ігуаньдао. Перша ж велика пожертва на користь Шаньдуна ввела Лі Ліцзю до внутрішнього кола Чжан Тяньраня. Лі віддячив за це, присвятивши себе «Товариствам червоних списів» у Шаньдуні, обіцяючи звільнити Нанкін, а згодом і свого друга Чжоу Фохая, від «соціалістичних володарів» із Гоміньдану.§!"

 #盧永祥
 SHD_lu_yongxiang: "Лу Юнсян"
 SHD_lu_yongxiang_high_command_desc: "§YНародився:§! §L1867 рік, Цзінань, провінція Шаньдун, Велика Цін§!\n§YІсторична довідка:§! §LЛу Юнсян розпочав військову кар’єру як випускник Тяньцзіньської військової академії Убянь наприкінці XIX століття. Спочатку був солдатом під керівництвом цінського державного діяча Лі Хунчжана, потім інструктором у батальйоні армії Увей у Шаньдуні. Протягом першого десятиліття XX століття він просувався по службі в Шаньдуні, зрештою очоливши 20-ту дивізію Нової армії Цін у боротьбі проти Синьхайської революції. Досвід і лояльність принесли йому титул «барона» в Бейянській армії Юань Шикая у 1912 році. Після смерті Юаня Лу приєднався до Аньхойської кліки. Він очолив невдалу атаку на Лігу під керівництвом Сунь Чуаньфана під час їхньої боротьби з аньхойцями і після поразки поспіхом втік до Японії. Не бажаючи покидати батьківщину, Лу Юнсян попросив генераліссимуса Чжан Цзоліня знайти спосіб безпечно повернути його до Шаньдуна. Повернення відбулося під прапором генерала Чжан Цзунчана, який зробив Лу важливим інструментом пропаганди у боротьбі проти Північного походу. Лу повернувся до Цзінаня лише для того, щоб побачити своє рідне місто потопленим у пороках; старий Лу швидко став опіумним залежним, намагаючись бодай так відновити зв’язок із домом.§!"

 #林建章
 SHD_lin_jianzhang: "Лінь Цзяньчжан"
 SHD_lin_jianzhang_navy_chief_desc: "§YНародився:§! §L1874 рік, Фучжоу, провінція Фуцзянь, Велика Цін§!\n§YІсторична довідка:§! §LЛінь Цзяньчжан розпочав свою військово-морську кар’єру з пристрасті до нових технологій та рішучості в їхньому впровадженні. Уродженець Фуцзяня, Лінь вступив до Імператорського флоту Китаю та закінчив нещодавно засновану Військово-морську академію Цзяньнань. Свою сміливість він продемонстрував під час Синьхайської революції, очоливши рятувальну місію вгору річкою Янцзи проти республіканців. Тимчасовий уряд Нанкіна нагородив його за цей вчинок підвищенням до адмірала та передачею під командування флагманського броненосця «Нань Шунь». Це просування втягнуло Ліня в китайську політику і призвело до його переходу в лави Чжилійської кліки. Після реставрації Цін Лінь оголосив свій флот незалежним і відплив до Шаньхая. Цей вчинок ледь не коштував йому життя: екіпаж скинув його з посади та залишив у Яньтаї. Принижений, але професійний, Лінь став ідеальною кандидатурою для Фентянської кліки Чжан Цзоліня, яка платила йому зарплату, поки він займався відбудовою флоту в Яньтаї.§!"

 #趙洪文國
 SHD_zhao_hong_wenguo: "Чжао Хун Веньґо"
 SHD_zhao_hong_wenguo_commander_desc: "§YНародилася:§! §L1881 рік, Сюянь, округ Шенцзін, Велика Цін§!\n§YІсторична довідка:§! §LХун Веньґо народилася в бідній родині і у віці 14 років пережила події Першої японсько-китайської війни. У 1898 році вона вийшла заміж за Чжао Юйхуана, взявши його прізвище, і народила 5 синів та 3 доньки. Один із її синів, Чжао Дун, став професором Дунбейського університету. Завдяки наполегливій праці мадам Чжао здобула повагу в рідному селі та покращила фінансове становище родини. Коли Чжан Цзолінь у 1930 році оголосив її сім'ю зрадниками та бандитами, Чжао взяла до рук зброю для самозахисту. Вона евакуювала мешканців свого містечка перед приходом жандармерії Чжана; подейкують, що вона відстрілювалася від солдатів Цзоліня з двох прихованих пістолетів, за що отримала прізвисько «Бабуся з двома стволами».§!"

 #薛顛
 SHD_xue_dian: "Сюе Дянь"
 SHD_xue_dian_high_command_desc: "§YНародився:§! §L1887 рік, Шулу, провінція Чжилі, Велика Цін§!\n§YІсторична довідка:§! §LРанні роки Сюе Дяня визначила довга і стабільна кар’єра з вивчення бойового мистецтва Сін'ї-цюань у Тяньцзіні. Він навчався у майстрів Лі Цуньї, Лі Тайхе та Сюе Чженьґана. Коли Сюе програв виклик Фу Цзяньцю, він був змушений покинути місто згідно з тогочасними правилами змагань майстрів. Це вигнання у 1925 році привело його до Шаньдуна, де випадкова зустріч із Чжан Тяньранем змінила його життя. Чжан Тяньран давав Сюе настанови щодо способу життя та молитви, що дозволило тому повернутися до Тяньцзіня і перемогти Фу Цзяньцю. На знак вдячності Сюе Дянь передав свою академію бойових мистецтв у Тяньцзіні під опіку Ігуаньдао і приєднався до благодійної організації секти. У 1926 році Сюе Дянь брав участь у таємній зустрічі лідерів «Червоних списів» та Чжан Тяньраня і був проголошений «малим імператором Шаньдуна» під егідою Ігуаньдао, аби очолити військову та духовну підготовку ополчення.§!"

 SHD_boris_annenkov: "Борис Анненков"
 SHD_boris_annenkov_commander_desc: "§YНародився:§! §L9 лютого 1889 року, Київська губернія, Російська імперія§!\n§YІсторична довідка:§! §LБорис Володимирович Анненков походив із спадкового російського дворянства і здобув військову освіту в Олександрівському військовому училищі. Він служив у Сибірському козацькому війську і вже під час Великої війни зажив слави командира кривавих рейдів тилами німців. Маючи схильність до непокори, він відмовився скласти зброю після Жовтневого перевороту і став лідером білого повстанського руху в Центральному Сибіру. У 1918 році Анненков був обраний похідним отаманом Сибірського козацького війська і отримав під командування 2-й Степовий корпус.\n\nАнненков повів свої сили в Семиріччя, де після кривавої кампанії став генерал-губернатором. Його дворічне правління в Семиріччі позначилося масовими вбивствами цілих сіл за найменшої підозри в симпатіях до більшовиків. Його загони, «анненковці», чинили погроми та грабунки, поки до 1921 року в його послугах не відпала потреба. Колчак позбавив його чинів, але дозволив виїхати до Монголії з невеликим ядром своїх людей.\n\nБеручи участь у різних дрібних сутичках у Західному Китаї, його люди зрештою дісталися Шанхая. Генерал Чжан Цзунчан, який на той час був фактичним правителем міста, найняв Бориса Анненкова як офіцера для командування своїми загонами російських найманців.§!"

 #劉珍年
 SHD_liu_zhennian: "Лю Чженнянь"
 SHD_liu_zhennian_high_command_desc: "§YНародився:§! §L1898 рік, повіт Наньґун, провінція Чжилі, Велика Цін§!\n§YІсторична довідка:§! §LРозпочавши військову кар’єру в Баодінській офіцерській школі з відмінними оцінками, Лю Чженнянь зустрів там Лі Цзіньліня і був зарахований курсантом до мінометної секції. Невдовзі його відправили до Північно-східної військової академії вивчати артилерійську справу. Під час другої війни Чжилі та Фентяня у 1924 році Лю майстерно командував шістьма мінометами, знищивши чжилійські позиції і дозволивши піхоті прорватися. За бойові заслуги його підвищили до командира батальйону.\n\nПісля одужання від ран він приєднався до Чу Юйпу як командир 16-ї бригади, а пізніше служив у «зразковому полку». Перебуваючи під командуванням Чжан Цзіняо, Лю Чженнянь пройшов через кровопролитні бої Північного походу. Критикуючи дії Чжан Цзіняо, Лю отримав під командування залишки його 2-ї дивізії і за допомогою жорстких заходів та суворої підготовки перетворив її на грізну силу. Переживши Північний похід, Лю налаштував проти себе багатьох у кліці Чжан Цзунчана, тому приєднався до Цюй Їнґуана. Він продовжує виявляти невпинні амбіції, просуваючись службовими сходами з кожною перемогою.§!\n\n§YПримітки: Через те, що куля знесла йому частину черепа, Лю часто називає свій шрам «солдатською квіткою», що неабияк дратує кожного, хто це чує.§!"

 SHD_robert_short: "Роберт Шорт"
 SHD_robert_short_air_chief_desc: "§YНародився:§! §L4 жовтня 1904 року, Стейлакум, штат Вашингтон, Сполучені Штати Америки§!"

 SHD_vincent_schmidt: "Вінсент Шмідт"
 SHD_vincent_schmidt_air_chief_desc: "§YНародився:§! §L2 липня 1898 року, Маккіспорт, штат Пенсильванія, Сполучені Штати Америки§!"

 SHD_antonio_riva: "Антоніо Ріва"
 SHD_antonio_riva_high_command_desc: "§YНародився:§! §L8 квітня 1896 року, Шанхай, Шанхайський міжнародний сеттльмент§!"

 ### Scientists ###
 SHD_wang_ganchang: "Ван Ганьчан" #王淦昌

### Traits ###
 SHD_dogmeat_general: "Генерал-м'ясник"
 SHD_dogmeat_general_desc: "Отримавши прізвисько, що цілком відповідає його лихій славі, Чжан Цзунчан викликає огиду навіть серед колег-мілітаристів через повне ігнорування будь-яких пристойностей та моралі. Проте саме ці риси принесли йому грізну репутацію, яка приваблює певну категорію послідовників. Чжан відкрито зізнається, що має «три невідомих»: невідому кількість дружин, невідомі статки і, що найважливіше, невідому кількість солдатів. У поєднанні з його поведінкою це робить Чжана непередбачуваним, а його справжні цілі та потенціал — важкими для визначення."

 SHD_honored_master: "Шанований учитель"
 SHD_honored_master_desc: "Навернувши у свою віру сумнозвісного Чжан Цзунчана на вершині гори Тайшань, Чжан Тяньран приковує до себе увагу всього світу, відволікаючи її від корумпованого Цзінаня. Публічно доброзичливий, але потайний, Чжан Тяньран посилює свій вплив, що вже давно поширився за межі його монастирських фортець."

 SHD_qu_bodisattva: "Бодгісаттва Цюй"

### Ideas ###
 SHD_flight_north: "Втеча на північ"
 SHD_flight_north_desc: "Тисячі людей тікають до Шаньдуна, рятуючись від розбрату на півдні. Підштовхувані мілітаристськими поборами та приваблені обіцянками спасіння від Ігуаньдао, вони знаходять у розслабленому правлінні Чжана принаймні тимчасовий притулок. Той, хто правитиме далі, вирішить долю цих біженців."

 SHD_Rampant_drug_trade: "Нестримна наркоторгівля"
 SHD_Rampant_drug_trade_desc: "Слабкість Чжан Цзунчана до опіуму поширилася на все населення Шаньдуна, на великий жаль народу. Зі зростанням цін на наркотики посилюється насильство та вимагання. Секта Ігуаньдао та організація «Жень ци» намагаються боротися з торгівлею наркотиками."

 SHD_Yiguandao_revolt: "Повстання Ігуаньдао"
 SHD_Yiguandao_revolt_desc: "Протоколи, надані секту Ігуаньдао на випадок провалу священної місії шанованого вчителя Чжан Тяньраня, були задіяні іншими «малими імператорами» та керівниками другого рівня. Нині Ігуаньдао закликає послідовників спалювати своє майно та переселятися до печерних святилищ у межах підготовки до марення про «Маха-кальпу» — апокаліпсис. У такому несамовитому стані ми не можемо ні призивати людей, ні збирати податки."

 SHD_Peasant_revolt: "Селянське повстання"
 SHD_Peasant_revolt_desc: "Обурення справами в Цзінані та на Тайшані дестабілізувало провінцію. Збирачі податків вимагають негайних виплат, міста встановлюють платні дороги, а приховування зброї від уряду сягнуло історичного максимуму. Ми маємо відправити війська в села, якщо хочемо, щоб народ Шаньдуна знову нам довіряв."

 SHD_Zongchang_revolt: "Повстання кліки Чжана"
 SHD_Zongchang_revolt_desc: "Яким би підлим не був «генерал-м'ясник», його оточення з лояльних адміністраторів, боржників та солдатів сприймалося в Шаньдуні як законний уряд. Тепер його люди безцільно намагаються вибити борги із зарплати з кожного зустрічного. Цих бандитів потрібно знищити разом із дияволами, які їх очолюють."

 SHD_flee_to_zongchang: "Втеча до Чжан Цзунчана"
 SHD_flee_to_zongchang_desc: "Остання перешкода для торгівлі із західними державами в Шаньдуні — Чжан Тяньран — усунута. Іммігранти, що прибувають до провінції, тепер мають можливість торгувати з іноземцями та насолоджуватися сучасним комфортом без загрози моральної розправи, якої раніше багато хто боявся. Атмосфера Цзінаня поступово наближається до шику сучасних китайських міст, як-от Шанхай."

 SHD_flee_to_safety: "Втеча до Цюй Їнґуана"
 SHD_flee_to_safety_desc: "Після років бандитизму, замаскованого під державне управління, та обману з боку релігійних маніпуляторів, Шаньдун нарешті вільний. Народ провінції радітиме і процвітатиме, коли наркотики нарешті спалять у великому багатті."

 SHD_Loyal_citizens: "Лояльні громадяни"
 SHD_Loyal_citizens_desc: "Нарешті наслідки заворушень позаду, і народ Шаньдуна радіє з оновленим завзяттям змінити весь Китай. Як наслідок, збирачі податків змогли запропонувати податкові пільги та відшкодування вірним громадянам."

 SHD_controlled_drug_trade: "Контрольована наркоторгівля"
 SHD_controlled_drug_trade_desc: "Неконтрольовані опіумні плантації нарешті підпорядковані уряду Чжана. Нелегальна торгівля з Ціндао та Вейхайвеєм нарешті формалізована та оподаткована клікою Чжана. Неформальна легальність вживання наркотиків тепер остаточно закріплена."

 SHD_violently_suppressed_drug_trade: "Жорстке придушення наркоторгівлі"
 SHD_violently_suppressed_drug_trade_desc: "Чжан Тяньран наказав Організації моралі та благодійності жорстко виявляти підозрюваних наркозалежних та піддавати їх суду. За допомогою «Товариства великих мечів» торгівлю наркотиками було припинено силою: опіумні плантації спалено, а корумпованих бюрократів жорстоко усунуто."

 SHD_big_swords: "Великі мечі"
 SHD_big_swords_desc: "«Великі мечі» Північного Китаю нарешті повністю підтримали Ігуаньдао і сповнені рішучості битися на нашому боці. Їхні лідери вірять у духовну природу боротьби за Китай проти іноземних дияволів."

 SHD_big_swords_and_red_spears: "Великі мечі та Червоні списи"
 SHD_big_swords_and_red_spears_desc: "«Великі мечі» Північного Китаю та «Червоні списи» Центрального Шаньдуна повністю підтримали Ігуаньдао і готові битися на нашому боці. Їхні лідери вірять, що ведуть священну війну за Китай проти іноземних загарбників."

 SHD_Guiyidao_support: "Підтримка Гуїдао"
 SHD_Guiyidao_support_desc: "Наслідування Організації моралі та благодійності Чжан Тяньраня нарешті перевершило своє джерело натхнення — рух Гуїдао. В інтересах китайського народу Чжан Тяньран перебрав контроль над об'єктами Товариства Червоної Свастики в Шаньдуні та пообіцяв захистити храми Гуїдао від повсюдного бандитизму."

 SHD_intervention_idea: "Обмежена інтервенція"
 SHD_intervention_idea_desc: "На наполегливе прохання біженців із Ліги, Цюй Їнґуан дозволив обмежену участь у хаосі в долині Жовтої річки та за її межами. Ці відважні експедиційні сили складаються з добровольців, які турбуються про безпеку своїх родин на півдні."

 SHD_railroad_assisted_army: "Армія з підтримкою залізниці"
 SHD_railroad_assisted_army_desc: "Завдяки значно покращеному залізничному ланцюгу постачання тепер можливо забезпечувати шаньдунські війська набагато ефективніше, ніж раніше."

 SHD_jiangsu_exploitation: "Експлуатація Цзянсу"
 SHD_jiangsu_exploitation_desc: "Згідно з нашою угодою з Аньціном, укладеною за посередництва Фентяня після завершення війни з Лігою, ми отримуємо §H[?SHD_jiangsu_exploitation_civ_factories]§! цивільних фабрик та §H[?SHD_jiangsu_exploitation_mil_factories]§! військових заводів. Ми також маємо повний контроль над потенційними ресурсами штату Цзянсу та додаткові людські ресурси в Цзінані."

 SHD_building_ships_faster: "Фокус на суднобудуванні"
 SHD_building_ships_faster_desc: "Зосередивши наші ресурси, ми зможемо швидко побудувати власний флот."

 SHD_expand_our_control: "Розширення нашого контролю"
 SHD_expand_our_control_desc: "Після завершення руйнівної війни з Лігою Шаньдун постає як справжній чемпіон східних провінцій. Було б плідно швидко інтегрувати колишні провінції Ліги, перш ніж ми перейдемо до об'єднання решти Китаю!"

 SHD_fengtian_troop_training: "Вишкіл військ Фентянем"
 SHD_fengtian_troop_training_desc: "Велика військова місія, що складається з багатьох фентянських інструкторів, а також деяких японських, допомагає нам тренувати війська якомога швидше для боротьби проти Ліги."

 FNG_SHD_Traing_Aid: "Допомога Шаньдуну у навчанні"
 FNG_SHD_Traing_Aid_desc: "Ми відправили велику навчальну місію до Шаньдуна, щоб допомогти їм із підготовкою військ у конфлікті з Лігою. Якщо вони переможуть, ми отримаємо потужного союзника на материковій частині Китаю."

 SHD_mineral_rights_leases_idea: "Оренда прав на видобуток копалин"

