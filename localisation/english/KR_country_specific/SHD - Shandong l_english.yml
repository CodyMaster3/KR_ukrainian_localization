 #屈映光
 SHD_qu_yingguang: "Цюй Їнґуан"
 SHD_qu_yingguang_leader_desc: "§YНародився:§! §L14 березня 1883 року, Ліньхай, провінція Чжецзян, Велика Цін§!\n§YІсторична довідка:§! §LЦюй Їнґуан надихнувся прикладом Цю Цзінь і став революціонером, проте пізніше приєднався до клік Бейянської армії. У 1919 році Цюй був призначений губернатором Шаньдуна, який став для нього другою домівкою. Він зарекомендував себе як здібний лідер: покращив управління Жовтою річкою та доклав зусиль для захисту релігійної та культурної спадщини провінції, зокрема через зміцнення зв'язків із герцогом Яньшенем. Роками пізніше він увійшов до Бейянського уряду та зблизився з Дуань Ціжуєм. Обидва були послідовниками буддизму — віри, яку Цюй перейняв від родини по материнській лінії. Він присвятив багато часу роботі з релігійними товариствами та благодійними організаціями, отримавши буддійське ім'я «Фасянь» та прізвисько «бодгісаттва Цюй». Незадовго до повалення Дуаня у 1926 році він переїхав до Шанхая, незадоволений авторитаризмом та корупцією в Пекіні.\n\nШанхайське повстання 1932 року знищило його благодійну організацію «Альянс доброзичливості», оскільки виникли побоювання щодо проникнення туди синдикалістських агентів. Як і багато його колег, він утік із міста, вирішивши повернутися до Шаньдуна, проте там став свідком жаху, який «найниціший мілітарист» Китаю, Чжан Цзунчан, приніс із собою через опіум та розпусту. Завдяки зв'язкам із членами Асоціації боротьби з наркотиками в Шаньдуні, а також друзям на кшталт герцога Яньшеня та союзникам у Пекіні, його «Альянс доброзичливості» був відроджений у Цюйфу під назвою «Товариство відновлення доброзичливості». Хоча Цюй рідко публічно виступає проти губернатора Чжана, він розпочав таємні переговори з Чжилі та імператорським двором, шукаючи спосіб вирвати корупцію в Шаньдуні з корінням. Цюй вірить, що Китай має перемогти корупцію та гріх, чого найкраще може досягти релігійно-політичний лад, підтримуваний імператором. Він обережно ставиться до маньчжурських принців, але підтримує імператора Пуї, з яким одного разу мав аудієнцію. Його надзвичайно цікавлять буддійські симпатії Пуї, оскільки він повірив, що імператор є найкращим кандидатом для встановлення гармонійного, дхармічного політичного ладу в Китаї.§!"

 #張宗昌
 SHD_zhang_zongchang: "Чжан Цзунчан"
 SHD_zhang_zongchang_leader_desc: "§YНародився:§! §L13 лютого 1881 року, повіт Їсянь, провінція Шаньдун, Велика Цін§!\n§YІсторична довідка:§! §LЧжан Цзунчан не відчував особливої національної гордості за Ціндао, коли той був втрачений на користь Німеччини у 1897 році, проте революція 1911 року спонукала його до дій. Прибувши до Шанхая, аби присягнути на вірність Республіці, він зійшовся з Фен Гочжаном і приєднався до Чжилійської кліки після її появи у 1917 році. Але коли Фен помер у 1919 році, Чжан повернувся до Маньчжурії та приєднався до Фентянської кліки саме вчасно, щоб узяти участь у Першій чжилійсько-фентянській війні 1922 року. Поразка Фентяня не зупинила його, і він відіграв помітну роль у другій війні 1924 року, захопивши стратегічний перевал Ленкоуґуань. Після майже повного краху північної Чжилійської кліки внаслідок Пекінського перевороту Чжан завоював Шаньдун і просунувся на південь аж до Нанкіна та Шанхая. Вміння ефективно використовувати залізниці, а також неабияка харизма людини, яку навіть союзники називали «брудною», вели його від перемоги до перемоги. Після періоду розгульного правління в найбільш міжнародному місті Китаю Чжан грунтовно закріпився в Шаньдуні, проте через постійні війни за Цзянсу врешті опинився заблокованим у провінції під час Четвертої чжилійсько-фентянської війни 1928 року. У наступні роки Шаньдун став для нього і притулком, і в'язницею, де його незаконна, але терпима присутність зберігається під тінню уряду Цін у Пекіні. Нещодавно напад, здавалося б, невиліковної хвороби змусив його піднятися 6600 сходинками до лікаря секти Ігуаньдао. Там Чжан зустрівся з шанованим учителем Ігуаньдао — самим Чжан Тяньранем. Чи то через хворобу, чи то через відсутність інших справ на горі Тайшань, «генерал-м'ясник» пообіцяв учителю, що задля здоров'я дотримуватиметься езотеричного способу життя, проповідуваного культом.§!"

 #張天然
 SHD_zhang_tianran: "Чжан Тяньран"
 SHD_zhang_tianran_leader_desc: "§YНародився:§! §L15 серпня 1889 року, Цзінін, провінція Шаньдун, Велика Цін§!\n§YІсторична довідка:§! §LЧжан Тяньран ні до чого не прагнув у житті, поки не потрапив до культу Лу Чжуньї. Лу Чжуньї був лідером невеликої групи релігійних синкретистів під назвою Ігуаньдао у 1918 році. Лу Чжуньї завжди планував, що його сестра Лу Чжуньцзє стане його наступницею, і навіть визнав її божественність як реінкарнацію буддійської богині Ґуаньїнь. Після смерті Лу Чжуньї у 1930 році стався теологічний розкол: Лу Чжуньцзє забрала вірних їй послідовників з Ігуаньдао і переїхала до Хенані, де вони залишаються донині. Чжан Тяньран, маючи повну довіру членів секти, а також нову «божественну» дружину Сунь Сучжень, почав проголошувати приголомшливі одкровення. У 1922 році Чжан Тяньран побудував святилище на горі Тайшань, яке розрослося, поки не поглинуло інші монастирі на горі. До 1924 року Тайшань стала постійною резиденцією шанованого вчителя та його внутрішнього кола. Того ж року сеанс спіритичного письма передрік, що імператору Пуї загрожує отруєння, у зв'язку з чим була спланована поїздка до Пекіна. Чжан Тяньран розважив і задобрив імператора Пуї обіцянками, що Ігуаньдао зміцнюватиме лояльність до Цін через благодійність та, за потреби, війну. Перші загони «Червоних списів» та «Великих мечів» прибули на Тайшань у 1925 році. Найбільшим успіхом стало нібито навернення Чжан Цзунчана у віру Чжан Тяньранем у 1935 році.§!"

 #李藻麟
 SHD_li_zaolin: "Лі Цзаолінь"
 SHD_li_zaolin_sic_desc: "§YНародився:§! §L1892 рік, Пекін, провінція Чжилі, Велика Цін§!\n§YІсторична довідка:§! §LЛі Цзаолінь народився в селянській родині та в дитинстві втратив батька, через що був змушений шукати притулку у дядька, а бідність перешкоджала його освіті. Його військова кар'єра розпочалася у 1909 році, коли він у віці 17 років за рекомендацією друга вступив до Баодінської військової академії. Після трьох важких років вивчення піхотної справи він приєднався до 3-ї дивізії як молодший офіцер під керівництвом Цао Куня та У Пейфу.\n\nПісля створення Юань Шикаєм військово-повітряних сил у 1913 році Лі навчався в авіаційній школі Наньюань і став одним із першої групи китайських пілотів у 1915 році. Як командир авіазагону, під час війни на захист республіки, Лі був відправлений Юанем демонструвати військову міць своїми навичками польоту під командуванням Фен Юйсяна. Лі повернувся до Пекіна і вступив на 5-й курс штабного коледжу у 1916 році, але у 1917-му самовільно приєднався до військ Чжан Цзунчана в Хунані як штабний офіцер у війні проти Армії захисту конституції, аби здобути польовий досвід. Оскільки це не було офіційно дозволено, свого часу його оголосили зниклим безвісти. Після закінчення навчання у 1919 році цей видатний офіцер став викладачем у Баодіні.\n\nПід час Першої чжилійсько-фентянської війни у 1922 році Лі служив начальником штабу Пен Шоусіня в чжилійській армії (цього разу з офіційним визнанням). Під час Другої чжилійсько-фентянської війни, як начальник штабу 1-го чжилійського корпусу під командуванням Пена, Лі потрапив у полон і був завербований Фентянською клікою після відбиття численних фентянських атак у Шаньхайґуані перед потраплянням в оточення (кажуть, що Чжан Сюелян особисто зустрівся з ним після полону). Пригнічений поразкою, Лі намагався таємно повернутися до Пекіна, але люди Чжан Цзунчана перехопили його на вокзалі та переконали знову працювати з «генералом-м'ясником». Відтоді Лі обіймає посаду начальника штабу Чжана, допомагаючи йому керувати військовими справами, особливо після того, як той очолив Шаньдун.§!\n\n§YПримітки: Хоча Лі працював із кількома видатними постатями, його лояльність є незаперечною, оскільки він рішуче засуджує дії, спрямовані проти керівництва.§!"

