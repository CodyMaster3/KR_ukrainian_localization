 SHD_feng_supports_zhang_vs_anq: "Фентянь підтримує Чжан Цзунчана проти Аньціна"
 LEP_collapse_SHD_out: "Шаньдун залишився нейтральним у війні Ліги"
 SHD_two_zhangs_enter_event_pause: "$tooltip_event_pauses_focus$"

 ### Tooltips
 SHD_tianran_can_reclaim_tooltip: "§GШанований учитель Чжан Тяньран може почати повернення сердець і розумів провінцій Ліги\n§!"
 SHD_two_zhangs_tooltip: "§CЦей фокус вирішить долю Шаньдуна та його роль у майбутньому Китаю§!"

 SHD_xuzhou_garrison: "Вербування із залоги Сюйчжоу"
 SHD_xuzhou_garrison_desc: "Дрібні загони навколо міста Сюйчжоу залюбки приєднаються до нашої армії за відповідну ціну."

 SHD_qu_will_be_mad: "§RГубернатор Цюй менше підтримуватиме зусилля монархії!§!"

 ### Decisions ###
 SHD_riot_policy_decisions: "Цивільні заворушення в Шаньдуні"
 SHD_riot_policy_decisions_desc: "Ми маємо розібратися з численними опортуністами, яких породила політична нестабільність. Вони ховаються в горах, здійснюють набіги на міста та стверджують, що наше правління є незаконним."

 SHD_end_Yiguandao_riot: "Припинити бунт Ігуаньдао"
 SHD_end_peasant_riot: "Припинити селянський бунт"
 SHD_end_Zongchang_riot: "Припинити бунт кліки Чжана"

 SHD_develop_jiangxi_tungsten_decision: "Розробка вольфраму в Цзянсі"
 SHD_develop_fujian_aluminium_decision: "Розробка алюмінію у Фуцзяні"

 SHD_create_LSP: "Створити Лігу східнокитайських провінцій"
 SHD_create_LSP_desc: "Шість провінцій тепер можуть бути реорганізовані під владою єдиного маршала — Чжан Цзунчана. Після хаосу, що настав після смерті Суня, Чжан Цзунчан перебудував Лігу та об'єднав шість провінцій під своїм началом. Його потакання порокам та опортуністичний мілітаризм відтепер є фактичною політикою шести провінцій."

 SHD_internal_decisions: "Шаньдунський баланс"
 SHD_internal_decisions_desc: "Управління є продовженням особистості, тому вкрай важливо, щоб ми позиціонували себе і як незалежну провінцію, і як законне місце для інвестицій у Китаї."

 SHD_obtain_dockyard_access: "Запити на допомогу японського флоту"
 SHD_obtain_dockyard_access_desc: "Найкраще використання нашої оновленої залежності від Японії — це скористатися перевагами їхнього флоту. Хоча спроможність Шаньдуна воювати у відкритому морі обмежена, в Японії є безліч цивільних портів, які ми можемо орендувати для власних цілей."

 SHD_dockyard_count_tt: "Це рішення можна прийняти до §Y3§! разів. (Наразі §Y[?SHD_dockyard_count]/3§!)"

 SHD_assemble_air_squadron: "Сформувати [QIE.GetAdjective] добровольчі авіаескадрильї"
 SHD_assemble_air_squadron_desc: "Відважні китайські пілоти з [QIE.GetNameDef] можуть використовувати Цзінань для відпрацювання навичок стрільби по іноземних імперіалістах."

 SHD_pull_strings_with_qing_industrialists: "Орендувати [QIE.GetAdjective] заводи"
 SHD_pull_strings_with_qing_industrialists_desc: "Необхідність остаточної перемоги над іноземними імперіалістами означає, що ми готові заплатити будь-яку ціну, щоб отримати додаткову промислову підтримку від [QIE.GetNameDef]."

 SHD_industrialist_count: "Це рішення можна прийняти до §Y3§! разів. (Наразі §Y[?SHD_industrialist_count]/3§!)"

 SHD_war_intervention_decisions: "Втрутитися у справи штатів мілітаристів"
 SHD_war_intervention_decisions_desc: "Ми маємо скористатися будь-яким незахищеним кордоном, якщо хочемо досягти нашої кінцевої мети. Пройти крізь безглузді армії, що протистоять нам і заважають китайському народу отримати заслужене врядування. Незабаром ми побачимо стіни Нанкіна, «пахучу гавань» та скуштуємо сичуаньських спецій."

 SHD_intervene_xuzhou: "Захопити Сюйчжоу"
 SHD_intervene_xuzhou_desc: "Місто Сюйчжоу — одна з найбільш розвинених територій у Цзянсу та навколишніх землях, трофей, вартий уваги сам по собі."

 SHD_intervene_jiangsu: "Втрутитися в Цзянсу"
 SHD_intervene_jiangsu_desc: "Цзянсу гостро потребує нашої допомоги, а її народ страждає під південним гнітом. Ми маємо зміцнити їхній контроль над провінцією."

 SHD_intervene_southeast: "Втрутитися в [From.GetNameDef]"
 SHD_intervene_southeast_desc: "Земля між Тайшанем та Цзицзіньшанем охоплена хаосом. Якщо ми хочемо здобути це велике місто, ми мусимо вдарити зараз."

 SHD_Yantai_Port_Line: "Судноплавний маршрут Яньтай — Порт-Артур"
 SHD_Yantai_Port_Line_desc: "Найбільший порт, який ми контролюємо самостійно, £victory_points §GЯньтай§!, забезпечує безперервні поставки від японського та фентянського урядів."

 SHD_Nantong_Port_Line: "Судноплавний маршрут Наньтун — Наґасакі"
 SHD_Nantong_Port_Line_desc: "Ймовірно, другий за важливістю порт у Східнокитайському морі після Шанхая, з’єднаний залізницею з внутрішніми районами, £victory_points §GНаньтун§! має життєво важливе значення для стабільного постачання зброї."

 SHD_Hangzhou_Port_Line: "Судноплавний маршрут Ханчжоу — Наґасакі"
 SHD_Hangzhou_Port_Line_desc: "Велике місто £victory_points §GХанчжоу§! дозволило б приймати значні партії японської та фентянської зброї для підтримки наших військових зусиль."

 SHD_intervene_xuzhou_tt: "Якщо ви контролюєте §Y[1047.GetName]§!, ви можете стати їхнім прямим власником і збільшити показник $MODIFIER_WAR_SUPPORT_FACTOR$ на 2%."
 SHD_intervene_jiangsu_tt: "Якщо ви контролюєте §Y[598.GetName]§! та §Y[1075.GetName]§!, ви можете стати їхнім прямим власником і збільшити показник $MODIFIER_WAR_SUPPORT_FACTOR$ на 4%."

 SHD_raise_army: "Формування армії"
 SHD_raise_army_desc: "Нашій так званій армії бракує потужності порівняно з багатьма мілітаристами, з якими ми сподіваємося зіткнутися. Хоча у нас немає сучасної армії, ми маємо популярність серед народу, яку можемо використати на свою користь. Якщо не спрацює сила, спрацює кількість..."

 SHD_raise_division: "Вербувати селян із [FROM.GetName]"
 SHD_raise_division_desc: "Ми можемо завербувати селян із [FROM.GetName] на допомогу нашій справі."

### Parties ###
 SHD_totalist_party: "Соціалістична спілка молоді"
 SHD_totalist_party_long: "Соціалістична спілка молоді (Шехуей чжуї цінніянь туань)\n§LНайсвіжіша розробка в соціалістичній думці, популярна лише серед шаньдунської молоді, знайомої з працями, опублікованими Секретаріатом Паназійської спілки профспілок. Ця група, що складається переважно зі студентів, може процвітати лише за масованої підтримки з боку іноземних держав.§!\n"
 SHD_syndicalist_party: "Товариство антияпонської солідарності"
 SHD_syndicalist_party_long: "Товариство антияпонської солідарності (Фаньжи туаньцзєхуей)\n§LРадикальне відгалуження початкової місії Гоміньдану в Шаньдуні; ця група провела кілька років у підпіллі в Ціндао, чекаючи на слушну нагоду. Під впливом перекладених соціалістичних праць, опублікованих Секретаріатом Паназійської спілки профспілок, їхня організація може вижити лише за підтримки цих іноземних ідеологів.§!\n"
 SHD_radical_socialist_party: "Гоміньдан"
 SHD_radical_socialist_party_long: "Національна партія (Гоміньдан)\n§LОскільки фундамент руху «Новий Китай» був закладений у Шаньдуні, в Шанціні досі відчувається підспудна течія прогресивізму та змін. Усі ці люди прагнуть тісніших зв'язків із підпільним Гоміньданом на південь від річки Янцзи.§!\n"
 SHD_social_democrat_party: "Прогресивна партія"
 SHD_social_democrat_party_long: "Прогресивна партія (Цзіньбудан)\n§LЗаснована у 1916 році Кан Ювеєм, Прогресивна партія зросла значною мірою завдяки пожертвам емігрантів та в межах демократичного опортунізму того десятиліття. Коли цей опортунізм змінився реставрацією Цін, кілька членів партії в Шаньдуні вирішили піти в підпілля.§!\n"
 SHD_social_liberal_party: "Дослідницька кліка"
 SHD_social_liberal_party_long: "Дослідницька кліка (Яньцзюсі)\n§LВідгалуження Прогресивної партії 1916 року, заснованої Кан Ювеєм під час правління Юань Шикая. Шаньдунська дослідницька кліка після реставрації Цін веде боротьбу за вплив у провінції. Оскільки її члени не бажають іти на компроміс з інтелектуальним кліматом шаньдунської інтелігенції, партія тримається переважно на пожертвах емігрантів та зверненнях до західних гостей.§!\n"
 SHD_market_liberal_party: "Товариство квітки дракона небесного шляху"
 SHD_market_liberal_party_long: "Товариство квітки дракона небесного шляху (Їсінь тяньдао лунхуа хуей)\n§LЗасноване в повіті Цзоупін для боротьби з надмірною бідністю в регіоні, Товариство квітки дракона стало альтернативою бандитизму, яка привабила багатьох у те десятиліття. Засновник, Ма Шивей, мав на меті об'єднати кілька різних шкіл Сяньтяньдао заради спільної мети — покращення добробуту в Шаньдуні. Товариство квітки дракона було визнане політичною партією лише тоді, коли інтервенціони та західні спостерігачі почали шукати альтернативу прихованому мілітаризму Ігуаньдао та щедрим ідеалам добробуту Гуїдао.§!\n"
 SHD_social_conservative_party: "Товариство Гуїдао"
 SHD_social_conservative_party_long: "Товариство Гуїдао (Гуїдао хуей)\n§LЦя організація має схоже з Ігуаньдао походження, але відкрита до християнства та західного езотеризму. Через це їхнє фінансування різко скоротилося в останні роки внаслідок розколу Шаньдуна. Ті, хто шукав християнства, вже переїхали до Ціндао. Проте вони мають міцну репутацію завдяки позапартійній благодійності, допомагаючи бідним представникам кожної раси.§!\n"
 SHD_authoritarian_democrat_party: "Товариство відновлення доброзичливості"
 SHD_authoritarian_democrat_party_long: "Товариство відновлення доброзичливості (Ґуйжень хуей)\n§LСум'яття століття приниження — це лише ще одна сторінка в довгій історії Шаньдуна. Для багатьох у провінції просвітлення — єдиний спосіб уникнути цього, інші ж прагнуть панувати протягом свого короткого життя. Традиціоналісти навколо Цюй Їнґуана та герцога Яньшеня виступають проти всіх змін, запроваджених іноземцями в минулому столітті. Таємна торгівля наркотиками кліки Чжана сприймається багатьма в Шаньдуні як дегенеративна поведінка. Не кажучи вже про марнотратство та грубість самого Чжан Цзунчана. Для багатьох провина династії Цін полягає в їхньому безтурботному ставленні до Шаньдуна, а не в самій монархії. Публічна відданість Цюй Їнґуана династії Цін знаходить відгук у південно-східному Шаньдуні серед тих, хто бажає повернутися додому у Вейхайвей та Ціндао.§!\n"
 SHD_auth_dem_liu_heding_puppet: "Кліка Лю"
 SHD_paternal_autocrat_party: "Кліка Чжана"
 SHD_paternal_autocrat_party_long: "Кліка Чжана (Чжан пай)\n§LКліка Чжана керує більшою частиною Шаньдуна з внутрішнього комерційного центру Цзінань. Її влада простягається вздовж шаньдунської залізниці до Вейфана та вздовж головної дороги до Яньтая. Клікою керує сам «генерал-м'ясник» разом зі своїми наближеними, зокрема Чжан Цзіняо та Чжан Цзичжуном. Справжня сила Чжан Цзунчана — у добре озброєних залишках Шаньдунської революційної армії, що патрулюють провінцію. Хоча формально вони дотримуються заборони на опіум, на практиці Чжан Цзунчан використовує залізницю для поставок із Ціндао.§!\n"
 SHD_national_populist_party: "Товариство Ігуаньдао"
 SHD_national_populist_party_long: "Товариство Ігуаньдао\n§LІгуаньдао — це культ, що спочатку був частиною Товариства Білого лотоса, поширеного по всьому Китаю в XIX столітті. Їхні синкретичні вірування поєднують небесну структуру конфуціанства, розмаїття богів буддизму та даоські практики продовження життя. Доктрина Ігуаньдао була передана вчителем Лу Чжуньцзє його невеликій групі під час Світової війни, і більшість наступних навернених навчаються поетапно. Це гарантує, що ядро керівництва має достатньо важелів для адаптації культу під свої особисті цілі. Першим серед цієї групи є шанований учитель Чжан Тяньран, наступник Лу Чжуньї. Завдяки політичному маневруванню Чжан Тяньраня культ зріс до приблизно 7 мільйонів послідовників по всьому Китаю, причому лише 500 000 членів проживають у самому Шанціні.\n\nСелянські армії по всьому Північному Китаю, зокрема «Товариство великих мечів» та «Товариство червоних списів», вбачають в Ігуаньдао найбільш морально стійкий уряд у Китаї.§!\n"
 SHD_pat_aut_liu_heding_puppet: "Аньцінська кліка"

### Focus Tree ###
 Shandong_Focus: "Фокусне древо Шаньдуна"

### Political focuses ###
 SHD_two_zhangs_enter: "Вхід двох Чжанів"
 SHD_two_zhangs_enter_desc: "Багаторічна напруженість між Ігуаньдао та Чжан Цзунчаном сягнула критичної межі. Обіцянки Чжан Цзунчана «зав'язати» з пороками розвіялися, а розслідування Цюй Їнґуана щодо наркоторгівлі виявило цінні докази, здатні засудити його в очах світу. З прибуттям Лу Чжуньцзє до Цзінаня «генерал-м'ясник» ступив на шлях, що веде до знищення всіх трьох сил у Шаньдуні."

 SHD_announce_revelationary_order: "Проголошення одкровенного ладу"
 SHD_announce_revelationary_order_desc: "Як і всі великі вчителі в історії Китаю, Чжан Тяньран явить народу одкровенний лад через публічні проповіді. Поки мілітаристи Китаю кричать і гублять своїх людей, Чжан Тяньран спокійно диктуватиме майбутнє Китаю, передане йому через спіритичне письмо. Через Чжан Тяньраня промовляють Уцзіму, Сунь Ятсен та Будда."

 SHD_destroy_the_drug_trade: "Знищення наркоторгівлі"
 SHD_destroy_the_drug_trade_desc: "Покоління болю, з якого намагається виборсатися Китай, опинилися під загрозою через зловісне насіння опіуму. Опіум — це не ліки, а отрута для китайського народу, і це те, чому благородні боксери та Сунь Ятсен прагнули покласти край. Чжан Тяньран склав список відомих наркоторговців і покладається на громадян у справі їхнього винищення."

 SHD_back_to_the_basics: "Назад до основ"
 SHD_back_to_the_basics_desc: "Уся бюрократія Цзінаня прогнила через сліпу віру в мілітаристів. Шаньдунська рада незалежності, канцелярія губернатора Чжан Цзунчана та корумповане управління імпорту мають бути засуджені. На їхніх уламках Ігуаньдао призначить керівників та вчителів для нагляду за цивільним врядуванням."

 SHD_absorb_the_guiyidao: "Поглинання Гуїдао"
 SHD_absorb_the_guiyidao_desc: "Здатність Гуїдао залучати побожних людей з-поза меж Китаю до нашої справи спасіння заслуговує на похвалу. Дуже шкода, що вони покинули Шаньдун заради Пекіна та Тяньцзіня. Неважливо. Їхні офіси — ідеальні місця для наших управителів, щоб роздавати благодійну допомогу."

 SHD_benevolence_and_morality: "Доброзичливість та мораль"
 SHD_benevolence_and_morality_desc: "Руйнування, які Чжан Цзунчан приніс у Шаньдун, очевидні. Торгівля опіумом і корупція процвітають, проникаючи на всі рівні суспільства, а урядовці стали не більше ніж найманими бандитами Чжана. Тепер, коли Цюй Їнґуан повернувся до влади в провінції, маючи підтримку Товариства відновлення доброзичливості та фінансування центрального уряду, Шаньдун буде очищений від хвороб і в ньому буде відновлено порядок."

 SHD_return_to_the_source: "Повернення до джерела"
 SHD_return_to_the_source_desc: "Тепер, коли два Чжані усунуті, Шаньдун може повернутися до джерела легітимності в Китаї — Пекіна. Наш спільний інтерес у звільненні Китаю від іноземного впливу буде задоволений, а культурні інституції Шаньдуна будуть збережені."

 SHD_story_of_a_bastard: "Історія одного байстрюка"
 SHD_story_of_a_bastard_desc: "Натовпи, що сміялися з нього, коли він в'їжджав до Цзінаня в труні, тепер самі лежать у дерев'яних ящиках. Губернатор Чжан Цзунчан оголосив своїм солдатам, що всі вони такі ж байстрюки, як і він. І що вони — найбільші та найміцніші байстрюки в усьому Китаї. Доля Шаньдуна — переграти великих гравців і втримати «генерала-м'ясника» живим за будь-яку ціну."

 SHD_honoured_teacher_lu_zhongjie: "Шанована вчителька Лу Чжуньцзє"
 SHD_honoured_teacher_lu_zhongjie_desc: "Найважливіший урок, який Чжан Цзунчан виніс із перебування на Тайшані, полягає в тому, що народ Шаньдуна масово звертається до релігії через розчарування в ньому. Аби перехопити ініціативу, Чжан запросив вдячну Лу Чжуньцзє повернутися на посаду шанованої вчительки Ігуаньдао за умови її невтручання в політику."

 SHD_besiege_mount_taishan: "Облога гори Тайшань"
 SHD_besiege_mount_taishan_desc: "Секта Ігуаньдао все ще тримається на горі Тайшань, і наші генерали розробили ретельний план атаки, щоб нарешті позбавити Шаньдун їхнього впливу. Ми маємо діяти швидко, аби покінчити з загрозою Ігуаньдао раз і назавжди."

 SHD_bolster_the_drug_trade: "Підтримка наркоторгівлі"
 SHD_bolster_the_drug_trade_desc: "Загроза викриття, яку Цюй Їнґуан та Чжан Тяньран тримали над нашими головами, минула. Щойно ми ліквідуємо решту «няньок», які намагаються заважати наркоторгівлі, ми зможемо насолоджуватися тією свободою, яку так зневажають монархісти та філософи."

 SHD_shandong_model_province: "Шаньдун — зразкова провінція"
 SHD_shandong_model_province_desc: "Ідея зразкового врядування — це не те, що зберегло незалежність Шаньдуна, але невдовзі вона може стати єдиним аргументом на користь автономії. Цивільним службовцям у Шаньдуні наказано поширювати позитивні оцінки провінції, а також стежити за тим, щоб іноземні гості не заходили надто далеко за межі міст."

### Army ###
 SHD_reaffirm_the_northeast_army: "Відродження Північно-східної армії"
 SHD_reaffirm_the_northeast_army_desc: "Північно-східна армія була розквартирована в Шаньдуні, і більшість спостерігачів оголосили її недієздатною. Попри всі наші зусилля, іноземні експерти значною мірою мають рацію. Багато ветеранів фентянських військ переховуються, і їх потрібно закликати з резерву. Слід підняти старі знамена Шаньдуна, щоб закликати всіх здатних до служби чоловіків до нашої армії."

 SHD_an_army_of_professionals: "Армія професіоналів"
 SHD_an_army_of_professionals_desc: "Минулий досвід із дезертирством та непокорою рекрутів вказує на те, що нам слід зосередитися на підготовці професійних солдатів. Відбір більш зрілих бійців, належне тренування та чіткі накази щодо відступу дозволять нашим солдатам довше триматися у затяжній війні."

 SHD_replace_outdated_weapons: "Заміна застарілої зброї"
 SHD_replace_outdated_weapons_desc: "Найманське походження армії проявляється в її неякісному спорядженні. Якщо ми хочемо реформуватися у бік професіоналізму, нашим інженерам потрібно дати час на експерименти з новими зразками зброї та закупівлі."

 SHD_train_with_northern_cavalry: "Навчання з північною кавалерією"
 SHD_train_with_northern_cavalry_desc: "Найманська кавалерія, що прибула до Шаньдуна разом із Чжан Цзунчаном, зараз чекає або сигналу до відходу, або до бою. Дехто з них має досвід виживання на півночі та втечі від великих патрулів. Ці уроки були б корисними, якби ми застосували їх у наших планах битв."

 SHD_improve_rail_supply_lines: "Покращення залізничних шляхів постачання"
 SHD_improve_rail_supply_lines_desc: "Залізниця через Шаньдун була життєво важливою для Чжана під час його служби Фентяню. Тепер його досвід можна застосувати до майбутніх кампаній із додатковими вдосконаленнями. Розподіл вагонів під продовольство та запчастини дозволить зменшити кількість аварій."

 SHD_an_army_of_fanatics: "Армія фанатиків"
 SHD_an_army_of_fanatics_desc: "Досвід, коли новобранці проявляли більше хоробрості за командирів та здійснювали відчайдушні маневри, свідчить про необхідність підготовки солдатів-фанатиків. Набір молодих бійців, суворе навчання та наказ ніколи не відступати забезпечать нам швидку перемогу."

 SHD_request_weapons_from_followers: "Запит зброї у послідовників"
 SHD_request_weapons_from_followers_desc: "Жителі Шаньдуна роками виготовляли зброю для самооборони, боячись Чжан Цзунчана. Тепер, коли він пішов, наша адміністрація може попросити цих потенційних патріотів пожертвувати свою зброю задля національного порятунку."

 SHD_learn_from_the_chahar_horsemen: "Уроки чахарських вершників"
 SHD_learn_from_the_chahar_horsemen_desc: "Чахарські вершники допомогли біднякам північного Шаньдуна протистояти збирачам податків Чжан Цзунчана. Настав час віддячити. Чахарські кавалеристи, що живуть у Шаньдуні, помилувані за будь-який бандитизм і закликаються до армії заради національного порятунку."

 SHD_fight_for_the_master: "Бій за вчителя"
 SHD_fight_for_the_master_desc: "Солдати більше не реагують на масові накази мілітаристів. Потрібен компетентний і перевірений лідер, вчитель, щоб згуртувати хоробрих у ці обережні часи. Командний центр на чолі з цивільною та військовою адміністрацією забезпечить виконання цілей усіма ресурсами Шаньдуна."

 SHD_modernise_officer_portfolios: "Модернізація офіцерського складу"
 SHD_modernise_officer_portfolios_desc: "Молоде покоління солдатів не має можливості навчатися у військових академіях за кордоном через нашу сумнівну легітимність. Ми повинні вивчити варіанти іноземної військової освіти та використати всі наші зв'язки у цьому напрямку."

 SHD_novel_military_projects: "Новітні військові проєкти"
 SHD_novel_military_projects_desc: "Здатність мислити нестандартно дозволила Шаньдуну зберегти автономію в минулі десятиліття. Як продовження цього, ми маємо серію дослідницьких військових проєктів, на яких можемо зосередитися."

 SHD_modern_military_research: "Сучасні військові дослідження"
 SHD_modern_military_research_desc: "Молоде покоління студентів позбавлене шансів на закордонну освіту. Наша адміністрація може витратити капітал, щоб зібрати викладачів із Ціндао та Тяньцзіня і сформувати план військових досліджень."

 ### Industry ###
 SHD_revive_shandongs_industry: "Відродження промисловості Шаньдуна"
 SHD_revive_shandongs_industry_desc: "Хоча Шаньдун не перебував під недолугим управлінням Ліги восьми, за останні кілька років багато малих заводів закрилися. Адміністрація проведе оцінку порожніх ділянок для потенційних позик на відкриття нового бізнесу."

 SHD_reopen_mothballed_factories: "Відкриття законсервованих заводів"
 SHD_reopen_mothballed_factories_desc: "Спроба Чжан Цзунчана зіштовхнути Шаньдунський гірничий картель із гірничою компанією «Луда» призвела до закриття кількох заводів. Настав час домогтися примирення та знову відкрити ці центри для бізнесу."

 SHD_repair_the_jinan_qingdao_railway: "Ремонт залізниці Цзінань — Ціндао"
 SHD_repair_the_jinan_qingdao_railway_desc: "Залізниця Цзінань — Ціндао зношена через надмірне використання та погане будівництво у 1910-х роках. Можна укласти взаємовигідну угоду з німецькою владою: вони постачають сталь, а ми надаємо робочу силу."

 SHD_mineral_rights_leases: "Оренда прав на видобуток копалин"
 SHD_mineral_rights_leases_desc: "За роки, що минули після вугільного застою, розвідники виявили нові родовища в Шаньдуні. Наша адміністрація вже достатньо компетентна, щоб здавати права на видобуток китайським компаніям без жодних махінацій."

 SHD_empower_the_shandong_mining_cartel: "Посилення Шаньдунського гірничого картелю"
 SHD_empower_the_shandong_mining_cartel_desc: "Картель був сформований у 1928 році за таємної підтримки Чжан Цзунчана. Його мета — організувати китайську працю так, щоб іноземні компанії не мали переваг над вітчизняними. За нашої таємної допомоги це збагатить усіх, окрім чужинців."

 SHD_shandong_university: "Шаньдунський університет"
 SHD_shandong_university_desc: "Університет був закритий після Світової війни, оскільки залишився на території німецького Ціндао. В Таяні є лише сільськогосподарський університет, що не підходить для військових наук. Ми домовилися з Ціндао, що студенти зможуть там навчатися, якщо ми його знову відкриємо."

 SHD_improve_roads_to_beijing: "Покращення доріг до Пекіна"
 SHD_improve_roads_to_beijing_desc: "Дороги до Пекіна стали кориснішими, оскільки Бохайська затока є предметом суперечок між [QIE.GetNameDef] та Фентянем. Шлях до Пекіна в межах Шаньдуна зараз ремонтується під нашим наглядом."

 SHD_court_northern_elites: "Залучення північних еліт"
 SHD_court_northern_elites_desc: "Пекінський уряд виганяє достойних мешканців через дрібні політичні чвари, і їхня втрата — наша вигода. Ми приведемо до ладу кілька маєтків у Шаньдуні та запропонуємо північним елітам оселитися тут. Це зміцнить нашу автономію або, в гіршому разі, дасть нам хороших заручників."

 SHD_purchase_factories_in_tianjin: "Купівля заводів у Тяньцзіні"
 SHD_purchase_factories_in_tianjin_desc: "Економічні негаразди у світі зробили нерухомість у Тяньцзіні доступною. В інтересах адміністрації викупити збіднілі заводи для нашої військової промисловості. Це також дозволить краще оцінювати ситуацію в Китаї через нейтральний порт."

 ### Reclaiming Industry ###
 SHD_reclaim_despoiled_industry: "Повернення розграбованої промисловості"
 SHD_reclaim_despoiled_industry_desc: "Після років нехтування з боку чжилійських губернаторів [SHD.GetLeader] прибув із обіцянкою відродити південні провінції. Ця обіцянка включає нагороду для тих губернаторів, які перейдуть на наш бік."

 SHD_victory_in_the_south: "Перемога на півдні"
 SHD_victory_in_the_south_desc: "Тепер, коли простори долини річки Янцзи відкриті перед [SHD.GetLeader], настав час вислухати потреби мільйонів біженців. Ці вдячні громадяни залюбки допоможуть індустріалізувати регіон задля нашої національної оборони."

 SHD_develop_the_coastline: "Розвиток узбережжя"
 SHD_develop_the_coastline_desc: "Узбережжя Північної Янцзи стало мінним полем суперечливих інтересів навіть після усунення AOG. Знадобляться величезні зусилля для відновлення морського сполучення, але нагорода буде великою."

 SHD_develop_anqing: "Розвиток Аньціна"
 SHD_develop_anqing_desc: "Аньцін, столиця найстарішої з клік верхньої Янцзи, надто довго страждав від своїх наглядачів. Настав час надати людям Аньціна та Аньхоя економічні можливості, яких їх позбавляли егоїстичні лідери."

 SHD_renovate_nanjing: "Оновлення Нанкіна"
 SHD_renovate_nanjing_desc: "Стародавнє обнесене стінами місто Нанкін пережило століття окупацій, але тепер нарешті в безпеці. Наша адміністрація охоче прийме пожертви в обмін на робочу силу для відбудови міста."

 SHD_complete_the_jinan_nanjing_railway: "Завершення залізниці Цзінань — Нанкін"
 SHD_complete_the_jinan_nanjing_railway_desc: "Коли мільйони людей пробиралися грунтовими дорогами з Цзянсу до Шаньдуна, вони нарікали на відсутність залізниці. Маючи капітал із визволених провінцій, ми зможемо прискорити будівництво вузькоколійки між цими містами."

 SHD_dayu_tungsten_mines: "Вольфрамові шахти Даю"
 SHD_dayu_tungsten_mines_desc: "Давно відомо, що в Даю, поблизу Ґаньчжоу в Цзянсі, є великі запаси вольфраму. Проте інфраструктури для видобутку майже немає. Нам слід покращити регіон, щоб вольфрам можна було видобувати та експортувати."

 SHD_connect_fujians_communities: "Сполучення громад Фуцзяня"
 SHD_connect_fujians_communities_desc: "Фуцзянь є домівкою для численних біженців та традиційних громад, які не люблять окупантів. Ми сподіваємося заслужити їхню лояльність через інфраструктурні проєкти в їхній провінції."

 SHD_rebuild_northern_zhejiang: "Відбудова північного Чжецзяна"
 SHD_rebuild_northern_zhejiang_desc: "Північний Чжецзян був частково зруйнований ще під час Тайпінського повстання — подія, за яку жоден лідер не хоче брати відповідальність. До появи нашої адміністрації. Люди регіону залюбки приєднаються до нашої справи після надання допомоги та відбудови."

### Navy ###
 SHD_rebuild_the_beiyang_fleet: "Відродження Бейянського флоту"
 SHD_rebuild_the_beiyang_fleet_desc: "Шаньдун колись був домом для Бейянського флоту — гордості старої Великої Цін. Хоча німці витіснили нас у менш потужні порти, ми повернемося. Флот, що панував у Бохайській затоці, оживе знову, і Шаньдун буде на чолі цього процесу."

 SHD_steal_japanese_designs: "Крадіжка японських креслень"
 SHD_steal_japanese_designs_desc: "Наша адміністрація знайшла групу осіб, пов'язаних з Імперським флотом Японії, які готові за певну ціну «злити» проєкти, що використовуються для будівництва деяких їхніх малих суден."

 SHD_modernise_naval_bases: "Модернізація військово-морських баз"
 SHD_modernise_naval_bases_desc: "Військово-морської бази в Яньтаї недостатньо для постачання наших солдатів у разі втрати сухопутного сполучення з Шаньдуном. Необхідна більша база, і ця адміністрація цілком здатна її отримати."

 SHD_purchase_convoys: "Закупівля конвоїв"
 SHD_purchase_convoys_desc: "Якщо ми хочемо залучити торгівлю в неспокійній Бохайській затоці та вижити під атаками підводних човнів, ми маємо інвестувати у конвої. Найрозумніше придбати їх як вживані старі торгові судна."

 SHD_obtain_submarine_designs: "Отримання креслень підводних човнів"
 SHD_obtain_submarine_designs_desc: "Аби вирвати контроль над Бохайською затокою у наших суперників, ми маємо перехитрити їхню переважаючу вогневу міць на морі. Рішенням є секретна програма підводних човнів. Потенційна вигода від панування в цьому морі переважає витрати на розробку."

 SHD_incorporate_qingdao: "Приєднання Ціндао"
 SHD_incorporate_qingdao_desc: "Настав час повернути справжній дім Бейянського флоту — Ціндао. Наше велике повернення прискорить відродження китайської військово-морської промисловості в Шаньдуні."

 ### Air Force ###
 SHD_create_an_air_force: "Створення військово-повітряних сил"
 SHD_create_an_air_force_desc: "Оскільки на морі ситуація складна, час подумати нестандартно. Ми не зможемо використовувати авіацію, доки в Цзінані не з’явиться належний аеродром."

 SHD_experimental_fighters: "Експериментальні винищувачі"
 SHD_experimental_fighters_desc: "Через високу вартість розробки винищувачів наші техніки зосередилися на спрощенні конструкцій та жертвуванні безпекою заради того, аби підняти в повітря якомога більше літаків. Отримавши досвід польотів, ми зможемо значно посилити наш вплив."

 SHD_train_fighter_pilots: "Підготовка пілотів-винищувачів"
 SHD_train_fighter_pilots_desc: "Хоробрі юнаки Шаньдуна готові піднятися в небо. Вдячні жителі провінції оцінять відчуття безпеки, яке дарують наші хлопці в повітрі."

 SHD_expand_the_jinan_airstrip: "Розширення злітної смуги в Цзінані"
 SHD_expand_the_jinan_airstrip_desc: "Злітна смуга в Цзінані нездатна впоратися з обсягом польотів, запланованих нашими військовими на найближчі роки. В межах розвитку авіаційної промисловості ми спроєктували великий аеропорт, аби втілити наші сміливі задуми та перехитрити інших мілітаристів."

 SHD_planes_over_the_bohai_sea: "Літаки над Бохаєм"
 SHD_planes_over_the_bohai_sea_desc: "Здатність діяти над Бохайською затокою дозволить нам допомогти флоту захистити море від наших суперників. Спеціально розроблені морські літаки зможуть справлятися з цілями на морі значно краще, ніж наземні моделі."

 SHD_airspace_protection: "Захист повітряного простору"
 SHD_airspace_protection_desc: "Супровід наших винищувачів та піхоти стає дедалі популярнішим трендом у кінохроніках закордонних воєн. Варто докласти зусиль та інвестувати в протиповітряну оборону для посилення нашої армії."

 SHD_bomber_aircraft: "Бомбардувальна авіація"
 SHD_bomber_aircraft_desc: "Мрія про залякування мілітаристів за допомогою авіації стає реальністю. Бомбардувальники за належної промислової підтримки можуть легко знищити здатність ворога фінансувати свої війни."

 ### Bookmark ###
 SHD_KR_gathering_storm_desc: "Правителя Шаньдуна Чжан Цзунчана випереджають лише його бронепоїзд та жахлива репутація. «Генерал-м'ясник» відомий насильством, пороками та корупцією, і під його рукою столиця Цзінань поступово стала відображенням свого господаря.\n\nОднак на вершині гори Тайшань відлюдний патріарх Чжан Тяньран уникає ницості, що панує внизу. Натомість він сподівається повернути час у Китаї на століття назад і спрямувати країну в обійми своєї заворожуючої віри Ігуаньдао. Зіткнення цих суперечливих сил може назавжди змінити Китай..."

 ### Intro Screen ###
 SHD_country_intro_background: "GFX_SHD_intro"
 SHD_country_intro_header: "1936; Переломний момент у Шаньдуні"
 SHD_country_intro_content: "Провінція §PШаньдун§! була позбавлена своїх найцінніших земель §mДипломатичними сеттльментами§! та §mНімеччиною§!. Порт §aЦіндао§!, колись зруйнований війною між §jЯпонією§! та §mНімеччиною§!, тепер служить важливим вузлом як для §gНімецького імперського флоту§!, так і для цивільної торгівлі компаній §aНаглядової ради§!. Ця ситуація зробила §aЦзінань§! ідеальним домом для справжньої влади в §PШаньдуні§! — §PЧжан Цзунчана§!.\n\n§PЧжан§! прибув до §PШаньдуна§! у 1911 році нібито для того, щоб очолити §PШаньдунську революційну армію§!, але швидко зробив своїм основним заняттям §mазартні ігри§! та §aрозпусту§!. §aЦзінань§! розрісся так само як і сам §Pгенерал-м'ясник§!: брудний, прибутковий і гірше захищений, ніж планувалося спочатку. На вершині 6600 сходинок гори §nТайшань§! розташована штаб-квартира §nІгуаньдао§!. Таємничий і, здавалося б, святий §nЧжан Тяньран§! зробив це місце найбезпечнішим і найморальнішим у §PШаньдуні§!. Громадяни §Pпровінції§! до 1936 року опинилися затиснутими між розбитими, охопленими бідністю дорогами від §aЦзінаня§! до §aВейхайвея§!. Порятунок чекає або в близькому §aЦзінані§!, або на вершині §nгори Тайшань§!."

 SHD_guide: "§MКліка Чжана§! ($paternal_autocrat_coloured$)\n£white_dot Коли шпигуна Цюй Їнґуана буде схоплено, оберіть варіант із перекриттям доріг.\n£white_dot Коли Тайшань буде обурена поведінкою Чжан Цзунчана, чекайте відчайдушних листів від Чжан Тяньраня.\n\n§MТовариство Ігуаньдао§! ($national_populist_coloured$)\n£white_dot Коли шпигуна Цюй Їнґуана буде схоплено, оберіть варіант із перекриттям доріг.\n£white_dot Коли Тайшань буде обурена поведінкою Чжан Цзунчана, ідіть на конфронтацію з аскетами.\n\n§MТовариство відновлення доброзичливості§! ($authoritarian_democrat_coloured$)\n£white_dot Коли шпигуна Цюй Їнґуана буде схоплено, відправте людей до будинку Цюй Їнґуана."

### Events ###

### Political Events###
 shandong_events.2.t: "Лу Чжуньцзє прибуває до Цзінаня"
 shandong_events.2.d: "Цей день дає Чжан Цзунчану чергову нагоду принизити старого на горі — Чжан Тяньраня. Аби заснувати свій невеликий культ на пагорбі, Чжан Тяньран був змушений вигнати сестру свого колишнього вчителя, Лу Чжуньї. Сестра, Лу Чжуньцзє, стала дуже влучною відповіддю численним доброзичливцям Ігуаньдао, з якими Чжан Цзунчану доводилося мати справу в останні місяці. Ось чому вона має повернутися до Шаньдуна, хоча б як жарт. Аби посилити шоковий ефект, Чжан привів на цю вітальну церемонію свою стару матір, а запланована група зустрічаючих розрослася до чималого натовпу. Чжан Цзунчан, намагаючись посилити приниження Чжан Тяньраня, вручив старенькій Лу Чжуньцзє букет, а на честь її приїзду в бік сусіднього житлового будинку дали традиційний салют із двадцяти однієї зброї."
 shandong_events.2.a: "Кулі мають кудись летіти"

 shandong_events.970.t: "Гуляння Чжан Цзунчана в Цзінані набирають обертів"
 shandong_events.970.d: "Після тієї суміші розваг та насильства Чжан залишив свою матір з Лу Чжуньцзє і вирішив відсвяткувати ніч у місті. Час від часу Чжан зупинявся, щоб роздати гроші «Міньшен» біженцям із Цзянсу. Також того дня сталася сутичка з протестувальниками Ігуаньдао біля офісу Чжана. Їхні щоденні порожні обіцянки змінилися обуренням через повернення Лу Чжуньцзє. Перш ніж Чжан спробував збити їх автомобілем, вони заявили, що Чжан Тяньран прийде судити саму його душу. Вечір затьмарило лише те, що його постачальник опіуму досі переховується — без сумніву, через втручання товариства «Жень ци», яке й раніше псувало веселі вечори своєю мораллю. Пригода закінчилася візитом до улюбленого борделю Чжана, звідки кілька жінок приєдналися до його кортежу, аби разом вживати наркотики вдома. Під кінець дня одна з дам зникла разом із порцією опіуму; Чжан Цзунчан наказав офіцерам не шукати її, адже на ніч ще вистачить і дам, і капсул із зіллям."
 shandong_events.970.a: "Що ж, це її втрата"

 shandong_events.3.t: "Схоплено шпигуна Цюй Їнґуана"
 shandong_events.3.d: "Після ночі важких наркотиків та легковажних жінок у Цзінані, Чжан наступного ранку насолоджувався відпочинком, аж поки не побачив незнайомця на задньому подвір'ї. Попередивши дружин, а потім і охорону, Цзунчан затримав порушника. Після того як Сунь Дяньїн провів із чоловіком «особливу розмову», з'ясувалося, що той є союзником Цюй Їнґуана і прийшов після того, як одна з повій повідомила йому про наркотики в маєтку. Дяньїн вірить, що цей порушник — авангард повстання, яке Цюй планує з Цюйфу. Цей страх Дяньїн плекав кілька місяців, відколи ополчення Цюя перекрило йому дохід від податків. Командувач Дзюнносуке Дате, навпаки, переконує похмільного Чжана, що Цюй Їнґуан збирається натомість доповісти [QIE.GetNameDef]. Дате наполягає на тому, щоб відправити сили до Дечжоу і завадити Цюй Їнґуану втекти. Ледь пригадуючи події минулої ночі, Чжан вирішує..."
 shandong_events.3.a: "Перекрити дороги, Цюй Їнґуан точно тікає"
 shandong_events.3.b: "Відправити людей до будинку Цюй Їнґуана"

 shandong_events.971.t: "Дзюнносуке Дате атакує Цюй Їнґуана в Дечжоу"
 shandong_events.971.d: "Війська Дзюнносуке Дате прибули до Дечжоу, зустрівши сильне суспільне неприйняття, навіть сильніше, ніж зазвичай. Одразу стало зрозуміло, що місто перейшло під контроль «Жень ци» та Цюй Їнґуана. Дате відправив кавалерію на пошуки Цюя, попри небезпеку можливого зіткнення з силами [QIE.GetNameDef]. Цюя знайшли біля храму Хайдо Цзіньшань, де він вшановував предків. Солдати Дате схопили його, і почалася сутичка між ополченцями «Жень ци» та кавалерією. На щастя, Дате привіз достатньо вогневої моці, аби знищити і ополчення, і самого Цюй Їнґуана. На жаль, велика кількість свідків у Дечжоу вимагала значно масштабнішої бійні, аби змусити всіх замовкнути. Наприкінці битви храм палав, а Дате відступав до Цзінаня, намагаючись вигадати хоч якесь алібі."
 shandong_events.971.a: "То був храм боксерів, нікому не буде діла"

 shandong_events.972.t: "Сунь Дяньїн не зміг знайти Цюй Їнґуана в Цюйфу"
 shandong_events.972.d: "Солдати, відправлені до Цюйфу, знайшли те, що хотіли, але не те, що було потрібно. Після погроз насильства з боку Дяньїна та спалення кількох кварталів мешканці втекли, поки тривали пошуки Цюй Їнґуана. Хоча було безліч доказів того, що «Жень ци» використовували маєток, ні Цюя, ні герцога Яньшеня знайти не вдалося. Чжан Цзунчан кілька днів чекав на відповідь і зрештою отримав від Дяньїна найсмиренніші вибачення та подарунки з конфуціанського маєтку. Ці дари мало вгамували гнів Чжана, який негайно вирушив із японською кавалерією до Дечжоу, розлючений тим, що не послухав поради Дате. Прибувши туди, Чжан не знайшов навіть сліду Цюй Їнґуана. Зіткнувшись із небезпекою проведення рейду на територію [QIE.GetNameDef] лише на основі здогадок Дате, Чжан вирішив, що розслідування закінчено, і повернувся до Цзінаня продовжувати цькування Ігуаньдао."
 shandong_events.972.a: "Принаймні я отримав подарунки"

 shandong_events.4.t: "Чжан Цзунчан надсилає алібі до [QIE.GetNameDef]"
 shandong_events.4.d: "Кілька збірок поезії та коментар до класики стали дуже в пригоді Чжан Цзунчану в цей момент. Листи, що раніше містили ганебні помилки та незграбні ієрогліфи, тепер перетворилися на вишукане «золоте алібі», яке Чжан надіслав до [QIE.GetNameDef]. У ньому він пояснює причини нещодавньої паніки в Дечжоу і запевняє, що це не має турбувати Пуї або У Пейфу. Лист малює картину провінції, наповненої бандитами та шахраями. Таке середовище, пояснюється в листі, породжує безпідставні чутки про моральний занепад у Шаньдуні, які роздмухують пройдисвіти на кшталт Чжан Тяньраня. Крім того, Чжан додав, що знайшов і ліквідував осередок Гоміньдану в провінції, тож немає причин хвилюватися через «зрадників імператора», що б вони не заявляли."
 shandong_events.4.a: "Тут нема на що дивитися, проходьте мимо"

 shandong_events.5.t: "Цінські магістрати заарештовують Чжан Цзунчана"
 shandong_events.5.d: "Сунь Дяньїн був дурнем. Поки він палив та грабував маєток Цюй Їнґуана, сам Цюй був уже на півшляху до Пекіна. Попри виправдання Дяньїна та спроби викрити змовників, Цзінань залишився беззахисним перед великим контингентом [QIE.GetAdjective] піхоти, що увійшла в місто. Гірше того, Чжан Цзунчан навіть не підозрював, що солдати прийшли його заарештувати. Його лист із в'язниці до імператора з проханням дозволити відвідування родини був відхилений. Тепер у Чжана з'явилося «четверте невідоме» — невідомо, коли його випустять на волю за численні злочини. Нещодавно одна з багатьох дитини Чжана підійшла до Цюй Їнґуана, питаючи, чи виживе батько в ув'язненні."
 shandong_events.5.a: "Твій татко буде в порядку у в'язниці"

 shandong_events.6.t: "Тайшань обурена поведінкою Чжан Цзунчана"
 shandong_events.6.d: "Учителю Чжан Тяньраню не знадобилося багато часу, аби дізнатися про Лу Чжуньцзє. Першою реакцією стало прохання повернутися на гору Тайшань для лікування його давно минулої хвороби. Ці листи Чжан Цзунчан ігнорував, бажаючи ще більше дошкулити вчителю та принизити його публічним читанням цих послань. Нарешті, останній лист, отриманий сьогодні, набув значно похмурішого тону. Він був адресований мешканцям Цзінаня: Чжана звинувачували в контрабанді опіуму, зраді китайців заради західних партнерів по іграх та спробі взяти Лу Чжуньцзє за дружину. Чжан Тяньран зажадав, аби Чжан Цзунчан прийшов на гору Тайшань на вічний суд, інакше народ Шаньдуна згине, щоб покарати свого лідера. Сунь Дяньїн рекомендує піти на конфронтацію і «очистити» гору від мешканців, тоді як інший командир, Чжан Цзіняо, радить просто перечекати, поки вчитель не затихне."
 shandong_events.6.a: "Ходімо, подивимося на цих аскетів"
 shandong_events.6.b: "Я почекаю на його відчайдушні листи"

 shandong_events.7.t: "Чжан Тяньран вершить суд над Чжан Цзунчаном"
 shandong_events.7.d: "Загін Чжан Цзунчана прибув до воріт Дай Мяо; його підошви вже втомилися від 6600 сходинок. Дяньїн запропонував сховати зброю і відкрити вогонь, щойно їх впустять. Коли Чжан Цзунчан проходив під воротами Чжен'ян, його смертельно поранив снайпер із вершини воріт. Дяньїн намагався штурмувати подвір'я з тими людьми, що в нього лишилися, але Цзіняо втік разом із ар'єгардом. Дяньїн також був убитий, а місцезнаходження Чжан Цзіняо наразі невідоме. Шанованого вчителя Чжан Тяньраня зустріли в Цзінані достроковим святкуванням Нового року, де він зачитав свій останній лист до Чжан Цзунчана перед радісним натовпом."
 shandong_events.7.a: "Оголошую цей день святом!"

 shandong_events.8.t: "Чжан Цзунчан рятує Цзінань від рейду Ігуаньдао"
 shandong_events.8.d: "Наступні тижні в Цзінані показали, наскільки далеко поширився вплив Чжан Тяньраня. Люди паплюжили офіс Чжан Цзунчана, а кілька колишніх друзів написали йому листи з вимогою схилитися перед Ігуаньдао. У відповідь Чжан наказав командирам зайняти стіни Цзінаня, обшукувати всіх підозрюваних членів секти і відбирати все підозріле. Серед конфіскованого були отрути, підписані як ліки, стрілецька зброя та прокляття на адресу Чжана. Сьогодні, коли Чжан Цзунчан проводив чергове читання листів Тяньраня, супроводжуючи це роздумами про зло Ігуаньдао, в місто увірвався натовп фанатиків. Солдати швидко вступили в бій з озброєними сектантами, а японська кавалерія вигнала решту геть. Чжан Тяньран, намагаючись сховати свою лису голову, був вистежений і застрелений кавалеристами."
 shandong_events.8.a: "Нарешті народ бачить мою правду"

### Focus tree related events ###
 shandong_events.9.t: "Бунт Ігуаньдао та селян"
 shandong_events.9.d: "Після звісток про вбивство Чжан Тяньраня під час нападу на Цзінань тисячі жалобників прибули до міста, аби відшукати рештки шанованого вчителя. Коли поширилася чутка, що Чжан Цзунчан наказав поховати Тяньраня та всіх бійців Ігуаньдао без почестей у братській могилі, Шаньдун охопила паніка. Вцілілі члени секти по всій провінції почали агресивно атакувати поліцейських та землевласників. Городяни, боячись як фанатиків, так і демонізованої кліки Чжана, почали відгороджуватися від зовнішнього світу. Вони не підкоряються жодній владі, тож із цим треба щось робити."
 shandong_events.9.a: "Убий двох лисих — і всі з’їдуть із глузду!"

 shandong_events.1000.t: "Удар по Нанкіну"
 shandong_events.1000.d: "Смерть Суня занурила Східний Китай у хаос. Пожежі, грабунки та бандитизм стануть нормою для регіону, але водночас це дає золотий шанс. Гегемонія Чжилі закінчилася, вакуум влади в Китаї стрімко зростає, і якщо ми скористаємося моментом та візьмемо Нанкін під контроль, нам гарантована провідна роль у майбутній боротьбі за долю країни. Вище командування радить нам рушити на південь до старої столиці та закріпити статус одного з головних гравців Китаю."
 shandong_events.1000.a: "Нанкін буде нашим!"
 shandong_events.1000.b: "Нам слід зачекати й подивитися..."

 shandong_events.11.t: "Військові проєкти в Шаньдуні"
 shandong_events.11.d: "Вже стає очевидним, що армія Шаньдуна відстає від часу. Поки ми витрачали сили на підняття стандарту нашого спорядження, ми не наважувалися виходити за межі того, що можемо купити. Армійське командування переконало [SHD.GetLeader] виділити ресурси на проєкти чеського мешканця Шаньдуна на прізвище Ганчтеделай. Він планує перетворити кілька своїх автомобілів Studebaker на примітивні танки. Другий план — закупити велосипеди «Летючий голуб» у Тяньцзіні та навчити дивізію користуватися ними. Третій план, запропонований професором Цзінанського університету, полягає в закупівлі альпіністського спорядження та підготовці солдатів до виживання в численних гірських хребтах Китаю."
 shandong_events.11.a: "Побудувати танк"
 shandong_events.11.b: "Сформувати велосипедні підрозділи"
 shandong_events.11.c: "Підготувати гірських стрільців"

 shandong_events.12.t: "Розслідування зникнення вантажів"
 shandong_events.12.d: "Протягом останніх кількох місяців на залізниці Ціндао — Цзінань порушується важлива торгівля. Поліцейське розслідування встановило лише те, що це не працівники залізниці, інші версії поки не виключені. [SHD.GetLeader] прибув особисто, щоб наглядати за розслідуванням, поки воно не переросло у гучний скандал. Поліція, яка з пересторогою ставиться до китайських прикордонників за межами Ціндао, запропонувала спочатку перевірити залізничні станції перевалки. [SHD.GetLeader], навпаки, підозрює, що товари крадуть на безлюдних ділянках між Ціндао та Цзінанем. Що ми перевіримо першим?"
 shandong_events.12.a: "Перевірити залізницю"
 shandong_events.12.b: "Перевірити кордон"

 shandong_events.13.t: "Докази бандитизму на залізниці?"
 shandong_events.13.d: "Передчуття [SHD.GetLeader] було правильним. Поліція, відправлена на огляд безлюдних ділянок залізниці, виявила підозрілі конструкції, приховані під кущами. Це виявилися подушки та ремені для багажу. Немає сумніву, що зловмисники просто скидали здобич із потяга на ходу, після чого її перевозили в інше місце. Начальник поліції переконаний, що це справа рук бандитів, і просить підкріплення, аби прочесати лігва у Східному Шаньдуні."
 shandong_events.13.a: "Так, візьміть цих людей"

 shandong_events.14.t: "Докази хабарництва на прикордонних пунктах"
 shandong_events.14.d: "Поліція мала рацію — прикордонна станція була дуже підозрілою. На перший погляд, маленька халупа, де живуть охоронці, ледь вміщувала п'ятьох людей. Проте під підлогою було виявлено величезну порожню нішу. Не знайшовши логічного пояснення для такого простору, начальник поліції вирішив заарештувати вартових. Хоча є ризик розлютити наших продавців у Ціндао, закон і справедливість на нашому боці."
 shandong_events.14.a: "Допитати вартових станції"

 shandong_events.15.t: "Облога бандитів"
 shandong_events.15.d: "Просуваючись грунтовою дорогою, солдати натрапили на табір ополчення. На щастя, вони встигли попередити начальника поліції, який з дозволу [SHD.GetLeader] взяв бандитів в облогу за підозрою у крадіжці. Облога призвела до кількох смертей, і вранці від бандитів надійшла пропозиція: вони віддають усе майно, крадене й власне, в обмін на свободу, зброю та життя."
 shandong_events.15.a: "Гроші для нас ніщо — загиньте!"
 shandong_events.15.b: "Капітуляція рятує життя, ми згодні"

 shandong_events.16.t: "Прикордонники заарештовані, зізналися у контрабанді"
 shandong_events.16.d: "Вартові швидко зламалися під час допиту. Вони розповіли, що бідність штовхнула їх на злочин: один зупиняв потяги з Ціндао, а інший крав речі з вагонів. Вони благають про в'язницю замість страти, пропонуючи все награбоване як заставу. Втім, [SHD.GetLeader] вирішив довести справу до страти, оскільки в'язниці Цзінаня і без того переповнені."
 shandong_events.16.a: "Правосуддя має бути справедливим понад усе."

 shandong_events.17.t: "Наша залізниця в безпеці"
 shandong_events.17.d: "Коли звістка про те, що [SHD.GetLeader] викрив залізничних злодіїв, розлетілася Шаньдуном, багато хто не повірив. Люди настільки звикли до корумпованого та неосвіченого правління з Цзінаня, що цей крок у правильному напрямку повернув надію на уряд. Рух потягів також пожвавився — доказ того, що наші дії не завадили справам у Ціндао."
 shandong_events.17.a: "Тепер ми можемо покращити залізницю."

 shandong_events.18.t: "Бандити виставили приманку та втекли до Хебея"
 shandong_events.18.d: "З боку бандитського табору почалося дивне видовище. Через бінокль [SHD.GetLeader] побачив, як бандити подають знаки про готовність здатися. Кілька з них почали виходити з укриття з куфрами. Згодом, на загальний подив, кілька бандитів вийшли зовсім голими, кинули зброю і почали тягти скрині до нашої лінії оборони. Шокований [SHD.GetLeader] наказав не стріляти і пропустити цих божевільних. Солдати так реготали з принижених грабіжників, що ніхто не помітив, як основна група бандитів вислизнула через ліс. У метушні голих бандитів застрелили, але інші втекли з території Східного Шаньдуна."
 shandong_events.18.a: "Ми в халепі, народ"

 shandong_events.31.t: "Біженці вимагають, щоб Цюй Їнґуан врятував їхні родини"
 shandong_events.31.d: "Комітет небайдужих громадян прийшов сьогодні до офісу [SHD.GetLeader] із пропозицією. Численні родини в Цзянсу, Аньхої та інших провінціях розірвані війною Ліги. Тисячі людей застрягли на лінії фронту. Комітет пропонує порушити політику нейтралітету і створити добровольчу групу для порятунку сімей жителів Шаньдуна. Це неминуче втягне провінцію в конфлікт на боці однієї зі сторін, і якщо ці добровольці підтримають тих, хто програє, нам варто чекати ворожості з півдня."
 shandong_events.31.a: "Ні, ми маємо дотримуватися обраного курсу"
 shandong_events.31.b: "Звісно, але підуть лише найхоробріші"

 shandong_events.32.t: "[QIE.GetNameDefCap] надсилає допомогу для припинення заворушень"
 shandong_events.32.d: "Визнаючи необхідність підтримувати нашу провінцію міцною перед загрозою безглуздих республіканців, [QIE.GetNameDef] вирішили надіслати нам додаткові війська для придушення бунтів. Губернатор [SHD.GetLeader] висловив безмежну вдячність [QIE.GetNameDef] за відновлення порядку та захист провінції від іноземного впливу. Зрештою, хіба не природно, що там, де знайшли один осередок Гоміньдану, знайдуть і інший?"
 shandong_events.32.a: "Ми вічно вдячні, мій імператоре"

 shandong_events.33.t: "Фентянь підтримує Чень Тяоюаня"
 shandong_events.33.d: "Уряд Фентяня, з яким ми перебуваємо у вільному союзі, вирішив підтримати Чень Тяоюаня з Аньцінської кліки в його конфлікті проти Ліги. Репутація Ченя значно вища за [SHD.GetLeader], а наша власна репутація працює проти нас. Хоча це має підвищити наші шанси проти Ліги, це також означає, що через підтримку Фентяня ми не зможемо просто так виступити проти Аньціна після війни."
 shandong_events.33.a: "Добре"

 shandong_events.34.t: "Фентянь відмовляється від інтервенції"
 shandong_events.34.d: "Фентянь повідомив нас, що більше не втручатиметься в нашу суперечку з Аньціном, заявляючи, що нас неможливо примирити. Це прикро, бо це також означає, що вони не підтримають нас у війні проти Аньцінської кліки, яку ми маємо розпочати негайно."
 shandong_events.34.a: "Настав час для удару."

 shandong_events.35.t: "Переговори з Фентянем провалилися"
 shandong_events.35.d: "Спроба Фентяня стати посередником між нами та Аньцінською клікою Чень Тяоюаня провалилася. Ми маємо діяти негайно, поки Чень не встиг зреагувати."
 shandong_events.35.a: "Настав час для удару."

 shandong_events.36.t: "Угода з Аньціном укладена"
 shandong_events.36.d: "Нам вдалося домовитися з Аньцінською клікою. Це означає, що у нас буде час підготувати подальші кроки, поки вони розбираються з Гоміньданом. Важливо розуміти, що ця угода не є постійною, і ми намагатимемося змінити її на нашу користь, якщо зможемо."
 shandong_events.36.a: "Крихкий мир."

 shandong_events.37.t: "Дипломат Аньціна звертається до нас"
 shandong_events.37.d1: "Хоча нещодавня пропозиція Фентяня не була прийнята обома сторонами, дрібний аньцінський дипломат знайшов сміливість попросити аудієнції у Чжан Цзунчана, аби обговорити мирну угоду без втручання Фентяня. Чжан, перебуваючи в нетипово доброму гуморі, вислухав його. Наразі ми утримуємо територію, яку Аньцін вважає критично важливою. Дипломат сказав, що Аньцін готовий до миру, якщо ми відмовимося від земель за межами Цзянсу. Це непогана ідея, адже ці землі важко контролювати, і вони не приносять багато користі. Тимчасовий мир також дасть нам час підготуватися."
 shandong_events.37.d2: "Хоча пропозиція Фентяня провалилася, аньцінський дипломат прийшов до Чжан Цзунчана обговорити мир без посередників. Наразі ми утримуємо територію лише на півночі провінції Цзянсу. Дипломат заявив, що Аньцін погодиться на мир, якщо ми залишимо собі лише ці здобуті землі. Це розумно, бо спроба захопити більше призвела б лише до опору. Тимчасовий мир дасть нам час на підготовку."
 shandong_events.37.d3: "Дипломат з Аньціна шукав зустрічі з Чжан Цзунчаном для обговорення миру. Ми не змогли захопити нових територій, але посланець каже, що Аньцін готовий поступитися всією Цзянсу в обмін на мир. Це чудова новина, бо саме Цзянсу є нашою головною ціллю. Тимчасовий мир дозволить нам закріпитися."
 shandong_events.37.d4: "Аньцінський дипломат звернувся до Чжан Цзунчана. Ми не здобули нових земель, але він каже, що Аньцін готовий віддати Сюйчжоу — західну частину Цзянсу — заради миру. Це великий успіх і крок до майбутніх здобутків. Тимчасовий мир дасть нам необхідний час."
 shandong_events.37.a: "Зробімо це."
 shandong_events.37.b: "Краще вдарити зараз."

 shandong_events.38.t: "Фентянь підтримує нас"
 shandong_events.38.d: "Конфлікт з Аньціном переріс у війну, але, на щастя, фентянський уряд вирішив підтримати нас, а не Чень Тяоюаня."
 shandong_events.38.a: "Добре."

 shandong_events.39.t: "Фентянь підтримує Аньцін"
 shandong_events.39.d: "Конфлікт з Аньціном переріс у війну, проте фентянський уряд вирішив підтримати Чень Тяоюаня, а не нас!"
 shandong_events.39.a: "Погано."

 shandong_events.40.t: "Питання Аньціна"
 shandong_events.40.d1: "Тепер, коли Гоміньдан розгромлено, нам більше не потрібно підкорятися бажанням Чень Тяоюаня. Чень вважає себе кращим за інших через підтримку руху проти концесій, але ми всі знаємо, що це лише вистава. Ми більше не можемо дозволити собі залишатися замкненими лише в межах Шаньдуна. Ми повинні захопити контроль принаймні над Цзянсу (штати Сюйчжоу, Яньчен, Наньтун). Ми негайно надішлемо телеграму до Фентяня, щоб забезпечити виконання цього плану."
 shandong_events.40.d2: "Тепер, коли Гоміньдан розгромлено, нам більше не потрібно підкорятися бажанням Чень Тяоюаня. Хоча ми вже взяли під контроль частину провінції Цзянсу (штати Сюйчжоу, Яньчен, Наньтун), ми повинні прагнути захопити решту! Ми негайно надішлемо телеграму до Фентяня, щоб домогтися цього."
 shandong_events.40.d3: "Тепер, коли Гоміньдан розгромлено, нам більше не потрібно підкорятися бажанням Чень Тяоюаня. Ми контролюємо всю провінцію Цзянсу, але аньцінський Чень Тяоюань точно не змириться з цим назавжди. Ми негайно надішлемо телеграму до Фентяня, аби вони не віддали нашу територію йому."
 shandong_events.40.a: "Чекатимемо на їхню відповідь."

 shandong_events.41.t: "Навчальна місія до Шаньдуна"
 shandong_events.41.d: "Шаньдунська кліка гостро потребує додаткових військ, аби протистояти Лізі. Чи варто нам відправити до них велику навчальну місію? Хоча їхня перемога значно посилила б наш вплив у Китаї, ця місія на певний час обмежить наші власні можливості щодо підготовки кадрів."
 shandong_events.41.a: "Зробімо це"
 shandong_events.41.b: "Це не варте витрат"

 shandong_events.42.t: "Фентянська навчальна місія"
 shandong_events.42.d: "Фентянський уряд, підтримуючи наші зусилля, надіслав нам велику навчальну місію, що складається з китайських та японських інструкторів та інших офіцерів. Це має допомогти нам створити велику армію, необхідну для конфлікту з Лігою."
 shandong_events.42.a: "Чудові новини"

 shandong_events.43.t: "[QIE.GetNameDefCap] не надсилає допомоги"
 shandong_events.43.d: "Не вбачаючи потреби у допомозі Шаньдуну, [QIE.GetNameDef] відхилив запит [SHD.GetLeader] про направлення полку армії для втихомирення нещодавніх заворушень! Губернатор [SHD.GetLeader] висловлює глибоке розчарування цим недалекоглядним рішенням Пекіна. Схоже, наразі ми можемо розраховувати лише на себе."
 shandong_events.43.a: "Прокляття!"

 shandong_events.100.t: "Інженерів спіймано на продажі морських секретів Шаньдуну"
 shandong_events.100.d: "Кемпейтай розкрив змову кількох морських інженерів суднобудівної корпорації «Кавасакі», які планували продати креслення кораблів Шаньдуну. Жандармерія готова зупинити угоду та заарештувати змовників, але можливе інше рішення. Якщо Кемпейтай повідомить корпорації «Кавасакі», що вони можуть продати проєкти легально, компанія сама заарештує зрадників, а ми отримаємо прибуток від офіційного продажу. Це ризикована пропозиція, але оскільки Шаньдун занадто малий, щоб стати морським суперником, шкода для національної безпеки буде мінімальною."
 shandong_events.100.a: "Попередити «Кавасакі», дозволити продаж"
 shandong_events.100.b: "Ні, негайно зупинити продаж!"

 shandong_events.101.t: "Японські інженери продають нам креслення"
 shandong_events.101.d: "Таємна угода пішла не за планом, але продаж таки відбувся. Незадовго до транзакції корпорація «Кавасакі» повідомила нам, що отримала дозвіл на легальний продаж військово-морських проєктів. Інженери, з якими ми контактували, тепер у в'язниці. Цей несподіваний поворот подій виглядає підозріло, але результат наразі нас влаштовує."
 shandong_events.101.a: "Це було близько"

 shandong_events.102.t: "Японські інженери заарештовані до продажу"
 shandong_events.102.d: "Таємна угода провалилася, і ми втратили зв'язок із японськими інженерами. Вважається, що їх заарештували під час масштабної облави в корпорації «Кавасакі». Цей несподіваний поворот подій є поганим знаком, а наші інвестиції в креслення втрачено."
 shandong_events.102.a: "Ми це запам'ятаємо"

 shandong_events.991.t: "Чжан Цзунчан та селянський бунт"
 shandong_events.991.d: "Народ Шаньдуна — налякані та розгублені душі, вони думають, що уряд зник назавжди. Ми нагадаємо їм про обов'язок перед землею, яку вони не можуть покинути. Люди «іву», яких найняв Чжан Цзунчан, все ще грабують китайців, і їх треба схопити. Хоча ницість Чжан Цзунчана була очевидною, багато хто сьогодні все ще лютує через його смерть. Ми відмовили всім, хто хотів приїхати до Цзінаня на похорон Чжана — це краще, ніж він на те заслуговує."
 shandong_events.991.a: "На похороні й так забагато людей..."

 shandong_events.992.t: "Паніка через реставрацію Цін у Шаньдуні"
 shandong_events.992.d: "Після тріумфального повернення Цюй Їнґуана до Шаньдуна цінські магістрати публічно реквізували залишки кліки Чжана, наказавши їм підкоритися. На щастя, обізнаність Цюя з військовими традиціями провінції допомогла знайти потрібні хабарі, щоб змусити більшість збройних сил присягнути на вірність. Дивно, але його заклик підтримали навіть антибандитські селянські армії півдня. На жаль, лідери кліки Чжана та фанатики Ігуаньдао мають інші плани. Ми повинні захистити городян від цих новоявлених розбійників."
 shandong_events.992.a: "Відновити доброзичливість буде непросто"

 shandong_events.21.t: "Цюй Їнґуан просить [QIE.GetNameDef] про допомогу проти бунтів"
 shandong_events.21.d: "Після того як пекінські магістрати заарештували мерзенного мілітариста Чжан Цзунчана, їм доручили зібрати звіт про його злочини. Тому стало несподіванкою, коли новий губернатор Шаньдуна, Цюй Їнґуан, надіслав копію цих свідчень прямо імператору. Ці свідчення не лише засуджують Чжана, але й вказують на тривалу нестабільність, спричинену його режимом. Цюй Їнґуан прозоро натякає, що Пекін має надати військову допомогу для забезпечення порядку в провінції. Ми схильні допомогти йому, якби не безліч інших важливих завдань, запланованих начальником штабу для нашої жандармерії. Що нам робити?"
 shandong_events.21.a: "Добре, відправте дивізію на допомогу"
 shandong_events.21.b: "Ні, у нас є нагальніші справи"

### 400 - 409 Natpop Flavour Events

 shandong_events.400.t: "Матір Чжао приєднується до Чжан Тяньраня"
 shandong_events.400.d: "У морі біженців, що тікають із північно-східного Китаю, шанованому вчителю Чжан Тяньраню дають багато обіцянок. Багато селян довірили Чжану все своє майно, інші присягнули битися в лавах «Червоних списів» за Шаньдун. Сонячного дня до Чжан Тяньраня підійшла жінка у зимовому одязі з Пекіна. Гвардія Ігуаньдао стверджує, що вона така ж матріарх, як і дружина Чжан Тяньраня, Сунь Сучжень, але вона стоїть перед ним із двома пістолетами на поясі. Чжао Хун Веньґо, мати лідера пекінських студентів Чжао Дуна, прибула, аби запропонувати послуги своєї родини секті. Вона заявляє, що робить це не з релігійної відданості чи фінансової потреби, а тому, що Ігуаньдао здається їй єдиним справжнім оплотом опору проти японської агресії, що загрожує її дому. Шанований учитель погоджується і підтверджує свою обіцянку ніколи не співпрацювати з японцями в обмін на фінансову та тактичну допомогу її родини. Чжао Хун Веньґо також наполягає на тому, аби очолити дивізії «Червоних списів» та «Великих мечів» у чині повного фельдмаршала."
 shandong_events.400.a: "Її рішучість не залишає сумнівів у її здібностях."

 shandong_events.401.t: "Чжан Тяньран публікує «Тимчасовий етикет»"
 shandong_events.401.d: "Чжан Тяньран давно стверджував, що вчення буддизму та Конфуція є невід'ємними аспектами китайського суспільства. У внутрішньому колі Ігуаньдао розгорілася суперечка між Чжаном та Сунь Сучжень про те, як краще залучити освічені верстви Шаньдуна. Разом вони підготували книгу «Тимчасовий етикет», покликану продемонструвати повагу секти до духовної спадкоємності китайського лідерства. Для Чжана, колишнього дрібного чиновника при Юань Шикаї, духовна лінія диктаторів Китаю йшла від регента Цзайфена до Юань Шикая і, зрештою, до імператора Пуї. Проте для Сунь Сучжень духовна спадкоємність належала Сунь Ятсену, і після його смерті в Китаї наразі немає істинного духовного лідера. Інтерпретація Чжана відповідає його домовленості про підтримку Пуї як імператора, але ігнорує джерело духовної підтримки південних ідеалістів."
 shandong_events.401.a: "Чжан має рацію, славте Пуї"
 shandong_events.401.b: "Сунь має рацію, славте Сунь Ятсена"

 shandong_events.402.t: "Чжан Тяньран попереджає про Маха-кальпу"
 shandong_events.402.d: "Пророцтво про Маха-кальпу, яке раніше обговорювали лише в храмах, Чжан Тяньран вирішив розкрити широкому загалу на публічному мітингу. Для Ігуаньдао історія світу ділиться на три періоди миру та варварства, представлені трьома сонцями. Остання епоха, Червоного сонця, закінчилася Синьхайською революцією. Чжан посилається на конфуціанського мислителя Кан Ювея, стверджуючи, що настає третя ера — Датун, або Маха-кальпа. Скоро, за словами Чжана, китайський народ досягне расової досконалості або буде знищений іноземцями, такими як японський імператор чи британська імперія.\n\nДля стривожених жителів Шаньдуна єдиним конкретним висновком із цих езотеричних промов стало те, що вони мають наполегливіше працювати заради національного об'єднання, що лише посилило їхнє почуття екзистенційної боротьби."
 shandong_events.402.a: "Можливо, варто було розкрити це раніше"

 shandong_events.403.t: "Низький врожай у Шаньдуні"
 shandong_events.403.d: "Голод довгий час спустошував Китай, забираючи безліч життів і тримаючи нас у залежності від поставок зерна. Причиною є надмірна відданість традиційному землеробству, але спроба змінити його розлютить фермерів, які тисячоліттями використовують перевірені методи. Ми могли б почати впроваджувати нові західні технології, ризикуючи відштовхнути прихильників, або ж відправити значну частину «Червоних списів» на допомогу фермерам, аби запобігти голоду."
 shandong_events.403.a: "Таємно розповсюдити добрива"
 shandong_events.403.b: "Відправити «Червоні списи» на поля"

 shandong_events.404.t: "Буддійський монах Цзюйцзань оголошує Чжан Тяньраня єресіархом"
 shandong_events.404.d: "Наші брати-буддисти в Хунані розпочали кампанію наклепів! Вчитель Цзюйцзань оголосив Ігуаньдао єрессю, а Чжан Тяньраня — єресіархом! Це засудження вже спричиняє розкол у нижчих ланках нашої організації. Управителі повідомляють, що кілька багатих буддійських спонсорів перестали з'являтися в храмі. Майбутні вчителі на Тайшані вже почули новини, і дехто з них покинув секту. Для Чжана вчитель Цзюйцзань — лише фанатичний сектант, що прагне зруйнувати духовну цілісність Китаю та завадити настанню Маха-кальпи."
 shandong_events.404.a: "Відправити «Червоні списи», щоб знайти та спалити памфлети Цзюйцзаня"

 shandong_events.405.t: "Колишня вчителька Лу Чжуньцзє схоплена"
 shandong_events.405.d: "Хоча Чжан Тяньран є 18-м патріархом Ігуаньдао, шрами від розколу з Лу Чжуньцзє залишаються. Після того як вона вдруге втекла з Шаньдуна, її помічали рідко. Наші люди дізналися, що Цзюйцзань спілкувався з нею перед публікацією наклепів, і «Червоні списи» таємно вирушили до Хунані. Одному з наших лояльних керівників вдалося вистежити її та повернути назад. Тепер у внутрішньому колі точаться суперечки: Чжан та Сунь Сучжень побоюються, що жива Лу Чжуньцзє надихатиме дисидентів вважати її реінкарнацією Ґуаньїнь. Проте Сюе Дянь наполягає, що вона занадто слабка, аби становити загрозу, і вимагає залишити її під домашнім арештом без шкоди для здоров'я."
 shandong_events.405.a: "Ув'язнити, але не завдавати їй шкоди!"
 shandong_events.405.b: "Ігнорувати Сюе Дяня, Лу Чжуньцзє має померти!"

 shandong_events.406.t: "Товариство Червоної Свастики покидає Ігуаньдао"
 shandong_events.406.d: "Товариство Червоної Свастики, наш колишній союзник часів режиму Чжан Цзунчана, остаточно розірвало зв'язки з нами. Ця новина стала несподіванкою навіть для шанованого вчителя. Проте Сунь Сучжень вбачає в цьому підтвердження своєї правоти — вона завжди виступала проти військового позерства. Вона дорікає Чжану, стверджуючи, що це логічний наслідок спроб поєднати війну з благодійністю. Тим часом керівники середньої ланки применшують втрату, заявляючи, що товариство було просто підкуплене американською християнською асоціацією YMCA."
 shandong_events.406.a: "У всьому винен американський долар"

 shandong_events.407.t: "Чжан Тяньран таємно зустрічається з Цунесабуро Макіґуті"
 shandong_events.407.d: "Шанований учитель Чжан Тяньран встановив контакт із японським товариством Сока Ґаккай. Ця буддійська організація зазнає утисків від японського уряду через виступи проти інтервенції в Китай. Лист Чжана до Цунесабуро Макіґуті був опублікований в обох країнах, наголошуючи на спільній відданості Лотсовій сутрі. Схоже, японська громадськість сприйняла цей жест позитивно. Наші японські брати ще можуть змінити ситуацію на нашу користь."
 shandong_events.407.a: "Потрібно шанувати достойних японців"

 shandong_events.408.t: "Чжан Тяньран надсилає листа секті Каодай"
 shandong_events.408.d: "Шанований учитель встановив контакт із лідером секти Каодай у В'єтнамі. Ця група отримує послання від божественної сили, яка нібито об'єднує людство всіх рас. Чжан сподівається зміцнити зв'язки з в'єтнамськими братами. Їхній нинішній лідер, Фам Конґ Так, організував ополчення, подібне до наших «Червоних списів», аби захистити землю від німецького релігійного абсолютизму. Попри давню ворожнечу між китайцями та в'єтнамцями, спільна віра може об'єднати нас."
 shandong_events.408.a: "Потрібно шанувати достойних юе"

 shandong_events.409.t: "Чжан Тяньран надсилає листа Кім Кьохону"
 shandong_events.409.d: "Шанований учитель зв'язався з організацією Теджонґьо в Кореї. Це шляхетна група послідовників косіндо, які бачать наскрізь брехню японських імперіалістів і борються за незалежність. Вони відомі завдяки колишньому лідеру На Чхолю, який покінчив із собою у 1916 році через неможливість визволити Корею та Маньчжурію. Завдяки цьому ми можемо посилити свій вплив на корейських націоналістів."
 shandong_events.409.a: "Потрібно шанувати достойних корейців"

 shandong_events.410.t: "Цюй Їнґуан просить допомоги у Пекіна"
 shandong_events.410.d: "Туман розгубленості розсіявся над Шаньдунем, і з нього вийшла одна людина: Цюй Їнґуан. Саме він допоміг викрити злочини Чжан Цзунчана, за що і був призначений губернатором. Тепер Цюй звертається до уряду в Пекіні з проханням допомогти відновити порядок, посилаючись на бунти. Існують побоювання, що провінція може знову потрапити до рук чергового варлорда або Гоміньдану. Невже ми дозволимо ще одному регіону відколотися?"
 shandong_events.410.a: "Нарешті губернатор зі здоровим глуздом"
 shandong_events.410.b: "Ми йому не довіряємо"

 shandong_events.411.t: "Пекіна обіцяє захист Шаньдуню"
 shandong_events.411.d: "Пекінська делегація погодилася і відправила загін солдатів для виявлення та арешту бандитів у Шаньдуні. Війська прибули до Цзінаня під радісні вигуки натовпу. Схоже, більшість повстанців, що виступали проти податків, склали зброю, а ті, хто чинив опір, тепер перебувають за ґратами."
 shandong_events.411.a: "Нарешті ми можемо зосередитися на внутрішніх справах"

 shandong_events.412.t: "Пекін відхиляє благання Цюй Їнґуана"
 shandong_events.412.d: "Делегація Пекіна непохитна і відмовляється надсилати війська. Не маючи легітимності, аби наказати повстанцям розійтися, генерал Цюй Їнґуан вирішив піти на хитрість. Кілька вільних підрозділів будуть відправлені для залякування бунтівників, переодягнені у [QIE.GetAdjective] форму. Залишається сподіватися, що повстанці не дізнаються, що ці солдати — не з Пекіна."
 shandong_events.412.a: "Ми маємо захищати себе самі"

 shandong_events.413.t: "Прибуття вигнаного воєначальника з Шаньдуна"
 shandong_events.413.d: "Хоча наша армія не відповідає західним стандартам лояльності, ми пишаємося своєю меритократією. Командири, яких ви бачите на полі бою, довели відданість лідеру. Проте перемога може залежати і від волі найманців, готових на все заради виживання. Ця людина прибула з буремного Шаньдуна, чиї кліки завжди покладалися на найманців. Генерал розповів сумну історію про те, як удача відвернулася від нього, і він прийшов до нас, готовий нарешті битися за праву справу. Важко сказати, чи він щирий, але ми маємо вирішити, чи вартий він місця в армії в ці зрадницькі часи."
 shandong_events.413.a: "Нам потрібна будь-яка допомога"
 shandong_events.413.b: "Гарна історія, але ми відмовимося"

### 414 - 423 Authdem Flavour Events

 shandong_events.414.t: "Кун Дечен ображає пекінських конфуціанських вчених"
 shandong_events.414.d: "Юний Кун Дечен, символ Товариства відновлення доброзичливості, почав привертати увагу громадськості. Як спадкоємець маєтку в Цюйфу, Кун Дечен уважно стежить за останніми філософськими розробками в конфуціанстві. У цій сфері такі пекінські світила, як У Пейфу та Чень Хуаньчжан, представили власні інтерпретації конфуціанського канону. Те, що відрізняє першу публікацію Кун Дечена від інших, — це його відмова від спроб відродити державне примусове благочестя. Поки У Пейфу та Чень Хуаньчжан засуджували свій час як нечестивий, Кун Дечен заявив, що кожна окрема родина в Китаї визначає благочестя через власні вчинки. Така відмова від партійності в релігії, яку він допомагає представляти, неабияк засмутила інтелектуалів у Пекіні."
 shandong_events.414.a: "Він ще дитина, ваша світлосте"

 shandong_events.415.t: "Цюй Їнґуан купує дворянські титули для союзників"
 shandong_events.415.d: "Титули герцога Яньшеня, маркіза Розширеної благодаті та інші дворянські звання були викуплені губернатором Цюй Їнґуаном під час нещодавнього економічного спаду в Пекіні. Це суто символічні жести з боку пекінської бюрократії, які не накладають на власника жодних зобов'язань, але їхній ефект залишається вагомим. Це дозволяє союзникам Цюя повернути частину честі, якої вони були позбавлені під час Синьхайської революції. Землевласницьке дворянство Шаньдуна тепер має легітимнішу позицію в межах кліки і може легше впливати на народ."
 shandong_events.415.a: "Дякую, ваша світлосте"

 shandong_events.416.t: "Голод у Шаньдуні, потрібна допомога від [QIE.GetAdjective]"
 shandong_events.416.d: "Цьогорічний врожай у Шаньдуні виявився гіршим, ніж прогнозували. Найімовірніше, це наслідок надмірного виснаження ґрунтів під комерційні посіви опіуму в роки правління Чжан Цзунчана. Цюй Їнґуан змушений вирішувати проблему дефіциту їжі, поки вона не призвела до масового голоду. Рішення губернатора полягає в тому, аби знову використати провінційні резерви та оплатити імпорт зерна з Хебея, де врожаї були щедрими. Цей тягар буде розділено з населенням через додаткове оподаткування."
 shandong_events.416.a: "Відтепер ми маємо економити зерно"

 shandong_events.417.t: "«Великі мечі» дезертирують від Ігуаньдао та пропонують допомогу"
 shandong_events.417.d: "Члени товариства «Великих мечів», які раніше присягнули на вірність Чжан Тяньраню, повернулися до Цзінаня, аби запропонувати свої мечі Цюй Їнґуану. Це сталося тому, що губернатор Цюй виконав одне з їхніх найпалкіших бажань — почав боротьбу з наркоторгівлею. Однак ці ополченці вимагають, щоб до них ставилися з такою ж повагою та платили таку ж платню, як і кадровим військовим, що створить додаткові проблеми для нашої скарбниці. Як ми відповімо?"
 shandong_events.417.a: "Нам потрібні професіонали, а не вони"
 shandong_events.417.b: "Нам потрібно значно більше людей, аби врятувати Китай"

 shandong_events.418.t: "Атака товариства «Жовтого піску», лідерів схоплено"
 shandong_events.418.d: "З Хенані прийшло новоявлене товариство «Жовтого піску» з історією, подібною до Ігуаньдао. Ці «праведні бандити» були витіснені з Хенані пекінським урядом і тепер повторюють старий девіз: «Знищити Цін, відновити Мін». Ця заїжджена фраза, очевидно, надихнула одного селянського лідера проголосити себе «Чу Дев'ятим» і очолити атаку на Дечжоу. На щастя, наші вартові були добре екіпіровані, аби впоратися з черговим «релігійним пробудженням»; вони захопили Чу Дев'ятого та розгромили товариство."
 shandong_events.418.a: "Коли вони вже навчаться?"

 shandong_events.419.t: "Товариство «Жовтого піску» повертається та зазнає поразки"
 shandong_events.419.d: "У храмі боксерів у Дечжоу знову спалахнуло насильство — товариство «Жовтого піску» знову підняло голову. Цього разу такий собі «Ван Шостий» здійснив несподіваний напад на місто, але був застрелений нашою охороною. З Кун Деченом порадилилися щодо того, як запобігти подальшим повстанням цього товариства. Юний Кун Дечен, розваживши, запропонував призначити в різні храми, де вшановують династію Мін, нових державних наглядачів. На думку Кун Дечена, втомлений народ Шаньдуна продовжує бунтувати лише через екзистенційну загрозу, яку він відчуває від поточної політичної ситуації."
 shandong_events.419.a: "Блискуча ідея, юначе!"

### 424 - 423 Patauto Flavour Events

 shandong_events.424.t: "Державний візит до Фентяня"
 shandong_events.424.d: "Чжан Цзунчан, намагаючись заручитися підтримкою Чжан Цзоліня, вирішив відвідати Шеньян. Проте переговори так і не відбулися: щойно «генерал-м'ясник» прибув до міста, він негайно взявся за пияцтво та розпусту. Кульмінацією стало те, що він запізнився на зустріч із Чжан Цзолінем на три години, будучи в абсолютно неадекватному стані через наркотики та алкоголь. На додачу він ще й висміяв старого маршала за його неграмотність!"
 shandong_events.424.a: "Я б краще поспілкувався із Чжан Сюеляном"

 shandong_events.425.t: "Чжан Цзунчан випускає збірку віршів"
 shandong_events.425.d: "Навіть Чжан Цзунчан не встояв перед чарами поезії і вирішив опублікувати книгу власних віршів. Це сталося за кілька років після його провальних «Коментарів до тринадцятикласся». Для багатьох читачів єдиною моральною порадою в тих коментарях були байки про те, як Конфуцій нібито схвалював багатоженство. Хоча якість віршів сумнівна, «генерал-м'ясник», здається, цілком задоволений собою, що дещо стримує його щоденну розпусту."
 shandong_events.425.a: "Навіть собака радіє кістці"

 shandong_events.426.t: "Друге видання генерала-м'ясника"
 shandong_events.426.d: "Чжан Цзунчан випустив свої другі «Коментарі до тринадцятикласся», де страшенно образив праці У Пейфу! Він назвав твори У Пейфу кон'юнктурними та такими, що відповідають пекінському стилю підпорядкування політичним інтересам замість абсолютної моралі. У коментарях генерал пише, що праці Мен-цзи добре відповідають нинішній кризі в Китаї, і проводить схвальне порівняння між першим імператором Цінь Ші Хуан-ді та молодим маршалом Чжан Сюеляном."
 shandong_events.426.a: "На щастя, батько Сюеляна не вміє читати"

 shandong_events.427.t: "Сонячні пси чи дощові?"
 shandong_events.427.d: "Чжан, сягнувши нових глибин ницості, вирішив забрати собі дружину командувача Сунь Дяньїна. Розлючений генерал Сунь вирішив шантажувати Чжан Цзунчана, погрожуючи викрити це бігамію, якщо той його не підвищить. «Генерал Собаче м'ясо», звісно, відомий ххітливістю, але викрадення дружини довіреного підлеглого накличе ганьбу на всю його армію. Чжан хоче зам'яти справу, але поступка може підірвати його авторитет серед офіцерів."
 shandong_events.427.a: "Сідайте, маршале"
 shandong_events.427.b: "Таксі! Я краще піду пішки"

 shandong_events.428.t: "Вугілля та генерал-м'ясник"
 shandong_events.428.d: "Скандал початку 1930-х років повернувся, аби знову переслідувати адміністрацію Чжана. Тоді він запровадив податок у 40 центів на експортне вугілля, аби нажитися на операціях у Ціндао. Податок був настільки високим, що жодна компанія його не платила. Проте видобуток у Східному Шаньдуні триває. Винайдено радикальне рішення: Чжан Цзунчан фінансує синдикат вугільників, щоб ті боролися проти власних босів. Цей крок передбачає домовленість із осередками Гоміньдану, аби ті підбурювали робітників до об'єднання. Штабу Чжана ця ідеологічна маніпуляція здається вирваною з підручника Янь Сішаня."
 shandong_events.428.a: "Бачу тут тінь ідей Сішаня?"

 shandong_events.429.t: "Бійка в борделі за посаду"
 shandong_events.429.d: "Чжан Цзунчан, чи то через затьмарення наркотиками, чи то заради розваги, призначив двох чоловіків на одну посаду начальника служби безпеки. Обидва дізналися про існування конкурента лише тоді, коли прийшли обіймати посаду. Шукаючи пояснень, вони вдерлися до кімнати Чжана, де застали його за звичними розвагами. Чжан, розважений їхнім збентеженням, наказав їм битися за посаду: хто переможе в бійці, той і отримає крісло. Поки чоловіки лупцювали один одного, Чжан та його дівчата весело спостерігали за видовищем."
 shandong_events.429.a: "Схоже, це була оргія в усіх сенсах"

 shandong_events.430.t: "Найдешевші ліки"
 shandong_events.430.d: "Загроза голоду повернулася до Шаньдуна через розширення торгівлі опіумом. Оскільки величезні площі земель віддані під посіви маку, людям доводиться затягувати паски. Раніше подавалися петиції до центрального уряду про допомогу. Для Чжана цей варіант занадто ризикований — інший мілітарист може виявити його плантації. Як наслідок, «генерал-м'ясник» зайняв фаталістичну позицію і наказав солдатам допомагати їжею лише тим, кого вони вважатимуть «вартими»."
 shandong_events.430.a: "Найскладніші рішення вимагають найсильнішої волі"

 shandong_events.431.t: "Сунь Дяньїн будує бандитські храми"
 shandong_events.431.d: "Автономія генерала Сунь Дяньїна в армії настільки велика, що його офіцери поводяться як окрема кліка в кліці. Солдати Суня, розграбувавши бібліотеки Ігуаньдао на Тайшані, придумали план збагачення. Оскільки Сунь колись очолював «Товариство храмового шляху» в Хенані, його люди вирішили відродити його на Тайшані. У мареві опіумного диму Сунь Дяньїн збудував святилище під назвою «Дев'яте небо». Повідомляють, що його солдати почали малювати на обличчях ієрогліфи Те та Шен."
 shandong_events.431.a: "У Шаньдуні важко втекти від віри"

 shandong_events.432.t: "Імператриця без одягу"
 shandong_events.432.d: "Сунь Дяньїн очолив групу бандитів, які пограбували могилу вдови-імператриці Цисі в Пекіні — шокуюча новина. Під покровом ночі люди Суня відкрили гробницю і винесли золото. Вершиною їхньої наруги стало викрадення нефритової дині, яку Цисі тримала у саркофазі. Хоча її спадщина є предметом суперечок, традиціоналісти вважають її взірцем китайського суспільства. Пограбування могили — це глибока образа традицій, і [QIE.GetNameDef] вкрай присоромлені. На жаль, Сунь Дяньїн повернувся на фронт під захистом гвардії, недосяжний для мисливців за головами."
 shandong_events.432.a: "Це місце в музеї!"

 shandong_events.433.t: "Мін знову зневажені"
 shandong_events.433.d: "Сунь Дяньїн у жадобі до золота вирішив пограбувати мавзолей Мін Сяолін у Нанкіні. Його люди вночі підірвали двері гробниці імператора Хунву, засновника династії Мін. Хунву був членом «Червоних пов'язок» (частина «Білого лотоса»), як і покійний Чжан Тяньран, що лише розпалило лють Суня. Він виніс скарби імператора та його дружин. Могилу пограбували та підпалили — такого не траплялося з часів Лі Цзичена у 1644 році. Здається, у гаслі «Відновити Мін» не лишилося честі. Сотні людей, що колись вірили в це, засмучені оскверненням."
 shandong_events.433.a: "Невже немає нічого святого?"

 shandong_events.434.t: "Новий штаб?"
 shandong_events.434.d: "Наша експансія призвела до захоплення значно більших територій, ніж просто провінція Шаньдун. Жителі Цзінаня благають солдатів піти геть. Податкову службу в Цзінані розлючені натовпи спалювали щороку, тоді як Нанкін обіцяє значно більшу безпеку. Дехто хоче лишитися в Цзінані, бо це була столиця успішних кампаній, інші радять переїхати до Нанкіна. Мешканці Нанкіна готуються до гіршого. Бункери, збудовані для оборони міста, зараз заповнюються цінностями в надії, що банда Чжан Цзунчана їх не знайде."
 shandong_events.434.a: "Залишитися в Цзінані"
 shandong_events.434.b: "Переїхати до Нанкіна"

 shandong_events.438.t: "Проголошено Шанцін Тяньґо"
 shandong_events.438.d: "Губернатор Чжан Цзунчан, відомий як «генерал-м'ясник», помер. Повідомлення з Цзінаня стверджують, що він та його заступник Сунь Дяньїн намагалися штурмувати священну гору Тайшань, але не пережили нападу. Ця приголомшлива новина супроводжується проголошенням нового господаря гори, Чжан Тяньраня, який тепер правитиме Шаньдунем та його народом.\n\nЧжан Тяньран — постать, маловідома пресі, але добре знана біженцям як благодійний лідер культу Ігуаньдао. Для консервативних біженців ця подія символізує надію на світле майбутнє Китаю."
 shandong_events.438.a: "Це не закінчиться добром..."

 shandong_events.439.t: "Заворушення на півдні"
 shandong_events.439.d: "У Лізі восьми провінцій надходять численні повідомлення про зростання невдоволення після продажу новозбудованої залізниці німцям. Якщо ми хочемо посилити свій вплив у Китаї, нам слід стежити за подіями на південному сході, адже крах кліки Чуаньфана може принести нам чималу вигоду."
 shandong_events.439.a: "Ми маємо стежити за цим."

 shandong_events.440.t: "Важка куля"
 shandong_events.440.d: "Маршал Ліги Сунь Чуаньфан був застрелений і перебуває у критичному стані; після тижнів заворушень одному щасливому селянину вдалося дістатися до нього. Що це означає для Ліги — невідомо, але якщо почнеться хаос, ми повинні бути готові скористатися цим."
 shandong_events.440.a: "Ця куля змінить долю Китаю."

 shandong_events.445.t: "Малий імператор Сюе Дянь дезертирує разом із Лу Чжуньцзє"
 shandong_events.445.d: "Запевнивши Чжан Тяньраня, що Лу Чжуньцзє ізольована, «малий імператор» Шаньдуна зрадив Ігуаньдао. Коли він не з’явився на щоденні вправи, солдати виявили, що Сюе Дянь зник. Почалася паніка, яка посилилася, коли з’ясувалося, що стару вчительку Лу Чжуньцзє також не можуть знайти. Чжан Тяньран у нехарактерній для нього люті замкнувся в будинку Сюе Дяня, аби спитати поради у духів. За кілька годин він вийшов і оголосив, що «малого імператора» покликали вищі сили у негайне і вічне паломництво. Хоча солдатів це заспокоїло, дисиденти поза межами Тайшаня легко здогадалися про втечу. На подив багатьох, Чжан не наказав почати полювання. Схоже, шанований учитель змирився з наслідками, яких не зміг передбачити."
 shandong_events.445.a: "Ймовірно, це частина Маха-кальпи"

 shandong_events.500.t: "Перемога у війні Ліги!"
 shandong_events.500.d: "Ми перемогли"
 shandong_events.500.d1: "Для Китаю починається нова ера. Сили Ігуаньдао, що на початку війни Ліги були лише дивною, хоч і впливовою організацією, принесли надію та спокуту землям, що потерпали від корупції та зла, коли увійшли до Нанкіна. Тепер Чжан Тяньран, 18-й патріарх Ігуаньдао, став переможцем у війні Ліги і править багатими східними провінціями Китаю. Він не гаяв часу: у Нанкіні конфіскували опіум, провели облави на кубла та вислали іноземних злочинців. Ченці Ігуаньдао почали роздавати допомогу стражденним, прагнучи завоювати прихильність населення.\n\nПроте, хоча наш контроль над Східним Китаєм загалом забезпечено, беззаконня залишається нормою на значній частині сільської місцевості. Нелояльні губернатори, бандити Гоміньдану, залишки мілітаристів — список перешкод для інтеграції досить довгий. Знадобиться час, щоб зміцнити владу на здобутих землях, але скоро Шанцін Тяньґо піднесе Китай до нової ери праведної моралі."
 shandong_events.500.d2: "Для Китаю починалася нова ера — принаймні так думали радикали Гоміньдану та фанатики Ігуаньдао, намагаючись нав'язати народу свої небезпечні ідеології. Відрізняючись від решти дрібних правителів Китаю насамперед масштабами своєї корупції та марнотратства, «генерал-м'ясник» Чжан Цзунчан вийшов переможцем у війні Ліги і тепер править багатими східними провінціями країни. Аби відсвяткувати цей неймовірний подвиг, Чжан влаштував ніч п'яних розваг із приголомшливою кількістю опіуму, завершивши її туром найкращими борделями Нанкіна.\n\nПроте, хоча наш контроль над Східним Китаєм загалом забезпечено, на значній частині територій панує хаос. Непокірні губернатори, бойовики Гоміньдану, релігійні фанатики — шлях до повної інтеграції буде тернистим. Потрібен час, аби консолідувати владу, але скоро ми зможемо проголосити нову Лігу східнокитайських провінцій під проводом майбутнього маршала Чжан Цзунчана."
 shandong_events.500.a: "Нарешті мир"

 shandong_events.501.t: "Чжан Цзунчан тікає з Шаньдуна"
 shandong_events.501.d_FNG: "Залишивши Цзінань у вогні, а Шаньдун — у лещатах жорстокого повстання, Чжан Цзунчан нещодавно прибув до [745.GetCapitalVictoryPointName], втікши з в'язниці з групою наближених осіб на борту поспіхом захопленого судна для перевезення худоби. Попри такий скромний засіб пересування, «генерал-м'ясник» швидко дістався Шеньяна і зажадав повернення до внутрішнього кола Чжан Цзоліня. Незважаючи на нещодавню поразку, Чжан Цзунчан залишається грізним полководцем, якого вважають одним із найефективніших у Північному Китаї. Багато хто стверджує, що його повернення дає неперевершені можливості.\n\nОднак Чжан не вагаючись заявив про свою автономію, коли опинився в ізоляції в Шаньдуні під час третьої чжилійсько-фентянської війни. Його армії залишилися осторонь у 1928 році, у момент нашої найбільшої потреби — зрада в усьому, крім назви.\n\nНасправді саме Чжан Цзолінь створив Чжан Цзунчана; саме його армії «генерал-м'ясник» вів до перемоги. Тепер, коли він знову залежить від милості великого маршала, не кажучи вже про його поблажливість, чи варто йому допомагати?"
 shandong_events.501.d_SZC: "Залишивши Цзінань у вогні, а Шаньдун — в охопленим бунтом, Чжан Цзунчан прибув до [SZC.Capital.GetCapitalVictoryPointName], втікши з в'язниці. Очевидно, не знайшовши притулку у Фентяні, Чжан тепер зухвало вимагає місця на чолі однієї з наших армій, обіцяючи серію швидких перемог.\n\nПопри нещодавні поразки, Чжан Цзунчан залишається грізним генералом. Багато хто вважає, що його досвід може стати нам у пригоді. З іншого боку, Чжан відомий своєю непередбачуваною жорстокістю і має погану репутацію у більшості поважних кіл."
 shandong_events.501.a: "Ласкаво просимо, старий Вісімдесят Шостий!"
 shandong_events.501.b: "Нам не потрібен цей скажений пес."

 shandong_events.502.t: "Лоялісти Чжан Цзунчана тікають із Шаньдуна"
 shandong_events.502.d: "Після спроби штурму священної гори Тайшань Чжан Цзунчан та його права рука Сунь Дяньїн були застрелені. Лоялісти, що вижили, втекли з Шаньдуна і прибули до [ROOT.GetNameDef]. Вони просять прийняти їх на службу до нашої армії, сподіваючись колись повернутися додому. Хоча їхні знання можуть знадобитися у майбутніх битвах за Шаньдун, інші військові дивляться на них лише як на звичайних бандитів."
 shandong_events.502.a: "Ми вітаємо їх тут."
 shandong_events.502.b: "Нам не потрібні мілітаристи-наркомани."

 shandong_events.503.t: "Маньчжури тікають із Пекіна після невдалого перевороту!"
 shandong_events.503.d: "Після провалу спроби реставрації Цін у Пекіні деякі маньчжурські генерали та радники втекли від гніву чжилійської кліки У Пейфу і тепер шукають притулку в нашій провінції. Події розвиваються стрімко, і хоча доля імператора Пуї та його брата Пуцзє досі невідома, члени родини пропонують свою допомогу справі відновлення монархії."
 shandong_events.503.a: "Ми вітаємо їх тут."
 shandong_events.503.b: "Нам вони ні до чого."

 shandong_events.504.t: "Нестримний гамбіт"
 shandong_events.504.d: "Приголомшливий поворот подій вивів підкилимну політику Пекіна на національну арену. Як з'ясувалося, залізна хватка «нефритового маршала» У Пейфу та «короля Баодіна» Цао Куня була не такою міцною, як вважали у світі. Після їхньої бездіяльності під час краху Ліги чжилійська кліка занурилася в хаос. Відчувши момент слабкості ворогів, маньчжурська монарша родина вступила у змову з губернатором Шаньсі Янь Сішанем, аби вибити Чжилі з центральних провінцій.\n\nПроте історія повторилася, і У Пейфу знову всупереч обставинам схилив шальки терезів на свій бік. Спроба перевороту з тріском провалилася, наповнивши нового «захисника нації» жадобою помсти та енергією. Кліка Чжилі, схоже, налаштована розпочати війну проти кліки Цзінь Янь Сішаня та Гоміньцзюню Фен Юйсяна за замах на життя маршала.\n\nОднак це відкриває можливості для [SHD.GetLeader]. Маючи монархічні симпатії та стабільну ситуацію в Шаньдуні, він може використати цей момент, аби піднятися з рівня провінційного лідера до національного. Звісно, за умови, що його армії зможуть битися з військами «нефритового маршала» на рівних, що трапляється вкрай рідко."
 shandong_events.504.a: "Скористатися ініціативою! За імператора!"
 shandong_events.504.b: "Ми були б дурнями, якби виступили проти нефритового маршала."

 shandong_events.505.t: "Переворот у Цзінані"
 shandong_events.505.d: "Протягом 12 років провінцією Шаньдун правив Чжан Цзунчан — людина, яку колись охрестили «найницішим» мілітаристом Китаю за рівень корупції та розпусти, що вражав навіть за китайськими мірками. Проте нині цій ситуації несподівано настав край. Рано-вранці загін цінської піхоти, імовірно на прохання [SHD.GetLeader], увійшов до Цзінаня і взяв штурмом будинок Чжана, відправивши його до Пекіна в кайданах очікувати суду за свої злочини.\n\n[SHD.GetLeader] був призначений новим губернатором Шаньдуна. Це призначення відданого монархіста та здібного генерала знаменує повернення провінції в орбіту впливу династії Цін."
 shandong_events.505.a: "Нічого хорошого, нічого хорошого."
 shandong_events.505.b: "Однією загрозою менше."
 shandong_events.505.c: "Цікаво."

