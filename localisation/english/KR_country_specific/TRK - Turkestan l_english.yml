 TRK_tribal_coalition: "Розпад консервативної коаліції"
 TRK_tribal_coalition_desc: "Традиційний консенсус між духовними лідерами, воєначальниками та племінними старійшинами було зруйновано після призначення реформістів на ключові посади в уряді. Хоча Мадамін-бек має достатньо політичного капіталу, щоб утримати контроль над партією та республікою, його несподіваний поворот до широкої коаліції шокував традиційних союзників."
 TRK_uneasy_alliance: "Нестабільний уряд єдності"
 TRK_uneasy_alliance_desc: "Грудневий оптимізм поступився жорсткій реальності січня. Політичні фракції борються за владу, суперечки переростають у насильство, а стабільність республіки похитнулася. Та навіть серед конфліктів і загравань між міністерствами з’являються ознаки прогресу."
 TRK_uneasy_alliance_reformists_successful: "Дієвий уряд єдності"
 TRK_uneasy_alliance_reformists_successful_desc: "Те, що колись вважалося неможливим — інтеграція джадидів до уряду Мадаміна-бека — тепер стало буденністю. Колишні крики перетворилися на втомлені розмови про співпрацю. Кабінет наразі ретельно збалансований між консерваторами, реформістами та особистими прибічниками президента, кожна група має свою опору в республіканських інституціях."
 TRK_uneasy_alliance_reformists_fail: "Консервативний уряд єдності"
 TRK_uneasy_alliance_reformists_fail_desc: "Мадамін-бек завжди був людиною поміркованості, тож його залучення реформістських голосів до уряду було обережним. Хоча джадиди залишаються частиною уряду, і всі сторони дедалі більше визнають потребу співпраці з лібералами, призначення Ісламкула Полвана міністром військових справ знову порушило баланс на користь консервативної фракції Союзу мусульман."

 TRK_wartime_rationing: "Воєнне нормування"
 TRK_fighting_for_our_faith: "Боротьба за нашу віру"
 TRK_redoubling_our_defence: "Подвоїти нашу оборону"
 TRK_wartime_government: "Воєнний кабінет"

 TRK_shackles_of_tashkent_postBM: "Ташкентський договір зруйновано"
 TRK_shackles_of_tashkent_postBM_desc: "Чорний понеділок приніс нашій республіці багато лиха, але також зруйнував політичний і економічний порядок, що існував між нами та нашим північним сусідом останні півдесятиліття. Із відходом московських промисловців економічне домінування Росії ослабло, і ми отримали шанс позбутися найбільш обтяжливих положень договору, водночас переглянувши захист російської меншини разом із місцевими лідерами."
 TRK_shackles_of_tashkent_tt: "Новий Ташкентський договір"
 TRK_shackles_of_tashkent_tt_desc: "Проконсультувавшись із місцевими «представниками російського народу» в Ташкенті, ми оголосили низку поправок до автономії та захисту російських громадян, що викликало лють у Москві. Ми вступили в нову епоху російсько-туркестанської співпраці! Економічне регулювання, яке раніше душило тюркську промисловість, замінено на здоровий глузд, а заплутану автономну систему — на виконавчу владу Ташкентської ради. Ця нова угода зробила нашу республіку сильнішою та єдинішою, ніж будь-коли."
 TRK_shackles_of_tashkent_fp: "Новий Ташкентський договір"
 TRK_shackles_of_tashkent_fp_desc: "Завершивши поправки до Ташкентського договору, узгоджені з «представниками російського народу» на наших землях, ми нарешті позбулися болісних і заплутаних вимог, нав’язаних північними силами. Завдяки практичному захисту місцевого бізнесу та селян, народ Туркестану — і росіяни, і тюрки — стоїть гордо за Мадаміном-беком. Нова угода зробила нашу республіку сильнішою та єдинішою, ніж будь-коли."

