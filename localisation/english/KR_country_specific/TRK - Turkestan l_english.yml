 TRK_statist_factories_tt: "§CЯкщо ми маємо економічний закон §YРання мобілізація§! або §YЧасткова мобілізація§! під час завершення цього фокусу, він додасть додаткову інфраструктуру та цивільні фабрики!§!"
 TRK_statist_factories_limited_tt: "§CЯкщо ми маємо економічний закон §YЧасткова мобілізація§! під час завершення цього фокусу, він додасть додаткову інфраструктуру та цивільні фабрики!§!"
 TRK_governor_loyalty_autonomy_tt: "§CЯкщо ми надали §YАвтономію§! будь-якому з регіонів, вона буде скасована ціною §YСтабільності§!§!"
 TRK_federal_reverse_autonomy_tt: "§CЯкщо ми надали §YАвтономію§! через тіньові домовленості з місцевими лідерами, вона буде скасована ціною §YПолітичної влади§!§!"

