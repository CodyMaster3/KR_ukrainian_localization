### Characters ###
### Notes: Central Asian names generally use "Turkified" versions of names, rather than OTL Russian forms. Thus for example Tyuryakulov > Turyakululy

 TRK_madamin_bek: "Мадамін-бек"
 TRK_madamin_bek_leader_desc: "§YНародився:§! §L1893, Маргілан, Ферганська область, Російська імперія§!\n§YБіографія:§! §LМадамін-бек, уроджений Мухаммад Амін, уникнув заслання до Сибіру (призначеного в 1914 році за антицарську діяльність) завдяки Лютневій революції. Як нащадок занепалого роду кокандської знаті, він був призначений начальником поліції Маргілана новим революційним урядом у Ташкенті наприкінці 1917 року. Коли Ташкентська рада спалила Коканд, він присягнув на вірність повстанцю з Фергани — «Кічік» Ергаш-беку, швидко піднявшись у лавах місцевих повстанців. Після важкого поранення Ергаш-бека під Намаганом, Мадамін-бек був проголошений Амір уль-Мусліманом — «Командувачем вірних» — зібраними курбаші.\n\nПісля створення Туркестанської автономії Мадамін-бек підтримував холодні, але продуктивні стосунки з ліберальним урядом Мустафи Шокая в Коканді, хоча згодом йому набридли постійні поступки Москві. Коли військовий комісар регіону підняв приречене повстання проти Москви, Мадамін-бек скористався моментом, щоб захопити владу й проголосити незалежність Туркестану. Лише завдяки дипломатичному балансу він, уже як президент-амір нової республіки, уникнув російської розправи. Хоча він — воєначальник, що став президентом, Мадамін не є автократом: він прагне правити через консенсус і докладає значних зусиль до створення життєздатної цивільної адміністрації. Його влада тримається на особистих зв’язках і здатності до компромісу, що дозволяє йому вправно лавірувати в жорстокому світі племінної та сектантської політики.§!"
