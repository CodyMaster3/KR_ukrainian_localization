 TRK_beating_heart: "Новий лист для Республіки"
 TRK_beating_heart_desc: "Протягом багатьох років найвищі політичні посади в нашій республіці займали племінні лідери та курбаші-воєначальники, які є основою нашої політичної підтримки. Однак нещодавні маневри поважних реформаторських релігійних лідерів похитнули консервативну владу, що викликає занепокоєння у Мадаміна Бека. Незважаючи на це, ми повинні створити новий консенсус у правлячій партії Іттіфак уль-Мусульмін, щоб інтегрувати ці нові реформістські та пантюркістські голоси."

 TRK_expand_the_foreign_ministry: "Розширення Міністерства закордонних справ"
 TRK_expand_the_foreign_ministry_desc: "У перші дні Республіки, за правління маріонеткового уряду Шокая, міністерство закордонних справ було не більше ніж маленьким офісом без влади перед обличчям особливих відносин Туркестану з російськими господарями. Коли Мадамін Бек прийшов до влади, ізоляціоністські елементи його режиму перешкоджали будь-якому розширенню. З новим, відкритим до світу мисленням, настав час нарешті розбудувати цей невід’ємний елемент нашої нації."

 TRK_walking_the_turkestan_tightrope: "Ходіння по туркестанському канату"
 TRK_walking_the_turkestan_tightrope_desc: "Керування державою Туркестану завжди передбачало ретельне балансування між різними конкуруючими фракціями та владними блоками, які борються за домінування або знищення Республіки. Хоча введення реформістів до правлячої коаліції ускладнило ситуацію, вони виявилися важливим противагом фундаменталістам, надаючи Мадаміну нову можливість для консолідації його контролю."

 TRK_our_ottoman_brothers: "Наші османські брати"
 TRK_our_ottoman_brothers_desc: "Османська імперія в своїй основі є турецькою нацією, і їхній уряд давно є напівтаємним прихильником нашої республіки, підтримуючи наші обмежені економічні реформи приватними інвестиціями. З піднесенням савінковізму підтримка зі Стамбула лише зросла, і не потрібно багато, щоб переконати їх у нашій потребі в османських радниках і військовій підтримці."

 TRK_support_dissidents_abroad: "Підтримка дисидентів за кордоном"
 TRK_support_dissidents_abroad_desc: "Хоча наш уряд не є ідеологічно орієнтованим, наше протистояння російському імперіалізму в Центральній Азії надало нам авторитету в очах різних пантюркістських організацій у регіоні. Використання цих закордонних союзників для зміни геополітичних хвиль на нашу користь буде вирішальним, якщо ми сподіваємося зберегти нашу незалежність і працювати над визволенням наших сусідів від російського домінування."

 TRK_contacts_with_young_bukharans: "Контакти з бухарськими дисидентами"
 TRK_contacts_with_young_bukharans_desc: "Свого часу міські купці та інтелігенція мусульманських реформаторів Джадідів були найбільшими противниками Мадаміна Бека, виступаючи проти його авторитарних практик і допомагаючи більшовикам у їхньому вторгненні. Однак сьогодні джадіди знають, що в Центральній Азії Мадамін Бек є їхнім найбільшим союзником проти продовження правління емірів і ханів."

 TRK_tashkent_verniy_railway: "Залізниця Ташкент-Верний"
 TRK_tashkent_verniy_railway_desc: "У роки, що настали після відхилення Вельткригу, залізничні лінії в Центральну Азію стали символом російсько-німецької економічної співпраці, і було запущено кілька невеликих спільних проєктів. Однак у наступні роки ці престижні проєкти були залишені напризволяще, покинуті відволікшимися німецькими промисловцями та дедалі ворожішим урядом у Москві. Ми повинні відремонтувати їх, щоб краще з’єднати наші землі з нашими казахськими друзями."

 TRK_supplies_to_kazakhs: "Допомога казахським ополченням"
 TRK_supplies_to_kazakhs_desc: "Конфлікт між таємними казахськими ополченнями та маріонетковим урядом Алашу назріває вже десять років, загрожуючи запалити іскру, яка знову приверне увагу Росії на південь. У нас немає сумнівів, що якщо такий конфлікт спалахне, ми повинні захистити наших союзників у ополченнях, щоб їхня поразка не стала першим доміно, що впаде перед новим російським імперіалізмом."

 TRK_turk_brother_nations: "Братерство тюркських націй"
 TRK_turk_brother_nations_desc: "Пантюркістський проєкт може бути ускладнений розбіжними баченнями кожної з великих тюркських народів і націй, втрачаючи з виду наші цілі на користь вузьких сектантських поглядів на тюркство. Ми не зробимо цієї помилки! Будь-яка нація, яка є домом для народів тюркської крові або яка відкрила свої двері для численних тюркських біженців, буде нашими друзями та братами!"

 TRK_studying_caucasus_tactics: "Вивчення тактик Кавказу"
 TRK_studying_caucasus_tactics_desc: "У місяці після завершення Великої війни багато хто в російській та османській арміях бачив, що тактики, застосовані обома сторонами на Кавказькому фронті, були безнадійно застарілими. Замість того, щоб прислухатися до цих молодих офіцерів, обидві нації вирішили звинувачувати місцеве населення, невдалу погоду та низку інших виправдань. Ми не повторимо цю помилку."

 TRK_court_moderate_clergy: "Залучення поміркованого духовенства"
 TRK_court_moderate_clergy_desc: "Помірковані муфтії Ташкента і Фергани давно відіграють ключову роль у підтриманні миру в нашій нації, часто виступаючи посередниками між взаємною ворожнечею узбецьких і киргизьких племен. Нам потрібно об’єднати ці помірковані групи за нашим урядом, щоб стабілізувати наше правління, адже якщо віруючі не вважатимуть наш уряд легітимним, він довго не протримається."

 TRK_favor_yaushev: "Підтримка братів Яушевих"
 TRK_favor_yaushev_desc: "Сім’я Яушевих, дрібна татарська знать, давно є одним із найвпливовіших столичних кланів у Центральній Азії, з членами сім’ї та контактами, розкиданими по Уралу та регіонах Алашу в Росії, а також у місті Ташкенті. Після смерті Муллагалі Яушева його сини Іскандер і Хасан взяли на себе мантію лідерства серед купців Яушевих. Їхня підтримка може виявитися неоціненною в прийдешньому конфлікті проти Росії."

 TRK_ties_deep_in_russia: "Створення Департаменту національної безпеки"
 TRK_ties_deep_in_russia_desc: "Наша республіка не має офіційного органу, присвяченого таємним операціям, що ставить нас у невигідне становище порівняно з великими державами, і особливо з нашими російськими противниками. Хоча у нас немає коштів, щоб створити розвідувальну організацію з нуля, ми можемо використати наше Міністерство закордонних справ, щоб задіяти їхні контакти та торговельних партнерів у закордонних країнах, щоб зменшити розрив, просто тримаючи вуха відкритими."

 TRK_favor_katta: "Підтримка братів Ергаш"
 TRK_favor_katta_desc: "Хоча Кічік (Малий) Ергаш і Катта (Великий) Ергаш не обов’язково є кровними братами, вони безумовно є братами по зброї, разом борючись у боротьбі проти соціалістів. Жоден із них не вийшов неушкодженим, Катта втратив контроль над моджахедами, а Кічік ледь не втратив життя. Незважаючи на це, ці двоє чоловіків встановили глибокі зв’язки серед курбаші, які Мадамін міг би використати, щоб забезпечити контроль над своєю партією."

 TRK_eliminate_party_factionalism: "Ліквідація партійного фракціонізму"
 TRK_eliminate_party_factionalism_desc: "Європейці століттями мали вільну руку в Центральній Азії, стравлюючи брата проти брата заради просування власних імперіалістичних амбіцій. У нашій боротьбі проти російської загрози ми побачили, якою могла б бути справжня сила нашого народу, якби вона не була скута дріб’язковим сектантством і автократичним егоїзмом. Настав час піднятися над роками стагнації та розколу, щоб ми могли створити нову націю."

 TRK_tashkent_city_fathers: "Внесення змін до Ташкентського договору"
 TRK_tashkent_city_fathers_desc: "Хоча офіційно Ташкент є столицею нашої молодої Республіки, реальність трохи складніша. Отримавши значну автономію під час Ташкентської кризи, місто значною мірою самоврядне радою мусульманських і російських діячів, з мінімальним впливом уряду Мадаміна Бека. З голодною Росією на кордонах настав час переглянути Договір і повністю інтегрувати Ташкент до Республіки."

 TRK_reaffirm_anti_bolshevik_pact: "Інтеграція російських ополчень"
 TRK_reaffirm_anti_bolshevik_pact_desc: "Тимчасовий уряд Фергани був заснований завдяки союзу між Народною армією мусульман Мадаміна Бека та Селянською армією росіян Костянтина Монстрова, союзом, який врятував Туркестан від радянського правління і зберігав мир. Перемога білих підірвала основу цього союзу, але з новим піднесенням савінковізму в Росії з’явилася нова можливість об’єднати народи Туркестану проти тиранії!"

 TRK_reconstructing_turkestan: "Реконструкція Туркестану"
 TRK_reconstructing_turkestan_desc: "Роки війни та занедбаності залишили свій відбиток на Туркестані, з розваленою інфраструктурою, що з’єднує порожні фабрики наших занепалих міських центрів. Однак основи для здорової нації залишаються, приховані за песимістичним фасадом. Якщо ми зможемо знову розпалити вогнища промисловості та відремонтувати залізниці та дороги, Туркестан дійсно може стати сучасною нацією."

 TRK_exploit_petrol: "Експлуатація нафтових родовищ"
 TRK_exploit_petrol_desc: "Наша республіка розташована над значними покладами нафти, більшість з яких залишаються абсолютно невикористаними. Хоча за правління Мустафи Шокая були зроблені деякі несміливі спроби експлуатації цих ресурсів, нам бракує ресурсів і знань, щоб належним чином розвинути цю промисловість. Нам доведеться звернутися до більших, більш індустріалізованих націй, якщо ми хочемо почати видобувати це чорне золото."

 TRK_focus_on_heartland: "З’єднання серця країни"
 TRK_focus_on_heartland_desc: "Довгий час ми знаходили підтримку серед купців наших міст, і довго ми пристосовували нашу політику, щоб зберегти їхню підтримку. Коли великі люди Ташкента і Коканда процвітають, процвітає весь Туркестан... особливо ті, кого варто підкупити. Чутки швидко поширюються серед купців, і є багато міст, розкиданих по степах, чиї багаті люди швидко приєднаються до нас у нашому хрестовому поході проти відсталої автократії та насильницької революції."

 TRK_syr_darya_gold: "Золото Сирдар’ї"
 TRK_syr_darya_gold_desc: "Річка Сирдар’я домінує в Туркестані, разом зі своїми притоками забезпечуючи родючу Ферганську долину прісною водою. Річка приносить не лише прохолодні води до сільськогосподарських угідь Туркестану, але й несе золоті поклади через рівнини, стимулюючи економіку збору та експлуатації. На жаль, місцеві воєначальники спрямовують багатство цієї справжньої золотої жили у свої приватні армії та особисті схованки. Нам доведеться струсити цю систему, якщо ми сподіваємося заявити свої права."

 TRK_building_a_war_chest: "Створення військового фонду"
 TRK_building_a_war_chest_desc: "Універсальна правда полягає в тому, що війни коштують крові, поту і, що найважливіше, золота. Наша мета в прийдешньому конфлікті — знекровити російського ведмедя через тривалу партизанську війну, але якщо ми хочемо пережити наших ворогів, нам потрібні глибокі кишені та добре укомплектовані арсенали. Оподатковуючи наші нові джерела доходу та ретельно зберігаючи наші заробітки, ми можемо бути набагато краще підготовленими до насильства, що наближається."

 TRK_meet_with_kurbashi: "Проведення Андижанського саміту"
 TRK_meet_with_kurbashi_desc: "Під час нашої боротьби за незалежність деякі взялися за зброю, щоб захистити свої сім’ї та домівки, у простій боротьбі за виживання. З іншого боку, інші відчули поклик більш святої справи, присвятивши себе воїнам ісламу. Ці постаті можуть стати завзятими союзниками, якщо ми переконаємо їх у нашій підтримці, і небезпечними противниками, якщо ми відвернемося від них."

 TRK_form_professional_army_core: "Формування ядра професійної армії"
 TRK_form_professional_army_core_desc: "Найбільшою перешкодою для модернізації армії Туркестану буде централізація армії в ядро професійних національних підрозділів. Хоча у Мадаміна є особиста армія лояльних прибічників, жоден інший курбаші не віддасть своїх солдатів армії, яка одного дня може бути використана для їх знищення, і мало хто з боєздатних чоловіків бажає служити в армії, яка не відображає їхньої племінної лояльності."

 TRK_integrate_militia: "Озброєння ополчень"
 TRK_integrate_militia_desc: "Не секрет, що наша армія — це не більше ніж об’єднання невеликих груп солдатів, лояльних лише своїм командирам і пов’язаних узами племінної спадщини, а не національним чи громадянським обов’язком. Ці командири, курбаші, кожен слідує своїм власним примхам і моралі, пов’язані угодами жадібності та особистими образами, що значно перевищують будь-яку ідеологію. Від волі цих людей залежить, чи народиться армія Туркестану, чи загине в зародку."

 TRK_horsemen_of_turkestan: "Вершники Туркестану"
 TRK_horsemen_of_turkestan_desc: "Туркестан має довгу історію талановитих конярів і вершників, і хоча культура верхової їзди не так поширена у Ферганській долині, як на степах далі на північ і схід, усе ж є очевидні уроки, які можна взяти з нашої спадщини. Сучасна роль вершника стає дедалі яснішою — хоча кавалерійські атаки більше не визначатимуть битви, інформація, отримана від талановитих розвідників і вивідувачів, є важливішою, ніж будь-коли, для досягнення перемоги."

 TRK_inspect_ottoman_inspectorate: "Огляд османського армійського інспекторату"
 TRK_inspect_ottoman_inspectorate_desc: "Османи доклали значних зусиль для модернізації свого обладнання та тактик після закінчення Вельткригу. Їхній Армійський інспекторат, який невтомно працює над організацією дисфункційної логістики від Анатолії до Феззану, є яскравим прикладом цього духу. Ми повинні прагнути повторити їхні успіхи та уникнути їхніх помилок."

 TRK_supply_the_outposts: "Постачання форпостів"
 TRK_supply_the_outposts_desc: "Наші армії поділені між місцевими командирами басмачів і вождями ополчень, деякі з яких озброєні не більше ніж списами та нарізними рушницями. Якщо ми сподіваємося протистояти іноземному вторгненню, нам доведеться поділитися багатством столиці з цими віддаленими форпостами, постачаючи цих командирів гвинтівками та зброєю. Сподіваємося, такі дії допоможуть посилити наш контроль над сільською місцевістю."

 TRK_from_bribes_to_salaries: "Від хабарів до зарплат"
 TRK_from_bribes_to_salaries_desc: "Хоча були зроблені зусилля для інституціоналізації мереж патронажу та неформальних відносин, які є основою нашої адміністрації, правда полягає в тому, що наша нація все ще значною мірою грає за феодальними правилами. Тепер, коли ми достатньо централізували наше управління, у нас є можливість викорінити гниль і перебудувати нашу Республіку згори донизу, як ми вважаємо за потрібне."

 TRK_begin_wartime_rationing: "Військове нормування"
 TRK_begin_wartime_rationing_desc: "Хоча нам не хочеться обмежувати купівлю та продаж продуктів харчування та ключових військових матеріалів, це необхідна жертва, яку ми мусимо принести, щоб зміцнити нашу оборону та підтримувати нашу військову машину якомога довше. Усі наші громадяни зроблять свій внесок, щоб наші солдати марширували з повними(чи майже повними) шлунками, а арсенали та склади Ташкента залишалися добре(чи майже добре) укомплектованими. З цією метою війна починається на наших тарілках — і кожен дім є загоном бійців!"

 TRK_proclaim_holy_war: "Проголошення священної війни"
 TRK_proclaim_holy_war_desc: "Наші землі воістину об’єднані одним — славою нашої віри. Улеми давно є провідною силою стабільності в Центральній Азії, і за підтримки цих мудрих батьків віри ми зможемо офіційно санкціонувати нашу війну проти Росії як джихад меча. Це не те завдання, яке ми виконуватимемо легковажно, але чи є кращий приклад джихаду, ніж боротьба проти іноземного панування та знищення нашого способу життя?"

 TRK_rely_on_sufi_orders: "Спиратися на суфійські ордени"
 TRK_rely_on_sufi_orders_desc: "Хоча суфійські ордени є релігійними інститутами для вивчення та передачі містичних вчень у пошуках хакіки — остаточної істини, немає сумнівів, що вони також є потужними інститутами для мобілізації людей. Нам потрібна їхня щира підтримка та переконаність, якщо ми сподіваємося протистояти нашим ворогам на полі бою. Нам пощастило, що низка наших провідних діячів є лідерами різних суфійських осередків."

 TRK_banner_of_the_amir: "Прапор аміра"
 TRK_banner_of_the_amir_desc: "Коли Кічік Ергаш ледь не загинув у Намангані, дух національного руху не помер разом із ним. Натомість його прапор — що вимагав свободи для народу Фергани — потрапив до рук Мадаміна Бека. Президент прийняв важку відповідальність, вплетену в цей прапор, тому що він, як і всі патріоти, борці за свободу та справжні віруючі, що йдуть разом із ним, знав, що Туркестан вартий того, щоб за нього боротися і вмирати."

 TRK_strengthen_the_party: "Посилення партії"
 TRK_strengthen_the_party_desc: "Союз мусульман був першою масовою партією в Туркестані, що закликала до підтримки величезного мусульманського селянства задовго до заснування Національного союзу чи скинення російського ярма. Сьогодні це значною мірою інструмент національного руху Мадаміна Бека за незалежність, але продовжує залишатися голосом простої людини в Туркестані. Ми не повинні забувати про роль партії, вона є важливим символом нашої єдності та відданості рідній демократії!"

 TRK_reorganize_the_garrisons: "Реорганізація гарнізонів"
 TRK_reorganize_the_garrisons_desc: "Хоча багато наших курбаші стверджували, що єдиний спосіб перемогти Росію — це перенести бій до них, правда в тому, що для виживання проти Росії ми повинні повною мірою скористатися всіма оборонними перевагами, які нам доступні. Ми централізуємо місцеві гарнізони під егідою та контролем центрального уряду, щоб краще координувати розташування наших сил і готуватися до атак, які, без сумніву, випробують наші стіни."

 TRK_create_wartime_coalition: "Створення військової коаліції"
 TRK_create_wartime_coalition_desc: "Між Мадаміном Беком та його партією Союзу мусульман і лібералами та прогресивістами партії Національного союзу мало любові. Однак нещодавній союз між нашим урядом і вигнаним казахським лідером партії створив можливість для справжньої військової угоди між цими партіями та повної нормалізації відносин, які були вкрай напруженими після перевороту Мадаміна Бека в 1929 році."

 TRK_begin_the_revolt: "Марш на Самарканд!"
 TRK_begin_the_revolt_desc: "Деякі війни ведуться з незбагненних причин, складні мережі факторів залишають історикам предмет для дискусій на століття вперед. Це не одна з таких воєн. Народ Самарканда благає звільнити їх від того товстого бухарського еміра, і ми відповімо на їхній заклик. Оплески звільнених прискорюють наш марш, а стогони пригноблених підганяють нас вперед!"

 TRK_returning_our_favors: "Повернення киргизьких добровольців"
 TRK_returning_our_favors_desc: "Ядро повстання в Східному Туркестані було сформовано в революційному дусі власне Туркестану, коли багато провідних діячів повстання були вигнані зі своїх домівок під час вогнів Уркуну. Тепер група киргизьких нерегулярних військ на чолі з Ідом Мірабом надіслала звістку зі своїх віддалених баз у передгір’ях Тянь-Шаню, що вони бажають приєднатися до нашої боротьби. Ми запросимо їх як героїв!"

 TRK_the_fergana_porcupine: "Ферганський дикобраз"
 TRK_the_fergana_porcupine_desc: "Щоб досягти успіху в цій війні за виживання проти наших російських ворогів, ми повинні змінити наше мислення, атакуючи російську рішучість, а також їхні армії. Зосередившись на виснаженні російських загарбників і передаючи «справжні» деталі російських втрат міжнародним джерелам, ми змусимо Москву визнати, що Туркестан коштуватиме їм більше крові та скарбів, ніж вони можуть собі дозволити."

 TRK_rapid_adaptation: "Швидкі адаптації"
 TRK_rapid_adaptation_desc: "Хоча ми робили все можливе, щоб підготуватися до реалій затяжного конфлікту проти Бухари та Росії, незабаром стало зрозуміло, що у нашій стратегії та організації є серйозні недоліки. Спираючись на наші відносини з іноземними радниками, ми можемо визначити кілька ключових сфер для додаткового фінансування та зусиль, щоб усунути наші найгірші недоліки."

#Post-Uni
 TRK_deal_with_leftover_russians: "Врегулювати питання з російською меншиною"
 TRK_deal_with_leftover_russians_desc: "Хоча етнічних росіян, які охоче називають Туркестан домом, стало ще менше, ніж до війни з російським ведмедем, вони все ще залишаються активною меншиною з політичним і економічним впливом, що перевищує їхню чисельність. Ми повинні гарантувати їм право жити й працювати в нашій державі, водночас поступово зменшуючи їхню надмірну політичну вагу."

 TRK_crush_bukharan_exiles: "Знищити бухарських вигнанців"
 TRK_crush_bukharan_exiles_desc: "Чимало військових і політичних діячів Бухари втекли до Афганістану, де король надає їм притулок і захист від будь-якої відповідальності — навіть коли вони грабують наші прикордонні міста. Ми повинні вирішити це питання — або через переговори з афганськими партнерами, або ж перетнувши кордон і самостійно розібравшись із залишками маріонеткового емірату."

 TRK_behead_the_bandits: "Стратити бандитів"
 TRK_behead_the_bandits_desc: "Там, де війна — там і ті, хто наживається на стражданнях. Бандити бувають різні: від тих, хто відкрито грабує мирних жителів, до ще гірших — тих, хто прикриває свої злочини забутими титулами й жорстокими традиціями. Ми покінчимо з обома."

 TRK_secure_our_borders: "Зміцнити кордони"
 TRK_secure_our_borders_desc: "Двадцять років тому мало хто вірив, що наші горді землі колись звільняться від ярма чужинців. Сьогодні матері можуть зітхнути з полегшенням: ополчення повертаються до сіл, а старі рушниці — на склади. Надзвичайний стан завершено, але війна все ще маячить на горизонті. Єдиний спосіб зберегти мир — це готуватися до наступної битви, вдосконалюючи наші сили та залишаючись пильними."

 #All Democratic
 TRK_hold_panturkestan_elections: "Провести загальнотуркестанські вибори"
 TRK_hold_panturkestan_elections_desc: "Європейці століттями мали вільну руку в Центральній Азії, зіштовхуючи братів між собою задля власних імперських амбіцій. У нашій боротьбі за об’єднання ми побачили, якою могла б бути справжня сила нашого народу, якби її не стримували дріб’язковий сектантський розбрат і автократичний егоїзм. Настав час піднятися над роками застою й розділення, щоб створити нову націю!"

 #Madamin Bek
 TRK_expand_the_conservative_coalition: "Розширити консервативну коаліцію"
 TRK_expand_the_conservative_coalition_desc: "По всій Центральній Азії мільйони людей вірять у силу поміркованості, стабільності та традицій. Але вони розділені племенами, мовами й самими традиціями, які прагнуть захистити. Незважаючи на це, ми повинні прийняти нову когорту громадян і лідерів до Союзу мусульман, щоб залишатися провідним голосом усіх мусульман регіону."

 TRK_divide_the_leftists: "Розколоти лівих"
 TRK_divide_the_leftists_desc: "У містах люди, заражені отруйними чужоземними ідеологіями, намагаються перекреслити тисячолітню історію одним розчерком пера. Вони розмахують цитатами мертвих теоретиків, наче зброєю, і загрожують зруйнувати все святе. Щоб зупинити підступне зростання «Національного союзу», ми повинні розколоти його радикальні крила."

 TRK_draft_a_presidential_constitution: "Розробити президентську конституцію"
 TRK_draft_a_presidential_constitution_desc: "Ми досі керуємося конституцією, написаною інтелектуалами 1919 року, які уявляли Туркестан як автономну парламентську республіку під російським чоботом. Ми повинні реформувати її відповідно до потреб нашої молодої держави — сильного виконавчого органу, що керує стабільним федеральним парламентом, обидва працюють у злагоді."

 TRK_develop_national_turkism: "Розвивати національний тюркізм"
 TRK_develop_national_turkism_desc: "Довгий час дискусії про пантюркізм велися переважно прогресистами й лівими, тоді як консервативні сили залишалися розділеними етнічними бар’єрами. Ми повинні створити нову національну ідентичність, засновану на спільній вірі та єдності недавньої історії. Ідеологія «національного тюркізму» стане цементом, що об’єднає наш народ і з часом залучить відданих ідеологів."

 TRK_formalize_limited_federalism: "Оформити обмежений федералізм"
 TRK_formalize_limited_federalism_desc: "Наша держава розділена між росіянами й тюрками, узбеками й казахами, племінними лідерами й джадидами. Насильницький конфлікт загрожує розірвати нас, але ми не повинні піддаватися бажанню домінувати над новими територіями. Ми побудуємо державу на основі компромісу між порядком і автономією, засновану на принципах плідного співіснування."

 TRK_exercise_executive_powers: "Застосувати виконавчі повноваження"
 TRK_exercise_executive_powers_desc: "Ключовим елементом нової конституції є одноосібний контроль президента над зовнішньою політикою та його формальний вплив на економіку. Хоча уряд завжди обертався навколо Мадаміна-бека, краще, щоб ці повноваження були інституціоналізовані — і щоб президент мав вільну руку для визначення курсу республіки."

 TRK_moderate_statist_reorganisation: "Поміркована державна реорганізація"
 TRK_moderate_statist_reorganisation_desc: "Щоб вижити й процвітати в нову епоху, ми повинні прагнути індустріалізації та модернізації. Як би це не дратувало деяких, держава повинна втрутитися в розвиток залізниць, виробництва та сучасного сільського господарства. Ми звернемося до досвіду соціалістичних країн і османських реформаторів, щоб започаткувати власну «Туркестанську промислову революцію»."

 TRK_marshal_turkestans_resources: "Залучити ресурси Туркестану"
 TRK_marshal_turkestans_resources_desc: "Центральна Азія — щедра земля, яка може забезпечити наші молоді галузі, якщо ми зможемо правильно добувати її багатства. Ми не повинні дозволити місцевим чварам завадити прогресу, і не можемо покладатися на іноземні компанії, як це було в минулому. Ми повинні стояти на власних ногах і копати власними руками."

 TRK_care_for_the_countryside: "Подбати про сільську місцевість"
 TRK_care_for_the_countryside_desc: "Майже всі наші громадяни живуть у сільських громадах, виживаючи за рахунок землеробства й скотарства. Хоча багато земель суворі й неродючі, є родючі регіони, які можуть стати новим хлібним кошиком Туркестану — більше не виснаженим московськими бюрократами й купцями. Ми повинні підтримати фермерів Фергани та долин річок, щоб вони модернізували свої методи й збільшили врожайність."

 #SocCon
 TRK_assimilate_panturkist_rhetoric: "Інтегрувати пантюркістську риторику"
 TRK_assimilate_panturkist_rhetoric_desc: "Не всі в нашому уряді щиро вірять у пантюркістський ідеал, на якому заснована наша Федерація. Дехто визнає потребу в співпраці чи цінність єдності під час боротьби з росіянами, але не поділяє культурний і громадянський націоналізм завзятих пантюркістів. Та ми бачимо в цьому ідеалі джерело миру й стабільності — і будемо невпинно його просувати."

 TRK_humour_the_education_reformers: "Піти назустріч освітнім реформаторам"
 TRK_humour_the_education_reformers_desc: "Чагатайська тюркська була спільною мовою нашого краю століттями, але за останні двісті років місцеві діалекти значно відхилилися від її архаїчного коріння. Однак є група сміливих інтелектуалів, які вірять, що за умови модернізації та впровадження ми можемо знову створити спільну мову — на основі чагатайської, але без її складних особливостей."

 TRK_liberate_our_oppressed_brothers: "Звільнити пригноблених братів"
 TRK_liberate_our_oppressed_brothers_desc: "Незалежно від політичних поглядів, усі справжні патріоти нашого краю боролися за права пригноблених. Вони проливали кров на степах, щоб тюркські народи могли бути вільними. Та навіть сьогодні багато хто залишається під чужим чоботом — у Росії, Китаї та інших країнах. Ми не можемо миритися з цією несправедливістю — ці народи мають бути звільнені!"

 TRK_regime_of_the_red_basmachi: "Режим червоних басмачів"
 TRK_regime_of_the_red_basmachi_desc: "Роки поспіль робітникам Центральної Азії забороняли об’єднуватися, особливо після громадянської війни в Росії, коли будь-яке робітниче угруповання, не лояльне до емірів, ханів і беків, оголошували більшовицькою загрозою. Але саме робітник — це кровоносна система сучасної держави, і його голос має бути почутий! Президент, давній союзник малих профспілок, зробить усе можливе для їхнього розвитку."

 #PatAut
 TRK_ballot_by_bayonet: "Байонет замість бюлетеня"
 TRK_ballot_by_bayonet_desc: "Теоретично, наша підтримка демократії — понад усе. Але без належного керівництва нашу республіку можуть захопити демагоги, які зводять громадян зі шляху істини. Щоб запобігти цьому, ми тимчасово збережемо воєнний стан, який провів нас крізь найважчі роки."

 TRK_fund_the_sufi_orders: "Фінансувати суфійські ордени"
 TRK_fund_the_sufi_orders_desc: "Багато провідних діячів нашої республіки, включно з президентом, мають давні зв’язки з суфійськими орденами, особливо з кадирійським братством у Фергані. Ці тарікати — тобто духовні школи — є основою ісламської практики в нашій країні. Підтримуючи їх фінансово та юридично, ми зміцнимо нашу опору в регіонах."

 TRK_glorify_the_amir_ul_muslimin: "Прославити Амір уль-Муслімін"
 TRK_glorify_the_amir_ul_muslimin_desc: "Амір уль-Муслімін — Командувач вірних, Воїн Ісламу, Спаситель Туркестану. Народ потребує символу сили й честі, світла, що веде націю вперед. Амір — лише людина, але його титул несе силу великих халіфів, Са'да ібн Абу Ваккаса та ханів Коканду — силу, яку слід використати для єдності країни!"

 TRK_pragmatic_warlordism: "Прагматичне воєначальство"
 TRK_pragmatic_warlordism_desc: "Коли керуєш суворими землями й суворими людьми, не можна бути засліпленим ідеологією. Наша мета — єдина й мирна республіка, заснована на законі та демократичному керівництві. Але на практиці більшість територій контролюють курбаші, а народ — необізнаний і відірваний від світу. Ці проблеми вирішуються прагматизмом, а не ідеалізмом."

 TRK_ensure_governor_loyalty: "Забезпечити лояльність губернаторів"
 TRK_ensure_governor_loyalty_desc: "Дехто каже, що найкращий спосіб керувати бандитами — думати як бандит. Вони помиляються. Щоб зберегти порядок на півдні, нам потрібні тверді військові, яким можна довіряти, інакше узбеки, туркмени й киргизи почнуть ставити питання про своє місце в ієрархії. Губернатори будуть обрані з особистого штабу Мадаміна."

 TRK_cast_aside_ideology: "Відкинути ідеологію"
 TRK_cast_aside_ideology_desc: "Уми наших союзників і ворогів затуманені догмами та сентиментами. У нашому суворому краю для цього немає місця. Ми відкинули філософські доктрини, які засліплюють інших, і будемо правити через тверезий реалізм — подобається це радикалам чи ні."

 TRK_strength_in_stability: "Сила в стабільності"
 TRK_strength_in_stability_desc: "Поки ліберальні інтелектуали сперечаються про високі ідеали, реальність така: федерацію, розділену мовою, етносом і класом, може об’єднати лише тверда рука. Політики переймаються текстом гімну, ігноруючи справжні проблеми. Мадамін-бек стане цією рукою, що веде націю до світлого майбутнього!"

### Ideas ###
 TRK_legacy_of_tashkent: "Спадок Центральноазійського повстання"
 TRK_legacy_of_tashkent_desc: "Ми провели п’ятдесят років під російським гнітом — час, який непоправно пошкодив нашу культуру й заповнив наші землі російськими переселенцями. У 1916 році народи Центральної Азії нарешті сказали «досить» і піднялися на повстання. Ми боролися довго й завзято, скориставшись громадянською війною в Росії, щоб повернути наші землі. Зрештою ми здобули свободу, але ціна була майже нестерпною. Величезну частину нашого населення було знищено або депортовано, змушено шукати притулку в китайському Сіньцзяні. Особливо постраждали киргизи — вони назвали ці події «Уркун», тобто «вигнання». Невелика кількість біженців вже повертається до Туркестану, сподіваючись повернутися додому. Повстання стало моментом народження басмачів як організованого військово-політичного руху — останньою краплею, що принесла нам незалежність. Ми ніколи не забудемо, що зробили з нами росіяни, і що вони в нас відібрали. Ми більше ніколи не схилимося перед ними."

 TRK_shackles_of_tashkent: "Кайдани Ташкентського договору"
 TRK_shackles_of_tashkent_desc: "Коли ми скинули російське ярмо через патріотичне повстання, нам довелося піти на низку компромісів, щоб здобути міжнародне визнання й завершити конфлікт у Центральній Азії. Ташкентський договір змусив нас надати де-факто незалежність російським районам нашої столиці, а його положення надали особливі права й привілеї російським інтересам по всій республіці. Повернення нашої законної столиці та її потужної промисловості — одне з найважливіших завдань найближчого майбутнього. Ми повинні завдати удару по росіянах у перший момент їхньої слабкості."

 TRK_basmachi_army: "Армія басмачів"
 TRK_basmachi_army_desc: "Слово «басмач» — узбецьке, означає розбійника чи нападника. Його використовували більшовики й білогвардійці, щоб очорнити борців за свободу Центральної Азії. Хоча ці воїни здобули повагу на полі бою, нашу державу й досі зневажливо називають «республікою басмачів», і пляму воєначальства та бандитизму буде важко стерти. Та хоробрість наших солдатів — джерело гордості для республіки, незалежно від того, що кажуть за кордоном."

