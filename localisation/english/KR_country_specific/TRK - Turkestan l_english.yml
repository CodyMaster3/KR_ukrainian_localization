 TRK_pan_turkism: "Мрії про пантюркізм"
 TRK_pan_turkism_desc: "Хоча пантюркізм давно присутній у Туркестані, його затінює племінне сектантство, і він обмежується джадидськими прогресистами та тими, хто зазнав османського впливу. Останні спроби координувати загальнорегіональний опір російському пануванню відродили рух, і сьогодні всі елементи нашого уряду просувають ту чи іншу форму пантюркізму. Зв’язки між народами й лідерами регіону слабкі, і їх потрібно зміцнити для справжньої єдності.\n\n§YПантюркістська мрія§! наразі: [TRK_get_pan_turk_coord].\n§GСила §Yпантюркістської мрії§! вплине на результат потенційного об’єднання з Казахстаном.§! [TRK_get_kazakh_insurgency_loc][TRK_get_bukharan_dissidents_loc]\n"
 TRK_kazakh_insurgency_loc: "\n\n§CКазахське повстання:§!\nКазахське повстання — це спільна ініціатива консервативних казахських офіцерів, вигнанців з Національної армії Туркестану та патріотів з партії Алаш. Хоча основна змова формується в казахських степах, деякі патріоти вже організувалися на нашому боці кордону. Ці хоробрі люди готові боротися за свободу свого народу, але їм потрібна наша допомога, щоб вистояти проти російської військової машини.\n\n§CКазахське повстання§! наразі: [TRK_get_kazakh_strength], [TRK_get_kazakh_equipment], і [TRK_get_kazakh_training].\n§YЧим більше підтримки ми надамо §Cказахському повстанню§!, тим більше дивізій вирушить на північ, щоб захистити своїх братів у разі повстання.§!"
 TRK_bukharan_dissidents_loc: "\n\n§0Бухарські дисиденти:§!\nНа півдні кілька груп змовляються проти тиранічного правління еміра Бухари Мухаммеда Аліма-хана — огидного автократа, якого утримують при владі московські ляльководи. Ця широка коаліція включає самаркандських діячів, реформістів із партії Молодих бухарців і войовничих антиросійських племінних лідерів. Чим більше підтримки ми надамо бухарським дисидентам, тим більше шансів, що вони зможуть протистояти утискам емірату.\n\n§0Бухарські дисиденти§! наразі: [TRK_get_yb_strength].\n§YЧим сильніші §0бухарські дисиденти§!, тим більшу перевагу ми матимемо у протистоянні з Бухарою.§!"
 TRK_extend_caspian_sea_smuggling: "Розширити контакти в Закаспії"
 TRK_compare_maps_and_plans: "Звірити карти й плани з Хівою"

 TRK_send_new_diplomats: "Домогтися міжнародного визнання"
 TRK_send_new_diplomats_desc: "Більшість країн не мають дипломатичних зв’язків із Туркестаном, і якщо запитати середнього американського чи японського чиновника, де це — Туркестан, він навряд чи назве правильний континент. Ми повинні інвестувати в надсилання представників до ключових геополітичних гравців, якщо хочемо змінити цю ситуацію."
 TRK_kazakh_lib_assoc: "Підтримати казахську діаспору"
 TRK_kazakh_lib_assoc_desc: "Багато казахів втекли зі своєї батьківщини через жорстокість Росії під час Уркуна та жорстокість китайської адміністрації в Сіньцзяні. Хоча мало хто з них потрапив до салонів Франції, Японії чи США, багато оселилися в Османській імперії, Афганістані та Східній Європі. Зв’язавши наших агентів із цими вигнанцями та симпатизуючою інтелігенцією, ми зможемо ефективно поширювати правдиву інформацію про російські злочини за кордоном."
 TRK_strengthen_ties_with_ger: "Зміцнити зв’язки з Німеччиною"
 TRK_strengthen_ties_with_ger_desc: "Пильне око Німецької імперії — єдине, що стримує Москву від вільного панування в Центральній Азії. Оскільки Росія знову заявляє про себе як про гегемона регіону, нам потрібна підтримка Берліна як ніколи."

