еми вимагають фінансування, і залишається питання, скільки внесе Республіка Туркестан."
 turkestan_republic_events.109.d.khinojk: "Азіз Хан сидів тихо в задимленій, тьмяній задній кімнаті Пішпецької чайхани, дедалі більше захоплюючись. Його оточувала кімната, повна екзотичних незнайомців. Ліворуч група запилених казахських офіцерів разом із протеже вигнанця з Туркестану Мустафи Шокая тихо обговорювали стратегію. Праворуч багаті купці та відомий поет міркували про останні культурні новинки в Самарканді, а позаду ветерани Уркуну обмінювалися воєнними історіями. Азіз Хан аж ніяк не був байдужою людиною, і його вухо блукало між різними розмовами, підхоплюючи уривки від різних груп, аж поки раптова тиша не запала в кімнаті. Прибув Мадамін Бек, швидко розпочавши грандіозну презентацію своїх планів для Центральної Азії.\n\nВін стверджував, що хоча Росія могла б легко придушити будь-яку індивідуальну спробу послабити їхню хватку в Центральній Азії, якщо різноманітні регіональні опори об’єднають свої сили, вони стануть достатньо грізним ворогом, щоб змусити Росію сісти за стіл переговорів. Він щойно почав пояснювати, як присутні можуть сприяти такій справі, коли Садик Аманжолов, інсайдер партії Алашу та командир казахських ополчень, піднявся, щоб виступити, проголосивши, що значна частина лідерів ополчення та членів партії Алашу прагнуть порвати з керівництвом автономії, щоб протистояти російському домінуванню. Більше того, він стверджував, що за два роки він буде готовий повести казахів до свободи, поваливши про-російський уряд — іскра, яка, ймовірно, призведе до російської інтервенції.\n\nНовина вдарила Азіза Хана, як куля — якщо те, що стверджував Аманжолов, правда, об’єднані сили Туркестану, Хіви та повстанців Алашу мали серйозний шанс знекровити росіян на степах. Незабаром були накреслені контури скоординованого повстання в дусі революції 1916 року, разом із положеннями, які ляжуть в основу нового секретного оборонного альянсу, не лише між Хівою та Туркестаном, але й із цією новою казахською змовою. У міру продовження дискусій дедалі більше сторін почали пропонувати різні схеми та ініціативи, які альянс міг би втілити для кращого об’єднання залучених націй і груп. Звісно, такі схеми вимагають фінансування, і залишається питання, скільки внесе Ханство Хіви — хоча Джунаїд Хан, ймовірно, буде незадоволений, якщо Азіз Хан візьме на себе серйозні зобов’язання, у нього є певна свобода вибору рівня інвестицій, які їхня держава буде реалізовувати."
 turkestan_republic_events.109.d.khijk: "Джунаїд Хан сидів тихо в задимленій, тьмяній задній кімнаті Пішпецької чайхани, дедалі більше втрачаючи терпіння. Окрім його найнадійніших охоронців та Азіза Хана, його оточували незнайомці. Ліворуч група запилених казахських офіцерів бурчала, їхні «друзі» з Туркестанської національної армії Мустафи Шокая виглядали незручно поруч із ними. Праворуч товсті купці та письменники метушилися, говорячи про якусь нову п’єсу, що здіймає хвилю в Самарканді, тоді як позаду грубі вигнанці з Сіньцзяну голосно скаржилися на якісь незручності. Для Сардара Каріма з Хіви це соціальне бомбардування було набагато смертоноснішим, ніж артилерійський обстріл, з яким його бійці зіткнулися під Ургенчем, чи град куль, який він пережив біля стін Петро-Олександрівська. На щастя для туркменського генерала, кімната затихла з прибуттям Мадаміна Бека, який одразу ж почав викладати плани для їхньої нової спільної місії.\n\nПлан, який він намалював, був простим — хоча Росія могла б легко придушити будь-яку індивідуальну спробу послабити їхню хватку в Центральній Азії, якщо різноманітні регіональні опори об’єднають свої сили, вони стануть достатньо грізним ворогом, щоб змусити Росію сісти за стіл переговорів. У Джунаїда Хана були серйозні сумніви щодо переваг бачення Мадаміна Бека, але рівняння перевернулося, коли казахський командир Садик Аманжолов піднявся, щоб виступити. За словами Аманжолова, в Алашській автономії назріває широка змова, значна частина партії Алашу та лідерів ополчення прагнуть порвати з керівництвом автономії, щоб протистояти російському домінуванню. Саме Мустафа Шокай привів його до Пішпека, але тепер, коли він тут, Аманжолов проголосив, що за два роки він буде готовий повести казахів до свободи, поваливши про-російський уряд — іскра, яка, ймовірно, призведе до російської інтервенції.\n\nОчевидно збуджені цими новими перспективами, різні сторони почали обговорювати, як і коли проводити таке скоординоване повстання, разом із положеннями, які ляжуть в основу нового секретного оборонного альянсу, не лише між Хівою та Туркестаном, але й із цією новою казахською змовою. Джунаїд Хан не міг не відірватися від кімнати, повертаючись думками до полів битв, які, безсумнівно, чекали їх усіх. Або він врятує туркменський народ у битві, або приречить їх на вічне російське рабство. Його повернув до реальності шепіт Азіза Хана на вухо, який запитував, скільки Ханство може дозволити собі вкласти в новий альянс."
 turkestan_republic_events.109.a: "Ми дамо їм усе, що ви вважаєте розумним."
 turkestan_republic_events.109.b: "Інвестиція в цей альянс — це інвестиція в нашу свободу!"
 turkestan_republic_events.109.c: "Будьте ощадливими! Ми не вкладемо більше, ніж отримаємо."
 turkestan_republic_events.109.e: "Інвестиції? Це альянс, а не компанія. Ми вкладатимемо на полі бою!"

 turkestan_republic_events.110.t: "Наш фронтмен в Алашській автономії"
 turkestan_republic_events.110.d: "Коли ми підписалися на підтримку казахських патріотів в Алашській автономії, ми відкрили двері до складної мережі особистих і політичних відносин у межах цієї великої офіцерської змови. Хоча номінально союзники та особисто дружні один до одного, Мустафа Шокай і Садик Аманжолов діаметрально протилежні у своєму баченні майбутнього казахського народу. Шокай є справжнім прихильником об’єднаної федеративної республіки всіх тюркських народів Центральної Азії, створеної за зразком німецького та американського федералізму, і вважає, що якщо союзники Пішпека досягнуть своїх цілей, вони повинні об’єднатися, щоб сформувати країну, досить потужну, щоб протистояти домінуванню регіону іноземними державами. Хоча Аманжолов поділяє його бажання зберегти незалежність майбутньої Казахської Республіки, він явно менш зацікавлений у будь-якій формі об’єднання, забарвленій казахським націоналізмом замість пантюркістських нахилів Шокая.\n\nЦі ідеологічні конфлікти просочилися в усі наші відносини з нашими казахськими союзниками: кому ми надаємо підтримку? Останніми місяцями ми зосередили значну частину нашої допомоги на Туркестанській національній армії Шокая, оскільки старі зв’язки між вигнанцями Шокая та нашими співвітчизниками відродилися завдяки нещодавньому потеплінню відносин і розширенню нашої внутрішньої пантюркістської пропаганди. Шокай з радістю прийняв ці інвестиції та запропонував низку подальших можливостей для співпраці між його особистою армією та нашими північними киргизькими курбаші. Аманжолов приватно звернувся до нас, просячи обмежити нашу майбутню допомогу Шокаю та його союзникам, пояснюючи, що швидке розширення Легіону занепокоїло лоялістів Алашу та російських шпигунів, і що Шокаю важко правдоподібно заперечувати його нещодавній союз із нами. За цим потенційно розумним виправданням стоїть питання політики Алашу, оскільки Аманжолов, можливо, відчуває загрозу від зростання влади Шокая як сили в автономії, не підпорядкованої його командуванню. З іншого боку, ми загалом згодні з непохитним командиром ополчення, оскільки Шокай — слизька риба, і подальше посилення його може дати йому більше важелів для створення проблем у майбутньому."
 turkestan_republic_events.110.a: "Шокай — наш найближчий союзник в автономії, дайте йому те, що потрібно."
 turkestan_republic_events.110.b: "Аманжолов правий, давайте зосередимося на наших власних солдатах."

 turkestan_republic_events.111.t: "Фокусування Департаменту національної безпеки"
 turkestan_republic_events.111.d: "Коли Аліхан Тура взяв контроль над міністерством закордонних справ, він був реалістичним щодо доступних йому ресурсів — це було бідне міністерство в бідній нації. Однак зростаюча увага до міністерства призвела до виділення нових кишень фінансування для конкретних місій, особисто відібраних Мадаміном Беком за схвалення та керівництва Тури. Найновішим кроком у розширенні міністерства закордонних справ стало створення Департаменту національної безпеки, нової групи з нечітко визначеними повноваженнями, але з палкою підтримкою Мадаміна Бека. Зрештою, департамент може бути орієнтований на одну з двох окремих і протилежних місій — або розширення таємної мережі інформаторів і агентів Туркестану в підконтрольній Росії Алашській автономії, або зміцнення нашого внутрішнього захисту від іноземного втручання, зокрема від Росії. Фінансування недостатньо для реалізації обох можливостей, і розпорошення коштів на обидва проєкти в напівсерйозній спробі мати все, ймовірно, призведе до того, що жоден не досягне поставлених нами цілей. Аліхан Тура не дуже любить цей новий департамент, бачачи в ньому переважно спробу Мадаміна Бека ввести деяких із більш «старої гвардії» партійних людей у нове маленьке реформістське володіння Тури (побоювання, яке, ймовірно, є точним), і тому він не висловлювався з цього приводу, можливо, сподіваючись, що без його втручання департамент буде відкладений, а кошти повернуться до міністерства загалом. Без його керівництва вибір напрямку, який візьме ця нова група, повністю залежить від Мадаміна Бека."
 turkestan_republic_events.111.a: "Пріоритет — координація з нашими казахськими союзниками."
 turkestan_republic_events.111.b: "Зосередьтеся на захисті наших лідерів від потенційних атак."

 turkestan_republic_events.112.t: "Яке місце росіян у пантюркському світі?"
 turkestan_republic_events.112.d: "Сказати, що у Мадаміна Бека бурхливі відносини з більшістю його російських громадян, було б применшенням. Для більшості він — людина, яка повалила «дружній до Росії» уряд Шокая і розпочала охолодження з Москвою, що призвело до страждань їхнього бізнесу та поставило під сумнів їхні засоби до існування. Однак останні п’ять років показали, що настрій серед росіян Туркестану потеплішав до Мадаміна Бека: він надав значні привілеї та поступки своїм російським друзям, а ті, хто був найбільш розлючений його приходом до влади, повернулися на батьківщину. Проте навіть найлояльніші росіяни Ташкента стурбовані нещодавнім сплеском пантюркських настроїв з уряду Мадаміна Бека, бачачи цей новий місцевий націоналізм як загрозу крихкому балансу, створеному між узбеками, казахами, киргизами, сартами та порівняно невеликою російською громадою в Республіці. Хоча, очевидно, нашим наміром ніколи не було відчужувати наших російських громадян, немає сумнівів, що вся наша пропаганда, яка вихваляє чесноти «Єдності серед тюрків» та «Тюрки, що стоять разом», викликала певне занепокоєння, особливо коли напруга між Туркестаном і власне Росією зросла. Звісно, переважна більшість етнічних росіян, що живуть у Туркестані, лояльні лише до своєї батьківщини, але є й такі, хто бачить у цій нації можливість створити маленьку Росію за своїм образом, плацдарм для змін у Москві або дрібне феодальне володіння за їхнім задумом. Для них особливо новий акцент на пантюркізмі є загрозливим, і Мадамін Бек мусить знайти спосіб повернути їх до гурту."
 turkestan_republic_events.112.a: "Особисто розвіяти сумніви цих ключових лідерів."
 turkestan_republic_events.112.b: "Пом’якшити більш сумнівну риторику."

 turkestan_republic_events.113.t: "Пішпецький пакт наближається!"
 turkestan_republic_events.113.d: "Хоча офіційно Пішпецький пакт є обов’язковою угодою, що об’єднує Хіву та Туркестан, правда полягає в тому, що ці дві нації не особливо єдині ні за практикою, ні за метою. Об’єднані спільною ненавистю до Росії та, меншою мірою, до Бухари, між Джунаїдом Ханом і його запекло незалежним автократичним монархічним режимом та Мадаміном Беком, чиє правління цементується обмеженими демократичними поступками та зародковою республіканською пантюркською ідеологією, мало любові. Незважаючи на значні розбіжності, нещодавні події дозволили двом націям тісніше координуватися одна з одною. Ніколи не знаєш, коли щось таке просте, як зустріч і рукостискання між двома другорядними курбаші, принесе дивіденди, коли і якщо ці двоє будуть кинуті разом у відчайдушну оборону чи безнадійний наступ. Лінії постачання доповнюють одна одну, боєприпаси обмінюються для забезпечення зброї, якою володіє одна чи інша сторона, і ключові фрази туркменською, узбецькою та таджицькою обмінюються, зміцнюючи наші армії та нашу рішучість. Ці невеликі покращення, додані разом, починають помічатися по всій нашій нації."
 turkestan_republic_events.113.a: "Разом ми будемо твердо стояти проти Росії!"

 turkestan_republic_events.114.t: "Прикриття"
 turkestan_republic_events.114.d: "Задимлена чайхана в центрі Пішпека завжди була місцем зустрічі для різноманітної групи людей, адже місто розташоване серед казахських, киргизьких та узбецьких племінних земель. Однак сьогодні чайхана була удостоєна присутністю людей з усіх куточків Центральної Азії, разом із кількома сміливими чи допитливими росіянами. Зовні старий помічник із офісу Мадаміна Бека тихо проводив гостро одягненого журналіста та його фотографа через задні двері до будівлі. Їх відправили на південь із другорядної петропавловської газети, щоб висвітлити «Зустріч сартських купців у Пішпеку», прагнучи створити той нудний, безглуздий матеріал, який зазвичай читають бізнесмени з надлишком часу. Журналіста провели через кілька кімнат, заповнених вусатими купцями, які гуділи, обговорюючи динари та торговельні дефіцити сумішшю російської, узбецької та сартської мов. Нарешті їх привели до кімнати з кількома суворими на вигляд співрозмовниками, які монотонно гуділи про ціни на бавовну та розширення залізниць. Втомившись і хвилюючись, що будь-яка історія з цього туркестанського щурячого гнізда не приверне уваги навіть найнуднішого петропавловського торговця тканинами, журналіст не міг не поцікавитися чуткою, яку почув по дорозі — що туркменський диктатор Хіви Джунаїд Хан був присутній.\n\nВідповідь привернула його увагу: хоча хівинський лідер не давав інтерв’ю і не бажав фотографуватися, Джунаїд Хан був присутній, незалежно від його зацікавленості в будь-яких торговельних угодах, що тут укладалися. Він, як повідомляється, приєднався до обговорень, щоб символізувати свою відданість співпраці з місцевими та своє відкидання Росії, і голосно висловлював надію, що російський народ помітить його розрив із російськими купцями його двору, щоб подорожувати до серця антиросійських настроїв у Центральній Азії. Журналіст не міг не пожвавитися, коли почув, що маневр Джунаїда Хана мав на меті «привернути увагу та розлютити російський народ». Такі маневри зазвичай привертають увагу і приносять гроші. Швидко зробивши кілька поспішних фотографій, журналіст ввічливо, але швидко покинув чайхану, сподіваючись встигнути на наступний поїзд на північ. Він отримав свій заголовок, і мало що інше мало значення.\n\nЗа дві кімнати, за щедрим шаром багатих нудьгуючих, Мадамін Бек звертається до найстрокатішої групи командирів, банкірів, купців, вчителів, лідерів і вождів, яка коли-небудь збиралася в Центральній Азії, усі вони прагнуть спланувати поразку Росії."
 turkestan_republic_events.114.a: "Росіяни можуть бути розлючені, але не з правильних причин..."

 turkestan_republic_events.115.t: "Місцеві суперечки доходять до президента"
 turkestan_republic_events.115.d: "Основа Республіки Туркестан — це дуже ретельно створена мережа регіональних адміністраторів і губернаторів, що дозволяє місцевим вождям і воєначальникам керувати власними справами, зазвичай без прямого втручання центрального уряду. Хоча це звільнило ресурси та час, які інакше довелося б витрачати на більш жорстку адміністрацію, це також означає, що у нас немає конкретних засобів, щоб змусити цих місцевих чиновників підкорятися. Більшість із них просто віддані своїм власним інтересам або найвпливовішому лідеру басмачів у їхній окрузі.\n\nУ деяких випадках конфлікти між місцевими лідерами стають настільки гарячими, що привертають увагу Мадаміна та його уряду. Нещодавно сільський вождь чинив опір частим «реквізиціям», виданим його місцевим воєначальником, що призвело до насильницької суперечки через їхню перекриваючу владу. Сільський вождь звернувся з петицією безпосередньо до Мадаміна, щоб той втрутився, оскільки його село було доведене до голодного опору через жадібність їхнього курбаші. Відправлення урядових сил проти банди безпринципного, але в іншому лояльного командира басмачів викликало б резонанс серед командирів Мадаміна, але ігнорування бід пригнобленого населення лише зміцнило б уявлення, що Мадамін — не більше ніж вискочка-різник."
 turkestan_republic_events.115.a: "Втрутитися на користь бека."
 turkestan_republic_events.115.b: "Дозволити курбаші вільно діяти."

 turkestan_republic_events.130.t: "Природа Таємного пакту"
 turkestan_republic_events.130.d: "Таємний пакт між Хівою та Туркестаном обмежений за обсягом, вимагаючи від двох націй надавати конкретні та обмежені форми допомоги одна одній у разі загрози російської інтервенції, але не доходячи до справжнього військового альянсу. Однак у наступні місяці нації додали додаткові положення та зобов’язання, нещодавно домовившись про передачу та розподіл своїх відповідних карт, що охоплюють землі їхнього спільного бухарського сусіда та прилеглу територію.\n\nПоряд із цими спільними покращеннями нашої військової розвідки, двоє чоловіків змогли врегулювати низку суперечок, що тліли між курбаші та вождями, які діють у невизначених прикордонних землях Сирдар’ї, а хівинці погодилися продати нам партію щойно контрабандної стрілецької зброї, прихованої від пильних очей їхніх російських «радників». Хоча такого роду невеликі угоди є вигодою для нас обох, Аліхан Тура сподівається, що Таємний пакт є лише основою для нового, розширеного альянсу між нашими націями проти росіян. Відверто кажучи, судячи з роздратування Азіза Хана щодо зарозумілості його російських колег, здається, що лише питання часу, коли росіяни перегнуть палицю в Хіві, відчуживши Джунаїда Хана і давши нам набагато більше свободи для співпраці без кайданів неформального російського панування."
 turkestan_republic_events.130.a: "Ми можемо бути терплячими для такої вигоди."

 turkestan_republic_events.131.t: "Шокай закопує сокиру війни"
 turkestan_republic_events.131.d: "Сьогодні Мустафа Шокай спустився з передгір’їв Джунгарських воріт, гірського перевалу, який прорізає гірський хребет Джунгарський Алатау вздовж кордону між Туркестаном, Алашською автономією та Сіньцзяном, слугуючи головним торговельним коридором між Китаєм і західною Росією. Останні півдесятиліття він провів, створюючи армію в горах, названу «Туркестанською національною армією», набираючи рекрутів із своїх співвітчизників-казахів Алашської автономії, а також вигнанців із Туркестану та тих, хто бажає повернутися з «Уркуну», насильницького вигнання десятків тисяч казахів і киргизів до Сіньцзяну царським урядом. Шокай зумів об’єднати ці різноманітні групи в відносно згуртовану бойову силу, фінансовану за рахунок тарифів на транджунгарську торгівлю та підтримувану Москвою, яка була рада мати союзника, міцно закріпленого в цьому ключовому перевалі.\n\nМи довго вважали Мустафу Шокая небезпечною загрозою для нашої республіки, а його армію в горах — мечем Дамокла, що висить над нами, занадто добре укріпленою та підтримуваною, щоб її можна було усунути без великих втрат, але не досить потужною чи небезпечною, щоб вимагати втручання. Незважаючи на це, нещодавні події значно заплутали наше протистояння, оскільки Мустафа Шокай звернувся до Аліхана Тури з проханням запросити його на нашу майбутню конференцію в Пішпеку. Хоча у Мадаміна Бека є серйозні застереження щодо повернення його найбільшого суперника в гру, Аліхан уже прийняв прохання колишнього туркестанського державного діяча, запросивши його та деяких із його найближчих союзників на зустріч. Міністр закордонних справ стверджував, що Шокай довго боровся проти російського домінування в регіоні, і якби він приєднався до нашої справи, він би позбавив Росію плацдарму в Алтайському проході, дав нам загартований загін воїнів і більший шлях для координації з іншими казахськими дисидентами. Насправді, Шокай уже запропонував передати наше запрошення казахському офіцеру Садику Аманжолову, ключовому лідеру в Алашській автономії, добре відомому своєю зростаючою ненавистю до російського правління."
 turkestan_republic_events.131.a: "Минуле є минулим — вітаймо його як справжнього сина Туркестану."
 turkestan_republic_events.131.b: "Ми можемо пробачити, але ніколи не забудемо — тримаймо цього тхора під пильним наглядом."

### Post Unification ###

 turkestan_republic_events.700.t: "Туркестан стоїть тріумфатором!"
 turkestan_republic_events.700.d: "Мало хто в нашій коаліції вірив, що ми коли-небудь переможемо огидного еміра, підступного хана та гнітючу російську п’яту. Але ось ми стоїмо, споглядаючи новий світанок для Туркестану, де свобода і процвітання наших народів можуть бути забезпечені.\n\nЗ нашою перемогою прийшли очікування, обіцянки, дані в темніші дні, стали актуальними. Ліберальне крило Союзу мусульман, наші союзники в русі джадідів та партія Національного союзу Мустафи Шокая мовчали щодо м’якого авторитаризму нашого режиму протягом війни, розуміючи, що Туркестану потрібен президент, наділений позазаконними повноваженнями «Амір уль-Мусульман», щоб вижити перед небезпеками російської інтервенції та міжобщинних чвар. Навіть Шокай, який утік із нашої нації після маршу на Ташкент 1929 року, голосно і стійко виступав за Мадаміна Бека та свободу, яку він обіцяв.\n\nЗ нашою перемогою ця самоцензура різко припинилася. Сьогодні місто Ташкент гудить вимогами скасування воєнного стану, повного повернення цивільного правління та вільних і демократичних виборів. І Національний союз, і блок Аліхана Тури в Союзі мусульман вимагають виборів, щоб «забезпечити стабільність Туркестану та підтвердити легітимність уряду».\n\nЇхнє прагнення до демократії гідне захоплення, але невже ці люди не розуміють, що наша республіка все ще перебуває в глибокій кризі? Трупи режимів еміра і хана все ще можуть породжувати мух бандитизму та повстань, а російський ведмідь грізно нависає на півночі — завжди готовий до просування. Вибори будуть страждати від браку національної єдності, а позбавлення Мадаміна Бека надзвичайних повноважень відкриє можливості для іноземних держав або внутрішніх повстань загрожувати нашому важко здобутому миру. Мадаміну Беку доведеться вирішити зараз, чи буде республіка заснована на славі та силі його лідерства, чи на інститутах нового демократичного порядку."
 turkestan_republic_events.700.a: "Ми повинні поважати демократичний процес!"
 turkestan_republic_events.700.b: "Ми не можемо проводити вибори, поки стабільність повністю не відновиться..."

 turkestan_republic_events.710.t: "Об’єднання з казахами?"
 turkestan_republic_events.710.d: "Казахи багато чим нам завдячують — ми допомагали їх озброювати та організовувати, ми надавали їм притулок і плацдарм для Туркестанської національної армії. Але саме казахи врешті-решт звільнили свою націю. Режим Садика Аманжолова сильно наголошував на рівності з нами і намагався створити враження, що справа казахського визволення не підпорядкована нашому більш потужному у військовому плані режиму. Пантюркісти, такі як Шокай, займають урядові посади, але Аманжолов зайняв більш націоналістичну казахську позицію, щоб консолідувати владу.\n\nДля нас це виглядає як брак бачення. Казахи, очевидно, мають свої власні благородні традиції та культуру, але з політично-військової точки зору ми не можемо залишатися розділеними. Росіяни повернуться — і лише сильний, об’єднаний Туркестан зможе стримати їхній наступ, коли вони прийдуть, а якщо це неможливо, ми принаймні мусимо мати постійний оборонний альянс."
 turkestan_republic_events.710.a: "Буде один, об’єднаний Туркестан."
 turkestan_republic_events.710.b: "Ми поважатимемо казахський суверенітет і прагнутимемо лише до альянсу."
 turkestan_republic_events.710.c: "Уникати цього."

 turkestan_republic_events.711.t: "Туркестан пропонує альянс"
 turkestan_republic_events.711.d: "З Ташкента надійшла пропозиція. Хоча спочатку очікувалося, що Мадамін Бек запропонує об’єднання між нашими двома націями, він, можливо, побачив знаки на стіні щодо казахського націоналізму [KAZ.GetLeader]. Проте Туркестан і Казахстан мають багато спільного, і, що важливіше, проливали кров разом. Усе, що він пропонує, — це військовий альянс, який захистить незалежність тюркських братів, особливо якщо російська армія повернеться — і не помиляйтеся, вона дуже ймовірно повернеться."
 turkestan_republic_events.711.a: "Так!"
 turkestan_republic_events.711.b: "Ні!"

 turkestan_republic_events.712.t: "Казахи прийняли наше запрошення"
 turkestan_republic_events.712.d: "Рукостискання між [TRK.GetLeader] і [KAZ.GetLeader] ознаменувало народження нового оборонного пакту. Відтепер і назавжди тюркські народи Центральної Азії шукатимуть свій власний шлях разом, присягнувшись ніколи більше не бути підданими Москви."
 turkestan_republic_events.712.a: "Чудово!"

 turkestan_republic_events.713.t: "Казахи відхилили наше запрошення"
 turkestan_republic_events.713.d: "[KAZ.GetLeader] показав, що він цінує себе вище за спільне процвітання тюркських народів. Він категорично відхилив наше запрошення до альянсу, ясно давши зрозуміти, що об’єднання також не розглядається. Здається, Туркестан доведеться об’єднувати мечем, а не пером."
 turkestan_republic_events.713.a: "Ці негідники!"

 turkestan_republic_events.714.t: "Туркестан просить об’єднання"
 turkestan_republic_events.714.d: "Уряд Мадаміна Бека прибув до [KAZ.GetCapital], пропонуючи цікаву ідею: об’єднання між нашими двома націями. Ташкент уже деякий час є осередком пантюркських ідеалів, і, здається, вони мають намір реалізувати об’єднаний Туркестан усіх центральноазіатських держав. Аргумент простий: об’єднана тюркська Центральна Азія набагато краще підходить для створення єдності між нашими народами, розвитку процвітаючої економіки та армії. Тим не менш, ми не зобов’язані до них приєднуватися. Ми могли б запропонувати альтернативу, пов’язавши економіки та армії наших держав без компрометації нашої незалежності."
 turkestan_republic_events.714.a: "Так!"
 turkestan_republic_events.714.b: "А як щодо альянсу?"
 turkestan_republic_events.714.c: "Категорично ні!"

 turkestan_republic_events.715.t: "Казахи прийняли наше запрошення"
 turkestan_republic_events.715.d: "Мрії багатьох освічених тюркських інтелігентів нарешті здійснилися. [KAZ.GetLeader] поставив свою країну вище за все і вирішив, що найкращий шлях — це об’єднання з Ташкентом. Мало хто вірив, що цей день настане, але сила та наполегливість тюркських народів довели, що можливо все. Договір про приєднання вже підписано, і перспективи майбутнього вселяють надію."
 turkestan_republic_events.715.a: "Чудово!"

 turkestan_republic_events.716.t: "Казахи відхилили наше запрошення"
 turkestan_republic_events.716.d: "[KAZ.GetCapital] ясно дав зрозуміти одне: вони абсолютно не бажають 'знову продавати свою незалежність іноземцям'. Оскільки об’єднання пером виключено, у нас залишився лише один варіант."
 turkestan_republic_events.716.a: "Ці негідники!"

 turkestan_republic_events.717.t: "Казахи пропонують альянс"
 turkestan_republic_events.717.d: "[KAZ.GetLeader] не готовий об’єднувати наші великі нації, це ясно дали зрозуміти його уряд під час переговорів. Проте казахи розуміють ситуацію — військовий альянс, а також економічні зв’язки необхідні для захисту тюркської незалежності."
 turkestan_republic_events.717.a: "Так!"
 turkestan_republic_events.717.b: "Ні!"

 turkestan_republic_events.718.t: "Туркестанці прийняли нашу пропозицію"
 turkestan_republic_events.718.d: "Ташкент був задоволений нашою зустрічною пропозицією. Ми будемо битися разом і вмирати разом знову — так, як окремі нації, але як братні нації."
 turkestan_republic_events.718.a: "Чудово!"

 turkestan_republic_events.719.t: "Туркестанці відхилили нашу пропозицію"
 turkestan_republic_events.719.d: "[TRK.GetLeader] ясно заявив: лише об’єднаний Туркестан може належним чином захистити незалежність тюркських народів. Якщо казахи ставлять свої власні егоїстичні амбіції вище за це, немає сенсу продовжувати переговори."
 turkestan_republic_events.719.a: "Ці негідники!"

### Fired by Focus ###

 turkestan_republic_events.1005.t: "Робота з киргизькими глибинками"
 turkestan_republic_events.1005.d: "У високогір’ях далекого заходу більшість наших підданих ледве усвідомлюють, що вони є частиною більшої Республіки, знаючи лише землі та міжусобиці, що оточують їхні села. Більшість цих крихітних громад сплачують податки товарами місцевому курбаші з клановими та племінними зв’язками, який використовує їхню підтримку для утримання своєї приватної армії, можливо, надсилаючи мізерну суму уряду в Ташкенті, якщо його зобов’язують особисті борги чи гордість. Деякі села повністю перебувають поза межами нашого правління, не підкоряючись жодному курбаші та відповідаючи лише своїм власним вождям. Багато киргизьких племен мають мало любові чи лояльності до нашої Республіки і воліли б битися, ніж схиляти коліна перед тим, кого вони вважають чужоземним воєначальником.\n\nЦе не означає, що ці племена не мають зв’язків із командирами курбаші зі сходу, адже багато хто часто взаємодіє з узбецьким командиром Курширматом і киргизьким командиром Муэтдіном Беком, двома командирами, які мають певну особисту ворожнечу до Мадаміна Бека та хитку підтримку його легітимності як Амір уль-Мусульман.\n\nУ відповідь на ініціативу Мадаміна Бека об’єднати армії Туркестану Курширмат попросив у уряду фінансування для очолення нової експедиції у східні високогір’я, щоб підкупити або залякати залишки киргизької незалежності. Хоча киргизькі воїни були б чудовим поповненням для наших армій, Мадамін Бек не дуже любить Курширмата і зробив би все, щоб запобігти його впливу на ще більше загонів солдатів. Муэтдін Бек був би більш розумним командиром для цих заблудлих племен, але з історією конфліктів Мадаміна Бека з багатьма киргизькими вождями знадобилися б серйозні поступки, щоб переконати його очолити таку справу."
 turkestan_republic_events.1005.a: "Відправити Курширмата в цю експедицію"
 turkestan_republic_events.1005.b: "Чому б не відправити Муэтдіна Бека замість цього?"
 turkestan_republic_events.1005.c: "Нам не потрібні додаткові нелояльні солдати..."

 turkestan_republic_events.1006.t: "Місцеві джадіди шукають захисту"
 turkestan_republic_events.1006.d: "Заснований на початку століття, рух джадідів є течією реформістської думки серед багатьох тюркських інтелігентів і прогресистів, яка виступає за культурну реформацію центральноазіатських тюрків через відродження старих ісламських вчень і впровадження сучасних європейських технологій та інститутів. Хоча цей рух виразно ісламський, джадіди здебільшого зазнають опору з боку улемів, яких вони називають кадімістами, за підрив традиційної моральної структури Центральної Азії, тоді як джадіди переважно засуджують консервативне духовенство та суфійських містиків за спотворення ісламу та дії як самозакоханих еліт. Хоча джадіди далекі від єдиного політичного руху, їхнє використання сучасних медіа та низової активності дало їм величезну армію прихильників по всьому Туркестану та Центральній Азії загалом.\n\nКоли Мадамін Бек звільнив Туркестан від слабкого правління маріонеткового уряду Мустафи Шокая, багато джадідів боялися, що відбудеться масовий розгін прогресивних елементів республіки. Натомість багато з цих освічених майстрів були залучені до структури його нового цивільного уряду, формуючи реформістське крило Іттіфак уль-Мусульмін. Однак багато хто в армії Мадаміна Бека продовжує вважати писемність чаклунством, а соціалізм — роботою диявола, що робить вчителів і мислителів прогресивного руху легкою мішенню для бандитизму чи переслідувань з боку незалежних курбаші. Щоб ще більше загострити цей розкол, деякі діячі джадідів продовжували активно агітувати проти освіченого правління Мадаміна Бека, закликаючи його піти у відставку на користь вільних виборів або повернення Шокая та його союзників. Через їхні слова, що ізолюють їх від нашої милості, багато хто визнав їх легкими для залякування, і низка дрібних бандитів і волоцюг почала вимагати з цих діячів, підбадьорена відсутністю урядового втручання.\n\nЛідери нашої цивільної адміністрації, Аліхан Тура та Ешон Бабахан, наполягають на тому, що необхідно швидко діяти, щоб захистити залишки Шура-і-Ісламії та відновити верховенство закону в нашій Республіці. Катта Ергаш і військове крило нашого уряду заперечують, стверджуючи, що ці люди відкинули наші пропозиції альянсу десять років тому і тепер просто пожинають наслідки."
 turkestan_republic_events.1006.a: "Дозвольте Турі скласти закон для їхнього захисту"
 turkestan_republic_events.1006.b: "Дозвольте Бабахану скласти закон для їхнього захисту"
 turkestan_republic_events.1006.c: "Надати їм неформальний захист"
 turkestan_republic_events.1006.e: "Захищати наших ворогів? Ви з глузду з’їхали?"

 turkestan_republic_events.1008.t: "Піднесення Новокиргизів"
 turkestan_republic_events.1008.d: "Ферганська долина давно була розплідником коней, відомих у всьому світі, з кров’ю легендарного Аргамака, що тече в жилах усіх центральноазіатських порід. З цієї причини низка коней, від російського Дона до англійського чистокровного, частково формувалися з родоводу благородних туркменів, киргизів і корабаїрів. Нещодавно ініціативна група імпортувала п’ятдесят чистокровних коней на кінний завод на Іссик-Кулі, схрещуючи їх із киргизькими кобилами, щоб створити нову породу, яка поєднувала витривалість і стійкість киргизького коня, що походить від великого монгольського степового коня, зі швидкістю та спритністю гоночного чистокровного. Цей завод досяг великого місцевого успіху зі своєю «новою» киргизькою, або «Новокиргизькою», породою, вдосконалюючи бажані якості через подальші схрещування між киргизькими, чистокровними та російськими донськими породами. Однак розвиток породи був надзвичайно обмеженим у роки після Ташкентської кризи, оскільки необхідне фінансування для розширення такої породи було, м’яко кажучи, обмеженим."
 turkestan_republic_events.1008.a: "Чудова ініціатива! Фінансуйте її."
 turkestan_republic_events.1008.b: "На жаль, грошей все ще бракує"

 turkestan_republic_events.1011.t: "Збір чорного золота"
 turkestan_republic_events.1011.d: "Нафта видобувається і переробляється в регіоні Фергани вже понад п’ятдесят років, перші справжні нафтові свердловини в регіоні були створені в 1885 році в районі Шорсу поблизу Коканда. Гас, вироблений цими свердловинами, доставлявся до міст Ташкента, Коканда та Андижана на спинах верблюдів і возах, забезпечуючи ці міста та генеруючи дохід у регіоні, а також допомагаючи живити першу залізницю між Ташкентом і Кокандом. На початку століття в Чимйоні, іншому селі в серці Ферганської долини, було виявлено перше велике родовище нафти. За допомогою інвестицій від братів Нобель, чия нафтова імперія базувалася в Баку, родовище Чимйона було розвинене з кількома свердловинами та місцевим нафтопереробним заводом, а також трубопроводом Ванновська, який транспортував нафту на захід, з’єднуючи Туркестан із азербайджанською нафтовою інфраструктурою Баку. Хоча було велике захоплення щодо світлого майбутнього розвитку нафти в Туркестані, шок громадянської війни, порушення британських інтересів на азербайджанському нафтовому ринку та економічний застій тридцятих років залишили нас із незначним прогресом, окрім маргінальної експлуатації, що проводилася десятиліттями раніше.\n\nСлідом за моделями, викладеними Іваном Губкіним у 1932 році, та за допомогою старих партнерів у Баку, ми розпочали нову хвилю буріння та експлуатації, головним чином зосереджену навколо бази підтримки Мадаміна Бека у Фергані. Нові свердловини були побудовані в Чангірташі, Нефтеабаді та Південному Аламишику, частково профінансовані Branobel і Royal Dutch Shell Group, що є гучним міжнародним вотумом довіри до безпеки та легітимності нашого уряду та прибутковим джерелом оподатковуваного багатства. Використовуючи трубопроводи, які проходять через нашу націю через Персію до Азербайджану, ми можемо обходити російське втручання, хоча ми все ще залежимо від образливих податків, що стягуються бухарцями, які дозволяють нашому чорному золоту текти через їхні кордони. Хоча ми, очевидно, воліли б мати повний контроль над нашими величезними запасами природного газу та нафти, ці нещодавні події наблизили нас до економічної свободи, якої ми прагнемо, як ніколи раніше."
 turkestan_republic_events.1011.a: "Ми не дозволимо їм пити наш молочний коктейль!"

 turkestan_republic_events.1012.t: "Зустріч із ташкентськими міськими батьками"
 turkestan_republic_events.1012.d: "Коли російський командир Володимир Григор’єв оголосив про свою підтримку Новорічного перевороту Болдирєва, тонка нитка гармонії між росіянами Ташкента та їхніми мусульманськими сусідами швидко розпалася. Однак, коли Мадамін Бек рушив на місто на чолі величезної армії курбаші, він вирішив не піддаватися хвилі міжконфесійного насильства, натомість звернувшись до своїх союзників серед купців, щоб укласти новий мир між росіянами та тюрками. Ташкентська рада була переконана підкоритися правлінню нової Туркестанської Республіки Мадаміна Бека в обмін на прагматичні економічні поступки та місцеву автономію, що створило політичний компроміс, який відіграв важливу роль у відверненні російської інтервенції в Центральну Азію після Ташкентської кризи.\n\nВідносини між Мадаміном Беком і Ташкентською радою, очолюваною росіянами, з того часу були відносно плідними та мирними, але скрутні часи вимагають складних рішень. Хоча Ташкентський договір добре служив нам протягом останнього десятиліття, ми не можемо дозволити собі бути розділеними, коли Москва рушить на південь. На щастя, Ташкентська рада обурюється авторитаризмом нинішнього російського режиму, побоюючись, що якщо Москва знову правитиме Ташкентом, незабаром якийсь дрібний диктатор атакує їх за їхню довготривалу співпрацю з Мадаміном Беком та його урядом.\n\nДе-факто лідер цієї групи, колишній мер Микола Маллицький, зазначив, що рада готова відступити від багатьох обтяжливих поступок нашого договору, щоб зміцнити зв’язки між росіянами та мусульманами. На жаль, кілька російських політиків маніпулювали правилами процедури ради, щоб запобігти розгляду реформаторського законодавства. Вони майже напевно поступилися б, якби були запропоновані незначні реформи, і їх можна було б переконати або залякати, якщо натиснути правильні люди. Однак деякі в нашому уряді запропонували заарештувати цих обструкціоністів за підозрою в корупції, лише на кілька днів, щоб наші союзники в раді могли проштовхнути поправку до договору. Звісно, ув’язнення цих членів ради було б дуже непопулярним і вимагало б від Мадаміна Бека використання його надзвичайних повноважень як Амір уль-Мусульман."
 turkestan_republic_events.1012.a: "Мер Маллицький обходить дисидентів!"
 turkestan_republic_events.1012.b: "Гаврилов підкуповує ключових обструкціоністів"
 turkestan_republic_events.1012.c: "Давай просувати обмежені економічні поправки замість цього"
 turkestan_republic_events.1012.e: "Ув’язнити обструкціоністів і проштовхнути законодавство!"

 turkestan_republic_events.1013.t: "Переговори з російськими офіцерами"
 turkestan_republic_events.1013.d: "Невдовзі після знищення Коканда червоні сили в Центральній Азії були витіснені з Ферганської долини, відступивши назад до Ташкента. Для пересічного російського селянина-поселенця це означало, що єдина залишкова російська влада в регіоні покинула їх напризволяще мусульманським борцям за свободу. Хоча Мадамін Бек ставився до цих фермерів із певною повагою, багато басмачів почали безрозбірно грабувати російські поселення. У відповідь російські колоністи об’єдналися, обравши відставного царського офіцера і мірошника полковника Костянтина Монстрова своїм командиром. Бачачи в них корисний інструмент проти своїх ворогів-басмачів, Костянтин Осипов (тодішній військовий комісар Ташкентської ради) визнав цю нову «Ферганську селянську армію» і надіслав їм зброю, щоб вони могли приєднатися до нього в боротьбі проти Мадаміна Бека. У наступному році і Монстров, і Осипов зрадили соціалістів і приєдналися до зростаючої армії Мадаміна Бека, принісши вкрай потрібну легітимність руху басмачів.\n\nУ роки після закінчення громадянської війни багато російських поселенців повернулися або втекли на північ до власне Росії, залишивши лише найвитриваліших або найвпливовіших діячів. Оскільки дедалі більше росіян покидали республіку, організації, які колись повністю контролювалися і керувалися росіянами — зокрема банки, гарнізон Ташкента, залізничні компанії — стали набагато більш гетерогенними. У більшості випадків організації стали ієрархічно розділеними, з місцевими солдатами і працівниками, керованими росіянами. Російські офіцери в ополченнях і гарнізонах розуміють, що їхній контроль над підлеглими є хитким, і робили все можливе, щоб зберегти контроль перед демографічними реаліями. Ці залишені офіцери насторожено ставляться до самого Мадаміна Бека, але президент Туркестану завжди правив через величезну мережу патронажу, і він вважає Костянтина Монстрова та Костянтина Осипова цінними союзниками. Незважаючи на свій похилий вік, Монстров має значний неформальний контроль над селянськими ополченнями, а Осипов має слух більшості російських офіцерів, що залишилися в Ташкенті. Мадамін Бек міг би використати їхню підтримку, щоб заспокоїти невелику групу російських офіцерів в ополченнях чи гарнізоні — або переконавши їх продовжувати підтримувати Туркестан перед зростаючими напруженнями з Росією, або витіснивши їх, щоб їхні місцеві туркестанські солдати потрапили під комфортний контроль Мадаміна Бека та його друзів."
 turkestan_republic_events.1013.a: "Використати і Монстрова, і Осипова, щоб забезпечити контроль над цими нелояльними групами"
 turkestan_republic_events.1013.b: "Використати вплив Монстрова над ополченнями"
 turkestan_republic_events.1013.c: "Використати контроль Осипова над ташкентським гарнізоном"
 turkestan_republic_events.1013.e: "Висмоктати якомога більше людської сили з цих нелояльних груп"
 turkestan_republic_events.1013.f: "Після роздумів, залишити їх у спокої"

 turkestan_republic_events.1014.t: "Андижанський саміт"
 turkestan_republic_events.1014.d: "У 1898 році суфійський старець Мухаммад Алі Мадалі очолив рух антиросійських туркестанців у місті Андижані, здивувавши місцевий царський гарнізон, перш ніж бути розгромленим, швидко поклавши край першому справжньому повстанню проти російського правління в киргизькому Туркестані. Тепер, через десятиліття, пам’ять про короткочасну революцію живе в серцях наших громадян і наших бійців-басмачів. Зрештою, причини повстання Алі Мадалі проти російського ярма дуже чітко резонують із тими, хто страждав через останні десятиліття російського правління і хто піднявся, щоб завершити битву, яку ці люди почали. Ці хоробрі душі повстали, билися і вмирали, щоб боротися проти порушення шаріату, московського втручання в закони закяту і вакфу, а також повільного розчинення традиційних моральних цінностей у сім’ях і громадах по всьому регіону. Сьогодні Мадамін Бек закликав представників усіх своїх військ зустрітися з ним на місці старого повстання, щоб врегулювати суперечки та обговорити майбутнє республіки. Хоча офіційно парламент представників засідає в Ташкенті, вони є не більше ніж дорадчою радою для президента. Справжніми арбітрами долі Туркестану є курбаші та хани, які зустрічаються на неформальних зібраннях, де вони вирішують суперечки між своїми зонами впливу, хоча жодна з цих зустрічей не була такою амбітною, як нинішній проєкт Мадаміна Бека.\n\nВін скористався можливістю в Андижані, щоб висунути своїм командирам сміливу нову платформу, вимагаючи нової консолідації влади в його руках як Амір уль-Мусульман, щоб краще підготуватися до наступаючої російської хвилі. Хоча багато лейтенантів бурчать у відповідь на запропоновану Мадаміном реорганізацію армії Туркестану, стійка підтримка Катта Ергаша Бека та кілька добре розміщених хабарів змусили замовкнути всіх, крім найсміливіших командирів. Проте з настанням ночі навколо енергійного узбецького курбаші Курширмата сформувався осередок незгоди, головним чином через запропоновану Мадаміном Беком можливість призивати бійців курбаші до національних підрозділів у часи надзвичайних ситуацій. Більшість розглядає цю владу як тонко виправданий порушення традиційних прав, хоча мало хто, крім Курширмата, насмілився б стверджувати, що Мадамін Бек може використати ці нові повноваження, щоб знекровити командирів курбаші, які йому протистоять. Хоча Мадамін Бек не може дозволити собі відступити від своїх радикальних реформ, деякі з його найближчих радників запропонували підвищити одного з найближчих союзників Курширмата (і його брата) Нурмухаммада Бека на посаду заступника міністра озброєнь, позицію, яка могла б заспокоїти Курширмата, але означала б розширення його впливу на ще більше елементів нашої адміністрації."
 turkestan_republic_events.1014.a: "Надати поступки, щоб придушити незгоду"
 turkestan_republic_events.1014.b: "Триматися курсу! Ми повинні змусити їх підкоритися!"

 turkestan_republic_events.1015.t: "Вибір командира"
 turkestan_republic_events.1015.d: "Прапори та стяги майорять з вікон і балконів, гучні маршеві пісні лунають вулицями, а ошатно вдягнені кавалеристи заспокоюють своїх прекрасних місцевих коней. Мадамін Бек їде на чолі цієї колони, його гордість видна всім у натовпі, принаймні тим, хто може бачити крізь юрбу його величезної особистої охорони. Десять років тому президент ховався по фермах і печерах, виживаючи за рахунок плодів землі. Сьогодні він стоїть в оточенні великої сучасної армії, президент гордої та вільної республіки і обличчя великого пантюркського опору. Ця нова «Армія Республіки» структурована інакше, ніж будь-яка інша військова сила в країні, не заплямована смородом воєначальництва, з великими ресурсами та зусиллями, спрямованими на обхід племінних клік і міжконфесійного розбрату, які довго стримували нашу націю. Вона має міцне ядро сержантів у стилі європейських армій, з ієрархією командування, заснованою на заслугах, а не на кумівських зв’язках, і озброєна найкращим озброєнням, яке можуть купити контрабандисти, з організованою логістичною мережею. Справді, ця нова сила є найкращою, що коли-небудь була зібрана в Туркестані, результатом років підготовки та роботи.\n\nТепер питання, яке на вустах у всіх, — хто очолить цю нову, об’єднану національну армію. Хоча підпорядкування цієї нової сили командуванню воєначальника курбаші може здатися контрпродуктивним для політичних цілей Мадаміна Бека, правда в тому, що президент дедалі більше зайнятий своїми цивільними обов’язками, що робить його потенційно непридатним для ефективного командування власною армією. Катта Ергаш Бек є найочевиднішим кандидатом, щоб очолити замість нього, адже він давно довів свою компетентність і лояльність, незалежно від його зв’язків із консервативними елементами республіки. Деякі члени цивільного крила наполягали, щоб Мадамін Бек офіційно взяв командування, а потім делегував свої повноваження молодшим офіцерам, щоб краще будувати новий, неупереджений офіцерський корпус. Звісно, інші наполягали на підвищенні аутсайдера, бунтівного курбаші Курширмата. Вони запропонували, що, більш повно залучаючи Курширмата до двору, його можна було б контролювати, стримувати та заспокоїти. Звісно, Мадамін Бек міг би просто більше присвятити себе своїй ролі як командира, хоча це потенційно відволікало б його як президента і турбувало б деяких його більш тривожних лейтенантів, які вже розглядають централізовану армію як загрозу своїм повноваженням і привілеям."
 turkestan_republic_events.1015.a: "Мадамін Бек мусить особисто очолити!"
 turkestan_republic_events.1015.b: "Катта Ергаш здатний і надійний"
 turkestan_republic_events.1015.c: "Курширмат — сміливий лідер, хоч і ненадійний..."
 turkestan_republic_events.1015.e: "Можливо, реформісти мають рацію..."

 turkestan_republic_events.1016.t: "Конфлікт серед росіян"
 turkestan_republic_events.1016.d: "Загалом етнічні росіяни Ташкента залишаються впливовою меншиною в Республіці, організуючись навколо різних політичних організацій і груп, часто сестринських до провідних рухів у власне Росії (тобто есери, кадети та свободники мають невеликі ташкентські осередки). Хоча багато росіян, які оселилися в Ташкенті та Фергані, повернулися до Росії після того, як Мадамін Бек скасував автономію та проголосив незалежність Республіки, ті, хто залишився, стали ключовими гравцями в неформальних кооперативах і мережах патронажу, які залишаються основою туркестанської політики. Костянтин Осипов, колись усіма ненависний червоний комісар, що став басмачем, а потім урядовим міністром, є одним із прикладів сили неформальної влади. З позиції лідера Союзу російських ветеранів (СРВ) та як есер він зміцнив велику базу влади в Ташкенті, навіть коли ветерани відступили на північ, а виборці есерів здебільшого зникли, Осипов знайшов способи залишатися помітним і корисним для змащування коліс ташкентської політики та бізнесу.\n\nЗвісно, його давно підтримує особистий зв’язок із Мадаміном Беком, разом із яким він бився в останні дні громадянської війни. Однак на кожного друга Осипова припадає два вороги, і колишній мер Ташкента та провідний консервативний російський лідер Микола Маллицький розпочав нову енергійну атаку на позицію Осипова в Союзі ветеранів, ставлячи під сумнів його дії на початку громадянської війни та мобілізуючи підтримку для його електорального повалення. Мадамін Бек опинився на роздоріжжі — хоча Осипов давно був союзником, він, м’яко кажучи, сумнівно лояльний і в кінцевому підсумку повністю самозакоханий. З іншого боку, Маллицький зберігає лояльність до Москви, що може виявитися згубним у найближчому майбутньому. Звісно, Маллицького, ймовірно, можна переконати укласти угоду: якщо президент активно підтримає його, він може бути схилений до офіційної нейтральності або помірної підтримки уряду Мадаміна Бека."
 turkestan_republic_events.1016.a: "Підтримати Маллицького"
 turkestan_republic_events.1016.b: "Захистити нашого старого друга Осипова"
 turkestan_republic_events.1016.c: "Мадаміну Беку вдається зіграти на обидва боки"

 turkestan_republic_events.1017.t: "Старий ведмідь відбиває претендентів"
 turkestan_republic_events.1017.d: "У найславніші дні громадянської війни Мадамін Бек крокував пліч-о-пліч із російським селянським лідером Костянтином Монстровим, старим мірошником, який піднявся до нагоди, щоб об’єднати російські ополчення Ферганської долини в грізну бойову силу. Спочатку ворожий до червоних і басмачів, Мадамін Бек уклав союз між своїми ферганськими загонами та Селянською армією Монстрова на піку громадянської війни, і Монстров був призначений міністром оборони Ферганського тимчасового уряду Мадаміна Бека, проголошеного після їхньої зухвалої спільної перемоги в Андижані. У роки після відновлення Туркестанської автономії та подальшого перевороту Мадаміна Бека Монстров тримав двір серед російських поселенців як голова Ферганської селянської асоціації, зберігаючи свою позицію завдяки тому, що мав слух Мадаміна Бека. Він був цінним джерелом інформації для уряду, передаючи скарги російських фермерів Мадаміну Беку та загалом тримаючи їх у покорі, навіть коли відносини з власне Росією стають напруженими.\n\nОднак часи змінилися з тих славних днів в Андижані, і Монстров стає втомленим і безсилим у свої похилі роки. Нова постать, багатий тютюновий фермер Михайло Олексійович Гаврилов, піднявся, щоб оскаржити його позицію як голови Ферганської селянської асоціації, і далі претендує на його неформальну мережу патронажу та контролю. Хоча Гаврилов має мало особистих зв’язків із Мадаміном Беком, він є проникливим бізнесменом і заявив, що має намір пов’язати свій бізнес із успіхом Туркестану, якщо Мадамін Бек його підтримає, незалежно від будь-якого майбутнього конфлікту з Росією. Його глибокі кишені можуть стати в нагоді, якщо Мадаміну Беку потрібно буде «переконати» російських поселенців залишатися лояльними до Ташкента, а не до Москви, що є, м’яко кажучи, сумнівною пропозицією. З іншого боку, Монстров несе спадщину росіянина, який повірив у Мадаміна Бека і був відповідно нагороджений, слугуючи символом просування росіян для своїх співвітчизників, і він має набагато глибші відносини з чинним президентом."
 turkestan_republic_events.1017.a: "Захистити Монстрова, він молодий душею!"
 turkestan_republic_events.1017.b: "Нам потрібна свіжа кров, як Гаврилов."
 turkestan_republic_events.1017.c: "Тримати голову низько і не давати обіцянок"

 turkestan_republic_events.1018.t: "Реформісти досягають своїх цілей!"
 turkestan_republic_events.1018.d: "Коли Мадамін Бек підвищив Аліхана Туру та Ешона Бабахана на посади в своєму цивільному уряді, стало зрозуміло, що короткочасна ера «Кабінету курбаші», які домінували в туркестанській політиці одразу після перевороту Мадаміна Бека, завершилася. Цей дует та їхні союзники в ширшій реформістській фракції Союзу мусульман досягли успіху в реалізації низки політик, які вони запропонували Мадаміну Беку минулого року, щоб переконати його в їхній життєздатності в уряді. Завдяки їхнім нещодавнім успіхам роль реформістів в уряді Мадаміна Бека міцно закріплена, і багато найголосніших голосів із правого боку, які критикували цих «туранських радикалів», були змушені замовкнути або діями міністрів, або твердою рукою самого президента. Щоб офіційно висловити свою підтримку цим нещодавнім подіям, Мадамін Бек вніс значну зміну в міністерства — наполігши на відставці міністра з військових справ Йормата Махсума, близького союзника Катта Ергаша з його днів у Коканді. Він замінив цього міністра-курбаші своїм заступником, Бахромом Беком. Бахром Бек — відомий курбаші, знаний своєю симпатією до джадідів і відкритістю до реформ та ліберальних ідей, що робило його найпрогресивнішим членом уряду Мадаміна Бека до його останніх призначень.\n\nЗ підвищенням Бахрома Бека президент зміцнив позиції реформістів до такої міри, що вони можуть серйозно кидати виклик Катта Ергашу та його союзникам у деяких питаннях політики, хоча Бахром Бек є переконаним поміркованим, захищає повноваження військового міністерства і не зацікавлений у деяких нових політиках, які просувають Бабахан і Аліхан. Аліхан Тура особливо радий мати Бахрома Бека на чолі Міністерства військових справ, оскільки значна частина фінансування, яку йому вдалося зібрати, була отримана завдяки щедрості Бахрома Бека, який охоче надавав невелику частку переповненого гаманця військового міністерства для бідних реформістських міністрів. З цим новим фінансуванням і підтримкою в кабінеті Мадаміна Бека реформісти готові внести тривалі зміни в республіку."
 turkestan_republic_events.1018.a: "Аби вони пам’ятали, на кого працюють..."

 turkestan_republic_events.1019.t: "Туркестанський Термидор"
 turkestan_republic_events.1019.d: "Коли Мадамін Бек підвищив Аліхана Туру та Ешона Бабахана на посади в своєму цивільному уряді, стало зрозуміло, що короткочасна ера «Кабінету курбаші», які домінували в туркестанській політиці одразу після перевороту Мадаміна Бека, завершилася. Однак після невтішних результатів від цих нових реформістських лідерів і міністрів кабінету здається, що терпіння президента вичерпалося. Він висловив своє незадоволення цими двома діячами не шляхом їхнього звільнення чи прямої критики, а шляхом переведення заступника міністра військових справ Бахрома Бека до Міністерства закордонних справ Аліхана Тури. Бахром Бек — відомий курбаші, знаний своєю симпатією до джадідів і відкритістю до реформ та ліберальних ідей, що робило його найпрогресивнішим членом уряду Мадаміна Бека до його останніх призначень.\n\nЦього ідіосинкратичного міністра-курбаші замінив містичний шейх і відомий кокандський борець Ісламкул «Борець» Полван, протеже Катта Ергаша. Хоча Аліхан Тура може бути радий мати ще одного здатного та ідеологічно виваженого чоловіка в Міністерстві закордонних справ, одним розчерком пера Мадамін Бек скоротив кількість міністерств із реформістськими нахилами на третину, і, що ще гірше, поставив близького союзника вже могутнього Катта Ергаша на провідну позицію в, можливо, найважливішому міністерстві Республіки. Хоча це далеко не смерть нового поштовху до реформ, очевидно, що ці реформісти більше не мають повної довіри Мадаміна Бека, і їм доведеться працювати вдвічі більше, щоб забезпечити зміни, яких вони прагнуть. Більш прагматично, оскільки більшість урядових грошей проходить через Міністерство військових справ, здатність реформістів фінансувати свою політику була значно обмежена недавніми змінами."
 turkestan_republic_events.1019.a: "Курбаші знову спускаються на міністерства"

 turkestan_republic_events.1020.t: "Напруга спалахує в Старому Ташкенті"
 turkestan_republic_events.1020.d: "Місто Ташкент давно є центром влади в Туркестані, і хитка підтримка його населення дозволила Мадаміну Беку успішно звільнити край від маріонеткового режиму Мустафи Шокая. Однак, оскільки місто поділене між різними фракціями росіян і тюрків, котел міжконфесійних чвар тліє, вимагаючи майже постійної уваги від Мадаміна та його лейтенантів.\n\nНещодавно мер російської частини Ташкента, Микола Гур’євич Маллицький, виступив із проханням про підтримку в переслідуванні бізнесу, що належить мусульманину. Він стверджує, що власник неодноразово ігнорував закони та правила російського Ташкента і відкидав будь-які спроби привести його до порядку, ховаючись за своїм багатством і зв’язками. Хоча ігнорування закону створило б поганий прецедент, власник фабрики, про яку йдеться, має низку друзів серед мусульманських купців Ташкента, які є ключовими прихильниками режиму Мадаміна."
 turkestan_republic_events.1020.a: "Закон є закон."
 turkestan_republic_events.1020.b: "Можливо, варто проявити трохи поблажливості..."

 turkestan_republic_events.1021.t: "Купці просять інвестицій"
 turkestan_republic_events.1021.d: "Хоча дні гамірного шовкового шляху давно минули, у нашому краї все ще є багато тих, хто займається тим, що бере кілька срібних тенге і перетворює їх на кілька російських рублів. Деякі з цих дрібнобуржуазних торговців і власників крамниць виробляють вишукані товари, тоді як інші все ще сприяють торгівлі прибутковою узбецькою бавовною, яка проходить через наші міста. Традиційно ці діячі знаходили мало що, крім презирства, від правителів цих земель, з росіянами, які відкидали місцевих купців на користь своїх, і кровожерливими воєначальниками, які мало приділяли часу цифрам і прогнозам.\n\nЗ іншого боку, Мадамін Бек давно вважається другом купців, і саме їхня підтримка забезпечила йому контроль над містами на піку Центральноазіатської кризи. Група знедолених ремісників, почувши про інтерес Мадаміна до бізнесу, виступила з пропозицією урядової підтримки швейного підприємства. Вони стверджують, що за наявності початкових інвестицій вони зможуть забезпечити товари для підтримки наших сил. Однак у бізнесі завжди є ризик, а ми перебуваємо в ситуації, коли кожен цент має значення!"
 turkestan_republic_events.1021.a: "Дайте їм те, що вони потребують."
 turkestan_republic_events.1021.b: "Вони просять занадто багато."

 turkestan_republic_events.1022.t: "Повернення від наших інвестицій!"
 turkestan_republic_events.1022.d: "Схоже, що наші інвестиції в швейний сектор принесли значні прибутки! Хоча грошові надходження завжди допомагають збалансувати розтягнуті фінанси республіки, важливіше те, що Мадамін може використати це, щоб зміцнити свою позицію як купецького лорда. Як додатковий бонус, деякі з матеріалів, які ми отримали від купецьких родин, дозволять нам екіпірувати наших солдатів справжньою уніформою, допомагаючи нашим арміям виглядати більш згуртовано та сучасно!"
 turkestan_republic_events.1022.a: "Фантастично!"

 turkestan_republic_events.1023.t: "Популярний командир спійманий на контрабанді"
 turkestan_republic_events.1023.d: "Під час важких боїв Російської громадянської війни та особливо під час напружених боїв Ташкентської кризи наша залежність від регіональних командирів для керівництва арміями республіки виявилася неоціненною. Без надмірного центрального командування місцеві підрозділи могли маневрувати краще за своїх супротивників і захищати ключові місця, залишаючись гнучкими. У роки після цього командири курбаші стали де-факто губернаторами, розділивши націю на феоди і залишивши центральний уряд не більше ніж періодичним розподільником зброї для різних автономних командувань, що простягаються по степах.\n\nОднак настає час, коли навіть відсутність нагляду натрапляє на нечесну гру. Нещодавно талановитий і харизматичний дрібний командир із південного кордону неодноразово повідомляв, що низку їхнього озброєння викрала місцева бандитська зграя. Хоча наші початкові розслідування в регіоні підтвердили, що банда добре озброєних контрабандистів діяла в цьому районі, переправляючи нашу зброю в руки бухарців, більш глибокий аналіз ситуації виявив докази того, що командир «губив» склади зброї в обмін на частку їхніх незаконних прибутків. Хоча деякі в нашому внутрішньому колі вимагають голову цього командира, наші докази нечесної гри є в кращому разі хиткими, і цей воєначальник, хоча й підступний, все ще є курбаші. Якщо ми діятимемо проти нього, ми потенційно викличемо гнів усіх наших лейтенантів, особливо враховуючи, що мало хто з них має чисті руки..."
 turkestan_republic_events.1023.a: "Ми не можемо дозволити, щоб такі злочини залишалися без покарання!"
 turkestan_republic_events.1023.b: "Зараз не час усувати талановитих командирів!"

 turkestan_republic_events.1024.t: "Робота з ненадійними купцями"
 turkestan_republic_events.1024.d: "Значна частина нашого комерційного обороту походить від наших торговельних відносин із Росією, і не дивно, що вулиці Ташкента заповнені добре вдягненими російськими бізнесменами. Хоча ці купці залишалися здебільшого аполітичними на піку Ташкентської кризи, відносини між нашим молодим урядом і Москвою залишалися прохолодними, що змушує багатьох турбуватися про небезпеку, яку становить ця багата п’ята колона для нашої нації. Нещодавно підозра впала на невелику групу торговців зброєю, які добре заробляли, продаючи надлишкові європейські гвинтівки нашому уряду. Деякі з більш параноїдальних членів військової ради висловили занепокоєння щодо того, наскільки близько ці російські дилери зблизилися з певними бюрократичними елементами нашого уряду, побоюючись, що інформація про нашу бойову готовність повільно просочується до цих сумнівних діячів.\n\nЗвісно, особи в нашому уряді, найближчі до цих дилерів, стверджують, що жодної інформації з ними не ділилися, і йдуть далі, нагадуючи уряду, що більшість торговців зброєю лояльні лише до свого гаманця. Наша позиція не завидна — викорінюючи цих купців, ми ризикуємо позбавити наш уряд цінного джерела якісної зброї, але ігноруючи безпековий ризик, який вони становлять, ми можемо відкрити себе для глибшого проникнення наших ворогів."
 turkestan_republic_events.1024.a: "Краще бути в безпеці, ніж шкодувати."
 turkestan_republic_events.1024.b: "Іноді бізнесмени — це просто... бізнесмени."

