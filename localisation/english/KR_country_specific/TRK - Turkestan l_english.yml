### Decisions ###
 TRK_consolidation_decisions: "Консолідація Туркестану"
 TRK_consolidation_decisions_desc: "Республіка Туркестан тримається разом лише завдяки крихкій релігійній єдності та особистій кліці, яку Мадамін-бек сформував після громадянської війни в Росії. Ці слабкі зв’язки ще утримують країну, але не витримають відкритого конфлікту. Коли мир після війни було зруйновано новорічним переворотом 1929 року, автономія Шокая одразу впала в громадянську війну. Хоча Мадамін-бек має значно міцніший контроль, ніж його попередник, республіка залишається глибоко розділеною. Щоб об’єднати націю навколо влади Мадаміна та Іттіфак уль-Муслімін, знадобиться чимало зусиль.\n\n§RЯкщо ми не досягнемо§! §YРівня консолідації§! §Rу§! §Y25%§!, §Rу разі конфлікту нам доведеться мати справу з внутрішнім спротивом.§!\n\nНаш поточний §YРівень консолідації§!: £authoritarian_democrat_texticon §Y[?TRK.party_popularity@authoritarian_democrat|%0]§!\n\nКоли консолідація перевищить §Y30%§!, ми зможемо зміцнити контроль над країною, завершивши фокус §YВід хабарів до зарплат§!, що надасть унікальні бонуси залежно від того, яка фракція — реформістська чи фундаменталістська — домінує в Іттіфак уль-Муслімін.\n"
 TRK_reformists_timer: "Мандат реформістів"
 TRK_gold_timer: "Зібрати золоту десятину"
 TRK_seize_syr_darya_waterfront: "Захопити ключову ділянку Сирдар’ї"
 TRK_bribe_kurbashi: "Купити лояльність курбаші"
 TRK_bribe_kurbashi_desc: "Фундаменталістська фракція нашої партії має підтримку в сільській місцевості, де влада курбаші є абсолютною. Кожен бек, курбаші та мінбаші передає частину ресурсів вищому лідеру, і ті, хто підтримує Катта Ергаша, становлять основу фундаменталістів. Лояльність багатьох таких лідерів можна купити — за правильну ціну."
 TRK_bribe_mullah: "Залучити реформістського проповідника"
 TRK_bribe_mullah_desc: "Сила реформістської фракції — в її здатності мобілізувати підтримку в містах Ташкент, Андижан і Коканд, головно через вплив мулл, які підтримують їхню позицію. Якщо ми переконаємо одного з цих учених виступити на підтримку політики Мадаміна, це зміцнить нас і послабить реформістів."
 TRK_expel_party_extremists: "Вигнати партійних радикалів"
 TRK_expel_party_extremists_desc: "Хоча Союз мусульман давно був широкою платформою для віруючих, із моменту приходу Мадаміна до влади його прагматична ідеологія стала основою популярності партії. Настав час для тих, хто не поділяє базові принципи, знайти собі інше місце."
 TRK_crackdown_on_critics: "Придушити голосних критиків"
 TRK_crackdown_on_critics_desc: "Ташкент — осередок небезпечних революційних сил, які прагнуть повернення Кокандської автономії та знищення нашого уряду. Якщо кількох заарештувати, а ще кілька — зникнуть, ми зламаємо хребет опору."
 TRK_anti_banditry_campaign: "Придушити бандитизм"
 TRK_anti_banditry_campaign_desc: "Є регіони, які повністю вийшли з-під контролю уряду та партії. Там правлять розбійники, не визнаючи ні Ташкент, ні шаріат. Ми повинні їх знищити."
 TRK_call_on_kichik: "Звернутися до Кічіка Ергаша"
 TRK_call_on_kichik_desc: "Після знищення Коканда більшовиками мусульманський опір згуртувався навколо колишнього начальника поліції — харизматичного Кічіка Ергаша, проголосивши його Амір уль-Мусліміном. Після важкого поранення в битві під Бачкіром він передав керівництво Мадаміну. Хоча Кічік не має офіційної посади, він залишається популярним і його слово має вагу."
 TRK_liberal_newspapers: "Розповсюджувати урядові газети"
 TRK_liberal_newspapers_desc: "Реформістські рухи Туркестану почали використовувати друкарні ще за часів Російської імперії, яка часто знищувала їх. Ми — не Російська імперія! Підтримаймо створення нової преси, яка інформуватиме народ про наші успіхи, зберігаючи свободу критикувати нас в ім’я волі народу."

 TRK_war_preparation: "Підготовка до війни"
 TRK_war_preparation_desc: "Бої, що спалахнули в Центральній Азії під час громадянської війни в Росії та кризи в Ташкенті, довели одне: під шквалом кулеметного вогню та артилерії навіть найзавзятіші воїни не витримують довго. Тож не дивно, що всі центральноазійські держави прагнуть модернізувати й централізувати свої армії до нового конфлікту, який поставить на випробування кожну з розрізнених басмацьких сил.\n\nНаш поточний рівень підготовки: £GFX_supply_texticon [?TRK_prep|H0]§Y%§!\n\nЯкщо рівень підготовки буде нижчим за §Y50%§! на момент початку війни, якість наших військ постраждає через нашу недбалість."
