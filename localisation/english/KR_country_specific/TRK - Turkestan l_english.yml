### Bookmark ###
 TRK_KR_gathering_storm_desc: "Протягом майже десятиліття після громадянської війни народ Туркестанської автономії розділяв долю своїх казахських братів як офіційна частина Російської Республіки.\n\nАле в хаосі 1929 року ситуація різко змінилася: сильна фігура автономії, Мадамін-бек, скористався моментом і проголосив себе президентом Республіки Туркестан.\n\nЗагроза російського втручання досі нависає, і він або втілить свою мрію про пантюркську, об’єднану Центральну Азію — або загине."

### Intro Screen ###
 TRK_country_intro_background: "GFX_TRK_intro"
 TRK_country_intro_header: "Громадянська війна в Туркестані"
 TRK_country_intro_header_1: "Кінець громадянської війни"
 TRK_country_intro_header_2: "Наслідки 1929 року"
 TRK_country_intro_header_3: "Світло Центральної Азії"

 TRK_country_intro_content: "На початку громадянської війни в Росії більшовики в Ташкенті — центрі російського контролю над Центральною Азією — піднялися на підтримку Червоної революції, скинувши колоніальний уряд і проголосивши Туркестанську Соціалістичну Федеративну Республіку. У відповідь ліберальні націоналісти та пантюркісти створили альтернативні уряди, прагнучи автономії та демократичного представництва в обмін на лояльність до білогвардійців.\n\nУ Коканді група джадидських еліт заснувала Туркестанську автономію (відомішу як Кокандська автономія), очолювану кадетом і діячем Алашу Мустафою Шокаєм. Хоча червоні спершу мали ініціативу, швидка націоналізація та нестача зерна підірвали їхню підтримку серед селян — як російських, так і місцевих.\n\nПоки білогвардійці на півночі зміцнювали позиції, фракції Ферганської долини змінювали союзників. Поміркований Мадамін-бек, соратник Ергаша-бека, об’єднав Російську селянську армію Фергани з басмачами. Коаліція захопила Ош і Андижан, але Ергаш-бек був тяжко поранений, і Мадамін-бек став беззаперечним лідером білого руху в Фергані. Після зустрічі з білогвардійцями з Пішбека його визнали командувачем новоствореної Ферганської армії."
 TRK_country_intro_content_1: "Після завершення війни нова Установча асамблея в Москві офіційно визнала автономії Алашу та Туркестану, надавши обмежені політичні права їхнім демократичним урядам в обмін на збереження російського контролю. Туркестанська автономія отримала де-юре контроль над Ферганською, Сирдар’їнською та Самаркандською областями, тоді як Закаспійська область залишилася під прямим управлінням російського губернатора в Ашгабаті. Військове командування було об’єднане під керівництвом командувача Туркестанського військового округу, який представляв центральну владу з Ташкента. Через слабкість влади міста, як-от Самарканд, зверталися до Ташкентського командування, а не до комісара Туркестану.\n\nПісля завершення бойових дій старі конфлікти серед білогвардійців Центральної Азії знову спалахнули. Хоча уряд автономії був офіційно визнаний Москвою, Шокай, Мадамін-бек і Монстров боролися за вплив. Попри ризик нової війни, вони досягли компромісу: Шокай і його прогресивний альянс Шуро-і-Іслам отримали цивільний контроль, Мадамін — військову владу у Фергані, а більшість армій воєначальників було інтегровано в армію автономії.\n\nДля Монстрова та російських селян було укладено серію договорів, які надали їм привілеї та зміцнили економічні зв’язки з російським центром. Мадамін, маючи тісні зв’язки з російськими солдатами й купцями, дозволив цивільному уряду взяти на себе політичну відповідальність за ці непопулярні угоди, що призвело до переходу багатьох поміркованих мусульман із Шуро-і-Іслам до консервативного Шуро-і-Улема."
 TRK_country_intro_content_2: "Після новорічного перевороту Болдирєва в Москві мир у Центральній Азії було зруйновано. Командувач Туркестанського округу Григор’єв присягнув путчистам, як і більшість російських військ у регіоні — зокрема Семиріченські козаки та гарнізон Ташкента. Побачивши шанс здобути справжню незалежність, Мадамін-бек зібрав армію лояльних росіян і басмачів та вирушив на Ташкент. Заручившись підтримкою ключових джадидів і росіян, він швидко повалив заколотника й захопив місто.\n\nНе знаючи ситуації в самій Росії, Мадамін проголосив себе президентом нової Республіки Туркестан. Шокай і його союзники спробували чинити опір, але були змушені втекти до Алашу після захоплення Коканда.\n\nУ хаосі після перевороту командири, лояльні Мадаміну, захопили спірні регіони та усунули російських губернаторів у Самарканді й Семиріччі. Алаш уже воював із козаками, а з приходом армії Мадаміна козаки були розбиті, і регіон розділили між собою дрібні загони. Самарканд виявився складнішою ціллю: емір Алім-хан проголосив себе «захисником Самарканда» й ввів війська. Місто прийняло армію Бухари, а Ібрагім-бек почав готувати облогу. Побоюючись атаки з півночі та визнавши силу ворога на півдні, Мадамін скасував наступ і почав укріплювати здобуті території."
 TRK_country_intro_content_3: "Мадамін-бек стабілізував режим, прагнучи перейти від польового командира до справжнього державника. Він залучив ташкентських купців до уряду, надавши йому технократичний характер, і збалансовував їхній вплив із лояльністю улемів і курбаші. Його прагматизм у співпраці з росіянами та підтримка цивільного уряду відштовхнули деяких басмачів, але він використав мирні роки для чистки нелояльних офіцерів і створення армії, особисто відданої йому.\n\nОстанні роки принесли Мадаміну дедалі більшу тривогу щодо російської агресії. Вважаючи, що лише об’єднана Центральна Азія зможе протистояти російському орлу, він дедалі більше схиляється до прагматичного пантюркізму — відображення його співпраці з купцями та джадидами. Використовуючи ці ідеологічні рамки, Мадамін почав виходити з дипломатичної ізоляції після кризи в Ташкенті, зокрема встановивши таємні зв’язки з антиросійськими діячами на півночі та в Хіві."
 TRK_guide: "Центральноазійські держави отримають §Cдодаткові шляхи та контент§! у майбутніх оновленнях.\n\nПісля перемоги у війні в Центральній Азії та розгрому Хіви ви зможете реформувати уряд:\n£white_dot Проведення виборів переведе вас у §cСоціальний консерватизм§!.\n£white_dot Відмова від виборів переведе вас у §PПатерналістський автократизм§!."

### Events ###

### Opening Events  ###

 turkestan_republic_events.99.t: "Спадщина Центральноазіатського повстання"
 turkestan_republic_events.99.d: "Коли Мустафа Шокай домовлявся про автономію Туркестану зі своїми російськими колегами, він пожертвував багато чим, щоб уникнути гніву центрального уряду в Москві. Ігноруючи роки старанної служби проти червоної загрози, російський уряд зневажав бійців басмачів і робив усе можливе, щоб підірвати контроль і авторитет автономії. Коли політична нестабільність у Москві загрожувала дестабілізувати Туркестан, Мадамін Бек піднявся, щоб скинути ярмо російського гніту і створити нову незалежну республіку в Центральній Азії, усунувши Шокая та його прогресивний режим і здобувши обмежені територіальні надбання в Семиріччі. Хоча спочатку Мадаміна Бека в його повстанні підтримував дикий туркменський командир Джунаїд Хан, втручання місцевих російських гарнізонів і товстого еміра Бухари змусило його сісти за стіл переговорів, залишивши Туркестан ізольованим і замкнутим, а позицію Мадаміна Бека — невизначеною.\n\nОстанніми роками Мадаміну Беку вдалося стабілізувати свій режим, зосередившись на переході від воєначальника до справжнього державного діяча. З цією метою він ще більше зблизився з міськими купцями та профспілковцями Ташкента, залучаючи багатьох із них до свого новоствореного кабінету, надаючи уряду виразно технократичного характеру. Балансуючи між цією новою групою та лояльністю й задоволенням улемів, основи його підтримки, контроль Мадаміна Бека над республікою зростає, тоді як його контроль над партією слабшає. Його готовність до компромісу з росіянами та прагматична підтримка цивільного уряду відштовхнули від нього деяких його басмацьких воєначальників, але він повільно ізолював і усунув деяких із найзапекліших опонентів.\n\nОстанні роки показали, що Мадамін Бек дедалі більше параноїть щодо російської агресії, особливо через повідомлення, що Москва жадібно поглядає на кордони. Вірячи, що лише об’єднана центральноазіатська нація має шанс протистояти російському стерв’ятнику, Мадамін Бек дедалі більше підтримує прагматичну пантюркістську позицію, що, можливо, є подальшим відображенням його зростаючої співпраці з ліберальними купцями та освітнім рухом джадідів, який вони фінансують. Використовуючи ці ідеологічні атрибути, Мадамін почав виходити з дипломатичної ізоляції, спричиненої Ташкентською кризою, зокрема встановлюючи таємні зв’язки з антиросійськими діячами по той бік північного кордону. Лише час покаже, чи виживе повстання Мадаміна Бека проти російського домінування в Центральній Азії під пильним поглядом пробудженого ведмедя."
 turkestan_republic_events.99.a: "За вільний Туркестан!"

 turkestan_republic_events.100.t: "Перетасовка"
 turkestan_republic_events.100.d: "Останні шість років Туркестан очолював Іттіфак уль-Мусульмін, квазіпартія релігійних лідерів, воєначальників і племінних вождів. З позиції президента Мадамін Бек балансував між забаганками цих різних груп, нагороджуючи лояльних підлеглих і союзників міністерськими посадами та караючи заколот пониженням. У багатьох аспектах підтримка новостворених республіканських інститутів була найбільшим досягненням Мадаміна Бека за його короткий час на чолі нації, і хоча мало хто назвав би Туркестан справжньою демократією, це не означає, що голос народу не чути. Його просто зазвичай ігнорують!\n\nПроте за останні пару років у партії з’явилися нові голоси, які стають дедалі гучнішими. Деякі з них — колишні поплічники вигнанця Мустафи Шокая, які належним чином підкорилися Мадаміну Беку та його новому уряду, тоді як інші — лояльні члени партії, які були з нашим рухом від самого початку. Усі вони вимагають великої пантюркістської революції, очолюваної Мадаміном Беком і спрямованої на об’єднання всієї Центральної Азії проти російського ярма. Хоча ця група починалася як невелика група аутсайдерів, їх більше не можна просто ігнорувати. Нещодавно виявлена корупція (поза межами звичайної, прийнятної корупції, звісно) надала Мадаміну Беку політичний капітал, щоб звільнити двох літніх консервативних міністрів, давши йому можливість перетасувати свій уряд і ввести свіжу кров. Він вирішив, що відомі реформісти Аліхан Тура та Ешон Бабахан займуть бажані посади міністра закордонних справ і міністра шаріату відповідно, нарешті давши реформістській фракції партії голос у його уряді.\n\nТура і Бабахан одразу ж взялися до роботи, переорієнтовуючи Республіку на свої цілі. Вони сподіваються зміцнити наші відносини з туркменським лідером Джунаїдом Ханом, реформувати відносини між нашими російськими та тюркськими громадянами та відкрити двері для залучення більш прогресивних священнослужителів до нижчих рівнів нашої бюрократії. Чи досягнуть вони всіх своїх цілей, ще належить побачити, але Аліхан Тура вже вирушив до Хіви, а Ешон Бабахан невтомно працює над проведенням перепису наших казі."
 turkestan_republic_events.100.a: "Новий напрямок для Республіки!"

 turkestan_republic_events.96.t: "Туркестанський баланс"
 turkestan_republic_events.96.d: "Коли Мадамін Бек прийшов до влади в 1929 році, це було на чолі великої та громіздкої коаліції тих, хто був незадоволений застоєм і слабкістю автономії Туркестану Мустафи Шокая. Він залежний від сільських вождів, капітанів курбаші, мудрих і не дуже мулл, а також своїх етнічно російських союзників, і може правити лише через ретельне балансування цих груп і створення консенсусу. Мадамін Бек провів останні сім років, повільно підриваючи традиційні канали влади, створюючи групу лояльних членів партії, зосереджених навколо його виваженої політичної ідеології та зародкового культу особи. Зрештою, є лише одна людина, яка змогла завоювати прихильність купців і найманців, сільських беків і високогірних бандитів, російських промисловців і радикальних моджахедів.\n\nУ Мадаміна Бека є можливість реформувати партію Союзу мусульман і Туркестан загалом, але для цього він мусить впоратися з різними крилами партії. Реформісти, очолювані Аліханом Турою, виступають за роззброєння військової влади в цивільному уряді та поступову мирну передачу влади більш парламентському уряду. Фундаменталісти, очолювані Катта Ергашем, натомість тиснули на Мадаміна Бека, щоб він розпустив Національну асамблею і зосередив владу в руках військових захисників нації. Мадамін Бек мусить збалансувати ці сили та зміцнити свій контроль над країною, якщо він хоче вийти з конфлікту неушкодженим."
 turkestan_republic_events.96.a: "Розкажіть мені про цих фундаменталістів"
 turkestan_republic_events.96.b: "Розкажіть мені про цих реформістів"

 turkestan_republic_events.97.t: "Беки та курбаші"
 turkestan_republic_events.97.d: "Традиційна вісь влади у фундаменталістському крилі Союзу мусульман і регіону загалом довго належала сільським вождям і племінним лідерам, які командували особистою повагою та лояльністю своїх родичів далеко за межами будь-яких уявлень про громадянський обов’язок чи ідеологічну відданість. Сільська місцевість Туркестану домінується клаптиковим покривом невеликих сіл, кожне з яких очолює видатна постать із титулом «Бек», що означає пан. Як і «беї» Османської імперії, багато провідних діячів у Туркестані носять свій титул як вождь, наприклад, прем’єр-міністр Мадамін Бек, який народився як Мухаммад Амін. Деякі з цих беків брали зброю до рук під час насильства останніх десятиліть, збираючи лояльні загони родичів і друзів, щоб захистити свої домівки від бандитів і соціалістів. Хоча деякі з цих загонів незабаром самі стали бандитами, багато хто згуртувався навколо харизматичних постатей, які почали називати себе «курбаші», або лідерами загону, або «мінбаші», лідерами тисячі людей. Хоча національна військова потреба в цих збройних загонах значною мірою зникла в роки після громадянської війни, немає сумнівів, що сільська місцевість Туркестану керується не з Ташкента, а з наметів і будинків незліченних воїнів-курбаші."
 turkestan_republic_events.97.a: "Розкажіть мені про цих реформістів"
 turkestan_republic_events.97.b: "Їм, можливо, доведеться знову сідлати коней!"

 turkestan_republic_events.98.t: "Прогресивісти та купці"
 turkestan_republic_events.98.d: "Зовнішні спостерігачі дивляться на Туркестан із презирством і огидою, вважаючи нашу культуру та народ відсталими й неосвіченими. Звісно, неосвічені саме вони, адже сліди ісламського Відродження та великого Шовкового шляху залишили нашу націю з потужним класом інтелігенції та бізнесменів, які могли б переконати навіть найзатятішого софіста. Починаючи з широкомасштабної реформи шкіл мактаб, прогресивісти поєднали модерністське тлумачення релігійних текстів із завуальованим антиколоніалізмом, щоб створити ідеологію, яка вимагала сучасного та незалежного Туркестану. Хоча деякі з цих людей приєдналися до більшовиків під час громадянської війни, багато хто підтримав Мадаміна Бека в його прагненні створити державу, керовану мудрістю шаріату. Останніми роками Мадамін Бек дедалі частіше запрошував багатьох видатних джадідів і купецькі сім’ї до свого уряду, створюючи цивільний уряд, який поєднує консерватизм улемів із прогресивним тлумаченням шаріату, запропонованим реформістами. Хоча влада цивільного уряду, безумовно, обмежена, джадіди та купці мають величезну м’яку силу в Туркестані, особливо в містах Ташкенті, Коканді та Андижані."
 turkestan_republic_events.98.a: "Розкажіть мені про цих фундаменталістів"
 turkestan_republic_events.98.b: "Їхня співпраця є життєво важливою!"

 turkestan_republic_events.101.t: "Наші договори з росіянами"
 turkestan_republic_events.101.d: "Завершення російської громадянської війни призвело до створення нових відносин між нашим регіоном і урядом у Москві, сформувавши автономію Туркестану Мустафи Шокая. У двадцяті роки мало хто думав, що статус-кво сильно зміниться. Поки старіючі басмачі та джадіди сперечалися, командувач Туркестанського військового округу забезпечував потік бавовни на північ зі своєї посади в Ташкенті. Коли командувач Володимир Дмитрович Григор’єв повів свої сили на підтримку антиурядового перевороту, настав час для змін!\n\nМадамін Бек розпустив стару автономію і проголосив незалежність нової Республіки Туркестану, після чого рушив на Ташкент із армією лояльних патріотів. Однак, діставшись до міста, він виявив, що генерал Григор’єв уже мертвий, убитий лоялістами, а росіяни значною мірою демобілізувалися і відступили, щоб впоратися з наслідками невдалого перевороту. Зустрівшись із старшими купцями та лідерами Ташкента, Мадамін уклав угоду, яка надала місту особливі привілеї в обмін на їхню лояльність. Із забезпеченими новими територіями та швидким погіршенням російської позиції в Центральній Азії Мадамін зміг укласти Ташкентський договір із російськими агентами, формалізуючи суверенітет Туркестану та його нове панування над колишнім серцем нині мертвого військового округу, в обмін на продовження російського домінування в торгівлі та принизливе визнання російського панування над Новим Ташкентом."
 turkestan_republic_events.101.a: "Багато компромісів було необхідно..."

 turkestan_republic_events.102.t: "Наближається буря"
 turkestan_republic_events.102.d: "У порівнянні з бурхливими днями Новорічного перевороту, останні півдесятиліття були періодом миру та застою, коли всі сторони зализували свої рани і сподівалися на відновлення. Центральна Азія сьогодні стоїть на межі кипіння, де інтелігенція, бандити, революціонери та деспоти прагнуть розірвати статус-кво. За кордонами російський командувальний склад розробляє плани та прораховує логістику, з нетерпінням чекаючи моменту, коли можна помститися за приниження Ташкентської кризи, а генерали нетерпляче чекають дозволу від начальства, щоб раз і назавжди розчавити автономії та протекторати. Лише питання часу, коли в Центральній Азії знову спалахне відкритий конфлікт, але армії та ополчення держав регіону загалом недисципліновані, недофінансовані та ледь функціонують. Потрібно буде чимало зусиль, щоб перетворити селянський натовп і самозваних бандитів на справжні армії, і можна лише здогадуватися, як кожна держава планує реформувати свої війська.\n\nОднак одне є певним — §Rмир 1929 року не триватиме.§!"
 turkestan_republic_events.102.a: "Шлях до незалежності прокладає армія!"

 turkestan_republic_events.103.t: "Чорний понеділок у Ташкенті"
 turkestan_republic_events.103.d: "Майже місяць тому біржа в Берліні обвалилася, спричинивши хаос на світових ринках і завдавши шкоди навіть найвіддаленішим економікам. Найпомітніше, що сусідній економічний гегемон у Москві зазнав серйозного удару, коли рубль різко втратив у вартості, а німецькі та австрійські інвестиції в промисловий ринок вичерпалися. Інвестиції, зроблені в Центральну Азію за правління Мустафи Шокая, надзвичайно тісно пов’язали нашу економіку з російською, коли промисловці з Москви, Петрограда та Берліна фінансували значну частину будівництва в містах Коканда і Ташкента. З швидким відходом цих діячів від їхніх хитких інвестицій у наші землі наша економіка практично замерзла, але тепер у нас є можливість повернути економічний суверенітет після десятиліть іноземного контролю. Хоча ринок зернових, вироблених у родючій Ферганській долині, залишився стабільним перед обличчям глобального сільськогосподарського спаду, молодий ринок експорту бавовни був непоправно підірваний припиненням російського інтересу. Це момент як можливостей, так і небезпек у рівних пропорціях, і нашому уряду доведеться діяти обережно."
 turkestan_republic_events.103.a: "Нам доведеться перебудовувати"

 turkestan_republic_events.104.t: "Зустріч із хівинцями"
 turkestan_republic_events.104.d: "Коли Мадамін Бек повстав проти російського домінування, його єдиним справжнім союзником став несподіваний партнер — туркменський диктатор Хіви Джунаїд Хан. Хоча хівинці офіційно зберігали лояльність до Росії після укладення миру, похід Джунаїда Хана проти слабкої транскаспійської адміністрації та лоялістів Алашу став ключовою зміною у відносинах Хіви з Москвою. У наступні роки довірений помічник Джунаїда Хана Азіз Хан тісно співпрацював із нашим урядом, координуючи план майбутнього опору та створюючи мережу для переправлення зброї з Європи до рук командирів басмачів Туркестану. Сьогодні Хіва і Ташкент є віссю секретного проєкту визволення Центральної Азії, обмеженого лише туркменським шовінізмом Джунаїда Хана та невизначеним ставленням Мадаміна Бека до пантюркізму багатьох його співвітчизників.\n\nНещодавно Азіз Хан і наш новий міністр закордонних справ Аліхан Тура зустрілися в таємних кімнатах королівського палацу хівинського хана, приховані від пильних очей і вух російських агентів та роялістських шпигунів. Вони використали цю зустріч, щоб запропонувати новий раунд координації між двома бунтівними державами Центральної Азії, зосереджений переважно на захисті від дедалі ворожішої позиції російського уряду після обрання Бориса Савінкова. Ці свіжі переговори — лише останні в серії дипломатичних маневрів між нашими націями, які досягли свого апогею в листопаді 1935 року з Таємним пактом про взаємодопомогу, укладеним у секреті між двома націями Аліханом Турою (досягнення, яке принесло йому нинішню роль міністра закордонних справ) після особливо палкої промови, в якій Борис Савінков закликав до повного скасування Ташкентських договорів."
 turkestan_republic_events.104.a: "Його войовничість дала нам потрібну можливість."

 turkestan_republic_events.105.t: "Туркестанське золото"
 turkestan_republic_events.105.d: "Хоча нам бракує промисловості, наші землі благословенні багатими джерелами золота, яке або видобувається примусовою працею у великих відкритих кар’єрах, або вимивається з великих річок, які щороку виносять тонни золотого пилу з високогір’я. Значна частина цієї інфраструктури збору золота контролюється кабалою багатих курбаші, які підтримують свою незалежність регулярними та щедрими особистими подарунками Мадаміну Беку, зазвичай у вигляді шовкового одягу, вишитого золотом, килимів, тканих золотом, а також прекрасних золотих прикрас, виготовлених найкращими ювелірами-заргарами в Ташкенті та Андижані. Продаж цих продуктів до Росії та за кордон на ринки Міттельєвропи забезпечив Мадаміна Бека вкрай потрібним іноземним капіталом, давши йому можливість імпортувати спеціалізовані товари та фінансувати ініціативи зовнішньої політики."
 turkestan_republic_events.105.a: "Золото для нової золотої ери!"

 turkestan_republic_events.106.t: "Розширення Таємного пакту"
 turkestan_republic_events.106.d: "Як ми й очікували, російські маневри для зміцнення контролю над Ханством Хіви обернулися проти них, і цього тижня до Ташкента дійшли звістки про невдалий російський дипломатичний маневр. Вони намагалися усунути улюбленого російського агента Джунаїда Хана, генерала Івана Зайцева, який довго був найміцнішим цвяхом, що утримував російський контроль над хівинською політикою. Такий крок може означати лише одне — Москва прагне зруйнувати свої хиткі відносини з невдоволеним хівинським союзником, ймовірно, намагаючись спровокувати їх. Тепер ясно, що Росія прагне виправдати конфлікт у Центральній Азії, і єдиний спосіб вижити — це продовження розширення Таємного пакту Туркестану та Хіви. Довірений помічник Джунаїда Хана Азіз Хан, здається, погоджується з нашою оцінкою, принаймні настільки, що погодився зустрітися з нами в короткі терміни, щоб обговорити поворот Ханства до тіснішої координації з нашим урядом.\n\nУ рамках підготовки Аліхан Тура отримав дозвіл від Мадаміна Бека запропонувати радикально новий напрямок для наших двох націй. Ми запропонуємо велику публічну конференцію між провідними державними діячами Туркестану та Хіви, а також дисидентами, вигнанцями та повстанцями, які поділяють наше бажання співпраці в Центральній Азії та нашу тверду позицію в опорі російському домінуванню в регіоні. У дні після Різдвяного перевороту, під час хаосу Ташкентської кризи, Джунаїд Хан і Мадамін Бек координували свої сили для непрямої підтримки один одного — чому б їм не стояти разом сьогодні, коли Росія жадібно дивиться на наші землі та марширує до наших кордонів? Конференція для співпраці стане першим кроком до створення нового пантюркістського визвольного проєкту, незважаючи на туркменський шовінізм Джунаїда Хана та невизначене ставлення Мадаміна Бека до ідеалізму його міністра. Аліхан Тура запросить Джунаїда Хана особисто відвідати цю зустріч, щоб він знову зміг зустрітися з Мадаміном Беком — сподіваємося, особистий шарм президента Туркестану буде достатнім, щоб переконати хівинського воєначальника приєднатися, але в будь-якому разі така зустріч відкриє нову еру єдності між нашими народами! Нам лише потрібно вирішити, як ми підійдемо до Азіза Хана та хівинців із нашими пропозиціями — ми хочемо заохотити їхню підтримку, але не можемо виглядати слабкими, занадто сильно підкоряючись хівинцям. Зрештою, їм потрібна наша допомога так само, як нам хотілося б їхньої."
 turkestan_republic_events.106.a: "Підсолодіть угоду додатковими збройними угодами та подарунками!"
 turkestan_republic_events.106.b: "Кричіть про єдність скільки завгодно, але пам’ятайте, що це союз необхідності, а не бажання."

 turkestan_republic_events.107.t: "Балада про Мустафу Шокая"
 turkestan_republic_events.107.d: "Коли Ташкентська рада рушила на новонароджену Кокандську автономію в лютому 1918 року, тодішній міністр-голова Мустафа Шокай утік на північ із міста, доручивши захист міста начальнику поліції Кічіку Ергашу та популярному муллі Катта Ергашу, дуету, який, попри втрату Коканда безбожним червоним, став ядром національно-визвольного руху Фергани. Поки командири басмачів проливали кров і гинули за Туркестан, Шокай проводив свої дні, потираючи лікті з російськими військовими та політичними діячами, завоюючи їхню прихильність як «надійний тубілець». Таким чином, коли через два роки останні залишки більшовицького опору здалися в Перовську, саме до Шокая тимчасовий уряд звернувся за керівництвом і підтримкою. Саме під керівництвом Шокая Туркестан провів десятиліття, атрофуючись від російської експлуатації, коли він неодноразово намагався і не зміг досягти будь-якої тривалої політичної реформи через переговори з Москвою. Це не означає, що Шокай не був туркестанським патріотом — коли Москва демонструвала свою незацікавленість у будь-яких розумних чи справедливих домовленостях з автономією, він дедалі більше очолював боротьбу проти російського самовладдя, ризикуючи своєю позицією в підтримуваному Росією уряді Національного союзу, щоб боротися за справжню туркестанську свободу. На жаль, коли Мадамін Бек розрубав гордіїв вузол російської непоступливості своїм маршем на Ташкент, Мустафа Шокай вирішив не підтримувати цей новий незалежний уряд, натомість утік на північ до Алашської автономії, де він сьогодні живе у вигнанні."
 turkestan_republic_events.107.a: "Можливо, ми зможемо переконати його приєднатися до нашої справи?"

 turkestan_republic_events.108.t: "Туркестан запрошує нас до Пішпека"
 turkestan_republic_events.108.d: "Азіз Хан повідомив нам про драматичний новий розвиток на наших кордонах — Республіка Туркестан запропонувала велику конференцію лідерів Центральної Азії в їхньому місті Пішпек, зібравши всіх, хто виступає проти російського домінування в регіоні. Хоча офіційно мета конференції — домовитися про всеосяжні торговельні угоди в регіоні, це відкрита таємниця, що зібрані лідери обговорюватимуть набагато більше, ніж мідні монети. Насправді, Азіз Хан здається переконаним, що це зібрання призведе до справжнього союзу проти російського домінування серед народів Центральної Азії. Він стверджує, що ми досягли неймовірного успіху в попередніх зустрічах із міністром закордонних справ Туркестану Аліханом Турою для розширення меж нашого Таємного пакту з Туркестаном, укладеного проти Росії на піку Ташкентської кризи півдесятиліття тому.\n\nЗ погіршенням наших відносин із Москвою після їхніх зухвалих кроків проти нашої незалежності нам потрібно буде налагодити тісніші зв’язки з нашими сусідами, особливо з Туркестаном. Однак у Джунаїда Хана є особисті побоювання щодо зв’язування себе з будь-якою іншою нацією, особливо з нацією, яка відкинула природний порядок світу — де правлять служать обраним небесами як хан — на користь соціалістичних понять «республіки» та «виборів». Що завадить Мадаміну Беку бути усунутим на користь чергового російського лакея через десять років? Однак Азіз Хан правий у тому, що Хіва не може дозволити собі чекати, сидячи склавши руки, поки Росія готується до інтервенції. Чи то наші потенційні союзники є безбожними язичниками, чи відродженими ханами старовини, ми повинні зустрітися з ними, щоб протистояти Москві. Єдине справжнє питання — чи повинен сам Джунаїд Хан бути присутнім. Він є беззаперечним правителем Хіви, але також у похилому віці та параноїть щодо можливого зрадництва на чужих землях. Він міг би так само легко відправити Азіза Хана як свого агента, враховуючи, що наш лейтенант дуже обізнаний у питаннях зовнішньої політики і тісно співпрацював з Аліханом Турою останні пару місяців. Йому можна довірити отримати потрібні нам гарантії."
 turkestan_republic_events.108.a: "Ми поїдемо до Пішпека разом!"
 turkestan_republic_events.108.b: "Краще бути обережним, ніж шкодувати — відправте Азіза Хана з моїми наказами."

 turkestan_republic_events.109.t: "Пішпецька конференція"
 turkestan_republic_events.109.d.trkjk: "Збори були різноманітною мозаїкою людей із різних племен, країн і верств суспільства. Курбаші з Фергани та Хорезму сиділи, бурмочучи в невеликих групах, тоді як суперницькі інтелігенти з Самарканда і Ташкента обережно поглядали один на одного. Люди з Алашської автономії, в рівній кількості ліберальні державні діячі та загартовані солдати, сиділи разом мовчазно, до них приєднався тихий агент від османського уряду. У задній частині кімнати груба група вигнанців із Сіньцзяну напружено розмовляла між собою. Усі звернули увагу, коли Мадамін Бек виклав свій план для майбутнього Центральної Азії: хоча Росія могла б легко придушити будь-яку індивідуальну спробу послабити їхню хватку в Центральній Азії, якщо різноманітні регіональні опори об’єднають свої сили, вони стануть достатньо грізним ворогом, щоб змусити Росію сісти за стіл переговорів.\n\nОднак, перш ніж він зміг продовжити переконувати інших учасників, командир Алашу Садик Аманжолов піднявся, щоб виступити. За словами лідера казахського ополчення, у його підконтрольній Росії батьківщині назріває широка змова, значна частина партії Алашу та лідерів ополчення прагнуть порвати з керівництвом автономії, щоб протистояти російському домінуванню. Аманжолов стверджував, що за два роки він буде готовий повести казахів до свободи, поваливши про-російський уряд — іскра, яка, ймовірно, призведе до російської інтервенції.\n\nНегайно різні сторони почали жваво обговорювати здійсненність такої ініціативи та те, як різні присутні групи повинні допомогти втілити її в життя. Незабаром були накреслені контури скоординованого повстання в дусі революції 1916 року, разом із положеннями, які ляжуть в основу нового секретного оборонного альянсу, не лише між Хівою та Туркестаном, але й із цією новою казахською змовою. У міру продовження дискусій дедалі більше сторін почали пропонувати різні схеми та ініціативи, які альянс міг би втілити для кращого об’єднання залучених націй і груп. Звісно, такі схеми вимагають фінансування, і залишається питання, скільки внесе Республіка Туркестан."
