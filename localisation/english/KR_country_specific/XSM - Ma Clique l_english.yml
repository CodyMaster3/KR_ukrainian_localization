### Ideas ###
 XSM_destruction_gansu:0 "Руйнування Ганьсу"
 XSM_destruction_gansu_desc:0 "Кліка Ма стала на бік Гоміньцзюню під час Антифентянської війни, що призвело до окупації військами Гоміньцзюню Нижнього Ганьсу, північного Цінхаю та частин Нінся. Найбільше постраждала провінція Ганьсу, де розташований Тяньшуйський арсенал — головний центр виробництва зброї кліки. Гоміньцзюнь витиснув із провінції всі обмежені ресурси для фінансування війни, залишивши цивільну промисловість та сам арсенал у руїнах. Хоча зрада Ма у 1926 році допомогла обмежити масштаби шкоди, наслідки тих подій відчуваються й досі, оскільки Ма Фусян зосереджує зусилля на справах Нінся та Суйюаню, ігноруючи Ганьсу."

 XSM_destruction_gansu2:0 "Відбудова Ганьсу"
 XSM_destruction_gansu2_desc:0 "Кліка Ма підтримала Гоміньцзюнь під час Антифентянської війни, що призвело до окупації багатьох північно-західних провінцій. Найбільше постраждав південь Ганьсу, де Гоміньцзюнь нещадно визискував ресурси для фінансування воєнних дій. Хоча зрада Ма у 1926 році дещо пом'якшила удар, Ганьсу досі перебуває в занепаді, поки [XSM.GetLeader] віддає перевагу вирощуванню опіуму в Нінся та Суйюані замість розвитку Ганьсу."

 XSM_destruction_gansu3:0 "Відбудова Ганьсу"
 XSM_destruction_gansu3_desc:0 "Хоча зрада Ма у 1926 році обмежила шкоду, Ганьсу досі оговтується від окупації, поки [XSM.GetLeader] зосереджується на опіумних плантаціях Нінся та Суйюаню. Нарешті ми досягли перелому в боротьбі з посівами опіуму в Ганьсу і робимо кроки до звільнення народу від згубних східних звичок."

 XSM_han_hui_divide:0 "Розкол ханьців та хуейцзу"
 XSM_han_hui_divide_desc:0 "Хоча зусилля Ма Фусяна з поєднання конфуціанських та ісламських ідеалів допомогли «гуманізувати» образ хуейцзу в очах ханьського населення північного заходу, на мусульман досі часто дивляться як на диких звірів. Знадобляться роки, аби остаточно викорінити ці упередження, тож наразі нам залишається лише чекати на поступове примирення."

 XSM__hui_supremacy:0 "Верховенство хуейцзу"
 XSM__hui_supremacy_desc:0 "Народ хуейцзу має постояти за себе перед обличчям ханьського імперіалізму. Нашому керівництву все ще може знадобитися тактичний союз із ханьцями, проте це лише засіб для збереження нашої власної культури."

 XSM_han_hui_cooperation:0 "Співпраця ханьців та хуейцзу"
 XSM_han_hui_cooperation_desc:0 "Народ хуейцзу має відкинути свої фундаменталістські застереження та об'єднатися з ханьцями проти чужинців. Ми довели в боях, що здатні захистити себе, і тепер ханьці поважають нашу культуру."

 XSM_stable_government:0 "Стабільний уряд"
 XSM_stable_government_desc:0 "Уряд Ма Ліня в Цінхаї доклав великих зусиль, аби перетворити цивільну адміністрацію на взірець для всього західного Китаю. Створено нові державні програми та офіційні посади для ефективнішого управління провінцією."

 XSM_dispersed_society:0 "Розпорошене суспільство"
 XSM_dispersed_society_desc:0 "Північно-західний Китай заселений значно менш щільно порівняно зі сходом. У Нінся, Цінхаї та Верхньому Ганьсу переважає кочове населення, а великих міст обмаль. Перевагою цього є багатовіковий досвід верхової їзди наших людей та складність проведення ворожої повітряної розвідки чи диверсій. Недоліком є небажання людей осідати на місцях, що гальмує наш і без того низький технологічний рівень."

 XSM_horse:0 "Елітна кавалерія"
 XSM_horse_desc:0 "Вершники та племінні воїни з усіх куточків краю готові завдати нищівних ударів по ворогах кліки Ма."

 XSM_local_logistics:0 "Традиційна логістика"
 XSM_local_logistics_desc:0 "Ми відрізані від західних інновацій на кшталт моторизованого постачання, проте в Китаї все одно немає інфраструктури для його підтримки. Покладаючись на традиційні методи, ми не здобудемо нагород за технології, але мул подолає пересічену місцевість цієї країни значно легше за вантажівку."

 XSM_opium_production:0 "Опіум у Ганьсу"
 XSM_opium_production_desc:0 "Родина Ма має визнати сувору економічну правду Китаю. Доки ринок опіуму не зникне, а весь Китай не буде просвітлений ісламом, ми маємо отримувати прибуток із пороків ханьців."

 XSM_intervention_idea:0 "Завзяті добровольці"

 XSM_northwest_war_idea:0 "Адаптація до війни на північному заході"
 MON_northwest_war_idea:0 "Адаптація до війни на північному заході"
