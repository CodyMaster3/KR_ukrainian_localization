### Decisions ###
 XSM_qinghai_struggle:0 "Боротьба за Цінхай"
 XSM_qinghai_struggle_desc:0 "Південна Кліка Ма, що нині панує над Цінхаєм, перебуває в епіцентрі гострої сімейної ворожнечі між Ма Лінем та Ма Буфаном. Хоча до відкритих зіткнень справа ще не дійшла, протистояння дядька та племінника перетворилося на війну впливів: обидві сторони намагаються схилити на свій бік інших членів родини та заслужити довіру народу Цінхаю.\n\n§GМа Лінь§! фактично контролює §Y[?XSM.XSM_lin_qinghai_control]%§! Сінінської ради.\n§RМа Буфан§! фактично контролює §Y[?XSM.XSM_bufang_qinghai_control]%§! Сінінської ради."
 XSM_bufang_coup_mission:0 "Ма Буфан робить свій хід"
 XSM_ask_feng_yuxiang_for_guominjun_support:0 "Просити Фен Юйсяна про підтримку Гоміньцзюню"
 XSM_ask_feng_yuxiang_for_guominjun_support_desc:0 "Фен Юйсян усе ще перебуває в Шаньсі з чималою армією, готовою до виступу. Ма Лінь та його оточення в Сінінській раді симпатизують його справі й бажають налагодити з ним зв'язки. Чи прийме він їхню пропозицію — залишається питанням."
 XSM_hold_meeting:0 "Скликати засідання Сінінської ради"
 XSM_hold_meeting_desc:0 "Ма Лінь, хоча його й не всі поважають у раді, мусить підтримувати свій статус. Скликання засідання ради може повернути йому необхідний авторитет, проте це також дає шанс Ма Буфану перехопити ініціативу в дискусії."
 XSM_lin_speech:0 "Підготувати промову"
 XSM_lin_speech_desc:0 "Поки Ма Буфан продовжує свої інтриги, нашому режиму вкрай потрібна повага. Публічна промова про поточні проблеми та шляхи їх вирішення може зміцнити позиції Ма Ліня."
 XSM_public_donations:0 "Публічні пожертви"
 XSM_public_donations_desc:0 "Використання особистих коштів Ма Ліня для допомоги мешканцям Сініна допоможе здобути прихильність не лише простого люду, а й деяких членів ради."
 XSM_council_defection:0 "Перехід на інший бік у раді"
 XSM_council_defection_desc:0 "Ма Буфан знову почав свої маневри в раді, використовуючи погрози, хабарі та підступні чутки задля здобуття підтримки. Очікується, що він не припинить цю діяльність, доки питання губернаторства не буде остаточно вирішене."

 XSM_yushu_conflict:0 "Конфлікт навколо Юйшу"
 XSM_yushu_conflict_desc:0 "Юйшу — це спірна територія між Тибетом та родиною Ма, контроль над якою постійно змінювався з початку 1930-х років. Поки зберігається статус-кво, обидві сторони намагаються діяти так, аби місто зрештою опинилося під їхньою владою. Це може призвести до конфлікту значно більшого масштабу, ніж очікувалося...\n\nПоточна напруженість у Юйшу: §Y[?XSM.yushu_tensions]§!\n\nКонтроль Кліки Ма над Юйшу: §Y[?XSM.yushu_control]%§!\nКонтроль Тибету над Юйшу: §Y[?TIB.yushu_control]%§!"
 XSM_ma_biao_decision:0 "Повернути Ма Бяо до Юйшу"
 XSM_ma_biao_decision_desc:0 "Попри те, що Ма Бяо пішов у відставку з посади захисника Юйшу після нашого успішного втручання в тибетсько-сичуаньську війну, загроза з боку племінних набігів знову робить його присутність необхідною. Проте повернення «героя тибетської війни» точно не залишиться непоміченим нашими південними сусідами."
 XSM_reinforce_biao_garrison:0 "Поповнити залогу Ма Бяо"
 XSM_reinforce_biao_garrison_desc:0 "Ма Бяо постійно відбиває тибетські набіги на півдні, тому він потребує щомісячного поповнення гарнізону. Якщо ми не забезпечимо його ресурсами, це дасть тибетцям шанс на серйозний прорив у регіоні."
 XSM_yushu_government_police:0 "Створити поліцію в Юйшу"
 XSM_yushu_government_police_desc:0 "Створення поліції в Юйшу було частиною «плану восьми пунктів» Ма Ці, проте його раптова смерть завадила цьому. З огляду на зростання напруженості, можливо, настав час виконати цю обіцянку?"
 XSM_yushu_government_police2:0 "Відправити доб-добів до монастиря Г'єгу"
 XSM_yushu_government_police2_desc:0 "Захист монастиря Г'єгу був частиною політики 13-го Далай-лами, проте це не було втілено до його смерті. Зі зростанням напруженості, можливо, настав час виконати цю обіцянку?"
 XSM_dongxiang_mongol_raid:0 "Набіг дунсянських монголів"
 XSM_dongxiang_mongol_raid_desc:0 "Невелика монгольська громада в Цінхаї відома як вправні найманці, що воювали на нашому боці в тибетській війні. Ми можемо залучити їх для розвідки та нападів на тибетські табори."
 XSM_dongxiang_mongol_raid2:0 "Набіг ґолоків"
 XSM_dongxiang_mongol_raid2_desc:0 "Залишки ґолоків у Тибеті прагнуть помститися за різанину, вчинену нінсянською армією. Ми можемо залучити їх для розвідки та нападів на табори Ма."
 XSM_reinforce_border:0 "Посилити кордон"
 XSM_reinforce_border_desc:0 "Хоча кордон між Тибетом та Цінхаєм існує на папері, насправді це хаотична суміш тибетських та китайських зон контролю. Посилення офіційного кордону має посилити тиск на тибетські райони."
 XSM_reinforce_border2:0 "Посилити кордон"
 XSM_reinforce_border2_desc:0 "Хоча кордон між Тибетом та Цінхаєм існує на папері, насправді це хаотична суміш тибетських та китайських зон контролю. Посилення офіційного кордону має посилити тиск на райони під контролем Ма."

 ### Bookmark ###
 XSM_KR_gathering_storm_desc:0 "Три родини Ма непохитно тримають владу на північному заході вже протягом тридцяти років. Вони встигли побувати союзниками майже кожної сили в Китаї, а іноді навіть воювали між собою, аби втримати прихильність усіх сторін. Нині родину Ма вважають одним із найважливіших союзників нової династії Цін під проводом Чжилійської кліки.\n\nЗвісно, не все так гладко. Серцевий напад Ма Фусяна три роки тому похитнув стабільність кліки, і відтоді відчуття тривоги та невдоволення поступово шириться регіоном. Наразі на північному заході панує мир, але його майбутнє значно менш певне, ніж хотілося б бачити багатьом..."

 ### Intro Screen ###
 XSM_country_intro_background:0 "GFX_XSM_intro"
 XSM_country_intro_header:0 "Вступ до історії §PКліки Ма§!"
 XSM_country_intro_content:0 "§PКліка Ма§! складається з низки §lкитайських§! губернаторів, які вірно служили §cдинастії Цін§! ще з 1880-х років. Родина Ма — це не один гігантський клан, а три окремі гілки, що розділили владу в регіоні. §PПерша родина§! втратила вплив після смерті голови клану §PMа Аньляна§! у 1918 році. Тепер провідну роль відіграють §Pдруга§! та §Pтретя родини§!, під чиїм керівництвом регіон процвітає.\n\nПід час §lСиньхайської революції§! Ма під проводом §PАньляна§! спочатку підтримали §cЦін§!, проте коли поразка стала очевидною, перейшли на бік §lреспубліки§!. Згодом вони змусили §Pмонголів§! на півночі та §PТибет§! на півдні визнати §lРеспубліку§! законним урядом, підтримуючи стабільність у Північно-Західному Китаї. Після смерті §PMа Аньляна§! у 1918 році кліка фактично розділилася навпіл: §PКліка Ма§! під проводом §PMа Фусяна§! утримувала §PГаньсу§! та §PNінся§!, а §cпівденна кліка§! під проводом §cМа Ці§! закріпилася в майбутньому §cЦінхаї§!.\n\nПопри поділ, кліка зберігала певну єдність у виборі союзників. Коли §aГоміньцзюнь§! окупував §PПівденний Ганьсу§!, це змусило Ма підтримати §aФен Юйсяна§!. Однак, коли стан справ у Гоміньцзюні погіршився, майже всі §Pмілітаристи§! Ма зрадили його і перейшли на бік §PЧжилійської кліки§!.\n\nЗалишаючись вірними §PЧжилі§! під час §cреставрації Цін§! та після неї, Ма стали довіреними особами для більшості китайських фракцій як надійні захисники північного заходу, що прагнуть зберегти ці землі §lкитайськими§!. Нині, правлячи також над §aСуйюанем§! (відомим серед §Pмонголів§! як §aУланчаб§!), кліка процвітає як життєво важлива частина §cімперії Цін§!, готова битися за свої переконання."

 XSM_guide:0 "§MМа Лінь зберігає контроль§! ($social_conservative_coloured$)\n£white_dot У боротьбі за Цінхай тримайте вплив Ма Ліня вище 50%.\n£white_dot Після завершення північно-західного конфлікту, коли протистояння Ма Хунбіня та Ма Хункуя загостриться, зробіть так, аби Сінінська рада не підтримала Ма Хункуя, а натомість надала повну підтримку Ма Ляну в управлінні Нінся разом із Ма Хунбінем.\n£white_dot Після цього залиште Ма Хунбіня в спокої в Нінся. Це дозволить Ма Ліню залишитися при владі, а конфлікт лишиться нерозв'язаним.\n\n§MМа Буфан захоплює владу§! ($national_populist_coloured$)\n£white_dot У боротьбі за Цінхай підніміть вплив Ма Буфана вище 50%.\n£white_dot Після завершення північно-західного конфлікту, коли боротьба Ма Хунбіня та Ма Хункуя посилиться, зробіть так, аби Сінінська рада не підтримала Ма Хункуя, а надала повну підтримку Ма Ляну в Нінся разом із Ма Хунбінем.\n£white_dot Згодом залиште Ма Хунбіня одного в Нінся. Так Ма Буфан залишиться на чолі кліки, а загальний конфлікт не буде вичерпано.\n\n§MМа Хунбінь обходить Ма Хункуя§! ($authoritarian_democrat_coloured$)\n£white_dot Після північно-західного конфлікту зробіть так, аби Сінінська рада не підтримала ні Ма Хункуя, ні Ма Ляна. Це дозволить Ма Хунбіню переграти Ма Хункуя та очолити всю кліку Ма з Нінся.\n\n§MМа Хункуй обходить Ма Хунбіня§! ($paternal_autocrat_coloured$)\n£white_dot Після північно-західного конфлікту зробіть так, аби Сінінська рада підтримала Ма Хунбіня та його нові методи. Це зробить саме його губернатором всієї Кліки Ма."

### Events ###
 ma_clique_events.2.t:0 "Три провінції"
 ma_clique_events.2.d:0 "База влади родини Ма зосереджена у трьох основних провінціях: Нінся, Ганьсу та найновішій — Цінхаї.\n\nНінся та Ганьсу перебувають під контролем північної Кліки Ма: Ма Фусян обіймає посаду губернатора Ганьсу, а його племінник Ма Хунбінь — губернатора Нінся. Ганьсу є осередком могутності кліки, адже тут розташований Ланьчжоуський арсенал (основне збройове виробництво) та проживає найбільша кількість населення. Південь провінції досі оговтується від кривавої окупації Гоміньцзюню, що підірвало цивільну промисловість. Також на півночі діє небезпечний молодий мілітарист Ма Чжун'їн. Нінся ж є головним джерелом людських ресурсів: провінція багата на коней та бандитів, готових до вербування. Хоча в мирний час потенціал Нінся не очевидний, у разі війни її цінність стрімко зросте.\n\nПівденна Кліка Ма під проводом Ма Ліня керує нещодавно створеною провінцією Цінхай. Це найбільш сільський регіон північного заходу, де населення переважно кочує або зосереджене у великих містах, як-от Сінін. Південь провінції — постійно оспорювана територія між Ма та Тибетом, контроль над якою регулярно переходить від тибетських кочівників до китайських варлордів. Епіцентром боротьби є місто Юйшу. Хоча ситуація наразі затихла, навряд чи це надовго. Політична влада в Сініні розколота між губернатором Ма Лінем та його племінником Ма Буфаном. Багато хто вважає усунення Ліня неминучим, адже Буфан щодня залучає на свій бік дедалі більше прихильників."
 ma_clique_events.2.a:0 "Ці три провінції — ключ до всього."

 

 ma_clique_events.3.t:0 "Ма Фусян виступає в Тяньшуї"
 ma_clique_events.3.d:0 "Рік добігає кінця, і наближається рік Щура. Ма Фусян, попри слабкість після серцевого нападу, звернувся до жителів Тяньшуя, столиці Ганьсу. Він наголосив на стабільності, яку уряд Цін під проводом Чжилійської кліки приніс усьому Китаю за останні 10 років, і висловив вдячність за підтримку його губернаторства в Ганьсу та Суйюані.\n\nМа Фусян зміг стати одним із найбільш довірених посадовців уряду Чжилі. Попри минулу зраду на користь Гоміньцзюню під час окупації, його повернення до лав прихильників імперії зробило його ключовою фігурою. Він прищепив свої погляди Ма Хункуєві та Ма Хунбіню: останній нині є губернатором Нінся, а Хункуй вважається запеклим прихильником Чжилі. Навіть хворим, Фусян зумів перетворити північний захід на бастіон лояльності до Пекіна.\n\nПісля завершення промови натовп вітав Фусяна гучними вигуками."
 ma_clique_events.3.a:0 "Справді велика людина."

 ma_clique_events.4.t:0 "Ма Лінь звертається до Сінінської ради"
 ma_clique_events.4.d:0 "Ма Лінь, нинішній губернатор Цінхаю, суттєво відрізняється від своїх родичів із північної кліки. Він успадкував посаду після смерті брата Ма Ці у 1931 році й продовжує його лінію. На відміну від Фусяна, який прагне поєднати конфуціанство та іслам заради примирення з ханьцями, Лінь вважає мусульманську віру хуейцзу недоторканною. Він переконаний, що ханьці мають поважати їхні переконання як окремої групи. Це породило дух непокори в Сінінській раді. Ходили чутки, що Ма Лінь та інші посадовці Цінхаю досі симпатизують «християнському генералу» Фен Юйсяну.\n\nХоча доказів цим чуткам немає, це не зупиняє Ма Буфана, військового губернатора Цінхаю, від інтриг проти дядька. Подейкують про підготовку перевороту заради об'єднання цивільної та військової влади в одних руках. Лінь вбачає у Буфані головну загрозу і діє дуже обережно, аби не дати племіннику переваги.\n\nКоли Лінь завершив виступ, у залі засідань почулися як поодинокі вітання, так і зловісна тиша."
 ma_clique_events.4.a:0 "Тиша стає дедалі гучнішою."

 ma_clique_events.5.t:0 "Новий початок"
 ma_clique_events.5.d:0 "Крах влади Чжилі стався у найгірший для родини Ма час.\n\nСтан здоров'я Фусяна погіршується, і він змушений витрачати останні сили на те, аби втримати мир між племінником Ма Хунбінем та власним сином Ма Хункуєм. Хунбінь, досвідченіший із двох, виховувався самим Фусяном після загибелі батька під час Боксерського повстання. Його знають як спокійну та помірковану людину, політично гнучку залежно від обставин. Ма Хункуй, який має стати губернатором Ганьсу після смерті батька, є радикальною альтернативою. Він — запеклий антисоціаліст і фанатично відданий династії Цін; багато хто вважає його непередбачуваним лідером, здатним підкріпити різкі слова силою армії. Між ними мало спільного, тому конфлікти виникають постійно. Без центральної влади в Пекіні, яка могла б стати арбітром, зусилля Фусяна примирити наступників здаються марними.\n\nТим часом у Цінхаї напруженість між кліками Ліня та Буфана лише зростає. Відсутність контролю з боку столиці розв'язує Буфану руки для рішучих дій без правових наслідків."
 ma_clique_events.5.a:0 "Це сталося у найгірший момент..."

 ma_clique_events.6.t:0 "Набіги Чжун'їна у Верхньому Ганьсу"
 ma_clique_events.6.d:0 "Ма Чжун'їна можна назвати «проблемною дитиною» родини Ма. У свої 26 років він очолює банду молодиків, що грабують села. Найбільше він прославився під час окупації Ганьсу, коли одним із перших зрадив Гоміньцзюнь. Його дії були ефективними проти ворога, але принесли багато руйнувань. Після знищення мечеті Хуасі в Ганьсу дядько Ма Буфан виключив його з офіційної армії, сподіваючись, що той не завдасть більше шкоди.\n\nПроте після падіння Чжилі Чжун'їн знову взявся за грабунки. Багато хто підозрює, що цього разу його плани масштабніші: він хоче вийти з-під впливу родини Ма та заснувати власне володіння."
 ma_clique_events.6.a:0 "Він колись заспокоїться?"

 ma_clique_events.7.t:0 "29 загиблих у Юйшу"
 ma_clique_events.7.d:0 "За Юйшу на півдні Цінхаю борються з часів Синьхайської революції: Сичуань, Тибет та Цінхай претендують на місто, адже через нього проходить одна з небагатьох доріг, що з'єднують ці три регіони. Юйшу — ключ до всього північного заходу. Сінінський уряд утримував контроль, а після втручання в тибетсько-сичуаньську війну 1930 року офіційно закріпив місто за собою. Але Тибет не змирився.\n\nОстаннім часом почастішали набіги тибетських загонів; під час останнього загинуло 29 громадян. Хоча уряд у Лхасі заперечує свою причетність, напруженість у відносинах між Ма та тибетцями сягнула межі."
 ma_clique_events.7.a:0 "Не може бути, щоб вони не були причетні!"

 ma_clique_events.8.t:0 "Члени ради вагаються щодо Ма Буфана"
 ma_clique_events.8.d:0 "Напруженість у Сінінській раді зростає, і Буфан не припиняє спроб усунути Ліня від влади. Використовуючи підкупи та погрози, він веде кампанію наклепів не лише проти губернатора, а й проти Гоміньцзюню. Дехто починає вірити, що Лінь зраджує інтереси Цінхаю та всього Китаю. Губернатор опинився в критичному стані й мусить діяти негайно, аби його не знесла хвиля підтримки Буфана та армії."
 ma_clique_events.8.a:0 "Навряд чи це правда."

 ma_clique_events.9.t:0 "Статус Суйюаню"
 ma_clique_events.9.d:0 "Ма Фусян є губернатором Суйюаню (відомого також як Уланчаб), але через хворобу він має назвати наступника. Провінції загрожують монголи, які чекають на його смерть. Вибір стоїть між Хункуєм та Хунбінем. Хункуй має більшу армію та військовий досвід, але його запальність може зробити провінцію вразливою. Хунбінь спокійний та відповідальний, він здатний впоратися з монгольською загрозою навіть із меншими силами. Проте будь-який вибір несе ризик внутрішнього конфлікту між ними. Можливо, безпечніше передати провінцію третій стороні, яка зосередиться виключно на обороні?"
 ma_clique_events.9.a:0 "Армія Ма Хункуя гарантує безпеку регіону."
 ma_clique_events.9.b:0 "Терпіння Ма Хунбіня вбереже провінцію."
 ma_clique_events.9.c:0 "Нікому з них не можна довіряти, передайте владу Ма Ляну!"

 ma_clique_events.10.t:0 "Смерть Ма Фусяна"
 ma_clique_events.10.d:0 "Після місяця в ліжку Ма Фусян помер уві сні. Його смерть означає кінець цілої епохи в політиці родини Ма. Старе покоління відходить, і доля північного заходу тепер у руках молоді. Хоча сьогодні сім'я об'єдналася в жалобі, ніхто не знає, чи не принесе завтрашній день чвари та гнів без головного авторитета. Поки що в кліці панує мир.\n\nТепер, коли північ залишилася без лідера, південна Кліка Ма в Цінхаї стала найближчим центром сили. Ма Лінь, який її очолює, не має такої репутації та впливу, як Фусян, проте багато хто сподівається, що саме він стане новим орієнтиром у цю нову еру."
 ma_clique_events.10.a:0 "Спочивай із миром."

 ma_clique_events.11.t:0 "Недавні події в Юйшу"
 ma_clique_events.11.d:0 "Ма Буфан зосередив увагу на конфлікті в Юйшу між нашими силами та тибетцями й виступив із несподіваною ініціативою. Він опублікував працю «Недавні події в Юйшу», де описав оборонні заходи та ризики для регіону, адресуючи це центральній владі Китаю. Хоча такий звіт корисний для організації оборони, Ма Лінь непокоїться, що публікація лише підвищить авторитет Буфана в усьому Китаї та забезпечить йому ще більшу підтримку в раді."
 ma_clique_events.11.a:0 "Нехай публікує, він не становить загрози."
 ma_clique_events.11.b:0 "Ким він себе уявив?!"

 ma_clique_events.12.t:0 "Переміщення військ Ма в Юйшу"
 ma_clique_events.12.d:0 "Ченці монастиря Г'єгу повідомляють про активізацію ополчення Ма в Юйшу. Це здивувало [TIB.GetLeader], до якого доходили звітки про розбрат у Сінінській раді. Тибетці пам'ятають прикордонну війну 1932 року, коли тисячі ґолоків були вигнані зі своїх земель. Ми маємо знайти спосіб протистояти військовій експансії Ма, яка знову загрожує нашому невинному народу."
 ma_clique_events.12.a:0 "Ми маємо запобігти повторенню трагедії ґолоків."

 ma_clique_events.13.t:0 "Союзники Ма Буфана в Сініні викриті"
 ma_clique_events.13.d:0 "Прихований розкол у Сінінській раді став очевидним сьогодні під час розмови Ма Ліня з підлеглими. Прийшовши на зустріч раніше, Лінь був вражений, побачивши, що Буфан уже веде палку дискусію про зростання цін на їжу. Навколо Буфана зібралася група слухачів, серед яких були і далекі родичі самого Ліня. Коли губернатор почав висувати звинувачення, Буфан відповів лише мовчанням. Рада заніміла і перебувала в такому стані до поклику на пополудневу молитву."
 ma_clique_events.13.a:0 "Ось як ви висловлюєте свою вдячність?"

 ma_clique_events.14.t:0 "Ма Буфан розпочинає громадські роботи"
 ma_clique_events.14.d:0 "Ма Буфан виступив з амбітним планом розширення акведуків від озера Цінхай до Сініна, пояснюючи це напливом біженців із Сичуані. Він планує залучити селян до будівництва за допомогою примусової праці під наглядом офіцерів. Також Буфан натякнув: буддисти Кумбума настільки потребуватимуть води, що самі підкоряться раді, аби уникнути голоду."
 ma_clique_events.14.a:0 "Ще одна зухвала обіцянка."

 ma_clique_events.15.t:0 "Підвищення Ма Цзіюаня"
 ma_clique_events.15.d:0 "Нам стало відомо, що Ма Цзіюань, старший син Ма Буфана, отримав від батька особливий подарунок — звання генерала. Це не стало повною несподіванкою: попри те, що йому лише 21 рік, батько готував його до військової кар'єри змалечку (свою першу посаду хлопець отримав у 12 років). Проте багато хто ставить під сумнів доречність такого високого призначення для юнака, вважаючи це результатом непотизму, а не справжньої компетентності."
 ma_clique_events.15.a:0 "Він справді має бути обдарованим юнаком..."
 ma_clique_events.15.b:0 "Нам не потрібен такий молодий офіцер."

 ma_clique_events.100.t:0 "Прохання Ма Ліня про військову допомогу"
 ma_clique_events.100.d:0 "Ма Лінь, цивільний губернатор Цінхаю, звернувся до Гоміньцзюню з проханням надати людей для створення армії проти власного племінника Ма Буфана. Лінь був одним із останніх, хто зрадив Гоміньцзюнь під час дезертирства родини Ма, і зробив це лише під тиском родичів. Він досі зберігає симпатії до нашої справи і сподівається, що цей крок відновить відносини між Ма та Гоміньцзюнем."
 ma_clique_events.100.a:0 "Відправте йому те, що потрібно."
 ma_clique_events.100.b:0 "Вибачте, але у нас тут свої клопоти."

 ma_clique_events.101.t:0 "Фен Юйсян приймає наше прохання"
 ma_clique_events.101.d:0 "Фен Юйсян розуміє складне становище Ліня і погодився на угоду. Тепер Ма Лінь має особисту гвардію та армію, подібну до сил Буфана, що дозволить йому захистити свій уряд. Крім того, це відкриває шлях до нового союзу Ма та Гоміньцзюню, якщо Лінь втримає контроль над Цінхаєм."
 ma_clique_events.101.a:0 "За Ліня!"

 ma_clique_events.102.t:0 "Фен Юйсян відхиляє нашу пропозицію"
 ma_clique_events.102.d:0 "Схоже, Фен Юйсян не довіряє нам після першої зради і відмовив у допомозі. Це стало розчаруванням для Ліня, який сподівався на примирення. Решта Сінінської ради, однак, зітхнула з полегшенням: вони пам'ятають наслідки зради Фен Юйсяна в Ганьсу."
 ma_clique_events.102.a:0 "Прокляття."

 ma_clique_events.104.t:0 "Ескалація конфлікту в Юйшу"
 ma_clique_events.104.d:0 "Після чергового нападу уряди Юйшу та Сініна вже не можуть заперечувати зв’язок Лхаси з частими набігами на місто. Кліка Ма офіційно засудила уряд Тибету, який сприйняв цю образу вкрай гостро та знову підтвердив свої претензії на регіон. Багато хто бачить у цьому початок нової війни, адже обидві сторони прагнуть контролювати цей віддалений край через залізницю, що веде до решти Китаю."
 ma_clique_events.104.a:0 "Якщо вони хочуть війни — вони її отримають."

 ma_clique_events.105.t:0 "Ескалація конфлікту в Юйшу"
 ma_clique_events.105.d:0 "Схоже, крах Чжилі зробив уряд Цінхаю нетерплячим до набігів тибетських кочівників. Стверджуючи, ніби ми фінансуємо нападників заради повернення Юйшу, Ма офіційно засудили наш уряд. Попри те, що ми не маємо стосунку до останніх рейдів, вони наважилися на такий випад? Ми не можемо це ігнорувати. Якщо нас уже звинувачують, можливо, варто справді підтримати нападників, аби посилити їх та повернути Юйшу собі?"
 ma_clique_events.105.a:0 "Цінхайське кодло..."

 ma_clique_events.106.t:0 "Ма Бяо прибуває до Юйшу"
 ma_clique_events.106.d:0 "Ма Бяо, славетний переможець наших військ у сичуаньсько-тибетській війні 1930 року, був знову призначений до Юйшу сінінським урядом. Очевидно, вони хочуть залякати нас цією постаттю, але це лише зміцнить нашу рішучість! Втім, нам доведеться шукати шляхи в обхід оборони Бяо, якщо ми хочемо продовжувати рейди на місто."
 ma_clique_events.106.a:0 "Ми не будемо переможені!"

 ma_clique_events.107.t:0 "Ма Бяо тікає з Юйшу"
 ma_clique_events.107.d:0 "Через наші постійні набіги та брак підкріплень із Цінхаю, Ма Бяо опинився у безвиході з малими запасами спорядження та людей. Не маючи іншого вибору, Ма Бяо відступив із Юйшу, що викликало справжню паніку серед адміністрації та залишків військ у регіоні. Це посилило наш контроль та ефективність наших рейдів."
 ma_clique_events.107.a:0 "Ми добре його провчили."

 ma_clique_events.108.t:0 "Поліція в Юйшу"
 ma_clique_events.108.d:0 "Схоже, уряд Юйшу офіційно створив невеликий загін поліції, аби виявити та усунути можливих заколотників чи зрадників, яких ми могли впровадити в місті. Хоча ці сили мізерні, це здорожчує вартість наших операцій, адже тепер кожна атака, рейд чи інфільтрація потребують ретельнішої підготовки."
 ma_clique_events.108.a:0 "Це ускладнює справу..."

 ma_clique_events.109.t:0 "Набіг дунсянських монголів"
 ma_clique_events.109.d:0 "Цінхайський уряд підкупив невелику групу дунсянських монголів, які напали на один із наших таборів у Зовнішньому Цінхаї, перешкодивши нашим діям та посиливши свою владу над Юйшу. Хоча найманці наразі зникли, цілком імовірно, що їх наймуть знову, сподіваючись виявити інші наші стоянки."
 ma_clique_events.109.a:0 "Схоже, вони крадуть нашу тактику."

 ma_clique_events.110.t:0 "Китайці посилюють кордон"
 ma_clique_events.110.d:0 "Схоже, влада Ма на півночі виставила невеликі загони охорони на офіційному кордоні Цінхаю. Хоча це швидше демонстрація сили, ніж реальна загроза, присутність цих вартових значно ускладнить відправку рейдових загонів для нападів на Юйшу."
 ma_clique_events.110.a:0 "Прокляття!"

 ma_clique_events.112.t:0 "Ма Буфан закликає до інтифади проти буддистів"
 ma_clique_events.112.d:0 "Ма Буфан терміново скликав засідання Сінінської ради. З'явившись у військовому парадному мундирі, він виступив із суворим попередженням до своєї родини та народу Цінхаю. Буфан описав жахи та гноблення, з якими стикаються мусульмани в Тибеті. Ті, хто століттями жив у Лхасі, нині зубожілі та занедбані урядом Ґанден Пходранґ. Місцевим хуейцзу, як-от дунсянам, загрожує помста з боку жорстоких розбійників-ґолоків. Ма Буфан вимагає від ради мобілізувати більше солдатів для патрулювання прикордонних міст, зокрема Юйшу, та готуватися до інтифади проти буддійської тиранії."
 ma_clique_events.112.a:0 "Він навів слушні аргументи."

 ma_clique_events.113.t:0 "Ма Лінь запевняє раду в мирі"
 ma_clique_events.113.d:0 "Для учасників зборів було влаштовано несподіваний бенкет коштом Ма Ліня. Губернатор запевнив раду, що як представник родини Ма він гарантує хуейцзу максимальне збагачення на цих землях. Водночас він зауважив, що це процвітання різко контрастує з поганим правлінням войовничих губернаторів Сичуані, які бенкетують лише після того, як захоплять домівки сусідів. Головний посил Ма Ліня полягав у тому, що стриманість у мілітаризмі принесе значно більші плоди після остаточної перемоги хуейцзу."
 ma_clique_events.113.a:0 "Його слова мають сенс."

 ma_clique_events.114.t:0 "Ма Буфан захоплює Сінінську раду"
 ma_clique_events.114.d:0 "Ма Лінь не надто здивувався, коли члени Сінінської ради вчора не з’явилися на засідання. Без сумніву, вони намагалися уникнути зустрічі як із ним, так і з Ма Буфаном, аби зберегти нейтралітет у їхній суперечці. Попри це, Лінь вирішив того дня навідатися до маєтку племінника. На підході він помічив Буфана, що про щось розмовляв із членом ради. Заглянувши у вікно, він побачив ще кількох учасників. Як людина розважлива, Ма Лінь вирішив: єдиний спосіб відновити роботу ради — це самому оселитися в залі засідань."
 ma_clique_events.114.a:0 "Який же мерзенний у мене племінник."

 ma_clique_events.115.t:0 "Ма Буфан принизливо усуває Ма Ліня з посади"
 ma_clique_events.115.d:0 "Після кількох днів очікування наступного засідання до Ма Ліня підійшов Ма Буфан у супроводі кількох тепер уже лояльних до нього членів ради та двох охоронців. Перш ніж Лінь встиг щось сказати, вартові схопили його і винесли із зали. Колишнього губернатора заштовхали до кімнат для прислуги, звідки він міг лише здалеку чути початок засідання Сінінської ради."
 ma_clique_events.115.a:0 "Хай чума впаде на наш рід."

 ma_clique_events.116.t:0 "Змова Ма Ліня проти Ма Буфана"
 ma_clique_events.116.d:0 "Настав час для Ма Ліня протистояти кричущому зловживанню посадою з боку племінника. Це сталося після місяців суперечок у залі засідань про те, які з «восьми пунктів» Ма Фусяна зараз найпотрібніші. План Ліня полягає в тому, аби запросити на засідання Ма Ваньфу, радикального імама ханафітського мазгабу. Ма Ваньфу винен послугу Ліню ще з часів Ма Ці, батька Буфана. Оскільки Буфан глибоко шанує імама, це неабияк принизить його, якщо герой його дитинства публічно засудить його за невідповідність очікуванням батька."
 ma_clique_events.116.a:0 "Хотів би я бачити його обличчя."

 ma_clique_events.117.t:0 "Ма Буфан викритий перед родиною"
 ma_clique_events.117.d:0 "Ма Буфан прибув до ради як зазвичай — у повному військовому обладунку. Але він завмер, побачивши Ма Ваньфу, якого пам'ятав ще з дитячих років, коли той карав його за непослух. Охоплений емоціями, Буфан підійшов до імама і наказав йому сісти. Старий відмовився і почав згадувати батька Буфана, дорікаючи племіннику, що той псує його спадщину. Буфан люто заперечував, заявляючи про свою абсолютну відданість Аллаху. Ма Ваньфу відпарував: мовляв, по всьому Цінхаю вільно вештаються християнські місіонери, збиваючи з пантелику правовірних хуейцзу. До звинувачень приєднався Ма Лінь, а згодом і решта ради. Буфан не зміг заперечити і, нічого не відповівши, просто вибіг із зали засідань."
 ma_clique_events.117.a:0 "Ганьба! Ганьба! Ганьба!"

 ma_clique_events.118.t:0 "Тибетці посилюють кордон"
 ma_clique_events.118.d:0 "Схоже, тибетці на півдні виставили невелику кількість вартових на офіційному кордоні Цінхаю. Хоча це лише демонстрація сили, присутність цієї охорони значно ускладнить відправку наших рейдових загонів для нападу на Юйшу."
 ma_clique_events.118.a:0 "Прокляття!"

 ma_clique_events.119.t:0 "Набіг ґолоків"
 ma_clique_events.119.d:0 "Уряд Тибету підкупив невелику групу тибетців-ґолоків, які напали на один із наших таборів у Зовнішньому Цінхаї, зірвавши наші плани та посиливши свою владу над Юйшу. Хоча найманці відступили, цілком імовірно, що Лхаса знову використає їх, аби виявити інші наші позиції."
 ma_clique_events.119.a:0 "Схоже, вони копіюють нашу тактику."

 ma_clique_events.120.t:0 "Поліція в Юйшу"
 ma_clique_events.120.d:0 "Схоже, уряд Юйшу офіційно створив невеликий загін поліції для виявлення заколотників чи шпигунів. Хоча сили невеликі, це підвищує складність наших операцій, оскільки тепер кожен напад чи проникнення вимагають значно ретельнішої підготовки."
 ma_clique_events.120.a:0 "Це створює проблеми..."

 ma_clique_events.200.t: "Нарощування військової сили в Юйшу"
 ma_clique_events.200.biao: "З огляду на постійні набіги тибетців на «перлину південного Цінхаю» та розгортання сил Ма Бяо для організації оборони, цей момент був лише питанням часу. Тривале протистояння між нападниками та урядовим ополченням переросло у масштабну бійню в місті. Смерті цивільних стали звичною справою, оскільки панує майже повна анархія, і ніхто не знає, чим це закінчиться. Хоча Ма Бяо запевнив нас, що ситуація під контролем, ми не зможемо заспокоїтися, доки не вляжеться пил. Хай там що, цей бій є очевидним наслідком тибетської агресії та бездіяльності місцевої влади. Щойно з цим буде покінчено, ми маємо раз і назавжди увійти на тибетські землі, аби запобігти таким жахливим жертвам у майбутньому."
 ma_clique_events.200.tfwnobiao: "Через постійні набіги тибетців на південний Цінхай та регулярне розгортання урядових військ, цей вибух насильства був неминучим. Чергове зіткнення між рейдерами та ополченням перетворилося на запеклу вуличну битву. Місто поринуло в анархію, гине безліч мирних мешканців. Очевидно, що провина за це кровопролиття лежить на тибетських загарбниках. Ми обіцяємо: щойно порядок буде відновлено, ми виступимо у похід проти Тибету, аби назавжди покласти край цій загрозі."
 ma_clique_events.200.a: "Ми обіцяємо, що мир буде відновлено."

 ma_clique_events.201.t: "Протистояння в Юйшу"
 ma_clique_events.201.biao: "Схоже, наші набіги на Юйшу нарешті довели цінхайський уряд до межі. Останній рейд викликав надзвичайно жорстку реакцію: барикади та репресії проти населення стали нормою. Командир залоги Ма Бяо особисто керував будівництвом укріплень, що лише посилює наше занепокоєння. Коли прибув наш наступний полк, вулиці вже палали в анархії, де бойовики, цивільні та солдати металися, наче в кінці світу. Той, хто переможе в цьому хаосі, ймовірно, втримає контроль над містом, але одне зрозуміло точно: це призведе до значно більшого конфлікту, ніж планувалося спочатку. Ми маємо готуватися до тотальної війни."
 ma_clique_events.201.no: "Наші рейди на Юйшу змусили цінхайську владу діяти рішуче. Місто перекрите барикадами, почалися масові придушення незадоволених. У Юйшу панує хаос, вулиці перетворилися на поле битви між ополченням та солдатами. Хай хто вийде переможцем із цієї колотнечі, це стане іскрою для великої війни на всьому кордоні. Ми мусимо бути готовими до найгіршого."
 ma_clique_events.201.a: "Будемо сподіватися, що Монголія втрутиться."

 ma_clique_events.202.t: "Марш помсти"
 ma_clique_events.202.biao: "Цай Цзуочжень, вождь племені буцін у Юйшу, стояв перед важким вибором. Він спостерігав за своїми людьми біля вогнища, які тримали мечі в руках, і за полком Ма Бяо, повністю оточеним тибетськими солдатами. У повітрі панувала холодна тиша. Він знав, що має зробити.\n\n«Час настав».\n\nЦай повів своїх людей на штурм міста, розірвавши тишу. Його воїни вдарили по тибетських силах, давши Ма Бяо шанс на прорив. За годину тибетці здалися перед об’єднаною потужністю двох загонів. Але те, що сталося далі, шокувало Цая.\n\nМа Бяо почав підходити до кожного солдата, що здався — а їх було майже 800 — і розстрілювати їх одного за одним. Коли в нього закінчилися набої, він дістав свій дао і продовжив убивати молодих воїнів власноруч. «Невже я єдиний, хто приєднається до цієї розваги?» — вигукнув Ма Бяо після сотої жертви. Решта полку приєдналася до різанини, поки всі полонені не були мертві. Цай завагався, чи правильний вибір він зробив, але жереб було кинуто. Тепер вороття не було — або він з ними, або його плем'я чекає та сама доля. Вони рушили вглиб Цінхаю; після такого акту війна стала неминучою."
 ma_clique_events.202.tfwnobiao: "Цай Цзуочжень спостерігав за останніми залишками полку Ма, оточеними тибетцями. Він повів своїх людей у відчайдушну атаку, врятувавши гарнізон від неминучої загибелі. Тибетські сили капітулювали. Проте під час конвоювання один із полонених спробував вирватися, що спровокувало спонтанну бійню. Коли все вляглося, половина тибетського полку лежала мертвою. Цай був вражений і відчував огиду. Вцілілих полонених вирішили відправити до Сініна. Кров, пролита цього дня, ніколи не буде забута, і Цай відчував, що це лише початок чогось значно жахливішого."
 ma_clique_events.202.a: "Тепер — час для помсти."

 ma_clique_events.203.t: "Смерть у повітрі"
 ma_clique_events.203.biao: "Цай Цзуочжень, вождь племені буцін у Юйшу, стояв перед важким вибором. Він спостерігав за своїми людьми біля вогнища, які тримали мечі в руках, і за полком Ма Бяо, повністю оточеним тибетськими солдатами. У повітрі панувала холодна тиша. Він знав, що має зробити.\n\n«Час настав».\n\nЦай повів своїх людей на штурм міста, розірвавши тишу. Його воїни вдарили по тибетських силах, давши Ма Бяо шанс на прорив. За годину тибетці здалися перед об’єднаною потужністю двох загонів. Але те, що сталося далі, шокувало Цая.\n\nМа Бяо почав підходити до кожного солдата, що здався — а їх було майже 800 — і розстрілювати їх одного за одним. Коли в нього закінчилися набої, він дістав свій дао і продовжив убивати молодих воїнів власноруч. «Невже я єдиний, хто приєднається до цієї розваги?» — вигукнув Ма Бяо після сотої жертви. Решта полку приєдналася до різанини, поки всі полонені не були мертві. Цай завагався, чи правильний вибір він зробив, але жереб було кинуто. Тепер вороття не було — або він з ними, або його плем'я чекає та сама доля. Вони рушили вглиб Цінхаю; після такого акту війна стала неминучою."
 ma_clique_events.203.tfwnobiao: "Цай Цзуочжень спостерігав за останніми залишками полку Ма, оточеними тибетцями. Він повів своїх людей у відчайдушну атаку, врятувавши гарнізон від неминучої загибелі. Тибетські сили капітулювали. Проте під час конвоювання один із полонених спробував вирватися, що спровокувало спонтанну бійню. Коли все вляглося, половина тибетського полку лежала мертвою. Цай був вражений і відчував огиду. Вцілілих полонених вирішили відправити до Сініна. Кров, пролита цього дня, ніколи не буде забута, і Цай відчував, що це лише початок чогось значно жахливішого."
 ma_clique_events.203.a: "Ці монстри..."

 ma_clique_events.204.t: "Різанина в Юйшу"
 ma_clique_events.204.biao: "Цай Цзуочжень запізнився. Напруга вибухнула раніше, ніж він встиг втрутитися. Ма Бяо кинувся у відчайдушний прорив крізь тибетські ряди. Цай вирішив не вступати в бій і наказав своїм людям відступати. Бій у місті був неймовірно кривавим. Коли дим розсіявся, замучений гарнізон Ма дивом втримав Юйшу, а тибетські нападники відступили на свої бази. Чіткого переможця не було, але Ма Бяо, розлючений втратами, негайно наказав своїм військам готуватися до наступу у відповідь."
 ma_clique_events.204.tfwnobiao: "Напруга в місті вибухнула, коли один самотній солдат Ма кинувся в атаку, що спровокувало загальну бійню. Цай Цзуочжень вирішив повернутися до свого племені, не бажаючи брати участь у цій безглуздій смерті. Коли все закінчилося, гарнізон втримав місто, але ціною величезних жертв. Виснажені та налякані реальністю війни, солдати стояли серед руїн, не в силах поворухнутися."
 ma_clique_events.204.a: "Велика втрата."

 ma_clique_events.205.t: "Різанина в Юйшу"
 ma_clique_events.205.biao: "Цай Цзуочжень запізнився. Напруга вибухнула раніше, ніж він встиг втрутитися. Ма Бяо кинувся у відчайдушний прорив крізь тибетські ряди. Цай вирішив не вступати в бій і наказав своїм людям відступати. Бій у місті був неймовірно кривавим. Коли дим розсіявся, замучений гарнізон Ма дивом втримав Юйшу, а тибетські нападники відступили на свої бази. Чіткого переможця не було, але Ма Бяо, розлючений втратами, негайно наказав своїм військам готуватися до наступу у відповідь."
 ma_clique_events.205.tfwnobiao: "Напруга в місті вибухнула, коли один самотній солдат Ма кинувся в атаку, що спровокувало загальну бійню. Цай Цзуочжень вирішив повернутися до свого племені, не бажаючи брати участь у цій безглуздій смерті. Коли все закінчилося, гарнізон втримав місто, але ціною величезних жертв. Виснажені та налякані реальністю війни, солдати стояли серед руїн, не в силах поворухнутися."
 ma_clique_events.205.a: "Час перегрупуватися та помститися за полеглих."

 ma_clique_events.206.t: "Будда посміхається в Юйшу"
 ma_clique_events.206.biao: "Цай Цзуочжень обрав свій шлях. Він наказав своїм людям вдарити в спину гарнізону Ма, який і без того був оточений тибетцями. Почався хаос. Війська Ма розсіялися, а сам Ма Бяо зник. Тибетські солдати безжально виловлювали втікачів. Під час переслідування Ма Бяо несподівано з'явився позаду Цая і встиг смертельно поранити його в живіт, перш ніж сам був убитий. Втрата вождя змусила плем'я буцін повернутися додому. Тибет нарешті захопив Юйшу, але зловісна тиша після битви була лише ознакою початку ще кривавішого конфлікту."
 ma_clique_events.206.tfwnobiao: "Цай вдарив у спину гарнізону Ма, привівши їх до повної поразки. Молоді солдати марно намагалися уникнути розправи. Під час хаосу один із месників Ма напав на Цая, позбавивши його руки. Пораненого вождя відвезли додому, а його плем'я вийшло з бою, вважаючи свою місію виконаною. Тибет отримав повний контроль над Юйшу і приготувався до наступу на Сінін."
 ma_clique_events.206.a: "Уперед, аж до самого Сініна!"

 ma_clique_events.207.t: "Мізинець Будди в Юйшу"
 ma_clique_events.207.biao: "Цай Цзуочжень обрав свій шлях. Він наказав своїм людям вдарити в спину гарнізону Ма, який і без того був оточений тибетцями. Почався хаос. Війська Ма розсіялися, а сам Ма Бяо зник. Тибетські солдати безжально виловлювали втікачів. Під час переслідування Ма Бяо несподівано з'явився позаду Цая і встиг смертельно поранити його в живіт, перш ніж сам був убитий. Втрата вождя змусила плем'я буцін повернутися додому. Тибет нарешті захопив Юйшу, але зловісна тиша після битви була лише ознакою початку ще кривавішого конфлікту."
 ma_clique_events.207.tfwnobiao: "Цай вдарив у спину гарнізону Ма, привівши їх до повної поразки. Молоді солдати марно намагалися уникнути розправи. Під час хаосу один із месників Ма напав на Цая, позбавивши його руки. Пораненого вождя відвезли додому, а його плем'я вийшло з бою, вважаючи свою місію виконаною. Тибет отримав повний контроль над Юйшу і приготувався до наступу на Сінін."
 ma_clique_events.207.a: "Ми йдемо за вами, покидьки."

 ma_clique_events.208.t: "Увага на Ганьсу"
 ma_clique_events.208.d: "Хоча війна стала серйозним викликом, оскільки опортуністи з усіх боків намагалися атакувати володіння Ма, вони зрештою перемогли завдяки міцному керівництву та мужності солдатів. Тепер, коли безпосередню загрозу вторгнення усунуто, родини Ма звертають увагу на місто Ганьсу, що колись було домом для патріарха кліки та колискою її найбільшого тріумфу — «ганьсуйських сміливців». Нині воно лежить у руїнах після конфліктів 1920-х років і переповнене сичуаньськими біженцями, що втекли від цивільної війни та голоду 1936 року. Кліці необхідно звернути увагу на нинішнього губернатора Ганьсу, Ма Хункуя, чиє жорстке правління не може приховати того, що він перейняв деякі з найбільш безтурботних рис свого батька, Ма Фусяна, які той мав лише на схилі літ."
 ma_clique_events.208.a: "Важливе місто для кліки."

 ma_clique_events.209.t: "Суперечка кузенів: Хункуй та Хунбінь"
 ma_clique_events.209.d: "Коли зовнішню загрозу було усунуто, деякі члени родини Ма почали боротися за домінування всередині кліки. Губернатор Ганьсу Ма Хункуй почав виступати проти свого кузена, губернатора Нінся Ма Хунбіня. Кожен звинувачує іншого у кризі в Суйюані перед війною з Монголією: Хункуй нарікає на бездіяльність та м’якість кузена до північних бандитів, а Хунбінь стверджує, що Хункуй сам поставив Суйюань під загрозу, бо ставився до монголів так само як до тибетців, абсолютно не зрозумівши ситуації. Тепер керівництво в Сініні має зважити аргументи та розв’язати цю суперечку."
 ma_clique_events.209.a: "Ма Хункуй не повинен отримати підтримку від Сініна."
 ma_clique_events.209.b: "Ма Хункуй повинен отримати підтримку від Сініна."

 ma_clique_events.210.t: "Хункуй пропонує Ма Ляна в помічники Нінся"
 ma_clique_events.210.d: "Хоча Сінінська рада відмовилася стати на бік губернатора Ганьсу Ма Хункуя, він не здався і звернувся з новим закликом. Тепер він пропонує, аби Ма Лян, близький союзник Ма Буфана, допомагав Ма Хунбіню в управлінні Нінся після минулих проблем із монголами. Дехто в раді погоджується з такою оцінкою, але інші вважають це не лише зайвим, а й прямим приниженням старшого кузена."
 ma_clique_events.210.a: "Наша повна підтримка Ма Ляна."
 ma_clique_events.210.b: "Ма Хункуй має довести, що це справді необхідно."

 ma_clique_events.211.t: "Ма Хунбінь звинувачує Хункуя в єресі"
 ma_clique_events.211.d: "Не бажаючи терпіти зневагу з боку керівництва в Сініні, губернатор Нінся Ма Хунбінь заявив, що губернатор Ганьсу Ма Хункуй таємно фінансує іхевань — антисуфійську секту, що просуває лібералізацію хуейцзу для протидії ханьському впливу. Стверджуючи, що підтримка Хункуя рівноцінна заохоченню єретичного ісламу в західних провінціях, він закликає переглянути рішення. Сам Ма Хункуй рішуче заперечує це, називаючи звинувачення Хунбіня не лише безпідставними, а й спробою відвернути увагу від власних провалів на посаді губернатора Нінся."
 ma_clique_events.211.a: "Нові методи Ма Хункуя переможуть Ма Хунбіня."
 ma_clique_events.211.b: "Ми маємо діяти зважено, інакше в кліці почнеться розбрат."

 ma_clique_events.212.t: "Ма Хунбінь представляє докази помилок Хункуя"
 ma_clique_events.212.d: "Отримавши можливість діяти розсудливо, губернатор Нінся Ма Хунбінь зібрав докази та представив свою справу Сінінській раді. Він виступив із сильними аргументами, підкресливши не лише невдачі Ма Хункуя у відбудові Ганьсу після розграбування Гоміньцзюнем та набігів Ма Чжун'їна, а й необхідність релігійної та політичної єдності після буддійської атаки. Ма Хунбінь просить призначити в Ганьсу більш досвідченого управлінця. Ймовірно, він розраховує, що цю посаду віддадуть йому або комусь із близьких, аби відродити єдність північної кліки, як у золоті часи Ма Фусяна."
 ma_clique_events.212.a: "Доводи Хунбіня виглядають цікаво."

 ma_clique_events.213.t: "Несподіване рішення ради"
 ma_clique_events.213.d: "Сінінська рада не змогла дійти висновку щодо того, чи достатньо Ма Хункуй зганьбив свою посаду для усунення. Під час перерви на молитву емісар Хункуя таємно зустрівся з кількома членами ради, передавши виправдання відсутності губернатора та безглузді звинувачення проти Хунбіня. Обурена тим, що Ма Хункуй не з'явився особисто, рада офіційно підтримала Ма Хунбіня."
 ma_clique_events.213.a: "Ми маємо підкоритися рішенню ради."

 ma_clique_events.214.t: "Родина Ма визнає Хункуя некомпетентним"
 ma_clique_events.214.d: "Родина Ма прибула до Ганьсу, побачила лише незначний ремонт мечеті Хуасі та висунула Ма Хункуєві ультиматум: передати посаду губернатора Ганьсу Ма Хунбіню і зосередитися на військових справах. Ма Хункуй погодився; влада на півночі консолідується навколо Їньчуаня, і кліка знову об'єднується під началом родини Ма Цяньліня."
 ma_clique_events.214.a: "Чженьчжу А."

 ma_clique_events.215.t: "Ма Хункуй запрошує родину до Ганьсу"
 ma_clique_events.215.d: "Сінінська рада обурена бездіяльністю Ма Ліня в Цінхаї. Оскільки Ма Хунбінь заступається за Ліня, рада починає шукати іншого лідера для кліки. Ма Хункуй, бачачи, як влада в Цінхаї вислизає, запросив представників трьох родин Ма до Ганьсу, аби показати свою роботу. Більшість членів ради прийняла пропозицію, і політичні суперечки припинилися заради поїздки."
 ma_clique_events.215.a: "Кажуть, у Ганьсу є чудова крамниця морозива."

 ma_clique_events.220.t: "Протест Ма Хунбіня переростає у сварку"
 ma_clique_events.220.d: "Ма Хунбінь протестує проти призначення Ма Ляна генералом у Нінся, заявляючи, що це зневажає його вік та досвід. Лян відповів, що Ма Чжун'їн легко скинув би Хунбіня, якби конфлікт у Кумулі завершився його перемогою. Суперечка спалахнула з такою силою, що нам доводиться обирати сторону, оскільки взаємні образи роблять управління провінцією неможливим."
 ma_clique_events.220.a: "Ми маємо терміново скликати Сінінську раду."
 ma_clique_events.220.b: "Найкращий час, аби піти звідси."

 ma_clique_events.221.t: "Ма Хунбіня витіснено з Нінся"
 ma_clique_events.221.d: "Через підтримку Ма Ляна, близького союзника Ма Буфана, політичний тиск на Ма Хунбіня став нестерпним. Після «переконань» з боку ворогів він вирішив піти у відставку, залишивши посаду Ма Ляну. Хунбінь, ймовірно, повернеться до свого маєтку в Нінся, аби зосередитися на військовій службі. Таким чином Хункуй знову зміг консолідувати політичну владу в північній кліці, забезпечивши їй домінантний вплив."
 ma_clique_events.221.a: "Чженьчжу А."

 ma_clique_events.222.t: "Ма Хункуй запрошує родину до Ганьсу"
 ma_clique_events.222.d: "Сінінська рада обурена сектантською політикою Ма Буфана і готова оголосити його непридатним для правління в Цінхаї, але Ма Хунбінь несподівано став на захист Буфана. Рада не змогла ухвалити рішення про відставку, проте на знак протесту розійшлася до наступного засідання. Ма Хункуй запросив усіх до Ганьсу, аби відвернути увагу від політичного глухого кута."
 ma_clique_events.222.a: "Кажуть, у Ганьсу є чудова крамниця морозива."

 ma_clique_events.223.t: "Хункуй переконує родину і стає губернатором Нінся"
 ma_clique_events.223.d: "Родини Ма були вражені планами Ма Хункуя щодо будівництва в Ганьсу та відвідали військовий штаб у Тяньшуї. Там Хункуй пообіцяв модернізацію Цінхаю та Нінся і запевнив, що ханьці ніколи не змусять хуейцзу битися лише за інтереси Китаю. Він додав, що Ганьсу — єдина провінція кліки, яку китайські інтелектуали вважають повноцінною, тому саме за нею судитимуть про всю кліку. Родини Ма погодилися з його планом."
 ma_clique_events.223.a: "Північна родина Ма перемагає!"

 ma_clique_events.224.t: "Війна між хуейцзу та буддистами"
 ma_clique_events.224.d: "Напруженість навколо Юйшу між клікою Ма та Тибетом знову вибухнула на північному заході. Це стало наслідком місяців нестабільності, яку обидві сторони могли вирішити лише через зовнішнього ворога. Цій війні передували різанина ґолоків, чвари в Сінінській раді та чутки про те, що наступний Далай-лама живе в Юйшу.\n\nЯкби не втручання Монголії, конфлікт не сягнув би такої гостроти. Ця боротьба може або відрізати китайський уряд на сході від Сіньцзяну, або дозволити хуейцзу відновити китайську гегемонію в західному Китаї."
 ma_clique_events.224.a: "Західне полум'я рухається на схід."

 ma_clique_events.225.t: "Відступ хуейцзу на північному заході"
 ma_clique_events.225.d: "Через низку поразок хуейцзу у війні невдоволення кампанією проти буддистів зростає вже кілька тижнів. Тисячі людей втратили домівки, і навіть у родинах мілітаристів перспективи подальших боїв виглядають похмуро. Мало хто прагне тотальної війни, якщо це означає крах. У владних кабінетах розглядають можливість мирної капітуляції та тимчасового поділу земель із монголами та тибетцями. Тепер керівництво має вирішити, чи варта ця «оливкова гілка» того, аби припинити спроби приборкати смертельного ворога."
 ma_clique_events.225.a: "Надіслати пропозицію миру."
 ma_clique_events.225.b: "Ми ніколи не здамося."

 ma_clique_events.226.t: "Кліка Ма просить миру"
 ma_clique_events.226.d.MON: "До офісу [MON.GetLeader] надійшло прохання про припинення вогню між Монголією та клікою Ма, поки національна криза в Китаї не буде розв'язана. Спірні території залишаться в наших руках як свідчення успіхів у конфлікті. Ця ідея подобається багатьом у Монголії, хто хоче повернутися додому. Проте є ризик, що національний уряд Китаю, коли відновиться, розірве цей договір."
 ma_clique_events.226.d.TIB: "До офісу [TIB.GetLeader] надійшло прохання про припинення вогню між Тибетом та клікою Ма, поки національна криза в Китаї не буде розв'язана. Спірні території залишаться в наших руках як свідчення успіхів у конфлікті. Ця ідея подобається багатьом у Тибеті, хто хоче повернутися додому. Проте є ризик, що майбутній національний уряд Китаю розірве цей договір."
 ma_clique_events.226.a: "Так, давайте покінчимо з цим."
 ma_clique_events.226.b: "Ця війна ще не закінчена."

 ma_clique_events.227.t: "Відмова від миру на північному заході"
 ma_clique_events.227.d.MON: "Пропозицію про мир між хуейцзу та буддистами відхилено. Прагнучи повної перемоги та заохочений різкою риторикою командирів, [MON.GetLeader] відхилив наші умови і вимагає беззастережної капітуляції. На його думку, на північному заході має залишитися лише один уряд — або хуейський, або буддійський. Нам залишається лише сподіватися на підкріплення зі сходу від центрального уряду Китаю."
 ma_clique_events.227.d.TIB: "Пропозицію про мир між хуейцзу та буддистами відхилено. Прагнучи повної перемоги, [TIB.GetLeader] від імені [TIB.GetNameDef] відкинув наші умови і вимагає повної капітуляції. У його очах на північному заході може панувати лише хтось один. Наша остання надія — на допомогу з центрального Китаю, яка допоможе відкинути повстанців!"
 ma_clique_events.227.a: "Продовжуємо."

 ma_clique_events.228.t: "Кліка Ма пропонує свої умови"
 ma_clique_events.228.d: "До офісу [ROOT.GetLeader] надійшло звернення від запанікованого кабінету міністрів із проханням про припинення вогню між [ROOT.GetNameDef] та [XSM.GetNameDef], поки криза в Китаї не вщухне. Спірні території залишаться під їхнім контролем, що є свідченням наших невдач. У столиці панують поразницькі настрої. Багато хто хоче припинити війну, попри ганьбу від таких невигідних умов. Проте, якщо в Китаї постане національний уряд, він напевно використає це на користь ханьців у майбутньому вирішенні територіальних претензій."
 ma_clique_events.228.a: "Так, давайте покінчимо з цим."
 ma_clique_events.228.b: "Ця війна ще не закінчена."

 ma_clique_events.229.t: "$ma_clique_events.228.t$"
 ma_clique_events.229.d: "$ma_clique_events.228.d$"
 ma_clique_events.229.a: "$ma_clique_events.228.a$"
 ma_clique_events.229.b: "$ma_clique_events.228.b$"

 ma_clique_events.230.t:0 "Наступ хуейцзу на північному заході"
 ma_clique_events.230.d:0 "Приголомшені перемогами хуейцзу у війні на північному заході, люди в [FROM.GetNameDef] почали вимагати миру, сподіваючись зберегти обличчя. Після прийому кількох їхніх посланців лідери різних кланів Ма впевнені, що конфлікт можна владнати на дуже вигідних умовах. Проте, попри запеклість, із якою билися хуейські армії, мало хто в родинах Ма прагне тотальної війни. У владних кабінетах серйозно розглядають можливість припинення бойових дій за умови відновлення влади хуейських губернаторів на спірних китайських територіях, дозволивши залишкам ворожих сил зберегти незалежність. Тепер [XSM.GetLeader] має вирішити, чи варта ця «оливкова гілка» того, аби відмовитися від шансу остаточно підкорити смертельного ворога і зарити сокиру війни між буддистами та мусульманами на північному заході, нехай і тимчасово."
 ma_clique_events.230.a:0 "Прийняти мирну пропозицію."
 ma_clique_events.230.b:0 "Ми наполягаємо на повній перемозі!"

 ma_clique_events.231.t:0 "Відмова від миру"
 ma_clique_events.231.d.MON:0 "Наші вимоги щодо їхньої часткової капітуляції в [MON.GetNameDef] залишилися непочутими. Не бажаючи розлучатися зі спірними територіями, як-от Чахар, і вірячи, що зрештою вони переможуть, монгольський лідер [MON.GetLeader] закликав своїх людей до подальшого кровопролиття. Хоча ми не можемо зупинити його від штовхання свого народу до безглуздя, ми можемо гарантувати, що їхній опір буде марним. Уперед, до остаточної перемоги!"
 ma_clique_events.231.d.TIB:0 "Наші вимоги щодо їхньої часткової капітуляції в [TIB.GetNameDef] залишилися непочутими. Не бажаючи розлучатися зі спірними територіями, як-от Чахар, і вірячи, що зрештою вони переможуть, тибетський лідер [TIB.GetLeader] закликав своїх людей до подальшого кровопролиття. Хоча ми не можемо зупинити його від штовхання свого народу до безглуздя, ми можемо гарантувати, що їхній опір буде марним. Уперед, до остаточної перемоги!"
 ma_clique_events.231.a:0 "Продовжуємо."

 #ma_clique_events.232.t: "$ma_clique_events.228.t$"
 #ma_clique_events.232.d: "$ma_clique_events.228.d$"
 #ma_clique_events.232.a: "$ma_clique_events.228.a$"
 #ma_clique_events.232.b: "$ma_clique_events.228.b$"

### Focuses ###

 XSM_three_province_plan: "План трьох провінцій"
 XSM_three_province_plan_desc: "Політична влада в кліці Ма розділена між провінціями Нінся, Ганьсу та Цінхай. Як для довірених охоронців північного заходу, ретельний баланс між цими провінціями є критично важливим для регіону та всього Китаю."

 XSM_qinghai_emergence_scheme: "Схема піднесення Цінхаю"
 XSM_qinghai_emergence_scheme_desc: "Велика провінція Цінхай, нещодавно перейшовши під наш контроль, здатна похитнути баланс сил у регіоні. Ми маємо подбати про її економічний та політичний розвиток, аби схилити цей баланс на свою користь."

 XSM_yushu_eight_point_plan: "План восьми пунктів Юйшу"
 XSM_yushu_eight_point_plan_desc: "Сільський регіон Юйшу в Цінхаї залишається майже зовсім нерозвиненим. Хоча це потребуватиме великих зусиль і може розлютити Тибет через глибокий етнічний розкол, залучення цієї території до сучасної епохи принесе нам великі плоди."

 XSM_troop_training: "Навчання полку Юйшу"
 XSM_troop_training_desc: "Аби краще керувати Юйшу (і, можливо, воювати за нього), нам слід проводити там регулярні військові навчання. Це розлютить тибетців, а дехто може навіть втекти до самого Тибету, але це цілком прийнятний наслідок."

 XSM_national_borders: "Наші національні кордони"
 XSM_national_borders_desc: "Жодна частина нашої нації не може бути відірваною від решти. Ми маємо раз і назавжди встановити повний контроль над Юйшу, і хай тибетці йдуть під три чорти!"

 XSM_promotion_buddhism: "Просування буддизму"
 XSM_promotion_buddhism_desc: "Найсуперечливішим пунктом плану Юйшу є просування лояльних буддійських вчителів. Вважається, що це допоможе змінити прихильність громадськості на нашу користь."

 XSM_reconstructing_civillian_government: "Реструктуризація уряду Юйшу"
 XSM_reconstructing_civillian_government_desc: "Цивільний уряд Юйшу не збирався зі смерті 13-го Далай-лами. Настав час скористатися нашим правом на аудит адміністрації Юйшу та рекомендувати реструктуризацію."

 XSM_transportation_improvement: "Дорога до Юйшу"
 XSM_transportation_improvement_desc: "Інфраструктура Юйшу майже зовсім не пов'язана з рештою країни. Ми маємо виправити цю кричущу проблему."

 XSM_opening_wasteland: "Освоєння пусток"
 XSM_opening_wasteland_desc: "Аби стимулювати розвиток великих земель за межами самого міста Юйшу, ми маємо усунути природні перешкоди, що заважають доступу до кількох відомих родовищ ресурсів, і знизити високу вартість їхньої експлуатації."

 XSM_factory_and_mills: "Будівництво млина"
 XSM_factory_and_mills_desc: "Водяний млин у Юйшу є головним приводом для скарг на нашу адміністрацію. Ми роками оподатковували землевласників, і те, що вони не змогли його добудувати, закидають нам. Наказ солдатам завершити млин піде на користь усім."

 XSM_xining_government: "Сінінський уряд"
 XSM_xining_government_desc: "Боротьба за владу в Цінхаї між законником Ма Лінем та його племінником, войовничим і безкомпромісним Ма Буфаном, досягла апогею. Після її завершення порядок у Цінхаї має бути відновлений."

 XSM_going_forward: "Шлях уперед"
 XSM_going_forward_desc: "Надто довго наша нація прагнула бути лише гвинтиком у великій китайській машині. Хоча ми, безперечно, китайці, ми не повинні забувати про корінних жителів нашої землі — хуейцзу, та про дух служіння, завдяки якому вона була здобута."

 XSM_reforming_education: "Реформа освіти"
 XSM_reforming_education_desc: "Орден іхевань наголошує на сучасній освіті, окремій від старої системи меньхуань. Ми можемо найняти східних вчителів для викладання в наших містах."

 XSM_kunlun_middle_school_tibetans: "Військове навчання для тибетців"
 XSM_kunlun_middle_school_tibetans_desc: "Тибетська «п'ята колона» не може залишатися. Нам слід відправити молодших офіцерів до їхніх сіл, аби ті очолили місцеві школи, забезпечуючи належну військову дисципліну для всіх."

 XSM_seven_expeditions_golog: "Сім експедицій до Ґолоку"
 XSM_seven_expeditions_golog_desc: "Непокірний народ ґолоків є однією з головних причин напруженості з Тибетом. Остання каральна експедиція через Цінхай раз і назавжди вижене цих буддистів із регіону."

 XSM_military_administration: "Військово-цивільна адміністрація"
 XSM_military_administration_desc: "Ма Фусян утримував єдність кліки Ма завдяки поєднанню сінінських військових та цивільного уряду. Очевидно, що в цей непевний час такий союз необхідно зберегти задля практичного управління."

 XSM_industrialization_project: "Проєкт індустріалізації"
 XSM_industrialization_project_desc: "Аби підтримувати наші зростаючі збройні сили, нам знадобиться зброя та можливість її масового виробництва. Хоча арсенали відповідатимуть за готову продукцію, слід створити нові державні підприємства для виробництва проміжних компонентів, оснастивши їх найсучаснішим іноземним обладнанням попри будь-яку ціну."

 XSM_staying_put: "Незмінний курс"
 XSM_staying_put_desc: "Глибоко принциповий старший Ма Лінь втримав владу. Для північного заходу та його народу настає новий світлий день — день справжньої рівності між ханьцями, хуейцзу та іншими."

 XSM_islamic_identity: "Ісламська ідентичність хуейцзу"
 XSM_islamic_identity_desc: "Хоча ми маємо дбати про те, аби не антагонізувати ханьців чи інші лояльні народи, саме на захід, до Мекки та обителі ісламу, дивляться хуейцзу, аби підкреслити свою самобутність. Ми маємо використати цей зв'язок на користь усіх і налагодити нові контакти з дружніми ісламськими державами. Підтримка їхніх вчених може принести велику користь провінції!"

 XSM_qi_successor: "Природний наступник Ці"
 XSM_qi_successor_desc: "Адміністрація Ма Ці навчила Ма Ліня всього, що потрібно знати про управління Цінхаєм. Тепер, з ним на посаді, цивільний уряд може повернути собі провідну роль і стабілізувати провінцію через делегування повноважень."

 XSM_peoples_governor: "Народний губернатор"
 XSM_peoples_governor_desc: "Співчуття Ма Ліня до народу Цінхаю проявляється у формі світського правління, де до різних народів провінції ставляться з повагою як до громадян, а не як до підданих."

 XSM_farming_assistance: "Допомога в землеробстві"
 XSM_farming_assistance_desc: "На території трьох провінцій є багатий родючий ґрунт, але вкрай мало проточної води. Це накладає суворе обмеження на те, скільки люди можуть виробляти у мирний час і які податки ми можемо з них збирати. Будівництво акведуків до фермерських громад допоможе розширити сільськогосподарські угіддя та працевлаштувати біженців зі сходу."

 XSM_roads: "Сполучення Цінхаю"
 XSM_roads_desc: "Залізниця Цінхай — Ланьчжоу була мрією багатьох амбітних інженерів у наших провінціях, але досі на це не виділялося коштів. Ця адміністрація готова втілити мрію в реальність і принести сучасні засоби сполучення громадам, які їх потребують."

 XSM_gansu_reconstruction_plan: "Відбудова Ганьсу"
 XSM_gansu_reconstruction_plan_desc: "Спустошення, спричинене Гоміньцзюнем та подальшим відвоюванням, залишило Ганьсу в руїнах. Оскільки економіка та політичні інститути регіону відновлюються вкрай повільно, державне втручання необхідне, щоб поставити провінцію на ноги."

 XSM_clearing_space: "Розчищення простору"
 XSM_clearing_space_desc: "Порожнеча, що залишилася після руйнувань, тепер є можливістю для нового зростання. Ділянки землі з доступом до проточної води можна продати китайцям, які втекли сюди, як шанс відновити свій бізнес."

 XSM_assisting_people: "Заповнення прогалин"
 XSM_assisting_people_desc: "Імпорт споживчих товарів став спорадичним, а ціни різко зросли. Ми повинні виробляти якомога більше предметів розкоші прямо тут, у себе вдома."

 XSM_employ_assistance: "На колінах"
 XSM_employ_assistance_desc: "Славетне покоління «ганьсуйських сміливців» починало як звичайні фермери, які взяли до рук зброю для захисту своїх домівок. Ми маємо наслідувати наших героїв і наказати резервістам добровільно допомагати на фермах, щоб нагодувати народ."

 XSM_rooting_agents: "Викорінення агентів"
 XSM_rooting_agents_desc: "Наші суперники пильнують і використають будь-яку нагоду для посилення власних політичних позицій. Їх та їхніх агентів потрібно знайти спільними зусиллями бюрократії та ліквідувати."

 XSM_consolidating_administration: "Консолідація адміністрації"
 XSM_consolidating_administration_desc: "Управління західними провінціями потерпає від неефективності та шахраїв. Деякі жителі повідомляють навіть про фальшивих амбанів, які вимагають їжу, прикриваючись титулами. Ми можемо відновити довіру, консолідувавши адміністрацію та наказавши заарештувати самозванців."

 XSM_soldier_farmers: "Солдати-землероби"
 XSM_soldier_farmers_desc: "Цикл сівби та жнив підкреслюється як у китайській літературі, так і в Корані. Обидва наші ідеали сходяться в образі солдата-землероба. Наша адміністрація вирішила вшановувати зразкових фермерів так само як і солдатів."

 XSM_development: "Нові розробки"
 XSM_development_desc: "Відбудова Ганьсу ще не завершена. Тепер, коли влада консолідована, увесь державний апарат можна спрямувати на її покращення, особливо на відновлення все ще сильно пошкоджених міських районів."

 XSM_opium_farming: "Вирощування опіуму"
 XSM_opium_farming_desc: "Хоча багато хто стверджує, що опіум поставив Китай на коліна, він безсумнівно є цінним. Нашому режиму важко отримати достатньо ліквідних активів через завоювання чи пограбування, тому ми не можемо ігнорувати такий потужний потенційний дохід лише заради моралі. Через партнерство з місцевими фермами наш режим відтепер братиме участь у культивуванні опіуму."

 XSM_raking_in: "Гребти лопатою"
 XSM_raking_in_desc: "Наша адміністрація зібрала імена нелегальних виробників опіуму в наших провінціях. Замість тривалого полювання, знищення угідь та даремно згаяних тижнів, ми можемо відправити надійних солдатів, щоб витрусити трохи грошей із цих шахраїв."

 XSM_tianshui_arsenal: "Розширення Тяньшуйського арсеналу"
 XSM_tianshui_arsenal_desc: "Обладнання Тяньшуйського арсеналу застаріло і потребує модернізації. Розширивши потужності та замовивши обладнання з-за кордону, ми зможемо не відставати від наших суперників у регіоні."

 XSM_technical_universities: "Північно-західні технічні університети"
 XSM_technical_universities_desc: "З настанням нової ери в Сібеї вкрай важливо для безпеки та добробуту нашого народу, щоб ми не відставали від решти світу. Попередні зусилля з побудови університетів у Ганьсу та інших місцях будуть розширені; відкриються нові школи зі спеціалізацією на сільському господарстві та інженерії. Інші в Китаї можуть нехтувати розрізненими народами північного заходу, але ми не маємо виправдань — ми повинні взяти ініціативу на кордоні Китаю!"

 XSM_artillery_pieces: "Артилерійські гармати"
 XSM_artillery_pieces_desc: "Після розширення арсеналу ми повинні почати розробку більш просунутої артилерії. Як і в минулій Європейській війні, ворожі лінії мають бути перетворені на руїни."

 XSM_unclogging_progress: "Відновлення прогресу"
 XSM_unclogging_progress_desc: "Тепер, коли війна закінчилася, а відбудова йде повним ходом, настав час зазирнути в майбутнє. З новими силами ми закладемо його підвалини."

 XSM_rebirth: "Відродження"
 XSM_rebirth_desc: "Хоча наша адміністрація не може повернути все втрачене, ми здатні ввести Ганьсу в сучасну епоху. З магазинами морозива, телеграфними відділеннями та іншими сучасними атрибутами люди, які переживуть наступні роки національної боротьби, житимуть щасливо."

 XSM_fuxiang_legacy: "Спадщина Фусяна"
 XSM_fuxiang_legacy_desc: "Хоча його душа відійшла у вічність, гармонійний статус-кво, який він побудував, та подолання розколу між ханьцями та хуейцзу назавжди залишаться неперевершеними. Захистивши цю спадщину від ворожих елементів всередині та зовні, ми повинні розвивати її далі."

 XSM_kind_general: "Добрий генерал"
 XSM_kind_general_desc: "Ма Хунбінь висунувся на передній план кліки Ма. Він прагне поміркованих реформ, включаючи децентралізацію влади та налагодження нових зв'язків з іншими державами Китаю."

 XSM_summoning_council: "Скликання провінційної ради"
 XSM_summoning_council_desc: "Ради Нінся, Ганьсу та Цінхаю надто довго діяли автономно. Неефективність виникає тоді, коли ради мають можливість анулювати накази одна одної. Щоб гарантувати виконання наказів губернатора, тимчасові ради мають бути зібрані в столиці."

 XSM_warlord_alliance: "Альянс мілітаристів"
 XSM_warlord_alliance_desc: "Китайські мілітаристи не довіряють один одному і не бажають допомагати у боротьбі проти іноземних загарбників. Губернатор вірить, що попри цю недовіру, обіцянка єдиного Китаю за їхнього життя може викликати певне співчуття, принаймні до нас."

 XSM_earning_respect: "Заслуговування на повагу"
 XSM_earning_respect_desc: "Губернатор підготував добірку вишуканих дарунків для мілітаристів Китаю. Кожен предмет обраний так, щоб нагадати їм про важливу роль кліки Ма в утриманні цілісності Китаю."

 XSM_making_friends: "Нові знайомства"
 XSM_making_friends_desc: "Народу хуейцзу важко взаємодіяти з іншими провінціями на рівних. Стигма проти мусульман пронизує інтелектуальні кола. Настав час для нашої адміністрації опублікувати приязні оголошення про наші провінції та заманити тих, хто має відкритий розум, приїхати до нас."

 XSM_removing_enemies: "Розправа зі старими ворогами"
 XSM_removing_enemies_desc: "Через розбрат мілітаристів у нашої адміністрації залишилося багато ворогів. Навіть у родинах є ті, хто хотів би бачити нас знову підлеглими Пекіну чи Ґуандуну. Необхідно скласти головний список цих агітаторів для постійного нагляду."

 XSM_hard_general: "Суворий генерал"
 XSM_hard_general_desc: "Ма Хункуй переміг у боротьбі за політичну першість. Як прихильник жорсткої лінії, він непохитно дотримується ідей та стилю правління старого зразка."

 XSM_eliminating_socialists: "Ліквідація соціалістів"
 XSM_eliminating_socialists_desc: "Соціалізм тече в Китай з південних портів завдяки декадентським європейцям. Ми і раніше гартувалися проти радянського впливу, але нові шляхи досягнення соціалізму проникають навіть у вчення Сунь Ятсена. Ми повинні переконатися, що всі копії цих книг будуть заборонені в наших провінціях."

 XSM_dual_province_rule: "Двоїсте провінційне правління"
 XSM_dual_province_rule_desc: "Будучи родиною, ми здатні організовуватися органічно і справедливо розподіляти відповідальність. Це привело адміністрацію до системи двоїстого правління. Подібно до діархії південних провінцій, вища влада розділена між двома губернаторами, які балансують один одного."

 XSM_no_more_threats: "Більше жодних загроз"
 XSM_no_more_threats_desc: "Тяньшую бракує природних перешкод, які захистили б його від вторгнення, а постійна загроза нападу обмежувала наші варіанти зовнішньої політики. Ми повинні побудувати мережу потужних фортифікацій, щоб розв'язати цю проблему."

 XSM_ningxia_mobilization_start: "Мобілізація Нінся"
 XSM_ningxia_mobilization_start_desc: "Нінся — це серце народу хуейцзу. Хоча наш контроль там міцний, можна зробити ще більше для заохочення мілітаризації та державної служби."

 XSM_baojia: "Система баоцзя"
 XSM_baojia_desc: "Логічним розширенням сімейного управління є система баоцзя. Ця традиція була відроджена адміністрацією для делегування охорони правопорядку. Десять родин хуейцзу присвячують себе певній меті у своїй громаді, і кожна родина намагається переконати десять інших родин підкоритися їм. Це також допоможе інтеграції іммігрантів."

 XSM_consolidating_finance: "Консолідація фінансів"
 XSM_consolidating_finance_desc: "Бюджети губернаторів щороку виявляються дефіцитними. Рішення, представлене адміністрації, полягає в консолідації скарбниць та бухгалтерських відділів провінцій і розподілі залишків бюджету в найкращих інтересах народу хуейцзу."

 XSM_ningxia_mobilization: "Мобілізація народу"
 XSM_ningxia_mobilization_desc: "З початком відкритої війни попередні міркування про вплив загальної мобілізації на економіку більше не мають ваги. Ми повинні впровадити настільки ретельну політику, наскільки це можливо."

 XSM_horsies_strong: "Відправка кавалерії"
 XSM_horsies_strong_desc: "Кавалерія хуейцзу здобула велику славу в минулому столітті, і наші люди продовжили цю традицію, коли в Китаї запанував безлад. З початком війни ми повинні розробити новий режим підготовки, спираючись на цей досвід, щоб зміцнити нашу перевагу."

 XSM_leading_charge: "Очолюючи атаку"
 XSM_leading_charge_desc: "«Ганьсуйські сміливці» минулого очолювали атаку проти іноземців у найскладніші для Китаю часи. В інтересах національної єдності губернатори відновлюють прапори цих воїнів."

 XSM_ningxia_guard: "Нінсянська гвардія"
 XSM_ningxia_guard_desc: "Ма Хунбінь є палким прихильником спеціальних підрозділів, які так ефективно використовувалися під час Світової війни. Для їхнього розвитку було запропоновано нову структуру дивізій. Ця структура визначає спеціальні підрозділи як «гвардію», підзвітну безпосередньо окремим політичним та військовим керівникам поза межами громіздкої бюрократії всієї армії."

 XSM_saving_suffering: "Порятунок стражденних"
 XSM_saving_suffering_desc: "У той час як більша частина Китаю густо заселена, на північному заході все навпаки. Щоб зберегти якомога більше людських ресурсів, окремі дивізії повинні мати польові шпиталі західного зразка із західними медсестрами та лікарями, мобілізованими для підготовки тих, хто працюватиме на полі бою."

