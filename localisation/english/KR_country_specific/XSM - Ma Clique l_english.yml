### Characters ###
 XSM_xining_council:0 "Сінінська рада"
 XSM_xining_council_sic_desc:0 "§YІсторична довідка:§! §LСінінська рада — це інституція, що консолідувала південну цінхайську фракцію Кліки Ма, з містом Сінін як головною базою Ма Ці. Його наступник, Ма Лінь, правив м'якою рукою, делегуючи багато рішень різним лідерам хуейцзу в Цінхаї. Хоча де-юре вони не мають влади над регіонами північних фракцій (відомих як ганьсуйська фракція), на практиці Сінінська рада слугує своєрідною противагою потужному впливу Ма Фусяна на клани хуейцзу.\n\nОскільки здоров'я Ма Фусяна погіршується, а проблем стає дедалі більше, Сінінська рада, ймовірно, буде змушена виступати арбітром у суперечках між його наступниками в Ганьсу та Нінся, не кажучи вже про невирішену напруженість після смерті Ма Ці у 1931 році. Децентралізована природа Кліки Ма дозволяє приймати автономні рішення та виникати кільком центрам сили, хоча це не завжди йде на користь справі.§!"

 #劉志丹
 XSM_liu_zhidan:0 "Лю Чжидань"
 XSM_liu_zhidan_leader_desc:0 "§YНародився:§! §L4 жовтня 1903 року, повіт Баоань, провінція Шаньсі, династія Цін§!"

 #馬麟
 XSM_ma_lin:0 "Ма Лінь"
 XSM_ma_lin_leader_desc:0 "§YНародився:§! §L1876 рік, Хечжоу, провінція Ганьсу, Велика Цін§!\n§YІсторична довідка:§! §LМа Лінь — син славетного «ганьсуйського сміливця» Ма Хайяня, який разом із Ма Фусяном бився проти Альянсу восьми держав у 1900 році. Вирісши на перетині ханьського та мусульманського впливів у Ганьсу, Ма Лінь приєднався до сунітської школи Сідаотан. Протягом перших двох десятиліть XX століття він часто виступав посередником для більш радикальних членів родини Ма, зокрема Ма Чжун'їна. Ма Ліню вдалося відбити набіги Ма Чжун'їна в Ганьсу під час війни Кліки Ма проти Гоміньцзюню. Після смерті брата Ма Ці у 1931 році він став губернатором Цінхаю. Це призначення дуже обурило його племінника, Ма Буфана, який заявляв про власні права на посаду. За губернаторства Ма Ліня територія Цінхаю розширилася на Амдо у 1935 році, що принесло йому визнання родини. До кінця 1935 року Ма Лінь разом із Ма Фусяном розробив план інтеграції Юйшу до Цінхаю, проте смерть Ма Фусяна перервала ці починання.§!"

 #馬鴻賓
 XSM_ma_hongbin:0 "Ма Хунбінь"
 XSM_ma_hongbin_leader_desc:0 "§YНародився:§! §L14 вересня 1884 року, Хечжоу, провінція Ганьсу, Велика Цін§!\n§YІсторична довідка:§! §LМа Хунбінь виріс у тіні свого батька Ма Фулу, який загинув у бою проти Альянсу восьми держав у 1900 році. На відміну від батька, Ма Хунбінь обрав шлях захисту християнської місії в Саньдаохе, за що після Боксерського повстання був нагороджений орденом Леопольда. На початку ери мілітаристів він робив кроки до зближення з Гоміньданом, повідомивши генералу Чан Кайші про свій вступ на посаду правителя Нінся у 1920 році. Несподівано у 1921 році Чан зажадав відкрити Нінся для ханьських поселенців, що порушило б автономію хуейцзу. У 1925 році Ма Хунбінь офіційно засудив Чана. На нещастя для нього, Ма Хункуй, розлючений зв'язками родича з Гоміньданом, у 1930 році публічно назвав Ма Хунбіня «соціалістичним шпигуном». Це суперництво було перерване війною з Гоміньцзюнем, де обидва воювали пліч-о-пліч проти Фен Юйсяна. Останнім часом Ма Хунбінь опинився в ізоляції через неспроможність завадити бунтівному Ма Чжун'їну вербувати загони грабіжників у Нінся.§!"

 #馬福祥
 XSM_ma_fuxiang:0 "Ма Фусян"
 XSM_ma_fuxiang_leader_desc:0 "§YНародився:§! §L4 лютого 1876 року, Хечжоу, провінція Ганьсу, Велика Цін§!\n§YІсторична довідка:§! §LМа Фусян вважається одним із засновників сімейної Кліки Ма, що закріпилася на північному заході. Як і багато інших родичів, він служив під началом Дун Фусяна і прославився під час Боксерського повстання у лавах «ганьсуйських сміливців». На світанку Синьхайської революції він разом із племінником Ма Хунбінем захищав католицькі місії, поки Ма Аньлян бився за династію Цін проти республіканців. Хоча Аньлян здобув кілька перемог, неминучий крах династії змусив родину присягнути на вірність республіці. Невдовзі Аньлян помер, залишивши Фусяна єдиною об'єднавчою постаттю північної Кліки Ма. Фусян насамперед прагне зберегти позиції родини на північному заході. Свого часу він підтримав Гоміньцзюнь під час їхньої кривавої кампанії в Ганьсу, проте згодом зрадив їх і перейшов на бік Чжилійської кліки — цей союз триває вже майже десятиліття. Призначення губернатором Ганьсу та Суйюаня стало нагородою за його постійні зміни політичних симпатій.\nЗараз Фусян веде більш спокійне життя, відіграючи ключову роль у регіоні. Як голова комісії у справах Тибету та Монголії, він курує відносини з цими ворожими групами. Крім того, він бачить свою місію в «гуманізації» образу хуейцзу в очах ханьців через унікальне поєднання конфуціанських та ісламських вірувань, що принесло йому славу вченого. Фусян подарував регіону десятиліття миру, який триватиме доти, доки він сам залишатиметься при владі.§!"

 #馬步芳
 XSM_ma_bufang:0 "Ма Буфан"
 XSM_ma_bufang_leader_desc:0 "§YНародився:§! §L1903 рік, Хечжоу, провінція Ганьсу, Велика Цін§!\n§YІсторична довідка:§! §LМа Буфан — молодший брат Ма Буціна та син Ма Ці. Почав службу в армії Цінхаю у 1915 році. У 1919 році Бейянський уряд офіційно затвердив його на посаді, що дозволило йому зміцнити свій авторитет. Під час служби він глибоко вивчав іслам, ставши прихильником мечеті Дунґуань та вчення іхевань Ма Ваньфу. Ма Буфан підтримував союз Ма Фусяна з Гоміньцзюнем до моменту їхньої зради, отримавши згодом порцію гніву від родини за небажання воювати з Гоміньцзюнем напряму. Після призначення Ма Ліня губернатором Цінхаю у 1931 році, Буфан занурився у релігійне життя, офіційно проголосивши іхевань головною патріотичною формою ісламу у 1933 році. Його стосунки з Ма Хунбінем та Ма Хункуєм є натягнутими: Буфан особисто захоплюється бойовим духом Ма Чжун'їна, хоча офіційно засуджує його за зраду сім'ї.§!"

 #馬鴻逵
 XSM_ma_hongkui:0 "Ма Хункуй"
 XSM_ma_hongkui_leader_desc:0 "§YНародився:§! §L9 березня 1892 року, Ханьцзяцзи, провінція Ганьсу, Велика Цін§!\n§YІсторична довідка:§! §LМа Хункуй — син «героя північного заходу» Ма Фусяна. Закінчив військову академію Ганьсу у 1909 році, а у 1912-му підтримав Синьхайську революцію. Оголосив себе «командувачем з придушення бандитизму», що спочатку привело його до лав Гоміньцзюню в рамках союзу батька з цією клікою. Коли Фен Юйсян зрадив Ма Фусяна, Ма Хункуй провів жорстоку чистку прихильників Гоміньцзюню у своїй бригаді під час війни. Після розорення Ганьсу він став затятим противником Гоміньдану, дійшовши до публічного осуду Ма Хунбіня за його минулі зв'язки з цією партією. У першій половині 1930-х років Ма Хунбінь намагався балансувати між успадкованим від батька губернаторством у Ганьсу та економічними проблемами, спричиненими масовою ханьською імміграцією.§!"

 #馬彪
 XSM_ma_biao:0 "Ма Бяо"
 XSM_ma_biao_high_command_desc:0 "§YНародився:§! §L1885 рік, Хечжоу, провінція Ганьсу, Велика Цін§!\n§YІсторична довідка:§! §LЩе один молодий солдат «ганьсуйських сміливців», Ма Бяо брав активну участь у захисті династії Цін проти Альянсу восьми держав, супроводжуючи імператорський двір до Сіаня. На початку війни з Тибетом у 1935 році його призначили командиром бригади армії Цінхаю, де він очолив героїчну оборону Юйшу. Після перемоги Ма Бяо вчинив жорстоку розправу над народом ґолоків, яких він вважав зрадниками родини Ма. Він керував знищенням міст ґолоків, проголосивши це кроком до розквіту народу дунсян, разом із якими він воював. Повернувшись до Цінхаю, він зіткнувся з ненавистю багатьох жителів через вчинену різанину, проте його врятували військові нагороди за хоробрість та союз із імамом Ма Ваньфу, лідером руху іхевань.§!"

 #馬敦靜
 XSM_ma_dunjing:0 "Ма Дунцзін"
 XSM_ma_dunjing_commander_desc:0 "§YНародився:§! §L1906 рік, Хечжоу, провінція Ганьсу, Велика Цін§!\n§YІсторична довідка:§! §LТретій син Ма Хунбіня, Ма Дунцзін служив в армії Ма Хункуя з придушення бандитизму і потрапив під сильний ідеологічний вплив останнього. Проте, як і більшість мілітаристів родини Ма, він легко пристосовується до нових союзників заради національної єдності.§!"

 #馬仲英
 XSM_ma_zhongying:0 "Ма Чжун'їн"
 XSM_ma_zhongying_commander_desc:0 "§YНародився:§! §L1910 рік, Хечжоу, провінція Ганьсу, Велика Цін§!\n§YІсторична довідка:§! §LМа Чжун'їн — «паршива вівця» в родині Ма, і він цілком заслуговує на цю репутацію. Пішовши слідами старших родичів, він розпочав військову службу всього у 14 років. У віці 17 років він шокував сім'ю, дезертирувавши з битви в Ганьсу проти Фен Юйсяна і повівши свій кавалерійський загін на північ, до Нінся. Наступне десятиліття Ма Чжун'їн намагався вирізати собі власне володіння у східних провінціях родини Ма, маючи єдиним союзником свого далекого кузена Ма Хушаня. Його єдина щира віра — школа ісламу Сідаотан, що змушує його атакувати мечеті куфія, намагаючись поширити свої переконання через сектантське насильство.§!"

 #馬虎山
 XSM_ma_hushan:0 "Ма Хушань"
 XSM_ma_hushan_army_chief_desc:0 "§YНародився:§! §L1910 рік, Хечжоу, провінція Ганьсу, Велика Цін§!\n§YІсторична довідка:§! §LМа Хушань, як і його родич Ма Чжун'їн, давно прагнув поширити вплив на захід, у Сіньцзян. Проте, на відміну від брата, він не готовий зрадити родину заради цієї мети. Служачи під началом Ма Хунбіня, Ма Хушань втомився від конфліктів, що роздирають західні провінції, і мріє про національну єдність.§!"

 #馬繼援
 XSM_ma_jiyuan:0 "Ма Цзіюань"
 XSM_ma_jiyuan_high_command_desc:0 "§YНародився:§! §L18 січня 1921 року, Хечжоу, провінція Ганьсу, Республіка Китай§!\n§YІсторична довідка:§! §LНаймолодший командир у родині Ма, Ма Цзіюань служить під командуванням свого батька, Ма Буфана, аби принести йому славу всередині Кліки Ма. У цінхайській армії він зосередив зусилля на модернізації кавалерійських бригад, сподіваючись, що вони зможуть долати величезні відстані на півночі, якщо виникне потреба.§!"

 #馬步青
 XSM_ma_buqing:0 "Ма Буцін"
 XSM_ma_buqing_high_command_desc:0 "§YНародився:§! §L1901 рік, Хечжоу, провінція Ганьсу, Велика Цін§!\n§YІсторична довідка:§! §LСтарший брат суперечливого Ма Буфана, Ма Буцін також служив під керівництвом батька в армії Цінхаю. На відміну від брата, він отримав дорогу класичну китайську освіту, що зрештою зробило його непридатним для командування у міжетнічному конфлікті проти тибетців у 1935 році. Ма Буцін служив під началом Фен Юйсяна під час союзу Ма з Гоміньцзюнем і сильно постраждав політично після їхньої зради.§!"

 #韓有文
 XSM_han_youwen:0 "Хань Ювень"
 XSM_han_youwen_high_command_desc:0 "§YНародився:§! §L1912 рік, Сінін, провінція Ганьсу, Республіка Китай§!\n§YІсторична довідка:§! §LХань Ювень — єдиний командир тюркського походження (салар) у Кліці Ма. Він отримав своє місце завдяки службі батька у лавах «ганьсуйських сміливців». Хань Ювень служить під керівництвом Ма Буфана, покладаючись на ісламсько-модерністські погляди останнього, аби зберігати вплив у кліці, де домінують хуейцзу.§!"

