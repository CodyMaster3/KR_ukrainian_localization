 ### Manifest ###
 faction_manifest_secure_the_sinosphere_name: "Убезпечити Синосферу"
 faction_manifest_secure_the_sinosphere_desc: "Якщо Китай прагне повернутися на світову арену, він повинен повернути все, що втратив на користь великих держав століття чи більше тому. Водночас ми маємо прагнути убезпечити влучно названу Синосферу.\n\nКонтролюйте всі регіони в Китаї (включно з усіма претензіями), Кореї, Японії, Індокитаї та Сінгапурі."

