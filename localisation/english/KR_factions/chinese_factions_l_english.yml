 ### Manifest ###
 faction_manifest_anti_imperialist_crusade_name: "Антиімперіалістичний хрестовий похід"
 faction_manifest_anti_imperialist_crusade_desc: "Західний вплив має бути викорінений з Азії та Тихоокеанського регіону. Століття експлуатації континенту тривали досить довго, і настав час завдати остаточного удару по імперіалістичних державах.\n\nКонтролюйте всі східноазійські, індійські, центральноазійські та тихоокеанські регіони. Виключає Близький Схід."

