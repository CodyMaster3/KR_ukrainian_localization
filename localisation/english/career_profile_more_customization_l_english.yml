### СТРІЧКИ ###
CAREER_PROFILE_ROCKETS_REIGN: "§HРакети рулять§!"
CAREER_PROFILE_ROCKETS_REIGN_DESCRIPTION: "Збудуйте більш ніж 10 ракетних майданчиків."
CAREER_PROFILE_ROCKETS_REIGN_QUOTE: "«Ракета спрацювала ідеально, якщо не враховувати, що вона сіла не на ту планету».\n\n(Вернер фон Браун)"
CAREER_PROFILE_STEEL_AT_HIGH_SPEED: "§HСтрімка сталь§!"
CAREER_PROFILE_STEEL_AT_HIGH_SPEED_DESCRIPTION: "Розмістіть понад 4000 танків із максимальною швидкістю понад 12 км/год."
CAREER_PROFILE_STEEL_AT_HIGH_SPEED_QUOTE: "«Якщо Вам здається, що все під контролем, Ви рухажтеся недостатньо швидко».\n\n(Маріо Андретті)"
CAREER_PROFILE_ORCHESTRA_OF_BOOM: "§HГромовий оркестр§!"
CAREER_PROFILE_ORCHESTRA_OF_BOOM_DESCRIPTION: "Розмістіть дивізію, в складі якої є принаймні один батальйон артилерії, ПТА, ЗА та ракетної артилерії за підтримки роти зв'язку."
CAREER_PROFILE_ORCHESTRA_OF_BOOM_QUOTE: "\n«Справжнє крешєндо звуків... таке безперервне, що зливається та змішується в один знищуючий рев... наче рев поїзда в тунелі, посилений у мільйон разів».\n\n(Арнолд Д. Гарві)" # (&?)
CAREER_PROFILE_MARE_NOSTRUM: "§HMare nostrum§!"
CAREER_PROFILE_MARE_NOSTRUM_DESCRIPTION: "Здобудьте панування на морі в шести основних морських регіонах Середземного моря, з яких принаймні один є оспорюваним."
CAREER_PROFILE_MARE_NOSTRUM_QUOTE: "\n«Коли я загубив свою гвинтівку, армія оштрафувала мене на 85 доларів. Ось чому у флоті капітан іде на дно з кораблем».\n\n(Дік Ґреґорі)"
CAREER_PROFILE_THE_THOUSAND_YEAR_BOND: "§HТисячарічні узи§!"
CAREER_PROFILE_THE_THOUSAND_YEAR_BOND_DESCRIPTION: "Розмістіть сто батальйонів звичайної або верблюдової кавалерії."
CAREER_PROFILE_THE_THOUSAND_YEAR_BOND_QUOTE: "«Кінь мусить бути дещо божевільним, щоб ефективно воювати в кавалерії, а вершник — повністю».\n\n(Стівен Прессфілд)" # (&)
CAREER_PROFILE_RULED_BY_FURNITURE: "§HПравлять меблі!§!"
CAREER_PROFILE_RULED_BY_FURNITURE_DESCRIPTION: "Зробіть так, щоби жодна особа або їхня група не були зображені на чолі держави."
CAREER_PROFILE_RULED_BY_FURNITURE_QUOTE: "«Занепокоєння — як крісло-гойдалка: воно дає чим зайнятися, але далеко Ви так не зайдете».\n\n(Старе англійське прислів'я)"
CAREER_PROFILE_SYNTHETIC_SECURITY: "§HСинтетична безпека§!"
CAREER_PROFILE_SYNTHETIC_SECURITY_DESCRIPTION: "Отримайте більш ніж 30 одиниць гуми з штучних джерел (синтетичних НПЗ)."
CAREER_PROFILE_SYNTHETIC_SECURITY_QUOTE: "«Якби жінки на заводах зупинили свою роботу на 20 хвилин, союзники програють війну».\n\n(Французький фельдмаршал і головнокомандувач Жозеф Жоффр, ПСВ)"
CAREER_PROFILE_RUBBER_BARON: "§HГумовий барон§!"
CAREER_PROFILE_RUBBER_BARON_DESCRIPTION: "Майте під контролем принаймні 1000 одиниць гуми та закриту економіку."
CAREER_PROFILE_RUBBER_BARON_QUOTE: "«...захоплення головних областей виробництва гуми на Далекому Сході в 1942 році знищило джерела 90 відсотків світового виробництва природного каучуку».\n\n(The Southern Economic Journal, січень 1947 р.)"
CAREER_PROFILE_THE_TRUCK_WILL_ALWAYS_GET_THROUGH: "§HВантажівка завжди прорветься§!"
CAREER_PROFILE_THE_TRUCK_WILL_ALWAYS_GET_THROUGH_DESCRIPTION: "Зробіть так, щоби 5000 вантажівок постачання доставляли припаси арміям."
CAREER_PROFILE_THE_TRUCK_WILL_ALWAYS_GET_THROUGH_QUOTE: "«Вони казали, що бомбардувальник завжди прорветься. Але вантажівки вже були там».\n\n(Автор невідомий)"
CAREER_PROFILE_SCORCHED_EARTH: "§HВипалена земля§!"
CAREER_PROFILE_SCORCHED_EARTH_DESCRIPTION: "Підірвіть залізниці, використавши механіку «випаленої землі», щоб уповільнити ворожий наступ."
CAREER_PROFILE_SCORCHED_EARTH_QUOTE: "«...ворогові не мусить дістатися жодного паровоза, жодного залізничного вагона, жодного фунту зерна чи галону пального».\n\n(Йосип Сталін, радіозвернення 3 липня 1941 р.)" # (&)
CAREER_PROFILE_BLITZ_THIS: "§HОсь вам і бліц...§!" # (&)
CAREER_PROFILE_BLITZ_THIS_DESCRIPTION: "Виберіть гнучку оборону як переважну стратегію генерала, фельдмаршала або країни."
CAREER_PROFILE_BLITZ_THIS_QUOTE: "«Відтягніть свій шик, як лучник натягує тятиву лука, а далі відпустіть».\n\n(Автор невідомий)"

 # 1.15 Kaiser
  CAREER_PROFILE_TASK_FAILED_SUCCESSFULLY: "§HЗавдання успішно провалено§!"
  CAREER_PROFILE_TASK_FAILED_SUCCESSFULLY_DESCRIPTION:0 "Проваліть рейд, маючи 80% шансу на успіх або більше."
 CAREER_PROFILE_TASK_FAILED_SUCCESSFULLY_QUOTE:0 "«Цей рейд слід розглядати як розвідку боєм... Ми мусили здобути всю необхідну інформацію перед початком значно масштабніших операцій...»\n\n— Вінстон Черчилль про рейд на Дьєп, 8 вересня 1942 року"
 CAREER_PROFILE_PUNCH_IT: "§HБий 'го!§!"
 CAREER_PROFILE_PUNCH_IT_DESCRIPTION:0 "Успішно здійсніть рейд на ядерний об'єкт, контролюючи щонайменше один сусідній із ним регіон"
 CAREER_PROFILE_PUNCH_IT_QUOTE:0 "«Задля порятунку життя нації було необхідно відновити в армії волю йти на смерть»\n\n— Олександр Керенський про Червневий наступ"
 CAREER_PROFILE_PLAN_L: "§HПлан «L»§!"
 CAREER_PROFILE_PLAN_L_DESCRIPTION:0 "Почавши гру за країну без виходу до моря, завершіть 2 військово-морські спецпроєкти, побудуйте 10 есмінців, 5 крейсерів, 2 лінкори та 1 авіаносець."
 CAREER_PROFILE_PLAN_L_QUOTE:0 "«Флоту потрібно три роки, щоб побудувати корабель. Але знадобиться триста років, щоб створити нову традицію. Евакуація триватиме».\n\n— Ендрю Каннінгем про евакуацію з Криту"
 CAREER_PROFILE_SWEETENER_HEXADECAGON: "§HСолодкий шістнадцятикутник§!"
 CAREER_PROFILE_SWEETENER_HEXADECAGON_DESCRIPTION:0 "Дослідіть 16 технологій, розблокованих спеціальними проєктами"
 CAREER_PROFILE_SWEETENER_HEXADECAGON_QUOTE:0 "«Коли я прийшов до тебе з тими розрахунками, ми гадали, що можемо запустити ланцюгову реакцію, яка знищить увесь світ».\n\n— Роберт Оппенгеймер, «Оппенгеймер»"

 ## 1.17 Musketeer
  CAREER_PROFILE_ISLAND_HOPPER:0 "§HСтрибун островами§!"
 CAREER_PROFILE_ISLAND_HOPPER_DESCRIPTION:0 "Установіть контроль над 10 стратегічними локаціями"
 CAREER_PROFILE_ISLAND_HOPPER_QUOTE:0 "«Хочете жити?! Забирайтеся з пляжу!»\n\n— Джон Базілоне, «Тихий океан»"
 CAREER_PROFILE_IM_THE_CAPTAIN_NOW:0 "§HТепер я тут капітан§!"
 CAREER_PROFILE_IM_THE_CAPTAIN_NOW_DESCRIPTION:0 "Граючи за другорядну державу, очольте фракцію"
 CAREER_PROFILE_IM_THE_CAPTAIN_NOW_QUOTE:0 "«Поглянь на мене. Тепер я тут капітан».\n\n— Мусе, «Капітан Філліпс»"
 CAREER_PROFILE_THREE_MUSKETEERS:0 "§HТри мушкетери§!"
 CAREER_PROFILE_THREE_MUSKETEERS_DESCRIPTION:0 "Створіть три театри воєнних дій фракції, керовані вашими офіцерами"
 CAREER_PROFILE_THREE_MUSKETEERS_QUOTE:0 "«Один за всіх, і всі за одного: разом ми встоїмо, поодинці — впадемо».\n\n— Александр Дюма"
 CAREER_PROFILE_THE_MORE_THE_MERRIER:0 "§HЩо більше, то краще§!"
 CAREER_PROFILE_THE_MORE_THE_MERRIER_DESCRIPTION:0 "Отримайте 30% бонус до спільного дослідження у фракції"
 CAREER_PROFILE_THE_MORE_THE_MERRIER_QUOTE:0 "«Немає людини, що була б як острів, сама по собі; кожна людина — це частка материка, частина суходолу».\n\n— Джон Донн"

 ## 1.19 OPERATION POSTERN
 CAREER_PROFILE_IM_HERE_TO_RESCUE_YOU: "§HЯ тут, щоб урятувати вас!§!"
 CAREER_PROFILE_IM_HERE_TO_RESCUE_YOU_DESCRIPTION: "Успішно використайте рейд, щоб урятувати свого полоненого командира"
 CAREER_PROFILE_IM_HERE_TO_RESCUE_YOU_QUOTE: "«Вибачте, що ми запізнилися на кілька хвилин».\n\n— Лорд Ловат"
 CAREER_PROFILE_DEJA_VU: "§HДежавю§!"
 CAREER_PROFILE_DEJA_VU_DESCRIPTION: "Успішно використайте шпигунську операцію, щоб урятувати свого полоненого командира"
 CAREER_PROFILE_DEJA_VU_QUOTE: "«Я знову підняв питання [про порятунок]. Цього разу це спонукало до дій».\n\n— Майор Лепхем"
 CAREER_PROFILE_THE_MORE_THINGS_CHANGES: "§HЩо більше все змінюється, то більше все залишається як було§!"
 CAREER_PROFILE_THE_MORE_THINGS_CHANGES_DESCRIPTION: "Повністю опануйте 2 субдоктрини військ спеціального призначення"
 CAREER_PROFILE_THE_MORE_THINGS_CHANGES_QUOTE: "«Ми були розхідним матеріалом. Ми були просто бонусом, от і все».\n\n— Генерал-майор Колін Габбінс"
 CAREER_PROFILE_FULLY_DECKED_OUT: "§HПовний фарш§!"
 CAREER_PROFILE_FULLY_DECKED_OUT_DESCRIPTION: "Спроєктуйте та розгорніть дивізію, яка має 5 дивізійних рот забезпечення та 5 полкових рот забезпечення"
 CAREER_PROFILE_FULLY_DECKED_OUT_QUOTE: "«Якщо сумніваєшся — атакуй»\n\n— Джордж Паттон"

### ЦИТАТИ ###
CAREER_PROFILE_BACKUP_QUOTE_31: "«...багато з нас думали, що ніколи не чули більш привітний звук, ніж глибокий рев і гуркіт, що почався в нас позаду».\n\n(Фріц Крайслер)"
CAREER_PROFILE_BACKUP_QUOTE_32: "«Закон! Яке діло мені до закону? Хіба ж у мене немає влади?»\n\n(Корнеліус Вандербілт)"

