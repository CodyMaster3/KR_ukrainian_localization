 continuous_naval_production: "Військово-морське виробництво"
 continuous_naval_production_desc: "Зосередивши ресурси на наших верфях і звільнивши кваліфікованих суднобудівників від військової служби, ми можемо значно скоротити час виробництва кораблів."
 continuous_air_production: "Авіаційне виробництво"
 continuous_air_production_desc: "Ми можемо реорганізувати нашу авіаційну промисловість, щоб усунути марнотратство та оптимізувати виробництво."
 continuous_non_factory_construct: "Будівельна інженерія"
 continuous_non_factory_construct_desc: "У нашій будівельній галузі все ще багато невикористаних резервів. Зосередивши на ній увагу, ми зможемо значно прискорити будівництво. На жаль, виробництво верстатів виявилося головним вузьким місцем у розширенні нашої важкої промисловості, тому ці заходи на неї не вплинуть."
 continuous_reduce_training_time: "Підготовка армії"
 continuous_reduce_training_time_desc: "Створивши спеціалізовані підрозділи підвищення кваліфікації всередині кожної дивізії, ми зможемо відправляти на фронт навіть ті з них, які раніше затримувалися б для завершення вишколу."
 continuous_suppression: "Придушення опору"
 continuous_suppression_desc: "Проникнувши в головні групи опору на окупованій території та схиливши їхніх ватажків на свій бік, ми зможемо суттєво зменшити шкоду, яку вони здатні заподіяти."
 continuous_repair: "Ремонт і відбудова"
 continuous_repair_desc: "Ми сформуємо спеціалізовані ремонтні бригади з робітників заводів і будівельників та централізовано керуватимемо їхнім розгортанням для покращення відновлення пошкодженої інфраструктури."
 continuous_tech_share: "Обмін технологіями"
 continuous_tech_share_desc: "Ми заохочуватимемо наші дослідні інститути та університети виходити на зв'язок із колегами з країн-союзниць. Це дасть нам бонус до спільного дослідження."
