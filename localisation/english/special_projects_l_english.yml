 sp_rockets_experimental_rockets: "Експериментальні ракети"
 sp_rockets_experimental_rockets_desc: "$experimental_rockets_desc$"
 sp_rockets_flying_bomb: "Летюча бомба"
 sp_rockets_flying_bomb_desc: "Безпілотний літальний апарат із ракетним двигуном, що несе значний бойовий заряд, зможе посіяти страх у серцях наших ворогів і підірвати їхній моральний дух."
 sp_rockets_ballistic_missile: "Балістична ракета"
 sp_rockets_ballistic_missile_desc: "Керована балістична ракета, здатна доставити боєголовку на величезну дальність із безпрецедентною швидкістю та точністю."

 sp_rockets_medium_range_ballistic_missile: "БРСД"
 sp_rockets_medium_range_ballistic_missile_desc: "Балістичні ракети середньої дальності дозволять нам доставляти боєголовку через увесь континент із вражаючою точністю та нищівною силою."

 sp_rockets_long_range_ballistic_missile: "МБР"
 ISR_sp_rockets_long_range_ballistic_missile: "Проєкт «Jericho III»"
 RAJ_sp_rockets_long_range_ballistic_missile: "Проєкт «Agni-V»"
 USA_sp_rockets_long_range_ballistic_missile: "Проєкт «Minuteman»"
 SOV_sp_rockets_long_range_ballistic_missile: "Проєкт «Р-16»"
 PRC_sp_rockets_long_range_ballistic_missile: "Проєкт «Dong Feng 31»"
 sp_rockets_long_range_ballistic_missile_desc: "Міжконтинентальна балістична ракета — ймовірно, найбільша з усіх, які нам коли-небудь доведеться створити, здатна доставити боєголовку з високою точністю практично в будь-яку точку земної кулі."

 sp_rockets_ground_to_air_missile: "Ракети класу «земля–повітря»"
 sp_rockets_ground_to_air_missile_desc: "Велика зенітна ракета з ракетним двигуном, здатна збити бомбардувальник одним прямим влучанням. Це безумовно визначить майбутнє протиповітряної оборони."

 sp_rocket_interceptor: "Ракетний перехоплювач"
 sp_rocket_interceptor_desc: "Поєднавши міць ракетного двигуна з маневреністю компактного планера, ми створимо неперевершений літак-перехоплювач."


