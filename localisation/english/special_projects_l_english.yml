 sp_land_reward_stronghold_network_leadership_approach: "Підхід до керівництва"
 sp_land_reward_stronghold_network_leadership_approach_desc: "У міру просування проєкту провідний науковець [Character.GetName] має вирішити, наскільки безпосередньо [Character.GetSheHe] братиме участь у щоденних процесах. [Character.GetSheHeCap] може керувати будівництвом особисто на місці, забезпечуючи точність виконання, або залишитися в кабінеті, зосередившись на стратегії та плануванні."
 sp_land_reward_option_stronghold_network_leadership_approach_oversee_work_personally: "Керувати роботами особисто"
 sp_land_reward_option_stronghold_network_leadership_approach_office_planning: "Кабінетне планування"
 sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_01: "Прорив в армуванні бетону"
 sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_01_desc: "Один із молодших інженерів відкрив новий метод армування, який можна застосувати до стандартних фортифікацій. Його документування зараз може дати нашим ученим та інженерам перевагу в майбутніх дослідженнях."
 sp_land_reward_option_stronghold_network_breakthrough_in_concrete_reinforcement_01_apply_and_document_discovery: "Застосувати та задокументувати відкриття"
 sp_land_reward_option_stronghold_network_breakthrough_in_concrete_reinforcement_01_use_in_current_project: "Використати в поточному проєкті"
 sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_02: "$sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_01$"
 sp_land_reward_stronghold_network_breakthrough_in_concrete_reinforcement_02_desc: "Новий метод армування, відкритий одним із молодших інженерів, було передано зовнішній дослідницькій групі для подальшої оцінки. Поки результати ще перевіряються, техніку вже можна застосувати в поточному проєкті, якщо це визнають за доцільне."
 sp_land_reward_option_stronghold_network_collapse_01: "Обвал під час прокладання тунелю"
 sp_land_reward_option_stronghold_network_collapse_01_desc: "Тунель під одним із головних бункерів несподівано обвалився, заблокувавши під завалами кількох робітників і провідного науковця на ім'я [Character.GetName], що керував роботами на місці. Необхідно вжити термінових заходів для порятунку людей, однак інцидент уже призвів до затримки робіт."
 sp_land_reward_option_stronghold_network_collapse_01_prioritize_scientist: "Врятувати насамперед провідного науковця"
 sp_land_reward_option_stronghold_network_collapse_01_prioritize_safety: "Пріоритет безпеці робітників"
 sp_land_reward_option_stronghold_network_collapse_01_continue_without_delay: "Продовжувати без зволікань"
 sp_land_reward_option_stronghold_network_collapse_02: "$sp_land_reward_option_stronghold_network_collapse_01$"
 sp_land_reward_option_stronghold_network_collapse_02_desc: "Тунель під одним із головних бункерів несподівано обвалився, заблокувавши кількох робітників і зупинивши будівництво. Необхідно вжити термінових заходів, щоб владнати ситуацію та безпечно дістати людей із пастки, однак інцидент уже призвів до затримки робіт."

