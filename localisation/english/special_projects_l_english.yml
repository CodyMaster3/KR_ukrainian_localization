 sp_nuclear_minor_progress_generic_reward_desc: "Наші вчені зробили справді значущі відкриття під час роботи над останнім прототипом. Їхні знахідки суттєво розширили наші знання та прискорили дослідження в цій галузі."
 sp_nuclear_generic_electronics_tech_reward: "Технологічні інновації"
 sp_nuclear_generic_electronics_tech_reward_desc: "Під час останнього етапу роботи над проєктом було здобуто важливий досвід. Сподіваємося, ми зможемо знайти йому практичне застосування, що дозволить прискорити дослідження в суміжних галузях."
 sp_nuclear_generic_reward_option_electronics_tech_bonus_name: "Передові дослідження електроніки"
 sp_nuclear_war_support_generic_reward: "Громадська підтримка"
 sp_nuclear_war_support_generic_reward_desc: "Успішне випробування та його ретельно контрольоване висвітлення в пресі допомогли громадськості усвідомити, що ми наближаємося до створення надзброї, здатної розгромити будь-якого ворога."
 sp_nuclear_major_political_interference_generic_reward: "Серйозне політичне втручання"
 sp_nuclear_major_political_interference_generic_reward_desc: "Проєкт «[SpecialProject.GetName]» опинився під посиленим контролем і тиском із боку політичного керівництва, що спричиняє затримки й може призвести до змін у керівництві проєкту. Це обурило [Character.GetName]. Ми мусимо владнати ці політичні суперечки, аби не допустити зриву проєкту."
