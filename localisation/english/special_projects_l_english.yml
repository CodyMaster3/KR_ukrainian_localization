 sp_nuclear_reactor_tested_tech_bonus: "Отримано інформацію про ядерні випробування"
 sp_commercial_nuclear_reactor_concerns_reward: "Занепокоєння щодо ядерної безпеки"
 sp_commercial_nuclear_reactor_concerns_reward_desc: "[Character.GetName] висловлює занепокоєння через відсутність фільтрів у градирнях наших нових реакторів. [Character.GetSheHeCap] наполягає на встановленні фільтрів для запобігання витоку радіації з реактора в разі надзвичайної ситуації. Інженери ж стверджують, що це суттєво затримає проєкт."
