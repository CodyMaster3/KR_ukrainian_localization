 # Nuclear reactor
 sp_nuclear_design_choice_reward: "Конструкція реактора"
 sp_nuclear_design_choice_reward_desc: "Під час проєктування реактора нам необхідно обрати матеріал для сповільнювача. Це визначить конструкцію всього реактора. Ми можемо використати важку воду або графіт, і обидва варіанти мають свої плюси та мінуси..."
 sp_nuclear_design_choice_reward_graphite: "Очищений графіт є кращим сповільнювачем"
 sp_nuclear_design_choice_reward_heavy_water: "Важка вода обійдеться дешевше"
 sp_nuclear_major_breakthrough_reward: "Великий прорив у сфері ядерних реакцій"
 sp_nuclear_major_breakthrough_reward_desc: "Контрольований експеримент із частиною наявного в нас ядерного матеріалу підтвердив життєздатність обраної конструкції. Це дало новий поштовх проєкту з небувалим ентузіазмом."
 sp_nuclear_isotope_separation_choice_reward: "Підприємства з розділення ізотопів"
 sp_nuclear_isotope_separation_choice_reward_desc: "Аби забезпечити наші реактори ядерним паливом, необхідно визначитися з технологією відокремлення корисних ізотопів урану від решти. Існує низка пропозицій щодо спорудження комплексів розділення, проте головними претендентами є газодифузійний та центрифужний методи."
 sp_nuclear_isotope_separation_choice_reward_gaseous: "Газодифузійний метод є перевіреним часом."
 sp_nuclear_isotope_separation_choice_reward_centrifugal: "Центрифуги будуть ефективнішими в довгостроковій перспективі."

