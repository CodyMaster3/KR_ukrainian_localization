 sp_naval_torpedo_cruiser: "Торпедний крейсер"
 sp_naval_torpedo_cruiser_desc: "Ми можемо завдати значної шкоди найважливішим і найдорожчим кораблям наших ворогів, використовуючи торпедні крейсери відповідно до концепції минулого століття — «Молодої школи» (Jeune École)."
