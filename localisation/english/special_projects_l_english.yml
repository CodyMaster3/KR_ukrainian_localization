 sp_nuclear_bomb_espionage_threats_reward: "Загрози шпигунства"
 sp_nuclear_bomb_espionage_threats_reward_desc: "Офіцери безпеки наполягають на необхідності посилення режиму охорони на території проєкту «[SpecialProject.GetName]» та навколо всієї супутньої діяльності. Дослідники на чолі з [Character.GetName] стверджують, що свобода пересування та спілкування є життєво важливою для прогресу."
 sp_nuclear_bomb_espionage_threats_reward_no: "Не посилювати охорону"
 sp_nuclear_bomb_espionage_threats_reward_increase_security: "Посилити охорону"
 sp_nuclear_bomb_espionage_threats_reward_increase_security_tt: "Посилення безпеки знижує ризик викрадення інформації"
 sp_nuclear_bomb_breakthrough_plutonium_reward: "Прорив у виробництві плутонію"
 sp_nuclear_bomb_breakthrough_plutonium_reward_desc: "Наші вчені досягли значного прориву в технологіях виробництва плутонію, що підвищує ефективність виготовлення бомб. Сподіваємося, це прискорить загальні терміни розробки."
 sp_nuclear_bomb_accident_generic_reward: "Випадкова пожежа"
 sp_nuclear_bomb_accident_generic_reward_desc: "На одному зі складів комплексу спалахнула пожежа. Попереднє розслідування вказує на нещасний випадок. Але чи справді це було так?"
 sp_nuclear_bomb_design_choice_reward: "Проста чи складна конструкція бомби"
 sp_nuclear_bomb_design_choice_reward_desc: "Наші вчені розглядають дві схеми ядерної зброї, і щодо подальшого вибору розгорнулася дискусія. Перша схема — гарматного типу — значно простіша у створенні, але менш ефективно використовує ядерний матеріал. Друга — імплозивного типу — значно складніша в реалізації, проте теоретично набагато ощадливіша до ядерного матеріалу."
 sp_nuclear_bomb_design_choice_reward_gun_type: "Гарматний тип — надійніший вибір."
 sp_nuclear_bomb_design_choice_reward_implosion: "Імплозивний тип є досконалішим."

# Thermonuclear Bombs
 sp_thermonuclear_bomb_test_reward: "Пропозиція щодо випробування"
 sp_thermonuclear_bomb_test_reward_desc: "Щоб підтвердити теоретичні розрахунки термоядерної бомби, наші вчені просять дозволу на проведення пробного підриву. Для цього знадобиться використати готову атомну бомбу як детонатор ланцюгової реакції, однак це значно прискорить прогрес проєкту."
 sp_thermonuclear_bomb_test_reward_option_yes: "Провести випробування."
 sp_thermonuclear_bomb_test_reward_option_no: "Ми не можемо дозволити собі витрачати матеріали."
 sp_no_nukes_available_tt: "$sp_thermonuclear_bomb_test_reward_option_no$"

