# Nuclear Reactor
 sp_nuclear_reactor_radioactive_leak_stabilized_reward: "Радіоактивний витік — під контролем"
 sp_nuclear_reactor_radioactive_leak_stabilized_reward_desc: "На жаль, під час роботи з реактором стався серйозний інцидент. Завдяки швидкій реакції персоналу наслідки вдалося локалізувати, а команда змогла отримати цінні дані з цієї аварії."
 sp_nuclear_reactor_minor_explosion_reward: "Незначний вибух, без постраждалих"
 sp_nuclear_reactor_minor_explosion_reward_desc: "Під час роботи над черговим варіантом прототипу ядерного реактора трапився невеликий інцидент. Стався незначний вибух, який пошкодив частину лабораторії, проте викликану ним пожежу вдалося легко загасити. Після відновлення приміщення роботу можна буде продовжити за планом із мінімальною затримкою."
 sp_nuclear_reactor_tested_reward: "Перше успішне випробування ядерного реактора"
 sp_nuclear_reactor_tested_reward_desc: "Наш перший ядерний реактор успішно пройшов випробування, довівши можливість здійснення керованої ланцюгової реакції поділу ядер. Цей прорив відкриває нову еру у виробництві енергії та, потенційно, набагато більше."
 sp_nuclear_reactor_tested_reward_public: "Публічно відсвяткувати досягнення"
 nuclear_reactor_tested_reward_classify: "Поки що зберегти інформацію в таємниці"
