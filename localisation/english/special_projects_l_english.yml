 ###### TRAITS ########

 scientist_trait_genius: "Геніальність"
 scientist_trait_genius_desc: "Провидець, чий розум розсуває межі науки й техніки завдяки неперевершеним інноваціям. Такий талант народжується лише раз на покоління."
 scientist_trait_gifted_engineer: "Обдарований інженер"
 scientist_trait_gifted_engineer_desc: "Природжений інженер, майстер розв'язання складних технічних завдань у найрізноманітніших галузях."
 scientist_trait_brilliant_theorist: "Блискучий теоретик"
 scientist_trait_brilliant_theorist_desc: "Знавець абстрактних концепцій і теорій, здатний революціонізувати військову стратегію та наукові дослідження."
 scientist_trait_bright: "Кмітливість"
 scientist_trait_bright_desc: "Гостромислячий науковець, який швидко схоплює нові концепції та ефективно втілює їх у життя."
 scientist_trait_fast_learner: "Швидко навчається"
 scientist_trait_fast_learner_desc: "Швидко адаптується до нових викликів, опановує знання швидше за колег і досягає успіхів у різних наукових сферах."
 scientist_trait_resourceful: "Винахідливість"
 scientist_trait_resourceful_desc: "Завжди знаходить нестандартні рішення навіть за дефіциту ресурсів або в критичних ситуаціях."
 scientist_trait_schrodingers_trait: "Риса Шредінґера"
 scientist_trait_schrodingers_trait_tt: "$MODIFIER_SCIENTIST_XP_GAIN_FACTOR$: §G+10%§!\n$MODIFIER_SCIENTIST_XP_GAIN_FACTOR$: §R-10%§!"
 scientist_trait_schrodingers_trait_desc: "Поки спостерігач не відкриє коробку, хвильова функція цієї риси перебуває в суперпозиції станів «добре» і «погано»."

 scientist_trait_aircraft_specialist: "Спеціаліст із літаків"
 scientist_trait_aircraft_specialist_desc: "Фахівець з аеродинаміки та проєктування літаків, здатний створювати досконалі планери, двигуни та конструкції для здобуття панування в небі."
 scientist_trait_rocketry_specialist: "Спеціаліст із ракет"
 scientist_trait_rocketry_specialist_desc: "Фахівець із ракетних технологій, що зосереджується на принципах тяги в програмах балістичних і керованих ракет."
 scientist_trait_electronics_specialist: "Спеціаліст із електроніки"
 scientist_trait_electronics_specialist_desc: "Спеціалізується на системах зв'язку, радіолокації та обчислювальній техніці, які є критично важливими для сучасної війни."
 scientist_trait_helicopter_expert: "Експерт із гелікоптерів"
 scientist_trait_helicopter_expert_desc: "Піонер у галузі гвинтокрилої авіації, що спеціалізується на механіці вертикального польоту, несучих гвинтах та ранніх моделях гелікоптерів."
 scientist_trait_jet_expert: "Експерт із реактивних технологій"
 scientist_trait_jet_expert_desc: "Авторитет у сфері реактивного руху, який просуває дослідження ранніх реактивних двигунів та їхнє застосування у військовій авіації."
 scientist_trait_bombs_expert: "Експерт із бомб"
 scientist_trait_bombs_expert_desc: "Майстер у створенні вибухових пристроїв та високоточних бомб, які можна використовувати в нових передових стратегіях повітряного бомбардування."
 scientist_trait_guidance_systems_expert: "Експерт із систем наведення"
 scientist_trait_guidance_systems_expert_desc: "Експерт у розробці перших систем наведення з досвідом покращення систем керування для безпілотних далекобійних засобів ураження."
 scientist_trait_armored_specialist: "Спеціаліст із бронетехніки"
 scientist_trait_armored_specialist_desc: "Досвідчений інженер, що спеціалізується на проєктуванні та вдосконаленні танків та іншої броньованої техніки."
 scientist_trait_artillery_specialist: "Спеціаліст із артилерії"
 scientist_trait_artillery_specialist_desc: "Фахівець з артилерійських систем із досвідом нарощування далекобійної вогневої потужності та великокаліберних гармат."
 scientist_trait_submarine_specialist: "Спеціаліст із підводних човнів"
 scientist_trait_submarine_specialist_desc: "Спеціаліст із ведення підводної війни, зосереджений на розробці нових технологій підводних човнів для посилення їхньої ролі в прихованих морських операціях."
 scientist_trait_surface_ship_specialist: "Спеціаліст із надводних кораблів"
 scientist_trait_surface_ship_specialist_desc: "Спеціалізується на проєктуванні, розробці та розгортанні великих надводних військових кораблів, а також на дослідженні нових технологій для їхнього оснащення."
 scientist_trait_nuclear_specialist: "Спеціаліст із ядерних технологій"
 scientist_trait_nuclear_specialist_desc: "Фізик на передовій атомних досліджень, глибоко занурений у вивчення поділу ядер і ланцюгових реакцій."
 scientist_trait_nuclear_warfare_expert: "Експерт із ядерної зброї"
 scientist_trait_nuclear_warfare_expert_desc: "Експерт із практичного застосування ядерної фізики у створенні зброї, що спеціалізується на теорії конструювання атомних бомб."
 scientist_trait_nuclear_power_expert: "Експерт із ядерної енергетики"
 scientist_trait_nuclear_power_expert_desc: "Провідний фахівець з ядерної фізики, досвідчений у питаннях поділу ядра з акцентом на виробництво електроенергії."

