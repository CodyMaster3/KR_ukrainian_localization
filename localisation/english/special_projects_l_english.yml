##########################
 sp_land_multi_charge_large_caliber_gun: "Багатозарядна великокаліберна гармата"
 sp_land_multi_charge_large_caliber_gun_desc: "Завдяки багатозарядній системі метання та великому калібру ця зброя здатна завдавати нищівних бомбардувань на величезні відстані."
 sp_land_reward_multi_charge_large_caliber_gun_test_failure: "Катастрофічний вибух"
 sp_land_reward_multi_charge_large_caliber_gun_successful_test_firing: "Успішні вогневі випробування"
 sp_land_reward_multi_charge_large_caliber_gun_breakthrough_in_propulsion_technology: "Прорив у технологіях метання"
 multi_charge_large_caliber_gun_small_size: "Малогабаритна багатозарядна гармата"
 sp_multi_charge_large_caliber_gun_small_size_ns: "$multi_charge_large_caliber_gun_small_size$" #Hidden NS: no need for desc

 sp_land_super_heavy_railway_gun: "Надважка залізнична гармата"
 sp_land_super_heavy_railway_gun_desc: "Колосальна зброя неперевершеної потужності та точності, що слугуватиме свідченням військової переваги будь-якої країни, здатної її розгорнути."
 sp_land_stronghold_network: "Мережа укріплень"
 sp_land_stronghold_network_desc: "Комплексна мережа потужно укріплених бункерів та опорних пунктів, збудована для протистояння інтенсивним штурмам і захисту критично важливих стратегічних об'єктів від ворожих вторгнень."
 sp_land_flamethrower_tank: "Вогнеметний танк"
 sp_land_flamethrower_tank_desc: "Броньована машина, оснащена нищівною вогневою міццю ближнього бою, призначена для виверження потоків полум'я на ворожі позиції."
 sp_land_military_engineering_vehicles: "Військова інженерна техніка"
 sp_land_military_engineering_vehicles_desc: "Спеціалізована техніка для підвищення мобільності на полі бою, зведення фортифікацій і розчищення перешкод у бойових умовах."
 sp_land_super_heavy_howitzer: "Надважка гаубиця"
 sp_land_super_heavy_howitzer_desc: "Грізна артилерійська система великого калібру, здатна сіяти хаос у ворожій обороні з безпрецедентною руйнівною силою."
 sp_land_self_propelled_super_heavy_howitzer: "Самохідна надважка гаубиця"
 IRQ_sp_land_self_propelled_super_heavy_howitzer: "Проєкт «Аль-Фао»"
 SAF_sp_land_self_propelled_super_heavy_howitzer: "G6 Rhino"
 SOV_sp_land_self_propelled_super_heavy_howitzer: "2А3 «Конденсатор-2П»"
 sp_land_self_propelled_super_heavy_howitzer_desc: "Самохідна масивна артилерійська система з кращою маневреністю на полі бою, ніж її буксирований аналог, що водночас має ще більший калібр."
 sp_land_land_cruiser: "Сухопутний крейсер"
 sp_land_land_cruiser_desc: "Масивний броньований бегемот, створений для домінування на полі бою. Завдяки неперевершеним розмірам і вогневій потужності ця машина уособлює вершину бронетанкової війни."
 sp_air_radar: "Радар"
 sp_air_radar_desc: "Використовуючи імпульсні радіохвилі та фіксуючи їхнє відбиття, ми зможемо відстежувати пересування ворога на суші, в повітрі та на морі."
 sp_air_centimetric_radar: "Сантиметровий радар"
 sp_air_centimetric_radar_desc: "Розробка сантиметрового радара дозволить виявляти значно менші цілі та використовувати набагато менші антени."

 sp_land_reward_land_cruiser_overheating: "Перегрів під час випробувань"
 sp_land_reward_land_cruiser_chassis: "Деформація шасі від навантаження"
 sp_land_reward_land_cruiser_chassis_desc: "Під час випробувань на міцність з'ясувалося, що шасі проєкту [SpecialProject.GetName] не витримує величезної ваги, що призводить до деформації конструкції. Думки команди інженерів розділилися: одні пропонують додати додаткове підсилення, що ще більше збільшить вагу машини, інші — використати легші матеріали, що може знизити міцність."
 sp_land_reward_option_land_cruiser_chassis_redesign: "Повністю перепроєктувати шасі"
 sp_land_reward_option_land_cruiser_chassis_redesign_bonus_name: "Перепроєктоване шасі"
 sp_land_reward_option_land_cruiser_chassis_reinforce: "Підсилити шасі"
 sp_land_reward_option_land_cruiser_chassis_reinforce_bonus_name: "Підсилене шасі"
 sp_land_reward_option_land_cruiser_chassis_lighter_materials: "Використати легші матеріали"
 sp_land_reward_option_land_cruiser_chassis_lighter_materials_bonus_name: "Легші матеріали для шасі"
 sp_land_reward_land_cruiser_engine: "Недостатня потужність двигуна"
 sp_land_reward_land_cruiser_engine_desc: "Перші випробування показали, що масивний корпус прототипу перевантажує наявний двигун, через що [SpecialProject.GetName] стає неповоротким і малорухливим. Команда пропонує два варіанти: розробити новий, потужніший двигун або спробувати модифікувати поточний для збільшення віддачі, ризикуючи його виходом з ладу."
 sp_land_reward_option_land_cruiser_engine_leave: "Залишити як є"
 sp_land_reward_option_land_cruiser_engine_modify: "Модифікувати поточний двигун"
 sp_land_reward_option_land_cruiser_engine_modify_bonus_name: "Покращений двигун"
 sp_land_reward_option_land_cruiser_engine_new: "Розробити новий двигун"
 sp_land_reward_option_land_cruiser_engine_new_bonus_name: "Перепроєктований двигун"
 sp_land_reward_land_cruiser_turret: "Складний баштовий механізм"
 sp_land_reward_land_cruiser_turret_desc: "Величезна багатобаштова конструкція викликає серйозні проблеми з центруванням і прицілюванням, сповільнюючи інтеграцію озброєння. Інженерна група рекомендує спростити компонування башт для підвищення надійності, але це зменшить заплановану вогневу міць проєкту [SpecialProject.GetName]."
 sp_land_reward_option_land_cruiser_turret_original: "Зберегти початковий проєкт"
 sp_land_reward_option_land_cruiser_turret_simplify: "Спростити конструкцію башт"
 sp_land_reward_option_land_cruiser_turret_simplify_bonus_name: "Спрощена конструкція башт"
 sp_land_reward_option_land_cruiser_turret_redesign: "Перепроєктувати механізм башт"
 sp_land_reward_option_land_cruiser_turret_redesign_bonus_name: "Перепроєктований механізм башт"
 sp_land_reward_land_cruiser_track: "Відмова гусеничної системи"
 sp_land_reward_land_cruiser_track_desc: "Вага проєкту [SpecialProject.GetName] виявилася завеликою для гусеничної системи, що призводить до постійних поломок під час випробувань. Є два варіанти: підсилити гусениці, що потребуватиме значного доопрацювання конструкції, або зменшити бронювання машини для зниження навантаження."
 sp_land_reward_option_land_cruiser_track_current: "Продовжити з поточними гусеницями"
 sp_land_reward_option_land_cruiser_track_reduce_armor: "Зменшити бронелисти"
 sp_land_reward_option_land_cruiser_track_reduce_armor_bonus_name: "Зменшене бронювання"
 sp_land_reward_option_land_cruiser_track_reinforce_track: "Підсилити гусеничну систему"
 sp_land_reward_option_land_cruiser_track_reinforce_track_bonus_name: "Підсилена гусенична система"
 sp_land_reward_land_cruiser_communication: "Проблема із системою зв'язку"
 sp_land_reward_land_cruiser_communication_desc: "Величезні розміри проєкту [SpecialProject.GetName] потребують складної системи внутрішнього зв'язку для координації екіпажу. Поточна система виявилася неефективною: накази затримуються або втрачаються. Команда пропонує змінити внутрішнє планування для поліпшення передачі наказів або встановити передовішу, але ще невипробувану систему."
 sp_land_reward_option_land_cruiser_communication_current: "Залишити поточну систему"
 sp_land_reward_option_land_cruiser_communication_new: "Встановити нову вдосконалену систему"
 sp_land_reward_option_land_cruiser_communication_new_bonus_name: "Передова система зв'язку"
 sp_land_reward_option_land_cruiser_communication_redesign: "Змінити внутрішнє планування"
 sp_land_reward_option_land_cruiser_communication_redesign_bonus_name: "Перепроєктована система зв'язку"
 sp_land_reward_land_cruiser_assembly: "Високоточне збирання"
 sp_land_reward_land_cruiser_assembly_desc: "Під час етапу збирання інженерам удалося вдосконалити техніку точного підгону масивних компонентів проєкту [SpecialProject.GetName], як-от погона башти та бронелистів корпусу, що значно знизило ризик появи тріщин від механічного напруження. Ми можемо впровадити цю інноваційну техніку в усьому проєкті для підвищення загальної надійності конструкції. Як саме її застосувати?"
 sp_land_reward_option_land_cruiser_assembly_all: "На всіх етапах збирання"
 sp_land_reward_option_land_cruiser_assembly_bonus_name: "Високоточне збирання"
 sp_land_reward_option_land_cruiser_assembly_key: "Лише для ключових компонентів"
 sp_land_reward_land_cruiser_suspension: "Гідропневматична підвіска"
 sp_land_reward_land_cruiser_suspension_desc: "Команда вдосконалила передову гідропневматичну підвіску, яка компенсує колосальну вагу проєкту [SpecialProject.GetName], забезпечуючи стабільність і знижуючи навантаження на гусениці навіть під час руху пересіченою місцевістю. [Character.GetName] упевнений, що цю підвіску можна надійно інтегрувати для досягнення кращих бойових характеристик."
 sp_land_reward_option_land_cruiser_suspension_full: "Повна гідропневматична підвіска"
 sp_land_reward_option_land_cruiser_suspension_rear: "Обмежити лише задніми вузлами"
 sp_land_reward_land_cruiser_ammunition: "Рішення для зберігання боєприпасів"
 sp_land_reward_land_cruiser_ammunition_desc: "Під час випробувань виникли побоювання щодо безпечного зберігання та транспортування великокаліберних боєприпасів для [SpecialProject.GetName], оскільки стандартні стелажі не могли надійно витримати вагу фугасних снарядів. Було запропоновано нову секційну систему зберігання з посиленими перегородками та гідравлічними досилачами, що забезпечує безпечніше поводження та швидше заряджання снарядів у бойових умовах."
 sp_land_reward_option_land_cruiser_ammunition_current: "Зберегти поточну систему"
 sp_land_reward_option_land_cruiser_ammunition_simplified: "Використати спрощену версію"
 sp_land_reward_option_land_cruiser_ammunition_new: "Прийняти нову систему зберігання"

 sp_land_reward_super_heavy_howitzer_focus_preference: "Конструкторський пріоритет"
 sp_land_reward_super_heavy_howitzer_focus_preference_desc: "У міру розробки необхідно ухвалити важливе рішення: ми можемо надати перевагу швидкому виробництву та гарматам меншого калібру або ж вкластися у більші й важчі гармати, жертвуючи темпами виробництва заради безпрецедентної вогневої потужності та нищівного удару."
 sp_land_reward_option_super_heavy_howitzer_focus_preference_balance: "Зберегти баланс"
 sp_land_reward_option_super_heavy_howitzer_focus_preference_firepower: "Зосередитися на вогневій міці"
 sp_land_reward_option_super_heavy_howitzer_focus_preference_production: "Зосередитися на швидкому виробництві"
