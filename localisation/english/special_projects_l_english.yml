 sp_naval_torpedo_cruiser_free_design: "Торпедний крейсер"

 sp_naval_fleet_submarine: "Ескадрений підводний човен"
 sp_naval_fleet_submarine_desc: "Підводний човен великої дальності, здатний супроводжувати флот і позбавлений вад, притаманних конструкції попередніх крейсерських підводних човнів."
 sp_naval_fleet_submarine_free_design: "Ескадрений підводний човен"

 sp_naval_super_heavy_battleship: "Надважкий лінкор"
 sp_naval_super_heavy_battleship_desc: "Гонка військово-морських озброєнь останніми роками могла стати різноманітнішою, однак важко заперечити справжню велич лінкора та потенціал для побудови ще грандіозніших левіафанів."
 sp_naval_super_heavy_battleship_tt: "Додати технологію: §YНадважкий корпус§!"
 sp_naval_super_heavy_battleship_free_design: "Надважкий лінкор"

 sp_naval_nuclear_missile_submarine: "Підводний човен із ядерними ракетами"
 sp_naval_super_heavy_battleship_desc: "Гонка військово-морських озброєнь останніми роками могла стати різноманітнішою, однак важко заперечити справжню велич лінкора та потенціал для побудови ще грандіозніших левіафанів."

 sp_naval_modern_battleship: "Сучасний лінкор"
 sp_naval_modern_battleship_desc: "Інші можуть вважати, що майбутнє морського бою за авіаносцями, але ми тут, щоб переконати їх у зворотному."
 sp_naval_modern_battleship_free_design: "Сучасний лінкор"

 sp_naval_midget_submarine: "Карликовий підводний човен"
 sp_naval_midget_submarine_desc: "У наших військово-морських силах є ніша для легких, дешевих та універсальних підводних човнів, які можна використовувати для будь-яких завдань — від диверсій у портах до нападів на конвої."
 sp_naval_midget_submarine_free_design: "Карликовий підводний човен"

 sp_naval_nuclear_torpedo: "Ядерна торпеда"
 sp_naval_nuclear_torpedo_desc: "З появою тактичних боєголовок малої потужності далекобійні торпеди з такими зарядами теоретично можуть запускатися з будь-якого звичайного підводного човна."

 sp_naval_modern_carrier: "Сучасний авіаносець"
 sp_naval_modern_carrier_desc: "Завдяки останнім досягненням у кораблебудуванні ми можемо створити нове покоління авіаносців зі значно більшими розмірами та розширеними можливостями."
 sp_naval_modern_carrier_free_design: "Сучасний авіаносець"

 sp_naval_anechoic_tiles: "Протигідролокаційне покриття"
 sp_naval_anechoic_tiles_desc: "Спеціальне гумове плиткове покриття для підводних човнів, що містить дрібні порожнини, значно знижує ризик виявлення ворожими сонарами."
 sp_naval_anechoic_tiles_non_mtg_tt: "Відкриває рівні поліпшення непомітності підводних човнів 6 і 7"

 sp_naval_aip_engine: "Повітрянонезалежна силова установка"
 sp_naval_aip_engine_desc: "Нова рушійна система, яка позбавляє підводні човни потреби спливати на поверхню для перезаряджання акумуляторів і поповнення запасів кисню."
 sp_naval_aip_engine_non_mtg_tt: "Відкриває рівні поліпшення двигуна підводних човнів 6 і 7"

 sp_naval_ice_carrier: "Крижаний авіаносець"
 sp_naval_ice_carrier_desc: "Щоб утвердити панування в повітрі над безкрайніми океанами, нам потрібні авіаносці, здатні розміщувати й запускати звичайні далекомагістральні літаки, а не лише палубну авіацію."
 sp_naval_ice_carrier_free_design: "Крижаний авіаносець"

 sp_naval_underway_replenishment: "Поповнення запасів на ходу"
 sp_naval_underway_replenishment_desc: "Постачання флотів далеко від рідних баз завжди було обмежувальним фактором. Оскільки наші кораблі діють на екстремальних відстанях, ми маємо розробити нові методи поповнення припасів."

 sp_naval_proximity_fuze: "Неконтактний підривник"
 sp_naval_proximity_fuze_desc: "Завдяки покращеним і надійнішим радіотехнологіям ми можемо розробити підривники нового типу, які детонують просто в безпосередній близькості від цілі, завдаючи їй шкоди."

 sp_naval_support_ships: "Support Ships"
 sp_naval_support_ships_desc: "Support Ships will help maintain our superiority at sea, by keeping our fleets afloat and effective even during prolonged deployments."

 sp_naval_escort_carrier: "Escort Carrier"
 sp_naval_escort_carrier_desc: "To safeguard our supply lines, we want to develop smaller, more economical carriers, providing cost-effective air cover and anti-submarine capabilities across oceans."
 sp_naval_escort_carrier_free_design: "Escort Carrier"

 sp_naval_submarine_carrier: "Submarine Carrier"
 sp_naval_submarine_carrier_desc: "We are looking to develop a new kind of submarine, capable of storing and launching multiple planes, to carry out missions beyond aerial reconnaissance."
 sp_naval_submarine_carrier_free_design: "Submarine Carrier"

 sp_naval_armoured_cruiser: "Armoured Cruiser"
 sp_naval_armoured_cruiser_desc: "An Armoured Cruiser, or Panzerschiff, is a small capital ship filling the gap between the venerable battleship and more recent heavy cruiser designs. These are meant to be long-ranged and capable of independent action, especially surface raiding. They are popularly, but erroneously, known as Pocket Battleships because of their heavy armament despite their hull size."
 sp_naval_armoured_cruiser_free_design: "Armoured Cruiser"

#################################
  ## NAVAL PROTOTYPE REWARDS ###
#################################
 sp_naval_cruiser_submarine_unique_reward_a: "Рейдерський протокол"
 sp_naval_cruiser_submarine_unique_reward_a_desc: "Безсилля Лондонських морських договорів зробило будь-які реальні обмеження на палубне озброєння підводних човнів неважливими. Проте залишається питання: чи варто нам віддати перевагу показному озброєнню перед тактичною дальністю?"
 sp_naval_cruiser_submarine_preference_a: "Гнучкість операцій"
 sp_naval_cruiser_submarine_preference_b: "Озброєння"

 sp_naval_fleet_submarine_unique_reward_a: "Конструкторські принципи"
 sp_naval_fleet_submarine_unique_reward_a_desc: "Ми маємо знати, на чому зосередити зусилля під час проєктування нового типу далекохідних підводних човнів. Чи мають наші підводні човни бути безшумними й смертоносними мисливцями, чи ми прагнемо зробити їх надійнішими та стійкішими до загроз?"
 sp_naval_fleet_submarine_preference_a: "Атакувальний потенціал"
 sp_naval_fleet_submarine_preference_b: "Міцніша конструкція"

 sp_naval_nuclear_submarine_unique_reward_a: "Питання витрат"
 sp_naval_nuclear_submarine_unique_reward_a_desc: "Оскільки ми працюємо над абсолютно новим типом підводних човнів, зростає занепокоєння, що вартість будівництва судна зрештою виявиться завеликою. Як нам діяти далі з проєктом?"
 sp_naval_nuclear_submarine_preference_a: "Зекономити"
 sp_naval_nuclear_submarine_preference_b: "Поточні плани"
 sp_naval_nuclear_submarine_preference_c: "Найвища якість"

 sp_naval_rocket_launching_submarine_unique_reward_a: "Питання доставки корисного навантаження"
 sp_naval_rocket_launching_submarine_unique_reward_a_desc: "Нам потрібно відповісти на нагальне питання: який спосіб найкраще гарантуватиме, що випущені з підводних човнів ракети дістануться наших ворогів?"
 sp_naval_rocket_launching_submarine_preference_a: "Дальність"
 sp_naval_rocket_launching_submarine_preference_b: "Надійність"
 sp_naval_rocket_launching_submarine_preference_c: "Непомітність"

 sp_naval_nuclear_missile_submarine_unique_reward_a: "Уникнення переслідування"
 sp_naval_nuclear_missile_submarine_unique_reward_a_desc: "Якщо інформація про наш планований ядерний удар дійде до противників, вони розпочнуть масштабне полювання на наші атомні підводні ракетоносці. Аби сховатися від переслідувачів, ми мусимо..."
 sp_naval_nuclear_missile_submarine_preference_a: "Залягти на дно"
 sp_naval_nuclear_missile_submarine_preference_b: "Зберігати спокій"
 sp_naval_nuclear_missile_submarine_preference_c: "Витримати шторм"

 sp_naval_nuclear_torpedo_unique_reward_a: "Новий курс торпеди"
 sp_naval_nuclear_torpedo_unique_reward_a_desc: "Оскільки розробка ядерних торпед наближається до фінальної мети проєкту, ми маємо прагнути..."
 sp_naval_nuclear_torpedo_preference_a: "Потужні боєголовки"
 sp_naval_nuclear_torpedo_preference_b: "Безпечніші сховища"

 sp_naval_midget_submarine_unique_reward_a: "Вмістити більше"
 sp_naval_midget_submarine_unique_reward_a_desc: "Ми зрозуміли, що потенційно можемо спеціалізувати окремі вузли наших карликових підводних човнів, хоча це й вимагатиме певних компромісів."
 sp_naval_midget_submarine_preference_a: "Трохи непомітніші"
 sp_naval_midget_submarine_preference_b: "Трохи менш схильні до вибухів"
 sp_naval_midget_submarine_preference_c: "Трохи більша дальність"

 sp_naval_aip_engine_unique_reward_a: "Окремі покращення"
 sp_naval_aip_engine_unique_reward_a_desc: "Наші вчені, які працюють над цією технологією, поділилися результатами з колегами, що вдосконалюють традиційніші двигуни. Не варто завчасно тішити себе надіями, адже отримані покращення навряд чи будуть приголомшливими."
 sp_naval_aip_engine_preference_a: "Тихіші двигуни"
 sp_naval_aip_engine_preference_b: "Швидші двигуни"
 sp_naval_aip_engine_preference_c: "Економічніші двигуни"

 sp_naval_anechoic_tiles_unique_reward_a: "Новий досвід: конструкція корпусу підводного човна"
 sp_naval_anechoic_tiles_unique_reward_a_desc: "Під час розробки протигідролокаційного покриття ми з'ясували, що отримані знання можна застосувати у будівництві звичайних підводних човнів для посилення скритності або для деякого заощадження коштів зі збереженням поточного рівня помітності."
 sp_naval_anechoic_tiles_preference_a: "Агресивне патрулювання"
 sp_naval_anechoic_tiles_preference_b: "Зниження акустичної помітності"
 sp_naval_anechoic_tiles_preference_c: "Здешевлення корпусу"

 sp_naval_torpedo_cruiser_unique_reward_a: "Другий шанс: торпедний крейсер"
 sp_naval_torpedo_cruiser_unique_reward_a_desc: "З відродженням старої концепції торпедного крейсера ми маємо ухвалити важливе рішення щодо його ролі у флоті: чи варто зосередитися на їхній сильній стороні — торпедах, чи вирішити їхню головну проблему — боротьбу з есмінцями?"
 sp_naval_torpedo_cruiser_preference_a: "Сила: торпеди"
 sp_naval_torpedo_cruiser_preference_b: "Слабкість: есмінці"

 sp_naval_super_heavy_battleship_unique_reward_a: "Питання пріоритетів: напад"
 sp_naval_super_heavy_battleship_unique_reward_a_desc: "Проєктування нового класу лінкорів дає нам змогу зосередити зусилля на вдосконаленні здатності домінувати в морському бою. Що слід обрати пріоритетом?"
 sp_naval_super_heavy_battleship_preference_a_a: "Важкі гармати"
 sp_naval_super_heavy_battleship_preference_b_a: "Швидкість"
 sp_naval_super_heavy_battleship_preference_c_a: "Легкі гармати"
 sp_naval_super_heavy_battleship_unique_reward_b: "Питання пріоритетів: захист"
 sp_naval_super_heavy_battleship_unique_reward_b_desc: "Вищі військово-морські командири поставили перед нами нездійсненне завдання: зробити цей корабель практично невразливим. І хоча це неможливо, ми принаймні спробуємо наблизитися до цієї мети. Що цього разу стане нашим пріоритетом?"
 sp_naval_super_heavy_battleship_preference_a_b: "Посилені броня та корпус"
 sp_naval_super_heavy_battleship_preference_b_b: "Зенітна артилерія"
 sp_naval_super_heavy_battleship_preference_c_b: "Протиторпедний захист"

 sp_naval_modern_battleship_unique_reward_a: "Сучасний лінкор: надія"
 sp_naval_modern_battleship_unique_reward_a_desc: "Поки багато хто стверджує, що ера лінкорів минула, ми все ще віримо в них. Цей корабель має шанс стати нашою новою надією. На якому аспекті слід зосередитися, щоб утілити цю мрію в життя?"
 sp_naval_modern_battleship_preference_a_a: "Чиста вогнева міць"
 sp_naval_modern_battleship_preference_b_a: "Маневреність"
 sp_naval_modern_battleship_preference_c_a: "Точність"
 sp_naval_modern_battleship_unique_reward_b: "Сучасний лінкор завдає удару у відповідь!"
 sp_naval_modern_battleship_unique_reward_b_desc: "Щоб довести нашу правоту та втримати позиції, нам доведеться витримувати удари ворога. Що варто покращити, аби ми могли відповісти тим, хто наважиться стати на нашому шляху?"
 sp_naval_modern_battleship_preference_a_b: "Міцність конструкції"
 sp_naval_modern_battleship_preference_b_b: "Протиповітряна оборона"
 sp_naval_modern_battleship_preference_c_b: "Протиторпедний захист"

 sp_naval_modern_carrier_unique_reward_a: "Сучасний авіаносець: призначення"
 sp_naval_modern_carrier_unique_reward_a_desc: "З новим поколінням авіаносців ми можемо зосередитися на певних аспектах корабля, щоб краще відповідати нашим потребам. На чому саме слід сконцентрувати зусилля?"
 sp_naval_modern_carrier_preference_a_a: "Ситуаційна обізнаність"
 sp_naval_modern_carrier_preference_b_a: "Швидкість і всепогодність"
 sp_naval_modern_carrier_preference_c_a: "Стримування легких сил"
 sp_naval_modern_carrier_unique_reward_b: "Сучасний авіаносець: безпека"
 sp_naval_modern_carrier_unique_reward_b_desc: "Авіаносці є беззаперечними володарями морських битв, однак ми маємо забезпечити їм належний захист та безпеку. Що повинно стати нашою головною турботою?"
 sp_naval_modern_carrier_preference_a_b: "Ворожа артилерія"
 sp_naval_modern_carrier_preference_b_b: "Ворожа авіація"
 sp_naval_modern_carrier_preference_c_b: "Ворожі торпеди"

 sp_naval_ice_carrier_unique_reward_a: "Зміцнення крижаного авіаносця"
 sp_naval_ice_carrier_unique_reward_a_desc: "Вкладаючи величезну кількість часу в будівництво цього гігантського авіаносця, ми маємо бути впевнені, що забезпечуємо йому найкращий захист. Що становить найбільшу загрозу?"
 sp_naval_ice_carrier_preference_a: "Сили природи"
 sp_naval_ice_carrier_preference_b: "Ворожі сили"

 sp_naval_underway_replenishment_unique_reward_a: "Масштаби поповнення запасів"
 sp_naval_underway_replenishment_unique_reward_a_desc: "Поки ми працюємо над тим, щоб система поповнення запасів на ходу діяла максимально безперебійно, нам потрібно ухвалити ще одне рішення: чи хочемо ми змінити наші початкові розрахунки?"
 sp_naval_underway_replenishment_preference_a: "Більша дальність"
 sp_naval_underway_replenishment_preference_b: "Менше залучення конвоїв"
 sp_naval_underway_replenishment_preference_c: "Знайти баланс"

 sp_naval_proximity_fuzes_unique_reward_a: "Продуктивність чи ефективність"
 sp_naval_proximity_fuzes_unique_reward_a_desc: "Неконтактні підривники значно зменшують кількість снарядів, необхідних для ураження ворожої авіації. Готуючись застосувати їх у наших мобільних підрозділах протиповітряної оборони, ми можемо скоригувати обсяг постачання боєприпасів, зберігаючи очікуваний щоденний коефіцієнт влучань."
 sp_naval_proximity_fuzes_preference_a: "Скоригувати постачання боєприпасів"
 sp_naval_proximity_fuzes_preference_b: "Зберегти поточний обсяг боєприпасів"

 sp_naval_support_ships_unique_reward_a: "Auxiliary Ships - Support Focus"
 sp_naval_support_ships_unique_reward_a_desc: "While the value of support ships is not in dispute, we need to decide what their operational focus shall be: focused replenishment of a small number of ships, or generalised topping-up of the whole fleet's stores."
 sp_naval_support_ships_preference_a_a: "Needs of the few"
 sp_naval_support_ships_preference_b_a: "Find the balance"
 sp_naval_support_ships_preference_c_a: "Needs of the many"
 sp_naval_support_ships_unique_reward_b: "Auxiliary Ships - Repair Efforts"
 sp_naval_support_ships_unique_reward_b_desc: "The key question for our repair ship organisation: either a larger number of small repair crews, able to service a great number of ships slowly, or a smaller number of more lavishly equipped crews that can repair fewer ships more comprehensively."
 sp_naval_support_ships_preference_a_b: "Wider Coverage"
 sp_naval_support_ships_preference_b_b: "Find the balance"
 sp_naval_support_ships_preference_c_b: "Concentrated Efforts"

 sp_naval_submarine_carrier_unique_reward_a: "Improving Submersible Carriers"
 sp_naval_submarine_carrier_unique_reward_a_desc: "Our submarine carriers push the limits of naval engineering, and cannot be equally strong in every area. Shall we prioritise range, hull strength, or stealth?"
 sp_naval_submarine_carrier_preference_a: "Extended Range"
 sp_naval_submarine_carrier_preference_b: "Reinforced Structure"
 sp_naval_submarine_carrier_preference_c: "Reduced Visibility"

 sp_naval_escort_carrier_unique_reward_a: "Escort Design Drafts"
 sp_naval_escort_carrier_unique_reward_a_desc: "The escort carrier attempts to cram a lot of capability in to a quite small hull. We need to choose between an emphasis on range, durability, or speed."
 sp_naval_escort_carrier_preference_a_a: "Operational Range"
 sp_naval_escort_carrier_preference_b_a: "Stronger Hull"
 sp_naval_escort_carrier_preference_c_a: "Higher Speed"
