 sp_nuclear_reactor: "Ядерний реактор"
 sp_nuclear_reactor_desc: "Експерименти довели, що поділ атомів вивільняє колосальну кількість енергії, яку можна використати для виробництва електроенергії. Або ж як начинку для бомб..."
 sp_commercial_nuclear_reactor: "Комерційний ядерний реактор"
 sp_commercial_nuclear_reactor_desc: "Ядерні реактори добре підходять для створення матеріалів для бомб. Однак вироблена кількість енергії натомість може живити цивільну та військову промисловість."
 sp_nuclear_engines: "Ядерні двигуни"
 sp_nuclear_engines_desc: "Двигуни, здатні працювати вічно — без потреби в дозаправці. Саме це обіцяє атомна енергія. І наші інженери запевняють, що ми вкрай близькі до здійснення цієї обіцянки."
 sp_nuclear_bomb: "Проєкт бомби на основі поділу ядер"
 sp_nuclear_bomb_desc: "Бомба, яка використовує процес поділу ядер для вивільнення накопиченої енергії атома в одну апокаліптичну мить. Хто наважиться протистояти нам із такою зброєю в нашому арсеналі?"
 sp_nuclear_bomb_tt: "Ядерні реактори починають виробляти §Yядерні бомби§!."
 sp_thermo_nuclear_bomb: "Термоядерна бомба"
 sp_thermo_nuclear_bomb_desc: "Справді важко уявити щось руйнівніше за бомбу на основі поділу ядер, але завдяки термоядерному синтезу можна створити вибух, значно потужніший за все, що створювалося раніше."
 sp_thermo_nuclear_bomb_tt: "Ядерні реактори починають виробляти §Yтермоядерні бомби§!."
 sp_nuclear_warheads: "Ядерні боєголовки"
 sp_nuclear_warheads_desc: "Створивши компактну ядерну зброю, ми зможемо використовувати її як корисне навантаження для широкого спектра ракетних пускових систем, що дозволить нам завдавати ударів на величезні відстані."


