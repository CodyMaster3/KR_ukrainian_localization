 sp_rockets_flying_bomb_technical_breakthrough_in_pulsejet_design_reward: "Технічний прорив у розробці пульсуючого повітряно-реактивного двигуна"
 sp_rockets_flying_bomb_technical_breakthrough_in_pulsejet_design_reward_desc: "Наші інженери подолали значні труднощі в розробці пульсуючого повітряно-реактивного двигуна ракети, що має вирішальне значення для її швидкості та дальності польоту."
