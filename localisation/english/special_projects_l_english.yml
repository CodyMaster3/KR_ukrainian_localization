 sp_air_supersonic_jet: "Надзвуковий літак"
 sp_air_supersonic_jet_desc: "Досягнення в технології реактивних двигунів торують шлях літакам, здатним розвивати швидкість 1 Мах і долати звуковий бар'єр."

