 sp_nuclear_project_events_events.1.t: "Витік інформації"
 sp_nuclear_project_events.1.desc: "Цілком випадково нашим агентам у [FROM.GetNameDef] вдалося здобути інформацію про якийсь секретний проєкт. Працівник, залучений до розробки таємної зброї — атомної бомби, проговорився про свою роботу на невеликій вечірці, де був присутній і один із наших агентів."
 sp_nuclear_project_events_events.1.a: "Це може стати в пригоді"
