 sp_nuclear_bomb_theoretical_breakthrough_generic_reward: "Теоретичний прорив"
 sp_nuclear_bomb_theoretical_breakthrough_generic_reward_desc: "Під час роботи над останнім прототипом [Character.GetName] зміг вирішити складне теоретичне завдання. Це дозволило оптимізувати конструкцію бомби, значно спростивши її виробництво."

 sp_nuclear_bomb_critical_mass_generic_reward: "Невдалий експеримент із критичною масою"
 sp_nuclear_bomb_critical_mass_generic_reward_desc: "Під час експериментів із визначення критичної маси сталася критична аварія, що призвела до радіаційного опромінення та жертв серед ключових науковців."

