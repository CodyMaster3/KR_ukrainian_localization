 sp_rockets_flying_bomb_launch_ramp_innovations_reward_desc: "Наші інженери значно вдосконалили спеціалізовані пускові естакади, необхідні для розгортання ракет."
 sp_rockets_flying_bomb_launch_ramp_innovations_reward_option: "Гарні новини"

 sp_rockets_flying_bomb_mass_production_scaling_reward: "Масштабування масового виробництва"
 sp_rockets_flying_bomb_mass_production_scaling_reward_desc: "Нам вдалося впровадити виробничі покращення, які дозволять набагато швидше розгорнути повномасштабне серійне виробництво."
 #sp_rockets_flying_bomb_mass_production_scaling_reward_option: "Вкрай корисно"

 sp_rockets_flying_bomb_engine_optimization_breakthrough_reward: "Прорив в оптимізації двигуна"
 sp_rockets_flying_bomb_engine_optimization_breakthrough_reward_desc: "Нашим інженерам вдалося суттєво підвищити надійність і дальність роботи пульсуючого повітряно-реактивного двигуна, покращивши бойові можливості ракети."
 #sp_rockets_flying_bomb_engine_optimization_breakthrough_reward_option: "Хтось назве це удачею"

 sp_rockets_flying_bomb_technological_innovation_in_guidance_systems_reward: "Технологічні інновації у системах наведення"
 sp_rockets_flying_bomb_technological_innovation_in_guidance_systems_reward_desc: "Під час випробування чергового прототипу було суттєво покращено точність системи наведення та її стійкість до перешкод, що зміцнює нашу технологічну перевагу."
 #sp_rockets_flying_bomb_technological_innovation_in_guidance_systems_reward_option: "Ми наближаємося до нашої мети"

 sp_rockets_flying_bomb_test_flight_failures_reward: "Невдалі випробувальні польоти"
 sp_rockets_flying_bomb_test_flight_failures_reward_desc: "Перші випробувальні польоти завершилися невдачею через збої в системі наведення та дефекти конструкції. Наші вчені зробили важливі висновки, однак нам доведеться зробити крок назад і все переосмислити."
 #sp_rockets_flying_bomb_test_flight_failures_reward_option: "They say you learn the most from your failures"

 # Ground to Air
 sp_rockets_ground_control_improvements_reward: "Покращення наземного керування"
 sp_rockets_ground_control_improvements_reward_desc: "[Character.GetName] зміг вирішити низку нагальних проблем із відстеженням та керуванням ракетою з землі. Це значний крок до здатності вражати ворожі висотні літаки."

 sp_rockets_vertical_launch_reward: "Система вертикального пуску"
 sp_rockets_vertical_launch_reward_desc: "Після кількох невдалих спроб [Character.GetName] нарешті розв'язав проблеми, пов'язані з вертикальним запуском цих ракет. Нова система дозволить запускати ракети без збоїв та швидко набирати велику висоту."

 sp_rockets_high_speed_flight_control_reward: "Керування високошвидкісним польотом"
 sp_rockets_high_speed_flight_control_reward_desc: "Ми нарешті отримали дієву систему керування, здатну функціонувати на високих швидкостях та реагувати на зміну динаміки польоту. Ці знання неодмінно стануть у пригоді й в інших сферах."
 sp_rockets_high_speed_flight_control_bonus: "Керування високошвидкісним польотом"

 sp_rockets_warhead_detonation_mechanisms_reward: "Механізми підриву боєголовки"
 sp_rockets_warhead_detonation_mechanisms_reward_desc: "Важлива частина всієї розробки — змусити зброю здетонувати у потрібній точці. Схоже, [Character.GetName] вдалося знайти рішення, що дозволяє підривати її в найбільш вдалий момент."
 sp_surface_air_missile_warhead_detonation_bonus: "Ракета класу «земля–повітря»: покращений підрив боєголовки"
 #Ballistic missile

 sp_rocket_wind_tunnel_choice_reward: "Інженери просять аеродинамічну трубу"
 sp_rocket_wind_tunnel_choice_reward_desc: "Інженери проєкту балістичної ракети попросили збудувати надзвукову аеродинамічну трубу для завчасного випробування масштабних моделей своїх розробок. Це значно прискорить процес доопрацювання та заощадить ресурси в довгостроковій перспективі."
 sp_rocket_wind_tunnel_choice_reward_reject: "Ресурси потрібні в іншому місці."
 sp_rocket_wind_tunnel_choice_reward_agree: "Виділити ресурси."

 sp_rocket_glass_wool_choice_reward: "Утворення льоду під час входу в атмосферу"
 sp_rocket_glass_wool_choice_reward_desc: "Під час повернення ракети в щільні шари атмосфери навколо паливних баків, схоже, утворюється лід, що порушує роботу внутрішніх систем ракети. Попри цю невдачу, наші інженери запропонували обкласти баки скляною ватою, щоб запобігти подібному в майбутньому."
 sp_rocket_glass_wool_choice_reward_accept: "Прикро, але необхідно."

 sp_rocket_guidance_system_choice_reward: "Система наведення"
 sp_rocket_guidance_system_choice_reward_desc: "Наші інженери сперечаються щодо системи наведення ракети. Одні хочуть зупинитися на перевіреному механічному обчислювачі, тоді як інші прагнуть використати нові радіотехнології для керування та моніторингу ракети після запуску."
 sp_rocket_guidance_system_choice_reward_mechanical: "Механіка — це надійно."
 sp_rocket_guidance_system_choice_reward_radio: "За радіо майбутнє!"

 sp_rocket_turbo_pump_froth_reward: "Проблема спінювання в турбонасосі"
 sp_rocket_turbo_pump_froth_reward_desc: "Під час випробувань на великій висоті було виявлено проблему з турбонасосом. Схоже, мастило всередині помп починає пінитися під екстремальними навантаженнями, що знижує загальну ефективність і надійність поточної конструкції."
 sp_rocket_turbo_pump_froth_reward_accept: "Ми маємо з цим розібратися!"

 sp_rocket_relay_failure_reward: "Відмова реле"
 sp_rocket_relay_failure_reward_desc: "Під час підготовки до випробувального пуску виявлено несправне реле у внутрішніх системах керування ракетою. Інженери вважають, що перед продовженням реле слід замінити, проте зростає занепокоєння щодо політичних наслідків затримки."
 sp_rocket_relay_failure_reward_accept: "Замініть ці реле."
 sp_rocket_relay_failure_reward_reject: "Ми більше не можемо зволікати."

 sp_rocket_outercoating_reward: "Іржа на ракеті"
 sp_rocket_outercoating_reward_desc: "Виникли занепокоєння щодо зовнішньої обшивки ракети. Під час тривалого зберігання матеріали нерідко іржавіють та зазнають корозії. Якщо не знайти рішення, ракета може стати непридатною до використання."
 sp_rocket_outercoating_reward_accept: "Можливо, варто нанести захисне мастило?"

 sp_rocket_launch_site_choice_reward: "Проблеми зі стартовим майданчиком"
 sp_rocket_launch_site_choice_reward_desc: "Колосальні розміри нової ракети створюють обмеження на запланованому стартовому майданчику. Тому керівники проєкту просять виділити кошти на будівництво нового спеціалізованого комплексу в іншому місці."
 sp_rocket_launch_site_choice_reward_reject: "Знайдіть спосіб адаптувати наявний майданчик."
 sp_rocket_launch_site_choice_reward_accept: "Ми профінансуємо новий комплекс."

 SP_ROCKET_AND_SUBMARINE_SITE_REMINDER_PROJECT: "Щоб ефективно використовувати проєкт «$PROJECT|Y$», нам необхідно побудувати ракетний комплекс або мати підводні човни з можливістю завдання ракетного удару."
