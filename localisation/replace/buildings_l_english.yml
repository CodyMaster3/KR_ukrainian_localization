l_english:

 landmark_statue_of_liberty: "Статуя Свободи"
 landmark_statue_of_liberty_plural: "$landmark_statue_of_liberty$"
 landmark_statue_of_liberty_desc: "Колосальна Статуя Свободи гордо стоїть у гавані Нью-Йорка, головному пункті в’їзду до Сполучених Штатів для іммігрантів, які прагнуть почати нове життя. Згодом вона стала втіленням американського духу життя, свободи та прагнення щастя."

 landmark_big_ben: "Біґ-Бен"
 landmark_big_ben_plural: "$landmark_big_ben$"
 landmark_big_ben_desc: "Вестмінстерська годинникова вежа, більш відома як Біґ-Бен, є британською культурною іконою. Це один із найвидатніших символів Сполученого Королівства та парламентської демократії. Спочатку її було завершено в 1859 році в стилі неоготики, і є третьою за висотою вежею у Великій Британії."

 landmark_colosseum: "Колізей"
 landmark_colosseum_plural: "$landmark_colosseum$"
 landmark_colosseum_desc: "Колізей розташований у центрі Риму. Це найбільший стародавній амфітеатр, коли-небудь побудований, який використовувався римлянами та жителями міста після падіння римлян для розваг з моменту його завершення імператором Титом."

 landmark_cristo_redentor: "Христос-Спаситель"
 landmark_cristo_redentor_plural: "$landmark_cristo_redentor$"
 landmark_cristo_redentor_desc: "Христос-Спаситель височіє над Ріо-де-Жанейро, його будівництво було завершено в 1931 році. Це національний символ Бразилії та має велике значення серед католиків у регіоні."

 landmark_eiffel_tower: "Ейфелева вежа"
 landmark_eiffel_tower_plural: "$landmark_eiffel_tower$"
 landmark_eiffel_tower_desc: "Ейфелева вежа названа на честь свого творця Ґюстава Ейфеля, її будівництво було завершено в 1889 році. Будучи розташованою на Марсовому полі в Парижі, Залізна леді стала світовою культурною іконою Франції та є символом національної гордості."

 landmark_kremlin: "Кремль"
 landmark_kremlin_plural: "$landmark_kremlin$"
 landmark_kremlin_desc: "Московський Кремль — це укріплений комплекс. У межах комплексу розташований Великий Кремлівський палац, який служив царською резиденцією російського імператора. Кремль виходить на Москву-ріку на південь, собор Василя Блаженного та Червону площу до на сході та Олександрівський сад на заході. Нині він став символом влади держави та її контролю люди."

 landmark_berlin_reichstag: "Райхстаґ"
 landmark_berlin_reichstag_plural: "$landmark_berlin_reichstag$"
 landmark_berlin_reichstag_desc: "Пленарна площа будівлі Райхстаґу, також відомий як Райхстаґ, є історичною будівлею законодавчого уряду на Площі Республіки. До пожежі Райхстаґ 1933 року він використовувався федеральною радою Німеччини, але навіть незважаючи на це він є символічна будівля, яка має велике значення в серцях і умах людей."

 landmark_hofburg_palace: "Гофбурґ"
 landmark_hofburg_palace_plural: "$landmark_hofburg_palace$"
 landmark_hofburg_palace_desc: "Гофбурґ — колишній головний імператорський палац династії Габсбурґів, звернений до площі Гельденплац. Можливо, колись цей палац знову буде використаний правителями Австрії, будь то президент чи король."
### 1.16 COUNTENANCE ###
 landmark_sadabad_complex: "Палац Саадабад"
 landmark_sadabad_complex_desc: "Побудований династією Каджарів і розширений династією Пехлеві, Саадабадський комплекс на півночі Тегерана служить королівською резиденцією і центром влади. Його палаци й сади відображають мінливий політичний ландшафт Ірану, від консерватизму до модернізму." # (@!)
 landmark_taj_mahal: "Тадж-Магал"
 landmark_taj_mahal_desc: "Тадж-Магал є шедевром архітектури Імперії Великих Моголів. Його величні білі мармурові куполи та вишукані сади роблять його одним із найвідоміших символів Індії, свідченням імперської могутності та вічної спадщини." # (@!)
 landmark_hagia_sophia: "Агія-Софія"
 landmark_hagia_sophia_desc: "Стоячи на перехресті імперій, Агія-Софія була візантійським собором, османською мечеттю і символом постійно мінливих правителів Стамбула. Її масивний купол і величні зали відображають як її духовне значення, так і амбіції тих, хто вважав місто своїм." # (@!)

### 1.17 MUSKETEER ###
 landmark_nanjing_presidential_palace: "Президентський палац у Нанкіні"
 landmark_nanjing_presidential_palace_plural: "$landmark_nanjing_presidential_palace$"
 landmark_nanjing_presidential_palace_desc: "The Presidential Palace at Nanjing is an ancient, prestigious complex where, upon the fall of the Qing dynasty, the great Sun Yat-sen himself was inaugurated." # (!)
 landmark_forbidden_city: "Заборонене місто"
 landmark_forbidden_city_plural: "$landmark_forbidden_city$"
 landmark_forbidden_city_desc: "As ancient seat of Ming power, the Forbidden City is a symbol of China's long history of harmony and prosperity. Today, the treasures and artefacts contained within have been secreted away in fear of another Japanese invasion..." # (!)

 landmark_great_wall_section: "Великий китайський мур"
 landmark_great_wall_section_plural: "$landmark_great_wall_section$"
 landmark_great_wall_section_desc:0 "The Great Wall, built over hundreds of years and dozens of administrations, is a logistical masterpiece. Today, it could be said to represent the Chinese people's great courage and defiance in the face of adversity." # (!)

 landmark_tokyo_imperial_palace: "Імператорський палац"
 landmark_tokyo_imperial_palace_plural: "$landmark_tokyo_imperial_palace$"
 landmark_tokyo_imperial_palace_desc:0 "The Tokyo Imperial Palace is the main residence of the Emperor, and has been so since the Meiji Restoration and the ousting of the last Shogunate. It is a symbol of pride and reverence for the Japanese people, and inspires them to work hard." # (!)
 landmark_national_diet: "Будинок Парламенту Японії"
 landmark_national_diet_plural: "$landmark_national_diet$"
 landmark_national_diet_desc:0 "The Kokkai-gijidō is the building where both houses of the National Diet of Japan meet. Being completed in early 1936, it is constructed almost entirely of Japanese materials with only a few exceptions. Its predecessor was destroyed in 1925 when another fire ravaged the area. Though the diet building has fallen many times, this time it will surely stand for centuries!" # (!)
 landmark_hakko_ichiu: "Монумент Хакко Ічіу"
 landmark_hakko_ichiu_plural: "$landmark_hakko_ichiu$"
 landmark_hakko_ichiu_desc:0 "The Hakkō Ichiu tower has been constructed to commemorate the 2,600th anniversary of the founding of Japan, and as a monument to symbolize the Japanese destiny of unifying the Eight Corners of the World under one roof." # (!)